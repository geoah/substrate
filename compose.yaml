# A whole substrate on this machine: `docker compose up`.
#
# Every value below has a default that works, so nothing has to be set before
# the first run. Override any of them in the environment or a .env file.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-substrate}
    volumes:
      - substrate-db:/var/lib/postgresql/data
    # The substrate waits for this, so `up` never races the first migration.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-substrate}"]
      interval: 2s
      timeout: 3s
      retries: 30

  substrate:
    build: .
    restart: unless-stopped
    ports:
      # Bound to localhost by default; set BIND_ADDRESS=0.0.0.0 to expose.
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    # The function sandbox's connect gate answers every network body's
    # connect(2) from the substrate, with pidfd_getfd(2) and
    # process_vm_readv(2). Docker's default seccomp profile permits those two
    # only for a container carrying CAP_SYS_PTRACE in its bounding set, and
    # the profile is built from the container's CONFIGURED capabilities, not
    # from the process's effective set: without this line both calls return
    # EPERM, and a function that declares `network:` is REFUSED rather than
    # run with its destinations unfiltered (a provider install's `uv sync`
    # first). It is a bounded trade, not a free one: the capability unblocks
    # the profile's whole ptrace group for everything in the container. What
    # bounds it is that the container holds only the substrate and the
    # function children it spawns, all at uid 65532, and every child is
    # started under no_new_privs inside its own Landlock domain, so the group
    # reaches nothing the substrate could not already reach and cannot be used
    # to escalate. Drop the line and the boot log says what stops working.
    cap_add:
      - SYS_PTRACE
    volumes:
      # The data root: one directory per repository with its changelog
      # segments, sealed files and blob bytes. This volume is the backup unit
      # (docs/operations.md, "Backups"); the database indexes it and is rebuilt
      # from it. `docker compose down -v` deletes it with the database.
      - substrate-data:/var/lib/substrate
      # The credential key the entrypoint mints, kept apart from the data it
      # opens. `docker compose down -v` deletes it with the data.
      - substrate-keys:/keys
    # A baked-in default key would be publicly known, so it would seal
    # nothing, and no key at all refuses to boot. The first start mints 32
    # random bytes (base64, what `openssl rand -base64 32` prints) into the
    # volume instead; every start after reads them back. The mint SAYS SO,
    # because a mint on a store that already holds repositories is a
    # different event from a mint on an empty one: the server then refuses to
    # boot (it checks the key against the wrapped DEKs the store carries), and
    # that line is what tells the operator the keys volume, not the data, is
    # what they lost. 077 because this file opens every repository's secrets.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$${SUBSTRATE_CREDENTIAL_KEY:-}" ]; then
          if [ ! -s /keys/credential.key ]; then
            (umask 077; python3 -c 'import base64,os;print(base64.b64encode(os.urandom(32)).decode())' \
              > /keys/credential.key)
            echo "substrate: minted a new credential key into /keys/credential.key. Back it up. If this database is not new, stop and restore the original key instead."
          fi
          SUBSTRATE_CREDENTIAL_KEY="$$(cat /keys/credential.key)"
          export SUBSTRATE_CREDENTIAL_KEY
        fi
        exec /usr/local/bin/substrate
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-substrate}?sslmode=disable
      # THIS IS A LAPTOP. Two settings below make it one, and both are what to
      # change before anyone else can reach the port (see BIND_ADDRESS).
      #
      # No invite code: the register door reads none, so registering is a
      # repository name and a password. Set one and the door admits only a request
      # that presents it, which is how a box that has its user keeps
      # strangers out — there is no separate closed state.
      SUBSTRATE_INVITE_CODE: ${SUBSTRATE_INVITE_CODE:-}
      # No second factor: login and registration take the password alone, the
      # console and substratectl read that from discovery and stop asking for
      # a code, and the boot log says so. A seed is still minted and sealed, so
      # setting this to false later restores the factor. On a reachable
      # deployment a leaked password would then be the account.
      SUBSTRATE_INSECURE_DISABLE_TOTP: ${SUBSTRATE_INSECURE_DISABLE_TOTP:-true}
      # Where every repository's directory lives: the changelog segments, the
      # sealed store's files and the blob bytes. Required and absolute; the
      # substrate-data volume above is mounted here.
      SUBSTRATE_DATA_ROOT: /var/lib/substrate
      # Wraps each repository's data-encryption key, which seals every secret
      # (provider tokens, secret-typed properties, the login credential). A
      # host without a key refuses to boot. Unset, the entrypoint mints one
      # into the keys volume; set it here to pin your own, but only ever the
      # SAME key this store was written under: a different one is refused at
      # boot, because nothing here can be re-keyed. Back it up, apart from
      # the data volume. Key rotation is not built.
      SUBSTRATE_CREDENTIAL_KEY: ${SUBSTRATE_CREDENTIAL_KEY:-}
      # The one redirect URI every OAuth provider app registers. Unset, the
      # host OAuth facility refuses to start a flow, so no connector bundle
      # can connect an account.
      SUBSTRATE_OAUTH_CALLBACK_URL: ${SUBSTRATE_OAUTH_CALLBACK_URL:-}
      # Signs OAuth flow state. Unset mints a random key per boot, with a
      # warning: consent flows in flight break on every restart.
      SUBSTRATE_OAUTH_STATE_KEY: ${SUBSTRATE_OAUTH_STATE_KEY:-}
      # There is no LLM configuration here. Completions and embeddings are
      # bought through a repository's own `llm/provider` records, which carry
      # the wire, the endpoint, the key and (for embeddings) the model. A
      # repository that writes none has no agents and no semantic search, and
      # hybrid search returns its lexical arm.
      LOG_LEVEL: ${LOG_LEVEL:-info}

volumes:
  substrate-db:
  substrate-data:
  substrate-keys:
