# A whole substrate on this machine: `docker compose up`.
#
# Every value below has a default that works, so nothing has to be set before
# the first run. Override any of them in the environment or a .env file.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-substrate}
    volumes:
      - substrate-db:/var/lib/postgresql/data
    # The substrate waits for this, so `up` never races the first migration.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-substrate}"]
      interval: 2s
      timeout: 3s
      retries: 30

  substrate:
    build: .
    restart: unless-stopped
    ports:
      # Bound to localhost by default; set BIND_ADDRESS=0.0.0.0 to expose.
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-substrate}?sslmode=disable
      # The one door into a fresh substrate. Registering with this code creates
      # the user and their repository. The dash (not :-) is deliberate: unset
      # keeps the laptop default, but set-and-EMPTY passes through as empty,
      # which closes registration — the right state once the box has its user.
      # With :- an operator could never close the door from the environment,
      # because empty would fall back to the known default.
      SUBSTRATE_INVITE_CODE: ${SUBSTRATE_INVITE_CODE-let-me-in}
      # Seals stored provider tokens at rest AND the changelog signing seed:
      # signing is mandatory, so a real deployment sets this and removes the
      # insecure switch below. Any string works; losing it stops writes.
      SUBSTRATE_CREDENTIAL_KEY: ${SUBSTRATE_CREDENTIAL_KEY:-}
      # The out-of-the-box default runs UNSIGNED, loudly: entries carry
      # placeholder signatures and `repository verify` names the state. A
      # baked-in default key would be worse — publicly known, so it certifies
      # nothing, and key rotation is not built, so replacing it later stops
      # writes. Set the key above, drop this, and the next open activates
      # signing for every repository.
      SUBSTRATE_INSECURE_ALLOW_INVALID_SIGNATURES: ${SUBSTRATE_INSECURE_ALLOW_INVALID_SIGNATURES:-true}
      # The one redirect URI every OAuth provider app registers. Unset, the
      # host OAuth facility refuses to start a flow, so no connector bundle
      # can connect an account.
      SUBSTRATE_OAUTH_CALLBACK_URL: ${SUBSTRATE_OAUTH_CALLBACK_URL:-}
      # Signs OAuth flow state. Unset mints a random key per boot, with a
      # warning: consent flows in flight break on every restart.
      SUBSTRATE_OAUTH_STATE_KEY: ${SUBSTRATE_OAUTH_STATE_KEY:-}
      # The host's OpenAI-compatible gateway. This is the ONLY thing that backs
      # embeddings: unset, the embed queue never drains and hybrid search
      # degrades to lexical. It is deployment configuration, not a record,
      # because one embedding space has to outlive any provider row.
      SUBSTRATE_LLM_BASE_URL: ${SUBSTRATE_LLM_BASE_URL:-}
      SUBSTRATE_LLM_API_KEY: ${SUBSTRATE_LLM_API_KEY:-}
      # 1536 dimensions, to match the vector columns.
      SUBSTRATE_LLM_EMBED_MODEL: ${SUBSTRATE_LLM_EMBED_MODEL:-text-embedding-3-small}
      LOG_LEVEL: ${LOG_LEVEL:-info}

volumes:
  substrate-db:
