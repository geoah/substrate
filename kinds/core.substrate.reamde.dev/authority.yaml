# one authority whose kinds this repository holds, id = the authority's DNS name
kind: core.substrate.reamde.dev/kind
metadata:
  id: core.substrate.reamde.dev/authority
data:
  authority: core.substrate.reamde.dev
  description: >-
    One authority whose kinds this repository holds, named by its DNS-style
    label. The row says who may write under it and where its declarations
    came from, and carries the quarantine mark set when a stored closure no
    longer admits.
  names:
    singular: authority
    plural: authorities
  displayTemplate: "{localName}"
  # the authority-level keys a kind projection cannot carry: who may write
  # under the authority, and where its declarations came from.
  properties:
    version:
      type: int
      managed: true
      description: the closure's incremental version, maintained by the engine
    # The authority's actors are read off the actor documents it declares, so
    # the engine writes this list; nothing authors it on the header itself.
    actors:
      type: string
      repeated: true
      managed: true
      description: the actors declared under this authority
    source:
      type: enum
      values:
        - builtin
        - installed
      managed: true
      description: builtin for seeded authorities, installed for bundle ones
    # Issue 010 runtime state, owned by repository-open: set when a stored
    # closure no longer admits under the current binary — the authority
    # is left out of the live registry and the repository opens without it.
    # Re-applying a valid closure re-projects this row and clears both, and so
    # does the next open under a binary that admits the stored one again.
    # Never part of a declaration.
    #
    # It lives HERE and not on the bundle row because admission is
    # authority-scoped: a repository-local authority — a user's own kinds,
    # declared through the API with no bundle document — can fail admission
    # too, and has no bundle row to carry the mark.
    quarantined:
      type: bool
      managed: true
      description: set at repository-open when the authority's stored closure
        fails admission; cleared by re-applying a valid closure, or by an
        open that admits the stored one
    quarantineReason:
      type: string
      managed: true
      description: the admission error that quarantined the authority
    # No sourceYAML (record 61): declaration rows store parsed facts only.
