# One delivery binding: a source → one callable. The engine admits every
# write of this type (engine/triggers.go): `source` carries exactly one arm —
#
#   record:   {kinds: [<kind reference> | <authority>/* | *], ops: [create|update|
#             delete], when: <CEL guard over change/record/repository>,
#             coalesce: bool}
#   schedule: {recurrence: <RRULE>, timezone: <IANA name>, startsAt?: RFC3339}
#   webhook:  {}                       # an authenticated wake endpoint
#
# and `callable` is a `reference` naming the registered function or agent a
# matched delivery invokes: ONE path, `<kind>/<id>` — the kind
# core.substrate.reamde.dev/function or core.substrate.reamde.dev/agent, the id the callable that
# dispatch resolves. The trigger owns its cursor:
# a new trigger starts at head, replay is a cursor reset, park-and-advance
# and manual run are per-trigger verbs.
kind: core.substrate.reamde.dev/kind
metadata:
  id: core.substrate.reamde.dev/trigger
data:
  authority: core.substrate.reamde.dev
  description: >-
    One delivery binding: a source — matched records, a schedule, or a webhook
    — bound to the one function or agent it invokes. The trigger owns its
    cursor, so enabling, replay, parking and manual runs are all verbs on
    this row.
  # `source` is typed as of core's version 3 — the discriminator plus one object
  # field per arm, where it was a json blob. No version of its own: this kind
  # takes the authority's, and the authority bumped for the typed core.
  names:
    singular: trigger
    plural: triggers
  # A random-id row reads as the callable it delivers to.
  displayTemplate: "{callable}"
  properties:
    enabled:
      type: bool
      description: whether the dispatcher delivers for this trigger; false
        stops execution without losing the cursor
    # EXACTLY ONE ARM, and `kind` names which: the discriminator is admitted and
    # checked against the arm that is present (engine/triggers.go owns that
    # semantic gate, as it owns the RRULE and the CEL guard). Absent is legal —
    # the arm alone has always said it — so every trigger written before the
    # discriminator existed still reads.
    source:
      type: object
      description: the one source this trigger delivers from
      fields:
        kind:
          type: enum
          values:
            - record
            - schedule
            - webhook
          description: which arm below carries the source
        record:
          type: object
          description: matched records — the changelog is the source
          fields:
            kinds:
              type: string
              repeated: true
              description: the kinds watched, each a reference, `<authority>/*`
                or `*`
            # A CHANGE CLASS, not a write verb: what happened to the record,
            # whatever op the writer called. runner.OpOf folds the changelog
            # onto these three. A put whose payload says `created` is a create,
            # delete and gc are deletes, and every other op (patch, link,
            # unlink, merge, split, a restoring put) is an update. So a policy
            # selector matching the same write spells it `put` or `patch`;
            # docs/changelog.md#change-verbs holds the mapping.
            ops:
              type: enum
              repeated: true
              values:
                - create
                - update
                - delete
              description: 'which changes deliver, as change classes rather
                than write verbs: create, update or delete; absent is all
                three'
            when:
              type: string
              description: the CEL guard over change/record/repository
            coalesce:
              type: bool
              description: collapse a burst on one record into one delivery
        schedule:
          type: object
          description: a recurrence — the clock is the source
          fields:
            recurrence:
              type: recurrence
              description: the RFC 5545 RRULE the fires follow
            timezone:
              type: timezone
              description: the IANA zone the recurrence is read in
            startsAt:
              type: datetime
              description: the instant the recurrence counts from
        # THE CLOSED EMPTY OBJECT: an authenticated wake endpoint carries no
        # configuration, and an empty `fields:` says exactly that — declared, and
        # refusing every key. Written with nothing under it because the tree is
        # block style all the way down; `fields: {}` is the same declaration.
        webhook:
          type: object
          fields:
          description: an authenticated wake endpoint
    callable:
      type: reference
      kind: any
      required: true
      description: the function or agent a matched delivery invokes, as its
        `<kind>/<id>` path
