# one model connection: pure data over the host-native OpenAI-compatible
# transport. An agent references a row by id (`llm: cheap`); the loop reads
# baseURL/model/defaults off the row at dispatch, so re-tiering every agent
# on `cheap` is one patch here — v4's env-var lesson, inverted into data.
# Absent baseURL falls back to the host's LITELLM_BASE_URL; absent apiKey to
# its LITELLM_API_KEY. Exotic providers wrap as function tools, never as the
# model transport (ticket 005 ruling).
kind: core.substrate.reamde.dev/kind
metadata:
  id: core.substrate.reamde.dev/llm
data:
  authority: core.substrate.reamde.dev
  description: >-
    One model connection as pure data: endpoint, model id, request
    defaults and pricing. An agent names a row by id (`llm: cheap`), so
    re-tiering every agent that uses it is one patch here instead of a
    redeploy.
  names:
    singular: llm
    plural: llms
  displayTemplate: "{name} ({model})"
  properties:
    name:
      type: string
      description: a human label for the row (the id is the reference)
    provider:
      type: string
      description: which gateway or vendor the row speaks to, informational
    baseURL:
      type: url
      description: the OpenAI-compatible endpoint; empty uses the host's configured
        gateway
    model:
      type: string
      description: the model id sent on every completion
    defaults:
      type: json
      description: "request defaults, e.g. {temperature: 0}"
    # data-driven cost estimation: USD per 1M tokens; absent means the
    # thread's costUSD stays 0 and only the token tally is authoritative.
    pricing:
      type: object
      description: approximate USD per 1M tokens, for the thread cost tally
      fields:
        inputPer1M: float
        outputPer1M: float
    apiKey:
      type: secret
      description: bearer for the endpoint; empty uses the host's gateway
        key
