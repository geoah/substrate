# one declared kind, so the vocabulary is browsable through the same API as data
kind: core.substrate.reamde.dev/kind
metadata:
  id: core.substrate.reamde.dev/kind
data:
  authority: core.substrate.reamde.dev
  description: >-
    One declared kind — what a record is, `{authority}/{name}`. The vocabulary
    browses through the same API as data, so every kind this repository holds
    is a row here, and its `definition` is what the engine validates every
    write against.
  names:
    singular: kind
    plural: kinds
  # the declarations this repository holds; id is the kind REFERENCE
  # ("calendar.substrate.reamde.dev/calendarevent", or a bare "task" for a
  # repository-local kind) — the one id form that carries a slash.
  displayTemplate: "{name}"
  properties:
    name:
      type: string
      description: the kind's singular name
    authority:
      type: string
      description: who publishes it; absent on a repository-local kind
    version:
      type: string
      description: this declaration's version
    plural:
      type: string
      description: the collection segment
    source:
      type: enum
      values:
        - builtin
        - installed
      description: builtin for seeded kinds, installed for bundle ones
    definition:
      type: json
      description: the parsed data map, exactly as authored — descriptions
        included
    # No sourceYAML (record 61): the parsed definition is the document, and
    # the source view re-renders it. Comments live in the authored files.
    #
    # NO `description` PROPERTY EITHER, for the same reason plus a harder one.
    # A kind's own description is prose the definition already carries, and the
    # projected columns are the ROUTING facts a reader needs without parsing it.
    # The harder reason: this kind describes every projected declaration row,
    # so a property added HERE is one every row would carry the moment the
    # binary ships it — and an existing repository, whose stored declaration is
    # still the old one, refuses those rows and cannot open. A property on this
    # kind can only ever arrive with a projection that bootstraps it.
