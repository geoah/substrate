# one declared kind, so the vocabulary is browsable through the same API as data
kind: core.substrate.reamde.dev/kind
metadata:
  id: core.substrate.reamde.dev/kind
data:
  authority: core.substrate.reamde.dev
  description: >-
    One declared kind — what a record is, `{authority}/{name}`. The vocabulary
    browses through the same API as data, so every kind this repository holds
    is a row here, and these properties are what the engine validates every
    write against.
  # version 11: the first version this kind pins itself, above the 10 it took
  # from the authority. `edges.<rel>` gained `deprecated` and the reserved
  # `properties` block (issue 110): additive, so every stored declaration keeps
  # its shape and the upgrade is what carries the room for the new keys.
  # version 12: `authority` drops `required`, which contradicted "absent on a
  # repository-local kind"; an index requires the `properties` it covers and an
  # edge requires its `to` target, both refused empty by the loader.
  # version 13: `names.plural` retired — the collection segment is the kind name
  # now (issue 253, decision 0033), so `names` declares only `singular`.
  version: 13
  names:
    singular: kind
  # the declarations this repository holds; id is the kind REFERENCE
  # ("calendar.substrate.reamde.dev/calendarevent", or a bare "task" for a
  # repository-local kind) — the one id form that carries a slash.
  displayTemplate: "{localName}"
  # THE PROPERTIES ARE THE DECLARATION. A kind declaration's row holds the
  # manifest's own keys — names, properties, edges, traits, indices — and there
  # is no `definition` blob beside them.
  #
  # A new property here is an ordinary versioned change: every row that carries
  # it is a row a projection writes, and each such row is validated against the
  # declaration the projection is installing (engine/vocabularywrite.go
  # projectionKind), so a repository still holding the older declaration takes
  # the rows and the boot upgrade lands.
  properties:
    version:
      type: int
      managed: true
      description: this declaration's incremental version, maintained by the
        engine
    source:
      type: enum
      values:
        - builtin
        - installed
      managed: true
      description: builtin for seeded kinds, installed for bundle ones
    # NOT a reference, and the reason is identity: an authority is what this
    # declaration IS part of, not a record it points at. Pinning it made the
    # stored row spell it as a path while the manifest spelled the name, so one
    # declaration had two Definitions — the authored one and the one that came
    # back after a restart.
    authority:
      type: string
      description: who publishes it; absent on a repository-local kind
    names:
      type: object
      description: what one record is called; the name is also the collection
        segment
      fields:
        singular:
          type: string
          required: true
          description: the kind's singular name, its identity's last segment
    description:
      type: string
      description: what this kind is for, read above its collection
    displayTemplate:
      type: string
      description: how a record of this kind renders its title
    # The micro-syntax stays a string: `temporal(point: dueAt)` names a trait,
    # a variant and the hot column it occupies in one word an author writes.
    traits:
      type: string
      repeated: true
      description: the traits this kind binds
    indices:
      type: object
      repeated: true
      description: the composite indexes this kind asks for
      fields:
        properties:
          type: string
          repeated: true
          required: true
          description: the properties the index covers, in order
    # A MAP in the authored form: the key is the rel, and the value follows
    # these fields.
    edges:
      type: object
      keyed: true
      keyPattern: camel
      description: the named, directed links a record of this kind may hold
      fields:
        # NOT a reference: `any` is an admissible value here, and a pin that
        # admits a non-path is not a pin.
        to:
          type: string
          required: true
          description: the target kind, or `any`
        many:
          type: bool
          description: several targets instead of one
        required:
          type: bool
          description: a creation without it is refused
        ownerRef:
          type: bool
          description: the target owns this record, so a cascade collects
            it
        description:
          type: string
          description: what the link means
        inverse:
          type: string
          description: what the target calls this edge
        inverseDescription:
          type: string
          description: what the inverse means, from the target's side
        deprecated:
          type: bool
          description: clients should stop offering this link
        # What an edge ROW of this rel may carry, and the whole set it may
        # carry: an edge write naming a property this block does not declare
        # is refused (issue 111). Reserved by issue 110 one change earlier, so
        # the key was already one every binary reads before it meant anything.
        #
        # An edge property is a FLAT SINGLE VALUE, which is what makes the
        # block declarable at all: a record's own `properties` is the one json
        # leaf below, because a property declaration contains property
        # declarations and no bounded schema states that. Take away the
        # containers and the object, and what is left is exactly these fields.
        properties:
          type: object
          keyed: true
          keyPattern: camel
          description: the values an edge row of this rel may carry
          fields:
            type:
              type: string
              required: true
              description: the datatype, or an authority-local refinement
                of one
            description:
              type: string
              description: what the value means
            displayName:
              type: string
              description: the human label a client renders instead of the
                name
            required:
              type: bool
              description: an edge written without it is refused
            deprecated:
              type: bool
              description: clients should stop offering this value
            pattern:
              type: string
              description: the regular expression a value matches
            min:
              type: float
              description: the lowest admitted number
            max:
              type: float
              description: the highest admitted number
            values:
              type: object
              repeated: true
              description: the admitted values, in render order
              fields:
                value:
                  type: string
                  required: true
                  description: the stored value
                label:
                  type: string
                  description: the human label a client renders beside it
                deprecated:
                  type: bool
                  description: clients should stop offering this value
    # THE ONE json LEAF IN THE META-KIND, and the reason is a self-reference no
    # bounded schema escapes. A property declaration describes OBJECT FIELDS, and
    # a field declaration is a property declaration again — so describing
    # `properties` needs a `fields` level, which puts a `fields` level into THIS
    # declaration's own row, which needs one more level to describe, and so on
    # without end. The dialect terminates by construction (vocabulary/types.go,
    # MaxFieldDepth) and therefore cannot state its own grammar.
    #
    # What validates it is the LOADER, which is stronger here than any structural
    # schema: every write of a kind declaration is parsed by it — datatypes, the
    # key set each datatype admits, the camel rule, enum values, machine states
    # and transitions, the depth cap — and a document it refuses never reaches a
    # row. Same posture `recordpatchrequest.diff` keeps, for the same kind of
    # reason: the validator that knows the shape is not a schema.
    #
    # Everything else on this kind IS typed — the names, the display template,
    # the traits, the indices, the edges — none of which recurse.
    properties:
      type: json
      description: the declared value slots a record of this kind carries,
        as the loader admits them
