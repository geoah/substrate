# one declared agent: a callable whose body is an LLM loop, id =
# "<authority>/<name>". The declaration IS the record (schema is records): the
# row is the prompt store, the changelog is its version history, and the
# dispatcher reads the registry this row rebuilds into. Agents dispatch like
# functions — trigger deliveries, the call API, sub-agent calls — under the
# actor `function:<name>`.
#
# THE PROPERTIES ARE THE DECLARATION. There is no `definition` blob and no
# projected mirror beside it: the row holds the manifest's own keys, one
# property per key, and what an author writes is what gets stored. The loader
# rebuilds the registry from exactly these.
kind: core.substrate.reamde.dev/kind
metadata:
  id: core.substrate.reamde.dev/agent
data:
  authority: core.substrate.reamde.dev
  description: >-
    One declared agent: a callable whose body is an LLM loop, dispatched like
    a function by a trigger, the call API or another agent. The row IS the
    prompt store, so changing what an agent does is a record write and the
    changelog is its version history.
  # v1alpha2: the display template dropped the authority. A declaration's
  # identity is `<authority>/<name>` and the dotted composite it used to render
  # names nothing — the bump is what carries the new template into repositories
  # that already stored the old one.
  # v1alpha3: the declaration gained a `description` — the bump is what
  # carries it into repositories that already stored the v1alpha2 one.
  # v1alpha4: the `llm` reference split into `provider` + `model` — an agent
  # names WHERE it buys completions and WHAT model it wants, separately.
  # v1alpha5: the declaration gained `subagentOnly`, the chat-surface
  # withholding (an llm-as-judge exists to be called by other agents); the
  # bump carries the column into repositories that stored the v1alpha4 shape.
  # v1alpha6: TYPED. `definition` and the `functions`/`subagents` mirrors are
  # gone; the manifest's own keys (params, tools, budgets and the grants) are
  # properties, and `name` left with them (a declaration's local name is its
  # id's last segment, which is what `{localName}` renders).
  # v1alpha7: the `builtin` field left `tools`. The four built-ins are function
  # records now (`runtime: host`), so an entry names one under `callable:` like
  # any other function and the union has ONE arm. Dropping a field is a
  # narrowing, and this one is safe because dialect 2 has never shipped in a
  # release: no store outside our own development instances holds a row with the
  # field, and the dialect rung rewrites the ones that do.
  # v1alpha8: `emit` and `reads` became one `permissions` object, and `emit` is
  # `writes` inside it: the same grouping a function's five grants took, and
  # safe for the same reason v1alpha7 was.
  version: v1alpha8
  names:
    singular: agent
    plural: agents
  displayTemplate: "{localName}"
  properties:
    # Every declaration carries its own version: the declaring authority's,
    # unless the declaration overrides it. It is what the boot-time upgrade
    # diffs a repository's shipped vocabulary against, so it is written on
    # every declaration row — by the engine, which is what `managed` says.
    version:
      type: string
      managed: true
      description: this declaration's version
    authority:
      type: string
      required: true
      description: the authority that declares it
    description:
      type: string
      required: true
      description: the model-facing tool card — what this agent is for as
        a sub-agent
    # NEVER FTS-indexed: a system prompt is a page of prose, and indexing it
    # would make every agent the top hit for any word it happens to use.
    prompt:
      type: text
      fts: false
      required: true
      description: the system prompt; the row is the prompt store
    # The llmprovider data-record id (`default` or a custom row); the loop reads
    # wire/baseURL/apiKey off that row at dispatch. A record id, not a
    # reference: an llmprovider row is runtime state and resolves at dispatch.
    provider:
      type: string
      refersTo: provider
      required: true
      description: the llmprovider record id this agent's loop completes against
    model:
      type: string
      required: true
      description: the model id sent on every completion
    params:
      type: object
      description: this agent's request knobs; the provider row's defaults
        sit under them
      fields:
        temperature:
          type: float
          description: the sampling temperature, when the model accepts one
        maxTokens:
          type: int
          min: 1
          description: the completion cap sent on every request
    # `callable` names the tool, and it is the ONE arm: the four built-ins are
    # `runtime: host` function records core ships, so
    # `{callable: core.substrate.reamde.dev/graphql}` names one exactly as a
    # bundle's function is named. `name` and `description` alias the card for
    # this agent's prompt context, built-ins included.
    tools:
      type: object
      repeated: true
      description: what the model may call, in declaration order
      fields:
        callable:
          type: string
          refersTo: function
          required: true
          description: the function identity this entry names
        name:
          type: string
          description: the model-facing tool name, aliasing a callable
        description:
          type: string
          description: the model-facing card, overriding the callable's own
    agents:
      type: string
      repeated: true
      refersTo: agent
      description: the sub-agent identities the loop exposes as tools
    budgets:
      type: object
      description: what bounds one invocation
      fields:
        maxTurns:
          type: int
          min: 1
          max: 64
          description: completions the loop may spend
        maxToolCalls:
          type: int
          min: 1
          max: 256
          description: tool calls the loop may spend
        deadlineSeconds:
          type: int
          min: 1
          max: 600
          description: wall clock for the whole invocation
        depth:
          type: int
          min: 1
          max: 3
          description: how deep the sub-agent chain below may go
    # THE GRANT, in one object, spelled the way a function's is: an agent has
    # no body of its own to spend, so it carries two of the five, what it may
    # read and what it may write.
    permissions:
      type: object
      description: what this agent is allowed to do while it runs; leave a
        grant out and what it covers is refused
      fields:
        reads:
          type: object
          description: which record kinds this agent may read, and how much;
            leave it out and the query tool is withheld
          fields:
            kinds:
              type: string
              repeated: true
              refersTo: kind
              description: the record kinds every read is held to
            budgets:
              type: object
              description: how much one run may read
              fields:
                calls:
                  type: int
                  min: 1
                  max: 1000
                  description: how many reads one run may make
                rows:
                  type: int
                  min: 1
                  max: 10000
                  description: how many records one run may read
        writes:
          type: string
          repeated: true
          refersTo: kind
          description: which record kinds it may create or change, the change
            requests it proposes among them
    # Withholds the agent from the interactive chat surface only: the console
    # keeps it off the chat list and the chat API refuses it, while sub-agent
    # calls, the call API and triggers still dispatch it. Any agent, marked or
    # not, remains selectable as another agent's sub-agent.
    subagentOnly:
      type: bool
      description: only callable by other agents; withheld from the chat surface
