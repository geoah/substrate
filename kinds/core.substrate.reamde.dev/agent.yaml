# one declared agent: a callable whose body is an LLM loop, id =
# "<authority>/<name>". The declaration IS the record (schema is records): the
# row is the prompt store, the changelog is its version history, and the
# dispatcher reads the registry this row rebuilds into. Agents dispatch like
# functions — trigger deliveries, the call API, sub-agent calls — under the
# actor `function:<name>`.
#
# The row surfaces the agent's shape as first-class fields — prompt, the
# provider + model, the function tools and the sub-agents — so an ordinary
# create-from-type form can compose one. `definition` remains the authoritative
# manifest store (the loader rebuilds the registry from it, record 61): it
# carries the full envelope the first-class columns summarize — the built-in
# tools (query/propose), tool aliases, budgets, emit and reads — and a create
# must set it. The first-class columns are the projection's faithful mirror,
# not a second source of truth. The built-in tool set is query/propose/
# graphql/mutate; like the aliases and budgets, a grant lives in `definition`.
kind: core.substrate.reamde.dev/kind
metadata:
  id: core.substrate.reamde.dev/agent
data:
  authority: core.substrate.reamde.dev
  description: >-
    One declared agent: a callable whose body is an LLM loop, dispatched
    like a function by a trigger, the call API or another agent. The row
    IS the prompt store, so changing what an agent does is a record write
    and the changelog is its version history.
  # v1alpha2: the display template dropped the authority. A declaration's
  # identity is `<authority>/<name>` and the dotted composite it used to render
  # names nothing — the bump is what carries the new template into repositories
  # that already stored the old one.
  # v1alpha3: the declaration gained a `description` — the bump is what
  # carries it into repositories that already stored the v1alpha2 one.
  # v1alpha4: the `llm` reference split into `provider` + `model` — an agent
  # names WHERE it buys completions and WHAT model it wants, separately.
  # v1alpha5: the declaration gained `subagentOnly`, the chat-surface
  # withholding (an llm-as-judge exists to be called by other agents); the
  # bump carries the column into repositories that stored the v1alpha4 shape.
  version: v1alpha5
  names:
    singular: agent
    plural: agents
  displayTemplate: "{name}"
  properties:
    # Every declaration carries its own version: the
    # declaring authority's, unless the declaration overrides it. It is what the
    # boot-time upgrade diffs a repository's shipped vocabulary against, so
    # it is written on every projected declaration row.
    version:
      type: string
      description: this declaration's version
    name:
      type: string
      description: the agent's local name
    authority:
      type: string
      description: the authority that declares it
    description:
      type: string
      description: the model-facing tool card — what this agent is for as
        a sub-agent
    prompt:
      type: text
      description: the system prompt; the row is the prompt store
    # The llmprovider data-record id (`default` or a custom row); the loop reads
    # wire/baseURL/apiKey off that row at dispatch
    # (core.substrate.reamde.dev/llmprovider). The model is the agent's own
    # word, sent verbatim on every completion.
    provider:
      type: string
      description: the llmprovider record id this agent's loop completes against
    model:
      type: string
      description: the model id sent on every completion
    # The callable function identities the agent may call, in declaration order
    # (a ref-typed list — each value is a core.substrate.reamde.dev/function record id).
    functions:
      type: string
      repeated: true
      description: the function records this agent may call as tools
    # The sub-agent identities the loop exposes as tools (each an
    # core.substrate.reamde.dev/agent record id); the depth cap bounds the chain below.
    subagents:
      type: string
      repeated: true
      description: the sub-agent records this agent may delegate to
    # Withholds the agent from the interactive chat surface only: the console
    # keeps it off the chat list and the chat API refuses it, while sub-agent
    # calls, the call API and triggers still dispatch it. Any agent, marked or
    # not, remains selectable as another agent's sub-agent.
    subagentOnly:
      type: bool
      description: only callable by other agents; withheld from the chat surface
    # The authoritative manifest data — prompt/provider/model/params/tools/
    # agents/budgets/emit/reads, exactly as authored. The loader rebuilds the agent from this; the
    # first-class columns above are its projected summary.
    definition:
      type: json
      description: the parsed manifest data the registry rebuilds from
