# one bearer credential — a RECORD, holding the hash and never the secret
kind: core.substrate.reamde.dev/kind
metadata:
  id: core.substrate.reamde.dev/token
data:
  authority: core.substrate.reamde.dev
  description: >-
    One bearer credential: a label, the SHA-256 of a secret shown once at
    mint, and an optional expiry. A token has full access to its
    repository — sessions are these records, login mints one, and revoking
    one is an ordinary record delete.
  # v1alpha2 dropped `lastUsedAt`: authentication stamped it, so every token in
  # use wrote a changelog entry a minute and buried the user's own history
  # under the substrate's access log. Authentication is a READ now.
  # v1alpha3: the declaration gained a `description` — the bump is what
  # carries it into repositories that already stored the v1alpha2 one.
  version: v1alpha3
  names:
    singular: token
    plural: tokens
  # A token has FULL ACCESS to its repository: no scopes, no actor set, no
  # roles. What it carries is what it is — a label, the SHA-256
  # of a high-entropy secret shown once at mint, and an optional expiry.
  # Sessions ARE these records: login mints one.
  #
  # Minting is the auth endpoints' (attributed to the substrate) and the
  # generic surface refuses writes to this kind — but REVOKING is an ordinary
  # record delete, so the tokens page, substratectl and the DELETE endpoint are all
  # the same write.
  displayTemplate: "{label}"
  properties:
    label:
      type: string
      description: what the token is for, chosen at mint
    hash:
      type: secret
      description: the SHA-256 of the secret; the secret itself is shown once,
        at mint
    expiresAt:
      type: datetime
      description: when the token stops authenticating; absent = until deleted
