# one turn of a thread: the transcript and the tool-call audit as ordinary
# rows, written by the loop as it runs. `role` follows the chat wire —
# system prompts are on the agent row and are not persisted per thread; a
# `user` row is the envelope (triggered runs) or the human's message (chat);
# an `assistant` row carries prose and/or its tool calls; a `tool` row is one
# dispatched call's result, keyed back by toolCallId.
kind: core.substrate.reamde.dev/kind
metadata:
  id: core.substrate.reamde.dev/llmmessage
data:
  authority: core.substrate.reamde.dev
  names:
    singular: llmmessage
    plural: llmmessages
  displayTemplate: "{role} #{turn}"
  properties:
    role:
      type: string
      description: user, assistant or tool
    content:
      type: text
      description: the turn's text; a tool row's result payload
    turn:
      type: int
      description: the loop iteration this row belongs to, for ordering
    toolCalls:
      type: json
      description: an assistant turn's dispatched calls, [{id, name, arguments}]
    toolCallId:
      type: string
      description: the assistant tool call a tool row answers
    tool:
      type: string
      description: the tool name a tool row answers for
  edges:
    thread:
      to: core.substrate.reamde.dev/llmthread
      required: true
      description: the thread this turn belongs to
