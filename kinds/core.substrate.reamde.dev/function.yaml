# one declared function: a reaction to the substrate's own changes,
# id = "<authority>/<name>". The declaration IS the record (schema is records):
# the loader admits a write, commit activates it, and the dispatcher reads
# the registry this row rebuilds into.
#
# THE PROPERTIES ARE THE DECLARATION: no `definition` blob, one property per
# manifest key. The grant is one `permissions` object, declared once and named
# for what it is, and the IO is FLAT: named arguments, not a recursive schema,
# so the model-facing tool card is valid by construction.
kind: core.substrate.reamde.dev/kind
metadata:
  id: core.substrate.reamde.dev/function
data:
  authority: core.substrate.reamde.dev
  description: >-
    One declared function: a callable reaction to the substrate's own changes,
    invoked by a trigger or called directly. The declaration IS the record
    — a write admits it, the commit activates it, and the dispatcher reads
    the registry this row rebuilds into.
  # v1alpha2: the display template dropped the authority. A declaration's
  # identity is `<authority>/<name>` and the dotted composite it used to render
  # names nothing — the bump is what carries the new template into repositories
  # that already stored the old one.
  # v1alpha3: the declaration gained a `description` — the bump is what
  # carries it into repositories that already stored the v1alpha2 one.
  # v1alpha4: TYPED. `definition` and `name` are gone; the runtime, the body,
  # the flat argument lists and the five capability keys are properties.
  # v1alpha5: `runtime: host` joined the enum and `source` stopped being
  # required — a host function's body IS the engine, so its declaration is a
  # card and nothing else. The bump is what admits the four host function rows
  # core now ships into a repository that stored the v1alpha4 enum.
  # v1alpha6: the five grant keys became one `permissions` object, and `emit`
  # is `writes` inside it. Dropping five properties is a narrowing, and this
  # one is safe because dialect 2 has never shipped in a release: no store
  # outside our own development instances holds a row with them, and the
  # dialect rung rewrites the ones that do.
  version: v1alpha6
  names:
    singular: function
    plural: functions
  displayTemplate: "{localName}"
  properties:
    # Every declaration carries its own version: the declaring authority's,
    # unless the declaration overrides it. It is what the boot-time upgrade
    # diffs a repository's shipped vocabulary against, so the engine writes it
    # on every declaration row, which is what `managed` says.
    version:
      type: string
      managed: true
      description: this declaration's version
    authority:
      type: string
      required: true
      description: the authority that declares it
    description:
      type: string
      required: true
      description: the model-facing tool card — what this function does
    # `host` is the runtime with NO body: the engine is the implementation, and
    # only a SHIPPED declaration may name it (the loader refuses one from any
    # installed authority, since nothing can hand the engine a body). The four
    # host functions core ships are the agent built-ins — query, propose,
    # graphql, mutate — and their declarations are their whole cards.
    runtime:
      type: enum
      values:
        - python
        - go
        - host
      required: true
      description: the language the inline body is written in, or host for
        a built-in
    # NEVER FTS-indexed: a body is up to 256 KiB of code, and indexing it would
    # make every function the top hit for every identifier it mentions. The
    # property name is the BODY's, so a function row carries no `source` origin
    # marker — that word belongs to the kinds whose origin is a fact about the
    # declaration rather than its content.
    #
    # Not `required:` — the requirement follows the RUNTIME, which one property's
    # marker cannot say: an inline runtime must carry a body and the loader
    # refuses one without it, while `host` must not, and the loader refuses one
    # that tries.
    source:
      type: text
      fts: false
      description: the inline body, on an inline runtime
    timeoutMs:
      type: int
      min: 1
      max: 60000
      description: what bounds one invocation's wall clock
    # The FLAT argument dialect: one level of named arguments, which is what
    # makes a card valid JSON Schema by construction and keeps the value check
    # off a recursion. `json` is the named escape hatch for a value whose shape
    # the function does not own.
    arguments:
      type: object
      repeated: true
      description: the named arguments a call carries, in declaration order
      fields:
        name:
          type: string
          required: true
          description: the argument's name
        type:
          type: enum
          values:
            - string
            - int
            - float
            - bool
            - enum
            - json
          description: what the value is
        repeated:
          type: bool
          description: a list of the declared type
        required:
          type: bool
          description: a call without it is refused
        description:
          type: string
          description: what the argument is for, as the model reads it
        values:
          type: string
          repeated: true
          description: the admitted values, on an enum
    returns:
      type: object
      repeated: true
      description: the named values the body returns
      fields:
        name:
          type: string
          required: true
          description: the value's name
        type:
          type: enum
          values:
            - string
            - int
            - float
            - bool
            - enum
            - json
          description: what the value is
        repeated:
          type: bool
          description: a list of the declared type
        required:
          type: bool
          description: the body always returns it
        description:
          type: string
          description: what the value carries, as the model reads it
        values:
          type: string
          repeated: true
          description: the admitted values, on an enum
    # THE GRANT, in one object. Five bare keys beside `returns:` said nothing
    # about being permissions, and `emit` beside `returns` read as the output
    # shape rather than the permission to write, so they group here, and the
    # permission to write is named for writing.
    permissions:
      type: object
      description: what this function is allowed to do while it runs; leave
        a grant out and what it covers is refused
      fields:
        reads:
          type: object
          description: which record kinds this function may read while it
            runs, and how much; leave it out and any read it attempts fails
          fields:
            kinds:
              type: string
              repeated: true
              refersTo: kind
              description: the record kinds every read is held to
            budgets:
              type: object
              description: how much one run may read
              fields:
                calls:
                  type: int
                  min: 1
                  max: 1000
                  description: how many reads one run may make
                rows:
                  type: int
                  min: 1
                  max: 10000
                  description: how many records one run may read
        writes:
          type: string
          repeated: true
          refersTo: kind
          description: which record kinds it may create or change
        call:
          type: string
          repeated: true
          refersTo: function
          description: which other functions its code may invoke
        # Host patterns, never references: an egress allowlist names the
        # internet.
        network:
          type: string
          repeated: true
          description: the hosts it may reach; any entry grants network access,
            and enforcement is all-or-nothing today
        mutations:
          type: enum
          repeated: true
          values:
            - merge
            - split
          description: "the identity-changing operations it may perform: merge,
            split"
