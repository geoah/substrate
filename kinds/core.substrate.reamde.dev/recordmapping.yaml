# one declared mapping: how a source record's properties reach the subject
# its edge points at (§6.1, record 50)
kind: core.substrate.reamde.dev/kind
metadata:
  id: core.substrate.reamde.dev/recordmapping
data:
  authority: core.substrate.reamde.dev
  description: >-
    One declared mapping: how a source record's properties reach the subject
    its edge points at, so a Google contact keeps a person up to date. One
    mapping per source kind, declared by the authority that owns that kind.
  # v1alpha2: the display template dropped the authority. A declaration's
  # identity is `<authority>/<name>` and the dotted composite it used to render
  # names nothing — the bump is what carries the new template into repositories
  # that already stored the old one.
  # v1alpha3: the declaration gained a `description` — the bump is what
  # carries it into repositories that already stored the v1alpha2 one.
  # v1alpha4: TYPED. `definition` and `name` are gone; the match probes and the
  # map rules are properties, and a rule is always `{path}` — the bare path
  # string went with the blob.
  version: v1alpha4
  names:
    singular: recordmapping
    plural: recordmappings
  # id = "<authority>/<name>". A mapping is authority-local like a property type: its
  # `from` type lives in the authority that declares it, exactly one mapping per
  # source type; `to` is always a full type name.
  displayTemplate: "{localName}"
  properties:
    version:
      type: string
      managed: true
      description: this declaration's version
    source:
      type: enum
      values:
        - builtin
        - installed
      managed: true
      description: builtin for seeded mappings, installed for bundle ones
    authority:
      type: string
      required: true
      description: the authority that declares it, the source type's own
    description:
      type: string
      description: what the mapping keeps up to date
    from:
      type: string
      refersTo: kind
      required: true
      description: the source kind whose records project
    to:
      type: string
      refersTo: kind
      required: true
      description: the subject kind, always a full kind reference
    # the declared edge on `from` that records the link — ordinary in its own
    # declaration; the mapping, not a flag, is what the engine recognizes.
    edge:
      type: string
      required: true
      description: the declared edge on the source kind that records the link
    # An ORDERED list: which probe decides is the order it is written in.
    match:
      type: object
      repeated: true
      description: the probes that find an existing subject, in order
      fields:
        from:
          type: string
          required: true
          description: the source path the probe reads
        to:
          type: string
          required: true
          description: the subject property the probe matches on
    # A MAP: the key is the subject property written, the value the rule.
    map:
      type: object
      keyed: true
      keyPattern: camel
      description: which source path reaches which subject property
      fields:
        path:
          type: string
          required: true
          description: the source path the value is read from
        merge:
          type: enum
          values:
            - atomic
            - union
          description: whether a value replaces or joins what other sources
            offer
