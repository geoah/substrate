# the owner's rules for the space between an agent wanting a write and the
# write landing (docs/plans/thread-interactions.md). A policy speaks for the
# writes its selector matches, strictly INSIDE the emit ceiling: allow lands
# them, refuse bounces them, gate converts them into recordpatchrequests the
# owner (or, within thresholds, the policy's judge) decides. When several
# policies match one write, the most restrictive action wins — refuse over
# gate over allow, the composition every harness trains people on — and no
# match means today's behavior, the write landing. Two matching rules carrying
# the SAME action are separated by which one can land the write without the
# owner: a rule with no judge to auto-accept on governs one that has, so the
# judge that runs is never picked by alphabet (policy.go governs).
#
# Policies never run for owner or machine writes: a human's hand and the
# substrate's own machinery are not what they bound. Bundle-tier actors cannot
# write this kind at all: a policy an agent could edit is a gate that agent
# could open.
#
# The judge half (judge/criteria/context/autoAccept/autoRefuse/mode) is
# DECLARED here so the kind does not churn, and lands in the plan's phase 4:
# until then a policy's judge is inert data. ALPHA at v1, like the agent
# vocabulary (core.yaml's marker, ruling A12): nothing runs these properties
# yet, so they may change or leave without a v1 break. The selector/action
# half is the stable contract.
kind: core.substrate.reamde.dev/kind
metadata:
  id: core.substrate.reamde.dev/recordpatchpolicy
data:
  authority: core.substrate.reamde.dev
  description: >-
    One rule for agent writes: which kinds, ops and agents it speaks for,
    and whether their writes land, gate into recordpatchrequests, or refuse.
    The most restrictive matching policy wins; no match means the write lands.
  # Its first own pin, above the authority's 11 it took until now.
  # version 12: `selector.kinds` takes the trigger source's glob grammar
  # (`<authority>/*` and `*`), `action` is required by the write door, and the
  # two judge thresholds say which verdict each one reads.
  version: 13
  names:
    singular: recordpatchpolicy
  displayTemplate: "{action}: {localName}"
  properties:
    # Which writes this policy speaks for. Empty lists match everything of
    # their dimension, so `{}` with action gate is "gate every agent write
    # policy evaluation sees", which is the three record verbs below and
    # nothing else. A mutate tool's `link` and `unlink` (agentgql.go) and a
    # function effect's `merge` and `split` (agentloop.go dispatchFunction,
    # whose op switch continues past them) never reach policyVerdict, so an
    # empty selector does not cover any of the four.
    selector:
      type: object
      description: the writes this policy speaks for; empty lists match all
      fields:
        # THE TRIGGER SOURCE'S GRAMMAR, matched by the trigger source's
        # matcher (vocabulary.MatchTypeGlob): a kind reference, every kind one
        # authority publishes (`tasks.substrate.reamde.dev/*`), or every kind
        # (`*`). A bare local name resolves to the kind's identity at load, the
        # same resolve-at-the-gate a trigger source gets, because the door
        # compares against identities.
        #
        # The write door (policy.go validatePolicyRow) refuses every pattern
        # that can never match: `tasks.*`, which is neither a reference nor
        # `<authority>/*`, and an exact pattern naming a kind this repository
        # does not have, such as the plural typo `widgets` for `widget`. A
        # selector that matches no write gates nothing, and on this kind that
        # reads as an ungated agent. A glob is not checked against the
        # vocabulary: an authority's kind set changing under it is why one is
        # written.
        kinds:
          type: string
          repeated: true
          description: kind references, `<authority>/*` or `*`; empty means
            every kind
        # THE WRITE VERB THE AGENT CALLED, which is neither the change class a
        # trigger watches nor the op the gated request ends up carrying: a
        # gated `put` OR `patch` lands as a request with `op: create` when the
        # target is absent and `op: patch` when it is there (policy.go
        # convertToRequest), so gating `patch` is not edit-only review. The
        # values are engine/policy.go's policyOp* constants, pinned by a test.
        ops:
          type: enum
          repeated: true
          values:
            - put
            - patch
            - delete
          description: 'the write verb matched: put, patch or delete, the
            three policy evaluates (link, unlink, merge and split are outside
            it), never a trigger''s create/update/delete; empty means all
            three'
        agents:
          type: string
          repeated: true
          description: agent identities; empty means every agent
    # REQUIRED, and the write door is what requires it (policy.go
    # validatePolicyRow): there is no default action, so a rule without one
    # speaks for nothing while sitting in the list looking live.
    #
    # The `required:` KEY is deliberately not set yet. Adding it to a property
    # live records may lack is a narrowing, and the boot upgrade answers a
    # narrowing by withholding the whole authority's projection — all of core,
    # until somebody fixes the row — with the reason in a server log the
    # repository's owner cannot read. #204 turns `required` into real
    # enforcement together with the violator scan that makes that transition
    # safe, and this property takes the key there.
    action:
      type: enum
      values:
        - allow
        - gate
        - refuse
      description: what a matched write does — land, convert into a request,
        or bounce
    # The judge, inert until the plan's phase 4: an agent (tool-less, its
    # structured verdict is its whole contract) the ENGINE runs over gated
    # requests, deciding only between the thresholds below. ALPHA at v1 with
    # everything under it through `mode` — see the marker at the top of this
    # file.
    judge:
      type: reference
      kind: core.substrate.reamde.dev/agent
      description: the agent that judges what this policy gates; absent means
        the owner decides everything
    criteria:
      type: text
      description: the owner's instructions to the judge, in prose
    context:
      type: enum
      values:
        - envelope
        - thread
      description: how much the judge reads — the frozen envelope alone (default),
        or the proposing thread's recent turns beside it
    # TWO INDEPENDENT FLOORS, NOT A BAND. The judge's verdict picks which floor
    # is read: `autoAccept` measures an `accept` verdict and `autoRefuse` a
    # `reject` one, and one reply carries one verdict, so the two never contend
    # and declaring both declares two separate rules (judge.go routeVerdict).
    # Anything that is not a verdict clearing its own floor escalates to the
    # owner: an `escalate` verdict, confidence under the floor, an undeclared
    # threshold, `advise` mode, a judge that failed.
    autoAccept:
      type: float
      min: 0
      max: 1
      description: an `accept` verdict at or above this confidence accepts
        the gated request; absent means the judge never accepts
    autoRefuse:
      type: float
      min: 0
      max: 1
      description: a `reject` verdict at or above this confidence rejects
        it; absent means the judge never rejects
    mode:
      type: enum
      values:
        - enforce
        - advise
      description: enforce decides within the thresholds; advise only ever
        recommends
    disabled:
      type: bool
      description: a disabled policy matches nothing
