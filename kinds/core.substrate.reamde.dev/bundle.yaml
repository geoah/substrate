# one installed bundle: the install unit (substrate-primitives §4). The id
# IS the owned authority ("web.bundles.substrate.reamde.dev"); the declaration names the
# configType and the exact closure it ships, and a batch carrying a bundle
# document REPLACES the owned authority whole — install and upgrade are one
# atomic apply, breakage refused. `disabled`/`uninstalled` are runtime state
# the lifecycle verbs own, never part of the declaration.
kind: core.substrate.reamde.dev/kind
metadata:
  id: core.substrate.reamde.dev/bundle
data:
  authority: core.substrate.reamde.dev
  description: >-
    One installed bundle, the install unit. It names the authority the
    bundle owns and the exact closure it ships — kinds, functions, agents,
    triggers — and carries the runtime state the lifecycle verbs own:
    disabled, uninstalled, purging.
  names:
    singular: bundle
    plural: bundles
  displayTemplate: "{name}"
  properties:
    # Every declaration carries its own version: the
    # declaring authority's, unless the declaration overrides it. It is what the
    # boot-time upgrade diffs a repository's shipped vocabulary against, so
    # it is written on every projected declaration row.
    version:
      type: string
      description: this declaration's version
    name:
      type: string
      description: the bundle's name, the owned authority's first label
    authority:
      type: string
      description: the authority the bundle owns ("<name>.bundles.substrate.reamde.dev")
    configType:
      type: string
      description: the bundleconfig-trait record type holding the bundle's
        one configuration record
    definition:
      type: json
      description: the parsed manifest data, installs closure included
    disabled:
      type: bool
      description: set by the disable verb — execution stopped, reversible
    uninstalled:
      type: bool
      description: set by the uninstall verb — runtime registration removed,
        data stays; cleared by re-applying the closure
    purging:
      type: bool
      description: set while a purge runs — enable refuses it; an interrupted
        purge leaves it standing until a purge completes
