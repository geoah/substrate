# a proposed CHANGE to the graph, applied when its decision is accepted: a
# patch to an existing target (the default, back-compat), or a create/delete
# the reviewed accept materialises (issue 005).
kind: core.substrate.reamde.dev/kind
metadata:
  id: core.substrate.reamde.dev/recordpatchrequest
data:
  authority: core.substrate.reamde.dev
  description: >-
    A proposed change to the graph, waiting for the owner: patch an existing
    record, create one, or delete one. A learner or an app writes it, accepting
    the decision applies it, and the envelope is frozen once proposed so nobody
    can swap what was reviewed.
  # The declaration carried no version of its own before this, inheriting the
  # authority's (6 at the time) — and an unbumped edit is a no-op to the
  # upgrade, so this key is what carries the change into repositories that
  # already hold the row.
  # version 7: `thread` — the proposing thread, stamped by the agent loop's
  # propose built-in, which is where a decision reports back.
  # version 8: the decision transitions carry `notifies: thread` — the
  # declared marker that replaced the engine's hardcoded write-back
  # (docs/plans/thread-interactions.md), behavior identical.
  # version 9: `policy` and `policyRevision` — stamped by the engine when the
  # policy door converts a held write into this request; frozen with the
  # envelope, because the audit must not be reworded under a pending request.
  # version 10: `decidedAt` is a declared property (datetime, managed). The
  # decision transitions stamped it as an undeclared string before, invisible
  # to the declaration and untyped in the filter grammar.
  # version 11: `op`'s description says what the accept does and how a policy
  # selector's `put` or `patch` becomes create or patch here, so a reader of a
  # gated request can write the selector that matches it.
  # version 12: a display template, and `targetVersion` carries `min: 1`, since
  # a record's first version is 1 and a CAS assertion below it names none.
  # version 14: `target` is an unpinned `type: reference` property with
  # `mustExist: true`, so a request names any patchable record.
  version: 14
  names:
    singular: recordpatchrequest
  displayTemplate: "{decision}: {target|targetId}"
  # the envelope a change travels in before anyone has agreed to it: a
  # learner or an app writes one, the owner decides, and accepting it is
  # what applies the change (§7). `request` because it waits for a human;
  # `patch` in the kept name because `mutation` is the write API's own word,
  # and the kind is extended rather than renamed (minimal churn — the `op`
  # property carries create/delete now).
  #
  # The reviewed envelope is IMMUTABLE after propose (review-p0 #2): op,
  # targetKind, targetId, diff and the target reference are enforced read-only by
  # the write path once the request exists, so the values the reviewer read
  # cannot be swapped under an undecided request. Deciding (the `decision`
  # transition) additionally requires the request's `ifVersion` on the
  # owner/generic path, and — for a function/agent accept — the accepting
  # actor's effective emit set must include the type the accept would write
  # (review-p0 #1).
  properties:
    # the change verb: patch (change an existing target), create (mint a new
    # record), or delete (tombstone one). ABSENT means patch — an existing
    # request stores no `op`, so back-compat is by omission.
    #
    # THE WORD IS NOT THE POLICY SELECTOR'S. A gate matches the write verb the
    # agent called (`put`, `patch`, `delete`) and then resolves it against the
    # target: for `put` and `patch` alike a target that is not LIVE (absent or
    # tombstoned) converts to `create` and a live one to `patch` (policy.go
    # convertToRequest), so a selector naming either verb is what produces a
    # request reading `op: create`. `create` here also is not a trigger's `create`: this one
    # mints a record and CONFLICTS on a divergent collision, where `put`
    # overwrites. docs/changelog.md#change-verbs holds the three vocabularies
    # side by side.
    op:
      type: enum
      values:
        - create
        - patch
        - delete
      description: 'what the accept does: patch an existing target (the default
        when absent), create the named record, or delete it. A gated put or
        patch arrives here as create unless the target is live'
    # create only: the full kind reference and the stable id of the record the
    # accept mints (create-if-absent, idempotent on replay).
    targetKind:
      type: string
      description: "op create: the full kind reference of the record to mint"
    targetId:
      type: string
      description: "op create: a stable id for the new record"
    # the target version the diff was computed against; the patch path compares
    # against it (§7). Stamped by the engine when the target reference is written.
    targetVersion:
      type: int
      min: 1
      description: the target version the diff was computed against
    diff:
      type: json
      description: the proposed change, applied whole when the decision is
        accepted — property values under `properties`, a link to another record
        among them
    rationale:
      type: string
      description: why the writer proposes this change
    # Stamped by the ENGINE when the policy door gated a write into this
    # request; absent on requests an agent proposed on purpose or a human
    # wrote. The revision pins WHICH text of the mutable policy record
    # governed, because the audit must not drift with later edits.
    policy:
      type: reference
      kind: core.substrate.reamde.dev/recordpatchpolicy
      description: the policy whose gate converted this write, where one did
    policyRevision:
      type: int
      description: the governing policy record's version at conversion
    # Stamped by the agent loop when the propose built-in lands the request:
    # the thread whose tool call proposed it. The decision writes a `system`
    # llmmessage back into that thread and resumes it, so the proposing agent
    # hears the verdict without a trigger. Absent on requests a human or a
    # function proposed — those have no thread to report to.
    thread:
      type: reference
      kind: core.substrate.reamde.dev/llmthread
      inverse: proposals
      inverseDescription: the change requests this thread's propose calls
        landed
      description: the thread whose propose call created this request
    # Stamped by the decision transitions below; managed because nothing else
    # writes it: the envelope is frozen once proposed, and the decision is
    # the one move it ever makes.
    decidedAt:
      type: datetime
      managed: true
      description: when the decision was made, stamped by the transition
    # accepting is what applies the change: the transition runs `applyDiff`,
    # which branches on `op` — a patch checks the diff against `targetVersion`
    # and fails the transition if the target moved underneath it, a create
    # mints the named record, a delete tombstones it.
    decision:
      type: state
      description: "proposed until somebody decides; accepting is what applies
        the change"
      states:
        - proposed
        - accepted
        - rejected
      initial: proposed
      transitions:
        # `notifies: thread` is the one resolution primitive: the transition
        # writes the decision's `system` message into the thread the named
        # reference points at, and the engine schedules the resume.
        - from: proposed
          to: accepted
          onEnter: applyDiff
          notifies: thread
          stamps:
            decidedAt: now
        - from: proposed
          to: rejected
          notifies: thread
          stamps:
            decidedAt: now
    # Unpinned: anything patchable may be a target. NOT required: a create
    # request names its target by `targetKind`/`targetId` (the record does not
    # exist yet); patch and delete requests carry the reference, checked by
    # the transition, which is also what makes it immutable after propose.
    target:
      type: reference
      required: false
      mustExist: true
      description: the record the change would patch or delete (patch/delete
        only)
