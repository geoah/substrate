# the user's login credential — a RECORD, holding no secret material
kind: core.substrate.reamde.dev/kind
metadata:
  id: core.substrate.reamde.dev/credential
data:
  authority: core.substrate.reamde.dev
  names:
    singular: credential
    plural: credentials
  # A SINGLETON, id `self`: the repository has exactly one user and the user
  # has exactly one credential. It carries the username and two REFS into the
  # sealed store — the argon2id password hash and the TOTP seed — and never
  # the material itself, so the changelog shows "the credential changed at T" (an
  # audit trail) while carrying nothing crackable and accumulating no old
  # password hashes in an immutable sequence.
  #
  # Writes come from the auth endpoints alone (registration, password change,
  # TOTP re-enrollment, operator reset), attributed to the substrate; the
  # generic record/GraphQL/REST surface REFUSES both writes and deletes to it
  # (engine/write.go guardSystemType). Reading and listing it is ordinary.
  displayTemplate: "{username}"
  properties:
    username:
      type: string
      description: the user this credential admits; immutable in v1
    passwordRef:
      type: secret
      description: the sealed-store ref holding the argon2id password hash
    totpRef:
      type: secret
      description: the sealed-store ref holding the TOTP seed and its last
        consumed step
