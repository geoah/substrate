# Shipped vocabulary ported from mneme v4: what is remembered. An
# episode is one remembered thing at one grain: a moment as it happened, or
# the daily, weekly and monthly summaries that moments roll up into, each
# summary pointing at what it aggregates. Scope says what the memory is
# ABOUT (an event, an entity, the owner's world), and a durable memory
# simply omits its timeline anchor so it never crowds the timeline.
#
# People are people.substrate.reamde.dev's, never a local copy, which is why
# this bundle requires that authority. Everything else an episode touches
# goes through the untyped `subjects` edge.
#
# no new actors: writes arrive under the actor of whatever runs.
kind: core.substrate.reamde.dev/authority
metadata:
  id: memory.substrate.reamde.dev
data:
  # v1alpha2: THE TYPED CORE SWEEP. This closure moved to the declared
  # spellings — a tool entry names its arm, a function's IO is a flat argument
  # list and its grants ride `data` itself, a mapping rule is `{path}`, an index
  # names its properties — so every declaration in it changed shape.
  version: v1alpha2
---
# ---- the bundle document: the import unit -----------------------------------
# A VOCABULARY bundle: kinds only, imported from the registry. Episodes
# name people, so it requires that authority to be present first.
kind: core.substrate.reamde.dev/bundle
metadata:
  id: memory.substrate.reamde.dev/memory
data:
  authority: memory.substrate.reamde.dev
  description: >-
    What is remembered: episodes at grains, moments rolling up into daily,
    weekly and monthly summaries, with people pointing at people and an untyped
    edge for everything else a memory touches.
  requires:
    - people.substrate.reamde.dev
  installs:
    - memory.substrate.reamde.dev/episode
