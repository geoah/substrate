# one remembered thing, at one grain
kind: core.substrate.reamde.dev/kind
metadata:
  id: memory.substrate.reamde.dev/episode
data:
  authority: memory.substrate.reamde.dev
  description: >-
    One remembered thing: a decision, a milestone, a first sighting, or a
    summary that coarser grains roll moments up into. Scope says what it is
    about; grain says how coarse it is; a durable memory omits its timeline
    anchor so it stays out of the timeline entirely.
  names:
    singular: episode
    plural: episodes
  displayTemplate: "{name}"
  indices:
    - properties:
        - grain
        - period
  properties:
    name:
      type: string
      required: true
      description: the memory in one line
    kind:
      type: enum
      description: what sort of thing is being remembered
      values:
        - decision
        - commitment
        - value: rolechange
          label: Role change
        - value: relationchange
          label: Relation change
        - value: statuschange
          label: Status change
        - value: newfact
          label: New fact
        - milestone
        - value: firstsighting
          label: First sighting
        - followup
    salience:
      type: int
      min: 0
      description: how much this memory matters relative to its neighbors
    # what the memory is ABOUT, which decides where it gets injected: an
    # event memory travels with its moment, an entity memory with its
    # subjects, a global memory with the owner everywhere.
    scope:
      type: enum
      description: what the memory is about, deciding where it is recalled
      values:
        - value: event
          label: About this one event
        - value: entity
          label: About its subjects
        - value: global
          label: About the owner or the world
    # the tiered-memory ladder: moments roll up into daily, daily into
    # weekly, weekly into monthly, and rolling is the one always-current
    # recap of the last day that gets rewritten in place.
    grain:
      type: enum
      description: how coarse the memory is on the roll-up ladder
      values:
        - moment
        - value: rolling
          label: Rolling recap
        - daily
        - weekly
        - monthly
    period:
      type: string
      pattern: "^\\d{4}(-W\\d{2}|-\\d{2}(-\\d{2})?)?$"
      description: the period a summary covers, 2026-07-12 or 2026-W28 or
        2026-07
    authoredBy:
      type: enum
      description: whose memory it is
      values:
        - value: user
          label: Written by the owner
        - value: agent
          label: Written by an agent
    sourceURL:
      type: url
      description: where the remembered thing can be seen, when it can
    details:
      type: markdown
      embed: true
      description: the memory in full, as prose
  edges:
    people:
      to: person
      many: true
      description: the people the memory involves
    # untyped on purpose: a memory can touch a project, a place, an event
    # or anything else, and naming each would couple this authority to
    # every other one.
    subjects:
      to: any
      many: true
      description: everything else the memory is about
    aggregates:
      to: episode
      many: true
      description: the finer episodes this summary rolls up
    source:
      to: any
      description: the message, mail or transcript the memory came from
