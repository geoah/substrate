# a reusable session plan built from the exercise catalog
kind: core.substrate.reamde.dev/kind
metadata:
  id: fitness.substrate.geoah.me/workouttemplate
data:
  authority: fitness.substrate.geoah.me
  description: >-
    A reusable session plan: which exercises, in what order, with the
    defaults a session starts from. Starting a workout from a template
    copies nothing; the workout just points back here.
  names:
    singular: workouttemplate
    plural: workouttemplates
  displayTemplate: "{name}"
  properties:
    name:
      type: string
      required: true
      description: the plan's name, Push day or 5k intervals
    estimatedDurationMinutes:
      type: int
      description: how long a session usually takes, in minutes
    defaultRestSeconds:
      type: int
      description: the rest between sets a session starts from, in seconds
    details:
      type: markdown
      embed: true
      description: the plan's structure and intent, as prose
  edges:
    exercises:
      to: exercise
      many: true
      description: the movements the plan is built from
