# one mail thread
kind: core.substrate.reamde.dev/kind
metadata:
  id: messaging.substrate.geoah.me/emailthread
data:
  authority: messaging.substrate.geoah.me
  description: >-
    One mail thread: its subject, the account it synced through, and
    everyone on it. Messages point here, so the thread is what a reader
    lists and the messages are what they open.
  names:
    singular: emailthread
    plural: emailthreads
  displayTemplate: "{subject}"
  # `at` is the last message's time, so an inbox orders threads without
  # opening their messages.
  traits:
    - temporal(point)
  properties:
    subject:
      type: string
      description: the thread's subject
    read:
      type: bool
      description: every message in the thread has been read
  edges:
    account:
      to: any
      required: true
      ownerRef: true
      description: the accountconfig record this thread synced through
    participants:
      to: person
      many: true
      description: everyone on the thread
