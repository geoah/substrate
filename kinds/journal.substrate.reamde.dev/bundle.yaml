# Shipped vocabulary ported from mneme v4: what the owner writes
# down. A journal entry is the day's reflection; a note is everything else,
# and its kind declares who it is for (a note to self, an instruction for an
# agent, a reference) so a reader never has to guess intent from prose.
#
# `subjects: {to: any}` is this authority's one untyped edge: a note can be
# about a person, a project, a place or anything else, and naming each would
# couple this authority to every other one.
#
# no new actors: writes arrive under the actor of whatever runs.
kind: core.substrate.reamde.dev/authority
metadata:
  id: journal.substrate.reamde.dev
data:
  version: v1alpha1
---
# ---- the bundle document: the import unit -----------------------------------
# A VOCABULARY bundle: kinds only, imported from the registry.
kind: core.substrate.reamde.dev/bundle
metadata: {id: journal.substrate.reamde.dev/journal}
data:
  authority: journal.substrate.reamde.dev
  description: >-
    What the owner writes down: daily journal entries, and notes whose kind
    declares their audience and whose status carries the handled lifecycle.
  installs:
    - journal.substrate.reamde.dev/journalentry
    - journal.substrate.reamde.dev/note
