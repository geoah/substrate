# one episode; `temporal(point)` is the publish date
kind: core.substrate.reamde.dev/kind
metadata:
  id: media.substrate.reamde.dev/podcastepisode
data:
  authority: media.substrate.reamde.dev
  names:
    singular: podcastepisode
    plural: podcastepisodes
  traits:
    - temporal(point)
  properties:
    number:
      type: int
      description: the episode number
    # the same concept tvepisode carries, spelled the same way
    seasonNumber:
      type: int
      description: the season number, where the feed has seasons
    duration:
      type: duration
      description: the playback length
    description:
      type: markdown
      embed: true
      description: the episode's show notes
    mediaRef:
      type: url
      description: where the file lives
  edges:
    podcast:
      to: podcast
      required: true
      ownerRef: true
      description: the feed the episode belongs to
