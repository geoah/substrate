# one album or release: the pressing you have, not the release authority
kind: core.substrate.reamde.dev/kind
metadata:
  id: media.substrate.reamde.dev/musicalbum
data:
  authority: media.substrate.reamde.dev
  names:
    singular: musicalbum
    plural: musicalbums
  properties:
    releasedAt:
      type: date
      description: when the album came out
    genres:
      type: string
      repeated: true
      description: genre names, as the source lists them
    coverRef:
      type: url
      description: the cover art
  edges:
    artist:
      to: person
      many: true
      description: the album artist
    label:
      to: organization
      description: the label that released it
