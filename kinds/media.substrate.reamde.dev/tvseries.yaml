# one television series, the thing Sonarr tracks
kind: core.substrate.reamde.dev/kind
metadata:
  id: media.substrate.reamde.dev/tvseries
data:
  authority: media.substrate.reamde.dev
  names:
    singular: tvseries
    plural: tvseries
  # `duration` is not here: Sonarr carries a nominal per-episode runtime on
  # the series, but the truth is per episode, so that is where it lives.
  properties:
    year:
      type: int
      description: the year the series premiered
    # Sonarr's series status, minus its `deleted` — a deletion here is the
    # record's own soft delete, not a state a series can be published in.
    status:
      type: enum
      values:
        - upcoming
        - continuing
        - ended
      description: whether the series is upcoming, continuing or ended
    certification:
      type: string
      description: the age rating, as the source spells it
    genres:
      type: string
      repeated: true
      description: genre names, as the source lists them
    description:
      type: markdown
      embed: true
      description: the series' synopsis
    coverRef:
      type: url
      description: the poster image
  edges:
    network:
      to: organization
      description: the network that airs it
    cast:
      to: person
      many: true
      description: the recurring cast
