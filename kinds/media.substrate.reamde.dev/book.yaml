# one book — the WORK: what an author wrote, independent of any edition you
# hold. The paperback, the Kindle file and the Audible download are
# `bookedition` records pointing at this one.
kind: core.substrate.reamde.dev/kind
metadata:
  id: media.substrate.reamde.dev/book
data:
  authority: media.substrate.reamde.dev
  description: >-
    One book as the WORK — what an author wrote, independent of any copy you
    hold. The paperback, the ebook and the audiobook are bookedition records
    pointing here, so the blurb, the genres and the place in a series are
    stated once.
  names:
    singular: book
    plural: books
  # A work's id is server-assigned: its editions project onto it, and every
  # identifier a book carries — an ASIN, an ISBN, a library item — names an
  # edition rather than the work, so those live on `bookedition`.
  # There is no `audiobook` type: Audiobookshelf models ONE Book library item
  # carrying `audioFiles` and/or an `ebookFile`, so the format is simply which
  # files exist — a property of the edition that holds them.
  properties:
    subtitle:
      type: string
      description: the subtitle, where the work has one
    genres:
      type: string
      repeated: true
      description: genre names, as the source lists them
    # an edge carries no properties in this language (name, to, many,
    # required, ownerRef and nothing else), so ABS's `series[].sequence`
    # lands on the member. A string because "1.5" and "2 of 3" both occur.
    seriesPosition:
      type: string
      description: where the work sits in its series; 1.5 and 2 of 3 both
        occur
    description:
      type: markdown
      embed: true
      description: the work's blurb
  edges:
    author:
      to: person
      many: true
      description: the people who wrote it
    series:
      to: bookseries
      description: the series the work belongs to
