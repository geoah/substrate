# The shipped vocabulary, subsystem 1: who. Shipped, but not SEEDED — this is
# a VOCABULARY BUNDLE a repository imports from the registry (the bundle
# document is at the foot of this file). Kubernetes' API authorities are the
# model — split by subsystem, not by abstraction level — so there is no
# `primitives` tier here; a person is no more primitive than a conversation.
#
# This authority holds the human and nothing source-shaped. `person` is one record
# per human, with a server-assigned id, and every vocabulary edge that means
# "a human" lands on it. What one source holds about a person —
# `google.bundles.substrate.reamde.dev/contact`, `user.slack.bundles.substrate.reamde.dev` — lives
# in the bundle authority that installs it, carries the provider's own key as
# its id, and points at a person through an ordinary edge. The bundle's
# recordmapping (§6.1) names that edge and says how the record's properties
# reach the person (§7.1). Nothing in this bundle is single-writer;
# everything in a bundle authority is.
#
# Emails and phones are ordinary properties. Nothing indexes or fuses on them:
# two people holding one address is legal and inert, and joining them is a
# manual merge (§6.4).
#
# Two types and no more: a role (author, narrator, attendee, speaker) is a
# property of the RELATION, never a second kind of person, so every edge that
# means "a human" lands on `person`. Edges from messaging, calendar, tasks and
# media all cross into this one; authorities namespace names, never the graph.
#
# no new actors: the doors and the substrate ship with core; a connector's
# writes arrive under the actor of whatever runs — a bundle function writes as
# `function:<name>` — so nothing here declares an actor.
kind: core.substrate.reamde.dev/authority
metadata:
  id: people.substrate.reamde.dev
data:
  version: v1alpha1
---
# ---- the bundle document: the import unit -------------------------------------
# A VOCABULARY bundle: a bare authority the substrate publishes, delivered
# through the registry instead of the creation seed. It ships kinds and
# nothing else — no inputs, no functions, no agents, no OAuth, no
# triggers — so `installs:` is exactly the authority's declared members.
kind: core.substrate.reamde.dev/bundle
metadata:
  id: people.substrate.reamde.dev/people
data:
  authority: people.substrate.reamde.dev
  description: >-
    People, organizations and teams — one record per human, the target every
    connector's contact, attendee, author and sender maps onto.
  installs:
    - people.substrate.reamde.dev/organization
    - people.substrate.reamde.dev/person
    - people.substrate.reamde.dev/team
