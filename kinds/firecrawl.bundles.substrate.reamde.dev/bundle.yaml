# The Firecrawl bundle — web search + page scraping as CALLABLE AGENT TOOLS.
#
# A capability bundle, not an account integration: one API key on the
# bundle config, no accountconfig, no oauth2, no host OAuth flow — the shape
# the URL-harvester stubbed (`firecrawlKey`, unused there) made real. And no
# triggers: both functions are pure callables (`mode: call`) an agent binds
# as tools or a client invokes over the call API — nothing here subscribes to
# the changelog, so the closure ships with ZERO delivery wiring.
#
# Install:  substratectl apply -f bundle.yaml
# Configure: create ONE config record carrying the apiKey.
#
# This file is the SCHEMA closure (the atomic install unit) — and the whole
# bundle: with no triggers there is no second file.
# ---- the owned authority ------------------------------------------------------
kind: core.substrate.reamde.dev/authority
metadata: {id: firecrawl.bundles.substrate.reamde.dev}
data:
  version: v1alpha1
---
# ---- the bundle document: the install unit --------------------------------
# `installs:` names EXACTLY the authority's schema members (every kind but the
# authority header and the bundle itself) — the loader holds the two equal both
# ways.
kind: core.substrate.reamde.dev/bundle
metadata: {id: firecrawl.bundles.substrate.reamde.dev/firecrawl}
data:
  authority: firecrawl.bundles.substrate.reamde.dev
  description: >-
    Web search and page scraping over the Firecrawl API — two callable functions
    an agent binds as tools: search the live web, and read any page as markdown
    kept as a webdocument.
  configType: firecrawl.bundles.substrate.reamde.dev/config
  installs:
    - firecrawl.bundles.substrate.reamde.dev/config
    - firecrawl.bundles.substrate.reamde.dev/webdocument
    - firecrawl.bundles.substrate.reamde.dev/websearch
    - firecrawl.bundles.substrate.reamde.dev/scrapepage
---
# ---- the config type: a bundleconfig-trait record -------------------------
# ONLY bundleconfig — deliberately NOT oauth2 (there is no OAuth client; the
# key is a bearer token) and NOT accountconfig (there are no per-user
# accounts; one key serves the repository). The apiKey is the bundle's own config
# secret: injected into its functions' invocations (and held to the runner
# boundary by the invocation scrubber), never read back over the API.
kind: core.substrate.reamde.dev/kind
metadata: {id: firecrawl.bundles.substrate.reamde.dev/config}
data:
  authority: firecrawl.bundles.substrate.reamde.dev
  description: >-
    The Firecrawl API key and the API root it may be sent to. One key
    serves the whole repository — no OAuth client, no per-user accounts —
    and the origin is pinned, so editing the URL cannot redirect the
    credential.
  names: {singular: config, plural: configs}
  traits: [bundleconfig]
  displayTemplate: "Firecrawl {baseUrl}"
  properties:
    apiKey:
      type: secret
      writer: owner
      displayName: API key
      description: the Firecrawl API key (fc-…) — sealed from reads, injected
        only into this bundle's functions
    baseUrl:
      type: url
      writer: owner
      default: https://api.firecrawl.dev
      displayName: Base URL
      description: >-
        the Firecrawl API root — ORIGIN-PINNED: the bodies only send the apiKey
        to https://api.firecrawl.dev or loopback (the test seam), so an edit
        cannot redirect the credential
---
# ---- the webdocument type: what a scrape leaves behind ---------------------
# scrapepage's durable output, owned by THIS authority (a bundle's effects stay
# inside its own authority's types — it never writes another bundle's, e.g. the
# web harvester's page). `title` is the reserved built-in (scrapepage writes
# it); the id is host.ids.url(url), so re-scraping the same URL updates one
# document instead of minting a second.
kind: core.substrate.reamde.dev/kind
metadata: {id: firecrawl.bundles.substrate.reamde.dev/webdocument}
data:
  authority: firecrawl.bundles.substrate.reamde.dev
  description: >-
    What a scrape leaves behind: the page as markdown, capped, with the
    scrape metadata beside it. The id is a hash of the URL, so scraping
    the same page again updates one document instead of minting a second.
  names: {singular: webdocument, plural: webdocuments}
  properties:
    url:
      type: url
      displayName: URL
      description: the scraped URL — the document id is host.ids.url(url),
        a hash of it
    content:
      type: text
      displayName: Content
      description: the page as markdown, capped at 24000 characters
    truncated:
      type: bool
      displayName: Truncated
      description: set when the fetched markdown was longer than the cap and
        got cut
    fetchedAt:
      type: datetime
      displayName: Fetched
      description: when this document was last scraped
    raw:
      type: json
      displayName: Raw metadata
      description: the Firecrawl scrape metadata as fetched, for provenance
---
# ---- function: websearch ---------------------------------------------------
# A READ tool: calls Firecrawl search and returns the hits — no effects ever.
# `emit` is declared because the manifest requires a non-empty allowlist; it
# is a ceiling, not a promise, and this body stages nothing under it.
kind: core.substrate.reamde.dev/function
metadata: {id: firecrawl.bundles.substrate.reamde.dev/websearch}
data:
  authority: firecrawl.bundles.substrate.reamde.dev
  description: >-
    Search the web for real-time information. Returns hits as {title, url,
    snippet}. Use for live facts (news, current events) or to find a URL to
    read with scrapepage. Read-only.
  runtime: python
  timeoutMs: 30000
  input:
    type: object
    properties:
      query:
        type: string
        description: the search query — specific beats terse
      limit:
        type: number
        description: max hits to return (default 5, capped at 20)
    required: [query]
  output:
    type: object
    properties:
      results:
        type: array
        items:
          type: object
          properties:
            title: {type: string}
            url: {type: string}
            snippet: {type: string}
          required: [title, url]
    required: [results]
  capabilities:
    emit: [firecrawl.bundles.substrate.reamde.dev/webdocument]
    network:
      - "api.firecrawl.dev"
  source: |
    import json
    import urllib.request
    from urllib.parse import urlsplit

    DEFAULT_BASE = "https://api.firecrawl.dev"
    PINNED_HOST = "api.firecrawl.dev"
    LOOPBACK_HOSTS = ("127.0.0.1", "localhost", "::1")

    def _config(input):
        return ((input.get("config") or {}).get("config") or {}).get("properties") or {}

    def _base(cfg):
        # Origin pinning (fleet F1 / codex review #1): the apiKey is only ever
        # sent over HTTPS to the pinned provider host, or to loopback (any
        # scheme — the test seam). baseUrl is owner-editable, so anything else
        # refuses BEFORE the request is built: a config edit must never
        # redirect the bearer key. (The declared `network` capability is not
        # yet host-enforced; this is the bundle-side defense.)
        base = str(cfg.get("baseUrl") or DEFAULT_BASE).strip().rstrip("/")
        parts = urlsplit(base)
        if parts.username or parts.password:
            raise ValueError("firecrawl: baseUrl embeds credentials — refusing")
        host = (parts.hostname or "").lower()
        if host in LOOPBACK_HOSTS:
            return base
        if parts.scheme == "https" and host == PINNED_HOST:
            return base
        raise ValueError(
            "firecrawl: baseUrl %r is not the pinned provider origin — the "
            "API key is only sent to https://%s or loopback" % (base, PINNED_HOST))

    def main(input, host):
        args = input.get("args") or {}
        query = str(args.get("query") or "").strip()
        if not query:
            raise ValueError("query is required")
        cfg = _config(input)
        key = cfg.get("apiKey") or ""
        if not key:
            raise ValueError(
                "the firecrawl bundle is not configured: create the "
                "config record carrying an apiKey")
        limit = int(args.get("limit") or 5)
        limit = max(1, min(limit, 20))
        base = _base(cfg)
        body = json.dumps({"query": query, "limit": limit,
                           "sources": ["web"]}).encode("utf-8")
        req = urllib.request.Request(
            base + "/v2/search", data=body, method="POST",
            headers={"Authorization": "Bearer " + key,
                     "Content-Type": "application/json"})
        with urllib.request.urlopen(req, timeout=25) as resp:
            payload = json.loads(resp.read().decode("utf-8"))
        if not payload.get("success"):
            raise RuntimeError("firecrawl search failed: "
                               + str(payload.get("error") or "unknown error"))
        results = []
        for hit in (payload.get("data") or {}).get("web") or []:
            item = {"title": hit.get("title") or "", "url": hit.get("url") or ""}
            if hit.get("description"):
                item["snippet"] = hit["description"]
            results.append(item)
        return {"output": {"results": results}}
---
# ---- function: scrapepage --------------------------------------------------
# The write half: scrape one URL as markdown (capped, like the v4 web_fetch
# tool), keep it as a webdocument put with host.ids.url(url) — if_absent is
# FALSE on purpose, so a re-scrape UPDATES the one document — and return the
# document id plus the content.
kind: core.substrate.reamde.dev/function
metadata: {id: firecrawl.bundles.substrate.reamde.dev/scrapepage}
data:
  authority: firecrawl.bundles.substrate.reamde.dev
  description: >-
    Fetch a URL and return its readable markdown, capped at 24000 chars. The
    page is kept as a webdocument (the output's document id); re-scraping
    the same URL updates it.
  runtime: python
  timeoutMs: 30000
  input:
    type: object
    properties:
      url:
        type: string
        description: the URL to fetch — an absolute https:// URL
    required: [url]
  output:
    type: object
    properties:
      document:
        type: string
        description: the webdocument record id the page was kept under
      url: {type: string}
      title: {type: string}
      content: {type: string}
      truncated: {type: boolean}
    required: [document, url, content]
  capabilities:
    emit: [firecrawl.bundles.substrate.reamde.dev/webdocument]
    network:
      - "api.firecrawl.dev"
  source: |
    import datetime
    import json
    import urllib.request
    from urllib.parse import urlsplit

    DEFAULT_BASE = "https://api.firecrawl.dev"
    PINNED_HOST = "api.firecrawl.dev"
    LOOPBACK_HOSTS = ("127.0.0.1", "localhost", "::1")
    DOC_TYPE = "firecrawl.bundles.substrate.reamde.dev/webdocument"
    MAX_CONTENT = 24000

    def _config(input):
        return ((input.get("config") or {}).get("config") or {}).get("properties") or {}

    def _base(cfg):
        # Origin pinning (fleet F1 / codex review #1): the apiKey is only ever
        # sent over HTTPS to the pinned provider host, or to loopback (any
        # scheme — the test seam). baseUrl is owner-editable, so anything else
        # refuses BEFORE the request is built: a config edit must never
        # redirect the bearer key. (The declared `network` capability is not
        # yet host-enforced; this is the bundle-side defense.)
        base = str(cfg.get("baseUrl") or DEFAULT_BASE).strip().rstrip("/")
        parts = urlsplit(base)
        if parts.username or parts.password:
            raise ValueError("firecrawl: baseUrl embeds credentials — refusing")
        host = (parts.hostname or "").lower()
        if host in LOOPBACK_HOSTS:
            return base
        if parts.scheme == "https" and host == PINNED_HOST:
            return base
        raise ValueError(
            "firecrawl: baseUrl %r is not the pinned provider origin — the "
            "API key is only sent to https://%s or loopback" % (base, PINNED_HOST))

    def _check_url(url):
        # The page to fetch: an absolute https URL with a hostname and no
        # embedded credentials — held here BEFORE it is hashed into the
        # document id and BEFORE it reaches the provider (codex review #16):
        # a junk url must not mint a junk webdocument or waste a scrape.
        parts = urlsplit(url)
        if parts.scheme != "https":
            raise ValueError("url must be an absolute https:// URL")
        if not parts.hostname:
            raise ValueError("url carries no hostname")
        if parts.username or parts.password:
            raise ValueError("url must not embed credentials")

    def main(input, host):
        args = input.get("args") or {}
        url = str(args.get("url") or "").strip()
        if not url:
            raise ValueError("url is required")
        _check_url(url)
        cfg = _config(input)
        key = cfg.get("apiKey") or ""
        if not key:
            raise ValueError(
                "the firecrawl bundle is not configured: create the "
                "config record carrying an apiKey")
        base = _base(cfg)
        body = json.dumps({"url": url, "formats": ["markdown"]}).encode("utf-8")
        req = urllib.request.Request(
            base + "/v2/scrape", data=body, method="POST",
            headers={"Authorization": "Bearer " + key,
                     "Content-Type": "application/json"})
        with urllib.request.urlopen(req, timeout=25) as resp:
            payload = json.loads(resp.read().decode("utf-8"))
        if not payload.get("success"):
            raise RuntimeError("firecrawl scrape failed: "
                               + str(payload.get("error") or "unknown error"))
        data = payload.get("data") or {}
        content = str(data.get("markdown") or "").strip()
        truncated = len(content) > MAX_CONTENT
        if truncated:
            content = content[:MAX_CONTENT]
        meta = data.get("metadata") or {}
        title = str(meta.get("title") or "").strip()
        now = datetime.datetime.now(datetime.timezone.utc)
        props = {"url": url, "content": content, "truncated": truncated,
                 "fetchedAt": now.replace(microsecond=0).isoformat(),
                 "raw": meta}
        if title:
            props["title"] = title
        doc = host.ids.url(url)
        # if_absent stays False: the SAME id on a re-scrape is an update of
        # the one document, never a silent no-op.
        host.effects.put(DOC_TYPE, doc, properties=props)
        out = {"document": doc, "url": url, "content": content}
        if title:
            out["title"] = title
        if truncated:
            out["truncated"] = True
        return {"output": out}
