# one blood draw and its results
kind: core.substrate.reamde.dev/kind
metadata:
  id: health.substrate.reamde.dev/bloodtest
data:
  authority: health.substrate.reamde.dev
  description: >-
    One blood draw: which lab, when it was drawn, and the report files.
    Individual markers worth tracking over time are observationlog entries
    whose subject edge points back here, so a marker's history reads like
    any other observation's.
  names:
    singular: bloodtest
    plural: bloodtests
  displayTemplate: "{name}"
  # `at` is when the blood was drawn, not when results arrived.
  traits:
    - temporal(point)
  properties:
    name:
      type: string
      required: true
      description: what the panel was, one line
    labName:
      type: string
      description: the lab that ran it
    provider:
      type: string
      description: the clinician or service that ordered it
    attachments:
      type: blobref
      repeated: true
      description: the report files as delivered
    details:
      type: markdown
      embed: true
      description: findings and follow-ups worth keeping, as prose
