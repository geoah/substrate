# one recorded value of an observation
kind: core.substrate.reamde.dev/kind
metadata:
  id: health.substrate.reamde.dev/observationlog
data:
  authority: health.substrate.reamde.dev
  description: >-
    One recorded value of an observation: the value as a string, typed by
    the observation's valueKind, with where it came from. A spanning entry
    (sleep, a walk) carries its whole range; a point entry carries only when
    it was observed.
  names:
    singular: observationlog
  displayTemplate: "{value}"
  traits:
    - temporal(range)
  properties:
    # ONE string, decoded against the observation's valueKind: "true" for a
    # check, "7" for a scale, "8h30m" for a duration. A typed union here
    # would push the observation's typing into every log write.
    value:
      type: string
      description: the recorded value, encoded per the observation's valueKind
    originalValue:
      type: float
      description: the numeric value exactly as the source reported it
    originalUnit:
      type: string
      description: the unit the source reported, before any normalization
    # which occurrence of a recurring observation this entry answers: the
    # bundle's "expected minus logged" adherence needs it, exactly as every
    # other log kind carries it.
    scheduledAt:
      type: datetime
      description: the occurrence this entry answers, from expanding the RRULE
    source:
      type: enum
      description: how the entry came to exist
      values:
        - manual
        - imported
        - computed
        - derived
    sourceName:
      type: string
      description: the app or device that produced an imported entry
    tags:
      type: string
      repeated: true
      description: free labels for filtering
    details:
      type: markdown
      embed: true
      description: anything worth saying about this one entry, as prose
    observation:
      type: reference
      kind: observation
      required: true
      mustExist: true
      onDelete: cascade
      description: the observation this entry records a value of
    # unpinned on purpose: an entry can be derived from a meal, a workout or
    # a blood test, and naming each would couple this authority to every
    # other one.
    derivedFrom:
      type: reference
      mustExist: true
      description: the meal, workout or blood test this entry was derived
        from
