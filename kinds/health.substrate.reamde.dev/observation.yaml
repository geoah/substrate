# the DEFINITION of a tracked measure; its entries are observationlogs
kind: core.substrate.reamde.dev/kind
metadata:
  id: health.substrate.reamde.dev/observation
data:
  authority: health.substrate.reamde.dev
  description: >-
    The definition of one tracked measure: weight, mood, headaches, steps.
    It names what is tracked and how values are typed; the values themselves
    are observationlog records pointing here. An observation with a recurrence
    is a habit or check-in, and its timeline span is the series.
  names:
    singular: observation
  displayTemplate: "{name}"
  # the timeline span is the SERIES: `at` seeds the recurrence (its DTSTART)
  # and `endsAt` closes it. A definition with no recurrence may omit both.
  traits:
    - temporal(range)
    - recurring
  indices:
    - properties:
        - category
  properties:
    name:
      type: string
      required: true
      description: what is tracked, one line
    # mneme v3's metric categories, kept whole: the soft grouping every
    # health surface renders by.
    category:
      type: enum
      description: the soft grouping health surfaces render by
      values:
        - wellness
        - activity
        - symptoms
        - value: mentalhealth
          label: Mental health
        - nutrition
        - body
        - sleep
        - routine
        - lifestyle
        - medication
        - vitals
        - labs
    # how an entry's `value` is typed. The log stores one string and the
    # reader decodes it against this, so the definition owns the typing.
    valueKind:
      type: enum
      description: how an entry's value is typed; the log stores one string
      values:
        - value: check
          label: Yes or no
        - count
        - value: duration
          label: Duration in seconds
        - number
        - value: scale
          label: Scale between scaleMin and scaleMax
        - value: select
          label: One of a fixed set
        - value: text
          label: Free text
    unit:
      type: string
      description: the unit values carry, kg or steps or hours
    scaleMin:
      type: int
      description: the low end of a scale-kind observation
    scaleMax:
      type: int
      description: the high end of a scale-kind observation
    aggregation:
      type: enum
      description: how a day of entries folds into one number
      values:
        - sum
        - avg
        - min
        - max
        - count
        - latest
    active:
      type: bool
      description: false pauses the observation without deleting its history
    tags:
      type: string
      repeated: true
      description: free labels for filtering
    recurrence:
      type: recurrence
      description: the RRULE for a habit or check-in, stored and never expanded
    exdates:
      type: datetime
      repeated: true
      description: occurrence datetimes the rule skips
    rdates:
      type: datetime
      repeated: true
      description: extra occurrence datetimes beside the rule (iCalendar's
        RDATE)
    timezone:
      type: timezone
      description: the IANA zone a time-of-day rule resolves in
    details:
      type: markdown
      embed: true
      description: what this observation means and how to record it, as prose
