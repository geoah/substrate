# one medication at one strength and form
kind: core.substrate.reamde.dev/kind
metadata:
  id: health.substrate.reamde.dev/medication
data:
  authority: health.substrate.reamde.dev
  description: >-
    One medication at one strength and one form: a new strength is a new record,
    so a schedule's dose arithmetic never has to ask which variant was meant.
    When and how much lives on its medicationschedules.
  names:
    singular: medication
    plural: medications
  displayTemplate: "{name}"
  properties:
    name:
      type: string
      required: true
      description: the medication's name as printed on the box
    activeIngredient:
      type: string
      description: the active ingredient, where the name is a brand
    form:
      type: enum
      description: the physical form this record's strength applies to
      values:
        - tablet
        - capsule
        - liquid
        - injection
        - inhaler
        - patch
        - drops
        - cream
        - spray
        - gel
        - ointment
        - solution
        - powder
        - suppository
        - pen
        - gummy
    strengthAmount:
      type: float
      description: the strength per unit, the 500 of 500mg
    strengthUnit:
      type: enum
      description: the unit strengthAmount is measured in
      values:
        - mg
        - mcg
        - g
        - value: iu
          label: IU
        - units
        - ml
        - percent
    category:
      type: enum
      description: what shelf it belongs to
      values:
        - prescription
        - value: otc
          label: Over the counter
        - supplement
        - skincare
    details:
      type: markdown
      embed: true
      description: what it is for and anything worth remembering, as prose
