# one dose, done or skipped; absence is what "missed" means
kind: core.substrate.reamde.dev/kind
metadata:
  id: health.substrate.reamde.dev/medicationschedulelog
data:
  authority: health.substrate.reamde.dev
  description: >-
    One dose of a schedule, marked done or skipped. There is deliberately
    no missed state: absence in the logs is what missed means, so adherence
    is expected minus logged, computed by a reader. As-needed doses log against
    their schedule the same way, just without a scheduledAt.
  names:
    singular: medicationschedulelog
  displayTemplate: "{status}"
  # `at` is when the dose was actually taken or the skip was recorded.
  # `occurrencelog` contracts status/scheduledAt/details and the
  # absence-means-missed semantics; the flip states stay here (a trait carries
  # no values).
  traits:
    - temporal(point)
    - occurrencelog
  properties:
    # `done`/`skipped` matches the other three occurrence logs: one flip
    # machine, one spelling. This log spelled the done state `taken` before.
    status:
      type: state
      description: "done or skipped; correcting a mis-tap flips it back"
      states:
        - done
        - skipped
      initial: done
      transitions:
        - from: done
          to: skipped
        - from: skipped
          to: done
    scheduledAt:
      type: datetime
      description: the occurrence this log answers, from expanding the RRULE
    doseAmount:
      type: float
      description: how much was actually taken, when it differs from the plan
    # the same enum as medicationschedule.doseUnit: the plan and the actual
    # agree on the unit set. This log carried a free string before.
    doseUnit:
      type: enum
      description: the unit doseAmount counts, when it differs from the plan
      values:
        - tablet
        - capsule
        - pill
        - click
        - pump
        - drop
        - spray
        - ml
        - injection
        - puff
        - application
        - gummy
        - piece
    details:
      type: markdown
      description: anything worth saying about this one dose, as prose
  edges:
    schedule:
      to: medicationschedule
      required: true
      ownerRef: true
      description: the schedule this dose belongs to
