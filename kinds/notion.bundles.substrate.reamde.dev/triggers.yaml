# The Notion bundle's delivery wiring — ordinary DATA records in the shipped
# automation authority (console-editable, changelog-visible, substratectl get/apply/
# delete like anything else). Two triggers drive the one sync function:
#
#   account(wants pages or databases, never synced) --workspacesync-->
#       page / database mirrors (+ the lastSyncedAt stamp)
#   hourly schedule --workspacesync--> the primary account when due by its
#       own cadence; any duplicate account row is stamped ignored (the
#       bundle is one-account-per-repository — one token, one workspace)
#
# The on-connect trigger fires ONCE per account — its `when` drops the moment
# the sync stamps lastSyncedAt. There is no OAuth "connected" moment under the
# token model, so the guard keys on the owner's toggles alone; an account
# created BEFORE the connector input resolves syncs nothing (the body logs and
# stamps nothing) and the hourly schedule picks it up once the token lands.
# The first backfill: an account that wants pages or databases and has never
# synced. Every optional property reads through the `in` idiom — CEL
# map-indexing an absent key throws, and toggles are absent until set, so an
# unguarded read would park the delivery instead of skipping it.
kind: core.substrate.reamde.dev/trigger
metadata: {id: notion-on-connect}
data:
  properties:
    enabled: true
    source:
      record:
        kinds: [notion.bundles.substrate.reamde.dev/account]
        ops: [create, update]
        when: >-
          record != null && (("enabledPages" in record.properties && record.properties.enabledPages
          == true) || ("enabledDatabases" in record.properties && record.properties.enabledDatabases
          == true)) && !("lastSyncedAt" in record.properties)
    callable: {kind: core.substrate.reamde.dev/function, id: notion.bundles.substrate.reamde.dev/workspacesync}
---
# The steady-state re-sync: an hourly tick fires the same function with no
# envelope record, so the body stamps any duplicate account rows and syncs
# the primary account when its own syncFrequency says it is due.
kind: core.substrate.reamde.dev/trigger
metadata: {id: notion-scheduled}
data:
  properties:
    enabled: true
    source:
      schedule:
        recurrence: "FREQ=HOURLY"
        timezone: Europe/London
        # A fixed past anchor, so every occurrence since is well-defined
        # (occurrences compute forward from startsAt).
        startsAt: "2025-01-06T09:30:00Z"
    callable: {kind: core.substrate.reamde.dev/function, id: notion.bundles.substrate.reamde.dev/workspacesync}
