# Shipped vocabulary ported from mneme v4: what was bought. An
# order's lifecycle is a state machine that stamps its own shipped and
# delivered times, so a status flip is never accompanied by a forgotten
# timestamp. The amount and its currency stay two properties: a joined
# "12.99 USD" string would be unfilterable and unsummable.
#
# `source: {to: any}` is the one untyped edge: an order is usually seen in
# an email or a message, and naming each would couple this authority to
# every other one.
#
# no new actors: writes arrive under the actor of whatever runs.
kind: core.substrate.reamde.dev/authority
metadata:
  id: commerce.substrate.reamde.dev
data:
  # version 2: THE TYPED CORE SWEEP. Declarations in this closure moved to the
  # declared spellings — whichever of them they used: a tool entry naming its arm,
  # a function's flat IO and hoisted grants, a mapping rule as `{path}`, an index
  # naming its properties. THE AUTHORITY IS VERSIONED AS A UNIT, so this bump
  # carries the closure whole rather than saying every declaration in it moved.
  # version 3: MONEY IS EXACT. totalAmount and unitPrice moved from float to
  # decimal, the exact string-carried number, before stored rows made the
  # move a migration. A repository that already holds float rows keeps the
  # version 2 declarations (the boot upgrade refuses the retype, loudly)
  # until the rows are rewritten or deleted.
  version: 3
---
# ---- the currency code, refined once and used by every money property -------
kind: core.substrate.reamde.dev/propertytype
metadata:
  id: commerce.substrate.reamde.dev/currency
data:
  authority: commerce.substrate.reamde.dev
  description: "an ISO 4217 currency code, three uppercase letters"
  base: string
  pattern: "^[A-Z]{3}$"
---
# ---- the bundle document: the import unit -----------------------------------
# A VOCABULARY bundle: kinds only, imported from the registry.
kind: core.substrate.reamde.dev/bundle
metadata:
  id: commerce.substrate.reamde.dev/commerce
data:
  authority: commerce.substrate.reamde.dev
  description: >-
    What was bought: orders whose lifecycle stamps its own shipped and delivered
    times, the items inside them, and an ISO 4217 currency type kept separate
    from the amount.
  installs:
    - commerce.substrate.reamde.dev/currency
    - commerce.substrate.reamde.dev/order
    - commerce.substrate.reamde.dev/orderitem
