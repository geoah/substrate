# Personal-domain vocabulary, ported from mneme v4: the things done on a
# schedule that are not calendar events. A routine is the generic recurring
# obligation (a chore, a habit, hygiene, taking out the bins); when it wraps
# something richer (a medication, a workout template, a project) the untyped
# `subject` edge points at it without coupling this authority to those.
#
# The recurrence stance is the substrate's: the RRULE is stored and never
# expanded, and an occurrence exists only when a routinelog marks it.
#
# no new actors: writes arrive under the actor of whatever runs.
kind: core.substrate.reamde.dev/authority
metadata:
  id: routines.substrate.geoah.me
data:
  version: v1alpha1
---
# ---- the bundle document: the import unit -----------------------------------
# A VOCABULARY bundle: kinds only, imported from the registry.
kind: core.substrate.reamde.dev/bundle
metadata: {id: routines.substrate.geoah.me/routines}
data:
  authority: routines.substrate.geoah.me
  description: >-
    The generic recurring obligation: routines with an RRULE and a time-of-day
    window, and the done-or-skipped log against each occurrence. Missed is
    computed from absence, never stored.
  installs:
    - routines.substrate.geoah.me/routine
    - routines.substrate.geoah.me/routinelog
