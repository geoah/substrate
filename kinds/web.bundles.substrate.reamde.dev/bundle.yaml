# The URL-harvester bundle — the substrate's shipped conformance example
# (substrate-primitives §8). It composes ONLY from the primitive set:
# bundle + kind + trait + function + agent + trigger + llmprovider. No workflow,
# connector, link, or reflection primitive appears anywhere — that is the whole
# point of the gate.
#
# Install:  substratectl apply -f bundle.yaml -f triggers.yaml
# Configure: create a config record (denyDomains + firecrawlKey); the
#   `connector` input resolves it: the sole record, the one named `default`,
#   or an explicitly bound one.
#
# This file is the SCHEMA closure (the atomic install unit). The delivery
# wiring lives beside it in triggers.yaml as ordinary data records.
#
# OUT OF THE STABLE SET (decision record 0015): this bundle is a worked
# example, not shipped vocabulary. Its declarations may change or leave
# without an upgrade path, and installing it accepts that. Nothing outside
# this directory declares against it.
# ---- the owned authority ------------------------------------------------------
# Every schema manifest declares INTO core; the authority it describes is
# metadata.id.
kind: core.substrate.reamde.dev/authority
metadata:
  id: web.bundles.substrate.reamde.dev
data:
  # version 2: THE TYPED CORE SWEEP. Declarations in this closure moved to the
  # declared spellings — whichever of them they used: a tool entry naming its arm,
  # a function's flat IO and hoisted grants, a mapping rule as `{path}`, an index
  # naming its properties. THE AUTHORITY IS VERSIONED AS A UNIT, so this bump
  # carries the closure whole rather than saying every declaration in it moved.
  # version 3: the built-ins are function records, so the two agents' tool
  # entries name them under `function:` like any other function.
  # version 4: the grants group under one `permissions:` object, and the permission
  # to write is `writes:` inside it. This closure's functions and agents
  # follow core's declaration.
  version: 5
---
# ---- the bundle document: the install unit --------------------------------
# `installs:` names EXACTLY the authority's schema members (every kind but the
# authority header, the actors and the bundle itself) — the loader holds the two
# equal both ways.
kind: core.substrate.reamde.dev/bundle
metadata:
  id: web.bundles.substrate.reamde.dev/web
data:
  authority: web.bundles.substrate.reamde.dev
  description: >-
    Harvests URLs out of any message, fetches each page, classifies it, and
    proposes reading-list and weekly-digest notes — the substrate's end-to-end
    conformance example.
  # The one declared input: the connector record the function bodies read.
  # `inject: functions` hands the resolved record (secrets resolved) to every
  # function invocation under config.inputs.connector.
  inputs:
    connector:
      kind: web.bundles.substrate.reamde.dev/config
      inject: functions
      description: the deny list, the fetch credential and the newest digest
  # The harvester subscribes to conversation messages (triggers.yaml), so the
  # messaging vocabulary has to be imported first.
  requires:
    - messaging.substrate.reamde.dev
  installs:
    - web.bundles.substrate.reamde.dev/config
    - web.bundles.substrate.reamde.dev/page
    - web.bundles.substrate.reamde.dev/findurls
    - web.bundles.substrate.reamde.dev/fetchpage
    - web.bundles.substrate.reamde.dev/setclass
    - web.bundles.substrate.reamde.dev/stampconfig
    - web.bundles.substrate.reamde.dev/pageclassifier
    - web.bundles.substrate.reamde.dev/readinglistagent
    - web.bundles.substrate.reamde.dev/weeklyrollup
---
# ---- the config type: the `connector` input's kind ------------------------
# denyDomains gates the harvester; firecrawlKey is the (unused-in-this-stub)
# fetch credential, carried as a secret so it never reads back. Records of
# this kind are ordinary (any number may exist); the bundle's `connector`
# input picks the one the functions see.
kind: core.substrate.reamde.dev/kind
metadata:
  id: web.bundles.substrate.reamde.dev/config
data:
  authority: web.bundles.substrate.reamde.dev
  description: >-
    This bundle's configuration record: the URL substrings that are never
    harvested, the page-fetch credential, and the newest weekly digest a rollup
    produced.
  names:
    singular: config
    plural: configs
  properties:
    denyDomains:
      type: string
      repeated: true
      description: a URL containing any of these substrings is never harvested
    firecrawlKey:
      type: secret
      description: the page-fetch API key (placeholder — the stub fetch uses
        none)
    lastDigest:
      type: string
      description: the newest weekly digest text, filled when a rollup is
        accepted
---
# ---- the page record type -------------------------------------------------
# `title` is the reserved built-in (fetchpage writes it); `source` is a
# `to: any` edge back at whatever message carried the URL.
kind: core.substrate.reamde.dev/kind
metadata:
  id: web.bundles.substrate.reamde.dev/page
data:
  authority: web.bundles.substrate.reamde.dev
  description: >-
    One harvested web page: where it came from, the fetched markdown, the
    classifier's verdict and whether a reading-list proposal for it was accepted.
    Its id is a hash of the URL, so re-harvesting updates one row.
  names:
    singular: page
    plural: pages
  properties:
    url:
      type: string
      description: the harvested URL — the page id is host.ids.url(url), a
        hash of it
    content:
      type: string
      description: the fetched page as markdown
    class:
      type: string
      description: the classifier's verdict (article | tool | video)
    fetch:
      type: string
      description: pending | fetched | failed
    saved:
      type: bool
      description: set true when an accepted reading-list proposal lands
  edges:
    source:
      to: any
      description: the record a URL was harvested from
---
# ---- function: findurls ---------------------------------------------------
# Walks every string property of the triggering record, extracts URLs, honors
# denyDomains from the injected `connector` input, and mints one pending page
# per allowed URL with put-if-absent — so re-feeding the same message re-mints
# nothing. The input arrives injected (config.inputs.connector); an unresolved
# input's key is simply absent and the deny list falls back empty.
kind: core.substrate.reamde.dev/function
metadata:
  id: web.bundles.substrate.reamde.dev/findurls
data:
  authority: web.bundles.substrate.reamde.dev
  description: Extract every URL from the triggering record and mint pending
    pages.
  runtime: python
  permissions:
    writes: [web.bundles.substrate.reamde.dev/page]
  source: |
    import re

    _URL = re.compile(r'https?://[^\s)>\]"\'<]+')

    def main(input, host):
        env = input.get("envelope") or {}
        record = env.get("record") or {}
        change = env.get("change") or {}
        cfg = (((input.get("config") or {}).get("inputs") or {}).get("connector") or {}).get("properties") or {}
        deny = cfg.get("denyDomains") or []
        msg_id = record.get("id")
        # The page.source edge is `to: any`, which needs the full reference:
        # {kind, id}, exactly like every host.effects.* / host.records.*
        # argument. The delivery envelope carries the kind whole — `change.kind`
        # is the record's kind REFERENCE, authority included, and there is no
        # second field beside it — so the reference is a straight copy.
        source_ref = {"kind": change.get("kind") or "", "id": msg_id}
        # The buffered-effects builder: each put is STAGED (host.effects.put),
        # not written mid-body — the runner returns the buffer as this
        # delivery's effect list, applied atomically. `if_absent` makes each
        # page create-only, so re-feeding the same message re-mints nothing.
        seen = set()
        minted = 0
        for value in (record.get("properties") or {}).values():
            if not isinstance(value, str):
                continue
            for url in _URL.findall(value):
                if any(d and d in url for d in deny):
                    host.log("denied " + url)
                    continue
                # host.ids.url hashes the exact URL: no truncated-slug collision
                # (two long URLs sharing a 120-char prefix once collapsed to one
                # page id, and if_absent silently dropped the second).
                pid = host.ids.url(url)
                if pid in seen:
                    continue
                seen.add(pid)
                host.effects.put(
                    "web.bundles.substrate.reamde.dev/page", pid,
                    properties={"url": url, "fetch": "pending"},
                    edges={"source": source_ref}, if_absent=True)
                minted += 1
        return {"output": {"minted": minted}}
---
# ---- function: fetchpage --------------------------------------------------
# Reads a pending page's url, produces markdown (STUB — deterministic, no
# network so tests never touch the wire), and marks the page fetched.
kind: core.substrate.reamde.dev/function
metadata:
  id: web.bundles.substrate.reamde.dev/fetchpage
data:
  authority: web.bundles.substrate.reamde.dev
  description: Fetch one pending page as markdown and mark it fetched.
  runtime: python
  permissions:
    writes: [web.bundles.substrate.reamde.dev/page]
  source: |
    def main(input, host):
        env = input.get("envelope") or {}
        page = env.get("record") or {}
        props = page.get("properties") or {}
        url = props.get("url", "")
        slug = url.rstrip("/").split("/")[-1] or url
        title = slug.replace("-", " ").replace("_", " ").strip() or url
        markdown = "# " + title + "\n\nfetched from " + url + " (stub markdown)"
        host.effects.patch(
            "web.bundles.substrate.reamde.dev/page", page.get("id"),
            properties={"title": title, "content": markdown, "fetch": "fetched"})
        return {"output": {"page": page.get("id")}}
---
# ---- function: setclass ---------------------------------------------------
# The classifier agent's write hand: a direct patch of page.class. An agent
# has no generic patch built-in, so a direct write is a function tool.
kind: core.substrate.reamde.dev/function
metadata:
  id: web.bundles.substrate.reamde.dev/setclass
data:
  authority: web.bundles.substrate.reamde.dev
  description: Set a page's class. Call with {id, class}.
  runtime: python
  arguments:
    - name: id
      type: string
      required: true
      description: the page id
    - name: class
      type: string
      required: true
      description: article | tool | video
  permissions:
    writes: [web.bundles.substrate.reamde.dev/page]
  source: |
    def main(input, host):
        args = input.get("args") or {}
        pid = args["id"]
        cls = args.get("class") or "article"
        host.effects.patch("web.bundles.substrate.reamde.dev/page", pid, properties={"class": cls})
        return {"output": {"page": pid, "class": cls}}
---
# ---- function: stampconfig ------------------------------------------------
# The reading-list agent's DIRECT config-write hand — a patch of the bundle
# config. It exists to prove the emit ceiling NEGATIVELY: the reading-list
# agent declares config in its own emit and carries this tool, but when it
# runs as the classifier's sub-agent its effective emit is its own ∩ the
# classifier's (which names only page + recordpatchrequest), so config is
# refused and nothing lands. Delegation can only narrow.
kind: core.substrate.reamde.dev/function
metadata:
  id: web.bundles.substrate.reamde.dev/stampconfig
data:
  authority: web.bundles.substrate.reamde.dev
  description: Stamp the bundle config directly. Call with {id}.
  runtime: python
  arguments:
    - name: id
      type: string
      required: true
      description: the config record id
  permissions:
    writes: [web.bundles.substrate.reamde.dev/config]
  source: |
    def main(input, host):
        args = input.get("args") or {}
        cid = args["id"]
        return {
            "effects": [{
                "action": "patch",
                "kind": "web.bundles.substrate.reamde.dev/config", "id": cid,
                "properties": {"lastDigest": "stamped directly by the reading-list agent"},
            }],
            "output": {"config": cid},
        }
---
# ---- agent: pageclassifier ------------------------------------------------
# Triggers on a fetched, unclassified page. Patches the class through the
# setclass tool, then routes to the reading-list sub-agent. Its emit must also
# name recordpatchrequest so the sub-agent's propose survives the emit ceiling
# (a child's effective emit is its own ∩ the caller's).
kind: core.substrate.reamde.dev/agent
metadata:
  id: web.bundles.substrate.reamde.dev/pageclassifier
data:
  authority: web.bundles.substrate.reamde.dev
  description: Classify a fetched page and route it to the reading-list agent.
  prompt: |
    You are the page classifier. Read the page in the first message, decide
    whether it is an article, a tool, or a video, set its class with the
    setclass tool, then hand the page to the reading-list agent.
  provider: default
  model: anthropic/claude-opus-5
  tools:
    - function: web.bundles.substrate.reamde.dev/setclass
  agents: [web.bundles.substrate.reamde.dev/readinglistagent]
  budgets:
    maxTurns: 4
    maxToolCalls: 8
    depth: 3
  permissions:
    writes:
      - web.bundles.substrate.reamde.dev/page
      - core.substrate.reamde.dev/recordpatchrequest
---
# ---- agent: readinglistagent (sub-agent) ----------------------------------
# Proposes a recordpatchrequest that marks the page saved. The owner decides;
# accepting is what applies the patch.
kind: core.substrate.reamde.dev/agent
metadata:
  id: web.bundles.substrate.reamde.dev/readinglistagent
data:
  authority: web.bundles.substrate.reamde.dev
  description: Propose adding a classified page to the owner's reading list.
  prompt: |
    You maintain the reading list. Propose a patch that sets the page's `saved`
    property to true, with a short rationale — address the page by full
    identity: type web.bundles.substrate.reamde.dev/page plus its target id. Do not write
    directly. You also carry a stampconfig tool, but under a caller whose emit
    does not name config it will be refused — propose instead.
  provider: default
  model: anthropic/claude-sonnet-5
  tools:
    - function: core.substrate.reamde.dev/propose
    - function: web.bundles.substrate.reamde.dev/stampconfig
  budgets:
    maxTurns: 4
    maxToolCalls: 4
    depth: 3
  permissions:
    writes:
      - core.substrate.reamde.dev/recordpatchrequest
      - web.bundles.substrate.reamde.dev/config
---
# ---- agent: weeklyrollup (schedule-fired) ---------------------------------
# Reads the week's pages and proposes a digest note (a patch of the config's
# lastDigest). Fired by a schedule trigger, not by a changelog row.
kind: core.substrate.reamde.dev/agent
metadata:
  id: web.bundles.substrate.reamde.dev/weeklyrollup
data:
  authority: web.bundles.substrate.reamde.dev
  description: Summarize the pages harvested this week and propose a digest.
  prompt: |
    You write the weekly digest. Read the fetched pages, summarize them, and
    propose a patch that stores the summary as the config's lastDigest —
    address the config by full identity (type web.bundles.substrate.reamde.dev/config
    plus its target id); reads name a type beside the id too.
  provider: default
  model: anthropic/claude-haiku-4-5
  tools:
    - function: core.substrate.reamde.dev/query
    - function: core.substrate.reamde.dev/propose
  permissions:
    reads:
      kinds: [web.bundles.substrate.reamde.dev/page]
    writes: [core.substrate.reamde.dev/recordpatchrequest]
  budgets:
    maxTurns: 6
    maxToolCalls: 16
    depth: 3
