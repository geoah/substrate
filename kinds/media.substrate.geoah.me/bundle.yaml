# The shipped vocabulary, subsystem 5: what you read, watch and listen to.
# Shipped, but not SEEDED — a VOCABULARY BUNDLE a repository imports (the
# bundle document is at the foot of this file), and it requires people.
# Bare, not `.app.`: under R1's shoebox test a shelf of books and a wall of
# films is life, not an application — the same call `calendar` gets. The
# systems that actually fill it are the model here (Audiobookshelf for books,
# audiobooks and podcasts; Sonarr for television; Radarr for film), but they
# are connectors, and a connector's own bookkeeping stays in its own authority.
#
# The authority is OURS — a bare label under the org domain — even though it
# arrives by install: the binary publishes it and the registry only delivers
# it. R9's "an app installs its own authority" is witnessed by an EXTENSION
# bundle instead (`google.bundles.substrate.reamde.dev`), whose categorized authority says
# an installer put it there.
#
# Roles live on edges, never on a second kind of person: author, narrator,
# director, cast, artist and host all point at `people.substrate.geoah.me/person`;
# publisher, studio, network and label at `people.substrate.geoah.me/organization`.
# Which of the four an organization is depends only on the edge pointing at
# it.
#
# ONE family here is two types. `book` is the work — what an author wrote —
# and `bookedition` is the printing you actually hold, pointing at its work
# through an edge its recordmapping names (§6.1). Editions are vocabulary, not
# connector plumbing: the paperback on your shelf is yours whether or not
# anything ever syncs. Films, television, music and podcasts stay ONE type
# each, deliberately: their public identifiers are work-level (TMDb names the
# film, TVDb the episode, MusicBrainz the recording), so there is no edition
# distinction to model and inventing one would buy nothing. Split them only
# when a real second layer shows up — a specific pressing, a specific cut.
#
# Catalogue identifiers are ordinary properties where a reader wants to see
# one (`isbn`, `asin`), and nothing matches on their values. A synced record's
# id is the provider's own key, supplied by the connector that writes it, so a
# re-sync overwrites the same row. `book` is the exception in this authority:
# editions map onto it, so its id is always server-assigned.
#
# Almost nothing here carries a displayTemplate: these all have real titles
# and the writer's title stands (§5). The two collection types are the
# exception — a series or a franchise is named, not titled, so `name` is a
# property and the title derives from it.
#
# PARKED, recorded here because the evidence is in the files: `description`
# repeats across all six families below, `mediaRef`, `duration` and `coverRef`
# across five each. That is the case for a shared `media` trait plus a
# consumption lifecycle (want → started → finished → abandoned), and both are
# the owner's call, parked, not designed here. The repetition is deliberately
# left visible: it is the argument for building them, and hiding it behind a
# premature abstraction would destroy the only evidence anyone has.
# The work/edition split settles one question about that lifecycle in
# advance: it attaches to the WORK, not the edition. You finished the book;
# which edition you happened to finish it in is an edition fact (`format`,
# `duration`), not the thing you want to ask about later.
#
# no new actors: the doors and the substrate ship with core; a connector's
# writes arrive under the actor of whatever runs — a bundle function writes as
# `function:<name>` — so nothing here declares an actor.
kind: core.substrate.reamde.dev/authority
metadata:
  id: media.substrate.geoah.me
data:
  version: v1alpha1
---
# Amazon's audiobook identifier, as it is printed on an Audible edition
kind: core.substrate.reamde.dev/propertytype
metadata:
  id: media.substrate.geoah.me/asin
data:
  authority: media.substrate.geoah.me
  description: "Amazon's audiobook identifier, as printed on an Audible edition"
  base: string
  pattern: "^B0[A-Z0-9]{8}$"
---
# normalized and hyphen-free: ISBN-10 (X is a legal check digit) or ISBN-13
kind: core.substrate.reamde.dev/propertytype
metadata:
  id: media.substrate.geoah.me/isbn
data:
  authority: media.substrate.geoah.me
  description: "ISBN-10 or ISBN-13, normalized and hyphen-free"
  base: string
  pattern: "^(97[89])?[0-9]{9}[0-9X]$"
---
# ---- the bundle document: the import unit -------------------------------------
# A VOCABULARY bundle (see people.substrate.geoah.me): kinds, two property types and
# the work/edition mapping, imported from the registry rather than seeded.
# Authors, narrators, publishers and labels are people and organizations, so
# it requires that authority to be present first.
kind: core.substrate.reamde.dev/bundle
metadata: {id: media.substrate.geoah.me/media}
data:
  authority: media.substrate.geoah.me
  description: >-
    What you read, watch and listen to — books and their editions, films,
    television, music and podcasts, with roles carried on edges into people.
  requires:
    - people.substrate.geoah.me
  installs:
    - media.substrate.geoah.me/asin
    - media.substrate.geoah.me/book
    - media.substrate.geoah.me/bookedition
    - media.substrate.geoah.me/bookeditionwork
    - media.substrate.geoah.me/bookseries
    - media.substrate.geoah.me/isbn
    - media.substrate.geoah.me/movie
    - media.substrate.geoah.me/moviecollection
    - media.substrate.geoah.me/musicalbum
    - media.substrate.geoah.me/musictrack
    - media.substrate.geoah.me/podcast
    - media.substrate.geoah.me/podcastepisode
    - media.substrate.geoah.me/tvepisode
    - media.substrate.geoah.me/tvseason
    - media.substrate.geoah.me/tvseries
