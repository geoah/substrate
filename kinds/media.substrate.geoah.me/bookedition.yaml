# one edition of a book: the paperback on the shelf, the Audible download, the
# epub. Vocabulary, not connector plumbing — you own the paperback whether or
# not anything ever syncs.
kind: core.substrate.reamde.dev/kind
metadata:
  id: media.substrate.geoah.me/bookedition
data:
  authority: media.substrate.geoah.me
  description: >-
    One edition of a book: the paperback on the shelf, the epub, the
    Audible download. It carries what belongs to a copy rather than to the
    work — ISBN, ASIN, language, pages, playback length — and you own it
    whether or not anything ever syncs.
  names:
    singular: bookedition
    plural: bookeditions
  properties:
    format:
      type: enum
      values:
        - print
        - ebook
        - audiobook
      description: which files exist — print, ebook or audiobook
    # the printed ISBN and Audible's ASIN, as ordinary properties for display
    # and for hand-written rows: nothing matches on their values.
    asin:
      type: asin
      description: Amazon's identifier for this edition
    isbn:
      type: isbn
      description: the printed ISBN, hyphen-free
    language:
      type: string
      description: the edition's language
    publishedAt:
      type: date
      description: when this edition came out
    pageCount:
      type: int
      description: pages; print and ebook editions
    # audiobook editions only
    duration:
      type: duration
      description: playback length; audiobook editions only
    abridged:
      type: bool
      description: whether the audio edition is abridged
    mediaRef:
      type: url
      description: where the edition's files live
    coverRef:
      type: url
      description: the cover image
    # Reserved for writeback: designed, not enabled. `etag` is the provider's
    # version token, `raw` the provider's record as last seen — CardDAV-style
    # round-trip safety, so a future push edits a payload it can still
    # recognize. Nothing writes them today; no write path, no scope change,
    # no consent UI ships with this build.
    etag:
      type: string
      description: the provider's version token, reserved for writeback
    raw:
      type: json
      description: the provider's record as last seen, reserved for writeback
  edges:
    # the subject edge: an ordinary declaration — the mapping below is what
    # names it (§6.1). Required, single target, never `ownerRef` — deleting a
    # work must not GC its editions — and only create-time linking, merge and
    # split may move it.
    work:
      to: book
      required: true
      description: the work this edition is a printing of
    narrator:
      to: person
      many: true
      description: who reads the audio edition
    publisher:
      to: organization
      description: the organization that published it
---
# the edition→work mapping (record 50): link-only. No match — nothing probes
# a work out of edition properties — and an empty map: the two types share
# nothing to manage yet. The mapping still makes bookedition a source record,
# so a work's id stays server-assigned and the edge moves only by merge and
# split.
kind: core.substrate.reamde.dev/recordmapping
metadata:
  id: media.substrate.geoah.me/bookeditionwork
data:
  authority: media.substrate.geoah.me
  from: media.substrate.geoah.me/bookedition
  to: media.substrate.geoah.me/book
  edge: work
