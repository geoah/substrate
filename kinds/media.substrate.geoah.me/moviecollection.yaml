# what Radarr calls "belongs to collection": a franchise, not a shelf
kind: core.substrate.reamde.dev/kind
metadata:
  id: media.substrate.geoah.me/moviecollection
data:
  authority: media.substrate.geoah.me
  description: >-
    A franchise — what Radarr calls "belongs to collection". Films point
    at it, and it holds nothing but a name and a blurb: it is a grouping
    the catalogue asserts, not a shelf you curate.
  names:
    singular: moviecollection
    plural: moviecollections
  displayTemplate: "{name}"
  properties:
    name:
      type: string
      description: the franchise's name
    description:
      type: markdown
      embed: true
      description: what the franchise is, as prose
