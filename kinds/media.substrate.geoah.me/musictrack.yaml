# one track on an album — the recording, the performance itself
kind: core.substrate.reamde.dev/kind
metadata:
  id: media.substrate.geoah.me/musictrack
data:
  authority: media.substrate.geoah.me
  description: >-
    One track on an album — the recording itself, with its number, its
    playback length and where the file lives. Its artist edge is separate
    from the album's, which is what makes compilations come out right.
  names:
    singular: musictrack
    plural: musictracks
  properties:
    number:
      type: int
      description: the track number on its album
    duration:
      type: duration
      description: the playback length
    mediaRef:
      type: url
      description: where the file lives
  edges:
    album:
      to: musicalbum
      required: true
      ownerRef: true
      description: the album the track is on
    # the track artist is its own edge: a compilation's tracks do not share
    # the album's artist.
    artist:
      to: person
      many: true
      description: the track artist; not always the album's
