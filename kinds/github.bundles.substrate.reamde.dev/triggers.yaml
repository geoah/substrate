# The GitHub bundle's delivery wiring — ordinary DATA records in the shipped
# automation authority (console-editable, changelog-visible, substratectl get/apply/
# delete like anything else). Two triggers drive the one sync function:
#
#   account(connected, a feature on, never synced)  --sync-->
#       user / repository / issue / pullrequest
#       mirrors  (+ the syncCursor / lastSyncedAt stamp)
#   hourly schedule  --sync-->  every due, connected account
#
# The on-connect trigger is guarded to fire ONCE per account — its `when`
# drops the moment the sync stamps lastSyncedAt, so the account's own
# watermark patch cannot re-trigger it. Steady-state re-syncs come from the
# schedule, which honors each account's syncFrequency.
# The first backfill: an account whose OAuth just landed (tokenStatus
# connected), that has at least one feature enabled, and that has never
# synced yet.
kind: core.substrate.reamde.dev/trigger
metadata: {id: github-on-connect}
data:
  properties:
    enabled: true
    source:
      record:
        kinds: [github.bundles.substrate.reamde.dev/account]
        ops: [create, update]
        # Every optional property is read through the `in` idiom: tokenStatus
        # (writer: oauth) and the feature toggles are ABSENT on a
        # freshly-created account (pre-OAuth), and CEL map-indexing an absent
        # key throws — an unguarded read would park the delivery ("no such
        # key: tokenStatus") instead of skipping it. The short-circuit `&&`
        # means the value read only runs once its key is proven present.
        when: >-
          record != null && "tokenStatus" in record.properties && record.properties.tokenStatus
          == "connected" && (("enabledUser" in record.properties && record.properties.enabledUser
          == true) || ("enabledRepos" in record.properties && record.properties.enabledRepos
          == true) || ("enabledIssues" in record.properties && record.properties.enabledIssues
          == true) || ("enabledPullRequests" in record.properties && record.properties.enabledPullRequests
          == true)) && !("lastSyncedAt" in record.properties)
    callable: {kind: core.substrate.reamde.dev/function, id: github.bundles.substrate.reamde.dev/githubsync}
---
# The steady-state re-sync: an hourly tick fires the same function with no
# envelope record, so the body iterates every connected, feature-enabled
# account and syncs the ones due by their own syncFrequency.
kind: core.substrate.reamde.dev/trigger
metadata: {id: github-scheduled}
data:
  properties:
    enabled: true
    source:
      schedule:
        recurrence: "FREQ=HOURLY"
        timezone: Europe/London
        # A fixed past anchor, so every occurrence since is well-defined
        # (occurrences compute forward from startsAt).
        startsAt: "2025-01-06T09:30:00Z"
    callable: {kind: core.substrate.reamde.dev/function, id: github.bundles.substrate.reamde.dev/githubsync}
