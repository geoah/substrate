# The shipped vocabulary, subsystem 4: what is owed. Shipped, but not SEEDED —
# a VOCABULARY BUNDLE a repository imports (the bundle document is at the foot
# of this file). Small on purpose — a task, the thing it groups under, and
# the log that marks a recurring task's occurrences off.
#
# `source: {to: any}` is untyped for the usual reason: a task can come from
# a message, a mail, an event or a transcript, and naming each would make
# this authority depend on every other one.
#
# no new actors: the doors and the substrate ship with core; an installed
# authority's writes arrive under the actor of whatever runs — a bundle
# function writes as `function:<authority>:<name>` — so nothing here declares
# an actor.
kind: core.substrate.reamde.dev/authority
metadata:
  id: tasks.substrate.reamde.dev
data:
  # version 2: THE TYPED CORE SWEEP. Declarations in this closure moved to the
  # declared spellings — whichever of them they used: a tool entry naming its arm,
  # a function's flat IO and hoisted grants, a mapping rule as `{path}`, an index
  # naming its properties. THE AUTHORITY IS VERSIONED AS A UNIT, so this bump
  # carries the closure whole rather than saying every declaration in it moved.
  #
  # version 3: the settled state vocabulary (decision record 0013). The task's
  # `dropped` is `abandoned`, matching project, and the tasklog's `completed`
  # is `done`, matching the task's own terminal state.
  # version 4: `tasklog` binds `occurrencelog`. The `task` kind pins its own
  # version for its `recurring` binding (#122).
  version: 5
---
# ---- the bundle document: the import unit -------------------------------------
# A VOCABULARY bundle (see people.substrate.reamde.dev): kinds only, imported from the
# registry rather than seeded. The assignee edge lands on person, so it
# requires that authority to be present first.
kind: core.substrate.reamde.dev/bundle
metadata:
  id: tasks.substrate.reamde.dev/tasks
data:
  authority: tasks.substrate.reamde.dev
  description: >-
    Tasks and the projects they sit under — what is owed, with priority, an
    optional repeat rule marked off by tasklogs, and the untyped `source`
    edge back to whatever asked for it.
  requires:
    - people.substrate.reamde.dev
    - scheduling.substrate.reamde.dev
  installs:
    - tasks.substrate.reamde.dev/project
    - tasks.substrate.reamde.dev/task
    - tasks.substrate.reamde.dev/tasklog
