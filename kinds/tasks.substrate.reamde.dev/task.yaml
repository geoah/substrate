# something to do
kind: core.substrate.reamde.dev/kind
metadata:
  id: tasks.substrate.reamde.dev/task
data:
  authority: tasks.substrate.reamde.dev
  description: >-
    Something to do, however it arrived: typed by hand, projected from a Linear
    issue, or proposed by an agent. Status carries the whole lifecycle — a
    proposal waits for the owner, an open task is due, and completing it stamps
    the time by itself.
  # The declaration inherited the authority's version before this pin.
  # version 3: `completedAt` is a declared property (datetime). The done
  # transition stamped it as an undeclared string before.
  # version 4: `name` is the heading, declared. A task used to hold it in the
  # built-in title slot, which is not a kind's storage (#123).
  # version 5: binds the `recurring` trait, which contracts the
  # recurrence/exdates/timezone triple this kind already declared (#122).
  # version 7: `rdates` lands with the `recurring` trait's move.
  # version 8: `project`, `assignee` and `source` are reference properties
  # now, each with `mustExist: true`.
  version: 8
  names:
    singular: task
  traits:
    - "temporal(point: dueAt)"
    - recurring
  # `title` is the LEGACY alternative, not a second spelling to write: tasks
  # written before `name` existed hold their heading in the built-in title
  # column, and reading it keeps them titled instead of blanking them on their
  # next write. Decision record 0016 has what that costs; it goes when the
  # column does (#68).
  displayTemplate: "{name|title}"
  # the one query the console and every agent make: what is open, soonest
  # first. `status` sits in `properties` like every other value, so it
  # indexes like any other one.
  indices:
    - properties:
        - status
        - dueAt
  properties:
    # what to do, in one line. Optional rather than required because the
    # tasks a repository already holds have no `name` to be required of
    # them, and requiring one is a narrowing the upgrade would refuse.
    name:
      type: string
      description: the task's heading, one line
    # the same prose slot every other authority calls `description`.
    description:
      type: markdown
      embed: true
      description: what the task involves, as prose
    # where the task lives outside the substrate — the GitHub issue, the
    # ticket, the thread. The `source` reference names the rep record; this
    # is the provider's own link, so a client can jump straight out.
    url:
      type: url
      description: where this task lives outside the substrate
    priority:
      type: enum
      description: how urgent it is, mirroring the common tracker ladder
      default: none
      values:
        - none
        - low
        - medium
        - high
        - urgent
    # a repeating task: the rule seeds off dueAt and the substrate never
    # expands it. An occurrence exists only when a tasklog marks it, so
    # missed is computed from absence, exactly as the mneme-ported logs
    # do it.
    recurrence:
      type: recurrence
      description: the RRULE seeded off dueAt, stored and never expanded
    exdates:
      type: datetime
      repeated: true
      description: occurrence datetimes the rule skips
    rdates:
      type: datetime
      repeated: true
      description: extra occurrence datetimes beside the rule (iCalendar's
        RDATE)
    timezone:
      type: timezone
      description: the IANA zone a time-of-day rule resolves in
    # a learner's proposals are created `proposed` and wait for the owner;
    # a write that names no state gets `open`. `completedAt` is stamped by
    # the transition, so nothing has to remember to set it.
    status:
      type: state
      description: "proposed waits for the owner; open until done or abandoned"
      states:
        - proposed
        - open
        - done
        - abandoned
      initial: open
      transitions:
        - from: proposed
          to: open
        - from: proposed
          to: abandoned
        - from: open
          to: done
          stamps:
            completedAt: now
        - from: done
          to: open
    # Stamped by the done transition above. Not managed: an importer creating
    # a task already done supplies its own time.
    completedAt:
      type: datetime
      description: when the task was done, stamped by the transition
    project:
      type: reference
      kind: project
      mustExist: true
      description: the project this task groups under
    assignee:
      type: reference
      kind: person
      mustExist: true
      description: the person the task is on; absent means the owner
    source:
      type: reference
      mustExist: true
      description: the message, mail, event or transcript the task came from
