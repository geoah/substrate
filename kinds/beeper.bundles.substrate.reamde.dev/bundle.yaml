# The Beeper bundle — the substrate's first NON-OAUTH connector.
#
# Beeper is a Matrix homeserver: the credential is a pasted access token, not
# an OAuth grant, so this bundle carries NO `oauth2:` manifest block and its
# config type wears NO oauth2 trait. It composes from the same primitive set
# as the Google bundle — bundle + kind + function + trigger — and proves
# the OTHER credential path the runner supports: a connector's OWN config
# secrets (an apiToken it needs to call its provider) ARE injected by the
# runner and scrubbed from what it returns.
#
# SYNC-ONLY: this bundle reads rooms and messages. It never sends — outbound
# needs the outbox contract (issue 009), which is pending. See README.md.
#
# Install:   substratectl apply -f bundle.yaml -f triggers.yaml
# Configure: create a config record — the homeserver base URL and the
#   pasted access token; the `connector` input resolves it (sole record,
#   the one named `default`, or a bound one). The token lives HERE, not on
#   the account, by engine necessity: every secret-typed property on an
#   accountconfig-trait type is AEAD-sealed at the storage boundary
#   (write.go sealSecretProps, review-google #3) and the runner injects
#   account properties AS STORED — an account-held token would reach the
#   sync body as ciphertext. An injected input's own secret arrives usable
#   (and the invocation scrubber holds it to the runner boundary). One
#   consequence: ONE Beeper account per repository — and the sync ENFORCES
#   it (fleet F8): only the lexicographically-first live account syncs; any
#   other live account row is stamped `syncStatus: ignored: duplicate
#   account …`.
# Connect:   create an account (your @user id, enabledMessages: true).
#   No OAuth flow: the on-connect trigger fires straight off the create.
# ---- the owned authority ------------------------------------------------------
kind: core.substrate.reamde.dev/authority
metadata:
  id: beeper.bundles.substrate.reamde.dev
data:
  # version 2: THE TYPED CORE SWEEP. Declarations in this closure moved to the
  # declared spellings — whichever of them they used: a tool entry naming its arm,
  # a function's flat IO and hoisted grants, a mapping rule as `{path}`, an index
  # naming its properties. THE AUTHORITY IS VERSIONED AS A UNIT, so this bump
  # carries the closure whole rather than saying every declaration in it moved.
  # version 3: the grants group under one `permissions:` object, and the permission
  # to write is `writes:` inside it. This closure's functions and agents
  # follow core's declaration.
  # version 5: `account` on every mirror kind is a pinned owner
  # reference instead of a string, so disconnecting an account collects
  # the rows it synced (docs/decisions/0032).
  # version 6: the sync function's `permissions.network` drops the
  # `beeper.com/*` glob for the bare host `beeper.com`, the form the network
  # grammar admits (docs/decisions/0038).
  # version 8: the inline functions' `timeoutMs` (int ms) is `timeout`, the
  # duration datatype (ISO 8601); the retype rides core's function kind bump.
  # version 9: `message.room` is a `type: reference` property with
  # `mustExist: true`, and every owning reference in this closure carries
  # `onDelete: cascade`.
  version: 9
---
# ---- the bundle document: the install unit --------------------------------
# NO `oauth2:` block — an oauth2 block would demand a client input, and this
# bundle authenticates with a pasted token, so the manifest stays
# credential-flow-free and StartOAuth refuses the authority.
kind: core.substrate.reamde.dev/bundle
metadata:
  id: beeper.bundles.substrate.reamde.dev/beeper
data:
  authority: beeper.bundles.substrate.reamde.dev
  description: >-
    Connects a Beeper (Matrix) account with a pasted access token and mirrors
    its bridged rooms and messages into the graph — sync-only, no sending.
  # The one declared input: the connector record the sync body reads.
  # `inject: functions` hands the resolved record (token in plaintext inside
  # the runner boundary) to every invocation under config.inputs.connector.
  inputs:
    connector:
      kind: beeper.bundles.substrate.reamde.dev/config
      inject: functions
      description: the Beeper homeserver URL and the pasted access token
  installs:
    - beeper.bundles.substrate.reamde.dev/config
    - beeper.bundles.substrate.reamde.dev/account
    - beeper.bundles.substrate.reamde.dev/room
    - beeper.bundles.substrate.reamde.dev/message
    - beeper.bundles.substrate.reamde.dev/messagessync
---
# ---- the config type: the `connector` input's kind -------------------------
# NOT oauth2: there is no client id/secret pair and no host-run flow. The
# access token is the connector's OWN provider credential, secret-typed and
# owner-written: redacted on every read surface, blank-on-edit, injected into
# the sync body's config and scrubbed from everything that leaves the runner.
# It sits on THIS type (not the account) because a non-accountconfig kind
# stores it un-sealed and the injected input hands it over usable — see the
# header note.
kind: core.substrate.reamde.dev/kind
metadata:
  id: beeper.bundles.substrate.reamde.dev/config
data:
  authority: beeper.bundles.substrate.reamde.dev
  description: >-
    The Beeper homeserver and the Matrix access token this bundle spends,
    the record the bundle's connector input resolves. The token is owner-written
    and origin-pinned: it travels to a beeper.com host over https and nowhere
    else.
  names:
    singular: config
  displayTemplate: "Beeper at {homeserverUrl}"
  properties:
    homeserverUrl:
      type: url
      writer: owner
      displayName: Homeserver URL
      # Origin-pinned (fleet F1): the body refuses to send the token anywhere
      # except https on a beeper.com host, or loopback (the test seam).
      description: "the Matrix homeserver base URL, defaulting to https://matrix.beeper.com
        — must be https on a beeper.com host (or loopback for tests); the
        token goes nowhere else"
    accessToken:
      type: secret
      writer: owner
      displayName: Access token
      description: "the pasted Beeper access token (bbctl or Beeper Desktop)
        — redacted on read, injected only into the sync body and scrubbed
        on the way out"
---
# ---- the account type: one connected Beeper account ------------------------
# accountconfig WITHOUT oauth2 — the non-OAuth shape this bundle exists to
# prove. The trait still contracts tokenRef/tokenStatus/grantedScopes onto the
# type (schema loader, trait property contracts), so they are declared below
# as DORMANT: writer: oauth means only the OAuth facility may ever set them,
# and no OAuth flow runs for this bundle, so they stay absent for the row's
# whole life. The trigger therefore gates on the owner's toggle plus the
# connector's own completion marker, never on tokenStatus.
kind: core.substrate.reamde.dev/kind
metadata:
  id: beeper.bundles.substrate.reamde.dev/account
data:
  authority: beeper.bundles.substrate.reamde.dev
  description: >-
    One connected Beeper account: the owner's sync toggles and the connector's
    own progress. The account trait's OAuth hands are declared but stay dormant,
    since no OAuth flow ever runs for this bundle.
  names:
    singular: account
  traits: [accountconfig]
  displayTemplate: "{userId}"
  properties:
    # Who this account is — informational, typed by the owner (nothing
    # verifies it against the token; the sync never needs it).
    userId:
      type: string
      writer: owner
      displayName: User ID
      description: "the account's Matrix id, e.g. @you:beeper.com"
    # The owner's hands: the sync gate and the room filter.
    enabledMessages:
      type: bool
      writer: owner
      displayName: Messages
      description: sync this account's bridged rooms and messages
    roomFilter:
      type: string
      writer: owner
      displayName: Room filter
      # Evaluated against the stored mirror when an incremental delta omits
      # the fields, so a partial /sync never drops a matching room (P1).
      description: "optional case-insensitive substring a room's name or network
        must contain to sync; empty syncs everything"
    syncFrequency:
      type: enum
      values:
        - value: off
          label: Off
        - value: hourly
          label: "Every hour"
        - value: daily
          label: "Once a day"
      required: true
      default: hourly
      writer: owner
      displayName: Sync frequency
      description: "the scheduled sync cadence for this account (default hourly)"
    backfillDepth:
      type: enum
      values:
        - value: none
          label: "Don't backfill"
        - value: last30d
          label: "Last 30 days"
        - value: last90d
          label: "Last 90 days"
        - value: last1y
          label: "Last year"
        - value: all
          label: Everything
      required: true
      default: last30d
      writer: owner
      displayName: Backfill depth
      # A drain walks at most 2,000 events per room and records where it
      # stopped in backfillResume, so deeper history arrives across runs.
      description: "how far back the first sync walks each room's history
        (default the last 30 days); none means from connect time forward"
    # The accountconfig trait's contracted properties — DORMANT here. The
    # trait requires them on every implementing type; writer: oauth restricts
    # them to the OAuth facility's actor, and this bundle never runs a flow,
    # so nothing ever writes them. Declared to satisfy the contract, kept
    # oauth-written so a stranger cannot squat on them either.
    tokenRef:
      type: secret
      writer: oauth
      displayName: Token reference
      description: "accountconfig trait contract — unused: Beeper is not OAuth,
        the pasted token lives on the bundle config"
    tokenStatus:
      type: string
      writer: oauth
      displayName: Connection status
      description: "accountconfig trait contract — unused: no OAuth flow ever
        reports a status here"
    grantedScopes:
      type: string
      repeated: true
      writer: oauth
      displayName: Granted scopes
      description: "accountconfig trait contract — unused: no consent, no
        scopes"
    # Connector STATE the sync body owns (writer: connector — only installed
    # bundle code may set these).
    syncToken:
      type: string
      writer: connector
      displayName: Sync token
      description: "the Matrix /sync next_batch token — stored after each
        run's messages commit (or with the un-walked rooms preserved in backfillResume),
        so the next run is incremental"
    lastSyncedAt:
      type: datetime
      writer: connector
      displayName: Last synced
      description: when messages last finished syncing — the cadence anchor
        and the on-connect trigger's completion marker
    syncStatus:
      type: string
      writer: connector
      displayName: Sync status
      description: "the last sync outcome — ok, ok (N rooms backfill pending),
        erroring: <reason>, or ignored: duplicate account"
    backfillResume:
      type: json
      writer: connector
      displayName: Backfill resume
      # Written when a walk stops at the per-drain page cap or a provider
      # error cuts a drain short; the next run resumes from these tokens.
      description: "rooms whose history walk did not finish — a map of room
        id to the /messages token and cutoff the next run resumes from"
---
# ---- the room mirror: one bridged chat ------------------------------------
# What Beeper holds about one room, in Matrix's own shape. Its id is the
# provider key — account + Matrix room id through host.ids.external — and the
# row is written mint-then-patch: put-if-absent creates it, and each delta
# patches ONLY the fields it carried, so a partial /sync (lazy-loaded state,
# an owner-only timeline window) never erases a name or resets a network.
kind: core.substrate.reamde.dev/kind
metadata:
  id: beeper.bundles.substrate.reamde.dev/room
data:
  authority: beeper.bundles.substrate.reamde.dev
  description: >-
    What Beeper holds about one bridged chat, in Matrix's own shape: the room
    id, its name where it has one, and which network it bridges. Written mint-then-patch,
    so a partial sync never erases a name.
  names:
    singular: room
  displayTemplate: "{name|roomId}"
  properties:
    # NOT a reference, and every `account:` in this closure reads the same way:
    # the connector writes it as provenance on synced rows, and retyping a live
    # string property to a reference is a NARROWING the boot upgrade refuses
    # while rows hold the old shape — it would strand every released store.
    account:
      type: reference
      kind: account
      required: true
      onDelete: cascade
      displayName: Account
      description: the account this room was synced from
    roomId:
      type: string
      displayName: Room ID
      description: "the Matrix room id, e.g. !abc:beeper.local"
    name:
      type: string
      displayName: Name
      description: the room's display name (m.room.name), absent on unnamed
        DMs
    network:
      type: string
      displayName: Network
      description: "the bridged network, derived from ghost-sender prefixes
        (whatsapp, telegram, signal, ...); beeper when unrecognized"
    raw:
      type: json
      displayName: Raw summary
      description: the room's /sync summary as fetched, for provenance
---
# ---- the message mirror: one bridged message -------------------------------
# One row per Matrix event, keyed by account + event id — event ids are
# globally unique and immutable, so message writes are if_absent puts: a
# re-read is a no-op, never a rewrite. The room reference is filled by the sync
# (rooms commit earlier in the same drain); `onDelete: cascade` so a deleted
# room takes its mirrored messages with it.
kind: core.substrate.reamde.dev/kind
metadata:
  id: beeper.bundles.substrate.reamde.dev/message
data:
  authority: beeper.bundles.substrate.reamde.dev
  description: >-
    One bridged Matrix message, keyed by its globally unique event id, so
    a write is put-if-absent and a re-read is a no-op. The sender is a Matrix
    id, often a bridge ghost rather than a human's own.
  names:
    singular: message
  displayTemplate: "{sender}: {text}"
  properties:
    account:
      type: reference
      kind: account
      required: true
      onDelete: cascade
      displayName: Account
      description: the account this message was synced from
    roomId:
      type: string
      displayName: Room ID
      description: the Matrix room id this event arrived in, verbatim
    eventId:
      type: string
      displayName: Event ID
      description: "the Matrix event id ($...), globally unique — the provider
        key behind this row's id"
    sender:
      type: string
      displayName: Sender
      description: "the sender's Matrix id — a bridge ghost like @whatsapp_15551234567:beeper.local,
        or the owner's own id"
    msgtype:
      type: string
      displayName: Message type
      description: "the Matrix msgtype (m.text, m.image, m.notice, ...)"
    # `text`, not `body`: `body` is the engine's own computed column on every
    # record, so a declared property may not take the name.
    text:
      type: text
      displayName: Text
      description: the message text as the bridge rendered it
    sentAt:
      type: datetime
      displayName: Sent at
      description: when the message was sent (origin_server_ts)
    raw:
      type: json
      displayName: Raw event
      description: the raw Matrix event as fetched, for provenance
    room:
      type: reference
      kind: beeper.bundles.substrate.reamde.dev/room
      required: true
      mustExist: true
      onDelete: cascade
      description: the mirrored room this message belongs to
---
# ---- the sync function -----------------------------------------------------
# A PEP 723 Python body speaking the plain Matrix client-server API over
# requests. Per invocation it makes AT MOST ONE Matrix HTTP call — a /sync
# (with the account's stored next_batch as `since`), or one
# /rooms/{id}/messages history page — and pages EVERYTHING off the causal
# chain via the paged-checkpoint more/resume contract:
#
#   sync      ONE /sync. Matrix has no room pagination, so the body reduces
#             every mentioned room to a small descriptor (id, name, network,
#             summary — never the raw events) and hands the list off through
#             host.page.more. It stages nothing, so the frame stays small
#             however many rooms a bridged account holds (fleet F6 / P0).
#   rooms     each invocation mirrors at most 25 rooms — put-if-absent +
#             patch of ONLY the delta-carried fields (P1) — and queues one
#             history job per room with news.
#   backfill  ONE /messages page per invocation, newest-first, down to the
#             cutoff; a room that hits the per-drain page cap is recorded in
#             the account's backfillResume so the next run RESUMES the walk
#             (Codex H5) — truncation is never silent.
#
# Ids are host.ids.external("beeper", account, event/room id); messages are
# if_absent puts (event ids are immutable). The account's syncToken/
# lastSyncedAt/syncStatus stamp is the LAST effect of a drain, after every
# message committed — a crash mid-drain re-reads from the old token and the
# if_absent puts absorb the overlap. A provider failure stamps
# `syncStatus: erroring: <reason>` with the un-walked rooms preserved in
# backfillResume, instead of parking the chain (fleet F2/F3). One account
# per repository is enforced (fleet F8): only the lexicographically-first live
# account syncs.
#
# emit names the two mirror types plus the account (the stamps); reads names
# the room mirror — the roomFilter's fallback surface when a delta omits the
# fields, and the resumed-walk existence check. No real Matrix call runs at
# admission; the closure test drives the body against a fake homeserver.
kind: core.substrate.reamde.dev/function
metadata:
  id: beeper.bundles.substrate.reamde.dev/messagessync
data:
  authority: beeper.bundles.substrate.reamde.dev
  description: >-
    Sync a Beeper account's bridged messages over the Matrix /sync API, mirror
    rooms and messages page by page, and store the next_batch token for the
    next incremental run. Read-only.
  runtime: python
  timeout: PT30S
  permissions:
    writes:
      - beeper.bundles.substrate.reamde.dev/room
      - beeper.bundles.substrate.reamde.dev/message
      - beeper.bundles.substrate.reamde.dev/account
    reads:
      kinds:
        - beeper.bundles.substrate.reamde.dev/room
      # A rooms page evaluates the filter fallback for at most 25 rooms; a
      # backfill page checks at most one resumed room.
      budgets:
        calls: 40
    network:
      - "matrix.beeper.com"
      - "beeper.com"
  source: |
    # /// script
    # requires-python = ">=3.11"
    # dependencies = [
    #   "requests==2.32.3",
    # ]
    # ///
    """Beeper message sync — at most one Matrix HTTP call per invocation.

    The pasted access token arrives injected on the connector input
    (config.inputs.connector.properties.accessToken — the connector-own-secret
    path; the OAuth facility is not involved and no tokenStatus ever exists). The
    token leaves this body ONLY toward a pinned origin — https on a
    beeper.com host, or loopback (the test seam); an owner-editable
    homeserverUrl pointing anywhere else parks the delivery with a clear
    error BEFORE any request is made (F1).

    Paged end to end, so no frame is ever sized by the account (F6/P0):
    the sync phase reduces the /sync response to small room descriptors and
    stages nothing; the rooms phase mirrors at most ROOMS_PER_PAGE rooms per
    invocation; the backfill phase fetches one /messages page per
    invocation. Room mirrors are put-if-absent + patch of only the fields
    the delta carried (P1) — a partial /sync never erases a name or resets
    a network, and the roomFilter falls back to the stored mirror when the
    delta omits the fields. A room that hits the per-drain page cap is
    recorded in backfillResume and RESUMED by the next run (H5).

    Cursor discipline: the account's syncToken (Matrix next_batch) is
    stamped only after a drain's messages have all committed; message puts
    are if_absent on immutable event ids, so a replayed window is a no-op.
    A provider failure stamps `syncStatus: erroring: <reason>` — with every
    un-walked room preserved in backfillResume — instead of parking (F2/F3).
    One account per repository is ENFORCED (F8): the lexicographically-first
    live account syncs; every other live account row is stamped ignored.
    """
    import datetime as _dt
    import json
    import urllib.parse

    import requests

    ROOM_TYPE = "beeper.bundles.substrate.reamde.dev/room"
    MESSAGE_TYPE = "beeper.bundles.substrate.reamde.dev/message"
    ACCOUNT_TYPE = "beeper.bundles.substrate.reamde.dev/account"
    DEFAULT_HOMESERVER = "https://matrix.beeper.com"
    # A secret that arrives still sealed marks the engine's accountconfig
    # sealing (write.go) — it means the token was pasted onto the WRONG type.
    SEALED_PREFIX = "substrate:sealsecret:v1:"
    TIMELINE_LIMIT = 10     # names + bridge detection only — never staged
    ROOMS_PER_PAGE = 25     # rooms mirrored per invocation frame (F6)
    BACKFILL_PAGE = 100
    MAX_BACKFILL_PAGES = 20  # per room PER DRAIN; a cap hit resumes next run
    HTTP_TIMEOUT = 25
    REASON_MAX = 200        # an erroring stamp is a status line, never a body
    IGNORED_STATUS = ("ignored: duplicate account (this provider is "
                      "one-account-per-repository until issue 011)")

    # Lazy-load members and drop presence/ephemeral noise: the sync wants
    # names and enough timeline to spot the bridge, nothing else — the
    # messages themselves arrive through the paged /messages walk.
    SYNC_FILTER = json.dumps({
        "presence": {"types": []},
        "account_data": {"types": []},
        "room": {
            "state": {"types": ["m.room.name"], "lazy_load_members": True},
            "timeline": {"limit": TIMELINE_LIMIT},
            "ephemeral": {"types": []},
            "account_data": {"types": []},
        },
    }, separators=(",", ":"))

    # Beeper bridge ghost prefixes -> network names (the v4 bridge map,
    # localpart spelling: @whatsapp_15551234567:beeper.local).
    BRIDGES = {
        "whatsapp": "whatsapp", "whatsappgo": "whatsapp",
        "telegram": "telegram", "telegramgo": "telegram",
        "signal": "signal", "signalgo": "signal",
        "imessage": "imessage", "imessagego": "imessage",
        "discord": "discord", "discordgo": "discord",
        "slack": "slack", "slackgo": "slack",
        "instagram": "instagram", "instagramgo": "instagram",
        "twitter": "twitter", "twittergo": "twitter",
        "facebook": "messenger", "messenger": "messenger",
        "gmessages": "gmessages", "linkedin": "linkedin",
    }

    BACKFILL_DAYS = {"none": 0, "last30d": 30, "last90d": 90, "last1y": 365, "all": -1}


    def _pinned(base):
        # F1 origin pinning: the pasted token leaves this body only over
        # https to a beeper.com host, or to loopback (the test seam). An
        # owner-editable URL that fails the rule never sees a request.
        u = urllib.parse.urlsplit(base)
        host = (u.hostname or "").lower()
        if host in ("127.0.0.1", "localhost", "::1"):
            return True
        return u.scheme == "https" and (
            host == "beeper.com" or host.endswith(".beeper.com"))


    def _wants(acct):
        return bool((acct.get("properties") or {}).get("enabledMessages"))


    def _due(props):
        freq = (props.get("syncFrequency") or "hourly").lower()
        if freq == "off":
            return False
        last = props.get("lastSyncedAt")
        if not last:
            return True
        try:
            seen = _dt.datetime.fromisoformat(str(last).replace("Z", "+00:00"))
        except ValueError:
            return True
        hours = 1 if freq == "hourly" else 24
        return _dt.datetime.now(_dt.timezone.utc) - seen >= _dt.timedelta(hours=hours)


    def _now_iso():
        return _dt.datetime.now(_dt.timezone.utc).replace(microsecond=0).isoformat()


    def _get(base, path, token, params):
        resp = requests.get(base + path, params=params, timeout=HTTP_TIMEOUT,
                            headers={"Authorization": "Bearer " + token})
        if resp.status_code >= 400:
            raise RuntimeError("matrix GET %s: %d %s"
                               % (path, resp.status_code, resp.text[:200]))
        return resp.json()


    def _network(events):
        # The bridged network, read off ghost-sender localparts: the prefix
        # before the first underscore (or a trailing "bot") names the bridge.
        # None when NO event names one — absence of evidence, never "beeper":
        # a delta window holding only the owner's replies must not overwrite
        # a stored network (P1).
        for ev in events:
            s = ev.get("sender") or ""
            if not s.startswith("@") or ":" not in s:
                continue
            local = s[1:s.index(":")]
            if "_" in local:
                bridge = local.split("_", 1)[0].lower()
                if bridge in BRIDGES:
                    return BRIDGES[bridge]
            if local.endswith("bot") and local[:-3].lower() in BRIDGES:
                return BRIDGES[local[:-3].lower()]
        return None


    def _room_name(state_events, timeline_events):
        # m.room.name can ride in the state block or inline in the timeline.
        name = ""
        for ev in list(state_events) + list(timeline_events):
            if ev.get("type") == "m.room.name":
                name = (ev.get("content") or {}).get("name") or name
        return name


    def _mirror_room(host, aid, rid, name, network, summary):
        # Mint-then-patch (P1): put-if-absent creates the row with what this
        # window knows (network falls back to "beeper" only AT MINT); the
        # patch then carries ONLY the fields the delta actually held, so a
        # partial /sync — lazy-loaded state, an owner-only timeline — never
        # erases a name or resets a network, and an identical patch is
        # no-op-suppressed.
        eid = host.ids.external("beeper", aid, rid)
        mint = {"account": aid, "roomId": rid, "network": network or "beeper"}
        if name:
            mint["name"] = name
        if summary:
            mint["raw"] = summary
        host.effects.put(ROOM_TYPE, eid, properties=mint, if_absent=True)
        patch = {"account": aid, "roomId": rid}
        if name:
            patch["name"] = name
        if network:
            patch["network"] = network
        if summary:
            patch["raw"] = summary
        host.effects.patch(ROOM_TYPE, eid, properties=patch)
        return eid


    def _passes_filter(host, flt, eid, name, network):
        # The roomFilter, against what is KNOWN: the delta's fields when
        # present, the stored mirror's otherwise (P1) — a partial delta must
        # not make a matching room silently stop syncing.
        if not flt:
            return True
        if flt in ("%s %s" % (name or "", network or "")).lower():
            return True
        if name and network:
            return False
        stored = host.records.get(ROOM_TYPE, eid) or {}
        sp = stored.get("properties") or {}
        hay = "%s %s" % (name or sp.get("name") or "",
                         network or sp.get("network") or "")
        return flt in hay.lower()


    def _put_message(host, aid, room_eid, rid, ev, cutoff=None):
        # Only real messages mirror; a redacted event has no body and skips.
        # An event older than the walk's floor is not this run's news — the
        # cutoff bounds what a backfill page stages, so a "none"-depth
        # account never inhales pre-connect history off a page's tail.
        if ev.get("type") != "m.room.message":
            return False
        content = ev.get("content") or {}
        body = content.get("body")
        event_id = ev.get("event_id") or ""
        if not event_id or body is None:
            return False
        ts = ev.get("origin_server_ts")
        if cutoff and isinstance(ts, (int, float)) and ts < cutoff:
            return False
        props = {"account": aid, "room": room_eid,
                 "roomId": rid, "eventId": event_id,
                 "sender": ev.get("sender") or "", "text": str(body), "raw": ev}
        if content.get("msgtype"):
            props["msgtype"] = content["msgtype"]
        if isinstance(ts, (int, float)):
            props["sentAt"] = _dt.datetime.fromtimestamp(
                ts / 1000.0, _dt.timezone.utc).replace(microsecond=0).isoformat()
        host.effects.put(MESSAGE_TYPE, host.ids.external("beeper", aid, event_id),
                         properties=props, if_absent=True)
        return True


    def _cutoff_ms(props, first):
        # First sync: the backfillDepth window ("none" -> None: from connect
        # time forward, F4). Incremental: back to the last completed sync,
        # so the walk fills exactly the gap — and when an erroring drain
        # advanced the token WITHOUT completing (no lastSyncedAt yet), fall
        # back to the window rather than silently skip the walk.
        if not first:
            try:
                seen = _dt.datetime.fromisoformat(
                    str(props.get("lastSyncedAt")).replace("Z", "+00:00"))
                return int(seen.timestamp() * 1000)
            except (TypeError, ValueError):
                pass
        days = BACKFILL_DAYS.get((props.get("backfillDepth") or "last30d").lower(), 30)
        if days == 0:
            return None
        if days < 0:
            return 0
        floor = _dt.datetime.now(_dt.timezone.utc) - _dt.timedelta(days=days)
        return int(floor.timestamp() * 1000)


    def _stamp(host, acct, aid, next_batch, pending):
        # The drain's LAST effect: everything before it has committed, so the
        # completion marker (which drops the on-connect guard) and the token
        # (which makes the next run incremental) never precede their
        # messages. A non-empty pending map is DISCLOSED truncation (H5):
        # the status says so and backfillResume carries the resume tokens.
        typ = ((acct or {}).get("kind") or ACCOUNT_TYPE) or ACCOUNT_TYPE
        status = "ok"
        if pending:
            status = "ok (%d room%s backfill pending)" % (
                len(pending), "" if len(pending) == 1 else "s")
        props = {"lastSyncedAt": _now_iso(), "syncStatus": status,
                 "backfillResume": pending or {}}
        if next_batch:
            props["syncToken"] = next_batch
        host.effects.patch(typ, aid, properties=props)


    def _erroring(host, acct, aid, reason, extra=None):
        # F2/F3: a provider failure stamps THIS account erroring — bounded
        # reason, no lastSyncedAt (the run did not complete, the eventual ok
        # run must not find its window floor advanced past records it never
        # saw) — and the delivery completes instead of parking.
        props = {"syncStatus": "erroring: " + str(reason)[:REASON_MAX]}
        if extra:
            props.update(extra)
        host.effects.patch(((acct or {}).get("kind") or ACCOUNT_TYPE) or ACCOUNT_TYPE, aid,
                           properties=props)


    def _backfill_page(host, base, token, aid, job, pending):
        # ONE /rooms/{id}/messages page, walking backwards from the job's
        # token until the cutoff, the history's end, or the per-drain page
        # cap. Returns the advanced job, or None when this room is done for
        # this drain — a cap hit records the room in `pending` so the next
        # run resumes the walk (H5), never a silent abandonment.
        if job.get("resumed") and not job.get("checked"):
            # A resumed room may have been deleted since the cap hit — drop
            # its walk rather than staging messages into a void.
            if host.records.get(ROOM_TYPE, job["eid"]) is None:
                host.log("beeper: resumable room %s is gone; dropping its walk"
                         % job["room"])
                return None
            job = dict(job, checked=True)
        path = "/_matrix/client/v3/rooms/%s/messages" % urllib.parse.quote(job["room"])
        resp = _get(base, path, token,
                    {"dir": "b", "from": job["from"], "limit": BACKFILL_PAGE})
        chunk = resp.get("chunk") or []
        cutoff = job.get("cutoff")
        oldest = None
        for ev in chunk:
            _put_message(host, aid, job["eid"], job["room"], ev, cutoff)
            ts = ev.get("origin_server_ts")
            if isinstance(ts, (int, float)) and (oldest is None or ts < oldest):
                oldest = ts
        end = resp.get("end") or ""
        pages = job.get("pages", 0) + 1
        if (not chunk or not end
                or (cutoff and oldest is not None and oldest < cutoff)):
            return None
        if pages >= MAX_BACKFILL_PAGES:
            pending[job["room"]] = {"from": end, "cutoff": cutoff}
            return None
        return dict(job, pages=pages, **{"from": end})


    def _rooms_page(host, resume, accounts):
        # One bounded slice of the room list: mirror at most ROOMS_PER_PAGE
        # rooms (mint-then-patch), queue their history jobs, hand the rest
        # off. The frame holds at most 25 rooms' puts+patches — never the
        # whole account.
        aid = resume.get("account") or ""
        rooms = list(resume.get("rooms") or [])
        jobs = list(resume.get("jobs") or [])
        flt = resume.get("filter") or ""
        cutoff = resume.get("cutoff")
        nb = resume.get("nextBatch") or ""
        first = bool(resume.get("first"))
        batch, rest = rooms[:ROOMS_PER_PAGE], rooms[ROOMS_PER_PAGE:]
        for desc in batch:
            rid = desc.get("room") or ""
            if not rid:
                continue
            eid = host.ids.external("beeper", aid, rid)
            name = desc.get("name") or ""
            net = desc.get("net")
            if not _passes_filter(host, flt, eid, name, net):
                continue
            _mirror_room(host, aid, rid, name, net, desc.get("summary"))
            # The history walk starts from THIS sync's token and stops at the
            # cutoff. First sync walks every room (the backfill window);
            # steady state walks only rooms whose delta held events.
            if cutoff is not None and nb and (first or desc.get("ev")):
                jobs.append({"room": rid, "eid": eid, "from": nb,
                             "cutoff": cutoff, "pages": 0})
        if rest:
            return {"more": host.page.more(dict(resume, rooms=rest, jobs=jobs))}
        if jobs:
            return {"more": host.page.more(dict(resume, phase="backfill",
                                                rooms=[], jobs=jobs))}
        _stamp(host, accounts.get(aid), aid, nb, dict(resume.get("pending") or {}))
        return {"output": {"account": aid}}


    def _backfill_drive(host, base, token, resume, accounts):
        # One /messages page for the job at the head of the queue. A provider
        # failure here stamps erroring WITH every un-walked room preserved in
        # backfillResume — the token may advance because the gaps it skips
        # ride in the resume map (F2/F3 + H5).
        aid = resume.get("account") or ""
        acct = accounts.get(aid)
        jobs = list(resume.get("jobs") or [])
        pending = dict(resume.get("pending") or {})
        nb = resume.get("nextBatch") or ""
        if jobs:
            try:
                job = _backfill_page(host, base, token, aid, jobs[0], pending)
            except Exception as e:
                for j in jobs:
                    pending.setdefault(j["room"], {"from": j["from"],
                                                   "cutoff": j.get("cutoff")})
                extra = {"backfillResume": pending}
                if nb:
                    extra["syncToken"] = nb
                _erroring(host, acct, aid, e, extra)
                return {"output": {"account": aid, "erroring": True}}
            jobs = ([job] if job else []) + jobs[1:]
        if jobs:
            return {"more": host.page.more(dict(resume, jobs=jobs,
                                                pending=pending))}
        _stamp(host, acct, aid, nb, pending)
        return {"output": {"account": aid}}


    def main(input, host):
        cfg = input.get("config") or {}
        conf = (((cfg.get("inputs") or {}).get("connector") or {}).get("properties")) or {}
        accounts = {a.get("id"): a for a in (cfg.get("accounts") or [])}
        token = conf.get("accessToken") or ""
        base = (conf.get("homeserverUrl") or DEFAULT_HOMESERVER).rstrip("/")

        if not token:
            host.log("beeper: the connector input carries no accessToken "
                     "(or did not resolve); nothing to sync")
            return {"output": {"skipped": "unconfigured"}}
        if token.startswith(SEALED_PREFIX):
            # A token pasted onto the ACCOUNT would arrive like this: the
            # engine seals every secret on an accountconfig-trait type and
            # injects it as stored. The connector's config record is the
            # usable slot.
            host.log("beeper: accessToken arrived sealed — paste it on the "
                     "config, not the account")
            return {"output": {"skipped": "sealed-token"}}
        if not _pinned(base):
            # F1: the token goes NOWHERE but a pinned origin — park loudly,
            # before any request carries the credential.
            raise RuntimeError(
                "beeper: homeserverUrl %r is not a pinned origin (https on a "
                "beeper.com host, or loopback); refusing to send the access "
                "token" % base)

        resume = host.page.resume() or None
        if resume:
            phase = resume.get("phase")
            if phase == "rooms":
                return _rooms_page(host, resume, accounts)
            if phase == "backfill":
                return _backfill_drive(host, base, token, resume, accounts)
            return {"output": {}}

        # A fresh delivery. F8 one-account enforcement first: the
        # lexicographically-first live account is THE account; every other
        # live row is stamped ignored (an identical stamp no-op-suppresses,
        # and this body's own patch cannot re-fire the on-connect trigger).
        live = sorted(aid for aid, a in accounts.items() if _wants(a))
        primary = live[0] if live else ""
        for dup in live[1:]:
            host.effects.patch((accounts[dup].get("kind") or ACCOUNT_TYPE) or ACCOUNT_TYPE, dup,
                               properties={"syncStatus": IGNORED_STATUS})

        # The delivery envelope splits the identity: record.type is the LOCAL
        # name and record.authority the authority — rejoin them before
        # comparing, or the record path never matches (the previous prefix
        # check against the full identity silently never did).
        record = (input.get("envelope") or {}).get("record") or {}
        etype = (record.get("kind") or "")
        if etype == ACCOUNT_TYPE:
            # Record-triggered: a connect or edit syncs ITS account — unless
            # it is not the repository's one live account.
            aid = record.get("id") or ""
            if aid != primary:
                return {"output": {"account": aid, "ignored": True}}
        else:
            # Schedule-triggered: the one live account, when due.
            if not primary or not _due(accounts[primary].get("properties") or {}):
                return {"output": {"synced": 0}}
            aid = primary

        acct = accounts.get(aid)
        if acct is None or not _wants(acct):
            return {"output": {"synced": 0}}
        props = acct.get("properties") or {}

        # ONE /sync — reduced to descriptors, never staged (F6/P0): Matrix
        # has no room pagination, so the ROOMS become the paged units and
        # the raw events never ride in a frame or a cursor.
        since = props.get("syncToken") or ""
        params = {"filter": SYNC_FILTER, "timeout": 0}
        if since:
            params["since"] = since
        try:
            resp = _get(base, "/_matrix/client/v3/sync", token, params)
        except Exception as e:
            _erroring(host, acct, aid, e)
            return {"output": {"account": aid, "erroring": True}}

        first = not since
        cutoff = _cutoff_ms(props, first)
        next_batch = resp.get("next_batch") or since
        rooms = []
        for rid, room in ((resp.get("rooms") or {}).get("join") or {}).items():
            timeline = room.get("timeline") or {}
            events = timeline.get("events") or []
            desc = {"room": rid}
            name = _room_name((room.get("state") or {}).get("events") or [], events)
            if name:
                desc["name"] = name
            net = _network(events)
            if net:
                desc["net"] = net
            summary = room.get("summary") or {}
            if summary:
                desc["summary"] = summary
            if events:
                desc["ev"] = 1
            rooms.append(desc)

        # Resumable history walks a capped (or erroring) earlier drain left
        # behind: seed them as jobs so truncated rooms drain to completion
        # across runs (H5).
        jobs = []
        stored = props.get("backfillResume")
        if isinstance(stored, dict):
            for rid in sorted(stored):
                st = stored[rid]
                if not isinstance(st, dict) or not st.get("from"):
                    continue
                jobs.append({"room": rid,
                             "eid": host.ids.external("beeper", aid, rid),
                             "from": st["from"], "cutoff": st.get("cutoff"),
                             "pages": 0, "resumed": True})

        if not rooms and not jobs:
            _stamp(host, acct, aid, next_batch, {})
            return {"output": {"account": aid, "rooms": 0}}

        cursor = {"phase": "rooms" if rooms else "backfill",
                  "account": aid, "rooms": rooms, "jobs": jobs,
                  "nextBatch": next_batch, "cutoff": cutoff, "first": first,
                  "filter": (props.get("roomFilter") or "").strip().lower(),
                  "pending": {}}
        return {"more": host.page.more(cursor)}
