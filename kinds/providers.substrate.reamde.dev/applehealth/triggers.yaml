# The Apple Health bundle's delivery wiring: one webhook trigger, an ordinary
# data record of core's `trigger` kind.
#
#   Health Auto Export  --POST /webhooks/<authority>/applehealth-webhook-->  applehealthingest
#
# It ships DISABLED and without a key, because an enabled trigger with no key
# is an open endpoint that writes health records for anyone who can reach the
# server. Set `source.webhook.key` (16 to 128 characters of [A-Za-z0-9_-]),
# enable it, and give the app the same key as an `Authorization: Bearer <key>`
# header; the door reads the key and strips the header before the function
# runs.
#
# `headers` is every header the function reads: the five the app adds to each
# request on its own, and `X-Substrate-Account`, which the owner adds to name
# the account a delivery belongs to. A header this list does not name never
# reaches the function and never enters the changelog (decision record 0097).
#
# `maxBody` raises the door's 1 MiB default to 8 MiB for this trigger alone:
# a day of minute-grouped samples passes 1 MiB, and the app never re-sends a
# part the door refused. The door reads the bound before the body, so a
# request without the key is refused before a byte of it is read.
kind: substrate.reamde.dev/core/trigger
metadata:
  id: applehealth-webhook
data:
  properties:
    enabled: false
    source:
      webhook:
        headers:
          - x-substrate-account
          - automation-name
          - automation-id
          - automation-aggregation
          - automation-period
          - session-id
        maxBody: 8388608
    callable: substrate.reamde.dev/core/function/providers.substrate.reamde.dev/applehealth/applehealthingest
---
# The Apple Health adapter's delivery wiring: one record trigger over the two
# applehealth mirror kinds it reads. All three ops: a create and an update
# write the row's outputs, a delete removes them (the envelope's `record` is
# null then, and the function finds the outputs by the row they point at).
# `coalesce` keeps the latest change per row in a batch, because the function
# reads the row as it stands now, never the change. `fromStart` starts the
# cursor at the changelog's start when the install creates the trigger, so
# the rows the mirror held before the adapter shipped are converted without
# a hand.
kind: substrate.reamde.dev/core/trigger
metadata:
  id: applehealth-to-health
data:
  properties:
    enabled: true
    label: Apple Health to health
    source:
      record:
        kinds:
          - providers.substrate.reamde.dev/applehealth/metricbatch
          - providers.substrate.reamde.dev/applehealth/workout
        ops: [create, update, delete]
        coalesce: true
        fromStart: true
    callable: substrate.reamde.dev/core/function/providers.substrate.reamde.dev/applehealth/adaptapplehealth
