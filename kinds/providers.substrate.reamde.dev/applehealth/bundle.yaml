    singular: "ECG"
    plural: "ECGs"
  traits:
    - substrate.reamde.dev/core/temporal(range)
  displayTemplate: "{classification} {start}"
  properties:
    account:
      type: reference
      kind: providers.substrate.reamde.dev/applehealth/account
      required: true
      onDelete: cascade
      displayName: Account
      description: "the phone this recording arrived from"
    export:
      type: reference
      kind: providers.substrate.reamde.dev/applehealth/export
      displayName: Delivery
      description: "the latest delivery that carried this record"
    receivedAt:
      type: datetime
      displayName: Received
      description: "when that delivery arrived"
    start:
      type: string
      displayName: Start
      description: "`start`: when the recording began, as the app wrote it;
        `at` holds the instant"
    end:
      type: string
      displayName: End
      description: "`end`: when it ended, as the app wrote it; `endsAt` holds
        the instant"
