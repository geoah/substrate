# The Apple Health provider: a receiver for what the Health Auto Export iOS
# app POSTs from the phone. Apple Health has no cloud API, so nothing here
# calls out; the app's REST API automation sends JSON to the
# `applehealth-webhook` trigger (triggers.yaml) and `applehealthingest`
# writes it as mirror rows, in the app's field names and units.
#
# What the app sends, per section, is documented at
# https://help.healthyapps.dev/en/health-auto-export/export-format/ and the
# deviations real exports show are in README.md.
kind: substrate.reamde.dev/core/package
metadata:
  id: providers.substrate.reamde.dev/applehealth
data:
  authority: providers.substrate.reamde.dev
  package: applehealth
  version: 1
---
# No inputs and no OAuth: the app authenticates with the key the owner sets
# on the webhook trigger, and the accounts are records the owner writes.
kind: substrate.reamde.dev/core/bundle
metadata:
  id: providers.substrate.reamde.dev/applehealth
data:
  authority: providers.substrate.reamde.dev
  package: applehealth
  description: "Keeps a copy of the Apple Health data your iPhone sends through
    the Health Auto Export app: metrics, workouts, moods, medications, symptoms,
    cycle tracking and ECGs."
  installs:
    - providers.substrate.reamde.dev/applehealth/account
    - providers.substrate.reamde.dev/applehealth/export
    - providers.substrate.reamde.dev/applehealth/metricbatch
    - providers.substrate.reamde.dev/applehealth/workout
    - providers.substrate.reamde.dev/applehealth/stateofmind
    - providers.substrate.reamde.dev/applehealth/medication
    - providers.substrate.reamde.dev/applehealth/symptom
    - providers.substrate.reamde.dev/applehealth/cycleevent
    - providers.substrate.reamde.dev/applehealth/ecg
    - providers.substrate.reamde.dev/applehealth/heartratenotification
    - providers.substrate.reamde.dev/applehealth/applehealthingest
---
# Written by its owner, never by a sync: the id is the owner's choice
# (`iphone`), and a delivery names it in the X-Substrate-Account header, or
# falls back to the only account there is. The accountconfig trait's OAuth
# properties are declared because the trait contracts them; no OAuth flow
# runs for this bundle. The webhook path is not record-sourced, so the
# dispatcher stamps none of the sync trait's properties and the function
# stamps them itself.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/applehealth/account
data:
  authority: providers.substrate.reamde.dev
  package: applehealth
  description: "A phone that sends you its Apple Health data through the Health
    Auto Export app. You create one by hand and name its id in the app's X-Substrate-Account
    header; each delivery's outcome is stamped here."
  purpose: internal
  names:
    singular: account
  traits:
    - substrate.reamde.dev/core/accountconfig
    - substrate.reamde.dev/core/sync
  displayTemplate: "{displayName|id}"
  properties:
    tokenRef:
      type: secret
      writer: oauth
      displayName: Token reference
      description: "accountconfig trait contract, unused: the app authenticates
        with the webhook trigger's key"
    tokenStatus:
      type: string
      writer: oauth
      displayName: Connection status
      description: "accountconfig trait contract, unused: no OAuth flow reports
        a status here"
    grantedScopes:
      type: string
      repeated: true
      writer: oauth
      displayName: Granted scopes
      description: "accountconfig trait contract, unused: the app sends whatever
        its automation selects"
    displayName:
      type: string
      writer: owner
      displayName: Name
      description: "a name for this phone, shown wherever the account is listed"
    timezone:
      type: timezone
      writer: owner
      displayName: Time zone
      description: "the IANA zone a date without an offset is read in; the
        app's dates carry offsets, so this is a fallback, and UTC when unset"
    enabledMetrics:
      type: bool
      required: true
      default: true
      writer: owner
      displayName: Health metrics
      description: "keep the health metrics (heart rate, steps, sleep, weight
        and the rest) a delivery carries; off drops them, and the app does
        not send them again"
    enabledWorkouts:
      type: bool
      required: true
      default: true
      writer: owner
      displayName: Workouts
      description: "keep the workouts a delivery carries; off drops them,
        and the app does not send them again"
    enabledStateOfMind:
      type: bool
      required: true
      default: true
      writer: owner
      displayName: State of mind
      description: "keep the state of mind entries a delivery carries; off
        drops them, and the app does not send them again"
    enabledMedications:
      type: bool
      required: true
      default: true
      writer: owner
      displayName: Medications
      description: "keep the medication doses a delivery carries; off drops
        them, and the app does not send them again"
    enabledSymptoms:
      type: bool
      required: true
      default: true
      writer: owner
      displayName: Symptoms
      description: "keep the symptoms a delivery carries; off drops them,
        and the app does not send them again"
    enabledCycleTracking:
      type: bool
      required: true
      default: true
      writer: owner
      displayName: Cycle tracking
      description: "keep the cycle tracking entries a delivery carries; off
        drops them, and the app does not send them again"
    enabledEcg:
      type: bool
      required: true
      default: true
      writer: owner
      displayName: ECG
      description: "keep the ECG recordings a delivery carries; off drops
        them, and the app does not send them again"
    enabledHeartRateNotifications:
      type: bool
      required: true
      default: true
      writer: owner
      displayName: Heart rate notifications
      description: "keep the heart rate notifications a delivery carries;
        off drops them, and the app does not send them again"
    lastExport:
      type: reference
      kind: providers.substrate.reamde.dev/applehealth/export
      writer: connector
      displayName: Last delivery
      description: "the last delivery this phone sent that was written"
    syncPaused:
      type: bool
      writer: owner
      displayName: Paused
      description: "while true every delivery from this phone is dropped unwritten;
        the app does not send it again"
    syncRequestedAt:
      type: datetime
      writer: owner
      displayName: Sync requested
      description: "sync trait contract, unused: the phone decides when it
        sends, so nothing here can ask for a delivery"
    syncRequestedAck:
      type: datetime
      writer: connector
      displayName: Sync request acknowledged
      description: "sync trait contract, unused, for the same reason as syncRequestedAt"
    syncState:
      type: string
      writer: connector
      displayName: Sync state
      description: "running while a delivery is being written over several
        pages, ok once it is; a refused delivery parks on the trigger instead"
    syncMessage:
      type: string
      writer: connector
      displayName: Sync message
      description: "what the last delivery wrote: records written, records
        left unchanged, metric rows read"
    lastSyncedAt:
      type: datetime
      writer: connector
      displayName: Last synced
      description: "when the last delivery finished writing"
    lastSyncStartedAt:
      type: datetime
      writer: connector
      displayName: Last sync started
      description: "when the last delivery arrived"
    lastSyncDurationMs:
      type: int
      writer: connector
      displayName: Last sync duration (ms)
      description: "from the last delivery's arrival to the end of its writing,
        in milliseconds"
    syncProgress:
      type: json
      writer: connector
      displayName: Sync progress
      description: "{phase, done, total, pending} while a delivery is written
        over several pages; cleared when it finishes"
    syncError:
      type: string
      writer: connector
      displayName: Sync error
      description: "sync trait contract: cleared by every delivery that is
        written, because a refused one parks on the trigger with its reason"
    syncErrorAt:
      type: datetime
      writer: connector
      displayName: Sync error at
      description: "when syncError was written; cleared with it"
    syncStreams:
      type: json
      writer: connector
      displayName: Sync streams
      description: "sync trait contract, unwritten: one delivery is one stream"
---
# One per delivery, at the webhook fire id. `at` is when the substrate
# received it. The body itself is not kept here: the webhook ledger holds
# it while the delivery is parked, and bodySha256 names it.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/applehealth/export
data:
  authority: providers.substrate.reamde.dev
  package: applehealth
  description: "One delivery from the Health Auto Export app. It records when
    it arrived, which automation sent it, how big it was and what it held.
    A receipt; the data itself lands as metric batches, workouts and the other
    mirror kinds."
  purpose: internal
  names:
    singular: export
  label:
    singular: "Delivery"
    plural: "Deliveries"
  traits:
    - substrate.reamde.dev/core/temporal(point)
  displayTemplate: "{automationName|id} {at}"
  properties:
    account:
      type: reference
      kind: providers.substrate.reamde.dev/applehealth/account
      required: true
      onDelete: cascade
      displayName: Account
      description: "the phone this delivery came from"
    sessionId:
      type: string
      displayName: Session
      description: "the request's `session-id` header, as the app sent it"
    automationName:
      type: string
      displayName: Automation
      description: "the request's `automation-name` header, as the app sent
        it"
    automationId:
      type: string
      displayName: Automation ID
      description: "the request's `automation-id` header, as the app sent
        it"
    automationAggregation:
      type: string
      displayName: Time grouping
      description: "the request's `automation-aggregation` header, as the
        app sent it"
    automationPeriod:
      type: string
      displayName: Date range
      description: "the request's `automation-period` header, as the app sent
        it"
    userAgent:
      type: string
      displayName: App version
      description: "the request's `user-agent` header, as the app sent it"
    contentType:
      type: string
      displayName: Content type
      description: "the request's `content-type` header, as the app sent it"
    byteSize:
      type: int
      displayName: Size
      description: "the body's size in bytes"
    bodySha256:
      type: string
      displayName: Body SHA-256
      description: "the SHA-256 of the body as received, hex; the app's own
        bytes differ between two sends of the same data"
    counts:
      type: object
      displayName: Counts
      description: "how many entries each section of `data` held"
      fields:
        metrics:
          type: int
          description: "metric objects in `data.metrics`"
        metricRows:
          type: int
          description: "rows across those metrics"
        workouts:
          type: int
          description: "entries in `data.workouts`, when the account keeps
            them"
        stateOfMind:
          type: int
          description: "entries in `data.stateOfMind`, when the account keeps
            them"
        medications:
          type: int
          description: "entries in `data.medications`, when the account keeps
            them"
        symptoms:
          type: int
          description: "entries in `data.symptoms`, when the account keeps
            them"
        cycleTracking:
          type: int
          description: "entries in `data.cycleTracking`, when the account
            keeps them"
        ecg:
          type: int
          description: "entries in `data.ecg`, when the account keeps them"
        heartRateNotifications:
          type: int
          description: "entries in `data.heartRateNotifications`, when the
            account keeps them"
    metricNames:
      type: string
      repeated: true
      displayName: Metrics
      description: "the metric names the delivery carried, sorted"
    spanStart:
      type: datetime
      displayName: Earliest
      description: "the earliest instant any row or entry in the delivery
        names"
    spanEnd:
      type: datetime
      displayName: Latest
      description: "the latest instant any row or entry in the delivery names"
    skippedSections:
      type: string
      repeated: true
      displayName: Skipped sections
      description: "sections the delivery carried and the account's toggles
        dropped"
    droppedFields:
      type: string
      repeated: true
      displayName: Dropped fields
      description: "fields the delivery carried that no declaration here has
        a place for, as `section.field`; at most 100"
    droppedRows:
      type: int
      displayName: Dropped rows
      description: "metric rows dropped because they were not objects or carried
        no readable date"
    written:
      type: int
      displayName: Written
      description: "records this delivery created or changed"
    unchanged:
      type: int
      displayName: Unchanged
      description: "records this delivery implied that already held what it
        carried"
---
# Keyed `<account>/<metric>/<grouping>/<period>`: the period is the UTC hour
# for seconds and minutes, the UTC day for hours, the UTC month for days and
# the UTC year above that. `at` and `endsAt` are the period. A row is keyed by
# its instant, never its `source`, because a correction can relabel it.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/applehealth/metricbatch
data:
  authority: providers.substrate.reamde.dev
  package: applehealth
  description: "One health metric from your phone over one stretch of time,
    as the app sent it. Heart rate for an hour, or steps by day for a month.
    Its rows keep the app's fields and units, and a later delivery of the
    same time rewrites them."
  purpose: supporting
  names:
    singular: metricbatch
  label:
    singular: "Metric batch"
    plural: "Metric batches"
  traits:
    - substrate.reamde.dev/core/temporal(range)
  displayTemplate: "{name} {at}"
  properties:
    account:
      type: reference
      kind: providers.substrate.reamde.dev/applehealth/account
      required: true
      onDelete: cascade
      displayName: Account
      description: "the phone this batch arrived from"
    export:
      type: reference
      kind: providers.substrate.reamde.dev/applehealth/export
      displayName: Delivery
      description: "the delivery that last changed this record"
    receivedAt:
      type: datetime
      displayName: Received
      description: "when that delivery arrived"
    name:
      type: string
      required: true
      displayName: Metric
      description: "`name`: the metric as the app names it, snake_case (`heart_rate`,
        `step_count`, `weight_body_mass`)"
    units:
      type: string
      displayName: Units
      description: "`units`: the unit every row's numbers are in, from the
        app's Unit Preferences (`count/min`, `kJ`, `km`)"
    grouping:
      type: string
      required: true
      displayName: Time grouping
      description: "the automation's time grouping from `automation-aggregation`
        (seconds, minutes, hours, days, weeks, months, years), or unknown"
    rows:
      type: object
      repeated: true
      displayName: Rows
      description: "`data`: the metric's rows in this period, ordered by time;
        one per bucket with Summarize Data on, one per sample with it off"
      fields:
        date:
          type: string
          description: "`date`: the bucket or sample time as the app wrote
            it, `yyyy-MM-dd HH:mm:ss Z`, in the phone's zone when it sent"
        startDate:
          type: string
          description: "`startDate`: a sleep segment's start, sent instead
            of `date` when Summarize Data is off"
        endDate:
          type: string
          description: "`endDate`: a sleep segment's end"
        qty:
          type: float
          description: "`qty`: the value, in the batch's units; a cumulative
            value is split between buckets where a sample spans two"
        min:
          type: float
          description: "`Min`: heart rate's lowest reading in the bucket"
        avg:
          type: float
          description: "`Avg`: heart rate's mean in the bucket"
        max:
          type: float
          description: "`Max`: heart rate's highest reading in the bucket"
        systolic:
          type: float
          description: "`systolic`: blood pressure, in the batch's units"
        diastolic:
          type: float
          description: "`diastolic`: blood pressure, in the batch's units"
        source:
          type: string
          description: "`source`: the device or app Health names for the row;
            sources merged into one bucket are joined by `|`, and app 10.0.4
            sends it empty"
        mealTime:
          type: string
          description: "`mealTime`: blood glucose's Before Meal, After Meal
            or Unspecified"
        reason:
          type: string
          description: "`reason`: insulin delivery's Bolus or Basal"
        value:
          type: string
          description: "`value`: a sleep segment's stage (Core, REM, Deep,
            Awake, In Bed), or Complete and Incomplete for handwashing"
        unspecified:
          type: float
          description: "`Unspecified`: sexual activity with protection unrecorded"
        protectionUsed:
          type: float
          description: "`Protection Used`: sexual activity with protection"
        protectionNotUsed:
          type: float
          description: "`Protection Not Used`: sexual activity without protection"
        totalSleep:
          type: float
          description: "`totalSleep`: hours asleep in the night, with Summarize
            Data on"
        asleep:
          type: float
          description: "`asleep`: hours of unstaged sleep, not a total"
        core:
          type: float
          description: "`core`: hours of core sleep"
        deep:
          type: float
          description: "`deep`: hours of deep sleep"
        rem:
          type: float
          description: "`rem`: hours of REM sleep"
        awake:
          type: float
          description: "`awake`: hours awake in the night"
        inBed:
          type: float
          description: "`inBed`: hours in bed"
        sleepStart:
          type: string
          description: "`sleepStart`: when the night's sleep began, as the
            app wrote it"
        sleepEnd:
          type: string
          description: "`sleepEnd`: when it ended"
        inBedStart:
          type: string
          description: "`inBedStart`: when the night's time in bed began"
        inBedEnd:
          type: string
          description: "`inBedEnd`: when it ended"
---
# Keyed `<account>/<id>`, the id HealthKit gives the workout. Export Version 2
# is the shape declared; a version 1 workout carries no id and is refused.
# Workouts carry no `source`: the device shows only on the rows of
# `heartRateData` and the series.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/applehealth/workout
data:
  authority: providers.substrate.reamde.dev
  package: applehealth
  description: "A workout recorded on your phone or watch, as the app sent
    it. It holds the activity, when it ran, energy, distance and heart rate
    and, where the automation includes them, its metrics over time and its
    GPS route."
  names:
    singular: workout
  traits:
    - substrate.reamde.dev/core/temporal(range)
  displayTemplate: "{name} {start}"
  properties:
    account:
      type: reference
      kind: providers.substrate.reamde.dev/applehealth/account
      required: true
      onDelete: cascade
      displayName: Account
      description: "the phone this workout arrived from"
    export:
      type: reference
      kind: providers.substrate.reamde.dev/applehealth/export
      displayName: Delivery
      description: "the delivery that last changed this record"
    receivedAt:
      type: datetime
      displayName: Received
      description: "when that delivery arrived"
    workoutId:
      type: string
      required: true
      displayName: Workout ID
      description: "`id`: HealthKit's UUID for the workout"
    name:
      type: string
      displayName: Activity
      description: "`name`: the activity, in the phone's language (`Running`,
        `Outdoor Walk`)"
    start:
      type: string
      displayName: Start
      description: "`start`: when the workout began, as the app wrote it;
        `at` holds the instant"
    end:
      type: string
      displayName: End
      description: "`end`: when it ended, as the app wrote it; `endsAt` holds
        the instant"
    duration:
      type: float
      displayName: Duration (s)
      description: "`duration`: seconds"
    location:
      type: string
      displayName: Location
      description: "`location`: Indoor, Outdoor, Pool or Open Water"
    isIndoor:
      type: bool
      displayName: Indoor
      description: "`isIndoor`"
    activeEnergyBurned:
      type: object
      displayName: Active energy
      description: "`activeEnergyBurned`: the active energy burned, as `{qty,
        units}`"
      fields:
        qty:
          type: float
          description: "`qty`: the active energy burned, in `units`"
        units:
          type: string
          description: "`units`: the unit `qty` is in, as the app wrote it"
    totalEnergy:
      type: object
      displayName: Total energy
      description: "`totalEnergy`: the total energy burned, as `{qty, units}`"
      fields:
        qty:
          type: float
          description: "`qty`: the total energy burned, in `units`"
        units:
          type: string
          description: "`units`: the unit `qty` is in, as the app wrote it"
    intensity:
      type: object
      displayName: Intensity
      description: "`intensity`: the intensity, in MET, as `{qty, units}`"
      fields:
        qty:
          type: float
          description: "`qty`: the intensity, in MET, in `units`"
        units:
          type: string
          description: "`units`: the unit `qty` is in, as the app wrote it"
    distance:
      type: object
      displayName: Distance
      description: "`distance`: the distance covered, as `{qty, units}`"
      fields:
        qty:
          type: float
          description: "`qty`: the distance covered, in `units`"
        units:
          type: string
          description: "`units`: the unit `qty` is in, as the app wrote it"
    speed:
      type: object
      displayName: Speed
      description: "`speed`: the speed, as `{qty, units}`"
      fields:
        qty:
          type: float
          description: "`qty`: the speed, in `units`"
        units:
          type: string
          description: "`units`: the unit `qty` is in, as the app wrote it"
    avgSpeed:
      type: object
      displayName: Average speed
      description: "`avgSpeed`: the average speed, as `{qty, units}`"
      fields:
        qty:
          type: float
          description: "`qty`: the average speed, in `units`"
        units:
          type: string
          description: "`units`: the unit `qty` is in, as the app wrote it"
    maxSpeed:
      type: object
      displayName: Maximum speed
      description: "`maxSpeed`: the maximum speed, as `{qty, units}`"
      fields:
        qty:
          type: float
          description: "`qty`: the maximum speed, in `units`"
        units:
          type: string
          description: "`units`: the unit `qty` is in, as the app wrote it"
    elevationUp:
      type: object
      displayName: Elevation gain
      description: "`elevationUp`: the elevation climbed, as `{qty, units}`"
      fields:
        qty:
          type: float
          description: "`qty`: the elevation climbed, in `units`"
        units:
          type: string
          description: "`units`: the unit `qty` is in, as the app wrote it"
    elevationDown:
      type: object
      displayName: Elevation loss
      description: "`elevationDown`: the elevation descended, as `{qty, units}`"
      fields:
        qty:
          type: float
          description: "`qty`: the elevation descended, in `units`"
        units:
          type: string
          description: "`units`: the unit `qty` is in, as the app wrote it"
    temperature:
      type: object
      displayName: Temperature
      description: "`temperature`: the air temperature, as `{qty, units}`"
      fields:
        qty:
          type: float
          description: "`qty`: the air temperature, in `units`"
        units:
          type: string
          description: "`units`: the unit `qty` is in, as the app wrote it"
    humidity:
      type: object
      displayName: Humidity
      description: "`humidity`: the relative humidity, as `{qty, units}`"
      fields:
        qty:
          type: float
          description: "`qty`: the relative humidity, in `units`"
        units:
          type: string
          description: "`units`: the unit `qty` is in, as the app wrote it"
    lapLength:
      type: object
      displayName: Lap length
      description: "`lapLength`: the pool lap length, as `{qty, units}`"
      fields:
        qty:
          type: float
          description: "`qty`: the pool lap length, in `units`"
        units:
          type: string
          description: "`units`: the unit `qty` is in, as the app wrote it"
    totalSwimmingStrokeCount:
      type: object
      displayName: Swimming strokes
      description: "`totalSwimmingStrokeCount`: the swimming strokes, as `{qty,
        units}`"
      fields:
        qty:
          type: float
          description: "`qty`: the swimming strokes, in `units`"
        units:
          type: string
          description: "`units`: the unit `qty` is in, as the app wrote it"
    swimCadence:
      type: object
      displayName: Swim cadence
      description: "`swimCadence`: the swim cadence, as `{qty, units}`"
      fields:
        qty:
          type: float
          description: "`qty`: the swim cadence, in `units`"
        units:
          type: string
          description: "`units`: the unit `qty` is in, as the app wrote it"
    stepCadence:
      type: object
      displayName: Step cadence
      description: "`stepCadence`: the step cadence, as `{qty, units}`"
      fields:
        qty:
          type: float
          description: "`qty`: the step cadence, in `units`"
        units:
          type: string
          description: "`units`: the unit `qty` is in, as the app wrote it"
    flightsClimbed:
      type: object
      displayName: Flights climbed
      description: "`flightsClimbed`: the flights of stairs climbed, as `{qty,
        units}`"
      fields:
        qty:
          type: float
          description: "`qty`: the flights of stairs climbed, in `units`"
        units:
          type: string
          description: "`units`: the unit `qty` is in, as the app wrote it"
    avgHeartRate:
      type: object
      displayName: Average heart rate
      description: "`avgHeartRate`: the average heart rate, as `{qty, units}`"
      fields:
        qty:
          type: float
          description: "`qty`: the average heart rate, in `units`"
        units:
          type: string
          description: "`units`: the unit `qty` is in, as the app wrote it"
    maxHeartRate:
      type: object
      displayName: Maximum heart rate
