# Two shapes are declared: the documented one (`heartRate`, `heartRateVariation`)
# and the one the app was seen sending (`heartNotification`, `heartRateData`,
# `source` as an object). Keyed by the notification and its start.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/applehealth/heartratenotification
data:
  authority: providers.substrate.reamde.dev
  package: applehealth
  description: "A heart rate notification your watch raised. It covers a high
    or low heart rate, or an irregular rhythm, with the readings around it."
  names:
    singular: heartratenotification
  label:
    singular: "Heart rate notification"
    plural: "Heart rate notifications"
  traits:
    - substrate.reamde.dev/core/temporal(range)
  displayTemplate: "{heartNotification|start}"
  properties:
    account:
      type: reference
      kind: providers.substrate.reamde.dev/applehealth/account
      required: true
      onDelete: cascade
      displayName: Account
      description: "the phone this notification arrived from"
    export:
      type: reference
      kind: providers.substrate.reamde.dev/applehealth/export
      displayName: Delivery
      description: "the delivery that last changed this record"
    receivedAt:
      type: datetime
      displayName: Received
      description: "when that delivery arrived"
    heartNotification:
      type: string
      displayName: Notification
      description: "`heartNotification`: what the watch noticed, in the phone's
        language"
    threshold:
      type: float
      displayName: Threshold
      description: "`threshold`: the high or low limit crossed, beats per
        minute"
    start:
      type: string
      displayName: Start
      description: "`start`: when the notification began, as the app wrote
        it; `at` holds the instant"
    end:
      type: string
      displayName: End
      description: "`end`: when it ended, as the app wrote it; `endsAt` holds
        the instant"
    source:
      type: object
      displayName: Source
      description: "`source`: the device, as `{name, identifier}`; a plain
        string the app sends lands in `name`"
      fields:
        name:
          type: string
          description: "`name`"
        identifier:
          type: string
          description: "`identifier`"
    heartRateData:
      type: object
      repeated: true
      displayName: Readings
      description: "`heartRateData`: the readings, as the app sends them"
      fields:
        qty:
          type: float
          description: "`qty`, in `units`"
        units:
          type: string
          description: "`units` (`count/min`)"
        date:
          type: string
          description: "`date`, as the app wrote it"
        start:
          type: string
          description: "`start`, as the app wrote it or epoch seconds as text"
        end:
          type: string
          description: "`end`, as the app wrote it or epoch seconds as text"
    heartRate:
      type: object
      repeated: true
      displayName: Heart rate
      description: "`heartRate`: the readings, in the documented shape"
      fields:
        hr:
          type: float
          description: "`hr`, beats per minute"
        units:
          type: string
          description: "`units` (`bpm`)"
        timestamp:
          type: object
          description: "`timestamp`"
          fields:
            start:
              type: string
              description: "`start`, as the app wrote it"
            end:
              type: string
              description: "`end`, as the app wrote it"
            interval:
              type: object
              description: "`interval`: the sampling interval"
              fields:
                duration:
                  type: float
                  description: "`duration`"
                units:
                  type: string
                  description: "`units` (`s`)"
    heartRateVariation:
      type: object
      repeated: true
      displayName: Heart rate variability
      description: "`heartRateVariation`: variability readings, in the documented
        shape"
      fields:
        hrv:
          type: float
          description: "`hrv`, milliseconds"
        units:
          type: string
          description: "`units` (`ms`)"
        timestamp:
          type: object
