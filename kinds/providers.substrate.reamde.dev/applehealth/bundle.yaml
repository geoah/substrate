data:
  authority: providers.substrate.reamde.dev
  package: applehealth
  description: "One medication dose logged in the Health app, on iOS 26 and
    later. It holds the medication, when it was scheduled and logged, and
    whether it was taken."
  names:
    singular: medication
  traits:
    - substrate.reamde.dev/core/temporal(range)
  displayTemplate: "{displayText|nickname} {status}"
  properties:
    account:
      type: reference
      kind: providers.substrate.reamde.dev/applehealth/account
      required: true
      onDelete: cascade
      displayName: Account
      description: "the phone this dose arrived from"
    export:
      type: reference
      kind: providers.substrate.reamde.dev/applehealth/export
      displayName: Delivery
      description: "the delivery that last changed this record"
    receivedAt:
      type: datetime
      displayName: Received
      description: "when that delivery arrived"
    displayText:
      type: string
      displayName: Medication
      description: "`displayText`: the medication's name (`Aspirin`)"
    nickname:
      type: string
      displayName: Nickname
      description: "`nickname`: the name you gave it"
    start:
      type: string
      displayName: Start
      description: "`start`: when the dose began, as the app wrote it; `at`
        holds the instant"
    end:
      type: string
      displayName: End
      description: "`end`: when it ended, as the app wrote it; `endsAt` holds
        the instant"
    scheduledDate:
      type: string
      displayName: Scheduled
      description: "`scheduledDate`: when the dose was scheduled, as the app
        wrote it"
    form:
      type: string
      displayName: Form
      description: "`form`: Capsule, Tablet, Liquid and so on, in the phone's
        language"
    status:
      type: string
      displayName: Status
      description: "`status`: Taken, Skipped, Snoozed, Not Logged and so on,
        in the phone's language"
    isArchived:
      type: bool
      displayName: Archived
      description: "`isArchived`: whether the medication is no longer tracked"
    dosage:
      type: float
      displayName: Dosage
      description: "`dosage`: the amount, in units that depend on the medication"
    codings:
      type: object
      repeated: true
      displayName: Codes
      description: "`codings`: the medication's codes in RxNorm, NDC or another
        system"
      fields:
        code:
          type: string
          description: "`code`"
        system:
          type: string
          description: "`system`: the coding system"
        version:
          type: string
          description: "`version`: the system's version"
