---
# Keyed `applehealth/<account>/<id>`, HealthKit's UUID. The app writes these
# dates in ISO 8601 with `Z`, unlike every other section.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/applehealth/stateofmind
data:
  authority: providers.substrate.reamde.dev
  package: applehealth
  description: "A mood or emotion you logged in the Health app, on iOS 18
    and later. It holds how pleasant it felt, the words you chose for it and
    what it was about."
  names:
    singular: stateofmind
  label:
    singular: "State of mind"
    plural: "States of mind"
  traits:
    - substrate.reamde.dev/core/temporal(range)
  displayTemplate: "{valenceClassification|kind} {start}"
  properties:
    account:
      type: reference
      kind: providers.substrate.reamde.dev/applehealth/account
      required: true
      onDelete: cascade
      displayName: Account
      description: "the phone this entry arrived from"
    export:
      type: reference
      kind: providers.substrate.reamde.dev/applehealth/export
      displayName: Delivery
      description: "the latest delivery that carried this record"
    receivedAt:
      type: datetime
      displayName: Received
      description: "when that delivery arrived"
    stateOfMindId:
      type: string
      required: true
      displayName: Entry ID
      description: "`id`: HealthKit's UUID for the entry"
    start:
      type: string
      displayName: Start
      description: "`start`: when the feeling began, as the app wrote it;
        `at` holds the instant"
    end:
      type: string
      displayName: End
      description: "`end`: when it ended, as the app wrote it; `endsAt` holds
        the instant"
    kind:
      type: string
      displayName: Kind of entry
      description: "`kind`: daily_mood or momentary_emotion"
    labels:
      type: string
      repeated: true
      displayName: Labels
      description: "`labels`: the words chosen (calm, anxious, happy), lowercase"
    associations:
      type: string
      repeated: true
      displayName: Associations
      description: "`associations`: what it was about (work, family, fitness)"
    valence:
      type: float
      displayName: Valence
      description: "`valence`: from -1, very unpleasant, to 1, very pleasant"
    valenceClassification:
      type: string
      displayName: Feeling
      description: "`valenceClassification`: very_unpleasant through very_pleasant,
        seven steps"
    metadata:
      type: json
      displayName: Metadata
      description: "`metadata`: the entry's metadata keys as the app sent
        them"
