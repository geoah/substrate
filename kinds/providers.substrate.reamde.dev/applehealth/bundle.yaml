            start:
              type: string
              description: "`start`, as the app wrote it"
            end:
              type: string
              description: "`end`, as the app wrote it"
            interval:
              type: object
              description: "`interval`: the sampling interval"
              fields:
                duration:
                  type: float
                  description: "`duration`"
                units:
                  type: string
                  description: "`units` (`s`)"
---
# Runs on the `applehealth-webhook` trigger. A refused delivery (no account,
# a body that is not the app's JSON) raises, so the delivery parks with its
# body kept and `substratectl trigger retry` delivers it after the fix; the
# app itself never sends a part again. Reads are the merge: a metric batch
# is read, merged with the delivery's rows and written back under
# `ifVersion`, so two deliveries racing on one batch retry rather than lose
# rows.
kind: substrate.reamde.dev/core/function
metadata:
  id: providers.substrate.reamde.dev/applehealth/applehealthingest
data:
  authority: providers.substrate.reamde.dev
  package: applehealth
  description: "Write one Health Auto Export delivery as applehealth mirror
    rows: metric batches, workouts, state of mind, medications, symptoms,
    cycle tracking, ECGs and heart rate notifications, plus one export receipt,
    and stamp the account's sync state. A redelivery of the same time rewrites
    the same records. Runs on the applehealth-webhook trigger; not meant to
    be called by hand."
  runtime: python
  timeout: PT60S
  returns:
    - name: export
      type: string
      description: "the export receipt's id, the delivery's fire id"
    - name: account
      type: string
      description: "the account the delivery was written to"
    - name: written
      type: int
      description: "records created or changed so far"
    - name: unchanged
      type: int
      description: "records that already held what the delivery carried"
    - name: remaining
      type: int
      description: "records still to write on the next page"
    - name: skipped
      type: string
      description: "why nothing was written, when nothing was"
    - name: droppedFields
      type: string
      repeated: true
      description: "fields with no declared place, as section.field"
  permissions:
    reads:
      kinds:
        - providers.substrate.reamde.dev/applehealth/metricbatch
        - providers.substrate.reamde.dev/applehealth/workout
        - providers.substrate.reamde.dev/applehealth/stateofmind
        - providers.substrate.reamde.dev/applehealth/medication
        - providers.substrate.reamde.dev/applehealth/symptom
        - providers.substrate.reamde.dev/applehealth/cycleevent
        - providers.substrate.reamde.dev/applehealth/ecg
        - providers.substrate.reamde.dev/applehealth/heartratenotification
      budgets:
        calls: 1000
        rows: 10000
    writes:
      - providers.substrate.reamde.dev/applehealth/account
      - providers.substrate.reamde.dev/applehealth/export
      - providers.substrate.reamde.dev/applehealth/metricbatch
      - providers.substrate.reamde.dev/applehealth/workout
      - providers.substrate.reamde.dev/applehealth/stateofmind
      - providers.substrate.reamde.dev/applehealth/medication
      - providers.substrate.reamde.dev/applehealth/symptom
      - providers.substrate.reamde.dev/applehealth/cycleevent
      - providers.substrate.reamde.dev/applehealth/ecg
      - providers.substrate.reamde.dev/applehealth/heartratenotification
  source: |
    """Health Auto Export delivery -> applehealth mirror rows.

    One webhook POST from the app is one delivery. The body is the app's JSON
    export, `{"data": {"metrics": [...], "workouts": [...], ...}}`, and every
    section it carries lands as mirror rows, in the app's own field names and
    units. Nothing is converted and nothing is computed beyond the instants the
    timeline needs.

    The writes are idempotent by time, not by delivery. The app never re-sends a
    failed part and a correction arrives as the same bucket sent again, sometimes
    under another `source` label, so a metric row is keyed by its instant and a
    metric batch by (account, metric, grouping, period): a redelivery rewrites the
    same batch, and a row the later delivery no longer carries inside the span it
    covers is gone from the batch. Every other section is keyed by the app's own
    `id`, or by its name and start where it has none.

    A delivery the body cannot read raises, so it parks with its body kept and a
    retry after the fix (an account created, a provider upgraded) delivers it.
    """

    import base64
    import datetime
    import hashlib
    import json
    import math
    import re
    from zoneinfo import ZoneInfo, ZoneInfoNotFoundError

    PKG = "providers.substrate.reamde.dev/applehealth/"
    ACCOUNT = PKG + "account"
    EXPORT = PKG + "export"
    METRICBATCH = PKG + "metricbatch"
    WORKOUT = PKG + "workout"
    STATEOFMIND = PKG + "stateofmind"
    MEDICATION = PKG + "medication"
    SYMPTOM = PKG + "symptom"
    CYCLEEVENT = PKG + "cycleevent"
    ECG = PKG + "ecg"
    HRNOTIFICATION = PKG + "heartratenotification"

    ACCOUNT_HEADER = "x-substrate-account"

    # One page's bounds. The body's response frame is capped at 8 MiB (host.py
    # MAX_FRAME_BYTES), so a page stops staging past half of it, and a page reads
    # at most the 1000 calls its declaration grants, with room for the rest.
    PAGE_BYTES = 4 << 20
    PAGE_UNITS = 900
    MAX_ID = 128
    MAX_DROPPED = 100

    UTC = datetime.timezone.utc

    # The app's time grouping (the `automation-aggregation` header) decides how
    # much time one metric batch covers, so a batch holds at most a few thousand
    # rows: an hour of seconds or minutes, a day of hours, a month of days, a
    # year of anything coarser.
    PERIOD_OF = {
        "seconds": "hour", "minutes": "hour", "hours": "day", "days": "month",
        "weeks": "year", "months": "year", "years": "year",
    }

    # Field specs: the app's key maps to (property or field name, spec). A spec is
    # "f" a number, "i" an integer, "s" a string, "b" a boolean, "d" a date as the
    # app wrote it (a string, or an epoch number kept as its decimal text), "ls" a
    # list of strings, "j" any JSON, a dict an object of its own, and ("list",
    # spec) a list of such objects.
    QTY = {"qty": ("qty", "f"), "units": ("units", "s")}

    METRIC_ROW = {
        "date": ("date", "d"), "startDate": ("startDate", "d"), "endDate": ("endDate", "d"),
        "qty": ("qty", "f"),
        "Min": ("min", "f"), "Avg": ("avg", "f"), "Max": ("max", "f"),
        "min": ("min", "f"), "avg": ("avg", "f"), "max": ("max", "f"),
        "systolic": ("systolic", "f"), "diastolic": ("diastolic", "f"),
        "source": ("source", "s"),
        "mealTime": ("mealTime", "s"), "reason": ("reason", "s"), "value": ("value", "s"),
        "Unspecified": ("unspecified", "f"), "Protection Used": ("protectionUsed", "f"),
        "Protection Not Used": ("protectionNotUsed", "f"),
        "totalSleep": ("totalSleep", "f"), "asleep": ("asleep", "f"), "core": ("core", "f"),
        "deep": ("deep", "f"), "rem": ("rem", "f"), "awake": ("awake", "f"),
        "inBed": ("inBed", "f"),
        "sleepStart": ("sleepStart", "d"), "sleepEnd": ("sleepEnd", "d"),
        "inBedStart": ("inBedStart", "d"), "inBedEnd": ("inBedEnd", "d"),
    }

    HR_ROW = {
        "date": ("date", "d"),
        "Min": ("min", "f"), "Avg": ("avg", "f"), "Max": ("max", "f"),
        "min": ("min", "f"), "avg": ("avg", "f"), "max": ("max", "f"),
        "qty": ("qty", "f"), "units": ("units", "s"), "source": ("source", "s"),
    }

    SERIES_ROW = {
        "date": ("date", "d"), "qty": ("qty", "f"), "units": ("units", "s"),
        "source": ("source", "s"),
    }

    ROUTE_POINT = {
        "latitude": ("latitude", "f"), "longitude": ("longitude", "f"),
        "altitude": ("altitude", "f"), "course": ("course", "f"),
        "courseAccuracy": ("courseAccuracy", "f"),
        "horizontalAccuracy": ("horizontalAccuracy", "f"),
        "verticalAccuracy": ("verticalAccuracy", "f"),
        "timestamp": ("timestamp", "d"), "speed": ("speed", "f"),
        "speedAccuracy": ("speedAccuracy", "f"),
    }

    WORKOUT_QTY = (
        "activeEnergyBurned", "totalEnergy", "intensity", "distance", "speed",
        "avgSpeed", "maxSpeed", "elevationUp", "elevationDown", "temperature",
        "humidity", "lapLength", "totalSwimmingStrokeCount", "swimCadence",
        "stepCadence", "flightsClimbed", "avgHeartRate", "maxHeartRate",
    )
    WORKOUT_SERIES = (
        "activeEnergy", "basalEnergy", "stepCount", "walkingAndRunningDistance",
        "cyclingCadence", "cyclingDistance", "cyclingPower", "cyclingSpeed",
        "swimDistance", "swimStroke",
    )
    WORKOUT_ENTRY = dict(
        {"id": ("workoutId", "s"), "name": ("name", "s"), "start": ("start", "d"),
         "end": ("end", "d"), "duration": ("duration", "f"), "location": ("location", "s"),
         "isIndoor": ("isIndoor", "b"), "strokeStyle": ("strokeStyle", "s"),
         "swolfScore": ("swolfScore", "f"), "salinity": ("salinity", "s"),
         "heartRate": ("heartRate", {"min": ("min", QTY), "avg": ("avg", QTY), "max": ("max", QTY)}),
         "heartRateData": ("heartRateData", ("list", HR_ROW)),
         "heartRateRecovery": ("heartRateRecovery", ("list", HR_ROW)),
         "route": ("route", ("list", ROUTE_POINT)),
         "metadata": ("metadata", "j")},
        **{k: (k, QTY) for k in WORKOUT_QTY},
        **{k: (k, ("list", SERIES_ROW)) for k in WORKOUT_SERIES})

    STATE_OF_MIND_ENTRY = {
        "id": ("stateOfMindId", "s"), "start": ("start", "d"), "end": ("end", "d"),
        "kind": ("kind", "s"), "labels": ("labels", "ls"), "associations": ("associations", "ls"),
        "valence": ("valence", "f"), "valenceClassification": ("valenceClassification", "s"),
        "metadata": ("metadata", "j"),
    }

    MEDICATION_ENTRY = {
        "displayText": ("displayText", "s"), "nickname": ("nickname", "s"),
        "start": ("start", "d"), "end": ("end", "d"), "scheduledDate": ("scheduledDate", "d"),
        "form": ("form", "s"), "status": ("status", "s"), "isArchived": ("isArchived", "b"),
        "dosage": ("dosage", "f"),
        "codings": ("codings", ("list", {"code": ("code", "s"), "system": ("system", "s"),
                                         "version": ("version", "s")})),
    }

    SYMPTOM_ENTRY = {
        "start": ("start", "d"), "end": ("end", "d"), "name": ("name", "s"),
        "severity": ("severity", "s"), "userEntered": ("userEntered", "b"),
        "source": ("source", "s"),
    }

    CYCLE_ENTRY = {
        "start": ("start", "d"), "end": ("end", "d"), "name": ("name", "s"),
        "value": ("value", "s"), "isCycleStart": ("isCycleStart", "b"),
        "source": ("source", "s"),
    }

    ECG_ENTRY = {
        "start": ("start", "d"), "end": ("end", "d"), "classification": ("classification", "s"),
        "severity": ("severity", "s"), "averageHeartRate": ("averageHeartRate", "f"),
        "numberOfVoltageMeasurements": ("numberOfVoltageMeasurements", "i"),
        "samplingFrequency": ("samplingFrequency", "f"), "source": ("source", "s"),
        "voltageMeasurements": ("voltageMeasurements", ("list", {
            "date": ("date", "d"), "voltage": ("voltage", "f"), "units": ("units", "s")})),
    }

    TIMESTAMP = {
        "start": ("start", "d"), "end": ("end", "d"),
        "interval": ("interval", {"duration": ("duration", "f"), "units": ("units", "s")}),
    }
    HR_NOTIFICATION_ENTRY = {
        "heartNotification": ("heartNotification", "s"), "threshold": ("threshold", "f"),
        "start": ("start", "d"), "end": ("end", "d"),
        "source": ("source", {"name": ("name", "s"), "identifier": ("identifier", "s")}),
        "heartRateData": ("heartRateData", ("list", {
            "qty": ("qty", "f"), "units": ("units", "s"), "date": ("date", "d"),
            "start": ("start", "d"), "end": ("end", "d")})),
        "heartRate": ("heartRate", ("list", {
            "hr": ("hr", "f"), "units": ("units", "s"), "timestamp": ("timestamp", TIMESTAMP)})),
        "heartRateVariation": ("heartRateVariation", ("list", {
            "hrv": ("hrv", "f"), "units": ("units", "s"), "timestamp": ("timestamp", TIMESTAMP)})),
    }

    # The sections other than metrics: the account toggle that keeps each, the
    # kind its entries land as, the spec, and the id the app gives an entry
    # (None where it gives none and the name and start compose one).
    SECTIONS = (
        ("workouts", "enabledWorkouts", WORKOUT, WORKOUT_ENTRY, "id", None),
        ("stateOfMind", "enabledStateOfMind", STATEOFMIND, STATE_OF_MIND_ENTRY, "id", None),
        ("medications", "enabledMedications", MEDICATION, MEDICATION_ENTRY, None, ("displayText", "nickname")),
        ("symptoms", "enabledSymptoms", SYMPTOM, SYMPTOM_ENTRY, None, ("name",)),
        ("cycleTracking", "enabledCycleTracking", CYCLEEVENT, CYCLE_ENTRY, None, ("name",)),
        ("ecg", "enabledEcg", ECG, ECG_ENTRY, None, ()),
        ("heartRateNotifications", "enabledHeartRateNotifications", HRNOTIFICATION, HR_NOTIFICATION_ENTRY,
         None, ("heartNotification",)),
    )
    KNOWN_SECTIONS = ("metrics",) + tuple(s[0] for s in SECTIONS)

    DATE_RE = re.compile(
        r"^(\d{4})-(\d{2})-(\d{2})"
        r"(?:[ T](\d{2}):(\d{2})(?::(\d{2})(?:[.,](\d{1,9}))?)?)?"
        r"\s*(Z|z|[+-]\d{2}(?::?\d{2})?)?$")
    NOT_ID = re.compile(r"[^A-Za-z0-9._~:@-]+")


    class Refused(Exception):
        """A delivery this body will not write: the run fails with the message."""


    # ---- values -----------------------------------------------------------------

    def number(v):
        return (isinstance(v, (int, float)) and not isinstance(v, bool)
                and not (isinstance(v, float) and not math.isfinite(v)))


    def parse_instant(value, tz):
        """The instant one of the app's dates names, as an aware UTC datetime, or
        None. A date without an offset is read in the account's time zone, else
        UTC; a number is epoch seconds (milliseconds past 1e11)."""
        if number(value):
            secs = float(value)
            if abs(secs) > 1e11:
                secs /= 1000.0
            try:
                return datetime.datetime.fromtimestamp(secs, UTC)
            except (OverflowError, OSError, ValueError):
                return None
        if not isinstance(value, str):
            return None
        m = DATE_RE.match(value.strip())
        if not m:
            return None
        y, mo, d, h, mi, s, frac, off = m.groups()
        try:
            micro = int((frac or "0")[:6].ljust(6, "0"))
            naive = datetime.datetime(int(y), int(mo), int(d), int(h or 0), int(mi or 0),
                                      int(s or 0), micro)
            if off is None:
                aware = naive.replace(tzinfo=tz or UTC)
            elif off in ("Z", "z"):
                aware = naive.replace(tzinfo=UTC)
            else:
                digits = off[1:].replace(":", "")
                delta = datetime.timedelta(hours=int(digits[:2]), minutes=int(digits[2:4] or 0))
                aware = naive.replace(tzinfo=datetime.timezone(-delta if off[0] == "-" else delta))
            return aware.astimezone(UTC)
        except (ValueError, OverflowError):
            return None


    def rfc3339(dt):
        out = dt.strftime("%Y-%m-%dT%H:%M:%S")
        if dt.microsecond:
            out += "." + ("%06d" % dt.microsecond).rstrip("0")
        return out + "Z"


    def id_instant(dt):
        return dt.strftime("%Y-%m-%dT%H:%M:%SZ")


    def segment(s):
        """One id segment: the id alphabet, runs of anything else as one dash."""
        return NOT_ID.sub("-", str(s)).strip("-._~:@") or "x"


    def slug(s):
        return re.sub(r"[^a-z0-9]+", "-", str(s).lower()).strip("-") or "x"


    def compose(*parts):
        """A readable id from its segments; past the 128-character cap the
        segments after the account fold into one SHA-256."""
        out = "/".join(segment(p) for p in parts)
        if len(out) <= MAX_ID:
            return out
        tail = hashlib.sha256("/".join(str(p) for p in parts[1:]).encode("utf-8")).hexdigest()[:32]
        return segment(parts[0])[:MAX_ID - 33] + "/" + tail


    def suffixed(rid, n):
        """The nth record of one id within a delivery (two symptoms of one name
        logged in the same second)."""
        tail = "/%d" % n
        if len(rid) + len(tail) <= MAX_ID:
            return rid + tail
        return rid[:MAX_ID - len(tail)] + tail


    def fit(value, spec, path, dropped):
        """The value in its declared shape, or None (recorded in dropped) when the
        app sent something the declaration has no place for."""
        if value is None:
            return None
        if isinstance(spec, dict):
            if not isinstance(value, dict):
                dropped.add(path)
                return None
            out = {}
            for key, v in value.items():
                if key not in spec:
                    dropped.add(path + "." + str(key))
                    continue
                name, sub = spec[key]
                got = fit(v, sub, path + "." + str(key), dropped)
                if got is not None:
                    out[name] = got
            return out or None
        if isinstance(spec, tuple):
            if not isinstance(value, list):
                dropped.add(path)
                return None
            out = [fit(v, spec[1], path, dropped) for v in value]
            return [v for v in out if v is not None] or None
        if spec == "f":
            if number(value):
                return value
        elif spec == "i":
            if number(value) and float(value).is_integer():
                return int(value)
        elif spec == "s":
            if isinstance(value, str):
                return value
        elif spec == "d":
            if isinstance(value, str):
                return value
            if number(value):
                return repr(value)
        elif spec == "b":
            if isinstance(value, bool):
                return value
        elif spec == "ls":
            if isinstance(value, list):
                kept = [v for v in value if isinstance(v, str)]
                if len(kept) != len(value):
                    dropped.add(path)
                return kept or None
        elif spec == "j":
            return value
        dropped.add(path)
        return None


    def same(stored, props):
        """Whether a stored record already carries every property props names, so
        the write would change nothing but its receipt."""
        if not stored:
            return False
        have = stored.get("properties") or {}
        return all(have.get(k) == v for k, v in props.items())


    # ---- periods ----------------------------------------------------------------

    def period(size, dt):
        if size == "hour":
            start = dt.replace(minute=0, second=0, microsecond=0)
            return start.strftime("%Y-%m-%dT%H"), start, start + datetime.timedelta(hours=1)
        if size == "day":
            start = dt.replace(hour=0, minute=0, second=0, microsecond=0)
            return start.strftime("%Y-%m-%d"), start, start + datetime.timedelta(days=1)
        if size == "month":
            start = dt.replace(day=1, hour=0, minute=0, second=0, microsecond=0)
            end = (start.replace(year=start.year + 1, month=1) if start.month == 12
                   else start.replace(month=start.month + 1))
            return start.strftime("%Y-%m"), start, end
        start = dt.replace(month=1, day=1, hour=0, minute=0, second=0, microsecond=0)
        return start.strftime("%Y"), start, start.replace(year=start.year + 1)


    def grouping_of(headers):
        g = (headers.get("automation-aggregation") or "").strip().lower()
        if g in PERIOD_OF:
            return g, PERIOD_OF[g]
        if g + "s" in PERIOD_OF:
            return g + "s", PERIOD_OF[g + "s"]
        return "unknown", "day"


    def row_instant(row, tz):
        when = row.get("date")
        if when is None:
            when = row.get("startDate")
        return parse_instant(when, tz)


    def row_order(item):
        when, row = item
        return (when, row.get("source") or "", json.dumps(row, sort_keys=True))


    # ---- the request ------------------------------------------------------------

    def resolve_account(accounts, headers):
        accounts = [a for a in (accounts or []) if isinstance(a, dict) and a.get("kind") == ACCOUNT]
        named = (headers.get(ACCOUNT_HEADER) or "").strip()
        if named:
            for a in accounts:
                if a.get("id") == named:
                    return a
            raise Refused("the delivery names account %r in X-Substrate-Account and no %s record "
                          "has that id: create it, then retry the parked delivery" % (named, ACCOUNT))
        if len(accounts) == 1:
            return accounts[0]
        if not accounts:
            raise Refused("no %s record exists: create one (its id is yours to choose), then retry "
                          "the parked delivery" % ACCOUNT)
        raise Refused("the delivery carries no X-Substrate-Account header and %d account records "
                      "exist (%s): add the header to the automation, then retry the parked delivery"
                      % (len(accounts), ", ".join(sorted(str(a.get("id")) for a in accounts))))


    def body_bytes(request):
        if request.get("parts") is not None:
            raise Refused("the body is multipart/form-data, which is the app's CSV format: set the "
                          "automation's Export Format to JSON")
        body = request.get("body") or {}
        if isinstance(body.get("text"), str):
            return body["text"].encode("utf-8")
        if isinstance(body.get("base64"), str):
            try:
                return base64.b64decode(body["base64"], validate=True)
            except ValueError as e:
                raise Refused("the body is not readable base64: %s" % e)
        raise Refused("the request carries no body")


    def zone_of(props):
        name = props.get("timezone")
        if not isinstance(name, str) or not name:
            return None
        try:
            return ZoneInfo(name)
        except (ZoneInfoNotFoundError, ValueError):
            return None


    class Unit:
        """One record the delivery implies: its kind and id, and how to build its
        properties from the stored record (None when nothing would change)."""

        def __init__(self, kind, rid, build, guarded):
            self.kind, self.id, self.build, self.guarded = kind, rid, build, guarded


    class Delivery:
        def __init__(self):
            self.units = []
            self.counts = {"metrics": 0, "metricRows": 0}
            self.metric_names = []
            self.skipped = []
            self.dropped = set()
            self.dropped_rows = 0
            self.lo = None
            self.hi = None

        def saw(self, dt):
            if dt is None:
                return
            self.lo = dt if self.lo is None or dt < self.lo else self.lo
            self.hi = dt if self.hi is None or dt > self.hi else self.hi


    def read_delivery(raw, headers, account, fire_id, received):
        """Every record the delivery implies, in a stable order, or Refused."""
        aid = account["id"]
        props = account.get("properties") or {}
        tz = zone_of(props)
        try:
            doc = json.loads(raw)
        except (ValueError, UnicodeDecodeError) as e:
            raise Refused("the body is not JSON: %s" % e)
        if not isinstance(doc, dict) or not isinstance(doc.get("data"), dict):
            raise Refused("the body has no `data` object: this is not a Health Auto Export JSON export")
        data = doc["data"]
        for key in doc:
            if key != "data":
                raise Refused("the body carries %r beside `data`: this is not a Health Auto Export "
                              "JSON export" % key)
        for key, value in data.items():
            if key in KNOWN_SECTIONS and value is not None and not isinstance(value, list):
                raise Refused("data.%s is not a list" % key)

        d = Delivery()
        account_ref = {"ref": ACCOUNT + "/" + aid}
        export_ref = {"ref": EXPORT + "/" + fire_id}
        receipt = {"export": export_ref, "receivedAt": received}
        for key in data:
            if key not in KNOWN_SECTIONS:
                d.dropped.add("data." + str(key))

        # ---- metrics ----
        metrics = data.get("metrics") or []
        if metrics and props.get("enabledMetrics") is False:
            d.skipped.append("metrics")
            metrics = []
        grouping, size = grouping_of(headers)
        by_name = {}
        for i, metric in enumerate(metrics):
            if not isinstance(metric, dict):
                raise Refused("data.metrics[%d] is not an object" % i)
            name = metric.get("name")
            if not isinstance(name, str) or not name.strip():
                raise Refused("data.metrics[%d] has no name" % i)
            units = metric.get("units")
            if units is not None and not isinstance(units, str):
                raise Refused("data.metrics[%d] (%s): units is not a string" % (i, name))
            rows = metric.get("data")
            if rows is None:
                rows = []
            if not isinstance(rows, list):
                raise Refused("data.metrics[%d] (%s): data is not a list" % (i, name))
            if name in by_name and by_name[name]["units"] != units:
                raise Refused("data.metrics names %s twice, in %r and %r" % (name, by_name[name]["units"], units))
            entry = by_name.setdefault(name, {"units": units, "rows": []})
            for key in metric:
                if key not in ("name", "units", "data"):
                    d.dropped.add("metrics.%s.%s" % (name, key))
            d.counts["metrics"] += 1
            for row in rows:
                d.counts["metricRows"] += 1
                if not isinstance(row, dict):
                    d.dropped_rows += 1
                    continue
                when = row_instant(row, tz)
                fitted = fit(row, METRIC_ROW, "metrics.%s" % name, d.dropped)
                if when is None or not fitted:
                    d.dropped_rows += 1
                    continue
                d.saw(when)
                entry["rows"].append((when, fitted))
        for name in sorted(by_name):
            entry = by_name[name]
            d.metric_names.append(name)
            rows = entry["rows"]
            if not rows:
                continue
            lo = min(w for w, _ in rows)
            hi = max(w for w, _ in rows)
            batches = {}
            for when, row in rows:
                key, start, end = period(size, when)
                batches.setdefault(key, (start, end, []))[2].append((when, row))
            for key in sorted(batches):
                start, end, fresh = batches[key]
                d.units.append(Unit(METRICBATCH, compose(aid, name, grouping, key),
                                    batch_builder(account_ref, receipt, name, entry["units"], grouping,
                                                  start, end, fresh, lo, hi, tz),
                                    True))

        # ---- everything else ----
        for section, toggle, kind, spec, own_id, name_keys in SECTIONS:
            entries = data.get(section) or []
            if entries and props.get(toggle) is False:
                d.skipped.append(section)
                continue
            d.counts[section] = len(entries)
            seen = {}
            for n, entry in enumerate(entries):
                where = "data.%s[%d]" % (section, n)
                if not isinstance(entry, dict):
                    raise Refused("%s is not an object" % where)
                fitted = fit(entry, spec, section, d.dropped) or {}
                if section == "heartRateNotifications" and isinstance(entry.get("source"), str):
                    fitted["source"] = {"name": entry["source"]}
                    d.dropped.discard(section + ".source")
                start = parse_instant(entry.get("start"), tz)
                end = parse_instant(entry.get("end"), tz)
                d.saw(start)
                d.saw(end)
                if own_id:
                    upstream = entry.get(own_id)
                    if not isinstance(upstream, str) or not upstream.strip():
                        raise Refused("%s has no id%s" % (where, ": set the automation's Export Version "
                                                           "to 2" if section == "workouts" else ""))
                    rid = compose(aid, upstream)
                else:
                    when = start
                    if section == "medications":
                        when = parse_instant(entry.get("scheduledDate"), tz) or start
                    label = next((entry[k] for k in name_keys
                                  if isinstance(entry.get(k), str) and entry[k].strip()), None)
                    parts = [aid] + ([slug(label or section)] if name_keys else [])
                    rid = compose(*(parts + [id_instant(when)])) if when else compose(aid, fire_id, section, n)
                seen[rid] = seen.get(rid, 0) + 1
                if seen[rid] > 1:
                    rid = suffixed(rid, seen[rid])
                props_out = dict(fitted)
                props_out["account"] = account_ref
                if start is not None:
                    props_out["at"] = rfc3339(start)
                    if end is not None and end >= start:
                        props_out["endsAt"] = rfc3339(end)
                d.units.append(Unit(kind, rid, entry_builder(props_out, receipt), False))
        return d


    def entry_builder(props, receipt):
        def build(stored):
            if same(stored, props):
                return None
            out = dict(props)
            out.update(receipt)
            return out
        return build


    def batch_builder(account_ref, receipt, name, units, grouping, start, end, fresh, lo, hi, tz):
        """A metric batch's rows after this delivery: the stored rows outside the
        span [lo, hi] this delivery covers for the metric, and every row the
        delivery carries inside the batch's period. A change of units replaces the
        batch whole: one batch is one slice of one metric object, in one unit."""
        def build(stored):
            have = (stored or {}).get("properties") or {}
            kept = []
            if stored and have.get("units") == units:
                for row in have.get("rows") or []:
                    when = row_instant(row, tz)
                    if when is None or when < lo or when > hi:
                        kept.append((when or start, row))
            rows = [row for _, row in sorted(kept + list(fresh), key=row_order)]
            props = {"account": account_ref, "name": name, "grouping": grouping,
                     "at": rfc3339(start), "endsAt": rfc3339(end), "rows": rows}
            if units is not None:
                props["units"] = units
            if stored and have.get("units") == units and have.get("rows") == rows:
                return None
            props.update(receipt)
            return props
        return build


    # ---- the run ----------------------------------------------------------------

    def main(input, host):
        envelope = input.get("envelope") or {}
        request = envelope.get("request")
        if not isinstance(request, dict):
            raise Refused("applehealthingest runs on the applehealth-webhook trigger; this "
                          "invocation carries no webhook request")
        fire = envelope.get("fire") or {}
        fire_id = fire.get("id")
        received_at = parse_instant(fire.get("at"), None)
        if not isinstance(fire_id, str) or not fire_id or received_at is None:
            raise Refused("the envelope carries no fire id and time")
        received = rfc3339(received_at)
        headers = {str(k).lower(): str(v) for k, v in (request.get("headers") or {}).items()}
        account = resolve_account((input.get("config") or {}).get("accounts"), headers)
        aid = account["id"]
        if (account.get("properties") or {}).get("syncPaused") is True:
            host.log("applehealth: account %s is paused, the delivery is dropped" % aid)
            return {"output": {"account": aid, "skipped": "the account is paused"}}

        raw = body_bytes(request)
        d = read_delivery(raw, headers, account, fire_id, received)

        cur = host.page.resume() or {}
        i = int(cur.get("next") or 0)
        written = int(cur.get("written") or 0)
        unchanged = int(cur.get("unchanged") or 0)
        used_bytes = used_units = 0
        total = len(d.units)
        while i < total:
            if used_units >= PAGE_UNITS:
                break
            unit = d.units[i]
            stored = host.records.get(unit.kind, unit.id)
            props = unit.build(stored)
            if props is None:
                unchanged += 1
            else:
                size = len(json.dumps(props))
                if used_units and used_bytes + size > PAGE_BYTES:
                    break
                if unit.guarded:
                    host.effects.put(unit.kind, unit.id, properties=props,
                                     if_version=host.version(stored))
                else:
                    host.effects.put(unit.kind, unit.id, properties=props)
                written += 1
                used_bytes += size
            used_units += 1
            i += 1

        if i < total:
            host.effects.patch(ACCOUNT, aid, properties={
                "syncState": "running", "lastSyncStartedAt": received,
                "syncProgress": {"phase": "writing", "done": i, "total": total, "pending": total - i}})
            return {"output": {"export": fire_id, "account": aid, "written": written,
                               "unchanged": unchanged, "remaining": total - i},
                    "more": host.page.more({"next": i, "written": written, "unchanged": unchanged})}

        dropped = sorted(d.dropped)
        export = {
            "account": {"ref": ACCOUNT + "/" + aid},
            "at": received,
            "byteSize": len(raw),
            "bodySha256": hashlib.sha256(raw).hexdigest(),
            "counts": d.counts,
            "written": written,
            "unchanged": unchanged,
            "droppedRows": d.dropped_rows,
        }
        for header, prop in (("session-id", "sessionId"), ("automation-name", "automationName"),
                             ("automation-id", "automationId"),
                             ("automation-aggregation", "automationAggregation"),
                             ("automation-period", "automationPeriod"), ("user-agent", "userAgent"),
                             ("content-type", "contentType")):
            if headers.get(header):
                export[prop] = headers[header]
        if d.metric_names:
            export["metricNames"] = d.metric_names
        if d.skipped:
            export["skippedSections"] = d.skipped
        if dropped:
            export["droppedFields"] = dropped[:MAX_DROPPED]
        if d.lo is not None:
            export["spanStart"] = rfc3339(d.lo)
            export["spanEnd"] = rfc3339(d.hi)
        host.effects.put(EXPORT, fire_id, properties=export)

        now = datetime.datetime.now(UTC)
        message = "%d records written, %d unchanged, from %d metric rows of %d metrics" % (
            written, unchanged, d.counts["metricRows"], len(d.metric_names))
        host.effects.patch(ACCOUNT, aid, properties={
            "syncState": "ok", "syncMessage": message, "lastSyncedAt": rfc3339(now),
            "lastSyncStartedAt": received,
            "lastSyncDurationMs": max(0, int((now - received_at).total_seconds() * 1000)),
            "syncProgress": None, "syncError": None, "syncErrorAt": None,
            "lastExport": {"ref": EXPORT + "/" + fire_id}})
        if dropped:
            host.log("applehealth: dropped fields the declaration has no place for: %s"
                     % ", ".join(dropped[:20]))
        out = {"export": fire_id, "account": aid, "written": written, "unchanged": unchanged,
               "remaining": 0}
        if dropped:
            out["droppedFields"] = dropped[:MAX_DROPPED]
        return {"output": out}
