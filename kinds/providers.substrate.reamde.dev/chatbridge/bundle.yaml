# The chat bridge provider: every chat network the chat bridge program signs
# in to as the owner (cmd/chatbridge, a separate AGPL program), mirrored into
# one set of kinds, and what the owner or an agent asks to be done in a chat,
# carried out by the bridge.
#
# THE BRIDGE DIALS OUT. It POSTs one batch of events at a time to the
# `chatbridge-events` webhook (triggers.yaml), which `chatevents` applies, and
# it follows the change feed for the `chataction` rows the owner and agents
# write. The server never reaches the bridge. README.md is the contract: the
# batch, the events, the ids, the merge rules and the action protocol.
#
# ONE PACKAGE FOR EVERY NETWORK (decision record 0251). A WhatsApp chat and a
# Signal chat are one kind because the bridge's contract makes them one
# shape; the network is a property, never a name prefix.
#
# WHAT ONLY THE OWNER WRITES. An account's settings are `writer: owner`, so no
# app token, function or agent writes them, and an action's `allowNewChat` and
# `cancelRequestedAt` the same. Every agent write of a `chataction` is held for
# the owner by the shipped `chatbridge-agent-actions` policy (policies.yaml,
# decision record 0252).
#
# THE PAGES ARE DATA. The console names no provider's kinds (decision record
# 0166), so how a chat and an account read is the record views this package
# ships (views.yaml).
#
# Install:   substratectl install providers.substrate.reamde.dev/chatbridge,
#            or approve the chat bridge's authorization request, which also
#            keys and turns on its webhook.
# ---- the owned package ----------------------------------------------------
kind: substrate.reamde.dev/core/package
metadata:
  id: providers.substrate.reamde.dev/chatbridge
data:
  authority: providers.substrate.reamde.dev
  package: chatbridge
  # 1: the seven kinds, `chatevents` on the `chatbridge-events` webhook, the
  # six agent tools and the gate policy that holds their writes (decision
  # records 0250, 0251 and 0252).
  version: 1
---
# ---- the bundle document: the install unit --------------------------------
# No inputs and no OAuth: the bridge authenticates with its app token, and
# the accounts are rows its deliveries write.
kind: substrate.reamde.dev/core/bundle
metadata:
  id: providers.substrate.reamde.dev/chatbridge
data:
  authority: providers.substrate.reamde.dev
  package: chatbridge
  description: >-
    Keeps a copy of your chats on the networks the chat bridge signs in to
    as you, and sends, reacts, edits and deletes when you ask, or when an
    agent asks and you approve.
  installs:
    - providers.substrate.reamde.dev/chatbridge/instance
    - providers.substrate.reamde.dev/chatbridge/account
    - providers.substrate.reamde.dev/chatbridge/user
    - providers.substrate.reamde.dev/chatbridge/chat
    - providers.substrate.reamde.dev/chatbridge/message
    - providers.substrate.reamde.dev/chatbridge/messageattachment
    - providers.substrate.reamde.dev/chatbridge/chataction
    - providers.substrate.reamde.dev/chatbridge/chatevents
    - providers.substrate.reamde.dev/chatbridge/send
    - providers.substrate.reamde.dev/chatbridge/react
    - providers.substrate.reamde.dev/chatbridge/unreact
    - providers.substrate.reamde.dev/chatbridge/edit
    - providers.substrate.reamde.dev/chatbridge/delete
    - providers.substrate.reamde.dev/chatbridge/markread
  modules:
    chatbridge_actions.py: |
      """What the six chat bridge tools share: the records they read, and the one
      chataction each writes.

      A tool runs as the agent that called it, and an agent names a new record of
      a kind that is not internal by a minted id alone (decision 0228), so the
      action's id is minted from the call's idempotency key: a retried call names
      the same action and writes nothing new. The write is a create and nothing
      else, so a retry never resets an action the bridge has since claimed.
      """

      PKG = "providers.substrate.reamde.dev/chatbridge/"
      CHAT = PKG + "chat"
      MESSAGE = PKG + "message"
      ACTION = PKG + "chataction"
      MAX_TEXT = 65536


      def record_id(value, kind, what):
          """A record id from a tool argument: the bare id, or the record's path."""
          if not isinstance(value, str) or not value.strip():
              raise ValueError("%s is required: the id of a %s record" % (what, kind))
          value = value.strip()
          if value.startswith(kind + "/"):
              value = value[len(kind) + 1:]
          if not value or "/" in value:
              raise ValueError("%s %r is not the id of a %s record" % (what, value, kind))
          return value


      def read(host, kind, rid, what):
          rec = host.records.get(kind, rid)
          if not rec or rec.get("deletedAt"):
              raise ValueError("%s %s is not a %s this repository holds" % (what, rid, kind))
          return rec


      def chat(host, args, what="chat"):
          return read(host, CHAT, record_id(args.get(what), CHAT, what), what)


      def message(host, args, what="message"):
          return read(host, MESSAGE, record_id(args.get(what), MESSAGE, what), what)


      def chat_of(msg):
          """The chat a message is in, as the path its reference holds."""
          v = (msg.get("properties") or {}).get("chat")
          path = v.get("ref") if isinstance(v, dict) else v
          if not isinstance(path, str) or not path.startswith(CHAT + "/"):
              raise ValueError("message %s names no chat" % msg.get("id"))
          return path


      def in_chat(msg, chat_path, what):
          if chat_of(msg) != chat_path:
              raise ValueError("%s %s is not in chat %s" % (what, msg.get("id"), chat_path))


      def text(args, what="text"):
          v = args.get(what)
          if not isinstance(v, str) or not v.strip():
              raise ValueError("%s is required and may not be empty" % what)
          if len(v) > MAX_TEXT:
              raise ValueError("%s is longer than %d characters" % (what, MAX_TEXT))
          return v.replace("\x00", "")


      def reaction_key(args):
          v = args.get("reactionKey")
          if not isinstance(v, str) or not v.strip():
              raise ValueError("reactionKey is required: the emoji, or the network's own key")
          return v.strip()


      def ask(input, host, name, props):
          """Write the one chataction, and answer its id."""
          key = input.get("idempotencyKey")
          if not isinstance(key, str) or not key:
              raise RuntimeError("the call carries no idempotency key to name its action by")
          aid = host.ids.minted("chatbridge", name, key)
          host.effects.put(ACTION, aid, properties=props, if_absent=True)
          return {"output": {"action": aid}}
---
# ---- one running bridge -----------------------------------------------------
# `appliedSeq` is the stream's applied watermark: `chatevents` applies a batch
# only when it continues it, and moves it in the batch's own transaction under
# the version it read (README.md, "Delivery").
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/chatbridge/instance
data:
  authority: providers.substrate.reamde.dev
  package: chatbridge
  description: >-
    One running copy of the chat bridge program, which signs in to chat networks
    as you. It says its name, its build, the networks it can run, and how
    far its stream of events has been applied.
  purpose: internal
  names:
    singular: instance
  label:
    singular: Bridge instance
    plural: Bridge instances
  displayTemplate: "{instanceName|instanceId}"
  properties:
    instanceId:
      type: string
      required: true
      writer: connector
      displayName: Instance ID
      description: the id the bridge minted when its store was created; a
        bridge that lost its store starts again under a new one
    instanceName:
      type: string
      writer: connector
      displayName: Name
      description: the name the bridge was given where it runs
    version:
      type: string
      writer: connector
      displayName: Build
      description: the bridge build that last said hello
    networks:
      type: object
      repeated: true
      writer: connector
      displayName: Networks
      description: the networks this bridge can sign in to
      fields:
        network:
          type: string
          description: the network's id in the bridge's events, such as whatsapp
        displayName:
          type: string
          description: the network's name for a person, such as WhatsApp
    appliedSeq:
      type: int
      writer: connector
      displayName: Applied through
      description: the sequence number of the last event applied; the bridge
        sends its next batch once this reaches the last one it sent
    skippedEvents:
      type: int
      writer: connector
      displayName: Skipped events
      description: how many events were skipped because this package could
        not apply them
    lastSkipped:
      type: string
      writer: connector
      displayName: Last skipped
      description: the last skipped event and why
    lastSeenAt:
      type: datetime
      writer: connector
      displayName: Last delivery
      description: when a delivery from this bridge last arrived, written
        at most every five minutes
---
# ---- one sign-in on one network ---------------------------------------------
# The connection the provider page lists. It binds `sync` but not
# `accountconfig`: the engine lets only the owner create an accountconfig
# record (write.go checkBundleOwnerGate), and these are created by the
# deliveries when the owner signs in on the bridge. The function stamps the
# sync properties itself, because a webhook fire names no record.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/chatbridge/account
data:
  authority: providers.substrate.reamde.dev
  package: chatbridge
  description: >-
    One of your sign-ins on a chat network, such as your WhatsApp, kept by
    the chat bridge. It carries its state and the network's warnings, who
    you are there, and your settings for it. Deleting it drops every chat
    and message it brought in, and the bridge signs out.
  purpose: supporting
  names:
    singular: account
  traits:
    - substrate.reamde.dev/core/sync
  displayTemplate: "{displayName|remoteName|handle|loginId}"
  properties:
    network:
      type: string
      required: true
      writer: connector
      displayName: Network
      description: the network's id in the bridge's events, such as whatsapp
    loginId:
      type: string
      required: true
      writer: connector
      displayName: Login ID
      description: the bridge's id for this sign-in, which the ids of every
        row it brought in are composed from
    instance:
      type: reference
      kind: providers.substrate.reamde.dev/chatbridge/instance
      writer: connector
      displayName: Runs on
      description: the bridge instance that runs this sign-in; absent once
        the bridge signed out and forgot it
    remoteName:
      type: string
      writer: connector
      displayName: Name on the network
      description: the name the network shows for you
    handle:
      type: string
      writer: connector
      displayName: Handle
      description: your handle on the network, where it has one
    phoneNumber:
      type: string
      writer: connector
      displayName: Phone
      description: the number this sign-in is registered to, where the network
        has one
    user:
      type: reference
      kind: providers.substrate.reamde.dev/chatbridge/user
      writer: connector
      displayName: You
      description: your own person on this network, the sender of what you
        send
    connectionState:
      type: enum
      writer: connector
      displayName: Connection
      description: the bridge's last report of the connection
      values:
        - value: connecting
          label: Connecting
        - value: connected
          label: Connected
        - value: transientdisconnect
          label: Reconnecting
        - value: badcredentials
          label: Signed out by the network
        - value: loggedout
          label: Logged out
        - value: banned
          label: Banned
        - value: unknownerror
          label: Error
    connectionMessage:
      type: string
      writer: connector
      displayName: Connection message
      description: what the network or the bridge said about the connection,
        in its own words
    warnings:
      type: object
      repeated: true
      writer: connector
      displayName: Warnings
      description: limits the network put on this account, which stop all
        sending on it while they last
      fields:
        code:
          type: enum
          description: which limit
          values:
            - value: phoneoffline
              label: Phone offline
            - value: temporaryban
              label: Temporarily banned
            - value: reachouttimelock
              label: New chats paused
            - value: clientoutdated
              label: Bridge out of date
            - value: floodwait
              label: Sending slowed down
            - value: checkpoint
              label: Account check needed
        message:
          type: string
          description: the network's own words for it
        until:
          type: datetime
          description: when it lifts, where the network says
    # The owner's settings, which the bridge reads and nothing else writes.
    displayName:
      type: string
      writer: owner
      displayName: Name
      description: a name for this account, shown wherever it is listed
    syncPaused:
      type: bool
      writer: owner
      displayName: Paused
      description: while true the bridge mirrors nothing from this account
        and sends nothing through it
    syncRequestedAt:
      type: datetime
      writer: owner
      displayName: Sync requested
      description: stamp it with the current time to have the bridge catch
        this account up now
    downloadMedia:
      type: enum
      writer: owner
      displayName: Download media
      description: which files the bridge fetches; small is images and voice
        notes up to 5 MiB, and absent reads as small
      values:
        - value: none
          label: None
        - value: small
          label: Small files
        - value: all
          label: Everything
    sendsPerHour:
      type: int
      min: 0
      writer: owner
      displayName: Sends per hour
      description: the most messages the bridge sends through this account
        in an hour; absent reads as 30
    sendsPerDay:
      type: int
      min: 0
      writer: owner
      displayName: Sends per day
      description: the most messages the bridge sends through this account
        in a day; absent reads as 200
    unlinkRequestedAt:
      type: datetime
      writer: owner
      displayName: Unlink requested
      description: stamp it to have the bridge sign out of this account and
        forget it; the chats and messages stay, where deleting the account
        deletes them
    # The sync trait's connector hands, stamped by chatevents.
    syncState:
      type: string
      writer: connector
      displayName: Sync state
      description: "from the connection: ok when connected, running while
        it connects, throttled while it is down for a moment, erroring when
        it needs you"
    syncMessage:
      type: string
      writer: connector
      displayName: Sync message
      description: the network's words on the connection, its first warning's
        where it gave one
    lastSyncedAt:
      type: datetime
      writer: connector
      displayName: Last synced
      description: when a delivery last carried an event of this account,
        written at most every five minutes
    lastSyncStartedAt:
      type: datetime
      writer: connector
      displayName: Last sync started
      description: "sync trait contract, unwritten: the account syncs as a
        stream, not in runs"
    lastSyncDurationMs:
      type: int
      writer: connector
      displayName: Last sync duration (ms)
      description: "sync trait contract, unwritten: the account syncs as a
        stream, not in runs"
    syncRequestedAck:
      type: datetime
      writer: connector
      displayName: Sync request served
      description: equals syncRequestedAt once the bridge reported its history
        complete after the request
    syncProgress:
      type: json
      writer: connector
      displayName: Sync progress
      description: "{phase, pending} while the bridge is still fetching history;
        cleared when it is complete"
    syncError:
      type: string
      writer: connector
      displayName: Sync error
      description: what needs your hand, in the network's words, while the
        connection is signed out, banned or failing; cleared once it connects
    syncErrorAt:
      type: datetime
      writer: connector
      displayName: Sync error at
      description: when syncError was written; cleared with it
    syncStreams:
      type: json
      writer: connector
      displayName: Sync streams
      description: "history, as {state, lastAt, pending}: how far back the
        bridge has fetched, and how many chats it has left"
---
# ---- one person, as one sign-in sees them -----------------------------------
# The kind the contact mapping reads (core's `chatbridgeuser`): the numbers,
# the addresses and the name. WhatsApp's two ids for one person are two rows,
# which the mapping joins on the number.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/chatbridge/user
data:
  authority: providers.substrate.reamde.dev
  package: chatbridge
  description: >-
    Someone on a chat network, as one of your sign-ins sees them. It holds
    their names, handle, numbers and addresses, and whether they are in your
    address book there. The same person seen through two sign-ins is two records,
    which contacts join.
  purpose: supporting
  names:
    singular: user
  displayTemplate: "{fullName|contactName|handle|userId}"
  properties:
    account:
      type: reference
      kind: providers.substrate.reamde.dev/chatbridge/account
      required: true
      onDelete: cascade
      writer: connector
      displayName: Account
      description: the sign-in this person was seen through
    network:
      type: string
      required: true
      writer: connector
      displayName: Network
      description: the network's id in the bridge's events, such as whatsapp
    userId:
      type: string
      required: true
      writer: connector
      displayName: User ID
      description: the network's id for this person, as the bridge sends it
    fullName:
      type: string
      writer: connector
      displayName: Name
      description: the name the network shows for this person
    handle:
      type: string
      writer: connector
      displayName: Handle
      description: their handle on the network, where it has one
    phoneNumbers:
      type: string
      repeated: true
      writer: connector
      displayName: Phones
      description: their numbers, as the network gives them
    emails:
      type: email
      repeated: true
      writer: connector
      displayName: Emails
      description: their addresses, where the network gives any
    isBot:
      type: bool
      writer: connector
      displayName: Bot
      description: the network marks this account as automated
    isSelf:
      type: bool
      writer: connector
      displayName: You
      description: this is your own person on the network
    contactName:
      type: string
      writer: connector
      displayName: Contact name
      description: the name you saved them under in the network's address
        book
    isContact:
      type: bool
      writer: connector
      displayName: In your contacts
      description: they are in your address book on the network
    avatar:
      type: blobref
      mediaTypes: [image/*]
      writer: connector
      displayName: Avatar
      description: their picture, once the bridge fetched it
---
# ---- one conversation -------------------------------------------------------
# No temporal trait: `lastActivityAt` is a mutation mark, not when the chat
# began. Members are a reference with the membership on the link, because a
# role in one chat belongs to neither the chat nor the person.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/chatbridge/chat
data:
  authority: providers.substrate.reamde.dev
  package: chatbridge
  description: >-
    One conversation on a chat network: a direct chat, a group, a channel
    or a space. It holds its members, its settings, what the network lets
    you do in it, and how far you have read it.
  names:
    singular: chat
  displayTemplate: "{chatName|otherUser.fullName|otherUser.handle|chatId}"
  properties:
    account:
      type: reference
      kind: providers.substrate.reamde.dev/chatbridge/account
      required: true
      onDelete: cascade
      writer: connector
      displayName: Account
      description: the sign-in this chat belongs to
    network:
      type: string
      required: true
      writer: connector
      displayName: Network
      description: the network's id in the bridge's events, such as whatsapp
    chatId:
      type: string
      required: true
      writer: connector
      displayName: Chat ID
      description: the network's id for this chat, as the bridge sends it
    category:
      type: enum
      writer: connector
      displayName: Kind of chat
      description: a direct chat with one person, a group, a channel you follow,
        or a space that holds chats
      values:
        - value: direct
          label: Direct
        - value: group
          label: Group
        - value: channel
          label: Channel
        - value: space
          label: Space
    chatName:
      type: string
      writer: connector
      displayName: Name
      description: the chat's name, where it has one; a direct chat takes
        the other person's
    topic:
      type: text
      writer: connector
      displayName: Topic
      description: the chat's topic or description, where it has one
    avatar:
      type: blobref
      mediaTypes: [image/*]
      writer: connector
      displayName: Avatar
      description: the chat's picture, once the bridge fetched it
    otherUser:
      type: reference
      kind: providers.substrate.reamde.dev/chatbridge/user
      writer: connector
      displayName: With
      description: the other person in a direct chat
    members:
      type: reference
      kind: providers.substrate.reamde.dev/chatbridge/user
      repeated: true
      writer: connector
      displayName: Members
      description: everyone in the chat or invited to it; someone who left
        or was banned is no longer listed
      properties:
        membership:
          type: enum
          description: joined, or invited and not joined yet
          values:
            - value: join
              label: Joined
            - value: invite
              label: Invited
        role:
          type: enum
          description: what they may do in this chat
          values:
            - value: member
              label: Member
            - value: admin
              label: Admin
            - value: owner
              label: Owner
    mutedUntil:
      type: datetime
      writer: connector
      displayName: Muted until
      description: notifications are off for this chat until then
    archived:
      type: bool
      writer: connector
      displayName: Archived
      description: you archived this chat
    pinned:
      type: bool
      writer: connector
      displayName: Pinned
      description: you pinned this chat
    markedUnread:
      type: bool
      writer: connector
      displayName: Marked unread
      description: you marked this chat unread by hand
    readOnly:
      type: bool
      writer: connector
      displayName: Read-only
      description: you cannot send here, such as in a channel or a group you
        left
    messageRequest:
      type: bool
      writer: connector
      displayName: Message request
      description: someone you have not accepted wrote to you here
    disappearAfterSeconds:
      type: int
      writer: connector
      displayName: Disappearing after (s)
      description: the network removes messages this many seconds after they
        are sent; nothing here acts on it
    parent:
      type: reference
      kind: providers.substrate.reamde.dev/chatbridge/chat
      writer: connector
      displayName: In
      description: the space this chat belongs to, where the network has spaces
    features:
      type: object
      writer: connector
      displayName: What the network allows
      description: what the network lets you do in this chat, as the bridge
        reads it; the bridge checks an action against it
      fields:
        edit:
          type: bool
          description: you can edit your messages
        editMaxAgeSeconds:
          type: int
          description: how old a message may be and still be edited, in seconds
        deleteForEveryone:
          type: bool
          description: you can delete a message for everyone
        deleteMaxAgeSeconds:
          type: int
          description: how old a message may be and still be deleted for everyone,
            in seconds
        reactions:
          type: bool
          description: you can react to messages
        allowedReactions:
          type: string
          repeated: true
          description: the reactions the network allows, where it limits them
        replies:
          type: bool
          description: you can reply to one message
        threads:
          type: bool
          description: messages can start threads
        readReceipts:
          type: bool
          description: the network shows others what you read
        typing:
          type: bool
          description: the network shows others when you type
        maxTextLength:
          type: int
          description: the longest message the network takes, in characters
    lastActivityAt:
      type: datetime
      writer: connector
      displayName: Last activity
      description: when something last happened here; a page of history never
        moves it back
    readUpTo:
      type: reference
      kind: providers.substrate.reamde.dev/chatbridge/message
      writer: connector
      displayName: Read up to
      description: the last message you read here, on any of your devices
    sourceSeq:
      type: int
      writer: connector
      displayName: Event
      description: the sequence number of the bridge event that last changed
        this chat
---
# ---- one message --------------------------------------------------------------
# `at`, through temporal(point), is when the message was sent: a binding maps
# the trait onto a hot column alone, so there is no `sentAt` beside it. The
# text parts of one network message fold into `text`; its files are
# `messageattachment` rows.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/chatbridge/message
data:
  authority: providers.substrate.reamde.dev
  package: chatbridge
  description: >-
    One message in one of your chats, on whatever network the chat is on.
    It holds who sent it and when, its text, what it replies to, its reactions,
    and whether it was edited or deleted. Its files are its attachments.
  names:
    singular: message
  traits:
    - substrate.reamde.dev/core/temporal(point)
  displayTemplate: "{sender.fullName|sender.handle}: {text|content}"
  properties:
    account:
      type: reference
      kind: providers.substrate.reamde.dev/chatbridge/account
      required: true
      onDelete: cascade
      writer: connector
      displayName: Account
      description: the sign-in this message came through
    chat:
      type: reference
      kind: providers.substrate.reamde.dev/chatbridge/chat
      required: true
      onDelete: cascade
      writer: connector
      displayName: Chat
      description: the chat this message is in
    network:
      type: string
      required: true
      writer: connector
      displayName: Network
      description: the network's id in the bridge's events, such as whatsapp
    messageId:
      type: string
      required: true
      writer: connector
      displayName: Message ID
      description: the network's id for this message, unique within its chat
    sender:
      type: reference
      kind: providers.substrate.reamde.dev/chatbridge/user
      writer: connector
      displayName: From
      description: who sent it
    fromOwner:
      type: bool
      writer: connector
      displayName: From you
      description: you sent it, from any of your devices
    content:
      type: enum
      writer: connector
      displayName: Content
      description: what the message is, such as text, an image or a voice
        note
      values:
        - value: text
          label: Text
        - value: notice
          label: Notice
        - value: emote
          label: Emote
        - value: image
          label: Image
        - value: video
          label: Video
        - value: audio
          label: Audio
        - value: voice
          label: Voice note
        - value: file
          label: File
        - value: sticker
          label: Sticker
        - value: location
          label: Location
        - value: poll
          label: Poll
        - value: unsupported
          label: Not shown here
    text:
      type: text
      embed: true
      writer: connector
      displayName: Text
      description: the message's words as markdown, kept when the message
        is deleted
    editedAt:
      type: datetime
      writer: connector
      displayName: Edited
      description: when it was last edited
    editCount:
      type: int
      writer: connector
      displayName: Edits
      description: how many times it was edited; a page of history never lowers
        it, so an older copy cannot undo an edit
    replyTo:
      type: reference
      kind: providers.substrate.reamde.dev/chatbridge/message
      writer: connector
      displayName: In reply to
      description: the message this one replies to
    threadRoot:
      type: reference
      kind: providers.substrate.reamde.dev/chatbridge/message
      writer: connector
      displayName: Thread
      description: the message that started the thread this one is in
    mentions:
