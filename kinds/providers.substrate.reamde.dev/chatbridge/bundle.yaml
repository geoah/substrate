kind: substrate.reamde.dev/core/function
metadata:
  id: providers.substrate.reamde.dev/chatbridge/edit
data:
  authority: providers.substrate.reamde.dev
  package: chatbridge
  description: >-
    Ask the chat bridge to change the text of one message the owner sent.
    Writes one chataction record, which the bridge carries out once; an agent's
    request waits for the owner's approval unless the owner lets this agent
    edit unasked. Refuses a message someone else sent. Returns the action's
    id: read its state to see how it ended.
  runtime: python
  timeout: PT10S
  effect: write
  offer:
    agents: true
  arguments:
    - name: message
      type: string
      required: true
      description: the id of the providers.substrate.reamde.dev/chatbridge/message
        record to edit, one the owner sent
    - name: text
      type: string
      required: true
      description: the message's new text, as markdown
  returns:
    - name: action
      type: string
      required: true
      description: the id of the chataction record written
  permissions:
    reads:
      kinds:
        - providers.substrate.reamde.dev/chatbridge/message
    writes:
      - providers.substrate.reamde.dev/chatbridge/chataction
  source: |
    from chatbridge_actions import MESSAGE, ask, chat_of, message, text


    def main(input, host):
        args = input.get("args") or {}
        msg = message(host, args)
        if (msg.get("properties") or {}).get("fromOwner") is not True:
            raise ValueError("message %s was not sent by the owner, and a network lets you edit "
                             "only your own messages" % msg["id"])
        return ask(input, host, "edit", {
            "action": "edit", "chat": {"ref": chat_of(msg)},
            "target": {"ref": MESSAGE + "/" + msg["id"]}, "text": text(args)})
