kind: substrate.reamde.dev/core/function
metadata:
  id: providers.substrate.reamde.dev/chatbridge/delete
data:
  authority: providers.substrate.reamde.dev
  package: chatbridge
  description: >-
    Ask the chat bridge to delete one message, for the owner alone or for
    everyone in the chat. Writes one chataction record, which the bridge carries
    out once; an agent's request waits for the owner's approval unless the
    owner lets this agent delete unasked. Returns the action's id: read its
    state to see how it ended.
  runtime: python
  timeout: PT10S
  effect: write
  offer:
    agents: true
  arguments:
    - name: message
      type: string
      required: true
      description: the id of the providers.substrate.reamde.dev/chatbridge/message
        record to delete
    - name: forEveryone
      type: bool
      description: delete it for everyone in the chat, where the network allows;
        false or left out deletes it for the owner alone
  returns:
    - name: action
      type: string
      required: true
      description: the id of the chataction record written
  permissions:
    reads:
      kinds:
        - providers.substrate.reamde.dev/chatbridge/message
    writes:
      - providers.substrate.reamde.dev/chatbridge/chataction
  source: |
    from chatbridge_actions import MESSAGE, ask, chat_of, message


    def main(input, host):
        args = input.get("args") or {}
        msg = message(host, args)
        every = args.get("forEveryone", False)
        if not isinstance(every, bool):
            raise ValueError("forEveryone is true or false")
        return ask(input, host, "delete", {
            "action": "delete", "chat": {"ref": chat_of(msg)},
            "target": {"ref": MESSAGE + "/" + msg["id"]}, "forEveryone": every})
---
kind: substrate.reamde.dev/core/function
metadata:
  id: providers.substrate.reamde.dev/chatbridge/markread
data:
  authority: providers.substrate.reamde.dev
  package: chatbridge
  description: >-
    Ask the chat bridge to mark one chat read as the owner, which the other
    people in it may see. Writes one chataction record, which the bridge carries
    out once; an agent's request waits for the owner's approval unless the
    owner lets this agent do it unasked. Returns the action's id: read its
    state to see how it ended.
  runtime: python
  timeout: PT10S
  effect: write
  offer:
    agents: true
  arguments:
    - name: chat
      type: string
      required: true
      description: the id of the providers.substrate.reamde.dev/chatbridge/chat
        record to mark read
    - name: upTo
      type: string
      description: the id of the last providers.substrate.reamde.dev/chatbridge/message
        to mark read, in the same chat; left out, the chat is read to its
        end
  returns:
    - name: action
      type: string
      required: true
      description: the id of the chataction record written
  permissions:
    reads:
      kinds:
        - providers.substrate.reamde.dev/chatbridge/chat
        - providers.substrate.reamde.dev/chatbridge/message
    writes:
      - providers.substrate.reamde.dev/chatbridge/chataction
  source: |
    from chatbridge_actions import CHAT, MESSAGE, ask, chat, in_chat, message


    def main(input, host):
        args = input.get("args") or {}
        path = CHAT + "/" + chat(host, args)["id"]
        props = {"action": "markread", "chat": {"ref": path}}
        if args.get("upTo"):
            up = message(host, args, "upTo")
            in_chat(up, path, "upTo")
            props["target"] = {"ref": MESSAGE + "/" + up["id"]}
        return ask(input, host, "markread", props)
