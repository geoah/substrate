# The bundle's configuration, as the two ORDINARY RECORDS record 0076 makes
# it: a core `secret` for a person's own key and a core `setting` for the API
# root. The ids sit under the bundle's own id, which is what makes them this
# bundle's.
#
# Both functions read them as `config.settings.apiKey` and
# `config.settings.baseUrl`. Where the operator's defaults file supplies the
# key and this secret is empty, a call gets the operator's key and neither
# record.
kind: substrate.reamde.dev/core/secret
metadata:
  id: providers.substrate.reamde.dev/firecrawl/apiKey
data:
  properties:
    displayName: API key
    description: >-
      Your Firecrawl API key, from firecrawl.dev. It looks like `fc-…`. Sealed
      from reads, injected only into this bundle's two functions.
    required: true
---
# ORIGIN-PINNED in the bodies, not here: both functions only ever send the key
# to https://api.firecrawl.dev or to loopback (the test seam), so editing this
# value cannot redirect the key. It ships filled in, which is why it is not
# required.
kind: substrate.reamde.dev/core/setting
metadata:
  id: providers.substrate.reamde.dev/firecrawl/baseUrl
data:
  properties:
    displayName: Base URL
    description: >-
      The Firecrawl API root. The bodies refuse any origin but the pinned
      one, so there is normally no reason to change it.
    type: url
    value: https://api.firecrawl.dev
