# The Garmin bundle: a mirror of what Garmin's Health API and Activity API
# push about one Garmin Connect user. Read only: nothing here writes back to
# Garmin.
#
# GARMIN PUSHES. Each summary type (dailies, epochs, sleeps, ...) is POSTed
# to the endpoint the Garmin app registers for it in Garmin's Endpoint
# Configuration tool, here the `garmin-webhook` trigger, and `garminpush`
# writes one row per summary, keyed by Garmin's `summaryId`. `garminsync`
# only asks Garmin to backfill history; the history then arrives by push
# like everything else.
#
# EVERY FIELD-LEVEL FACT HERE IS SECONDARY. Garmin's API specifications sit
# behind its partner portal login and only the OAuth 2.0 PKCE document is
# public; the field lists below follow Garmin's own OpenAPI description of
# the wellness API as republished outside Garmin, and nothing was checked
# against a live account. README.md says what that means.
#
# A KIND IS THE API OBJECT, COMPLETE: every field Garmin documents for a
# summary type is a property under Garmin's own camelCase name and in
# Garmin's units (seconds since the epoch, metres, grams, kilocalories), with
# no derived property beside it. The temporal trait's `at` and `endsAt` are
# the one addition: the summary's own seconds, as instants, so the rows sit
# on a timeline. Every sync cursor is on the account; no mirror row carries
# sync state.
#
# This file is the closure (the install unit). The delivery wiring is
# triggers.yaml, as ordinary data records.
# ---- the owned package --------------------------------------------------------
kind: substrate.reamde.dev/core/package
metadata:
  id: providers.substrate.reamde.dev/garmin
data:
  authority: providers.substrate.reamde.dev
  package: garmin
  version: 1
---
# ---- the bundle document: the install unit ------------------------------------
kind: substrate.reamde.dev/core/bundle
metadata:
  id: providers.substrate.reamde.dev/garmin
data:
  authority: providers.substrate.reamde.dev
  package: garmin
  description: >-
    Keeps a copy of what your Garmin devices record, from daily summaries,
    sleep, HRV, stress and body composition to activities with their samples,
    as Garmin pushes it. Read-only.
  # `inject: functions` because both bodies read `apiBase` and the push
  # checks `clientId` against the header Garmin sends; the engine never
  # injects the oauth2 trait's `clientSecret`.
  inputs:
    client:
      kind: providers.substrate.reamde.dev/garmin/config
      inject: functions
      description: the Garmin Connect Developer Program app the host exchanges
        codes through
  # TRUSTED provider metadata: the host reads the endpoints and the
  # toggle-to-scope map only from here, never from the editable config
  # record.
  #
  # Garmin's grant has no scopes to ask for: the user picks what to share on
  # Garmin's consent page, and the token answers a fixed scope string. The
  # facility sends the union of the enabled toggles' entries as `scope`
  # anyway, so each toggle names the Garmin permission that covers it
  # (HEALTH_EXPORT or ACTIVITY_EXPORT), and `grantedScopes` records which of
  # the two the account asked for. What the user actually granted is
  # `account.permissions`, read from Garmin by the sync.
  #
  # No revocationEndpoint: Garmin's disconnect is `DELETE
  # /rest/user/registration` under the user's own token, not an RFC 7009 form
  # POST. No emailEndpoint: Garmin exposes no address, and the account's
  # identity is the Garmin user id the sync records.
  oauth2:
    clientInput: client
    authorizationEndpoint: https://connect.garmin.com/oauth2Confirm
    tokenEndpoint: https://connectapi.garmin.com/di-oauth2-service/oauth/token
    featureScopes:
      enabledDailies:
        scopes:
          - HEALTH_EXPORT
      enabledEpochs:
        scopes:
          - HEALTH_EXPORT
      enabledSleeps:
        scopes:
          - HEALTH_EXPORT
      enabledBodyComps:
        scopes:
          - HEALTH_EXPORT
      enabledStressDetails:
        scopes:
          - HEALTH_EXPORT
      enabledUserMetrics:
        scopes:
          - HEALTH_EXPORT
      enabledPulseOx:
        scopes:
          - HEALTH_EXPORT
      enabledRespiration:
        scopes:
          - HEALTH_EXPORT
      enabledHealthSnapshot:
        scopes:
          - HEALTH_EXPORT
      enabledHRV:
        scopes:
          - HEALTH_EXPORT
      enabledBloodPressures:
        scopes:
          - HEALTH_EXPORT
      enabledSkinTemp:
        scopes:
          - HEALTH_EXPORT
      enabledActivities:
        scopes:
          - ACTIVITY_EXPORT
      enabledActivityDetails:
        scopes:
          - ACTIVITY_EXPORT
      enabledManuallyUpdatedActivities:
        scopes:
          - ACTIVITY_EXPORT
      enabledMoveIQ:
        scopes:
          - HEALTH_EXPORT
  installs:
    - providers.substrate.reamde.dev/garmin/config
    - providers.substrate.reamde.dev/garmin/account
    - providers.substrate.reamde.dev/garmin/daily
    - providers.substrate.reamde.dev/garmin/epoch
    - providers.substrate.reamde.dev/garmin/sleep
    - providers.substrate.reamde.dev/garmin/bodycomp
    - providers.substrate.reamde.dev/garmin/stressdetail
    - providers.substrate.reamde.dev/garmin/usermetric
    - providers.substrate.reamde.dev/garmin/pulseox
    - providers.substrate.reamde.dev/garmin/respiration
    - providers.substrate.reamde.dev/garmin/healthsnapshot
    - providers.substrate.reamde.dev/garmin/hrv
    - providers.substrate.reamde.dev/garmin/bloodpressure
    - providers.substrate.reamde.dev/garmin/skintemp
    - providers.substrate.reamde.dev/garmin/activity
    - providers.substrate.reamde.dev/garmin/activitydetail
    - providers.substrate.reamde.dev/garmin/manuallyupdatedactivity
    - providers.substrate.reamde.dev/garmin/moveiq
    - providers.substrate.reamde.dev/garmin/notice
    - providers.substrate.reamde.dev/garmin/garminpush
    - providers.substrate.reamde.dev/garmin/garminsync
---
# ---- the config kind: the `client` input's kind -------------------------------
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/garmin/config
data:
  authority: providers.substrate.reamde.dev
  package: garmin
  description: >-
    The Garmin app settings your account connects through. The Garmin Connect
    Developer Program app this bundle authenticates through: its consumer
    key as the client id, a sealed client secret, and the API's origin. The
    record the bundle's client input resolves; endpoints and permissions are
    manifest metadata, not editable rows.
  purpose: internal
  names:
    singular: config
  traits: [substrate.reamde.dev/core/oauth2]
  displayTemplate: "Garmin app {clientId}"
  properties:
    clientId:
      type: string
      displayName: Client ID
      description: >-
        the app's consumer key from Garmin's developer portal; Garmin names
        it in the garmin-client-id header of its pushes, and a push naming
        another is refused
    clientSecret:
      type: secret
      displayName: Client secret
      description: the app's consumer secret, sealed at rest and never read
        back
    apiBase:
      type: url
      default: https://apis.garmin.com/wellness-api
      writer: owner
      displayName: API base URL
      description: >-
        where both functions call Garmin's API: the production one, or a loopback
        host for a test. Any other origin is refused before a token is sent,
        and a ping's callback URL must sit under it
---
# ---- the account kind: one connected Garmin user -------------------------------
# accountconfig (its records ARE the bundle's connected accounts) and the core
# `sync` trait. Every property carries a `writer:` role. Every cursor in the
# closure is here.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/garmin/account
data:
  authority: providers.substrate.reamde.dev
  package: garmin
  description: >-
    Your Garmin Connect account, connected here. One connected Garmin user:
    the OAuth facility writes the credential reference and status; the sync
    records the Garmin user id every push is matched on, the permissions the
    user granted, and the backfill cursors; the owner chooses which summary
    types are written and how far back to backfill.
  purpose: internal
  names:
    singular: account
  traits: [substrate.reamde.dev/core/accountconfig, substrate.reamde.dev/core/sync]
  displayTemplate: "Garmin user {userId}"
  properties:
    # ---- the grant (the OAuth facility's) ---------------------------------
    tokenRef:
      type: secret
      writer: oauth
      displayName: Token reference
      description: the credential-store reference the OAuth facility writes;
        never a raw token
    tokenStatus:
      type: string
      writer: oauth
      displayName: Connection status
      description: "the connection state the facility last reported: pending,
        connected or erroring, a growing list rather than an enum"
    grantedScopes:
      type: string
      repeated: true
      writer: oauth
      displayName: Requested permissions
      description: >-
        the Garmin permissions the last consent asked for, from the enabled
        toggles; what the user granted is `permissions`
    tokenError:
      type: string
      writer: oauth
      displayName: Sign-in error
      description: why the OAuth facility last failed to refresh this account's
        token, as the provider's status and error code; empty while it works
    tokenErrorAt:
      type: datetime
      writer: oauth
      displayName: Sign-in error at
      description: when the OAuth facility first recorded the current sign-in
        error
    # ---- who this account is ----------------------------------------------
    userId:
      type: string
      writer: connector
      displayName: Garmin user ID
      description: >-
        the Garmin user id, from GET /rest/user/id at the first sync. It is
        stable across reconnects, every push carries it, and a push is written
        to the account whose `userId` it names
    permissions:
      type: string
      repeated: true
      writer: connector
      displayName: Granted permissions
      description: >-
        what the user let this app read (ACTIVITY_EXPORT, HEALTH_EXPORT, ...),
        from GET /rest/user/permissions and from each permission change Garmin
        pushes
    permissionsChangedAt:
      type: datetime
      writer: connector
      displayName: Permissions changed
      description: when Garmin last reported a change to `permissions`
    deregisteredAt:
      type: datetime
      writer: connector
      displayName: Disconnected at Garmin
      description: >-
        when Garmin reported the user disconnected this app in Garmin Connect.
        The schedule passes over the account while it is set; a push of data
        or a sync that reaches Garmin again clears it
    # ---- what the owner asked for -------------------------------------------
    enabledDailies:
      type: bool
      default: true
      writer: owner
      displayName: Daily summaries
      description: >-
        write the `dailies` Garmin pushes as `daily` rows and ask Garmin to
        backfill them; Garmin's permission for it is HEALTH_EXPORT
    enabledEpochs:
      type: bool
      default: true
      writer: owner
      displayName: Epochs
      description: >-
        write the `epochs` Garmin pushes as `epoch` rows and ask Garmin to
        backfill them; Garmin's permission for it is HEALTH_EXPORT
    enabledSleeps:
      type: bool
      default: true
      writer: owner
      displayName: Sleeps
      description: >-
        write the `sleeps` Garmin pushes as `sleep` rows and ask Garmin to
        backfill them; Garmin's permission for it is HEALTH_EXPORT
    enabledBodyComps:
      type: bool
      default: true
      writer: owner
      displayName: Body composition
      description: >-
        write the `bodyComps` Garmin pushes as `bodycomp` rows and ask Garmin
        to backfill them; Garmin's permission for it is HEALTH_EXPORT
    enabledStressDetails:
      type: bool
      default: true
      writer: owner
      displayName: Stress details
      description: >-
        write the `stressDetails` Garmin pushes as `stressdetail` rows and
        ask Garmin to backfill them; Garmin's permission for it is HEALTH_EXPORT
    enabledUserMetrics:
      type: bool
      default: true
      writer: owner
      displayName: User metrics
      description: >-
        write the `userMetrics` Garmin pushes as `usermetric` rows and ask
        Garmin to backfill them; Garmin's permission for it is HEALTH_EXPORT
    enabledPulseOx:
      type: bool
      default: true
      writer: owner
      displayName: Pulse Ox
      description: >-
        write the `pulseox` Garmin pushes as `pulseox` rows and ask Garmin
        to backfill them; Garmin's permission for it is HEALTH_EXPORT
    enabledRespiration:
      type: bool
      default: true
      writer: owner
      displayName: Respiration
      description: >-
        write the `allDayRespiration` Garmin pushes as `respiration` rows
        and ask Garmin to backfill them; Garmin's permission for it is HEALTH_EXPORT
    enabledHealthSnapshot:
      type: bool
      default: true
      writer: owner
      displayName: Health Snapshot
      description: >-
        write the `healthSnapshot` Garmin pushes as `healthsnapshot` rows
        and ask Garmin to backfill them; Garmin's permission for it is HEALTH_EXPORT
    enabledHRV:
      type: bool
      default: true
      writer: owner
      displayName: Heart rate variability
      description: >-
        write the `hrv` Garmin pushes as `hrv` rows and ask Garmin to backfill
        them; Garmin's permission for it is HEALTH_EXPORT
    enabledBloodPressures:
      type: bool
      default: true
      writer: owner
      displayName: Blood pressure
      description: >-
        write the `bloodPressures` Garmin pushes as `bloodpressure` rows and
        ask Garmin to backfill them; Garmin's permission for it is HEALTH_EXPORT
    enabledSkinTemp:
      type: bool
      default: true
      writer: owner
      displayName: Skin temperature
      description: >-
        write the `skinTemp` Garmin pushes as `skintemp` rows and ask Garmin
        to backfill them; Garmin's permission for it is HEALTH_EXPORT
    enabledActivities:
      type: bool
      default: true
      writer: owner
      displayName: Activities
      description: >-
        write the `activities` Garmin pushes as `activity` rows and ask Garmin
        to backfill them; Garmin's permission for it is ACTIVITY_EXPORT
    enabledActivityDetails:
      type: bool
      default: true
      writer: owner
      displayName: Activity details
      description: >-
        write the `activityDetails` Garmin pushes as `activitydetail` rows
        and ask Garmin to backfill them; Garmin's permission for it is ACTIVITY_EXPORT
    enabledManuallyUpdatedActivities:
      type: bool
      default: true
      writer: owner
      displayName: Edited activities
      description: >-
        write the `manuallyUpdatedActivities` Garmin pushes as `manuallyupdatedactivity`
        rows (Garmin offers no backfill for them); Garmin's permission for
        it is ACTIVITY_EXPORT
    enabledMoveIQ:
      type: bool
      default: true
      writer: owner
      displayName: Move IQ
      description: >-
        write the `moveIQActivities` Garmin pushes as `moveiq` rows and ask
        Garmin to backfill them; Garmin's permission for it is HEALTH_EXPORT
    backfillDepth:
      type: enum
      values:
        - value: none
          label: "Don't backfill"
        - value: last7d
          label: "Last 7 days"
        - value: last30d
          label: "Last 30 days"
        - value: last90d
          label: "Last 90 days"
      required: true
      default: last30d
      writer: owner
      displayName: Backfill depth
      description: >-
        how far back from the first sync to ask Garmin to re-send history
        (none means from the connection forward). Raising it later extends
        the walk; Garmin may refuse a reach it does not keep
    syncRequestedAt:
      type: datetime
      writer: owner
      displayName: Sync requested
      description: stamp this to ask for a sync now; it also clears a disconnected
        mark once the grant works again
    syncPaused:
      type: bool
      writer: owner
      displayName: Paused
      description: >-
        while true the sync passes over this account and pushes for it are
        not written; Garmin does not re-send what a pause dropped, so a backfill
        is the way to recover it
    # ---- the sync's own bookkeeping (writer: connector) ---------------------
    backfillUntil:
      type: datetime
      writer: connector
      displayName: Backfill from
      description: >-
        the instant the backfill counts back from, pinned at the first sync
        so the reach of `backfillDepth` does not move with the clock; data
        after it arrives by push
    syncCursors:
      type: datetime
      keyed: true
      keyPattern: camel
      writer: connector
      displayName: Backfill cursors
      description: >-
        per summary type, the start of the oldest backfill window Garmin accepted;
        the walk for a type is done when its cursor reaches `backfillUntil`
        less `backfillDepth`
    retryNotBefore:
      type: datetime
      writer: connector
      displayName: Retry not before
      description: when Garmin said to come back, from a 429; the sync refuses
        to start before it
    lastCompletedAt:
      type: datetime
      writer: connector
      displayName: Last completed
      description: when a sync last found every enabled type backfilled with
        nothing refused
    lastPushAt:
      type: datetime
      writer: connector
      displayName: Last push
      description: when a push delivery last wrote to this account
    # ---- the core `sync` trait (decision 0085) ------------------------------
    syncRequestedAck:
      type: datetime
      writer: connector
      displayName: Sync request acknowledged
      description: the `syncRequestedAt` the last sync acted on; equal means
        the request is spent
    lastSyncedAt:
      type: datetime
      writer: connector
      displayName: Last synced
      description: >-
        when the last sync or push delivery finished; the on-connect trigger
        fires while it is absent
    syncState:
      type: string
      writer: connector
      displayName: Sync state
      description: >-
        never, running, ok, erroring or throttled: the state the last sync
        or push delivery left. A 429 is throttled until `retryNotBefore`,
        and a disconnect at Garmin is erroring
    syncMessage:
      type: string
      writer: connector
      displayName: Sync message
      description: the one human line the last sync or push delivery left
    lastSyncStartedAt:
      type: datetime
      writer: connector
      displayName: Last sync started
      description: when the last sync or push delivery began
    lastSyncDurationMs:
      type: int
      writer: connector
      displayName: Last sync duration (ms)
      description: how long that sync or delivery took
    syncProgress:
      type: json
      writer: connector
      displayName: Sync progress
      description: >-
        {phase, done, total, pending} of the backfill: the summary type being
        walked, how many enabled types reached their floor, how many there
        are, and how many are left
    syncError:
      type: string
      writer: connector
      displayName: Sync error
      description: >-
        the last error text; a later sync that ends ok clears it and syncErrorAt,
        while a push leaves it standing because pushes do not exercise the
        grant
    syncErrorAt:
      type: datetime
      writer: connector
      displayName: Sync error at
      description: when syncError was written; cleared with it
    syncStreams:
      type: json
      writer: connector
      displayName: Sync streams
      description: >-
        trait contract, unwritten here: the backfill is one walk with one
        outcome, and `syncCursors` holds each type's place in it
---
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/garmin/daily
data:
  authority: providers.substrate.reamde.dev
  package: garmin
  description: >-
    One day of activity, heart rate and stress from a Garmin device. A Garmin
    Health API daily summary, pushed under `dailies`: steps, distance, energy,
    intensity minutes, heart rate with its sample map, stress durations and
    Body Battery, in Garmin's units. `at` is `startTimeInSeconds` and `endsAt`
    adds `durationInSeconds`, so a travel day lasts more or less than 86,400
    seconds.
  purpose: primary
  names:
    singular: daily
  label:
    singular: Daily summary
    plural: Daily summaries
  traits:
    - substrate.reamde.dev/core/temporal(range)
  displayTemplate: "Daily summary {calendarDate}"
  properties:
    account:
      type: reference
      kind: providers.substrate.reamde.dev/garmin/account
      required: true
      onDelete: cascade
      displayName: Account
      description: the account this summary was pushed for
    summaryId:
      type: string
      required: true
      description: >-
        Garmin's id for the summary, and this row's key: a re-sent summary
        with the same id replaces the row
    userId:
      type: string
      required: true
      description: >-
        the Garmin user id the summary belongs to
    calendarDate:
      type: date
      description: >-
        the local calendar date it belongs to, as Garmin sends it
    activityType:
      type: string
      description: >-
        the activity type the day is counted under, usually GENERIC or WHEELCHAIR_PUSH
    activeKilocalories:
      type: int
      description: >-
        active energy burned, in kilocalories
    bmrKilocalories:
      type: int
      description: >-
        resting (basal) energy burned, in kilocalories
    steps:
      type: int
      description: >-
        steps taken
    pushes:
      type: int
      description: >-
        wheelchair pushes
    distanceInMeters:
      type: float
      description: >-
        distance covered, in metres
    pushDistanceInMeters:
      type: float
      description: >-
        distance pushed in a wheelchair, in metres
    durationInSeconds:
      type: int
      description: >-
        how long the day lasts, in seconds: 86,400, or more or less on a day
        the offset changed
    activeTimeInSeconds:
      type: int
      description: >-
        time spent active, in seconds
    startTimeInSeconds:
      type: int
      description: >-
        when it starts, in seconds since the Unix epoch (UTC)
    startTimeOffsetInSeconds:
      type: int
      description: >-
        the device's offset from UTC at the start, in seconds: an offset,
        not a time zone
    moderateIntensityDurationInSeconds:
      type: int
      description: >-
        moderate intensity time, in seconds
    vigorousIntensityDurationInSeconds:
      type: int
      description: >-
        vigorous intensity time, in seconds
    floorsClimbed:
      type: int
      description: >-
        floors climbed
    minHeartRateInBeatsPerMinute:
      type: int
      description: >-
        lowest heart rate, in beats per minute
    maxHeartRateInBeatsPerMinute:
      type: int
      description: >-
        highest heart rate, in beats per minute
    averageHeartRateInBeatsPerMinute:
      type: int
      description: >-
        average heart rate, in beats per minute
    restingHeartRateInBeatsPerMinute:
      type: int
      description: >-
        resting heart rate, in beats per minute; absent on a day the watch
        was off
    timeOffsetHeartRateSamples:
      type: int
      keyed: true
      description: >-
        heart rate samples in beats per minute, keyed by seconds after `startTimeInSeconds`
    source:
      type: string
      description: >-
        the device family the summary came from, where Garmin names it
    stepsGoal:
      type: int
      description: >-
        the day's step goal
    pushesGoal:
      type: int
      description: >-
        the day's wheelchair push goal
    intensityDurationGoalInSeconds:
      type: int
      description: >-
        the intensity time goal, in seconds
    floorsClimbedGoal:
      type: int
      description: >-
        the day's floors goal
    averageStressLevel:
      type: int
      description: >-
        average stress level, 1 to 100; -1 when there was too little data
    maxStressLevel:
      type: int
      description: >-
        highest stress level, 1 to 100; -1 when there was too little data
    stressDurationInSeconds:
      type: int
      description: >-
        time spent stressed, in seconds
    restStressDurationInSeconds:
      type: int
      description: >-
        time at rest, in seconds
    activityStressDurationInSeconds:
      type: int
      description: >-
        time too active to measure stress, in seconds
    lowStressDurationInSeconds:
      type: int
      description: >-
        time at low stress, in seconds
    mediumStressDurationInSeconds:
      type: int
      description: >-
        time at medium stress, in seconds
    highStressDurationInSeconds:
      type: int
      description: >-
        time at high stress, in seconds
    stressQualifier:
      type: string
      description: >-
        Garmin's word for the day's stress (calm, balanced, stressful, ...)
    bodyBatteryChargedValue:
      type: int
      description: >-
        Body Battery points charged over the day
    bodyBatteryDrainedValue:
      type: int
      description: >-
        Body Battery points drained over the day
---
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/garmin/epoch
data:
  authority: providers.substrate.reamde.dev
  package: garmin
  description: >-
    Fifteen minutes of movement from a Garmin device. A Garmin Health API
    epoch, pushed under `epochs`: one record per activity type seen in a 15-minute
    slice, with steps, distance, energy and motion intensity. `at` is `startTimeInSeconds`
    and `endsAt` adds `durationInSeconds`.
  purpose: supporting
  names:
    singular: epoch
  traits:
    - substrate.reamde.dev/core/temporal(range)
  displayTemplate: "Epoch {activityType} {at}"
  properties:
    account:
      type: reference
      kind: providers.substrate.reamde.dev/garmin/account
      required: true
      onDelete: cascade
      displayName: Account
      description: the account this summary was pushed for
    summaryId:
      type: string
      required: true
      description: >-
        Garmin's id for the summary, and this row's key: a re-sent summary
        with the same id replaces the row
    userId:
      type: string
      required: true
      description: >-
        the Garmin user id the summary belongs to
    activityType:
      type: string
      description: >-
        the activity type of this slice: SEDENTARY, WALKING, RUNNING, GENERIC
        or WHEELCHAIR_PUSH
    activeKilocalories:
      type: int
      description: >-
        active energy burned, in kilocalories
    steps:
      type: int
      description: >-
        steps taken
    pushes:
      type: int
      description: >-
        wheelchair pushes
    distanceInMeters:
      type: float
      description: >-
        distance covered, in metres
    pushDistanceInMeters:
      type: float
      description: >-
        distance pushed in a wheelchair, in metres
    durationInSeconds:
      type: int
      description: >-
        how long it lasts, in seconds
    activeTimeInSeconds:
      type: int
      description: >-
        time spent in this activity type, in seconds
    startTimeInSeconds:
      type: int
      description: >-
