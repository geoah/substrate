kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/garmin/notice
data:
  authority: providers.substrate.reamde.dev
  package: garmin
  description: >-
    A message from Garmin about the connection itself: the user disconnected
    the app, or changed what it may read. Pushed under `deregistrations` and
    `userPermissionsChange`; the account records the outcome in `deregisteredAt`
    or `permissions`. `at` is `changeTimeInSeconds`, or the push's arrival
    for a disconnect, which carries no time.
  purpose: supporting
  names:
    singular: notice
  traits:
    - substrate.reamde.dev/core/temporal(point)
  displayTemplate: "{noticeType} {userId}"
  properties:
    account:
      type: reference
      kind: providers.substrate.reamde.dev/garmin/account
      required: true
      onDelete: cascade
      displayName: Account
      description: the account the notice is about
    noticeType:
      type: enum
      values:
        - value: deregistration
          label: Disconnected
        - value: permissionchange
          label: Permissions changed
      required: true
      displayName: Notice
      description: >-
        deregistration for a `deregistrations` push (the user disconnected
        the app in Garmin Connect), permissionchange for a `userPermissionsChange`
        push
    userId:
      type: string
      required: true
      description: the Garmin user id the notice names
    summaryId:
      type: string
      description: Garmin's id for a permission change; a disconnect carries
        none
    permissions:
      type: string
      repeated: true
      description: >-
        the permissions the user left granted, for a permission change. Garmin
        sends a list of names, or in some deliveries a map of name to true
        or false; the granted names land here either way
    changeTimeInSeconds:
      type: int
      description: when the permissions changed, in seconds since the Unix
        epoch (UTC)
    receivedAt:
      type: datetime
      description: when the substrate received the push
---
# ---- the push receiver --------------------------------------------------------
# Fired by the `garmin-webhook` trigger with the request Garmin sent. One
# invocation stages rows up to a byte budget and hands back a cursor, so a body
# of any size the door admits is written over one paged chain.
kind: substrate.reamde.dev/core/function
metadata:
  id: providers.substrate.reamde.dev/garmin/garminpush
data:
  authority: providers.substrate.reamde.dev
  package: garmin
  description: >-
    Write one Garmin push delivery: match each summary to its account by the
    Garmin user id it carries, write one mirror row per summary keyed by its
    summaryId, record disconnects and permission changes, and follow a ping's
    callback URL to the summaries it names.
  runtime: python
  timeout: PT60S
  permissions:
    writes:
      - providers.substrate.reamde.dev/garmin/daily
      - providers.substrate.reamde.dev/garmin/epoch
      - providers.substrate.reamde.dev/garmin/sleep
      - providers.substrate.reamde.dev/garmin/bodycomp
      - providers.substrate.reamde.dev/garmin/stressdetail
      - providers.substrate.reamde.dev/garmin/usermetric
      - providers.substrate.reamde.dev/garmin/pulseox
      - providers.substrate.reamde.dev/garmin/respiration
      - providers.substrate.reamde.dev/garmin/healthsnapshot
      - providers.substrate.reamde.dev/garmin/hrv
      - providers.substrate.reamde.dev/garmin/bloodpressure
      - providers.substrate.reamde.dev/garmin/skintemp
      - providers.substrate.reamde.dev/garmin/activity
      - providers.substrate.reamde.dev/garmin/activitydetail
      - providers.substrate.reamde.dev/garmin/manuallyupdatedactivity
      - providers.substrate.reamde.dev/garmin/moveiq
      - providers.substrate.reamde.dev/garmin/notice
      - providers.substrate.reamde.dev/garmin/account
    network:
      - "apis.garmin.com"
      - "127.0.0.1"
      - "localhost"
  source: |
    # /// script
    # requires-python = ">=3.11"
    # dependencies = [
    #   "requests==2.32.4",
    # ]
    # ///
    """Garmin push receiver: one Health API or Activity API delivery in, mirror
    rows out.

    Garmin POSTs each summary type to the endpoint the `garmin-webhook` trigger
    serves, as `{"<summary type>": [<summary>, ...]}`. It signs nothing, so the
    trigger's key is the only credential; every summary is matched to a
    connected account by the `userId` it carries. When no summary in the body
    names a known user the whole delivery fails with an error naming the user
    ids, so it parks and can be retried once the account is connected; a body
    that mixes known and unknown users writes the known ones and lists the rest
    in its output, and a lifecycle notice about an unknown user is skipped.

    Each summary is one row keyed by its `summaryId`, written with ONE put that
    carries every declared property, the absent ones as null. A put merges and a
    null clears, so a re-sent summary (a sleep turning final, a daily filling
    in) rewrites the whole row and leaves no stale value behind.

    A body in PING mode carries `callbackURL` entries instead of summaries; each
    is fetched with the account's token from the API origin, and from nowhere
    else, and written the same way.

    Size: the webhook door admits a body up to its inline cap and the runner
    caps the frame an invocation answers with. So rows are staged against a byte
    budget and a body that outgrows it is written over several invocations of
    one paged chain; the cursor names the summary type and position to resume
    at, and every invocation re-reads the same request. A single summary too big
    for any frame is skipped and named in the output rather than failing the
    delivery.

    The body stamps the account's `sync` trait itself: a webhook delivery names
    no record, so the dispatcher stamps nothing around it.
