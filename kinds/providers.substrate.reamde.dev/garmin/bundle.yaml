# ---- the backfill -------------------------------------------------------------
# Fired by `garmin-on-connect`, `garmin-on-request` and `garmin-scheduled`.
kind: substrate.reamde.dev/core/function
metadata:
  id: providers.substrate.reamde.dev/garmin/garminsync
data:
  authority: providers.substrate.reamde.dev
  package: garmin
  description: >-
    Sync a Garmin account: record its Garmin user id and permissions, then
    ask Garmin to backfill each enabled summary type over the account's backfillDepth,
    one day per request. The summaries themselves arrive later by push.
  runtime: python
  timeout: PT60S
  permissions:
    writes:
      - providers.substrate.reamde.dev/garmin/account
    network:
      - "apis.garmin.com"
      - "127.0.0.1"
      - "localhost"
  source: |
    # /// script
    # requires-python = ">=3.11"
    # dependencies = [
    #   "requests==2.32.4",
    # ]
    # ///
    """Garmin backfill: ask Garmin to push history, per enabled summary type.

    The Health API and the Activity API push; nothing here reads a summary. This
    function learns the connected user's Garmin id (`GET /rest/user/id`, the key
    every push is matched on) and permissions, then asks Garmin to backfill each
    enabled summary type over the account's `backfillDepth`: one 24-hour window
    per request, newest day first across every type. Garmin answers `202
    Accepted` and delivers the summaries later by push to the `garmin-webhook`
    trigger; it answers `409` to a window it already accepted, which counts as
    accepted here too, so a repeated run is harmless.

    The lower edge of the oldest accepted window is kept per type in
    `syncCursors`, and the instant the walk counts back from in `backfillUntil`,
    pinned at the first run. So a run cut short by its budget, a 429 or an
    outage resumes where it stopped, and a deeper `backfillDepth` extends the
    walk instead of starting it again.

    The user id and permissions are one invocation of their own: its effects
    commit before the next invocation asks for a backfill window, so the
    summaries Garmin pushes in answer find the account.

    A run stops at its own budget well inside the engine's two-minute drain cap;
    the hourly schedule continues a walk that has windows left. The body pins
    the origin the access token may travel to: https://apis.garmin.com, or a
    loopback host as the test seam.
    """
    import datetime as _dt
    import time
    from urllib.parse import urlsplit as _urlsplit

    import requests

    PKG = "providers.substrate.reamde.dev/garmin"
    ACCOUNT_TYPE = PKG + "/account"

    DEFAULT_API_BASE = "https://apis.garmin.com/wellness-api"
    API_HOST = "apis.garmin.com"
    LOOPBACK_HOSTS = ("127.0.0.1", "localhost", "::1")

    # One invocation's wall clock, under the function's PT60S deadline.
    BUDGET_SECONDS = 40.0
    # One run's wall clock across its paged chain, under the engine's two-minute
    # drain cap; the next scheduled run continues what is left.
    RUN_BUDGET_SECONDS = 100.0
    # One backfill request asks for at most a day. Garmin's documented limits
    # per request are reported as 30 or 90 days by different sources; a day is
    # inside every reading, and Garmin's rate limit counts days of data, not
    # requests.
    WINDOW_SECONDS = 86400
    BACKFILL_DAYS = {"none": 0, "last7d": 7, "last30d": 30, "last90d": 90}
    REASON_MAX = 400

    # (cursor key, account toggle, backfill path) per summary type Garmin
    # backfills; manuallyUpdatedActivities has no backfill.
    BACKFILL = [
        ('dailies', 'enabledDailies', 'dailies'),
        ('epochs', 'enabledEpochs', 'epochs'),
        ('sleeps', 'enabledSleeps', 'sleeps'),
        ('bodyComps', 'enabledBodyComps', 'bodyComps'),
        ('stressDetails', 'enabledStressDetails', 'stressDetails'),
        ('userMetrics', 'enabledUserMetrics', 'userMetrics'),
        ('pulseox', 'enabledPulseOx', 'pulseOx'),
        ('allDayRespiration', 'enabledRespiration', 'respiration'),
        ('healthSnapshot', 'enabledHealthSnapshot', 'healthSnapshot'),
        ('hrv', 'enabledHRV', 'hrv'),
        ('bloodPressures', 'enabledBloodPressures', 'bloodPressures'),
        ('skinTemp', 'enabledSkinTemp', 'skinTemp'),
        ('activities', 'enabledActivities', 'activities'),
        ('activityDetails', 'enabledActivityDetails', 'activityDetails'),
        ('moveIQActivities', 'enabledMoveIQ', 'moveiq'),
    ]


    def _now_dt():
        return _dt.datetime.now(_dt.timezone.utc)


    def _now():
        return _now_dt().strftime("%Y-%m-%dT%H:%M:%S.%fZ")


    def _iso_secs(secs):
        return _dt.datetime.fromtimestamp(int(secs), _dt.timezone.utc).strftime(
            "%Y-%m-%dT%H:%M:%SZ")


    def _parse(value):
        if not value:
            return None
        try:
            return _dt.datetime.fromisoformat(str(value).replace("Z", "+00:00"))
        except ValueError:
            return None


    def _secs(value):
        ts = _parse(value)
        return int(ts.timestamp()) if ts is not None else None


    def _check_origin(url):
        u = _urlsplit(url)
        host = (u.hostname or "").lower()
        if host in LOOPBACK_HOSTS:
            return
        if u.scheme == "https" and host == API_HOST and u.port in (None, 443):
            return
        raise RuntimeError("garmin: refusing to send credentials to %s://%s; only "
                           "https://%s or loopback" % (u.scheme, host or "?", API_HOST))


    class _Permanent(Exception):
        """An answer asking again cannot change: a revoked grant, a refused
        request."""


    class _RateLimited(Exception):
        def __init__(self, retry_at, message):
            super().__init__(message)
            self.retry_at = retry_at


    def _retry_at(resp):
        after = (resp.headers.get("Retry-After") or "").strip()
        now = _now_dt()
        if after:
            try:
                secs = int(float(after) + 0.999)
                return (now + _dt.timedelta(seconds=max(secs, 1))).strftime(
                    "%Y-%m-%dT%H:%M:%SZ")
            except ValueError:
                pass
            try:
                from email.utils import parsedate_to_datetime
                when = parsedate_to_datetime(after)
                if when is not None:
                    if when.tzinfo is None:
                        when = when.replace(tzinfo=_dt.timezone.utc)
                    return when.astimezone(_dt.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
            except (TypeError, ValueError):
                pass
        # Garmin's limit counts days of data a minute, so a 429 with no header we
        # can read is a minute away.
        return (now + _dt.timedelta(seconds=60)).strftime("%Y-%m-%dT%H:%M:%SZ")


    def _request(base, token, path, params=None):
        url = base + path
        _check_origin(url)
        resp = requests.get(url, params=params or None, headers={
            "Authorization": "Bearer " + token, "Accept": "application/json",
        }, timeout=20, allow_redirects=False)
        if resp.status_code == 429:
            raise _RateLimited(_retry_at(resp), "rate limited by Garmin")
        if resp.status_code == 401:
            raise _Permanent("unauthorized (was the app disconnected in Garmin Connect?)")
        return resp


    def _get(base, token, path):
        resp = _request(base, token, path)
        if 400 <= resp.status_code < 500:
            raise _Permanent("%s answered HTTP %d" % (path, resp.status_code))
        resp.raise_for_status()
        if resp.status_code != 200:
            raise RuntimeError("%s answered HTTP %d" % (path, resp.status_code))
        return resp.json()


    def _err_msg(e):
        if isinstance(e, _RateLimited):
            return "rate limited; retry after %s" % e.retry_at
        if isinstance(e, requests.HTTPError) and e.response is not None:
            return "garmin returned HTTP %d" % e.response.status_code
        return str(e) or type(e).__name__


    def _api_base(cfg):
        client = ((cfg.get("inputs") or {}).get("client") or {})
        base = ((client.get("properties") or {}).get("apiBase") or "").strip()
        return (base or DEFAULT_API_BASE).rstrip("/")


    def _permissions(value):
        if isinstance(value, dict):
            return sorted(str(k) for k, v in value.items() if v is True)
        if isinstance(value, list):
            return sorted({str(v) for v in value if isinstance(v, str) and v})
        return []


    # ------------------------------------------------------------- what is due

    def _enabled(props):
        return [key for key, toggle, _ in BACKFILL if props.get(toggle)]


    def _floor(props, anchor):
        days = BACKFILL_DAYS.get(props.get("backfillDepth") or "last30d", 30)
        return anchor - days * 86400


    def _left(props, cursors, anchor, failed=()):
        """The enabled types whose walk has not reached the floor."""
        if anchor is None:
            return _enabled(props)
        floor = _floor(props, anchor)
        return [k for k in _enabled(props)
                if k not in failed and (cursors.get(k) if cursors.get(k) is not None
                                        else anchor) > floor]


    def _cursors(props):
        out = {}
        for k, v in (props.get("syncCursors") or {}).items():
            s = _secs(v)
            if s is not None:
                out[k] = s
        return out


    def _requested(props):
        want = props.get("syncRequestedAt")
        return bool(want) and str(want) != str(props.get("syncRequestedAck") or "")


    def _held(props):
        hold = _parse(props.get("retryNotBefore"))
        return hold is not None and _now_dt() < hold


    def _due(props):
        """The schedule's question. A deregistered account waits for a "sync
        now" or for its next push to show the user connected again."""
        if props.get("syncPaused") or _held(props):
            return False
        if _requested(props):
            return True
        if props.get("deregisteredAt"):
            return False
        if not props.get("lastSyncedAt") or not props.get("userId"):
            return True
        return bool(_left(props, _cursors(props), _secs(props.get("backfillUntil"))))


    # ------------------------------------------------------------- the stamp

    def _progress(props, cur):
        enabled = _enabled(props)
        left = _left(props, cur.get("cursors") or {}, cur.get("anchor"),
                     [k for k, _ in cur.get("failed") or []])
        phase = cur.get("phase") or "user"
        if phase == "backfill":
            phase = left[0] if left else "done"
        return {"phase": phase, "done": len(enabled) - len(left)
                - len(cur.get("failed") or []), "total": len(enabled),
                "pending": len(left)}


    def _checkpoint(host, acct, aid, cur):
        """The cursors so far, committed with this invocation's page, so a chain
        the engine parks still keeps what Garmin accepted."""
        patch = {"syncCursors": {k: _iso_secs(v) for k, v in (cur.get("cursors") or {}).items()}
                 or None}
        if cur.get("anchor") is not None:
            patch["backfillUntil"] = _iso_secs(cur["anchor"])
        host.effects.patch(acct.get("kind") or ACCOUNT_TYPE, aid, properties=patch)


    def _stamp(host, acct, aid, props, cur, error=None):
        now = _now()
        patch = {"lastSyncedAt": now,
                 "syncCursors": {k: _iso_secs(v) for k, v in (cur.get("cursors") or {}).items()}
                 or None}
        if cur.get("anchor") is not None:
            patch["backfillUntil"] = _iso_secs(cur["anchor"])
        if cur.get("requested"):
            patch["syncRequestedAck"] = cur["requested"]
        failed = cur.get("failed") or []
        left = _left(props, cur.get("cursors") or {}, cur.get("anchor"),
                     [k for k, _ in failed])
        windows = int(cur.get("windows") or 0)
        if cur.get("retryAt"):
            patch["retryNotBefore"] = cur["retryAt"]
            state, message = "throttled", "rate limited by Garmin; retry after %s" % cur["retryAt"]
        elif error is not None:
            state, message = "erroring", str(error)
        else:
            state = "ok"
            notes = ["backfill: %d windows requested" % windows]
            if left:
                notes.append("%d types continue on the next run" % len(left))
            if failed:
                notes.append("refused: " + ", ".join("%s (%s)" % (k, why)
                                                     for k, why in failed[:4]))
            message = "; ".join(notes)
            if not left and not failed:
                patch["lastCompletedAt"] = now
            patch["syncError"] = None
            patch["syncErrorAt"] = None
        patch.update({"syncState": state, "syncMessage": message[:REASON_MAX],
                      "syncProgress": _progress(props, cur)})
        if state == "erroring":
            patch["syncError"] = message[:REASON_MAX]
            patch["syncErrorAt"] = now
        if cur.get("dispatch") == "schedule" and cur.get("startedAt"):
            a, b = _parse(cur["startedAt"]), _parse(now)
            patch["lastSyncStartedAt"] = cur["startedAt"]
            if a is not None and b is not None:
                patch["lastSyncDurationMs"] = max(int((b - a).total_seconds() * 1000), 0)
        host.effects.patch(acct.get("kind") or ACCOUNT_TYPE, aid, properties=patch)


    # ------------------------------------------------------------- the walk

    def _fresh(queue, dispatch="", started=""):
        return {"queue": queue, "phase": None, "dispatch": dispatch,
                "startedAt": started or _now(), "runStarted": time.time()}


    def _next_account(host, cur, queue):
        rest = queue[1:]
        if rest:
            return {"more": host.page.more(_fresh(rest, cur.get("dispatch")))}
        return None


    def _sync_account(host, base, acct, aid, props, token, cur):
        start = time.monotonic()

        def spent():
            return time.monotonic() - start >= BUDGET_SECONDS

        def run_spent():
            return time.time() - float(cur.get("runStarted") or time.time()) >= RUN_BUDGET_SECONDS

        if cur.get("phase") is None:
            cur.update({"phase": "user", "cursors": _cursors(props), "failed": [],
                        "windows": 0, "anchor": _secs(props.get("backfillUntil")),
                        "requested": str(props.get("syncRequestedAt") or "")})

        if cur["phase"] == "user":
            who = _get(base, token, "/rest/user/id")
            uid = str((who or {}).get("userId") or "")
            if not uid:
                raise _Permanent("GET /rest/user/id carried no userId")
            perms = _permissions(_get(base, token, "/rest/user/permissions"))
            patch = {"userId": uid, "permissions": perms}
            if props.get("deregisteredAt"):
                # The grant answers again, so the user connected again.
                patch["deregisteredAt"] = None
            if props.get("userId") and str(props["userId"]) != uid:
                host.log("garmin: %s now authenticates as a different Garmin user" % aid)
            host.effects.patch(acct.get("kind") or ACCOUNT_TYPE, aid, properties=patch)
            cur["phase"] = "backfill"
            if cur.get("anchor") is None:
                cur["anchor"] = int(time.time())
            # Staged effects commit only when the invocation returns, and a
            # push is matched on the committed `userId`: hand the page back
            # before asking Garmin for summaries it will push.
            return {"more": host.page.more(cur)}

        anchor = int(cur["anchor"])
        floor = _floor(props, anchor)
        paths = {k: p for k, _, p in BACKFILL}
        cursors = cur["cursors"]
        while True:
            failed = [k for k, _ in cur["failed"]]
            left = _left(props, cursors, anchor, failed)
            if not left:
                break
            if run_spent():
                break
            if spent():
                _checkpoint(host, acct, aid, cur)
                return {"more": host.page.more(cur)}
            # Newest window first, across every type: the most recent day of
            # each type is asked for before any type reaches further back.
            key = max(left, key=lambda k: (cursors.get(k, anchor), -left.index(k)))
            end = cursors.get(key, anchor)
            begin = max(floor, end - WINDOW_SECONDS)
            resp = _request(base, token, "/rest/backfill/" + paths[key], {
                "summaryStartTimeInSeconds": begin, "summaryEndTimeInSeconds": end})
            code = resp.status_code
            if code in (200, 202, 204, 409):
                cursors[key] = begin
                cur["windows"] = int(cur.get("windows") or 0) + 1
            elif 400 <= code < 500:
                # This type's window was refused (a permission the user did not
                # grant, a reach Garmin will not backfill): the type stops for
                # this run and says why; the others carry on.
                host.log("garmin: %s backfill of %s refused with HTTP %d" % (aid, key, code))
                cur["failed"].append([key, "HTTP %d" % code])
            else:
                resp.raise_for_status()
                raise RuntimeError("garmin: backfill of %s answered HTTP %d" % (key, code))

        _stamp(host, acct, aid, props, cur)
        nxt = _next_account(host, cur, cur.get("queue") or [aid])
        if nxt:
            return nxt
        return {"output": {"account": aid, "windows": cur.get("windows") or 0,
                           "left": _left(props, cursors, anchor,
                                         [k for k, _ in cur["failed"]]),
                           "failed": cur["failed"]}}


    def main(input, host):
        cfg = input.get("config") or {}
        base = _api_base(cfg)
        _check_origin(base)
        accounts = {a.get("id"): a for a in (cfg.get("accounts") or [])}
        args = input.get("args")
        if not isinstance(args, dict):
            args = {}
        cur = host.page.resume() or None
        if cur is None:
            record = (input.get("envelope") or {}).get("record") or {}
            named = args.get("accounts") or ([args["account"]] if args.get("account") else [])
            if (record.get("kind") or "") == ACCOUNT_TYPE:
                queue = [record.get("id")]
            elif named:
                queue = [str(a) for a in named]
            else:
                queue = [aid for aid, a in accounts.items()
                         if _due(a.get("properties") or {})]
            cur = _fresh(queue, "record" if record.get("kind") else "schedule")

        queue = list(cur.get("queue") or [])
        while queue:
            acct = accounts.get(queue[0])
            props = (acct or {}).get("properties") or {}
            if acct is None or props.get("syncPaused") or _held(props):
                queue = queue[1:]
                cur = _fresh(queue, cur.get("dispatch"))
                continue
            terr = acct.get("tokenError")
            if terr or not acct.get("token"):
                if terr:
                    host.log("garmin: skip %s: %s" % (queue[0], terr))
                    host.effects.patch(acct.get("kind") or ACCOUNT_TYPE, queue[0], properties={
                        "syncState": "erroring", "syncMessage": str(terr)[:REASON_MAX],
                        "syncError": str(terr)[:REASON_MAX], "syncErrorAt": _now()})
                queue = queue[1:]
                cur = _fresh(queue, cur.get("dispatch"))
                continue
            break
        if not queue:
            return {"output": {"synced": 0, "accounts": sorted(a for a in accounts if a)}}

        aid = queue[0]
        acct = accounts[aid]
        props = acct.get("properties") or {}
        cur["queue"] = queue
        try:
            return _sync_account(host, base, acct, aid, props, acct["token"], cur)
        except _RateLimited as e:
            cur["retryAt"] = e.retry_at
            _stamp(host, acct, aid, props, cur, error=_err_msg(e))
            return _next_account(host, cur, queue) or {"output": {"account": aid,
                                                                  "error": _err_msg(e)}}
        except Exception as e:                                          # noqa: BLE001
            msg = _err_msg(e)
            host.log("garmin: account %s failed: %s" % (aid, msg))
            _stamp(host, acct, aid, props, cur, error=msg)
            return _next_account(host, cur, queue) or {"output": {"account": aid,
                                                                  "error": msg}}
