kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/garmin/sleep
data:
  authority: providers.substrate.reamde.dev
  package: garmin
  description: >-
    One night's sleep as a Garmin device recorded it. A Garmin Health API
    sleep summary, pushed under `sleeps`: stage durations, the stage map,
    respiration and SpO2 samples, the sleep score and the day's naps. A re-send
    under the same `summaryId` (tentative turning final) replaces the row.
    `at` is `startTimeInSeconds`, `endsAt` the last stage's `endTimeInSeconds`.
  purpose: primary
  names:
    singular: sleep
  traits:
    - substrate.reamde.dev/core/temporal(range)
  displayTemplate: "Sleep {calendarDate}"
  properties:
    account:
      type: reference
      kind: providers.substrate.reamde.dev/garmin/account
      required: true
      onDelete: cascade
      displayName: Account
      description: the account this summary was pushed for
    summaryId:
      type: string
      required: true
      description: >-
        Garmin's id for the summary, and this row's key: a re-sent summary
        with the same id replaces the row
    userId:
      type: string
      required: true
      description: >-
        the Garmin user id the summary belongs to
    calendarDate:
      type: date
      description: >-
        the local calendar date it belongs to, as Garmin sends it
    durationInSeconds:
      type: int
      description: >-
        time asleep, in seconds; awake time is not counted
    totalNapDurationInSeconds:
      type: int
      description: >-
        time napping that day, in seconds
    startTimeInSeconds:
      type: int
      description: >-
        when it starts, in seconds since the Unix epoch (UTC)
    startTimeOffsetInSeconds:
      type: int
      description: >-
        the device's offset from UTC at the start, in seconds: an offset,
        not a time zone
    unmeasurableSleepInSeconds:
      type: int
      description: >-
        time the device could not classify, in seconds
    deepSleepDurationInSeconds:
      type: int
      description: >-
        deep sleep, in seconds
    lightSleepDurationInSeconds:
      type: int
      description: >-
        light sleep, in seconds
    remSleepInSeconds:
      type: int
      description: >-
        REM sleep, in seconds
    awakeDurationInSeconds:
      type: int
      description: >-
        time awake during the sleep, in seconds
    sleepLevelsMap:
      type: object
      description: >-
        the stage map: for each stage, the ranges spent in it
      fields:
        deep:
          type: object
          repeated: true
          description: >-
            the deep sleep ranges
          fields:
            startTimeInSeconds:
              type: int
              description: >-
                start of the range, in seconds since the Unix epoch (UTC)
            endTimeInSeconds:
              type: int
              description: >-
                end of the range, in seconds since the Unix epoch (UTC)
        light:
          type: object
          repeated: true
          description: >-
            the light sleep ranges
          fields:
            startTimeInSeconds:
              type: int
              description: >-
                start of the range, in seconds since the Unix epoch (UTC)
            endTimeInSeconds:
              type: int
              description: >-
                end of the range, in seconds since the Unix epoch (UTC)
        rem:
          type: object
          repeated: true
          description: >-
            the REM sleep ranges
          fields:
            startTimeInSeconds:
              type: int
              description: >-
                start of the range, in seconds since the Unix epoch (UTC)
            endTimeInSeconds:
              type: int
              description: >-
                end of the range, in seconds since the Unix epoch (UTC)
        awake:
          type: object
          repeated: true
          description: >-
            the awake ranges
          fields:
            startTimeInSeconds:
              type: int
              description: >-
                start of the range, in seconds since the Unix epoch (UTC)
            endTimeInSeconds:
              type: int
              description: >-
                end of the range, in seconds since the Unix epoch (UTC)
        unmeasurable:
          type: object
          repeated: true
          description: >-
            the ranges the device could not classify
          fields:
            startTimeInSeconds:
              type: int
              description: >-
                start of the range, in seconds since the Unix epoch (UTC)
            endTimeInSeconds:
              type: int
              description: >-
                end of the range, in seconds since the Unix epoch (UTC)
    validation:
      type: string
      description: >-
        how the sleep was determined: MANUAL, DEVICE, OFF_WRIST, AUTO_TENTATIVE,
        AUTO_FINAL, AUTO_MANUAL, ENHANCED_TENTATIVE or ENHANCED_FINAL
    timeOffsetSleepSpo2:
      type: int
      keyed: true
      description: >-
        blood oxygen saturation samples in percent, keyed by seconds after
        `startTimeInSeconds`
    timeOffsetSleepRespiration:
      type: float
      keyed: true
      description: >-
        respiration samples in breaths per minute, keyed by seconds after
        `startTimeInSeconds`
    overallSleepScore:
      type: object
      description: >-
        the overall sleep score
      fields:
        value:
          type: int
          description: >-
            the score, 0 to 100, where Garmin gives one
        qualifierKey:
          type: string
          description: >-
            Garmin's verdict word: EXCELLENT, GOOD, FAIR or POOR
    sleepScores:
      type: object
      keyed: true
      description: >-
        the sleep score's components, keyed by Garmin's component name (`totalDuration`,
        `stress`, `remPercentage`, ...)
      fields:
        value:
          type: int
          description: >-
            the score, 0 to 100, where Garmin gives one
        qualifierKey:
          type: string
          description: >-
            Garmin's verdict word: EXCELLENT, GOOD, FAIR or POOR
    naps:
      type: object
      repeated: true
      description: >-
        the day's naps
      fields:
        napStartTimeInSeconds:
          type: int
          description: >-
            when the nap started, in seconds since the Unix epoch (UTC)
        napOffsetInSeconds:
          type: int
          description: >-
            the device's offset from UTC at the nap, in seconds
        napDurationInSeconds:
          type: int
          description: >-
            how long the nap lasted, in seconds
        napValidation:
          type: string
          description: >-
            how the nap was determined
---
