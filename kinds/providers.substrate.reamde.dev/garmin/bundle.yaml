        'moveIQActivities': ('moveiq', 'enabledMoveIQ', 'range', {'summaryId': 'string', 'userId': 'string', 'deviceName': 'string', 'calendarDate': 'date', 'startTimeInSeconds': 'int', 'durationInSeconds': 'int', 'activityType': 'string', 'activitySubType': 'string', 'offsetInSeconds': 'int'}),
    }
    ORDER = ['dailies', 'epochs', 'sleeps', 'bodyComps', 'stressDetails', 'userMetrics', 'pulseox', 'allDayRespiration', 'healthSnapshot', 'hrv', 'bloodPressures', 'skinTemp', 'activities', 'activityDetails', 'manuallyUpdatedActivities', 'moveIQActivities']

    # The lifecycle notices, written after the data a body carries beside them.
    LIFECYCLE = ("userPermissionsChange", "deregistrations")
    # Spellings some body composition deliveries use instead of the documented
    # names [secondary source]; read only when the documented name is absent.
    ALIASES = {
        "bodyComps": {"percentFat": "bodyFatInPercent",
                      "percentHydration": "bodyWaterInPercent",
                      "bmi": "bodyMassIndex"},
    }


    def _now():
        return _dt.datetime.now(_dt.timezone.utc).strftime("%Y-%m-%dT%H:%M:%S.%fZ")


    def _parse(value):
        if not value:
            return None
        try:
            return _dt.datetime.fromisoformat(str(value).replace("Z", "+00:00"))
        except ValueError:
            return None


    def _instant(secs):
        if secs is None:
            return None
        try:
            return _dt.datetime.fromtimestamp(secs, _dt.timezone.utc).strftime(
                "%Y-%m-%dT%H:%M:%SZ")
        except (OverflowError, OSError, ValueError):
            return None


    def _scalar(kind, v):
        """One value in the declared type, or None when it is not one."""
        if isinstance(v, bool):
            return v if kind == "bool" else None
        if kind == "int":
            if isinstance(v, int):
                return v if abs(v) <= MAX_SAFE_INT else None
            if isinstance(v, float) and math.isfinite(v) and v.is_integer():
                return int(v)
            return None
        if kind == "float":
            if isinstance(v, (int, float)) and math.isfinite(float(v)):
                return float(v)
            return None
        if kind == "string":
            if isinstance(v, str):
                return v or None
            if isinstance(v, int):
                return str(v)
            return None
        if kind == "date":
            if isinstance(v, str) and RE_DATE.match(v):
                try:
                    _dt.date.fromisoformat(v)
                    return v
                except ValueError:
                    return None
            return None
        return None


    class _Shape:
        """Holds a payload to the declared shape. A value that does not fit is
        left out and counted, never the row's failure, and a field the
        declaration does not name is left out and remembered by name."""

        def __init__(self, cur):
            self.cur = cur

        def _drop(self):
            self.cur["dropped"] = int(self.cur.get("dropped") or 0) + 1

        def _unknown(self, where):
            names = self.cur.setdefault("unknownFields", [])
            if where not in names and len(names) < UNKNOWN_FIELDS_MAX:
                names.append(where)

        def value(self, spec, v, where):
            if v is None:
                return None
            if isinstance(spec, str):
                out = _scalar(spec, v)
                if out is None:
                    self._drop()
                return out
            tag = spec[0]
            if tag == "object":
                if not isinstance(v, dict):
                    self._drop()
                    return None
                return self.fields(spec[1], v, where) or None
            if tag == "objects":
                if not isinstance(v, list):
                    self._drop()
                    return None
                out = []
                for item in v:
                    shaped = self.fields(spec[1], item, where) if isinstance(item, dict) else None
                    if shaped:
                        out.append(shaped)
                    else:
                        self._drop()
                return out or None
            if tag == "keyed":
                if not isinstance(v, dict):
                    self._drop()
                    return None
                out = {}
                for k, item in v.items():
                    key = str(k)
                    shaped = self.value(spec[1], item, where) if key else None
                    if shaped is None:
                        if item is not None:
                            self._drop()
                        continue
                    out[key] = shaped
                return out or None
            return None

        def fields(self, table, src, where):
            out = {}
            for name, v in src.items():
                spec = table.get(name)
                if spec is None:
                    self._unknown(where + "." + str(name))
                    continue
                shaped = self.value(spec, v, where + "." + name)
                if shaped is not None:
                    out[name] = shaped
            return out


    def _rid(host, aid, key):
        """`<account id>/<Garmin's id>`, readable, or the hashed external id when
        that would leave the id alphabet or pass 128 characters."""
        rid = "%s/%s" % (aid, key)
        if len(rid) <= MAX_ID_LEN and RE_ID.match(rid):
            return rid
        return host.ids.external("garmin", aid, str(key))


    def _span(rule, props):
        """The temporal trait's slots, from the summary's own seconds."""
        if rule is None:
            return
        at = end = None
        if rule == "measurement":
            props["at"] = _instant(props.get("measurementTimeInSeconds"))
            return
        if rule == "detail":
            src = props.get("summary") or {}
        else:
            src = props
        at = src.get("startTimeInSeconds")
        if rule == "sleep":
            ends = [r.get("endTimeInSeconds")
                    for ranges in (props.get("sleepLevelsMap") or {}).values()
                    for r in ranges if r.get("endTimeInSeconds") is not None]
            end = max(ends) if ends else None
        else:
            dur = src.get("durationInSeconds")
            if at is not None and dur is not None and dur >= 0:
                end = at + dur
        if at is not None and end is not None and end < at:
            end = None
        props["at"] = _instant(at)
        props["endsAt"] = _instant(end)


    def _row(host, shape, key, entry, aid):
        """One mirror row's properties: every declared property, absent ones as
        None so the put clears them."""
        name, _toggle, rule, spec = TYPES[key]
        rec = dict(entry)
        for alias, canonical in (ALIASES.get(key) or {}).items():
            if alias in rec and rec.get(canonical) is None:
                rec[canonical] = rec.pop(alias)
        props = {"account": aid}
        for field, fspec in spec.items():
            if isinstance(fspec, tuple) and fspec[0] == "reference":
                parent = _scalar("string", rec.get(fspec[2]))
                props[field] = _rid(host, aid, parent) if parent else None
                continue
            props[field] = shape.value(fspec, rec.get(field), name + "." + field)
        known = set(spec) | {"parentSummaryId"} | set(ALIASES.get(key) or {})
        for field in rec:
            if field not in known:
                shape._unknown(name + "." + str(field))
        _span(rule, props)
        return name, props


    def _api_base(cfg):
        client = ((cfg.get("inputs") or {}).get("client") or {})
        base = ((client.get("properties") or {}).get("apiBase") or "").strip()
        return (base or DEFAULT_API_BASE).rstrip("/")


    def _check_origin(url):
        u = urlsplit(url)
        host = (u.hostname or "").lower()
        if host in LOOPBACK_HOSTS:
            return
        if u.scheme == "https" and host == API_HOST and u.port in (None, 443):
            return
        raise RuntimeError("garmin: refusing to send credentials to %s://%s; only "
                           "https://%s or loopback" % (u.scheme, host or "?", API_HOST))


    def _check_callback(base, url):
        """A ping's callbackURL arrives in an unsigned body, so the bearer goes
        only where the API base already points: same scheme, host and port, and
        under its path."""
        b, u = urlsplit(base), urlsplit(str(url))
        same = (b.scheme, (b.hostname or "").lower(), b.port) == \
            (u.scheme, (u.hostname or "").lower(), u.port)
        if not same or not u.path.startswith(b.path.rstrip("/") + "/"):
            raise RuntimeError("garmin: a ping's callbackURL is outside the API base; "
                               "refusing to send the token there")
        _check_origin(url)


    def _pull(base, token, url, key):
        _check_callback(base, url)
        resp = requests.get(url, headers={"Authorization": "Bearer " + token,
                                          "Accept": "application/json"},
                            timeout=20, allow_redirects=False)
        if resp.status_code != 200:
            raise RuntimeError("garmin: the %s ping's callback answered HTTP %d"
                               % (key, resp.status_code))
        data = resp.json()
        if isinstance(data, dict):
            data = data.get(key)
        if not isinstance(data, list):
            raise RuntimeError("garmin: the %s ping's callback answered no list" % key)
        return data


    def _body(req):
        b = req.get("body") or {}
        if isinstance(b.get("text"), str):
            raw = b["text"]
        elif isinstance(b.get("base64"), str):
            raw = base64.b64decode(b["base64"]).decode("utf-8")
        else:
            raise ValueError("garmin: the request carries no body")
        try:
            data = json.loads(raw)
        except ValueError as e:
            raise ValueError("garmin: the push body is not JSON: %s" % e) from None
        if not isinstance(data, dict):
            raise ValueError("garmin: the push body is not a JSON object")
        return data


    def _check_client(req, cfg):
        """Garmin names the consumer it pushes for in `garmin-client-id`, though
        not on every request. Where it does, it has to be this bundle's client."""
        headers = {str(k).lower(): str(v) for k, v in (req.get("headers") or {}).items()}
        sent = headers.get("garmin-client-id", "").strip()
        client = (((cfg.get("inputs") or {}).get("client") or {}).get("properties") or {})
        mine = str(client.get("clientId") or "").strip()
        if sent and mine and sent != mine:
            raise RuntimeError("garmin: the push's garmin-client-id header does not "
                               "match this bundle's clientId; refusing it")


    def _accounts(cfg):
        by_user = {}
        for acct in cfg.get("accounts") or []:
            props = acct.get("properties") or {}
            if props.get("userId"):
                by_user.setdefault(str(props["userId"]), acct)
        return by_user


    def _match(entry, by_user):
        """The account a summary is for, by its `userId` alone: every mirror
        row requires that id, so a summary without one has no row to be."""
        if not isinstance(entry, dict):
            return None
        uid = entry.get("userId")
        if uid not in (None, "") and str(uid) in by_user:
            return by_user[str(uid)]
        return None


    def _who(entry):
        if not isinstance(entry, dict):
            return "(not an object)"
        return str(entry.get("userId") or "(no userId)")


    def _permissions(value):
        """A list of permission names, or [some deliveries] a map of name to
        bool; either way the granted names, sorted."""
        if isinstance(value, dict):
            return sorted(str(k) for k, v in value.items() if v is True)
        if isinstance(value, list):
            return sorted({str(v) for v in value if isinstance(v, str) and v})
        return []


    def _bump(cur, aid, key):
        counts = cur.setdefault("written", {}).setdefault(aid, {})
        counts[key] = int(counts.get(key) or 0) + 1


    def _skip(cur, why):
        skipped = cur.setdefault("skipped", {})
        skipped[why] = int(skipped.get(why) or 0) + 1


    def _notice(host, key, entry, aid, env, cur):
        fire = env.get("fire") or {}
        received = fire.get("at") or _now()
        props = {"account": aid, "userId": _scalar("string", entry.get("userId")),
                 "summaryId": _scalar("string", entry.get("summaryId")),
                 "receivedAt": received}
        if key == "userPermissionsChange":
            perms = _permissions(entry.get("permissions"))
            ct = _scalar("int", entry.get("changeTimeInSeconds"))
            props.update({"noticeType": "permissionchange", "permissions": perms,
                          "changeTimeInSeconds": ct, "at": _instant(ct) or received})
            cur.setdefault("permissions", {})[aid] = [perms, _instant(ct) or received]
        else:
            props.update({"noticeType": "deregistration", "at": received})
            cur.setdefault("deregistered", {})[aid] = received
        ident = props["summaryId"] or fire.get("id") or hashlib.sha256(
            json.dumps(entry, sort_keys=True).encode("utf-8")).hexdigest()[:24]
        kind = "deregistration" if key == "deregistrations" else "permissions"
        host.effects.put(NOTICE_TYPE, _rid(host, aid, "%s-%s" % (kind, ident)),
                         properties=props)
        _bump(cur, aid, key)


    class _Budget:
        def __init__(self):
            self.start = time.monotonic()
            self.staged = 0

        def spent(self):
            return time.monotonic() - self.start >= BUDGET_SECONDS

        def fits(self, size):
            return self.staged == 0 or self.staged + size <= STAGE_BUDGET_BYTES


    def _write(host, shape, key, entry, aid, budget, cur):
        """Stage one summary. False when it does not fit this invocation and the
        chain has to continue in the next one."""
        if not _scalar("string", entry.get("summaryId")):
            _skip(cur, "no summaryId")
            return True
        name, props = _row(host, shape, key, entry, aid)
        size = len(json.dumps(props, separators=(",", ":")))
        if size > OVERSIZE_BYTES:
            cur.setdefault("oversized", []).append("%s %s (%d bytes)" % (
                key, props.get("summaryId"), size))
            host.log("garmin: %s %s is %d bytes, more than one frame holds; skipped"
                     % (key, props.get("summaryId"), size))
            return True
        if not budget.fits(size) or (budget.staged and budget.spent()):
            return False
        host.effects.put(PKG + "/" + name, _rid(host, aid, props["summaryId"]),
                         properties=props)
        budget.staged += size
        _bump(cur, aid, key)
        return True


    def _wants(acct, key):
        props = acct.get("properties") or {}
        if props.get("syncPaused"):
            return False
        return bool(props.get(TYPES[key][1]))


    def _message(counts):
        parts = ["%d %s" % (n, k) for k, n in sorted(counts.items()) if n]
        return ("push: " + ", ".join(parts))[:400] if parts else "push: nothing new"


    def _stamp(host, acct, aid, cur):
        """The account's `sync` trait, stamped by the body because a webhook
        delivery names no record for the dispatcher to stamp."""
        now = _now()
        counts = (cur.get("written") or {}).get(aid) or {}
        patch = {"lastSyncedAt": now, "lastPushAt": now, "syncState": "ok",
                 "syncMessage": _message(counts)}
        started = _parse(cur.get("started"))
        ended = _parse(now)
        if started is not None and ended is not None:
            patch["lastSyncStartedAt"] = cur["started"]
            patch["lastSyncDurationMs"] = max(int((ended - started).total_seconds() * 1000), 0)
        props = acct.get("properties") or {}
        data = sum(n for k, n in counts.items() if k not in LIFECYCLE)
        if data and props.get("deregisteredAt"):
            # Garmin pushes data only for a registered user, so data means the
            # user connected again.
            patch["deregisteredAt"] = None
        perms = (cur.get("permissions") or {}).get(aid)
        if perms:
            patch["permissions"] = perms[0]
            patch["permissionsChangedAt"] = perms[1]
        gone = (cur.get("deregistered") or {}).get(aid)
        if gone:
            msg = "Garmin reports the user disconnected this app in Garmin Connect"
            patch.update({"deregisteredAt": gone, "syncState": "erroring",
                          "syncMessage": msg, "syncError": msg, "syncErrorAt": now})
        host.effects.patch(acct.get("kind") or acct.get("type") or ACCOUNT_TYPE, aid,
                           properties=patch)


    def main(input, host):
        env = input.get("envelope") or {}
        req = env.get("request") or {}
        cfg = input.get("config") or {}
        body = _body(req)
        _check_client(req, cfg)
        by_user = _accounts(cfg)
        accounts = {a.get("id"): a for a in (cfg.get("accounts") or [])}
        keys = [k for k in ORDER if isinstance(body.get(k), list)] + \
            [k for k in LIFECYCLE if isinstance(body.get(k), list)]

        cur = host.page.resume()
        if cur is None:
            # Only DATA decides the refusal: a lifecycle notice about a user this
            # repository no longer holds is nothing to retry.
            entries = [e for k in keys if k not in LIFECYCLE for e in body[k]]
            unknown = sorted({_who(e) for k in keys for e in body[k]
                              if _match(e, by_user) is None})
            data_users = {_who(e) for e in entries}
            if data_users and data_users <= set(unknown):
                raise RuntimeError(
                    "garmin: no connected account has Garmin user id %s. Connect the "
                    "account and let its first sync record the user id, then retry "
                    "this delivery" % ", ".join(sorted(data_users)[:5]))
            fire = env.get("fire") or {}
            cur = {"t": 0, "n": 0, "m": 0, "started": fire.get("at") or _now(),
                   "unknownUsers": unknown[:20],
                   "unknownTypes": sorted(k for k in body
                                          if k not in TYPES and k not in LIFECYCLE)[:20]}
            if cur["unknownTypes"]:
                host.log("garmin: no kind mirrors %s; left unwritten"
                         % ", ".join(cur["unknownTypes"]))

        shape = _Shape(cur)
        budget = _Budget()
        base = _api_base(cfg)
        while cur["t"] < len(keys):
            key = keys[cur["t"]]
            entries = body[key]
            while cur["n"] < len(entries):
                entry = entries[cur["n"]]
                acct = _match(entry, by_user)
                if acct is None:
                    _skip(cur, "unknown user")
                elif key in LIFECYCLE:
                    _notice(host, key, entry, acct.get("id"), env, cur)
                elif not _wants(acct, key):
                    _skip(cur, "paused or switched off")
                elif "callbackURL" in entry and "summaryId" not in entry:
                    token = acct.get("token")
                    if not token:
                        raise RuntimeError("garmin: account %s has no token to follow "
                                           "the %s ping with: %s" % (
                                               acct.get("id"), key,
                                               acct.get("tokenError") or "not connected"))
                    items = _pull(base, token, entry["callbackURL"], key)
                    while cur["m"] < len(items):
                        item = items[cur["m"]]
                        if not isinstance(item, dict):
                            _skip(cur, "not an object")
                        elif not _write(host, shape, key, item, acct.get("id"), budget, cur):
                            return {"more": host.page.more(cur)}
                        cur["m"] += 1
                    cur["m"] = 0
                elif not _write(host, shape, key, entry, acct.get("id"), budget, cur):
                    return {"more": host.page.more(cur)}
                cur["n"] += 1
            cur["t"] += 1
            cur["n"] = 0

        for aid in sorted((cur.get("written") or {}).keys()):
            if aid in accounts:
                _stamp(host, accounts[aid], aid, cur)
        out = {"written": cur.get("written") or {}}
        for k in ("skipped", "unknownUsers", "unknownTypes", "unknownFields",
                  "oversized", "dropped"):
            if cur.get(k):
                out[k] = cur[k]
        return {"output": out}
