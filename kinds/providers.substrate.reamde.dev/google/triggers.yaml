# The Google bundle's delivery wiring — ordinary DATA records of core's
# `trigger` kind (console-editable, changelog-visible, substratectl get/apply/
# delete like anything else). TWELVE triggers drive the four sync functions,
# three per stream and never shared: the first backfill, the hourly cadence,
# and "sync now":
#
#   account(connected, contacts on, never synced)  --contactssync-->
#       contact records  (+ the contacts sync-token / cadence-anchor stamp)
#   account(connected, gmail on, never synced)     --gmailsync-->
#       gmailthread + gmailmessage + emailaddress mirrors
#   account(connected, calendar on, never synced)  --calendarsync-->
#       calendar + calendarseries + calendarevent + emailaddress mirrors
#   account(connected, drive on, never synced)     --syncdrive-->
#       drivefile + emailaddress mirrors  (T-088)
#   hourly schedules  --each function-->  every due, connected account
#
# UNCHANGED from package version 16, and deliberately: the guards below are
# the one part of this closure the raw-shape rewrite did not touch. They read
# each stream's OWN cadence anchor rather than the shared rollup, which is
# what an end-to-end test depends on when it connects one account and expects
# exactly three first syncs.
#
# Each on-connect trigger is guarded to fire ONCE per account, on ITS OWN
# stream's cadence anchor (`contactsLastSyncedAt` / `gmailLastSyncedAt` /
# `calendarLastSyncedAt`), never on the shared account-level `lastSyncedAt`
# rollup the console reads: an account whose contacts already synced must
# still fire its first gmail backfill. The guard drops the moment that stream
# stamps its own anchor, so one stream's state patch can neither re-fire
# itself nor fire another stream. Steady-state re-syncs come from the
# schedules, which honor each account's syncFrequency.
#
# The erroring path deliberately stamps NEITHER the rollup nor the stream's
# anchor (so the schedule retries and no window floor advances past unread
# data) but DOES write `syncStatus` at most once per episode, so the account's
# own update cannot re-fire the on-connect trigger into a loop.
# The first backfill: an account whose OAuth just landed (tokenStatus
# connected), that wants contacts, and that has never synced contacts yet.
kind: substrate.reamde.dev/core/trigger
metadata:
  id: google-contacts-on-connect
data:
  properties:
    enabled: true
    source:
      record:
        kinds: [providers.substrate.reamde.dev/google/account]
        ops: [create, update]
        # Every optional property is read through the `in` idiom: tokenStatus
        # (writer: oauth) and enabledContacts are ABSENT on a freshly-created
        # account (pre-OAuth), and CEL map-indexing an absent key throws — an
        # unguarded read would park the delivery ("no such key: tokenStatus")
        # instead of skipping it. The short-circuit `&&` means the value read
        # only runs once its key is proven present.
        when: >-
          record != null && "tokenStatus" in record.properties && record.properties.tokenStatus
          == "connected" && "enabledContacts" in record.properties && record.properties.enabledContacts
          == true && !("contactsLastSyncedAt" in record.properties)
    callable: substrate.reamde.dev/core/function/providers.substrate.reamde.dev/google/synccontacts
---
# The steady-state re-sync: an hourly tick fires the same function with no
# envelope record, so the body iterates every connected, contacts-enabled
# account and syncs the ones due by their own syncFrequency.
kind: substrate.reamde.dev/core/trigger
metadata:
  id: google-contacts-scheduled
data:
  properties:
    enabled: true
    source:
      schedule:
        recurrence: "FREQ=HOURLY"
        timezone: Europe/London
        # A fixed past anchor, so every occurrence since is well-defined
        # (occurrences compute forward from startsAt).
        startsAt: "2025-01-06T09:00:00Z"
    callable: substrate.reamde.dev/core/function/providers.substrate.reamde.dev/google/synccontacts
---
# Gmail's first backfill. Same guarded-`in` idiom, on gmail's own toggle and
# gmail's own completion marker — a contacts sync stamping its state can never
# satisfy or falsify this one.
kind: substrate.reamde.dev/core/trigger
metadata:
  id: google-gmail-on-connect
data:
  properties:
    enabled: true
    source:
      record:
        kinds: [providers.substrate.reamde.dev/google/account]
        ops: [create, update]
        when: >-
          record != null && "tokenStatus" in record.properties && record.properties.tokenStatus
          == "connected" && "enabledGmail" in record.properties && record.properties.enabledGmail
          == true && !("gmailLastSyncedAt" in record.properties)
    callable: substrate.reamde.dev/core/function/providers.substrate.reamde.dev/google/syncgmail
---
# Gmail's steady-state re-sync: hourly, honoring each account's syncFrequency.
# Hourly is also what keeps a historyId inside Google's retention window.
kind: substrate.reamde.dev/core/trigger
metadata:
