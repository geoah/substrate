---
# Drive's first backfill (T-088). Same guarded-`in` idiom, on drive's own
# toggle and drive's own completion marker — no other stream's stamp can
# satisfy or falsify it. This is also the FIRST Drive call an account
# connected under package version 29 or earlier makes, which is where the
# body learns the grant predates `drive.readonly` and records
# `needsreconsent` instead of erroring; the guard stays open (no
# `driveLastSyncedAt`) until the owner reconnects and the stream completes.
