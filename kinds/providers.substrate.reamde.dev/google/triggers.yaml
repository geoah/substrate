# "SYNC NOW" for the contacts stream. A record trigger on the same account
# kind, firing exactly while `syncRequestedAt` and this stream's own
# `contactsSyncRequestedAck` disagree — a GENERATION, not a moment, so a
# request dated in the future cannot loop.
#
# This is the only trigger that can re-drive a stream whose
# `contactsLastSyncedAt` is already stamped, which is every stream of a
# RE-SEEDED account: `bundle purge` deletes the package's rows but the
# account row survives, so the on-connect guard above is already false when
# the seed runs a second time. It is also how the runner re-drives a first
# sync that ended `erroring`.
kind: substrate.reamde.dev/core/trigger
metadata:
  id: google-contacts-on-request
data:
  properties:
    enabled: true
    source:
      record:
        kinds: [providers.substrate.reamde.dev/google/account]
        ops: [create, update]
        # The same guarded-`in` idiom as every other trigger here: CEL
        # map-indexing an absent key throws and parks the delivery, and every
        # one of these properties is absent on a fresh account.
        when: >-
          record != null && "tokenStatus" in record.properties && record.properties.tokenStatus
          == "connected" && "enabledContacts" in record.properties && record.properties.enabledContacts
          == true && "syncRequestedAt" in record.properties && (!("contactsSyncRequestedAck"
          in record.properties) || string(record.properties.contactsSyncRequestedAck)
          != string(record.properties.syncRequestedAt))
    callable: substrate.reamde.dev/core/function/providers.substrate.reamde.dev/google/synccontacts
---
