    # --- relations ----------------------------------------------------------
    # AN OCCURRENCE ARRAY, not repeated references. A repeated reference
    # refuses a duplicate target and its link data is flat scalars only, and
    # a People entry is neither: the same address can appear twice (once from
    # the CONTACT source, once from a DOMAIN_PROFILE) and each entry carries
    # a nested `metadata`. So the array is the API's own entry, typed, with
    # the IDENTITY as a reference FIELD inside it — which is what puts an
    # address-book entry, a mail sender and a meeting attendee on one hub row
    # without losing what this entry said.
    emailAddresses:
      type: object
      repeated: true
      displayName: Email addresses
      description: >-
        the People `emailAddresses` array — each entry's own labels, with
        the address a reference at the emailaddress hub. People caps it at
        100 per connections page, so a contact with more is mirrored SHORT.
      fields:
        value:
          type: email
          description: >-
            `value` — the address AS GOOGLE GAVE IT, trimmed and otherwise
            verbatim (the local part keeps its case). The API's own field,
            and what a person mapping probes on this kind.
        address:
          type: reference
          kind: providers.substrate.reamde.dev/google/emailaddress
          description: >-
            the hub row for this address — the row a mail header and a meeting
            attendee reach too, composed from the normal form (domain lowercased).
            Absent exactly when `value` did not parse.
        type:
          type: string
          description: >-
            `type` — `home`, `work`, `other`, or a custom word. People does
            not close the set (a custom word is legal), so it is a `string`.
        formattedType:
          type: string
          description: >-
            `formattedType` — Output only. the email address type, formatted
            for the viewer's locale; absent when Google sent none.
        displayName:
          type: string
          description: >-
            `displayName` — the name THIS entry spelled for the address. It
            lives on the entry, never on the hub, which would be last-writer-
            wins across every header that named it.
        metadata:
          type: object
          description: >-
            `metadata` (FieldMetadata) — which source this email address came
            from and whether it is primary. Absent when the payload carried
            none; a `false` flag is written as false.
          fields:
            primary:
              type: bool
              description: >-
                `primary` — Output only. True when this is the primary entry
                of its kind across ALL the person's sources; false is written,
                absent stays absent.
            sourcePrimary:
              type: bool
              description: >-
                `sourcePrimary` — true when this is the primary entry for
                its OWN source; false is written, absent stays absent.
            verified:
              type: bool
              description: >-
                `verified` — Output only. Whether Google verified the value;
                false is written, absent stays absent.
            source:
              type: object
              description: >-
                `source` (Source) — the record this entry came from. People
                fills `etag`, `updateTime` and `profileMetadata` ONLY in `metadata.sources`,
                so here those are always absent.
              fields:
                type:
                  type: enum
                  values:
                    - value: sourcetypeunspecified
                      label: SOURCE_TYPE_UNSPECIFIED
                    - value: account
                      label: ACCOUNT
                    - value: profile
                      label: PROFILE
                    - value: domainprofile
                      label: DOMAIN_PROFILE
                    - value: contact
                      label: CONTACT
                    - value: othercontact
                      label: OTHER_CONTACT
                    - value: domaincontact
                      label: DOMAIN_CONTACT
                  description: >-
                    `source.type` (SourceType) — which record this value came
                    from, lowercased, `_` dropped; the labels are the map;
                    unknown values are absent and named on contactsSyncStatus.
                id:
                  type: string
                  description: >-
                    `source.id` — the identifier the source generated; absent
                    on a source that carries none.
                etag:
                  type: string
                  description: >-
                    `source.etag` — the source's entity tag. People fills
                    it only in `metadata.sources`, so it is absent here.
                updateTime:
                  type: datetime
                  description: >-
                    `source.updateTime` — when the source last changed. People
                    fills it only in `metadata.sources`, so it is absent here.
    # People's `metadata`, declared rather than dropped into `json`: the sync
    # reads `deleted` to tombstone and `previousResourceNames` to reconcile a
    # rename, and both are facts about the contact. It sits in the RELATIONS
    # group because `linkedPeopleResourceNames` names other Person resources
    # of this same address book, which are `contact` rows.
    metadata:
      type: object
      displayName: Metadata
      description: >-
        `metadata` (PersonMetadata) — the sources this contact was assembled
        from, its tombstone flag, the names it answered to and the Persons
        Google links to it. Absent when the payload carried none.
      fields:
        deleted:
          type: bool
          description: >-
            `deleted` — Output only. True when the Person was deleted; People
            fills it only on a sync request, and the sync reads it to retract
            the row. False is written as false.
        # THE CONSTANT DISCRIMINATOR, declared rather than omitted: People says
        # PERSON on every connection, so the record says what it is and a value
        # Google adds is a widening rather than a surprise.
        objectType:
          type: enum
          values:
            - value: objecttypeunspecified
              label: OBJECT_TYPE_UNSPECIFIED
            - value: person
              label: PERSON
            - value: page
              label: PAGE
          description: >-
            `objectType` (ObjectType) — Output only. **DEPRECATED** for the
            one on `sources[].profileMetadata`. What People object this is,
            lowercased, `_` dropped; the labels are the map.
        previousResourceNames:
          type: string
          repeated: true
          description: >-
            `previousResourceNames` — Output only, sync requests only. The
            names this contact answered to before a merge or rename. HISTORICAL
            ALIASES naming rows this sync RETRACTS, so strings.
        linkedPeopleResourceNames:
          type: reference
          kind: providers.substrate.reamde.dev/google/contact
          repeated: true
          description: >-
            `linkedPeopleResourceNames` — Output only. The other Person resources
            Google links to this one: ids of a kind this bundle mirrors, so
            REFERENCES. DEFERRED targets — see the comment below.
        # DEFERRED TARGETS, deliberately. The linked Person may sit outside the
        # connections listing this walk read, and minting a shell for it would
        # create a row the same run's full-read sweep then deletes. So no
        # `mustExist`, no shell, and a pointer may dangle until the linked
        # contact is itself read — which is real data, not a bug.
        sources:
          type: object
          repeated: true
          description: >-
            `sources` — every source this contact was assembled from. The
            ONE place People fills a Source's `etag`, `updateTime` and `profileMetadata`,
            and a level shallower than an entry's source.
          fields:
            type:
              type: enum
              values:
                - value: sourcetypeunspecified
                  label: SOURCE_TYPE_UNSPECIFIED
                - value: account
                  label: ACCOUNT
                - value: profile
                  label: PROFILE
                - value: domainprofile
                  label: DOMAIN_PROFILE
                - value: contact
                  label: CONTACT
                - value: othercontact
                  label: OTHER_CONTACT
                - value: domaincontact
                  label: DOMAIN_CONTACT
              description: >-
                `source.type` (SourceType) — which record this value came
                from, lowercased, `_` dropped; the labels are the map; unknown
                values are absent and named on contactsSyncStatus.
            id:
              type: string
              description: >-
                `source.id` — the identifier this source generated for the
                person; absent on a source that carries none.
            etag:
              type: string
              description: >-
                `source.etag` — the source's entity tag, for cache validation.
            updateTime:
              type: datetime
              description: >-
                `source.updateTime` — Output only. When this source last changed,
                written at the API's full precision. The SOURCE's instant,
                not the contact's, which is why there is no trait.
            profileMetadata:
              type: object
              description: >-
                `profileMetadata` (ProfileMetadata) — Output only. Present
                only on a source of type PROFILE, and only here: People never
                fills it on an entry's `metadata.source`.
              fields:
                objectType:
                  type: enum
                  values:
                    - value: objecttypeunspecified
                      label: OBJECT_TYPE_UNSPECIFIED
                    - value: person
                      label: PERSON
                    - value: page
                      label: PAGE
                  description: >-
                    `profileMetadata.objectType` — Output only. What the profile
                    describes, lowercased, `_` dropped; the labels are the
                    map; unknown values are absent and named on contactsSyncStatus.
                userTypes:
                  type: enum
                  repeated: true
                  values:
                    - value: usertypeunknown
                      label: USER_TYPE_UNKNOWN
                    - value: googleuser
                      label: GOOGLE_USER
                    - value: gplususer
                      label: GPLUS_USER
                    - value: googleappsuser
                      label: GOOGLE_APPS_USER
                  description: >-
                    `profileMetadata.userTypes` (UserType) — Output only.
                    the kind of Google user, lowercased, `_` dropped; the
                    labels are the map; unknown values are absent and named
                    on contactsSyncStatus.
                  # --- instants -----------------------------------------------------------
                  # NONE. A People Person carries no instant of its own: no createTime, no
                  # updateTime, no deleteTime. The only timestamps in the resource are
                  # `metadata.sources[].updateTime` and an entry's
                  # `metadata.source.updateTime`, which are the SOURCE's instants and are
                  # declared with their sources above. That is why this kind binds no
                  # temporal trait: there is nothing honest to put in `at`.
                  # --- fields from sibling calls ------------------------------------------
                  # NONE. One `people.connections.list` page IS the whole row. The two calls
                  # this bundle does NOT make are named where they would land:
                  # `people.get` (the >100 email/phone hydration, on `emailAddresses` and
                  # `phoneNumbers`) and `contactGroups.list` (a group's own fields, on
                  # `memberships[].contactGroupMembership`).
---
kind: substrate.reamde.dev/core/function
metadata:
  id: providers.substrate.reamde.dev/google/synccontacts
data:
  authority: providers.substrate.reamde.dev
  package: google
  description: >-
    Sync a Google account's contacts: page people/me/connections over the
    account's OAuth token, mirror each person under this package's own kinds
    with its addresses as emailaddress rows, and store the People sync token
    for the next incremental run.
  runtime: python
  timeout: PT1M
  permissions:
    writes:
      - providers.substrate.reamde.dev/google/contact
      - providers.substrate.reamde.dev/google/contactgroup
      - providers.substrate.reamde.dev/google/emailaddress
      - providers.substrate.reamde.dev/google/account
    # The mark-and-sweep reads this account's own local contacts to find the
    # rows a full re-read could not tombstone, and the groups walk reads its
    # own rows for the same reason: the list call is complete, so what it does
    # not name is retracted.
    reads:
      kinds:
        - providers.substrate.reamde.dev/google/contact
        - providers.substrate.reamde.dev/google/contactgroup
      budgets:
        calls: 256
        rows: 10000
    network:
      - "people.googleapis.com"
      # The loopback seam: `config.apiBase` may only ever name a loopback
      # host, and a deployment that wants one has to allow it in the
      # sandbox's egress list too (SUBSTRATE_SANDBOX_EGRESS_ALLOW).
      - "127.0.0.1"
      - "localhost"
  source: |
    """Google Contacts sync — one page of people/me/connections per invocation.

    The account's live access token arrives injected on the bundle config
    (`config.accounts[].token`, host-resolved); this body never sees or
    refreshes a raw grant and receives no client secret or credential ref at
    all. Large address books page off the causal chain via the paged-checkpoint
    `more`/`resume` contract.

    THE API BASE. `config.inputs.client.properties.apiBase`, when set, replaces
    https://people.googleapis.com for every call, so a recorded fake stands in
    without a line of this source being rewritten. It is honoured ONLY for a
    LOOPBACK host: the config row is owner-writable, and an arbitrary base
    would be a way to redirect the account's access token at a stranger.

    THE FOUR WRITE CONTRACTS this body holds itself to, because a mirror that
    gets them wrong loses data that Google still has:

      1. ABSENT IS NOT NULL. A property reaches the effect only when the payload
         actually CARRIED its key. A payload that carried the key as `null`
         writes null, which deletes; a payload that never mentioned it leaves the
         stored value alone, so a thin read can never erase a fuller row.
      2. FALSE IS A VALUE. Every boolean is copied by a MEMBERSHIP test and a
         type check, never by truthiness, so `primary: false`, `current: false`,
         `verified: false`, `default: false` and `deleted: false` survive.
      3. EMPTY IS A VALUE. An empty string, an empty array and a zero integer are
         real distinctions and are written as themselves. The one thing the
         dialect cannot hold is an entry that is empty in the API too: the loader
         refuses an empty object, so an all-empty occurrence is dropped from its
         array rather than written as `{}`.
      4. AN UNKNOWN ENUM IS VISIBLE. Google's uppercase wire value is normalised
         onto the kind's spelling by ONE shared normaliser. A value the kind's
         enum does not hold is not guessed, not written and NOT nulled: the
         property is left absent and the value is named on the account's
         `contactsSyncStatus`, so a widening shows up as a line of status rather
         than as a silent hole.

    THE MAILBOX NORMAL FORM, shared with the gmail and calendar streams because
    the `emailaddress` hub only converges if all three compose the same id: trim,
    lowercase the DOMAIN, and leave the LOCAL PART exactly as Google spelled it
    (RFC 5321 §2.4 reserves its case for the receiving host). The occurrence
    keeps the source spelling in its own `value`; a value that does not parse is
    not written as an identity and mints no hub row.
    """
    import datetime as _dt
    import json as _json
    import re
    import urllib.error
    import urllib.parse
    import urllib.request
    import uuid

    AUTHORITY = "providers.substrate.reamde.dev/google"
    ACCOUNT_TYPE = AUTHORITY + "/account"
    ADDRESS_TYPE = AUTHORITY + "/emailaddress"
    CONTACT_TYPE = AUTHORITY + "/contact"
    GROUP_TYPE = AUTHORITY + "/contactgroup"

    PEOPLE_API = "https://people.googleapis.com"
    PEOPLE_HOST = "people.googleapis.com"
    LOOPBACK_HOSTS = ("127.0.0.1", "localhost", "::1", "0.0.0.0")
    CONNECTIONS_PATH = "/v1/people/me/connections"
    # The contact GROUPS this address book files people under (T-023). Its own
    # endpoint and a second kind's payload, so a kind and a reference.
    GROUPS_PATH = "/v1/contactGroups"
    # THE SECOND SOURCE OF THE SAME RESOURCE. A Workspace account keeps its
    # colleagues in the DOMAIN DIRECTORY, not in `myContacts`, so an account whose
    # whole address book is its company answers `people/me/connections` with ZERO
    # people and every colleague is invisible. `people:listDirectoryPeople`
    # returns the SAME `Person` resource, in the same `people/<id>` namespace, so
    # a directory entry is a `contact` row like any other — no second kind, and a
    # person who is BOTH a saved contact and a directory entry is ONE record,
    # because one resourceName composes one row id. The discriminator is already
    # on the record: `metadata.sources[].type`.
    DIRECTORY_PATH = "/v1/people:listDirectoryPeople"

    # The field mask, pinned in one place: an incremental call repeats it, and
    # every field it names has a declared property on the mirror. It asks for
    # EVERY field the connections endpoint's personFields vocabulary admits,
    # because the kind IS the object: a mask that asked for less would make the
    # mirror's completeness a fiction.
    #
    # TWO Person fields are NOT here and cannot be: `ageRange` and `fileAses` are
    # declared on the kind but are absent from the endpoint's personFields
    # vocabulary (People v1 discovery revision 20260914), so the mask cannot ask
    # for them. Both are copied when Google volunteers them anyway.
    PERSON_FIELDS = ",".join((
        "addresses", "ageRanges", "biographies", "birthdays", "calendarUrls",
        "clientData", "coverPhotos", "emailAddresses", "events", "externalIds",
        "genders", "imClients", "interests", "locales", "locations",
        "memberships", "metadata", "miscKeywords", "names", "nicknames",
        "occupations", "organizations", "phoneNumbers", "photos", "relations",
        "sipAddresses", "skills", "urls", "userDefined"))
    # THE DIRECTORY'S READ MASK, and why it is the same string. Verified LIVE
    # against the owner's Workspace account on 2026-09-16: `listDirectoryPeople`
    # admits the WHOLE `personFields` vocabulary above as its `readMask`,
    # verbatim, and refuses nothing — 183 people, HTTP 200, no error detail. So
    # the directory stream asks for exactly what the connections stream asks for
    # and the mirror is as complete from one source as from the other. If Google
    # ever narrows it, the refusal names the field and `_mask_refusal` below drops
    # it, retries once and reports the drop on `contactsSyncStatus`, so a
    # narrowing costs a line of status rather than a parked stream.
    DIRECTORY_FIELDS = PERSON_FIELDS
    # Both directory sources, always. DOMAIN_PROFILE is a colleague's Workspace
    # profile; DOMAIN_CONTACT is a shared external contact an admin published to
    # the domain. Asking for one would mirror half a directory.
    DIRECTORY_SOURCES = ("DIRECTORY_SOURCE_TYPE_DOMAIN_PROFILE",
                         "DIRECTORY_SOURCE_TYPE_DOMAIN_CONTACT")
    PAGE_SIZE = 200
    SWEEP_PAGE = 200
    REASON_MAX = 200
    # How many distinct unknown enum values one run reports on the account's
    # status before the list is cut: the point is to make a widening VISIBLE, not
    # to turn the status column into a log.
    UNKNOWN_MAX = 8
    # How many contact row ids one full read may carry on its cursor before the
    # sweep gives up on telling a stale row from a live one (README, ask 1).
    SEEN_MAX = 20000
    # THE CHAIN'S OWN BUDGET (T-023), the guard the calendar and gmail streams
    # already had and this one did not. The engine bounds a paged drain across the
    # WHOLE chain — every account in the queue — and a chain that crosses it PARKS,
    # which puts one serial dispatcher behind a parked delivery for every other
    # provider in the repository. These sit well inside the engine's, and they
    # matter more since T-031: this stream walks an address book AND a Workspace
    # directory now, which is 348 people on the owner's work account before a
    # second account is reached.
    HOP_MAX = 260
    DRAIN_SECONDS = 45
    # `emailaddress.address` is an `email`-kind property and the engine
    # validates it with Go's net/mail.ParseAddress at effect APPLY, where this
    # body's try/except cannot see the failure. The DOT-ATOM production,
    # deliberately narrower than Go's: a looser pattern rolls the page's
    # transaction back and parks the drain on every retry. A value it refuses is
    # reported, by FIELD and never by value, on the account's status.
    _ATEXT = r"[A-Za-z0-9!#$%&'*+/=?^_`{|}~-]+"
    _LABEL = r"[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?"
    _RE_ADDR = re.compile(
        r"^" + _ATEXT + r"(?:\." + _ATEXT + r")*@"
        + _LABEL + r"(?:\." + _LABEL + r")+$")
    # `canonicalForm` is a `phone` property, and the engine holds one to E.164 at
    # effect APPLY — where this body's try/except cannot see the failure, so a
    # value it refuses rolls the page's transaction back and parks the drain
    # deterministically on every retry. E.164 is a `+`, a non-zero country digit
    # and up to fourteen more, with NOTHING else in it: Google's own
    # canonicalForm is spelled that way, and anything that is not is left absent
    # rather than parked on. The user-typed `value` beside it keeps the spelling.
    _RE_E164 = re.compile(r"^\+[1-9]\d{1,14}$")


    # --------------------------------------------------------------------------
    # the enums: ONE spelling rule, ONE normaliser, every closed People set
    # --------------------------------------------------------------------------
    # `docs/kind-design.md` §2: the loader admits only `[a-z][a-z0-9]*`, so a
    # value is the API's spelling lowercased with `_` and `-` dropped, and the
    # API's exact spelling is the declared label. Spelling the rule as CODE means
    # the manifest's labels and this body's normal form cannot drift apart.
    def _spell(label):
        return label.lower().replace("_", "").replace("-", "")


    _ENUM_LABELS = {
        # ContactGroup.groupType (T-023), from `contactGroups.list`.
        "grouptype": ("GROUP_TYPE_UNSPECIFIED", "USER_CONTACT_GROUP",
                      "SYSTEM_CONTACT_GROUP"),
        # Source.type — every entry's `metadata.source.type` AND the Person's own
        # `metadata.sources[].type`. One family, one map, both copies.
        "sourcetype": ("SOURCE_TYPE_UNSPECIFIED", "ACCOUNT", "PROFILE",
                       "DOMAIN_PROFILE", "CONTACT", "OTHER_CONTACT",
                       "DOMAIN_CONTACT"),
        # AgeRange — `ageRanges[].ageRange` and the deprecated scalar `ageRange`.
        "agerange": ("AGE_RANGE_UNSPECIFIED", "LESS_THAN_EIGHTEEN",
                     "EIGHTEEN_TO_TWENTY", "TWENTY_ONE_OR_OLDER"),
        # Biography.ContentType
        "contenttype": ("CONTENT_TYPE_UNSPECIFIED", "TEXT_PLAIN", "TEXT_HTML"),
        # Nickname.Type — the deprecated response values included, because
        # Google still returns them on old rows.
        "nicknametype": ("DEFAULT", "MAIDEN_NAME", "INITIALS", "GPLUS",
                         "OTHER_NAME", "ALTERNATE_NAME", "SHORT_NAME"),
        # MiscKeyword.Type
        "misckeywordtype": ("TYPE_UNSPECIFIED", "OUTLOOK_BILLING_INFORMATION",
                            "OUTLOOK_DIRECTORY_SERVER", "OUTLOOK_KEYWORD",
                            "OUTLOOK_MILEAGE", "OUTLOOK_PRIORITY",
                            "OUTLOOK_SENSITIVITY", "OUTLOOK_SUBJECT",
                            "OUTLOOK_USER", "HOME", "WORK", "OTHER"),
        # ObjectType — `metadata.objectType` and
        # `metadata.sources[].profileMetadata.objectType`.
        "objecttype": ("OBJECT_TYPE_UNSPECIFIED", "PERSON", "PAGE"),
        # ProfileMetadata.UserType
        "usertype": ("USER_TYPE_UNKNOWN", "GOOGLE_USER", "GPLUS_USER",
                     "GOOGLE_APPS_USER"),
    }
    _ENUMS = {family: {label: _spell(label) for label in labels}
              for family, labels in _ENUM_LABELS.items()}


    def _enum(family, raw, notes, where):
        """Google's wire value as the kind spells it, or None — VISIBLY.

        The ONE normaliser. A value the kind's enum does not hold is not guessed
        and not written: None here means the CALLER leaves the property absent
        (never writes null), and the value is recorded in `notes` so the run
        names it on the account's `contactsSyncStatus`. A page is never refused
        for a widening, and a widening is never silent.
        """
        if not isinstance(raw, str):
            if raw is not None:
                notes.add(where + " is not a string")
            return None
        text = raw.strip()
        if not text:
            return None
        held = _ENUMS[family].get(text)
        if held is None:
            held = _ENUMS[family].get(text.upper())
        if held is None:
            notes.add("%s=%s" % (where, text[:40]))
            return None
        return held


    # --------------------------------------------------------------------------
    # the arrays: every People occurrence array, field by field, typed
    # --------------------------------------------------------------------------
    # Nothing is dropped into `json` — a People date is three OPTIONAL integers,
    # which is an object of three ints, and an entry's `metadata` is a declared
    # shape rather than a shrug. The tuple is (API field, declared type, declared
    # name) and the third is present only where the dialect cannot spell the
    # API's name.
    _STR, _TEXT, _URL, _BOOL, _INT, _DATE, _PHONE = (
        "string", "text", "url", "bool", "int", "date", "phone")
    _ARRAYS = {
        "addresses": (
            ("formattedValue", _STR), ("type", _STR), ("formattedType", _STR),
            ("poBox", _STR), ("streetAddress", _STR), ("extendedAddress", _STR),
            ("city", _STR), ("region", _STR), ("postalCode", _STR),
            ("country", _STR), ("countryCode", _STR)),
        "ageRanges": (("ageRange", "enum:agerange"),),
        "biographies": (("value", _TEXT), ("contentType", "enum:contenttype")),
        "birthdays": (("text", _STR), ("date", _DATE)),
        "calendarUrls": (("url", _STR), ("type", _STR), ("formattedType", _STR)),
        "clientData": (("key", _STR), ("value", _STR)),
        "coverPhotos": (("url", _URL), ("default", _BOOL)),
        "events": (("type", _STR), ("formattedType", _STR), ("date", _DATE)),
        "externalIds": (("value", _STR), ("type", _STR), ("formattedType", _STR)),
        "fileAses": (("value", _STR),),
        "genders": (("value", _STR), ("formattedValue", _STR),
                    ("addressMeAs", _STR)),
        "imClients": (("username", _STR), ("protocol", _STR),
                      ("formattedProtocol", _STR), ("type", _STR),
                      ("formattedType", _STR)),
        "interests": (("value", _STR),),
        "locales": (("value", _STR),),
        "locations": (("value", _STR), ("type", _STR), ("current", _BOOL),
                      ("buildingId", _STR), ("floor", _STR),
                      ("floorSection", _STR), ("deskCode", _STR)),
        "miscKeywords": (("value", _STR), ("type", "enum:misckeywordtype"),
                         ("formattedType", _STR)),
        "names": (("displayName", _STR), ("displayNameLastFirst", _STR),
                  ("unstructuredName", _STR), ("familyName", _STR),
                  ("givenName", _STR), ("middleName", _STR),
                  ("honorificPrefix", _STR), ("honorificSuffix", _STR),
                  ("phoneticFullName", _STR), ("phoneticFamilyName", _STR),
                  ("phoneticGivenName", _STR), ("phoneticMiddleName", _STR),
                  ("phoneticHonorificPrefix", _STR),
                  ("phoneticHonorificSuffix", _STR)),
        "nicknames": (("value", _STR), ("type", "enum:nicknametype")),
        "occupations": (("value", _STR),),
        # People's `title` is the ONE field this mirror cannot spell the API's
        # way: `title` is RESERVED at every level of the dialect (every record
        # carries the built-in `title` column, and the loader refuses it even as
        # an object field), so the copy renames it and the kind declares
        # `jobTitle`.
        "organizations": (("name", _STR), ("phoneticName", _STR),
                          ("title", _STR, "jobTitle"), ("jobDescription", _TEXT),
                          ("department", _STR), ("symbol", _STR),
                          ("domain", _STR), ("location", _STR),
                          ("costCenter", _STR), ("type", _STR),
                          ("formattedType", _STR), ("current", _BOOL),
                          ("fullTimeEquivalentMillipercent", _INT),
                          ("startDate", _DATE), ("endDate", _DATE)),
        # `canonicalForm` is Google's E.164 normalisation, so it is the `phone`
        # and the user-typed `value` beside it is a string.
        "phoneNumbers": (("value", _STR), ("canonicalForm", _PHONE),
                         ("type", _STR), ("formattedType", _STR)),
        "photos": (("url", _URL), ("default", _BOOL)),
        "relations": (("person", _STR), ("type", _STR), ("formattedType", _STR)),
        "sipAddresses": (("value", _STR), ("type", _STR),
                         ("formattedType", _STR)),
        "skills": (("value", _STR),),
        "urls": (("value", _STR), ("type", _STR), ("formattedType", _STR)),
        "userDefined": (("key", _STR), ("value", _STR)),
    }


    class _NoRedirect(urllib.request.HTTPRedirectHandler):
        """urllib re-sends the Authorization header across a redirect. Refuse
        instead: a None new-request turns the 30x into an ordinary error."""

        def redirect_request(self, req, fp, code, msg, headers, newurl):
            return None


    # An EMPTY ProxyHandler, explicitly: the default opener honours
    # http_proxy/https_proxy from the runner's environment, which would route
    # the bearer through whatever that variable names.
    _OPENER = urllib.request.build_opener(
        _NoRedirect, urllib.request.ProxyHandler({}))


    def _api_base(cfg):
        """The configured API base, or Google's own host.

        LOOPBACK ONLY. The config row is owner-writable, so an arbitrary base
        would let an edit redirect the account's access token; a base that is
        not loopback is refused by name rather than silently ignored, because
        silently calling Google when the operator asked for a fake is how a
        seed run ends up writing live data.
        """
        props = ((cfg.get("inputs") or {}).get("client") or {}).get("properties") or {}
        base = str(props.get("apiBase") or "").strip().rstrip("/")
        if not base:
            return PEOPLE_API
        host = (urllib.parse.urlsplit(base).hostname or "").lower()
        if host not in LOOPBACK_HOSTS:
            raise RuntimeError(
                "google-contacts: config.apiBase names %s — only a loopback "
                "host may stand in for %s" % (host or "?", PEOPLE_HOST))
        return base


    def _pinned(url, base):
        """Is this URL the base this body is allowed to call?

        Two admissions, and no third. The CONFIGURED BASE, whatever it is:
        the same scheme and host the resolved base carries — which covers
        Google's own origin, a loopback fake named on the config row, and a
        closure whose constant an e2e rewired before it was installed. And
        PEOPLE_HOST over https, always, so a body whose base was cleared still
        cannot be pointed anywhere else.
        """
        u = urllib.parse.urlsplit(url)
        b = urllib.parse.urlsplit(base or "")
        host = (u.hostname or "").lower()
        if host and host == (b.hostname or "").lower() and u.scheme == b.scheme:
            return True
        return u.scheme == "https" and host == PEOPLE_HOST


    def _get(base, token, path, params=None):
        # The `network:` grant is declared but not enforced host by host, so
        # this refusal is the defense. It raises inside the per-account
        # try/except, so a tampered base stamps THAT account erroring rather
        # than parking the whole delivery.
        url = base + path
        if params:
            url = url + "?" + urllib.parse.urlencode(params, doseq=True)
        if not _pinned(url, base):
            parts = urllib.parse.urlsplit(url)
            raise RuntimeError(
                "google-contacts: refusing to send credentials to %s://%s — "
                "only https://%s or the configured loopback base"
                % (parts.scheme, parts.hostname or "?", PEOPLE_HOST))
        req = urllib.request.Request(url, headers={
            "Authorization": "Bearer " + token, "Accept": "application/json"})
        with _OPENER.open(req, timeout=20) as resp:
            return _json.loads(resp.read().decode("utf-8"))


    def _http_status(e):
        return getattr(e, "code", None)


    def _reason(e):
        """The failure in one line, and its CLASS first.

        The words matter: the status is what the console shows and what the e2e
        asserts on, so each class is named rather than left as a status code.
        401 is PERMANENT until the owner reconnects; 403 is the stream being
        unavailable to this grant; 429 is transient and says when; everything
        else is transient and the cadence retries it.
        """
        code = _http_status(e)
        if code == 401:
            return ("reconnect needed: Google refused the grant (401) — the "
                    "token was revoked or expired beyond refresh")
        if code == 403:
            return ("stream not available: Google refused the call (403) — is "
                    "contacts.readonly granted? a reconnect may be needed")
        if code == 429:
            return "rate limited by Google (429) — the retry is scheduled"
        if code is not None:
            return "google returned HTTP %d" % code
        return str(e) or type(e).__name__


    def _now():
        return _dt.datetime.now(_dt.timezone.utc).replace(microsecond=0)


    def _iso(ts):
        """A datetime as RFC 3339 UTC, KEEPING whatever precision it carries.

        It used to truncate to whole seconds, which threw away the sub-second
        part of every `source.updateTime` Google sends. The stream's own cadence
        stamp is minted by `_now()` at second precision because that is this
        body's clock; an API instant is written exactly as it arrived.
        """
        stamp = ts if ts.tzinfo is not None else ts.replace(tzinfo=_dt.timezone.utc)
        return stamp.astimezone(_dt.timezone.utc).isoformat().replace("+00:00", "Z")


    def _parse(ts):
        try:
            return _dt.datetime.fromisoformat(str(ts).replace("Z", "+00:00"))
        except (TypeError, ValueError):
            return None


    def _instant(raw, notes, where):
        """One API timestamp, at the precision Google sent it."""
        if not isinstance(raw, str) or not raw.strip():
            return None
        stamp = _parse(raw.strip())
        if stamp is None:
            notes.add(where + " is not an RFC 3339 instant")
            return None
        return _iso(stamp)


    def _absolute(text):
        parts = urllib.parse.urlsplit(text)
        return parts.scheme in ("http", "https") and bool(parts.netloc)


    def _mailbox(raw):
        """The bundle's mailbox NORMAL FORM, or "" when it does not parse.

        Trim, lowercase the DOMAIN (DNS is case-insensitive), leave the LOCAL
        PART exactly as the API spelled it: RFC 5321 §2.4 reserves the local
        part's case for the receiving host, so lowercasing it rewrites somebody
        else's identity. Version 18 lowercased the whole mailbox and destroyed
        the distinction. The same three lines must live in the gmail and calendar
        streams, or the hub stops converging.
        """
        text = str(raw or "").strip()
        if "@" not in text:
            return ""
        local, _, domain = text.rpartition("@")
        normal = local + "@" + domain.lower()
        return normal if _RE_ADDR.match(normal) else ""


    def _wants(acct):
        # The owner's PAUSE holds the scheduled path too (the `sync` trait's
        # `syncPaused`, decision 0085). The dispatcher settles a paused account's
        # RECORD-sourced deliveries as skips before this body ever runs, and
        # nothing else would stop the hourly tick walking it. A pause is not a
        # disabled stream: every toggle and every cursor is exactly where it was
        # when it lifts.
        props = acct.get("properties") or {}
        return bool(props.get("enabledContacts")) and not props.get("syncPaused")


    def _requested(props):
        """An unspent "sync now" for THIS stream.

        `syncRequestedAt` is a GENERATION and `contactsSyncRequestedAck` is what
        this stream last spent; while they disagree the request is outstanding.
        It OVERRIDES the cadence — a request that still had to wait an hour would
        not be a request — and it is the only thing that can drive a re-seeded
        account at all: a purge leaves the account row and its
        `contactsLastSyncedAt` standing, so both the on-connect guard and the
        cadence gate say "nothing to do" on every later seed.
        """
        requested = str(props.get("syncRequestedAt") or "")
        return bool(requested) and \
            str(props.get("contactsSyncRequestedAck") or "") != requested


    def _retry_after(e):
        """A 429's `Retry-After`, as the instant the account may be called again.

        A 429 SAYS WHEN (docs/provider-practices.md §5), and a drain that ignores
        it retries into the same wall on the next tick. The header is seconds or
        an HTTP date; anything unreadable falls back to a minute, because a 429
        with no usable hint is still a 429.
        """
        if getattr(e, "code", None) != 429:
            return ""
        raw = ""
        try:
            raw = str((getattr(e, "headers", None) or {}).get("Retry-After") or "")
        except Exception:
            raw = ""
        seconds = 60
        raw = raw.strip()
        if raw.isdigit():
            seconds = max(1, min(int(raw), 3600))
        elif raw:
            try:
                import email.utils as _eu
                when = _eu.parsedate_to_datetime(raw)
                if when is not None:
                    if when.tzinfo is None:
                        when = when.replace(tzinfo=_dt.timezone.utc)
                    seconds = max(1, int((when - _now()).total_seconds()))
            except Exception:
                seconds = 60
        return _iso(_now() + _dt.timedelta(seconds=seconds))


    def _due(props):
        freq = (props.get("syncFrequency") or "daily").lower()
        # A 429 SAYS WHEN. Until that instant nothing about this account is due —
        # not the cadence, and not a "sync now" either, because the wall is
        # Google's and no amount of asking moves it.
        wall = _parse(props.get("retryNotBefore"))
        if wall is not None and _now() < wall:
            return False
        if _requested(props):
            return True
        if freq == "off":
            return False
        last = _parse(props.get("contactsLastSyncedAt"))
        if last is None:
            return True
        hours = 1 if freq == "hourly" else 24
        return _dt.datetime.now(_dt.timezone.utc) - last >= _dt.timedelta(hours=hours)


    def _group_id(host, account, resource_name):
        return host.ids.external("google-contactgroup", account, resource_name)


    def _contact_id(host, account, resource_name):
        # A length-prefixed sha256 over (provider, account, external_id).
        # Account is a component because People ids are PER address book:
        # people/c1 in two address books is two humans.
        return host.ids.external("google-contacts", account, resource_name)


    def _address_id(host, account, addr):
        # The SAME composition gmail and calendar use, which is what makes an
        # address-book entry, a mail sender and a meeting attendee ONE row — and
        # which is why `_mailbox` has to be the same three lines in all three.
        return host.ids.external("google-address", account, addr)


    # --------------------------------------------------------------------------
    # copying a payload: presence in, presence out
    # --------------------------------------------------------------------------

    def _put_field(item, name, kind, value, notes, where):
        """One declared field of one occurrence, typed, presence preserved.

        The caller has already established that the payload CARRIED this key. A
        key carried as `null` is not written — an object is stored whole, so a
        field left out of it IS that field's deletion — and every other value is
        written as itself, including `""`, `0` and `false`.
        """
        if value is None:
            return
        if kind == _BOOL:
            if isinstance(value, bool):
                item[name] = value
            else:
                notes.add(where + " is not a boolean")
            return
        if kind == _INT:
            if isinstance(value, bool) or not isinstance(value, int):
                notes.add(where + " is not an integer")
                return
            item[name] = value
            return
        if kind == _DATE:
            held = _partial_date(value)
            if held is not None:
                item[name] = held
            return
        if kind == _PHONE:
            number = str(value).strip()
            if _RE_E164.match(number):
                item[name] = number
            else:
                # The engine holds a `phone` to E.164 at APPLY, where this body
                # cannot catch the failure, so a value it would refuse is left
                # absent and NAMED. The user-typed `value` keeps the spelling.
                notes.add(where + " is not E.164")
            return
        if kind == _URL:
            text = str(value).strip()
            if _absolute(text):
                item[name] = text
            else:
                notes.add(where + " is not an absolute URL")
            return
        if kind.startswith("enum:"):
            held = _enum(kind[5:], value, notes, where)
            if held is not None:
                item[name] = held
            return
        item[name] = value if isinstance(value, str) else str(value)


    def _partial_date(raw):
        """A People date: three OPTIONAL integers, never a civil `date`.

        `0` is one of Google's own values — "a date without a year", "a year
        without a month" — so it is copied, not treated as empty. An all-absent
        date is dropped rather than written as `{}`, which the loader refuses.
        """
        if not isinstance(raw, dict):
            return None
        out = {}
        for field in ("year", "month", "day"):
            value = raw.get(field)
            if isinstance(value, int) and not isinstance(value, bool):
                out[field] = value
        return out or None


    def _source(raw, notes, where, profile):
        """One Source, typed, with its `type` normalised onto the enum.

        `profile` says whether this Source is allowed to carry the
        ProfileMetadata subtree: People documents `etag`, `updateTime` and
        `profileMetadata` as populated ONLY in `person.metadata.sources`, and an
        ENTRY's `metadata.source` is a fifth nesting level the dialect refuses
        anyway — so the omission the README calls ask 3 loses no data, because
        the only place Google fills that subtree is the one place it is declared.
        """
        if not isinstance(raw, dict):
            return None
        one = {}
        if "type" in raw:
            held = _enum("sourcetype", raw["type"], notes, where + ".type")
            if held is not None:
                one["type"] = held
        for field in ("id", "etag"):
            if field in raw and isinstance(raw[field], str):
                one[field] = raw[field]
        if "updateTime" in raw:
            stamp = _instant(raw["updateTime"], notes, where + ".updateTime")
            if stamp is not None:
                one["updateTime"] = stamp
        if profile and isinstance(raw.get("profileMetadata"), dict):
            meta = raw["profileMetadata"]
            two = {}
            if "objectType" in meta:
                held = _enum("objecttype", meta["objectType"], notes,
                             where + ".profileMetadata.objectType")
                if held is not None:
                    two["objectType"] = held
            if isinstance(meta.get("userTypes"), list):
                users = []
                for one_type in meta["userTypes"]:
                    held = _enum("usertype", one_type, notes,
                                 where + ".profileMetadata.userTypes")
                    if held is not None:
                        users.append(held)
                two["userTypes"] = users
            if two:
                one["profileMetadata"] = two
        return one or None


    def _field_metadata(raw, notes, where):
        """One entry's `metadata` (FieldMetadata), declared rather than dropped.

        Every flag is read by MEMBERSHIP and type, never by truthiness, so
        `primary: false` is stored as false instead of vanishing.
        """
        if not isinstance(raw, dict) or "metadata" not in raw:
            return None
        meta = raw["metadata"]
        if not isinstance(meta, dict):
            return None
        out = {}
        for flag in ("primary", "sourcePrimary", "verified"):
            if flag in meta:
                _put_field(out, flag, _BOOL, meta[flag], notes,
                           where + ".metadata." + flag)
        if "source" in meta:
            one = _source(meta["source"], notes, where + ".metadata.source",
                          profile=False)
            if one:
                out["source"] = one
        return out or None


    def _copy(name, entries, notes):
        """One People array, as the OCCURRENCE OBJECTS the kind declares.

        Returns None for a payload that carried the key as `null` (which deletes)
        and a list otherwise — including the EMPTY list, which is Google saying
        the array is now empty and is a different fact from the key being absent.

        Every entry keeps its own `metadata`, because two entries of the same
        array differ by which SOURCE they came from and which is primary — and
        that is a nested object, which neither a link property nor a flat lift
        can hold.
        """
        if entries is None:
            return None
        if not isinstance(entries, list):
            notes.add(name + " is not an array")
            return None
        out = []
        for raw in entries:
            if not isinstance(raw, dict):
                notes.add(name + "[] is not an object")
                continue
            item = {}
            for spec in _ARRAYS[name]:
                api, kind = spec[0], spec[1]
                if api in raw:
                    _put_field(item, spec[2] if len(spec) > 2 else api, kind,
                               raw[api], notes, name + "[]." + api)
            meta = _field_metadata(raw, notes, name + "[]")
            if meta:
                item["metadata"] = meta
            # The loader refuses an empty object, so an occurrence Google sent
            # empty cannot be mirrored as `{}`. It is dropped and named, rather
            # than parking the page.
            if item:
                out.append(item)
            else:
                notes.add(name + "[] carried no declarable field")
        return out


    def _memberships(host, aid, entries, notes):
        """`memberships[]` — the contact groups and domains this contact is in.

        SETTLED (T-023): a contact group is a kind now, so the group membership
        carries a REFERENCE at its row beside the API's own two identifiers. It
        was two strings and a disputed note for as long as no recording answered
        `contactGroups.list` — a reference-only kind whose rows could never become
        whole is worse than the strings, and that was true until the call was
        recorded.
        """
        if entries is None:
            return None
        if not isinstance(entries, list):
            notes.add("memberships is not an array")
            return None
        out = []
        for raw in entries:
            if not isinstance(raw, dict):
                continue
            item = {}
            group = raw.get("contactGroupMembership")
            if isinstance(group, dict):
                one = {}
                for field in ("contactGroupResourceName", "contactGroupId"):
                    if field in group and isinstance(group[field], str):
                        one[field] = group[field]
                # THE GROUP ROW THE MEMBERSHIP NAMES (T-023). `contactGroups.list`
                # is recorded now, so a contact group is a kind and this is a
                # reference rather than two strings and a note. The API's own two
                # identifiers stay beside it: this object mirrors the API's
                # object, and the reference is composed from the resource name it
                # already carries.
                resource = one.get("contactGroupResourceName")
                if resource:
                    one["contactGroup"] = {
                        "ref": GROUP_TYPE + "/" + _group_id(host, aid, resource)}
                if one:
                    item["contactGroupMembership"] = one
            domain = raw.get("domainMembership")
            if isinstance(domain, dict) and "inViewerDomain" in domain:
                one = {}
                _put_field(one, "inViewerDomain", _BOOL, domain["inViewerDomain"],
                           notes, "memberships[].domainMembership.inViewerDomain")
                if one:
                    item["domainMembership"] = one
            meta = _field_metadata(raw, notes, "memberships[]")
            if meta:
                item["metadata"] = meta
            if item:
                out.append(item)
        return out


    def _person_metadata(host, aid, meta, notes):
        """People's `metadata` (PersonMetadata), declared.

        `objectType` is the constant discriminator and is DECLARED as a
        three-value enum rather than omitted, so the record says what it is and a
        value Google adds is a widening rather than a surprise.
        `linkedPeopleResourceNames` names other Person resources of this same
        address book, so it is a repeated REFERENCE at `contact` — with DEFERRED
        targets: the linked Person may sit outside the listing this walk read,
        and minting a shell for it would create a row this run's own sweep then
        deletes. `previousResourceNames` stays strings: those are historical
        aliases naming rows this sync RETRACTS.
        """
        if meta is None or not isinstance(meta, dict):
            return None
        out = {}
        if "deleted" in meta:
            _put_field(out, "deleted", _BOOL, meta["deleted"], notes,
                       "metadata.deleted")
        if "objectType" in meta:
            held = _enum("objecttype", meta["objectType"], notes,
                         "metadata.objectType")
            if held is not None:
                out["objectType"] = held
        if isinstance(meta.get("previousResourceNames"), list):
            out["previousResourceNames"] = [
                x for x in meta["previousResourceNames"] if isinstance(x, str)]
        if isinstance(meta.get("linkedPeopleResourceNames"), list):
            out["linkedPeopleResourceNames"] = [
                {"ref": _contact_id(host, aid, x)}
                for x in meta["linkedPeopleResourceNames"]
                if isinstance(x, str) and x]
        if isinstance(meta.get("sources"), list):
            sources = []
            for raw in meta["sources"]:
                one = _source(raw, notes, "metadata.sources[]", profile=True)
                if one:
                    sources.append(one)
            out["sources"] = sources
        return out or None


    def _addresses(host, aid, entries, notes):
        """`emailAddresses[]` as OCCURRENCE OBJECTS, and the hub rows they need.

        Not repeated references with link data: the same address can appear twice
        (once from the CONTACT source, once from a DOMAIN_PROFILE), a repeated
        reference refuses a duplicate target, and each entry's `metadata` is a
        nested object link data cannot hold. So the entry is the API's own, with
        the identity a reference FIELD inside it and `value` beside it — which is
        the API's own field AND the probe a person mapping reads without walking
        a pointer (`docs/kind-design.md` §2 prescribes exactly this pair).

        `value` keeps GOOGLE'S SPELLING; only the reference beside it is
        normalised. A value that does not parse is written neither as an identity
        nor as a hub row, and is named on the status BY FIELD — never by value,
        because a status column is not a place to put somebody's address.
        """
        if entries is None:
            return None, []
        if not isinstance(entries, list):
            notes.add("emailAddresses is not an array")
            return None, []
        out, rows = [], []
        for raw in entries:
            if not isinstance(raw, dict):
                continue
            item = {}
            if "value" in raw and isinstance(raw["value"], str):
                source = raw["value"].strip()
                normal = _mailbox(source)
                if normal:
                    item["value"] = source
                    item["address"] = {"ref": _address_id(host, aid, normal)}
                    rows.append(normal)
                elif source:
                    notes.add("emailAddresses[].value does not parse")
            for field in ("type", "formattedType", "displayName"):
                if field in raw:
                    _put_field(item, field, _STR, raw[field], notes,
                               "emailAddresses[]." + field)
            meta = _field_metadata(raw, notes, "emailAddresses[]")
            if meta:
                item["metadata"] = meta
            if item:
                out.append(item)
        return out, rows


    # --------------------------------------------------------------------------
    # staging one person
    # --------------------------------------------------------------------------

    def _retractions(host, aid, state):
        """Stage the page's deletes — ONCE each, and only for rows that are there.

        A delete of a row that does not exist can fail the WHOLE delivery, and
        version 18 issued one unconditionally for every previous resource name
        and every tombstone. Three ordinary things make that row absent: an
        idempotent retry of a page already applied, a tombstone Google repeats on
        successive deltas, and an alias for a contact this account never
        mirrored. So the page COLLECTS its candidates — the dict collapses a
        page-local duplicate, two persons naming one old alias, into a single
        effect — and this resolves them against live rows before staging a thing.

        ONE READ PER 200 CANDIDATES, not one per candidate: the function's read
        budget is 256 calls, and a delta page of 200 tombstones each carrying an
        alias would otherwise spend 400 of them and trip the budget instead of
        draining.
        """
        wanted = {name: rid for name, rid in state["retract"].items()
                  if rid not in state["live"]}
        if not wanted:
            return
        names = sorted(wanted)
        live = set()
        for start in range(0, len(names), SWEEP_PAGE):
            chunk = names[start:start + SWEEP_PAGE]
            page = host.records.list(
                CONTACT_TYPE,
                where={"account": {"eq": aid}, "resourceName": {"in": chunk}},
                first=len(chunk))
            for ent in page.get("records") or []:
                rid = str(ent.get("id") or "")
                if rid:
                    live.add(rid)
        for name in names:
            if wanted[name] in live:
                host.effects.delete(CONTACT_TYPE, wanted[name])


    def _stage_person(host, aid, person, state):
        """One People person: its address hub rows first (a reference's target
        should exist when the row naming it applies), then the renames its
        metadata carries, then the row itself or its tombstone.

        ABSENT IS NOT NULL. Version 18 built a complete property map out of
        `.get` defaults, so a person payload carrying only `resourceName` wrote
        31 nulls and erased a fuller row. Here a property reaches `props` only
        when the payload CARRIED its key; a key carried as `null` still writes
        null, which still deletes.
        """
        resource = person.get("resourceName")
        if not isinstance(resource, str) or not resource:
            state["notes"].add("a connection carried no resourceName")
            return 0
        notes = state["notes"]
        cid = _contact_id(host, aid, resource)
        meta = person.get("metadata") if isinstance(person.get("metadata"), dict) else {}

        # THE RENAME, reconciled against the whole walk rather than this entry.
        # `live` is every id this drain has written as a live contact — this page
        # and every page before it on the cursor — so an alias that is ALSO a
        # live row (two persons on one page, or a rename undone on a later page)
        # is never retracted by the other's arrival, whichever order they came in.
        for prev in meta.get("previousResourceNames") or []:
            if not isinstance(prev, str) or not prev or prev == resource:
                continue
            pid = _contact_id(host, aid, prev)
            if pid == cid:
                continue
            state["retract"][prev] = pid

        if meta.get("deleted") is True:
            state["retract"][resource] = cid
            return 0

        state["live"].add(cid)
        entries, rows = _addresses(host, aid, person.get("emailAddresses")
                                   if "emailAddresses" in person else None, notes)
        for addr in rows:
            # The hub row carries the address and nothing else: the name THIS
            # entry spelled is on the entry, not on the hub, so no address book
            # can overwrite what a mail header said.
            host.effects.put(ADDRESS_TYPE, _address_id(host, aid, addr),
                             properties={"account": aid, "address": addr})

        props = {"account": aid, "resourceName": resource}
        if "etag" in person:
            _put_field(props, "etag", _STR, person["etag"], notes, "etag")
            if person["etag"] is None:
                props["etag"] = None
        if "emailAddresses" in person:
            props["emailAddresses"] = entries
        if "memberships" in person:
            props["memberships"] = _memberships(host, aid, person["memberships"],
                                                notes)
        if "metadata" in person:
            props["metadata"] = _person_metadata(host, aid, person["metadata"],
                                                 notes)
        # The DEPRECATED scalar, copied when Google volunteers it: the endpoint's
        # personFields vocabulary has no `ageRange`, so the mask cannot ask.
        if "ageRange" in person:
            held = _enum("agerange", person["ageRange"], notes, "ageRange")
            if held is not None:
                props["ageRange"] = held
            elif person["ageRange"] is None:
                props["ageRange"] = None
        for name in _ARRAYS:
            if name in person:
                props[name] = _copy(name, person[name], notes)
        state["seen"].add(cid)
        host.effects.put(CONTACT_TYPE, cid, properties=props)
        return 1


    # --------------------------------------------------------------------------
    # the drain
    # --------------------------------------------------------------------------

    def _expired_sync_token(e, body=None):
        # ONLY a structured EXPIRED_SYNC_TOKEN triggers a full re-read: a bare
        # 400/410 is a real request bug, not token expiry, and must surface
        # rather than silently full-sync. Version 18 also accepted the string
        # ANYWHERE in the serialized body, which is a substring match on an
        # arbitrary error payload; the structured reason is the contract, and it
        # is the only thing matched here.
        if getattr(e, "code", None) not in (400, 410):
            return False
        # AN HTTPError BODY READS ONCE. A caller that has already had to classify
        # the error (the directory walk asks three questions of one refusal)
        # passes the body it read; only a caller that has not reads here.
        if body is None:
            try:
                body = _json.loads(e.read().decode("utf-8", "replace"))
            except Exception:
                return False
        err = (body or {}).get("error") or {}
        for d in (err.get("details") or []) + (err.get("errors") or []):
            if not isinstance(d, dict):
                continue
            if (d.get("reason") or "") == "EXPIRED_SYNC_TOKEN":
                return True
        return False


    def _params(sync_token, page_token):
        params = {"personFields": PERSON_FIELDS, "pageSize": PAGE_SIZE,
                  "requestSyncToken": "true"}
        if sync_token:
            params["syncToken"] = sync_token
        if page_token:
            params["pageToken"] = page_token
        return params



    def _dir_params(sync_token, page_token, fields):
        params = {"sources": list(DIRECTORY_SOURCES), "readMask": fields,
                  "pageSize": PAGE_SIZE, "requestSyncToken": "true"}
        if sync_token:
            params["syncToken"] = sync_token
        if page_token:
            params["pageToken"] = page_token
        return params


    def _error_body(e):
        try:
            return _json.loads(e.read().decode("utf-8", "replace")) or {}
        except Exception:
            return {}


    def _reason_of(body, e):
        """The refusal in one line, out of the body already read."""
        err = (body or {}).get("error") or {}
        text = str(err.get("message") or "") or str(e)
        return ("HTTP %s %s" % (getattr(e, "code", "?"), text))[:REASON_MAX]


    def _mask_refusal(body, fields):
        """The read-mask fields Google's 400 named, if that is what it named.

        A narrowing at Google must cost a field, not a stream: the refusal names
        the offending path, so it is dropped from the mask, the call is retried
        once, and the drop is reported on the account's status. Returns the new
        mask and the dropped names, or (None, []) when the error is not about the
        mask at all.
        """
        err = body.get("error") or {}
        text = str(err.get("message") or "")
        if "readMask" not in text and "read mask" not in text.lower():
            return None, []
        held = [f for f in fields.split(",") if f]
        dropped = [f for f in held if f in text]
        if not dropped or len(dropped) == len(held):
            return None, []
        return ",".join(f for f in held if f not in dropped), dropped


    def _directory_verdict(code, body):
        """Why the directory endpoint refused, in the only two words that are not
        an error: `needsreconsent` and `unavailable`. Anything else is an error
        and fails the stream exactly as a connections failure does.

        VERIFIED LIVE, 2026-09-16: a CONSUMER (non-Workspace) Google account does
        NOT refuse this call — it answers HTTP 200 with an empty `people` list and
        a `nextSyncToken`. So "no directory" is the ordinary empty walk, not an
        error path, and `unavailable` is reserved for a domain that has the API
        switched off (`FAILED_PRECONDITION`).

        `needsreconsent` is the state every account already connected under an
        older package version is in: the grant predates
        `directory.readonly`, so Google answers 403
        ACCESS_TOKEN_SCOPE_INSUFFICIENT until the owner reconnects. That is a
        missing consent, not an outage: the contacts stream still completes on its
        connections walk, and the account says what it needs.
        """
        if code not in (403, 400):
            return ""
        err = (body or {}).get("error") or {}
        status = str(err.get("status") or "")
        text = (str(err.get("message") or "") + " " + _json.dumps(
            err.get("details") or err.get("errors") or [])).lower()
        if "scope" in text or "acl_insufficient" in text or "insufficientpermissions" in text:
            return "needsreconsent"
        if status == "FAILED_PRECONDITION" or "failed_precondition" in text:
            return "unavailable"
        if status == "PERMISSION_DENIED" and "directory" in text:
            return "unavailable"
        return ""


    def _ack(props, stamp, stream):
        """Echo the request generation THIS run acted on, on EVERY path.

        `syncRequestedAt` is how the owner (and the seed runner) asks for a sync
        now, and how a re-seeded account is re-driven at all: its
        `contactsLastSyncedAt` survives a purge, so the on-connect guard is already
        false. The `google-contacts-on-request` trigger fires exactly while the request
        and this stream's ack disagree — so an UNACKNOWLEDGED request re-fires the
        trigger against the same work forever, which is why the erroring path
        acknowledges too.
        """
        requested = str(props.get("syncRequestedAt") or "")
        if requested and str(props.get(stream + "SyncRequestedAck") or "") != requested:
            stamp[stream + "SyncRequestedAck"] = requested
        return stamp


    # --------------------------------------------------------------------------
    # the core `sync` trait (substrate decision 0085)
    # --------------------------------------------------------------------------
    # The account binds `sync` beside `accountconfig`, so twelve of its properties
    # are the SUBSTRATE's vocabulary rather than this bundle's: the console's
    # Connections page, `GET /api/v1/sync/status` and `substratectl sync status`
    # read them off any provider that binds the trait, knowing nothing about
    # Google. They are written BESIDE the legacy `syncStatus` /
    # `<stream>SyncStatus` sentences and the three per-stream acks, never instead
    # of them — a reader of the old shape (the end-to-end runner's `(N pending)`
    # contract, the seed, the `google-<stream>-on-request` guards) goes on working
    # unchanged, and the legacy pair goes at the next major.
    #
    # THE SAME THREE HELPERS LIVE IN ALL THREE STREAM BODIES, verbatim. A function
    # is a closure with no shared module to import, and the account they patch is
    # one row: a copy that drifted would be two streams disagreeing about what the
    # account's state means.
    _TRAIT_STREAMS = ("contacts", "gmail", "calendar", "drive")


    def _trait_streams(props):
        """The account's `syncStreams` map, however the engine hands it back."""
        raw = props.get("syncStreams") or {}
        if isinstance(raw, str):
            try:
                raw = _json.loads(raw)
            except ValueError:
                raw = {}
        return dict(raw) if isinstance(raw, dict) else {}


    def _trait_broken(props, streams, name):
        """Is THAT stream failing right now?

        The trait's own entry first, and the legacy sentence behind it: an account
        upgraded into the trait carries no `syncStreams` until each stream has run
        once under this version, and until then a stream's `<stream>SyncStatus` is
        the only evidence that it is broken.
        """
        entry = streams.get(name) or {}
        if str(entry.get("state") or "") in ("erroring", "throttled"):
            return True
        return str(props.get(name + "SyncStatus") or "").startswith("erroring")


    def _trait_answered(props, streams, name, requested):
        """Has THAT stream answered this request generation?

        Either half counts: the trait's entry and the legacy per-stream ack are
        written in step, and the legacy one is what the on-request guards read.
        """
        entry = streams.get(name) or {}
        return (str(entry.get("requestedAck") or "") == requested
                or str(props.get(name + "SyncRequestedAck") or "") == requested)


    def _trait_stamp(props, stream, state, message, now, completed=False,
                     progress=None, started="", elapsed_ms=None):
        """The trait's half of one account patch.

        `state` is one of the trait's five words — `never`, `running`, `ok`,
        `erroring`, `throttled` — and `props` is the account as it stood BEFORE
        this patch, which is what makes the rollup readable. Three rules, the same
        three the legacy rollup follows:

          - this stream's entry in `syncStreams` is unconditional;
          - the ACCOUNT-LEVEL state is RAISED and never cleared over another
            ENABLED stream's live failure, so a healthy contacts run cannot make a
            broken gmail read `ok` on the Connections page;
          - the owner's request is acknowledged at the account level only once
            EVERY enabled stream has answered that same generation. Three streams
            answer independently, and one shared ack spent by whichever ran first
            would tell the page a request was served while two streams had not
            moved.

        `completed` is what stamps `lastAt`: a drain that handed back with work
        owed is `ok` with a pending count, not a run that finished.
        """
        streams = _trait_streams(props)
        entry = dict(streams.get(stream) or {})
        entry["state"] = state
        entry["message"] = str(message)[:400]
        if completed:
            entry["lastAt"] = now
        if progress is not None:
            # Only a run that COUNTED sets the count: a failure stamp carries no
            # bookkeeping, and zeroing the entry there would say the work it never
            # reached is done.
            entry["pending"] = int(progress.get("pending") or 0)
        requested = str(props.get("syncRequestedAt") or "")
        if requested:
            entry["requestedAck"] = requested
        streams[stream] = entry
        out = {"syncStreams": streams}
        others = [s for s in _TRAIT_STREAMS if s != stream
                  and props.get("enabled" + s.capitalize())]
        # THE ACCOUNT HOLDS ONE PROGRESS, SO IT IS RAISED THE WAY THE STATE IS.
        # `syncProgress` is the trait's single bounded-drain report and all three
        # streams write it, so a stream that finished with nothing owed must not
        # overwrite another's live `pending` — that is the bug the legacy rollup
        # already had once, where a completed contacts run wrote `ok` over the
        # calendar walk's `ok (6 pending)` and the drain was reported done with a
        # third of the mirror unwritten. This stream's own pending (or failure)
        # always speaks; an empty one only when nothing else is owed.
        owed_elsewhere = any(int((streams.get(s) or {}).get("pending") or 0) > 0
                             for s in others)
        if progress is not None and (int(progress.get("pending") or 0) > 0
                                     or state in ("erroring", "throttled")
                                     or not owed_elsewhere):
            out["syncProgress"] = progress
        # The two the DISPATCHER owns around a record-sourced delivery, written by
        # the body only where no dispatcher is watching (the scheduled path).
        if started:
            out["lastSyncStartedAt"] = started
        if elapsed_ms is not None:
            out["lastSyncDurationMs"] = max(0, int(elapsed_ms))
        if state in ("erroring", "throttled"):
            # A failure always speaks: it is the account's newest fact, and the
            # two error fields are the only place the cause survives a recovery.
            out["syncState"] = state
            out["syncMessage"] = str(message)[:400]
            out["syncError"] = str(message)[:400]
            out["syncErrorAt"] = now
        elif not any(_trait_broken(props, streams, s) for s in others):
            out["syncState"] = state
            out["syncMessage"] = str(message)[:400]
        if requested and all(_trait_answered(props, streams, s, requested)
                             for s in others):
            out["syncRequestedAck"] = requested
        return out


    def _trait_progress(phase, done, pending):
        """`{phase, done, total, pending}`, off the drain's own bookkeeping.

        `total` is `done + pending` rather than a number Google never gives: no
        Google listing announces how many rows it will hand over, so the honest
        total is what this run has written plus what it knows it still owes — and
        that is also the one a progress bar can move forward on.
        """
        done, pending = max(0, int(done or 0)), max(0, int(pending or 0))
        return {"phase": phase, "done": done, "total": done + pending,
                "pending": pending}


    def _clock():
        """A SUB-SECOND wall clock, for the budget and the duration only.

        `_now()` truncates to the whole second — deliberately, because that is the
        precision this body's own stamps carry — so a budget measured with it
        cannot see anything shorter than a second, and every invocation inside one
        second reads as zero elapsed. That is not a theoretical gap: a whole drain
        over the e2e fixtures fits inside a second, so the bound could not be
        tested at all, and a duration in milliseconds was always a multiple of a
        thousand.
        """
        return _dt.datetime.now(_dt.timezone.utc).timestamp()


    def _trait_begin(cur):
        """Stamp when THIS account's walk began, once per account in the chain."""
        if not cur.get("traitStartTs"):
            cur["traitStartedAt"] = _iso(_now())
            cur["traitStartTs"] = _clock()
        return cur


    def _trait_run(cur):
        """The start instant and the elapsed milliseconds for the patch that ends
        this account's walk — or nothing at all on the record-sourced path, where
        the dispatcher stamps both itself and a second hand writing them would be
        one hand too many (decision 0085)."""
        if not cur.get("scheduled") or not cur.get("traitStartedAt"):
            return "", None
        began = float(cur.get("traitStartTs") or 0)
        if not began:
            return str(cur["traitStartedAt"]), None
        return str(cur["traitStartedAt"]), int((_clock() - began) * 1000)


    def _carry_trait(cur, nxt):
        """A rebuilt cursor keeps WHICH PATH drove the run, THE CHAIN'S OWN CLOCK
        and the budget it is measured against.

        The chain's clock is the one thing a rebuilt cursor must never lose: the
        engine's drain deadline is cumulative over the WHOLE chain — every
        account, every page, every sweep — so a cursor that starts the clock again
        at the next account is a chain that walks straight through the deadline
        and PARKS, which is exactly what every hourly `google-gmail-scheduled`
        fire did in production. The account's OWN walk start (`traitStartedAt`) is
        deliberately not carried: that one belongs to the account, and the next
        account's walk begins when it begins.
        """
        if cur.get("scheduled"):
            nxt["scheduled"] = True
        if cur.get("startedAt"):
            nxt["startedAt"] = cur["startedAt"]
        if cur.get("hops"):
            nxt["hops"] = int(cur["hops"])
        if cur.get("drainBudgetMs"):
            nxt["drainBudgetMs"] = cur["drainBudgetMs"]
        return nxt


    def _chain_begin(cur):
        """Start the chain's wall clock on the first invocation that walks."""
        if not cur.get("startedAt"):
            cur["startedAt"] = _clock()
        return cur


    def _drain_budget(cfg, cur):
        """Resolve this run's drain budget onto the cursor.

        THE ENGINE GIVES A CONTINUATION CHAIN TWO MINUTES, cumulatively, and a
        chain that keeps continuing past it is PARKED — the effects it committed
        stand, but the delivery is recorded as a failure, which is what every
        hourly Google fire looked like in production until each stream learned to
        stop itself. `DRAIN_SECONDS` is the built-in bound, under the engine's so
        the final stamp's transaction still fits; `config.drainBudgetMs` overrides
        it, clamped, for the same reason `config.apiBase` exists — so a test can
        prove the bound instead of trusting it, and so an operator can follow the
        engine's deadline if it ever moves.

        MILLISECONDS, because a budget of one second is longer than a whole drain
        over the e2e fixtures: the bound never tripped, and a scenario that cannot
        tell a drain that stopped itself from one that simply finished is testing
        nothing. At 1 ms the first check hands back.
        """
        props = ((cfg.get("inputs") or {}).get("client") or {}).get("properties") or {}
        try:
            want = int(props.get("drainBudgetMs") or 0)
        except (TypeError, ValueError):
            want = 0
        if want > 0:
            cur["drainBudgetMs"] = max(1, min(want, 110000))
        return cur


    def _drain_seconds(cur):
        """The seconds this chain may spend before it hands back."""
        try:
            held = int(cur.get("drainBudgetMs") or 0)
        except (TypeError, ValueError):
            held = 0
        return (held / 1000.0) if held > 0 else float(DRAIN_SECONDS)


    def _out_of_time(cur):
        """Has this chain spent its wall-clock budget?"""
        began = float(cur.get("startedAt") or 0)
        return bool(began) and (_clock() - began) >= _drain_seconds(cur)


    def _erroring(host, acct, reason, retry_at=""):
        # ONE bounded stamp per episode, on THIS stream's own status, so a
        # gmail or calendar failure can never swallow a contacts one. NEITHER
        # lastSyncedAt NOR contactsLastSyncedAt is written: the run did not
        # complete, so the cadence must keep retrying.
        props = acct.get("properties") or {}
        status = "erroring: " + str(reason)[:REASON_MAX]
        now = _iso(_now())
        # A RATE LIMIT IS NOT A BREAKAGE. The trait spells the wall `throttled`,
        # beside `erroring`, because an account waiting out a `Retry-After` is
        # healthy and busy rather than broken, and a page that showed it red
        # would send the owner looking for a fault that is not there
        # (decision 0085). The legacy sentence keeps its `erroring:` prefix, which
        # is what the end-to-end runner and the seed parse.
        state = "throttled" if retry_at else "erroring"
        stamp = _ack(props, {}, "contacts")
        # The ack is stamped EVEN WHEN THE STATUS HAS NOT MOVED: a repeated
        # failure that left the request unacknowledged would re-fire the
        # on-request trigger against the same failure forever. The trait's half of
        # that answer rides with the legacy one — the two are never out of step —
        # and the failure is re-stated with it. A tick that changes nothing
        # returns without a patch at all, so `syncErrorAt` never moves for no news.
        if str(props.get("contactsSyncStatus") or "") == status:
            if stamp:
                stamp.update(_trait_stamp(props, "contacts", state, status, now))
                host.effects.patch((acct.get("kind") or ACCOUNT_TYPE),
                                   acct.get("id"), properties=stamp)
            return
        # A 429 SAYS WHEN, and the wall is the ACCOUNT's: every stream is
        # behind the same quota, so one stream meeting it stops the others
        # walking into it too (docs/provider-practices.md §5).
        if retry_at:
            stamp["retryNotBefore"] = retry_at
        stamp.update({"contactsSyncStatus": status,
                      "contactsSyncState": "erroring"})
        if not str(props.get("syncStatus") or "").startswith("erroring"):
            stamp["syncStatus"] = status
        # The trait's account-level state, its message and the two error fields.
        # `_trait_stamp` raises the state itself and never clears it over another
        # enabled stream's live failure, so the legacy guard above is not repeated
        # here: a failure is always the newest thing this account knows.
        stamp.update(_trait_stamp(props, "contacts", state, status, now))
        host.effects.patch((acct.get("kind") or ACCOUNT_TYPE), acct.get("id"),
                           properties=stamp)


    def _hop(cur):
        """Count this invocation, and stamp the chain's start on the first."""
        cur["hops"] = int(cur.get("hops") or 0) + 1
        if not cur.get("startedAt"):
            cur["startedAt"] = _clock()
        return cur


    def _over_budget(cur):
        """True when this chain should hand back rather than page again.

        Both halves are the CHAIN's, not this invocation's: the engine's budget
        spans every account, page and sweep the continuation reaches, and a chain
        that walks past it is parked with its effects committed — a failure in the
        ledger for work that actually landed.
        """
        if int(cur.get("hops") or 0) >= HOP_MAX:
            return True
        return _out_of_time(cur)


    def _carry_budget(cur, nxt):
        """Hand the chain's counters to the next account's cursor: the engine's
        budget spans the whole chain, so a per-account reset would let a
        five-account queue spend five times it and park on the fifth."""
        nxt["hops"] = int(cur.get("hops") or 0)
        nxt["startedAt"] = cur.get("startedAt") or 0
        return _carry_trait(cur, nxt)


    def _hand_back(host, aid, acct, cur, notes):
        """Stop this chain and leave the walk where the next run can pick it up.

        THE UNFINISHED CURSOR IS PERSISTED, exactly as `gmailsync` persists
        `gmailBackfillResume`: both streams' page tokens, both sync tokens, the
        seen set and its overflow flag, and which stream was mid-walk. And
        `contactsLastSyncedAt` is NOT stamped — the run did not complete, so the
        on-connect guard and `_due` both still hold and the very next scheduled
        tick resumes instead of waiting out the cadence. `pending` is in the
        status because the seed runner reads the ROLLUP for that word to know it
        must stamp `syncRequestedAt` again.
        """
        seen = list(cur.get("seen") or ())
        resume = {"stream": cur.get("stream") or "connections",
                  "pageToken": cur.get("pageToken") or "",
                  "syncToken": cur.get("syncToken") or "",
                  "connToken": cur.get("connToken") or "",
                  "dirPageToken": cur.get("dirPageToken") or "",
                  "dirSyncToken": cur.get("dirSyncToken") or "",
                  "fullConnections": bool(cur.get("fullConnections")),
                  "fullDirectory": bool(cur.get("fullDirectory")),
                  "seenOverflow": bool(cur.get("seenOverflow")),
                  "records": int(cur.get("records") or 0)}
        if seen and len(seen) <= SEEN_MAX:
            resume["seen"] = [str(x) for x in seen]
        resume = {k: v for k, v in resume.items() if v not in ("", None, [], {})}
        props = acct.get("properties") or {}
        stamp = _ack(props, {}, "contacts")
        status = "ok (%d pending)" % max(1, len(cur.get("queue") or [1]))
        stamp.update({"contactsResume": resume,
                      "contactsSyncStatus": status,
                      "contactsSyncState": "pending"})
        if not str(props.get("syncStatus") or "").startswith("erroring"):
            stamp["syncStatus"] = status
        # THE TRAIT HAS NO `pending` WORD, and does not need one: a hand-back is a
        # run that did what it could and knows what is left, which is `ok` with
        # the count in `syncProgress.pending` and in this stream's own entry.
        # `completed=False`, so no `lastAt` is stamped — nothing finished, and the
        # cadence anchor above is deliberately unwritten for the same reason.
        owed = max(1, len(cur.get("queue") or [1]))
        started, elapsed = _trait_run(cur)
        stamp.update(_trait_stamp(
            props, "contacts", "ok", status, _iso(_now()),
            progress=_trait_progress("contacts: " + str(cur.get("stream") or "connections"),
                                     cur.get("records"), owed),
            started=started, elapsed_ms=elapsed))
        host.log("google-contacts: the drain's budget is spent inside %s (%s "
                 "stream) — the cursor is on the account and the next run "
                 "resumes" % (aid, resume.get("stream")))
        host.effects.patch((acct.get("kind") or ACCOUNT_TYPE), aid,
                           properties=stamp)
        return {"output": {"account": aid, "pending": True,
                           "records": int(cur.get("records") or 0)}}


    def _sync_cursor(queue):
        """A fresh per-account cursor.

        `account` is EMPTY on purpose: `main` fills it — together with that
        account's own stored sync token — when the account BEGINS. Version 18
        loaded the token once per DRAIN (`if not resume`), so every account after
        the first in a scheduled queue did a full read and a full sweep on every
        run.
        """
        return {"phase": "sync", "stream": "connections", "queue": queue,
                "account": "", "pageToken": "",
                "syncToken": "", "generation": "", "records": 0,
                "seen": [], "seenOverflow": False, "unknown": [],
                # the connections walk's OUTCOME, held until the directory walk
                # that follows it has also finished: one account, one stamp.
                "connToken": "", "fullConnections": False,
                # the directory walk's own cursor, beside it and never merged:
                # two endpoints, two sync tokens, two page tokens.
                "dirPageToken": "", "dirSyncToken": "", "dirToken": "",
                "dirFields": DIRECTORY_FIELDS, "dirDropped": [],
                "fullDirectory": False, "dirState": "", "dirStatus": ""}


    def _account_cursor(queue, aid, token, dir_token=""):
        cur = _sync_cursor(queue)
        cur["account"] = aid
        cur["syncToken"] = token or ""
        cur["dirSyncToken"] = dir_token or ""
        return cur


    def _status(notes, cur=None):
        """This run's outcome line: `ok`, or `ok` and what it could not spell.

        An unknown enum is not allowed to be silent. It does not fail the stream
        — a widening at Google is not an outage — but it is NAMED here, so the
        console shows exactly which field carried a value this package's version
        does not hold, and the fix is a package bump rather than an
        archaeological dig.
        """
        held = sorted(notes)
        parts = []
        if cur is not None and str(cur.get("dirState") or "") == "needsreconsent":
            parts.append("the Workspace directory needs a reconnect: this grant "
                         "predates the directory.readonly scope")
        elif cur is not None and str(cur.get("dirState") or "") == "unavailable":
            parts.append("no Workspace directory on this account")
        if cur is not None and (cur.get("dirDropped") or []):
            parts.append("directory readMask fields Google refused: %s"
                         % ", ".join(sorted(cur["dirDropped"])[:UNKNOWN_MAX]))
        if held:
            shown = held[:UNKNOWN_MAX]
            more = len(held) - len(shown)
            parts.append("unmirrored People values: %s%s"
                         % ("; ".join(shown), ", +%d more" % more if more else ""))
        if not parts:
            return "ok"
        return ("ok (%s)" % "; ".join(parts))[:400]


    def _stamp(host, aid, acct, sync_token, notes, cur=None):
        # This stream's own cursor and cadence anchor, AND the account-level
        # rollup the console reads. This is the account's one update per sync
        # — the on-connect trigger's guard (no contactsLastSyncedAt yet) goes
        # false after it, so this never re-fires. It runs LAST: after the final
        # page AND, on a full read, after the sweep, because stamping success
        # before reconciliation advertises a walk that has not finished.
        props = acct.get("properties") or {}
        now = _iso(_now())
        status = _status(notes, cur)
        # The STATE is the enum a query filters on; the STATUS beside it is the
        # sentence, which keeps its shape because the runner parses its words.
        stamp = _ack(props, {}, "contacts")
        # A COMPLETED RUN CLEARS THE 429 WALL: it only got here by calling
        # Google successfully, so the outstanding Retry-After is spent.
        if props.get("retryNotBefore"):
            stamp["retryNotBefore"] = None
        stamp.update({"contactsSyncToken": sync_token,
                      "contactsLastSyncedAt": now,
                      "contactsSyncStatus": status,
                      "contactsSyncState": "ok",
                      "lastSyncedAt": now,
                      # THE WALK IS DONE, so the stored cursor must go — a
                      # completed account that kept one would resume a spent walk
                      # on every tick for ever (T-023).
                      "contactsResume": None})
        # THE DIRECTORY'S OWN CURSOR, beside the address book's. It is a second
        # endpoint with a second sync token, and one stream's token must never be
        # spent on the other's walk. `contactsDirectoryState` is what the console
        # (and the owner) reads to learn that a reconnect is owed.
        if cur is not None:
            stamp["contactsDirectorySyncToken"] = cur.get("dirToken") or ""
            state = str(cur.get("dirState") or "")
            if state:
                stamp["contactsDirectoryState"] = state
            dstatus = str(cur.get("dirStatus") or "")
            if dstatus:
                stamp["contactsDirectoryStatus"] = dstatus[:400]
        # The rollup is SHARED, so a contacts success must not clear a live
        # failure of the other two streams.
        # A STREAM WITH WORK OWED IS NOT "ok" AT THE ACCOUNT LEVEL either. The
        # runner's continuation contract reads the ROLLUP for the word `pending`,
        # and a stream that finished after the calendar walk handed back with six
        # calendars owed overwrote `ok (6 pending)` with `ok` — so the drain was
        # reported done with a third of the mirror unwritten and nothing stamped
        # `syncRequestedAt` again. A live `erroring` and a live `pending` both
        # hold the rollup.
        others = [str(props.get(k) or "") for k in
                  ("gmailSyncStatus", "calendarSyncStatus",
                   "driveSyncStatus")]
        if not any(s.startswith("erroring") or "pending" in s for s in others):
            stamp["syncStatus"] = status
        # The trait's half: this stream's entry, the account-level state raised
        # the same way the sentence above is, the request acknowledged once every
        # enabled stream has answered it, and — on the SCHEDULED path only — when
        # this account's walk began and how long it took. Nothing is owed here:
        # this is the run that drained.
        started, elapsed = _trait_run(cur or {})
        stamp.update(_trait_stamp(
            props, "contacts", "ok", status, now, completed=True,
            progress=_trait_progress("contacts", (cur or {}).get("records"), 0),
            started=started, elapsed_ms=elapsed))
        host.effects.patch((acct.get("kind") or ACCOUNT_TYPE), aid,
                           properties=stamp)


    def _sweep_page(host, resume, accounts):
        """One page of the sweep for a fully re-read account: delete the local
        contacts this full read did NOT write, and only then stamp the run.

        WHAT IT COMPARES AGAINST is the set of row ids the read wrote, carried on
        the cursor — not a `syncGeneration` on each row, which is sync
        bookkeeping on a mirror, and not the label the guide prescribes, which
        `host.effects` cannot write (README, ask 1). Past `SEEN_MAX` the set is
        dropped and the sweep skipped, because deleting on a truncated set would
        retract live rows.

        THE PENDING-SWEEP STATE IS THE CURSOR. The sync token and the success
        stamp ride here, unwritten, until the last page of the sweep commits: an
        account whose sweep never finishes therefore keeps no token and no
        cadence anchor, so the next run re-reads and re-reconciles rather than
        resuming an incremental walk over a half-reconciled mirror. The account
        row is deliberately NOT patched with a "sweeping" marker: while
        `contactsLastSyncedAt` is absent the on-connect trigger's guard is still
        true, and any account update would re-fire this same sync underneath it.
        """
        aid = resume.get("account")
        acct = accounts.get(aid)
        rest = list(resume.get("rest") or [])
        notes = set(resume.get("unknown") or ())

        def _finish():
            if acct is not None:
                _stamp(host, aid, acct, resume.get("token") or "", notes, resume)
            if rest:
                return {"more": host.page.more(_carry_budget(resume, _sync_cursor(rest)))}
            return {"output": {"account": aid, "swept": True,
                               "records": int(resume.get("records") or 0)}}

        if resume.get("seenOverflow"):
            host.log("google-contacts: %s holds more than %d contacts — the "
                     "sweep is skipped (README, ask 1)" % (aid, SEEN_MAX))
            notes.add("address book over %d rows: the sweep was skipped and "
                      "stale rows may survive" % SEEN_MAX)
            if acct is not None:
                _stamp(host, aid, acct, resume.get("token") or "", notes, resume)
            if rest:
                return {"more": host.page.more(_carry_budget(resume, _sync_cursor(rest)))}
            return {"output": {"account": aid, "swept": False}}

        seen = set(resume.get("seen") or ())
        page = host.records.list(CONTACT_TYPE, where={"account": {"eq": aid}},
                                 first=SWEEP_PAGE,
                                 after=resume.get("after") or None)
        for ent in page.get("records") or []:
            rid = str(ent.get("id") or "")
            if rid and rid not in seen:
                # The row is one the listing itself returned, so it is live: no
                # second existence check is needed here, unlike a delete driven
                # by a payload's own alias.
                host.effects.delete(CONTACT_TYPE, rid)
        cursor = page.get("cursor") or ""
        if cursor:
            resume["after"] = cursor
            resume["unknown"] = sorted(notes)
            return {"more": host.page.more(resume)}
        return _finish()


    def _sync_groups(host, base, aid, acct, notes):
        """`contactGroups.list` -> `contactgroup` rows, before the people walks.

        FIRST, because `contact.memberships[].contactGroupMembership.contactGroup`
        points here and a reference's target should exist when the row naming it
        applies.

        THE LISTING IS AUTHORITATIVE AND COMPLETE, and small — an address book has
        a dozen groups, not a directory's worth — so what the response does not
        name is retracted inline rather than left to a sweep. It pages all the
        same: `pageSize` is honoured and a domain could have more than 200.

        One failing call must not cost the account its contacts: a failure is
        LOGGED and named on the status, and the people walks carry on with
        whatever groups are already stored.
        """
        live, page_token = set(), ""
        for _ in range(10):
            params = {"pageSize": PAGE_SIZE}
            if page_token:
                params["pageToken"] = page_token
            try:
                resp = _get(base, acct["token"], GROUPS_PATH, params)
            except Exception as e:
                host.log("google-contacts: %s could not read its contact groups "
                         "(%s) — the people walks carry on" % (aid, _reason(e)))
                notes.add("contact groups unread: %s" % _reason(e))
                return
            for group in resp.get("contactGroups") or []:
                if not isinstance(group, dict):
                    continue
                resource = group.get("resourceName")
                if not isinstance(resource, str) or not resource:
                    continue
                rid = _group_id(host, aid, resource)
                live.add(rid)
                props = {"account": aid, "resourceName": resource}
                for name, kind in (("etag", _STR), ("name", _STR),
                                   ("formattedName", _STR), ("memberCount", _INT)):
                    if name in group:
                        _put_field(props, name, kind, group[name], notes,
                                   "contactGroups[].%s" % name)
                if "groupType" in group:
                    held = _enum("grouptype", group.get("groupType"), notes,
                                 "contactGroups[].groupType")
                    if held is not None:
                        props["groupType"] = held
                meta = group.get("metadata")
                if isinstance(meta, dict):
                    one = {}
                    if "updateTime" in meta:
                        stamp = _instant(meta.get("updateTime"), notes,
                                         "contactGroups[].metadata.updateTime")
                        if stamp:
                            one["updateTime"] = stamp
                    if "deleted" in meta:
                        _put_field(one, "deleted", _BOOL, meta["deleted"], notes,
                                   "contactGroups[].metadata.deleted")
                    props["metadata"] = one or None
                elif "metadata" in group:
                    props["metadata"] = None
                data = group.get("clientData")
                if isinstance(data, list):
                    rows = []
                    for entry in data:
                        if not isinstance(entry, dict):
                            continue
                        one = {}
                        for name in ("key", "value"):
                            if name in entry and isinstance(entry[name], str):
                                one[name] = entry[name]
                        if one:
                            rows.append(one)
                    props["clientData"] = rows or None
                elif "clientData" in group:
                    props["clientData"] = None
                host.effects.put(GROUP_TYPE, rid, properties=props)
            page_token = resp.get("nextPageToken") or ""
            if not page_token:
                break
        if not live:
            return
        after, dropped = "", 0
        for _ in range(20):
            page = host.records.list(GROUP_TYPE, where={"account": {"eq": aid}},
                                     first=SWEEP_PAGE, after=after or None)
            for ent in page.get("records") or []:
                rid = str(ent.get("id") or "")
                if rid and rid not in live:
                    host.effects.delete(GROUP_TYPE, rid)
                    dropped += 1
            after = page.get("cursor") or ""
            if not after:
                break
        host.log("google-contacts: %s has %d contact groups%s"
                 % (aid, len(live), ", %d retracted" % dropped if dropped else ""))


    def _finish_account(host, cur, queue, aid, acct, notes):
        """Both streams are done for this account: sweep if the evidence is
        complete, else stamp and move on.

        THE SWEEP'S EVIDENCE IS THE UNION OF BOTH WALKS, which is exactly why it
        could not run at the end of the connections walk. It may only delete when
        BOTH streams did a FULL read this run: an incremental walk saw a delta,
        not the world. A directory that is `unavailable` (no such directory on
        this account) is complete evidence — there are no rows to protect — but a
        directory that `needsreconsent` is NOT: the account HAS a directory this
        run could not read, so its rows are left alone and the reason is on the
        status.
        """
        rest = queue[1:]
        token = cur.get("connToken") or ""
        full = bool(cur.get("fullConnections")) and bool(cur.get("fullDirectory"))
        if full:
            return {"more": host.page.more(
                {"phase": "sweep", "account": aid,
                 # The sweep is the same account's walk, so the trait's start
                 # instant and the path that drove it ride on with it: the stamp
                 # that ends the walk is made from THIS cursor, several
                 # invocations later.
                 "scheduled": bool(cur.get("scheduled")),
                 "traitStartedAt": cur.get("traitStartedAt") or "",
                 "traitStartTs": cur.get("traitStartTs") or 0,
                 # AND THE CHAIN'S CLOCK. The sweep is the same chain: a cursor
                 # that started the budget again here is how a full read plus its
                 # reconciliation walked past the engine's deadline.
                 "hops": int(cur.get("hops") or 0),
                 "startedAt": cur.get("startedAt") or 0,
                 "drainBudgetMs": cur.get("drainBudgetMs") or 0,
                 "seen": cur.get("seen") or [],
                 "seenOverflow": bool(cur.get("seenOverflow")),
                 "after": "", "rest": rest, "token": token,
                 "records": int(cur.get("records") or 0),
                 "unknown": cur.get("unknown") or [],
                 "dirToken": cur.get("dirToken") or "",
                 "dirState": cur.get("dirState") or "",
                 "dirStatus": cur.get("dirStatus") or "",
                 "dirDropped": cur.get("dirDropped") or []})}
        _stamp(host, aid, acct, token, notes, cur)
        if rest:
            return {"more": host.page.more(_carry_budget(cur, _sync_cursor(rest)))}
        return {"output": {"account": aid,
                           "records": int(cur.get("records") or 0),
                           "directory": cur.get("dirState") or "ok"}}


    def _walk_directory(host, base, cur, queue, aid, acct):
        """One page of `people:listDirectoryPeople`, into the SAME contact kind.

        A directory `Person` is a contact, not a new kind: same resource, same
        `people/<id>` namespace, same fields, so the same `_stage_person` writes
        it and a person who is both a saved contact and a colleague composes ONE
        row id and is ONE record — the second write is an update, and
        `metadata.sources[].type` on the record says which sources it came from.
        """
        notes = set(cur.get("unknown") or ())
        fields = cur.get("dirFields") or DIRECTORY_FIELDS
        sync_token = cur.get("dirSyncToken") or ""
        page_token = cur.get("dirPageToken") or ""
        full = not sync_token

        def _skip(state, reason):
            # NOT an error: the contacts stream completed its address book, and
            # this is a consent or a domain fact, not an outage. It is recorded on
            # the account so the owner can act on it, and the sweep is told what
            # the evidence is worth.
            cur.update({"dirState": state, "dirStatus": str(reason)[:REASON_MAX],
                        "dirToken": "", "fullDirectory": state == "unavailable"})
            host.log("google-contacts: %s directory %s: %s"
                     % (aid, state, str(reason)[:REASON_MAX]))
            return _finish_account(host, cur, queue, aid, acct, notes)

        try:
            resp = _get(base, acct["token"], DIRECTORY_PATH,
                        _dir_params(sync_token, page_token, fields))
        except urllib.error.HTTPError as e:
            # ONE read, THREE questions. `HTTPError.read()` empties the stream, so
            # a second classifier asking the same object sees nothing — which is
            # how a directory sync-token expiry would have silently become a hard
            # failure.
            code = getattr(e, "code", None)
            body = _error_body(e)
            verdict = _directory_verdict(code, body)
            if verdict:
                return _skip(verdict, _reason_of(body, e))
            if sync_token and _expired_sync_token(e, body):
                host.log("google-contacts: directory sync token expired for %s, "
                         "full re-read" % aid)
                sync_token, page_token, full = "", "", True
                cur.update({"dirSyncToken": "", "dirPageToken": ""})
                resp = _get(base, acct["token"], DIRECTORY_PATH,
                            _dir_params("", "", fields))
            else:
                # A read mask Google narrowed costs the FIELD, not the stream.
                narrowed, dropped = (None, [])
                if code == 400:
                    narrowed, dropped = _mask_refusal(body, fields)
                if not narrowed:
                    raise
                host.log("google-contacts: directory readMask refused %s — "
                         "dropping and retrying" % ", ".join(dropped))
                fields = narrowed
                cur["dirFields"] = fields
                cur["dirDropped"] = sorted(set(cur.get("dirDropped") or []) | set(dropped))
                resp = _get(base, acct["token"], DIRECTORY_PATH,
                            _dir_params(sync_token, page_token, fields))

        people = resp.get("people") or []
        state = {"seen": set(cur.get("seen") or ()),
                 "live": set(cur.get("seen") or ()),
                 "retract": {},
                 "notes": set(cur.get("unknown") or ())}
        for person in people:
            if not isinstance(person, dict):
                continue
            resource = person.get("resourceName")
            meta = person.get("metadata") or {}
            if isinstance(resource, str) and resource \
                    and not (isinstance(meta, dict) and meta.get("deleted") is True):
                state["live"].add(_contact_id(host, aid, resource))
        written = 0
        for person in people:
            if isinstance(person, dict):
                written += _stage_person(host, aid, person, state)
        _retractions(host, aid, state)
        cur["records"] = int(cur.get("records") or 0) + written
        cur["unknown"] = sorted(state["notes"])[:UNKNOWN_MAX * 4]
        if len(state["seen"]) <= SEEN_MAX:
            cur["seen"] = sorted(state["seen"])
        else:
            cur["seen"], cur["seenOverflow"] = [], True

        next_page = resp.get("nextPageToken") or ""
        if next_page:
            cur.update({"dirPageToken": next_page})
            if _over_budget(cur):
                return _hand_back(host, aid, acct, cur, state["notes"])
            return {"more": host.page.more(cur)}

        # The same contract the connections walk holds itself to: the last page of
        # a walk must say where the walk ended, or the next delta resumes from a
        # point this one never reached.
        token = resp.get("nextSyncToken") or ""
        if not token:
            raise RuntimeError(
                "people finished the directory walk without a nextSyncToken — "
                "the delta boundary is unknown, so neither the token nor the "
                "success stamp is written")
        cur.update({"dirToken": token, "fullDirectory": bool(full),
                    "dirState": "ok", "dirStatus": ""})
        return _finish_account(host, cur, queue, aid, acct, state["notes"])


    def main(input, host):
        cfg = input.get("config") or {}
        accounts = {a.get("id"): a for a in (cfg.get("accounts") or [])}
        # The paged-checkpoint wrapper: host.page.resume() is the opaque
        # cursor the previous page returned, host.page.more(cursor) builds the
        # continuation that drains the next page off the causal chain.
        resume = host.page.resume() or None

        if resume:
            _hop(dict(resume))  # counted below, on the cursor that is kept

        if resume and resume.get("phase") == "sweep":
            cur = _drain_budget(cfg, _hop(dict(resume)))
            return _sweep_page(host, cur, accounts)

        if resume:
            cur = _hop(dict(resume))
        else:
            record = (input.get("envelope") or {}).get("record") or {}
            if (record.get("kind") or "") == ACCOUNT_TYPE:
                # Record-triggered: sync just this account (a connect or edit).
                queue = [record.get("id")]
                scheduled = False
            else:
                # Schedule-triggered: every connected account that wants
                # contacts and is due by its cadence.
                queue = [aid for aid, a in accounts.items()
                         if _wants(a) and _due(a.get("properties") or {})]
                scheduled = True
            cur = _sync_cursor(queue)
            # WHICH PATH DROVE THIS RUN, on the cursor, because it decides who
            # writes `lastSyncStartedAt` and `lastSyncDurationMs`: around a
            # record-sourced delivery the dispatcher stamps both, and on a
            # schedule it names no record and stamps nothing, so the body is the
            # only hand there is (decision 0085).
            cur["scheduled"] = scheduled
        # How long this fire may keep continuing before it hands back (the engine
        # parks a chain that outruns its cumulative deadline).
        _drain_budget(cfg, cur)

        # Advance past accounts we cannot or should not sync (no token, a dead
        # grant, contacts disabled, or gone from the config).
        queue = list(cur.get("queue") or [])
        while queue:
            acct = accounts.get(queue[0])
            if acct is not None and acct.get("tokenError"):
                host.log("google-contacts: skip %s: %s" % (queue[0], acct["tokenError"]))
                _erroring(host, acct, acct["tokenError"])
            if acct is None or not _wants(acct) or acct.get("tokenError") \
                    or not acct.get("token"):
                queue = queue[1:]
                cur = _carry_trait(cur, _sync_cursor(queue))
                continue
            break
        if not queue:
            return {}

        aid = queue[0]
        acct = accounts[aid]
        props = acct.get("properties") or {}
        # THE TOKEN IS LOADED WHEN AN ACCOUNT BEGINS, not when the drain does:
        # `_sync_cursor` leaves `account` empty, so the first invocation to reach
        # a given account reads THAT account's stored token. A scheduled queue of
        # five accounts now runs five incremental walks, not one incremental and
        # four full reads with four sweeps.
        if cur.get("account") != aid:
            # AN UNSPENT REQUEST STARTS OVER. A "sync now" whose delta says
            # "nothing changed" is useless exactly when it is asked for — after a
            # purge, the cursor is intact and every row it accounts for is gone,
            # which is what left a re-seeded account with zero contacts. The
            # request drops the token, so this run is a full read plus the sweep
            # that follows one.
            held = props.get("contactsResume") or {}
            if isinstance(held, str):
                try:
                    held = _json.loads(held)
                except ValueError:
                    held = {}
            if isinstance(held, dict) and held.get("stream"):
                # AN INTERRUPTED WALK RESUMES WHERE IT STOPPED (T-023), under its
                # own tokens and its own evidence — not from the top, which would
                # re-read an address book and a directory this chain already paid
                # for, and not with an empty seen set, whose sweep would delete
                # every row the earlier run wrote.
                cur = _carry_budget(cur, _sync_cursor(queue))
                cur.update({k: v for k, v in held.items() if k != "seen"})
                cur["account"] = aid
                cur["seen"] = [str(x) for x in (held.get("seen") or []) if x]
                cur["queue"] = queue
                host.log("google-contacts: %s resumes its %s walk from the stored "
                         "cursor" % (aid, cur.get("stream")))
                return _run_account(host, cfg, cur, queue, aid, acct, props)
            unspent = _requested(props)
            token = "" if unspent else props.get("contactsSyncToken")
            # The directory has its OWN token and its own "start over": a "sync
            # now" drops both, because the reason to ask for one is that the rows
            # a delta accounts for are gone.
            dir_token = "" if unspent else props.get("contactsDirectorySyncToken")
            cur = _carry_budget(cur, _account_cursor(queue, aid, token, dir_token))
            # THE GROUPS, before the first person that references one (T-023).
            # Only here — when the account begins — so a resumed page never
            # re-reads a listing it already reconciled.
            try:
                _sync_groups(host, _api_base(cfg), aid, acct,
                             set(cur.get("unknown") or ()))
            except Exception as e:
                host.log("google-contacts: contact groups failed for %s: %s"
                         % (aid, e))
        cur["queue"] = queue

        return _run_account(host, cfg, cur, queue, aid, acct, props)


    def _run_account(host, cfg, cur, queue, aid, acct, props):
        """One invocation's worth of work for ONE account, whichever stream it is
        mid-walk on. Lifted out of `main` (T-023) so a resumed cursor and a fresh
        one reach the same code by the same door."""
        # THE CHAIN'S CLOCK STARTS ON THE FIRST INVOCATION THAT WALKS, not on the
        # first RESUMED one: `_hop` only ever ran on a resume, so a chain whose
        # every page was single measured nothing at all.
        _chain_begin(cur)
        # WHEN THIS ACCOUNT'S WALK BEGAN, once per account in the chain and by
        # the same door every resumed cursor comes through, so a run that spans
        # six invocations reports the duration of the whole walk rather than of
        # its last page.
        _trait_begin(cur)
        # AND IT IS CHECKED AT THE TOP OF EVERY CONTINUATION, not only where a
        # page boundary happens to fall. An incremental delta answers every walk
        # in ONE page, so the boundary checks below are never reached — and the
        # engine's cumulative deadline does not care how many boundaries a chain
        # met. The cursor here is exactly the one the last invocation persisted,
        # so handing back costs nothing and loses nothing.
        if cur.get("account") == aid and _over_budget(cur):
            return _hand_back(host, aid, acct, cur, set(cur.get("unknown") or ()))
        # The account's own address, for the hub row and the `address` relation.
        # It is derived HERE and not passed in, because this function is reached
        # from two places and a caller that forgot it would be a silent hole.
        owner = _mailbox(props.get("email"))
        try:
            base = _api_base(cfg)
            if (cur.get("stream") or "connections") == "directory":
                return _walk_directory(host, base, cur, queue, aid, acct)
            sync_token = cur.get("syncToken") or ""
            page_token = cur.get("pageToken") or ""
            generation = cur.get("generation") or ""
            # A full read (no sync token this run) stamps a fresh generation
            # on every row and, when drained, hands off to the mark-and-sweep.
            full = not sync_token
            if full and not generation:
                generation = uuid.uuid4().hex
            try:
                resp = _get(base, acct["token"], CONNECTIONS_PATH,
                            _params(sync_token, page_token))
            except urllib.error.HTTPError as e:
                if not (sync_token and _expired_sync_token(e)):
                    raise
                host.log("google-contacts: sync token expired for %s, full "
                         "re-read" % aid)
                # EVERY piece of the walk's state resets TOGETHER. Version 18
                # reset the token and the page token and kept the seen set, the
                # overflow flag and the record count from the expired delta, so
                # ids the delta happened to touch contaminated the full read's
                # sweep evidence and made the count a sum of two different walks.
                sync_token, page_token, full = "", "", True
                generation = uuid.uuid4().hex
                cur.update({"pageToken": "", "syncToken": "", "records": 0,
                            "seen": [], "seenOverflow": False, "unknown": []})
                resp = _get(base, acct["token"], CONNECTIONS_PATH,
                            _params("", ""))

            connections = resp.get("connections") or []
            # `live` is every id this DRAIN has written as a live contact, not
            # just this page's: an alias reconciliation must not retract a row a
            # previous page wrote, whichever order the two arrived in.
            state = {"seen": set(cur.get("seen") or ()),
                     "live": set(cur.get("seen") or ()),
                     "retract": {},
                     "notes": set(cur.get("unknown") or ())}
            for person in connections:
                if not isinstance(person, dict):
                    continue
                resource = person.get("resourceName")
                meta = person.get("metadata") or {}
                if isinstance(resource, str) and resource \
                        and not (isinstance(meta, dict) and meta.get("deleted") is True):
                    state["live"].add(_contact_id(host, aid, resource))
            written = 0
            for person in connections:
                if isinstance(person, dict):
                    written += _stage_person(host, aid, person, state)
            # The renames and the tombstones LAST, resolved against live rows in
            # one read per 200: `live` is now complete for this page, so an alias
            # that is also a live contact — a rename undone, two persons naming
            # one old name — is never retracted by the other's arrival, whichever
            # order the page put them in.
            _retractions(host, aid, state)
            cur["records"] = int(cur.get("records") or 0) + written
            cur["unknown"] = sorted(state["notes"])[:UNKNOWN_MAX * 4]
            # The ids this read wrote, back onto the cursor: the sweep mark the
            # engine cannot yet hold as a label (README, ask 1).
            if len(state["seen"]) <= SEEN_MAX:
                cur["seen"] = sorted(state["seen"])
            else:
                cur["seen"], cur["seenOverflow"] = [], True
            # The account's own address is a hub ROW and a relation on the
            # account, so the connection's identity is a reference like every
            # other one. Nothing on a mirror is computed against it. The account
            # is patched only when the reference would actually CHANGE: while
            # `contactsLastSyncedAt` is still absent, any account update re-fires
            # the on-connect trigger underneath this drain.
            if owner:
                oref = _address_id(host, aid, owner)
                host.effects.put(ADDRESS_TYPE, oref,
                                 properties={"account": aid, "address": owner})
                held = props.get("address")
                held = held.get("ref") if isinstance(held, dict) else held
                if str(held or "").rsplit("/", 1)[-1] != oref.rsplit("/", 1)[-1]:
                    host.effects.patch((acct.get("kind") or ACCOUNT_TYPE), aid,
                                       properties={"address": {"ref": oref}})

            next_page = resp.get("nextPageToken") or ""
            if next_page:
                # More pages for this account: keep it at the head of the
                # queue and drain off the causal chain. The sync token is only
                # committed on the FINAL page.
                cur.update({"phase": "sync", "pageToken": next_page,
                            "syncToken": sync_token, "generation": generation,
                            "seen": cur.get("seen") or [],
                            "seenOverflow": bool(cur.get("seenOverflow"))})
                if _over_budget(cur):
                    return _hand_back(host, aid, acct, cur, state["notes"])
                return {"more": host.page.more(cur)}

            # THE FINAL PAGE MUST CARRY A TOKEN. `requestSyncToken=true` asks for
            # one on the last page of every walk, and a walk that ends without
            # one has not told us where it ended: version 18 accepted that,
            # stamped success and kept the OLD token, which either re-reads the
            # world forever or, worse, resumes a delta from a point this walk
            # never reached. It is an error, so nothing is stamped and the
            # cadence retries.
            token = resp.get("nextSyncToken") or ""
            if not token:
                raise RuntimeError(
                    "people finished the walk without a nextSyncToken — the "
                    "delta boundary is unknown, so neither the token nor the "
                    "success stamp is written")

            # THE ADDRESS BOOK IS HALF THE ACCOUNT. Nothing is stamped and
            # nothing is swept yet: the Workspace DIRECTORY is the same `contact`
            # kind from a second endpoint, and a sweep that ran on the
            # connections evidence alone would delete every directory row it had
            # not seen. The walk hands over, carrying the seen set, the record
            # count and the connections outcome; one account gets one stamp,
            # after both streams.
            cur.update({"stream": "directory", "pageToken": "",
                        "connToken": token, "fullConnections": bool(full),
                        "generation": generation})
            if _over_budget(cur):
                return _hand_back(host, aid, acct, cur, state["notes"])
            return {"more": host.page.more(cur)}
        except Exception as e:
            host.log("google-contacts: %s/%s failed for %s: %s"
                     % (cur.get("phase"), cur.get("stream") or "connections", aid, e))
            _erroring(host, acct, _reason(e), _retry_after(e))
            rest = queue[1:]
            if rest:
                return {"more": host.page.more(_carry_budget(cur, _sync_cursor(rest)))}
            return {}
