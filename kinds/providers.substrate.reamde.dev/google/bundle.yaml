# ---- the contacts mirror: one People `ContactGroup` -------------------------
# People API v1 `ContactGroup`, from `contactGroups.list`. It is a kind by
# `docs/kind-design.md` §3's two-part test twice over: it HAS its own endpoint
# and it appears in a second kind's payload (`contact.memberships[]`). Until
# T-023 it was neither — the two strings on the membership carried the
# identity and the kind's own fields were unreachable, because no recording
# answered the list call and a 404 from the mock errors the stream. The
# recordings exist now, so the strings have their referent.
#
# Omitted, as classes: the list envelope (`totalItems`, `nextPageToken`,
# `nextSyncToken` — the walk's own state, which lives on the account). There
# is no hypermedia and no instant of the group's own, so no temporal trait;
# `metadata.updateTime` is an update stamp and rides inside `metadata`, which
# is where the API puts it.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/google/contactgroup
data:
  authority: providers.substrate.reamde.dev
  package: google
  description: >-
    One People v1 ContactGroup, from contactGroups.list: the label a contact
    is filed under, system (myContacts, starred, …) or the owner's own. Its
    resourceName is what contact.memberships[] points at. Omits the list envelope;
    no hypermedia, no instant, no trait.
  purpose: supporting
  names:
    singular: contactgroup
  displayTemplate: "{formattedName|name}"
  properties:
    # --- identity -----------------------------------------------------------
    account:
      type: reference
      kind: providers.substrate.reamde.dev/google/account
      required: true
      onDelete: cascade
      displayName: Account
      description: "the account this group was synced from — the one property
        here that is not the API's; always written"
    # A ContactGroup has NO separate `id` field: `resourceName` IS the
    # identity, `contactGroups/{id}`, and it is what a membership names.
    resourceName:
      type: string
      required: true
      displayName: Resource name
      description: "`resourceName` — `contactGroups/{id}`, the group's identity
        and the value contact.memberships[] carries. Unique per ADDRESS BOOK,
        so the account is part of this row's composed id."
    etag:
      type: string
      displayName: ETag
      description: "`etag` — the resource's own version tag. Absent on a system
        group in the owner's corpus."
    # --- the object's own scalars, in the reference's order ------------------
    groupType:
      type: enum
      values:
        - value: grouptypeunspecified
          label: GROUP_TYPE_UNSPECIFIED
        - value: usercontactgroup
          label: USER_CONTACT_GROUP
        - value: systemcontactgroup
          label: SYSTEM_CONTACT_GROUP
      displayName: Group type
      description: "`groupType` — Output only. Whether Google owns the group
        (SYSTEM_CONTACT_GROUP) or the user made it (USER_CONTACT_GROUP). Spelled
        lowercase with `_` dropped."
    name:
      type: string
      displayName: Name
      description: "`name` — the group's name. For a SYSTEM group this is
        Google's own key (`myContacts`, `starred`, `chatBuddies`), not a label
        a human typed."
    formattedName:
      type: string
      displayName: Formatted name
      description: "`formattedName` — Output only. The name as Google renders
        it for the viewer's locale; a system group's is translated, a user
        group's is its `name`."
    memberCount:
      type: int
      displayName: Members
      description: "`memberCount` — Output only. How many contacts are in
        the group. Absent for a group Google reports no count for; zero is
        written as zero."
    # --- relations ----------------------------------------------------------
    # `memberResourceNames` is People resource names — ids this bundle DOES
    # mirror — so it is a reference and never a string list (§2). It is filled
    # ONLY by `contactGroups.get?maxMembers=…`, which this bundle does not
    # call, so it is absent on every row this sync writes; the day the call is
    # added the property is already the right shape. No `mustExist`: a member
    # the contacts walk has not reached yet is a target that lands later.
    memberResourceNames:
      type: reference
      kind: providers.substrate.reamde.dev/google/contact
      repeated: true
      displayName: Members
      description: "`memberResourceNames` — the contacts in this group, as
        rows. Only contactGroups.get(maxMembers) returns it and this bundle
        calls only list, so it is absent here."
    # --- the API's nested objects -------------------------------------------
    metadata:
      type: object
      displayName: Metadata
      description: "`metadata` (ContactGroupMetadata) — Output only. When
        the group last changed and whether it is deleted."
      fields:
        updateTime:
          type: datetime
          description: "`updateTime` — Output only. When the group last changed.
            An instant of the RESOURCE, not of this row."
        deleted:
          type: bool
          description: "`deleted` — Output only. True when the group is deleted;
            false is written as false, absent stays absent."
    clientData:
      type: object
      repeated: true
      displayName: Client data
      description: "`clientData` — the arbitrary key/value pairs a client
        may attach to the group. Empty writes empty; an absent key leaves
        it untouched."
      fields:
        key:
          type: string
          description: "`key` — the client-defined key."
        value:
          type: string
          description: "`value` — the client-defined value."
---
# ---- the gmail mirror: one `Label` -----------------------------------------
# Gmail API v1 `Label`, from `users.labels.list`. A kind by
# `docs/kind-design.md` §3's two-part test, both halves: `users.labels` is its
# own endpoint, and a label id appears in `gmailmessage`'s payload. Until
# T-023 `gmailmessage.labelIds` was a `string[]` whose description said the
# names "live only in users.labels.list, unmirrored" — which is the guide's
# "id we do not mirror -> string" escape, and it stops applying the moment the
# call is recorded. It is a reference now.
#
# THE LIST CALL IS NOT THE WHOLE RESOURCE. `users.labels.list` returns each
# label's identity, visibility and colour; the four COUNTS
# (`messagesTotal`, `messagesUnread`, `threadsTotal`, `threadsUnread`) come
# only from `users.labels.get`, which this bundle does not call. They are
# declared — the kind is the object — and left absent rather than written
# zero, because "no count was read" and "zero messages" are different facts.
#
# Omitted, as classes: the list envelope (`labels` itself). No hypermedia, no
# instant, no trait.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/google/gmaillabel
data:
  authority: providers.substrate.reamde.dev
  package: google
  description: >-
    One Gmail v1 Label, from users.labels.list: a system label (INBOX, SENT,
    CATEGORY_*) or one this mailbox made. gmailmessage.labels points here.
    The four counts come only from users.labels.get, which this bundle does
    not call, so they are absent. Omits the envelope; no instant, no trait.
  purpose: supporting
  names:
    singular: gmaillabel
  displayTemplate: "{name}"
  properties:
    # --- identity -----------------------------------------------------------
    account:
      type: reference
      kind: providers.substrate.reamde.dev/google/account
      required: true
      onDelete: cascade
      displayName: Account
      description: "the account this label was synced from — the one property
        here that is not the API's; always written"
    labelId:
      type: string
      required: true
      displayName: Label ID
      description: "`Label.id` — unique per mailbox, the provider key behind
        this row's id. A system label's id is its constant name (INBOX, SENT);
        a user label's is opaque (`Label_23`)."
    # --- the object's own scalars, in the Label reference's order -----------
    name:
      type: string
      displayName: Name
      description: "`name` — the display name. A system label's is its constant;
        a user label's is what the owner typed, nested with `/` for a sub-label."
    messageListVisibility:
      type: enum
      values:
        - value: show
          label: show
        - value: hide
          label: hide
      displayName: Message list visibility
      description: "`messageListVisibility` — whether messages with this label
        show in the message list. Absent on the labels Gmail does not report
        it for."
    labelListVisibility:
      type: enum
      values:
        - value: labelshow
          label: labelShow
        - value: labelshowifunread
          label: labelShowIfUnread
        - value: labelhide
          label: labelHide
      displayName: Label list visibility
      description: "`labelListVisibility` — whether the label shows in the
        label list. Spelled lowercase with the API's exact value as the label."
    type:
      type: enum
      values:
        - value: system
          label: system
        - value: user
          label: user
      displayName: Type
      description: "`type` — Output only. `system` is Gmail's own and cannot
        be renamed or deleted; `user` is the mailbox's."
    # --- the counts, from users.labels.get only ------------------------------
    messagesTotal:
      type: int
      displayName: Messages
      description: "`messagesTotal` — Output only. Only users.labels.get returns
        it; this bundle calls list, so it is ABSENT rather than zero."
    messagesUnread:
      type: int
      displayName: Messages unread
      description: "`messagesUnread` — Output only. From users.labels.get
        only; absent here, never written zero."
    threadsTotal:
      type: int
      displayName: Threads
      description: "`threadsTotal` — Output only. From users.labels.get only;
        absent here, never written zero."
    threadsUnread:
      type: int
      displayName: Threads unread
      description: "`threadsUnread` — Output only. From users.labels.get only;
        absent here, never written zero."
    # --- the API's nested object --------------------------------------------
    color:
      type: object
      displayName: Colour
      description: "`color` — the label's colour, on a user label the owner
        gave one. Absent on every system label."
      fields:
        textColor:
          type: string
          description: "`textColor` — the text colour as `#rrggbb`. A string:
            the dialect has no colour type, and Gmail's palette is not a set
            it documents as closed."
        backgroundColor:
          type: string
          description: "`backgroundColor` — the background colour as `#rrggbb`,
            from the same palette."
---
# ---- the gmail mirror: one thread ------------------------------------------
# GMAIL'S `Thread` RESOURCE, AND NOTHING ELSE. The resource (Gmail API v1,
# `users.threads`) has four fields — `id`, `snippet`, `historyId`,
# `messages` — and all four are here, read off `users.threads.get`
# (`format=minimal`, 10 quota units) and off nothing else.
#
# Version 18 never called `threads.get` at all: it copied the snippet and the
# history id of whichever message of the thread the hydrate had just read,
# and unioned a window's message ids into `messages` without ever pruning
# them. Both are DERIVED — a function of other records — which the manifest
# then denied. The call is made now.
#
# WHEN THE CALL CANNOT BE ANSWERED — a scope that may not read threads, a
# mailbox mid-delete, a recording set with no `threads.get` in it — the row
# is written THIN: `account` and `threadId`, and not one field more. A thin
# thread claims nothing. It never claims a stale membership, and the three
# fields below stay absent rather than being filled from a message. After
# three consecutive failures the sync gives the call up for the run and says
# so in the log; a later run rewrites the rows whole.
#
# Version 17's `subject`, `participants`, `participantEmails` and newest-wins
# `at` are still gone, and for the same reason: a thread's subject is the
# subject of its newest message, one `referencing` read away. `temporal` goes
# with them — a Thread carries no instant of its own, which is also why no
# sweep may filter these rows by a window.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/google/gmailthread
data:
  authority: providers.substrate.reamde.dev
  package: google
  description: >-
    One Gmail Thread, Gmail API v1, read from users.threads.get (format=minimal)
    — all four of the resource's fields, none of them derived from a message.
    Omits the response envelope; there is no hypermedia and no instant, so
    no temporal trait. A thread this sync could not read is written thin:
    its account and its threadId alone.
  names:
    singular: gmailthread
  displayTemplate: "{threadId}"
  properties:
    # --- identity -----------------------------------------------------------
    account:
      type: reference
      kind: providers.substrate.reamde.dev/google/account
      required: true
      onDelete: cascade
      displayName: Account
      description: "the account this thread was synced from — the one property
        here that is not the API's; always written"
    # Gmail's `Thread.id`. Spelled `threadId` and not `id`, because a record's
    # own id is the substrate's: `<kind>/<id>` is the address, and the
    # provider key rides as a property beside it.
    threadId:
      type: string
      required: true
      displayName: Thread ID
      description: "`Thread.id` — unique per mailbox, the provider key behind
        this row's id. Always written, thin row included."
    # --- the object's own scalars -------------------------------------------
    snippet:
      type: string
      displayName: Snippet
      description: "`Thread.snippet` — the preview Gmail renders for the THREAD,
        from users.threads.get. Absent while the row is thin; null when the
        response carried none."
    historyId:
      type: string
      displayName: History ID
      description: "`Thread.historyId` — a number Gmail sends as a string
        and does no arithmetic on, so a string here. From users.threads.get;
        absent while the row is thin."
    # --- relations ----------------------------------------------------------
    # The Thread resource's own fourth field. Gmail returns whole Messages
    # here; a Message is a kind, so the sync upserts each row — thin, from
    # the embedded object, for a member this window never hydrated — and this
    # names them. Written only from `threads.get`, so it is the API's array or
    # it is absent; it is never a union of what a window happened to see.
    messages:
      type: reference
      kind: providers.substrate.reamde.dev/google/gmailmessage
      repeated: true
      displayName: Messages
      description: "`Thread.messages` — the resource's own membership, in
        its order, as the message rows it was upserted into. Absent while
        the row is thin; never a partial union."
---
# ---- the gmail mirror: one message -----------------------------------------
# Gmail's `Message` resource (Gmail API v1, `users.messages.get`,
# `format=FULL`). Its ten fields land as follows:
#
#   `id`           -> `messageId` (a record's own id is the substrate's)
#   `threadId`     -> `thread`, a reference; no scalar beside it
#   `labelIds`     -> `labels`, a repeated reference at `gmaillabel`; no
#                     scalar beside it, exactly like `threadId` -> `thread`.
#   `snippet`      -> `snippet`
#   `historyId`    -> `historyId` (a number sent as a string)
#   `internalDate` -> `at`, THE TRAIT'S SLOT, and not redeclared beside it:
#                     epoch milliseconds as a string is an instant, and the
#                     mirror's job is to type it — milliseconds INCLUDED,
#                     which version 18 truncated away.
#   `sizeEstimate` -> `sizeEstimate`
#   `raw`          -> OMITTED as a class, and this is the one omission on this
#                     kind that is not an envelope: `raw` is the whole RFC 822
#                     message base64'd, the same bytes every other field on
#                     this row was decoded from, and `format=full` does not
#                     return it. A reader that wants the wire bytes calls
#                     `users.messages.get?format=raw`.
#   `payload`      -> STORED WHOLE, and decoded beside itself. The recursive
#                     MIME tree is `payload: json`, base64url `data` INCLUDED
#                     — version 18 deleted every `data` key in the tree, which
#                     is the principal content of a MIME message. Beside it,
#                     the lossless mechanical decodes §1 admits: `headers[]`
#                     verbatim, the address headers as occurrence objects
#                     pointing at the `emailaddress` hub, `subject`, `date`,
#                     `rfcMessageId`, `inReplyTo`, `references[]`, `mimeType`,
#                     and each part with a filename a `gmailattachment` row.
#   `classificationLabelValues` -> declared, and copied when the response
#                     carries it. It is filled by Workspace's labels surface
#                     rather than by the message, so — alone among the fields
#                     here — its absence is NOT written as a deletion.
#
# THE ONE DERIVED PROPERTY, and it is labelled as one: `body`. §7 names it
# ("`body: text`") as the decode that rides beside the tree, and `embed: true`
# needs one prose column to index. It is a READING INDEX and its description
# says so: charset-correct, MIME-ordered, alternative-selecting, truncated —
# and never the source, which is the exact bytes on `payload`. Version 18's
# `bodyHtml` is GONE: it concatenated html parts, decoded them all as UTF-8,
# truncated the result and called itself "as the sender wrote it". The bytes
# it claimed to be are now on `payload`, exactly.
#
# SETTLED (T-023), and the reason the deferral ended is the recording. Codex
# §2.1 asked for a Gmail `label` kind with references; the answer was that a
# `label` row hydrated from a message payload would be an id with no fields —
# an identity duplicated, not a relation gained — and that
# `users.labels.list` was not in the recorded set. It is now, so the labels
# walk mints WHOLE rows (name, type, visibility, colour) before any message
# names one, and `labelIds` is the reference `labels`.
#
# Version 17's `fromOwner`, `directedAtOwner` and `mentionsOwner` are GONE.
# They are owner-relative facts computed from `account.email`, which a mirror
# never carries: "mail I sent" is `from eq emailaddress/<the owner's row>`,
# "addressed to me" is `to contains` it, and a judgement is a consumer
# function's. Gmail's own self-fact — the `SENT` label — stays, as a `labels`
# reference like every other one.
#
# ABSENT vs NULL. `format=FULL` is an AUTHORITATIVE COMPLETE snapshot of one
# Message, so a field it omits is a field the message does not have and the
# property is written null (which deletes). Everything decoded from `payload`
# follows the payload: a response with no `payload` writes NOTHING derived
# from one, so a thinner read can never erase a fuller row.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/google/gmailmessage
data:
  authority: providers.substrate.reamde.dev
  package: google
  description: >-
    One Gmail Message, Gmail API v1, from users.messages.get?format=FULL.
    `internalDate` IS the temporal trait's `at`. The MIME tree is STORED whole
    on `payload`, encoded bytes included, with its lossless header and address
    decodes beside it. Omits the response envelope and the separate base64
    `raw` representation, which FULL does not return.
  purpose: supporting
  names:
    singular: gmailmessage
  traits:
    - substrate.reamde.dev/core/temporal(point)
  displayTemplate: "{subject}"
  properties:
    # --- identity -----------------------------------------------------------
    account:
      type: reference
      kind: providers.substrate.reamde.dev/google/account
      required: true
      onDelete: cascade
      displayName: Account
      description: "the account this message was synced from — the one property
        here that is not the API's; always written"
    messageId:
      type: string
      required: true
      displayName: Message ID
      description: "`Message.id` — unique per mailbox, the provider key behind
        this row's id. Always written."
    # --- the object's own scalars, in the Message reference's order ---------
    # `labelIds` IS THIS REFERENCE (T-023). It was a `string[]` because the
    # names "live only in users.labels.list, unmirrored" — the guide's "an id
    # we do not mirror is a string" escape, which stops applying the moment
    # the call is recorded. Every id in the array, system and user alike, is
    # a `gmaillabel` row now, so the id list is the reference and there is no
    # scalar beside it (§3: a reference is never doubled by a scalar). The
    # labels walk runs FIRST in this stream, so the targets exist before the
    # messages naming them; no `mustExist` all the same, because a label the
    # walk did not see is real data rather than a failed page.
    labels:
      type: reference
      kind: providers.substrate.reamde.dev/google/gmaillabel
      repeated: true
      displayName: Labels
      description: "`labelIds` — every label on this message, as rows: the
        system ones (INBOX, UNREAD, SENT, DRAFT, SPAM, TRASH, CATEGORY_*)
        and this mailbox's own. Absent means none."
    snippet:
      type: string
      displayName: Snippet
      description: "`snippet` — the short preview Gmail renders for this message,
        kept exactly as written. Null when the response carried none."
    historyId:
      type: string
      displayName: History ID
      description: "`historyId` as of this fetch — a number Gmail sends as
        a string and does no arithmetic on, so a string here. Also the fence
        a sweep uses to leave a competing run's newer row alone."
    sizeEstimate:
      type: int
      displayName: Size
      description: "`sizeEstimate` — Gmail's estimated size of the whole message
        in bytes. Null when the response carried none."
    # THE TREE ITSELF, kept exactly. `payload` is a MessagePart whose `parts`
    # are MessageParts: recursive, which is the one shape §1 admits as `json`.
    # It stays BESIDE its decodes rather than instead of them — the decodes
    # are what is typed and queryable, and this is what makes them auditable
    # and a header nobody declared a property for still reachable.
    #
    # HYDRATION IS BOUND BY BYTES, not by deleting content. Every part's
    # base64url `data` is carried verbatim while the message's running total
    # fits the budget; the parts with NO `attachmentId` are packed first,
    # because their bytes exist nowhere else, so what a bound ever drops is
    # the fetchable thing. A part past the budget keeps its `size` and its
    # `attachmentId` and loses only `data`, and the sync logs it.
    payload:
      type: json
      displayName: Payload
      description: "`payload` — the MIME tree exactly as Gmail returned it,
        base64url `data` included; recursive, so the one shape kept as json.
        Past ~1 MB the overflowing parts keep size and attachmentId."
    classificationLabelValues:
      type: object
      repeated: true
      displayName: Classification labels
      description: "`classificationLabelValues` — the Workspace label values
        applied to this message. Filled by the labels surface, not by the
        message, so absence is NOT written as a deletion here."
      fields:
        labelId:
          type: string
          description: "`labelId` — the Drive/Workspace label this value belongs
            to. An id, not a name: the label definitions are not mirrored
            by this bundle."
        fields:
          type: object
          repeated: true
          description: "`fields` — the label's field values on this message,
            in the order the response listed them"
          fields:
            fieldId:
              type: string
              description: "`fieldId` — the label field this value is for"
            selection:
              type: string
              repeated: true
              description: "`selection` — the chosen option ids; a single
                selection is stored as a one-entry list"
    # --- the payload's lossless decodes, beside the tree above --------------
    mimeType:
      type: string
      displayName: MIME type
      description: "`payload.mimeType` — the TOP part's media type (multipart/alternative,
        text/plain, …). Null when the payload carried none."
    # The headers VERBATIM, beside the typed decodes below: the decode drops
    # the spelling, the order and every header nobody typed a property for, so
    # the encoded source stays. EVERY occurrence of every name, including the
    # second and third `To:` a relay folded a long list into.
    headers:
      type: object
      repeated: true
      displayName: Headers
      description: "`payload.headers` verbatim — every RFC 5322 header line
        as Gmail returned it, in order, duplicates kept, including every line
        decoded into a property below"
      fields:
        name:
          type: string
          description: "`name` — the header field name as THIS message spelled
            it, case included"
        value:
          type: string
          description: "`value` — the unfolded field body, exactly as Gmail
            returned it"
    subject:
      type: string
      displayName: Subject
      description: "the `Subject` header, as written. The FIRST occurrence;
        `headers` keeps every line. Null when the message has no Subject."
    rfcMessageId:
      type: string
      displayName: RFC Message-ID
      description: "the `Message-ID` header's msg-id, angle brackets dropped
        — the SENDER's identifier, never a record reference and never Gmail's
        `Message.id`. Null when the message has no Message-ID."
    inReplyTo:
      type: string
      displayName: In-Reply-To
      description: "the `In-Reply-To` header's first msg-id, angle brackets
        dropped — an RFC identifier, not a reference at this kind. Join it
        against another row's `rfcMessageId`."
    references:
      type: string
      repeated: true
      displayName: References
      description: "the `References` header's msg-ids in order, angle brackets
        dropped, duplicates removed — the RFC 5322 ancestry, not references
        at this kind. Null when the message has none."
    # THE DERIVED READING INDEX, and it is labelled one. See the note above
    # the kind: `embed: true` needs a prose column, §7 names this decode, and
    # the exact bytes it was made from are on `payload`.
    body:
      type: text
      embed: true
      displayName: Body (derived)
      description: "DERIVED index, NOT the source: the text/plain parts decoded
        in their declared charsets and joined in MIME order, else the text/html
        flattened to markdown. Truncated; exact bytes on `payload`."
    # --- relations: the thread, and the addresses the headers name ----------
    # `onDelete: cascade` and `required`, because Gmail never sends a message
    # without a thread and retracting a thread retracts its messages.
    thread:
      type: reference
      kind: providers.substrate.reamde.dev/google/gmailthread
      required: true
      onDelete: cascade
      displayName: Thread
      description: "the thread this message belongs to, from `threadId`; no
        scalar copy beside it"
    # THE ADDRESS HEADERS, as OCCURRENCE ARRAYS. Not repeated references: RFC
    # 5322 allows the same mailbox twice on one header and allows a display
    # name per occurrence, and a repeated reference refuses a duplicate
    # target. So each entry is the header's own `Name <addr>` pair, typed,
    # with the identity a reference FIELD inside it. `from` is repeated for
    # the same reason — a `From:` with two mailboxes is legal mail.
    #
    # EVERY OCCURRENCE OF EVERY LINE. Version 18 read only the first header
    # of each name, so a long distribution list a relay folded into three
    # `To:` lines contributed two thirds of nobody.
    #
    # A mailbox that does not parse makes no entry at all; the verbatim
    # `headers` above still carries the line, and `payload` still carries the
    # tree it came from.
    #
    # `value` is the API's own field position and keeps THE HEADER'S
    # SPELLING — trimmed and otherwise untouched, local part included, the
    # same contract `contact.emailAddresses[].value` adopted. Only the hub
    # reference beside it is normalised, and only its DOMAIN is lowercased:
    # RFC 5321 §2.4 reserves the local part's case for the receiving host.
    from:
      type: object
      repeated: true
      displayName: From
      description: "the `From` header's mailboxes, in order — repeated because
        RFC 5322 allows a From with several mailboxes"
      fields:
        value:
          type: email
          description: "the mailbox AS THE HEADER SPELLED IT, trimmed and
            otherwise verbatim (the local part keeps its case)"
        address:
          type: reference
          kind: providers.substrate.reamde.dev/google/emailaddress
          description: "the hub row for this mailbox — composed from the normal
            form (domain lowercased), and the row an attendee list and an
            address-book entry reach too"
        name:
          type: string
          description: "the display name THIS header spelled for the address,
            when it spelled one; absent when it did not"
    to:
      type: object
      repeated: true
      displayName: To
      description: "the `To` headers' mailboxes, in order, every line's —
        duplicates kept, because they are occurrences, not a set"
      fields:
        value:
          type: email
          description: "the mailbox AS THE HEADER SPELLED IT, trimmed and
            otherwise verbatim (the local part keeps its case)"
        address:
          type: reference
          kind: providers.substrate.reamde.dev/google/emailaddress
          description: "the hub row for this mailbox — composed from the normal
            form (domain lowercased), and the row an attendee list and an
            address-book entry reach too"
        name:
          type: string
          description: "the display name THIS header spelled for the address,
