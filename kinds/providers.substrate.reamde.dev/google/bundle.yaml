    cc:
      type: object
      repeated: true
      displayName: Cc
      description: "the `Cc` headers' mailboxes, in order, every line's —
        duplicates kept, because they are occurrences, not a set"
      fields:
        value:
          type: email
          description: "the mailbox AS THE HEADER SPELLED IT, trimmed and
            otherwise verbatim (the local part keeps its case)"
        address:
          type: reference
          kind: providers.substrate.reamde.dev/google/emailaddress
          description: "the hub row for this mailbox — composed from the normal
            form (domain lowercased), and the row an attendee list and an
            address-book entry reach too"
        name:
          type: string
          description: "the display name THIS header spelled for the address,
            when it spelled one; absent when it did not"
    bcc:
      type: object
      repeated: true
      displayName: Bcc
      description: "the `Bcc` headers' mailboxes, in order — Gmail returns
        these only on a message this mailbox itself sent"
      fields:
        value:
          type: email
          description: "the mailbox AS THE HEADER SPELLED IT, trimmed and
            otherwise verbatim (the local part keeps its case)"
        address:
          type: reference
          kind: providers.substrate.reamde.dev/google/emailaddress
          description: "the hub row for this mailbox — composed from the normal
            form (domain lowercased), and the row an attendee list and an
            address-book entry reach too"
        name:
          type: string
          description: "the display name THIS header spelled for the address,
            when it spelled one; absent when it did not"
    replyTo:
      type: object
      repeated: true
      displayName: Reply-To
      description: "the `Reply-To` headers' mailboxes, in order — where the
        sender asked for the answer to go instead of to `From`"
      fields:
        value:
          type: email
          description: "the mailbox AS THE HEADER SPELLED IT, trimmed and
            otherwise verbatim (the local part keeps its case)"
        address:
          type: reference
          kind: providers.substrate.reamde.dev/google/emailaddress
          description: "the hub row for this mailbox — composed from the normal
            form (domain lowercased), and the row an attendee list and an
            address-book entry reach too"
        name:
          type: string
          description: "the display name THIS header spelled for the address,
            when it spelled one; absent when it did not"
    # --- instants (`at` is the trait's, from `internalDate`, not redeclared)
    # The `Date` HEADER, which is the sender's clock and not Gmail's:
    # `internalDate` (the trait's `at`) is when Gmail RECEIVED it, and the two
    # differ by a delivery delay or by a lying client.
    date:
      type: datetime
      displayName: Date header
      description: "the `Date` header, parsed — the SENDER's instant, which
        is not `at` (`internalDate`, when Gmail received it). Null when there
        is no Date; a Date this sync cannot parse leaves the stored value
        alone."
---
# ---- the gmail mirror: one attachment --------------------------------------
# THE RESOURCE, NAMED: this is a FILENAME-SELECTED PROJECTION of Gmail's
# `MessagePart` (Gmail API v1, inside `users.messages.get?format=FULL`). It
# is not a complete MessagePart and does not pretend to be one — the complete
# part, with its children, their order and their exact encoded bytes, is on
# `gmailmessage.payload`, which stores the tree whole. What this kind is FOR
# is the question a tree cannot answer: "which mail carried this spreadsheet",
# as a query rather than a scan of every message's json.
#
# So it carries exactly the part's own identity (`partId`), the two
# `MessagePart.body` fields a caller needs to fetch the bytes (`attachmentId`,
# `size`), the two that say what it is (`filename`, `mimeType`), and the
# part's OWN `headers` — which version 18's description claimed were on the
# message's `headers`. They are not: `gmailmessage.headers` is the ROOT part's
# header list, and `Content-Disposition: attachment; filename=…` never
# appears in it.
#
# IDENTITY. `partId` is Gmail's index path for the part (`1`, `0.1`) and is
# unique within the message and stable across re-fetches. Gmail spells the
# ROOT part's `partId` as the EMPTY STRING, which is legal and which version
# 18 could neither store (the property was `required`) nor key on (it fell
# back to the filename, and two parts of one message may share one). The row
# id substitutes the reserved token `root` for the empty partId — Gmail's own
# partIds are digits and dots, so it cannot collide — and the property is
# written as the empty string it is.
#
# The BYTES are not here: the runner has no in-invocation atomic blob write,
# so `attachmentId` is the handle and `blob` stays undeclared until it does.
# The bytes of an INLINE part (one with no `attachmentId`) are on
# `gmailmessage.payload`, where the byte-bounded hydration packs them first.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/google/gmailattachment
data:
  authority: providers.substrate.reamde.dev
  package: google
  description: >-
    One Gmail attachment: the filename-bearing MessagePart of a Message (Gmail
    API v1, format=FULL), projected — its identity, its own headers and the
    handle a later users.messages.attachments.get reads the bytes by. The
    COMPLETE part, children and exact bytes included, is on `gmailmessage.payload`.
    No envelope and no hypermedia to omit; no instant, so no temporal trait.
  purpose: supporting
  names:
    singular: gmailattachment
  displayTemplate: "{filename}"
  properties:
    # --- identity -----------------------------------------------------------
    account:
      type: reference
      kind: providers.substrate.reamde.dev/google/account
      required: true
      onDelete: cascade
      displayName: Account
      description: "the account this attachment was synced from — the one
        property here that is not the API's; always written"
    partId:
      type: string
      displayName: Part ID
      description: "`MessagePart.partId` — Gmail's index path for the part
        (`1`, `0.1`), unique within the message. The ROOT part's is the EMPTY
        STRING, stored as such; the row id spells that one `root`."
    attachmentId:
      type: string
      displayName: Attachment ID
      description: "`MessagePart.body.attachmentId` — the handle users.messages.attachments.get
        reads the bytes by. Null on an INLINE part, whose bytes ride on `gmailmessage.payload`
        instead."
    # --- the object's own scalars -------------------------------------------
    filename:
      type: string
      displayName: Filename
      description: "`MessagePart.filename` as the sender wrote it — the field
        whose presence selects a part into this kind at all"
    mimeType:
      type: string
      displayName: MIME type
      description: "`MessagePart.mimeType` — the part's media type, verbatim.
        Null when the part carried none."
    size:
      type: int
      displayName: Size
      description: "`MessagePart.body.size` — the part's decoded size in bytes
        as Gmail counts it. Null when the part carried none."
    # THIS PART's headers, not the message's. `gmailmessage.headers` is the ROOT
    # part's list and never holds a part's Content-Disposition.
    headers:
      type: object
      repeated: true
      displayName: Headers
      description: "`MessagePart.headers` verbatim — this PART's own header
        lines, in order, duplicates kept. Not the same list as `gmailmessage.headers`,
        which is the root part's."
      fields:
        name:
          type: string
          description: "`name` — the header field name as this part spelled
            it, case included"
        value:
          type: string
          description: "`value` — the unfolded field body, exactly as Gmail
            returned it"
    # --- relations ----------------------------------------------------------
    message:
      type: reference
      kind: providers.substrate.reamde.dev/google/gmailmessage
      required: true
      onDelete: cascade
      displayName: Message
      description: "the message that carried this part; `onDelete: cascade`,
        so retracting the message retracts its parts"
---
kind: substrate.reamde.dev/core/function
metadata:
  id: providers.substrate.reamde.dev/google/syncgmail
data:
  authority: providers.substrate.reamde.dev
  package: google
  description: >-
    Sync a Google account's mail: drain Gmail history (or a bounded backfill
    window) and mirror its threads, messages and addresses. Mirrors only,
    under this package's own kinds.
  runtime: python
  timeout: PT1M
  permissions:
    writes:
      - providers.substrate.reamde.dev/google/gmailthread
      - providers.substrate.reamde.dev/google/gmailmessage
      - providers.substrate.reamde.dev/google/gmailattachment
      - providers.substrate.reamde.dev/google/gmaillabel
      - providers.substrate.reamde.dev/google/emailaddress
      - providers.substrate.reamde.dev/google/account
    # The mirrors drive the sweep and both reconciliations — a thread's
    # survival is judged by whether a message still names it, and a
    # message's attachment rows are judged against the parts its own
    # authoritative read just returned — and they are read to prove a row
    # exists before retracting it (a delete of something never written is
    # ErrNotFound and would fail the whole delivery). A swept message row is
    # read for its `historyId`, which fences the sweep against a competing
    # run, and for its `thread`, which is the only way back to the thread it
    # may have emptied.
    reads:
      kinds:
        - providers.substrate.reamde.dev/google/gmailthread
        - providers.substrate.reamde.dev/google/gmailmessage
        - providers.substrate.reamde.dev/google/gmailattachment
        - providers.substrate.reamde.dev/google/gmaillabel
      budgets:
        calls: 256
        rows: 10000
    network:
      - "gmail.googleapis.com"
      # The loopback seam: `config.apiBase` may only ever name a loopback
      # host, and a deployment that wants one has to allow it in the
      # sandbox's egress list too (SUBSTRATE_SANDBOX_EGRESS_ALLOW).
      - "127.0.0.1"
      - "localhost"
  source: |
    """Gmail sync — one provider page, or one hydrate batch, per invocation.

    The account's live access token arrives injected on the bundle config
    (`config.accounts[].token`, host-resolved); this body never sees a client
    secret or a credential ref, and it refuses to send the token anywhere but
    https://gmail.googleapis.com or loopback (the test seam) — REDIRECTS
    included, which urllib would otherwise follow with the bearer attached.

    WHAT THIS STREAM MIRRORS, and by which call:

      users.getProfile          the run-start historyId watermark
      users.messages.list       ids, includeSpamTrash=true (see below)
      users.history.list        the incremental delta
      users.messages.get?FULL   the Message resource, whole, payload included
      users.threads.get?minimal the Thread RESOURCE's own snippet/historyId/
                                messages — the only authority for those three

    THE COMPLETENESS CONTRACT (Codex §3 item 2). `messages.get?format=full` is
    an AUTHORITATIVE COMPLETE snapshot of one Message: a field it omits is a
    field the message does not have, so a declared property the response leaves
    out is written NULL and deletes. A field this sync derives from `payload`
    follows the payload: when the response carries no `payload` at all, NOTHING
    payload-derived is written, so a thinner read can never erase a fuller row.
    `classificationLabelValues` is the one field written on presence only — it
    is filled by a Workspace add-on surface this scope may not be able to read,
    so its absence is not evidence that the message has none.

    MAILBOX SCOPE. `messages.list` asks for `includeSpamTrash=true` because
    `users.history.list` reports Spam and Trash whether we ask or not. Backfill,
    history and the sweep therefore see ONE mailbox, and a message in Spam is
    mirrored with the `SPAM` label on its `labels` rather than reconciled away as a
    deletion the next windowed re-read invents.

    The incremental contract is Gmail's historyId. The RUN-START profile
    historyId is the watermark (F5): captured before a single message is read
    and stamped only when the account's drain COMPLETES AND owes no
    reconciliation, so a message that changes mid-drain falls inside the next
    run's window rather than through the gap a completion clock would open. A
    too-old startHistoryId is HTTP 404 — and ONLY 404, never a 400 or a 403 —
    which drops to a WINDOWED full re-read under a fresh generation, followed by
    a sweep scoped to that same window. An unscoped generation sweep would
    delete the archive the window never touched.

    Per-account isolation (F2/F3): the per-account drain is try/except; a
    failure stamps THAT account's rollup syncStatus "erroring: <reason>" ONCE
    and leaves both lastSyncedAt and gmailLastSyncedAt alone, so the schedule
    retries, the window floor never advances past unread mail, and the queue
    moves on. Every effect the drain intends is BUFFERED (`_Batch`) and flushed
    only when the invocation returns normally: `host.effects` offers no
    rollback, so a body that staged ten puts and then raised would otherwise
    hand the engine those ten beside its own error stamp.
    """
    import base64
    import codecs
    import datetime as _dt
    import json as _json
    import re
    import urllib.error
    import urllib.parse
    import urllib.request
    import uuid
    from email.utils import getaddresses, parsedate_to_datetime
    from html import unescape as _unescape
    from html.parser import HTMLParser

    AUTHORITY = "providers.substrate.reamde.dev/google"
    ACCOUNT_TYPE = AUTHORITY + "/account"
    ADDRESS_TYPE = AUTHORITY + "/emailaddress"
    THREAD_TYPE = AUTHORITY + "/gmailthread"
    MESSAGE_TYPE = AUTHORITY + "/gmailmessage"
    ATTACHMENT_TYPE = AUTHORITY + "/gmailattachment"
    LABEL_TYPE = AUTHORITY + "/gmaillabel"

    GMAIL_API = "https://gmail.googleapis.com"
    GMAIL_HOST = "gmail.googleapis.com"
    LOOPBACK_HOSTS = ("127.0.0.1", "localhost", "::1", "0.0.0.0")

    LIST_PAGE = 100      # ids per messages.list page (5 quota units)
    HYDRATE = 25         # messages.get per invocation, 5 quota units each
    SWEEP_PAGE = 200
    THREAD_READS = 25    # threads.get per invocation, 10 quota units each
    # threads.get is the ONLY authority for a Thread's snippet, historyId and
    # membership, and a mailbox — or a recording set — may not answer it. After
    # this many consecutive failures the call is given up on FOR THE RUN and
    # every thread stays THIN (identity only), which is the honest row: a thread
    # this sync could not read authoritatively claims nothing it did not read.
    THREAD_FAILURES = 3
    # How many row ids one windowed re-read may carry on its cursor AND in the
    # account's resume before the sweep gives up on telling a stale row from a
    # live one. The ids are the sweep mark the engine cannot yet hold as a label
    # (README, ask 1); past this many the sweep is skipped and logged rather than
    # guessed at. 5,000 ids is ~250 KiB of JSON, which both the 8 MiB invocation
    # frame and an account property can carry across a run boundary — 20,000
    # could not, and losing the set between runs is what let a capped
    # reconciliation delete rows an earlier run had hydrated (Codex §4.4.1).
    SEEN_MAX = 5000
    GONE_MAX = 5000      # ids one run may carry as RETRACTED (T-048)
    # Threads a message sweep may queue for the "does anything still name it"
    # check. Past this the thread reconciliation is skipped and logged: deleting
    # on a truncated candidate list is fine (each candidate is checked
    # individually) but the SILENCE about the rest is not.
    STALE_MAX = 2000
    MAX_LIST_PAGES = 20  # per-run backfill cap; the rest resumes next run
    # The INVOCATION cap, and the one that actually binds. The engine's paged
    # drain is bounded by cumulative WALL CLOCK from the chain's first
    # committed page (functions.go drainDeadline), and it refuses a middle
    # page BEFORE committing it — so a chain that keeps asking for one more
    # page is cut off with nothing persisted and the next run restarts from
    # page one, forever. 20 list pages x (1 list + 4 hydrates) is ~100
    # invocations and would never finish; ~12 leaves the resume state
    # committed well inside the deadline, and every run makes real progress.
    MAX_CALLS = 12
    # AND THE SAME BOUND IN SECONDS. The invocation count alone was not a bound
    # at all: `_spent` is consulted at a LIST boundary, and the hydrates between
    # two listings can each take a second against the real API, so every hourly
    # `google-gmail-scheduled` fire in production ran past the engine's two-minute
    # cumulative deadline and was recorded as "paged drain parked mid-chain" —
    # with its effects committed, so the mailbox advanced and the ledger said
    # failure. The chain now watches the clock as well as the counter, from its
    # first invocation, and hands back with what it owes on the account. 55 s
    # leaves room for the slowest single hydrate batch plus the stamp inside the
    # engine's 2 minutes; `config.drainBudgetMs` overrides it.
    DRAIN_SECONDS = 45
    # How many listed-but-unhydrated message ids a hand-back expects to park on
    # the account. A list page is 100 ids, so this is several pages of headroom;
    # past it the set is still parked — dropping the tail would lose those
    # messages, and no token can re-derive them — and the run says so in the log.
    PENDING_HOLD_MAX = 1000
    # Reserved before a LIST call: the four hydrate invocations the page it is
    # about to fetch will need, plus the one that stamps. A page listed with no
    # budget left to hydrate it is a page whose ids the sweep would then read as
    # absent — so the budget is checked BEFORE the fetch, never in the middle of
    # draining one (Codex §4.4.7).
    CALL_RESERVE = 5
    BODY_MAX = 8000
    REASON_MAX = 200
    BACKFILL_DAYS = {"none": 0, "last30d": 30, "last90d": 90, "last1y": 365}
    # The base64url `data` one message's `payload` may carry into the frame. The
    # tree is stored EXACTLY — every part's encoded bytes verbatim — while the
    # running total fits; a part past the budget keeps its `body.size` and
    # `body.attachmentId` and loses only the `data` a later
    # users.messages.attachments.get can still fetch. Parts with NO
    # `attachmentId` (the inline bodies, whose bytes exist nowhere else) are
    # packed FIRST, so what a bound drops is always the fetchable thing. 1 MiB
    # of base64 is ~750 KiB of octets; 25 of them is well inside an 8 MiB frame.
    PAYLOAD_MAX = 1000000
    # An address reaches an `email`-kind property only if it parses as an RFC
    # 5322 mailbox — one malformed header must not fail a whole page. This is
    # the DOT-ATOM production, deliberately narrower than Go's
    # net/mail.ParseAddress (which is what the engine validates an `email`
    # property with at effect APPLY, where this body's try/except cannot see
    # it): a pattern that admitted `.a@x.com`, `a..b@x.com` or `a(b@x.com`
    # would roll the page's transaction back and park the drain on every
    # retry. Quoted local parts are refused rather than wrong.
    _ATEXT = r"[A-Za-z0-9!#$%&'*+/=?^_`{|}~-]+"
    _LABEL = r"[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?"
    _RE_ADDR = re.compile(
        r"^" + _ATEXT + r"(?:\." + _ATEXT + r")*@"
        + _LABEL + r"(?:\." + _LABEL + r")+$")
    # RFC 5322 `msg-id`, with the angle brackets the header wraps it in. The
    # brackets are dropped from the decoded properties so `inReplyTo` and
    # `references[]` join against `rfcMessageId`; `headers[]` keeps every line
    # exactly as it arrived.
    _RE_MSGID = re.compile(r"<([^<>@\s]+@[^<>\s]+)>")
    # `Content-Type: text/plain; charset="iso-8859-7"`. A part decoded as UTF-8
    # regardless of what it declared is how a Greek or a Cyrillic letter became
    # a page of replacement characters.
    _RE_CHARSET = re.compile(r'charset\s*=\s*(?:"([^"]+)"|([^\s;]+))', re.IGNORECASE)
    # The token a part whose `partId` is the empty string (the ROOT part of a
    # single-part message) contributes to its row id. Gmail's partIds are digits
    # and dots, so this cannot collide with one.
    ROOT_PART = "root"
    _RE_TAG = re.compile(r"<[^>]+>")
    # The html flattener's tag sets. HTML_SKIP is content that is not prose;
    # HTML_BREAK is where a line ends. `head` is NOT in the skip set: its end
    # tag is optional and HTMLParser does not synthesize one, so muting on it
    # would swallow the whole letter. `<body>` clears the mute for the same
    # reason: an unclosed `<title>` must not take the message with it.
    # Sets, not tuples: every tag event tests three of them, and a page of
    # layout markup is hundreds of thousands of tag events.
    HTML_SKIP = frozenset(("script", "style", "title"))
    HTML_BREAK = frozenset((
        "address", "article", "aside", "blockquote", "br", "caption",
        "center", "dd", "div", "dl", "dt", "fieldset", "figcaption",
        "figure", "footer", "form", "h1", "h2", "h3", "h4", "h5",
        "h6", "header", "hr", "legend", "main", "nav", "ol", "p",
        "pre", "section", "table", "tbody", "tfoot", "thead", "tr", "ul"))
    HTML_SPACE = frozenset(("td", "th"))  # cells sit on one line, not welded
    # What ends an anchor that a sender left open. `br` is deliberately not
    # one: a button label written across two lines is still one link.
    HTML_STRUCTURE = (HTML_BREAK - frozenset(("br",))) | HTML_SPACE | {"li"}
    # The schemes a destination may carry. An ALLOWLIST, because the tag-strip
    # this replaces let no href through at all and `data:text/html,<script>`
    # or `vbscript:` in a rendered body is somebody else's code: a scheme
    # nobody clicks safely leaves the label as words. A relative href has no
    # base outside the mail client, so it is not a target either.
    URL_SCHEMES = ("http://", "https://", "mailto:", "tel:")
    # An inline `data:` URI is the one thing that makes a mail megabytes and
    # it is never prose, so its payload is cut before the parser reads any of
    # it. An embedded photo in the first tag must not eat the whole budget
    # below and leave the letter under it unread. Only the payload goes: the
    # scheme and the media type stay, so the same pattern serves an
    # attribute, a css `url(...)` and an unquoted value without knowing which
    # it is in. A media type or a `base64,` is REQUIRED and a word character
    # before `data:` disqualifies the match, so prose reading
    # `metadata:0123...` keeps every character it had.
    _RE_DATA_URI = re.compile(
        r"""(?<![\w.-])(data:(?:[\w.+-]+/|;?base64,))[^\s"'<>)]{100,}""",
        re.IGNORECASE)
    # Outlook's conditional blocks are comments, and they are most of the
    # markup in a templated mail. HTMLParser skips their CONTENT but still
    # reads every character of it against the budget below.
    # The `|\Z` is not decoration: without it every unterminated `<!--`
    # rescans to the end of the source and a page of them is quadratic.
    _RE_COMMENT = re.compile(r"<!--.*?(?:-->|\Z)", re.DOTALL)
    # A destination with a `)`, a `<` or a space in it ends the markdown span
    # early, so it goes in CommonMark's angle-bracket form instead.
    _RE_URL_UNSAFE = re.compile(r"[\s()<>]")
    # The href comes off the RAW start tag, not off HTMLParser's parsed
    # attributes: the parser unescapes `&copy` (no semicolon) the way a
    # browser does in TEXT, but a browser leaves it alone in an ATTRIBUTE, so
    # `?a=1&copy=1` would otherwise reach the reader as `?a=1(c)=1` and point
    # somewhere else. Only the terminated form is a reference here.
    # One attribute at a time, because a SEARCH for `href=` finds the one
    # inside `data-href="..."` or inside `title="see href=http://phish"`,
    # which templates and phishing mail respectively put before the real one.
    # A quoted value is consumed whole here, so it can hide nothing.
    _RE_ATTR = re.compile(
        r"""([\w:.-]+)(?:\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]+)))?""")
    _RE_CHARREF = re.compile(r"&[#\w]{1,32};")
    # The work ceiling, not an output one: HTMLParser is pure python and a
    # megabyte of text-free tag soup costs the better part of a second, which
    # 25 messages of it would not keep inside one 30s invocation. It binds
    # only on markup that never produced a body's worth of text, because the
    # flattener stops feeding as soon as it has one, and what lies past it is
    # not lost: the tag-strip below reads the whole source and says whether
    # the letter was in the part the parser never reached.
    HTML_MAX = 600000
    HTML_CHUNK = 65536
    # The cap on the SOURCE the flattener reads, so the passes before the
    # parser (the comment cut, the data: cut, the tag-strip) are bounded too.
    # It bounds only the DERIVED `body`; the exact html is on `payload`.
    HTML_SOURCE_MAX = 4000000
    MAX_LABEL = 500  # a link label is a phrase; see _close_link
    # Below this a parse that ran out of budget produced a preheader, not a
    # body, and the tag-strip over the whole source reads better.
    MIN_BODY = 200


    class _NoRedirect(urllib.request.HTTPRedirectHandler):
        """A redirect is a request to send the bearer somewhere else. urllib
        re-sends the Authorization header across one, so refuse instead: a
        None new-request turns the 30x into an ordinary HTTPError."""

        def redirect_request(self, req, fp, code, msg, headers, newurl):
            return None


    # An EMPTY ProxyHandler, explicitly: the default opener honours
    # http_proxy/https_proxy from the runner's environment, which would route
    # the bearer through whatever that variable names and defeat the origin
    # pin below.
    _OPENER = urllib.request.build_opener(
        _NoRedirect, urllib.request.ProxyHandler({}))


    class _Batch:
        """Every effect this invocation intends, held until it RETURNS.

        `host.effects` has no rollback and validation happens later still, so a
        body that staged ten puts and then raised hands the engine those ten
        beside its own "erroring" stamp — Codex §4.2, "error catch is not effect
        rollback". Buffering here makes the invocation's effects atomic with its
        own control flow, which is the only rollback this side of the wire.
        """

        def __init__(self):
            self.ops = []

        def put(self, kind, rid, properties):
            self.ops.append(("put", kind, rid, properties))

        def patch(self, kind, rid, properties):
            self.ops.append(("patch", kind, rid, properties))

        def delete(self, kind, rid):
            self.ops.append(("delete", kind, rid, None))

        def flush(self, host):
            for op, kind, rid, props in self.ops:
                if op == "put":
                    host.effects.put(kind, rid, properties=props)
                elif op == "patch":
                    host.effects.patch(kind, rid, properties=props)
                else:
                    host.effects.delete(kind, rid)
            self.ops = []


    def _api_base(cfg):
        """The configured API base, or Google's own host.

        LOOPBACK ONLY. The config row is owner-writable, so an arbitrary base
        would let an edit redirect the account's access token at a stranger;
        a base that is not loopback is refused BY NAME rather than silently
        ignored, because quietly calling Google when the operator asked for a
        recorded fake is how a seed run ends up reading live mail.
        """
        props = ((cfg.get("inputs") or {}).get("client") or {}).get("properties") or {}
        base = str(props.get("apiBase") or "").strip().rstrip("/")
        if not base:
            return GMAIL_API
        host = (urllib.parse.urlsplit(base).hostname or "").lower()
        if host not in LOOPBACK_HOSTS:
            raise RuntimeError(
                "google-gmail: config.apiBase names %s — only a loopback host "
                "may stand in for %s" % (host or "?", GMAIL_HOST))
        return base


    def _pinned(url, base):
        """Is this URL the base this body is allowed to call?

        Two admissions, and no third. The CONFIGURED BASE, whatever it is:
        the same scheme and host the resolved base carries — which covers
        Google's own origin, a loopback fake named on the config row, and a
        closure whose constant an e2e rewired before it was installed. And
        GMAIL_HOST over https, always, so a body whose base was cleared still
        cannot be pointed anywhere else.
        """
        u = urllib.parse.urlsplit(url)
        b = urllib.parse.urlsplit(base or "")
        host = (u.hostname or "").lower()
        if host and host == (b.hostname or "").lower() and u.scheme == b.scheme:
            return True
        return u.scheme == "https" and host == GMAIL_HOST


    def _get(base, token, path, params=None):
        # F1 origin pinning: the engine's `network` capability is declared but
        # NOT enforced host by host, so this refusal is the defense until
        # host-side egress enforcement exists. It raises inside the
        # per-account try/except, so a tampered base stamps THAT account
        # erroring rather than parking the whole delivery.
        url = base + path
        if params:
            url = url + "?" + urllib.parse.urlencode(params, doseq=True)
        if not _pinned(url, base):
            parts = urllib.parse.urlsplit(url)
            raise RuntimeError(
                "google-gmail: refusing to send credentials to %s://%s — only "
                "https://%s or the configured loopback base"
                % (parts.scheme, parts.hostname or "?", GMAIL_HOST))
        req = urllib.request.Request(url, headers={
            "Authorization": "Bearer " + token, "Accept": "application/json"})
        with _OPENER.open(req, timeout=20) as resp:
            return _json.loads(resp.read().decode("utf-8"))


    def _status(e):
        return getattr(e, "code", None)


    def _detail(e):
        """The error document Google returned, as a dict — `{}` when it did not
        return one. A 400 is only a stale page token when Google SAYS so, and
        saying so is what distinguishes it from a request bug this sync should
        surface rather than paper over (Codex §4.4.8)."""
        try:
            body = e.read()
        except Exception:
            return {}
        try:
            doc = _json.loads((body or b"").decode("utf-8", "replace"))
        except (ValueError, AttributeError):
            return {}
        return doc.get("error") if isinstance(doc.get("error"), dict) else {}


    def _bad_page_token(e):
        """Is this 400 Gmail saying the page token is no longer valid?

        Gmail answers an expired `pageToken` with `400 invalidArgument` and the
        phrase "Invalid pageToken" (older responses: `reason: invalidPageToken`).
        Anything else that 400s is a request bug and is re-raised.
        """
        if _status(e) != 400:
            return False
        err = _detail(e)
        reasons = [str((d or {}).get("reason") or "").lower()
                   for d in (err.get("errors") or []) if isinstance(d, dict)]
        if "invalidpagetoken" in reasons:
            return True
        return "pagetoken" in str(err.get("message") or "").lower().replace(" ", "")


    def _reason(e):
        """The failure in one line, and its CLASS first.

        The words matter: the status is what the console shows and what the e2e
        asserts on, so each class is named rather than left as a status code.
        401 is PERMANENT until the owner reconnects; 403 is the stream being
        unavailable to this grant; 429 is transient and says when; everything
        else is transient and the cadence retries it.
        """
        code = _status(e)
        if code == 401:
            return ("reconnect needed: Google refused the grant (401) — the "
                    "token was revoked or expired beyond refresh")
        if code == 403:
            return ("stream not available: Google refused the call (403) — is "
                    "gmail.readonly granted? a reconnect may be needed")
        if code == 429:
            return "rate limited by Google (429) — the retry is scheduled"
        if code is not None:
            return "google returned HTTP %d" % code
        return str(e) or type(e).__name__


    def _address_id(host, aid, addr):
        return host.ids.external("google-address", aid, addr)


    def _thread_id(host, aid, tid):
        return host.ids.external("gmail-thread", aid, tid)


    def _message_id(host, aid, mid):
        return host.ids.external("gmail-message", aid, mid)


    # The three closed sets on `Label`, spelled by `docs/kind-design.md` §2's one
    # rule (lowercase, `_` and `-` dropped) and keyed by the API's exact value, so
    # the manifest's labels and this body's normal form cannot drift. A value
    # Gmail adds that is not here is NOT guessed and NOT written: the property is
    # left absent and the value is named in the log, because an enum that refuses
    # a value fails the whole page.
    LABEL_ENUMS = {
        "messageListVisibility": {"show": "show", "hide": "hide"},
        "labelListVisibility": {"labelShow": "labelshow",
                                "labelShowIfUnread": "labelshowifunread",
                                "labelHide": "labelhide"},
        "type": {"system": "system", "user": "user"},
    }


    def _label_enum(host, field, raw):
        if raw is None:
            return None
        held = LABEL_ENUMS[field].get(str(raw))
        if held is None:
            host.log("google-gmail: Label.%s carried %r, which package version 24 "
                     "does not hold — the property is left absent rather than "
                     "guessed" % (field, str(raw)[:40]))
        return held


    def _label_id(host, aid, lid):
        return host.ids.external("gmail-label", aid, lid)


    def _label_refs(host, aid, msg):
        """`labelIds` as the rows they name (T-023).

        Every id in the array is a `gmaillabel` — Gmail's own system labels and
        the mailbox's alike — so the list IS the reference and no string rides
        beside it (§3). The labels walk runs first in this stream, so the targets
        exist; a reference to one it did not see is still legal (no `mustExist`)
        because an id Gmail puts on a message is real data whatever the listing
        held.
        """
        if "labelIds" not in msg:
            return None
        out, held = [], set()
        for lid in msg.get("labelIds") or []:
            if not isinstance(lid, str) or not lid or lid in held:
                continue
            held.add(lid)
            out.append({"ref": LABEL_TYPE + "/" + _label_id(host, aid, lid)})
        return out


    def _now():
        return _dt.datetime.now(_dt.timezone.utc).replace(microsecond=0)


    def _iso(ts):
        """An instant as RFC 3339 UTC, KEEPING whatever precision it carries."""
        stamp = ts if ts.tzinfo is not None else ts.replace(tzinfo=_dt.timezone.utc)
        return stamp.astimezone(_dt.timezone.utc).isoformat().replace("+00:00", "Z")


    def _parse(ts):
        try:
            return _dt.datetime.fromisoformat(str(ts).replace("Z", "+00:00"))
        except (TypeError, ValueError):
            return None


    def _instant(ms):
        """Gmail's `internalDate` — epoch MILLISECONDS as a decimal string — as
        the instant it is, milliseconds INCLUDED. Truncating to whole seconds
        threw away the only precision Gmail publishes and made two messages a
        fraction of a second apart compare equal (Codex §4.2)."""
        try:
            n = int(ms)
        except (TypeError, ValueError):
            return ""
        sec, msec = divmod(n, 1000)
        stamp = _dt.datetime.fromtimestamp(sec, _dt.timezone.utc)
        return _iso(stamp.replace(microsecond=msec * 1000))


    def _mailbox(raw):
        """The bundle's mailbox NORMAL FORM, or "" when it does not parse.

        Trim, lowercase the DOMAIN (DNS is case-insensitive), leave the LOCAL
        PART exactly as the header spelled it: RFC 5321 §2.4 reserves the local
        part's case for the receiving host, so lowercasing it rewrites somebody
        else's identity. These are the same three lines as `contactssync._mailbox`
        and `calendarsync._mailbox`, verbatim — the `emailaddress` hub only
        converges while all three agree.
        """
        text = str(raw or "").strip()
        if "@" not in text:
            return ""
        local, _, domain = text.rpartition("@")
        normal = local + "@" + domain.lower()
        return normal if _RE_ADDR.match(normal) else ""


    def _refid(value):
        """A stored reference, as the bare row id. The engine hands one back
        either as `{"ref": id}` or as `<kind>/<id>`."""
        ref = value.get("ref") if isinstance(value, dict) else value
        return str(ref or "").rsplit("/", 1)[-1]


    def _wants(acct):
        # The owner's PAUSE holds the scheduled path too (the `sync` trait's
        # `syncPaused`, decision 0085). The dispatcher settles a paused account's
        # RECORD-sourced deliveries as skips before this body ever runs, and
        # nothing else would stop the hourly tick walking it. A pause is not a
        # disabled stream: every toggle and every cursor is exactly where it was
        # when it lifts.
        props = acct.get("properties") or {}
        return bool(props.get("enabledGmail")) and not props.get("syncPaused")


    def _requested(props):
        """An unspent "sync now" for THIS stream.

        `syncRequestedAt` is a GENERATION and `gmailSyncRequestedAck` is what
        this stream last spent; while they disagree the request is outstanding.
        It OVERRIDES the cadence — a request that still had to wait an hour would
        not be a request — and it is the only thing that can drive a re-seeded
        account at all: a purge leaves the account row and its
        `gmailLastSyncedAt` standing, so both the on-connect guard and the
        cadence gate say "nothing to do" on every later seed.
        """
        requested = str(props.get("syncRequestedAt") or "")
        return bool(requested) and \
            str(props.get("gmailSyncRequestedAck") or "") != requested


    def _retry_after(e):
        """A 429's `Retry-After`, as the instant the account may be called again.

        A 429 SAYS WHEN (docs/provider-practices.md §5), and a drain that ignores
        it retries into the same wall on the next tick. The header is seconds or
        an HTTP date; anything unreadable falls back to a minute, because a 429
        with no usable hint is still a 429.
        """
        if getattr(e, "code", None) != 429:
            return ""
        raw = ""
        try:
            raw = str((getattr(e, "headers", None) or {}).get("Retry-After") or "")
        except Exception:
            raw = ""
        seconds = 60
        raw = raw.strip()
        if raw.isdigit():
            seconds = max(1, min(int(raw), 3600))
        elif raw:
            try:
                import email.utils as _eu
                when = _eu.parsedate_to_datetime(raw)
                if when is not None:
                    if when.tzinfo is None:
                        when = when.replace(tzinfo=_dt.timezone.utc)
                    seconds = max(1, int((when - _now()).total_seconds()))
            except Exception:
                seconds = 60
        return _iso(_now() + _dt.timedelta(seconds=seconds))


    def _due(props):
        freq = (props.get("syncFrequency") or "daily").lower()
        # A 429 SAYS WHEN. Until that instant nothing about this account is due —
        # not the cadence, and not a "sync now" either, because the wall is
        # Google's and no amount of asking moves it.
        wall = _parse(props.get("retryNotBefore"))
        if wall is not None and _now() < wall:
            return False
        if _requested(props):
            return True
        if freq == "off":
            return False
        last = _parse(props.get("gmailLastSyncedAt"))
        if last is None:
            return True
        hours = 1 if freq == "hourly" else 24
        return _dt.datetime.now(_dt.timezone.utc) - last >= _dt.timedelta(hours=hours)


    def _floor(props, anchor):
        # F4: the full-read window floor comes off the stream's stored backfill
        # ANCHOR — the first run's start instant — never off a clock read per
        # run, so the reach cannot creep forward every night. `none` means
        # from-connect-forward (the anchor itself); `all` reaches the epoch.
        depth = str(props.get("backfillDepth") or "last30d").lower()
        if depth == "all":
            return ""
        base = _parse(anchor) or _now()
        return _iso(base - _dt.timedelta(days=BACKFILL_DAYS.get(depth, 30)))


    def _query(floor):
        ts = _parse(floor) if floor else None
        if ts is None:
            return ""
        return "after:%d" % int(ts.timestamp())


    def _digits(value):
        """A Gmail `historyId` as the integer it is, for ORDERING only.

        Gmail sends it as a decimal STRING and does no arithmetic on it, so the
        mirror keeps the string; the sync compares two of them to tell which of
        two reads is newer, and to fence a sweep against a competing run.
        """
        text = "".join(c for c in str(value or "") if c.isdigit())
        return int(text) if text else 0


    # --------------------------------------------------------------------------
    # headers
    # --------------------------------------------------------------------------

    def _header_lines(payload):
        """`payload.headers` VERBATIM: every line, in order, duplicates kept."""
        out = []
        for h in (payload or {}).get("headers") or []:
            if not isinstance(h, dict):
                continue
            name = h.get("name")
            if not isinstance(name, str) or not name:
                continue
            out.append({"name": name, "value": str(h.get("value") or "")})
        return out


    def _values(lines, name):
        """EVERY occurrence of one header name, in order.

        Version 18 kept only the FIRST, so a message whose recipients arrived as
        three `To:` lines — legal RFC 5322, and what a long distribution list
        looks like after a relay folds it — contributed two thirds of nobody
        (Codex §4.4.11).
        """
        want = name.lower()
        return [line["value"] for line in lines if line["name"].lower() == want]


    def _addrs(values):
        """Address headers, decoded to the OCCURRENCE ENTRIES the kind holds.

        NOT deduped, and deliberately: these are occurrences, RFC 5322 allows
        the same mailbox twice with two different display names, and an
        occurrence array is what makes that expressible — a repeated reference
        would refuse the second.

        `value` keeps THE HEADER'S SPELLING (trimmed, local part untouched);
        only the hub reference beside it is normalised. A mailbox that does not
        parse makes no entry at all and no hub row; the verbatim `headers` and
        the exact `payload` still carry the line.
        """
        out, rows = [], []
        for value in values:
            for name, addr in getaddresses([value or ""]):
                source = (addr or "").strip()
                normal = _mailbox(source)
                if not normal:
                    continue
                item = {"value": source, "normal": normal}
                label = (name or "").strip()
                if label:
                    item["name"] = label
                out.append(item)
                rows.append(normal)
        return out, rows


    def _msgids(values):
        """The RFC 5322 `msg-id` tokens in one or more header lines, in order,
        without their angle brackets and without duplicates."""
        out = []
        for value in values:
            for found in _RE_MSGID.findall(value or ""):
                if found not in out:
                    out.append(found)
        return out


    def _header_date(value):
        """The `Date` HEADER, parsed — the SENDER's clock.

        Not `at`, which is Gmail's `internalDate` (when Gmail RECEIVED it); the
        two differ by a delivery delay or by a client with a wrong clock, and
        both are facts the resource carries.
        """
        text = str(value or "").strip()
        if not text:
            return ""
        try:
            stamp = parsedate_to_datetime(text)
        except (TypeError, ValueError, IndexError):
            return ""
        if stamp is None:
            return ""
        if stamp.tzinfo is None:
            stamp = stamp.replace(tzinfo=_dt.timezone.utc)
        return _iso(stamp)


    # --------------------------------------------------------------------------
    # the MIME tree: exact bytes, bounded; and the derived reading index
    # --------------------------------------------------------------------------

    def _charset(part):
        """The charset this part DECLARED, or "". Decoding every part as UTF-8
        is how a letter in iso-8859-7 or windows-1251 became a page of
        replacement characters (Codex §4.4.10)."""
        for h in (part or {}).get("headers") or []:
            if not isinstance(h, dict):
                continue
            if str(h.get("name") or "").lower() != "content-type":
                continue
            found = _RE_CHARSET.search(str(h.get("value") or ""))
            if found:
                return (found.group(1) or found.group(2) or "").strip().strip("\"'")
        return ""


    def _decode(part):
        """One leaf part's bytes, decoded IN ITS DECLARED CHARSET."""
        body = (part or {}).get("body") or {}
        data = body.get("data")
        if not isinstance(data, str) or not data:
            return ""
        pad = "=" * (-len(data) % 4)
        try:
            octets = base64.urlsafe_b64decode(data + pad)
        except Exception:
            return ""
        name = _charset(part) or "utf-8"
        try:
            codecs.lookup(name)
        except (LookupError, TypeError, ValueError):
            name = "utf-8"
        try:
            return octets.decode(name, "replace")
        except (LookupError, UnicodeError):
            return octets.decode("utf-8", "replace")


    def _disposition(part):
        for h in (part or {}).get("headers") or []:
            if isinstance(h, dict) and \
                    str(h.get("name") or "").lower() == "content-disposition":
                return str(h.get("value") or "").strip().lower()
        return ""


    def _is_attachment(part):
        """A part the message CARRIED rather than a part the message IS. A
        text/plain with a filename is a .txt somebody attached, and version 18
        welded it into the body."""
        if str((part or {}).get("filename") or ""):
            return True
        return _disposition(part).startswith("attachment")


    def _bodies(part):
        """(plain, html) for one part, by MIME's OWN selection rules.

        - an ATTACHMENT part (a filename, or `Content-Disposition: attachment`)
          contributes nothing;
        - `multipart/alternative` is a CHOICE, not a sequence: RFC 2046 §5.1.4
          orders alternatives worst-first, so the LAST child offering a plain
          and the LAST offering an html win. Version 18 joined every one of
          them and stored the same letter twice;
        - every other multipart is a SEQUENCE: its children in order.
        """
        part = part or {}
        if _is_attachment(part):
            return [], []
        mime = str(part.get("mimeType") or "").lower()
        kids = [c for c in (part.get("parts") or []) if isinstance(c, dict)]
        if kids:
            if mime == "multipart/alternative":
                plain, html = [], []
                for child in kids:
                    p, h = _bodies(child)
                    if p:
                        plain = p
                    if h:
                        html = h
                return plain, html
            plain, html = [], []
            for child in kids:
                p, h = _bodies(child)
                plain.extend(p)
                html.extend(h)
            return plain, html
        if mime == "text/plain":
            text = _decode(part)
            return ([text] if text else []), []
        if mime == "text/html":
            text = _decode(part)
            return [], ([text] if text else [])
        return [], []


    def _inventory(node, path, out):
        if not isinstance(node, dict):
            return
        body = node.get("body")
        body = body if isinstance(body, dict) else {}
        data = body.get("data")
        if isinstance(data, str) and data:
            out.append((path, len(data), bool(body.get("attachmentId"))))
        for i, child in enumerate(node.get("parts") or []):
            _inventory(child, path + (i,), out)


    def _keep(payload):
        """Which parts' `data` this row carries, chosen BY BYTES.

        Two passes, and the order is the point: the parts with NO
        `attachmentId` go first, because their bytes exist nowhere else, and
        only then the parts a later users.messages.attachments.get could still
        fetch by handle. Returns (paths, kept, dropped-parts).
        """
        inv = []
        _inventory(payload, (), inv)
        keep, used, dropped = set(), 0, 0
        for fetchable in (False, True):
            for path, size, handled in inv:
                if bool(handled) is not fetchable:
                    continue
                if used + size > PAYLOAD_MAX:
                    dropped += 1
                    continue
                keep.add(path)
                used += size
        return keep, used, dropped


    def _tree(node, path, keep):
        """The MIME tree, EXACTLY as Gmail returned it, minus the `data` of the
        parts the byte budget could not carry. Version 18 deleted every `data`
        key unconditionally, which is the principal content of the tree."""
        if isinstance(node, list):
            return [_tree(v, path, keep) for v in node]
        if not isinstance(node, dict):
            return node
        out = {}
        for key, value in node.items():
            if key == "parts" and isinstance(value, list):
                out[key] = [_tree(child, path + (i,), keep)
                            for i, child in enumerate(value)]
            elif key == "body" and isinstance(value, dict):
                body = dict(value)
                if "data" in body and path not in keep:
                    body.pop("data")
                out[key] = body
            else:
                out[key] = value
        return out


    def _attachments(part, path, out):
        """Every part carrying a filename, as the `gmailattachment` row it becomes.

        A FILENAME-SELECTED PROJECTION of `MessagePart`, and the kind says so:
        the complete part — its children, its order, its bytes — is on the
        message's `payload`. What is here is the part's own identity, its
        headers and the handle its bytes are fetched by.

        `partId` is the key. Gmail spells it as the part's index path (`1`,
        `0.1`) and spells the ROOT part's as the EMPTY STRING, so the row id
        substitutes `root` for that one rather than falling back to the
        filename, which two parts of one message may share (Codex §2.3, §4.4.13).
        """
        if not isinstance(part, dict):
            return
        if str(part.get("filename") or ""):
            body = part.get("body") if isinstance(part.get("body"), dict) else {}
            item = {"partId": str(part.get("partId") or ""),
                    "filename": str(part["filename"]),
                    "headers": _header_lines(part)}
            if "mimeType" in part:
                item["mimeType"] = str(part.get("mimeType") or "")
            if "attachmentId" in body:
                item["attachmentId"] = str(body.get("attachmentId") or "")
            if isinstance(body.get("size"), int) and not isinstance(
                    body.get("size"), bool):
                item["size"] = body["size"]
            out.append(item)
        for i, child in enumerate(part.get("parts") or []):
            _attachments(child, path + (i,), out)


    def _href_of(tag_text):
        """The anchor's own href, off the RAW start tag. HTMLParser unescapes
        an attribute the way a browser unescapes text, so its parsed value
        turns `?a=1&copy=1` into `?a=1(c)=1` and points somewhere else; here
        only a terminated `&...;` is a reference."""
        for attr in _RE_ATTR.finditer(tag_text):
            if attr.group(1).lower() != "href":
                continue
            for value in attr.groups()[1:]:
                if value is not None:
                    return _RE_CHARREF.sub(
                        lambda m: _unescape(m.group(0)), value).strip()
            return ""
        return ""


    class _Flatten(HTMLParser):
        """Gmail's text/html alternative, flattened into the markdown the
        message mirror's derived `body` index declares. An `<a href>` becomes
        `[label](url)`: the target is the content of a mail whose visible words
        are "click here". Every other tag is a line break, a space or nothing."""

        def __init__(self):
            HTMLParser.__init__(self, convert_charrefs=True)
            self.parts = []
            self.chars = 0    # collapsed text so far, the feed's stop signal
            self._muted = 0
            self._bullet = False  # a list marker is waiting for its content
            # At most ONE anchor is ever open: html5 ends the open one where
            # the next `<a>` begins, and so does this. [href, mark, seen],
            # where `seen` says whether the label has words in it yet, which
            # is what decides whether a structure closes the anchor.
            self._link = None

        def handle_starttag(self, tag, attrs):
            if tag in HTML_SKIP:
                self._muted += 1
                return
            if tag == "body":
                self._muted = 0
            if self._muted:
                return
            if tag == "a":
                self._close_link()
                href = _href_of(self.get_starttag_text() or "")
                # A url wraps across lines in the source of a real mail, and
                # a destination holds no whitespace in either markdown form.
                # Browsers drop the tab and the line break; the space is the
                # one that has to be carried.
                for ws in ("\t", "\n", "\r", "\f", "\v", "\xa0"):
                    href = href.replace(ws, "")
                self._link = [href.replace(" ", "%20"), len(self.parts), False]
                return
            if tag == "img":
                # The picture is dropped, its `alt` is not: it is the words
                # the sender wrote for a reader who cannot see the image, and
                # inside an anchor it is the only label a button ever has.
                for name, value in attrs:
                    if name == "alt" and (value or "").strip():
                        self.handle_data(value)
                return
            # A structure that opens ends an anchor that already has its
            # words: `<p><a href=…>linked<p>sign-off` is a missing `</a>` and
            # the sign-off is not part of the link, the same way `<li>…<li>`
            # is a second bullet. An anchor still empty stays open, because
            # `<a href=…><div>Buy now</div></a>` is one link around a block
            # and mail is full of them. An INLINE tag never closes one:
            # `<a href=…>Click <b>here</b></a>` is one label.
            if tag in HTML_STRUCTURE and self._link_has_words():
                self._close_link()
            if tag == "li":
                self.parts.append("\n- ")
                self._bullet = True
                return
            if tag in HTML_BREAK:
                # ...but not the break right after a bullet: `<li><div>` is
                # what a composer writes, and the marker would be left on a
                # line of its own.
                if not self._bullet:
                    self.parts.append("\n")
            elif tag in HTML_SPACE:
                # on the START tag too: `<td>A<td>B` is valid html, and its
                # cells would otherwise weld into `AB`
                self.parts.append(" ")
            self._bullet = False

        def handle_startendtag(self, tag, attrs):
            # `<br/>` and `<img/>` never reach handle_endtag, and a
            # self-closing `<a/>` owes no target, so start-tag handling
            # alone, with the link closed straight back.
            self.handle_starttag(tag, attrs)
            if tag in HTML_SKIP:
                self._muted -= 1
            elif tag == "a" and not self._muted:
                self._close_link()

        def handle_endtag(self, tag):
            if tag in HTML_SKIP:
                self._muted = max(0, self._muted - 1)
                return
            if self._muted:
                return
            if tag == "a" or (tag in HTML_STRUCTURE and self._link_has_words()):
                # An `</a>` a sender forgot would take the rest of the letter
                # into one link label, so a structure that ends closes the
                # anchor holding words. One still empty stays open: the first
                # `</td>` of `<a ...><table><tr><td>&nbsp;<td>Buy now` is a
                # spacer cell, and closing there would unlink the button.
                self._close_link()
            if tag in HTML_BREAK:
                self.parts.append("\n")
            elif tag in HTML_SPACE:
                self.parts.append(" ")

        def handle_data(self, data):
            if self._muted:
                return
            if self._bullet:
                # The indentation between `<li>` and its content carries the
                # newline that would strand the marker. Dropping it here
                # keeps every index in `parts` valid, which the open link's
                # mark depends on. It arrives either as its own event or as
                # the head of the text, so both go.
                if not data.strip():
                    return
                data = data.lstrip()
                self._bullet = False
            self.parts.append(data)
            # The collapsed length, not the raw one: 64 KiB of indentation
            # between two tags is not a body, and counting it as one would
            # stop the read before the letter arrived.
            self.chars += len(_squash(data))
            if self._link is not None and not self._link[2] and data.strip():
                self._link[2] = True

        def _link_has_words(self):
            # An anchor with a label yet. Both the start and the end tag ask,
            # and they have to ask the same question.
            return self._link is not None and self._link[2]

        def _close_link(self):
            if self._link is None:
                return
            href, mark, _ = self._link
            self._link = None
            raw = "".join(self.parts[mark:])
            label = _squash(raw)
            del self.parts[mark:]
            # The space just inside the tag is the one between two words:
            # `Visit<a> our site </a>for` must not read as `Visitour sitefor`.
            lead = " " if raw[:1].isspace() else ""
            trail = " " if raw[-1:].isspace() else ""
            if not href.lower().startswith(URL_SCHEMES):
                self.parts.append(raw if not label else lead + label + trail)
                return
            if not label:
                # An anchor around a spacer or an image with no `alt`. A
                # newsletter of image tiles would otherwise store a wall of
                # tracking urls where its words should be.
                self.parts.append(raw)
                return
            if label == href:
                self.parts.append(lead + href + trail)
                return
            if len(label) > MAX_LABEL:
                # Not a phrase, but a block, or an `</a>` nobody wrote. The
                # target rides after the words instead of wrapping them: a
                # span that long is unreadable.
                self.parts.append("%s%s (%s)%s" % (lead, label, href, trail))
                return
            if _RE_URL_UNSAFE.search(href):
                href = "<" + href.replace("<", "%3C").replace(">", "%3E") + ">"
            # A bracket in the label opens or ends the span early, the same
            # way a `)` does in the destination. The backslash goes first, or
            # it escapes the escapes.
            for ch in ("\\", "[", "]"):
                label = label.replace(ch, "\\" + ch)
            self.parts.append("%s[%s](%s)%s" % (lead, label, href, trail))

        def close(self):
            HTMLParser.close(self)
            self._close_link()  # an unclosed <a> still owes its target

        def text(self):
            return _collapse("".join(self.parts))


    def _squash(text):
        # The collapse rule, in one place: the feed's character budget, a
        # link label and every output line have to agree on what a run of
        # whitespace is worth, or the budget stops measuring the output.
        return " ".join(text.split())


    def _collapse(text):
        # Mail html is indented and newline-wrapped for the renderer, so every
        # run of layout whitespace collapses and only the breaks the tags
        # asked for survive, at most one blank line between. The tag-strip
        # fallback runs through here too: it leaves a space per tag, and a
        # page of layout markup is a page of them.
        lines, blank = [], False
        for line in text.split("\n"):
            line = _squash(line)
            if not line:
                if blank:
                    continue
                blank = True
            else:
                blank = False
            lines.append(line)
        return "\n".join(lines).strip()


    def _flatten(source, host, mid):
        # The data: cut runs BEFORE the source cap: a single embedded photo
        # can be larger than the cap on its own, and slicing first would
        # leave the letter under it outside the slice and base64 inside it.
        source = _RE_DATA_URI.sub(r"\1", source)[:HTML_SOURCE_MAX]
        # The comment cut feeds the PARSER only. The tag-strip below reads
        # the source with its comments, so a `<!--` inside a script string,
        # which the cut cannot see is quoted, takes the parse down with it
        # but not the letter.
        markup = _RE_COMMENT.sub(" ", source)
        parser = _Flatten()
        text, failure, read = "", "", 0
        try:
            # Fed in chunks so the read STOPS at a body rather than at a byte
            # offset: HTMLParser buffers a tag split across two feeds, so no
            # chunk boundary can eat a link or a paragraph. Four times the
            # property's cap, because collapsing layout whitespace shortens
            # what was read and the body must still be able to fill it.
            for cut in range(0, min(len(markup), HTML_MAX), HTML_CHUNK):
                parser.feed(markup[cut:cut + HTML_CHUNK])
                read = min(cut + HTML_CHUNK, len(markup))
                if parser.chars > BODY_MAX * 4:
                    break
            parser.close()
            text = parser.text()
        except Exception as exc:  # a parser defect must not park the drain
            failure = repr(exc)
        # A parse that reached the END of the source is the body, however
        # short: a two-line mail is a two-line mail.
        if text and read >= len(markup):
            return text
        stripped = _collapse(
            _unescape(_RE_TAG.sub(" ", source)).replace("\xa0", " "))
        if text and len(stripped) <= len(text) + MIN_BODY:
            # The parse ran out of budget, but the strip, which reads all of
            # the source, found nothing waiting behind the ceiling: the parse
            # stands and keeps the links the strip would have dropped.
            return text
        # The fallback SAYS it ran, because a body that quietly lost its
        # links is how this bug went unseen. Not for a message that has no
        # words at all, though: an image-only mailing loses nothing here and
        # would put 25 false lines in the log every re-read.
        if host is not None and stripped.strip():
            host.log("google-gmail: message %s: the html body did not "
                     "flatten (%s), so its links are lost to the tag-strip"
                     % (mid, failure or "no text came out of it"))
        return stripped


    def _body(payload, host, mid):
        """THE DERIVED READING INDEX, and nothing more.

        Not the source and never presented as it: the exact encoded bytes of
        every part are on `payload`. This is the text/plain parts decoded in
        their declared charsets and joined in MIME order, or — when the message
        offers no plain alternative — the text/html flattened to markdown; then
        truncated at BODY_MAX so a mailing list digest cannot fill a row. It
        exists so `embed: true` has one prose column to index.
        """
        plain, html = _bodies(payload or {})
        joined = "\n".join(p for p in plain if p)
        if joined.strip():
            body, flattened = joined, False
        elif html:
            body, flattened = _flatten("\n".join(h for h in html if h), host, mid), True
        else:
            return ""
        body = body.strip()
        if len(body) <= BODY_MAX:
            return body
        body = body[:BODY_MAX]
        if not flattened:
            # A `[` in a text/plain body is a `[`, not a link this wrote.
            return body
        # The cap is a character count and the flattened body is markdown, so
        # the cut can land inside a `[label](url)` and store half a
        # destination. The last `](` is where the last span this wrote turns
        # into its target: if that one closes, nothing is dangling, and a `[`
        # anywhere else is the sender's own bracket, not a link.
        shut = body.rfind("](")
        if shut >= 0:
            destination = body[shut + 2:]
            # The angle form ends at `>)`, and only there: an ordinary `)`
            # inside it is part of the url, which is why it wears the angles.
            ender = ">)" if destination.startswith("<") else ")"
            if ender in destination:
                return body
            return _before_bracket(body, shut + 1)
        # No destination in flight, but the cut can also land inside the
        # LABEL, before its `](` was ever written. An unclosed `[` is that;
        # `[External Sender]` in the sender's own words is not.
        opened = _last_bracket(body, len(body))
        if opened > 0 and "]" not in body[opened:]:
            return body[:opened].rstrip()
        return body


    def _last_bracket(body, before):
        opened = body.rfind("[", 0, before)
        while opened > 0 and body[opened - 1] == "\\":
            opened = body.rfind("[", 0, opened)  # an escaped one in a label
        return opened


    def _before_bracket(body, before):
        opened = _last_bracket(body, before)
        return body[:opened].rstrip() if opened > 0 else body


    def _classification(raw):
        """`classificationLabelValues[]`, typed as the add-on surface spells it.

        Copied on PRESENCE ONLY and never nulled: the field is filled by
        Workspace's labels surface rather than by the message, so a response
        without it is not evidence that the message carries none.
        """
        if not isinstance(raw, list):
            return None
        out = []
        for entry in raw:
            if not isinstance(entry, dict):
                continue
            item = {}
            if isinstance(entry.get("labelId"), str):
                item["labelId"] = entry["labelId"]
            fields = []
            for field in entry.get("fields") or []:
                if not isinstance(field, dict):
                    continue
                one = {}
                if isinstance(field.get("fieldId"), str):
                    one["fieldId"] = field["fieldId"]
                picks = field.get("selection")
                if isinstance(picks, str):
                    one["selection"] = [picks]
                elif isinstance(picks, list):
                    one["selection"] = [str(p) for p in picks if isinstance(p, str)]
                if one:
                    fields.append(one)
            if fields:
                item["fields"] = fields
            if item:
                out.append(item)
        return out or None


    # --------------------------------------------------------------------------
    # planning one hydrate batch
    # --------------------------------------------------------------------------

    def _plan(host, aid, msgs):
        """Turn a hydrate batch into ORDERED write intents.

        PRESENCE IS PRESERVED. Version 18 built a complete property map out of
        `.get` defaults, so any thinner read erased a fuller row. Here a
        property reaches `props` only under the completeness contract in the
        module docstring: the Message resource's own fields are written from an
        authoritative `format=full` read (absent means "none", and nulls), and
        every payload-derived property is written only when the response carried
        a `payload` to derive it from.

        NOTHING OWNER-RELATIVE and NOTHING FABRICATED. A message with no
        `threadId` is skipped with a log rather than given a thread identity
        minted from its own id (Codex §4.4.12).
        """
        addresses, threads, records, skipped = [], set(), [], 0
        for msg in msgs:
            if not isinstance(msg, dict):
                continue
            mid = msg.get("id")
            if not isinstance(mid, str) or not mid:
                continue
            tid = msg.get("threadId")
            if not isinstance(tid, str) or not tid:
                host.log("google-gmail: message %s carried no threadId — it is "
                         "incomplete, so it is not mirrored" % mid)
                skipped += 1
                continue
            props = {}
            # --- the Message resource's own fields, from an authoritative read
            # A REPEATED REFERENCE REFUSES A DUPLICATE TARGET, and `format=FULL`
            # is authoritative — so an absent `labelIds` writes null (the message
            # has none) and a present one writes the deduplicated list.
            props["labels"] = _label_refs(host, aid, msg)
            props["snippet"] = str(msg["snippet"]) if "snippet" in msg else None
            props["historyId"] = str(msg["historyId"]) if "historyId" in msg else None
            props["sizeEstimate"] = (msg["sizeEstimate"]
                                     if isinstance(msg.get("sizeEstimate"), int)
                                     and not isinstance(msg.get("sizeEstimate"), bool)
                                     else None)
            at = _instant(msg.get("internalDate"))
            props["at"] = at or None
            if "classificationLabelValues" in msg:
                found = _classification(msg["classificationLabelValues"])
                if found is not None:
                    props["classificationLabelValues"] = found
            # --- everything the payload carries -------------------------------
            payload = msg.get("payload")
            atts = []
            if isinstance(payload, dict):
                keep, kept, dropped = _keep(payload)
                if dropped:
                    host.log("google-gmail: message %s carries more than %d bytes "
                             "of inline data — %d part(s) keep their attachmentId "
                             "and size without their `data`"
                             % (mid, PAYLOAD_MAX, dropped))
                props["payload"] = _tree(payload, (), keep)
                lines = _header_lines(payload)
                props["headers"] = lines or None
                props["mimeType"] = (str(payload["mimeType"])
                                     if "mimeType" in payload else None)
                subject = _values(lines, "subject")
                props["subject"] = subject[0] if subject else None
                dates = _values(lines, "date")
                if dates:
                    stamp = _header_date(dates[0])
                    if stamp:
                        props["date"] = stamp
                    else:
                        # A `Date:` that is there but does not parse is not a
                        # message with no Date: leaving the stored value alone
                        # beats replacing a good instant with a null.
                        host.log("google-gmail: message %s has a Date header this "
                                 "sync could not parse — `headers` keeps the line"
                                 % mid)
                else:
                    props["date"] = None
                ids = _msgids(_values(lines, "message-id"))
                props["rfcMessageId"] = ids[0] if ids else None
                parents = _msgids(_values(lines, "in-reply-to"))
                props["inReplyTo"] = parents[0] if parents else None
                props["references"] = _msgids(_values(lines, "references")) or None
                props["body"] = _body(payload, host, mid) or None
                for name, header in (("from", "from"), ("to", "to"), ("cc", "cc"),
                                     ("bcc", "bcc"), ("replyTo", "reply-to")):
                    entries, rows = _addrs(_values(lines, header))
                    props[name] = entries or None
                    addresses.extend(rows)
                _attachments(payload, (), atts)
            threads.add(tid)
            records.append({"id": mid, "threadId": tid, "props": props,
                            "attachments": atts,
                            "hasPayload": isinstance(payload, dict)})
        return sorted(set(addresses)), threads, records, skipped


    # --------------------------------------------------------------------------
    # staging
    # --------------------------------------------------------------------------

    def _stage_addresses(host, batch, aid, addresses):
        """THE HUB ROWS: the address, and nothing else. The name a header
        spelled rides on that message's own occurrence entry. Staged FIRST,
        because a reference's target must exist when the row naming it
        applies."""
        for addr in addresses:
            batch.put(ADDRESS_TYPE, _address_id(host, aid, addr),
                      properties={"account": aid, "address": addr})


    def _stage_thin_threads(host, batch, aid, tids, seen):
        """IDENTITY ONLY, and first: `gmailmessage.thread` is a required reference
        and its target must exist when the message row applies. Nothing else is
        written here, so a thin row can never overwrite the authoritative
        Thread read that lands after the messages (Codex §4.4.5)."""
        for tid in sorted(tids):
            tref = _thread_id(host, aid, tid)
            seen.add(tref)
            batch.put(THREAD_TYPE, tref,
                      properties={"account": aid, "threadId": tid})


    def _stage_messages(host, batch, aid, records, seen):
        """One row per message, and one per part carrying a filename.

        The property map is the one `_plan` built under the completeness
        contract: a key present with `None` is a field the authoritative read
        says the message does not have, and deletes; a key ABSENT is a field
        this read knew nothing about, and is left alone.
        """
        for rec in records:
            mref = _message_id(host, aid, rec["id"])
            tref = _thread_id(host, aid, rec["threadId"])
            props = dict(rec["props"])
            props["account"] = aid
            props["messageId"] = rec["id"]
            props["thread"] = {"ref": tref}
            # The occurrence entries carry the header's own spelling in `value`
            # and the hub row in `address`; `normal` is this body's scratch key
            # and never reaches a property.
            for name in ("from", "to", "cc", "bcc", "replyTo"):
                entries = props.get(name)
                if not entries:
                    continue
                props[name] = [
                    {k: v for k, v in dict(
                        entry, address={"ref": _address_id(host, aid,
                                                           entry["normal"])}
                    ).items() if k != "normal"}
                    for entry in entries]
            seen.add(mref)
            batch.put(MESSAGE_TYPE, mref, properties=props)
            if not rec["hasPayload"]:
                # No payload, so this read says nothing about the message's
                # parts: reconciling attachments against it would retract rows
                # a fuller read wrote.
                continue
            wanted = set()
            for att in rec["attachments"]:
                key = att["partId"] or ROOT_PART
                aref = host.ids.external("gmail-attachment", mref, key)
                wanted.add(aref)
                row = {"account": aid, "message": {"ref": mref},
                       "partId": att["partId"],
                       "filename": att["filename"],
                       "headers": att["headers"] or None}
                for field in ("mimeType", "attachmentId", "size"):
                    row[field] = att.get(field) if field in att else None
                batch.put(ATTACHMENT_TYPE, aref, properties=row)
            _reconcile_attachments(host, batch, mref, wanted)


    def _reconcile_attachments(host, batch, mref, wanted):
        """Retract the attachment rows this message no longer carries.

        A re-read that finds a part gone — the sender edited a draft, or the
        mail was re-delivered without it — used to leave the old row live
        forever (Codex §4.4.13). The message's own read is authoritative for
        its parts, so anything not in `wanted` is not on the message.
        """
        after = None
        while True:
            page = host.records.list(ATTACHMENT_TYPE,
                                     where={"message": {"eq": mref}},
                                     first=SWEEP_PAGE, after=after)
            for ent in page.get("records") or []:
                rid = str(ent.get("id") or "")
                if rid and rid not in wanted:
                    batch.delete(ATTACHMENT_TYPE, rid)
            after = page.get("cursor") or None
            if not after:
                return


    def _thread_read(host, base, token, tid, cur):
        """`users.threads.get?format=minimal` — the Thread RESOURCE.

        THE ONLY AUTHORITY for a thread's `snippet`, `historyId` and
        `messages`. Version 18 copied the newest message's snippet and history
        id into the thread row and declared nothing derived; those are Message
        fields, and a thread is not its newest message.

        A failure is NOT fatal and never fails the drain: a mailbox mid-delete,
        a scope that cannot read threads, or a recording set with no
        `threads.get` in it all answer 404, and a thread this sync could not
        read stays THIN — identity only. After THREAD_FAILURES consecutive
        failures the call is given up on for the rest of the run.
        """
        if cur.get("threadsOff"):
            return None
        path = "/gmail/v1/users/me/threads/" + urllib.parse.quote(tid, safe="")
        try:
            thread = _get(base, token, path, {"format": "minimal"})
        except (urllib.error.HTTPError, urllib.error.URLError) as e:
            misses = int(cur.get("threadMisses") or 0) + 1
            cur["threadMisses"] = misses
            if misses >= THREAD_FAILURES:
                cur["threadsOff"] = True
                host.log("google-gmail: users.threads.get is not answering (%s) — "
                         "every thread this run stays thin: identity only, no "
                         "snippet, no historyId and no membership" % _reason(e))
            return None
        cur["threadMisses"] = 0
        return thread if isinstance(thread, dict) else None


    def _stage_threads(host, batch, aid, threads, hydrated, seen, gone=()):
        """The AUTHORITATIVE Thread rows, and the thin Message rows their own
        membership names.

        LAST in the batch, after the messages: `messages` points at message
        rows, and a reference's target should exist when the row naming it
        applies. A member this window never hydrated gets a THIN message row
        from the Message object `threads.get` embedded — what that payload
        carried and nothing else, which a later full read patches.

        A thread whose read failed is not in `threads` at all, so nothing is
        written for it beyond the thin identity row: the mirror never claims a
        snippet or a membership it did not read.

        EXCEPT A MEMBER THIS WALK JUST RETRACTED (`gone`, T-048). `messages.get`
        answering 404 is Gmail saying that message is GONE, and it is the later
        and the more specific read: a `threads.get` taken in the same walk can
        still name it, because the two calls are two snapshots and the thread's
        membership is the older one. Minting the thin row anyway put the
        retracted message straight back — a delete and a put of the same id in
        one delivery leaves the row live — so the 404 path retracted nothing
        that a threaded message could not undo, for ever, on every later run.
        The member is dropped from `messages` as well as from the thin mint: a
        thread naming a row this batch is deleting is a dangling reference.
        """
        for tid in sorted(threads):
            thread = threads[tid]
            tref = _thread_id(host, aid, tid)
            members = []
            for msg in thread.get("messages") or []:
                if not isinstance(msg, dict):
                    continue
                mid = msg.get("id")
                if not isinstance(mid, str) or not mid:
                    continue
                if mid in gone:
                    continue
                mref = _message_id(host, aid, mid)
                if mref in members:
                    continue
                members.append(mref)
                if mid in hydrated:
                    continue
                thin = {"account": aid, "messageId": mid,
                        "thread": {"ref": tref}}
                at = _instant(msg.get("internalDate"))
                if at:
                    thin["at"] = at
                for key in ("snippet", "historyId"):
                    if key in msg:
                        thin[key] = str(msg[key])
                labels = _label_refs(host, aid, msg)
                if labels:
                    thin["labels"] = labels
                if isinstance(msg.get("sizeEstimate"), int) and \
                        not isinstance(msg.get("sizeEstimate"), bool):
                    thin["sizeEstimate"] = msg["sizeEstimate"]
                seen.add(mref)
                batch.put(MESSAGE_TYPE, mref, properties=thin)
            props = {"account": aid, "threadId": tid,
                     "snippet": str(thread["snippet"]) if "snippet" in thread else None,
                     "historyId": (str(thread["historyId"])
                                   if "historyId" in thread else None),
                     "messages": [{"ref": r} for r in members] or None}
            seen.add(tref)
            batch.put(THREAD_TYPE, tref, properties=props)


    def _live(host, types, ids):
        """Which of these rows actually EXIST, as a set of `type|id`. Deleting
        a row that was never written is ErrNotFound and fails the WHOLE
        delivery — and a history delta always carries retractions for messages
        this account's window never stored. One list call per 200 ids, both
        types at once, rather than a read per id."""
        found = set()
        ids = sorted({i for i in ids if i})
        for start in range(0, len(ids), 200):
            chunk = ids[start:start + 200]
            page = host.list(filter={"kinds": list(types), "ids": chunk},
                             first=len(types) * len(chunk))
            for ent in page.get("records") or []:
                found.add("%s|%s" % (ent.get("kind") or "", ent.get("id") or ""))
        return found


    def _drop(host, batch, aid, mids):
        # Only the rows that are actually there: deleting one that was never
        # written is ErrNotFound and fails the whole delivery.
        refs = {mid: _message_id(host, aid, mid) for mid in mids}
        live = _live(host, (MESSAGE_TYPE,), refs.values())
        for mid in sorted(refs):
            ref = refs[mid]
            if ("%s|%s" % (MESSAGE_TYPE, ref)) in live:
                batch.delete(MESSAGE_TYPE, ref)


    def _retract_threads(host, batch, aid, dropped, alive):
        """`dropped` maps a thread id to the message ROW ids just retracted
        from it. Deleting a thread's LAST message would otherwise leave the
        thread row live and stale forever: nothing in this stream revisits a
        thread whose messages are all gone. `alive` is the set of threads this
        same history page also ADDED to, which the hydrate behind us re-reads.

        The query is by the `thread` REFERENCE, which is the relation Gmail's
        `threadId` became. Version 18 asked for a `threadId` property this kind
        no longer declares, and the filter failed the whole history page after
        the message deletes were already staged (Codex §4.4.3).
        """
        for tid in sorted(dropped):
            if not tid or tid in alive:
                continue
            gone = dropped[tid]
            tref = _thread_id(host, aid, tid)
            limit = min(len(gone) + 1, SWEEP_PAGE)
            page = host.records.list(MESSAGE_TYPE,
                                     where={"account": {"eq": aid},
                                            "thread": {"eq": tref}},
                                     first=limit)
            rows = [str(e.get("id") or "") for e in (page.get("records") or [])]
            # The deletes above are STAGED, not applied, so the rows they will
            # retract are still listed: a survivor is a row this page did not
            # drop. A full page is ambiguous — leave the thread standing.
            if len(rows) >= limit or [r for r in rows if r not in gone]:
                continue
            live = _live(host, (THREAD_TYPE,), [tref])
            if ("%s|%s" % (THREAD_TYPE, tref)) in live:
                batch.delete(THREAD_TYPE, tref)



    def _ack(props, stamp, stream):
        """Echo the request generation THIS run acted on, on EVERY path.

        `syncRequestedAt` is how the owner (and the seed runner) asks for a sync
        now, and how a re-seeded account is re-driven at all: its
        `gmailLastSyncedAt` survives a purge, so the on-connect guard is already
        false. The `google-gmail-on-request` trigger fires exactly while the request
        and this stream's ack disagree — so an UNACKNOWLEDGED request re-fires the
        trigger against the same work forever, which is why the erroring path
        acknowledges too.
        """
        requested = str(props.get("syncRequestedAt") or "")
        if requested and str(props.get(stream + "SyncRequestedAck") or "") != requested:
            stamp[stream + "SyncRequestedAck"] = requested
        return stamp


    # --------------------------------------------------------------------------
    # the core `sync` trait (substrate decision 0085)
    # --------------------------------------------------------------------------
    # The account binds `sync` beside `accountconfig`, so twelve of its properties
    # are the SUBSTRATE's vocabulary rather than this bundle's: the console's
    # Connections page, `GET /api/v1/sync/status` and `substratectl sync status`
    # read them off any provider that binds the trait, knowing nothing about
    # Google. They are written BESIDE the legacy `syncStatus` /
    # `<stream>SyncStatus` sentences and the three per-stream acks, never instead
    # of them — a reader of the old shape (the end-to-end runner's `(N pending)`
    # contract, the seed, the `google-<stream>-on-request` guards) goes on working
    # unchanged, and the legacy pair goes at the next major.
    #
    # THE SAME THREE HELPERS LIVE IN ALL THREE STREAM BODIES, verbatim. A function
    # is a closure with no shared module to import, and the account they patch is
    # one row: a copy that drifted would be two streams disagreeing about what the
    # account's state means.
    _TRAIT_STREAMS = ("contacts", "gmail", "calendar", "drive")


    def _trait_streams(props):
        """The account's `syncStreams` map, however the engine hands it back."""
        raw = props.get("syncStreams") or {}
        if isinstance(raw, str):
            try:
                raw = _json.loads(raw)
            except ValueError:
                raw = {}
        return dict(raw) if isinstance(raw, dict) else {}


    def _trait_broken(props, streams, name):
        """Is THAT stream failing right now?

        The trait's own entry first, and the legacy sentence behind it: an account
        upgraded into the trait carries no `syncStreams` until each stream has run
        once under this version, and until then a stream's `<stream>SyncStatus` is
        the only evidence that it is broken.
        """
        entry = streams.get(name) or {}
        if str(entry.get("state") or "") in ("erroring", "throttled"):
            return True
        return str(props.get(name + "SyncStatus") or "").startswith("erroring")


    def _trait_answered(props, streams, name, requested):
        """Has THAT stream answered this request generation?

        Either half counts: the trait's entry and the legacy per-stream ack are
        written in step, and the legacy one is what the on-request guards read.
        """
        entry = streams.get(name) or {}
        return (str(entry.get("requestedAck") or "") == requested
                or str(props.get(name + "SyncRequestedAck") or "") == requested)


    def _trait_stamp(props, stream, state, message, now, completed=False,
                     progress=None, started="", elapsed_ms=None):
        """The trait's half of one account patch.

        `state` is one of the trait's five words — `never`, `running`, `ok`,
        `erroring`, `throttled` — and `props` is the account as it stood BEFORE
        this patch, which is what makes the rollup readable. Three rules, the same
        three the legacy rollup follows:

          - this stream's entry in `syncStreams` is unconditional;
          - the ACCOUNT-LEVEL state is RAISED and never cleared over another
            ENABLED stream's live failure, so a healthy contacts run cannot make a
            broken gmail read `ok` on the Connections page;
          - the owner's request is acknowledged at the account level only once
            EVERY enabled stream has answered that same generation. Three streams
            answer independently, and one shared ack spent by whichever ran first
            would tell the page a request was served while two streams had not
            moved.

        `completed` is what stamps `lastAt`: a drain that handed back with work
        owed is `ok` with a pending count, not a run that finished.
        """
        streams = _trait_streams(props)
        entry = dict(streams.get(stream) or {})
        entry["state"] = state
        entry["message"] = str(message)[:400]
        if completed:
            entry["lastAt"] = now
        if progress is not None:
            # Only a run that COUNTED sets the count: a failure stamp carries no
            # bookkeeping, and zeroing the entry there would say the work it never
            # reached is done.
            entry["pending"] = int(progress.get("pending") or 0)
        requested = str(props.get("syncRequestedAt") or "")
        if requested:
            entry["requestedAck"] = requested
        streams[stream] = entry
        out = {"syncStreams": streams}
        others = [s for s in _TRAIT_STREAMS if s != stream
                  and props.get("enabled" + s.capitalize())]
        # THE ACCOUNT HOLDS ONE PROGRESS, SO IT IS RAISED THE WAY THE STATE IS.
        # `syncProgress` is the trait's single bounded-drain report and all three
        # streams write it, so a stream that finished with nothing owed must not
        # overwrite another's live `pending` — that is the bug the legacy rollup
        # already had once, where a completed contacts run wrote `ok` over the
        # calendar walk's `ok (6 pending)` and the drain was reported done with a
        # third of the mirror unwritten. This stream's own pending (or failure)
        # always speaks; an empty one only when nothing else is owed.
        owed_elsewhere = any(int((streams.get(s) or {}).get("pending") or 0) > 0
                             for s in others)
        if progress is not None and (int(progress.get("pending") or 0) > 0
                                     or state in ("erroring", "throttled")
                                     or not owed_elsewhere):
            out["syncProgress"] = progress
        # The two the DISPATCHER owns around a record-sourced delivery, written by
        # the body only where no dispatcher is watching (the scheduled path).
        if started:
            out["lastSyncStartedAt"] = started
        if elapsed_ms is not None:
            out["lastSyncDurationMs"] = max(0, int(elapsed_ms))
        if state in ("erroring", "throttled"):
            # A failure always speaks: it is the account's newest fact, and the
            # two error fields are the only place the cause survives a recovery.
            out["syncState"] = state
            out["syncMessage"] = str(message)[:400]
            out["syncError"] = str(message)[:400]
            out["syncErrorAt"] = now
        elif not any(_trait_broken(props, streams, s) for s in others):
            out["syncState"] = state
            out["syncMessage"] = str(message)[:400]
        if requested and all(_trait_answered(props, streams, s, requested)
                             for s in others):
            out["syncRequestedAck"] = requested
        return out


    def _trait_progress(phase, done, pending):
        """`{phase, done, total, pending}`, off the drain's own bookkeeping.

        `total` is `done + pending` rather than a number Google never gives: no
        Google listing announces how many rows it will hand over, so the honest
        total is what this run has written plus what it knows it still owes — and
        that is also the one a progress bar can move forward on.
        """
        done, pending = max(0, int(done or 0)), max(0, int(pending or 0))
        return {"phase": phase, "done": done, "total": done + pending,
                "pending": pending}


    def _clock():
        """A SUB-SECOND wall clock, for the budget and the duration only.

        `_now()` truncates to the whole second — deliberately, because that is the
        precision this body's own stamps carry — so a budget measured with it
        cannot see anything shorter than a second, and every invocation inside one
        second reads as zero elapsed. That is not a theoretical gap: a whole drain
        over the e2e fixtures fits inside a second, so the bound could not be
        tested at all, and a duration in milliseconds was always a multiple of a
        thousand.
        """
        return _dt.datetime.now(_dt.timezone.utc).timestamp()


    def _trait_begin(cur):
        """Stamp when THIS account's walk began, once per account in the chain."""
        if not cur.get("traitStartTs"):
            cur["traitStartedAt"] = _iso(_now())
            cur["traitStartTs"] = _clock()
        return cur


    def _trait_run(cur):
        """The start instant and the elapsed milliseconds for the patch that ends
        this account's walk — or nothing at all on the record-sourced path, where
        the dispatcher stamps both itself and a second hand writing them would be
        one hand too many (decision 0085)."""
        if not cur.get("scheduled") or not cur.get("traitStartedAt"):
            return "", None
        began = float(cur.get("traitStartTs") or 0)
        if not began:
            return str(cur["traitStartedAt"]), None
        return str(cur["traitStartedAt"]), int((_clock() - began) * 1000)


    def _carry_trait(cur, nxt):
        """A rebuilt cursor keeps WHICH PATH drove the run, THE CHAIN'S OWN CLOCK
        and the budget it is measured against.

        The chain's clock is the one thing a rebuilt cursor must never lose: the
        engine's drain deadline is cumulative over the WHOLE chain — every
        account, every page, every sweep — so a cursor that starts the clock again
        at the next account is a chain that walks straight through the deadline
        and PARKS, which is exactly what every hourly `google-gmail-scheduled`
        fire did in production. The account's OWN walk start (`traitStartedAt`) is
        deliberately not carried: that one belongs to the account, and the next
        account's walk begins when it begins.
        """
        if cur.get("scheduled"):
            nxt["scheduled"] = True
        if cur.get("startedAt"):
            nxt["startedAt"] = cur["startedAt"]
        if cur.get("hops"):
            nxt["hops"] = int(cur["hops"])
        if cur.get("drainBudgetMs"):
            nxt["drainBudgetMs"] = cur["drainBudgetMs"]
        return nxt


    def _chain_begin(cur):
        """Start the chain's wall clock on the first invocation that walks."""
        if not cur.get("startedAt"):
            cur["startedAt"] = _clock()
        return cur


    def _drain_budget(cfg, cur):
        """Resolve this run's drain budget onto the cursor.

        THE ENGINE GIVES A CONTINUATION CHAIN TWO MINUTES, cumulatively, and a
        chain that keeps continuing past it is PARKED — the effects it committed
        stand, but the delivery is recorded as a failure, which is what every
        hourly Google fire looked like in production until each stream learned to
        stop itself. `DRAIN_SECONDS` is the built-in bound, under the engine's so
        the final stamp's transaction still fits; `config.drainBudgetMs` overrides
        it, clamped, for the same reason `config.apiBase` exists — so a test can
        prove the bound instead of trusting it, and so an operator can follow the
        engine's deadline if it ever moves.

        MILLISECONDS, because a budget of one second is longer than a whole drain
        over the e2e fixtures: the bound never tripped, and a scenario that cannot
        tell a drain that stopped itself from one that simply finished is testing
        nothing. At 1 ms the first check hands back.
        """
        props = ((cfg.get("inputs") or {}).get("client") or {}).get("properties") or {}
        try:
            want = int(props.get("drainBudgetMs") or 0)
        except (TypeError, ValueError):
            want = 0
        if want > 0:
            cur["drainBudgetMs"] = max(1, min(want, 110000))
        return cur


    def _drain_seconds(cur):
        """The seconds this chain may spend before it hands back."""
        try:
            held = int(cur.get("drainBudgetMs") or 0)
        except (TypeError, ValueError):
            held = 0
        return (held / 1000.0) if held > 0 else float(DRAIN_SECONDS)


    def _out_of_time(cur):
        """Has this chain spent its wall-clock budget?"""
        began = float(cur.get("startedAt") or 0)
        return bool(began) and (_clock() - began) >= _drain_seconds(cur)


    def _erroring(batch, acct, reason, retry_at=""):
        # ONE bounded stamp per episode (F2/F3). The failure is recorded on
        # THIS STREAM's own status property, so a gmail failure can never
        # swallow a calendar one (and vice versa) the way a single shared
        # rollup did; the account-level rollup the console reads generically
        # is raised too, but only when it is not already erroring — that is
        # what keeps the account's own update from re-firing the on-connect
        # trigger into a two-stream ping-pong. NEITHER lastSyncedAt NOR
        # gmailLastSyncedAt is written — the run did not complete, so the
        # cadence must keep retrying and the next window floor must not
        # advance past mail this run never read.
        props = acct.get("properties") or {}
        status = "erroring: " + str(reason)[:REASON_MAX]
        now = _iso(_now())
        # A RATE LIMIT IS NOT A BREAKAGE. The trait spells the wall `throttled`
        # beside `erroring` (decision 0085): an account waiting out a
        # `Retry-After` is healthy and busy, and a page that painted it red would
        # send the owner looking for a fault that is not there. The legacy
        # sentence keeps its `erroring:` prefix, which the runner and the seed
        # parse.
        state = "throttled" if retry_at else "erroring"
        stamp = _ack(props, {}, "gmail")
        # A 429 SAYS WHEN, and the wall is the ACCOUNT's: every stream is behind
        # the same quota, so one stream meeting it stops the other two walking
        # into it too (docs/provider-practices.md §5). Stamped even when the
        # status has not moved — a second 429 may name a later instant.
        if retry_at:
            stamp["retryNotBefore"] = retry_at
        # Acknowledged even when the status has not moved: an unacknowledged
        # request re-fires the on-request trigger against the same failure.
        if str(props.get("gmailSyncStatus") or "") == status:
            if stamp:
                # ONLY WHEN THE ACK MOVED. The account is patched here because a
                # new request arrived, so the trait's half of that answer rides
                # with the legacy one — the two are never out of step — and the
                # failure is re-stated with it. A tick that changes NOTHING
                # returns above without a patch, so an unchanged failure never
                # moves `syncErrorAt` for no news.
                stamp.update(_trait_stamp(props, "gmail", state, status, now))
                batch.patch((acct.get("kind") or ACCOUNT_TYPE), acct.get("id"),
                            properties=stamp)
            return
        stamp["gmailSyncStatus"] = status
        if not str(props.get("syncStatus") or "").startswith("erroring"):
            stamp["syncStatus"] = status
        # The trait's account-level state, its message and the two error fields.
        # `_trait_stamp` raises the state itself and never clears it over another
        # enabled stream's live failure, so the legacy guard above is not repeated
        # here: a failure is the newest thing this account knows.
        stamp.update(_trait_stamp(props, "gmail", state, status, now))
        batch.patch((acct.get("kind") or ACCOUNT_TYPE), acct.get("id"),
                    properties=stamp)


    # --------------------------------------------------------------------------
    # the drain
    # --------------------------------------------------------------------------

    def _fresh(queue, calls=0):
        return {"phase": "plan", "queue": queue, "runHistoryId": "",
                "historyId": "", "generation": "", "floor": "", "anchor": "",
                "pageToken": "", "pages": 0, "pending": [], "back": "backfill",
                "after": "", "sweep": False, "resume": {}, "records": 0,
                "skipped": 0, "calls": calls, "seen": [], "seenOverflow": False,
                "rethread": [], "stale": [], "staleOverflow": False,
                "threadMisses": 0, "threadsOff": False}


    def _spent(cur, reserve=0):
        # The engine's drain deadline is CUMULATIVE over the whole chain, so
        # both counters ride across accounts rather than resetting per account.
        # `reserve` is what the caller still owes AFTER this call: a list page
        # owes four hydrates and a stamp, and a page listed with no budget to
        # hydrate it is a page the sweep would read as deleted.
        #
        # THE CLOCK IS THE HALF THAT WAS MISSING. Twelve invocations is a bound
        # on calls, not on time, and twelve invocations of twenty-five hydrates
        # each is minutes against the real API — which is why every scheduled
        # fire parked. Whichever bound is reached first stops the chain.
        return int(cur.get("calls") or 0) + reserve >= MAX_CALLS or _out_of_time(cur)


    def _resume(**fields):
        """The resume object, with every EMPTY value dropped (T-003).

        `gmailBackfillResume` is a DECLARED object, and `floor` in it is a
        `datetime`. `backfillDepth: all` has no floor — the window reaches the
        epoch — so this dict carried `floor: ""`, and the engine refused the whole
        patch with

            props.gmailBackfillResume: .floor: expected an RFC 3339 instant

        which is a 422 on the effect that RECORDS THE OWED SWEEP. The drain parked
        mid-chain, the reconciliation was never persisted, and the rows the window
        no longer named lived forever — the whole of T-003, on every account whose
        depth is `all`, which is every seeded one. An absent field reads back as
        absent, and every reader here already spells `held.get(k) or ""`, so
        dropping it is exactly equivalent and legal.
        """
        return {k: v for k, v in fields.items() if v not in ("", None, [], {})}


    def _snapshot(cur):
        """The reconciliation evidence, as the resume carries it across runs.

        `seen` and `seenOverflow` ARE the snapshot: version 18's `_hold` dropped
        both, so a capped 404 re-read resumed with an empty set and its final
        sweep deleted every row the earlier runs had hydrated (Codex §4.4.1).
        Past SEEN_MAX the set is not carried — the overflow flag is, and it
        disables deletion until a complete walk rebuilds the evidence.
        """
        seen = list(cur.get("seen") or ())
        if cur.get("seenOverflow") or len(seen) > SEEN_MAX:
            return [], True
        return seen, False


    def _hold(host, aid, cur, next_page):
        """Persist the unfinished walk and stop walking for this run: the page
        token, its window, its generation, its watermark, whether a sweep is
        still owed, AND the rows it has re-stamped so far.

        The sweep is cleared LOCALLY. A truncated walk has NOT re-stamped the
        rows it never reached, so running the generation compare now would
        delete every in-window row behind the page token — the whole archive
        under `backfillDepth: all`, where the window has no floor at all. The
        run that finally drains the walk restores the flag and sweeps then."""
        host.log("google-gmail: backfill walk truncated for %s — resuming "
                 "next run" % aid)
        seen, overflow = _snapshot(cur)
        cur["resume"] = _resume(pageToken=next_page,
                                floor=cur.get("floor") or "",
                                generation=cur.get("generation") or "",
                                historyId=cur.get("runHistoryId") or "",
                                maxHistoryId=cur.get("maxHistoryId") or "",
                                sweep=bool(cur.get("sweep")),
                                seen=seen, seenOverflow=overflow)
        cur["pageToken"] = ""
        cur["sweep"] = False
        cur["back"] = "finish"


    def _hold_pending(host, aid, cur):
        """Stop in the MIDDLE of a page's hydrates and persist the message ids it
        listed but did not fetch.

        The other two holds stop at a PAGE boundary, where the page token is the
        whole of what is owed. This one stops between two hydrate batches, and
        what is owed there is a set of ids no token can re-derive: the walk has
        moved past the listing that named them, so dropping them would lose those
        messages until the next full re-read. They ride on the resume beside the
        page token, and `_plan_account` starts the next run in the hydrate phase
        on exactly them.
        """
        held = dict(cur.get("resume") or {})
        pending = [str(m) for m in (cur.get("pending") or []) if m]
        seen, overflow = _snapshot(cur)
        if len(pending) > PENDING_HOLD_MAX:
            # NOT TRUNCATED, only noticed. Dropping the tail would lose those
            # messages until the next full re-read, and no listing token can
            # re-derive them; a list page is a hundred ids, so a set this large
            # means something upstream changed and is worth a line in the log.
            host.log("google-gmail: %s parks %d unfetched message ids at the "
                     "hand-back, well past the %d a page should hold"
                     % (aid, len(pending), PENDING_HOLD_MAX))
        held.update(_resume(
            pending=pending,
            back=str(cur.get("back") or "finish"),
            pageToken=held.get("pageToken") or cur.get("pageToken") or "",
            floor=cur.get("floor") or held.get("floor") or "",
            generation=cur.get("generation") or held.get("generation") or "",
            historyId=cur.get("runHistoryId") or held.get("historyId") or "",
            maxHistoryId=cur.get("maxHistoryId") or held.get("maxHistoryId") or "",
            sweep=bool(cur.get("sweep")) or bool(held.get("sweep")),
            seen=seen, seenOverflow=overflow))
        host.log("google-gmail: the drain's budget is spent inside %s with %d "
                 "message(s) listed and not fetched — they ride on the account "
                 "and the next run hydrates them first" % (aid, len(pending)))
        cur["resume"] = held
        cur["pending"] = []
        cur["pageToken"] = ""
        cur["sweep"] = False
        cur["back"] = "finish"


    def _hold_history(host, aid, cur, next_page):
        """Persist the unfinished history delta: the page token AND the
        startHistoryId it belongs to.

        Version 18 stopped without a cursor, so a backlog larger than one run's
        invocation budget replayed its own prefix every run and never reached
        its tail (Codex §4.4.6). The WATERMARK still does not advance — `_stamp`
        withholds it while a continuation is owed — so a stale token next run
        costs one re-read from the same floor rather than a gap.
        """
        host.log("google-gmail: history delta truncated for %s — the watermark "
                 "stands and the next run resumes at the stored page" % aid)
        cur["resume"] = _resume(historyToken=next_page,
                                historyId=cur.get("historyId") or "",
                                sweep=bool(cur.get("sweep")))
        cur["pageToken"] = ""
        cur["back"] = "finish"


    def _owe_sweep(batch, acct, aid, cur):
        """Record the sweep this run still owes, and its evidence, on the
        account — BEFORE the first delete. `_stamp` reads the same dict back to
        decide that no completion may be reported yet."""
        seen, overflow = _snapshot(cur)
        cur["resume"] = _resume(sweep=True,
                                floor=cur.get("floor") or "",
                                generation=cur.get("generation") or "",
                                historyId=cur.get("runHistoryId") or "",
                                maxHistoryId=cur.get("maxHistoryId") or "",
                                seen=seen, seenOverflow=overflow)
        batch.patch((acct.get("kind") or ACCOUNT_TYPE), aid,
                    properties={"gmailBackfillResume": cur["resume"],
                                "gmailSyncStatus": "ok (reconciling)"})


    def _sync_labels(host, batch, aid, base, token):
        """`users.labels.list` -> `gmaillabel` rows, once per account per run.

        FIRST, BEFORE ANY MESSAGE, because `gmailmessage.labels` points here and a
        reference's target should exist when the row naming it applies.

        THE LISTING IS AUTHORITATIVE AND COMPLETE. `users.labels.list` takes no
        page token and returns EVERY label in one response — so unlike the
        message window there is no scope to reason about: what the response does
        not name is gone, and it is retracted here rather than left to rot. That
        is the T-003 lesson applied to a listing small enough (tens of rows) to
        reconcile inline.

        One call, and it is not allowed to cost the drain its budget: a failure
        is LOGGED and the stream carries on with the labels it already had.
        Messages matter more than their labels, and a 403 on this one call must
        not park a mailbox.
        """
        try:
            resp = _get(base, token, "/gmail/v1/users/me/labels")
        except Exception as e:
            host.log("google-gmail: %s could not read its labels (%s) — the "
                     "message walk carries on and `labels` references resolve "
                     "against whatever is already stored" % (aid, _reason(e)))
            return
        live = set()
        for label in resp.get("labels") or []:
            if not isinstance(label, dict):
                continue
            lid = label.get("id")
            if not isinstance(lid, str) or not lid:
                continue
            rid = _label_id(host, aid, lid)
            live.add(rid)
            props = {"account": aid, "labelId": lid}
            # The list call is AUTHORITATIVE for the fields it returns and silent
            # about the four counts, which only `users.labels.get` fills — so an
            # absent count is left ABSENT and never written zero, while an absent
            # visibility IS a null (the label does not have one).
            props["name"] = str(label["name"]) if "name" in label else None
            for key in ("messageListVisibility", "labelListVisibility", "type"):
                props[key] = _label_enum(host, key, label.get(key)) \
                    if key in label else None
            colour = label.get("color")
            if isinstance(colour, dict):
                out = {}
                for key in ("textColor", "backgroundColor"):
                    if isinstance(colour.get(key), str) and colour[key]:
                        out[key] = colour[key]
                props["color"] = out or None
            elif "color" in label:
                props["color"] = None
            batch.put(LABEL_TYPE, rid, properties=props)
        if not live:
            return
        # What the complete listing did not name is gone.
        after, dropped = "", 0
        for _ in range(20):
            page = host.records.list(LABEL_TYPE, where={"account": {"eq": aid}},
                                     first=200, after=after or None)
            for ent in page.get("records") or []:
                rid = str(ent.get("id") or "")
                if rid and rid not in live:
                    batch.delete(LABEL_TYPE, rid)
                    dropped += 1
            after = page.get("cursor") or ""
            if not after:
                break
        host.log("google-gmail: %s has %d labels%s"
                 % (aid, len(live), ", %d retracted" % dropped if dropped else ""))


    def _plan_account(host, aid, props, base, token, cur):
        # The WATERMARK (F5), one quota unit: the run-start historyId, read
        # before a single message is, stamped only on completion.
        profile = _get(base, token, "/gmail/v1/users/me/profile")
        cur["runHistoryId"] = str(profile.get("historyId") or "")
        anchor = str(props.get("gmailBackfillAnchorAt") or "")
        if not anchor:
            anchor = _iso(_now())
            cur["anchor"] = anchor
        held = props.get("gmailBackfillResume") or {}
        if isinstance(held, str):
            try:
                held = _json.loads(held)
            except ValueError:
                held = {}
        if not isinstance(held, dict):
            held = {}
        if held.get("pending"):
            # An earlier fire stopped between two hydrate batches: fetch exactly
            # the ids it listed and never reached, and only then carry on where it
            # was — its page token, its window, its generation, its watermark.
            # BEFORE the page-token branch, because both may be held at once and
            # the unfetched ids are the older debt.
            cur.update({"phase": "hydrate",
                        "pending": [str(m) for m in held["pending"] if m],
                        "back": str(held.get("back") or "finish"),
                        "pageToken": held.get("pageToken") or "",
                        "floor": held.get("floor") or "",
                        "generation": held.get("generation") or uuid.uuid4().hex,
                        "sweep": bool(held.get("sweep")),
                        "seen": [str(x) for x in (held.get("seen") or []) if x],
                        "seenOverflow": bool(held.get("seenOverflow")),
                        "maxHistoryId": held.get("maxHistoryId") or "",
                        "runHistoryId": (held.get("historyId")
                                         or cur["runHistoryId"])})
            return cur
        if held.get("pageToken"):
            # An earlier run hit a per-run cap: resume ITS walk, under ITS
            # window and generation — and under ITS watermark. The historyId
            # must NOT advance to this run's: a backfill walks newest-first,
            # so mail that arrived after the walk began sits BEHIND the page
            # token, and only the original run-start floor will let the next
            # incremental pass pick it up.
            #
            # `sweep`, `seen` and `seenOverflow` are restored with the rest.
            # Without the flag the reconciliation a 404 full re-read owes would
            # be silently lost; without the evidence the sweep that finally runs
            # would judge the whole window on one run's rows.
            seen = [str(x) for x in (held.get("seen") or []) if x]
            cur.update({"phase": "backfill", "pageToken": held["pageToken"],
                        "floor": held.get("floor") or "",
                        "generation": held.get("generation") or uuid.uuid4().hex,
                        "sweep": bool(held.get("sweep")),
                        "seen": seen,
                        "seenOverflow": bool(held.get("seenOverflow")),
                        "maxHistoryId": held.get("maxHistoryId") or "",
                        "runHistoryId": (held.get("historyId")
                                         or cur["runHistoryId"])})
            return cur
        if held.get("historyToken") and held.get("historyId"):
            cur.update({"phase": "history", "historyId": str(held["historyId"]),
                        "pageToken": str(held["historyToken"]),
                        "sweep": bool(held.get("sweep"))})
            return cur
        if held.get("sweep"):
            # A walk that completed and then lost its chain to the engine's
            # deadline part-way through reconciling. Resume INTO the sweep,
            # under the window and the evidence that walk recorded.
            cur.update({"phase": "sweepmessages", "after": "",
                        "floor": held.get("floor") or "",
                        "generation": held.get("generation") or "",
                        "seen": [str(x) for x in (held.get("seen") or []) if x],
                        "seenOverflow": bool(held.get("seenOverflow")),
                        "resume": dict(held),
                        "maxHistoryId": held.get("maxHistoryId") or "",
                        "runHistoryId": (held.get("historyId")
                                         or cur["runHistoryId"])})
            return cur
        history_id = str(props.get("gmailHistoryId") or "")
        # AN UNSPENT REQUEST STARTS OVER, for the reason the contacts stream does:
        # a history delta against an intact cursor reports nothing changed while
        # every row it accounts for has been purged. The request drops to the
        # backfill walk — the same path a 404 history takes — which re-reads the
        # window and sweeps what it does not re-stamp.
        if history_id and not _requested(props):
            cur.update({"phase": "history", "historyId": history_id})
            return cur
        # A REQUESTED RESTART SWEEPS, exactly like the 404 path below it. The
        # walk is the authority for the window it covers, so what the listing no
        # longer names is gone — and without the sweep a row hydrated by an
        # EARLIER listing (a message the mailbox has since dropped out of the
        # window, or a recording set that was re-cut) survives forever, which is
        # how a seeded account ended up with one message row more than its own
        # listing accounts for. A FIRST sync sweeps nothing: there is nothing
        # behind it to retract, and `seen` would be the whole walk for no reason.
        cur.update({"phase": "backfill", "floor": _floor(props, anchor),
                    "generation": uuid.uuid4().hex,
                    "sweep": bool(history_id and _requested(props)),
                    "seen": [], "seenOverflow": False})
        return cur


    def _list_params(cur):
        params = {"maxResults": LIST_PAGE,
                  # The mailbox this stream mirrors is the WHOLE mailbox, because
                  # users.history.list reports Spam and Trash whether we ask or
                  # not. A listing that excluded them would let the next windowed
                  # re-read read their absence as a deletion (Codex §4.4.9).
                  "includeSpamTrash": "true"}
        query = _query(cur.get("floor") or "")
        if query:
            params["q"] = query
        return params


    def _backfill(host, batch, aid, acct, base, token, cur):
        if _spent(cur, CALL_RESERVE):
            # The invocation budget is gone or too thin to hydrate what this
            # page would list. A page listed with no budget left to fetch it is
            # a page whose ids the next sweep would read as deleted.
            if cur.get("pageToken"):
                _hold(host, aid, cur, cur["pageToken"])
                cur["pending"] = []
                return _stamp(host, batch, aid, acct, cur)
            # Nothing walked yet: nothing is stamped either, so `_due` still
            # holds and the next scheduled run starts this account over.
            host.log("google-gmail: no invocation budget left to start %s — it "
                     "syncs on the next run" % aid)
            return {}
        params = _list_params(cur)
        if cur.get("pageToken"):
            params["pageToken"] = cur["pageToken"]
        try:
            resp = _get(base, token, "/gmail/v1/users/me/messages", params)
        except urllib.error.HTTPError as e:
            if not cur.get("pageToken") or not _bad_page_token(e):
                raise
            # A Gmail list page token is SHORT-LIVED. Held across a run
            # boundary it goes stale, 400s, stamps erroring, and the next run
            # resumes the same dead token — forever. Restart THIS window from
            # page one under the same floor and the same generation instead.
            # The snapshot evidence is RESET with it: the restarted walk
            # re-stamps every page from the first, so the old ids are not this
            # snapshot's (Codex §4.4.8).
            host.log("google-gmail: stale backfill page token for %s — "
                     "restarting the window with a fresh snapshot" % aid)
            cur.update({"pageToken": "", "pages": 0, "seen": [],
                        "seenOverflow": False})
            params.pop("pageToken", None)
            resp = _get(base, token, "/gmail/v1/users/me/messages", params)
        cur["pending"] = [str(m.get("id")) for m in (resp.get("messages") or [])
                          if m.get("id")]
        cur["pages"] = int(cur.get("pages") or 0) + 1
        next_page = resp.get("nextPageToken") or ""
        if next_page and (cur["pages"] >= MAX_LIST_PAGES
                          or _spent(cur, CALL_RESERVE)):
            # F13 / beeper H5: a cold start is bounded — by list pages AND by
            # invocations — and the truncation is never silent: the unfinished
            # walk is logged AND persisted on the account, and the next run
            # resumes it before anything else.
            _hold(host, aid, cur, next_page)
        elif next_page:
            cur["pageToken"] = next_page
            cur["back"] = "backfill"
        else:
            cur["pageToken"] = ""
            cur["back"] = "finish"
        cur["phase"] = "hydrate"
        return {"more": host.page.more(cur)}


    def _history(host, batch, aid, acct, base, token, cur):
        params = {"startHistoryId": cur.get("historyId") or "", "maxResults": 500}
        if cur.get("pageToken"):
            params["pageToken"] = cur["pageToken"]
        try:
            resp = _get(base, token, "/gmail/v1/users/me/history", params)
        except urllib.error.HTTPError as e:
            if _status(e) == 400 and cur.get("pageToken") and _bad_page_token(e):
                # A stored history page token went stale between runs. The
                # watermark never advanced, so the delta is simply re-read from
                # its start rather than lost.
                host.log("google-gmail: stale history page token for %s — "
                         "re-reading the delta from its watermark" % aid)
                cur["pageToken"] = ""
                params.pop("pageToken", None)
                resp = _get(base, token, "/gmail/v1/users/me/history", params)
            elif _status(e) != 404:
                # ONLY 404 means "that historyId is too old to serve". A 400
                # is a request bug and a 403 a scope problem; neither may
                # silently become a full re-read.
                raise
            else:
                host.log("google-gmail: historyId too old for %s — windowed full "
                         "re-read" % aid)
                props = acct.get("properties") or {}
                anchor = (cur.get("anchor")
                          or str(props.get("gmailBackfillAnchorAt") or "")
                          or _iso(_now()))
                cur.update({"phase": "backfill", "pageToken": "", "pages": 0,
                            "floor": _floor(props, anchor),
                            "generation": uuid.uuid4().hex, "sweep": True,
                            "seen": [], "seenOverflow": False})
                return _backfill(host, batch, aid, acct, base, token, cur)
        touched, dropped, threads, alive = [], set(), {}, set()
        for h in resp.get("history") or []:
            for item in h.get("messagesDeleted") or []:
                msg = (item or {}).get("message") or {}
                mid = str(msg.get("id") or "")
                if not mid:
                    continue
                dropped.add(mid)
                tid = str(msg.get("threadId") or "")
                if tid:
                    # The thread each retraction leaves behind, so a thread
                    # whose LAST message just died can be retracted too.
                    threads.setdefault(tid, set()).add(_message_id(host, aid, mid))
            for key in ("messagesAdded", "labelsAdded", "labelsRemoved"):
                for item in h.get(key) or []:
                    msg = (item or {}).get("message") or {}
                    mid = str(msg.get("id") or "")
                    if not mid:
                        continue
                    touched.append(mid)
                    tid = str(msg.get("threadId") or "")
                    if tid:
                        alive.add(tid)
        if dropped:
            _drop(host, batch, aid, sorted(dropped))
            _retract_threads(host, batch, aid, threads, alive)
            # The same carry as the hydrate's (T-048): a thread this delta says
            # survived is re-read below, and its membership was read before the
            # deletion this page is applying. Without the carry that re-read
            # mints the deleted message back as a thin row.
            cur["gone"] = sorted(set(str(x) for x in (cur.get("gone") or ()) if x)
                                 | dropped)[:GONE_MAX]
        # A thread that SURVIVED a deletion has a membership this sync last read
        # before that message died. Re-read it: nothing else in the stream ever
        # revisits it, and a stale `messages` array is exactly what §2.3 refuses
        # to let this kind advertise (Codex §4.4.4).
        rethread = list(cur.get("rethread") or [])
        for tid in sorted(threads):
            if tid in alive and tid not in rethread:
                rethread.append(tid)
        cur["rethread"] = rethread
        pending, seen = [], set()
        for mid in touched:
            if mid in dropped or mid in seen:
                continue
            seen.add(mid)
            pending.append(mid)
        cur["pending"] = pending
        next_page = resp.get("nextPageToken") or ""
        if next_page and _spent(cur, CALL_RESERVE):
            _hold_history(host, aid, cur, next_page)
            next_page = ""
        else:
            cur["back"] = "history" if next_page else "finish"
        cur["pageToken"] = next_page
        cur["phase"] = "hydrate"
        return {"more": host.page.more(cur)}


    def _hydrate(host, batch, aid, base, token, cur):
        pending = list(cur.get("pending") or [])
        batch_ids, rest = pending[:HYDRATE], pending[HYDRATE:]
        msgs, vanished = [], []
        skipped = int(cur.get("skipped") or 0)
        for mid in batch_ids:
            path = "/gmail/v1/users/me/messages/" + urllib.parse.quote(mid, safe="")
            try:
                msgs.append(_get(base, token, path, {"format": "full"}))
            except urllib.error.HTTPError as e:
                if _status(e) != 404:
                    raise
                # Gone between the listing and the fetch: retract whatever is
                # there and count it, so the stamp says "ok (N skipped)".
                host.log("google-gmail: message %s vanished for %s" % (mid, aid))
                vanished.append(mid)
                skipped += 1
        addresses, tids, records, incomplete = _plan(host, aid, msgs)
        skipped += incomplete
        # THE SWEEP'S FENCE IS RAISED BY WHAT THIS WALK ACTUALLY SAW (T-003).
        # `runHistoryId` is the profile read at the START of the run, and it is
        # NOT the top of the mailbox: every message that arrived between that
        # read and this listing carries a higher `historyId`, and so does every
        # row an earlier, differently-cut pull wrote. `_sweep_messages` skipped
        # anything above the fence as "a competing run's", which made those rows
        # permanently unsweepable — 47 of the 147 hydrated messages in the
        # owner's own noodles pull sit above its profile recording. The high
        # water mark of this walk's OWN reads is the honest fence: a row above
        # THAT was written by something this snapshot cannot account for.
        for msg in msgs:
            if isinstance(msg, dict) and msg.get("historyId"):
                if _digits(msg["historyId"]) > _digits(cur.get("maxHistoryId")):
                    cur["maxHistoryId"] = str(msg["historyId"])
        seen_ids = set(cur.get("seen") or ())
        # THE WRITE ORDER, and it is the whole of Codex §4.4.5: the address hub
        # rows, then the THIN thread identities the messages reference, then the
        # messages, then the authoritative Thread rows whose `messages` array
        # points back at them.
        _stage_addresses(host, batch, aid, addresses)
        # A thread a deletion left behind is re-read here too, so its membership
        # is never left naming a message that is gone.
        rethread = [t for t in (cur.get("rethread") or []) if t not in tids]
        wanted = sorted(tids) + rethread
        _stage_thin_threads(host, batch, aid, tids, seen_ids)
        # WHAT THIS WALK HAS RETRACTED, carried on the cursor across its pages:
        # a message 404'd on one page can be named by a `threads.get` on the
        # next, and `_stage_threads` must not mint it back (T-048). The cursor
        # is a run's, not an account's, so this set dies with the run; it is
        # capped for the same reason `seen` is.
        gone = set(str(x) for x in (cur.get("gone") or ()) if x)
        if vanished:
            _drop(host, batch, aid, vanished)
            gone |= set(vanished)
            cur["gone"] = sorted(gone)[:GONE_MAX]
        _stage_messages(host, batch, aid, records, seen_ids)
        reads = {}
        hydrated = {rec["id"] for rec in records}
        for tid in wanted[:THREAD_READS]:
            thread = _thread_read(host, base, token, tid, cur)
            if thread is not None:
                reads[tid] = thread
        unread = wanted[THREAD_READS:]
        _stage_threads(host, batch, aid, reads, hydrated, seen_ids, gone)
        cur["rethread"] = [t for t in unread if t in rethread]
        # The ids this windowed re-read wrote, back onto the cursor: the sweep
        # mark the engine cannot yet hold as a label (README, ask 1).
        if len(seen_ids) <= SEEN_MAX:
            cur["seen"] = sorted(seen_ids)
        else:
            cur["seen"] = []
            cur["seenOverflow"] = True
        cur["pending"] = rest
        cur["skipped"] = skipped
        cur["records"] = int(cur.get("records") or 0) + len(records)
        if not rest:
            cur["phase"] = cur.get("back") or "finish"
        return {"more": host.page.more(cur)}


    def _sweep_messages(host, batch, aid, cur):
        """Retract the messages the windowed re-read did not write.

        SCOPED to the re-read WINDOW: Gmail's full read is a window, not the
        whole mailbox, so an unscoped compare would delete the archive the
        window never touched.

        WHAT IT COMPARES AGAINST is the SET OF ROW IDS this read wrote, carried
        on the cursor and across runs on the account's resume — not a
        `syncGeneration` on each row, which is sync bookkeeping on a mirror, and
        not the label the guide prescribes, which `host.effects` cannot write
        (README, ask 1). Past SEEN_MAX ids the set is dropped and the sweep
        skipped, because deleting on a truncated set would retract live rows.

        THE FENCE: a row whose stored `historyId` is NEWER than anything this
        snapshot read was written after the snapshot began — by a competing run,
        or by a delivery this walk could not have seen — and is not this
        snapshot's to judge (Codex §4.2, "concurrency is not reconciled by seen
        sets").

        THE FENCE IS THE WALK'S HIGH WATER MARK, NOT THE RUN'S PROFILE READ
        (T-003). `runHistoryId` comes off `users.getProfile` at the start of the
        run; mail that lands between that call and the listing carries a higher
        `historyId`, and so does every row an earlier pull wrote. Fencing on the
        profile alone therefore declared ordinary rows untouchable forever: 47 of
        147 hydrated messages in the owner's noodles pull sit above its profile
        recording, and a stale row among them can never be retracted. The fence
        is `max(runHistoryId, the highest historyId this walk read)`.

        IT IS ALSO PROVABLE NOW. The sweep logs the window it is scoped to, the
        size of the seen set, the fence it is using, and every id it retracts
        with the reason — because "the sweep ran and the row survived" was a
        sentence nobody could check.
        """
        if cur.get("seenOverflow"):
            host.log("google-gmail: %s re-read more than %d rows in one window — "
                     "the sweep is skipped (README, ask 1)" % (aid, SEEN_MAX))
            return False
        seen = set(cur.get("seen") or ())
        where = {"account": {"eq": aid}}
        floor = cur.get("floor") or ""
        if floor:
            where["at"] = {"gte": floor}
        page = host.records.list(MESSAGE_TYPE, where=where, first=SWEEP_PAGE,
                                 after=cur.get("after") or None)
        fence = max(_digits(cur.get("runHistoryId")),
                    _digits(cur.get("maxHistoryId")))
        if not cur.get("after"):
            host.log("google-gmail: sweep %s begins — generation %s, window %s, "
                     "%d ids seen, fence historyId %s (run %s, walk high water "
                     "%s)" % (aid, cur.get("generation") or "?", floor or "(all)",
                              len(seen), fence or "(none)",
                              cur.get("runHistoryId") or "-",
                              cur.get("maxHistoryId") or "-"))
        stale = list(cur.get("stale") or [])
        fenced = int(cur.get("sweepFenced") or 0)
        retracted = int(cur.get("sweepRetracted") or 0)
        for ent in page.get("records") or []:
            rid = str(ent.get("id") or "")
            if not rid or rid in seen:
                continue
            row = (host.records.get(MESSAGE_TYPE, rid) or {}).get("properties") or {}
            if fence and _digits(row.get("historyId")) > fence:
                fenced += 1
                host.log("google-gmail: sweep %s keeps %s — its historyId %s is "
                         "above this snapshot's fence %s, so another run wrote it"
                         % (aid, rid, row.get("historyId"), fence))
                continue
            tref = _refid(row.get("thread"))
            if tref and tref not in stale:
                if len(stale) < STALE_MAX:
                    stale.append(tref)
                else:
                    cur["staleOverflow"] = True
            retracted += 1
            host.log("google-gmail: sweep %s retracts %s (messageId %s, historyId "
                     "%s) — this window's listing no longer names it"
                     % (aid, rid, row.get("messageId"), row.get("historyId")))
            batch.delete(MESSAGE_TYPE, rid)
        cur["stale"] = stale
        cur["sweepFenced"] = fenced
        cur["sweepRetracted"] = retracted
        cur["after"] = page.get("cursor") or ""
        if not cur["after"]:
            host.log("google-gmail: sweep %s done — %d retracted, %d kept behind "
                     "the fence, %d threads queued for the thread sweep"
                     % (aid, retracted, fenced, len(stale)))
        return bool(cur["after"])


    def _sweep_threads(host, batch, aid, cur):
        """Reconcile the threads the message sweep emptied.

        A Thread carries NO instant of its own, so there is no window to compare
        one against — version 18 filtered thread rows on an `at` this kind does
        not declare, and the filter matched nothing or failed (Codex §4.4.2).
        The surviving messages are the authority instead: a thread nothing names
        any more is a thread whose messages all went, and only those threads are
        considered. The message deletes were flushed at the end of an earlier
        invocation, so the listing below sees the mailbox as it now stands.
        """
        stale = list(cur.get("stale") or [])
        if not stale:
            if cur.get("staleOverflow"):
                host.log("google-gmail: %s emptied more than %d threads in one "
                         "window — the rest keep their rows until a later sweep"
                         % (aid, STALE_MAX))
            return False
        tref = stale[0]
        cur["stale"] = stale[1:]
        page = host.records.list(MESSAGE_TYPE,
                                 where={"account": {"eq": aid},
                                        "thread": {"eq": tref}}, first=1)
        if not (page.get("records") or []):
            live = _live(host, (THREAD_TYPE,), [tref])
            if ("%s|%s" % (THREAD_TYPE, tref)) in live:
                batch.delete(THREAD_TYPE, tref)
        return True


    def _stamp(host, batch, aid, acct, cur):
        # This stream's own cadence anchor AND the account-level rollup the
        # console reads: whichever stream finishes last owns the rollup, while
        # each stream's `_due` and on-connect guard read their own anchor.
        props = acct.get("properties") or {}
        skipped = int(cur.get("skipped") or 0)
        status = "ok" if skipped == 0 else "ok (%d skipped)" % skipped
        resume = cur.get("resume") or {}
        owed = bool(resume.get("pageToken") or resume.get("historyToken")
                    or resume.get("sweep") or resume.get("pending"))
        # What the next fire picks up, as a COUNT: the messages parked mid-page
        # where there are any, and otherwise the one walk that is owed.
        owes = len(resume.get("pending") or []) or (1 if owed else 0)
        stamp = _ack(props, {}, "gmail")
        # A COMPLETED RUN CLEARS THE 429 WALL. It only got here by calling Google
        # successfully, so whatever `Retry-After` was outstanding is spent.
        if props.get("retryNotBefore"):
            stamp["retryNotBefore"] = None
        stamp.update({"gmailSyncStatus": status, "gmailBackfillResume": resume})
        if owed:
            # SUCCESS IS NOT STAMPED BEFORE RECONCILIATION (Codex §4.2). A run
            # that still owes a page or a sweep leaves `gmailLastSyncedAt`
            # alone, so the very next scheduled tick picks the walk up instead
            # of waiting out a daily cadence on an unfinished reconciliation.
            #
            # AND IT SAYS `pending`, IN THE FLEET'S OWN WORD. The sentence used
            # to read `(resuming)`, which no reader recognises: the end-to-end
            # runner's continuation contract greps the ROLLUP for `N pending`
            # (tools/e2e.py `pending_work`) and the contacts and calendar streams
            # both spell it that way, so a bounded gmail walk was the one
            # hand-back nothing came back for.
            stamp["gmailSyncStatus"] = "%s (%d pending)" % (status, owes)
        else:
            now = _iso(_now())
            stamp["gmailLastSyncedAt"] = now
            stamp["lastSyncedAt"] = now
            # The RUN-START watermark, never the completion clock — and never
            # while a continuation or a sweep is owed, which would let the next
            # run read forward from a delta this one did not finish.
            if cur.get("runHistoryId"):
                stamp["gmailHistoryId"] = cur["runHistoryId"]
        # The shared rollup is rolled up from the account's CURRENT state, not
        # from one stale injected property: a healthy gmail run must not report
        # "ok" over a live CONTACTS failure any more than over a calendar one
        # (Codex §4.4.14).
        others = [str(props.get(k) or "") for k in
                  ("contactsSyncStatus", "calendarSyncStatus",
                   "driveSyncStatus")]
        # A STREAM WITH WORK OWED IS NOT "ok" AT THE ACCOUNT LEVEL either. The
        # runner's continuation contract reads the ROLLUP for the word `pending`,
        # and a stream that finished after the calendar walk handed back with six
        # calendars owed overwrote `ok (6 pending)` with `ok` — so the drain was
        # reported done with a third of the mirror unwritten and nothing stamped
        # `syncRequestedAt` again. A live `erroring` and a live `pending` both
        # hold the rollup.
        if not any(s.startswith("erroring") or "pending" in s for s in others):
            stamp["syncStatus"] = stamp["gmailSyncStatus"]
        if cur.get("anchor"):
            stamp["gmailBackfillAnchorAt"] = cur["anchor"]
        # THE TRAIT'S HALF. A run that still owes a page or a sweep is `ok` with
        # the work counted in `syncProgress.pending` and in this stream's own
        # entry — the trait has no `pending` word and does not need one — and
        # `completed` is false, so no `lastAt` is stamped for the same reason
        # `gmailLastSyncedAt` is not: nothing finished. The two dispatcher
        # properties are written only on the scheduled path.
        started, elapsed = _trait_run(cur)
        stamp.update(_trait_stamp(
            props, "gmail", "ok", stamp["gmailSyncStatus"], _iso(_now()),
            completed=not owed,
            progress=_trait_progress("gmail: " + str(cur.get("phase") or "drain"),
                                     cur.get("records"), owes),
            started=started, elapsed_ms=elapsed))
        batch.patch((acct.get("kind") or ACCOUNT_TYPE), aid, properties=stamp)
        rest = list(cur.get("queue") or [])[1:]
        if rest:
            # The invocation counter rides on: the engine's drain deadline is
            # cumulative over the WHOLE chain, accounts included.
            return {"more": host.page.more(
                _carry_trait(cur, _fresh(rest, int(cur.get("calls") or 0))))}
        return {"output": {"account": aid, "records": int(cur.get("records") or 0),
                           "skipped": skipped}}


    def _drain(host, batch, aid, acct, props, base, token, cur):
        # One invocation, counted. Everything that can outrun the engine's
        # cumulative drain deadline reads this counter.
        cur["calls"] = int(cur.get("calls") or 0) + 1
        # THE CHAIN'S CLOCK, started on the first invocation that walks and
        # carried by every rebuilt cursor after it.
        _chain_begin(cur)
        # WHEN THIS ACCOUNT'S WALK BEGAN, once per account and by the door every
        # resumed cursor comes through, so a walk spanning six invocations
        # reports its own duration rather than its last page's.
        _trait_begin(cur)
        phase = cur.get("phase") or "plan"
        if phase == "plan":
            if _spent(cur, CALL_RESERVE):
                # A later account in the queue, with the chain's budget already
                # spent. It is NOT stamped — nothing was read — so `_due` still
                # holds and the next scheduled run starts here.
                host.log("google-gmail: the drain's invocation budget is spent "
                         "before %s — it syncs on the next run" % aid)
                return {}
            cur = _plan_account(host, aid, props, base, token, cur)
            # The labels, before the first message that references one. Only on a
            # run that actually begins an account's walk — a resumed page must not
            # spend a call re-reading a listing it already reconciled.
            if not (cur.get("resume") or {}).get("sweep"):
                _sync_labels(host, batch, aid, base, token)
            phase = cur["phase"]
        if phase == "hydrate":
            if cur.get("pending") and _out_of_time(cur):
                # OUT OF TIME BETWEEN TWO HYDRATE BATCHES. The invocation counter
                # never saw this coming — it is checked at a list boundary — and
                # continuing here is what walked the chain past the engine's
                # deadline every hour. The ids ride on the account and this fire
                # ends cleanly, `ok` with the rest counted as pending.
                _hold_pending(host, aid, cur)
                return _stamp(host, batch, aid, acct, cur)
            return _hydrate(host, batch, aid, base, token, cur)
        if phase == "backfill":
            return _backfill(host, batch, aid, acct, base, token, cur)
        if phase == "history":
            return _history(host, batch, aid, acct, base, token, cur)
        if phase == "sweepmessages":
            if _sweep_messages(host, batch, aid, cur):
                return {"more": host.page.more(cur)}
            cur["phase"] = "sweepthreads"
            return {"more": host.page.more(cur)}
        if phase == "sweepthreads":
            if _sweep_threads(host, batch, aid, cur):
                return {"more": host.page.more(cur)}
            cur["resume"] = {}
            return _stamp(host, batch, aid, acct, cur)
        if cur.get("sweep"):
            # A full re-read happened: the rows it could not tombstone are the
            # ones this window never wrote. Messages first — they are what a
            # thread's survival is judged by. The OWED RECONCILIATION is
            # persisted before the first delete, so a chain the engine's
            # deadline cuts off mid-sweep resumes into the sweep next run
            # instead of reporting a completed drain (Codex §4.2, "success
            # before reconciliation").
            cur.update({"phase": "sweepmessages", "after": "", "sweep": False})
            _owe_sweep(batch, acct, aid, cur)
            return {"more": host.page.more(cur)}
        return _stamp(host, batch, aid, acct, cur)


    def main(input, host):
        cfg = input.get("config") or {}
        accounts = {a.get("id"): a for a in (cfg.get("accounts") or [])}
        # The paged-checkpoint wrapper: host.page.resume() is the opaque cursor
        # the previous page returned, host.page.more(cursor) builds the
        # continuation. The access token NEVER enters it (the host would
        # refuse the whole invocation if it did).
        resume = host.page.resume() or None
        if resume:
            cur = dict(resume)
        else:
            record = (input.get("envelope") or {}).get("record") or {}
            # The envelope SPLITS identity: `type` is the bare local name and
            # `authority` the authority, so the full identity (ruling A9) has to be
            # recomposed. Comparing the local name alone would match any
            # authority's `account`.
            etype = (record.get("kind") or "")
            if etype == ACCOUNT_TYPE:
                # Record-triggered: sync just this account (a connect or edit).
                queue = [record.get("id")]
                scheduled = False
            else:
                # Schedule-triggered: every connected account that wants gmail
                # and is due by its cadence.
                queue = [aid for aid, a in accounts.items()
                         if _wants(a) and _due(a.get("properties") or {})]
                scheduled = True
            cur = _fresh(queue)
            # WHICH PATH DROVE THIS RUN, on the cursor, because it decides who
            # writes `lastSyncStartedAt` and `lastSyncDurationMs`: around a
            # record-sourced delivery the dispatcher stamps both, and a schedule
            # names no record and stamps nothing, so there the body is the only
            # hand there is (decision 0085).
            cur["scheduled"] = scheduled

        # How long this fire may keep continuing before it hands back (the engine
        # parks a chain that outruns its cumulative deadline).
        _drain_budget(cfg, cur)
        # EVERY effect this invocation intends, buffered until it returns.
        batch = _Batch()
        # Advance past accounts we cannot or should not sync. A dead grant is
        # that account's problem alone (F2): it stamps its own status —
        # tokenStatus is the facility's hand — and the queue moves on.
        queue = list(cur.get("queue") or [])
        while queue:
            acct = accounts.get(queue[0])
            if acct is not None and acct.get("tokenError"):
                host.log("google-gmail: skip %s: %s" % (queue[0], acct["tokenError"]))
                _erroring(batch, acct, acct["tokenError"])
            if acct is None or not _wants(acct) or acct.get("tokenError") \
                    or not acct.get("token"):
                queue = queue[1:]
                cur = _carry_trait(cur, _fresh(queue, int(cur.get("calls") or 0)))
                continue
            break
        if not queue:
            batch.flush(host)
            return {}

        aid = queue[0]
        acct = accounts[aid]
        cur["queue"] = queue
        # The account's own address is written as an `emailaddress` ROW and named
        # by `account.address`, so the connection's identity is a relation like
        # every other. Nothing on a message is computed against it. The DOMAIN is
        # lowercased and the local part is not — `_mailbox`, the one normal form
        # the three streams share.
        owner = _mailbox((acct.get("properties") or {}).get("email"))
        if owner:
            batch.put(ADDRESS_TYPE, _address_id(host, aid, owner),
                      properties={"account": aid, "address": owner})
            batch.patch((acct.get("kind") or ACCOUNT_TYPE), aid,
                        properties={"address":
                                    {"ref": _address_id(host, aid, owner)}})
        try:
            out = _drain(host, batch, aid, acct, acct.get("properties") or {},
                         _api_base(cfg), acct["token"], cur)
        except Exception as e:
            # F2: a provider failure, a refused origin or a dead grant stamps
            # THIS account and the drain continues behind it. The buffered
            # effects are DISCARDED rather than flushed beside the error stamp:
            # a half-written page is worse than an unwritten one, and the
            # watermark never advanced, so the next run re-reads it.
            host.log("google-gmail: %s failed for %s: %s"
                     % (cur.get("phase"), aid, e))
            failure = _Batch()
            _erroring(failure, acct, _reason(e), _retry_after(e))
            failure.flush(host)
            rest = queue[1:]
            if rest:
                return {"more": host.page.more(
                    _carry_trait(cur, _fresh(rest, int(cur.get("calls") or 0))))}
            return {}
        batch.flush(host)
        return out
---
# ---- the calendar mirror: one calendarList entry ---------------------------
# A `CalendarListEntry`, whole. Named `calendar` and not `calendarlist`: a
# bundle's names never repeat their package, and substrate addresses by FULL
# identity everywhere, so this sits beside a repository's own `calendar` kind
# without ambiguity.
#
# NO SYNC STATE. Version 17 put `syncToken`, `syncWalk` and `syncGeneration`
# here, so every page of every calendar's drain bumped this row's version and
# fired every trigger watching it. They live in `calendarsync` now, one state
# row per calendar, `writer: connector` throughout.
#
# `kind: "calendar#calendarListEntry"` and the LIST's own `etag` are the
# response envelope and are not declared; the ENTRY's `etag` is the object's
# and stays.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/google/calendar
data:
  authority: providers.substrate.reamde.dev
  package: google
  description: >-
    One CalendarListEntry of Google Calendar API v3 (`calendarList.list`),
    whole: how this account sees one calendar, with the colours, reminders
    and notifications it set locally. Omits the response envelope (`kind`,
    the list's `etag` and `nextSyncToken`) and nothing else. Binds no temporal
    trait — a calendar has no instant. No sibling call: the sync cursor is
    a calendarsync row.
  purpose: supporting
  names:
    singular: calendar
  displayTemplate: "{summary}"
  properties:
    # --- identity -----------------------------------------------------------
    account:
      type: reference
      kind: providers.substrate.reamde.dev/google/account
      required: true
      onDelete: cascade
      displayName: Account
      description: the account this calendar was synced from
    calendarId:
      type: string
      required: true
      displayName: Calendar ID
      description: "the entry's `id` — usually an address; the provider key
        behind this row's id"
    etag:
      type: string
      displayName: ETag
      description: the entry's own `etag` (not the list's, which is the response
        envelope)
    # --- the object's own scalars, in the reference's order ------------------
    summary:
      type: string
      displayName: Summary
      description: the calendar's own `summary`, as its owner named it
    description:
      type: text
      displayName: Description
      description: "the calendar's `description` — free prose the owner wrote,
        verbatim, plain text as Google stores it"
    location:
      type: string
      displayName: Location
      description: the calendar's geographic `location`, as free text
    # The API's own name is `timeZone`; the lowercase `timezone` is the
    # `recurring` trait's property on `calendarseries`, and the two are
    # deliberately different names on different kinds rather than one spelling
    # bent to fit both. A zone Google sends that does not load is not written.
    timeZone:
      type: timezone
      displayName: Timezone
      description: "the calendar's `timeZone` — an IANA name, and what a series
        with no zone of its own resolves in"
    summaryOverride:
      type: string
      displayName: Summary override
      description: "the entry's `summaryOverride` — what THIS account renamed
        the calendar to, when it renamed it"
    colorId:
      type: string
      displayName: Colour ID
      description: "the entry's `colorId` — an index into Google's `colors`
        palette, not a colour"
    backgroundColor:
      type: string
      displayName: Background colour
      description: the entry's `backgroundColor`, a hex triplet this account
        set for the calendar
    foregroundColor:
      type: string
      displayName: Foreground colour
      description: the entry's `foregroundColor`, a hex triplet this account
        set for the calendar
    hidden:
      type: bool
      displayName: Hidden
      description: "the entry's `hidden` flag — whether this account hid the
        calendar from its list"
    selected:
      type: bool
      displayName: Selected
      description: whether this account has the calendar's events showing
        in Google's own UI
    # The discovery document types `accessRole` as a string and the reference
    # closes it at five values; spelled by rule (lowercased, `_`/`-` dropped),
    # with Google's own spelling as each label.
    accessRole:
      type: enum
      values:
        - value: freebusyreader
          label: freeBusyReader
        - value: reader
          label: reader
        - value: writerwithoutprivateaccess
          label: writerWithoutPrivateAccess
        - value: writer
          label: writer
        - value: owner
          label: owner
      displayName: Access role
      description: "this account's effective role on the calendar; a freeBusyReader
        share carries no event content and is never walked"
    defaultReminders:
      type: object
      repeated: true
      displayName: Default reminders
      description: "the entry's `defaultReminders` — what this account is
        reminded by for an event on this calendar that sets none of its own"
      fields:
        method:
          type: enum
          values:
            - value: email
              label: email
            - value: popup
              label: popup
          description: "the reminder's delivery method, as Google closes it"
        minutes:
          type: int
          description: how many minutes before the event the reminder fires
    notificationSettings:
      type: object
      displayName: Notification settings
      description: the entry's `notificationSettings` — the notifications
        this account receives for this calendar
      fields:
        notifications:
          type: object
          repeated: true
          description: one notification this account asked for on this calendar
          fields:
            type:
              type: enum
              values:
                - value: eventcreation
                  label: eventCreation
                - value: eventchange
                  label: eventChange
                - value: eventcancellation
                  label: eventCancellation
                - value: eventresponse
                  label: eventResponse
                - value: agenda
                  label: agenda
              description: what this notification is about, as Google closes
                the set
            method:
              type: enum
              values:
                - value: email
                  label: email
              description: "the delivery method; Google closes it at `email`
                since SMS was retired"
    primary:
      type: bool
      displayName: Primary
      description: whether this is the account's own primary calendar
    deleted:
      type: bool
      displayName: Deleted
      description: "the entry's `deleted` flag — showDeleted=true is what
        makes an unsubscribed calendar observable at all"
    # THE EXTENSIBLE-DISCRIMINATOR EXCEPTION, and the only one this stream
    # takes (README, "closed set or open list"). `docs/kind-design.md` §2
    # makes a schema-closed set an `enum` and a documented-but-growing list a
    # `string`; the test this stream applies for which is which is the API's
    # OWN INSTRUCTION TO THE CLIENT. Calendar's conference reference tells a
    # client to expect and handle a solution type it does not know, so the
    # three conference-type properties (here, `conferenceSolution.key.type`
    # and `createRequest.conferenceSolutionKey.type`) stay `string` with the
    # documented values named in the description; an `enum` would turn one new
    # Google word into a refused page or, worse, a silently erased value.
    # Every other documented Calendar list on these kinds IS closed and IS an
    # enum, and a word the enum does not hold is named on
    # `account.calendarSyncStatus` rather than dropped in silence.
    conferenceProperties:
      type: object
      displayName: Conference properties
      description: the entry's `conferenceProperties` — which conference solutions
        may be attached to an event on this calendar
      fields:
        allowedConferenceSolutionTypes:
          type: string
          repeated: true
          description: "the solution types allowed here — documented as eventHangout,
            eventNamedHangout and hangoutsMeet, and an open list Google tells
            clients to tolerate unknown values in"
    autoAcceptInvitations:
      type: bool
      displayName: Auto-accept invitations
      description: the entry's `autoAcceptInvitations` — whether the calendar
        (a room, usually) accepts invitations on its own
    # --- relations -----------------------------------------------------------
    # `dataOwner` is an ADDRESS, and an address is the identity this bundle
    # reuses across Calendar, Gmail and People — so it is the hub row, not an
    # `email` scalar beside one (`docs/kind-design.md` §3). The sync upserts
    # the hub before this row, which is why no `mustExist` is needed and why a
    # mailbox that does not parse leaves the property absent instead.
    dataOwner:
      type: reference
      kind: providers.substrate.reamde.dev/google/emailaddress
      displayName: Data owner
      description: "the entry's `dataOwner` as a hub row — who owns the calendar's
        data, set only on a secondary calendar"
---
# ---- the calendar's sync state: NOT a property of the mirror ---------------
# One row per calendar, holding what the DRAIN knows and the calendar does
# not. It exists because `docs/kind-design.md` §1 forbids sync bookkeeping on
# a mirror, container or not: a page of a calendar's events must not bump the
# calendar row's version, or every trigger watching a calendar fires once per
# page of history.
#
# Its id IS the calendar row's id, so no lookup is needed to find it, and the
# reference cascades: deleting the calendar collects its state.
#
# ONE STATE ROW PER CALENDAR IS A SYNC CONVENTION, NOT A DATABASE GUARANTEE.
# The row id IS the calendar row's id, so the drain can only ever write one;
# `unique: true` on the reference was removed because the loader accepts the
# key and enforces nothing (substrate `internal/vocabulary/load.go`), and a
# promise the engine does not keep is worse than none. Engine ask: enforce
# `unique` on a reference.
#
# `writer: connector` on every SCALAR — only installed bundle code may set
# them, so neither the owner nor the console can hand the drain a token. The
# `calendar` reference CANNOT say it: `writer` is not one of the keys a
# reference declaration admits (`referencePropKeys`), so the pointer itself is
# owner-writable and only the id convention keeps it honest. Engine ask:
# `writer` on a reference.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/google/calendarsync
data:
  authority: providers.substrate.reamde.dev
  package: google
  description: >-
    Where one calendar's events drain has got to — its sync token, the walk
    that token was minted under, and the generation of the last full read.
    Provider-owned state, not an API resource and not a property of the calendar
    mirror, so a page of events never moves the calendar's version. Binds
    no trait: it has no instant of its own.
  purpose: internal
  names:
    singular: calendarsync
  displayTemplate: "sync state"
  properties:
    # --- identity -----------------------------------------------------------
    calendar:
      type: reference
      kind: providers.substrate.reamde.dev/google/calendar
      required: true
      onDelete: cascade
      displayName: Calendar
      description: "the calendar this state belongs to; this row's id IS the
        calendar's, so the sync writes at most one per calendar"
    # --- the drain's own state ----------------------------------------------
    syncToken:
      type: string
      writer: connector
      displayName: Sync token
      description: "this calendar's events `nextSyncToken` — committed only
        from the page that carried it, which is the last one"
    syncWalk:
      type: string
      writer: connector
      displayName: Sync walk
      description: "the walk the stored token was minted under, stamped once
        that walk's sweep completed; a token from another walk reads as absent"
    generation:
      type: string
      writer: connector
      displayName: Generation
      description: the generation token the last full re-read of this calendar
        ran under, so a resumed sweep knows which pass it is finishing
---
# ---- the calendar mirror: one recurring master -----------------------------
# A Google `Event` CARRYING `recurrence`, binding core's `recurring`. The walk
# is `singleEvents=false`, so a master is ONE item with its rule and the
# records read computes its occurrences beside the plain rows: nothing is
# expanded, and a master repeating to 2099 costs one row.
#
# ONE ZONE resolves everything about a series — the master's own
# `start.timeZone` when it loads, else the calendar's, else UTC — and it is
# written to the trait's `timezone`, because the read matches `exdates`,
# `rdates` and an exception's `originalAt` against the rule's slots by EXACT
# instant: an EXDATE line and the exception it names must resolve in the same
# zone or an all-day series doubles every exception.
#
# `calendarseries` and `calendarevent` are two kinds over ONE resource, split
# on whether Google sent `recurrence`, and they declare the SAME Event fields — the
# difference is the trait each binds and the four slots that trait needs. Two
# fields a master never carries (`recurringEventId`, and so the `override`
# trait's `recurrenceOf`/`originalAt`) are still declared here as
# `recurrenceLines` and `originalStartTime`, because the resource carries
# them and a payload that surprised us should land somewhere typed.
#
# Omitted, as classes: `kind: "calendar#event"` (the constant discriminator)
# and the LIST's own `etag` and `nextSyncToken` (the response envelope). The
# ITEM's `etag` stays.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/google/calendarseries
data:
  authority: providers.substrate.reamde.dev
  package: google
  description: >-
    One Google Calendar API v3 Event CARRYING `recurrence` (`events.list`,
    singleEvents=false), whole, with its rule decoded beside the lines it
    came from. `at`/`endsAt` are `start`/`end` resolved in each object's own
    zone. Never expanded into rows: a records read computes the occurrences.
    Omits the response envelope (`kind`, the list's `etag` and `nextSyncToken`)
    and nothing else. No sibling call.
  purpose: supporting
  names:
    singular: calendarseries
  traits:
    - substrate.reamde.dev/core/temporal(range)
    - substrate.reamde.dev/core/recurring
  displayTemplate: "{summary}"
  properties:
    # --- identity -----------------------------------------------------------
    account:
      type: reference
      kind: providers.substrate.reamde.dev/google/account
      required: true
      onDelete: cascade
      displayName: Account
      description: the account this series was synced from
    eventId:
      type: string
      required: true
      displayName: Event ID
      description: "the master's `id` — unique per CALENDAR and not globally,
        so this row's id nests the calendar row's"
    etag:
      type: string
      displayName: ETag
      description: the event's own `etag` (not the list's, which is the response
        envelope)
    iCalUID:
      type: string
      displayName: iCal UID
      description: "the event's `iCalUID` — the identity every copy of this
        event shares, across calendars and across attendees"
    # --- the object's own scalars, in the Event reference's order ------------
    # The discovery document types `status` as a string and the reference
    # closes it at three values. A cancelled MASTER is retracted — the whole
    # series is gone, and so are its exception rows — so a stored series is
    # confirmed or tentative; `cancelled` is declared anyway, because it is a
    # value the resource carries and a reader of a delta payload needs the
    # word. A cancelled EXCEPTION is a different thing and is kept as an
    # `calendarevent` row; see that kind.
    status:
      type: enum
      values:
        - value: confirmed
          label: confirmed
        - value: tentative
          label: tentative
        - value: cancelled
          label: cancelled
      displayName: Status
      description: "the event's `status`; a cancelled row is retracted rather
        than stored, so this is confirmed or tentative in practice"
    htmlLink:
      type: url
      displayName: Link
      description: the event's `htmlLink` — its page in Google Calendar, which
        Google guarantees absolute
    summary:
      type: string
      displayName: Summary
      description: the event's `summary`, its title line
    description:
      type: text
      displayName: Description
      description: "the event's `description` — free prose, sometimes with
        HTML in it, as Google stores it"
    location:
      type: string
      displayName: Location
      description: the event's `location`, as free text
    colorId:
      type: string
      displayName: Colour ID
      description: "the event's `colorId` — an index into Google's `colors`
        palette, not a colour"
    eventLabelId:
      type: string
      displayName: Event label ID
      description: "the event's `eventLabelId` — an entry of the calendar's
        own `labelProperties.eventLabels`, which supersedes `colorId`"
    # THE API'S OWN `start`/`end`, beside the trait's resolved `at`/`endsAt`:
    # `at` cannot say whether Google sent a `date` or a `dateTime`, nor which
    # wall-clock zone a floating time was written in, so the object is
    # declared with each field typed exactly — which is what makes "an all-day
    # event" a question about `start.date` rather than a stored boolean.
    start:
      type: object
      displayName: Start
      description: "the event's `start` — a civil date for an all-day event,
        an instant otherwise; the resolved instant is the trait's `at`"
      fields:
        date:
          type: date
          description: "the civil date an ALL-DAY event starts on; set exactly
            when `dateTime` is not"
        dateTime:
          type: datetime
          description: the instant a timed event starts at, as Google sends
            it
        timeZone:
          type: timezone
          description: "the IANA zone the wall clock is written in; on a recurring
            master it is the zone the whole rule resolves in"
    end:
      type: object
      displayName: End
      description: "the event's `end` — exclusive, so an all-day event ending
        on the 5th ends at the start of the 5th; resolved into `endsAt`"
      fields:
        date:
          type: date
          description: the civil date an ALL-DAY event ends on, exclusive
        dateTime:
          type: datetime
          description: the instant a timed event ends at, as Google sends
            it
        timeZone:
          type: timezone
          description: the IANA zone the end's wall clock is written in
    endTimeUnspecified:
      type: bool
      displayName: End unspecified
      description: "the event's `endTimeUnspecified` — Google filled `end`
        in for an event whose author gave none"
    # THE ONE COLLISION between Google's names and the dialect's. Google's
    # `recurrence` is an ARRAY of iCalendar lines (RRULE, EXDATE, RDATE); the
    # `recurring` trait's `recurrence` is the single RRULE string a window
    # read reads. The trait wins the name (§4) and Google's array rides beside
    # it, verbatim, under its own name suffixed by what it is.
    recurrenceLines:
      type: string
      repeated: true
      displayName: Recurrence lines
      description: "Google's `recurrence` array verbatim — the RRULE, EXDATE
        and RDATE lines, which is what regenerates the iCalendar exactly"
    originalStartTime:
      type: object
      displayName: Original start
      description: "the event's `originalStartTime` — the slot of the series
        this event replaces, in Google's own spelling; resolved to `originalAt`"
      fields:
        date:
          type: date
          description: the civil date of the slot, on an all-day series
        dateTime:
          type: datetime
          description: the instant of the slot, on a timed series
        timeZone:
          type: timezone
          description: the IANA zone the slot's wall clock is written in
    transparency:
      type: enum
      values:
        - value: opaque
          label: opaque
        - value: transparent
          label: transparent
      displayName: Transparency
      description: "whether the event blocks time: opaque is busy, transparent
        is free; Google omits it on the default (opaque)"
    visibility:
      type: enum
      values:
        - value: default
          label: default
        - value: public
          label: public
        - value: private
          label: private
        - value: confidential
          label: confidential
      displayName: Visibility
      description: "the event's `visibility`; confidential is a compatibility
        spelling of private"
    sequence:
      type: int
      displayName: Sequence
      description: the event's `sequence`, iCalendar's revision counter for
        this event
    attendeesOmitted:
      type: bool
      displayName: Attendees omitted
      description: "the event's `attendeesOmitted` — Google truncated the
        guest list, so `attendees` is not the whole of it"
    extendedProperties:
      type: object
      displayName: Extended properties
      description: "the event's `extendedProperties` — arbitrary key/value
        data an application stored on this event"
      fields:
        private:
          type: string
          keyed: true
          description: properties visible only to the copy of the event on
            this calendar
        shared:
          type: string
          keyed: true
          description: properties visible to every copy of the event on every
            attendee's calendar
    hangoutLink:
      type: url
      displayName: Hangout link
      description: "the event's `hangoutLink` — the Meet URL, which Google
        guarantees absolute; a legacy field beside `conferenceData`"
    conferenceData:
      type: object
      displayName: Conference data
      description: the event's `conferenceData` — the conference attached
        to it, its entry points and the request that created it
      fields:
        conferenceId:
          type: string
          description: the conference's own id, for correlating with the provider's
            records
        signature:
          type: string
          description: Google's signature over a conference it created, absent
            on a pending request
        notes:
          type: text
          description: "additional notes to show the user, such as domain-administrator
            instructions; prose, and Google admits HTML in it"
        conferenceSolution:
          type: object
          description: which conferencing product this is
          fields:
            name:
              type: string
              description: the product's user-visible name, as its provider
                spelled it
            iconUri:
              type: url
              description: the absolute URL of the product's icon, which Google
                sends as a full https link
            key:
              type: object
              description: the solution's type key
              fields:
                type:
                  type: string
                  description: "the solution type — documented as eventHangout,
                    eventNamedHangout and hangoutsMeet, and an open list a
                    client must tolerate unknown values in"
        entryPoints:
          type: object
          repeated: true
          description: one way of joining the conference — a video link, a
            phone number, a SIP address, or further instructions
          fields:
            entryPointType:
              type: enum
              values:
                - value: video
                  label: video
                - value: phone
                  label: phone
                - value: sip
                  label: sip
                - value: more
                  label: more
              description: how this entry point joins the conference, as Google
                closes the set
            uri:
              type: url
              description: "how this entry point is reached — an https link,
                a `tel:` number or a `sip:` address, each an absolute URI"
            label:
              type: string
              description: the entry point's user-visible label, which Google
                shows in place of the raw URI
            pin:
              type: string
              description: the PIN a phone or SIP caller enters to join, when
                the conference needs one
            accessCode:
              type: string
              description: the access code a caller enters to join, when the
                provider issues one
            meetingCode:
              type: string
              description: the meeting code a caller enters to join, when
                the provider issues one
            passcode:
              type: string
              description: the passcode a caller enters to join, when the
                provider issues one
            password:
              type: string
              description: the password a caller enters to join, when the
                provider issues one
            regionCode:
              type: string
              description: "the CLDR/ISO 3166-1 alpha-2 region of a phone
                entry point, set only on `phone`"
            entryPointFeatures:
              type: string
              repeated: true
              description: "the entry point's features (toll, toll_free) —
                a list Google grows"
        createRequest:
          type: object
          description: the request that asked Google to create this conference,
            and how it ended
          fields:
            requestId:
              type: string
              description: the client-generated id that makes the create request
                idempotent at Google
            conferenceSolutionKey:
              type: object
              description: the solution type the request asked for
              fields:
                type:
                  type: string
                  description: "the solution type asked for — documented as
                    eventHangout, eventNamedHangout and hangoutsMeet, and
                    an open list a client must tolerate unknown values in"
            status:
              type: object
              description: how the create request ended
              fields:
                statusCode:
                  type: enum
                  values:
                    - value: pending
                      label: pending
                    - value: success
                      label: success
                    - value: failure
                      label: failure
                  description: "pending, success or failure, as Google closes
                    the set"
        parameters:
          type: object
          description: the add-on parameters a third-party conference provider
            stored on this conference
          fields:
            addOnParameters:
              type: object
              description: the add-on's own key/value bag
              fields:
                parameters:
                  type: string
                  keyed: true
                  description: the add-on's parameters, key to value
    # Deprecated at Google, and still sent: the reference says the structure
    # is now only used for birthday-calendar metadata. `title` is reserved at
    # every level of the dialect, so the gadget's rides as `gadgetTitle`.
    gadget:
      type: object
      displayName: Gadget
      description: "the event's `gadget` — deprecated at Google and now only
        carrying birthday-calendar metadata"
      fields:
        type:
          type: string
          description: the gadget's MIME type, which Google documents as free
            text rather than a closed set
        link:
          type: url
          description: "the gadget's `link` — the absolute https URL Google
            requires it to be served from"
        iconLink:
          type: url
          description: "the gadget's `iconLink` — the absolute https URL of
            its icon, which Google requires to be https"
        gadgetTitle:
          type: string
          description: the gadget's `title` — renamed because `title` is reserved
            at every level of the dialect
        display:
          type: enum
          values:
            - value: icon
              label: icon
            - value: chip
              label: chip
          description: "how the gadget is displayed, which Google closes at
            two: an icon beside the title, or a chip in the detail view"
        width:
          type: int
          description: the gadget's preferred width in pixels, set only when
            it displays as a chip
        height:
          type: int
          description: the gadget's preferred height in pixels, set only when
            it displays as a chip
        preferences:
          type: string
          keyed: true
          description: the gadget's preferences, key to value
    anyoneCanAddSelf:
      type: bool
      displayName: Anyone can add self
      description: the event's `anyoneCanAddSelf` — whether anyone may invite
        themselves to it
    guestsCanInviteOthers:
      type: bool
      displayName: Guests can invite
      description: the event's `guestsCanInviteOthers` flag
    guestsCanModify:
      type: bool
      displayName: Guests can modify
      description: the event's `guestsCanModify` flag
    guestsCanSeeOtherGuests:
      type: bool
      displayName: Guests see guests
      description: the event's `guestsCanSeeOtherGuests` flag
    privateCopy:
      type: bool
      displayName: Private copy
      description: "the event's `privateCopy` — this copy is not propagated
        to the other attendees' calendars"
    locked:
      type: bool
      displayName: Locked
      description: "the event's `locked` — a copy whose main fields cannot
        be changed"
    reminders:
      type: object
      displayName: Reminders
      description: "the event's `reminders` FOR THIS ACCOUNT: the calendar's
        defaults, or the overrides this account set"
      fields:
        useDefault:
          type: bool
          description: whether the calendar's `defaultReminders` apply rather
            than the overrides below
        overrides:
          type: object
          repeated: true
          description: the reminders this account set on this event, when
            it set any
          fields:
            method:
              type: enum
              values:
                - value: email
                  label: email
                - value: popup
                  label: popup
              description: the reminder's delivery method, as Google closes
                it
            minutes:
              type: int
              description: how many minutes before the event the reminder
                fires
    source:
      type: object
      displayName: Source
      description: "the event's `source` — the web page or message the event
        was created from; only its creator sees it"
      fields:
        url:
          type: url
          description: the source's URL, which Google requires to be http
            or https
        sourceTitle:
          type: string
          description: the source's `title` — renamed because `title` is reserved
            at every level of the dialect
    workingLocationProperties:
      type: object
      displayName: Working location
      description: the event's `workingLocationProperties` — where the owner
        is working, on an eventType of workingLocation
      fields:
        type:
          type: enum
          values:
            - value: homeoffice
              label: homeOffice
            - value: officelocation
              label: officeLocation
            - value: customlocation
              label: customLocation
          description: which of the three sub-fields below carries the detail
        # A PRESENCE-ONLY CONTRACT, stated exactly. Google types `homeOffice`
        # as `any` and sends `{}` — every payload observed carries the empty
        # object and nothing else. The dialect has no empty-object value (a
        # `fields: {}` is refused, and `json` is forbidden as an object
        # field), so this property says ONE thing and says it precisely:
        # `true` means Google sent the key. It does NOT hold whatever the key
        # held. If Google ever sends a value here, the value is not mirrored
        # — the sync names it on `account.calendarSyncStatus` instead of
        # discarding it in silence, and the fix is a package bump that gives
        # the field its real shape. Engine ask: an empty-object value, or a
        # `json` field inside an object.
        homeOffice:
          type: bool
          description: "`true` means Google SENT `homeOffice` (always as an
            empty object, meaning working at home); it holds no value of its
            own"
        officeLocation:
          type: object
          description: the office the owner is working from
          fields:
            label:
              type: string
              description: the office's user-visible name, as the owner's
                organisation spelled it
            buildingId:
              type: string
              description: the building's id in the organisation's Workspace
                resource database
            floorId:
              type: string
              description: the floor's id in the organisation's Workspace
                resource database
            floorSectionId:
              type: string
              description: the floor section's id in the organisation's Workspace
                resource database
            deskId:
              type: string
              description: the desk's id in the organisation's Workspace resource
                database
        customLocation:
          type: object
          description: the custom location the owner is working from
          fields:
            label:
              type: string
              description: the free-text place the owner typed, when it is
                neither home nor a known office
    outOfOfficeProperties:
      type: object
      displayName: Out of office
      description: the event's `outOfOfficeProperties`, on an eventType of
        outOfOffice
      fields:
        autoDeclineMode:
          type: enum
          values:
            - value: declinenone
              label: declineNone
            - value: declineallconflictinginvitations
              label: declineAllConflictingInvitations
            - value: declineonlynewconflictinginvitations
              label: declineOnlyNewConflictingInvitations
          description: which overlapping invitations Google declines while
            this event stands
        declineMessage:
          type: text
          description: "the prose sent to whoever's invitation was auto-declined,
            as the owner wrote it; plain text"
    focusTimeProperties:
      type: object
      displayName: Focus time
      description: the event's `focusTimeProperties`, on an eventType of focusTime
      fields:
        autoDeclineMode:
          type: enum
          values:
            - value: declinenone
              label: declineNone
            - value: declineallconflictinginvitations
              label: declineAllConflictingInvitations
            - value: declineonlynewconflictinginvitations
              label: declineOnlyNewConflictingInvitations
          description: which overlapping invitations Google declines while
            this event stands
        declineMessage:
          type: text
          description: "the prose sent to whoever's invitation was auto-declined,
            as the owner wrote it; plain text"
        chatStatus:
          type: enum
          values:
            - value: available
              label: available
            - value: donotdisturb
              label: doNotDisturb
          description: what the owner is marked as in Chat while this event
            stands
    attachments:
      type: object
      repeated: true
      displayName: Attachments
      description: "the event's `attachments` — the Drive files attached to
        it, each entry's own metadata as the Event resource carries it"
      fields:
        # THE DRIVE SCOPE BOUNDARY, stated rather than left to inference
        # (`docs/kind-design.md` §3 makes an id we mirror a reference). This
        # bundle requests no Drive scope and mirrors no Drive resource, so
        # there is no `file` kind for this id to point at: a reference would
        # dangle at a row nothing in this package can ever write. It is
        # therefore the API's own opaque string, and the day a Drive stream
        # is added it becomes a reference and the package is bumped. It is
        # NEVER the `gmailattachment` kind, which is a MIME part of a
        # message and a different object entirely.
        fileId:
          type: string
          description: "the Drive file's id, as an opaque string: this bundle
            mirrors no Drive resource, so there is no `file` kind to point
            at"
        fileUrl:
          type: url
          description: the file's URL, which Google guarantees absolute
        attachmentTitle:
          type: string
          description: the attachment's `title` — renamed because `title`
            is reserved at every level of the dialect
        mimeType:
          type: string
          description: the Drive file's media type, as Google's Drive records
            it for the attached file
        iconLink:
          type: url
          description: the URL of the file type's icon, which Google guarantees
            absolute
    eventType:
      type: enum
      values:
        - value: default
          label: default
        - value: birthday
          label: birthday
        - value: focustime
          label: focusTime
        - value: fromgmail
          label: fromGmail
        - value: outofoffice
          label: outOfOffice
        - value: workinglocation
          label: workingLocation
      displayName: Event type
      description: "the event's `eventType`, which Google closes at six and
        fixes at creation; the matching *Properties object carries the detail"
    # --- relations -----------------------------------------------------------
    # The plain references first, then the objects that hold one, which is the
    # order `docs/kind-design.md` §5 asks this group for.
    #
    # REQUIRED: the walk is per-calendar, so the sync always knows the
    # enclosing calendar, and a row with no calendar is one nothing can place.
    # Declared fresh at this package version — no stored row predates it,
    # because version 17's purge-and-resync cleared the package's records.
    calendar:
      type: reference
      kind: providers.substrate.reamde.dev/google/calendar
      required: true
      onDelete: cascade
      displayName: Calendar
      description: "the calendar this row lives in; no `calendarId` scalar
        beside it — a copy of a referent's key is a derived property"
    # THE PEOPLE ON IT, as OCCURRENCE ARRAYS rather than repeated references.
    # Google gives creator, organizer and each attendee as an embedded object
    # with no stable id of its own — the ADDRESS is the identity it reuses
    # across Calendar, Gmail and People — but the entry carries more than a
    # few flat scalars and Google DOES repeat an address (a room invited as
    # itself and as a resource), which a repeated reference refuses. So the
    # entry is the API's own, typed, with the identity a reference FIELD
    # inside it.
    #
    # `creator` and `organizer` are single objects because Google sends one;
    # `attendees` is the array. Version 17's `attendeeEmails`,
    # `organizerEmail` and `creatorEmail` scalar duplicates are gone: the
    # `value` field inside each entry is the probe, and it is the entry's own
    # field rather than a second copy of a referent's key.
    creator:
      type: object
      displayName: Creator
      description: the event's `creator`, with the address a reference at
        the hub
      fields:
        value:
          type: email
          description: "the mailbox in the bundle's normal form — DOMAIN lowercased,
            local part verbatim — the probe a person mapping reads without
            walking the reference"
        address:
          type: reference
          kind: providers.substrate.reamde.dev/google/emailaddress
          description: the hub row for this address, which a mail header and
            an address-book entry reach too
        displayName:
          type: string
          description: the name THIS event spelled for them, when it spelled
            one
        self:
          type: bool
          description: "Google's own `self` — whether this entry IS the connected
            account, which is Google's fact about the caller"
        googleId:
          type: string
          description: the entry's opaque Google profile `id`, when Google
            sends one
    organizer:
      type: object
      displayName: Organizer
      description: "the event's `organizer` — on a shared calendar, usually
        the calendar itself"
      fields:
        value:
          type: email
          description: "the mailbox in the bundle's normal form — DOMAIN lowercased,
            local part verbatim — the probe a person mapping reads without
            walking the reference"
        address:
          type: reference
          kind: providers.substrate.reamde.dev/google/emailaddress
          description: the hub row for this address, which a mail header and
            an address-book entry reach too
        displayName:
          type: string
          description: the name THIS event spelled for them, when it spelled
            one
        self:
          type: bool
          description: "Google's own `self` — whether this entry IS the connected
            account, which is Google's fact about the caller"
        googleId:
          type: string
          description: the entry's opaque Google profile `id`, when Google
            sends one
    attendees:
      type: object
      repeated: true
      displayName: Attendees
      description: "the event's `attendees`, each entry whole: what this invitation
        said, with the address a reference at the hub"
      fields:
        value:
          type: email
          description: "the mailbox in the bundle's normal form — DOMAIN lowercased,
            local part verbatim — the probe a person mapping reads without
            walking the reference"
        address:
          type: reference
          kind: providers.substrate.reamde.dev/google/emailaddress
          description: the hub row for this address, which a mail header and
            an address-book entry reach too
        displayName:
          type: string
          description: the name THIS event spelled for them, when it spelled
            one
        self:
          type: bool
          description: "Google's own `self` — whether this entry IS the connected
            account, which is Google's fact about the caller"
        googleId:
          type: string
          description: the entry's opaque Google profile `id`, when Google
            sends one
        responseStatus:
          type: enum
          values:
            - value: needsaction
              label: needsAction
            - value: declined
              label: declined
            - value: tentative
              label: tentative
            - value: accepted
              label: accepted
          description: "the attendee's `responseStatus`, which Google closes
            at four; spelled lowercase with the API's word as the label"
        optional:
          type: bool
          description: the entry's `optional` — whether this is an optional
            attendee
        organizer:
          type: bool
          description: the entry's `organizer` — whether this attendee is
            also the event's organizer
        resource:
          type: bool
          description: "the entry's `resource` — whether the attendee is a
            room or a piece of equipment rather than a person"
        comment:
          type: string
          description: the attendee's own `comment` on the invitation
        additionalGuests:
          type: int
          description: the entry's `additionalGuests` — how many extra people
            this attendee is bringing
        # Closed, not extensible: the Event reference documents one value and
        # gives no tolerate-the-unknown instruction, which is the test this
        # stream applies (see the comment on `calendar.conferenceProperties`).
        # A seventh word from Google is named on the run's status line, never
        # written and never silently dropped.
        asyncOperation:
          type: enum
          values:
            - value: inprogress
              label: inProgress
          description: "the entry's `asyncOperation` — the state of a long-running
            guest-list change Google is still applying"
    # The last object holding a reference: `birthdayProperties.contact` is a
    # People RESOURCE NAME, which is an id this bundle mirrors, so it is the
    # pointer and not a string. It dangles when contacts are not synced, which
    # is real data rather than a bug, so it does not `mustExist`.
    birthdayProperties:
      type: object
      displayName: Birthday
      description: the event's `birthdayProperties`, on an eventType of birthday
        — which contact the date belongs to
      fields:
        type:
          type: enum
          values:
            - value: anniversary
              label: anniversary
            - value: birthday
              label: birthday
            - value: custom
              label: custom
            - value: other
              label: other
            - value: self
              label: self
          description: which kind of special date this is; `self` is the calendar
            owner's own birthday
        customTypeName:
          type: string
          description: the owner's own label for the date, on a type of `custom`
        contact:
          type: reference
          kind: providers.substrate.reamde.dev/google/contact
          description: "the People person whose date this is, from the resource
            name Google sends; dangles when contacts are not synced"
    # --- the recurring trait's four, every one a decode of this payload ------
    # Each is a LOSSLESS MECHANICAL DECODE of THIS MASTER's own
    # `recurrenceLines`, declared beside them because the decode drops the
    # spelling: `recurrence` is the RRULE line, `rdates`/`exdates` are the
    # instants this master's own RDATE and EXDATE lines resolve to, and
    # `timezone` is the zone all three resolve in.
    #
    # NOTHING FROM ANOTHER RESOURCE IS MIXED IN, and `cancelledSlots` IS GONE.
    # Version 18 unioned every cancelled exception's slot into `exdates` and
    # kept a second copy in `cancelledSlots`. Both were derived properties
    # (`docs/kind-design.md` §1) and both were lossy: an identifiable
    # cancelled Event — its id, its `status`, its `originalStartTime` shape —
    # was replaced by an instant; the union only ever grew; and a REINSTATED
    # exception could never take its slot back, not even under a full
    # re-read, because the write unioned what was stored.
    #
    # A cancelled exception is now KEPT AS ITS OWN `calendarevent` ROW, `status:
    # cancelled`, pointing here through `recurrenceOf` and naming its slot in
    # `originalAt`. The skipped-slot overlay is a JOIN THE READER COMPUTES,
    # outside the mirror: this master's `exdates`, plus the `originalAt` of
    # every `calendarevent` row referencing this series whose `status` is
    # `cancelled`.
    # Reinstating the exception rewrites that one row and the slot comes back.
    #
    # WHAT THE PROJECTION CANNOT HOLD is said out loud rather than hidden.
    # `recurrence` is ONE RRULE and `recurrenceLines` may carry several; an
    # RDATE in VALUE=PERIOD form names a span a `datetime` cannot hold. In
    # both cases the source line survives verbatim in `recurrenceLines`, the
    # run NAMES the limitation on `account.calendarSyncStatus`, and the
    # expansion computed from the trait is known-incomplete for that row.
    recurrence:
      type: recurrence
      displayName: Rule
      description: "the FIRST RRULE of `recurrenceLines` — `at` is its DTSTART
        and `endsAt - at` each occurrence's length; a second RRULE is named
        on the sync's status line"
    rdates:
      type: datetime
      repeated: true
      displayName: Extra dates
      description: "the instants this master's own RDATE lines resolve to;
        a VALUE=PERIOD entry is a span and is named on the status line instead"
    exdates:
      type: datetime
      repeated: true
      displayName: Skipped dates
      description: "the instants this master's own EXDATE lines resolve to,
        and only those; a cancelled exception is its own `calendarevent` row"
    timezone:
      type: timezone
      displayName: Timezone
      description: "the one zone the rule, its EXDATE and RDATE lines and
        its exceptions' slots resolve in: the master's own, else the calendar's"
    # --- instants ------------------------------------------------------------
    # `at`/`endsAt` are the temporal trait's, resolved from `start`/`end`, and
    # are not listed here.
    created:
      type: datetime
      displayName: Created
      description: the event's `created` instant, as Google stamped it
    updated:
      type: datetime
      displayName: Updated
      description: "the event's `updated` instant — Google's own last-modified
        stamp, and what an idempotence assertion watches move"
---
# ---- the calendar mirror: one event ----------------------------------------
# A Google `Event` WITHOUT `recurrence`: a single event, or one MODIFIED
# EXCEPTION of a series, binding core's `override`. An exception points at its
# series through `recurrenceOf` and names the slot it replaces in
# `originalAt` (iCalendar's RECURRENCE-ID), and its row id is `<series row
# id>_<slot>` — the string the records read gives the occurrence it computes
# for that slot, so the two share an id across their two kinds.
#
# `recurringEventId` is NOT declared as a string beside `recurrenceOf`: it is
# an id of an object this bundle mirrors, so it is the reference and nothing
# else. `originalStartTime` IS declared, because it carries more than the
# instant `originalAt` holds — whether Google sent a date and which zone the
# wall clock was written in.
#
# `recurrenceOf` cascades and does not `mustExist`, deliberately: Google
# deletes a series' exceptions with it, and an exception may land a page
# before its master, or name a master the walk never returns at all.
#
# Omitted, as classes: `kind: "calendar#event"` (the constant discriminator)
# and the LIST's own `etag` and `nextSyncToken` (the response envelope).
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/google/calendarevent
data:
  authority: providers.substrate.reamde.dev
  package: google
  description: >-
    One Google Calendar API v3 Event WITHOUT `recurrence` (`events.list`,
    singleEvents=false), whole: a single event, or an exception naming the
    series it overrides and the slot it replaces, cancelled ones included.
    `at`/`endsAt` are `start`/`end` resolved in each object's own zone. Omits
    the response envelope (`kind`, the list's `etag` and `nextSyncToken`).
    No sibling call.
  names:
    singular: calendarevent
  traits:
    - substrate.reamde.dev/core/temporal(range)
    - substrate.reamde.dev/core/override
  displayTemplate: "{summary}"
  properties:
    # --- identity -----------------------------------------------------------
    account:
      type: reference
      kind: providers.substrate.reamde.dev/google/account
      required: true
      onDelete: cascade
      displayName: Account
      description: the account this event was synced from
    eventId:
      type: string
      required: true
      displayName: Event ID
      description: "the event's `id` — unique per CALENDAR and not globally,
        so this row's id nests the calendar row's"
    etag:
      type: string
      displayName: ETag
      description: the event's own `etag` (not the list's, which is the response
        envelope)
    iCalUID:
      type: string
      displayName: iCal UID
      description: "the event's `iCalUID` — the identity every copy of this
        event shares, across calendars and across attendees"
    # --- the object's own scalars, in the Event reference's order ------------
    # The discovery document types `status` as a string and the reference
    # closes it at three values, and this kind STORES all three. A cancelled
    # EXCEPTION — an event carrying `recurringEventId` and
    # `originalStartTime` — is kept as a row with `status: cancelled`, which
    # is what makes a skipped occurrence identifiable (its id, its slot, its
    # own fields) and REVERSIBLE: reinstating it rewrites this one row.
    # Version 18 retracted it and unioned its instant into the master's
    # `cancelledSlots`, which lost the resource and could never be undone.
    # A cancelled SINGLE event is still a retraction: nothing of it remains
    # upstream and it overrides no slot.
    status:
      type: enum
      values:
        - value: confirmed
          label: confirmed
        - value: tentative
          label: tentative
        - value: cancelled
          label: cancelled
      displayName: Status
      description: "the event's `status`; `cancelled` is stored on an EXCEPTION
        row (the slot it skips), while a cancelled single event is retracted"
    htmlLink:
      type: url
      displayName: Link
      description: the event's `htmlLink` — its page in Google Calendar, which
        Google guarantees absolute
    summary:
      type: string
      displayName: Summary
      description: the event's `summary`, its title line
    description:
      type: text
      displayName: Description
      description: "the event's `description` — free prose, sometimes with
        HTML in it, as Google stores it"
    location:
      type: string
      displayName: Location
      description: the event's `location`, as free text
    colorId:
      type: string
      displayName: Colour ID
      description: "the event's `colorId` — an index into Google's `colors`
        palette, not a colour"
    eventLabelId:
      type: string
      displayName: Event label ID
      description: "the event's `eventLabelId` — an entry of the calendar's
        own `labelProperties.eventLabels`, which supersedes `colorId`"
    # THE API'S OWN `start`/`end`, beside the trait's resolved `at`/`endsAt`:
    # `at` cannot say whether Google sent a `date` or a `dateTime`, nor which
    # wall-clock zone a floating time was written in, so the object is
    # declared with each field typed exactly — which is what makes "an all-day
    # event" a question about `start.date` rather than a stored boolean.
    start:
      type: object
      displayName: Start
      description: "the event's `start` — a civil date for an all-day event,
        an instant otherwise; the resolved instant is the trait's `at`"
      fields:
        date:
          type: date
          description: "the civil date an ALL-DAY event starts on; set exactly
            when `dateTime` is not"
        dateTime:
          type: datetime
          description: the instant a timed event starts at, as Google sends
            it
        timeZone:
          type: timezone
          description: "the IANA zone the wall clock is written in; on a recurring
            master it is the zone the whole rule resolves in"
    end:
      type: object
      displayName: End
      description: "the event's `end` — exclusive, so an all-day event ending
        on the 5th ends at the start of the 5th; resolved into `endsAt`"
      fields:
        date:
          type: date
          description: the civil date an ALL-DAY event ends on, exclusive
        dateTime:
          type: datetime
          description: the instant a timed event ends at, as Google sends
            it
        timeZone:
          type: timezone
          description: the IANA zone the end's wall clock is written in
    endTimeUnspecified:
      type: bool
      displayName: End unspecified
      description: "the event's `endTimeUnspecified` — Google filled `end`
        in for an event whose author gave none"
    # THE ONE COLLISION between Google's names and the dialect's. Google's
    # `recurrence` is an ARRAY of iCalendar lines (RRULE, EXDATE, RDATE); the
    # `recurring` trait's `recurrence` is the single RRULE string a window
    # read reads. The trait wins the name (§4) and Google's array rides beside
    # it, verbatim, under its own name suffixed by what it is.
    recurrenceLines:
      type: string
      repeated: true
      displayName: Recurrence lines
      description: "Google's `recurrence` array verbatim — the RRULE, EXDATE
        and RDATE lines, which is what regenerates the iCalendar exactly"
    originalStartTime:
      type: object
      displayName: Original start
      description: "the event's `originalStartTime` — the slot of the series
        this event replaces, in Google's own spelling; resolved to `originalAt`"
      fields:
        date:
          type: date
          description: the civil date of the slot, on an all-day series
        dateTime:
          type: datetime
          description: the instant of the slot, on a timed series
        timeZone:
          type: timezone
          description: the IANA zone the slot's wall clock is written in
    transparency:
      type: enum
      values:
        - value: opaque
          label: opaque
        - value: transparent
          label: transparent
      displayName: Transparency
      description: "whether the event blocks time: opaque is busy, transparent
        is free; Google omits it on the default (opaque)"
    visibility:
      type: enum
      values:
        - value: default
          label: default
        - value: public
          label: public
        - value: private
          label: private
        - value: confidential
          label: confidential
      displayName: Visibility
      description: "the event's `visibility`; confidential is a compatibility
        spelling of private"
    sequence:
      type: int
      displayName: Sequence
      description: the event's `sequence`, iCalendar's revision counter for
        this event
    attendeesOmitted:
      type: bool
      displayName: Attendees omitted
      description: "the event's `attendeesOmitted` — Google truncated the
        guest list, so `attendees` is not the whole of it"
    extendedProperties:
      type: object
      displayName: Extended properties
      description: "the event's `extendedProperties` — arbitrary key/value
        data an application stored on this event"
      fields:
        private:
          type: string
          keyed: true
          description: properties visible only to the copy of the event on
            this calendar
        shared:
          type: string
          keyed: true
          description: properties visible to every copy of the event on every
            attendee's calendar
    hangoutLink:
      type: url
      displayName: Hangout link
      description: "the event's `hangoutLink` — the Meet URL, which Google
        guarantees absolute; a legacy field beside `conferenceData`"
    conferenceData:
      type: object
      displayName: Conference data
      description: the event's `conferenceData` — the conference attached
        to it, its entry points and the request that created it
      fields:
        conferenceId:
          type: string
          description: the conference's own id, for correlating with the provider's
            records
        signature:
          type: string
          description: Google's signature over a conference it created, absent
            on a pending request
        notes:
          type: text
          description: "additional notes to show the user, such as domain-administrator
            instructions; prose, and Google admits HTML in it"
        conferenceSolution:
          type: object
          description: which conferencing product this is
          fields:
            name:
              type: string
              description: the product's user-visible name, as its provider
                spelled it
            iconUri:
              type: url
              description: the absolute URL of the product's icon, which Google
                sends as a full https link
            key:
              type: object
              description: the solution's type key
              fields:
                type:
                  type: string
                  description: "the solution type — documented as eventHangout,
                    eventNamedHangout and hangoutsMeet, and an open list a
                    client must tolerate unknown values in"
        entryPoints:
          type: object
          repeated: true
          description: one way of joining the conference — a video link, a
            phone number, a SIP address, or further instructions
          fields:
            entryPointType:
              type: enum
              values:
                - value: video
                  label: video
                - value: phone
                  label: phone
                - value: sip
                  label: sip
                - value: more
                  label: more
              description: how this entry point joins the conference, as Google
                closes the set
            uri:
              type: url
              description: "how this entry point is reached — an https link,
                a `tel:` number or a `sip:` address, each an absolute URI"
            label:
              type: string
              description: the entry point's user-visible label, which Google
                shows in place of the raw URI
            pin:
              type: string
              description: the PIN a phone or SIP caller enters to join, when
                the conference needs one
            accessCode:
              type: string
              description: the access code a caller enters to join, when the
                provider issues one
            meetingCode:
              type: string
              description: the meeting code a caller enters to join, when
                the provider issues one
            passcode:
              type: string
              description: the passcode a caller enters to join, when the
                provider issues one
            password:
              type: string
              description: the password a caller enters to join, when the
                provider issues one
            regionCode:
              type: string
              description: "the CLDR/ISO 3166-1 alpha-2 region of a phone
                entry point, set only on `phone`"
            entryPointFeatures:
              type: string
              repeated: true
              description: "the entry point's features (toll, toll_free) —
                a list Google grows"
        createRequest:
          type: object
          description: the request that asked Google to create this conference,
            and how it ended
          fields:
            requestId:
              type: string
              description: the client-generated id that makes the create request
                idempotent at Google
            conferenceSolutionKey:
              type: object
              description: the solution type the request asked for
              fields:
                type:
                  type: string
                  description: "the solution type asked for — documented as
                    eventHangout, eventNamedHangout and hangoutsMeet, and
                    an open list a client must tolerate unknown values in"
            status:
              type: object
              description: how the create request ended
              fields:
                statusCode:
                  type: enum
                  values:
                    - value: pending
                      label: pending
                    - value: success
                      label: success
                    - value: failure
                      label: failure
                  description: "pending, success or failure, as Google closes
                    the set"
        parameters:
          type: object
          description: the add-on parameters a third-party conference provider
            stored on this conference
          fields:
            addOnParameters:
              type: object
              description: the add-on's own key/value bag
              fields:
                parameters:
                  type: string
                  keyed: true
                  description: the add-on's parameters, key to value
    # Deprecated at Google, and still sent: the reference says the structure
    # is now only used for birthday-calendar metadata. `title` is reserved at
    # every level of the dialect, so the gadget's rides as `gadgetTitle`.
    gadget:
      type: object
      displayName: Gadget
      description: "the event's `gadget` — deprecated at Google and now only
        carrying birthday-calendar metadata"
      fields:
        type:
          type: string
          description: the gadget's MIME type, which Google documents as free
            text rather than a closed set
        link:
          type: url
          description: "the gadget's `link` — the absolute https URL Google
            requires it to be served from"
        iconLink:
          type: url
          description: "the gadget's `iconLink` — the absolute https URL of
            its icon, which Google requires to be https"
        gadgetTitle:
          type: string
          description: the gadget's `title` — renamed because `title` is reserved
            at every level of the dialect
        display:
          type: enum
          values:
            - value: icon
              label: icon
            - value: chip
              label: chip
          description: "how the gadget is displayed, which Google closes at
            two: an icon beside the title, or a chip in the detail view"
        width:
          type: int
          description: the gadget's preferred width in pixels, set only when
            it displays as a chip
        height:
          type: int
          description: the gadget's preferred height in pixels, set only when
            it displays as a chip
        preferences:
          type: string
          keyed: true
          description: the gadget's preferences, key to value
    anyoneCanAddSelf:
      type: bool
      displayName: Anyone can add self
      description: the event's `anyoneCanAddSelf` — whether anyone may invite
        themselves to it
    guestsCanInviteOthers:
      type: bool
      displayName: Guests can invite
      description: the event's `guestsCanInviteOthers` flag
    guestsCanModify:
      type: bool
      displayName: Guests can modify
      description: the event's `guestsCanModify` flag
    guestsCanSeeOtherGuests:
      type: bool
      displayName: Guests see guests
      description: the event's `guestsCanSeeOtherGuests` flag
    privateCopy:
      type: bool
      displayName: Private copy
      description: "the event's `privateCopy` — this copy is not propagated
        to the other attendees' calendars"
    locked:
      type: bool
      displayName: Locked
      description: "the event's `locked` — a copy whose main fields cannot
        be changed"
    reminders:
      type: object
      displayName: Reminders
      description: "the event's `reminders` FOR THIS ACCOUNT: the calendar's
        defaults, or the overrides this account set"
      fields:
        useDefault:
          type: bool
          description: whether the calendar's `defaultReminders` apply rather
            than the overrides below
        overrides:
          type: object
          repeated: true
          description: the reminders this account set on this event, when
            it set any
          fields:
            method:
              type: enum
              values:
                - value: email
                  label: email
                - value: popup
                  label: popup
              description: the reminder's delivery method, as Google closes
                it
            minutes:
              type: int
              description: how many minutes before the event the reminder
                fires
    source:
      type: object
      displayName: Source
      description: "the event's `source` — the web page or message the event
        was created from; only its creator sees it"
      fields:
        url:
          type: url
          description: the source's URL, which Google requires to be http
            or https
        sourceTitle:
          type: string
          description: the source's `title` — renamed because `title` is reserved
            at every level of the dialect
    workingLocationProperties:
      type: object
      displayName: Working location
      description: the event's `workingLocationProperties` — where the owner
        is working, on an eventType of workingLocation
      fields:
        type:
          type: enum
          values:
            - value: homeoffice
              label: homeOffice
            - value: officelocation
              label: officeLocation
            - value: customlocation
              label: customLocation
          description: which of the three sub-fields below carries the detail
        # A PRESENCE-ONLY CONTRACT, stated exactly. Google types `homeOffice`
        # as `any` and sends `{}` — every payload observed carries the empty
        # object and nothing else. The dialect has no empty-object value (a
        # `fields: {}` is refused, and `json` is forbidden as an object
        # field), so this property says ONE thing and says it precisely:
        # `true` means Google sent the key. It does NOT hold whatever the key
        # held. If Google ever sends a value here, the value is not mirrored
        # — the sync names it on `account.calendarSyncStatus` instead of
        # discarding it in silence, and the fix is a package bump that gives
        # the field its real shape. Engine ask: an empty-object value, or a
        # `json` field inside an object.
        homeOffice:
          type: bool
          description: "`true` means Google SENT `homeOffice` (always as an
            empty object, meaning working at home); it holds no value of its
            own"
        officeLocation:
          type: object
          description: the office the owner is working from
          fields:
            label:
              type: string
              description: the office's user-visible name, as the owner's
                organisation spelled it
            buildingId:
              type: string
              description: the building's id in the organisation's Workspace
                resource database
            floorId:
              type: string
              description: the floor's id in the organisation's Workspace
                resource database
            floorSectionId:
              type: string
              description: the floor section's id in the organisation's Workspace
                resource database
            deskId:
              type: string
              description: the desk's id in the organisation's Workspace resource
                database
        customLocation:
          type: object
          description: the custom location the owner is working from
          fields:
            label:
              type: string
              description: the free-text place the owner typed, when it is
                neither home nor a known office
    outOfOfficeProperties:
      type: object
      displayName: Out of office
      description: the event's `outOfOfficeProperties`, on an eventType of
        outOfOffice
      fields:
        autoDeclineMode:
          type: enum
          values:
            - value: declinenone
              label: declineNone
            - value: declineallconflictinginvitations
              label: declineAllConflictingInvitations
            - value: declineonlynewconflictinginvitations
              label: declineOnlyNewConflictingInvitations
          description: which overlapping invitations Google declines while
            this event stands
        declineMessage:
          type: text
          description: "the prose sent to whoever's invitation was auto-declined,
            as the owner wrote it; plain text"
    focusTimeProperties:
      type: object
      displayName: Focus time
      description: the event's `focusTimeProperties`, on an eventType of focusTime
      fields:
        autoDeclineMode:
          type: enum
          values:
            - value: declinenone
              label: declineNone
            - value: declineallconflictinginvitations
              label: declineAllConflictingInvitations
            - value: declineonlynewconflictinginvitations
              label: declineOnlyNewConflictingInvitations
          description: which overlapping invitations Google declines while
            this event stands
        declineMessage:
          type: text
          description: "the prose sent to whoever's invitation was auto-declined,
            as the owner wrote it; plain text"
        chatStatus:
          type: enum
          values:
            - value: available
              label: available
            - value: donotdisturb
              label: doNotDisturb
          description: what the owner is marked as in Chat while this event
            stands
    attachments:
      type: object
      repeated: true
      displayName: Attachments
      description: "the event's `attachments` — the Drive files attached to
        it, each entry's own metadata as the Event resource carries it"
      fields:
        # THE DRIVE SCOPE BOUNDARY, stated rather than left to inference
        # (`docs/kind-design.md` §3 makes an id we mirror a reference). This
        # bundle requests no Drive scope and mirrors no Drive resource, so
        # there is no `file` kind for this id to point at: a reference would
        # dangle at a row nothing in this package can ever write. It is
        # therefore the API's own opaque string, and the day a Drive stream
        # is added it becomes a reference and the package is bumped. It is
        # NEVER the `gmailattachment` kind, which is a MIME part of a
        # message and a different object entirely.
        fileId:
          type: string
          description: "the Drive file's id, as an opaque string: this bundle
            mirrors no Drive resource, so there is no `file` kind to point
            at"
        fileUrl:
          type: url
          description: the file's URL, which Google guarantees absolute
        attachmentTitle:
          type: string
          description: the attachment's `title` — renamed because `title`
            is reserved at every level of the dialect
        mimeType:
          type: string
          description: the Drive file's media type, as Google's Drive records
            it for the attached file
        iconLink:
          type: url
          description: the URL of the file type's icon, which Google guarantees
            absolute
    eventType:
      type: enum
      values:
        - value: default
          label: default
        - value: birthday
          label: birthday
        - value: focustime
          label: focusTime
        - value: fromgmail
          label: fromGmail
        - value: outofoffice
          label: outOfOffice
        - value: workinglocation
          label: workingLocation
      displayName: Event type
      description: "the event's `eventType`, which Google closes at six and
        fixes at creation; the matching *Properties object carries the detail"
    # --- relations -----------------------------------------------------------
    # The plain references first, then the objects that hold one, which is the
    # order `docs/kind-design.md` §5 asks this group for.
    #
    # REQUIRED: the walk is per-calendar, so the sync always knows the
    # enclosing calendar, and a row with no calendar is one nothing can place.
    # Declared fresh at this package version — no stored row predates it,
    # because version 17's purge-and-resync cleared the package's records.
    calendar:
      type: reference
      kind: providers.substrate.reamde.dev/google/calendar
      required: true
      onDelete: cascade
      displayName: Calendar
      description: "the calendar this row lives in; no `calendarId` scalar
        beside it — a copy of a referent's key is a derived property"
    # THE PEOPLE ON IT, as OCCURRENCE ARRAYS rather than repeated references.
    # Google gives creator, organizer and each attendee as an embedded object
    # with no stable id of its own — the ADDRESS is the identity it reuses
    # across Calendar, Gmail and People — but the entry carries more than a
    # few flat scalars and Google DOES repeat an address (a room invited as
    # itself and as a resource), which a repeated reference refuses. So the
    # entry is the API's own, typed, with the identity a reference FIELD
    # inside it.
    #
    # `creator` and `organizer` are single objects because Google sends one;
    # `attendees` is the array. Version 17's `attendeeEmails`,
    # `organizerEmail` and `creatorEmail` scalar duplicates are gone: the
    # `value` field inside each entry is the probe, and it is the entry's own
    # field rather than a second copy of a referent's key.
    creator:
      type: object
      displayName: Creator
      description: the event's `creator`, with the address a reference at
        the hub
      fields:
        value:
          type: email
          description: "the mailbox in the bundle's normal form — DOMAIN lowercased,
            local part verbatim — the probe a person mapping reads without
            walking the reference"
        address:
          type: reference
          kind: providers.substrate.reamde.dev/google/emailaddress
          description: the hub row for this address, which a mail header and
            an address-book entry reach too
        displayName:
          type: string
          description: the name THIS event spelled for them, when it spelled
            one
        self:
          type: bool
          description: "Google's own `self` — whether this entry IS the connected
            account, which is Google's fact about the caller"
        googleId:
          type: string
          description: the entry's opaque Google profile `id`, when Google
            sends one
    organizer:
      type: object
      displayName: Organizer
      description: "the event's `organizer` — on a shared calendar, usually
        the calendar itself"
      fields:
        value:
          type: email
          description: "the mailbox in the bundle's normal form — DOMAIN lowercased,
            local part verbatim — the probe a person mapping reads without
            walking the reference"
        address:
          type: reference
          kind: providers.substrate.reamde.dev/google/emailaddress
          description: the hub row for this address, which a mail header and
            an address-book entry reach too
        displayName:
          type: string
          description: the name THIS event spelled for them, when it spelled
            one
        self:
          type: bool
          description: "Google's own `self` — whether this entry IS the connected
            account, which is Google's fact about the caller"
        googleId:
          type: string
          description: the entry's opaque Google profile `id`, when Google
            sends one
    attendees:
      type: object
      repeated: true
      displayName: Attendees
      description: "the event's `attendees`, each entry whole: what this invitation
        said, with the address a reference at the hub"
      fields:
        value:
          type: email
          description: "the mailbox in the bundle's normal form — DOMAIN lowercased,
            local part verbatim — the probe a person mapping reads without
            walking the reference"
        address:
          type: reference
          kind: providers.substrate.reamde.dev/google/emailaddress
          description: the hub row for this address, which a mail header and
            an address-book entry reach too
        displayName:
          type: string
          description: the name THIS event spelled for them, when it spelled
            one
        self:
          type: bool
          description: "Google's own `self` — whether this entry IS the connected
            account, which is Google's fact about the caller"
        googleId:
          type: string
          description: the entry's opaque Google profile `id`, when Google
            sends one
        responseStatus:
          type: enum
          values:
            - value: needsaction
              label: needsAction
            - value: declined
              label: declined
            - value: tentative
              label: tentative
            - value: accepted
              label: accepted
          description: "the attendee's `responseStatus`, which Google closes
            at four; spelled lowercase with the API's word as the label"
        optional:
          type: bool
          description: the entry's `optional` — whether this is an optional
            attendee
        organizer:
          type: bool
          description: the entry's `organizer` — whether this attendee is
            also the event's organizer
        resource:
          type: bool
          description: "the entry's `resource` — whether the attendee is a
            room or a piece of equipment rather than a person"
        comment:
          type: string
          description: the attendee's own `comment` on the invitation
        additionalGuests:
          type: int
          description: the entry's `additionalGuests` — how many extra people
            this attendee is bringing
        # Closed, not extensible: the Event reference documents one value and
        # gives no tolerate-the-unknown instruction, which is the test this
        # stream applies (see the comment on `calendar.conferenceProperties`).
        # A seventh word from Google is named on the run's status line, never
        # written and never silently dropped.
        asyncOperation:
          type: enum
          values:
            - value: inprogress
              label: inProgress
          description: "the entry's `asyncOperation` — the state of a long-running
            guest-list change Google is still applying"
    # The last object holding a reference: `birthdayProperties.contact` is a
    # People RESOURCE NAME, which is an id this bundle mirrors, so it is the
    # pointer and not a string. It dangles when contacts are not synced, which
    # is real data rather than a bug, so it does not `mustExist`.
    birthdayProperties:
      type: object
      displayName: Birthday
      description: the event's `birthdayProperties`, on an eventType of birthday
        — which contact the date belongs to
      fields:
        type:
          type: enum
          values:
            - value: anniversary
              label: anniversary
            - value: birthday
              label: birthday
            - value: custom
              label: custom
            - value: other
              label: other
            - value: self
              label: self
          description: which kind of special date this is; `self` is the calendar
            owner's own birthday
        customTypeName:
          type: string
          description: the owner's own label for the date, on a type of `custom`
        contact:
          type: reference
          kind: providers.substrate.reamde.dev/google/contact
          description: "the People person whose date this is, from the resource
            name Google sends; dangles when contacts are not synced"
    # --- the override trait's two --------------------------------------------
    # `recurrenceOf` IS Google's `recurringEventId`, spelled as the reference
    # it is; `originalAt` IS `originalStartTime` resolved in the SERIES' zone,
    # with the object it was decoded from declared above.
    recurrenceOf:
      type: reference
      kind: providers.substrate.reamde.dev/google/calendarseries
      onDelete: cascade
      displayName: Series
      description: "the series this event overrides one occurrence of, from
        `recurringEventId`; absent on a single event, and may dangle"
    originalAt:
      type: datetime
      displayName: Original slot
      description: "the slot the series' rule produced that this event replaces,
        resolved in the series' zone (iCalendar's RECURRENCE-ID)"
    # --- instants ------------------------------------------------------------
    # `at`/`endsAt` are the temporal trait's, resolved from `start`/`end`, and
    # are not listed here.
    created:
      type: datetime
      displayName: Created
      description: the event's `created` instant, as Google stamped it
    updated:
      type: datetime
      displayName: Updated
      description: "the event's `updated` instant — Google's own last-modified
        stamp, and what an idempotence assertion watches move"
---
kind: substrate.reamde.dev/core/function
metadata:
  id: providers.substrate.reamde.dev/google/synccalendar
data:
  authority: providers.substrate.reamde.dev
  package: google
  description: >-
    Sync a Google account's calendars: drain each calendar's events on its
    own sync token and mirror the calendars, the recurring series, the events
    and every attendee address under this package's own kinds.
  runtime: python
  timeout: PT1M
  permissions:
    writes:
      - providers.substrate.reamde.dev/google/calendar
      - providers.substrate.reamde.dev/google/calendarsync
      - providers.substrate.reamde.dev/google/calendarseries
      - providers.substrate.reamde.dev/google/calendarevent
      - providers.substrate.reamde.dev/google/emailaddress
      - providers.substrate.reamde.dev/google/account
    # The calendar mirror holds each calendar's own sync token; the series
    # and event mirrors drive the sweep, hand a master its stored zone and
    # cancelled slots, and are read to prove a row exists before retracting
    # it: every delta carries `cancelled` entries for events this repository
    # never stored, and deleting one that was never written is ErrNotFound
    # and would fail the whole delivery.
    reads:
      kinds:
        - providers.substrate.reamde.dev/google/calendar
        - providers.substrate.reamde.dev/google/calendarsync
        - providers.substrate.reamde.dev/google/calendarseries
        - providers.substrate.reamde.dev/google/calendarevent
      budgets:
        calls: 256
        rows: 10000
    network:
      - "www.googleapis.com"
      # The loopback seam: `config.apiBase` may only ever name a loopback
      # host, and a deployment that wants one has to allow it in the
      # sandbox's egress list too (SUBSTRATE_SANDBOX_EGRESS_ALLOW).
      - "127.0.0.1"
      - "localhost"
  source: |
    """Google Calendar sync — one events page per calendar per invocation.

    The account's live access token arrives injected on the bundle config
    (`config.accounts[].token`, host-resolved); this body never sees a client
    secret or a credential ref, and it refuses to send the token anywhere but
    https://www.googleapis.com or loopback (the test seam) — redirects
    included.

    ONE SYNC TOKEN PER CALENDAR, held in that calendar's own `calendarsync`
    state row. The token commits ONLY from the page that carries
    nextSyncToken (the final one), and — this is new — only once the
    reconciliation that page owes has FINISHED. A run that reads a full
    calendar and dies mid-sweep leaves no token, so the next run re-reads and
    re-reconciles rather than resuming a delta over a half-reconciled mirror.

    A 410 GONE — and only a 410 — means the token died. That drops to a full
    re-read of that ONE calendar under a fresh generation, followed by a sweep
    of the same calendar retracting what the read did not write.

    A COPY OF THE CALENDAR, in Google's own model. The walk is
    singleEvents=false: a recurring master is one `calendarseries` row
    carrying its rule, a modified exception is a `calendarevent` row pointing
    at it through `recurrenceOf` and naming its slot in `originalAt`, and a
    plain event is a `calendarevent` row. Nothing is expanded here: the
    records read computes the occurrences (decision 0039), so no horizon
    exists and a master exploded to 2099 costs one row.

    A CANCELLED EXCEPTION IS A ROW, NOT AN INSTANT. Version 18 retracted it
    and unioned its `originalStartTime` into the master's `cancelledSlots`,
    which lost the resource (its id, its status, its own fields), only ever
    grew, and could never be undone — a reinstated exception could not take
    its slot back even under a full re-read. It is now kept as its own
    `calendarevent` row with `status: cancelled`, and the skipped-slot
    overlay is a JOIN the reader computes outside the mirror: the series'
    `exdates`, plus the `originalAt` of every `calendarevent` referencing it
    whose status is cancelled. `calendarseries.cancelledSlots` is gone;
    `calendarseries.exdates` carries the master's OWN EXDATE decode and
    nothing from another resource.

    WHAT CANNOT BE SPELLED IS NAMED, NEVER DROPPED IN SILENCE. An enum value
    this package does not hold, a URL the `url` type would refuse, a zone
    that does not load, a second RRULE the single-rule trait cannot project,
    an RDATE in PERIOD form, a wall clock that does not exist in its zone:
    each leaves the property absent (never null) and lands on the run's
    `account.calendarSyncStatus`, so a widening at Google is one status line
    and a package bump rather than an archaeological dig. This is the
    pattern contactssync established.

    PRESENCE IS PRESERVED. A property is written from what the payload
    CARRIED. Absent becomes null ONLY from an authoritative complete
    snapshot — an events.list item that is not a tombstone, and a
    calendarList entry, both of which Google returns whole — and never from a
    thin one, which is what a `status: cancelled` tombstone is. `false`, `0`,
    `""`, `[]` and `{}` are values and survive; they are never invented and
    never turned into null.

    THE OWNER HUB IS ESTABLISHED FIRST. `account.address` is the connection's
    identity as a reference, and a CALENDAR-ONLY connection has no other
    stream to establish it. It is written at the START of this stream's work,
    before any calendar is read.

    THE API BASE. `config.inputs.client.properties.apiBase`, when set,
    replaces https://www.googleapis.com for every call, so a recorded fake
    stands in without a line of this source being rewritten. It is honoured
    ONLY for a LOOPBACK host.

    Per-account isolation (F2/F3): the per-account drain is try/except; a
    failure stamps THAT account's `calendarSyncState`/`calendarSyncStatus`
    once and leaves both lastSyncedAt and calendarLastSyncedAt alone.
    """
    import datetime as _dt
    import json as _json
    import re
    import urllib.error
    import urllib.parse
    import urllib.request
    import uuid
    from zoneinfo import ZoneInfo

    AUTHORITY = "providers.substrate.reamde.dev/google"
    ACCOUNT_TYPE = AUTHORITY + "/account"
    ADDRESS_TYPE = AUTHORITY + "/emailaddress"
    CALENDAR_TYPE = AUTHORITY + "/calendar"
    SERIES_TYPE = AUTHORITY + "/calendarseries"
    EVENT_TYPE = AUTHORITY + "/calendarevent"
    SYNC_TYPE = AUTHORITY + "/calendarsync"

    CAL_API = "https://www.googleapis.com"
    CAL_HOST = "www.googleapis.com"
    LOOPBACK_HOSTS = ("127.0.0.1", "localhost", "::1", "0.0.0.0")
    LIST_PATH = "/calendar/v3/users/me/calendarList"

    # The initial query parameters, PINNED in one place: an incremental call
    # must repeat them exactly or Google 400s the request. singleEvents=false
    # IS the walk: a master is one item carrying its rule, so a full read
    # takes timeMin alone and no ceiling, because nothing is expanded and so
    # nothing can page forever.
    EVENT_PARAMS = {"singleEvents": "false", "showDeleted": "true",
                    "maxResults": 250}
    # The walk a calendar's sync token was minted under, stamped on its
    # state row once the sweep completes. A token minted under any other walk
    # (the instance walk this one replaced) reads as absent.
    WALK = "masters"
    # A slot inside a row id: UTC, basic format, second grain — the spelling
    # the records read gives a computed occurrence, so an exception's row and
    # the occurrence it replaces share one id string.
    SLOT_FORMAT = "%Y%m%dT%H%M%SZ"
    CALENDAR_PAGE = 250
    SWEEP_PAGE = 200
    # How many row ids one calendar's full re-read may carry on its cursor before
    # the sweep gives up on being able to tell a stale row from a live one. The
    # ids are the sweep mark the engine cannot yet hold as a label (README, ask
    # 1); past this many, the sweep is skipped and logged rather than guessed at.
    SEEN_MAX = 20000
    REASON_MAX = 200
    # How many distinct unmirrored values the status line names before it says
    # "+N more". The cursor holds four times as many, so a later page's note is
    # not lost to an earlier page's flood.
    UNKNOWN_MAX = 6
    BACKFILL_DAYS = {"none": 0, "last30d": 30, "last90d": 90, "last1y": 365}
    # The RFC 5322 dot-atom production, the same one gmailsync and contactssync
    # use and for the same reason: `emailaddress.address` is an `email`-kind
    # property and the engine validates it with Go's net/mail.ParseAddress at
    # effect APPLY, where this body's try/except cannot see the failure. A looser
    # pattern (`.a@x.com`, `a..b@x.com`, `a(b@x.com` …) rolls the page's
    # transaction back and parks the drain deterministically on every retry.
    _ATEXT = r"[A-Za-z0-9!#$%&'*+/=?^_`{|}~-]+"
    _LABEL = r"[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?"
    _RE_ADDR = re.compile(
        r"^" + _ATEXT + r"(?:\." + _ATEXT + r")*@"
        + _LABEL + r"(?:\." + _LABEL + r")+$")
    # The Event resource's fields both mirrors copy under GOOGLE'S OWN NAME,
    # grouped by what the dialect makes of them. `id` is not among them (a
    # record's own id is the substrate's; the provider key rides as `eventId`),
    # and neither are the fields that need RESOLVING rather than copying:
    # `recurrence`, `recurringEventId`, `originalStartTime`, `start`, `end`.
    _STRINGS = ("iCalUID", "etag", "summary", "description", "location",
                "colorId", "eventLabelId")
    # The `url`-kind properties, which the engine VALIDATES at effect apply —
    # where this body's try/except cannot see the failure. Substrate's `url` is
    # "url.Parse succeeds AND the value is absolute", which is any URI carrying a
    # SCHEME: https, and also the `tel:` and `sip:` entry points a conference
    # carries (verified against substrate's internal/engine/validate.go and
    # net/url). A value with no scheme, or with whitespace in it, is left absent
    # and NAMED rather than written, because writing it rolls the page's
    # transaction back and parks the drain deterministically on every retry.
    _URLS = ("htmlLink", "hangoutLink")
    _RE_URI = re.compile(r"^[A-Za-z][A-Za-z0-9+.\-]*:[^\s<>\"\\]+$")
    _BOOLS = ("endTimeUnspecified", "attendeesOmitted",
              "guestsCanInviteOthers", "guestsCanModify",
              "guestsCanSeeOtherGuests", "anyoneCanAddSelf", "privateCopy",
              "locked")
    _TIMES = ("created", "updated")
    # THE ENUMS, by property, each mapping Google's own spelling to the value the
    # loader admits (`[a-z][a-z0-9]*`). A value the map does not hold is left
    # ABSENT and named on the run's status line: an enum refuses a value it does
    # not declare, and that refusal would fail the whole page, so a Google that
    # grew a seventh `eventType` costs one absent property and one visible line,
    # never a parked drain and never a silent loss.
    #
    # WHICH DOCUMENTED LISTS ARE ENUMS AT ALL is the policy the bundle states on
    # `calendar.conferenceProperties` and the README repeats: a documented list is
    # closed, and so an enum, UNLESS the API's own reference instructs the client
    # to tolerate a value it does not know. Google says exactly that for
    # conference solution types, so those three properties stay `string` and are
    # copied verbatim; every other documented Calendar list is here.
    _ENUMS = {
        "status": {"confirmed": "confirmed", "tentative": "tentative",
                   "cancelled": "cancelled"},
        "transparency": {"opaque": "opaque", "transparent": "transparent"},
        "visibility": {"default": "default", "public": "public",
                       "private": "private", "confidential": "confidential"},
        "eventType": {"default": "default", "birthday": "birthday",
                      "focusTime": "focustime", "fromGmail": "fromgmail",
                      "outOfOffice": "outofoffice",
                      "workingLocation": "workinglocation"},
        "responseStatus": {"needsAction": "needsaction", "declined": "declined",
                           "tentative": "tentative", "accepted": "accepted"},
        "asyncOperation": {"inProgress": "inprogress"},
        "accessRole": {"freeBusyReader": "freebusyreader", "reader": "reader",
                       "writerWithoutPrivateAccess": "writerwithoutprivateaccess",
                       "writer": "writer", "owner": "owner"},
        "reminderMethod": {"email": "email", "popup": "popup"},
        "notificationType": {"eventCreation": "eventcreation",
                             "eventChange": "eventchange",
                             "eventCancellation": "eventcancellation",
                             "eventResponse": "eventresponse", "agenda": "agenda"},
        "entryPointType": {"video": "video", "phone": "phone", "sip": "sip",
                           "more": "more"},
        "conferenceStatus": {"pending": "pending", "success": "success",
                             "failure": "failure"},
        "gadgetDisplay": {"icon": "icon", "chip": "chip"},
        "autoDeclineMode": {
            "declineNone": "declinenone",
            "declineAllConflictingInvitations":
                "declineallconflictinginvitations",
            "declineOnlyNewConflictingInvitations":
                "declineonlynewconflictinginvitations"},
        "chatStatus": {"available": "available", "doNotDisturb": "donotdisturb"},
        "workingLocationType": {"homeOffice": "homeoffice",
                                "officeLocation": "officelocation",
                                "customLocation": "customlocation"},
        "birthdayType": {"anniversary": "anniversary", "birthday": "birthday",
                         "custom": "custom", "other": "other", "self": "self"},
    }
    # The free/busy role: the entry is MIRRORED like every other one, and only
    # its EVENTS are not read, because Google blanks their content for this role.
    FREEBUSY = "freeBusyReader"


    class _Notes(set):
        """The run's unmirrored values, WRITING THROUGH TO THE CURSOR.

        A note can be raised on any page, and the status line that names it is
        stamped several invocations later, so the set has to survive every
        checkpoint in between. It is a set with one extra job: every `add` puts
        the sorted, bounded list straight back on the cursor, so whatever the
        phase serialises next already carries it and no caller has to remember.
        """

        def __init__(self, cur):
            set.__init__(self, cur.get("unknown") or ())
            self._cur = cur

        def add(self, value):
            set.add(self, value)
            self._cur["unknown"] = sorted(self)[:UNKNOWN_MAX * 4]


    class _NoRedirect(urllib.request.HTTPRedirectHandler):
        """urllib re-sends the Authorization header across a redirect. Refuse
        instead: a None new-request turns the 30x into an ordinary error."""

        def redirect_request(self, req, fp, code, msg, headers, newurl):
            return None


    # An EMPTY ProxyHandler, explicitly: the default opener honours
    # http_proxy/https_proxy from the runner's environment, which would route
    # the bearer through whatever that variable names.
    _OPENER = urllib.request.build_opener(
        _NoRedirect, urllib.request.ProxyHandler({}))


    def _api_base(cfg):
        """The configured API base, or Google's own host. LOOPBACK ONLY: the
        config row is owner-writable, so an arbitrary base would let an edit
        redirect the account's access token at a stranger, and a base that is
        not loopback is refused by name rather than silently ignored."""
        props = ((cfg.get("inputs") or {}).get("client") or {}).get("properties") or {}
        base = str(props.get("apiBase") or "").strip().rstrip("/")
        if not base:
            return CAL_API
        host = (urllib.parse.urlsplit(base).hostname or "").lower()
        if host not in LOOPBACK_HOSTS:
            raise RuntimeError(
                "google-calendar: config.apiBase names %s — only a loopback "
                "host may stand in for %s" % (host or "?", CAL_HOST))
        return base


    def _pinned(url, base):
        """Is this URL the base this body is allowed to call?

        Two admissions, and no third. The CONFIGURED BASE, whatever it is:
        the same scheme and host the resolved base carries — which covers
        Google's own origin, a loopback fake named on the config row, and a
        closure whose constant an e2e rewired before it was installed. And
        CAL_HOST over https, always, so a body whose base was cleared still
        cannot be pointed anywhere else.
        """
        u = urllib.parse.urlsplit(url)
        b = urllib.parse.urlsplit(base or "")
        host = (u.hostname or "").lower()
        if host and host == (b.hostname or "").lower() and u.scheme == b.scheme:
            return True
        return u.scheme == "https" and host == CAL_HOST


    def _get(base, token, path, params=None):
        # F1 origin pinning: the `network:` grant is declared but NOT
        # enforced host by host, so this refusal is the defense. It raises
        # inside the per-account try/except, so a tampered base stamps THAT
        # account erroring rather than parking the whole delivery.
        url = base + path
        if params:
            url = url + "?" + urllib.parse.urlencode(params, doseq=True)
        if not _pinned(url, base):
            parts = urllib.parse.urlsplit(url)
            raise RuntimeError(
                "google-calendar: refusing to send credentials to %s://%s — "
                "only https://%s or the configured loopback base"
                % (parts.scheme, parts.hostname or "?", CAL_HOST))
        req = urllib.request.Request(url, headers={
            "Authorization": "Bearer " + token, "Accept": "application/json"})
        with _OPENER.open(req, timeout=20) as resp:
            return _json.loads(resp.read().decode("utf-8"))


    def _http_status(e):
        return getattr(e, "code", None)


    def _where(cur):
        """The failing phase, and the calendar it was on, as a prefix for the
        status line. Empty while the drain is still planning, because there is
        nothing more specific to say than the account."""
        phase = str(cur.get("phase") or "")
        cals = [str(c) for c in (cur.get("cals") or []) if c]
        if phase and cals and phase != "calendars":
            return "%s of %s: " % (phase, cals[0][:REASON_MAX // 2])
        return "%s: " % phase if phase else ""


    def _reason(e):
        """The failure in one line, and its CLASS first.

        The words matter: the status is what the console shows and what the e2e
        asserts on, so each class is named rather than left as a status code.
        401 is PERMANENT until the owner reconnects; 403 is the stream being
        unavailable to this grant; 429 is transient and says when; everything
        else is transient and the cadence retries it.
        """
        code = _http_status(e)
        if code == 401:
            return ("reconnect needed: Google refused the grant (401) — the "
                    "token was revoked or expired beyond refresh")
        if code == 403:
            return ("stream not available: Google refused the call (403) — is "
                    "calendar.readonly granted? a reconnect may be needed")
        if code == 429:
            return "rate limited by Google (429) — the retry is scheduled"
        if code is not None:
            return "google returned HTTP %d" % code
        return str(e) or type(e).__name__


    def _events_path(cid):
        return "/calendar/v3/calendars/%s/events" % urllib.parse.quote(cid, safe="")


    def _calendar_id(host, aid, cid):
        return host.ids.external("gcal-calendar", aid, cid)


    def _event_id(host, cref, eid):
        # NESTED, never composed: a Google event id is unique per CALENDAR,
        # and "cal/event" string composition is not injective ("a/b" + "/" +
        # "c" reads the same as "a" + "/" + "b/c") — the very bug the contact
        # id migration exists to undo. The calendar's own derived id is the
        # account component of the event's.
        return host.ids.external("gcal-event", cref, eid)


    def _series_id(host, cref, mid):
        return host.ids.external("gcal-series", cref, mid)


    def _slot(stamp):
        parsed = _parse(stamp)
        if parsed is None:
            return ""
        return parsed.astimezone(_dt.timezone.utc).strftime(SLOT_FORMAT)


    def _exception_id(sref, slot):
        # `<series row id>_<slot>`: the id the records read computes for
        # the occurrence this exception replaces.
        return "%s_%s" % (sref, _slot(slot))


    def _address_id(host, aid, addr):
        return host.ids.external("google-address", aid, addr)


    def _mailbox(raw):
        """The bundle's mailbox NORMAL FORM, or "" when it does not parse.

        Trim, lowercase the DOMAIN (DNS is case-insensitive), leave the LOCAL
        PART exactly as the API spelled it: RFC 5321 §2.4 reserves the local
        part's case for the receiving host, so lowercasing it rewrites somebody
        else's identity. Version 18 lowercased the whole mailbox and destroyed
        the distinction. The same three lines must live in the gmail and calendar
        streams, or the hub stops converging.
        """
        text = str(raw or "").strip()
        if "@" not in text:
            return ""
        local, _, domain = text.rpartition("@")
        normal = local + "@" + domain.lower()
        return normal if _RE_ADDR.match(normal) else ""


    def _now():
        return _dt.datetime.now(_dt.timezone.utc).replace(microsecond=0)


    def _iso(ts):
        """An instant as RFC 3339 UTC, AT THE PRECISION IT ARRIVED WITH.

        Version 18 truncated to whole seconds, which threw away the
        milliseconds Google stamps on `updated` — the one field an idempotence
        check watches move, and the tie-break between two edits in the same
        second. `isoformat()` prints the microseconds only when there are any,
        so a whole-second instant still reads as one.
        """
        return ts.astimezone(_dt.timezone.utc).isoformat().replace("+00:00", "Z")


    def _parse(ts):
        try:
            return _dt.datetime.fromisoformat(str(ts).replace("Z", "+00:00"))
        except (TypeError, ValueError):
            return None


    def _zone_name(name, notes=None, where=""):
        # A `timezone`-kind property only admits a name the host can load, so
        # anything else is left absent — and NAMED, because a zone Google sent
        # that this runtime cannot load changes how every instant on the row
        # resolves and must not pass unremarked.
        name = str(name or "").strip()
        if not name:
            return ""
        try:
            ZoneInfo(name)
        except Exception:
            if notes is not None:
                notes.add("%s names the zone %s, which does not load"
                          % (where or "timeZone", name[:40]))
            return ""
        return name


    def _zone(name):
        try:
            return ZoneInfo(name)
        except Exception:
            return _dt.timezone.utc


    def _localize(naive, zone, notes, where):
        """A WALL CLOCK resolved in ONE named zone, deterministically.

        Google sends an offsetless `dateTime` beside a `timeZone`, and the zone
        is the only thing that makes it an instant. Two civil times are not
        instants at all:

          * a NONEXISTENT one, in the hour a spring-forward skips. There is no
            such moment; `fold` cannot choose between two offsets that do not
            both exist. The value is resolved with the offset in force BEFORE
            the transition (the deterministic choice) and NAMED, because it is
            a value Google should not have been able to store.
          * an AMBIGUOUS one, in the hour an autumn fall-back repeats. Both
            offsets are real. `fold=0` — the EARLIER of the two, PEP 495's
            default — is taken always, so the same payload resolves the same
            way on every re-read, and the choice is named once per zone.

        Named, not guessed at, and never silently different between two runs.
        """
        aware = naive.replace(tzinfo=zone, fold=0)
        other = naive.replace(tzinfo=zone, fold=1)
        roundtrip = aware.astimezone(_dt.timezone.utc).astimezone(zone)
        if roundtrip.replace(tzinfo=None) != naive:
            notes.add("%s is a wall clock that does not exist in %s (the offset "
                      "before the change was used)" % (where, _tzname(zone)))
        elif aware.utcoffset() != other.utcoffset():
            notes.add("%s is an ambiguous wall clock in %s (the earlier of the "
                      "two offsets was used)" % (where, _tzname(zone)))
        return aware


    def _tzname(zone):
        return getattr(zone, "key", None) or str(zone)


    def _value_zone(value, fallback, notes, where):
        """The zone ONE `start`/`end`/`originalStartTime` object resolves in.

        ITS OWN `timeZone` first, and only then the caller's. Version 18 passed
        one zone — picked from start-or-end — into all three, so an `end` in
        another zone and an `originalStartTime` carrying its own both resolved
        against somebody else's wall clock.
        """
        own = _zone_name((value or {}).get("timeZone"), notes, where + ".timeZone")
        return _zone(own) if own else fallback


    def _wants(acct):
        # The owner's PAUSE holds the scheduled path too (the `sync` trait's
        # `syncPaused`, decision 0085). The dispatcher settles a paused account's
        # RECORD-sourced deliveries as skips before this body ever runs, and
        # nothing else would stop the hourly tick walking it. A pause is not a
        # disabled stream: every toggle and every cursor is exactly where it was
        # when it lifts.
        props = acct.get("properties") or {}
        return bool(props.get("enabledCalendar")) and not props.get("syncPaused")


    def _requested(props):
        """An unspent "sync now" for THIS stream.

        `syncRequestedAt` is a GENERATION and `calendarSyncRequestedAck` is what
        this stream last spent; while they disagree the request is outstanding.
        It OVERRIDES the cadence — a request that still had to wait an hour would
        not be a request — and it is the only thing that can drive a re-seeded
        account at all: a purge leaves the account row and its
        `calendarLastSyncedAt` standing, so both the on-connect guard and the
        cadence gate say "nothing to do" on every later seed.
        """
        requested = str(props.get("syncRequestedAt") or "")
        return bool(requested) and \
            str(props.get("calendarSyncRequestedAck") or "") != requested


    def _retry_after(e):
        """A 429's `Retry-After`, as the instant the account may be called again.

        A 429 SAYS WHEN (docs/provider-practices.md §5), and a drain that ignores
        it retries into the same wall on the next tick. The header is seconds or
        an HTTP date; anything unreadable falls back to a minute, because a 429
        with no usable hint is still a 429.
        """
        if getattr(e, "code", None) != 429:
            return ""
        raw = ""
        try:
            raw = str((getattr(e, "headers", None) or {}).get("Retry-After") or "")
        except Exception:
            raw = ""
        seconds = 60
        raw = raw.strip()
        if raw.isdigit():
            seconds = max(1, min(int(raw), 3600))
        elif raw:
            try:
                import email.utils as _eu
                when = _eu.parsedate_to_datetime(raw)
                if when is not None:
                    if when.tzinfo is None:
                        when = when.replace(tzinfo=_dt.timezone.utc)
                    seconds = max(1, int((when - _now()).total_seconds()))
            except Exception:
                seconds = 60
        return _iso(_now() + _dt.timedelta(seconds=seconds))


    def _due(props):
        freq = (props.get("syncFrequency") or "daily").lower()
        # A 429 SAYS WHEN. Until that instant nothing about this account is due —
        # not the cadence, and not a "sync now" either, because the wall is
        # Google's and no amount of asking moves it.
        wall = _parse(props.get("retryNotBefore"))
        if wall is not None and _now() < wall:
            return False
        if _requested(props):
            return True
        if freq == "off":
            return False
        last = _parse(props.get("calendarLastSyncedAt"))
        if last is None:
            return True
        hours = 1 if freq == "hourly" else 24
        return _dt.datetime.now(_dt.timezone.utc) - last >= _dt.timedelta(hours=hours)


    def _floor(props, anchor):
        # F4, the same table gmail uses: the window floor comes off the
        # stream's stored backfill ANCHOR — the first run's start instant —
        # never off a clock read per run. `none` is from-connect-forward.
        depth = str(props.get("backfillDepth") or "last30d").lower()
        if depth == "all":
            return ""
        base = _parse(anchor) or _now()
        return _iso(base - _dt.timedelta(days=BACKFILL_DAYS.get(depth, 30)))


    def _params(cur):
        params = dict(EVENT_PARAMS)
        token = cur.get("syncToken") or ""
        if token:
            # Google refuses timeMin beside a syncToken, and every other
            # parameter must repeat the initial request exactly.
            params["syncToken"] = token
        elif cur.get("floor"):
            # `timeMin` is a lower bound on an event's END, not its start: an
            # event that began before the floor and ends after it IS returned.
            # The sweep's own bound has to say the same thing or a stale row
            # straddling the floor can never be retracted — see `_sweep`.
            params["timeMin"] = cur["floor"]
        if cur.get("pageToken"):
            params["pageToken"] = cur["pageToken"]
        return params


    def _enum(name, value, notes, where):
        """Google's own word as the enum value the loader admits, or None — VISIBLY.

        The ONE normaliser, and the contactssync contract: None here means the
        CALLER leaves the property ABSENT (it never writes null), and the value
        that could not be spelled is recorded in `notes` so the run names it on
        `account.calendarSyncStatus`. A page is never refused for a widening, and
        a widening is never silent.
        """
        if not isinstance(value, str):
            if value is not None:
                notes.add("%s is not a string" % where)
            return None
        word = value.strip()
        if not word:
            return None
        held = _ENUMS.get(name, {}).get(word)
        if held is None:
            notes.add("%s=%s" % (where, word[:40]))
        return held


    def _party(host, aid, entry, notes, where, attendee=False):
        """One creator / organizer / attendee entry, as the OCCURRENCE OBJECT the
        kind declares: the API's own fields, typed, with the identity a
        `reference` FIELD inside.

        Not a reference with link properties. Google repeats an address (a room
        invited as itself and as a resource), and a repeated reference refuses a
        duplicate target; and `responseStatus` beside a nested entry is more than
        link data holds. An entry whose address does not parse still becomes an
        entry — the display name and the response are real — it just carries no
        `value` and no pointer.

        PRESENCE, NOT TRUTHINESS. `self: false`, `optional: false`, `comment: ""`
        and `additionalGuests: 0` are all things Google said, and version 18
        dropped every one of them by testing the value rather than the key.
        """
        entry = entry or {}
        out = {}
        addr = _mailbox(entry.get("email"))
        if addr:
            out["value"] = addr
            out["address"] = {"ref": _address_id(host, aid, addr)}
        if "displayName" in entry and entry["displayName"] is not None:
            out["displayName"] = str(entry["displayName"])
        if entry.get("id") is not None:
            out["googleId"] = str(entry["id"])
        if isinstance(entry.get("self"), bool):
            out["self"] = entry["self"]
        if attendee:
            status = _enum("responseStatus", entry.get("responseStatus"),
                           notes, where + ".responseStatus")
            if status:
                out["responseStatus"] = status
            for flag in ("optional", "organizer", "resource"):
                if isinstance(entry.get(flag), bool):
                    out[flag] = entry[flag]
            if "comment" in entry and entry["comment"] is not None:
                out["comment"] = str(entry["comment"])
            if isinstance(entry.get("additionalGuests"), int) \
                    and not isinstance(entry.get("additionalGuests"), bool):
                out["additionalGuests"] = entry["additionalGuests"]
            operation = _enum("asyncOperation", entry.get("asyncOperation"),
                              notes, where + ".asyncOperation")
            if operation:
                out["asyncOperation"] = operation
        return addr, (out or None)


    def _ref(rid, link=None):
        """A reference VALUE: the pointer under `ref`, the link data beside it.

        A pinned reference takes a bare id, so the composed row id is the whole
        of the pointer; every other key in the object is link data the reference
        must declare.
        """
        if not rid:
            return None
        out = {"ref": rid}
        for key, value in (link or {}).items():
            if value is not None:
                out[key] = value
        return out


    def _uri(value, notes, where):
        """A value the `url` property type will actually admit, or "".

        Substrate's `url` is `url.Parse` plus `IsAbs()`, which is any URI with a
        SCHEME — `https:`, and equally the `tel:` and `sip:` entry points a
        conference carries. That was checked against substrate's own
        `internal/engine/validate.go` before this stream stopped calling them
        strings. What is refused here is what Go would refuse or what would park
        the drain: a scheme-less value, or whitespace inside one. It is NAMED,
        not silently dropped.
        """
        text = str(value or "").strip()
        if not text:
            return ""
        if not _RE_URI.match(text):
            notes.add("%s is not an absolute URI (%s)" % (where, text[:40]))
            return ""
        return text


    def _instant(value, fallback, notes, where):
        """One `start`/`end`/`originalStartTime` object as ONE instant, resolved
        in ITS OWN zone — the caller's only when the object names none."""
        value = value or {}
        zone = _value_zone(value, fallback, notes, where)
        if value.get("dateTime"):
            ts = _parse(value["dateTime"])
            if ts is None:
                notes.add("%s.dateTime is not an instant (%s)"
                          % (where, str(value["dateTime"])[:40]))
                return ""
            if ts.tzinfo is None:
                ts = _localize(ts, zone, notes, where + ".dateTime")
            return _iso(ts)
        if value.get("date"):
            try:
                day = _dt.date.fromisoformat(str(value["date"]))
            except ValueError:
                notes.add("%s.date is not a civil date (%s)"
                          % (where, str(value["date"])[:40]))
                return ""
            return _iso(_localize(_dt.datetime(day.year, day.month, day.day),
                                  zone, notes, where + ".date"))
        return ""


    def _verbatim(item):
        original = item.get("originalStartTime") or {}
        return str(original.get("dateTime") or original.get("date") or "")


    def _is_exception(item):
        return bool(item.get("recurringEventId")) and bool(_verbatim(item))


    def _own_zone(item, notes=None):
        start, end = item.get("start") or {}, item.get("end") or {}
        return (_zone_name(start.get("timeZone"), notes, "start.timeZone")
                or _zone_name(end.get("timeZone"), notes, "end.timeZone"))


    def _ical_instant(value, zone, notes, keyword):
        # iCalendar's own spellings, all three: 20260805T130000Z (UTC),
        # 20260805T130000 (local to the line's TZID, or the series' zone)
        # and 20260805 (an all-day series' date).
        text = str(value or "").strip()
        if text.endswith("Z"):
            text, zone = text[:-1], _dt.timezone.utc
        try:
            stamp = _dt.datetime.strptime(
                text, "%Y%m%dT%H%M%S" if "T" in text else "%Y%m%d")
        except ValueError:
            notes.add("a %s value is not an instant (%s)" % (keyword, text[:40]))
            return ""
        if zone is _dt.timezone.utc:
            return _iso(stamp.replace(tzinfo=zone))
        return _iso(_localize(stamp, zone, notes, "%s value %s" % (keyword, text)))


    def _ical_dates(host, lines, keyword, default_zone, notes):
        """Every instant an EXDATE or RDATE line carries, as RFC3339 UTC.
        Both forms Google sends are read (`EXDATE;TZID=Europe/London:
        20260805T130000` and `EXDATE:20260805T130000Z`), with
        comma-separated values, over any number of lines. A VALUE=PERIOD
        entry names a SPAN, which a `datetime` cannot hold: it is skipped, the
        line survives verbatim in `recurrenceLines`, and the omission is NAMED
        on the run's status line rather than logged where nobody looks."""
        out = []
        for line in lines or []:
            head, sep, values = str(line).strip().partition(":")
            if not sep:
                continue
            params = head.split(";")
            if params[0].strip().upper() != keyword:
                continue
            zone, period = default_zone, False
            for param in params[1:]:
                name, _, value = param.partition("=")
                name, value = name.strip().upper(), value.strip()
                if name == "TZID":
                    named = _zone_name(value, notes, "%s;TZID" % keyword)
                    zone = _zone(named) if named else default_zone
                elif name == "VALUE" and value.upper() == "PERIOD":
                    period = True
            if period:
                host.log("google-calendar: %s in PERIOD form is not an "
                         "instant, skipped: %s" % (keyword, line))
                notes.add("a %s line is in VALUE=PERIOD form, which names a span "
                          "a datetime cannot hold" % keyword)
                continue
            for value in values.split(","):
                stamp = _ical_instant(value, zone, notes, keyword)
                if stamp and stamp not in out:
                    out.append(stamp)
        return out


    def _rrules(lines):
        """EVERY RRULE line, in order. The `recurrence` trait holds ONE rule, so
        the projection can only carry the first; the rest survive verbatim in
        `recurrenceLines` and the caller NAMES the shortfall rather than letting
        the mirror imply an expansion it cannot produce."""
        out = []
        for line in lines or []:
            head = str(line).strip().partition(":")[0]
            if head.split(";")[0].strip().upper() == "RRULE":
                out.append(str(line).strip())
        return out


    def _sorted_unique(values):
        out = []
        for value in values or []:
            value = str(value or "")
            if value and value not in out:
                out.append(value)
        return sorted(out)


    # --------------------------------------------------------------------------
    # copying a payload: presence in, presence out
    # --------------------------------------------------------------------------

    def _carry(item, name, props, full, make):
        """One declared property, written from what the payload CARRIED.

        Three cases and no fourth. The key is ABSENT: the property is written as
        null ONLY when `full` says this payload is an authoritative complete
        snapshot of the resource, which is how a field cleared at Google clears
        here — and never from a thin payload, which is what a `status: cancelled`
        tombstone is. The key is present and `null`: null, the delete Google
        means. The key is present with a value: whatever `make` makes of it, and
        `false`, `0`, `""`, `[]` and `{}` are values.

        `make` returning `None` means "this value could not be spelled" — an enum
        word this package does not hold, a URL the type would refuse. The
        property is left ABSENT then, never nulled: a value we cannot mirror is
        not evidence that Google cleared the field.
        """
        if name not in item:
            if full:
                props[name] = None
            return
        value = item[name]
        if value is None:
            props[name] = None
            return
        made = make(value)
        if made is not None:
            props[name] = made


    def _item_props(host, aid, cref, item, zone, notes, full=True):
        """What a master, an exception and a plain event share.

        NOTHING DERIVED. No `allDay` (ask `start.date`), no `meetingURL` (ask
        `hangoutLink`, else `conferenceData.entryPoints`), no `calendarId` (ask
        the `calendar` reference), no `raw`, no sweep mark. Every relation is a
        reference and every shape is declared.

        `full` is the COMPLETENESS CONTRACT, not a style: an `events.list` item
        that is not a tombstone is the whole Event resource, so a field Google
        omitted from it is a field Google does not hold and the mirror clears it.
        A tombstone carries id/status/recurringEventId/originalStartTime and
        little else, and MUST NOT be allowed to erase the row it names.
        """
        props = {"account": aid, "calendar": _ref(cref),
                 "eventId": str(item.get("id") or "")}
        start, end = item.get("start"), item.get("end")
        # The trait's resolved instants — a LOSSLESS MECHANICAL DECODE of
        # `start`/`end`, which stay beside them typed exactly, because `at`
        # cannot say whether Google sent a date. EACH resolves in ITS OWN zone:
        # an event that starts in one zone and ends in another is ordinary.
        if start is not None or full:
            props["at"] = _instant(start, zone, notes, "start") or None
            props["start"] = _when(start, zone, notes, "start")
        if end is not None or full:
            props["endsAt"] = _instant(end, zone, notes, "end") or None
            props["end"] = _when(end, zone, notes, "end")
        if "originalStartTime" in item or full:
            props["originalStartTime"] = _when(
                item.get("originalStartTime"), zone, notes, "originalStartTime")
        _carry(item, "sequence", props, full,
               lambda v: v if isinstance(v, int) and not isinstance(v, bool)
               else None)
        # Google's `recurrence` ARRAY, beside the `recurring` trait's single
        # RRULE string, which wins the name. Verbatim and complete: it is what
        # regenerates the iCalendar, and what the projection's shortfalls point
        # back at.
        _carry(item, "recurrence", props, full,
               lambda v: [str(x) for x in v])
        if "recurrence" in props:
            props["recurrenceLines"] = props.pop("recurrence")
        elif full:
            props["recurrenceLines"] = None
        # The declared shapes, none of them `json`.
        for name, make in (
                ("extendedProperties", lambda v: _extended(v)),
                ("conferenceData", lambda v: _conference(v, notes)),
                ("gadget", lambda v: _gadget(v, notes)),
                ("reminders", lambda v: _reminders(v, notes)),
                ("source", lambda v: _source(v, notes)),
                ("attachments", lambda v: _attachments(v, notes)),
                ("workingLocationProperties", lambda v: _working(v, notes)),
                ("outOfOfficeProperties", lambda v: _decline(v, notes)),
                ("focusTimeProperties", lambda v: _decline(v, notes, chat=True)),
                ("birthdayProperties",
                 lambda v: _birthday(host, aid, v, notes))):
            _carry(item, name, props, full, make)
        for name in ("status", "transparency", "visibility", "eventType"):
            _carry(item, name, props, full,
                   lambda v, n=name: _enum(n, v, notes, n))
        for name in _STRINGS:
            _carry(item, name, props, full, lambda v: str(v))
        for name in _URLS:
            _carry(item, name, props, full,
                   lambda v, n=name: _uri(v, notes, n) or None)
        for name in _BOOLS:
            _carry(item, name, props, full,
                   lambda v: v if isinstance(v, bool) else None)
        for name in _TIMES:
            _carry(item, name, props, full, lambda v, n=name: _time(v, notes, n))
        # THE PEOPLE, as OCCURRENCE OBJECTS carrying a reference at the address
        # hub. The `emailaddress` rows are upserted for the whole page before
        # this row is staged, so every pointer inside them resolves.
        for name in ("creator", "organizer"):
            _carry(item, name, props, full,
                   lambda v, n=name: _party(host, aid, v, notes, n)[1])
        _carry(item, "attendees", props, full,
               lambda v: _attendees(host, aid, v, notes))
        return props


    def _time(value, notes, where):
        stamp = _parse(value)
        if stamp is None:
            notes.add("%s is not an instant (%s)" % (where, str(value)[:40]))
            return None
        return _iso(stamp)


    def _attendees(host, aid, raw, notes):
        """EVERY entry, including a repeated address: these are occurrences, and
        Google does invite a room as itself and as a resource. The occurrence
        array is what makes that expressible at all. An EMPTY list is a list and
        survives — it says the guest list was emptied."""
        out = []
        for index, entry in enumerate(raw or []):
            _, one = _party(host, aid, entry, notes,
                            "attendees[%d]" % index, attendee=True)
            if one:
                out.append(one)
        return out


    def _when(value, fallback, notes, where):
        """One `start`/`end`/`originalStartTime` object, each field TYPED.

        `date` is a civil date, `dateTime` an instant, `timeZone` an IANA zone —
        which is what makes "is this all-day?" a question about `start.date`
        rather than a stored boolean.

        AN OFFSETLESS `dateTime` IS RESOLVED, not passed through. Google sends
        `2026-09-16T09:00:00` beside `timeZone: Europe/London`, and version 18
        wrote that string into a `datetime` property, where whatever read it next
        guessed the offset. It is resolved HERE, in THIS object's own zone, by
        the one deterministic rule `_localize` states.
        """
        value = value or {}
        if not value:
            return None
        zone = _value_zone(value, fallback, notes, where)
        out = {}
        day = str(value.get("date") or "").strip()
        if day:
            try:
                out["date"] = _dt.date.fromisoformat(day).isoformat()
            except ValueError:
                notes.add("%s.date is not a civil date (%s)" % (where, day[:40]))
        if value.get("dateTime"):
            stamp = _parse(value["dateTime"])
            if stamp is None:
                notes.add("%s.dateTime is not an instant (%s)"
                          % (where, str(value["dateTime"])[:40]))
            else:
                if stamp.tzinfo is None:
                    stamp = _localize(stamp, zone, notes, where + ".dateTime")
                out["dateTime"] = _iso(stamp)
        named = _zone_name(value.get("timeZone"), notes, where + ".timeZone")
        if named:
            out["timeZone"] = named
        return out or None


    def _keyed(value):
        """A string->string map for a `keyed: true` property. An EMPTY map is a
        map and survives: `extendedProperties.private: {}` says the application
        cleared its bag, which is not the same as never having had one."""
        if not isinstance(value, dict):
            return None
        return {str(k): str(v) for k, v in value.items()
                if k and v is not None and not isinstance(v, (dict, list))}


    def _extended(raw):
        """`extendedProperties` — two keyed string maps, declared, not `json`."""
        out = {}
        for half in ("private", "shared"):
            if half in (raw or {}):
                held = _keyed(raw[half])
                if held is not None:
                    out[half] = held
        return out


    def _reminders(raw, notes):
        """`reminders{useDefault, overrides[]{method, minutes}}`, declared."""
        raw = raw or {}
        out = {}
        if isinstance(raw.get("useDefault"), bool):
            out["useDefault"] = raw["useDefault"]
        if "overrides" in raw:
            out["overrides"] = _reminder_list(raw["overrides"], notes,
                                              "reminders.overrides")
        return out


    def _reminder_list(raw, notes, where):
        out = []
        for index, entry in enumerate(raw or []):
            one = {}
            method = _enum("reminderMethod", (entry or {}).get("method"), notes,
                           "%s[%d].method" % (where, index))
            if method:
                one["method"] = method
            minutes = (entry or {}).get("minutes")
            if isinstance(minutes, int) and not isinstance(minutes, bool):
                one["minutes"] = minutes
            if one:
                out.append(one)
        return out


    def _source(raw, notes):
        """`source{url, sourceTitle}` — `title` is reserved at every level."""
        raw = raw or {}
        out = {}
        if "url" in raw:
            link = _uri(raw["url"], notes, "source.url")
            if link:
                out["url"] = link
        if "title" in raw and raw["title"] is not None:
            # "" is a title Google stored, and every fixture source carries one.
            out["sourceTitle"] = str(raw["title"])
        return out


    def _attachments(raw, notes):
        """`attachments[]` — the DRIVE files on the event, `title` renamed.

        `fileId` stays an opaque STRING and the kind says why: this bundle
        requests no Drive scope and mirrors no Drive resource, so a reference
        would point at a row nothing in this package can ever write.
        """
        out = []
        for index, entry in enumerate(raw or []):
            entry = entry or {}
            one = {}
            for name in ("fileId", "mimeType"):
                if name in entry and entry[name] is not None:
                    one[name] = str(entry[name])
            if "title" in entry and entry["title"] is not None:
                one["attachmentTitle"] = str(entry["title"])
            for name in ("fileUrl", "iconLink"):
                if name in entry:
                    link = _uri(entry[name], notes,
                                "attachments[%d].%s" % (index, name))
                    if link:
                        one[name] = link
            if one:
                out.append(one)
        return out


    def _gadget(raw, notes):
        """`gadget{...}` — deprecated at Google, `title` renamed as everywhere."""
        raw = raw or {}
        out = {}
        if "type" in raw and raw["type"] is not None:
            out["type"] = str(raw["type"])
        for name in ("link", "iconLink"):
            if name in raw:
                link = _uri(raw[name], notes, "gadget." + name)
                if link:
                    out[name] = link
        if "title" in raw and raw["title"] is not None:
            out["gadgetTitle"] = str(raw["title"])
        display = _enum("gadgetDisplay", raw.get("display"), notes,
                        "gadget.display")
        if display:
            out["display"] = display
        for name in ("width", "height"):
            if isinstance(raw.get(name), int) and not isinstance(raw[name], bool):
                out[name] = raw[name]
        if "preferences" in raw:
            prefs = _keyed(raw["preferences"])
            if prefs is not None:
                out["preferences"] = prefs
        return out


    def _conference(raw, notes):
        """`conferenceData{...}` — every level declared, none of it `json`.

        The three conference TYPE fields stay verbatim strings, which is the
        policy the `calendar` kind states: Google's own reference tells a client
        to tolerate a solution type it does not know, so closing the set here
        would turn one new Google word into a refused page or an erased value.
        """
        raw = raw or {}
        out = {}
        for name in ("conferenceId", "signature", "notes"):
            if name in raw and raw[name] is not None:
                out[name] = str(raw[name])
        if "conferenceSolution" in raw:
            solution = raw["conferenceSolution"] or {}
            one = {}
            if "name" in solution and solution["name"] is not None:
                one["name"] = str(solution["name"])
            if "iconUri" in solution:
                link = _uri(solution["iconUri"], notes,
                            "conferenceData.conferenceSolution.iconUri")
                if link:
                    one["iconUri"] = link
            key = (solution.get("key") or {}).get("type")
            if key is not None:
                one["key"] = {"type": str(key)}
            out["conferenceSolution"] = one
        if "entryPoints" in raw:
            out["entryPoints"] = _entry_points(raw["entryPoints"], notes)
        if "createRequest" in raw:
            request = raw["createRequest"] or {}
            one = {}
            if request.get("requestId") is not None:
                one["requestId"] = str(request["requestId"])
            key = (request.get("conferenceSolutionKey") or {}).get("type")
            if key is not None:
                one["conferenceSolutionKey"] = {"type": str(key)}
            code = _enum("conferenceStatus",
                         (request.get("status") or {}).get("statusCode"), notes,
                         "conferenceData.createRequest.status.statusCode")
            if code:
                one["status"] = {"statusCode": code}
            out["createRequest"] = one
        if "parameters" in raw:
            params = _keyed(((raw["parameters"] or {}).get("addOnParameters")
                             or {}).get("parameters"))
            if params is not None:
                out["parameters"] = {"addOnParameters": {"parameters": params}}
        return out


    def _entry_points(raw, notes):
        out = []
        for index, entry in enumerate(raw or []):
            entry = entry or {}
            one = {}
            kind = _enum("entryPointType", entry.get("entryPointType"), notes,
                         "conferenceData.entryPoints[%d].entryPointType" % index)
            if kind:
                one["entryPointType"] = kind
            if "uri" in entry:
                link = _uri(entry["uri"], notes,
                            "conferenceData.entryPoints[%d].uri" % index)
                if link:
                    one["uri"] = link
            for name in ("label", "pin", "accessCode", "meetingCode",
                         "passcode", "password", "regionCode"):
                if name in entry and entry[name] is not None:
                    one[name] = str(entry[name])
            if "entryPointFeatures" in entry:
                one["entryPointFeatures"] = [
                    str(f) for f in entry["entryPointFeatures"] or []
                    if f is not None]
            if one:
                out.append(one)
        return out


    def _decline(raw, notes, chat=False):
        """The shared half of `outOfOfficeProperties` / `focusTimeProperties`."""
        raw = raw or {}
        out = {}
        mode = _enum("autoDeclineMode", raw.get("autoDeclineMode"), notes,
                     "autoDeclineMode")
        if mode:
            out["autoDeclineMode"] = mode
        if "declineMessage" in raw and raw["declineMessage"] is not None:
            out["declineMessage"] = str(raw["declineMessage"])
        if chat:
            status = _enum("chatStatus", raw.get("chatStatus"), notes,
                           "chatStatus")
            if status:
                out["chatStatus"] = status
        return out


    def _working(raw, notes):
        """`workingLocationProperties{...}`.

        `homeOffice` is Google's one `any`-typed field. The PRESENCE-ONLY
        CONTRACT the kind declares is exact: `true` means Google SENT the key,
        and the property holds no value of its own. Every payload observed sends
        the empty object, and the dialect has no empty-object value to hold it
        (a `fields: {}` is refused and `json` is forbidden as an object field).
        A `homeOffice` carrying anything else is therefore NOT mirrored — it is
        named on the run's status line, so the shortfall is visible and the fix
        is a package bump that gives the field its real shape.
        """
        raw = raw or {}
        out = {}
        kind = _enum("workingLocationType", raw.get("type"), notes,
                     "workingLocationProperties.type")
        if kind:
            out["type"] = kind
        if "homeOffice" in raw:
            held = raw["homeOffice"]
            if held not in (None, {}, "", True):
                notes.add("workingLocationProperties.homeOffice carried a value "
                          "(%s); only its presence is mirrored" % str(held)[:40])
            if held is not None:
                out["homeOffice"] = True
        if "officeLocation" in raw:
            office = raw["officeLocation"] or {}
            out["officeLocation"] = {
                name: str(office[name]) for name in
                ("label", "buildingId", "floorId", "floorSectionId", "deskId")
                if name in office and office[name] is not None}
        if "customLocation" in raw:
            custom = raw["customLocation"] or {}
            out["customLocation"] = (
                {"label": str(custom["label"])}
                if "label" in custom and custom["label"] is not None else {})
        return out


    def _birthday(host, aid, raw, notes):
        """`birthdayProperties{type, customTypeName, contact}`.

        `contact` is a People RESOURCE NAME, which is an id this bundle mirrors,
        so it is a reference at the contact row — composed the same way
        contactssync composes it. THE ONE DELIBERATELY DEFERRED REFERENCE in
        this stream: this body never writes a `contact` row (that is contactssync's
        kind, and `docs/decisions/0049` forbids writing another stream's kind), so
        the pointer dangles when contacts are not synced. That is real data rather
        than a bug, which is why the property does not `mustExist` and why no
        shell is minted for it.
        """
        raw = raw or {}
        out = {}
        kind = _enum("birthdayType", raw.get("type"), notes,
                     "birthdayProperties.type")
        if kind:
            out["type"] = kind
        if "customTypeName" in raw and raw["customTypeName"] is not None:
            out["customTypeName"] = str(raw["customTypeName"])
        resource = str(raw.get("contact") or "").strip()
        if resource:
            out["contact"] = _ref(
                host.ids.external("google-contacts", aid, resource))
        return out


    def _state(host, cref, stamp):
        """Patch one calendar's sync state, minting the row on first use.

        A patch of an absent row is ErrNotFound, so the state is PUT with the
        calendar's pointer and the stamp together: a put merges, so a later
        token never loses the walk mark, and the row's id IS the calendar's, so
        no lookup finds it.
        """
        host.effects.put(SYNC_TYPE, cref,
                         properties=dict(stamp, calendar={"ref": cref}))


    def _commit_state(host, cref, cur, walk=False):
        """THE TOKEN COMMITS WITH THE RECONCILIATION, NOT BEFORE IT.

        Version 18 wrote `nextSyncToken` the moment the last page arrived and
        then swept. A failure in between left a token standing over a mirror
        whose reconciliation never finished, and the next run resumed a delta
        across the gap. The token rides on the CURSOR as `pendingToken` from the
        last page until every retraction this read owes has been staged, which is
        here.
        """
        stamp = {}
        if cur.get("pendingToken"):
            stamp["syncToken"] = str(cur["pendingToken"])
        if cur.get("generation"):
            stamp["generation"] = cur["generation"]
        if walk:
            stamp["syncWalk"] = WALK
        if stamp:
            _state(host, cref, stamp)
        cur["pendingToken"] = ""


    def _default_reminders(raw, notes):
        """`defaultReminders[]{method, minutes}` on a calendarList entry. An
        EMPTY list survives: three of four specimen calendars send one, and it
        says this account set no default rather than that Google forgot to."""
        return _reminder_list(raw, notes, "defaultReminders")


    def _conference_properties(raw, notes):
        """`conferenceProperties{allowedConferenceSolutionTypes}`, declared.

        Verbatim strings, by the policy the kind states: Google's reference tells
        a client to tolerate a conference type it does not know.
        """
        raw = raw or {}
        out = {}
        if "allowedConferenceSolutionTypes" in raw:
            out["allowedConferenceSolutionTypes"] = [
                str(x) for x in raw["allowedConferenceSolutionTypes"] or []
                if x is not None]
        return out


    def _notifications(raw, notes):
        """`notificationSettings{notifications[]{type, method}}`, declared."""
        raw = raw or {}
        out = {}
        if "notifications" in raw:
            held = []
            for index, entry in enumerate(raw["notifications"] or []):
                one = {}
                kind = _enum("notificationType", (entry or {}).get("type"), notes,
                             "notificationSettings.notifications[%d].type" % index)
                if kind:
                    one["type"] = kind
                method = _enum("reminderMethod", (entry or {}).get("method"),
                               notes,
                               "notificationSettings.notifications[%d].method"
                               % index)
                if method:
                    one["method"] = method
                if one:
                    held.append(one)
            out["notifications"] = held
        return out


    def _rows(host, kind, ids):
        """The stored rows of one kind by id, as `{id: record}`: one list
        call per 200 ids, never a get per item."""
        out = {}
        ids = sorted({i for i in ids if i})
        for start in range(0, len(ids), 200):
            chunk = ids[start:start + 200]
            page = host.list(filter={"kinds": [kind], "ids": chunk},
                             first=len(chunk))
            for ent in page.get("records") or []:
                out[str(ent.get("id") or "")] = ent
        return out


    def _live(host, types, ids):
        """Which of these rows actually EXIST, as a set of `type|id`. Deleting
        a row that was never written is ErrNotFound and fails the WHOLE
        delivery — and every delta carries `cancelled` entries for events this
        repository never stored. One list call per 200 ids, all types at
        once."""
        found = set()
        ids = sorted({i for i in ids if i})
        for start in range(0, len(ids), 200):
            chunk = ids[start:start + 200]
            page = host.list(filter={"kinds": list(types), "ids": chunk},
                             first=len(types) * len(chunk))
            for ent in page.get("records") or []:
                found.add("%s|%s" % (ent.get("kind") or "", ent.get("id") or ""))
        return found


    def _retract_strays(host, cref, written):
        """Delete every OTHER `calendarevent` row on this calendar carrying a
        Google event id this page writes. `written` maps the event id to the
        row id it lands at.

        ONE GOOGLE EVENT ON ONE CALENDAR IS ONE ROW, and the row id of an
        exception does not hold that on its own: it is `<series row>_<slot>`,
        keyed by the SERIES it hangs off. Google's "this and following" edit
        ends one master (an UNTIL is written into its rule) and starts
        another, `<master>_R<date>`, re-parenting every later exception onto
        it while each keeps its own instance id. The next delta sends each
        re-parented exception under its new `recurringEventId` and nothing for
        the old row, so without this the old row outlived the split beside the
        new one, after its own series' UNTIL, one more copy per split.

        Scoped to the calendar (an event id is unique per calendar only), one
        list call per 200 ids, and only rows the list returned are deleted, so
        a delete never meets ErrNotFound. A full re-read runs through here
        too, which is what clears the copies a repository already holds."""
        ids = sorted(e for e in written if e)
        stale = 0
        for start in range(0, len(ids), 200):
            chunk = ids[start:start + 200]
            after = None
            while True:
                page = host.records.list(
                    EVENT_TYPE, where={"calendar": {"eq": cref},
                                       "eventId": {"in": chunk}},
                    first=200, after=after)
                got = page.get("records") or []
                for ent in got:
                    rid = str(ent.get("id") or "")
                    eid = str((ent.get("properties") or {}).get("eventId") or "")
                    if rid and eid in written and rid != written[eid]:
                        host.effects.delete(EVENT_TYPE, rid)
                        stale += 1
                after = page.get("cursor") or None
                if not after or not got:
                    break
        if stale:
            host.log("google-calendar: %d row(s) superseded by the same event "
                     "under another id (a split series re-parents its "
                     "exceptions) — retracted" % stale)
        return stale


    def _stage_events(host, aid, cref, items, cal_tz, cur, notes):
        """Stage one events page IN ORDER: the addresses first (a reference
        target must exist when the row referencing it applies), then the master
        shells an exception needs, then the series, then the events.

        THE SWEEP MARK IS NOT A PROPERTY. A full re-read used to stamp every row
        with a `syncGeneration` and delete whatever the generation missed; that
        is sync bookkeeping on a mirror, which `docs/kind-design.md` §1 forbids,
        and the label it prescribes instead cannot be written — `host.effects`
        carries `properties` and nothing else (README, ask 1). So the ids this
        walk WROTE ride on the cursor, bounded and per-calendar, and the sweep
        deletes what is not among them.

        TOMBSTONES ARE DECIDED HERE AND CARRIED OUT LATER, and a cancelled
        MASTER TAKES NOTHING WITH IT (T-002, owner's ruling). What it retracts is
        itself: its series row survives as the identity-only SHELL its exceptions
        point at, or is deleted outright when none do, and the `tombstones` phase
        makes that call after this calendar's pages. The exceptions under it are
        resources Google sent on this page and are written like any other row,
        cancelled or not. The ONE thing that does take the occurrences with it is
        an event that STOPPED RECURRING: there is no series left, so nothing
        under it is a resource, and that is what `condemned` still means here.
        """
        cal_zone = _zone(cal_tz or "UTC")
        seen_ids = set(cur.get("seen") or ())
        tombs = list(cur.get("tombs") or [])
        masters, exceptions, gone, singles = {}, [], [], []
        for item in items:
            eid = str(item.get("id") or "")
            if not eid:
                continue
            dead = str(item.get("status") or "") == "cancelled"
            if _is_exception(item):
                # A CANCELLED EXCEPTION IS KEPT, `status: cancelled` and all: it
                # is the resource Google sent, it names the slot it skips, and
                # reinstating it rewrites this one row.
                exceptions.append(item)
            elif dead:
                gone.append(eid)
            elif item.get("recurrence"):
                masters[eid] = item
            else:
                singles.append(item)

        # Every series this page touches and what the mirror holds of it — the
        # zone it resolved in, its verbatim lines — in one list call per 200
        # rather than a get per item. A cancelled entry without a master id may
        # itself be a master: Google's tombstone does not say, so its series row
        # is looked up beside its event row.
        touched = set(masters) | set(gone)
        touched |= {str(x["recurringEventId"]) for x in exceptions}
        touched |= {str(x["id"]) for x in singles}
        srefs = {mid: _series_id(host, cref, mid) for mid in touched}
        stored = _rows(host, SERIES_TYPE, srefs.values())

        # ONE zone per series for the series' OWN `timezone` property: the
        # master's own when it is on this page, else the one its stored row
        # resolved in, else the calendar's, else UTC.
        zones = {}
        for mid in touched:
            held = (stored.get(srefs[mid]) or {}).get("properties") or {}
            if mid in masters:
                name = _own_zone(masters[mid], notes) or cal_tz
            else:
                name = _zone_name(held.get("timezone")) or cal_tz
            zones[mid] = (name, _zone(name) if name else _dt.timezone.utc)

        addresses = set()
        for item in list(masters.values()) + exceptions + singles:
            parties = [_party(host, aid, item.get("creator"), notes, "creator"),
                       _party(host, aid, item.get("organizer"), notes,
                              "organizer")]
            parties += [_party(host, aid, raw, notes, "attendees", attendee=True)
                        for raw in item.get("attendees") or []]
            for addr, _link in parties:
                if addr:
                    addresses.add(addr)
        # THE HUB ROWS: the address, and nothing else. No `displayName` (the name
        # THIS event spelled is on the link) and no `isOwner` (an owner-relative
        # flag, which a mirror never carries). They are staged FIRST, because a
        # reference's target must exist when the row naming it applies.
        for addr in sorted(addresses):
            host.effects.put(ADDRESS_TYPE, _address_id(host, aid, addr),
                             properties={"account": aid, "address": addr})

        # WHAT THIS PAGE RETRACTS, and what it merely changes kind on.
        #
        # A tombstone (`status: cancelled`, no `recurringEventId`) may name a
        # plain event or a master; Google does not say which, so both rows are
        # probed. A KIND TRANSITION is the same question from the other side: an
        # event that grew a `recurrence` leaves a `calendarevent` row behind, and
        # one that lost its rule leaves a `calendarseries` row and every exception
        # under it. Version 18 left both as ghosts.
        probes = set()
        for eid in gone:
            probes.add((EVENT_TYPE, _event_id(host, cref, eid)))
            probes.add((SERIES_TYPE, srefs[eid]))
        for eid in masters:
            probes.add((EVENT_TYPE, _event_id(host, cref, eid)))
        for item in singles:
            probes.add((SERIES_TYPE, srefs[str(item["id"])]))
        live = _live(host, (EVENT_TYPE, SERIES_TYPE), [ref for _, ref in probes])

        def _is_live(kind, ref):
            return ("%s|%s" % (kind, ref)) in live

        # TWO CAUSES, AND ONLY ONE OF THEM TAKES THE OCCURRENCES WITH IT (T-002).
        #
        # `retired` — Google tombstoned the MASTER. Its exceptions are resources
        # of their own: the API handed them to us on this very page, each with an
        # id, a status and an `originalStartTime`, and the mirror keeps a
        # cancelled resource as a row carrying `status: cancelled`. That is the
        # whole point of dropping `cancelledSlots`. `_tombstones` already held
        # this line — it retracts the master and leaves the series row standing
        # as the shell its exceptions point at — but this function did not: it
        # SKIPPED those exceptions before they were ever written, so the shell
        # had nothing pointing at it and `_tombstones` deleted the series too.
        # Eighteen rows under one master went that way on the reflection seed.
        #
        # `condemned` — the event STOPPED RECURRING. There is no series any more
        # and the occurrences under it are not resources at all, so its
        # exceptions are not written and no shell is minted.
        retired, condemned = set(), set()
        for eid in gone:
            eref = _event_id(host, cref, eid)
            if _is_live(EVENT_TYPE, eref):
                host.effects.delete(EVENT_TYPE, eref)
            if _is_live(SERIES_TYPE, srefs[eid]):
                retired.add(eid)
        for eid in sorted(masters):
            eref = _event_id(host, cref, eid)
            if _is_live(EVENT_TYPE, eref):
                host.log("google-calendar: %s became recurring — its single "
                         "event row is retracted" % eid)
                host.effects.delete(EVENT_TYPE, eref)
        for item in singles:
            eid = str(item["id"])
            if _is_live(SERIES_TYPE, srefs[eid]):
                host.log("google-calendar: %s stopped recurring — its series row "
                         "and exceptions are retracted" % eid)
                condemned.add(eid)
        for eid in sorted(retired | condemned):
            entry = [eid, srefs[eid]]
            if entry not in tombs:
                tombs.append(entry)

        # THE MASTER SHELLS. An exception's `recurrenceOf` is a reference, and a
        # reference whose target was never written is a pointer at nothing: the
        # row applies (no `mustExist`) but the timeline has a hole in it. Version
        # 18 minted a shell only for a CANCELLED exception. Every exception gets
        # one now — identity only (`account`, `calendar`, `eventId`), so the
        # master's own write completes it, because a put merges. A master this
        # drain condemned never gets one: a tombstone must not be undone by the
        # exception that is about to be collected with it.
        for mid in sorted({str(x["recurringEventId"]) for x in exceptions}):
            if mid in masters or mid in condemned:
                continue
            # SEEN EITHER WAY. A shell that is already stored is still a row THIS
            # read accounts for, and the sweep deletes what it did not stamp — so
            # skipping the `seen_ids` line with the put retracted every master
            # that only ever appears as an exception's target, on every full
            # re-read. The put is what is conditional, not the mark.
            seen_ids.add(srefs[mid])
            if srefs[mid] in stored:
                continue
            host.effects.put(SERIES_TYPE, srefs[mid],
                             properties={"account": aid, "calendar": _ref(cref),
                                         "eventId": mid})

        # The series: every master on the page, its rule decoded from ITS OWN
        # lines and nothing from another resource.
        for mid in sorted(masters):
            sref = srefs[mid]
            name, zone = zones[mid]
            master = masters[mid]
            lines = [str(x) for x in master.get("recurrence") or []]
            rules = _rrules(lines)
            if len(rules) > 1:
                # The trait holds ONE rule. Say so rather than let the mirror
                # imply an expansion it cannot produce; the lines all survive.
                notes.add("a series carries %d RRULE lines and the recurrence "
                          "trait projects only the first" % len(rules))
            props = _item_props(host, aid, cref, master, zone, notes)
            props.update({
                "recurrence": rules[0] if rules else None,
                "rdates": _ical_dates(host, lines, "RDATE", zone, notes) or None,
                "exdates": _sorted_unique(
                    _ical_dates(host, lines, "EXDATE", zone, notes)) or None,
                "timezone": name or None})
            seen_ids.add(sref)
            host.effects.put(SERIES_TYPE, sref, properties=props)

        # The events: an exception at `<series>_<slot>`, pointing at its series
        # and naming the slot it replaces; a plain event at its derived id.
        skipped = 0
        written = {}                 # Google event id -> the row it lands at
        for item in exceptions:
            mid = str(item["recurringEventId"])
            if mid in condemned:
                continue
            sref = srefs[mid]
            dead = str(item.get("status") or "") == "cancelled"
            slot_zone = _slot_zone(item, mid, stored.get(sref), masters,
                                   zones, cal_tz, notes)
            slot = _instant(item.get("originalStartTime"), slot_zone, notes,
                            "originalStartTime")
            if not slot:
                host.log("google-calendar: exception %s of %s names no slot "
                         "(%r), skipped" % (item.get("id"), mid, _verbatim(item)))
                notes.add("an exception names a slot that cannot be resolved")
                skipped += 1
                continue
            own = _own_zone(item, notes)
            # A tombstone is THIN: it must merge, never replace. A live exception
            # is a whole Event resource and clears what Google cleared.
            props = _item_props(host, aid, cref, item,
                                _zone(own) if own else slot_zone, notes,
                                full=not dead)
            # `recurringEventId` IS this reference: an id of an object this
            # bundle mirrors is the pointer and never a string beside it.
            props.update({"recurrenceOf": _ref(sref), "originalAt": slot})
            rid = _exception_id(sref, slot)
            seen_ids.add(rid)
            host.effects.put(EVENT_TYPE, rid, properties=props)
            written[str(item["id"])] = rid
        for item in singles:
            own = _own_zone(item, notes)
            props = _item_props(host, aid, cref, item,
                                _zone(own) if own else cal_zone, notes)
            props.update({"recurrenceOf": None, "originalAt": None})
            rid = _event_id(host, cref, str(item["id"]))
            seen_ids.add(rid)
            host.effects.put(EVENT_TYPE, rid, properties=props)
            written[str(item["id"])] = rid
        _retract_strays(host, cref, written)
        # The ids this walk has written so far, back onto the cursor. Capped:
        # past the cap the sweep cannot be trusted, so it is skipped and said so
        # rather than deleting a mailbox's worth of live rows.
        if len(seen_ids) <= SEEN_MAX:
            cur["seen"] = sorted(seen_ids)
        else:
            cur["seen"] = []
            cur["seenOverflow"] = True
        cur["tombs"] = tombs
        kept = len(masters) + len(exceptions) + len(singles) - skipped
        return kept, len(gone), skipped


    def _slot_zone(item, mid, stored_row, masters, zones, cal_tz, notes):
        """The zone ONE exception's slot resolves in, chosen DURABLY.

        A slot is the exception's row id, so a zone that depends on WHAT ARRIVED
        FIRST is a duplicate row waiting to happen: version 18 resolved against
        the master when the master was on the page and against the calendar when
        it was not, so a master landing a page later re-keyed everything under
        it. The order here never changes between runs:

          1. `originalStartTime.timeZone`, which Google sends beside every
             dateTime slot. It belongs to the value, so no lookup can move it.
          2. the zone the STORED series row already resolved in — once a slot is
             keyed, it stays keyed, whichever page the master turns up on.
          3. the master on THIS page, for a series nothing is stored for yet.
          4. the calendar's zone, then UTC.

        A slot whose `dateTime` carries an offset (which every specimen does)
        does not need a zone at all, so in practice this decides all-day and
        offsetless slots only. Falling past (2) is NAMED: it is the one case
        where a later upstream zone change can re-key a stored exception, and
        the 410 full re-read plus sweep is what repairs it.
        """
        own = _zone_name((item.get("originalStartTime") or {}).get("timeZone"),
                         notes, "originalStartTime.timeZone")
        if own:
            return _zone(own)
        held = _zone_name(((stored_row or {}).get("properties")
                           or {}).get("timezone"))
        if held:
            return _zone(held)
        if mid in masters:
            return zones[mid][1]
        if cal_tz:
            return _zone(cal_tz)
        notes.add("an exception's slot fell back to UTC: neither it, its series "
                  "nor its calendar names a zone")
        return _dt.timezone.utc



    def _ack(props, stamp, stream):
        """Echo the request generation THIS run acted on, on EVERY path.

        `syncRequestedAt` is how the owner (and the seed runner) asks for a sync
        now, and how a re-seeded account is re-driven at all: its
        `calendarLastSyncedAt` survives a purge, so the on-connect guard is already
        false. The `google-calendar-on-request` trigger fires exactly while the request
        and this stream's ack disagree — so an UNACKNOWLEDGED request re-fires the
        trigger against the same work forever, which is why the erroring path
        acknowledges too.
        """
        requested = str(props.get("syncRequestedAt") or "")
        if requested and str(props.get(stream + "SyncRequestedAck") or "") != requested:
            stamp[stream + "SyncRequestedAck"] = requested
        return stamp


    # --------------------------------------------------------------------------
    # the core `sync` trait (substrate decision 0085)
    # --------------------------------------------------------------------------
    # The account binds `sync` beside `accountconfig`, so twelve of its properties
    # are the SUBSTRATE's vocabulary rather than this bundle's: the console's
    # Connections page, `GET /api/v1/sync/status` and `substratectl sync status`
    # read them off any provider that binds the trait, knowing nothing about
    # Google. They are written BESIDE the legacy `syncStatus` /
    # `<stream>SyncStatus` sentences and the three per-stream acks, never instead
    # of them — a reader of the old shape (the end-to-end runner's `(N pending)`
    # contract, the seed, the `google-<stream>-on-request` guards) goes on working
    # unchanged, and the legacy pair goes at the next major.
    #
    # THE SAME THREE HELPERS LIVE IN ALL THREE STREAM BODIES, verbatim. A function
    # is a closure with no shared module to import, and the account they patch is
    # one row: a copy that drifted would be two streams disagreeing about what the
    # account's state means.
    _TRAIT_STREAMS = ("contacts", "gmail", "calendar", "drive")


    def _trait_streams(props):
        """The account's `syncStreams` map, however the engine hands it back."""
        raw = props.get("syncStreams") or {}
        if isinstance(raw, str):
            try:
                raw = _json.loads(raw)
            except ValueError:
                raw = {}
        return dict(raw) if isinstance(raw, dict) else {}


    def _trait_broken(props, streams, name):
        """Is THAT stream failing right now?

        The trait's own entry first, and the legacy sentence behind it: an account
        upgraded into the trait carries no `syncStreams` until each stream has run
        once under this version, and until then a stream's `<stream>SyncStatus` is
        the only evidence that it is broken.
        """
        entry = streams.get(name) or {}
        if str(entry.get("state") or "") in ("erroring", "throttled"):
            return True
        return str(props.get(name + "SyncStatus") or "").startswith("erroring")


    def _trait_answered(props, streams, name, requested):
        """Has THAT stream answered this request generation?

        Either half counts: the trait's entry and the legacy per-stream ack are
        written in step, and the legacy one is what the on-request guards read.
        """
        entry = streams.get(name) or {}
        return (str(entry.get("requestedAck") or "") == requested
                or str(props.get(name + "SyncRequestedAck") or "") == requested)


    def _trait_stamp(props, stream, state, message, now, completed=False,
                     progress=None, started="", elapsed_ms=None):
        """The trait's half of one account patch.

        `state` is one of the trait's five words — `never`, `running`, `ok`,
        `erroring`, `throttled` — and `props` is the account as it stood BEFORE
        this patch, which is what makes the rollup readable. Three rules, the same
        three the legacy rollup follows:

          - this stream's entry in `syncStreams` is unconditional;
          - the ACCOUNT-LEVEL state is RAISED and never cleared over another
            ENABLED stream's live failure, so a healthy contacts run cannot make a
            broken gmail read `ok` on the Connections page;
          - the owner's request is acknowledged at the account level only once
            EVERY enabled stream has answered that same generation. Three streams
            answer independently, and one shared ack spent by whichever ran first
            would tell the page a request was served while two streams had not
            moved.

        `completed` is what stamps `lastAt`: a drain that handed back with work
        owed is `ok` with a pending count, not a run that finished.
        """
        streams = _trait_streams(props)
        entry = dict(streams.get(stream) or {})
        entry["state"] = state
        entry["message"] = str(message)[:400]
        if completed:
            entry["lastAt"] = now
        if progress is not None:
            # Only a run that COUNTED sets the count: a failure stamp carries no
            # bookkeeping, and zeroing the entry there would say the work it never
            # reached is done.
            entry["pending"] = int(progress.get("pending") or 0)
        requested = str(props.get("syncRequestedAt") or "")
        if requested:
            entry["requestedAck"] = requested
        streams[stream] = entry
        out = {"syncStreams": streams}
        others = [s for s in _TRAIT_STREAMS if s != stream
                  and props.get("enabled" + s.capitalize())]
        # THE ACCOUNT HOLDS ONE PROGRESS, SO IT IS RAISED THE WAY THE STATE IS.
        # `syncProgress` is the trait's single bounded-drain report and all three
        # streams write it, so a stream that finished with nothing owed must not
        # overwrite another's live `pending` — that is the bug the legacy rollup
        # already had once, where a completed contacts run wrote `ok` over the
        # calendar walk's `ok (6 pending)` and the drain was reported done with a
        # third of the mirror unwritten. This stream's own pending (or failure)
        # always speaks; an empty one only when nothing else is owed.
        owed_elsewhere = any(int((streams.get(s) or {}).get("pending") or 0) > 0
                             for s in others)
        if progress is not None and (int(progress.get("pending") or 0) > 0
                                     or state in ("erroring", "throttled")
                                     or not owed_elsewhere):
            out["syncProgress"] = progress
        # The two the DISPATCHER owns around a record-sourced delivery, written by
        # the body only where no dispatcher is watching (the scheduled path).
        if started:
            out["lastSyncStartedAt"] = started
        if elapsed_ms is not None:
            out["lastSyncDurationMs"] = max(0, int(elapsed_ms))
        if state in ("erroring", "throttled"):
            # A failure always speaks: it is the account's newest fact, and the
            # two error fields are the only place the cause survives a recovery.
            out["syncState"] = state
            out["syncMessage"] = str(message)[:400]
            out["syncError"] = str(message)[:400]
            out["syncErrorAt"] = now
        elif not any(_trait_broken(props, streams, s) for s in others):
            out["syncState"] = state
            out["syncMessage"] = str(message)[:400]
        if requested and all(_trait_answered(props, streams, s, requested)
                             for s in others):
            out["syncRequestedAck"] = requested
        return out


    def _trait_progress(phase, done, pending):
        """`{phase, done, total, pending}`, off the drain's own bookkeeping.

        `total` is `done + pending` rather than a number Google never gives: no
        Google listing announces how many rows it will hand over, so the honest
        total is what this run has written plus what it knows it still owes — and
        that is also the one a progress bar can move forward on.
        """
        done, pending = max(0, int(done or 0)), max(0, int(pending or 0))
        return {"phase": phase, "done": done, "total": done + pending,
                "pending": pending}


    def _clock():
        """A SUB-SECOND wall clock, for the budget and the duration only.

        `_now()` truncates to the whole second — deliberately, because that is the
        precision this body's own stamps carry — so a budget measured with it
        cannot see anything shorter than a second, and every invocation inside one
        second reads as zero elapsed. That is not a theoretical gap: a whole drain
        over the e2e fixtures fits inside a second, so the bound could not be
        tested at all, and a duration in milliseconds was always a multiple of a
        thousand.
        """
        return _dt.datetime.now(_dt.timezone.utc).timestamp()


    def _trait_begin(cur):
        """Stamp when THIS account's walk began, once per account in the chain."""
        if not cur.get("traitStartTs"):
            cur["traitStartedAt"] = _iso(_now())
            cur["traitStartTs"] = _clock()
        return cur


    def _trait_run(cur):
        """The start instant and the elapsed milliseconds for the patch that ends
        this account's walk — or nothing at all on the record-sourced path, where
        the dispatcher stamps both itself and a second hand writing them would be
        one hand too many (decision 0085)."""
        if not cur.get("scheduled") or not cur.get("traitStartedAt"):
            return "", None
        began = float(cur.get("traitStartTs") or 0)
        if not began:
            return str(cur["traitStartedAt"]), None
        return str(cur["traitStartedAt"]), int((_clock() - began) * 1000)


    def _carry_trait(cur, nxt):
        """A rebuilt cursor keeps WHICH PATH drove the run, THE CHAIN'S OWN CLOCK
        and the budget it is measured against.

        The chain's clock is the one thing a rebuilt cursor must never lose: the
        engine's drain deadline is cumulative over the WHOLE chain — every
        account, every page, every sweep — so a cursor that starts the clock again
        at the next account is a chain that walks straight through the deadline
        and PARKS, which is exactly what every hourly `google-gmail-scheduled`
        fire did in production. The account's OWN walk start (`traitStartedAt`) is
        deliberately not carried: that one belongs to the account, and the next
        account's walk begins when it begins.
        """
        if cur.get("scheduled"):
            nxt["scheduled"] = True
        if cur.get("startedAt"):
            nxt["startedAt"] = cur["startedAt"]
        if cur.get("hops"):
            nxt["hops"] = int(cur["hops"])
        if cur.get("drainBudgetMs"):
            nxt["drainBudgetMs"] = cur["drainBudgetMs"]
        return nxt


    def _chain_begin(cur):
        """Start the chain's wall clock on the first invocation that walks."""
        if not cur.get("startedAt"):
            cur["startedAt"] = _clock()
        return cur


    def _drain_budget(cfg, cur):
        """Resolve this run's drain budget onto the cursor.

        THE ENGINE GIVES A CONTINUATION CHAIN TWO MINUTES, cumulatively, and a
        chain that keeps continuing past it is PARKED — the effects it committed
        stand, but the delivery is recorded as a failure, which is what every
        hourly Google fire looked like in production until each stream learned to
        stop itself. `DRAIN_SECONDS` is the built-in bound, under the engine's so
        the final stamp's transaction still fits; `config.drainBudgetMs` overrides
        it, clamped, for the same reason `config.apiBase` exists — so a test can
        prove the bound instead of trusting it, and so an operator can follow the
        engine's deadline if it ever moves.

        MILLISECONDS, because a budget of one second is longer than a whole drain
        over the e2e fixtures: the bound never tripped, and a scenario that cannot
        tell a drain that stopped itself from one that simply finished is testing
        nothing. At 1 ms the first check hands back.
        """
        props = ((cfg.get("inputs") or {}).get("client") or {}).get("properties") or {}
        try:
            want = int(props.get("drainBudgetMs") or 0)
        except (TypeError, ValueError):
            want = 0
        if want > 0:
            cur["drainBudgetMs"] = max(1, min(want, 110000))
        return cur


    def _drain_seconds(cur):
        """The seconds this chain may spend before it hands back."""
        try:
            held = int(cur.get("drainBudgetMs") or 0)
        except (TypeError, ValueError):
            held = 0
        return (held / 1000.0) if held > 0 else float(DRAIN_SECONDS)


    def _out_of_time(cur):
        """Has this chain spent its wall-clock budget?"""
        began = float(cur.get("startedAt") or 0)
        return bool(began) and (_clock() - began) >= _drain_seconds(cur)


    def _erroring(host, acct, reason, retry_at=""):
        # ONE bounded stamp per episode (F2/F3). The failure is recorded on
        # THIS STREAM's own state AND its own sentence, so a gmail failure can
        # never swallow a calendar one; the shared rollup the console reads
        # generically is raised too, but only when it is not already erroring
        # — that is what keeps the account's own update from re-firing the
        # on-connect trigger into a two-stream ping-pong. NEITHER lastSyncedAt
        # NOR calendarLastSyncedAt is written: the run did not complete, so
        # the cadence must keep retrying and the window floor must not advance.
        props = acct.get("properties") or {}
        status = "erroring: " + str(reason)[:REASON_MAX]
        now = _iso(_now())
        # A RATE LIMIT IS NOT A BREAKAGE. The trait spells the wall `throttled`
        # beside `erroring` (decision 0085): an account waiting out a
        # `Retry-After` is healthy and busy, and a page that painted it red would
        # send the owner looking for a fault that is not there. The legacy
        # sentence keeps its `erroring:` prefix, which the runner and the seed
        # parse.
        state = "throttled" if retry_at else "erroring"
        stamp = _ack(props, {}, "calendar")
        # Acknowledged even when the status has not moved: an unacknowledged
        # request re-fires the on-request trigger against the same failure. The
        # trait's half of that answer rides with the legacy one — the two are
        # never out of step — and the failure is re-stated with it. A tick that
        # changes nothing returns without a patch at all, so `syncErrorAt` never
        # moves for no news.
        if str(props.get("calendarSyncStatus") or "") == status:
            if stamp:
                stamp.update(_trait_stamp(props, "calendar", state, status, now))
                host.effects.patch((acct.get("kind") or ACCOUNT_TYPE),
                                   acct.get("id"), properties=stamp)
            return
        # A 429 SAYS WHEN, and the wall is the ACCOUNT's: every stream is
        # behind the same quota, so one stream meeting it stops the others
        # walking into it too (docs/provider-practices.md §5).
        if retry_at:
            stamp["retryNotBefore"] = retry_at
        stamp.update({"calendarSyncStatus": status,
                      "calendarSyncState": "erroring"})
        if not str(props.get("syncStatus") or "").startswith("erroring"):
            stamp["syncStatus"] = status
        # The trait's account-level state, its message and the two error fields.
        # `_trait_stamp` raises the state itself and never clears it over another
        # enabled stream's live failure, so the legacy guard above is not repeated
        # here: a failure is the newest thing this account knows.
        stamp.update(_trait_stamp(props, "calendar", state, status, now))
        host.effects.patch((acct.get("kind") or ACCOUNT_TYPE), acct.get("id"),
                           properties=stamp)


    def _status(notes, skipped):
        """This run's outcome line: `ok`, and what it could not spell.

        An unknown enum, a URL the type refuses, a zone that does not load, a
        second RRULE, a PERIOD RDATE — none of them fail the stream (a widening
        at Google is not an outage) and none of them are allowed to be silent.
        The SHAPE is `ok` or `ok (…)`, which is what the end-to-end runner's
        continuation contract parses; the enum beside it is what a query filters.
        """
        parts = []
        if skipped:
            parts.append("%d skipped" % skipped)
        held = sorted(notes)
        if held:
            shown = held[:UNKNOWN_MAX]
            more = len(held) - len(shown)
            parts.append("unmirrored Calendar values: %s%s"
                         % ("; ".join(shown),
                            ", +%d more" % more if more else ""))
        if not parts:
            return "ok"
        return ("ok (%s)" % "; ".join(parts))[:400]


    # THE ENGINE'S DRAIN BUDGET, AND OURS INSIDE IT. A body that keeps returning
    # `more` is bounded by the engine on every axis — 512 re-invocations, a TWO
    # MINUTE wall clock from the chain's first committed page, 200k effects — and
    # a chain that crosses one PARKS: the delivery is abandoned mid-walk, the
    # dispatcher re-drives it, and (with `syncRequestedAt` stamped by a runner) it
    # parks again every couple of minutes, which is a single serial dispatcher
    # taken out of service for every other provider in the repository.
    #
    # A park is a BUG, not a bound. This account's calendars hold fifteen
    # thousand events; the drain has to stop itself, durably, before the engine
    # stops it. `HOP_MAX` and `DRAIN_SECONDS` sit well inside the engine's, and
    # the stop happens at a CALENDAR BOUNDARY — the one place where everything
    # this walk owes (its retractions, its sweep, its token) has just committed,
    # so the continuation is a list of calendar ids and nothing more.
    HOP_MAX = 260
    # 55 s of the engine's 120 s. The check happens at a calendar BOUNDARY, so
    # the margin has to cover one whole calendar's walk, its retractions and its
    # sweep — the budget is not "how long may I run" but "how long may I run
    # before the next calendar might not fit".
    DRAIN_SECONDS = 45


    def _carry_budget(cur, nxt):
        """Hand the chain's budget counters to the next account's cursor.

        NOT `_carry` — this file already has one (the presence-preserving field
        copier at the top), and shadowing it made every calendar drain die with
        `_carry() takes 2 positional arguments but 5 were given`.

        The ENGINE's budget spans the whole chain — every account the queue holds
        — so a per-account reset would let a five-account queue spend five times
        the budget and park on the fifth. The counters ride across.
        """
        nxt["hops"] = int(cur.get("hops") or 0)
        nxt["startedAt"] = cur.get("startedAt") or 0
        return _carry_trait(cur, nxt)


    def _hop(cur):
        """Count this invocation, and stamp the chain's start on the first."""
        cur["hops"] = int(cur.get("hops") or 0) + 1
        if not cur.get("startedAt"):
            cur["startedAt"] = _clock()
        return cur


    def _over_budget(cur):
        """True when this chain should hand back rather than page again."""
        if int(cur.get("hops") or 0) >= HOP_MAX:
            return True
        # Both halves are the CHAIN's, not this invocation's: the engine's budget
        # spans every account and page the continuation reaches, and a chain that
        # walks past it is parked with its effects committed.
        return _out_of_time(cur)


    def _fresh(queue):
        return {"phase": "plan", "queue": queue, "pageToken": "", "cals": [],
                "dead": [], "blind": [], "allCals": [], "started": False,
                "syncToken": "", "pendingToken": "",
                "seen": [], "seenOverflow": False, "tombs": [],
                "generation": "", "calTz": "", "floor": "",
                "after": "", "anchor": "", "sweep": False,
                # `legacy` says the calendar's stored token was minted
                # under another walk, which forces one full read + sweep;
                # `stage` is the sweep's (or the purge's) current kind.
                "legacy": False, "stage": "", "records": 0,
                # The chain's own budget counters (see HOP_MAX / DRAIN_SECONDS).
                "hops": 0, "startedAt": 0,
                # Every value this drain could not spell, so the account's
                # status line names them rather than the mirror losing them.
                "unknown": [],
                # `cancelled` is the provider's own housekeeping — a delta
                # ALWAYS carries cancellations — and `skipped` is a failure.
                # Counting the first as the second made an ordinary calendar
                # sync read "ok (N skipped)" on the console forever.
                "cancelled": 0, "skipped": 0}


    def _plan_account(host, aid, acct, props, cur):
        """The account's own instants, and THE OWNER HUB.

        `account.address` is the connection's identity as a reference, and it is
        established HERE — at the start of this stream's work, before a calendar
        is read — because a CALENDAR-ONLY connection has no contacts or gmail
        drain to establish it for us. Version 18 merely stashed `cur["owner"]`
        and never wrote the relation, so an account with only calendar enabled
        had no address at all.

        The account is patched ONLY when the reference would actually CHANGE:
        while `calendarLastSyncedAt` is still absent, any account update re-fires
        the on-connect trigger underneath this drain.
        """
        # Carried on the CURSOR, because `_events` (which decides whether to use
        # a calendar's stored token) never sees the account row.
        cur["requested"] = _requested(props)
        cur["owed"] = [str(c) for c in (props.get("calendarPending") or []) if c]
        owner = _mailbox(props.get("email"))
        if owner:
            oref = _address_id(host, aid, owner)
            host.effects.put(ADDRESS_TYPE, oref,
                             properties={"account": aid, "address": owner})
            held = props.get("address")
            held = held.get("ref") if isinstance(held, dict) else held
            if str(held or "").rsplit("/", 1)[-1] != oref.rsplit("/", 1)[-1]:
                host.effects.patch((acct.get("kind") or ACCOUNT_TYPE), aid,
                                   properties={"address": {"ref": oref}})
        anchor = str(props.get("calendarBackfillAnchorAt") or "")
        if not anchor:
            anchor = _iso(_now())
            cur["anchor"] = anchor
        cur["floor"] = _floor(props, anchor)
        cur["phase"] = "calendars"
        return cur


    def _calendars(host, aid, base, token, cur, notes):
        # `showDeleted=true` is what makes an UNSUBSCRIBED or deleted calendar
        # observable at all. Without it the entry simply stops appearing, the
        # calendar is never walked again, its per-calendar 410 never comes,
        # and its mirror and every one of its rows stay live and stale
        # forever: the sweep is per-calendar, and only a walk reaches it.
        params = {"maxResults": CALENDAR_PAGE, "showHidden": "true",
                  "showDeleted": "true"}
        if cur.get("pageToken"):
            params["pageToken"] = cur["pageToken"]
        resp = _get(base, token, LIST_PATH, params)
        cals = list(cur.get("cals") or [])
        dead = list(cur.get("dead") or [])
        blind = list(cur.get("blind") or [])
        everything = list(cur.get("allCals") or [])
        items = [x for x in resp.get("items") or [] if str(x.get("id") or "")]
        held = _rows(host, CALENDAR_TYPE,
                     [_calendar_id(host, aid, str(x["id"])) for x in items])
        for item in items:
            cid = str(item["id"])
            everything.append(cid)
            cref = _calendar_id(host, aid, cid)
            if item.get("deleted"):
                # Retracted below, in its own bounded phase — and NOT enqueued
                # for event sync.
                dead.append(cid)
                continue
            role = str(item.get("accessRole") or "")
            was = ((held.get(cref) or {}).get("properties") or {}).get("accessRole")
            # ONE PROPERTY PER CalendarListEntry FIELD, under the API's own
            # name, typed exactly. `timeZone` keeps Google's capital Z: the
            # lowercase `timezone` on `calendarseries` is the recurring TRAIT's, and
            # bending one to fit the other would misname whichever lost.
            # NO sync state and NO `raw` — the cursor is a `calendarsync` row.
            #
            # A calendarList entry is an AUTHORITATIVE COMPLETE SNAPSHOT, so a
            # field Google omitted is cleared. What it is NOT is permission to
            # invent: version 18 wrote `primary: false`, `selected: false`,
            # `hidden: false`, `deleted: false` and `autoAcceptInvitations:
            # false` for every entry that simply did not carry the key, which is
            # this mirror asserting something Google never said.
            props = {"account": aid, "calendarId": cid}
            _carry(item, "etag", props, True, lambda v: str(v))
            _carry(item, "summary", props, True, lambda v: str(v))
            _carry(item, "description", props, True, lambda v: str(v))
            _carry(item, "location", props, True, lambda v: str(v))
            _carry(item, "timeZone", props, True,
                   lambda v: _zone_name(v, notes, "timeZone") or None)
            _carry(item, "summaryOverride", props, True, lambda v: str(v))
            for name in ("colorId", "backgroundColor", "foregroundColor"):
                _carry(item, name, props, True, lambda v: str(v))
            for name in ("hidden", "selected", "primary", "deleted",
                         "autoAcceptInvitations"):
                _carry(item, name, props, True,
                       lambda v: v if isinstance(v, bool) else None)
            _carry(item, "accessRole", props, True,
                   lambda v: _enum("accessRole", v, notes, "accessRole"))
            _carry(item, "defaultReminders", props, True,
                   lambda v: _default_reminders(v, notes))
            _carry(item, "notificationSettings", props, True,
                   lambda v: _notifications(v, notes))
            _carry(item, "conferenceProperties", props, True,
                   lambda v: _conference_properties(v, notes))
            # `dataOwner` is the SAME PARTY IDENTITY every attendee list, mail
            # header and address book converges on, so it is the hub ROW and a
            # reference at it — not an `email` scalar beside one. The hub is
            # upserted FIRST, because a reference's target must exist when the
            # row naming it applies. A mailbox that does not parse leaves the
            # property absent rather than parking the page at effect apply.
            if "dataOwner" in item:
                owner = _mailbox(item["dataOwner"])
                if owner:
                    oref = _address_id(host, aid, owner)
                    host.effects.put(ADDRESS_TYPE, oref,
                                     properties={"account": aid,
                                                 "address": owner})
                    props["dataOwner"] = _ref(oref)
                else:
                    props["dataOwner"] = None
                    if item["dataOwner"] is not None:
                        notes.add("a calendar's dataOwner is not a mailbox")
            else:
                props["dataOwner"] = None
            # A put MERGES and never prunes. Nothing of the drain's is on this
            # row any more, so a calendar-list refresh cannot disturb a cursor.
            host.effects.put(CALENDAR_TYPE, cref, properties=props)
            # THE FREE/BUSY ENTRY IS MIRRORED LIKE ANY OTHER. Version 18 skipped
            # it before even writing the row, so a calendar this account can see
            # the busy blocks of did not exist here at all. Only its EVENTS are
            # not read — Google blanks their content for this role — which is a
            # calendar with no events, not a calendar that is not there.
            if role == FREEBUSY:
                if was and was != "freebusyreader":
                    # A DOWNGRADE. The detailed rows already mirrored are no
                    # longer visible and can never be refreshed or tombstoned:
                    # they are retracted, and the calendar row stays.
                    host.log("google-calendar: %s dropped to free/busy for %s — "
                             "its event and series rows are retracted"
                             % (cid, aid))
                    notes.add("a calendar dropped to free/busy and its detailed "
                              "rows were retracted")
                    blind.append(cid)
                continue
            cals.append(cid)
        # AN INTERRUPTED WALK RESUMES WHERE IT STOPPED. `calendarPending` is what
        # the last hand-back owed; every calendar NOT on it has already committed
        # its walk, its retractions and its token under this restart, so redoing
        # it would be work the engine's budget cannot afford twice. The list is
        # intersected with what the calendar list still holds, so a calendar that
        # vanished meanwhile simply drops out.
        owed = [c for c in (cur.get("owed") or []) if c in cals]
        if owed:
            host.log("google-calendar: resuming %d calendar(s) owed by an "
                     "earlier drain" % len(owed))
            cals = owed
        cur.update({"cals": cals, "dead": dead, "blind": blind,
                    "allCals": everything})
        next_page = resp.get("nextPageToken") or ""
        if next_page:
            cur["pageToken"] = next_page
            return {"more": host.page.more(cur)}
        cur.update({"pageToken": "", "phase": "reconcile", "started": False,
                    "after": "", "stage": ""})
        return {"more": host.page.more(cur)}


    def _reconcile(host, aid, cur):
        """THE CALENDAR LIST IS AUTHORITATIVE, so what it does not name is gone.

        `calendarList.list` is called with no sync token, so every page just
        drained is the WHOLE list. Version 18 purged only entries Google
        explicitly flagged `deleted`; a calendar that simply stopped appearing —
        a share revoked, a domain account removed — kept its mirror and every
        event under it, live and stale, forever, because the sweep is
        per-calendar and only a walk reaches it.

        Paged, and it compares by ROW ID, so an id scheme change cannot make it
        delete the world.
        """
        known = {_calendar_id(host, aid, cid) for cid in cur.get("allCals") or []}
        dead = list(cur.get("dead") or [])
        page = host.records.list(CALENDAR_TYPE, where={"account": {"eq": aid}},
                                 first=SWEEP_PAGE, after=cur.get("after") or None)
        for ent in page.get("records") or []:
            rid = str(ent.get("id") or "")
            if not rid or rid in known:
                continue
            cid = str((ent.get("properties") or {}).get("calendarId") or "")
            if cid and cid not in dead:
                host.log("google-calendar: %s is no longer in the calendar list "
                         "for %s — retracted with its rows" % (cid, aid))
                dead.append(cid)
        cur["dead"] = dead
        cur["after"] = page.get("cursor") or ""
        if cur["after"]:
            return {"more": host.page.more(cur)}
        cur.update({"phase": "purge", "after": "", "stage": ""})
        return {"more": host.page.more(cur)}


    def _purge(host, aid, cur):
        """Retract one calendar's rows, a bounded page at a time: its event
        rows, then its series rows, then — for a calendar that is GONE — its
        state row and the calendar mirror itself.

        Two queues feed this. `dead` is a calendar that is deleted or no longer
        listed: everything goes. `blind` is a calendar whose role dropped to
        free/busy: its detailed rows and its now-useless sync token go, and the
        MIRROR STAYS, because the calendar is still there and this account can
        still see that it is busy.

        Only rows that are actually there, because deleting one that was never
        written is ErrNotFound and fails the whole delivery.
        """
        dead = list(cur.get("dead") or [])
        blind = list(cur.get("blind") or [])
        whole = bool(dead)
        queue = dead if whole else blind
        if not queue:
            cur.update({"phase": "events", "after": "", "started": False,
                        "stage": ""})
            return {"more": host.page.more(cur)}
        cid = queue[0]
        cref = _calendar_id(host, aid, cid)
        kind = SERIES_TYPE if cur.get("stage") == "series" else EVENT_TYPE
        page = host.records.list(kind,
                                 where={"account": {"eq": aid},
                                        "calendar": {"eq": cref}},
                                 first=SWEEP_PAGE,
                                 after=cur.get("after") or None)
        for ent in page.get("records") or []:
            if ent.get("id"):
                host.effects.delete(kind, str(ent["id"]))
        cur["after"] = page.get("cursor") or ""
        if cur["after"]:
            return {"more": host.page.more(cur)}
        if kind == EVENT_TYPE:
            cur["stage"] = "series"
            return {"more": host.page.more(cur)}
        live = _live(host, (CALENDAR_TYPE, SYNC_TYPE), [cref])
        # The state row first: it cascades off the calendar, but an explicit
        # retraction keeps the two in step between here and the next GC. A
        # free/busy calendar loses it too — its token reads events this account
        # can no longer see.
        if ("%s|%s" % (SYNC_TYPE, cref)) in live:
            host.effects.delete(SYNC_TYPE, cref)
        if whole:
            host.log("google-calendar: calendar %s is gone for %s — retracted "
                     "with its series and events" % (cid, aid))
            if ("%s|%s" % (CALENDAR_TYPE, cref)) in live:
                host.effects.delete(CALENDAR_TYPE, cref)
            cur["dead"] = dead[1:]
        else:
            cur["blind"] = blind[1:]
        cur.update({"after": "", "stage": ""})
        return {"more": host.page.more(cur)}


    def _next_calendar(cur):
        cur.update({"cals": list(cur.get("cals") or [])[1:], "started": False,
                    "pageToken": "", "syncToken": "", "generation": "",
                    "calTz": "", "sweep": False, "legacy": False, "stage": "",
                    "after": "", "tombs": [], "pendingToken": ""})
        cur["phase"] = "events" if cur["cals"] else "finish"
        return cur


    def _events(host, aid, base, token, cur, notes):
        cals = list(cur.get("cals") or [])
        if not cals:
            cur["phase"] = "finish"
            return {"more": host.page.more(cur)}
        cid = cals[0]
        cref = _calendar_id(host, aid, cid)
        if not cur.get("started"):
            # The calendar reached the head: its OWN stored token decides
            # whether this walk is incremental or a full read. A token minted
            # under another walk reads as absent, and that first run is a full
            # read under a fresh generation, followed by a sweep (`legacy`).
            # The CURSOR is a `calendarsync` row, not a property of the mirror,
            # and its id IS the calendar row's, so finding it costs no lookup.
            state = (host.records.get(SYNC_TYPE, cref) or {}).get("properties") \
                or {}
            row = host.records.get(CALENDAR_TYPE, cref) or {}
            held = row.get("properties") or {}
            token_held = str(state.get("syncToken") or "")
            legacy = str(state.get("syncWalk") or "") != WALK
            # AN UNSPENT REQUEST STARTS OVER, per calendar. The other two streams
            # do the same: a delta against an intact cursor reports nothing
            # changed exactly when a purge has removed every row it accounts for,
            # which is what left a re-seeded account empty. Dropping the token
            # makes this a full read under a fresh generation, and the sweep that
            # follows one retracts whatever the re-read does not re-stamp.
            if token_held and cur.get("requested"):
                token_held = ""
            if legacy and token_held:
                host.log("google-calendar: %s/%s holds a sync token from the "
                         "instance walk — full read under the %s walk"
                         % (aid, cid, WALK))
                token_held = ""
            cur.update({"syncToken": token_held, "pageToken": "", "seen": [],
                        "seenOverflow": False, "tombs": [], "pendingToken": "",
                        "started": True, "legacy": legacy, "sweep": legacy,
                        "calTz": str(held.get("timeZone") or ""),
                        "generation": "" if token_held else uuid.uuid4().hex})
        try:
            resp = _get(base, token, _events_path(cid), _params(cur))
        except urllib.error.HTTPError as e:
            if _http_status(e) != 410 or not cur.get("syncToken"):
                # ONLY a 410 means the token died. A 400 is a request bug and
                # a 403 a scope problem; neither may become a full re-read.
                raise
            host.log("google-calendar: sync token gone for %s/%s — full "
                     "re-read" % (aid, cid))
            cur.update({"syncToken": "", "generation": uuid.uuid4().hex,
                        "pageToken": "", "sweep": True, "seen": [],
                        "seenOverflow": False, "tombs": [], "pendingToken": ""})
            resp = _get(base, token, _events_path(cid), _params(cur))
        kept, dropped, skipped = _stage_events(
            host, aid, cref, resp.get("items") or [],
            cur.get("calTz") or "", cur, notes)
        cur["records"] = int(cur.get("records") or 0) + kept
        cur["cancelled"] = int(cur.get("cancelled") or 0) + dropped
        cur["skipped"] = int(cur.get("skipped") or 0) + skipped
        next_page = resp.get("nextPageToken") or ""
        if next_page:
            # ANOTHER PAGE. Google sends `nextSyncToken` on the LAST page only,
            # so nothing is committed here; the page token rides the cursor.
            cur["pageToken"] = next_page
            return {"more": host.page.more(cur)}
        # The FINAL page, and the only one that carries nextSyncToken. It is
        # HELD, not written: the retractions this read owes come first.
        cur["pendingToken"] = str(resp.get("nextSyncToken") or "")
        cur.update({"phase": "tombstones", "after": "", "stage": ""})
        return {"more": host.page.more(cur)}


    def _tombstones(host, aid, cid, cur):
        """Collect the exceptions of every master this calendar's drain
        condemned, a BOUNDED page at a time, after its pages are drained.

        Two defects in one phase. Version 18 deleted a cancelled master's
        exceptions inline, loading EVERY page of them in one invocation: a
        five-year daily series with an edit a week is thousands of deletes in
        one effect batch. And it decided from COMMITTED rows only, so an
        exception that arrived on a later page of the same drain — or earlier on
        the same page — outlived the master it belonged to, and a cancelled
        exception could even re-mint the master as a shell. The decision is made
        once, carried on the cursor, and carried out here, after every page of
        this calendar has been read.
        """
        tombs = list(cur.get("tombs") or [])
        if not tombs:
            return False
        mid, sref = tombs[0][0], tombs[0][1]
        # AN EXCEPTION IS NOT RETRACTED BY ITS MASTER'S TOMBSTONE (owner's
        # ruling, 2026-09-16). When Google deletes a series it sends a tombstone
        # for the master AND one for each exception; every one of those is a
        # RESOURCE, and the mirror keeps a cancelled resource as a row carrying
        # `status: cancelled` — that is the whole point of dropping
        # `cancelledSlots`. Cascading the master's tombstone deleted 299 rows the
        # API had just handed us, and made a reinstated exception unrepresentable.
        # An exception is retracted only when Google says THAT exception is gone,
        # which happens on its own item, in `_stage_events`, like any other row.
        #
        # What the master's tombstone does retract is the MASTER. Its series row
        # survives as an identity-only SHELL exactly when exceptions still point
        # at it — a reference needs a target — and is deleted outright when none
        # do. That is one list call, not a page of deletes.
        page = host.records.list(EVENT_TYPE, where={"recurrenceOf": {"eq": sref}},
                                 first=1)
        survivors = [ent for ent in (page.get("records") or []) if ent.get("id")]
        if survivors:
            # The row is left exactly as it is. A put MERGES, so it cannot strip
            # the master's old content, and a delete would take the identity the
            # survivors point at with it. On a full re-read the master arrives as
            # a tombstone and no content is written for it, so the row this drain
            # leaves behind is the identity-only shell its own exceptions mint.
            host.log("google-calendar: master %s of %s is gone; its exceptions "
                     "are resources of their own and stay, so its series row "
                     "stands as the shell they point at" % (mid, cid))
        elif SERIES_TYPE + "|" + sref in _live(host, (SERIES_TYPE,), [sref]):
            host.effects.delete(SERIES_TYPE, sref)
            host.log("google-calendar: series %s of %s is gone and nothing points "
                     "at it — retracted" % (mid, cid))
        cur.update({"tombs": tombs[1:], "after": ""})
        return True


    def _sweep(host, aid, cid, cur):
        """Retract what a full read did not re-stamp, SCOPED to this ONE
        calendar, in stages: its event rows whose END is at or above the floor,
        then EVERY series row (a master is one row whatever its dates).
        `syncWalk` and the sync token are stamped when the last stage completes
        and NOT BEFORE, so a run that fails mid-sweep repeats the whole full
        read rather than resuming a delta over a half-reconciled mirror.

        THE BOUND MATCHES THE READ'S. `timeMin` is a lower bound on an event's
        END, not its start, so the read covers an event that began before the
        floor and ends after it — and version 18 swept on `at >= floor`, which
        did not, so exactly those straddling rows could never be retracted. The
        sweep asks `endsAt >= floor`, the same question the read asked. A row
        with no `endsAt` is outside the comparison and survives, which is the
        safe direction.

        WHAT IT COMPARES AGAINST. Not a `syncGeneration` on each row — that is
        sync bookkeeping on a mirror — but the SET OF ROW IDS this full read
        wrote, carried on the cursor. Past `SEEN_MAX` ids the set is dropped and
        the sweep skipped, because deleting on a truncated set would retract live
        rows; that is logged rather than guessed at."""
        cref = _calendar_id(host, aid, cid)
        if cur.get("seenOverflow"):
            host.log("google-calendar: %s/%s wrote more than %d rows in one full "
                     "read — the sweep is skipped (README, ask 1)"
                     % (aid, cid, SEEN_MAX))
            return False
        seen = set(cur.get("seen") or ())
        stage = cur.get("stage") or "events"
        kind = SERIES_TYPE if stage == "series" else EVENT_TYPE
        where = {"account": {"eq": aid}, "calendar": {"eq": cref}}
        if stage == "events" and cur.get("floor"):
            where["endsAt"] = {"gte": cur["floor"]}
        page = host.records.list(kind, where=where, first=SWEEP_PAGE,
                                 after=cur.get("after") or None)
        for ent in page.get("records") or []:
            eid = str(ent.get("id") or "")
            if eid and eid not in seen:
                host.effects.delete(kind, eid)
        cur["after"] = page.get("cursor") or ""
        if cur["after"]:
            return True
        stages = ["events", "series"]
        following = stages[stages.index(stage) + 1:] if stage in stages else []
        if following:
            cur["stage"] = following[0]
            return True
        return False


    def _stamp(host, aid, acct, cur, notes):
        # This stream's own cadence anchor AND the account-level rollup the
        # console reads. The STATE is the enum a query filters on; the STATUS
        # beside it is the sentence, which keeps its shape because the
        # end-to-end runner parses its words.
        props = acct.get("properties") or {}
        skipped = int(cur.get("skipped") or 0)
        status = _status(notes, skipped)
        now = _iso(_now())
        stamp = _ack(props, {}, "calendar")
        # A COMPLETED RUN CLEARS THE 429 WALL: it only got here by calling Google
        # successfully, so the outstanding Retry-After is spent.
        if props.get("retryNotBefore"):
            stamp["retryNotBefore"] = None
        stamp.update({"calendarLastSyncedAt": now, "lastSyncedAt": now,
                      "calendarSyncStatus": status, "calendarSyncState": "ok"})
        # The walk is complete, so nothing is owed. Written only when it was
        # non-empty: an account patch is a trigger event, and one that changes
        # nothing is one more delivery through the shared dispatcher.
        if props.get("calendarPending"):
            stamp["calendarPending"] = []
        # The shared rollup is NOT cleared over ANOTHER STREAM's live failure: a
        # healthy calendar run must not make a broken gmail or contacts read "ok"
        # on the console. Version 18 asked the wrong question — it ignored
        # contacts entirely, and joined the two halves it did ask with `and`, so a
        # gmail failure the rollup had not yet caught up to was cleared anyway.
        # This is the same test the other two streams make, from this side.
        # A STREAM WITH WORK OWED IS NOT "ok" AT THE ACCOUNT LEVEL either. The
        # runner's continuation contract reads the ROLLUP for the word `pending`,
        # and a stream that finished after the calendar walk handed back with six
        # calendars owed overwrote `ok (6 pending)` with `ok` — so the drain was
        # reported done with a third of the mirror unwritten and nothing stamped
        # `syncRequestedAt` again. A live `erroring` and a live `pending` both
        # hold the rollup.
        others = [str(props.get(k) or "") for k in
                  ("gmailSyncStatus", "contactsSyncStatus",
                   "driveSyncStatus")]
        if not any(s.startswith("erroring") or "pending" in s for s in others):
            stamp["syncStatus"] = status
        # The trait's half: this stream's entry, the account-level state raised
        # the same way the sentence above is, the request acknowledged once every
        # enabled stream has answered it, and — on the SCHEDULED path only — when
        # this account's walk began and how long it took. Nothing is owed here:
        # this is the walk that drained every calendar.
        started, elapsed = _trait_run(cur)
        stamp.update(_trait_stamp(
            props, "calendar", "ok", status, now, completed=True,
            progress=_trait_progress("calendar", cur.get("records"), 0),
            started=started, elapsed_ms=elapsed))
        if cur.get("anchor"):
            stamp["calendarBackfillAnchorAt"] = cur["anchor"]
        host.effects.patch((acct.get("kind") or ACCOUNT_TYPE), aid,
                           properties=stamp)
        rest = list(cur.get("queue") or [])[1:]
        if rest:
            return {"more": host.page.more(_carry_budget(cur, _fresh(rest)))}
        return {"output": {"account": aid,
                           "records": int(cur.get("records") or 0),
                           "cancelled": int(cur.get("cancelled") or 0),
                           "skipped": skipped}}


    def _drain(host, aid, acct, props, base, token, cur, notes):
        # WHEN THIS ACCOUNT'S WALK BEGAN, once per account and by the door every
        # resumed cursor comes through, so a walk spanning six invocations
        # reports its own duration rather than its last page's.
        _trait_begin(cur)
        # AND THE CHAIN'S CLOCK IS CHECKED AT THE TOP OF EVERY CONTINUATION, not
        # only where a page boundary falls: the two boundary checks below are in
        # the event walk alone, so a chain that spends its budget listing
        # calendars or reconciling never met one. The calendars still owed ride on
        # the account, which is what `_hand_back` persists.
        if cur.get("cals") and _over_budget(cur):
            return _hand_back(host, aid, acct, cur, notes)
        phase = cur.get("phase") or "plan"
        if phase == "plan":
            cur = _plan_account(host, aid, acct, props, cur)
            phase = cur["phase"]
        if phase == "calendars":
            return _calendars(host, aid, base, token, cur, notes)
        if phase == "reconcile":
            return _reconcile(host, aid, cur)
        if phase == "purge":
            return _purge(host, aid, cur)
        if phase == "events":
            return _events(host, aid, base, token, cur, notes)
        if phase == "tombstones":
            cals = list(cur.get("cals") or [])
            if cals and _tombstones(host, aid, cals[0], cur):
                return {"more": host.page.more(cur)}
            if cals and cur.get("sweep"):
                cur.update({"phase": "sweep", "after": "", "stage": "events"})
                return {"more": host.page.more(cur)}
            if cals:
                # No sweep owed: the retractions are staged, so the token this
                # read earned commits now.
                _commit_state(host, _calendar_id(host, aid, cals[0]), cur)
            cur = _next_calendar(cur)
            # The other calendar boundary, and the same stop (see the sweep
            # branch): everything this calendar owed has just committed.
            if cur.get("cals") and _over_budget(cur):
                return _hand_back(host, aid, acct, cur, notes)
            return {"more": host.page.more(cur)}
        if phase == "sweep":
            cals = list(cur.get("cals") or [])
            if cals and _sweep(host, aid, cals[0], cur):
                return {"more": host.page.more(cur)}
            if cals:
                # THE WHOLE RECONCILIATION IS DONE: token, generation and the
                # walk mark commit together, and not one of them before.
                _commit_state(host, _calendar_id(host, aid, cals[0]), cur,
                              walk=True)
            cur = _next_calendar(cur)
            # THE CALENDAR BOUNDARY, which is the only safe place to stop: the
            # calendar just finished has committed its retractions, its sweep and
            # its token together, so the continuation is the REMAINING ids and
            # nothing else — no half-read page, no truncated seen-set.
            if cur.get("cals") and _over_budget(cur):
                return _hand_back(host, aid, acct, cur, notes)
            return {"more": host.page.more(cur)}
        return _stamp(host, aid, acct, cur, notes)


    def _hand_back(host, aid, acct, cur, notes):
        """Stop cleanly with work owed, instead of letting the engine park us.

        The remaining calendars ride on the ACCOUNT (`calendarPending`), the way
        gmail's unfinished walk rides on `gmailBackfillResume`, and the status
        line says `ok (N pending)` — the word the end-to-end runner's
        continuation contract reads before it stamps `syncRequestedAt` again.
        NEITHER `calendarLastSyncedAt` NOR the rollup is stamped: this drain did
        not finish, and a cadence anchor that moves on an unfinished walk is how a
        half-mirrored account reads as done.

        The request IS acknowledged: an unacknowledged generation would re-fire
        the on-request trigger against this same drain immediately, which is the
        loop that parked twenty deliveries.
        """
        props = acct.get("properties") or {}
        pending = [str(c) for c in (cur.get("cals") or []) if c]
        status = ("ok (%d pending)" % len(pending))
        stamp = _ack(props, {}, "calendar")
        stamp.update({"calendarPending": pending,
                      "calendarSyncStatus": status,
                      "calendarSyncState": "pending"})
        if not str(props.get("syncStatus") or "").startswith("erroring"):
            stamp["syncStatus"] = status
        # THE TRAIT HAS NO `pending` WORD, and does not need one: a hand-back is a
        # run that did what it could and knows exactly what is left, which is `ok`
        # with the calendars owed counted in `syncProgress.pending` and in this
        # stream's own entry. `completed` is false, so no `lastAt` is stamped —
        # the same reason `calendarLastSyncedAt` is not.
        started, elapsed = _trait_run(cur)
        stamp.update(_trait_stamp(
            props, "calendar", "ok", status, _iso(_now()),
            progress=_trait_progress("calendar: " + str(cur.get("phase") or "events"),
                                     cur.get("records"), len(pending)),
            started=started, elapsed_ms=elapsed))
        host.effects.patch((acct.get("kind") or ACCOUNT_TYPE), aid,
                           properties=stamp)
        host.log("google-calendar: %s handed back with %d calendar(s) owed after "
                 "%d invocations — the next requested run resumes from them"
                 % (aid, len(pending), int(cur.get("hops") or 0)))
        rest = list(cur.get("queue") or [])[1:]
        if rest:
            return {"more": host.page.more(_carry_budget(cur, _fresh(rest)))}
        return {"output": {"account": aid, "pending": len(pending),
                           "records": int(cur.get("records") or 0)}}


    def main(input, host):
        cfg = input.get("config") or {}
        accounts = {a.get("id"): a for a in (cfg.get("accounts") or [])}
        # The paged-checkpoint wrapper. The access token NEVER enters the
        # cursor (the host would refuse the whole invocation if it did).
        resume = host.page.resume() or None
        if resume:
            cur = dict(resume)
        else:
            record = (input.get("envelope") or {}).get("record") or {}
            # The envelope SPLITS identity: `type` is the bare local name and
            # `authority` the authority, so the full identity (ruling A9) has to be
            # recomposed. Comparing the local name alone would match any
            # authority's `account`.
            etype = (record.get("kind") or "")
            if etype == ACCOUNT_TYPE:
                # Record-triggered: sync just this account (a connect or edit).
                queue = [record.get("id")]
                scheduled = False
            else:
                # Schedule-triggered: every connected account that wants
                # calendar and is due by its cadence.
                queue = [aid for aid, a in accounts.items()
                         if _wants(a) and _due(a.get("properties") or {})]
                scheduled = True
            cur = _fresh(queue)
            # WHICH PATH DROVE THIS RUN, on the cursor, because it decides who
            # writes `lastSyncStartedAt` and `lastSyncDurationMs`: around a
            # record-sourced delivery the dispatcher stamps both, and a schedule
            # names no record and stamps nothing, so there the body is the only
            # hand there is (decision 0085).
            cur["scheduled"] = scheduled
        # EVERY INVOCATION OF THE CHAIN COUNTS, resumed or first: the engine's
        # budget spans the whole chain (512 pages, two minutes), so ours has to
        # span it too or the stop never comes.
        _hop(cur)
        # How long this fire may keep continuing before it hands back.
        _drain_budget(cfg, cur)

        # Advance past accounts we cannot or should not sync. A dead grant is
        # that account's problem alone (F2).
        queue = list(cur.get("queue") or [])
        while queue:
            acct = accounts.get(queue[0])
            if acct is not None and acct.get("tokenError"):
                host.log("google-calendar: skip %s: %s"
                         % (queue[0], acct["tokenError"]))
                _erroring(host, acct, acct["tokenError"])
            if acct is None or not _wants(acct) or acct.get("tokenError") \
                    or not acct.get("token"):
                queue = queue[1:]
                cur = _carry_trait(cur, _fresh(queue))
                continue
            break
        if not queue:
            return {}

        aid = queue[0]
        acct = accounts[aid]
        cur["queue"] = queue
        # WHAT THIS DRAIN COULD NOT SPELL rides on the cursor, so a note from
        # page one survives to the stamp several invocations later. `_Notes`
        # writes through, so the phase that checkpoints next already carries it.
        notes = _Notes(cur)
        try:
            return _drain(host, aid, acct, acct.get("properties") or {},
                          _api_base(cfg), acct["token"], cur, notes)
        except Exception as e:
            host.log("google-calendar: %s failed for %s: %s"
                     % (cur.get("phase"), aid, e))
            # WHICH CALENDAR, AND IN WHICH PHASE (T-055). The status used to read
            # `erroring: google returned HTTP 404` and nothing else, so an
            # account with nine calendars said only that ONE of them answered
            # 404 — the diagnosis had to find it by listing the `calendarsync`
            # rows and spotting which calendar had none. Both facts are on the
            # cursor at the moment the failure is caught: the phase, and the
            # calendar the phases after `calendars` are working on (the head of
            # `cals`). The log already carried the phase; the status line is what
            # the owner and the console read.
            _erroring(host, acct, _where(cur) + _reason(e), _retry_after(e))
            rest = queue[1:]
            if rest:
                return {"more": host.page.more(_carry_budget(cur, _fresh(rest)))}
            return {}
---
# ---- the Drive mirror: one Drive `File` (T-088) ----------------------------
# Drive API v3 `File`, from `files.list` (the cold walk) and `changes.list`
# (the delta), both under ONE fields mask this stream pins (`FILE_FIELDS` in
# syncdrive.py). A folder, a shortcut and a Google-native document are all
# Files to Drive, so they are all rows of this one kind, told apart by
# `mimeType` — which is the API's own discriminator and stays a string,
# because the set is every IANA type a user can upload.
#
# THE FIELDS MASK IS A PROJECTION, and the kind says so rather than claiming
# the whole resource: `files.list` returns only what `fields` asks for, and a
# mask over the ~50-field resource is what keeps a page of 100 files inside
# the invocation frame. What is declared is exactly what is asked for. What
# is NOT asked for is named in the kind's description — `capabilities` (a
# 40-flag object), `permissions` (its own resource, so it would be a kind),
# `contentHints`, `imageMediaMetadata`, `videoMediaMetadata`,
# `appProperties`, `properties`, `spaces`, `labelInfo`, `linkShareMetadata`,
# `shortcutDetails`, `trashingUser`/`trashedTime` (a listing under
# `trashed = false` never carries them) — so the day one is wanted it is a
# widening of the mask and a package bump, not a surprise.
#
# `at` IS `createdTime`. The one instant the File has of its own that is not
# a mutation mark (`docs/kind-design.md` §4): the API's instant lands in the
# trait slot and is not redeclared. `modifiedTime`, `modifiedByMeTime`,
# `viewedByMeTime` and `sharedWithMeTime` are declared beside it as the
# datetimes they are; none of them anchors the trait.
#
# THE PEOPLE ARE OCCURRENCE OBJECTS pointing at the `emailaddress` hub, the
# shape the calendar attendee and the mail header already take: a Drive
# `User` is `{displayName, emailAddress, permissionId, photoLink, me}` with
# no id this bundle mirrors, and its address IS the identity Google reuses
# across all four products. `me` is the API's own self-fact and stays, the
# way an attendee's `self` does.
#
# `parents` ARE REFERENCES at this kind: a parent folder is a Drive File
# too. No `mustExist` — a folder outside the walk's window (never modified
# inside `backfillDepth`) is a real parent whose row this walk did not
# write, and the pointer dangles the way `calendarevent.recurrenceOf` may.
#
# `text` IS THE SIBLING CALL, not a derivation: `files.export` is keyed by
# this file's id and returns no identity of its own (§1), so its answer is
# the file's. A Doc is exported as `text/markdown`, a Sheet as `text/csv`
# (the FIRST sheet only — that is what Drive's CSV export returns), a Slides
# deck as `text/plain`; every other type has no export and no `text`. The
# body is capped at 200 KB and `exportTruncated` says when the cap cut it.
# `exportedAt` / `exportError` are the pair `capture/link` uses for the same
# fact: when we last read it, or why we could not (a 403 `cannotExportFile`
# on a deck the owner may view but not export is a REAL recording in the
# fixtures). The size, sent as a decimal string, is an `int` — it is a byte
# count Drive does arithmetic on — while `version` and `headRevisionId` are
# the strings they arrive as.
#
# Omitted, as classes: the response envelope (`kind: "drive#file"`, the list's
# `nextPageToken` and `incompleteSearch`, a change's `kind`), and no
# hypermedia exists on this resource. `id` is `fileId`.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/google/drivefile
data:
  authority: providers.substrate.reamde.dev
  package: google
  description: >-
    One Google Drive file (Drive API v3 File) from files.list and changes.list
    under one fields mask, authoritative for what it returns; `at` is `createdTime`;
    `text` is the files.export of a Doc, Sheet or Slides deck. Envelope omitted:
    kind, nextPageToken, incompleteSearch. Not requested: capabilities, permissions,
    contentHints, media metadata, app/properties, spaces, labelInfo, shortcutDetails.
  names:
    singular: drivefile
  traits:
    - substrate.reamde.dev/core/temporal(point)
  displayTemplate: "{name}"
  properties:
    # --- identity -----------------------------------------------------------
    account:
      type: reference
      kind: providers.substrate.reamde.dev/google/account
      required: true
      onDelete: cascade
      displayName: Account
      description: "the account this file was synced from — the one property
        here that is not the API's; always written"
    fileId:
      type: string
      required: true
      displayName: File ID
      description: "`id` — the file's Drive id, stable across renames and
        moves; the row is keyed on it"
    version:
      type: string
      displayName: Version
      description: "`version` — Drive's monotonically increasing revision
        counter for the file, sent as a decimal string and kept as one"
    headRevisionId:
      type: string
      displayName: Head revision ID
      description: "`headRevisionId` — the id of the file's head revision;
        Drive returns it for uploaded (binary) content only"
    driveId:
      type: string
      displayName: Shared drive ID
      description: "`driveId` — the shared drive this file lives in, absent
        for My Drive; this bundle mirrors no Drive resource for it, so an
        opaque string"
    md5Checksum:
      type: string
      displayName: MD5
      description: "`md5Checksum` — the content's MD5, for uploaded (binary)
        content only; a Google-native document has none"
    # --- the object's own scalars, in the API reference's order --------------
    name:
      type: string
      displayName: Name
      description: "`name` — the file's name as shown in Drive; not unique
        within a folder"
    mimeType:
      type: string
      displayName: MIME type
      description: "`mimeType` — `application/vnd.google-apps.document`, `.spreadsheet`,
        `.presentation`, `.folder`, `.shortcut` for Google's own types, an
        IANA type for an uploaded file. A growing list, so a string"
    description:
      type: text
      displayName: Description
      description: "`description` — the free-text description a user gave
        the file in Drive; absent when none was ever set"
    starred:
      type: bool
      displayName: Starred
      description: "`starred` — whether the user has starred the file"
    trashed:
      type: bool
      displayName: Trashed
      description: "`trashed` — whether the file is in the trash. The cold
        walk lists `trashed = false`, so a row is written trashed only by
        a change the delta reports"
    explicitlyTrashed:
      type: bool
      displayName: Explicitly trashed
      description: "`explicitlyTrashed` — trashed by the user, as opposed
        to trashed with its parent folder"
    webViewLink:
      type: url
      displayName: Open in Drive
      description: "`webViewLink` — the file's page in Drive or in its editor,
        for a browser"
    webContentLink:
      type: url
      displayName: Download link
      description: "`webContentLink` — the direct download of the content,
        for uploaded (binary) files only; a Google-native document has none"
    iconLink:
      type: url
      displayName: Icon
      description: "`iconLink` — Google's static icon for the file's type"
    thumbnailLink:
      type: url
      displayName: Thumbnail
      description: "`thumbnailLink` — a short-lived thumbnail of the content,
        when Drive has one; the URL expires within hours"
    shared:
      type: bool
      displayName: Shared
      description: "`shared` — whether the file is shared with anybody"
    ownedByMe:
      type: bool
      displayName: Owned by me
      description: "`ownedByMe` — whether this account owns the file; the
        API's own self-fact, kept the way an attendee's `self` is"
    viewedByMe:
      type: bool
      displayName: Viewed by me
      description: "`viewedByMe` — whether this account has ever opened the
        file"
    size:
      type: int
      displayName: Size
      description: "`size` — the content's size in bytes, sent by Drive as
        a decimal string; absent for a folder and for a Google-native document"
    quotaBytesUsed:
      type: int
      displayName: Quota used
      description: "`quotaBytesUsed` — the bytes this file charges against
        the owner's storage quota, sent as a decimal string"
    fileExtension:
      type: string
      displayName: Extension
      description: "`fileExtension` — the final extension of an uploaded file's
        name (`pdf`); absent for a Google-native document"
    fullFileExtension:
      type: string
      displayName: Full extension
      description: "`fullFileExtension` — every extension of an uploaded file's
        name (`tar.gz`); absent for a Google-native document"
    originalFilename:
      type: string
      displayName: Original filename
      description: "`originalFilename` — the name the content was uploaded
        under; absent for a Google-native document"
    exportLinks:
      type: string
      keyed: true
      displayName: Export links
      description: "`exportLinks` — the export media types Drive offers for
        a Google-native document, each keyed by media type to its export URL"
    # --- relations ----------------------------------------------------------
    parents:
      type: reference
      kind: providers.substrate.reamde.dev/google/drivefile
      repeated: true
      displayName: Parents
      description: "`parents` — the folder(s) this file sits in, as rows of
        this kind; a parent outside the walk's window is a pointer at a row
        this walk did not write"
    # The Drive `User`, as the occurrence object the attendee and the mail
    # header already take: the API's own fields, typed, the identity a
    # reference FIELD inside, `emailAddress` kept beside it because a probe
    # reads a source's own values and never through a pointer (§1).
    owners:
      type: object
      repeated: true
      displayName: Owners
      description: "`owners` — the file's owners, each a Drive User; one for
        a My Drive file, none for a shared-drive file"
      fields:
        emailAddress:
          type: email
          description: "`emailAddress` — the owner's address as Drive spelled
            it; the probe a person mapping reads"
        address:
          type: reference
          kind: providers.substrate.reamde.dev/google/emailaddress
          description: the emailaddress hub row for that address, the same
            row a mail header or a calendar attendee converges on
        displayName:
          type: string
          description: "`displayName` — the owner's name as Drive shows it"
        permissionId:
          type: string
          description: "`permissionId` — the owner's id in Drive's permissions
            namespace; this bundle mirrors no permission, so a string"
        photoLink:
          type: url
          description: "`photoLink` — the owner's profile photo"
        me:
          type: bool
          description: "`me` — whether this owner is the connected account;
            the API's own self-fact"
    lastModifyingUser:
      type: object
      displayName: Last modified by
      description: "`lastModifyingUser` — the Drive User who last changed
        the file; absent when Drive does not know (a shared file's history
        the account may not see)"
      fields:
        emailAddress:
          type: email
          description: "`emailAddress` — that user's address as Drive spelled
            it"
        address:
          type: reference
          kind: providers.substrate.reamde.dev/google/emailaddress
          description: the emailaddress hub row for that address
        displayName:
          type: string
          description: "`displayName` — that user's name as Drive shows it"
        permissionId:
          type: string
          description: "`permissionId` — that user's id in Drive's permissions
            namespace"
        photoLink:
          type: url
          description: "`photoLink` — that user's profile photo"
        me:
          type: bool
          description: "`me` — whether that user is the connected account"
    # --- instants (`at` is `createdTime`, the trait's, and is not listed) ----
    modifiedTime:
      type: datetime
      displayName: Modified
      description: "`modifiedTime` — when the content or metadata last changed,
        by anyone; the walk's window is over this instant"
    modifiedByMeTime:
      type: datetime
      displayName: Modified by me
      description: "`modifiedByMeTime` — when this account last changed the
        file; absent if it never did"
    viewedByMeTime:
      type: datetime
      displayName: Viewed by me at
      description: "`viewedByMeTime` — when this account last opened the file;
        absent if it never did"
    sharedWithMeTime:
      type: datetime
      displayName: Shared with me at
      description: "`sharedWithMeTime` — when the file was shared with this
        account; absent on a file it owns"
    # --- the sibling call: files.export ---------------------------------------
    text:
      type: markdown
      embed: true
      displayName: Text
      description: "the `files.export` of a Doc (text/markdown), a Sheet (text/csv,
        the FIRST sheet) or a Slides deck (text/plain), capped at 200 KB;
        absent for every other type and until the export has run"
    exportMimeType:
      type: string
      displayName: Exported as
      description: "the media type `text` was exported as — text/markdown,
        text/csv or text/plain"
    exportTruncated:
      type: bool
      displayName: Export truncated
      description: "true when the export ran past the 200 KB cap and `text`
        holds its head; absent or false otherwise"
    exportedAt:
      type: datetime
      displayName: Exported at
      description: when the export last succeeded; absent means nobody has
        read the document's text yet
    exportError:
      type: string
      displayName: Export error
      description: "why the last export failed, one line — a 403 cannotExportFile,
        a 400 for a media type the file does not offer; cleared by a later
        success"
---
kind: substrate.reamde.dev/core/function
metadata:
  id: providers.substrate.reamde.dev/google/syncdrive
data:
  authority: providers.substrate.reamde.dev
  package: google
  description: >-
    Sync a Google account's Drive: walk files.list under the account's backfill
    window, or changes.list from the stored start page token, mirror each
    file and its owners' addresses under this package's own kinds, and export
    the text of every Doc, Sheet and Slides deck the walk named.
  runtime: python
  timeout: PT1M
  permissions:
    writes:
      - providers.substrate.reamde.dev/google/drivefile
      - providers.substrate.reamde.dev/google/emailaddress
      - providers.substrate.reamde.dev/google/account
    # The mirror is read for three reasons and never a fourth: to decide
    # which of a page's documents need RE-EXPORTING (a row whose stored
    # `modifiedTime` the file's has not moved past is not fetched again — one
    # read per page, never one per file), to prove a row exists before a change's
    # `removed` retracts it (a delete of something never written is
    # ErrNotFound and would fail the whole delivery), and to sweep what a
    # requested full re-read did not re-stamp.
    reads:
      kinds:
        - providers.substrate.reamde.dev/google/drivefile
      budgets:
        calls: 256
        rows: 10000
    network:
      - "www.googleapis.com"
      # The loopback seam: `config.apiBase` may only ever name a loopback
      # host, and a deployment that wants one has to allow it in the
      # sandbox's egress list too (SUBSTRATE_SANDBOX_EGRESS_ALLOW).
      - "127.0.0.1"
      - "localhost"
  source: |
    """Google Drive sync — one listing page, one changes page, or one export
    batch, per invocation (T-088).

    The account's live access token arrives injected on the bundle config
    (`config.accounts[].token`, host-resolved); this body never sees a client
    secret or a credential ref, and it refuses to send the token anywhere but
    https://www.googleapis.com or loopback (the test seam) — REDIRECTS
    included, which urllib would otherwise follow with the bearer attached.

    WHAT THIS STREAM MIRRORS, and by which call:

      changes.getStartPageToken  the run-start watermark
      files.list                 the cold walk: `trashed = false`, newest
                                 modifiedTime first, under the account's
                                 backfill window, ONE fields mask
      changes.list               the incremental delta, from the stored token
      files.export               the text of a Doc (text/markdown), a Sheet
                                 (text/csv, the first sheet) or a Slides deck
                                 (text/plain), capped at 200 KB

    THE COMPLETENESS CONTRACT. `files.list` and `changes.list` answer under ONE
    fields mask (`FILE_FIELDS`), and for the fields that mask names a File
    payload is AUTHORITATIVE: a declared property the response leaves out is a
    property the file does not have (a folder has no `size`, a Google-native
    document has no `md5Checksum`) and is written NULL. The four export
    properties are the SIBLING CALL's and a listing never touches them; a fuller
    read of the file patches the row without erasing the text a run before it
    fetched.

    ONE NETWORK FETCH PER RECORD PER PAGE. A page of files is one call; the
    export of each Google-native document on it is one more, and never a second
    — the media type is decided from `mimeType` up front, and a document Drive
    refuses to export (403 `cannotExportFile`, 400 for a media type it does not
    offer) is recorded ONCE on `exportError` and not asked again until the file
    changes. A document is re-exported only when its `modifiedTime` has moved
    past the `modifiedTime` the stored row was last written with, which is
    decided from ONE read per page (`fileId in <the page's ids>`), never one
    read per file.

    THE CURSOR IS DRIVE'S OWN. `changes.getStartPageToken` is read at the START
    of a walk, before a single file is listed, and stamped on the account as
    `driveStartPageToken` only when the walk COMPLETES and owes nothing — so a
    file that changes mid-walk falls inside the next delta rather than through
    the gap a completion clock would open. The next run reads `changes.list`
    from it and stamps the `newStartPageToken` its last page hands back. A
    change carrying `removed: true`, or a file the delta reports `trashed`, is
    retracted — after a read proves the row exists, because a delete of a row
    never written is ErrNotFound and would fail the whole delivery. An unspent
    "sync now" (`syncRequestedAt` this stream has not acknowledged) STARTS OVER:
    the cold walk under the stored window, followed by a sweep of what it did
    not re-stamp, because a delta against an intact cursor reports nothing
    changed while every row it accounts for may have been purged.

    THE GRANT PREDATING THE SCOPE IS A STATE, NOT AN OUTAGE. An account
    connected under package version 29 or earlier holds no `drive.readonly`,
    and Google answers the very first call 403 ACCESS_TOKEN_SCOPE_INSUFFICIENT.
    That is `driveSyncState: needsreconsent` — the other three streams sync on,
    this one says what it is owed, and the owner's Reconnect is the whole fix.

    EVERY FIRE IS SELF-LIMITING, exactly as the other three streams: the chain
    watches its own invocation count AND its wall clock from its first page,
    hands back MID-PAGE with the exports it did not fetch parked on
    `driveResume.pending`, says `ok (N pending)` in the word the runner's
    continuation contract reads, and the next fire exports exactly them first.

    Per-account isolation: the per-account drain is try/except; a failure stamps
    THAT account's `driveSyncStatus` "erroring: <reason>" ONCE and leaves both
    `lastSyncedAt` and `driveLastSyncedAt` alone, so the schedule retries and
    the queue moves on. Every effect the drain intends is BUFFERED (`_Batch`)
    and flushed only when the invocation returns normally.
    """
    import datetime as _dt
    import json as _json
    import re
    import urllib.error
    import urllib.parse
    import urllib.request

    AUTHORITY = "providers.substrate.reamde.dev/google"
    ACCOUNT_TYPE = AUTHORITY + "/account"
    ADDRESS_TYPE = AUTHORITY + "/emailaddress"
    FILE_TYPE = AUTHORITY + "/drivefile"

    DRIVE_API = "https://www.googleapis.com"
    DRIVE_HOST = "www.googleapis.com"
    LOOPBACK_HOSTS = ("127.0.0.1", "localhost", "::1", "0.0.0.0")

    # THE FIELDS MASK, pinned in one place and BYTE-IDENTICAL to
    # `tools/rawpull/google.py`'s DRIVE_FILE_FIELDS: the mask is part of the
    # request, so it is part of the recording's name, and every field it names
    # has a declared property on the mirror. What it does not name the kind's
    # description names as not requested.
    FILE_FIELDS = ",".join((
        "id", "name", "mimeType", "description", "starred", "trashed",
        "explicitlyTrashed", "parents", "webViewLink", "webContentLink",
        "iconLink", "thumbnailLink", "createdTime", "modifiedTime",
        "modifiedByMeTime", "viewedByMeTime", "sharedWithMeTime",
        "owners(emailAddress,displayName,permissionId,photoLink,me)",
        "lastModifyingUser(emailAddress,displayName,permissionId,photoLink,me)",
        "shared", "ownedByMe", "viewedByMe", "version", "size", "quotaBytesUsed",
        "md5Checksum", "fileExtension", "fullFileExtension", "originalFilename",
        "headRevisionId", "driveId", "exportLinks"))
    LIST_FIELDS = "nextPageToken,incompleteSearch,files(%s)" % FILE_FIELDS
    CHANGES_FIELDS = ("nextPageToken,newStartPageToken,"
                      "changes(changeType,time,removed,fileId,file(%s))"
                      % FILE_FIELDS)
    LIST_PAGE = 100
    # Which Google-native types are EXPORTED, and as what. A Doc as markdown
    # (Drive has exported Docs to text/markdown since 2024, verified live
    # 2026-09-20: HTTP 200 text/markdown), a Sheet as the first sheet's CSV, a
    # Slides deck as plain text. Everything else — a folder, a shortcut, a form,
    # a PDF, an image, an uploaded Office file — has no export and no `text`.
    # The same table lives in the raw pull, byte for byte.
    EXPORTS = {
        "application/vnd.google-apps.document": "text/markdown",
        "application/vnd.google-apps.spreadsheet": "text/csv",
        "application/vnd.google-apps.presentation": "text/plain",
    }
    # Exports per invocation. Each is one network fetch of up to a few hundred
    # kilobytes against the real API; eight keep an invocation well inside its
    # minute and the chain inside its budget.
    EXPORT_BATCH = 8
    # The cap on `text`, in BYTES of UTF-8. A Drive export may run to 10 MB and a
    # row is not the place for it; 200 KB is a long document's worth of words,
    # and `exportTruncated` says when the cap cut one.
    EXPORT_MAX = 200 * 1024
    SWEEP_PAGE = 200
    MAX_LIST_PAGES = 20  # per-run cold-walk cap; the rest resumes next run
    # THE INVOCATION CAP, and the one that actually binds. The engine's paged
    # drain is bounded by cumulative WALL CLOCK from the chain's first committed
    # page and it refuses a middle page BEFORE committing it, so a chain that
    # keeps asking for one more page is cut off with nothing persisted. A
    # listing page owes an export batch or two and the stamp; twelve leaves the
    # resume state committed well inside the deadline.
    MAX_CALLS = 12
    # AND THE SAME BOUND IN SECONDS, checked at the top of every continuation:
    # the count alone is not a bound at all when eight exports against the real
    # API can each take a second. 45 s leaves room for the slowest export batch
    # plus the stamp inside the engine's 2 minutes; `config.drainBudgetMs`
    # overrides it.
    DRAIN_SECONDS = 45
    # Reserved before a LIST call: the export batch the page it is about to
    # fetch will need, plus the one that stamps. A page listed with no budget to
    # export it is a page whose documents the next run would have to re-decide.
    CALL_RESERVE = 3
    # How many row ids one cold walk may carry on its cursor before the sweep
    # gives up on telling a stale row from a live one (README, ask 1).
    SEEN_MAX = 20000
    # How many parked exports a hand-back expects to hold. A page is 100 files
    # and rarely more than a few dozen documents; past this the set is still
    # parked and the run says so.
    PENDING_HOLD_MAX = 1000
    REASON_MAX = 200
    BACKFILL_DAYS = {"none": 0, "last30d": 30, "last90d": 90, "last1y": 365}
    # The RFC 5322 dot-atom production, the same one the other three streams use
    # and for the same reason: `emailaddress.address` is an `email`-kind property
    # and the engine validates it with Go's net/mail.ParseAddress at effect
    # APPLY, where this body's try/except cannot see the failure.
    _ATEXT = r"[A-Za-z0-9!#$%&'*+/=?^_`{|}~-]+"
    _LABEL = r"[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?"
    _RE_ADDR = re.compile(
        r"^" + _ATEXT + r"(?:\." + _ATEXT + r")*@"
        + _LABEL + r"(?:\." + _LABEL + r")+$")
    # A `url` property is `url.Parse` plus `IsAbs()`: any URI with a scheme and
    # no whitespace. A value that would be refused at effect apply is left
    # absent and NAMED rather than written, because writing it rolls the page's
    # transaction back and parks the drain on every retry.
    _RE_URI = re.compile(r"^[A-Za-z][A-Za-z0-9+.\-]*:[^\s<>\"\\]+$")
    # The File fields copied under Google's own name, grouped by what the
    # dialect makes of them. `id` is not among them (the provider key rides as
    # `fileId`), and neither are the fields that need RESOLVING rather than
    # copying: `createdTime` (the trait's `at`), `parents`, `owners`,
    # `lastModifyingUser`, `exportLinks`.
    _STRINGS = ("name", "mimeType", "description", "version", "headRevisionId",
                "driveId", "md5Checksum", "fileExtension", "fullFileExtension",
                "originalFilename")
    _BOOLS = ("starred", "trashed", "explicitlyTrashed", "shared", "ownedByMe",
              "viewedByMe")
    _URLS = ("webViewLink", "webContentLink", "iconLink", "thumbnailLink")
    # Byte counts Drive sends as decimal STRINGS (int64 in JSON) and this mirror
    # stores as the integers they are.
    _COUNTS = ("size", "quotaBytesUsed")
    _TIMES = ("modifiedTime", "modifiedByMeTime", "viewedByMeTime",
              "sharedWithMeTime")


    class _NoRedirect(urllib.request.HTTPRedirectHandler):
        """A redirect is a request to send the bearer somewhere else. urllib
        re-sends the Authorization header across one, so refuse instead: a
        None new-request turns the 30x into an ordinary HTTPError."""

        def redirect_request(self, req, fp, code, msg, headers, newurl):
            return None


    # An EMPTY ProxyHandler, explicitly: the default opener honours
    # http_proxy/https_proxy from the runner's environment, which would route
    # the bearer through whatever that variable names and defeat the origin
    # pin below.
    _OPENER = urllib.request.build_opener(
        _NoRedirect, urllib.request.ProxyHandler({}))


    class _Batch:
        """Every effect this invocation intends, held until it RETURNS.

        `host.effects` has no rollback and validation happens later still, so a
        body that staged ten puts and then raised hands the engine those ten
        beside its own "erroring" stamp. Buffering here makes the invocation's
        effects atomic with its own control flow, which is the only rollback
        this side of the wire.
        """

        def __init__(self):
            self.ops = []

        def put(self, kind, rid, properties):
            self.ops.append(("put", kind, rid, properties))

        def patch(self, kind, rid, properties):
            self.ops.append(("patch", kind, rid, properties))

        def delete(self, kind, rid):
            self.ops.append(("delete", kind, rid, None))

        def flush(self, host):
            for op, kind, rid, props in self.ops:
                if op == "put":
                    host.effects.put(kind, rid, properties=props)
                elif op == "patch":
                    host.effects.patch(kind, rid, properties=props)
                else:
                    host.effects.delete(kind, rid)
            self.ops = []


    class _NeedsReconsent(Exception):
        """The grant predates `drive.readonly`: a state, not an outage."""


    def _api_base(cfg):
        """The configured API base, or Google's own host.

        LOOPBACK ONLY. The config row is owner-writable, so an arbitrary base
        would let an edit redirect the account's access token at a stranger;
        a base that is not loopback is refused BY NAME rather than silently
        ignored, because quietly calling Google when the operator asked for a
        recorded fake is how a seed run ends up reading live files.
        """
        props = ((cfg.get("inputs") or {}).get("client") or {}).get("properties") or {}
        base = str(props.get("apiBase") or "").strip().rstrip("/")
        if not base:
            return DRIVE_API
        host = (urllib.parse.urlsplit(base).hostname or "").lower()
        if host not in LOOPBACK_HOSTS:
            raise RuntimeError(
                "google-drive: config.apiBase names %s — only a loopback host "
                "may stand in for %s" % (host or "?", DRIVE_HOST))
        return base


    def _pinned(url, base):
        """Is this URL the base this body is allowed to call?

        Two admissions, and no third. The CONFIGURED BASE, whatever it is —
        Google's own origin, a loopback fake named on the config row, or a
        closure whose constant an e2e rewired before it was installed. And
        DRIVE_HOST over https, always, so a body whose base was cleared still
        cannot be pointed anywhere else.
        """
        u = urllib.parse.urlsplit(url)
        b = urllib.parse.urlsplit(base or "")
        host = (u.hostname or "").lower()
        if host and host == (b.hostname or "").lower() and u.scheme == b.scheme:
            return True
        return u.scheme == "https" and host == DRIVE_HOST


    def _url(base, path, params):
        url = base + path
        if params:
            url = url + "?" + urllib.parse.urlencode(params, doseq=True)
        if not _pinned(url, base):
            parts = urllib.parse.urlsplit(url)
            raise RuntimeError(
                "google-drive: refusing to send credentials to %s://%s — only "
                "https://%s or the configured loopback base"
                % (parts.scheme, parts.hostname or "?", DRIVE_HOST))
        return url


    def _get(base, token, path, params=None):
        # Origin pinning: the engine's `network` capability is declared but NOT
        # enforced host by host, so this refusal is the defense. It raises
        # inside the per-account try/except, so a tampered base stamps THAT
        # account erroring rather than parking the whole delivery.
        req = urllib.request.Request(_url(base, path, params), headers={
            "Authorization": "Bearer " + token, "Accept": "application/json"})
        with _OPENER.open(req, timeout=20) as resp:
            return _json.loads(resp.read().decode("utf-8"))


    def _get_bytes(base, token, path, params=None):
        """One export: the body as BYTES and the media type Google named. The
        same pin, a longer timeout — a long document is hundreds of kilobytes —
        and no JSON expectation, because none is coming."""
        req = urllib.request.Request(_url(base, path, params), headers={
            "Authorization": "Bearer " + token})
        with _OPENER.open(req, timeout=60) as resp:
            return resp.read(), str(resp.headers.get("Content-Type") or "")


    def _status(e):
        return getattr(e, "code", None)


    def _detail(e):
        """The error document Google returned, as a dict — `{}` when it did not
        return one. The body of an HTTPError reads ONCE."""
        try:
            body = e.read()
        except Exception:
            return {}
        try:
            doc = _json.loads((body or b"").decode("utf-8", "replace"))
        except (ValueError, AttributeError):
            return {}
        return doc.get("error") if isinstance(doc.get("error"), dict) else {}


    def _scope_refused(err):
        """Is this 403 Google saying the grant lacks the scope?

        `ACCESS_TOKEN_SCOPE_INSUFFICIENT` / `insufficientPermissions` / a
        message naming the scope: the account connected under an older package
        version. Anything else that 403s is the stream being unavailable to
        this grant for another reason and is an ordinary failure.
        """
        text = (str(err.get("message") or "") + " " + _json.dumps(
            err.get("details") or err.get("errors") or [])).lower()
        return ("scope" in text or "insufficientpermissions" in text
                or "acl_insufficient" in text)


    def _reason(e):
        """The failure in one line, and its CLASS first — the same words the
        other three streams use, because the status is what the console shows
        and what the e2e asserts on."""
        code = _status(e)
        if isinstance(e, _NeedsReconsent):
            return ("needs reconsent: this grant predates drive.readonly — "
                    "reconnect the account to add the Drive scope")
        if code == 401:
            return ("reconnect needed: Google refused the grant (401) — the "
                    "token was revoked or expired beyond refresh")
        if code == 403:
            return ("stream not available: Google refused the call (403) — is "
                    "drive.readonly granted? a reconnect may be needed")
        if code == 429:
            return "rate limited by Google (429) — the retry is scheduled"
        if code is not None:
            return "google returned HTTP %d" % code
        return str(e) or type(e).__name__


    def _address_id(host, aid, addr):
        return host.ids.external("google-address", aid, addr)


    def _file_id(host, aid, fid):
        return host.ids.external("gdrive-file", aid, fid)


    def _now():
        return _dt.datetime.now(_dt.timezone.utc).replace(microsecond=0)


    def _iso(ts):
        """An instant as RFC 3339 UTC, KEEPING whatever precision it carries."""
        stamp = ts if ts.tzinfo is not None else ts.replace(tzinfo=_dt.timezone.utc)
        return stamp.astimezone(_dt.timezone.utc).isoformat().replace("+00:00", "Z")


    def _parse(ts):
        try:
            return _dt.datetime.fromisoformat(str(ts).replace("Z", "+00:00"))
        except (TypeError, ValueError):
            return None


    def _time(value, notes, where):
        """One Drive RFC 3339 instant (millisecond precision), at the precision
        Google sent it; None — visibly — when it does not parse."""
        stamp = _parse(value)
        if stamp is None:
            notes.add("%s is not an instant (%s)" % (where, str(value)[:40]))
            return None
        return _iso(stamp)


    def _mailbox(raw):
        """The bundle's mailbox NORMAL FORM, or "" when it does not parse.

        Trim, lowercase the DOMAIN (DNS is case-insensitive), leave the LOCAL
        PART exactly as the API spelled it: RFC 5321 §2.4 reserves the local
        part's case for the receiving host. These are the same three lines as
        the other three streams', verbatim — the `emailaddress` hub only
        converges while all four agree.
        """
        text = str(raw or "").strip()
        if "@" not in text:
            return ""
        local, _, domain = text.rpartition("@")
        normal = local + "@" + domain.lower()
        return normal if _RE_ADDR.match(normal) else ""


    def _refid(value):
        """A stored reference, as the bare row id. The engine hands one back
        either as `{"ref": id}` or as `<kind>/<id>`."""
        ref = value.get("ref") if isinstance(value, dict) else value
        return str(ref or "").rsplit("/", 1)[-1]


    def _wants(acct):
        # The owner's PAUSE holds the scheduled path too (the `sync` trait's
        # `syncPaused`, decision 0085). A pause is not a disabled stream: every
        # toggle and every cursor is exactly where it was when it lifts.
        props = acct.get("properties") or {}
        return bool(props.get("enabledDrive")) and not props.get("syncPaused")


    def _requested(props):
        """An unspent "sync now" for THIS stream: `syncRequestedAt` is a
        GENERATION and `driveSyncRequestedAck` is what this stream last spent;
        while they disagree the request is outstanding. It OVERRIDES the
        cadence, and it is the only thing that can drive a re-seeded account at
        all — a purge leaves the account row and its `driveLastSyncedAt`
        standing."""
        requested = str(props.get("syncRequestedAt") or "")
        return bool(requested) and \
            str(props.get("driveSyncRequestedAck") or "") != requested


    def _retry_after(e):
        """A 429's `Retry-After`, as the instant the account may be called again.
        Seconds or an HTTP date; anything unreadable falls back to a minute."""
        if getattr(e, "code", None) != 429:
            return ""
        raw = ""
        try:
            raw = str((getattr(e, "headers", None) or {}).get("Retry-After") or "")
        except Exception:
            raw = ""
        seconds = 60
        raw = raw.strip()
        if raw.isdigit():
            seconds = max(1, min(int(raw), 3600))
        elif raw:
            try:
                import email.utils as _eu
                when = _eu.parsedate_to_datetime(raw)
                if when is not None:
                    if when.tzinfo is None:
                        when = when.replace(tzinfo=_dt.timezone.utc)
                    seconds = max(1, int((when - _now()).total_seconds()))
            except Exception:
                seconds = 60
        return _iso(_now() + _dt.timedelta(seconds=seconds))


    def _due(props):
        freq = (props.get("syncFrequency") or "daily").lower()
        # A 429 SAYS WHEN. Until that instant nothing about this account is due —
        # not the cadence, and not a "sync now" either.
        wall = _parse(props.get("retryNotBefore"))
        if wall is not None and _now() < wall:
            return False
        if _requested(props):
            return True
        if freq == "off":
            return False
        last = _parse(props.get("driveLastSyncedAt"))
        if last is None:
            return True
        hours = 1 if freq == "hourly" else 24
        return _dt.datetime.now(_dt.timezone.utc) - last >= _dt.timedelta(hours=hours)


    def _floor(props, anchor):
        # The window floor comes off the stream's stored backfill ANCHOR — the
        # first run's start instant — never off a clock read per run, so the
        # reach cannot creep forward every night. `none` means from-connect-
        # forward (the anchor itself); `all` reaches the epoch.
        depth = str(props.get("backfillDepth") or "last30d").lower()
        if depth == "all":
            return ""
        base = _parse(anchor) or _now()
        return _iso(base - _dt.timedelta(days=BACKFILL_DAYS.get(depth, 30)))


    def _query(floor):
        """The `q` the cold walk sends. `trashed = false` always: the mirror is
        of the live Drive, and a file that goes to the trash later arrives as a
        change. The floor is over `modifiedTime`, the window `backfillDepth`
        names."""
        q = "trashed = false"
        ts = _parse(floor) if floor else None
        if ts is not None:
            q += " and modifiedTime > '%s'" % _iso(ts)
        return q


    def _list_params(cur):
        return {"pageSize": LIST_PAGE, "q": _query(cur.get("floor") or ""),
                "orderBy": "modifiedTime desc", "fields": LIST_FIELDS}


    def _uri(value, notes, where):
        text = str(value or "").strip()
        if not text:
            return None
        if not _RE_URI.match(text):
            notes.add("%s is not an absolute URI (%s)" % (where, text[:40]))
            return None
        return text


    def _count(value, notes, where):
        """A byte count Drive sends as a decimal STRING, as the int it is."""
        if isinstance(value, bool):
            notes.add("%s is a boolean" % where)
            return None
        if isinstance(value, int):
            return value
        text = str(value or "").strip()
        if text.isdigit():
            return int(text)
        notes.add("%s is not a count (%s)" % (where, text[:40]))
        return None


    class _Notes(set):
        """The run's unmirrored values, WRITING THROUGH TO THE CURSOR so the
        status line stamped several invocations later still names them."""

        def __init__(self, cur):
            set.__init__(self, cur.get("unknown") or ())
            self._cur = cur

        def add(self, value):
            set.add(self, value)
            self._cur["unknown"] = sorted(self)[:24]


    # --------------------------------------------------------------------------
    # copying a File: the mask is authoritative for what it names
    # --------------------------------------------------------------------------

    def _user(host, aid, raw, notes, where):
        """One Drive `User` — an owner, the last modifier — as the OCCURRENCE
        OBJECT the kind declares: the API's own fields, typed, with the identity
        a reference FIELD at the `emailaddress` hub inside. Returns (the normal
        address or "", the object or None). A user whose address does not parse
        still becomes an entry — the name and the self-flag are real — it just
        carries no `emailAddress` and no pointer."""
        if not isinstance(raw, dict):
            return "", None
        out = {}
        source = str(raw.get("emailAddress") or "").strip()
        addr = _mailbox(source)
        if addr:
            out["emailAddress"] = source
            out["address"] = {"ref": _address_id(host, aid, addr)}
        elif source:
            notes.add("%s.emailAddress does not parse" % where)
        if "displayName" in raw and raw["displayName"] is not None:
            out["displayName"] = str(raw["displayName"])
        if "permissionId" in raw and raw["permissionId"] is not None:
            out["permissionId"] = str(raw["permissionId"])
        if "photoLink" in raw:
            link = _uri(raw["photoLink"], notes, where + ".photoLink")
            if link:
                out["photoLink"] = link
        if isinstance(raw.get("me"), bool):
            out["me"] = raw["me"]
        return addr, (out or None)


    def _file_props(host, aid, item, notes):
        """One File payload as the row it becomes: every masked field, PRESENT
        OR NULL. The listing is authoritative for the fields the mask names, so
        an absent one is a null — a folder has no size, a Doc has no checksum.
        The export properties are not here: they are the sibling call's.

        Returns (props, the hub addresses the row names)."""
        fid = str(item.get("id") or "")
        props = {"account": aid, "fileId": fid}
        addresses = []
        for name in _STRINGS:
            value = item.get(name)
            props[name] = str(value) if value is not None else None
        for name in _BOOLS:
            value = item.get(name)
            props[name] = value if isinstance(value, bool) else None
        for name in _URLS:
            props[name] = _uri(item.get(name), notes, name) \
                if item.get(name) is not None else None
        for name in _COUNTS:
            props[name] = _count(item[name], notes, name) \
                if name in item and item[name] is not None else None
        for name in _TIMES:
            props[name] = _time(item[name], notes, name) \
                if item.get(name) is not None else None
        # The trait's instant, a LOSSLESS DECODE of `createdTime`, which is not
        # redeclared beside it (docs/kind-design.md §4).
        props["at"] = _time(item["createdTime"], notes, "createdTime") \
            if item.get("createdTime") else None
        # A parent folder is a Drive File too, so a reference at this kind — no
        # mustExist, because a parent outside the walk's window is a real
        # parent whose row this walk did not write.
        parents = item.get("parents")
        if isinstance(parents, list):
            held, out = set(), []
            for pid in parents:
                if isinstance(pid, str) and pid and pid not in held:
                    held.add(pid)
                    out.append({"ref": FILE_TYPE + "/" + _file_id(host, aid, pid)})
            props["parents"] = out
        else:
            props["parents"] = None
        owners = item.get("owners")
        if isinstance(owners, list):
            out = []
            for index, raw in enumerate(owners):
                addr, one = _user(host, aid, raw, notes, "owners[%d]" % index)
                if addr:
                    addresses.append(addr)
                if one:
                    out.append(one)
            props["owners"] = out
        else:
            props["owners"] = None
        if isinstance(item.get("lastModifyingUser"), dict):
            addr, one = _user(host, aid, item["lastModifyingUser"], notes,
                              "lastModifyingUser")
            if addr:
                addresses.append(addr)
            props["lastModifyingUser"] = one
        else:
            props["lastModifyingUser"] = None
        links = item.get("exportLinks")
        if isinstance(links, dict):
            props["exportLinks"] = {str(k): str(v) for k, v in links.items()
                                    if k and isinstance(v, str)}
        else:
            props["exportLinks"] = None
        return props, addresses


    def _ack(props, stamp, stream):
        """Echo the request generation THIS run acted on, on EVERY path — the
        erroring one included, because an unacknowledged request re-fires the
        on-request trigger against the same work forever."""
        requested = str(props.get("syncRequestedAt") or "")
        if requested and str(props.get(stream + "SyncRequestedAck") or "") != requested:
            stamp[stream + "SyncRequestedAck"] = requested
        return stamp


    # --------------------------------------------------------------------------
    # the core `sync` trait (substrate decision 0085)
    # --------------------------------------------------------------------------
    # THE SAME HELPERS LIVE IN ALL FOUR STREAM BODIES, verbatim. A function is a
    # closure with no shared module to import, and the account they patch is one
    # row: a copy that drifted would be two streams disagreeing about what the
    # account's state means.
    _TRAIT_STREAMS = ("contacts", "gmail", "calendar", "drive")


    def _trait_streams(props):
        """The account's `syncStreams` map, however the engine hands it back."""
        raw = props.get("syncStreams") or {}
        if isinstance(raw, str):
            try:
                raw = _json.loads(raw)
            except ValueError:
                raw = {}
        return dict(raw) if isinstance(raw, dict) else {}


    def _trait_broken(props, streams, name):
        entry = streams.get(name) or {}
        if str(entry.get("state") or "") in ("erroring", "throttled"):
            return True
        return str(props.get(name + "SyncStatus") or "").startswith("erroring")


    def _trait_answered(props, streams, name, requested):
        entry = streams.get(name) or {}
        return (str(entry.get("requestedAck") or "") == requested
                or str(props.get(name + "SyncRequestedAck") or "") == requested)


    def _trait_stamp(props, stream, state, message, now, completed=False,
                     progress=None, started="", elapsed_ms=None):
        """The trait's half of one account patch — this stream's entry
        unconditionally, the account-level state RAISED and never cleared over
        another enabled stream's live failure, the owner's request acknowledged
        at the account level only once EVERY enabled stream has answered it."""
        streams = _trait_streams(props)
        entry = dict(streams.get(stream) or {})
        entry["state"] = state
        entry["message"] = str(message)[:400]
        if completed:
            entry["lastAt"] = now
        if progress is not None:
            entry["pending"] = int(progress.get("pending") or 0)
        requested = str(props.get("syncRequestedAt") or "")
        if requested:
            entry["requestedAck"] = requested
        streams[stream] = entry
        out = {"syncStreams": streams}
        others = [s for s in _TRAIT_STREAMS if s != stream
                  and props.get("enabled" + s.capitalize())]
        owed_elsewhere = any(int((streams.get(s) or {}).get("pending") or 0) > 0
                             for s in others)
        if progress is not None and (int(progress.get("pending") or 0) > 0
                                     or state in ("erroring", "throttled")
                                     or not owed_elsewhere):
            out["syncProgress"] = progress
        if started:
            out["lastSyncStartedAt"] = started
        if elapsed_ms is not None:
            out["lastSyncDurationMs"] = max(0, int(elapsed_ms))
        if state in ("erroring", "throttled"):
            out["syncState"] = state
            out["syncMessage"] = str(message)[:400]
            out["syncError"] = str(message)[:400]
            out["syncErrorAt"] = now
        elif not any(_trait_broken(props, streams, s) for s in others):
            out["syncState"] = state
            out["syncMessage"] = str(message)[:400]
        if requested and all(_trait_answered(props, streams, s, requested)
                             for s in others):
            out["syncRequestedAck"] = requested
        return out


    def _trait_progress(phase, done, pending):
        done, pending = max(0, int(done or 0)), max(0, int(pending or 0))
        return {"phase": phase, "done": done, "total": done + pending,
                "pending": pending}


    def _clock():
        """A SUB-SECOND wall clock, for the budget and the duration only."""
        return _dt.datetime.now(_dt.timezone.utc).timestamp()


    def _trait_begin(cur):
        if not cur.get("traitStartTs"):
            cur["traitStartedAt"] = _iso(_now())
            cur["traitStartTs"] = _clock()
        return cur


    def _trait_run(cur):
        if not cur.get("scheduled") or not cur.get("traitStartedAt"):
            return "", None
        began = float(cur.get("traitStartTs") or 0)
        if not began:
            return str(cur["traitStartedAt"]), None
        return str(cur["traitStartedAt"]), int((_clock() - began) * 1000)


    def _carry_trait(cur, nxt):
        """A rebuilt cursor keeps WHICH PATH drove the run, THE CHAIN'S OWN
        CLOCK and the budget it is measured against — never restarting the
        clock at the next account, which is how a chain walks through the
        engine's deadline and parks."""
        if cur.get("scheduled"):
            nxt["scheduled"] = True
        if cur.get("startedAt"):
            nxt["startedAt"] = cur["startedAt"]
        if cur.get("drainBudgetMs"):
            nxt["drainBudgetMs"] = cur["drainBudgetMs"]
        return nxt


    def _chain_begin(cur):
        if not cur.get("startedAt"):
            cur["startedAt"] = _clock()
        return cur


    def _drain_budget(cfg, cur):
        """`config.drainBudgetMs` over the built-in DRAIN_SECONDS, clamped — the
        same test-and-operations seam `config.apiBase` is."""
        props = ((cfg.get("inputs") or {}).get("client") or {}).get("properties") or {}
        try:
            want = int(props.get("drainBudgetMs") or 0)
        except (TypeError, ValueError):
            want = 0
        if want > 0:
            cur["drainBudgetMs"] = max(1, min(want, 110000))
        return cur


    def _drain_seconds(cur):
        try:
            held = int(cur.get("drainBudgetMs") or 0)
        except (TypeError, ValueError):
            held = 0
        return (held / 1000.0) if held > 0 else float(DRAIN_SECONDS)


    def _out_of_time(cur):
        began = float(cur.get("startedAt") or 0)
        return bool(began) and (_clock() - began) >= _drain_seconds(cur)


    def _erroring(batch, acct, reason, retry_at="", reconsent=False):
        """ONE bounded stamp per episode, on THIS STREAM's own status, the
        rollup raised only when not already erroring. NEITHER lastSyncedAt NOR
        driveLastSyncedAt is written — the run did not complete."""
        props = acct.get("properties") or {}
        status = "erroring: " + str(reason)[:REASON_MAX]
        now = _iso(_now())
        state = "throttled" if retry_at else "erroring"
        stamp = _ack(props, {}, "drive")
        if retry_at:
            stamp["retryNotBefore"] = retry_at
        if str(props.get("driveSyncStatus") or "") == status:
            if stamp:
                stamp.update(_trait_stamp(props, "drive", state, status, now))
                batch.patch((acct.get("kind") or ACCOUNT_TYPE), acct.get("id"),
                            properties=stamp)
            return
        stamp["driveSyncStatus"] = status
        # OUR enum says the finer thing: a grant predating the scope is a
        # missing consent, and the console can offer the Reconnect for it.
        stamp["driveSyncState"] = "needsreconsent" if reconsent else "erroring"
        if not str(props.get("syncStatus") or "").startswith("erroring"):
            stamp["syncStatus"] = status
        stamp.update(_trait_stamp(props, "drive", state, status, now))
        batch.patch((acct.get("kind") or ACCOUNT_TYPE), acct.get("id"),
                    properties=stamp)


    # --------------------------------------------------------------------------
    # the drain
    # --------------------------------------------------------------------------

    def _fresh(queue, calls=0):
        return {"phase": "plan", "queue": queue, "startToken": "", "newToken": "",
                "changesToken": "", "floor": "", "anchor": "", "pageToken": "",
                "pages": 0, "pending": [], "back": "backfill", "after": "",
                "sweep": False, "resume": {}, "records": 0, "exports": 0,
                "failed": 0, "retracted": 0, "calls": calls, "seen": [],
                "seenOverflow": False, "unknown": []}


    def _spent(cur, reserve=0):
        # Both counters ride across accounts: the engine's drain deadline is
        # CUMULATIVE over the whole chain. Whichever bound is reached first
        # stops it.
        return int(cur.get("calls") or 0) + reserve >= MAX_CALLS or _out_of_time(cur)


    def _resume(**fields):
        """The resume object with every EMPTY value dropped: `driveResume` is a
        DECLARED object and its `floor` is a `datetime`, so `floor: ""` would
        have the engine refuse the whole patch (T-003, the same lesson)."""
        return {k: v for k, v in fields.items() if v not in ("", None, [], {})}


    def _snapshot(cur):
        seen = list(cur.get("seen") or ())
        if cur.get("seenOverflow") or len(seen) > SEEN_MAX:
            return [], True
        return seen, False


    def _hold(host, aid, cur, next_page):
        """Persist the unfinished cold walk — the page token, its window, its
        watermark, whether a sweep is still owed and the rows re-stamped so far
        — and stop walking for this run. The sweep is cleared LOCALLY: a
        truncated walk has not re-stamped the rows it never reached."""
        host.log("google-drive: cold walk truncated for %s — resuming next run" % aid)
        seen, overflow = _snapshot(cur)
        cur["resume"] = _resume(pageToken=next_page,
                                floor=cur.get("floor") or "",
                                startPageToken=cur.get("startToken") or "",
                                sweep=bool(cur.get("sweep")),
                                seen=seen, seenOverflow=overflow,
                                records=int(cur.get("records") or 0))
        cur["pageToken"] = ""
        cur["sweep"] = False
        cur["back"] = "finish"


    def _hold_pending(host, aid, cur):
        """Stop between two export batches and persist the exports the page
        listed and the walk did not fetch: no token can re-derive them, so they
        ride on the resume beside the page token and the next run exports
        exactly them before anything else."""
        held = dict(cur.get("resume") or {})
        pending = [str(m) for m in (cur.get("pending") or []) if m]
        seen, overflow = _snapshot(cur)
        if len(pending) > PENDING_HOLD_MAX:
            host.log("google-drive: %s parks %d unfetched export(s) at the "
                     "hand-back, well past the %d a page should hold"
                     % (aid, len(pending), PENDING_HOLD_MAX))
        held.update(_resume(
            pending=pending,
            back=str(cur.get("back") or "finish"),
            pageToken=held.get("pageToken") or cur.get("pageToken") or "",
            changesToken=held.get("changesToken") or cur.get("changesToken") or "",
            floor=cur.get("floor") or held.get("floor") or "",
            startPageToken=(cur.get("newToken") or cur.get("startToken")
                            or held.get("startPageToken") or ""),
            sweep=bool(cur.get("sweep")) or bool(held.get("sweep")),
            seen=seen, seenOverflow=overflow,
            records=int(cur.get("records") or 0)))
        host.log("google-drive: the drain's budget is spent inside %s with %d "
                 "export(s) listed and not fetched — they ride on the account "
                 "and the next run fetches them first" % (aid, len(pending)))
        cur["resume"] = held
        cur["pending"] = []
        cur["pageToken"] = ""
        cur["changesToken"] = ""
        cur["sweep"] = False
        cur["back"] = "finish"


    def _hold_changes(host, aid, cur, next_page):
        """Persist the unfinished delta: its page token AND the start token it
        belongs to. The WATERMARK does not advance — `_stamp` withholds it while
        a continuation is owed."""
        host.log("google-drive: changes delta truncated for %s — the token "
                 "stands and the next run resumes at the stored page" % aid)
        cur["resume"] = _resume(changesToken=next_page,
                                startPageToken=cur.get("startToken") or "",
                                records=int(cur.get("records") or 0))
        cur["changesToken"] = ""
        cur["back"] = "finish"


    def _owe_sweep(batch, acct, aid, cur):
        """Record the sweep this run still owes, and its evidence, on the
        account — BEFORE the first delete."""
        seen, overflow = _snapshot(cur)
        cur["resume"] = _resume(sweep=True, floor=cur.get("floor") or "",
                                startPageToken=cur.get("startToken") or "",
                                seen=seen, seenOverflow=overflow,
                                records=int(cur.get("records") or 0))
        batch.patch((acct.get("kind") or ACCOUNT_TYPE), aid,
                    properties={"driveResume": cur["resume"],
                                "driveSyncStatus": "ok (reconciling)"})


    def _rows_by_file_id(host, aid, fids):
        """The stored rows for a page's file ids — ONE read per 200 ids, never
        one per file. What decides re-exports and proves a row exists before a
        retraction."""
        out = {}
        fids = sorted({str(f) for f in fids if f})
        for start in range(0, len(fids), SWEEP_PAGE):
            chunk = fids[start:start + SWEEP_PAGE]
            page = host.records.list(
                FILE_TYPE, where={"account": {"eq": aid}, "fileId": {"in": chunk}},
                first=len(chunk))
            for ent in page.get("records") or []:
                props = ent.get("properties") or {}
                fid = str(props.get("fileId") or "")
                if fid:
                    out[fid] = dict(props, __id=str(ent.get("id") or ""))
        return out


    def _needs_export(item, stored):
        """Does this document's text need (re-)fetching?

        Never fetched (no `exportedAt` and no `exportError` on the stored row),
        or the file's `modifiedTime` has moved past the `modifiedTime` the row
        was last written with — Google's clock against Google's clock, never
        against our `exportedAt`, which is a different clock and would read a
        document edited between the listing and its export as already current.
        A permanent refusal is therefore asked once and then only when the file
        changes, and an unchanged document is never fetched twice.
        """
        if stored is None:
            return True
        if not stored.get("exportedAt") and not stored.get("exportError"):
            return True
        modified = _parse(item.get("modifiedTime"))
        was = _parse(stored.get("modifiedTime"))
        return modified is not None and (was is None or modified > was)


    def _stage_files(host, batch, aid, items, cur, notes):
        """One page of Files — from a listing or from the delta — as rows.

        THE WRITE ORDER: the hub rows for every owner and modifier address
        first, then the files, so every pointer inside a row resolves when the
        row applies. The export decision for the page is made against ONE read
        of the stored rows; the ids that need one are queued as
        `<fileId> <exportMediaType>` for the export phase.
        """
        live = [i for i in items if isinstance(i, dict) and i.get("id")]
        stored = _rows_by_file_id(host, aid, [i["id"] for i in live]) if live else {}
        seen = set(cur.get("seen") or ())
        pending = list(cur.get("pending") or [])
        addresses = {}
        staged = []
        for item in live:
            props, addrs = _file_props(host, aid, item, notes)
            for addr in addrs:
                addresses[addr] = True
            staged.append((str(item["id"]), props))
            export_as = EXPORTS.get(str(item.get("mimeType") or ""))
            if export_as and _needs_export(item, stored.get(str(item["id"]))):
                key = "%s %s" % (item["id"], export_as)
                if key not in pending:
                    pending.append(key)
        for addr in sorted(addresses):
            # The hub row carries the address and nothing else.
            batch.put(ADDRESS_TYPE, _address_id(host, aid, addr),
                      properties={"account": aid, "address": addr})
        for fid, props in staged:
            rid = _file_id(host, aid, fid)
            seen.add(rid)
            batch.put(FILE_TYPE, rid, properties=props)
        if len(seen) <= SEEN_MAX:
            cur["seen"] = sorted(seen)
        else:
            cur["seen"] = []
            cur["seenOverflow"] = True
        cur["pending"] = pending
        cur["records"] = int(cur.get("records") or 0) + len(staged)
        return len(staged)


    def _retract(host, batch, aid, fids, cur):
        """Retract the files a delta says are gone — ONCE each, and only rows
        that are there. A delete of a row that does not exist fails the WHOLE
        delivery, and a delta legitimately names files this account never
        mirrored (removed before the first walk, or outside its window)."""
        fids = sorted({str(f) for f in fids if f})
        if not fids:
            return 0
        stored = _rows_by_file_id(host, aid, fids)
        seen = set(cur.get("seen") or ())
        dropped = 0
        for fid in fids:
            row = stored.get(fid)
            if not row:
                continue
            rid = str(row.get("__id") or _file_id(host, aid, fid))
            host.log("google-drive: %s retracts %s (fileId %s) — the delta says "
                     "it was removed or trashed" % (aid, rid, fid))
            batch.delete(FILE_TYPE, rid)
            seen.discard(rid)
            dropped += 1
        if dropped:
            cur["seen"] = sorted(seen) if len(seen) <= SEEN_MAX else []
            cur["retracted"] = int(cur.get("retracted") or 0) + dropped
        return dropped


    def _plan_account(host, aid, props, base, token, cur):
        # THE WATERMARK, one call: the start page token, read before a single
        # file is, stamped only on completion. It is also the SCOPE PROBE — the
        # first Drive call an account connected under an older package version
        # makes answers 403 ACCESS_TOKEN_SCOPE_INSUFFICIENT, and that is a
        # state (`needsreconsent`), not an outage.
        try:
            start = _get(base, token, "/drive/v3/changes/startPageToken")
        except urllib.error.HTTPError as e:
            if _status(e) == 403 and _scope_refused(_detail(e)):
                raise _NeedsReconsent()
            raise
        cur["startToken"] = str(start.get("startPageToken") or "")
        anchor = str(props.get("driveBackfillAnchorAt") or "")
        if not anchor:
            anchor = _iso(_now())
            cur["anchor"] = anchor
        held = props.get("driveResume") or {}
        if isinstance(held, str):
            try:
                held = _json.loads(held)
            except ValueError:
                held = {}
        if not isinstance(held, dict):
            held = {}
        common = {"floor": held.get("floor") or "",
                  "sweep": bool(held.get("sweep")),
                  "seen": [str(x) for x in (held.get("seen") or []) if x],
                  "seenOverflow": bool(held.get("seenOverflow")),
                  "records": int(held.get("records") or 0),
                  "startToken": (str(held.get("startPageToken") or "")
                                 or cur["startToken"])}
        if held.get("pending"):
            # An earlier fire stopped between two export batches: fetch exactly
            # what it listed and never reached, then carry on where it was.
            cur.update(dict(common, phase="export",
                            pending=[str(m) for m in held["pending"] if m],
                            back=str(held.get("back") or "finish"),
                            pageToken=held.get("pageToken") or "",
                            changesToken=held.get("changesToken") or ""))
            return cur
        if held.get("pageToken"):
            # Resume ITS walk, under ITS window and ITS watermark: a cold walk is
            # newest-first, so a file modified after the walk began sits BEHIND
            # the page token, and only the original start token lets the next
            # delta pick it up.
            cur.update(dict(common, phase="backfill",
                            pageToken=held["pageToken"]))
            return cur
        if held.get("changesToken"):
            cur.update(dict(common, phase="changes",
                            changesToken=str(held["changesToken"])))
            return cur
        if held.get("sweep"):
            # A walk that completed and lost its chain to the deadline part-way
            # through reconciling: resume INTO the sweep under its evidence.
            cur.update(dict(common, phase="sweep", after="", resume=dict(held)))
            return cur
        stored = str(props.get("driveStartPageToken") or "")
        # AN UNSPENT REQUEST STARTS OVER, for the reason the gmail stream does:
        # a delta against an intact cursor reports nothing changed while every
        # row it accounts for has been purged. The request drops to the cold
        # walk, which re-reads the window and sweeps what it does not re-stamp.
        if stored and not _requested(props):
            cur.update({"phase": "changes", "changesToken": stored})
            return cur
        cur.update({"phase": "backfill", "floor": _floor(props, anchor),
                    "sweep": bool(stored and _requested(props)),
                    "seen": [], "seenOverflow": False})
        return cur


    def _backfill(host, batch, aid, acct, base, token, cur, notes):
        if _spent(cur, CALL_RESERVE):
            if cur.get("pageToken"):
                _hold(host, aid, cur, cur["pageToken"])
                return _stamp(host, batch, aid, acct, cur)
            host.log("google-drive: no invocation budget left to start %s — it "
                     "syncs on the next run" % aid)
            return {}
        params = _list_params(cur)
        if cur.get("pageToken"):
            params["pageToken"] = cur["pageToken"]
        resp = _get(base, token, "/drive/v3/files", params)
        _stage_files(host, batch, aid, resp.get("files") or [], cur, notes)
        cur["pages"] = int(cur.get("pages") or 0) + 1
        next_page = resp.get("nextPageToken") or ""
        if next_page and (cur["pages"] >= MAX_LIST_PAGES
                          or _spent(cur, CALL_RESERVE)):
            # A cold start is bounded — by list pages AND by invocations — and
            # the truncation is never silent: the unfinished walk is persisted on
            # the account and the next run resumes it before anything else.
            _hold(host, aid, cur, next_page)
        elif next_page:
            cur["pageToken"] = next_page
            cur["back"] = "backfill"
        else:
            cur["pageToken"] = ""
            cur["back"] = "finish"
        cur["phase"] = "export"
        return {"more": host.page.more(cur)}


    def _changes(host, batch, aid, acct, base, token, cur, notes):
        params = {"pageToken": cur.get("changesToken") or "", "pageSize": LIST_PAGE,
                  "fields": CHANGES_FIELDS}
        resp = _get(base, token, "/drive/v3/changes", params)
        items, gone = [], []
        for change in resp.get("changes") or []:
            if not isinstance(change, dict):
                continue
            if str(change.get("changeType") or "file") != "file":
                continue  # a `drive` change names a shared drive, not a file
            fid = str(change.get("fileId") or "")
            item = change.get("file") if isinstance(change.get("file"), dict) else {}
            if change.get("removed") is True or item.get("trashed") is True:
                if fid:
                    gone.append(fid)
                continue
            if item.get("id"):
                items.append(item)
        _retract(host, batch, aid, gone, cur)
        _stage_files(host, batch, aid, items, cur, notes)
        cur["pages"] = int(cur.get("pages") or 0) + 1
        if resp.get("newStartPageToken"):
            cur["newToken"] = str(resp["newStartPageToken"])
        next_page = resp.get("nextPageToken") or ""
        if next_page and _spent(cur, CALL_RESERVE):
            _hold_changes(host, aid, cur, next_page)
            next_page = ""
        else:
            cur["back"] = "changes" if next_page else "finish"
        cur["changesToken"] = next_page
        cur["phase"] = "export"
        return {"more": host.page.more(cur)}


    def _text(raw, ctype):
        """The export body as the `markdown` the kind holds: decoded as UTF-8
        (a Drive export is UTF-8; a stray byte becomes U+FFFD rather than a
        parked page), NUL-free (Postgres refuses a NUL in text), capped at
        EXPORT_MAX bytes. Returns (text, truncated)."""
        truncated = len(raw) > EXPORT_MAX
        head = raw[:EXPORT_MAX] if truncated else raw
        text = head.decode("utf-8", "replace").replace("\x00", "")
        # A UTF-8 BOM is a byte-order mark, not a character of the document.
        if text.startswith("\ufeff"):
            text = text[1:]
        return text, truncated


    def _exports(host, batch, aid, base, token, cur):
        pending = list(cur.get("pending") or [])
        batch_keys, rest = pending[:EXPORT_BATCH], pending[EXPORT_BATCH:]
        now = _iso(_now())
        done, failed = int(cur.get("exports") or 0), int(cur.get("failed") or 0)
        for key in batch_keys:
            fid, _, export_as = str(key).partition(" ")
            if not fid or not export_as:
                continue
            rid = _file_id(host, aid, fid)
            path = "/drive/v3/files/%s/export" % urllib.parse.quote(fid, safe="")
            try:
                raw, ctype = _get_bytes(base, token, path, {"mimeType": export_as})
            except urllib.error.HTTPError as e:
                code = _status(e)
                # A PERMANENT refusal is recorded once, on the row, and not asked
                # again until the file changes: 403 `cannotExportFile` (the owner
                # may view the deck but not export it), 400 for a media type the
                # file does not offer, 404 for a file gone between the listing
                # and the fetch. 401, 429 and every 5xx are the ACCOUNT's and
                # raise, so the page's batch is discarded and the tick retries.
                if code in (401, 429) or code is None or code >= 500:
                    raise
                err = _detail(e)
                reason = ("HTTP %d %s" % (code, str(err.get("message") or "")
                                          or (err.get("errors") or [{}])[0]
                                          .get("reason") or "")).strip()
                host.log("google-drive: export of %s for %s refused: %s"
                         % (fid, aid, reason[:REASON_MAX]))
                batch.patch(FILE_TYPE, rid,
                            properties={"exportError": reason[:REASON_MAX]})
                failed += 1
                continue
            text, truncated = _text(raw, ctype)
            batch.patch(FILE_TYPE, rid, properties={
                "text": text, "exportMimeType": export_as,
                "exportTruncated": truncated, "exportedAt": now,
                "exportError": None})
            done += 1
        cur["pending"] = rest
        cur["exports"] = done
        cur["failed"] = failed
        if not rest:
            cur["phase"] = cur.get("back") or "finish"
        return {"more": host.page.more(cur)}


    def _sweep(host, batch, aid, cur):
        """Retract the files a requested full re-read did not re-stamp, SCOPED
        to the window it read (`modifiedTime` on or after the floor). What it
        compares against is the set of row ids this walk wrote, carried on the
        cursor and across runs on the account's resume (README, ask 1). Past
        SEEN_MAX the set is dropped and the sweep skipped, because deleting on
        a truncated set would retract live rows. Every retraction is logged."""
        if cur.get("seenOverflow"):
            host.log("google-drive: %s re-read more than %d rows in one window — "
                     "the sweep is skipped (README, ask 1)" % (aid, SEEN_MAX))
            return False
        seen = set(cur.get("seen") or ())
        where = {"account": {"eq": aid}}
        floor = cur.get("floor") or ""
        if floor:
            where["modifiedTime"] = {"gte": floor}
        page = host.records.list(FILE_TYPE, where=where, first=SWEEP_PAGE,
                                 after=cur.get("after") or None)
        if not cur.get("after"):
            host.log("google-drive: sweep %s begins — window %s, %d ids seen"
                     % (aid, floor or "(all)", len(seen)))
        retracted = int(cur.get("retracted") or 0)
        for ent in page.get("records") or []:
            rid = str(ent.get("id") or "")
            if not rid or rid in seen:
                continue
            props = ent.get("properties") or {}
            host.log("google-drive: sweep %s retracts %s (fileId %s) — this "
                     "window's listing no longer names it"
                     % (aid, rid, props.get("fileId")))
            batch.delete(FILE_TYPE, rid)
            retracted += 1
        cur["retracted"] = retracted
        cur["after"] = page.get("cursor") or ""
        if not cur["after"]:
            host.log("google-drive: sweep %s done — %d retracted" % (aid, retracted))
        return bool(cur["after"])


    def _stamp(host, batch, aid, acct, cur):
        props = acct.get("properties") or {}
        failed = int(cur.get("failed") or 0)
        status = "ok" if failed == 0 else "ok (%d export%s refused)" % (
            failed, "" if failed == 1 else "s")
        unknown = [str(u) for u in (cur.get("unknown") or []) if u]
        if unknown:
            status += " (unmirrored: %s)" % "; ".join(unknown[:6])
        resume = cur.get("resume") or {}
        owed = bool(resume.get("pageToken") or resume.get("changesToken")
                    or resume.get("sweep") or resume.get("pending"))
        owes = len(resume.get("pending") or []) or (1 if owed else 0)
        stamp = _ack(props, {}, "drive")
        # A COMPLETED RUN CLEARS THE 429 WALL: it only got here by calling
        # Google successfully.
        if props.get("retryNotBefore"):
            stamp["retryNotBefore"] = None
        stamp.update({"driveSyncStatus": status, "driveResume": resume})
        if owed:
            # SUCCESS IS NOT STAMPED BEFORE RECONCILIATION. A run that still owes
            # a page, an export batch or a sweep leaves `driveLastSyncedAt` and
            # the watermark alone, and says `pending` in the runner's own word.
            stamp["driveSyncStatus"] = "%s (%d pending)" % (status, owes)
            stamp["driveSyncState"] = "pending"
        else:
            now = _iso(_now())
            stamp["driveLastSyncedAt"] = now
            stamp["lastSyncedAt"] = now
            stamp["driveSyncState"] = "ok"
            # THE WATERMARK: the delta's `newStartPageToken` where a delta ran,
            # else the run-start token the cold walk was taken under — and never
            # while a continuation is owed.
            token = cur.get("newToken") or cur.get("startToken") or ""
            if token:
                stamp["driveStartPageToken"] = token
        others = [str(props.get(k) or "") for k in
                  ("contactsSyncStatus", "gmailSyncStatus", "calendarSyncStatus")]
        if not any(s.startswith("erroring") or "pending" in s for s in others):
            stamp["syncStatus"] = stamp["driveSyncStatus"]
        if cur.get("anchor"):
            stamp["driveBackfillAnchorAt"] = cur["anchor"]
        started, elapsed = _trait_run(cur)
        stamp.update(_trait_stamp(
            props, "drive", "ok", stamp["driveSyncStatus"], _iso(_now()),
            completed=not owed,
            progress=_trait_progress("drive: " + str(cur.get("phase") or "drain"),
                                     cur.get("records"), owes),
            started=started, elapsed_ms=elapsed))
        batch.patch((acct.get("kind") or ACCOUNT_TYPE), aid, properties=stamp)
        rest = list(cur.get("queue") or [])[1:]
        if rest:
            return {"more": host.page.more(
                _carry_trait(cur, _fresh(rest, int(cur.get("calls") or 0))))}
        return {"output": {"account": aid, "records": int(cur.get("records") or 0),
                           "exports": int(cur.get("exports") or 0),
                           "exportsRefused": failed,
                           "retracted": int(cur.get("retracted") or 0)}}


    def _drain(host, batch, aid, acct, props, base, token, cur):
        cur["calls"] = int(cur.get("calls") or 0) + 1
        _chain_begin(cur)
        _trait_begin(cur)
        notes = _Notes(cur)
        phase = cur.get("phase") or "plan"
        if phase == "plan":
            if _spent(cur, CALL_RESERVE):
                host.log("google-drive: the drain's invocation budget is spent "
                         "before %s — it syncs on the next run" % aid)
                return {}
            cur = _plan_account(host, aid, props, base, token, cur)
            phase = cur["phase"]
        if phase == "export":
            if cur.get("pending") and _out_of_time(cur):
                # OUT OF TIME BETWEEN TWO EXPORT BATCHES: the ids ride on the
                # account and this fire ends cleanly, `ok` with the rest pending.
                _hold_pending(host, aid, cur)
                return _stamp(host, batch, aid, acct, cur)
            if not cur.get("pending"):
                cur["phase"] = cur.get("back") or "finish"
                return {"more": host.page.more(cur)}
            return _exports(host, batch, aid, base, token, cur)
        if phase == "backfill":
            return _backfill(host, batch, aid, acct, base, token, cur, notes)
        if phase == "changes":
            return _changes(host, batch, aid, acct, base, token, cur, notes)
        if phase == "sweep":
            if _sweep(host, batch, aid, cur):
                return {"more": host.page.more(cur)}
            cur["resume"] = {}
            return _stamp(host, batch, aid, acct, cur)
        if cur.get("sweep"):
            # A requested full re-read happened: the rows it could not re-stamp
            # are the ones this window never wrote. The OWED RECONCILIATION is
            # persisted before the first delete.
            cur.update({"phase": "sweep", "after": "", "sweep": False})
            _owe_sweep(batch, acct, aid, cur)
            return {"more": host.page.more(cur)}
        return _stamp(host, batch, aid, acct, cur)


    def main(input, host):
        cfg = input.get("config") or {}
        accounts = {a.get("id"): a for a in (cfg.get("accounts") or [])}
        resume = host.page.resume() or None
        if resume:
            cur = dict(resume)
        else:
            record = (input.get("envelope") or {}).get("record") or {}
            etype = (record.get("kind") or "")
            if etype == ACCOUNT_TYPE:
                # Record-triggered: sync just this account (a connect, an edit,
                # a "sync now").
                queue = [record.get("id")]
                scheduled = False
            else:
                # Schedule-triggered: every connected account that wants drive
                # and is due by its cadence.
                queue = [aid for aid, a in accounts.items()
                         if _wants(a) and _due(a.get("properties") or {})]
                scheduled = True
            cur = _fresh(queue)
            cur["scheduled"] = scheduled

        _drain_budget(cfg, cur)
        batch = _Batch()
        queue = list(cur.get("queue") or [])
        while queue:
            acct = accounts.get(queue[0])
            if acct is not None and acct.get("tokenError"):
                host.log("google-drive: skip %s: %s" % (queue[0], acct["tokenError"]))
                _erroring(batch, acct, acct["tokenError"])
            if acct is None or not _wants(acct) or acct.get("tokenError") \
                    or not acct.get("token"):
                queue = queue[1:]
                cur = _carry_trait(cur, _fresh(queue, int(cur.get("calls") or 0)))
                continue
            break
        if not queue:
            batch.flush(host)
            return {}

        aid = queue[0]
        acct = accounts[aid]
        cur["queue"] = queue
        # The account's own address as an `emailaddress` ROW named by
        # `account.address` — the connection's identity as a relation, the same
        # normal form the other three streams compose.
        owner = _mailbox((acct.get("properties") or {}).get("email"))
        if owner:
            batch.put(ADDRESS_TYPE, _address_id(host, aid, owner),
                      properties={"account": aid, "address": owner})
            batch.patch((acct.get("kind") or ACCOUNT_TYPE), aid,
                        properties={"address":
                                    {"ref": _address_id(host, aid, owner)}})
        try:
            out = _drain(host, batch, aid, acct, acct.get("properties") or {},
                         _api_base(cfg), acct["token"], cur)
        except Exception as e:
            # A provider failure, a refused origin or a dead grant stamps THIS
            # account and the drain continues behind it. The buffered effects
            # are DISCARDED rather than flushed beside the error stamp.
            host.log("google-drive: %s failed for %s: %s"
                     % (cur.get("phase"), aid, e))
            failure = _Batch()
            _erroring(failure, acct, _reason(e), _retry_after(e),
                      reconsent=isinstance(e, _NeedsReconsent))
            failure.flush(host)
            rest = queue[1:]
            if rest:
                return {"more": host.page.more(
                    _carry_trait(cur, _fresh(rest, int(cur.get("calls") or 0))))}
            return {}
        batch.flush(host)
        return out
