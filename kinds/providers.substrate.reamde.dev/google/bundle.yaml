# The Google bundle — one Google account, mirrored as FIRST-CLASS OBJECTS.
#
# THREE streams, one account: CONTACTS (the People address book), GMAIL
# (threads, messages and their attachments) and CALENDAR (calendar list,
# recurring masters and events). Each is a separate account toggle, a separate
# scope, a separate sync function, a separate pair of triggers and a separate
# slice of connector state, so one stream erroring never stalls another.
#
# WHAT THIS PACKAGE IS. A mirror written to `docs/kind-design.md`, which says
# in one line: *the kind IS the object, complete* —
#
#   - EVERY FIELD of the API resource is a TOP-LEVEL PROPERTY under the API's
#     own camelCase name, typed exactly. TWO classes are omitted, as classes,
#     and each kind's description names the ones that apply: the RESPONSE
#     ENVELOPE (`kind: "calendar#event"`, a list's own `etag`) and the
#     HYPERMEDIA (a `*_url` template).
#
#     A CONSTANT DISCRIMINATOR IS NOT A THIRD CLASS. `docs/kind-design.md` §1
#     says it is DECLARED, as a one-value enum, so the record says what it is
#     and a value Google adds later is a widening rather than a surprise;
#     this preamble used to claim the opposite, and People's
#     `metadata.objectType` was declared anyway. It is declared, with all
#     THREE of the API's values (`OBJECT_TYPE_UNSPECIFIED`, `PERSON`,
#     `PAGE`) — the guide calls it one-valued in two places, which is the
#     API's documentation being taken at its word rather than read.
#   - NO `raw`. Not one kind in this closure carries a `json` blob of the
#     payload. A shape of scalars, objects and lists within four levels is
#     DECLARED however long: an event's `reminders`, `conferenceData`,
#     `source`, `attachments`, `extendedProperties` (keyed),
#     `workingLocationProperties`; a contact's `birthdays[].date{year, month,
#     day}` and every other People array; a message's `headers[]{name,
#     value}`.
#   - NO DERIVED PROPERTY. No copy out of a referent (`attendeeEmails`,
#     `calendarId`), no computation over the row (`allDay`, `meetingURL`,
#     `gmailthread.subject`, `gmailthread.participants`), no owner-relative flag
#     (`fromOwner`, `directedAtOwner`, `mentionsOwner`, `isOwner`). The owner
#     is `account.address` — a REFERENCE at the same `emailaddress` hub row
#     every mirror points at, established by whichever stream runs first, so
#     "mail I sent" is `from.address eq <that row>` and not a string compare
#     against `account.email` (which is the OAuth facility's own contract
#     property and stays one). A judgement is a consumer function's, never
#     the mirror's. A fact GOOGLE states about
#     the caller stays: an attendee's `self`, a message's `SENT` label.
#   - EVERY RELATION IS A REFERENCE, and per-occurrence data rides on the
#     LINK: `calendarevent.attendees → emailaddress[]` carrying `responseStatus`,
#     `optional`, `organizer`, `self`, `resource`, `comment`,
#     `additionalGuests` and the `displayName` THIS event spelled;
#     `gmailmessage.from/to/cc/bcc/replyTo → emailaddress[]` carrying the `name`
#     THIS header spelled; `contact.emailAddresses → emailaddress[]` carrying
#     `type`, `formattedType`, `primary`, `displayName`. The `emailaddress`
#     hub carries the identity ALONE — `address` — so no header's spelling of
#     a name can overwrite another's.
#   - NO SYNC BOOKKEEPING ON A MIRROR. A stream cursor lives on the account
#     row; the PER-CALENDAR cursor lives in `calendarsync`, a provider-owned
#     state kind with `writer: connector` on every property, so draining a
#     calendar's events never bumps the calendar row's version.
#   - NO CONSUMER SLOT. No `person`, no `task`, no `episode`. A provider knows
#     nothing about Mneme; the link a `recordmapping` makes is the mapping's.
#   - IDS ARE GOOGLE'S, through `host.ids.external(provider, account,
#     upstreamId)`, so a re-sync upserts rather than duplicates and a seeded
#     row is the same row the next live sync writes.
#   - THE API BASE IS CONFIGURABLE (`config.apiBase`), loopback only. Every
#     sync reads it, so a recorded upstream stands in without rewriting a line
#     of source.
#
# Install:  substratectl apply -f bundle.yaml -f triggers.yaml
# Configure: create a config record — the Google OAuth client id + secret,
#   and, for a test or a seed, the `apiBase` the syncs should call instead of
#   Google. The `client` input resolves it.
# Connect:  create an account, then run the host OAuth flow against it.
#
# This file is the SCHEMA closure (the atomic install unit). The delivery
# wiring lives beside it in triggers.yaml as ordinary data records.
# ---- the owned package --------------------------------------------------------
kind: substrate.reamde.dev/core/package
metadata:
  id: providers.substrate.reamde.dev/google
data:
  authority: providers.substrate.reamde.dev
  package: google
  # 25 (T-023, the failure matrix): `retryNotBefore` on the account — a 429
  # SAYS WHEN, Google's quota is the ACCOUNT's, so the wall one stream meets
  # stops the other two walking into it and a "sync now" does not move it.
  # And `_reason` names the CLASS in all three streams, in the same words,
  # because the status is what the console shows and what the e2e asserts on:
  # 401 `reconnect needed` (permanent until the owner reconnects), 403
  # `stream not available`, 429 `rate limited`, everything else a transient
  # HTTP code the cadence retries. The matrix itself is
  # `providers/google/e2e/faults.json` plus the two cases the scenario POSTs
  # to the mock between syncs.
  # 24 (T-023): two kinds the recordings finally allow — `contactgroup`
  # (People `contactGroups.list`) and `gmaillabel` (`users.labels.list`) —
  # and the two references that were strings for want of them:
  # `contact.memberships[].contactGroupMembership.contactGroup`, and
  # `gmailmessage.labelIds` -> `labels`, a repeated reference with no scalar
  # beside it. Both listings are COMPLETE, so each walk retracts what its
  # response does not name. Also the contacts stream's chain-spanning budget
  # guard (`contactsResume`), which it alone lacked and which T-031's second
  # endpoint made urgent.
  #
  # A SHAPE CHANGE: `gmailmessage.labelIds` (string[]) is gone. An installed
  # copy holding rows must be purged and re-seeded, which `seed-provider
  # --replace` does.
  # 23 (T-002 + T-003). T-003, the one that bit: `gmailBackfillResume` is a
  # DECLARED object whose `floor` is a `datetime`, and the resume dict wrote
  # `floor: ""` whenever the account's depth is `all` (which every seeded one
  # is). The engine refused the whole patch — "expected an RFC 3339 instant" —
  # and that patch is the one RECORDING THE OWED SWEEP, so the drain parked
  # mid-chain and every row the window no longer named lived forever. Empty
  # fields are dropped from the resume now. Second, the sweep's FENCE was the
  # run-start
  # profile `historyId`, which is not the top of the mailbox — mail landing
  # between that read and the listing carries a higher one, and so does every
  # row an earlier pull wrote, so 47 of 147 hydrated messages in the owner's
  # noodles pull were permanently unsweepable. The fence is the walk's own
  # high water mark now (`gmailBackfillResume.maxHistoryId`, new field), and
  # the sweep logs its window, its fence and every retraction.
  # T-002: a cancelled MASTER takes nothing with it. `_stage_events`
  # still SKIPPED every exception of a tombstoned master before writing it,
  # so the shell those exceptions were supposed to mint had nothing pointing
  # at it and the `tombstones` phase deleted the series too — 18 rows under
  # one master on the reflection seed. `condemned` now means only "this
  # stopped recurring"; a Google tombstone is `retired` and takes itself
  # alone. A master seen only as an exception's target is also marked SEEN,
  # so a full re-read's sweep stops retracting it.
  # 22 (T-026 + T-031): a contact's title is the NAME on it now
  # (`{names[].displayName|resourceName}`) rather than `people/c1234…`, which
  # the engine could not render until T-026 taught templates the array walk;
  # and the contacts stream walks a SECOND endpoint into the same
  # `contact` kind — `people:listDirectoryPeople`, the Workspace directory,
  # where a Workspace account keeps every colleague it does not have saved in
  # `myContacts`. New: the `directory.readonly` scope under `enabledContacts`,
  # and `contactsDirectorySyncToken` / `contactsDirectoryState` /
  # `contactsDirectoryStatus` on the account. An account connected under 21 or
  # earlier must RECONNECT for the new scope; until it does, the directory
  # stream records `needsreconsent` and the address book still syncs.
  # 21 (T-025): every PRODUCT-SPECIFIC kind carries its product's prefix —
  # `event` -> `calendarevent`, `series` -> `calendarseries`, `message` ->
  # `gmailmessage`, `thread` -> `gmailthread`, `attachment` ->
  # `gmailattachment`. One provider holds three products and a bare `event`
  # or `message` did not say which. `calendar`, `calendarsync` and `contact`
  # already read as their product's; `account` and `config` are the
  # connection's, not a product's; and `emailaddress` takes NO prefix because
  # it is not a Google resource at all — it is the identity hub all three
  # products share (see its own comment block).
  # 20: `syncRequestedAt` + the three per-stream acks (a re-seeded account
  # cannot be re-driven any other way — its `*LastSyncedAt` survives a purge)
  # and `calendarPending`, the calendar walk's own continuation.
  # 19: the shapes moved. `docs/reviews/google-rewrite-codex.md` is the
  # review; the README's "What changed" is the summary. A changed
  # declaration shipping the same version reaches no repository.
  # 26: the gmail walk carries what it RETRACTED (T-048), so a message
  # `messages.get` answered 404 for is not minted back as a thin row by a
  # `threads.get` taken earlier in the same walk.
  # 27: a failing calendar drain NAMES THE CALENDAR AND THE PHASE on the
  # account's status line (T-055). `erroring: google returned HTTP 404` over
  # nine calendars said only that one of them had answered 404, and finding
  # which cost a pass over every `calendarsync` row looking for the calendar
  # that had none.
  # 28 (T-084 + the parked-drain fix): every fire is SELF-LIMITING. The engine
  # parks a continuation chain that outruns its cumulative two-minute
  # deadline, which is what every hourly `google-gmail-scheduled` delivery did
  # in production — effects committed, delivery recorded as a failure. The
  # gmail chain was bounded by INVOCATIONS only (twelve, checked at a list
  # boundary) and the hydrates between two listings are unbounded in time, so
  # it now watches a wall clock as well, hands back MID-PAGE with the listed
  # ids it did not fetch parked on `gmailBackfillResume.pending`, and says
  # `ok (N pending)` in the word the runner's continuation contract reads
  # (it said `(resuming)`, which nothing recognised). Contacts and calendar
  # already had the clock; what they lost was the clock itself — a rebuilt
  # cursor (the contacts sweep, the skip loop) started the budget over. The
  # bound is `config.drainBudgetMs` over a built-in 55 s.
  #
  # 28 (T-084): the account binds the core `sync` trait beside `accountconfig`
  # and declares its twelve properties, and the three stream bodies write them
  # on every path they already stamp — `syncStreams` per stream (contacts,
  # gmail, calendar), the account-level `syncState`/`syncMessage` RAISED the
  # way `syncStatus` is, `syncRequestedAck` once every enabled stream has
  # answered the same request, `syncProgress` off the drain's own bookkeeping,
  # `syncError`/`syncErrorAt` on a failure, `lastSyncStartedAt` and
  # `lastSyncDurationMs` on the scheduled path (the dispatcher stamps the
  # record-sourced one), a rate limit as `throttled` rather than `erroring`,
  # and `syncPaused` honoured wherever a stream asks whether it wants an
  # account. Every legacy field keeps its name, its type and its writer. The
  # one retype is `syncState`, enum -> string, because a trait contracts a
  # datatype; see its comment on the account kind for the migration it costs a
  # repository whose rows already carry it.
  #
  # 30 (T-088): the DRIVE stream. A fourth product under a fourth toggle
  # (`enabledDrive`, scope `drive.readonly`): `drivefile` mirrors the Drive
  # v3 File resource under this stream's fields mask — keyed on Google's file
  # id, `at` its `createdTime`, its owners as occurrence objects pointing at
  # the `emailaddress` hub, its parents as references at their own rows — and
  # carries the `files.export` text of a Doc (markdown), a Sheet (the first
  # sheet's CSV) or a Slides deck (plain text), capped at 200 KB, beside the
  # `exportedAt`/`exportError` pair `capture/link` uses. `syncdrive` walks
  # `files.list` cold and `changes.list` incrementally from a start page
  # token held on the account, under the same drain budget the other three
  # streams keep; `driveResume` is its unfinished-walk state. Nothing else
  # moved. ADDITIVE, so an installed 29 upgrades in one apply — but every
  # account connected under 29 or earlier must RECONNECT for the new scope,
  # and until it does the drive stream records `needsreconsent`.
  #
  # 33: a SPLIT SERIES NO LONGER LEAVES ITS EXCEPTIONS BEHIND. Google's "this
  # and following" ends one master and starts `<master>_R<date>`, re-parenting
  # every later exception onto it while each keeps its instance id. An
  # exception row is keyed `<series row>_<slot>`, so the re-parented copy
  # landed at a NEW row and the old one, which no delta names again, stayed
  # beside it: one copy of the same occurrence per split. Writing an event now
  # retracts every other `calendarevent` on the same calendar carrying the
  # same `eventId` (`_retract_strays`). A full re-read runs the same path, so
  # one requested sync per account clears what a repository already holds.
  # Behaviour only; no declaration moved.
  version: 34
---
kind: substrate.reamde.dev/core/bundle
metadata:
  id: providers.substrate.reamde.dev/google
data:
  authority: providers.substrate.reamde.dev
  package: google
  description: >-
    Keeps a copy of your Google contacts, mail, calendars and Drive files
    in Google's own shape, each its own toggle you can turn on separately.
    Read-only: nothing is ever written back to Google.
  # The one declared input: the OAuth client record. `inject: functions`
  # now, because the syncs read `apiBase` off it — the OAuth facility's own
  # secrets (the clientSecret here, an account's tokenRef) are never injected
  # whatever an input declares, so the body still sees no credential material.
  inputs:
    client:
      kind: providers.substrate.reamde.dev/google/config
      inject: functions
      description: the Google OAuth client the host exchanges codes through,
        and the API base the syncs call
  # TRUSTED provider metadata: the host reads endpoints and the
  # feature-to-scope mapping ONLY from here — the immutable install artifact —
  # never from the mutable config record. All three features are wired, each
  # to its own scope: the requested union is derived per StartOAuth from the
  # account's enabled toggles, so turning gmail on for an already-connected
  # account needs a RECONNECT (grantedScopes drives it).
  #
  # `gmail.readonly` is one of Google's RESTRICTED scopes: a published client
  # needs CASA verification, and an External+Testing client has its refresh
  # tokens revoked after 7 days. `calendar.readonly` is chosen over the
  # granular pair because it covers calendarList.list AND events.list in one
  # consent line.
  oauth2:
    clientInput: client
    authorizationEndpoint: https://accounts.google.com/o/oauth2/v2/auth
    tokenEndpoint: https://oauth2.googleapis.com/token
    revocationEndpoint: https://oauth2.googleapis.com/revoke
    # After the exchange the facility reads the connected account's own
    # address here and writes it into the account's `email` property as the
    # substrate.oauth actor. The user never types their email; it comes from
    # the grant. NOTHING on a mirror is computed from it: "mail I sent" is a
    # filter on `gmailmessage.from`, which is the reference, not a stored flag.
    #
    # `oauth2/v3/userinfo`, NOT People `people/me`. Verified live against two
    # connected accounts on 2026-09-15: with `contacts.readonly` granted and
    # nothing else identity-shaped, People answers
    #
    #   403 The caller does not have permission to request "people/me".
    #       Request requires one of the following scopes: [profile]
    #
    # — with `personFields=emailAddresses` alone, not just with `names`. So
    # package version 16's endpoint could never fill `email`, and every
    # account connected under it carries none. `oauth2/v3/userinfo` answers
    # `{sub, email, email_verified, …}` under `userinfo.email`, which is why
    # that scope now rides on all three toggles: the profile read happens once
    # per consent whatever streams are on, so whichever toggle the user
    # enables has to carry it.
    emailEndpoint: https://www.googleapis.com/oauth2/v3/userinfo
    emailProperty: email
    featureScopes:
      enabledContacts:
        scopes:
          - https://www.googleapis.com/auth/contacts.readonly
          # THE WORKSPACE DIRECTORY (T-031). A Workspace account keeps its
          # colleagues in the domain directory, not in `myContacts`, so an
          # account whose address book IS its company answers
          # people/me/connections with zero people. This scope is what
          # `people:listDirectoryPeople` needs, and it rides on the CONTACTS
          # toggle because a directory person is a contact — same resource,
          # same kind, same row. An account connected under package version
          # 21 or earlier does NOT have it: `grantedScopes` drives the
          # reconnect prompt, and until the owner reconnects the directory
          # stream records `needsreconsent` on the account and the address
          # book still syncs.
          - https://www.googleapis.com/auth/directory.readonly
          - https://www.googleapis.com/auth/userinfo.email
      enabledGmail:
        scopes:
          - https://www.googleapis.com/auth/gmail.readonly
          - https://www.googleapis.com/auth/userinfo.email
      enabledCalendar:
        scopes:
          - https://www.googleapis.com/auth/calendar.readonly
          - https://www.googleapis.com/auth/userinfo.email
      # THE DRIVE STREAM (T-088). `drive.readonly` covers `files.list`,
      # `files.export` and `changes.list` in one consent line; the granular
      # `drive.metadata.readonly` would list the files and refuse every
      # export, and `drive.file` sees only what this app created. It is one of
      # Google's RESTRICTED scopes like `gmail.readonly`, so a published client
      # needs the same verification. An account connected under package
      # version 29 or earlier does NOT have it: `grantedScopes` drives the
      # reconnect prompt, and until the owner reconnects the drive stream
      # records `needsreconsent` on the account and the other three streams
      # sync as before.
      enabledDrive:
        scopes:
          - https://www.googleapis.com/auth/drive.readonly
          - https://www.googleapis.com/auth/userinfo.email
  installs:
    - providers.substrate.reamde.dev/google/config
    - providers.substrate.reamde.dev/google/account
    - providers.substrate.reamde.dev/google/emailaddress
    - providers.substrate.reamde.dev/google/contact
    - providers.substrate.reamde.dev/google/contactgroup
    - providers.substrate.reamde.dev/google/gmaillabel
    - providers.substrate.reamde.dev/google/gmailthread
    - providers.substrate.reamde.dev/google/gmailmessage
    - providers.substrate.reamde.dev/google/gmailattachment
    - providers.substrate.reamde.dev/google/calendar
    - providers.substrate.reamde.dev/google/calendarsync
    - providers.substrate.reamde.dev/google/calendarseries
    - providers.substrate.reamde.dev/google/calendarevent
    - providers.substrate.reamde.dev/google/drivefile
    - providers.substrate.reamde.dev/google/synccontacts
    - providers.substrate.reamde.dev/google/syncgmail
    - providers.substrate.reamde.dev/google/synccalendar
    - providers.substrate.reamde.dev/google/syncdrive
---
# ---- the config type: the `client` input's kind ---------------------------
# oauth2 (the OAuth CLIENT credentials the facility uses to exchange codes):
# the Google OAuth client the owner registers. The provider ENDPOINTS and the
# feature-to-scope mapping are trusted manifest metadata (the bundle's
# `oauth2:` block above), never properties on this mutable row.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/google/config
data:
  authority: providers.substrate.reamde.dev
  package: google
  description: >-
    The Google OAuth client this bundle authenticates through: a client id,
    a sealed client secret, and the API base the syncs call. The endpoints
    and the feature-to-scope mapping are trusted manifest metadata, never
    properties on this row.
  purpose: internal
  names:
    singular: config
  traits: [substrate.reamde.dev/core/oauth2]
  displayTemplate: "Google client {clientId}"
  properties:
    clientId:
      type: string
      displayName: Client ID
      description: the Google OAuth client id (from the Google Cloud console)
    clientSecret:
      type: secret
      displayName: Client secret
      description: the Google OAuth client secret — sealed at rest, never
        read back
    # THE TEST AND SEED SEAM. Absent, each sync calls Google's own host for
    # its path space (www.googleapis.com for calendar, gmail.googleapis.com
    # for gmail, people.googleapis.com for people). Set, every request goes
    # to `<apiBase><path>` instead, and the three path spaces are disjoint so
    # one origin serves all three. It is how an end-to-end test, and a seed
    # of recorded responses, runs the REAL sync path without a line of the
    # source being rewritten — which is what the Go provider tests had to do
    # (`rewriteSource`, internal/providertest/google_test.go) before it
    # existed. Every body still refuses to send a bearer anywhere but its
    # pinned Google host, this base, or loopback.
    apiBase:
      type: url
      displayName: API base
      description: "the API origin the syncs call instead of Google's own
        hosts — a recorded fake for a test or a seed; empty in production"
    # THE DRAIN'S OWN DEADLINE, and why it is configurable. The engine gives a
    # continuation chain two minutes CUMULATIVELY (functions.go
    # drainDeadline); a chain that keeps asking for one more page past it is
    # PARKED with its effects already committed, which is a failure in the
    # ledger for work that landed — every hourly `google-gmail-scheduled` fire
    # in production, until the three streams learned to watch the clock. Each
    # body's built-in bound is 55 s, under the engine's with room for the
    # stamp; this overrides it, clamped to 1..110000 ms.
    #
    # MILLISECONDS, NOT SECONDS, and that is the whole reason it is declared:
    # a budget of one SECOND is longer than a whole drain over the e2e
    # fixtures, so the bound never tripped and the scenario could not tell a
    # drain that stops itself from one that simply finished. At 1 ms the very
    # first check hands back, so the hand-back path — the cursor persisted,
    # the remainder counted, `ok` and nothing parked — is PROVEN rather than
    # trusted. The same test-and-operations seam `apiBase` is.
    drainBudgetMs:
      type: int
      displayName: Drain budget (ms)
      description: "how long one fire may keep continuing its chain before
        it stops cleanly and leaves the rest pending; empty means the built-in
        55 s, which sits under the engine's two-minute deadline"
---

---
# ---- the account type: one connected Google account -----------------------
# accountconfig (its records ARE the bundle's connected accounts; the host
# writes tokenRef + tokenStatus + grantedScopes over the OAuth facility). The
# enabled-scopes toggles, the sync cadence and one STREAM-PREFIXED slice of
# connector state per feature all live here — each with a `writer:` role so
# only its rightful hand may set it.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/google/account
data:
  authority: providers.substrate.reamde.dev
  package: google
  description: >-
    One connected Google account. The OAuth facility writes its credential
    reference, status and granted scopes; the owner enables features and picks
    the cadence, and each stream keeps its own cursor here — except the per-calendar
    one, which lives in a calendarsync state row.
  purpose: internal
  names:
    singular: account
  # `sync` is the core trait the Connections page, `GET /api/v1/sync/status`
  # and `substratectl sync status` read (substrate decision 0085). The three
  # stream bodies write its twelve properties beside the per-stream strings
  # below, and around a RECORD-sourced delivery — a connect, an edit, a "sync
  # now" — the dispatcher stamps the start, the finish and the park onto them
  # under this bundle's own actor, so a body that crashes cannot leave the
  # account claiming a run that is not happening. The owner's two hands are
  # `syncRequestedAt` ("sync now") and `syncPaused` (pause); the other ten
  # belong to the connector. A schedule-sourced delivery names no record, so
  # there the three bodies' own writes are the whole truth.
  traits: [substrate.reamde.dev/core/accountconfig, substrate.reamde.dev/core/sync]
  displayTemplate: "{email}"
  properties:
    # The OAuth facility's hands on the account (writer: oauth — only the
    # facility's actor may set them).
    tokenRef:
      type: secret
      writer: oauth
      displayName: Token reference
      description: the credential-store reference the OAuth facility writes;
        never a raw token
    tokenStatus:
      type: string
      writer: oauth
      displayName: Connection status
      description: "the connection state the facility last reported (pending
        | connected | erroring)"
    grantedScopes:
      type: string
      repeated: true
      writer: oauth
      displayName: Granted scopes
      description: the OAuth scopes the last consent was granted for; drives
        reconnect-on-new-feature
    # The connected account's address, as the grant reported it. It is the
    # account's own fact and NOT a mirror's: nothing on a message, an event or
    # an emailaddress row is computed against it (record: no owner-relative
    # flag on a mirror). "Mail I sent" is `from eq emailaddress/<this row>`.
    email:
      type: email
      writer: oauth
      displayName: Email
      description: the connected Google account's address, set by the OAuth
        facility from the grant (oauth2/v3/userinfo)
    # THE CONNECTION'S IDENTITY AS A RELATION. `email` above is the OAuth
    # facility's own contract property (it writes the string and nothing
    # else); this is the same identity as the hub row every mirror points at,
    # so "mail I sent" is `from.address eq <this ref>` rather than a string
    # compare, and no mirror needs an owner flag to answer it. The contacts
    # drain writes it once the grant has said whose mailbox this is, so it is
    # the connector's hand: an owner is never asked to pick their own identity
    # out of a list, and the Add account form does not offer it.
    address:
      type: reference
      kind: providers.substrate.reamde.dev/google/emailaddress
      writer: connector
      displayName: Address
      description: the hub row for this account's own address — the identity
        every attendee list, mail header and address book converges on
    # The scope toggles the console surfaces. Each maps to its own scope in
    # the manifest's featureScopes block, so the requested consent union is
    # exactly the streams this account has turned on.
    enabledContacts:
      type: bool
      writer: owner
      displayName: Contacts
      description: sync this account's Google Contacts address book
    enabledGmail:
      type: bool
      writer: owner
      displayName: Gmail
      description: sync this account's Gmail threads and messages (a restricted
        Google scope)
    enabledCalendar:
      type: bool
      writer: owner
      displayName: Calendar
      description: sync this account's Google calendars, their recurring series
        and their events
    enabledDrive:
      type: bool
      writer: owner
      displayName: Drive
      description: sync this account's Google Drive files and the text of
        its Docs, Sheets and Slides (a restricted Google scope)
    # "SYNC NOW", AS A GENERATION RATHER THAN A MOMENT. The owner stamps
    # `syncRequestedAt`; each stream echoes the value IT acted on into its own
    # `<stream>SyncRequestedAck`; the three `google-*-on-request` triggers
    # fire exactly while their stream's pair disagrees. Three acks and not
    # one, because the three streams are independent everywhere else in this
    # closure — one shared ack would let whichever stream ran first spend the
    # request for the other two.
    #
    # Comparing the request against `lastSyncedAt` instead would look simpler
    # and would LOOP forever on a request dated in the future: the sync's own
    # stamp would never overtake it. A generation cannot outrun its
    # acknowledgement whatever the clocks say.
    #
    # THIS IS ALSO THE ONLY WAY TO RE-DRIVE A SEEDED ACCOUNT. A `bundle purge`
    # deletes the package's rows but the ACCOUNT survives (the engine's
    # tombstone restores a DELETE+PUT with its connector-written properties),
    # so `*LastSyncedAt` is already stamped when the on-connect guard is
    # evaluated and NOTHING fires — a re-seed made twelve OAuth calls and
    # kept a stale `erroring` status. The runner stamps this property instead.
    syncRequestedAt:
      type: datetime
      writer: owner
      displayName: Sync requested
      description: stamp this to ask every enabled stream for a sync now,
        whatever the cadence says
    # THE OTHER OWNER HAND (the `sync` trait's, decision 0085). While it is
    # true the dispatcher settles this account's record-sourced deliveries as
    # SKIPS without the body knowing, and the three bodies pass over it on the
    # scheduled path — a pause stops the syncs without disabling a stream, so
    # the toggles and the cursors are exactly where they were when it lifts.
    syncPaused:
      type: bool
      writer: owner
      displayName: Paused
      description: "while true no stream on this account syncs: the dispatcher
        skips its deliveries and the scheduled bodies pass over it"
    contactsSyncRequestedAck:
      type: datetime
      writer: connector
      displayName: Contacts request acknowledged
      description: the `syncRequestedAt` the contacts stream last acted on;
        equal means this stream has spent the request
    gmailSyncRequestedAck:
      type: datetime
      writer: connector
      displayName: Gmail request acknowledged
      description: the `syncRequestedAt` the gmail stream last acted on; equal
        means this stream has spent the request
    # THE CALENDAR WALK'S OWN CONTINUATION, and the reason it exists: the
    # engine bounds a paged drain across the WHOLE chain — 512 invocations
    # and two minutes from its first committed page — and a chain that
    # crosses one PARKS. A parked delivery is re-driven by the single serial
    # dispatcher every couple of minutes, which is every other provider in
    # the repository waiting behind it (it starved a Slack drain for an
    # hour). So the walk stops itself at a CALENDAR BOUNDARY, leaves the
    # calendars it has not reached here, and says `ok (N pending)` — the word
    # the runner reads before it stamps `syncRequestedAt` again.
    calendarPending:
      type: string
      repeated: true
      writer: connector
      displayName: Calendars owed
      description: the calendar ids an interrupted walk has not reached yet;
        the next requested run resumes from exactly these
    calendarSyncRequestedAck:
      type: datetime
      writer: connector
      displayName: Calendar request acknowledged
      description: the `syncRequestedAt` the calendar stream last acted on;
        equal means this stream has spent the request
    driveSyncRequestedAck:
      type: datetime
      writer: connector
      displayName: Drive request acknowledged
      description: the `syncRequestedAt` the drive stream last acted on; equal
        means this stream has spent the request
    syncFrequency:
      type: enum
      values:
        # QUOTED, both of them. `off` is a YAML 1.1 BOOLEAN, so this enum
        # shipped a value of `false` with a label of `false` and the loader
        # was handed a bool where it wanted a name. Every enum value in this
        # file is quoted for the same reason (`on`, `no`, `y`, `yes`).
        - value: "off"
          label: "Off"
        - value: hourly
          label: "Every hour"
        - value: daily
          label: "Once a day"
      required: true
      default: daily
      writer: owner
      displayName: Sync frequency
      description: "how often this account syncs on a schedule (default once
        a day); Sync now runs one at any time"
    # How far back a backfill reaches. Contacts syncs full+incremental via the
    # People sync token and ignores it; gmail and calendar honor it
    # identically — `none` means FROM CONNECT FORWARD (the first run's start
    # instant is the floor, stamped once as the stream's backfill anchor), a
    # window value means `anchor − Δ` computed ONCE from that stored anchor,
    # and `all` means the epoch.
    backfillDepth:
      type: enum
      values:
        - value: none
          label: "Don't backfill"
        - value: last30d
          label: "Last 30 days"
        - value: last90d
          label: "Last 90 days"
        - value: last1y
          label: "Last year"
        - value: all
          label: Everything
      required: true
      default: last30d
      writer: owner
      displayName: Backfill depth
      description: "how far back the first sync of Gmail, Calendar and Drive
        reaches; Contacts always syncs the whole address book"
    # Connector STATE the sync bodies own (writer: connector — only installed
    # bundle code may set these). Two tiers:
    #
    #   THE ROLLUP — `lastSyncedAt` + `syncStatus`, account-level and
    #   unprefixed. Every accountconfig type in the fleet declares this pair
    #   and the console reads it GENERICALLY off any connection, so it stays
    #   shared: whichever stream finishes stamps it.
    #
    #   THE PER-STREAM SLICES — one cadence anchor, one status and one cursor
    #   per feature, prefixed by the stream that owns them. Each stream's
    #   `_due` check and each stream's on-connect guard read THEIR OWN anchor,
    #   never the rollup: a gmail run must not suppress a due contacts run,
    #   and an account whose contacts already synced must still fire its first
    #   gmail backfill.
    lastSyncedAt:
      type: datetime
      writer: connector
      displayName: Last synced
      description: the account-level rollup — when ANY of this account's streams
        last finished
    # THE OUTCOME IS AN ENUM; THE REASON IS TEXT. One string carrying both
    # ("erroring: 403 insufficient scope") is a closed set with a sentence
    # glued to it, and nothing can filter on it. `*SyncState` is the state a
    # console or a query reads; `*SyncStatus` beside it is the diagnostic
    # sentence a human reads, and it keeps its shape because the end-to-end
    # runner's continuation contract parses its `(N pending)` word.
    #
    # THE ACCOUNT-LEVEL ONE IS THE TRAIT'S NOW, and a trait contracts a
    # DATATYPE: `sync` requires `syncState` as a `string`, so this property is
    # retyped from the enum it was and carries the trait's five words —
    # `never`, `running`, `ok`, `erroring`, `throttled` — a set decision 0085
    # keeps in PROSE for exactly the reason `tokenStatus` does, because a
    # trait has no way to contract a value set. The three `<stream>SyncState`
    # enums below are OURS, unchanged, and keep `pending` and `disabled`, so
    # nothing this closure could say before it bound the trait is lost: work
    # owed now reads as `ok` at the account level with the count in
    # `syncProgress.pending` and in `syncStreams.<stream>.pending`, and the
    # stream's own enum still says `pending` beside it.
    #
    # THE ONE NON-ADDITIVE STEP IN THIS VERSION. An enum is not a string to
    # the upgrade's narrowing guard, so a repository whose account rows
    # already carry `syncState` refuses the apply until the property is
    # nulled on them (`ctl patch … syncState=null`, T-084). A fresh
    # repository — every e2e one — has nothing to migrate.
    syncState:
      type: string
      writer: connector
      displayName: Sync state
      description: "never | running | ok | erroring | throttled — the account-level
        rollup state, raised the way syncStatus is and never cleared over
        another enabled stream's live failure. absent until the first drain"
    syncStatus:
      type: string
      writer: connector
      displayName: Sync status
      description: "the account-level rollup outcome (ok | ok (N skipped)
        | erroring: <reason>)"
    # --- the rest of the core `sync` trait (decision 0085) ------------------
    # `syncState`, `lastSyncedAt` and `syncRequestedAt` above are already the
    # trait's; these eight complete the twelve. They are ADDITIVE beside the
    # `syncStatus`/`<stream>SyncStatus` sentences and the three per-stream
    # acks, which keep their shape and their writers: a reader of the old
    # shape — the end-to-end runner's `(N pending)` contract, the seed, the
    # `google-<stream>-on-request` guards — goes on working unchanged, and the
    # legacy pair goes at the next major and not before.
    #
    # WHO WRITES THEM. The three stream bodies, through their effects, on
    # every path they already patch the account on; and the dispatcher, around
    # a record-sourced delivery, under this bundle's own actor — which is why
    # `writer: connector` holds for the engine's hand as well as for ours, and
    # why a stamp cannot fire the trigger that made it (a record trigger never
    # delivers its own callable's writes).
    syncMessage:
      type: string
      writer: connector
      displayName: Sync message
      description: the one human line the last run left — the same sentence
        syncStatus carries, without the erroring prefix doing double duty
    lastSyncStartedAt:
      type: datetime
      writer: connector
      displayName: Last sync started
      description: "when the last run began: stamped by the dispatcher around
        a record-sourced delivery, and by the body itself on the scheduled
        path, where no dispatcher is watching"
    lastSyncDurationMs:
      type: int
      writer: connector
      displayName: Last sync duration (ms)
      description: how long the last run took, stamped beside lastSyncStartedAt
        by whichever of the two hands wrote it
    syncRequestedAck:
      type: datetime
      writer: connector
      displayName: Sync request served
      description: "equals syncRequestedAt once EVERY enabled stream has answered
        that request; the per-stream answers are the three <stream>SyncRequestedAck
        properties and syncStreams.<stream>.requestedAck"
    syncProgress:
      type: json
      writer: connector
      displayName: Sync progress
      description: "{phase, done, total, pending} for the drain that last
        reported — phase names the stream and the walk it was on"
      # `json` because the TRAIT contracts the datatype (docs/kind-design.md
      # §1 admits no other shape here): the four keys are decision 0085's
      # prose, not ours to redeclare as an object.
    syncError:
      type: string
      writer: connector
      displayName: Sync error
      description: the last failure's text, from a stream body or from a parked
        delivery the dispatcher stamped
    syncErrorAt:
      type: datetime
      writer: connector
      displayName: Sync error at
      description: when syncError was written; it is not cleared by a later
        success, so a recovered account still says when it last broke
    syncStreams:
      type: json
      writer: connector
      displayName: Sync streams
      description: "contacts, gmail, calendar and drive, each as {state, message,
        lastAt, pending, requestedAck} — the per-stream half of the trait"
      # `json` for the same reason as syncProgress: the trait contracts the
      # datatype and the map's shape is 0085's prose.
    # A 429 SAYS WHEN (T-023). Google's quota is the ACCOUNT's, not a
    # stream's, so the wall one stream meets stops the other two walking into
    # it: every stream's `_due` refuses to start before this instant, and a
    # "sync now" does not move it either, because no amount of asking moves
    # Google's clock. Set from `Retry-After` (seconds or an HTTP date), and a
    # 429 with no usable hint still sets a minute.
    retryNotBefore:
      type: datetime
      writer: connector
      displayName: Retry not before
      description: "the instant Google's Retry-After allows the next call;
        while it is in the future no stream on this account is due"
    # --- contacts stream state ----------------------------------------------
    contactsSyncToken:
      type: string
      writer: connector
      displayName: Contacts sync token
      description: the People API sync token — stored each run so the next
        is incremental
    contactsLastSyncedAt:
      type: datetime
      writer: connector
      displayName: Contacts last synced
      description: when contacts last finished — this stream's own cadence
        anchor and first-run guard
    contactsSyncState:
      type: enum
      values:
        - value: "ok"
          label: "ok"
        - value: "pending"
          label: "pending"
        - value: "erroring"
          label: "erroring"
        - value: "disabled"
          label: "disabled"
      writer: connector
      displayName: Contacts sync state
      description: "this stream's own state; the sentence behind it is contactsSyncStatus.
        absent until this stream has run"
    contactsSyncStatus:
      type: string
      writer: connector
      displayName: Contacts sync status
      description: "this stream's own outcome, so a gmail or calendar failure
        can never hide a contacts one"
    # THE WORKSPACE DIRECTORY'S OWN CURSOR (T-031). The contacts stream walks
    # TWO endpoints into one kind — `people/me/connections` (the account's own
    # address book) and `people:listDirectoryPeople` (its Workspace
    # directory) — and two endpoints mean two sync tokens. They are separate
    # properties and never merged: spending one walk's token on the other's
    # request resumes a delta from a point that walk never reached.
    # THE CONTACTS WALK'S OWN CONTINUATION (T-023), and the reason it exists
    # is the reason `calendarPending` and `gmailBackfillResume` do: the engine
    # bounds a paged drain across the WHOLE chain, and a chain that crosses it
    # PARKS — one serial dispatcher, every other provider behind it. This
    # stream had no guard at all, and since T-031 it walks an address book AND
    # a Workspace directory per account.
    #
    # NO `writer: connector`. An OBJECT property's key set has no `writer`
    # (the apply refuses the closure with `unknown key "writer"`), which is
    # the same engine ask `gmailBackfillResume` carries.
    contactsResume:
      type: object
      writer: connector
      displayName: Contacts resume
      description: "the unfinished contacts walk this account resumes from:
        which stream, both page tokens, both sync tokens and the sweep evidence"
      fields:
        stream:
          type: string
          description: which walk was mid-flight, `connections` or `directory`;
            its presence is what marks a walk unfinished
        pageToken:
          type: string
          description: the people/me/connections page token the next run resumes
            at
        syncToken:
          type: string
          description: the connections sync token the interrupted walk was
            reading under, so the resumed walk covers the same delta
        connToken:
          type: string
          description: the connections token the walk had already minted and
            has not stamped, because the account is not finished
        dirPageToken:
          type: string
          description: the listDirectoryPeople page token the next run resumes
            at
        dirSyncToken:
          type: string
          description: the directory sync token the interrupted walk was reading
            under
        fullConnections:
          type: bool
          description: whether the connections walk was a full read — the
            sweep may only delete when both walks were
        fullDirectory:
          type: bool
          description: whether the directory walk was a full read
        records:
          type: int
          description: how many rows the unfinished walk has written, so the
            completed run reports the whole count
        seen:
          type: string
          repeated: true
          description: the row ids the unfinished walk has written, which
            a sweep spanning two runs needs to not delete the first run's
        seenOverflow:
          type: bool
          description: whether that set outgrew its cap — when true the sweep
            is skipped rather than run against a truncated snapshot
    contactsDirectorySyncToken:
      type: string
      writer: connector
      displayName: Directory sync token
      description: the People sync token for this account's Workspace directory
        walk, kept apart from the address book's
    contactsDirectoryState:
      type: enum
      values:
        - value: "ok"
          label: "ok"
        - value: "unavailable"
          label: "unavailable"
        - value: "needsreconsent"
          label: "needs reconsent"
      writer: connector
      displayName: Directory state
      description: "ok | unavailable (no Workspace directory) | needsreconsent
        (this grant predates the directory scope)"
    contactsDirectoryStatus:
      type: string
      writer: connector
      displayName: Directory status
      description: what the last directory walk did, or why it was skipped;
        a skipped directory never fails the contacts sync
    # --- gmail stream state -------------------------------------------------
    gmailHistoryId:
      type: string
      writer: connector
      displayName: Gmail history id
      description: the highest fully-drained Gmail historyId — the next run's
        incremental floor
    gmailBackfillAnchorAt:
      type: datetime
      writer: connector
      displayName: Gmail backfill anchor
      description: the run-start instant the first gmail sync stamped; backfillDepth
        reaches back from here
    # A KNOWN SHAPE IS NOT `json`. This was one `json` blob on the grounds
    # that connection state is nobody's business but the connector's, which
    # is not one of the three reasons §1 admits a `json` for: it is not
    # recursive, not heterogeneous, and not deeper than four levels. Every
    # field the two `_hold` helpers write is declared, so the state a drain
    # resumes from can be read, filtered and — when a walk wedges — reasoned
    # about without decoding a blob by hand.
    gmailBackfillResume:
      # `writer: connector` on an OBJECT: the loader admits the role on every
      # property shape (`objectPropKeys`, internal/vocabulary/load.go), so the
      # declared shape keeps the connector-only guard the `json` it replaced
      # had, and no editing surface offers a page token to the owner.
      type: object
      writer: connector
      displayName: Gmail backfill resume
      description: "the unfinished walk this account resumes from: the page
        token, its window and the evidence a sweep it still owes needs"
      fields:
        pageToken:
          type: string
          description: the `messages.list` page token the next run resumes
            the backfill walk at; absent when no query walk is owed
        historyToken:
          type: string
          description: the `history.list` page token the next run resumes
            the delta at; absent when no history continuation is owed
        floor:
          type: datetime
          description: the window floor the truncated walk was reading under,
            so the resumed walk covers the same window
        generation:
          type: string
          description: the walk generation the resumed run re-stamps rows
            under; the sweep compares against it
        historyId:
          type: string
          description: the run-start history watermark the walk belongs to,
            held back from the account until the walk completes
        sweep:
          type: bool
          description: whether a full-read sweep is still owed once the walk
            drains; cleared locally so a truncated walk never deletes
        seen:
          type: string
          repeated: true
          description: the row ids the unfinished walk has re-stamped, which
            a sweep spanning two runs needs to not delete the first run's
        seenOverflow:
          type: bool
          description: whether that set outgrew its cap — when true the sweep
            is skipped rather than run against a truncated snapshot
        maxHistoryId:
          type: string
          description: the highest historyId this walk actually read — the
            sweep's fence, because the run-start profile read is not the top
            of the mailbox (T-003)
        pending:
          type: string
          repeated: true
          description: "the message ids a page listed and the walk did not
            fetch before its fire ran out of time: no token can re-derive
            them, so they are parked here and hydrated first next run"
        back:
          type: string
          description: the phase the parked hydrates return to once they are
            fetched — `backfill`, `history` or `finish`
    gmailLastSyncedAt:
      type: datetime
      writer: connector
      displayName: Gmail last synced
      description: when the gmail stream last drained — this stream's own
        cadence anchor and first-run guard
    gmailSyncState:
      type: enum
      values:
        - value: "ok"
          label: "ok"
        - value: "pending"
          label: "pending"
        - value: "erroring"
          label: "erroring"
        - value: "disabled"
          label: "disabled"
      writer: connector
      displayName: Gmail sync state
      description: "this stream's own state; the sentence behind it is gmailSyncStatus.
        absent until this stream has run"
    gmailSyncStatus:
      type: string
      writer: connector
      displayName: Gmail sync status
      description: "this stream's own outcome, so a calendar failure can never
        hide a gmail one"
    # --- calendar stream state ----------------------------------------------
    # Per-calendar sync tokens do NOT live here, and they do not live on the
    # `calendar` MIRROR either: they live in `calendarsync`, one state row per
    # calendar, so one calendar's advance can never skip another's tail AND a
    # page of events never bumps the calendar row's version.
    calendarBackfillAnchorAt:
      type: datetime
      writer: connector
      displayName: Calendar backfill anchor
      description: the run-start instant the first calendar sync stamped;
        backfillDepth reaches back from here
    calendarLastSyncedAt:
      type: datetime
      writer: connector
      displayName: Calendar last synced
      description: when the calendar stream last drained — this stream's own
        cadence anchor and first-run guard
    calendarSyncState:
      type: enum
      values:
        - value: "ok"
          label: "ok"
        - value: "pending"
          label: "pending"
        - value: "erroring"
          label: "erroring"
        - value: "disabled"
          label: "disabled"
      writer: connector
      displayName: Calendar sync state
      description: "this stream's own state; the sentence behind it is calendarSyncStatus.
        absent until this stream has run"
    calendarSyncStatus:
      type: string
      writer: connector
      displayName: Calendar sync status
      description: "this stream's own outcome, so a gmail failure can never
        hide a calendar one"
    # --- drive stream state (T-088) -----------------------------------------
    # THE CURSOR IS DRIVE'S OWN: `changes.getStartPageToken` read at the START
    # of a walk (the way gmail reads the run-start `historyId`) and stamped
    # here only when the walk COMPLETES and owes nothing, so a file that
    # changes mid-walk falls inside the next delta rather than through the gap
    # a completion clock would open. The next run reads `changes.list` from
    # it and stamps the `newStartPageToken` the last page hands back.
    driveStartPageToken:
      type: string
      writer: connector
      displayName: Drive start page token
      description: the Drive changes token the last completed walk ended on
        — the next run's incremental floor
    driveBackfillAnchorAt:
      type: datetime
      writer: connector
      displayName: Drive backfill anchor
      description: the run-start instant the first drive sync stamped; backfillDepth
        reaches back from here on modifiedTime
    # NO `writer: connector`, for the reason `gmailBackfillResume` and
    # `contactsResume` have none: an OBJECT property's key set has no `writer`
    # (the apply refuses the closure with `unknown key "writer"`) — the same
    # engine ask, unchanged.
    driveResume:
      type: object
      writer: connector
      displayName: Drive resume
      description: "the unfinished drive walk this account resumes from: the
        page token or changes token, its window, the exports still owed and
        the evidence a sweep it still owes needs"
      fields:
        pageToken:
          type: string
          description: the `files.list` page token the next run resumes the
            cold walk at; absent when no listing walk is owed
        changesToken:
          type: string
          description: the `changes.list` page token the next run resumes
            the delta at; absent when no delta continuation is owed
        startPageToken:
          type: string
          description: the run-start changes token the walk belongs to, held
            back from the account until the walk completes
        floor:
          type: datetime
          description: the modifiedTime floor the truncated walk was reading
            under, so the resumed walk covers the same window
        sweep:
          type: bool
          description: whether a full-read sweep is still owed once the walk
            drains; cleared locally so a truncated walk never deletes
        seen:
          type: string
          repeated: true
          description: the row ids the unfinished walk has written, which
            a sweep spanning two runs needs to not delete the first run's
        seenOverflow:
          type: bool
          description: whether that set outgrew its cap — when true the sweep
            is skipped rather than run against a truncated snapshot
        pending:
          type: string
          repeated: true
          description: "the file ids a page listed whose exports the walk
            did not fetch before its fire ran out of time; exported first
            next run"
        back:
          type: string
          description: the phase the parked exports return to once they are
            fetched — `backfill`, `changes` or `finish`
        records:
          type: int
          description: how many rows the unfinished walk has written, so the
            completed run reports the whole count
    driveLastSyncedAt:
      type: datetime
      writer: connector
      displayName: Drive last synced
      description: when the drive stream last drained — this stream's own
        cadence anchor and first-run guard
    driveSyncState:
      type: enum
      values:
        - value: "ok"
          label: "ok"
        - value: "pending"
          label: "pending"
        - value: "erroring"
          label: "erroring"
        - value: "disabled"
          label: "disabled"
        # The grant predates the drive scope (a 403 ACCESS_TOKEN_SCOPE_
        # INSUFFICIENT on the first call): a missing consent, not an outage.
        # The other three streams sync on; this one says what it is owed.
        - value: "needsreconsent"
          label: "needs reconsent"
      writer: connector
      displayName: Drive sync state
      description: "this stream's own state; the sentence behind it is driveSyncStatus.
        absent until this stream has run"
    driveSyncStatus:
      type: string
      writer: connector
      displayName: Drive sync status
      description: "this stream's own outcome, so a gmail or calendar failure
        can never hide a drive one"
---
# ---- the hub: one address, and nothing else -------------------------------
# "IS THIS A REAL GOOGLE THING?" NO. Every other kind in this closure mirrors
# a published resource and is named for the product that publishes it —
# `calendarevent`, `calendarseries`, `gmailmessage`, `gmailthread`,
# `gmailattachment`, `calendar`, `contact`. `emailaddress` is the one kind
# that mirrors NOTHING: Google publishes no EmailAddress resource, there is no
# endpoint to read one from, and no payload arrives shaped like this row. It
# is OURS, and that is exactly why it takes no product prefix — a prefix would
# name a product, and this kind belongs to all three of them at once.
#
# It is the IDENTITY HUB. `docs/kind-design.md` §3 admits a kind the API does
# not name on one condition: the API uses a value as the identity of one party
# across several of its OWN resources. A mailbox address is that value, and
# the three products spell it in three places — a Gmail header (`From`, `To`,
# `Cc`), a Calendar attendee/organizer/creator, a People address-book entry.
# They are ONE identity, so they are one row, and every one of those relations
# is a reference at it. That is what makes "the person who mailed me" and "the
# person on my calendar" the same person: the mirrors converge here first, and
# `kinds/people` maps the hub onto a `person` once rather than three times.
#
# A HUB CARRIES THE IDENTITY ALONE. `address`, and nothing that varies per
# occurrence. The name a header spelled, the response an attendee gave, the
# `type` an address-book entry carried are LINK PROPERTIES on the reference
# that points here, because a hub row holding `displayName` is last-writer-
# wins: the name one sender spelled overwrites another's, silently, forever.
# Version 17 had exactly that bug, and `isOwner` beside it — an owner-relative
# flag, which a mirror never carries.
#
# A match probe reads a source's OWN values and never through a reference, so
# `address` is typed `email` and a person mapping probes it directly.
#
# THE NORMALISATION CONTRACT, one rule for all three streams, because the hub
# only converges if every stream composes the same id from the same mailbox:
# the DOMAIN is lowercased (DNS is case-insensitive, RFC 4343) and the LOCAL
# PART is left EXACTLY as the API spelled it (RFC 5321 §2.4 reserves its case
# for the receiving host, so lowercasing it is a rewrite of somebody else's
# identity). Surrounding whitespace is trimmed and nothing else is touched.
# The occurrence that names this row keeps the source spelling in its own
# `value`; a mailbox that does not parse is not written here at all and the
# reference it would have made is omitted (`docs/kind-design.md` §2).
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/google/emailaddress
data:
  authority: providers.substrate.reamde.dev
  package: google
  description: >-
    NOT a Google API object: Google publishes no EmailAddress resource and
    this kind mirrors none. It is OUR identity hub — one mailbox address,
    per account, shared by Gmail headers, Calendar attendees and People contacts,
    so all three reach ONE row. Hence no product prefix: it belongs to all
    three. No envelope, no sibling call, no instant, no trait; the address
    alone.
  purpose: supporting
  names:
    singular: emailaddress
  displayTemplate: "{address}"
  properties:
    # --- identity -----------------------------------------------------------
    account:
      type: reference
      kind: providers.substrate.reamde.dev/google/account
      required: true
      onDelete: cascade
      displayName: Account
      description: the account this address was first seen through
    # `email`-kind, and the syncs only ever write a value that parses as an
    # RFC 5322 mailbox: one malformed header must not fail a whole page.
    address:
      type: email
      required: true
      displayName: Address
      description: >-
        the mailbox in normal form — trimmed, DOMAIN lowercased, LOCAL PART
        as the API spelled it. The key behind this row's id and what a person
        mapping probes; a value that does not parse mints no row.
---
# ---- the contacts mirror: one People `Person` -----------------------------
# THE WHOLE RESOURCE, declared, from People API v1 (discovery revision
# 20260914). Every array the `Person` carries is a typed OBJECT with the
# entry's own fields and its `metadata` — `names`, `birthdays` (whose `date`
# is three OPTIONAL integers, never a civil date), `organizations`,
# `memberships`, `userDefined`, all of them. Version 17 dropped `birthdays`
# and `metadata` into `json` and lifted `displayName` and `emails` out of two
# of the others; all four are gone.
#
# A DECLARED DESCRIPTION IS A TOOLTIP (the loader holds one to 200 characters,
# a kind's to 400), so the long form lives HERE, in the comments, which is
# where the dialect says it belongs.
#
# EVERY SCHEMA-CLOSED SET IS AN ENUM (`docs/kind-design.md` §2), spelled by
# the one rule the loader admits — lowercase the API's value, drop `_` — with
# Google's exact spelling as each value's `label`, so the MAP IS THE
# DECLARATION. Nine sites, seven families: `ageRange` and
# `ageRanges[].ageRange` (AgeRange), `biographies[].contentType`
# (ContentType), `nicknames[].type` (Nickname.Type), `miscKeywords[].type`
# (MiscKeyword.Type), EVERY entry's `metadata.source.type` and the Person's
# `metadata.sources[].type` (SourceType), `metadata.objectType` and
# `metadata.sources[].profileMetadata.objectType` (ObjectType), and
# `...profileMetadata.userTypes[]` (UserType). The sync normalises Google's
# uppercase wire value onto the enum's spelling through ONE shared
# normaliser before it writes, and a value none of these sets holds is left
# ABSENT and NAMED on the account's `contactsSyncStatus` — never nulled,
# never silently dropped, and never a refused page: a widening at Google is
# not an outage, but it is not invisible either.
#
# TWO OMISSIONS, each a class, and the list is one shorter than version 18's:
#   1. the five fields Google documents as permanently empty
#      (`braggingRights`, `relationshipInterests`, `relationshipStatuses`,
#      `residences`, `taglines` — each marked "**DEPRECATED**: No data will
#      be returned"). A read mask naming one is a request for nothing. This
#      is the omission class `docs/kind-design.md` does not yet have a name
#      for; the README proposes it. `ageRange` USED to be the sixth and is
#      NOT: its discovery description says to prefer `ageRanges`, not that no
#      data is returned, so it is declared below like any other field;
#   2. an ENTRY's `metadata.source.profileMetadata`, a fifth nesting level
#      the dialect refuses (README, ask 3). People documents that subtree —
#      with `source.etag` and `source.updateTime` — as populated ONLY in
#      `person.metadata.sources`, where this kind declares it in full, so the
#      omission loses no data that Google ever sends.
# The constant discriminator `metadata.objectType` is DECLARED, as a
# three-value enum. Version 18's description claimed it was omitted while
# declaring it, and claimed six permanently-empty omissions; both were wrong.
#
# `emailAddresses` CARRIES A REFERENCE at the `emailaddress` hub, with the
# entry's own `value`, `type`, `formattedType`, `displayName` and `metadata`
# beside it — which is what puts an address-book entry, a mail sender and a
# meeting attendee on one row without a hub property that last-writer-wins.
# The entry's `value` stays: it is the API's OWN field, and a match probe
# reads a source's own values (`emailAddresses[].value`) and never through a
# reference, so `kinds/people/mappings.google.yaml` probes it directly.
# `docs/kind-design.md` §2 prescribes exactly this pair; the review's §3.1
# argues it is a duplicate identity and the proposed guide amendment is in
# this branch's report rather than applied unilaterally here.
#
# THE MAILBOX NORMALISATION CONTRACT, stated once for all three streams: the
# DOMAIN is lowercased (DNS is case-insensitive) and the LOCAL PART is left
# exactly as Google spelled it (RFC 5321 §2.4 reserves its case for the
# receiving host). The hub row's `address` and this bundle's address ids are
# that normal form; an entry's `value` is the source spelling verbatim. A
# value that does not parse is not written as an identity, mints no hub row,
# and is reported BY FIELD — never by value — on the stream's status.
#
# PROPERTY ORDER is `docs/kind-design.md` §5's five groups, each under its own
# comment: identity; the object's own fields in the People reference's order
# (which is alphabetical after `metadata`); relations; instants; sibling-call
# fields. The last two are empty and say why.
#
# NOT DONE, and deliberately: `memberships[].contactGroupMembership` stays
# the API's two strings rather than a reference, because a `contactgroup`
# kind's own fields need a `contactGroups.list` call this bundle does not
# make; and a contact with more than 100 emails or phones is mirrored short,
# because completing it needs a `people.get` hydration. Both are named on the
# properties they affect.
#
# Its id is derived from the provider key — ids.external("google-contacts",
# account, resourceName) — because a People resource name is unique per
# ADDRESS BOOK, not globally.
#
# TWO ENDPOINTS, ONE KIND (T-031). A Workspace account keeps its colleagues in
# the DOMAIN DIRECTORY and not in `myContacts`, so the owner's work account
# answered `people/me/connections` with ZERO people and not one colleague had
# a Google contact. `people:listDirectoryPeople` returns the SAME `Person`
# resource, with the same `people/<id>` resource name, so it is mirrored into
# THIS kind rather than a second one: a directory person IS a contact. That is
# also why a colleague who is both a saved contact and a directory entry is
# ONE record — one resourceName composes one row id, and the second write is
# an update, not a duplicate.
#
# The discriminator is already on the record and nothing new declares it:
# `metadata.sources[].type` is `CONTACT` for the address book and
# `DOMAIN_PROFILE` / `DOMAIN_CONTACT` / `PROFILE` for the directory, so "who
# is a colleague" is a question the stored record answers. No `isDirectory`
# flag: that would be a derived property (`docs/kind-design.md` §1) computed
# from a field this row already carries.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/google/contact
data:
  authority: providers.substrate.reamde.dev
  package: google
  description: >-
    Any People v1 Person this account can see — its address book (people.connections.list)
    or its Workspace directory (people:listDirectoryPeople): one kind, one
    row per resourceName, metadata.sources[].type saying which. Arrays are
    occurrence objects, closed sets enums, addresses reference the emailaddress
    hub. Omits the envelope, the five permanently-empty fields and source.profileMetadata.
  names:
    singular: contact
  # The first name entry's display name, falling back to the People resource
  # name — a contact's title was `people/c1234…` until T-026's engine build
  # taught templates the `a[].b` array walk.
  displayTemplate: "{names[].displayName|resourceName}"
  properties:
    # --- identity -----------------------------------------------------------
    # The account this contact belongs to: `onDelete: cascade` is what makes
    # disconnecting the account collect the contacts it synced.
    account:
      type: reference
      kind: providers.substrate.reamde.dev/google/account
      required: true
      onDelete: cascade
      displayName: Account
      description: >-
        the account this contact was synced from — the one property here that
        is not the API's. Always written.
    resourceName:
      type: string
      required: true
      displayName: Resource name
      description: >-
        `resourceName` — Google's People resource name, e.g. people/c123.
        Unique per ADDRESS BOOK, not globally, which is why the account is
        part of this row's composed id.
    etag:
      type: string
      displayName: ETag
      description: >-
        `etag` — the Person's entity tag, Google's concurrency token for this
        contact. Absent when the payload carried none.
    # --- the object's own fields, in the People reference's order ------------
    # The People reference lists a Person's fields alphabetically after
    # `metadata`, so this IS the API's order. `emailAddresses` and `metadata`
    # hold references and are declared with the relations below. Every array
    # is an OCCURRENCE object: the same value can appear twice from two
    # sources, and each entry carries a nested `metadata` that neither a link
    # property nor a flat lift can hold.
    addresses:
      type: object
      repeated: true
      displayName: Addresses
      description: >-
        the People `addresses` array — one postal address each, structured
        and formatted. Empty writes empty; an absent key leaves it untouched.
      fields:
        formattedValue:
          type: string
          description: >-
            `formattedValue` — the unstructured address; Google composes it
            from the structured fields when the owner set none.
        type:
          type: string
          description: >-
            `type` — how the owner labelled it: `home`, `work`, `other`, or
            a custom word. People does not close the set (a custom word is
            legal), so it is a `string`.
        formattedType:
          type: string
          description: >-
            `formattedType` — Output only. the address type, formatted for
            the viewer's locale; absent when Google sent none.
        poBox:
          type: string
          description: >-
            `poBox` — the P.O. box of the address.
        streetAddress:
          type: string
          description: >-
            `streetAddress` — the street address.
        extendedAddress:
          type: string
          description: >-
            `extendedAddress` — the second line, e.g. an apartment number.
        city:
          type: string
          description: >-
            `city` — the city of the address.
        region:
          type: string
          description: >-
            `region` — the state, province or region.
        postalCode:
          type: string
          description: >-
            `postalCode` — the postal code.
        country:
          type: string
          description: >-
            `country` — the country, as text.
        countryCode:
          type: string
          description: >-
            `countryCode` — the ISO 3166-1 alpha-2 country code.
        metadata:
          type: object
          description: >-
            `metadata` (FieldMetadata) — which source this address came from
            and whether it is primary. Absent when the payload carried none;
            a `false` flag is written as false.
          fields:
            primary:
              type: bool
              description: >-
                `primary` — Output only. True when this is the primary entry
                of its kind across ALL the person's sources; false is written,
                absent stays absent.
            sourcePrimary:
              type: bool
              description: >-
                `sourcePrimary` — true when this is the primary entry for
                its OWN source; false is written, absent stays absent.
            verified:
              type: bool
              description: >-
                `verified` — Output only. Whether Google verified the value;
                false is written, absent stays absent.
            source:
              type: object
              description: >-
                `source` (Source) — the record this entry came from. People
                fills `etag`, `updateTime` and `profileMetadata` ONLY in `metadata.sources`,
                so here those are always absent.
              fields:
                type:
                  type: enum
                  values:
                    - value: sourcetypeunspecified
                      label: SOURCE_TYPE_UNSPECIFIED
                    - value: account
                      label: ACCOUNT
                    - value: profile
                      label: PROFILE
                    - value: domainprofile
                      label: DOMAIN_PROFILE
                    - value: contact
                      label: CONTACT
                    - value: othercontact
                      label: OTHER_CONTACT
                    - value: domaincontact
                      label: DOMAIN_CONTACT
                  description: >-
                    `source.type` (SourceType) — which record this value came
                    from, lowercased, `_` dropped; the labels are the map;
                    unknown values are absent and named on contactsSyncStatus.
                id:
                  type: string
                  description: >-
                    `source.id` — the identifier the source generated; absent
                    on a source that carries none.
                etag:
                  type: string
                  description: >-
                    `source.etag` — the source's entity tag. People fills
                    it only in `metadata.sources`, so it is absent here.
                updateTime:
                  type: datetime
                  description: >-
                    `source.updateTime` — when the source last changed. People
                    fills it only in `metadata.sources`, so it is absent here.
    # THE DEPRECATED SCALAR, DECLARED rather than omitted. Google's discovery
    # description says to PREFER `ageRanges`; it does not say no data is
    # returned, so the permanently-empty omission class does not reach it and
    # the field is declared like any other. It is absent from the connections
    # endpoint's personFields vocabulary, so the mask cannot request it; the
    # sync copies it if Google ever volunteers it.
    ageRange:
      type: enum
      values:
        - value: agerangeunspecified
          label: AGE_RANGE_UNSPECIFIED
        - value: lessthaneighteen
          label: LESS_THAN_EIGHTEEN
        - value: eighteentotwenty
          label: EIGHTEEN_TO_TWENTY
        - value: twentyoneorolder
          label: TWENTY_ONE_OR_OLDER
      description: >-
        `ageRange` (AgeRange) — **DEPRECATED** for `ageRanges`; the coarse
        age bucket, lowercased, `_` dropped; the labels are the map. No field
        mask can ask for it.
      displayName: Age range
    ageRanges:
      type: object
      repeated: true
      displayName: Age ranges
      description: >-
        the People `ageRanges` array — Google's coarse age bucket, one entry
        per source. Empty writes empty; an absent key leaves it untouched.
      fields:
        ageRange:
          type: enum
          values:
            - value: agerangeunspecified
              label: AGE_RANGE_UNSPECIFIED
            - value: lessthaneighteen
              label: LESS_THAN_EIGHTEEN
            - value: eighteentotwenty
              label: EIGHTEEN_TO_TWENTY
            - value: twentyoneorolder
              label: TWENTY_ONE_OR_OLDER
          description: >-
            `ageRange` (AgeRange) — the bucket this source reports, lowercased,
            `_` dropped; the labels are the map; unknown values are absent
            and named on contactsSyncStatus.
        metadata:
          type: object
          description: >-
            `metadata` (FieldMetadata) — which source this age range came
            from and whether it is primary. Absent when the payload carried
            none; a `false` flag is written as false.
          fields:
            primary:
              type: bool
              description: >-
                `primary` — Output only. True when this is the primary entry
                of its kind across ALL the person's sources; false is written,
                absent stays absent.
            sourcePrimary:
              type: bool
              description: >-
                `sourcePrimary` — true when this is the primary entry for
                its OWN source; false is written, absent stays absent.
            verified:
              type: bool
              description: >-
                `verified` — Output only. Whether Google verified the value;
                false is written, absent stays absent.
            source:
              type: object
              description: >-
                `source` (Source) — the record this entry came from. People
                fills `etag`, `updateTime` and `profileMetadata` ONLY in `metadata.sources`,
                so here those are always absent.
              fields:
                type:
                  type: enum
                  values:
                    - value: sourcetypeunspecified
                      label: SOURCE_TYPE_UNSPECIFIED
                    - value: account
                      label: ACCOUNT
                    - value: profile
                      label: PROFILE
                    - value: domainprofile
                      label: DOMAIN_PROFILE
                    - value: contact
                      label: CONTACT
                    - value: othercontact
                      label: OTHER_CONTACT
                    - value: domaincontact
                      label: DOMAIN_CONTACT
                  description: >-
                    `source.type` (SourceType) — which record this value came
                    from, lowercased, `_` dropped; the labels are the map;
                    unknown values are absent and named on contactsSyncStatus.
                id:
                  type: string
                  description: >-
                    `source.id` — the identifier the source generated; absent
                    on a source that carries none.
                etag:
                  type: string
                  description: >-
                    `source.etag` — the source's entity tag. People fills
                    it only in `metadata.sources`, so it is absent here.
                updateTime:
                  type: datetime
                  description: >-
                    `source.updateTime` — when the source last changed. People
                    fills it only in `metadata.sources`, so it is absent here.
    biographies:
      type: object
      repeated: true
      displayName: Biographies
      description: >-
        the People `biographies` array — the contact's about text. Empty writes
        empty; an absent key leaves it untouched.
      fields:
        value:
          type: text
          description: >-
            `value` — the short biography. Prose, so `text` and not a one-line
            `string`.
        contentType:
          type: enum
          values:
            - value: contenttypeunspecified
              label: CONTENT_TYPE_UNSPECIFIED
            - value: textplain
              label: TEXT_PLAIN
            - value: texthtml
              label: TEXT_HTML
          description: >-
            `contentType` (ContentType) — how `value` is encoded, lowercased,
            `_` dropped; the labels are the map; unknown values are absent
            and named on contactsSyncStatus.
        metadata:
          type: object
          description: >-
            `metadata` (FieldMetadata) — which source this biography came
            from and whether it is primary. Absent when the payload carried
            none; a `false` flag is written as false.
          fields:
            primary:
              type: bool
              description: >-
                `primary` — Output only. True when this is the primary entry
                of its kind across ALL the person's sources; false is written,
                absent stays absent.
            sourcePrimary:
              type: bool
              description: >-
                `sourcePrimary` — true when this is the primary entry for
                its OWN source; false is written, absent stays absent.
            verified:
              type: bool
              description: >-
                `verified` — Output only. Whether Google verified the value;
                false is written, absent stays absent.
            source:
              type: object
              description: >-
                `source` (Source) — the record this entry came from. People
                fills `etag`, `updateTime` and `profileMetadata` ONLY in `metadata.sources`,
                so here those are always absent.
              fields:
                type:
                  type: enum
                  values:
                    - value: sourcetypeunspecified
                      label: SOURCE_TYPE_UNSPECIFIED
                    - value: account
                      label: ACCOUNT
                    - value: profile
                      label: PROFILE
                    - value: domainprofile
                      label: DOMAIN_PROFILE
                    - value: contact
                      label: CONTACT
                    - value: othercontact
                      label: OTHER_CONTACT
                    - value: domaincontact
                      label: DOMAIN_CONTACT
                  description: >-
                    `source.type` (SourceType) — which record this value came
                    from, lowercased, `_` dropped; the labels are the map;
                    unknown values are absent and named on contactsSyncStatus.
                id:
                  type: string
                  description: >-
                    `source.id` — the identifier the source generated; absent
                    on a source that carries none.
                etag:
                  type: string
                  description: >-
                    `source.etag` — the source's entity tag. People fills
                    it only in `metadata.sources`, so it is absent here.
                updateTime:
                  type: datetime
                  description: >-
                    `source.updateTime` — when the source last changed. People
                    fills it only in `metadata.sources`, so it is absent here.
    birthdays:
      type: object
      repeated: true
      displayName: Birthdays
      description: >-
        the People `birthdays` array — the birthday, as a structured date,
        free text, or both. Empty writes empty; an absent key leaves it untouched.
      fields:
        text:
          type: string
          description: >-
            `text` — the birthday as free-form text. Google does not validate
            it and says to prefer `date` when both are set.
        date:
          type: object
          description: >-
            `date` (Date) — the structured birthday. Three OPTIONAL integers,
            any absent and `0` meaning 'deliberately unstated', which is why
            it is not a `date`.
          fields:
            year:
              type: int
              description: >-
                `year` — 1 to 9999, or 0 for a date with no year; absent when
                Google sent none.
            month:
              type: int
              description: >-
                `month` — 1 to 12, or 0 for a year with no month; absent when
                Google sent none.
            day:
              type: int
              description: >-
                `day` — 1 to 31, or 0 where the day is not significant; absent
                when Google sent none.
        metadata:
          type: object
          description: >-
            `metadata` (FieldMetadata) — which source this birthday came from
            and whether it is primary. Absent when the payload carried none;
            a `false` flag is written as false.
          fields:
            primary:
              type: bool
              description: >-
                `primary` — Output only. True when this is the primary entry
                of its kind across ALL the person's sources; false is written,
                absent stays absent.
            sourcePrimary:
              type: bool
              description: >-
                `sourcePrimary` — true when this is the primary entry for
                its OWN source; false is written, absent stays absent.
            verified:
              type: bool
              description: >-
                `verified` — Output only. Whether Google verified the value;
                false is written, absent stays absent.
            source:
              type: object
              description: >-
                `source` (Source) — the record this entry came from. People
                fills `etag`, `updateTime` and `profileMetadata` ONLY in `metadata.sources`,
                so here those are always absent.
              fields:
                type:
                  type: enum
                  values:
                    - value: sourcetypeunspecified
                      label: SOURCE_TYPE_UNSPECIFIED
                    - value: account
                      label: ACCOUNT
                    - value: profile
                      label: PROFILE
                    - value: domainprofile
                      label: DOMAIN_PROFILE
                    - value: contact
                      label: CONTACT
                    - value: othercontact
                      label: OTHER_CONTACT
                    - value: domaincontact
                      label: DOMAIN_CONTACT
                  description: >-
                    `source.type` (SourceType) — which record this value came
                    from, lowercased, `_` dropped; the labels are the map;
                    unknown values are absent and named on contactsSyncStatus.
                id:
                  type: string
                  description: >-
                    `source.id` — the identifier the source generated; absent
                    on a source that carries none.
                etag:
                  type: string
                  description: >-
                    `source.etag` — the source's entity tag. People fills
                    it only in `metadata.sources`, so it is absent here.
                updateTime:
                  type: datetime
                  description: >-
                    `source.updateTime` — when the source last changed. People
                    fills it only in `metadata.sources`, so it is absent here.
    calendarUrls:
      type: object
      repeated: true
      displayName: Calendar URLs
      description: >-
        the People `calendarUrls` array — a calendar the contact published.
        Empty writes empty; an absent key leaves it untouched.
      fields:
        url:
          type: string
          description: >-
            `url` — the calendar's address AS THE OWNER TYPED IT, which is
            why it is a `string`: People neither validates nor absolutises
            it.
        type:
          type: string
          description: >-
            `type` — `home`, `freeBusy`, `work`, or a custom word. People
            does not close the set (a custom word is legal), so it is a `string`.
        formattedType:
          type: string
          description: >-
            `formattedType` — Output only. the calendar URL type, formatted
            for the viewer's locale; absent when Google sent none.
        metadata:
          type: object
          description: >-
            `metadata` (FieldMetadata) — which source this calendar URL came
            from and whether it is primary. Absent when the payload carried
            none; a `false` flag is written as false.
          fields:
            primary:
              type: bool
              description: >-
                `primary` — Output only. True when this is the primary entry
                of its kind across ALL the person's sources; false is written,
                absent stays absent.
            sourcePrimary:
              type: bool
