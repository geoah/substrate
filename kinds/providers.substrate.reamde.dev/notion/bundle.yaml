# ---- mirror: one page -----------------------------------------------------
# /v1/search and GET /v1/pages/{id} (2025-09-03). A page is a page OR a row of
# a data source: Notion gives both the same object, the same endpoint and the
# same identity namespace, and §3's "two endpoints returning one resource are
# one kind" is the same argument a step further — one endpoint, one resource,
# whatever it is a child of. `parent.type` is the discriminator the payload
# already carries, so there is no `isRow` scalar (that would be derived, §1).
#
# THE SYNC NEVER CALLS GET /v1/pages/{id}. 595 of 595 addressed reads in the
# owner's pull are byte-identical to the search item (`request_id` aside), so
# search is AUTHORITATIVE and the hydration would be 17,000 calls for nothing.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/notion/page
data:
  authority: providers.substrate.reamde.dev
  package: notion
  description: >-
    One Notion page — which is also how Notion models a row of a data source;
    `parent.type` says which — as /v1/search returns it (2025-09-03). Search
    is byte-identical to GET /v1/pages/{id} in every pair observed, so this
    bundle never makes that call and an omitted property is left absent rather
    than nulled. `at` is `created_time`; the response envelope (request_id)
    is omitted.
