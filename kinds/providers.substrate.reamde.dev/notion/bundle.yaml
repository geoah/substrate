# The Notion bundle — a SYNC-ONLY mirror of one Notion workspace, new in
# Mneme v6 (T-016). It reads; it never creates, updates, archives or comments.
#
# Written to `docs/kind-design.md` v4 and `docs/provider-practices.md` v1.
# What that costs, spelled out, because each of these is a decision somebody
# will want to re-open:
#
#   * A KIND IS THE OBJECT, COMPLETE. Every documented field of every object
#     is a top-level property under the API's name camelCased. TWO classes are
#     omitted, as classes, and every kind's description names them: the
#     RESPONSE ENVELOPE (`request_id` on every object, and a list response's
#     `object: list` / `results` / `next_cursor` / `has_more` / `type` /
#     `block` / `user`), and HYPERMEDIA — of which Notion has none, so the
#     class is named and empty. There is no `raw`.
#
#   * RICH TEXT IS KEPT AS NOTION SENDS IT. A rich-text array is heterogeneous
#     by discriminator twice over — `type` selects `text` | `mention` |
#     `equation`, and `mention.type` selects seven more shapes, one of which
#     embeds a whole user object — so it is `json`, which is exactly what §2's
#     table says for Block Kit and a MIME tree. Beside each one rides a
#     PLAIN-TEXT decode (`titlePlainText`, `plainText`): Notion itself puts
#     `plain_text` on every span, so concatenating them in order is the
#     lossless mechanical decode of §1's first exception, declared beside the
#     encoded source because the decode drops annotations and links. `block`'s
#     is additionally the ONE labelled `DERIVED` index of §1's third
#     exception, and it is the only property in this bundle with `embed: true`.
#
#   * A PAGE'S `properties` IS `json`, AND THAT IS THE RULE, NOT AN ESCAPE.
#     The map is keyed by the workspace's own property NAMES, and its values
#     are a 25-variant union discriminated by `type` — one of which, `rollup`,
#     carries an ARRAY OF PROPERTY VALUES and so is recursive. Recursive,
#     heterogeneous, and keyed by words no dialect can spell: §1 admits `json`
#     for exactly this and the kind's description says why.
#
#   * A BLOCK DECLARES THE UNION OF EVERY BLOCK TYPE, one optional property
#     each, the way `slack/message` declares the union of every subtype's
#     fields. Each is `json`, because each carries rich text and the loader
#     refuses `json` as an object FIELD (record 49) — so a typed object could
#     not hold the one thing every block type has.
#
#   * EVERY RELATION IS A REFERENCE. `createdBy` / `lastEditedBy` at `user`;
#     `parent` an object whose `pageId` / `databaseId` / `dataSourceId` /
#     `blockId` fields are references; `database.dataSources` a repeated
#     reference at `datasource`. No parent reference is `mustExist`: Notion's
#     graph is walked in one descending pass and a parent may land after its
#     child, exactly as a Slack `thread_ts` may name a message the drain has
#     not reached (§2). No scalar doubles a reference.
#
#   * NO CONSUMER SLOT, NO OWNER-RELATIVE FLAG, NO SYNC BOOKKEEPING ON A
#     MIRROR. The engine synthesises a mapping's subject slot (#570); "mine"
#     is a filter on `account.user`; the stream cursors live on the account
#     and the per-PAGE block cursor lives on `notion/pagesync`, so a page of
#     blocks never bumps the page's version.
#
# WHY A PASTED INTEGRATION TOKEN AND NOT `oauth2:`. A Notion INTERNAL
# integration has no consent flow at all: the owner creates it in the
# workspace's settings and it hands back an `ntn_…` token that addresses that
# one workspace. (Notion's public-integration OAuth exists, exchanges at
# `/v1/oauth/token` under HTTP BASIC auth rather than a client_secret POST
# body, and the host facility cannot express that — `docs/provider-practices.md`
# §7.) So: no `oauth2:` block, a token on the config record, and one account
# per workspace.
#
# WHY THE TOKEN LIVES ON THE CONFIG AND NOT THE ACCOUNT: the engine seals
# every secret-typed property of an accountconfig-trait kind at rest and the
# runner injects account properties AS STORED, so a token pasted on the
# account reaches this body as ciphertext. An injected input's secret arrives
# usable.
#
# API VERSION 2025-09-03, the data-source model, and it is load-bearing.
# Under the older 2022-06-28 pin a database that grows a SECOND data source
# disappears from `/v1/search` entirely, so the mirror would silently lose
# whole databases. Under 2025-09-03 search returns one `data_source` object
# per source, each naming its database.
#
# NOTHING HYDRATES A PAGE, AND THE CLAIM BEHIND THAT IS BOUNDED. 595 of 595
# addressed `GET /v1/pages/{id}` reads and 2 of 2 `GET /v1/data_sources/{id}`
# reads in the owner's pull are byte-identical to the object the same search
# walk returned (`request_id` aside), so the second call buys nothing and this
# bundle does not make it — 17,000 requests it does not spend. That is an
# OBSERVATION over one corpus and not an API contract, so no payload here is
# AUTHORITATIVE in §1's sense: a property a response omits is left ABSENT,
# never written null. (The first cut of this bundle claimed otherwise; Codex
# finding 11 was right that corpus equality cannot license a null.)
#
# Install:   substratectl apply -f bundle.yaml -f triggers.yaml
# Configure: create a config record with the pasted integration token.
# Connect:   create an account with enabledPages true.
# ---- the owned package ----------------------------------------------------
kind: substrate.reamde.dev/core/package
metadata:
  id: providers.substrate.reamde.dev/notion
data:
  authority: providers.substrate.reamde.dev
  package: notion
  # 11 — the account binds substrate's core `sync` trait (decision 0085) and
  # the sync body writes its twelve properties beside the ad hoc ones, so the
  # Connections page, `GET /api/v1/sync/status` and `substratectl sync status`
  # render this bundle without knowing it (T-084). ADDITIVE: every legacy
  # property stays, at its own name and type.
  # 3 — the block queue REFILLS inside a round, so a backlog longer than
  # MAX_PENDING no longer loses its tail to the end of the round (T-054).
  # 2 keyed the backfill floor on the depth that produced it, so a widened
  # `backfillDepth` reaches the walk and `all` means NO floor (T-045). 1 was
  # the first cut, written to the v4 guide rather than migrated from a
  # pre-guide draft. A changed declaration shipping the same version reaches
  # no repository, so every edit from here bumps this.
  version: 11
---
# ---- the bundle document: the install unit --------------------------------
# NO `oauth2:` block: an oauth2 block demands a client input wearing the
# oauth2 trait, the loader holds the two paired both ways, and this bundle
# authenticates with a pasted internal-integration token.
kind: substrate.reamde.dev/core/bundle
metadata:
  id: providers.substrate.reamde.dev/notion
data:
  authority: providers.substrate.reamde.dev
  package: notion
  description: >-
    Keeps a copy of one Notion workspace — its people, its pages, its databases
    and data sources, and the blocks the pages are made of. It takes a pasted
    integration token, and cannot write.
  inputs:
    connector:
      kind: providers.substrate.reamde.dev/notion/config
      inject: functions
      description: the pasted Notion integration token and the pinned API
        origin
  installs:
    - providers.substrate.reamde.dev/notion/config
    - providers.substrate.reamde.dev/notion/account
    - providers.substrate.reamde.dev/notion/user
    - providers.substrate.reamde.dev/notion/database
    - providers.substrate.reamde.dev/notion/datasource
    - providers.substrate.reamde.dev/notion/page
    - providers.substrate.reamde.dev/notion/block
    - providers.substrate.reamde.dev/notion/pagesync
    - providers.substrate.reamde.dev/notion/notionsync
---
# ---- the config type: the `connector` input's kind -------------------------
# NOT oauth2, and it deliberately carries no client id or secret: a kind
# wearing the oauth2 trait holds the client pair and NOTHING ELSE, so parking
# client credentials here is the one move that would make an eventual OAuth
# revision impossible.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/notion/config
data:
  authority: providers.substrate.reamde.dev
  package: notion
  description: >-
    The Notion integration token this bundle spends and the API origin it
    may be sent to. The bundle's connector input resolves one record of this
    kind; the token is sealed against read-back and the origin is pinned,
    so an owner edit cannot become an exfiltration channel.
  names:
    singular: config
  displayTemplate: Notion connection
  properties:
    integrationToken:
      type: secret
      writer: owner
      displayName: Integration token
      description: >-
        the pasted Notion integration token (ntn_…). It addresses exactly
        one workspace. Redacted on read, injected only into the sync body
    apiBase:
      type: url
      writer: owner
      # The body PINS the origin the token may travel to: https on
      # api.notion.com, or a loopback host as the test seam.
      displayName: API base URL
      description: >-
        test-only override of https://api.notion.com — loopback hosts only;
        any other origin refuses to sync. Leave empty in production
---
# ---- the account type: one connected workspace ----------------------------
# accountconfig WITHOUT oauth2. The trait contracts tokenRef / tokenStatus /
# grantedScopes onto every implementing kind, so they are declared below as
# DORMANT: `writer: oauth` means only the OAuth facility may ever set them,
# and no flow runs for this bundle.
#
# THIS IS NOT A MIRROR. It is the connection: the owner's toggles, who the
# token turned out to be, and the connector's own per-STREAM state. What it
# learned from `users/me` it holds as a REFERENCE — `user` — rather than as a
# copy of the bot's name or the workspace's, because that row is mirrored and
# a copy of a referent is a derived property (§1).
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/notion/account
data:
  authority: providers.substrate.reamde.dev
  package: notion
  description: >-
    One connected Notion workspace: the owner's sync toggles, the integration
    user the token turned out to be, and the connector's own per-stream progress.
    The accountconfig trait's OAuth hands are declared but stay dormant, since
    no OAuth flow ever runs for this bundle.
  names:
    singular: account
  # `sync` is the core trait the Connections page, `GET /api/v1/sync/status`
  # and `substratectl sync status` read (substrate decision 0085): the sync
  # body writes its twelve properties beside the ad hoc `syncStatus` /
  # `syncPending` / `syncCursors` below, and the dispatcher stamps a
  # record-sourced delivery's start, finish and park onto the same record.
  # The two OWNER hands are `syncRequestedAt` ("sync now") and `syncPaused`
  # ("pause"); the other ten are the connector's.
  traits: [accountconfig, sync]
  displayTemplate: "{displayName|user.name}"
  properties:
    # ---- the accountconfig trait's contracted properties — DORMANT here ---
    tokenRef:
      type: secret
      writer: oauth
      displayName: Token reference
      description: >-
        accountconfig trait contract — unused: the pasted token lives on the
        bundle config, and no OAuth flow runs
    tokenStatus:
      type: string
      writer: oauth
      displayName: Connection status
      description: >-
        accountconfig trait contract — unused: no OAuth flow ever reports
        a status here. Connection health reads off syncStatus
    grantedScopes:
      type: string
      repeated: true
      writer: oauth
      displayName: Granted scopes
      description: >-
        accountconfig trait contract — unused: no consent, no scopes. What
        the token can do is the capabilities it was minted with
    # ---- what the owner asked for ----------------------------------------
    displayName:
      type: string
      writer: owner
      displayName: Name
      description: a name for this connection, shown wherever the account
        is listed
    enabledPages:
      type: bool
      writer: owner
      displayName: Pages
      description: >-
        sync this workspace's people, pages, data sources and databases —
        one toggle, because a page is meaningless without the person who wrote
        it and the data source it is a row of
    enabledBlocks:
      type: bool
      writer: owner
      displayName: Page content
      description: >-
        also walk each page's block tree. Off by default: it is at least one
        API call per page and a workspace has far more pages than databases
    syncFrequency:
      type: enum
      values:
        - value: "off"
          label: Off
        - value: hourly
          label: Every hour
        - value: daily
          label: Once a day
      required: true
      default: hourly
      writer: owner
      displayName: Sync frequency
      description: the scheduled sync cadence for this account (default hourly)
    backfillDepth:
      type: enum
      values:
        - value: none
          label: Don't backfill
        - value: last30d
          label: Last 30 days
        - value: last90d
          label: Last 90 days
        - value: last1y
          label: Last year
        - value: all
          label: Everything
      required: true
      default: last90d
      writer: owner
      displayName: Backfill depth
      description: >-
        how far back the search walk reaches, against each object's last_edited_time
        (default 90 days). `all` is NO floor; `none` is from the run that
        set it forward; changing it re-anchors the stored floor
    syncRequestedAt:
      type: datetime
      writer: owner
      displayName: Sync requested
      description: >-
        stamp this with the current time to ask for a sync now, whatever the
        cadence says. It is also how a bounded drain is continued
    # ---- who the token turned out to be -----------------------------------
    user:
      type: reference
      kind: user
      displayName: You
      description: >-
        the integration user this token authenticates as, from GET /v1/users/me
        — "me", and what every owner-relative question filters on. The row
        lands in the same drain, so no mustExist
    # ---- the connector's own bookkeeping (writer: connector) --------------
    syncRequestedAck:
      type: datetime
      writer: connector
      displayName: Sync request acknowledged
      description: the `syncRequestedAt` the last sync acted on — equal means
        the request is spent
    syncCursors:
      type: json
      writer: connector
      displayName: Sync cursors
      description: >-
        where each walk stopped — the roster cursor, the search cursor, the
        floor the cold walk started with and the backfillDepth that floor
        was computed from. Opaque, rewritten whole by every page
    syncPending:
      type: json
      writer: connector
      displayName: Pending work
      description: >-
        the work still to do, per queue (databases, blocks) — the backlog
        a bounded drain leaves behind, so it survives the drain that found
        it
    lastSyncedAt:
      type: datetime
      writer: connector
      displayName: Last attempted
      description: >-
        when the sync last ATTEMPTED a walk — the cadence anchor. A bounded
        drain and a rate-limited one both move it, which is why it is not
        evidence that anything finished; lastCompletedAt is
    lastCompletedAt:
      type: datetime
      writer: connector
      displayName: Last completed
      description: >-
        when a walk last ran to the end with no work left. The cold test reads
        this, not lastSyncedAt: a drain that stopped on its own bounds is
        still a first sync
    retryNotBefore:
      type: datetime
      writer: connector
      displayName: Retry not before
      description: >-
        the instant Notion's Retry-After named on the last 429, honoured by
        the body for every call. Absent when nothing is holding the account
        back
    syncStatus:
      type: string
      writer: connector
      displayName: Sync status
      description: >-
        the last sync outcome — ok, ok (deferred: blocks xN), ok (rate limited),
        erroring: <reason>, and the unreachable count when an object answered
        404 or 403
    # ---- the core `sync` trait (substrate decision 0085) ------------------
    # The twelve properties the trait contracts, each redeclared with the
    # writer main's Google bundle uses. THREE OF THEM ARE ALREADY ABOVE and
    # are not repeated here: `syncRequestedAt` (owner), `syncRequestedAck`
    # and `lastSyncedAt` (connector) were this bundle's own bookkeeping
    # before the trait existed and carry exactly the names and datatypes the
    # trait contracts — which is why binding it is additive. `syncStatus`,
    # `syncPending`, `syncCursors`, `lastCompletedAt` and `retryNotBefore`
    # stay as they are: a reader of the old shape keeps working, and dropping
    # a property a live row holds is a narrowing the upgrade refuses.
    syncPaused:
      type: bool
      writer: owner
      displayName: Paused
      description: >-
        while true the dispatcher skips this account's deliveries and the
        scheduled walk passes over it — the owner's stop, honoured without
        the body having to know a delivery was refused
    syncState:
      type: string
      writer: connector
      displayName: Sync state
      description: >-
        never | running | ok | erroring | throttled. `ok` means the drain
        ran out of work; a round that left a backlog behind is `running`,
        a 429 is `throttled` and stands until Notion's own instant passes
    syncMessage:
      type: string
      writer: connector
      displayName: Sync message
      description: >-
        the one human line the last run left — the same sentence syncStatus
        carries, without its `erroring` prefix
    lastSyncStartedAt:
      type: datetime
      writer: connector
      displayName: Last sync started
      description: >-
        when the last run began. The dispatcher stamps it around a record-sourced
        delivery; on the SCHEDULE path, which names no record, the body stamps
        its own
    lastSyncDurationMs:
      type: int
      writer: connector
      displayName: Last sync duration (ms)
      description: how long that run took, from the same two hands — one invocation
        of a bounded drain, not the whole walk
    syncProgress:
      type: json
      writer: connector
      displayName: Sync progress
      description: >-
        {phase, done, total, pending} off the drain's own bookkeeping — the
        stage the walk is in, and the page trees and databases still queued
        in syncPending
    syncError:
      type: string
      writer: connector
      displayName: Sync error
      description: the last error text, from the body's own failure path or
        from a parked delivery the dispatcher stamped
    syncErrorAt:
      type: datetime
      writer: connector
      displayName: Sync error at
      description: when syncError was written. Neither is cleared by a later
        success — the state is what says the account is healthy again
    syncStreams:
      type: json
      writer: connector
      displayName: Sync streams
      description: >-
        trait contract — unwritten here: one function walks one workspace
        as one stream, so the run's state IS the account's and the drain is
        in syncProgress. Declared because the trait contracts it
---
# ---- mirror: one Notion user ----------------------------------------------
# GET /v1/users, GET /v1/users/{id}, GET /v1/users/me (Notion API 2025-09-03).
# The hub of this closure for a HUMAN: every page, data source, database and
# block points here for its author and its last editor.
#
# NOT AN IDENTITY HUB KIND (§3): `user` is Notion's OWN resource with its own
# endpoint, so it needs neither the hub treatment nor a product prefix — this
# bundle mirrors ONE product, so no kind here carries one (§5).
#
# `person.email` is where a person mapping probes. It stays nested, under
# Notion's own shape, because §1 renames nothing the dialect can spell and a
# probe path may be nested.
#
# NO TEMPORAL TRAIT: a Notion user object carries no instant at all — not a
# creation time, not a mutation mark (§4).
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/notion/user
data:
  authority: providers.substrate.reamde.dev
  package: notion
  description: >-
    One Notion user — a person or a bot — as GET /v1/users returns it (2025-09-03).
    A bot carries the workspace it belongs to. The response envelope (request_id,
    and a list's object/results/next_cursor/has_more) is the one omitted class;
    Notion publishes no hypermedia. No instant of its own, so no temporal
    trait.
  names:
    singular: user
  displayTemplate: "{name|userId}"
  properties:
    # ---- identity --------------------------------------------------------
    account:
      type: reference
      kind: account
      required: true
      onDelete: cascade
      displayName: Account
      description: the account this user was synced through
    object:
      type: enum
      values:
        - value: user
          label: user
      displayName: Object
      description: >-
        Notion's `object` discriminator, one value on this resource — declared
        so a second value is a widening rather than a surprise
    userId:
      type: string
      required: true
      displayName: User ID
      description: >-
        Notion's `id` — the workspace-stable UUID for this user, and the provider
        key behind this row's id
    # ---- the user's own scalars, in the API reference's order -------------
    type:
      type: enum
      values:
        - value: person
          label: person
        - value: bot
          label: bot
      displayName: Type
      description: >-
        Notion's `type`: person | bot. The schema closes it at two, and the
        object that follows is named for it
    name:
      type: string
      displayName: Name
      description: the user's display name, or the integration's name for
        a bot
    avatarUrl:
      type: url
      displayName: Avatar
      description: Notion's `avatar_url` — the user's avatar, absent when
        they have none
    person:
      type: object
      fields:
        email:
          type: email
          description: the person's email address, present only when the integration
            has the "read user information including email" grant
        emailVerified:
          type: bool
          description: Notion's `email_verified` — whether Notion has verified
            the address
      displayName: Person
      description: >-
        Notion's `person` object, present when `type` is person. A person
        mapping probes `person.email` — the address is NOT lifted to the top
        level, because §1 renames nothing the dialect can spell
    bot:
      type: object
      fields:
        owner:
          type: object
          fields:
            type:
              type: enum
              values:
                - value: workspace
                  label: workspace
                - value: user
                  label: user
              description: >-
                whose bot this is. The reference closes the set at two and
                never asks a client to tolerate a third, so it is an enum
            workspace:
              type: bool
              description: Notion's `workspace` — true when the bot is owned
                by the workspace rather than by a user
            user:
              type: reference
              kind: providers.substrate.reamde.dev/notion/user
              description: the user who owns the bot, when `type` is user.
                No mustExist — the owner may land later in the same walk
          description: Notion's `bot.owner` — who installed the integration
        workspaceName:
          type: string
          description: Notion's `workspace_name` — the workspace this integration
            is installed in
        workspaceId:
          type: string
          description: >-
            Notion's `workspace_id` — the workspace's UUID. A string rather
            than a reference, because this bundle mirrors no workspace kind
        workspaceLimits:
          type: object
          fields:
            maxFileUploadSizeInBytes:
              type: int
              description: Notion's `max_file_upload_size_in_bytes` — the
                workspace's file-upload ceiling
          description: Notion's `workspace_limits` — the limits this workspace's
            plan imposes
      displayName: Bot
      description: >-
        Notion's `bot` object, present when `type` is bot. It is empty for
        a bot other than the one the token belongs to; `users/me` is the only
        call that fills it
---
# ---- mirror: one database -------------------------------------------------
# GET /v1/databases/{id} (2025-09-03). A database is the CONTAINER; the schema
# and the rows live on its data sources, which is the whole point of the
# 2025-09-03 model. Search never returns a database, so the only way this row
# exists is the addressed read a data source's parent asks for — which is what
# the kind's description has to say (§1).
#
# `title` is reserved at every level, so it is `databaseTitle` (§5), and the
# heading is this kind's displayTemplate over the plain-text decode.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/notion/database
data:
  authority: providers.substrate.reamde.dev
  package: notion
  description: >-
    One Notion database — the container its data sources hang off — as GET
    /v1/databases/{id} returns it (2025-09-03); search never returns one,
    so this row exists only because a data source named it. `at` is `created_time`;
    `createdBy` and `lastEditedBy` are declared and not yet seen. The response
    envelope (request_id) is the one omitted class.
  names:
    singular: database
  traits:
    - temporal(point)
  displayTemplate: "{titlePlainText|databaseId}"
  properties:
    # ---- identity --------------------------------------------------------
    account:
      type: reference
      kind: account
      required: true
      onDelete: cascade
      displayName: Account
      description: the account this database was synced through
    object:
      type: enum
      values:
        - value: database
          label: database
      displayName: Object
      description: Notion's `object` discriminator, one value on this resource
        — a second value would be a widening
    databaseId:
      type: string
      required: true
      displayName: Database ID
      description: Notion's `id` — the database's UUID, and the provider key
        behind this row's id
    # ---- the database's own scalars, in the API reference's order ---------
    databaseTitle:
      type: json
      displayName: Title
      description: >-
        Notion's `title` (renamed: `title` is reserved on every record) —
        the rich-text array as Notion sends it. Heterogeneous by discriminator,
        so `json` per §2; `titlePlainText` rides beside it
    titlePlainText:
      type: string
      displayName: Title text
      description: >-
        Notion's own `plain_text` spans of `databaseTitle`, concatenated in
        order — the lossless mechanical decode of the rich-text encoding (§1);
        the encoded source is on this row and keeps the annotations
    description:
      type: json
      displayName: Description
      # A `descriptionPlainText` would be admissible — §1's FIRST exception is
      # not capped, and only the THIRD (the labelled `embed: true` index) is.
      # It is not declared because no database in the owner's workspace has a
      # description at all, and §9's open question 4 says a property no
      # fixture exercises is not shipped. Codex finding 3 corrected the
      # earlier claim that the title had spent an allowance.
      description: >-
        Notion's `description` — the rich-text array as Notion sends it. No
        plain-text decode: nothing in the corpus carries one
    isInline:
      type: bool
      displayName: Inline
      description: Notion's `is_inline` — whether the database renders inside
        its parent page rather than on its own
    databaseType:
      type: string
      displayName: Database type
      description: >-
