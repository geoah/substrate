---
# ---- the connector's per-conversation state --------------------------------
# NOT A MIRROR. This is where the history cursors that used to sit on the
# conversation row live: a provider-owned state kind with a required cascading
# reference at the conversation and `writer: connector` on every property, so
# a page of history bumps THIS row's version and never the conversation's, and
# a trigger watching conversations does not fire on every drain.
#
# One row per conversation, id host.ids.external("slack", account,
# "<team>/<channel>/sync"). It cascades from the conversation, which cascades
# from the account, so disconnecting an account collects all three.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/slack/conversationsync
data:
  authority: providers.substrate.reamde.dev
  package: slack
  description: >-
    How far copying one Slack channel or direct message has got. Where this
    connector's walk of one conversation got to: the history cursor, the replies
    cursor, when the roster was last read and what Slack last said about it.
    Connector-written state, kept off the conversation so a page of history
    never bumps the mirrored row.
  purpose: internal
  names:
    singular: conversationsync
  displayTemplate: "{conversation.name}"
  properties:
    conversation:
      type: reference
      kind: providers.substrate.reamde.dev/slack/conversation
      required: true
      mustExist: true
      onDelete: cascade
      displayName: Conversation
      description: >-
        the conversation this state belongs to. Required and cascading — the
        state dies with the conversation. A reference takes no `writer:`,
        so this one alone is unrestricted
    latestTs:
      type: string
      writer: connector
      displayName: History cursor
      description: >-
        the newest message ts mirrored from this conversation. The next run
        asks Slack for oldest=this, which Slack treats as exclusive
    repliesTs:
      type: string
      writer: connector
      displayName: Replies cursor
      description: >-
        the newest reply ts mirrored from any thread here. The thread walk
        descends into parents whose latest_reply is newer, less a margin,
        and into every watched thread
    threadWatch:
      type: string
      repeated: true
      writer: connector
      displayName: Watched threads
      description: >-
        the ts of every thread parent seen here, newest first and capped.
        An incremental page never returns an OLD parent, so a reply to one
        is invisible unless its thread is re-asked
    membersSyncedAt:
      type: datetime
      writer: connector
      displayName: Roster synced
      description: when this conversation's member list was last walked —
        rosters are refreshed at most daily
    historyStatus:
      type: string
      writer: connector
      displayName: History status
      description: >-
        the last outcome for THIS conversation — ok, or the Slack error that
        stopped it (not_in_channel, channel_not_found). One bad channel never
        stops the rest
---
# ---- the sync function -----------------------------------------------------
# A PEP 723 Python body speaking Slack's Web API over requests. Per invocation
# it makes AT MOST ONE Slack HTTP call and pages everything off the causal
# chain through the more/resume contract:
#
#   auth          ONE auth.test. Stamps the account with the workspace and the
#                 user the token turned out to be — as REFERENCES, not ids.
#   team          ONE team.info -> the team mirror.
#   users         ONE users.list page per invocation -> user mirrors.
#   conversations ONE conversations.list page per invocation -> conversation
#                 mirrors, mint-then-patch; the readable ones join the queue.
#   info          ONE conversations.info per queued conversation: the fields
#                 the list shape does not carry (latest, last_read, unread
#                 counts, is_open).
#   history       ONE conversations.history page per invocation, from THAT
#                 conversation's own stored cursor on its conversationsync row.
#   replies       ONE conversations.replies page per thread whose latest_reply
#                 is newer than the conversation's replies cursor.
#   hydrate       ONE users.info per invocation, for a sender this workspace's
#                 users.list never carried (a Slack Connect participant).
#   members       ONE conversations.members page per invocation, for rosters
#                 over a day old, when the account enables them.
#
# THE DRAIN IS SELF-BOUNDED: the engine gives it 512 invocations and two
# minutes (internal/engine/functions.go) and this workspace has 916 readable
# conversations, so the body watches its own clock (75s) and call count (300)
# and stops cleanly — the queue goes to the account's streamCursors and the
# status says how much is left. An account with pending work is due whatever
# its cadence says, so the hourly tick is also the continuation. A 429 ends a
# drain the same polite way.
#
# WHAT MOVED, versus the first cut of this bundle. Every relation is written
# as a REFERENCE at a mirrored row — the id is composed with the same
# host.ids.external the row was minted under, so the pointer is deterministic
# and needs no lookup. Nothing is written twice: no `raw`, no display name
# lifted out of a profile, no owner flags, no counts. The per-conversation
# cursors are PATCHED ONTO slack/conversationsync, so a page of history never
# bumps the conversation's version.
#
# Cursor discipline. A conversation's `latestTs` is patched only after its
# messages have committed, so a crash re-reads a window whose puts are
# if_absent and absorbs the overlap. The account's stamp is the LAST effect of
# a drain. A conversation Slack refuses is stamped on its own STATE row and
# the queue moves on.
kind: substrate.reamde.dev/core/function
metadata:
  id: providers.substrate.reamde.dev/slack/slacksync
data:
  authority: providers.substrate.reamde.dev
  package: slack
  description: >-
    Sync one Slack workspace over the Web API — its team, users, conversations,
    messages, thread replies and shared files — one page per invocation, advancing
    each conversation's own cursor on its sync-state row. Read-only.
  runtime: python
  timeout: PT30S
  permissions:
    writes:
      - providers.substrate.reamde.dev/slack/team
      - providers.substrate.reamde.dev/slack/user
      - providers.substrate.reamde.dev/slack/conversation
      - providers.substrate.reamde.dev/slack/conversationsync
      - providers.substrate.reamde.dev/slack/message
      - providers.substrate.reamde.dev/slack/bot
      - providers.substrate.reamde.dev/slack/file
      - providers.substrate.reamde.dev/slack/account
    reads:
      kinds:
        - providers.substrate.reamde.dev/slack/conversation
        - providers.substrate.reamde.dev/slack/conversationsync
        - providers.substrate.reamde.dev/slack/message
        # T-021. `user` is guide amendment 6's read: a patch replaces an
        # OBJECT whole, so the thin `user_profile` a message inlines can only
        # be merged into a rich one by reading the row first. `file` and
        # `bot` are what let the hydration phases step over a row that has
        # already been read from its own endpoint, instead of spending one
        # invocation per already-hydrated row.
        - providers.substrate.reamde.dev/slack/user
        - providers.substrate.reamde.dev/slack/file
        - providers.substrate.reamde.dev/slack/bot
      budgets:
        calls: 600
        rows: 4000
    network:
      - slack.com
      - api.slack.com
      - 127.0.0.1
      - localhost
  source: |
    # /// script
    # requires-python = ">=3.11"
    # dependencies = [
    #   "requests==2.32.3",
    # ]
    # ///
    """Slack workspace sync — at most one Slack HTTP call per invocation.

    The pasted user token arrives injected on the connector input
    (config.inputs.connector.properties.userToken). It leaves this body ONLY
    toward a pinned origin — https on a slack.com host, or loopback (the test
    seam); an owner-editable apiBase pointing anywhere else parks the sync with a
    clear error BEFORE any request is made.

    Paged end to end, so no frame is ever sized by the workspace: one Slack page
    per invocation, and the queue of conversations still to walk rides in the
    cursor as ids alone. The drain bounds ITSELF — on its own clock and its own
    call count — because the engine's bounds (512 pages, two minutes) are tighter
    than a 916-conversation cold sync.

    EVERY RELATION IS A REFERENCE. A mirrored row's id is
    host.ids.external("slack", account, "<team>/<key>"), which is deterministic,
    so a pointer at a user, a team, a conversation, a message or a file is
    composed rather than looked up. Nothing is stored twice: no raw payload, no
    display name lifted out of a profile, no owner-relative flag, no count of a
    list the row already holds.
    """
    import datetime as _dt
    import re
    import time
    import urllib.parse

    import requests

    TEAM_TYPE = "providers.substrate.reamde.dev/slack/team"
    USER_TYPE = "providers.substrate.reamde.dev/slack/user"
    CONV_TYPE = "providers.substrate.reamde.dev/slack/conversation"
    SYNC_TYPE = "providers.substrate.reamde.dev/slack/conversationsync"
