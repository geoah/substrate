# The Slack bundle — a SYNC-ONLY workspace mirror, new in Mneme v6.
#
# Mirrors one Slack workspace as Slack's own object model: the team, its
# users, its conversations, the messages in them and the files they share.
# Every field of every object is a declared, typed, top-level property; every
# relation the API states is a REFERENCE at the kind that holds the other end;
# no payload is kept twice. It reads; it never posts, never reacts, never
# joins.
#
# WRITTEN TO docs/kind-design.md (v2). What that costs, spelled out, because
# every one of these is a change from the first cut of this bundle:
#
#   * NO `raw`. A row that carried its own payload beside its typed view held
#     every fact twice and let the typed view stay thin. `json` survives on
#     exactly two properties — Block Kit `blocks` (recursive) and legacy
#     `attachments` (heterogeneous by discriminator) — plus two shapes Slack
#     publishes no schema for at all, each saying so in its description.
#   * NO owner-relative or computed property: `fromOwner`, `mentionsOwner`,
#     `directedAtOwner`, `fromBot`, `fileCount`, `reactionCount` are gone. The
#     owner is `account.user`; "from me" is a filter on `user`, "mentions me"
#     is `mentions contains <that user>`, "has files" is `files exists`, and
#     "was this aimed at me" is a judgement a consumer function makes, never
#     a mirror. Slack's OWN self-facts stay, because they are the API's:
#     `is_member`, `last_read`, `unread_count`, `subscribed`.
#   * NO id beside a reference. `message.user`, `mentions`, `members`,
#     `conversation.creator`, `reactions[].users`, `user.team` are references
#     at `slack/user` and `slack/team`. The only `<x>Id` a row carries is its
#     OWN (`userId`, `conversationId`, `teamId`, `fileId`), because that is
#     the API's own `id` for the object the row IS.
#   * NO display name lifted out of the profile. Slack puts it at
#     `profile.display_name`; it lives there, once, and the row titles itself
#     through `{profile.displayName}`.
#   * NO sync bookkeeping on a mirror row. A conversation's history cursors
#     moved to `slack/conversationsync`, a provider-owned state kind with a
#     cascading reference at the conversation and `writer: connector` on
#     every property — so a page of history never bumps the conversation's
#     version and never fires a trigger watching it. The per-STREAM state
#     (where the users and conversations walks stopped, and the queue a
#     bounded drain left behind) stays on the account, where a stream cursor
#     belongs.
#   * NO `person` slot and no reference at a consumer kind. A provider knows
#     nothing about Mneme; the link a `recordmapping` makes is the mapping's.
#
# ONE `message` KIND, NOT ONE PER SUBTYPE. Slack's `subtype` is a growing list
# it extends without notice (`huddle_thread`, `sh_room_created` arrived that
# way), and every subtype is the same identity — (channel, ts). So `subtype`
# is a `string` with the known values in its description, and the kind
# declares the UNION of every documented subtype's fields, each optional, each
# description naming the subtypes it appears on. `type` is not declared at
# all: it is the constant discriminator `message` on every row this kind ever
# holds, and the kind's description says so.
#
# NO ENUM ON ANY MIRROR. Slack publishes no machine schema, and not one of the
# sets it documents in prose is closed (`subtype`, `file.mode`,
# `file_access`, `two_factor_type`, `who_can_share_contact_card` have all
# grown). An enum refuses the page that carries a value it does not hold, so a
# wrongly closed set fails a whole sync the day Slack adds a word. Each of
# them is a `string` with the values Slack documents named in the description.
# The only enums here are the OWNER's own toggles on the account, whose sets
# this bundle closes itself.
#
# WHY A PASTED USER TOKEN AND NOT `oauth2:`. A Slack OAuth app exists and the
# facility's shape is right, but the facility cannot deliver the credential
# this mirror needs, for two reasons that both live in the host, not here:
#
#   1. The consent URL the facility builds carries `scope=`, the parameter
#      Slack reads as the BOT scope set. The owner's DMs, MPIMs and search are
#      only reachable with a USER token, which Slack grants through a separate
#      `user_scope=` parameter the facility has no way to emit.
#   2. Slack returns the user token at `authed_user.access_token`, not at the
#      response's top level, and the facility exchanges through
#      golang.org/x/oauth2, which refuses a token response with no top-level
#      `access_token`.
#
# So the account is authorized by a pasted `xoxp-…` user token, the same
# first-class Slack auth model v4 used. The `oauth2:` revision is mechanical
# the day the facility grows a declared extra authorize parameter and a
# declared token path. See README.md, *Platform asks*.
#
# WHY THE TOKEN LIVES ON THE CONFIG, NOT THE ACCOUNT: the engine seals every
# secret-typed property of an accountconfig-trait type at rest and the runner
# injects account properties AS STORED, so a token pasted on the account would
# reach this body as ciphertext. An injected input's own secret arrives
# usable. One token addresses one workspace, which is also why the sync
# enforces ONE account: the lexicographically-first live account row is the
# connection and every other live row is stamped ignored.
#
# Install:   substratectl apply -f bundle.yaml -f triggers.yaml
# Configure: create a config record with the pasted user token.
# Connect:   create an account with enabledMessages true.
# ---- the owned package ----------------------------------------------------
kind: substrate.reamde.dev/core/package
metadata:
  id: providers.substrate.reamde.dev/slack
data:
  authority: providers.substrate.reamde.dev
  package: slack
  # 3 — T-021, hydration and coverage: `files.info` and `bots.info` are read
  # for every file and bot the walk names, the file kind declares the whole
  # measured inventory (media, canvas, external, access, shares) instead of
  # uploads and thumbnails, `conversationProperties` takes back the API's own
  # name `properties`, `profile.botId` becomes a `bot` reference, the thin
  # `user_profile` a message inlines is merged rather than dropped, and
  # history and replies ask for `include_all_metadata`. A changed declaration
  # shipping the same version reaches no repository.
  #
  # 4 — T-084, the core `sync` trait: the account kind binds
  # `[accountconfig, sync]` and declares the trait's twelve properties with
  # their writers, and the sync body writes them beside the legacy
  # `syncStatus`/`lastSyncedAt`/`streamCursors` fields on every run. Nothing
  # is renamed, narrowed or dropped.
  #
  # 9 — every kind's description opens with one plain sentence
  # saying what a record is to a person.
  version: 9
---
# ---- the bundle document: the install unit --------------------------------
# NO `oauth2:` block: an oauth2 block demands a client input wearing the
# oauth2 trait, the loader holds the two paired both ways, and this bundle
# authenticates with a pasted token.
kind: substrate.reamde.dev/core/bundle
metadata:
  id: providers.substrate.reamde.dev/slack
data:
  authority: providers.substrate.reamde.dev
  package: slack
  description: >-
    Keeps a copy of one Slack workspace — its people, its channels, group
    chats and DMs, the messages in them and the files they share. It takes
    a pasted token, and cannot post.
  inputs:
    connector:
      kind: providers.substrate.reamde.dev/slack/config
      inject: functions
      description: the pasted Slack user token and the pinned API origin
  installs:
    - providers.substrate.reamde.dev/slack/config
    - providers.substrate.reamde.dev/slack/account
    - providers.substrate.reamde.dev/slack/team
    - providers.substrate.reamde.dev/slack/user
    - providers.substrate.reamde.dev/slack/conversation
    - providers.substrate.reamde.dev/slack/message
    - providers.substrate.reamde.dev/slack/bot
    - providers.substrate.reamde.dev/slack/file
    - providers.substrate.reamde.dev/slack/conversationsync
    - providers.substrate.reamde.dev/slack/slacksync
---
# ---- the config type: the `connector` input's kind -------------------------
# NOT oauth2, and it deliberately carries NO client id or secret: a kind
# wearing the oauth2 trait holds the client pair and NOTHING ELSE, so parking
# the client credentials here is the one move that would make the eventual
# OAuth revision impossible.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/slack/config
data:
  authority: providers.substrate.reamde.dev
  package: slack
  description: >-
    The token and address your Slack workspace connects through. The Slack
    user token this bundle spends and the API origin it may be sent to. The
    bundle's connector input resolves one record of this kind; the token is
    sealed against read-back and the origin is pinned, so an owner edit cannot
    become an exfiltration channel.
  purpose: internal
  names:
    singular: config
  displayTemplate: Slack connection
  properties:
    userToken:
      type: secret
      writer: owner
      displayName: User token
      description: >-
        the pasted Slack USER token (xoxp-…); a bot token sees neither your
        DMs nor your group chats. Redacted on read, injected only into the
        sync body, scrubbed on the way out
    apiBase:
      type: url
      writer: owner
      # The body PINS the origin the token may travel to: https on a
      # slack.com host, or a loopback host as the test seam.
      description: >-
        test-only override of https://slack.com — loopback hosts only; any
        other origin refuses to sync. Leave empty in production
---
# ---- the account type: one connected workspace ----------------------------
# accountconfig WITHOUT oauth2. The trait contracts tokenRef/tokenStatus/
# grantedScopes onto every implementing type, so they are declared below as
# DORMANT: `writer: oauth` means only the OAuth facility may ever set them,
# and no flow runs for this bundle.
#
# THIS IS NOT A MIRROR. It is the connection: the owner's toggles, what the
# token turned out to be, and the connector's own per-STREAM state. What it
# learned from auth.test it holds as REFERENCES — `team` and `user` — rather
# than as a copy of the team's name and the owner's id, because both rows are
# mirrored and a copy of a referent is a derived property.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/slack/account
data:
  authority: providers.substrate.reamde.dev
  package: slack
  description: >-
    Your Slack workspace, connected here. One connected Slack workspace: the
    owner's sync toggles, the workspace and the user the token turned out
    to belong to, and the connector's own per-stream progress. The accountconfig
    trait's OAuth hands are declared but stay dormant, since no OAuth flow
    ever runs for this bundle.
  purpose: internal
  names:
    singular: account
  # `sync` is the core trait the Connections page and `substratectl sync
  # status` read (decision 0085): the sync body writes its twelve properties
  # beside the legacy `syncStatus`/`lastSyncedAt` pair, and the dispatcher
  # stamps a record-sourced delivery's start, finish and park onto them. The
  # two OWNER hands are `syncRequestedAt` (Sync now) and `syncPaused` (Pause).
  traits: [substrate.reamde.dev/core/accountconfig, substrate.reamde.dev/core/sync]
  displayTemplate: "{displayName|team.name}"
  properties:
    # The accountconfig trait's contracted properties — DORMANT here.
    tokenRef:
      type: secret
      writer: oauth
      displayName: Token reference
      description: >-
        accountconfig trait contract — unused: the pasted token lives on the
        bundle config, and no OAuth flow runs
    tokenStatus:
      type: string
      writer: oauth
      displayName: Connection status
      description: >-
        accountconfig trait contract — unused: no OAuth flow ever reports
        a status here. Connection health reads off syncStatus
    grantedScopes:
      type: string
      repeated: true
      writer: oauth
      displayName: Granted scopes
      description: >-
        accountconfig trait contract — unused: no consent, no scopes. What
        the token can do is whatever it was minted with
    # The owner's hands.
    displayName:
      type: string
      writer: owner
      displayName: Name
      description: a name for this connection, shown wherever the account
        is listed
    enabledMessages:
      type: bool
      writer: owner
      displayName: Messages
      description: >-
        sync this workspace's people, conversations and messages — one toggle,
        because a message is meaningless without the conversation it arrived
        in and the person who wrote it
    enabledMembers:
      type: bool
      writer: owner
      displayName: Rosters
      description: >-
        also walk each channel's member list. Off by default: it is one extra
        API call per channel and rosters move slowly
    conversationFilter:
      type: string
      writer: owner
      description: >-
        optional case-insensitive substring a conversation's name must contain
        for its MESSAGES to sync. Every conversation is still mirrored
    # The `sync` trait's two OWNER hands (decision 0085). `syncRequestedAt`
    # predates the trait and keeps its meaning exactly; `syncPaused` is new.
    syncRequestedAt:
      type: datetime
      writer: owner
      displayName: Sync requested
      description: >-
        stamp this with the current time to ask for a sync now, whatever the
        cadence says. The next completed sync closes the request
    syncPaused:
      type: bool
      writer: owner
      displayName: Paused
      description: >-
        while true the dispatcher skips this account's deliveries and the
        scheduled walk passes over it. A drain already queued stays queued
    syncFrequency:
      type: enum
      values:
        - value: "off"
          label: Off
        - value: hourly
          label: Every hour
        - value: daily
          label: Once a day
      required: true
      default: hourly
      writer: owner
      displayName: Sync frequency
      description: the scheduled sync cadence for this account (default hourly)
    backfillDepth:
      type: enum
      values:
        - value: none
          label: Don't backfill
        - value: last2d
          label: Last two days
        - value: last30d
          label: Last 30 days
        - value: last90d
          label: Last 90 days
        - value: last1y
          label: Last year
        - value: all
          label: Everything
      required: true
      default: last30d
      writer: owner
      displayName: Backfill depth
      description: >-
        how far back the first sync walks each conversation's history (default
        the last 30 days); none means from connect time forward
    # What the TOKEN turned out to be — connector-written, because auth.test
    # is what knows, not the owner. References, not copies: the workspace and
    # the owner are both mirrored rows, and their names and ids are theirs.
    team:
      type: reference
      kind: providers.substrate.reamde.dev/slack/team
      writer: connector
      displayName: Workspace
      description: >-
        the workspace this token belongs to, from auth.test's team_id. The
        row lands in the same drain, so no mustExist
    user:
      type: reference
      kind: providers.substrate.reamde.dev/slack/user
      writer: connector
      displayName: You
      description: >-
        the Slack user this token belongs to, from auth.test's user_id — who
        "me" is in every message this account mirrors
    # Connector STATE, per STREAM. A per-CONVERSATION cursor lives on
    # slack/conversationsync, not here and not on the conversation.
    streamCursors:
      type: json
      writer: connector
      displayName: Stream cursors
      description: >-
        where each stream stopped: the users and conversations list cursors,
        and the work a capped drain has not reached yet. Opaque, rewritten
        whole by every page
    lastSyncedAt:
      type: datetime
      writer: connector
      displayName: Last attempted
      description: >-
        when the sync last ATTEMPTED a walk — the cadence anchor. A bounded
        drain and a rate-limited one both move it, which is why it is not
        evidence that anything finished; lastCompletedAt is
    lastCompletedAt:
      type: datetime
      writer: connector
      displayName: Last completed
      description: >-
        when a walk last ran to the end with no work left. The cold test reads
        this, not lastSyncedAt: a drain that stopped on its own bounds is
        still a first sync
    retryNotBefore:
      type: datetime
      writer: connector
      displayName: Retry not before
      description: >-
        the instant Slack's Retry-After named on the last 429, honoured by
        the scheduler for every call including auth.test. Absent when nothing
        is holding the account back
    syncStatus:
      type: string
      writer: connector
      displayName: Sync status
      description: >-
        the last sync outcome — ok, ok (N pending), ok (N pending, rate limited),
        erroring: <reason>, ignored: duplicate account, and a trailing [N
        failed] when work has exhausted its retries
    # --- the core `sync` trait's connector hands (decision 0085) -------------
    # The ten properties the trait contracts that the CONNECTOR writes; the
    # owner's two (`syncRequestedAt`, `syncPaused`) are above. The sync body
    # writes them BESIDE `syncStatus`, `lastSyncedAt`, `lastCompletedAt` and
    # `streamCursors`, which keep their meaning exactly — nothing here
    # replaces them, and a reader of the old shape keeps working.
    #
    # ONE function drives all three streams, so there is no second body to
    # clear a live failure of: `syncState` is the whole run's outcome and the
    # per-stream entries below are the breakdown.
    syncState:
      type: string
      writer: connector
      displayName: Sync state
      description: >-
        never | running | ok | erroring | throttled — the account-level state.
        `ok` while a bounded drain still has work (the count rides in syncProgress),
        `throttled` while Slack's Retry-After holds it
    syncMessage:
      type: string
      writer: connector
      displayName: Sync message
      description: >-
        the one human line the last run left — the same sentence syncStatus
        carries, so the two never disagree
    lastSyncStartedAt:
      type: datetime
      writer: connector
      displayName: Last sync started
      description: >-
        when the last run began. The dispatcher stamps it around a record-sourced
        delivery; the body stamps it on the scheduled path, which names no
        record
    lastSyncDurationMs:
      type: int
      writer: connector
      displayName: Last sync duration (ms)
      description: >-
        how long the last run took, stamped by the dispatcher for a record-sourced
        delivery and by the body on the scheduled path
    syncRequestedAck:
      type: datetime
      writer: connector
      displayName: Sync request served
      description: >-
        equals syncRequestedAt once every stream has answered that request
        — for this bundle, once a walk has run out of work
    syncProgress:
      type: json
      writer: connector
      displayName: Sync progress
      description: >-
        "{phase, done, total, pending}" for the bounded drain: the phase it
        stopped in, the calls it spent, and the work its own queues still
        hold
    syncError:
      type: string
      writer: connector
      displayName: Sync error
      description: >-
        the last error text, from the body or from a parked delivery. Never
        cleared by a later success — syncState is what says it is over
    syncErrorAt:
      type: datetime
      writer: connector
      displayName: Sync error at
      description: when syncError was written
    syncStreams:
      type: json
      writer: connector
      displayName: Sync streams
      description: >-
        users, conversations and messages, each as "{state, message, lastAt,
        pending, requestedAck}". The drain walks all three in one function;
        `pending` is that stream's own share of the queues
---
# ---- mirror: the workspace itself -----------------------------------------
# team.info (Slack Web API, docs revision 2026-09). Every field of the Team
# object; the response envelope (`ok`) is dropped as a class and nothing else
# is. No trait: a workspace is a container, not something that happened.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/slack/team
data:
  authority: providers.substrate.reamde.dev
  package: slack
  description: >-
    A Slack workspace. One Slack workspace, as team.info returns it: its id,
    name, host, email domain, icon and enterprise grid membership. The response
    envelope (ok) is the only thing dropped. Written once per sync.
  purpose: supporting
  names:
    singular: team
  displayTemplate: "{name|teamId}"
  properties:
    # identity
    account:
      type: reference
      kind: providers.substrate.reamde.dev/slack/account
      required: true
      onDelete: cascade
      displayName: Account
      description: the account this workspace was synced through
    teamId:
      type: string
      required: true
      displayName: Team ID
      description: "team.info `id` — Slack's id for the workspace (T…), and
        the provider key behind this row's id"
    # the workspace's own scalars, in team.info's order
    name:
      type: string
      displayName: Name
      description: the workspace's display name
    domain:
      type: string
      displayName: Domain
      description: "the workspace's subdomain — <domain>.slack.com is where
        its permalinks live. A slug, not a hostname"
    emailDomain:
      type: string
      displayName: Email domain
      description: >-
        the email domain(s) Slack associates with the workspace, comma-joined
        as Slack sends them. Absent when it has none
    url:
      type: url
      displayName: URL
      description: the workspace's own https address, as team.info returns
        it
    avatarBaseUrl:
      type: url
      displayName: Avatar base
      description: the CDN prefix Slack serves this workspace's avatars from
    isVerified:
      type: bool
      displayName: Verified
      description: whether Slack has verified the workspace's organisation
    discoverable:
      type: string
      displayName: Discoverable
      description: >-
        who may find and join the workspace without an invite. A growing Slack-side
        list, so a string — seen: closed, invite_only, open
    lobSalesHomeEnabled:
      type: bool
      displayName: Sales home
      description: "`lob_sales_home_enabled` — whether Slack Sales Home is
        on for the workspace"
    isSfdcAutoSlack:
      type: bool
      displayName: Salesforce auto-provisioned
      description: >-
        `is_sfdc_auto_slack` — whether the workspace was auto-provisioned
        from Salesforce. Sent on every team.info in this set, including as
        `false`, which is preserved
    enterpriseId:
      type: string
      displayName: Enterprise ID
      description: "the Enterprise Grid org this workspace belongs to (E…),
        when it is on a grid at all"
    enterpriseName:
      type: string
      displayName: Enterprise name
      description: the grid organisation's name, when this workspace is on
        one
    enterpriseDomain:
      type: string
      displayName: Enterprise domain
      description: the grid organisation's subdomain, when this workspace
        is on one
    icon:
      type: object
      displayName: Icon
      description: the workspace icon, one URL per rendered size, as team.info
        returns it
      fields:
        imageDefault:
          type: bool
          description: whether this is Slack's placeholder rather than an
            uploaded icon
        image34:
          type: url
          description: "team.info `image_34` — the 34px icon"
        image44:
          type: url
          description: "team.info `image_44` — the 44px icon"
        image68:
          type: url
          description: "team.info `image_68` — the 68px icon"
        image88:
          type: url
          description: "team.info `image_88` — the 88px icon"
        image102:
          type: url
          description: "team.info `image_102` — the 102px icon"
        image132:
          type: url
          description: "team.info `image_132` — the 132px icon"
        image230:
          type: url
          description: "team.info `image_230` — the 230px icon"
        imageOriginal:
          type: url
          description: "team.info `image_original` — the icon as uploaded"
    externalOrgMigrations:
      type: json
      displayName: Org migrations
      description: >-
        `external_org_migrations` — the Slack Connect org migrations in flight.
        json because Slack publishes NO schema for it: neither the wrapper
        nor an entry is documented anywhere
---
# ---- mirror: one Slack user ------------------------------------------------
# users.list / users.info member object, one row per (team, user). Every
# documented field of the member object and of its `profile`, which is the
# object Slack renders a person from and is kept as ONE object rather than
# lifted onto the row: `profile.display_name` is the display name, it is not
# also a top-level `displayName`, and nothing here is stored twice.
#
# NO `person` SLOT, and no reference at anything outside this package: a
# provider knows nothing about its consumer. A repository that wants this
# identity converged with a contact and a GitHub profile declares a
# recordmapping, and the link is the mapping's.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/slack/user
data:
  authority: providers.substrate.reamde.dev
  package: slack
  description: >-
    Someone in your Slack workspace. One person in a Slack workspace, as users.list
    and users.info return them: the handle, the real name, the whole profile
    Slack renders them from, the workspace roles and whether they are a bot
    or deactivated. The envelope (ok, response_metadata) is dropped; everything
    else is here.
  purpose: supporting
  names:
    singular: user
  displayTemplate: "{profile.displayName|realName|name}"
  properties:
    # identity
    account:
      type: reference
      kind: providers.substrate.reamde.dev/slack/account
      required: true
      onDelete: cascade
      displayName: Account
      description: the account this user was synced through
    userId:
      type: string
      required: true
      displayName: User ID
      description: "users.list `id` — Slack's id for the user (U… or W…),
        and the second half of this row's provider key"
    # the member object's own scalars, in users.list's order
    name:
      type: string
      displayName: Handle
      description: "users.list `name` — the Slack handle, @this, historically"
    deleted:
      type: bool
      displayName: Deactivated
      description: >-
        whether the account has been deactivated. Kept rather than dropped:
        a deactivated person still wrote the messages they wrote
    color:
      type: string
      displayName: Colour
      description: the six-digit hex Slack tints this person's avatar placeholder
        with
    realName:
      type: string
      displayName: Real name
      description: "the user's real name at the member object's top level;
        `profile.real_name` is the profile's own copy"
    tz:
      type: timezone
      displayName: Time zone
      description: "the user's IANA zone, e.g. Europe/London. A value that
        is not an IANA name is not written"
    tzLabel:
      type: string
      displayName: Time zone label
      description: Slack's rendering of the zone with its current offset,
        e.g. British Summer Time
    tzOffset:
      type: int
      displayName: UTC offset
      description: the zone's current offset from UTC, in seconds
    isAdmin:
      type: bool
      displayName: Admin
      description: whether the user administers the workspace
    isOwner:
      type: bool
      displayName: Workspace owner
      description: "whether the user owns the workspace — Slack's sense of
        owner, which is not Mneme's"
    isPrimaryOwner:
      type: bool
      displayName: Primary owner
      description: whether the user is the workspace's primary owner
    isRestricted:
      type: bool
      displayName: Guest
      description: whether the user is a multi-channel guest
    isUltraRestricted:
      type: bool
      displayName: Single-channel guest
      description: whether the user is a single-channel guest
    isBot:
      type: bool
      displayName: Bot
      description: "Slack's own answer to whether a person typed this — no
        name heuristic can be as right"
    isAppUser:
      type: bool
      displayName: App user
      description: whether this row is an installed app's user rather than
        a member
    isStranger:
      type: bool
      displayName: Stranger
      description: whether this user belongs to a workspace connected through
        Slack Connect rather than this one
    isInvitedUser:
      type: bool
      displayName: Invited
      description: whether the user has been invited but has not signed in
        yet
    isEmailConfirmed:
      type: bool
      displayName: Email confirmed
      description: whether Slack has confirmed the address on the profile
    isScimProvisioned:
      type: bool
      displayName: SCIM provisioned
      description: whether the account was created by the workspace's SCIM
        directory rather than by hand
    isWorkflowBot:
      type: bool
      displayName: Workflow bot
      description: whether this user is Slack's own Workflow Builder identity
    isExternal:
      type: bool
      displayName: External
      description: "`is_external` — whether the member belongs to another
        organisation reached through Slack Connect"
    isForgotten:
      type: bool
      displayName: Forgotten
      description: "`is_forgotten` — whether the member's data has been erased
        under a right-to-be-forgotten request; the row survives as a tombstone"
    isProfileOnlyUser:
      type: bool
      displayName: Profile only
      description: "`is_profile_only_user` — whether the row is a profile
        Slack holds without an account behind it"
    suspended:
      type: bool
      displayName: Suspended
      description: "`suspended` — whether the account is suspended, which
        is distinct from `deleted`"
    restrictedUserType:
      type: int
      displayName: Restricted user type
      description: >-
        `restricted_user_type` — Slack's numeric guest classification, beside
        the isRestricted booleans. An integer, not an enum: the response carries
        no spelling for it
    locale:
      type: string
      displayName: Locale
      description: >-
        `locale` — the member's display language, returned only when users.list/users.info
        were asked with include_locale. A BCP 47 tag (en-US, ja-JP); a growing
        set, so a string
    presence:
      type: string
      displayName: Presence
      description: >-
        `presence` — whether Slack currently considers the member reachable.
        Returned only by users.info with presence, and only for some tokens
        — seen: active, away
    manualPresence:
      type: string
      displayName: Manual presence
      description: >-
        `manual_presence` — the presence the member SET, as opposed to the
        one Slack inferred. Self-only — seen: active, away
    firstLogin:
      type: datetime
      displayName: First login
      description: "`first_login` — epoch seconds of the member's first sign
        in; absent, or 0, for a member who never has"
    has2fa:
      type: bool
      displayName: Two-factor
      description: "users.list `has_2fa` — whether two-factor authentication
        is on. Admin-only; absent otherwise"
    twoFactorType:
      type: string
      displayName: Two-factor type
      description: >-
        how the second factor is delivered. A growing Slack-side list, so
        a string — seen: app, sms
    whoCanShareContactCard:
      type: string
      displayName: Contact card sharing
      description: >-
        who may share this person's contact card. A growing Slack-side list,
        so a string — seen: EVERYONE, NO_ONE
    profile:
      type: object
      displayName: Profile
      description: >-
        the profile Slack renders this person from, in Slack's own shape and
        kept whole — the display name lives here and nowhere else
      fields:
        firstName:
          type: string
          description: "`first_name` — the given name on the profile"
        lastName:
          type: string
          description: "`last_name` — the family name on the profile"
        realName:
          type: string
          description: "`real_name` — the full name on the profile"
        realNameNormalized:
          type: string
          description: "`real_name_normalized` — the full name with non-Latin
            characters folded"
        displayName:
          type: string
          description: "`display_name` — WHAT SLACK RENDERS THIS PERSON AS.
            Empty when they never set one; Slack falls back to real_name"
        displayNameNormalized:
          type: string
          description: "`display_name_normalized` — the display name with
            non-Latin characters folded"
        email:
          type: email
          description: >-
            `email` — the address the person mapping matches on. Absent without
            users:read.email, and absent for most bots
        phone:
          type: string
          description: "`phone` — as the person typed it, so a string and
            not a phone: Slack normalises nothing"
        skype:
          type: string
          description: "`skype` — the legacy Skype handle field, still sent
            and almost always empty"
        pronouns:
          type: string
          description: "`pronouns` — as the person typed them"
        jobTitle:
          type: string
          description: >-
            `title` — the job title on the profile. Renamed because `title`
            is reserved at every level of the dialect
        startDate:
          type: date
          description: "`start_date` — the day the person started, when the
            workspace collects it"
        avatarHash:
          type: string
          description: "`avatar_hash` — the hash that changes when the avatar
            does"
        isCustomImage:
          type: bool
          description: "`is_custom_image` — whether the avatar was uploaded
            rather than generated"
        image24:
          type: url
          description: "`image_24` — the 24px avatar"
        image32:
          type: url
          description: "`image_32` — the 32px avatar"
        image48:
          type: url
          description: "`image_48` — the 48px avatar"
        image72:
          type: url
          description: "`image_72` — the 72px avatar"
        image192:
          type: url
          description: "`image_192` — the 192px avatar"
        image512:
          type: url
          description: "`image_512` — the 512px avatar"
        image1024:
          type: url
          description: "`image_1024` — the 1024px avatar"
        imageOriginal:
          type: url
          description: "`image_original` — the avatar as uploaded"
        statusText:
          type: string
          description: "`status_text` — the status the person set, as they
            typed it"
        statusEmoji:
          type: string
          description: "`status_emoji` — the status emoji, in :colon: form"
        statusTextCanonical:
          type: string
          description: "`status_text_canonical` — Slack's canonical wording
            for a status set from a preset"
        statusExpiration:
          type: datetime
          description: "`status_expiration` — when the status clears, epoch
            seconds. 0 means never, and is not written"
        statusEmojiDisplayInfo:
          type: object
          repeated: true
          description: "`status_emoji_display_info` — how each status emoji
            renders for this workspace"
          fields:
            emojiName:
              type: string
              description: "`emoji_name` — the emoji's name without colons"
            displayUrl:
              type: url
              description: "`display_url` — where the custom emoji image is
                served from"
            unicode:
              type: string
              description: "`unicode` — the codepoints, when the emoji is
                a standard one"
            displayAlias:
              type: string
              description: "`display_alias` — the name Slack shows when the
                emoji is an alias of another"
        alwaysActive:
          type: bool
          description: "`always_active` — whether Slack never marks this user
            away (bots and apps)"
        huddleState:
          type: string
          description: >-
            `huddle_state` — whether the person is in a huddle. A growing
            Slack-side list, so a string — seen: default_unset, in_a_huddle
        huddleStateCallId:
          type: string
          description: "`huddle_state_call_id` — the call the huddle state
            refers to"
        huddleStateExpirationTs:
          type: datetime
          description: "`huddle_state_expiration_ts` — when the huddle state
            lapses, epoch seconds"
        apiAppId:
          type: string
          description: "`api_app_id` — the app this profile belongs to, on
            a bot user"
        bot:
          type: reference
          kind: providers.substrate.reamde.dev/slack/bot
          description: >-
            `bot_id` — the bot identity behind this app user. A reference:
            a bot kind exists, and an id we mirror is never a string (T-021)
        guestInvitedBy:
          type: reference
          kind: providers.substrate.reamde.dev/slack/user
          description: "`guest_invited_by` — the member who invited this guest"
        guestExpirationTs:
          type: datetime
          description: "`guest_expiration_ts` — when a guest account lapses,
            epoch seconds"
        team:
          type: reference
          kind: providers.substrate.reamde.dev/slack/team
          description: >-
            `team` — the workspace this profile belongs to, which on a Slack
            Connect sender is not the workspace they were read in
        whoCanShareContactCard:
          type: string
          description: "`who_can_share_contact_card` — the profile's own copy
            of the member object's setting"
        username:
          type: string
          description: >-
            `username` — the handle Slack renders for this profile. The member
            object's `name` beside it can differ, and both are kept: neither
            is derivable from the other
        lastAvatarImageHash:
          type: string
          description: >-
            `last_avatar_image_hash` — the hash of the previous avatar, which
            Slack uses to invalidate its caches
        statusClearOnFocusEnd:
          type: bool
          description: "`status_clear_on_focus_end` — whether the status clears
            when the member's focus session ends"
        membershipsCount:
          type: int
          description: "`memberships_count` — how many workspaces of the enterprise
            grid this profile belongs to"
        updated:
          type: datetime
          description: "`updated` — epoch seconds of the last change to the
            PROFILE, which moves independently of the member object's"
        fields:
          type: object
          keyed: true
          description: >-
            `fields` — the workspace's custom profile fields, keyed by Slack's
            field id (Xf…). Slack sends an empty ARRAY when there are none
          fields:
            value:
              type: string
              description: what the person put in the field
            alt:
              type: string
              description: the alternate text Slack stores beside the value
    # relations
    team:
      type: reference
      kind: providers.substrate.reamde.dev/slack/team
      displayName: Workspace
      description: >-
        `team_id` — the workspace this row was read in. A reference, because
        the workspace is mirrored; profile.team is the user's HOME workspace
        and differs on a Slack Connect sender
    enterpriseUser:
      type: object
      displayName: Enterprise user
      description: "`enterprise_user` — the grid identity behind this member,
        when the workspace is on an Enterprise Grid"
      fields:
        enterpriseUserId:
          type: string
          description: "`id` — the grid-wide user id (W…), which differs from
            this row's workspace-local userId"
        enterpriseId:
          type: string
          description: "`enterprise_id` — the grid organisation (E…)"
        enterpriseName:
          type: string
          description: "`enterprise_name` — the grid organisation's name"
        isAdmin:
          type: bool
          description: "`is_admin` — whether they administer the grid"
        isOwner:
          type: bool
          description: "`is_owner` — whether they own the grid"
        isPrimaryOwner:
          type: bool
          description: "`is_primary_owner` — whether they are the grid's primary
            owner"
        teams:
          type: reference
          kind: providers.substrate.reamde.dev/slack/team
          repeated: true
          description: "`teams` — the workspaces on the grid this person belongs
            to"
    # instants
    updated:
      type: datetime
      displayName: Profile updated
      description: "`updated` — when Slack last saw this member object change,
        epoch seconds"
---
# ---- mirror: one conversation ----------------------------------------------
# conversations.list / conversations.info, one row per (team, channel) — a
# public channel, a private channel, a group DM or a 1:1 DM, which in Slack's
# model are ONE type with flags, and are mirrored as one kind with those
# flags. Written mint-then-patch, so the thinner shape conversations.list
# returns never erases what conversations.info filled in.
#
# THIS ROW CARRIES NO CURSOR. The per-conversation history cursors live on
# slack/conversationsync, so a page of history never bumps this row's version.
#
# IT DOES BIND `temporal`. A conversation has one instant of its own —
# `created` — and the guide binds the trait wherever there is one. The
# earlier refusal ("900 channel creations would drown the timeline") was a
# CONSUMER's decision taken inside the mirror: which rows a timeline shows is
# the timeline's business, and a mirror that hides a fact so a reader is not
# bothered by it is not a mirror.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/slack/conversation
data:
  authority: providers.substrate.reamde.dev
  package: slack
  description: >-
    A Slack channel or direct message. One Slack conversation from conversations.info:
    a channel, a private channel, a group DM or a 1:1 DM, told apart by Slack's
    own flags. Members come from conversations.members. The envelope is dropped,
    sync state lives on slack/conversationsync, `at` is `created`, and history
    is walked only where the account's user is a member.
  names:
    singular: conversation
  traits:
    - substrate.reamde.dev/core/temporal(point)
  displayTemplate: "{name|conversationId}"
  properties:
    # identity
    account:
      type: reference
      kind: providers.substrate.reamde.dev/slack/account
      required: true
      onDelete: cascade
      displayName: Account
      description: the account this conversation was synced through
    conversationId:
      type: string
      required: true
      displayName: Conversation ID
      description: "conversations.info `id` — Slack's id for the conversation
        (C…, G… or D…), and the second half of this row's provider key"
    # `created` is the temporal trait's `at` and is NOT redeclared beside it.
    # the channel object's own scalars, in conversations.info's order
    name:
      type: string
      displayName: Name
      description: "the channel name without the #. Absent on a 1:1 DM, which
        Slack does not name"
    nameNormalized:
      type: string
      displayName: Normalized name
      description: "`name_normalized` — the name with characters Slack cannot
        put in a channel name folded out"
    isChannel:
      type: bool
      displayName: Channel
      description: whether Slack calls this a channel
    isGroup:
      type: bool
      displayName: Group
      description: whether Slack calls this a group — a private channel's
        legacy shape
    isIm:
      type: bool
      displayName: DM
      description: whether this is a 1:1 direct message
    isMpim:
      type: bool
      displayName: Group DM
      description: whether this is a multi-person direct message
    isPrivate:
      type: bool
      displayName: Private
      description: whether the conversation is private
    isArchived:
      type: bool
      displayName: Archived
      description: whether the channel has been archived
    isGeneral:
      type: bool
      displayName: Default channel
      description: whether this is the workspace's default channel
    isShared:
      type: bool
      displayName: Shared
      description: whether the conversation is shared with another workspace
        (Slack Connect)
    isOrgShared:
      type: bool
      displayName: Org shared
      description: "`is_org_shared` — whether it is shared across an Enterprise
        Grid organisation"
    isExtShared:
      type: bool
      displayName: Externally shared
      description: "`is_ext_shared` — whether it is shared with an outside
        organisation"
    isPendingExtShared:
      type: bool
      displayName: Pending external share
      description: "`is_pending_ext_shared` — whether an external share has
        been offered and not yet accepted"
    isMember:
      type: bool
      displayName: Joined
      description: >-
        whether the token's user is in it — Slack's own fact about the caller.
        A channel they are not in has no readable history, so the sync does
        not ask for any
    isOpen:
      type: bool
      displayName: Open
      description: "`is_open` — whether the caller has this DM open in their
        client"
    isUserDeleted:
      type: bool
      displayName: Partner deactivated
      description: "`is_user_deleted` — on a 1:1 DM, whether the person on
        the other side has been deactivated"
    unlinked:
      type: int
      displayName: Unlinked
      description: "`unlinked` — Slack's counter for channels detached from
        a shared org; 0 on an ordinary channel"
    # Posting, freezing and visibility. Every one of these was already being
    # WRITTEN by the sync and rejected by this declaration.
    isReadOnly:
      type: bool
      displayName: Read only
      description: "`is_read_only` — whether members may read but not post"
    isThreadOnly:
      type: bool
      displayName: Thread only
      description: "`is_thread_only` — whether replies are allowed but new
        top-level messages are not"
    isNonThreadable:
      type: bool
      displayName: Not threadable
      description: "`is_non_threadable` — whether the conversation refuses
        threads altogether"
    isFrozen:
      type: bool
      displayName: Frozen
      description: "`is_frozen` — whether an admin has frozen the conversation"
    frozenReason:
      type: string
      displayName: Frozen reason
      description: "`frozen_reason` — why it was frozen. A growing Slack-side
        list, so a string"
    isStarred:
      type: bool
      displayName: Starred
      description: >-
        `is_starred` — whether the CALLER has starred it. Slack's own fact
        about the caller, like is_member, and not a connector-invented owner-relative
        flag
    hasPins:
      type: bool
      displayName: Has pins
      description: "`has_pins` — whether anything is pinned in the conversation"
    noLatest:
      type: bool
      displayName: No latest
      description: >-
        `no_latest` — Slack's marker that it deliberately omitted `latest`
        from this response, which is different from a conversation with no
        messages
    isChannelAgentEnabled:
      type: bool
      displayName: Channel agent enabled
      description: "`is_channel_agent_enabled` — whether a Slack AI channel
        agent is turned on here"
    isExtWsShared:
      type: bool
      displayName: External workspace shared
      description: "`is_ext_ws_shared` — whether the conversation is shared
        with an external workspace"
    isFile:
      type: bool
      displayName: File conversation
      description: "`is_file` — whether the conversation is a file's own comment
        thread rather than a channel"
    isOrgDefault:
      type: bool
      displayName: Org default
      description: "`is_org_default` — whether every member of the enterprise
        grid is added to this channel by default"
    isOrgMandatory:
      type: bool
      displayName: Org mandatory
      description: "`is_org_mandatory` — whether members of the grid may not
        leave this channel"
    isGlobalShared:
      type: bool
      displayName: Globally shared
      description: "`is_global_shared` — whether the channel is shared across
        every workspace of the grid"
    locale:
      type: string
      displayName: Locale
      description: >-
        `locale` — the conversation's display language, returned when conversations.info
        was asked with include_locale. A BCP 47 tag; a growing set, so a string
    retentionDuration:
      type: int
      displayName: Retention duration
      description: "`retention_duration` — how many days messages are kept,
        when the conversation overrides the workspace policy"
    useCase:
      type: string
      displayName: Use case
      description: "`use_case` — what Slack was told the channel is for. A
        growing Slack-side list, so a string"
    enterpriseId:
      type: string
      displayName: Enterprise ID
      description: >-
        `enterprise_id` — the enterprise grid this belongs to (E…). A string,
        not a reference: this bundle mirrors no enterprise kind, and an opaque
        id is not a relation
    conversationHostId:
      type: string
      displayName: Host ID
      description: >-
        `conversation_host_id` — who HOSTS a Slack Connect conversation: either
        a team id (T…) or an enterprise id (E…). Two namespaces, so no single
        reference can pin it
    numMembers:
      type: int
      displayName: Members
      description: "`num_members` — how many people are in it, when conversations.list
        says. Slack omits it on a DM"
    priority:
      type: float
      displayName: Priority
      description: "`priority` — Slack's own relevance score for this conversation
        and this caller"
    previousNames:
      type: string
      repeated: true
      displayName: Previous names
      description: "`previous_names` — every name this channel has been renamed
        away from, newest first"
    unreadCount:
      type: int
      displayName: Unread
      description: "`unread_count` — how many messages the caller has not
        read. Slack's own fact about the caller"
    unreadCountDisplay:
      type: int
      displayName: Unread (display)
      description: "`unread_count_display` — the unread count Slack renders,
        which excludes joins and leaves"
    properties:
      type: json
      renamedFrom: conversationProperties
      displayName: Channel properties
      description: >-
        `properties` — canvas, tabs, huddle and channel-workflow settings.
        json: Slack publishes no schema and the arms differ per feature
    # relations
    contextTeam:
      type: reference
      kind: providers.substrate.reamde.dev/slack/team
      displayName: Context workspace
      description: >-
        `context_team_id` — the workspace this conversation is being read
        in the context of. Was declared as `team`, which is a different fact
        and differs on a Connect channel
    creator:
      type: reference
      kind: providers.substrate.reamde.dev/slack/user
      displayName: Creator
      description: "`creator` — whoever created the channel. Absent on a DM,
        which nobody creates"
    user:
      type: reference
      kind: providers.substrate.reamde.dev/slack/user
      displayName: Partner
      description: "`user` — on a 1:1 DM, the person on the other side. Absent
        on every other kind of conversation"
    parentConversation:
      type: reference
      kind: providers.substrate.reamde.dev/slack/conversation
      displayName: Parent conversation
      description: "`parent_conversation` — the conversation a thread-turned-
        channel was split out of. Null on nearly everything"
    latest:
      type: reference
      kind: providers.substrate.reamde.dev/slack/message
      displayName: Latest message
      description: >-
        `latest` — the newest message, which conversations.info embeds whole.
        Mirrored as its own message row and pointed at, never inlined
    sharedTeams:
      type: reference
      kind: providers.substrate.reamde.dev/slack/team
      repeated: true
      displayName: Shared with
      description: "`shared_team_ids` — every workspace this conversation
        is shared with. References, because a workspace is mirrored"
    pendingConnectedTeams:
      type: reference
      kind: providers.substrate.reamde.dev/slack/team
      repeated: true
      displayName: Pending connections
      description: "`pending_connected_team_ids` — workspaces invited to this
        conversation that have not accepted"
    pendingShared:
      type: reference
      kind: providers.substrate.reamde.dev/slack/team
      repeated: true
      displayName: Pending shares
      description: "`pending_shared` — workspaces an external share has been
        offered to and not yet accepted"
    connectedTeams:
      type: reference
      kind: providers.substrate.reamde.dev/slack/team
      repeated: true
      displayName: Connected workspaces
      description: "`connected_team_ids` — every workspace connected to this
        conversation through Slack Connect"
    connectedLimitedTeams:
      type: reference
      kind: providers.substrate.reamde.dev/slack/team
      repeated: true
      displayName: Limited connections
      description: "`connected_limited_team_ids` — connected workspaces whose
        members see a limited view of the conversation"
    internalTeams:
      type: reference
      kind: providers.substrate.reamde.dev/slack/team
      repeated: true
      displayName: Internal workspaces
      description: "`internal_team_ids` — the workspaces of this organisation
        the conversation belongs to, as opposed to the connected ones"
    topic:
      type: object
      displayName: Topic
      description: "`topic` — the channel topic, who set it and when, in Slack's
        own shape"
      fields:
        value:
          type: string
          description: the topic text, in Slack mrkdwn
        creator:
          type: reference
          kind: providers.substrate.reamde.dev/slack/user
          description: "`creator` — who set the topic. A reference: the setter
            is a mirrored user"
        lastSet:
          type: datetime
          description: "`last_set` — when it was set, epoch seconds. 0 means
            never set, and is not written"
    purpose:
      type: object
      displayName: Purpose
      description: "`purpose` — the channel purpose, who set it and when,
        in Slack's own shape"
      fields:
        value:
          type: string
          description: the purpose text, in Slack mrkdwn
        creator:
          type: reference
          kind: providers.substrate.reamde.dev/slack/user
          description: "`creator` — who set the purpose"
        lastSet:
          type: datetime
          description: "`last_set` — when it was set, epoch seconds"
    # instants — `created` IS the temporal trait's `at` and is not
    # redeclared here (docs/kind-design.md §4).
    updated:
      type: datetime
      displayName: Updated
      description: "`updated` — when the channel object last changed, epoch
        MILLISECONDS (Slack's one departure from seconds)"
    lastRead:
      type: datetime
      displayName: Last read
      description: >-
        `last_read` — the ts the caller has read up to, as an instant. Slack's
        own fact about the caller. An instant, not a message reference: it
        need not name a message
    isMoved:
      type: datetime
      displayName: Moved
      description: >-
        `is_moved` — despite the `is_` spelling this is an epoch, not a boolean:
        when the conversation was moved between workspaces. It was being copied
        through as the raw number
    # from a sibling call
    members:
      type: reference
      kind: providers.substrate.reamde.dev/slack/user
      repeated: true
      displayName: Members
      description: >-
        the conversation's members, from conversations.members (one Tier-4
        call per channel, walked only when the account enables rosters)
---
# ---- mirror: one message ---------------------------------------------------
# One row per (team, channel, ts), from conversations.history and
# conversations.replies. A Slack ts is unique within a channel and immutable,
# so a message write is a put-if-absent followed by a patch of the fields a
# later read can legitimately move (reactions, edits, reply counts).
#
# ONE KIND FOR EVERY SUBTYPE. `subtype` is a string and the kind declares the
# UNION of every documented subtype's fields — `inviter` on channel_join,
# `root` on thread_broadcast, `files`/`upload` on file_share, `botId`/
# `botProfile`/`username` on bot_message — each optional, each description
# naming where it appears. `type` is NOT declared: it is the constant
# discriminator `message` on every row here.
#
# `temporal(point)` binds `at` to the ts, so a Slack message sits on the same
# timeline as a calendar event and a Gmail thread. `ts` is declared BESIDE it
# because it carries more than the instant: it is the identity, the cursor
# Slack takes verbatim, and the join key thread_ts and latest_reply are
# spelled in.
#
# The text is Slack's VERBATIM mrkdwn, `<@U…>` tokens and all; `mentions` and
# `channelMentions` are the lossless mechanical decode of those tokens, and
# the encoded source stays because the decode drops the rest of the sentence.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/slack/message
data:
  authority: providers.substrate.reamde.dev
  package: slack
  description: >-
    A message in Slack. One Slack message on the timeline, as conversations.history
    and conversations.replies return it: its verbatim mrkdwn, who wrote it,
    the thread it sits in, who it mentions, what it carried and who reacted.
    `at` is its ts. Every subtype is this one kind; `type` is always `message`
    and is not declared.
  purpose: supporting
  names:
    singular: message
  traits:
    - substrate.reamde.dev/core/temporal(point)
  displayTemplate: "{text|ts}"
  properties:
    # identity
    account:
      type: reference
      kind: providers.substrate.reamde.dev/slack/account
      required: true
      onDelete: cascade
      displayName: Account
      description: the account this message was synced through
    ts:
      type: string
      required: true
      displayName: Timestamp
      description: >-
        Slack's "<sec>.<usec>" message id, unique within the conversation
        and immutable. Declared beside `at` because it is the identity and
        the cursor Slack takes verbatim
    clientMsgId:
      type: string
      displayName: Client message ID
      description: "`client_msg_id` — the uuid the sending client minted,
        on a message a person typed"
    # the message event's own scalars
    type:
      type: enum
      values:
        - value: message
          label: message
      displayName: Type
      description: >-
        `type` — the event type, always `message` on a row this kind holds.
        A ONE-VALUE enum, not an omitted discriminator: the record says what
        it is, and a second value Slack adds is a widening
    subtype:
      type: string
      displayName: Subtype
      description: >-
        Slack's message subtype, absent on an ordinary message. A growing
        list, so a string — bot_message, thread_broadcast, file_share, channel_join,
        me_message, huddle_thread and the rest
    text:
      type: text
      embed: true
      displayName: Text
      description: >-
        the message's VERBATIM Slack mrkdwn, mention tokens and all. Rendering
        it is the reader's job; mentions and channelMentions are the decoded
        form
    blocks:
      type: json
      displayName: Blocks
      description: >-
        the Block Kit payload. json because the shape is RECURSIVE — a block
        holds elements which hold elements — and nothing declarable states
        it
    attachments:
      type: json
      displayName: Attachments
      description: >-
        the legacy secondary attachments. json because the shape is HETEROGENEOUS
        by discriminator: every unfurl service sends its own
    username:
      type: string
      displayName: Username
      description: >-
        the name a webhook or bot post carried — the only name some bot messages
        have. On bot_message and webhook posts
    appId:
      type: string
      displayName: App ID
      description: "`app_id` — the Slack app behind the post (A…), on a message
        an app sent"
    upload:
      type: bool
      displayName: Upload
      description: "`upload` — whether the files rode in with this message
        rather than being shared into it. On file_share"
    displayAsBot:
      type: bool
      displayName: Display as bot
      description: "`display_as_bot` — whether Slack renders the post as an
        app's rather than a person's"
    isLocked:
      type: bool
      displayName: Thread locked
      description: "`is_locked` — whether the thread has been locked against
        further replies. On a thread parent"
    subscribed:
      type: bool
      displayName: Subscribed
      description: >-
        `subscribed` — whether the caller follows this thread. Slack's own
        fact about the caller. On a thread parent
    replyCount:
      type: int
      displayName: Replies
      description: "`reply_count` — how many replies the thread has. On a
        thread parent"
    replyUsersCount:
      type: int
      displayName: Reply participants
      description: "`reply_users_count` — how many distinct people replied.
        On a thread parent"
    hidden:
      type: bool
      displayName: Hidden
      description: "`hidden` — whether Slack hides the message from the channel's
        rendering"
    isStarred:
      type: bool
      displayName: Starred
      description: "`is_starred` — whether the caller starred it. Slack's
        own fact about the caller"
    channelType:
      type: string
      displayName: Channel type
      description: >-
        `channel_type` — which kind of conversation the message arrived in,
        as the event spells it. A growing list, so a string — channel, group,
        im, mpim
    topic:
      type: string
      displayName: Topic
      description: >-
        `topic` — the new channel topic, on the channel_topic and group_topic
        subtypes. Was `messageTopic`; nothing collides here, so the API's
        name stands
    purpose:
      type: string
      displayName: Purpose
      description: "`purpose` — the new channel purpose, on the channel_purpose
        and group_purpose subtypes"
    name:
      type: string
      displayName: New name
      description: "`name` — the channel's new name, on the channel_name subtype"
    oldName:
      type: string
      displayName: Old name
      description: "`old_name` — the channel's previous name, on the channel_name
        subtype"
    metadata:
      type: json
      displayName: Metadata
      description: >-
        `metadata` — the metadata an app attached, WHOLE: `{event_type, event_payload}`
        as Slack sends it. json because the payload is heterogeneous by event
        type. Was flattened into two invented properties
    icons:
      type: object
      displayName: Icons
      description: "`icons` — the icon a bot or webhook post rendered with"
      fields:
        emoji:
          type: string
          description: "`emoji` — the emoji the post rendered as, in :colon:
            form"
        image64:
          type: url
          description: "`image_64` — the 64px icon the post rendered with"
    triggerId:
      type: string
      displayName: Trigger ID
      description: "`trigger_id` — the workflow trigger that produced the
        post, on a message Workflow Builder sent"
    workflowId:
      type: string
      displayName: Workflow ID
      description: "`workflow_id` — the workflow that produced the post, on
        a message Workflow Builder sent"
    language:
      type: object
      displayName: Language
      description: >-
        `language` — what Slack's own detector made of the text. Undocumented
        but sent on every message the detector ran on
      fields:
        locale:
          type: string
          description: "`locale` — the BCP 47 tag the detector chose, e.g.
            en-US"
        isReliable:
          type: bool
          description: "`is_reliable` — whether the detector is confident
            in the locale"
    permalink:
      type: url
      displayName: Permalink
      description: >-
        the link back to the message on Slack — COMPOSED, NOT FETCHED, from
        the workspace host in Slack's documented form https://<host>/archives/<channel>/p<ts>
    # relations
    channel:
      type: reference
      kind: providers.substrate.reamde.dev/slack/conversation
      required: true
      mustExist: true
      onDelete: cascade
      displayName: Conversation
      description: >-
        `channel` — the conversation this message arrived in. Required and
        cascading: a message cannot exist without it
    team:
      type: reference
      kind: providers.substrate.reamde.dev/slack/team
      displayName: Workspace
      description: "`team` — the workspace the message was posted in"
    userTeam:
      type: reference
      kind: providers.substrate.reamde.dev/slack/team
      displayName: Author's workspace
      description: "`user_team` — the author's own workspace, which on a Slack
        Connect message is not the channel's"
    sourceTeam:
      type: reference
      kind: providers.substrate.reamde.dev/slack/team
      displayName: Source workspace
      description: "`source_team` — the workspace the message was sent from,
        on a shared channel"
    user:
      type: reference
      kind: providers.substrate.reamde.dev/slack/user
      displayName: Author
      description: >-
        `user` — who wrote it. A reference at the mirrored person, never their
        id. Absent on a webhook post, which has only a username
    bot:
      type: reference
      kind: providers.substrate.reamde.dev/slack/bot
      displayName: Bot
      description: >-
        `bot_id` — the bot identity that posted it, as a reference: a bot
        has its own endpoint (bots.info), so it is a kind. Not the app — `appId`
        is a different identity
    parent:
      type: reference
      kind: providers.substrate.reamde.dev/slack/message
      displayName: Thread parent
      description: >-
        `thread_ts` — the thread parent this is a reply to, as a reference.
        No mustExist: the parent may be mirrored after the reply. Absent outside
        a thread
    root:
      type: reference
      kind: providers.substrate.reamde.dev/slack/message
      displayName: Thread root
      description: >-
        `root` — the thread parent Slack inlines on a thread_broadcast. The
        same message as parent, mirrored as its own row and pointed at
    latestReply:
      type: reference
      kind: providers.substrate.reamde.dev/slack/message
      displayName: Latest reply
      description: >-
        `latest_reply` — the newest reply in this thread. On a thread parent.
        The thread walk descends only where this is newer than the cursor
    parentUser:
      type: reference
      kind: providers.substrate.reamde.dev/slack/user
      displayName: Replying to
      description: "`parent_user_id` — who wrote the thread parent. On a reply"
    replyUsers:
      type: reference
      kind: providers.substrate.reamde.dev/slack/user
      repeated: true
      displayName: Reply participants
      description: >-
        `reply_users` — the MEMBERS who replied in this thread (U…, W…), on
        a thread parent. Slack documents bot ids in the same array; a reference
        pins one kind, so the B… half is replyBots
    replyBots:
      type: reference
      kind: providers.substrate.reamde.dev/slack/bot
      repeated: true
      displayName: Reply bots
      description: >-
        `reply_users` — the BOTS that replied in this thread (B…). The other
        half of one API array; see replyUsers
    xFiles:
      type: reference
      kind: providers.substrate.reamde.dev/slack/file
      repeated: true
      displayName: Referenced files
      description: >-
        `x_files` — files named by id rather than embedded. Distinct from
        `files`, which carries the objects; a thin file row is minted so the
        reference resolves
    inviter:
      type: reference
      kind: providers.substrate.reamde.dev/slack/user
      displayName: Inviter
      description: "`inviter` — who invited the joining member. On channel_join
        and group_join"
    mentions:
      type: reference
      kind: providers.substrate.reamde.dev/slack/user
      repeated: true
      displayName: Mentions
      description: >-
        every person the text @-mentions, in order, decoded from the `<@U…>`
        tokens. A lossless mechanical decode; the encoded text stays in `text`
    channelMentions:
      type: reference
      kind: providers.substrate.reamde.dev/slack/conversation
      repeated: true
      displayName: Channel mentions
      description: >-
        every conversation the text links, in order, decoded from the `<#C…|name>`
        tokens. The same decode as mentions, for channels
    files:
      type: reference
      kind: providers.substrate.reamde.dev/slack/file
      repeated: true
      displayName: Files
      description: >-
        `files` — the files shared with this message, each mirrored as its
        own slack/file row. On file_share and on any message with an upload
    reactions:
      type: object
      repeated: true
      displayName: Reactions
      description: "`reactions` — the emoji left on this message, with who
        left each one"
      fields:
        name:
          type: string
          description: "`name` — the emoji's name without colons, with a skin
            tone suffix when one was chosen"
        count:
          type: int
          description: "`count` — how many people left it, as Slack counts
            it"
        users:
          type: reference
          kind: providers.substrate.reamde.dev/slack/user
          repeated: true
          description: >-
            `users` — who left it. References, and Slack truncates the list
            on a busy message, so `count` is not its length
        url:
          type: url
          description: "`url` — where a custom emoji's image is served from,
            when Slack supplies one"
    edited:
      type: object
      displayName: Edited
      description: "`edited` — who last edited the message and when. Absent
        on a message nobody edited"
      fields:
        user:
          type: reference
          kind: providers.substrate.reamde.dev/slack/user
          description: "`user` — who edited it"
        ts:
          type: datetime
          description: >-
            `ts` — when it was edited. A datetime and not a reference: this
            ts names an instant, not another message
    pinnedTo:
      type: reference
      kind: providers.substrate.reamde.dev/slack/conversation
      repeated: true
      displayName: Pinned to
      description: "`pinned_to` — the conversations this message is pinned
        in. Usually its own"
    pinnedInfo:
      type: object
      displayName: Pin
      description: "`pinned_info` — who pinned the message and when"
      fields:
        pinnedBy:
          type: reference
          kind: providers.substrate.reamde.dev/slack/user
          description: "`pinned_by` — who pinned it"
        pinnedTs:
          type: datetime
          description: "`pinned_ts` — when it was pinned, epoch seconds"
    # instants
    lastRead:
      type: datetime
      displayName: Last read
      description: >-
        `last_read` — the ts the caller has read this thread up to, as an
        instant. Slack's own fact about the caller. On a thread parent
---
# ---- mirror: one bot identity ----------------------------------------------
# A bot is a KIND by the two-part test: bots.info is its own endpoint, and the
# same identity appears in a message's `bot_id`, in `bot_profile` and on a
# user's `profile.bot_id`. So `message.bot` is a reference and the row is
# minted from whatever payload named it — a bare `bot_id` mints the identity,
# an inlined `bot_profile` fills the rest in.
#
# A BOT IS NOT AN APP. `bot_id` (B…) names the posting identity; `app_id` (A…)
# names the Slack app behind it, which this bundle does not mirror and keeps
# as a string on both rows.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/slack/bot
data:
  authority: providers.substrate.reamde.dev
  package: slack
  description: >-
    A bot that posts in your Slack workspace. One Slack bot identity, from
    the bot_profile a message inlines and from bots.info: its name, its icons,
    the app behind it and the user it posts as. Minted thin from a bare bot_id
    and read from bots.info when nothing carried a profile.
  purpose: supporting
  names:
    singular: bot
  displayTemplate: "{name|botId}"
  properties:
    # identity
    account:
      type: reference
      kind: providers.substrate.reamde.dev/slack/account
      required: true
      onDelete: cascade
      displayName: Account
      description: the account this bot was synced through
    botId:
      type: string
      required: true
      displayName: Bot ID
      description: "bots.info `id` — Slack's id for the bot identity (B…),
        and the provider key behind this row's id"
    # the bot object's own scalars
    name:
      type: string
      displayName: Name
      description: "`name` — the name the bot posts under"
    appId:
      type: string
      displayName: App ID
      description: >-
        `app_id` — the Slack app behind this bot (A…). A string: an app is
        a different identity and this bundle mirrors none
    deleted:
      type: bool
      displayName: Removed
      description: "`deleted` — whether the app behind the bot has been removed
        from the workspace"
    icons:
      type: object
      displayName: Icons
      description: "`icons` — the bot's icon, one URL per rendered size"
      fields:
        image36:
          type: url
          description: "`image_36` — the 36px icon"
        image48:
          type: url
          description: "`image_48` — the 48px icon"
        image72:
          type: url
          description: "`image_72` — the 72px icon"
    # relations
    team:
      type: reference
      kind: providers.substrate.reamde.dev/slack/team
      displayName: Workspace
      description: "`team_id` — the workspace the app is installed in"
    user:
      type: reference
      kind: providers.substrate.reamde.dev/slack/user
      displayName: Bot user
      description: >-
        `user_id` — the user row this bot posts as, when bots.info supplies
        it. A bot and its user are two identities for one app
    # instants
    updated:
      type: datetime
      displayName: Updated
      description: "`updated` — when the bot profile last changed, epoch seconds"
---
# ---- mirror: one file ------------------------------------------------------
# A file object, as conversations.history embeds it on a file_share and as
# files.info returns it whole. Its own kind by the two-part test: it has its
# own endpoint (files.info) and it appears in more than one kind's payload.
# The mirror never inlines it — the sync upserts the row from the embedded
# fields and the message points at it.
#
# This bundle does NOT fetch file CONTENT. Every url here is Slack's own; the
# bytes stay on Slack.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/slack/file
data:
  authority: providers.substrate.reamde.dev
  package: slack
  description: >-
    A file shared in Slack. One file shared in Slack, from the file objects
    conversations.history embeds and from files.info: its name, type, size,
    thumbnails, media renditions, canvas and external facts, access and where
    it has been shared. `at` is the file's `created`. The bytes are never
    fetched.
  purpose: supporting
  names:
    singular: file
  traits:
    - substrate.reamde.dev/core/temporal(point)
  displayTemplate: "{name|fileId}"
  properties:
    # identity
    account:
      type: reference
      kind: providers.substrate.reamde.dev/slack/account
      required: true
      onDelete: cascade
      displayName: Account
      description: the account this file was synced through
    fileId:
      type: string
      required: true
      displayName: File ID
      description: "the file object's `id` — Slack's id for the file (F…),
        and the provider key behind this row's id"
    # the file object's own scalars
    name:
      type: string
      displayName: Name
      description: "`name` — the file's name as uploaded, with its extension"
    fileTitle:
      type: string
      displayName: Title
      description: >-
        `title` — the title Slack shows for the file, which starts as the
        name. Renamed because `title` is reserved at every level of the dialect
    mimetype:
      type: string
      displayName: MIME type
      description: "`mimetype` — the content type Slack detected, e.g. image/png"
    filetype:
      type: string
      displayName: File type
      description: "`filetype` — Slack's own short type word, e.g. png, pdf,
        java. A growing list, so a string"
    prettyType:
      type: string
      displayName: Type
      description: "`pretty_type` — the type as Slack renders it to a human,
        e.g. PNG, PDF Document"
    mode:
      type: string
      displayName: Mode
      description: >-
        `mode` — how the file is stored. A growing Slack-side list, so a string
        — hosted, external, snippet, post, space, email, tombstone
    editable:
      type: bool
      displayName: Editable
      description: "`editable` — whether Slack can edit the file in place
        (a snippet or a post)"
    isExternal:
      type: bool
      displayName: External
      description: "`is_external` — whether the bytes live outside Slack"
    externalType:
      type: string
      displayName: External type
      description: "`external_type` — which external service holds it, when
        it is external"
    isPublic:
      type: bool
      displayName: Public
      description: "`is_public` — whether the file is visible beyond the conversations
        it was shared in"
    publicUrlShared:
      type: bool
      displayName: Public link shared
      description: "`public_url_shared` — whether someone has minted the public
        link"
    displayAsBot:
      type: bool
      displayName: Display as bot
      description: "`display_as_bot` — whether Slack renders the share as
        an app's"
    username:
      type: string
      displayName: Username
      description: "`username` — the name the uploading app posted under,
        when no user did"
    size:
      type: int
      displayName: Size
      description: "`size` — the file's size in bytes"
    isStarred:
      type: bool
      displayName: Starred
      description: "`is_starred` — whether the caller starred it. Slack's
        own fact about the caller"
    numStars:
      type: int
      displayName: Stars
      description: "`num_stars` — how many people starred the file. Slack's
        own count, not a length of a list this row holds"
    hasRichPreview:
      type: bool
      displayName: Rich preview
      description: "`has_rich_preview` — whether Slack renders a rich preview
        for it"
    isModifiedByAi:
      type: bool
      displayName: AI modified
      description: "`is_modified_by_ai` — whether a Slack AI feature changed
        the file"
    mediaDisplayType:
      type: string
      displayName: Media display
      description: >-
        `media_display_type` — how Slack renders the media. A growing Slack-side
        list, so a string — unknown, video, audio
    fileAccess:
      type: string
      displayName: Access
      description: >-
        `file_access` — whether the caller may read it. A growing Slack-side
        list, so a string — visible, check_file_info, file_not_found
    skippedShares:
      type: bool
      displayName: Shares skipped
      description: "`skipped_shares` — whether Slack left the shares list
        out of this payload"
    commentsCount:
      type: int
      displayName: Comments
      description: "`comments_count` — how many comments the file has, as
        Slack counts them"
    originalW:
      type: int
      displayName: Width
      description: "`original_w` — the image's own width in pixels"
    originalH:
      type: int
      displayName: Height
      description: "`original_h` — the image's own height in pixels"
    lines:
      type: int
      displayName: Lines
      description: "`lines` — how many lines a snippet has"
    linesMore:
      type: int
      displayName: Lines beyond preview
      description: "`lines_more` — how many lines the preview leaves out"
    preview:
      type: text
      displayName: Preview
      description: "`preview` — the first lines of a text file or snippet,
        as Slack renders them"
    previewHighlight:
      type: text
      displayName: Preview (highlighted)
      description: "`preview_highlight` — the same preview with Slack's syntax
        highlighting markup"
    previewIsTruncated:
      type: bool
      displayName: Preview truncated
      description: "`preview_is_truncated` — whether the preview stops short
        of the file"
    plainText:
      type: text
      displayName: Plain text
      description: "`plain_text` — the file's text content, on a snippet or
        a post Slack holds as text"
    aiSummary:
      type: object
      displayName: AI summary
      description: "`ai_summary` — Slack AI's own summary of the file, when
        the workspace has the feature on"
      fields:
        summaryId:
          type: string
          description: "`id` — Slack's id for the summary"
        content:
          type: text
          description: "`content` — the summary text"
        status:
          type: string
          description: >-
            `status` — how far the summary got. A growing Slack-side list,
            so a string — COMPLETED, IN_PROGRESS, FAILED
        unfurlEnabled:
          type: bool
          description: "`unfurl_enabled` — whether Slack shows the summary
            in the message"
    urlPrivate:
      type: url
      displayName: URL
      description: "`url_private` — where the bytes are served from, to an
        authenticated caller"
    urlPrivateDownload:
      type: url
      displayName: Download URL
      description: "`url_private_download` — the same bytes with a download
        disposition"
    permalink:
      type: url
      displayName: Permalink
      description: "`permalink` — the file's page in Slack, as the API returns
        it"
    permalinkPublic:
      type: url
      displayName: Public permalink
      description: "`permalink_public` — the public link, when someone has
        minted one"
    # the thumbnails Slack rendered, one property per size — the API's own
    # names, with the digit joined per the rename rule (`thumb_360_w` ->
    # `thumb360W`).
    thumb64:
      type: url
      displayName: Thumbnail 64
      description: "`thumb_64` — the 64px thumbnail"
