    def _file_props(host, aid, team, f):
        props = {"account": aid, "fileId": f.get("id") or ""}
        props.update(_shape(f, _FILE_SCALARS, clear=True))
        at = _epoch_iso(f.get("created"))
        if at:
            # The file's own instant IS the trait's `at`, so it is not redeclared.
            props["at"] = at
        if f.get("user"):
            props["user"] = _user_ref(host, aid, team, f["user"])
        if f.get("user_team"):
            props["userTeam"] = _team_ref(host, aid, team, f["user_team"])
        for prop, api in (("channels", "channels"), ("groups", "groups"),
                          ("ims", "ims")):
            refs = _refs(host, aid, team, f.get(api), _conv_ref)
            if refs:
                props[prop] = refs
        if isinstance(f.get("shares"), dict) and f["shares"]:
            props["shares"] = f["shares"]
        # T-021, the hydration fields. `canvas_creator_id` is a user this bundle
        # mirrors and `source_canvas_id` is a FILE — a canvas is a file — so
        # neither is a bare id beside a reference (§2, the owner's rule).
        if f.get("canvas_creator_id"):
            props["canvasCreator"] = _user_ref(host, aid, team, f["canvas_creator_id"])
        if f.get("source_canvas_id"):
            props["sourceCanvas"] = _file_ref(host, aid, team, f["source_canvas_id"])
        if f.get("source_team"):
            props["sourceTeam"] = _team_ref(host, aid, team, f["source_team"])
        if "editors" in f:
            props["editors"] = _refs(host, aid, team, f.get("editors"),
                                     _user_ref) or None
        # `teams_shared_with` is ONE array of TWO identity namespaces, exactly as
        # `reply_users` is: a `T…` workspace this bundle mirrors and an `E…`
        # enterprise grid org it does not. Guide amendment 5, applied — never one
        # reference pinned at `team` with the enterprise ids minted into it.
        if "teams_shared_with" in f:
            ids = [t for t in (f.get("teams_shared_with") or []) if t]
            props["teamsSharedWith"] = _refs(
                host, aid, team, [t for t in ids if t[:1] == "T"], _team_ref) or None
            props["enterprisesSharedWith"] = [t for t in ids if t[:1] == "E"] or None
        # `dm_mpdm_users_with_file_access` is a list of {user_id, access}: the id
        # is a user row, so it is a reference INSIDE the value object.
        if "dm_mpdm_users_with_file_access" in f:
            grants = []
            for g in f.get("dm_mpdm_users_with_file_access") or []:
                if not isinstance(g, dict):
                    continue
                one = _shape(g, [("access", "access", None)])
                if g.get("user_id"):
                    one["user"] = _user_ref(host, aid, team, g["user_id"])
                if one:
                    grants.append(one)
            props["dmMpdmUsersWithFileAccess"] = grants or None
        media = f.get("media_progress")
        if isinstance(media, dict) and media:
            one = _shape(media, [("offsetMs", "offset_ms", None),
                                 ("maxOffsetMs", "max_offset_ms", None),
                                 ("durationMs", "duration_ms", None),
                                 ("mediaWatched", "media_watched", None)])
            if one:
                props["mediaProgress"] = one
        icon = f.get("product_icon")
        if isinstance(icon, dict) and icon:
            one = _shape(icon, [("altText", "alt_text", None), ("url", "url", None)])
            slack_file = icon.get("slack_file") or {}
            if isinstance(slack_file, dict) and slack_file.get("id"):
                one["slackFile"] = _file_ref(host, aid, team, slack_file["id"])
            props["productIcon"] = one or None
        elif "product_icon" in f:
            props["productIcon"] = None
        script = f.get("transcription")
        if isinstance(script, dict) and script:
            one = _shape(script, [("status", "status", None),
                                  ("locale", "locale", None)])
            preview = script.get("preview") or {}
            if isinstance(preview, dict) and preview:
                inner = _shape(preview, [("content", "content", None),
                                         ("hasMore", "has_more", None)])
                if inner:
                    one["preview"] = inner
            if one:
                props["transcription"] = one
        summary = f.get("ai_summary")
        if isinstance(summary, dict) and summary:
            one = _shape(summary, [("summaryId", "id", None),
                                   ("content", "content", None),
                                   ("status", "status", None),
                                   ("unfurlEnabled", "unfurl_enabled", None)])
            if one:
                props["aiSummary"] = one
        return props


    def _bot_props(host, aid, team, bot_id, profile=None):
        """A bot row. A bare `bot_id` mints the identity; a `bot_profile` (or a
        bots.info read) fills the rest in, and never nulls what it does not
        carry."""
