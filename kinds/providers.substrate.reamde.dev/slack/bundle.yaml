    MEMBERS_FRESH_HOURS = 24
    # The replies cursor is a conversation-wide maximum across its threads, so a
    # reply landing in thread B while thread A is walked would fall behind it
    # forever. Re-reading half an hour is free: message puts are if_absent.
    REPLIES_MARGIN = 1800
    # How many thread parents one conversation keeps under watch. A thread can
    # take a reply months after its last one, and an incremental history window
    # never shows an old parent again, so the watch is the only way that reply is
    # ever seen. Newest first, because an old silent thread is the one that can
