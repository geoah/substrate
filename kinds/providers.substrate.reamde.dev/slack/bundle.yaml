    # Slack's own mention encodings, decoded losslessly into references: a user
    # mention and a channel link. The text itself is kept verbatim.
    MENTION_RE = re.compile(r"<@([UWB][A-Z0-9]+)(?:\|[^>]*)?>")
    CHANNEL_RE = re.compile(r"<#([CDG][A-Z0-9]+)(?:\|[^>]*)?>")

    # MUTATION ENVELOPES, not messages. `message_changed` and `message_deleted`
    # carry no identity of their own: their `ts` is the event's, and the message
    # they speak about is nested (`message.ts`) or named (`deleted_ts`). They are
    # consumed by `_mutate`, never mirrored as rows — writing the envelope would
    # mint a message that never existed and leave the real one stale.
    #
    # EVERYTHING ELSE IS A MESSAGE. The denylist used to hold twenty subtypes —
    # joins, leaves, topic and purpose changes, archives, bot adds, pins,
    # posting-permission changes — and Slack persists every one of them in
    # `conversations.history`. A mirror that drops them is not a mirror of the
    # conversation; it is a mirror of its prose. `channel_topic` is how the
    # mirror knows who set the topic and when.
    MUTATION_SUBTYPES = {"message_changed", "message_deleted", "message_replied"}


    # ---------------------------------------------------------------- origin

    def _pinned(base):
        u = urllib.parse.urlsplit(base)
        host = (u.hostname or "").lower()
        if host in ("127.0.0.1", "localhost", "::1"):
            return True
        return u.scheme == "https" and (
            host == "slack.com" or host.endswith(".slack.com"))


    # ------------------------------------------------------------- the clock

    def _now_iso():
        return _dt.datetime.now(_dt.timezone.utc).replace(microsecond=0).isoformat()


    _TS_RE = re.compile(r"\s*(-?\d+)(?:\.(\d*))?\s*$")


    def _exact(whole, micros):
        """One instant, built from INTEGERS. `float(ts)` then
        `fromtimestamp(...)` is two lossy steps — a binary float cannot hold
        `1789491980.100249`, and rounding the microseconds away (or off by one)
        makes every Slack instant in the mirror wrong by up to a second while the
        `ts` beside it stays exact. Slack's `ts` is six fractional digits and
        nothing else, so the two halves are converted separately and never meet a
        float."""
        try:
            base = _dt.datetime.fromtimestamp(whole, _dt.timezone.utc)
        except (OverflowError, OSError, ValueError):
            return None
        return base.replace(microsecond=micros).isoformat()


    def _ts_iso(ts):
        """A Slack `ts` (`<seconds>.<6 digits>`) as an exact instant."""
        m = _TS_RE.match(str(ts)) if ts is not None else None
        if not m:
            return None
        frac = (m.group(2) or "")[:6].ljust(6, "0")
        return _exact(int(m.group(1)), int(frac or 0))


    def _epoch_iso(v):
        """Epoch SECONDS as Slack sends them; 0 means never and is not written.

        Slack writes a never-set epoch as `0`, which is a SENTINEL and not the
        first instant of 1970. A field that must be able to CLEAR says so by
        returning the sentinel marker, not by falling back to absence."""
        m = _TS_RE.match(str(v)) if v is not None else None
        if not m:
            return None
        whole = int(m.group(1))
        if whole <= 0 and not (m.group(2) or "").strip("0"):
            return None
        frac = (m.group(2) or "")[:6].ljust(6, "0")
        return _exact(whole, int(frac or 0))


    def _ms_iso(v):
        """Epoch MILLISECONDS — conversations.list `updated`, Slack's one
        departure from seconds. Split, never divided: `n / 1000.0` loses the
        millisecond on a large epoch."""
        try:
            n = int(v)
        except (TypeError, ValueError):
            return None
        if n <= 0:
            return None
        return _exact(n // 1000, (n % 1000) * 1000)


    def _wants(acct):
        return bool((acct.get("properties") or {}).get("enabledMessages"))


    def _due(props):
        # THE OWNER'S PAUSE holds the scheduled path (T-084). A record-sourced
        # delivery never reaches the body at all — the dispatcher settles a paused
        # record's deliveries as skips (decision 0085) — so this is the only door
        # the pause has to close here. Work already queued stays queued: a pause
        # is "stop walking", not "throw the drain away".
        if props.get("syncPaused"):
            return False
        # A rate-limit deadline outranks EVERYTHING, pending work included:
        # Slack asked us not to call before this instant and the answer to
        # calling anyway is another 429.
        nb = props.get("retryNotBefore")
        if nb:
            try:
                when = _dt.datetime.fromisoformat(str(nb).replace("Z", "+00:00"))
                if _dt.datetime.now(_dt.timezone.utc) < when:
                    return False
            except ValueError:
                pass
        freq = (props.get("syncFrequency") or "hourly").lower()
        if freq == "off":
            # Scheduling is off, so no NEW walk starts — but work already queued
            # is drained to completion rather than stranded mid-conversation.
            cur = props.get("streamCursors")
            return bool(isinstance(cur, dict) and _pending(cur))
        # Unfinished work outranks the cadence: a cold sync converges over
        # consecutive ticks instead of waiting a day between bites.
        cur = props.get("streamCursors")
        if isinstance(cur, dict) and _pending(cur):
            return True
        last = props.get("lastSyncedAt")
        if not last:
            return True
        try:
            seen = _dt.datetime.fromisoformat(str(last).replace("Z", "+00:00"))
        except ValueError:
            return True
        hours = 1 if freq == "hourly" else 24
        return _dt.datetime.now(_dt.timezone.utc) - seen >= _dt.timedelta(hours=hours)


    def _pending(cur):
        """Is there work left IN THIS WALK? Every queue AND every mid-page
        continuation — a paused users cursor, a half-walked history page, a
        half-read roster are all unfinished, and counting only the queues
        reported a settled account with a page outstanding.

        `retry` is NOT counted, and that is the distinction the word "pending"
        has to make. A retry entry is work for the NEXT walk: it is re-queued at
        the top of one, never inside this one. Counting it said "this drain did
        not finish" about a drain that did, which cost twice — `lastCompletedAt`
        was never stamped so the next walk stayed cold forever, and anything that
        drives an account while it reports pending work (the e2e runner's
        continuation rule) started a second walk immediately, folding it into the
        first. The failure is still visible: it rides on `streamCursors.failed`
        and the status still reads `[N failed]`.
        """
        if not isinstance(cur, dict):
            return 0
        n = sum(len(cur.get(k) or []) for k in
                ("queue", "info", "threads", "hydrate", "files", "bots",
                 "rosters"))
        n += sum(1 for k in ("work", "reply", "roster") if cur.get(k))
        if cur.get("cursor") or (cur.get("phase") or "done") != "done":
            n += 1
        return n


    def _pending_detail(cur):
        """WHAT is pending, not just how many.

        `ok (978 pending)` sends whoever reads it back into the log to find out
        which queue. The status has room for the breakdown and the breakdown is
        the whole diagnosis — it is also what said, in one line, that a drain
        reporting itself unfinished was counting a retry list."""
        if not isinstance(cur, dict):
            return ""
        bits = []
        for k in ("queue", "info", "threads", "hydrate", "files", "bots",
                  "rosters"):
            if cur.get(k):
                bits.append("%s x%d" % (k, len(cur[k])))
        for k in ("work", "reply", "roster"):
            if cur.get(k):
                bits.append(k)
        if cur.get("cursor"):
            bits.append("cursor")
        phase = cur.get("phase") or "done"
        if phase != "done":
            bits.append("phase " + phase)
        return ", ".join(bits)


    # ------------------------------------------------- the core `sync` trait
    #
    # Decision 0085: an accountconfig kind binds the core `sync` trait and the
    # body writes its twelve properties, so the Connections page and `substratectl
    # sync status` render this account without knowing it is Slack. Everything
    # below derives from the drain's OWN bookkeeping — `streamCursors` — so the
    # trait and the legacy `syncStatus` string can never disagree.
    #
    # THE THREE STREAMS ARE PHASES, not functions. One body walks the whole
    # workspace in ten phases; what a reader wants to see is the WORK — who, where
    # and what was said — so the phases are grouped into the three streams the
    # ticket names and each phase's queues are attributed to its stream. The
    # per-stream `pending` counts therefore SUM to `_pending()` exactly, which is
    # the invariant that keeps the breakdown honest.
    STREAM_PHASES = (
        ("users", ("team", "users")),
        ("conversations", ("conversations", "info", "members")),
        ("messages", ("history", "replies", "hydrate", "files", "bots")),
    )
    STREAM_NAMES = tuple(s for s, _ in STREAM_PHASES)
    PHASE_STREAM = {p: s for s, ps in STREAM_PHASES for p in ps}
    # The order the walk runs its phases in: a stream has ANSWERED a request only
    # once the walk has gone past every phase of it (`members` runs last, so the
    # conversations stream answers only at the end — deliberately conservative).
    PHASE_ORDER = ("team", "users", "conversations", "info", "history",
                   "replies", "hydrate", "files", "bots", "members")
    # Every queue `_pending()` counts, attributed to the stream that drains it.
    QUEUE_STREAM = {"queue": "messages", "info": "conversations",
                    "threads": "messages", "hydrate": "messages",
                    "files": "messages", "bots": "messages",
                    "rosters": "conversations"}
    WORK_STREAM = {"work": "messages", "reply": "messages",
                   "roster": "conversations"}


    def _stream_pending(cur):
        """This walk's unfinished work, split by stream. Sums to `_pending()`."""
        out = {s: 0 for s in STREAM_NAMES}
        if not isinstance(cur, dict):
            return out
        for key, stream in QUEUE_STREAM.items():
            out[stream] += len(cur.get(key) or [])
        for key, stream in WORK_STREAM.items():
            if cur.get(key):
                out[stream] += 1
        phase = cur.get("phase") or "done"
        if cur.get("cursor") or phase != "done":
            out[PHASE_STREAM.get(phase, "messages")] += 1
        return out


    def _walked(stream, phase):
        """Has the walk gone past every phase this stream owns?"""
        if (phase or "done") == "done":
            return True
        if phase not in PHASE_ORDER:
            return False
        last = max(PHASE_ORDER.index(p) for s, ps in STREAM_PHASES
                   if s == stream for p in ps)
        return PHASE_ORDER.index(phase) > last


    def _trait(props, cursors, state, message, now, run=None, at_phase=None):
        """The trait's properties for this stamp, as a patch fragment.

        `state` is the run's outcome — `ok`, `throttled` or `erroring`. A bounded
        drain is `ok`: the work it left is a COUNT (`syncProgress.pending`), not a
        failure, and the account reports itself due so the next tick continues it.
        `running` is never written by this body — the dispatcher owns it around a
        record-sourced delivery, and writing it on the scheduled path (which names
        no record, so nothing settles it) would strand the account there.
        """
        props = props or {}
        cursors = cursors if isinstance(cursors, dict) else {}
        run = run or {}
        phase = cursors.get("phase") or "done"
        per = _stream_pending(cursors)
        left = _pending(cursors)
        requested = props.get("syncRequestedAt")
        # WHICH stream failed: the one owning the phase the walk died in. A
        # failure with no phase at all (auth.test, before any walk) is every
        # stream's, because nothing was reached.
        failed = PHASE_STREAM.get(at_phase or phase) if state == "erroring" else None
        streams = dict(props.get("syncStreams") or {})
        for stream in STREAM_NAMES:
            entry = dict(streams.get(stream) or {})
            entry["message"] = message
            entry["pending"] = per.get(stream, 0)
            if state == "erroring":
                entry["state"] = ("erroring" if failed in (None, stream)
                                  else entry.get("state") or "ok")
            elif state == "throttled":
                # The deadline holds the whole account, not one queue.
                entry["state"] = "throttled"
            else:
                entry["state"] = "ok"
                if not entry["pending"] and _walked(stream, phase):
                    entry["lastAt"] = now
                    if requested:
                        entry["requestedAck"] = requested
            streams[stream] = entry
        out = {
            "syncState": state,
            "syncMessage": message,
            "syncStreams": streams,
            # The drain's own bookkeeping: the phase it stopped in, the calls it
            # spent (its budget is what bounds it) and the work its queues hold.
            "syncProgress": {"phase": phase,
                             "done": int(run.get("calls") or 0),
                             "total": int(run.get("calls") or 0) + left,
                             "pending": left},
        }
        if state == "erroring":
            out["syncError"] = message
            out["syncErrorAt"] = now
        # The request is served once every stream has answered THIS request —
        # which for a one-function provider means the walk ran out of work.
        if requested and all((streams.get(s) or {}).get("requestedAck") == requested
                             for s in STREAM_NAMES):
            out["syncRequestedAck"] = requested
        # The SCHEDULED path stamps its own start and duration: a schedule-sourced
        # delivery names no record, so the dispatcher stamps nothing around it
        # (decision 0085). A record-sourced one is the dispatcher's, and the body
        # keeps its hands off.
        started = run.get("startedAt")
        if run.get("scheduled") and started:
            out["lastSyncStartedAt"] = _exact(int(started), 0)
            out["lastSyncDurationMs"] = int(max(0.0, time.time() - started) * 1000)
        return out


    # --------------------------------------------------------------- the API

    class Slack(Exception):
        """A Slack-reported failure, carrying the error word Slack used."""

        def __init__(self, method, error):
            super().__init__("%s: %s" % (method, error))
            self.method = method
            self.error = error


    class RateLimited(Exception):
        """Slack asked us to come back later, and SAID WHEN.

        Slack requires `Retry-After` to be honoured. Throwing the header away and
        relying on the next scheduled tick retries either far too soon (a minute
        cadence against a 30-second hold) or uselessly late (an hour against a
        two-second one). The seconds ride on the exception, are persisted as a
        not-before deadline on the account, and `_due` refuses to start before
        it — for every call, `auth.test` included."""

        def __init__(self, method, retry_after=0):
            super().__init__("%s: rate limited" % method)
            self.method = method
            self.retry_after = int(retry_after or 0)

        def not_before(self):
            secs = self.retry_after if self.retry_after > 0 else DEFAULT_RETRY_AFTER
            return (_dt.datetime.now(_dt.timezone.utc)
                    + _dt.timedelta(seconds=min(secs, MAX_RETRY_AFTER))).isoformat()


    def _call(base, token, method, params=None):
        # ONE Slack Web API call. GET with the token in the Authorization header —
        # never in the query, so no URL a proxy or a recording holds can carry the
        # credential.
        url = base + "/api/" + method
        resp = requests.get(url, params=params or {}, timeout=HTTP_TIMEOUT,
                            headers={"Authorization": "Bearer " + token,
                                     "Accept": "application/json"})
        if resp.status_code == 429:
            raise RateLimited(method, _retry_after(resp))
        if resp.status_code >= 400:
            raise RuntimeError("slack %s: HTTP %d %s"
                               % (method, resp.status_code, resp.text[:200]))
        body = resp.json()
        if not body.get("ok"):
            err = body.get("error") or "unknown"
            if err == "ratelimited":
                raise RateLimited(method, _retry_after(resp))
            raise Slack(method, err)
        return body


    def _retry_after(resp):
        """Slack's own answer to "when may I come back". A body-level
        `ratelimited` carries the header too."""
        try:
            return int((resp.headers or {}).get("Retry-After") or 0)
        except (TypeError, ValueError):
            return 0


    def _cursor_of(body):
        return ((body.get("response_metadata") or {}).get("next_cursor") or "")


    # ------------------------------------------------------- ids and effects

    def _rid(host, aid, key):
        return host.ids.external("slack", aid, key)


    def _user_ref(host, aid, team, uid):
        """A reference at a mirrored user, composed from its provider key."""
        return _rid(host, aid, "%s/%s" % (team, uid)) if uid else None


    def _team_ref(host, aid, team, tid):
        """A team reference takes the same four arguments as every other maker so
        one list helper serves them all; the workspace of the row is not part of a
        team's own key."""
        return _rid(host, aid, tid) if tid else None


    def _conv_ref(host, aid, team, cid):
        return _rid(host, aid, "%s/%s" % (team, cid)) if cid else None


    def _msg_ref(host, aid, team, cid, ts):
        return _rid(host, aid, "%s/%s/%s" % (team, cid, ts)) if (cid and ts) else None


    def _file_ref(host, aid, team, fid):
        return _rid(host, aid, "%s/%s" % (team, fid)) if fid else None


    def _bot_ref(host, aid, team, bid):
        return _rid(host, aid, "%s/%s" % (team, bid)) if bid else None


    def _sync_ref(host, aid, team, cid):
        return _rid(host, aid, "%s/%s/sync" % (team, cid))


    def _refs(host, aid, team, ids, maker):
        """A list of references, de-duplicated, in the order the API gave them."""
        out = []
        for i in ids or []:
            r = maker(host, aid, team, i)
            if r and r not in out:
                out.append(r)
        return out


    def _live(props):
        """The same properties with the explicit deletes removed — what a MINT is
        allowed to carry, since a create cannot delete a property it never had."""
        return {k: v for k, v in props.items() if v is not None}


    def _self_free(eid, props):
        """The same properties with any reference at THIS row removed.

        Slack sets `thread_ts == ts` on a thread's own parent, and that supplied
        self-reference is a fact worth keeping — but the engine checks a
        reference's target at write time, and at the moment of the CREATE the row
        does not exist yet. So the mint goes without it and the patch, which runs
        once the row is there, puts it back."""
        return {k: v for k, v in props.items() if v != eid}


    def _put(host, typ, eid, props):
        """Mint-then-patch. The mint is if_absent because a provider key is
        immutable; the patch moves only what this payload carried, so a thinner
        read never erases what a fuller one filled in.

        ABSENT and NULL are different, and both are load-bearing. A field the
        payload did not carry is not in `props` at all. A field the payload
        carried as `null` — or as an empty string, list or map — IS in `props`,
        as `None` or as the empty value, because Slack saying "this status is
        now cleared" has to clear it. Only the patch carries the deletes."""
        host.effects.put(typ, eid, properties=_self_free(eid, _live(props)),
                         if_absent=True)
        host.effects.patch(typ, eid, properties=props)


    def _take(dst, src, pairs, cast=None):
        """Copy the API's fields onto the row under their camelCase names.

        An ABSENT field stays absent: a payload that did not carry a field never
        nulls one a fuller payload filled in. An EXPLICIT null is carried through
        as `None`, which is a delete; so is an explicit empty value, for the
        reason `_shape` gives."""
        for key, api in pairs:
            if api not in src:
                continue
            v = src[api]
            if v is None or v == "" or v == [] or v == {}:
                dst[key] = None          # an explicit clear, not an absence
                continue
            dst[key] = cast(v) if cast else v


