    PAGE_LIMIT = 200
    HTTP_TIMEOUT = 20
    REASON_MAX = 200
    # The self-imposed drain bounds, both comfortably inside the engine's.
    DRAIN_SECONDS = 75
    DRAIN_CALLS = 300
    # What "come back later" means when Slack does not say. Slack's own guidance
