                                ("appId", "app_id", None),
                                ("deleted", "deleted", None),
                                ("updated", "updated", _C_EPOCH)], clear=True))
        if p.get("team_id"):
            props["team"] = _team_ref(host, aid, team, p["team_id"])
        if p.get("user_id"):
            props["user"] = _user_ref(host, aid, team, p["user_id"])
        icons = p.get("icons") or {}
        shaped = _shape(icons, [("image36", "image_36", None),
                                ("image48", "image_48", None),
                                ("image72", "image_72", None)])
        if shaped:
            props["icons"] = shaped
        return props


    _MESSAGE_SCALARS = [
        ("clientMsgId", "client_msg_id", None),
        ("subtype", "subtype", None),
        ("text", "text", None),
        ("blocks", "blocks", None),
        ("attachments", "attachments", None),
        ("username", "username", None),
        ("appId", "app_id", None),
        ("upload", "upload", None),
        ("displayAsBot", "display_as_bot", None),
        ("hidden", "hidden", None),
        ("isStarred", "is_starred", None),
        ("isLocked", "is_locked", None),
        ("subscribed", "subscribed", None),
        ("channelType", "channel_type", None),
        ("replyCount", "reply_count", None),
        ("replyUsersCount", "reply_users_count", None),
        ("triggerId", "trigger_id", None),
        ("workflowId", "workflow_id", None),
        ("topic", "topic", None),
        ("purpose", "purpose", None),
        ("name", "name", None),
        ("oldName", "old_name", None),
        ("lastRead", "last_read", _C_EPOCH),
    ]


    def _permalink(domain, channel, ts, thread_ts):
        # Composed, never fetched: Slack documents the form, so a call per message
        # buys nothing. Nothing rather than something broken when the workspace
        # host is not known yet.
        if not (domain and channel and ts):
            return None
        link = "https://%s/archives/%s/p%s" % (domain, channel, ts.replace(".", "", 1))
        if thread_ts and thread_ts != ts:
            link += "?thread_ts=" + thread_ts
        return link


    def _message_props(host, aid, team, channel, domain, msg):
        """One message row: every documented field of the event, every relation a
        reference, nothing computed."""
        ts = msg.get("ts") or ""
        text = msg.get("text") or ""
        props = {"account": aid, "ts": ts, "type": "message",
                 "channel": _conv_ref(host, aid, team, channel)}
        props.update(_shape(msg, _MESSAGE_SCALARS, clear=True))
        at = _ts_iso(ts)
        if at:
            # The ts IS the trait's instant; `ts` itself is declared beside it
            # because it is the identity and the cursor Slack takes verbatim.
            props["at"] = at
        for prop, api in (("team", "team"), ("userTeam", "user_team"),
                          ("sourceTeam", "source_team")):
            if msg.get(api):
                props[prop] = _team_ref(host, aid, team, msg[api])
        for prop, api in (("user", "user"), ("parentUser", "parent_user_id"),
                          ("inviter", "inviter")):
            if msg.get(api):
                props[prop] = _user_ref(host, aid, team, msg[api])
        if msg.get("bot_id"):
            props["bot"] = _rid(host, aid, "%s/%s" % (team, msg["bot_id"]))
        # thread_ts names another message, so it is a reference and never a
        # string beside one. Slack sets thread_ts == ts on a thread's own PARENT,
        # and that supplied self-reference is a fact: it is what distinguishes a
        # thread root from a message that was never threaded. Absence of
        # thread_ts stays absence.
        thread_ts = msg.get("thread_ts") or ""
        if thread_ts:
            props["parent"] = _msg_ref(host, aid, team, channel, thread_ts)
        root = msg.get("root") or {}
        if isinstance(root, dict) and root.get("ts"):
            props["root"] = _msg_ref(host, aid, team, channel, root["ts"])
        if msg.get("latest_reply"):
            props["latestReply"] = _msg_ref(host, aid, team, channel,
                                            msg["latest_reply"])
        # `reply_users` is ONE array of TWO namespaces: Slack documents that it
        # can hold bot ids, and a B… id is not a user. A reference pins one kind,
        # so the array is split by the namespace Slack itself encodes in the
        # prefix, and neither half ever mints the other's row.
        if "reply_users" in msg:
            ids = [u for u in (msg.get("reply_users") or []) if u]
            props["replyUsers"] = _refs(
                host, aid, team, [u for u in ids if u[:1] in ("U", "W")],
                _user_ref) or None
            props["replyBots"] = _refs(
                host, aid, team, [u for u in ids if u[:1] == "B"],
                _bot_ref) or None
        # The mrkdwn decode: lossless and mechanical, beside the verbatim text.
        # `text` is present on every persisted message, so an edit that removes
        # the last mention CLEARS the derived list rather than leaving it stale.
        if "text" in msg:
            props["mentions"] = _refs(
                host, aid, team, MENTION_RE.findall(text), _user_ref) or None
            props["channelMentions"] = _refs(
                host, aid, team, CHANNEL_RE.findall(text), _conv_ref) or None
        if "files" in msg:
            files = [f.get("id") for f in (msg.get("files") or [])
                     if isinstance(f, dict) and f.get("id")]
            props["files"] = _refs(host, aid, team, files, _file_ref) or None
        if "x_files" in msg:
            # `x_files` is the id-only companion of `files`: the same resources,
            # named rather than embedded. Distinct property, thin targets minted
            # by `_put_message` and hydrated by any later embed.
            props["xFiles"] = _refs(host, aid, team, msg.get("x_files"),
                                    _file_ref) or None
        if "pinned_to" in msg:
            props["pinnedTo"] = _refs(host, aid, team, msg.get("pinned_to"),
                                      _conv_ref) or None
        pin = msg.get("pinned_info") or {}
        if isinstance(pin, dict) and pin:
            one = {}
            if pin.get("pinned_by"):
                one["pinnedBy"] = _user_ref(host, aid, team, pin["pinned_by"])
            when = _epoch_iso(pin.get("pinned_ts"))
            if when:
                one["pinnedTs"] = when
            if one:
                props["pinnedInfo"] = one
        edited = msg.get("edited") or {}
        if isinstance(edited, dict) and edited:
            one = {}
            if edited.get("user"):
                one["user"] = _user_ref(host, aid, team, edited["user"])
            when = _ts_iso(edited.get("ts"))
            if when:
                one["ts"] = when
            if one:
                props["edited"] = one
        # Reactions CHURN. A reread that answers `reactions: []` — or that omits
        # the last reactor from a list whose count did not change — has to clear
        # what is there, so the presence of the key decides, never its length.
        if "reactions" in msg:
            reactions = []
            for r in msg.get("reactions") or []:
                if not isinstance(r, dict):
                    continue
                one = _shape(r, [("name", "name", None), ("count", "count", None),
                                 ("url", "url", None)])
                if "users" in r:
                    one["users"] = _refs(host, aid, team, r.get("users"),
                                         _user_ref) or None
                if one:
                    reactions.append(one)
            props["reactions"] = reactions or None
        lang = msg.get("language") or {}
        if isinstance(lang, dict) and lang:
            one = _shape(lang, [("locale", "locale", None),
                                ("isReliable", "is_reliable", None)])
            if one:
                props["language"] = one
        icons = msg.get("icons") or {}
        if isinstance(icons, dict) and icons:
            one = _shape(icons, [("emoji", "emoji", None),
                                 ("image64", "image_64", None)])
            if one:
                props["icons"] = one
        # `metadata` is ONE API object: `{event_type, event_payload}`. It was
        # flattened into two invented helper properties, which is a lift the
        # guide does not allow and loses the object's own identity. The payload
        # is heterogeneous by its event type — a justified `json` — and it keeps
        # its own name and shape. An empty payload is a legal payload.
        if "metadata" in msg:
            meta = msg.get("metadata")
            props["metadata"] = meta if isinstance(meta, dict) and meta else None
        link = _permalink(domain, channel, ts, thread_ts)
        if link:
            props["permalink"] = link
        return props


    def _keep(msg):
        if msg.get("type") not in (None, "message"):
            return False
        if not msg.get("ts"):
            return False
        return (msg.get("subtype") or "") not in MUTATION_SUBTYPES


    def _mutate(host, aid, team, channel, domain, msg):
        """One mutation envelope, applied to the message it speaks about.

        `message_changed` carries the WHOLE new message under `message`; the edit
        lands on that message's own identity, never on the envelope's ts.
        `message_deleted` names `deleted_ts`, and a deleted message is deleted —
        a mirror that keeps it is not a mirror. The delete does not cascade
        through thread membership: `parent`, `root` and `latestReply` are
        references without `mustExist` precisely so a hole is legal.
        `message_replied` is a reply-count notification about an existing parent
        and carries no new content; its nested message is applied like a change.
        """
        sub = msg.get("subtype") or ""
        if sub == "message_deleted":
            gone = msg.get("deleted_ts") or (msg.get("previous_message") or {}).get("ts")
            if gone:
                host.effects.delete(MESSAGE_TYPE,
                                    _msg_ref(host, aid, team, channel, gone))
            return None
        inner = msg.get("message")
        if isinstance(inner, dict) and inner.get("ts"):
            return _put_message(host, aid, team, channel, domain, inner)
        return None


    def _actors(msg):
        """Every USER id one message names, wherever it names it.

        `_unknown` collects the authors and reactors a later users.info fills in,
        but the ORDERING guarantee is different and stricter: a row that is
        referenced must exist before the reference lands. An editor, a pinner, a
        file's uploader and a bot's user are all referenced by a message and none
        of them was being minted — the reference resolved only when the same
        person happened to be an author somewhere else in the cut."""
        ids = set()
        for key in ("user", "parent_user_id", "inviter"):
            if msg.get(key):
                ids.add(msg[key])
        for holder in (msg.get("edited") or {}, msg.get("pinned_info") or {}):
            for key in ("user", "pinned_by"):
                if isinstance(holder, dict) and holder.get(key):
                    ids.add(holder[key])
        for f in msg.get("files") or []:
            if isinstance(f, dict) and f.get("user"):
                ids.add(f["user"])
        prof = msg.get("bot_profile") or {}
        if isinstance(prof, dict) and prof.get("user_id"):
            ids.add(prof["user_id"])
        for r in msg.get("reactions") or []:
            if isinstance(r, dict):
                ids |= {u for u in (r.get("users") or []) if u}
        ids |= {u for u in (msg.get("reply_users") or []) if u and u[:1] != "B"}
        ids |= set(MENTION_RE.findall(msg.get("text") or ""))
        return {i for i in ids if i and i[:1] in ("U", "W")}


    def _file_ids(msg):
        """Every file id one message names — embedded in `files[]` or named by id
        in `x_files`. Both are files this mirror writes a row for."""
        ids = []
        for f in msg.get("files") or []:
            if isinstance(f, dict) and f.get("id"):
                ids.append(f["id"])
        for fid in msg.get("x_files") or []:
            if isinstance(fid, str) and fid:
                ids.append(fid)
        return ids


    def _bot_ids(msg):
        """Every bot id one message names: the identity it was posted under and
        the bots Slack lists among a thread's repliers."""
        ids = []
        if msg.get("bot_id"):
            ids.append(msg["bot_id"])
        for b in msg.get("reply_users") or []:
            if isinstance(b, str) and b[:1] == "B":
                ids.append(b)
        return ids


    def _mint_actors(host, aid, team, msg):
        """A THIN row for every user this message names, before the message that
        names them. Identity and nothing else — a minted row carries what the
        payload carried, and the payload carried an id."""
        for uid in sorted(_actors(msg)):
            _put(host, USER_TYPE, _user_ref(host, aid, team, uid),
                 {"account": aid, "userId": uid})


    def _put_thin_profile(host, aid, team, msg):
        """`message.user_profile` — the author's profile as the message inlines it.

        T-021. This was dropped on the floor: nine real profile fields, on 1,466
        of the owner's messages, for authors a roster mint had left as an id. It
        lands through the presence-aware merge, because it is THIN — a patch
        replaces an object whole, and writing these nine as the profile would
        delete the forty-one `users.list` had filled in.
        """
        prof = msg.get("user_profile")
        uid = msg.get("user") or ""
        if not (uid and isinstance(prof, dict) and prof):
            return
        u = {"id": uid, "profile": prof}
        for key in THIN_PROFILE_USER_FIELDS:
            if key in prof:
                u[key] = prof[key]
        _put_user(host, aid, team, u, whole=False)


    def _put_message(host, aid, team, channel, domain, msg):
        """Every row a message REFERENCES is upserted before the message itself:
        its files, the bot identity behind a bot post, the users it names, and
        the embedded ROOT of a broadcast reply — which arrives whole inside the
        reply and used to be pointed at without ever being ingested."""
        if not msg.get("ts"):
            return None
        if (msg.get("subtype") or "") in MUTATION_SUBTYPES:
            return _mutate(host, aid, team, channel, domain, msg)
        if not _keep(msg):
            return None
        ts = msg["ts"]
        _mint_actors(host, aid, team, msg)
        _put_thin_profile(host, aid, team, msg)
        for f in msg.get("files") or []:
            if isinstance(f, dict) and f.get("id"):
                _put(host, FILE_TYPE, _file_ref(host, aid, team, f["id"]),
                     _file_props(host, aid, team, f))
        for fid in msg.get("x_files") or []:
            # Named, not embedded: a thin row so the reference resolves, and
            # nothing invented beyond the identity Slack supplied.
            if fid:
                _put(host, FILE_TYPE, _file_ref(host, aid, team, fid),
                     {"account": aid, "fileId": fid})
        if msg.get("bot_id"):
            _put(host, BOT_TYPE, _bot_ref(host, aid, team, msg["bot_id"]),
                 _bot_props(host, aid, team, msg["bot_id"], msg.get("bot_profile")))
        # A bot named only by `reply_users` still needs its row before the
        # reference at it lands.
        for bid in (msg.get("reply_users") or []):
            if bid and bid[:1] == "B":
                _put(host, BOT_TYPE, _bot_ref(host, aid, team, bid),
                     {"account": aid, "botId": bid})
        root = msg.get("root")
        if isinstance(root, dict) and root.get("ts") and root.get("ts") != ts:
            # ONE level, and only where the root is a different message: a
            # broadcast reply embeds its whole root, and `root` was a reference
            # at a row nothing ever wrote. Bounded by construction — a root has
            # no root of its own — and `root.root` is refused below.
            inner = dict(root)
            inner.pop("root", None)
            _put_message(host, aid, team, channel, domain, inner)
        eid = _msg_ref(host, aid, team, channel, ts)
        _put(host, MESSAGE_TYPE, eid,
             _message_props(host, aid, team, channel, domain, msg))
        return eid


    # ------------------------------------------------------------- the stamps

    def _mint_conv_actors(host, aid, team, c):
        """A conversation names a creator, a DM partner and the people who set
        its topic and purpose. All four are references and none was minted."""
        ids = {c.get("creator"), c.get("user")}
        for key in ("topic", "purpose"):
            block = c.get(key)
            if isinstance(block, dict):
                ids.add(block.get("creator"))
        for uid in sorted(i for i in ids if i and i[:1] in ("U", "W")):
            _put(host, USER_TYPE, _user_ref(host, aid, team, uid),
                 {"account": aid, "userId": uid})


    def _put_latest(host, aid, team, domain, cid, c):
        """`conversations.list` and `.info` embed the conversation's newest
        message WHOLE under `latest`. The reference at it was being composed from
        its ts and the message itself thrown away, so a conversation outside the
        backfill window pointed at a row nothing ever wrote — and the two DM
        bodies that survived pseudonymisation lived exactly there. Ingest it."""
        latest = c.get("latest")
        if isinstance(latest, dict) and latest.get("ts"):
            _put_message(host, aid, team, cid, domain, latest)


    def _stamp(host, acct, aid, cursors, note="", not_before=None,
               completed=True, run=None):
        # The drain's LAST effect: everything before it has committed, so the
        # completion marker never precedes its messages.
        typ = ((acct or {}).get("kind") or ACCOUNT_TYPE) or ACCOUNT_TYPE
        pending = _pending(cursors)
        detail = _pending_detail(cursors)
        if pending and note:
            status = "ok (%d pending: %s, %s)" % (pending, detail, note)
        elif pending:
            status = "ok (%d pending: %s)" % (pending, detail)
        elif note:
            status = "ok (%s)" % note
        else:
            status = "ok"
        failed = cursors.get("failed") or []
        if failed:
            # WHAT failed, not just how many. The whole list rides on
            # `streamCursors.failed` as [kind, ident, attempts, why]; the status
            # carries the shape of it, because a bare "[200 failed]" sends
            # whoever reads it back into a 12,000-line log.
            by_why = {}
            for row in failed:
                key = "%s/%s" % (row[0], _why_class(row[3] if len(row) > 3 else ""))
                by_why[key] = by_why.get(key, 0) + 1
            top = sorted(by_why.items(), key=lambda kv: -kv[1])[:3]
            status += " [%d failed: %s]" % (
                len(failed), ", ".join("%s x%d" % (k, n) for k, n in top))
            host.log("slack: %d units of work failed; streamCursors.failed holds "
                     "[kind, id, attempts, why] for each. By class: %s"
                     % (len(failed),
                        ", ".join("%s x%d" % (k, n)
                                  for k, n in sorted(by_why.items(),
                                                     key=lambda kv: -kv[1]))))
        status = status[:REASON_MAX]
        now = _now_iso()
        props = {
            # `lastSyncedAt` is the last ATTEMPT — it is what the cadence reads.
            # Whether the walk finished is a different fact and has its own
            # field, so "ok" can no longer mean "stopped early, twice, for an
            # hour". A bounded or rate-limited run does not claim completion.
            "lastSyncedAt": now,
            "syncStatus": status,
            "streamCursors": cursors,
            "retryNotBefore": not_before,
        }
        if completed and not pending:
            props["lastCompletedAt"] = now
        # The core `sync` trait, BESIDE the pair above and derived from the same
        # facts (T-084). A rate-limited stop is the trait's `throttled`; a bounded
        # one is `ok` with the count in `syncProgress`.
        props.update(_trait(((acct or {}).get("properties") or {}), cursors,
                            "throttled" if not_before else "ok", status, now,
                            run=run))
        host.effects.patch(typ, aid, properties=props)


    def _erroring(host, acct, aid, reason, cursors=None, run=None, at_phase=None):
        # A provider failure stamps THIS account erroring — bounded reason, no
        # lastSyncedAt, since the run did not complete — and the delivery
        # completes instead of parking.
        why = str(reason)[:REASON_MAX]
        props = {"syncStatus": "erroring: " + why}
        if cursors is not None:
            props["streamCursors"] = cursors
        props.update(_trait(((acct or {}).get("properties") or {}), cursors,
                            "erroring", why, _now_iso(), run=run,
                            at_phase=at_phase))
        host.effects.patch(((acct or {}).get("kind") or ACCOUNT_TYPE) or ACCOUNT_TYPE,
                           aid, properties=props)


    def _sync_state(host, aid, team, cid):
        """The conversation's state row: the cursors that used to live on the
        conversation itself. Returns (conversation id, state id, state props)."""
        ceid = _conv_ref(host, aid, team, cid)
        seid = _sync_ref(host, aid, team, cid)
        row = host.records.get(SYNC_TYPE, seid) or {}
        return ceid, seid, (row.get("properties") or {})


    def _state_patch(host, aid, team, cid, props):
        """Mint-then-patch the state row, so a page of history bumps THIS row's
        version and never the conversation's."""
        ceid, seid, _ = _sync_state(host, aid, team, cid)
        base = dict(props)
        base["conversation"] = ceid
        host.effects.put(SYNC_TYPE, seid, properties=base, if_absent=True)
        host.effects.patch(SYNC_TYPE, seid, properties=base)


    RETRY_MAX = 3
    FAILED_MAX = 200

    # PERMANENT failures. Slack has already answered the question and the answer
    # will not change by asking again: the channel is gone, the caller is not in
    # it, the token lacks the scope, the id does not resolve. Retrying one is not
    # resilience, it is three wasted calls — and worse, a retried unit of work
    # keeps `_pending` true forever, so the drain NEVER CONVERGES. The owner's
    # seed ran 120 rounds against 5,129 conversations whose info the raw pull did
    # not hold and ended `978 pending, [200 failed]` for exactly this reason.
    PERMANENT_ERRORS = {
        "channel_not_found", "not_in_channel", "is_archived", "user_not_found",
        "users_not_found", "missing_scope", "not_allowed_token_type",
        "no_permission", "thread_not_found", "message_not_found",
        "account_inactive", "invalid_arguments", "method_not_supported_for_channel_type",
        "team_access_not_granted", "restricted_action", "file_not_found",
        "file_deleted", "bot_not_found", "not_authed", "invalid_auth",
        # An EXPIRED OR MALFORMED CURSOR. Slack has already said the token is no
        # good; asking with the same token again gets the same answer, and the
        # walk that holds it restarts from the top on the next cold pass.
        "invalid_cursor",
    }


    def _why_class(reason):
        """The CLASS of a failure reason, for the status line and the log.

        A reason is either a Slack error word or an HTTP failure whose body is a
        JSON blob; splitting that blob on `:` and taking the tail produced
        `info/"/api/conversations.i`, which names nothing. The class is the
        method plus the status for an HTTP failure, and the error word itself
        otherwise."""
        text = str(reason or "")
        permanent = "permanent: " if text.startswith("permanent: ") else ""
        text = text[len(permanent):]
        m = re.match(r"slack ([a-zA-Z.]+): HTTP (\d{3})", text)
        if m:
            return "%s%s HTTP %s" % (permanent, m.group(1), m.group(2))
        return permanent + re.split(r"[\s{:]", text.strip())[0][:40]


    def _permanent(err):
        """Is this failure one that asking again cannot fix?

        Two families: an error WORD Slack returned (`Slack.error`), and an HTTP
        status in the 4xx range that is not 408/429 — a 404 for one conversation
        is that conversation's answer, not a transport hiccup. Everything else
        (5xx, a timeout, a connection reset) is transient and is retried."""
        word = str(getattr(err, "error", "") or "")
        if word in PERMANENT_ERRORS:
            return True
        m = re.search(r"HTTP (\d{3})", str(err))
        if m:
            code = int(m.group(1))
            return 400 <= code < 500 and code not in (408, 429)
        return False


    def _failed(resume, kind, ident, err, **rest):
        """One unit of work that failed, KEPT — and retried only if retrying can
        possibly help.

        A TRANSIENT error on a queued thread, a hydration or a roster used to
        drop that work permanently — and because history had already advanced
        `latestTs`, nothing would ever queue it again unless a new parent message
        happened to arrive. It is now remembered with its diagnosis and its
        attempt count and retried at the top of the next walk, up to `RETRY_MAX`.

        A PERMANENT one is recorded ONCE and never retried, because the drain
        cannot converge while work it can never finish keeps reporting itself
        pending. Either way the entry stays on `account.streamCursors.failed` as
        `[kind, ident, attempts, why]`, which is where "what are the 200 failures"
        is answered.
        """
        attempts = {}
        for k, i, n, _why in resume.get("failed") or []:
            attempts[(k, repr(i))] = n
        n = attempts.get((kind, repr(ident)), 0) + 1
        failed = [row for row in (resume.get("failed") or [])
                  if (row[0], repr(row[1])) != (kind, repr(ident))]
        why = str(getattr(err, "error", err))[:REASON_MAX]
        permanent = _permanent(err)
        failed.append([kind, ident, n, ("permanent: " if permanent else "") + why])
        # Newest last, capped: the list is diagnosis, not a queue, and an
        # unbounded one would grow the account row without limit.
        out = dict(resume, failed=failed[-FAILED_MAX:], **rest)
        if not permanent and n <= RETRY_MAX:
            out["retry"] = list(resume.get("retry") or []) + [[kind, ident]]
        return out


    def _budget_left(resume, calls=1):
        started = resume.get("startedAt") or 0
        spent = resume.get("calls") or 0
        if spent + calls > DRAIN_CALLS:
            return False
        return (time.time() - started) < DRAIN_SECONDS


    def _spend(resume):
        return dict(resume, calls=(resume.get("calls") or 0) + 1)


    def _unknown(resume, msgs):
        """Slack Connect senders. A person from ANOTHER workspace writes in a
        shared channel and never appears in this workspace's users.list, so the
        mirror would hold a message whose author is a reference at a row that was
        never minted. One users.info per invocation fills them in."""
        known = set(resume.get("known") or [])
        queue = list(resume.get("hydrate") or [])
        seen = set(queue)
        for msg in msgs:
            # The SAME set `_mint_actors` writes thin rows for, so every row the
            # mirror minted from an id alone is queued to be filled in.
            ids = _actors(msg)
            for uid in sorted(ids):
                if uid and uid not in known and uid not in seen:
                    seen.add(uid)
                    queue.append(uid)
        return queue


    def _unhydrated(resume, msgs):
        """The files and bots this page named, queued for their OWN endpoints.

        T-021. `files.info` and `bots.info` are sibling calls keyed by an identity
        the payload already carried, and they are the only source of facts no
        embed holds. Measured against the owner's pull: `files.info` adds exactly
        `shares`, `channels`, `groups`, `ims`, `comments_count` and
        `has_more_shares` to an embedded file object — that is, WHERE THE FILE HAS
        BEEN SHARED, six declared properties that were otherwise always empty; and
        a `bot_id` arrives with no `bot_profile` on 37 of the owner's 91 bots, so
        that many bot rows were an id and nothing else.

        A mutation envelope carries its subject nested, and a broadcast reply
        carries its whole root, so both are descended — the same one level
        `_put_message` ingests.
        """
        files = list(resume.get("files") or [])
        bots = list(resume.get("bots") or [])
        fseen, bseen = set(files), set(bots)
        for msg in msgs:
            for inner in (msg, msg.get("message"), msg.get("root")):
                if not isinstance(inner, dict):
                    continue
                for fid in _file_ids(inner):
                    if fid not in fseen:
                        fseen.add(fid)
                        files.append(fid)
                for bid in _bot_ids(inner):
                    if bid not in bseen:
                        bseen.add(bid)
                        bots.append(bid)
        return files, bots


    # -------------------------------------------------------------- the phases

    def _phase_team(host, base, token, resume):
        aid, team = resume["account"], resume["team"]
        body = _call(base, token, "team.info")
        t = body.get("team") or {}
        _put(host, TEAM_TYPE, _team_ref(host, aid, team, t.get("id") or team),
             _team_props(host, aid, t))
        return dict(resume, phase="users", cursor="")


    def _phase_users(host, base, token, resume):
        aid, team = resume["account"], resume["team"]
        params = {"limit": PAGE_LIMIT}
        if resume.get("cursor"):
            params["cursor"] = resume["cursor"]
        body = _call(base, token, "users.list", params)
        known = list(resume.get("known") or [])
        for u in body.get("members") or []:
            if not u.get("id"):
                continue
            # users.list returns the WHOLE member object, profile included.
            _put_user(host, aid, team, u, whole=True)
            known.append(u["id"])
        resume = dict(resume, known=known)
        nxt = _cursor_of(body)
        if nxt:
            return dict(resume, cursor=nxt)
        return dict(resume, phase="conversations", cursor="")


    def _phase_conversations(host, base, token, resume):
        aid, team = resume["account"], resume["team"]
        params = {"limit": PAGE_LIMIT, "exclude_archived": "false",
                  "types": "public_channel,private_channel,mpim,im"}
        if resume.get("cursor"):
            params["cursor"] = resume["cursor"]
        body = _call(base, token, "conversations.list", params)
        flt = resume.get("filter") or ""
        queue = list(resume.get("queue") or [])
        info = list(resume.get("info") or [])
        rosters = list(resume.get("rosters") or [])
        for c in body.get("channels") or []:
            cid = c.get("id")
            if not cid:
                continue
            # Mint-then-patch, so the thinner shape conversations.list returns
            # never erases what a conversations.info fill-in left behind.
            _mint_conv_actors(host, aid, team, c)
            _put(host, CONV_TYPE, _conv_ref(host, aid, team, cid),
                 _conv_props(host, aid, team, c))
            _put_latest(host, aid, team, resume.get("domain") or "", cid, c)
            if flt and flt not in (c.get("name") or "").lower():
                continue
            # A channel the token's user is not in has no readable history, and an
            # archived one has no news.
            readable = (c.get("is_member") or c.get("is_im") or c.get("is_mpim"))
            if not readable or c.get("is_archived"):
                continue
            info.append(cid)
            queue.append(cid)
            if resume.get("members") and (c.get("is_channel") or c.get("is_group")) \
                    and not (c.get("is_im") or c.get("is_mpim")):
                rosters.append(cid)
        nxt = _cursor_of(body)
        if nxt:
            return dict(resume, cursor=nxt, queue=queue, info=info, rosters=rosters)
        return dict(resume, phase="info", cursor="", queue=queue, info=info,
                    rosters=rosters)


    def _phase_info(host, base, token, resume):
        """ONE conversations.info per queued conversation: `latest`, `last_read`,
        the unread counts, `is_open` and the shared-workspace lists that the list
        shape does not carry."""
        aid, team = resume["account"], resume["team"]
        info = list(resume.get("info") or [])
        if not info:
            return dict(resume, phase="history", info=[])
        cid = info[0]
        try:
            body = _call(base, token, "conversations.info", {"channel": cid})
        except RateLimited:
            raise
        except Exception as e:  # noqa: BLE001
            _state_patch(host, aid, team, cid,
                         {"historyStatus": str(getattr(e, "error", e))[:REASON_MAX]})
            return _failed(resume, "info", cid, e, info=info[1:])
        c = body.get("channel") or {}
        if c.get("id"):
            _mint_conv_actors(host, aid, team, c)
            host.effects.patch(CONV_TYPE, _conv_ref(host, aid, team, c["id"]),
                               properties=_conv_props(host, aid, team, c))
            _put_latest(host, aid, team, resume.get("domain") or "", c["id"], c)
        return dict(resume, info=info[1:])


    def _phase_history(host, base, token, resume):
        aid, team = resume["account"], resume["team"]
        queue = list(resume.get("queue") or [])
        if not queue:
            return dict(resume, phase="replies", queue=[])
        cid = queue[0]
        ceid, _seid, state = _sync_state(host, aid, team, cid)
        conv = host.records.get(CONV_TYPE, ceid) or {}
        if not conv:
            # The conversation row is gone: drop its walk rather than writing
            # messages into a void — `channel` is a mustExist reference.
            host.log("slack: conversation %s has no mirror; skipping" % cid)
            return dict(resume, queue=queue[1:], work=None)
        is_im = bool((conv.get("properties") or {}).get("isIm"))
        work = resume.get("work") or {}
        if work.get("conversation") != cid:
            work = {"conversation": cid, "cursor": "", "latest": "", "max": "",
                    "threads": [], "watch": [],
                    "oldest": state.get("latestTs") or ""}
        params = {"channel": cid, "limit": PAGE_LIMIT,
                  "include_all_metadata": "true"}
        # A cold walk takes Slack's newest-first default and stops at the backfill
        # floor; an incremental one names the stored cursor and walks forward.
        # `oldest` is exclusive, so the last message never repeats.
        if work["oldest"]:
            params["oldest"] = work["oldest"]
        if work.get("latest"):
            params["latest"] = work["latest"]
            params["inclusive"] = "false"
        if work["cursor"]:
            params["cursor"] = work["cursor"]
        try:
            body = _call(base, token, "conversations.history", params)
        except RateLimited:
            raise
        except Exception as e:  # noqa: BLE001
            # One channel's failure is that channel's business. The queue moves
            # on, and the reason lands on the STATE row, not the mirror.
            _state_patch(host, aid, team, cid,
                         {"historyStatus": str(getattr(e, "error", e))[:REASON_MAX]})
            return _failed(resume, "history", cid, e, queue=queue[1:], work=None)
        domain = resume.get("domain") or ""
        floor = resume.get("floor")
        oldest_seen = None
        for msg in body.get("messages") or []:
            ts = msg.get("ts") or ""
            if not ts:
                continue
            tsf = float(ts)
            if oldest_seen is None or tsf < oldest_seen:
                oldest_seen = tsf
            if not work["oldest"] and floor and tsf < floor:
                continue
            _put_message(host, aid, team, cid, domain, msg)
            if ts > (work["max"] or ""):
                work["max"] = ts
            # Thread radar: descend where a reply is newer than what this
            # conversation has already taken, less the margin.
            if msg.get("thread_ts") == ts and (msg.get("reply_count") or 0):
                work["watch"].append(ts)
                since = state.get("repliesTs") or ""
                if since:
                    since = "%.6f" % max(0.0, float(since) - REPLIES_MARGIN)
                if (msg.get("latest_reply") or "") > since:
                    work["threads"].append(ts)
        _msgs = body.get("messages") or []
        _files, _bots = _unhydrated(resume, _msgs)
        resume = dict(resume, hydrate=_unknown(resume, _msgs),
                      files=_files, bots=_bots)
        nxt = _cursor_of(body)
        past_floor = (not work["oldest"] and floor
                      and oldest_seen is not None and oldest_seen < floor)
        # `has_more` WITHOUT a cursor is a truncated page, and Slack documents
        # both continuations: the cursor, and the time window. Treating a missing
        # cursor as "the walk is complete" silently loses everything behind the
        # page, so the window continues it — `latest` at the oldest ts this page
        # carried, exclusive, which is exactly where the next page begins.
        if not nxt and body.get("has_more") and oldest_seen is not None \
                and not past_floor and "%.6f" % oldest_seen != work.get("latest"):
            return dict(resume, queue=queue,
                        work=dict(work, cursor="", latest="%.6f" % oldest_seen))
        if nxt and not past_floor:
            return dict(resume, work=dict(work, cursor=nxt), queue=queue)
        # This conversation is done: its cursor moves only now, after every
        # message it carried has been staged.
        patch = {"historyStatus": "ok"}
        if work["max"] and work["max"] > (state.get("latestTs") or ""):
            patch["latestTs"] = work["max"]
        # THE THREAD WATCH. An incremental history page asks for everything after
        # `latestTs`, so a reply to a parent that does NOT reappear in that
        # window is invisible: the parent is older than the cursor and the reply
        # never shows up in history at all. The overlap margin cannot help —
        # there is nothing to overlap with. So every parent this walk saw with
        # replies is remembered on the state row, and every incremental walk
        # re-asks each watched thread for `oldest=repliesTs`. Bounded by
        # WATCH_MAX, newest first: an old thread that has been silent for a
        # backfill window falls off the watch.
        watch = [t for t in (list(work["watch"])
                             + list(state.get("threadWatch") or [])) if t]
        watch = sorted(set(watch), reverse=True)[:WATCH_MAX]
        patch["threadWatch"] = watch or None
        _state_patch(host, aid, team, cid, patch)
        threads = list(resume.get("threads") or [])
        queued = {ts for _c, ts in threads if _c == cid}
        for ts in work["threads"]:
            if ts not in queued:
                queued.add(ts)
                threads.append([cid, ts])
        if work["oldest"]:
            # An INCREMENTAL walk: re-check every watched thread, not only the
            # parents this window happened to return.
            for ts in watch:
                if ts not in queued:
                    queued.add(ts)
                    threads.append([cid, ts])
        _ = is_im
        return dict(resume, queue=queue[1:], work=None, threads=threads)


    def _phase_replies(host, base, token, resume):
        aid, team = resume["account"], resume["team"]
        threads = list(resume.get("threads") or [])
        if not threads:
            return dict(resume, phase="hydrate", threads=[])
        cid, parent_ts = threads[0]
        ceid, _seid, state = _sync_state(host, aid, team, cid)
        if not (host.records.get(CONV_TYPE, ceid) or {}):
            return dict(resume, threads=threads[1:], reply=None)
        work = resume.get("reply") or {}
        if work.get("thread") != [cid, parent_ts]:
            work = {"thread": [cid, parent_ts], "cursor": "", "max": "", "seen": ""}
        params = {"channel": cid, "ts": parent_ts, "limit": PAGE_LIMIT,
                  "include_all_metadata": "true"}
        # THE BACKFILL POLICY, stated: `backfillDepth` scopes ROOTS, and a root
        # inside the window brings its whole thread with it. A thread is one
        # conversation — half of it is not a mirror of anything — and Slack's own
        # reply window would cut a thread at an arbitrary message. The history
        # walk applies the floor; this one deliberately does not, and the kind's
        # description says so rather than the sync claiming a bound it does not
        # apply.
        if work["cursor"]:
            params["cursor"] = work["cursor"]
        try:
            body = _call(base, token, "conversations.replies", params)
        except RateLimited:
            raise
        except Exception as e:  # noqa: BLE001
            _state_patch(host, aid, team, cid,
                         {"historyStatus": str(getattr(e, "error", e))[:REASON_MAX]})
            return _failed(resume, "thread", [cid, parent_ts], e,
                           threads=threads[1:], reply=None)
        domain = resume.get("domain") or ""
        msgs = body.get("messages") or []
        # conversations.replies answers with the PARENT first and its replies
        # after, so the parent row is minted before anything references it.
        for msg in msgs:
            ts = msg.get("ts") or ""
            if not ts:
                continue
            _put_message(host, aid, team, cid, domain, msg)
            if ts != parent_ts and ts > (work["max"] or ""):
                work["max"] = ts
        _files, _bots = _unhydrated(resume, msgs)
        resume = dict(resume, hydrate=_unknown(resume, msgs),
                      files=_files, bots=_bots)
        nxt = _cursor_of(body)
        if nxt:
            return dict(resume, reply=dict(work, cursor=nxt), threads=threads)
        if body.get("has_more") and work["max"] and work["max"] != work.get("seen"):
            # `has_more` with no cursor: continue by window from the newest reply
            # this page carried, which is where the next page starts.
            return dict(resume, threads=threads,
                        reply=dict(work, cursor="", seen=work["max"]))
        if work["max"] and work["max"] > (state.get("repliesTs") or ""):
            _state_patch(host, aid, team, cid, {"repliesTs": work["max"]})
        return dict(resume, threads=threads[1:], reply=None)


    def _phase_hydrate(host, base, token, resume):
        # ONE users.info per invocation, for a sender this workspace's users.list
        # never carried. A failure is that user's business: an id Slack will not
        # resolve is remembered as known so the queue does not circle back.
        aid, team = resume["account"], resume["team"]
        queue = list(resume.get("hydrate") or [])
        if not queue:
            return dict(resume, phase="files", hydrate=[])
        uid = queue[0]
        known = list(resume.get("known") or []) + [uid]
        try:
            body = _call(base, token, "users.info", {"user": uid})
        except RateLimited:
            raise
        except Exception as e:  # noqa: BLE001
            return _failed(resume, "hydrate", uid, e,
                           hydrate=queue[1:], known=known)
        u = body.get("user") or {}
        if u.get("id"):
            # users.info returns the WHOLE member object too.
            _put_user(host, aid, team, u, whole=True)
        return dict(resume, hydrate=queue[1:], known=known)


    # How many already-hydrated rows one invocation may step over before it gives
    # up its turn. A skip costs a record read and no HTTP call, so scanning a few
    # hundred is cheap — and without it a workspace with 2,699 files would spend
    # 2,699 invocations of the SECOND walk discovering it had nothing to do.
    HYDRATE_SCAN = 200


    def _phase_files(host, base, token, resume):
        """ONE files.info per invocation, for a file this walk has not filled in.

        HYDRATED ONCE, not once per walk. `comments_count` is sent by `files.info`
        and by nothing else, so a row that carries it has been through this phase
        and is stepped over — no marker property, no sync bookkeeping on a mirror
        (§1), just a field of the API object that only one call supplies.

        *Known gap:* a file RE-SHARED into a new channel after its row was
        hydrated is not re-read, so `shares` and `channels` age. Re-reading 2,699
        files on every walk to catch it is a cost the owner's workspace cannot
        carry; the ticket says so rather than the code pretending otherwise.
        """
        aid, team = resume["account"], resume["team"]
        queue = list(resume.get("files") or [])
        for _ in range(HYDRATE_SCAN):
            if not queue:
                return dict(resume, phase="bots", files=[])
            eid = _file_ref(host, aid, team, queue[0])
            row = (host.records.get(FILE_TYPE, eid) or {}).get("properties") or {}
            if row.get("commentsCount") is None:
                break
            queue = queue[1:]
        if not queue:
            return dict(resume, phase="bots", files=[])
        fid = queue[0]
        try:
            body = _call(base, token, "files.info", {"file": fid})
        except RateLimited:
            raise
        except Exception as e:  # noqa: BLE001 - one file's failure is its own
            return _failed(resume, "file", fid, e, files=queue[1:])
        f = body.get("file") or {}
        if f.get("id"):
            # The GRANTS and the canvas creator name users, and a reference needs
            # a row to land on (§1), so each is minted thin first.
            #
            # The SHARES do not: `channels`/`groups`/`ims` name conversations the
            # walk may never touch — a file shared into a channel the token's
            # user is not in — and minting one would invent a conversation row
            # the mirror has no business holding. It is the same treatment
            # `channelMentions` already gets: a reference without `mustExist`,
            # pointing outside the cut by design.
            for g in f.get("dm_mpdm_users_with_file_access") or []:
                if isinstance(g, dict) and g.get("user_id"):
                    _put(host, USER_TYPE, _user_ref(host, aid, team, g["user_id"]),
                         {"account": aid, "userId": g["user_id"]})
            for uid in (f.get("editors") or []):
                if uid:
                    _put(host, USER_TYPE, _user_ref(host, aid, team, uid),
                         {"account": aid, "userId": uid})
            if f.get("canvas_creator_id"):
                _put(host, USER_TYPE,
                     _user_ref(host, aid, team, f["canvas_creator_id"]),
                     {"account": aid, "userId": f["canvas_creator_id"]})
            _put(host, FILE_TYPE, _file_ref(host, aid, team, f["id"]),
                 _file_props(host, aid, team, f))
        return dict(resume, files=queue[1:])


    def _phase_bots(host, base, token, resume):
        """ONE bots.info per invocation, for a bot row that is still an identity.

        A `bot_id` posted without a `bot_profile` mints a row holding nothing but
        the id. `bots.info` is that object's own endpoint, and a row that already
        carries a `name` has been filled in by a profile or by an earlier run of
        this phase — which is not a guess: measured over the owner's 97 bot ids,
        `bots.info` adds NOTHING to a row a `bot_profile` already filled (it even
        omits `team_id`), so asking for one would be a call spent on a row that
        cannot change.

        24 of those 97 have no `bot_profile` anywhere and take their name only
        here. 40 answer `bot_not_found` — a deleted app, or one that posted from
        another workspace — which is a PERMANENT failure: recorded once, never
        retried.
        """
        aid, team = resume["account"], resume["team"]
        queue = list(resume.get("bots") or [])
        for _ in range(HYDRATE_SCAN):
            if not queue:
                return dict(resume, phase="members", bots=[])
            eid = _bot_ref(host, aid, team, queue[0])
            row = (host.records.get(BOT_TYPE, eid) or {}).get("properties") or {}
            if not row.get("name"):
                break
            queue = queue[1:]
        if not queue:
            return dict(resume, phase="members", bots=[])
        bid = queue[0]
        try:
            body = _call(base, token, "bots.info", {"bot": bid})
        except RateLimited:
            raise
        except Exception as e:  # noqa: BLE001
            return _failed(resume, "bot", bid, e, bots=queue[1:])
        b = body.get("bot") or {}
        if b.get("id"):
            if b.get("user_id"):
                # The bot's USER is a row this mirror holds, and the reference at
                # it lands before the bot that carries it.
                _put(host, USER_TYPE, _user_ref(host, aid, team, b["user_id"]),
                     {"account": aid, "userId": b["user_id"]})
            _put(host, BOT_TYPE, _bot_ref(host, aid, team, b["id"]),
                 _bot_props(host, aid, team, b["id"], b))
        return dict(resume, bots=queue[1:])


    def _check_members(host, aid, team, conv):
        """Do the conversation's member references still resolve?

        A reference is a hash of the provider key, so the user id behind a
        dangling one cannot be recovered from the reference itself — the roster
        has to be read again. This costs one record lookup per member and no
        HTTP call, and it runs only on the freshness skip."""
        members = ((conv.get("properties") or {}).get("members")) or []
        for m in members:
            ref = m.get("ref") if isinstance(m, dict) else m
            if not ref:
                continue
            if host.records.get(USER_TYPE, str(ref).rsplit("/", 1)[-1]):
                continue
            # The row is gone and its id is not recoverable from the reference
            # alone, so the roster is re-walked instead of guessed at.
            return _stale(host, aid, team, conv)


    def _stale(host, aid, team, conv):
        """A member reference with no row behind it means the roster was written
        before this phase minted its actors. Force a re-walk by clearing the
        freshness mark rather than inventing an id from a hash."""
        cid = ((conv.get("properties") or {}).get("conversationId")) or ""
        if cid:
            _state_patch(host, aid, team, cid, {"membersSyncedAt": None})
            host.log("slack: conversation %s has member references with no rows; "
                     "clearing membersSyncedAt so the roster is re-walked" % cid)


    def _phase_members(host, base, token, resume):
        aid, team = resume["account"], resume["team"]
        rosters = list(resume.get("rosters") or [])
        if not rosters:
            return dict(resume, phase="done", rosters=[])
        cid = rosters[0]
        ceid, _seid, state = _sync_state(host, aid, team, cid)
        conv = host.records.get(CONV_TYPE, ceid) or {}
        if not conv:
            return dict(resume, rosters=rosters[1:], roster=None)
        work = resume.get("roster") or {}
        if work.get("conversation") != cid:
            fresh = state.get("membersSyncedAt")
            if fresh:
                try:
                    seen = _dt.datetime.fromisoformat(str(fresh).replace("Z", "+00:00"))
                    if _dt.datetime.now(_dt.timezone.utc) - seen < _dt.timedelta(
                            hours=MEMBERS_FRESH_HOURS):
                        # SKIPPING THE WALK IS NOT SKIPPING THE GUARANTEE. The
                        # roster is at most a day old, but the references it
                        # wrote must still resolve — a roster written before
                        # this phase minted its actors left 22 members pointing
                        # at rows nothing ever created, and the daily freshness
                        # meant nothing healed them. The row is already in hand
                        # (it was read just above), so the thin rows cost
                        # nothing but a write.
                        _check_members(host, aid, team, conv)
                        return dict(resume, rosters=rosters[1:], roster=None)
                except ValueError:
                    pass
            work = {"conversation": cid, "cursor": "", "members": []}
        params = {"channel": cid, "limit": PAGE_LIMIT}
        if work["cursor"]:
            params["cursor"] = work["cursor"]
        try:
            body = _call(base, token, "conversations.members", params)
        except RateLimited:
            raise
        except Exception as e:  # noqa: BLE001
            return _failed(resume, "roster", cid, e,
                           rosters=rosters[1:], roster=None)
        work["members"] = list(work["members"]) + list(body.get("members") or [])
        nxt = _cursor_of(body)
        if nxt:
            return dict(resume, roster=dict(work, cursor=nxt), rosters=rosters)
        # The roster is the conversation's own (a sibling call keyed by its id);
        # WHEN it was walked is the connector's, and lives on the state row.
        # numMembers is Slack's own count and is never overwritten with a length.
        # A roster names people users.list never carried — deactivated members,
        # Slack Connect guests, app users. The reference at each of them needs a
        # row to land on, so a thin one is minted first.
        for uid in sorted({u for u in work["members"] if u and u[:1] in ("U", "W")}):
            _put(host, USER_TYPE, _user_ref(host, aid, team, uid),
                 {"account": aid, "userId": uid})
        host.effects.patch(CONV_TYPE, ceid, properties={
            "members": _refs(host, aid, team, work["members"], _user_ref)})
        _state_patch(host, aid, team, cid, {"membersSyncedAt": _now_iso()})
        return dict(resume, rosters=rosters[1:], roster=None)


    PHASES = {
        "team": _phase_team,
        "users": _phase_users,
        "conversations": _phase_conversations,
        "info": _phase_info,
        "history": _phase_history,
        "replies": _phase_replies,
        "hydrate": _phase_hydrate,
        "files": _phase_files,
        "bots": _phase_bots,
        "members": _phase_members,
    }


    def _carry(resume):
        # What survives a bounded drain into the account's streamCursors: the work
        # the next run picks up, and nothing bulky.
        return {
            "phase": resume.get("phase") or "done",
            "cursor": resume.get("cursor") or "",
            # THE FLOOR. A cold backfill computes its cutoff once, from
            # `backfillDepth` and the clock. It was not carried, so a drain that
            # stopped on its own bounds (or on a 429) came back with
            # `cold=False`, no floor, and silently abandoned the rest of the
            # window it was in the middle of walking. The active floor is part of
            # the work.
            "floor": resume.get("floor"),
            "cold": bool(resume.get("cold")),
            # Work that FAILED. A transient error used to drop a queued thread,
            # a hydration or a roster on the floor, and only a new parent message
            # would ever queue it again.
            "failed": list(resume.get("failed") or [])[:200],
            "retry": list(resume.get("retry") or [])[:200],
            "queue": list(resume.get("queue") or []),
            "info": list(resume.get("info") or []),
            "threads": [list(t) for t in (resume.get("threads") or [])],
            "hydrate": list(resume.get("hydrate") or []),
            # T-021: the files and bots still to read from their own endpoints.
            "files": list(resume.get("files") or []),
            "bots": list(resume.get("bots") or []),
            "rosters": list(resume.get("rosters") or []),
            "work": resume.get("work"),
            "reply": resume.get("reply"),
            "roster": resume.get("roster"),
        }


    def _floor(props, cold):
        # The cold walk's floor: the backfillDepth window. "none" means from
        # connect time forward, so nothing older than now is staged.
        if not cold:
            return None
        days = BACKFILL_DAYS.get((props.get("backfillDepth") or "last30d").lower(), 30)
        if days == 0:
            return time.time()
        if days < 0:
            return 0.0
        return time.time() - days * 86400


    def main(input, host):
        cfg = input.get("config") or {}
        conf = (((cfg.get("inputs") or {}).get("connector") or {}).get("properties")) or {}
        accounts = {a.get("id"): a for a in (cfg.get("accounts") or [])}
        token = conf.get("userToken") or ""
        base = (conf.get("apiBase") or DEFAULT_API).rstrip("/")

        if not token:
            host.log("slack: the connector input carries no userToken "
                     "(or did not resolve); nothing to sync")
            return {"output": {"skipped": "unconfigured"}}
        if token.startswith(SEALED_PREFIX):
            host.log("slack: userToken arrived sealed — paste it on the config, "
                     "not the account")
            return {"output": {"skipped": "sealed-token"}}
        if not _pinned(base):
            raise RuntimeError(
                "slack: apiBase %r is not a pinned origin (https on a slack.com "
                "host, or loopback); refusing to send the user token" % base)

        resume = host.page.resume() or None
        if resume:
            aid = resume.get("account") or ""
            acct = accounts.get(aid)
            phase = resume.get("phase") or "done"
            if phase == "done":
                _stamp(host, acct, aid, _carry(dict(resume, phase="done")),
                       run=resume)
                return {"output": {"account": aid, "calls": resume.get("calls") or 0}}
            if not _budget_left(resume):
                # The engine gives a drain 512 pages and two minutes; this
                # workspace is bigger than that. Stop cleanly, hand the queue to
                # the next run, and say how much is left.
                _stamp(host, acct, aid, _carry(resume), note="drain bounded",
                       completed=False, run=resume)
                return {"output": {"account": aid, "pending": True,
                                   "calls": resume.get("calls") or 0}}
            try:
                nxt = PHASES[phase](host, base, token, _spend(resume))
            except RateLimited as rl:
                # The exact phase, page and window are already in `resume`, so
                # the retry resumes rather than restarting; the deadline is
                # Slack's own.
                _stamp(host, acct, aid, _carry(resume), note="rate limited",
                       not_before=rl.not_before(), completed=False, run=resume)
                return {"output": {"account": aid, "rateLimited": True,
                                   "retryAfter": rl.retry_after}}
            except Exception as e:  # noqa: BLE001 - every failure is the account's status
                _erroring(host, acct, aid, e, _carry(resume), run=resume,
                          at_phase=phase)
                return {"output": {"account": aid, "erroring": True}}
            if (nxt.get("phase") or "done") == "done":
                _stamp(host, acct, aid, _carry(nxt), run=nxt)
                return {"output": {"account": aid, "calls": nxt.get("calls") or 0}}
            return {"more": host.page.more(nxt)}

        # A fresh delivery. One account per repository: the
        # lexicographically-first live account is THE account, and every other
        # live row is stamped ignored (an identical stamp no-op-suppresses).
        live = sorted(aid for aid, a in accounts.items() if _wants(a))
        primary = live[0] if live else ""
        for dup in live[1:]:
            host.effects.patch((accounts[dup].get("kind") or ACCOUNT_TYPE) or ACCOUNT_TYPE,
                               dup, properties={"syncStatus": IGNORED_STATUS})

        record = (input.get("envelope") or {}).get("record") or {}
        # WHICH PATH this run came in on, because the two are stamped by different
        # hands: the dispatcher writes `lastSyncStartedAt` and
        # `lastSyncDurationMs` around a RECORD-sourced delivery, and a
        # SCHEDULE-sourced one names no record, so there the body stamps them
        # itself (decision 0085).
        scheduled = (record.get("kind") or "") != ACCOUNT_TYPE
        if not scheduled:
            aid = record.get("id") or ""
            if aid != primary:
                return {"output": {"account": aid, "ignored": True}}
        else:
            # Schedule-triggered: the one live account, when due.
            if not primary or not _due(accounts[primary].get("properties") or {}):
                return {"output": {"synced": 0}}
            aid = primary

        acct = accounts.get(aid)
        if acct is None or not _wants(acct):
            return {"output": {"synced": 0}}
        props = acct.get("properties") or {}
        stored = props.get("streamCursors")
        stored = stored if isinstance(stored, dict) else {}
        # The run's own facts, for the trait's progress and duration stamps. The
        # walk's `cursor` below carries the same three keys onward.
        run = {"startedAt": time.time(), "calls": 1, "scheduled": scheduled}

        # ONE auth.test. It is the only call that can say which workspace the
        # token belongs to and which user it is.
        try:
            auth = _call(base, token, "auth.test")
        except RateLimited as rl:
            # The FIRST call is rate limited as readily as any other, and
            # treating it as a general failure stamped the account erroring and
            # then retried immediately on the next tick.
            _stamp(host, acct, aid, dict(stored), note="rate limited",
                   not_before=rl.not_before(), completed=False, run=run)
            return {"output": {"account": aid, "rateLimited": True,
                               "retryAfter": rl.retry_after}}
        except Exception as e:  # noqa: BLE001
            _erroring(host, acct, aid, e, run=run)
            return {"output": {"account": aid, "erroring": True}}
        team = auth.get("team_id") or ""
        owner = auth.get("user_id") or ""
        domain = urllib.parse.urlsplit(auth.get("url") or "").hostname or ""
        if not team:
            _erroring(host, acct, aid, "auth.test returned no team_id", run=run)
            return {"output": {"account": aid, "erroring": True}}
        # What the token turned out to be, as REFERENCES: the workspace and the
        # user are mirrored rows, and their names and ids are theirs to hold. Both
        # land later in this same drain, which is why neither reference is
        # mustExist.
        stamp = {"team": _team_ref(host, aid, team, team)}
        if owner:
            stamp["user"] = _user_ref(host, aid, team, owner)
        host.effects.patch((acct.get("kind") or ACCOUNT_TYPE) or ACCOUNT_TYPE, aid,
                           properties=stamp)

        cold = not props.get("lastCompletedAt")
        cursor = {
            "account": aid, "team": team, "domain": domain,
            "filter": (props.get("conversationFilter") or "").strip().lower(),
            "members": bool(props.get("enabledMembers")),
            # A resumed cold walk keeps the floor it started with; only a fresh
            # one computes a new one.
            "cold": cold if stored.get("cold") is None else bool(stored.get("cold")),
            "floor": (stored.get("floor") if stored.get("floor") is not None
                      else _floor(props, cold)),
            "startedAt": run["startedAt"], "calls": 1,
            # Carried so every stamp of this walk, bounded or not, knows which
            # path it came in on and when it started.
            "scheduled": scheduled,
            # Unfinished work from a bounded drain resumes where it stopped, and a
            # finished one starts the walk again from the top.
            "phase": stored.get("phase") or "team",
            "cursor": stored.get("cursor") or "",
            "failed": list(stored.get("failed") or []),
            "retry": list(stored.get("retry") or []),
            "queue": list(stored.get("queue") or []),
            "info": list(stored.get("info") or []),
            "threads": [list(t) for t in (stored.get("threads") or [])],
            "hydrate": list(stored.get("hydrate") or []),
            "files": list(stored.get("files") or []),
            "bots": list(stored.get("bots") or []),
            "known": [],
            "rosters": list(stored.get("rosters") or []),
            "work": stored.get("work"),
            "reply": stored.get("reply"),
            "roster": stored.get("roster"),
        }
        # The retry list, read before anything clears it. It is re-queued ONLY at
        # the top of a NEW walk, and that "only" was exactly backwards: a new
        # walk emptied the list before the re-queue loop read it, so a failure
        # was never retried at all — while a RESUMED delivery (a 429, a bounded
        # drain) re-queued it into a phase the walk had already gone past, where
        # it sat forever. The account then reported `1 pending` after every walk,
        # nothing ever drained it, and anything driving the account on pending
        # work ran a fresh walk each time.
        retries = list(cursor.pop("retry", []) or [])
        if cursor["phase"] == "done" or not stored.get("phase"):
            # A NEW WALK. The failure list is this walk's diagnosis, not a
            # permanent record: a conversation whose `conversations.info` 404'd
            # last time is asked again from the top, because the reason may have
            # gone away (the caller was re-added, the recording was captured).
            # Carrying it forward made the status report failures that no longer
            # existed and could never be retried, since a permanent failure is
            # never re-queued WITHIN a walk.
            cursor["phase"] = "team"
            cursor["failed"] = []
        else:
            # A RESUMED walk keeps its failures and its retry list untouched:
            # the queues it holds are the ones it is still draining, and the
            # retry belongs to the walk after this one.
            cursor["retry"] = retries
            retries = []
        for kind, ident in retries:
            if kind == "thread" and isinstance(ident, list):
                cursor["threads"].append(list(ident))
            elif kind == "hydrate":
                cursor["hydrate"].append(ident)
            elif kind == "file":
                cursor["files"].append(ident)
            elif kind == "bot":
                cursor["bots"].append(ident)
            elif kind == "roster":
                cursor["rosters"].append(ident)
            elif kind == "info":
                cursor["info"].append(ident)
            elif kind == "history":
                cursor["queue"].append(ident)
        return {"more": host.page.more(cursor)}
