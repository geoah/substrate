data:
  authority: providers.substrate.reamde.dev
  package: linear
  description: >-
    A label for Linear issues. One Linear issue label, from the `issueLabels`
    connection (introspected 2026-09-16); `at` is `createdAt`. Omitted as
    classes: GraphQL's envelope (`data`, `errors`, `pageInfo`) and its hypermedia,
    the `*Connection` sub-queries. Every payload is authoritative: a selected
    field returned null is a clear.
