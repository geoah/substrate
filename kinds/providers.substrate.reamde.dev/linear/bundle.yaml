# ---- the sync function: one GraphQL page per invocation ----------------------
# A PEP 723 Python body (requests through uv). It reads the pasted API key off
# the injected connector config, walks the stages PINNED at queue-head and
# drains OFF THE CAUSAL CHAIN through the paged-checkpoint more/resume
# contract, parking whatever a bounded drain could not finish on the account.
#
#   viewer          the key's own member row, and account.user
#   organization    the workspace, and its project statuses whole
#   teams           every team
#   users           every member, disabled and archived included
#   workflowstates  every workflow state
#   labels          every issue label
#   projects        every project, with its teams and members inline
#   cycles          every cycle
#   issues          every issue updated since the stage's floor, newest last,
#                   with its labels, subscribers, comments and reactions
#
# EVERY ROW IS MINTED THEN PATCHED: `put(if_absent=True)` with the payload's
# non-null half, then `patch` with the whole of it, nulls included. GraphQL
# answers exactly the selection set, so every payload here is AUTHORITATIVE
# and a null IS a clear (§1's write contract); an empty string is a VALUE and
# is written through, because Linear uses it for an empty description.
#
# A NESTED CONNECTION IS WRITTEN WHOLE OR NOT AT ALL. `issue.labels`,
# `issue.subscribers`, `issue.comments`, `issue.reactions`, `project.teams`
# and `project.members` are read inline at a cap; a page that says
# `hasNextPage` leaves the property ALONE and says so on the status, because a
# list written short is a lie about the graph rather than a partial read of
# it.
kind: substrate.reamde.dev/core/function
metadata:
  id: providers.substrate.reamde.dev/linear/linearsync
data:
  authority: providers.substrate.reamde.dev
  package: linear
  description: >-
    Sync a Linear workspace: mirror the organization, its teams, members,
    workflow states, labels, project statuses, projects, cycles, issues, comments
    and reactions — every relation a reference, one GraphQL page per invocation,
    never writing back to Linear.
  runtime: python
  timeout: PT60S
  permissions:
    writes:
      - providers.substrate.reamde.dev/linear/organization
      - providers.substrate.reamde.dev/linear/team
      - providers.substrate.reamde.dev/linear/user
      - providers.substrate.reamde.dev/linear/workflowstate
      - providers.substrate.reamde.dev/linear/issuelabel
      - providers.substrate.reamde.dev/linear/projectstatus
      - providers.substrate.reamde.dev/linear/project
      - providers.substrate.reamde.dev/linear/cycle
      - providers.substrate.reamde.dev/linear/issue
      - providers.substrate.reamde.dev/linear/comment
      - providers.substrate.reamde.dev/linear/reaction
      - providers.substrate.reamde.dev/linear/account
    network:
      - "api.linear.app"
      - "127.0.0.1"
      - "localhost"
  source: |
    # /// script
    # requires-python = ">=3.11"
    # dependencies = [
    #   "requests==2.32.4",
    # ]
    # ///
    """Linear sync — one GraphQL page per request, mirrors only, references everywhere.

    The pasted API key arrives injected on the bundle's connector input
    (`config.inputs.connector.properties.apiKey`); the origin it may be spent at
    arrives beside it as `apiBase` and is PINNED — https on api.linear.app, or a
    loopback host as the test seam. Linear's OAuth application is not registered
    for this workspace, so this bundle authorises with a personal API key exactly
    the way the Slack and Notion bundles authorise with a pasted token
    (`docs/provider-practices.md` §7).

    THE WALK, in reference order, because a row is never written before the rows
    it points at: viewer, organization (with its project statuses), teams, users,
    workflow states, labels, projects, cycles, issues (with their labels,
    subscribers, comments and reactions). Each stage pages its GraphQL connection;
    the page cursor rides in the paged-checkpoint `more`/`resume` contract AND on
    the account (`syncPending`), so a workspace of 13,000 issues drains over
    consecutive ticks instead of restarting the walk every round.

    EVERY STAMP ALSO WRITES THE CORE `sync` TRAIT (substrate decision 0085)
    beside the legacy strings: `syncState` / `syncMessage`, `syncProgress` over
    the stage walk, `syncError` / `syncErrorAt` on a failure, a rate limit as
    `throttled` rather than `erroring`, and — on the SCHEDULE path only, since
    the dispatcher owns the record-sourced one — `lastSyncStartedAt` /
    `lastSyncDurationMs`. `syncPaused` holds the schedule, which freezes an
    unfinished cold walk where it stands rather than abandoning it.

    ONLY THE ISSUES STAGE IS INCREMENTAL. The workspace stages are small (a few
    hundred rows each) and are walked WHOLE every sync, which is what keeps a
    deleted-then-restored label, a renamed team or a reopened cycle correct
    without a per-stage tombstone protocol. The issues stage carries a watermark
    per account, walks `updatedAt` order behind it with a 15-minute overlap, and
    stamps the RUN-START instant — never the local completion clock — when it
    drains.

    EVERY REQUEST NAMES ITS OPERATION `<Stage>Page<N>`. That is not decoration:
    `tools/mockserver.py` slugs a GraphQL POST body by `operationName` alone
    (the document text and the variables contribute nothing), so the operation
    name IS the recording's name, and a page is replayable only if it says which
    page it is. `tools/rawpull/linear.py` reads QUERIES out of this very file
    through `ast`, so a recording it captures answers the request this body sends,
    field for field, by construction.

    EVERY ROW IS MINTED THEN PATCHED: `put(if_absent=True)` with the payload's
    non-null half, then `patch` with the whole of it, nulls included. GraphQL
    answers exactly the selection set, so every payload here is AUTHORITATIVE and
    a null IS a clear (`docs/kind-design.md` §1's write contract). An empty string
