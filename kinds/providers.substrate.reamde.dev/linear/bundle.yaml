        - value: "off"
          label: "off"
        - value: "suggest"
          label: "suggest"
        - value: "autoonmerge"
          label: "autoOnMerge"
    # DECLARED, NOT FETCHED: [Internal]
    aiProviderConfiguration:
      type: json
      displayName: AI Provider Configuration
      description: "[INTERNAL] Configure per-modality AI host providers and
        model families. json: the schema types it `JSONObject`, an opaque
        scalar."
    linearAgentEnabled:
      type: bool
      displayName: Linear Agent Enabled
      description: "[Internal] Whether the workspace has enabled Linear Agent."
    # DECLARED, NOT FETCHED: [Internal]
    linearAgentSettings:
      type: json
      displayName: Linear Agent Settings
      description: "[Internal] Settings for Linear Agent features. json: the
        schema types it `JSONObject`, an opaque scalar."
    codingAgentEnabled:
      type: bool
      displayName: Coding Agent Enabled
      description: "[INTERNAL] Whether the workspace has enabled Coding Sessions."
    # DECLARED, NOT FETCHED: [Internal]
    codingAgentSettings:
      type: json
      displayName: Coding Agent Settings
      description: "[Internal] Settings for Coding Sessions features. json:
        the schema types it `JSONObject`, an opaque scalar."
    # DECLARED, NOT FETCHED: @deprecated in Linear's schema — selecting it makes every page fail the day it goes
    slaDayCount:
      type: enum
      displayName: SLA Day Count
      description: "[DEPRECATED] Which day count to use for SLA calculations."
      values:
        - value: "all"
          label: "all"
        - value: "onlybusinessdays"
          label: "onlyBusinessDays"
    # DECLARED, NOT FETCHED: @deprecated in Linear's schema — selecting it makes every page fail the day it goes
    projectUpdatesReminderFrequency:
      type: enum
      displayName: Project Updates Reminder Frequency
      description: "[DEPRECATED] The frequency at which to prompt for project
        updates."
      values:
        - value: "week"
          label: "week"
        - value: "twoweeks"
          label: "twoWeeks"
        - value: "month"
          label: "month"
        - value: "never"
          label: "never"
    # DECLARED, NOT FETCHED: @deprecated in Linear's schema — selecting it makes every page fail the day it goes
    allowedAiProviders:
      type: string
      repeated: true
      displayName: Allowed AI Providers
      description: "[INTERNAL] Permitted AI providers."
    slackProjectChannelPrefix:
      type: string
      displayName: SLAck Project Channel Prefix
      description: The prefix used for auto-created Slack project channels.
    slackProjectChannelsEnabled:
      type: bool
      displayName: SLAck Project Channels Enabled
      description: "[Internal] Whether the Slack project channels feature
        is enabled for the workspace."
    slackAutoCreateProjectChannel:
      type: bool
      displayName: SLAck Auto Create Project Channel
      description: "[Internal] Whether to automatically create a Slack channel
        when a new project is created."
    userCount:
      type: int
      displayName: User Count
      description: The number of active (non-deactivated) users in the workspace.
    createdIssueCount:
      type: int
      displayName: Created Issue Count
      description: Approximate total number of issues created in the workspace,
        including archived ones. This count is cached and may not reflect
        the exact real-time count.
    customerCount:
      type: int
      displayName: Customer Count
      description: The number of active (non-archived) customers tracked in
        the workspace.
    customersEnabled:
      type: bool
      displayName: Customers Enabled
      description: Whether the Customers feature is enabled and accessible
        for the workspace based on the current plan.
    releasesEnabled:
      type: bool
      displayName: Releases Enabled
      description: Whether release management is enabled for the workspace.
    # DECLARED, NOT FETCHED: @deprecated in Linear's schema — selecting it makes every page fail the day it goes
    allowMembersToInvite:
      type: bool
      displayName: Allow Members To Invite
      description: "[DEPRECATED] Whether member users are allowed to send
        invites."
    # DECLARED, NOT FETCHED: @deprecated in Linear's schema — selecting it makes every page fail the day it goes
    restrictTeamCreationToAdmins:
      type: bool
      displayName: Restrict Team Creation To Admins
      description: "[DEPRECATED] Whether team creation is restricted to admins."
    # DECLARED, NOT FETCHED: @deprecated in Linear's schema — selecting it makes every page fail the day it goes
    restrictLabelManagementToAdmins:
      type: bool
      displayName: Restrict Label Management To Admins
      description: "[DEPRECATED] Whether workspace label creation, update,
        and deletion is restricted to admins."
    # ---- relations ---------------------------------------------------
    # DECLARED, NOT FETCHED: [Internal] a view-configuration list of an unmirrored type
    facetsIds:
      type: string
      repeated: true
      displayName: Facets IDs
      description: "`facets` — [Internal] Facets associated with the workspace,
        used for configuring custom views and filters."
    ipRestrictions:
      type: object
      repeated: true
      displayName: IP Restrictions
      description: IP restriction configurations.
      fields:
        range:
          type: string
          description: IP range in CIDR format.
        type:
          type: string
          description: Restriction type.
        description:
          type: text
          description: Optional restriction description.
        enabled:
          type: bool
          description: Whether the restriction is enabled.
    projectStatuses:
      type: reference
      kind: providers.substrate.reamde.dev/linear/projectstatus
      repeated: true
      displayName: Project Statuses
      description: The workspace's available project statuses, which define
        the lifecycle stages for projects.
    # DECLARED, NOT FETCHED: an unmirrored Integration
    slackProjectChannelIntegrationId:
      type: string
      displayName: SLAck Project Channel Integration ID
      description: "`slackProjectChannelIntegration` — the Slack integration
        used for auto-creating project channels."
    # DECLARED, NOT FETCHED: the paid plan, an unmirrored type
    subscriptionId:
      type: string
      displayName: Subscription ID
      description: "`subscription` — the workspace's subscription to a paid
        plan."
    # ---- instants ----------------------------------------------------
    updatedAt:
      type: datetime
      displayName: Updated At
      description: The last time at which the entity was meaningfully updated.
        This is the same as the creation time if the entity hasn't been updated
        after creation.
    archivedAt:
      type: datetime
      displayName: Archived At
      description: The time at which the entity was archived. Null if the
        entity has not been archived.
    deletionRequestedAt:
      type: datetime
      displayName: Deletion Requested At
      description: The time at which deletion of the workspace was requested.
        Null if no deletion has been requested.
    trialEndsAt:
      type: datetime
      displayName: Trial Ends At
      description: The time at which the current plan trial will end. Null
        if the workspace is not in a trial period.
    trialStartsAt:
      type: datetime
      displayName: Trial Starts At
      description: The time at which the current plan trial started. Null
        if the workspace is not in a trial period.
---
# ---- mirror: one team --------------------------------------------------------
# From the `teams` connection, walked whole. A team is the scope of a workflow
# state, a label, a cycle, and of an issue's identifier prefix (`key`).
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/linear/team
data:
  authority: providers.substrate.reamde.dev
  package: linear
  description: >-
    A team in your Linear workspace. One Linear team, from the `teams` connection
    (schema introspected 2026-09-16); `at` is `createdAt`. Omitted as classes:
    GraphQL's envelope (`data`, `errors`, `pageInfo`) and its hypermedia,
    the `*Connection` sub-queries. Every payload is authoritative: a selected
    field returned null is a clear.
  purpose: supporting
  names:
    singular: team
  traits:
    - substrate.reamde.dev/core/temporal(point)
  displayTemplate: "{name}"
  properties:
    # ---- identity ----------------------------------------------------
    account:
      type: reference
      kind: providers.substrate.reamde.dev/linear/account
      required: true
      onDelete: cascade
      displayName: Account
      description: the Linear account this row was synced through
    teamId:
      type: string
      displayName: Team ID
      description: Linear's `id` — the team's UUID, and the id every row derives
        from
    # ---- the object's own fields, in the schema's order ---------------
    name:
      type: string
      displayName: Name
      description: The team's name.
    key:
      type: string
      displayName: Key
      description: The team's unique key, used as a prefix in issue identifiers
        (e.g., 'ENG' in 'ENG-123') and in URLs.
    description:
      type: text
      displayName: Description
      description: The team's description.
    icon:
      type: string
      displayName: Icon
      description: The icon of the team.
    color:
      type: string
      displayName: Color
      description: The team's color.
    cyclesEnabled:
      type: bool
      displayName: Cycles Enabled
      description: Whether the team uses cycles for sprint-style issue management.
    cycleStartDay:
      type: float
      displayName: Cycle Start Day
      description: The day of the week that a new cycle starts (0 = Sunday,
        1 = Monday, ..., 6 = Saturday).
    cycleDuration:
      type: float
      displayName: Cycle Duration
      description: The duration of each cycle in weeks.
    cycleCooldownTime:
      type: float
      displayName: Cycle Cooldown Time
      description: The cooldown time after each cycle in weeks.
    cycleIssueAutoAssignStarted:
      type: bool
      displayName: Cycle Issue Auto Assign Started
      description: Auto assign started issues to current cycle.
    cycleIssueAutoAssignCompleted:
      type: bool
      displayName: Cycle Issue Auto Assign Completed
      description: Auto assign completed issues to current cycle.
    cycleLockToActive:
      type: bool
      displayName: Cycle Lock To Active
      description: Auto assign issues to current cycle if in active status.
    upcomingCycleCount:
      type: int
      displayName: Upcoming Cycle Count
      description: How many upcoming cycles to create.
    timezone:
      type: timezone
      displayName: Timezone
      description: The timezone of the team. Defaults to "America/Los_Angeles"
    inheritWorkflowStatuses:
      type: bool
      displayName: Inherit Workflow Statuses
      description: Whether the team should inherit its workflow statuses from
        its parent. Only applies to sub-teams.
    inheritProjectStatuses:
      type: bool
      displayName: Inherit Project Statuses
      description: "[Internal] Whether the team should inherit its project
        statuses from its parent team, or from the workspace when it has no
        parent."
    inheritIssueEstimation:
      type: bool
      displayName: Inherit Issue Estimation
      description: Whether the team should inherit its estimation settings
        from its parent. Only applies to sub-teams.
    issueEstimationType:
      type: enum
      displayName: Issue Estimation Type
      description: The issue estimation type to use. Must be one of "notUsed",
        "exponential", "fibonacci", "linear", "tShirt".
      values:
        - value: "notused"
          label: "notUsed"
        - value: "exponential"
          label: "exponential"
        - value: "fibonacci"
          label: "fibonacci"
        - value: "linear"
          label: "linear"
        - value: "tshirt"
          label: "tShirt"
    # DECLARED, NOT FETCHED: @deprecated in Linear's schema — selecting it makes every page fail the day it goes
    issueOrderingNoPriorityFirst:
      type: bool
      displayName: Issue Ordering No Priority First
      description: "[DEPRECATED] Whether issues without priority should be
        sorted first."
    issueEstimationAllowZero:
      type: bool
      displayName: Issue Estimation Allow Zero
      description: Whether to allow zeros in issues estimates.
    setIssueSortOrderOnStateChange:
      type: string
      displayName: Set Issue Sort Order On State Change
      description: Where to move issues when changing state.
    issueEstimationExtended:
      type: bool
      displayName: Issue Estimation Extended
      description: Whether to add additional points to the estimate scale.
    defaultIssueEstimate:
      type: float
      displayName: Default Issue Estimate
      description: What to use as a default estimate for unestimated issues.
    triageEnabled:
      type: bool
      displayName: Triage Enabled
      description: Whether triage mode is enabled for the team. When enabled,
        issues created by non-members or integrations are routed to a triage
        state for review before entering the normal workflow.
    requirePriorityToLeaveTriage:
      type: bool
      displayName: Require Priority To Leave Triage
      description: Whether an issue needs to have a priority set before leaving
        triage.
    # DECLARED, NOT FETCHED: @deprecated in Linear's schema — selecting it makes every page fail the day it goes
    defaultTemplateForMembersId:
      type: string
      displayName: Default Template For Members ID
      description: The id of the default template to use for new issues created
        by members of the team.
    # DECLARED, NOT FETCHED: @deprecated in Linear's schema — selecting it makes every page fail the day it goes
    defaultTemplateForNonMembersId:
      type: string
      displayName: Default Template For Non Members ID
      description: The id of the default template to use for new issues created
        by non-members of the team.
    # DECLARED, NOT FETCHED: @deprecated in Linear's schema — selecting it makes every page fail the day it goes
    private:
      type: bool
      displayName: Private
      description: Whether the team is private. Private teams are only visible
        to their members and require an explicit invitation to join.
    allMembersCanJoin:
      type: bool
      displayName: All Members Can Join
      description: Whether all members in the workspace can join the team.
        Only used for public teams.
    securitySettings:
      type: json
      displayName: Security Settings
      description: "Security settings for the team, including role-based restrictions
        for issue sharing, label management, member management json: the schema
        types it `JSONObject`, an opaque scalar."
    scimManaged:
      type: bool
      displayName: SCIM Managed
      description: Whether the team is managed by a SCIM integration. SCIM-managed
        teams have their membership controlled by the identity provider.
    scimGroupName:
      type: string
      displayName: SCIM Group Name
      description: The SCIM group name for the team.
    # DECLARED, NOT FETCHED: [Internal]
    progressHistory:
      type: json
      displayName: Progress History
      description: "[Internal] The progress history of the team. json: the
        schema types it `JSONObject`, an opaque scalar."
    # DECLARED, NOT FETCHED: [Internal]
    currentProgress:
      type: json
      displayName: Current Progress
      description: "[Internal] The current progress of the team. json: the
        schema types it `JSONObject`, an opaque scalar."
    groupIssueHistory:
      type: bool
      displayName: Group Issue History
      description: Whether to group recent issue history entries.
    aiThreadSummariesEnabled:
      type: bool
      displayName: AI Thread Summaries Enabled
      description: Whether to enable resolved thread AI summaries.
    aiDiscussionSummariesEnabled:
      type: bool
      displayName: AI Discussion Summaries Enabled
      description: Whether to enable AI discussion summaries for issues in
        this team.
    # DECLARED, NOT FETCHED: @deprecated in Linear's schema — selecting it makes every page fail the day it goes
    slackNewIssue:
      type: bool
      displayName: SLAck New Issue
      description: Whether to send new issue notifications to Slack.
    # DECLARED, NOT FETCHED: @deprecated in Linear's schema — selecting it makes every page fail the day it goes
    slackIssueComments:
      type: bool
      displayName: SLAck Issue Comments
      description: Whether to send new issue comment notifications to Slack.
    # DECLARED, NOT FETCHED: @deprecated in Linear's schema — selecting it makes every page fail the day it goes
    slackIssueStatuses:
      type: bool
      displayName: SLAck Issue Statuses
      description: Whether to send new issue status updates to Slack.
    autoClosePeriod:
      type: float
      displayName: Auto Close Period
      description: Period after which issues are automatically closed in months.
        Null/undefined means disabled.
    autoArchivePeriod:
      type: float
      displayName: Auto Archive Period
      description: Period after which automatically closed, completed, and
        duplicate issues are automatically archived in months.
    autoCloseParentIssues:
      type: bool
      displayName: Auto Close Parent Issues
      description: Whether parent issues should automatically close when all
        child issues are closed
    autoCloseChildIssues:
      type: bool
      displayName: Auto Close Child Issues
      description: Whether child issues should automatically close when their
        parent issue is closed
    joinByDefault:
      type: bool
      displayName: Join By Default
      description: "[Internal] Whether new users should join this team by
        default."
    inheritSlackAutoCreateProjectChannel:
      type: bool
      displayName: Inherit SLAck Auto Create Project Channel
      description: "[Internal] Whether the team should inherit its Slack auto-create
        project channel setting from its parent. Only applies to sub-teams."
    slackAutoCreateProjectChannel:
      type: bool
      displayName: SLAck Auto Create Project Channel
      description: "[Internal] Whether to automatically create a Slack channel
        when a new project is created in this team."
    cycleCalenderUrl:
      type: url
      displayName: Cycle Calender URL
      description: Calendar feed URL (iCal) for cycles.
    visibility:
      type: enum
      displayName: Visibility
      description: The visibility of the team. Returns public for teams visible
        to all workspace members, private for teams visible only to members,
        and restricted for non-private teams inside a private-team boundary.
      values:
        - value: "public"
          label: "public"
        - value: "restricted"
          label: "restricted"
        - value: "private"
          label: "private"
    displayName:
      type: string
      displayName: Display Name
      description: The name of the team including its parent team name if
        it has one.
    issueCount:
      type: int
      displayName: Issue Count
      description: The total number of issues in the team. By default excludes
        archived issues; use the includeArchived argument to include them.
    ledInitiativeCount:
      type: int
      displayName: Led Initiative Count
      description: The number of initiatives led by this team that would be
        deleted along with it. Counts every led initiative, including ones
        not otherwise visible to the caller
    initiativesEnabled:
      type: bool
      displayName: Initiatives Enabled
      description: Whether team initiatives are enabled and shown in the team's
        sidebar.
    # DECLARED, NOT FETCHED: @deprecated in Linear's schema — selecting it makes every page fail the day it goes
    issueSortOrderDefaultToBottom:
      type: bool
      displayName: Issue Sort Order Default To Bottom
      description: "[DEPRECATED] Whether to move issues to bottom of the column
        when changing state."
    # DECLARED, NOT FETCHED: @deprecated in Linear's schema — selecting it makes every page fail the day it goes
    inviteHash:
      type: secret
      displayName: Invite Hash
      description: "[DEPRECATED] Unique hash for the team to be used in invite
        URLs."
    # ---- relations ---------------------------------------------------
    organization:
      type: reference
      kind: providers.substrate.reamde.dev/linear/organization
      displayName: Organization
      description: The workspace that the team belongs to.
    parent:
      type: reference
      kind: providers.substrate.reamde.dev/linear/team
      displayName: Parent
      description: The team's parent team.
    children:
      type: reference
      kind: providers.substrate.reamde.dev/linear/team
      repeated: true
      displayName: Children
      description: "[Internal] The team's sub-teams."
    restrictedBy:
      type: reference
      kind: providers.substrate.reamde.dev/linear/team
      displayName: Restricted By
      description: "[Internal] For restricted teams, the enclosing private
        team that forms the visibility boundary. Null for public and private
        teams."
    # DECLARED, NOT FETCHED: [Internal] an unmirrored type
    resourceSectionsIds:
      type: string
      repeated: true
      displayName: Resource Sections IDs
      description: "`resourceSections` — [Internal] Sections shown on the
        team home that group pinned resources."
    # DECLARED, NOT FETCHED: [Internal] an unmirrored type
    pinnedResourcesIds:
      type: string
      repeated: true
      displayName: Pinned Resources IDs
      description: "`pinnedResources` — [Internal] Documents and external
        links pinned to the team home, optionally grouped under sections."
    defaultIssueState:
      type: reference
      kind: providers.substrate.reamde.dev/linear/workflowstate
      displayName: Default Issue State
      description: The default workflow state into which issues are set when
        they are opened by team members.
    defaultProjectTemplateId:
      type: string
      displayName: Default Project Template ID
      description: "`defaultProjectTemplate` — the default template to use
        for new projects created for the team."
    triageIssueState:
      type: reference
      kind: providers.substrate.reamde.dev/linear/workflowstate
      displayName: Triage Issue State
      description: The workflow state into which issues are set when they
        are opened by non-team members or integrations if triage is enabled.
