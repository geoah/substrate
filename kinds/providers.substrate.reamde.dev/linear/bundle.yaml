# The Linear bundle — a COMPLETE, FIRST-CLASS mirror of one Linear workspace.
# SYNC-ONLY: nothing here ever writes back to Linear.
#
# It mirrors Linear's own object model in Linear's own shape: the workspace,
# its teams and members, the workflow states, labels and project statuses
# those teams define, the projects and cycles work is planned into, the issues
# the account's window covers, and the comments and reactions on them.
#
# THE RULE THIS BUNDLE OBEYS is `docs/kind-design.md` v4. What that costs, and
# what a GraphQL provider has to decide that a REST one does not:
#
#   * THE TWO OMITTED CLASSES, in GraphQL. §1 omits the response envelope and
#     hypermedia, and nothing else. Here the envelope is `data`, `errors`,
#     `extensions` and every connection's `pageInfo`/`edges`; the hypermedia
#     is every `*Connection` FIELD — a parameterised sub-query is the graph's
#     URL template, and `issue.comments` is to `comments_url` exactly what
#     `issue.labels` is to `labels_url`. The connections the sync
#     actually reads are DECLARED, as repeated references, the way `url` and
#     `html_url` stay in a REST mirror.
#   * EVERY OTHER FIELD IS DECLARED. Including the ones the sync does not
#     select: a `@deprecated` field (selecting one makes every page fail the
#     day Linear removes it), the two invite hashes (a credential, declared
#     `secret`), the SSO/SCIM settings blobs, and the YJS/ProseMirror state of
#     prose the row already carries. Each one says DECLARED, NOT FETCHED and
#     why, which is §1's own "declared but not yet fetched" clause.
#   * NO `raw`, and `json` only where Linear publishes NO SCHEMA AT ALL. Every
#     `JSONObject` field is exactly that — an opaque scalar in the schema —
#     and each description says so. Nothing else is a blob.
#   * NO scalar doubles a reference. Linear ships several relations twice, as
#     the object and as its id (`comment.issue` / `comment.issueId`,
#     `team.restrictedBy` / `restrictedById`, `project.leadTeam` /
#     `leadTeamId`, `projectstatus.team` / `teamId`). The mirror keeps each
#     ONCE: the reference where this bundle mirrors the other end, the id
#     where it does not (§3). A relation whose target is out of scope is the
#     target's id under the API's own `<field>Id`, its description naming the
#     scope boundary and what would make it a reference (§2).
#   * NO consumer slot and no owner-relative flag. There is no `person`, no
#     `task` and no `isMine`: a mapping SYNTHESISES its subject slot on the
#     source kind (substrate #570), and "my issues" is a filter on `assignee`.
#     Linear's OWN self-facts stay, because they are the API's: `user.isMe`,
#     `user.admin`, `sharedAccess.viewerHasOnlySharedAccess`.
#   * NO sync bookkeeping on a mirror. The per-stage watermark, the unfinished
#     walk and the run stamp live on the ACCOUNT row and nowhere else (§1).
#   * TYPES COME FROM THE SCHEMA, NEVER FROM THE VALUES SEEN. GraphQL `Int` is
#     `int` and `Float` is `float`, even where every value in the owner's
#     workspace is a whole number (`issue.number`, `priority`, `estimate`,
#     `cycleDuration` are all `Float!` in Linear's schema) — a mirror that
#     typed them `int` off the corpus would refuse the first fractional
#     estimate. A set the schema closes with an `enum` is an `enum`, spelled
#     `[a-z][a-z0-9]*` with Linear's own spelling as the label; a set only
#     Linear's PROSE lists (`workflowstate.type`, `team.issueEstimationType`,
#     `organization.pullRequestIssueMode`, `issue.slaType`) is a `string`,
#     because its schema type is `String` and an enum would refuse the page
#     the day a word is added (§2).
#   * NO `mustExist` ON A MIRROR REFERENCE, and this is deliberate. The stages
#     walk the workspace before the issues, so a referent normally exists —
#     but an issue's window may name a project created since the projects
#     walk, and one such row would refuse the whole page and stall the
#     account. A dangling reference heals on the next walk, which is the
#     guide's own ruling for a target that may land later (§2, the Slack
#     `thread_ts` row; provider-practices §6). `account` is the exception: it
#     is `required` and cascades.
#
# AUTH IS A PASTED API KEY, not a consent flow. Linear's OAuth application is
# not registered for this workspace, and a personal API key (`lin_api_…`)
# reads everything the viewer can see, so this bundle ships NO `oauth2:`
# block: the key lives on the CONFIG record, sealed, injected into the sync
# body alone — the shape the Slack and Notion bundles use
# (provider-practices §7).
#
# THE WALK, and it is the reference order: viewer → organization (with its
# project statuses) → teams → users → workflow states → labels → projects →
# cycles → issues (with their labels, subscribers, comments and reactions).
# Each stage pages its connection; the cursor rides in the paged-checkpoint
# `more`/`resume` contract AND on the account, so a workspace of 13,000
# issues drains over consecutive ticks instead of restarting every round.
#
# EVERY REQUEST NAMES ITS OPERATION `<Stage>Page<N>`. `tools/mockserver.py`
# slugs a GraphQL POST by `operationName` alone, so the operation name IS the
# recording's name and a page is replayable only if it says which page it is.
# `tools/rawpull/linear.py` reads the queries out of the sync body through
# `ast`, so a recording answers the request this bundle sends by construction
# (provider-practices §1).
#
# Install:  substratectl apply -f bundle.yaml -f triggers.yaml
# Configure: create a config record — the Linear API key, and (tests only) an
#   `apiBase`.
# Connect:  create an account record with the toggles you want. There is no
#   consent step; `lastSyncedAt` is the completion marker there is.
#
# This file is the SCHEMA closure (the atomic install unit). The delivery
# wiring lives beside it in triggers.yaml as ordinary data records.
# ---- the owned package -------------------------------------------------------
kind: substrate.reamde.dev/core/package
metadata:
  id: providers.substrate.reamde.dev/linear
data:
  authority: providers.substrate.reamde.dev
  package: linear
  version: 19
---
# ---- the bundle document: the install unit -----------------------------------
# `installs:` names EXACTLY the package's schema members. No mapping: this
# package owns no person and no task, and the owner of a mapping's target is
# the one who declares it (record 0049).
kind: substrate.reamde.dev/core/bundle
metadata:
  id: providers.substrate.reamde.dev/linear
data:
  authority: providers.substrate.reamde.dev
  package: linear
  description: >-
    Keeps a copy of one Linear workspace — its teams, people, states, labels,
    project statuses, projects, cycles, and the issues, comments and reactions
    in your window. Read-only.
  # The one declared input: the API key record. `inject: functions` because
  # the sync body spends the key and reads the pinned `apiBase` off it.
  inputs:
    connector:
      kind: providers.substrate.reamde.dev/linear/config
      inject: functions
      description: the pasted Linear API key and the pinned API origin
  installs:
    - providers.substrate.reamde.dev/linear/config
    - providers.substrate.reamde.dev/linear/account
    - providers.substrate.reamde.dev/linear/organization
    - providers.substrate.reamde.dev/linear/team
    - providers.substrate.reamde.dev/linear/user
    - providers.substrate.reamde.dev/linear/workflowstate
    - providers.substrate.reamde.dev/linear/issuelabel
    - providers.substrate.reamde.dev/linear/projectstatus
    - providers.substrate.reamde.dev/linear/project
    - providers.substrate.reamde.dev/linear/cycle
    - providers.substrate.reamde.dev/linear/issue
    - providers.substrate.reamde.dev/linear/comment
    - providers.substrate.reamde.dev/linear/reaction
    - providers.substrate.reamde.dev/linear/linearsync
---
# ---- the config type: the `connector` input's kind ---------------------------
# The pasted Linear API key and the origin it may be spent at. NOT an oauth2
# kind: this bundle runs no consent flow, so there is no client id, no client
# secret and no endpoint metadata to trust.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/linear/config
data:
  authority: providers.substrate.reamde.dev
  package: linear
  description: >-
    The API key and address your Linear workspace connects through. The Linear
    API key this bundle spends and the API origin it may be sent to. The bundle's
    connector input resolves one record of this kind; the key is sealed against
    read-back and the origin is pinned, so an owner edit can never become
    an exfiltration channel.
  purpose: internal
  names:
    singular: config
  displayTemplate: Linear connection
  properties:
    apiKey:
      type: secret
      writer: owner
      displayName: API key
      description: >-
        the pasted Linear personal API key (lin_api_…, from Settings → Security
        & access → Personal API keys); it reads everything the viewer can
        see. Redacted on read, injected only into the sync body
    apiBase:
      type: url
      writer: owner
      # The body PINS the origin the key may travel to: exactly
      # https://api.linear.app, or a loopback host (127.0.0.1 / localhost /
      # ::1, any scheme) as the test seam. Anything else refuses BEFORE
      # sending — an owner-editable URL must never become an exfiltration
      # channel. This is what lets tools/mockserver.py stand in for Linear in
      # the e2e run and in `mnemectl seed-provider linear`.
      displayName: API base URL
      description: >-
        test-only override of https://api.linear.app — loopback hosts only;
        any other origin refuses to sync. Leave empty in production
---
# ---- the account type: one connected Linear workspace ------------------------
# accountconfig WITHOUT oauth2. The trait contracts tokenRef / tokenStatus /
# grantedScopes onto every implementing kind, so they are declared below as
# DORMANT: `writer: oauth` means only the OAuth facility may ever set them,
# and no flow runs for this bundle.
#
# THIS IS NOT A MIRROR. It is the connection: the owner's toggles, what the
# key turned out to be, and the connector's own per-stream state. What the
# `viewer` query taught it, it holds as REFERENCES — `user`, `organization` —
# and never as a copy of the viewer's name or the workspace's key, because a
# copy of a referent is a derived property (§1).
#
# THIS IS WHERE THE SYNC'S BOOKKEEPING LIVES, and nowhere else: `syncCursors`
# is the per-stage watermark, `syncPending` the unfinished walk a bounded
# drain left behind, `lastSyncedAt` / `lastCompletedAt` / `syncStatus` the run
# stamp, and `syncRequestedAt` / `syncRequestedAck` the "sync now" generation.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/linear/account
data:
  authority: providers.substrate.reamde.dev
  package: linear
  description: >-
    Your Linear workspace, connected here. One connected Linear workspace:
    the owner's sync toggles, the workspace and the member the API key turned
    out to be, and the connector's own per-stage progress. The accountconfig
    trait's OAuth hands are declared but stay dormant, since no OAuth flow
    ever runs for this bundle.
  purpose: internal
  names:
    singular: account
  # `sync` is the core trait the Connections page, `GET /api/v1/sync/status`
  # and `substratectl sync status` read (substrate decision 0085). This
  # bundle is SINGLE-STREAM — one sync function walking one workspace — so
  # the trait's account-level properties ARE the whole truth and
  # `syncStreams` stays unwritten; `syncRequestedAck` alone answers a
  # request, exactly as 0085 says a single-function provider does it. The
  # legacy `syncStatus` / `lastSyncedAt` / `lastCompletedAt` / `syncCursors`
  # / `syncPending` / `retryNotBefore` stay beside the trait, unchanged: a
  # narrowing is refused once rows hold the old shape.
  traits: [substrate.reamde.dev/core/accountconfig, substrate.reamde.dev/core/sync]
  displayTemplate: "{displayName|organization.name}"
  properties:
    # ---- the accountconfig trait's contracted properties — DORMANT here ----
    tokenRef:
      type: secret
      writer: oauth
      displayName: Token reference
      description: >-
        accountconfig trait contract — unused: the pasted key lives on the
        bundle config, and no OAuth flow runs
    tokenStatus:
      type: string
      writer: oauth
      displayName: Connection status
      description: >-
        accountconfig trait contract — unused: no OAuth flow ever reports
        a status here. Connection health reads off syncStatus
    grantedScopes:
      type: string
      repeated: true
      writer: oauth
      displayName: Granted scopes
      description: >-
        accountconfig trait contract — unused: no consent, no scopes. What
        the key can do is whatever it was minted with
    # ---- the owner's hands -------------------------------------------------
    displayName:
      type: string
      writer: owner
      displayName: Name
      description: a name for this connection, shown wherever the account
        is listed
    enabledWorkspace:
      type: bool
      writer: owner
      displayName: Workspace
      description: >-
        mirror the workspace itself — the organization, its teams and members,
        their workflow states, labels and project statuses. Every other stage
        references these rows
    enabledProjects:
      type: bool
      writer: owner
      displayName: Projects and cycles
      description: mirror the projects and the cycles work is planned into
    enabledIssues:
      type: bool
      writer: owner
      displayName: Issues
      description: >-
        mirror the issues updated inside the backfill window, with their labels,
        subscribers, comments and reactions
    syncFrequency:
      type: enum
      values:
        - value: "off"
          label: Off
        - value: hourly
          label: Every hour
        - value: daily
          label: Once a day
      required: true
      default: hourly
      writer: owner
      displayName: Sync frequency
      description: the scheduled sync cadence for this account (default hourly)
    backfillDepth:
      type: enum
      values:
        - value: none
          label: Don't backfill
        - value: last14d
          label: Last two weeks
        - value: last30d
          label: Last 30 days
        - value: last90d
          label: Last 90 days
        - value: last1y
          label: Last year
        - value: all
          label: Everything
      required: true
      default: last30d
      writer: owner
      displayName: Backfill depth
      description: >-
        how far back the first issues walk reaches, by the issue's own `updatedAt`
        (default 30 days); none means from connect time forward
    # "Sync now", as a GENERATION rather than a moment. The owner stamps
    # `syncRequestedAt`; the sync echoes the value it acted on into
    # `syncRequestedAck`; the `linear-on-request` trigger fires exactly while
    # the two disagree. Comparing the request against `lastSyncedAt` instead
    # looks simpler and has two failure modes the three providers before this
    # one both hit: a request dated in the future loops forever, and a request
    # landing in the SAME SECOND as the stamp is not greater than it, so the
    # guard closes and nothing can drive the account again
    # (provider-practices §4). A generation cannot outrun its acknowledgement
    # whatever the clocks say.
    syncRequestedAt:
      type: datetime
      writer: owner
      displayName: Sync requested
      description: stamp this to ask for a sync now, whatever the cadence
        says
    # The owner's SECOND hand on a sync (the trait's other `writer: owner`
    # property): stop them. The dispatcher settles a paused record's
    # deliveries as skips, and the scheduled path passes over a paused
    # account in `_due` — so neither the console's Sync-now button nor the
    # hourly tick, which is ALSO this bundle's drain continuation, can drive
    # it while this is true. An operator naming the account explicitly
    # (`args.account`) still runs: a pause is the owner's cadence
    # instruction, not a lock.
    syncPaused:
      type: bool
      writer: owner
      displayName: Paused
      description: "while true, the dispatcher skips this account's deliveries
        and the scheduled walk passes over it"
    # ---- what the KEY turned out to be (connector-written) ------------------
    # References, not copies: the workspace and the viewer are both mirrored
    # rows, and their names and ids are theirs (§1).
    organization:
      type: reference
      kind: providers.substrate.reamde.dev/linear/organization
      writer: connector
      displayName: Workspace
      description: >-
        the workspace this key belongs to, from the `organization` query.
        The row lands in the same drain, so no mustExist
    user:
      type: reference
      kind: providers.substrate.reamde.dev/linear/user
      writer: connector
      displayName: You
      description: >-
        the Linear member this key authenticates as, from the `viewer` query
        — who "me" is, and what every owner-relative question filters on
    # ---- the sync's own bookkeeping (writer: connector) ---------------------
    syncRequestedAck:
      type: datetime
      writer: connector
      displayName: Sync request acknowledged
      description: the `syncRequestedAt` the last sync acted on — equal means
        the request is spent
    syncCursors:
      type: datetime
      keyed: true
      keyPattern: camel
      writer: connector
      displayName: Sync cursors
      description: >-
        the per-stage incremental floor, keyed by stage (issues, projects,
        cycles, …) — one stage stopping never advances another's tail
    syncPending:
      type: json
      writer: connector
      displayName: Pending walk
      # The unfinished WALK, durable across runs. A drain is bounded (512
      # invocations, two minutes) and a paged checkpoint dies with it, so a
      # walk that lives only in the cursor is a walk redone from scratch every
      # round: 13,000 issues at 25 a page is 520 pages and does not fit. What
      # is parked here is the stage, its GraphQL cursor and its floor, written
      # every few pages, and an account with pending work reports itself DUE
      # whatever its cadence says (provider-practices §4).
      description: the stage, cursor and floor a bounded drain stopped on
        — the walk the next run picks straight back up
    lastSyncedAt:
      type: datetime
      writer: connector
      displayName: Last synced
      description: when the last sync ATTEMPT finished, ok or erroring — the
        cadence anchor, and what drops the on-connect guard
    lastCompletedAt:
      type: datetime
      writer: connector
      displayName: Last completed
      description: >-
        when a walk last ran out of work. Only this says anything finished,
        and only this decides whether the next walk is cold
    retryNotBefore:
      type: datetime
      writer: connector
      displayName: Retry not before
      description: >-
        when Linear's rate limiter said to come back (`Retry-After`, or the
        `X-RateLimit-Requests-Reset` instant). No request is made before it
    syncStatus:
      type: string
      writer: connector
      displayName: Sync status
      description: "the last sync outcome (ok | ok (deferred: <stage> xN)
        | erroring: <reason>) — the LEGACY rollup string, kept beside the
        trait's syncState/syncMessage until the next major"
    # ---- the core `sync` trait (substrate decision 0085) --------------------
    # The twelve properties the trait contracts, each redeclared here with its
    # writer. The OWNER asks for a run (`syncRequestedAt`) and stops them
    # (`syncPaused`), both declared above; the CONNECTOR — this bundle's one
    # sync body through its effects, and the dispatcher around a
    # record-sourced delivery under the body's own actor — writes the other
    # ten. `syncState` is a plain STRING, not a state machine: the substrate
    # and the body both write it and no move between its five words
    # (never | running | ok | erroring | throttled) is illegal, so a machine
    # would only ever refuse a sync.
    syncState:
      type: string
      writer: connector
      displayName: Sync state
      description: "never | running | ok | erroring | throttled — the account-level
        state the Connections page renders as a chip; a walk Linear rate-limited
        is `throttled`, not `erroring`"
    syncMessage:
      type: string
      writer: connector
      displayName: Sync message
      description: "the one human line the last run left — the same sentence
        `syncStatus` carries, without its legacy `erroring:` prefix"
    lastSyncStartedAt:
      type: datetime
      writer: connector
      displayName: Last sync started
      description: when the last run began — stamped by the dispatcher around
        a record-sourced delivery, and by the body itself on the schedule
        path
    lastSyncDurationMs:
      type: int
      writer: connector
      displayName: Last sync duration (ms)
      description: how long the last run took, from the same two hands as
        lastSyncStartedAt
    syncProgress:
      type: json
      writer: connector
      displayName: Sync progress
      # `{phase, done, total, pending}` over the STAGE WALK, which is what a
      # bounded drain here actually makes progress through: `phase` is the
      # stage being walked, `done`/`total` are stages finished out of the
      # account's enabled ones, and `pending` is 1 while a walk is parked in
      # `syncPending` and 0 when one ran out of work. Written at every park,
      # so a console watching a cold 13,000-issue walk sees the phase move
      # instead of a frozen spinner.
      description: "{phase, done, total, pending} — which stage this walk
        is on, how many of the account's stages are finished, and whether
        a walk is still parked"
    syncError:
      type: string
      writer: connector
      displayName: Sync error
      description: the LAST error text, from the body or a parked delivery;
        it is not cleared by a later good run — syncErrorAt says when
    syncErrorAt:
      type: datetime
      writer: connector
      displayName: Sync error at
      description: when syncError was written
    syncStreams:
      type: json
      writer: connector
      displayName: Sync streams
      # Declared because the trait contracts it and a reader must find the
      # key; written by NOBODY here. This bundle has one function and one
      # walk, so the account-level state IS the stream's and 0085 says a
      # single-function provider answers a request with `syncRequestedAck`
      # alone. The stage walk is reported in `syncProgress`, which is where
      # it belongs: the stages are phases of ONE stream, not streams.
      description: "stream → {state, message, lastAt, pending, requestedAck};
        empty here — Linear is one stream, so the account-level properties
        are it"
---
# ---- mirror: the workspace ---------------------------------------------------
# One row, from the `organization` root query. Every team and every user
# points here. NOT a hub kind in the guide's sense (§3): Linear names this
# resource itself and serves it from its own query.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/linear/organization
data:
  authority: providers.substrate.reamde.dev
  package: linear
  description: >-
    Your Linear workspace. One Linear workspace, from the `organization` query
    (schema introspected 2026-09-16); `at` is `createdAt`. Omitted as classes:
    GraphQL's envelope (`data`, `errors`, `pageInfo`) and its hypermedia,
    the `*Connection` sub-queries. Every payload is authoritative: a selected
    field returned null is a clear.
  purpose: supporting
  names:
    singular: organization
  traits:
    - substrate.reamde.dev/core/temporal(point)
  displayTemplate: "{name}"
  properties:
    # ---- identity ----------------------------------------------------
    account:
      type: reference
      kind: providers.substrate.reamde.dev/linear/account
      required: true
      onDelete: cascade
      displayName: Account
      description: the Linear account this row was synced through
    organizationId:
      type: string
      displayName: Organization ID
      description: Linear's `id` — the organization's UUID, and the id every
        row derives from
    # ---- the object's own fields, in the schema's order ---------------
    name:
      type: string
      displayName: Name
      description: The workspace's name.
    urlKey:
      type: string
      displayName: URL Key
      description: The workspace's unique URL key, used in URLs to identify
        the workspace.
    logoUrl:
      type: url
      displayName: Logo URL
      description: The URL of the workspace's logo image. Null if no logo
        has been uploaded.
    periodUploadVolume:
      type: float
      displayName: Period Upload Volume
      description: Rolling 30-day total file upload volume for the workspace,
        measured in megabytes. Used for enforcing upload quotas.
    gitBranchFormat:
      type: string
      displayName: Git Branch Format
      description: The template format for Git branch names created from issues.
        Supports template variables like {issueIdentifier} and {issueTitle}.
        If null, the default formatting will be used.
    gitLinkbackMessagesEnabled:
      type: bool
      displayName: Git Linkback Messages Enabled
      description: Whether the Git integration linkback messages should be
        posted as comments on pull requests in private repositories.
    gitPublicLinkbackMessagesEnabled:
      type: bool
      displayName: Git Public Linkback Messages Enabled
      description: Whether the Git integration linkback messages should be
        posted as comments on pull requests in public repositories.
    gitLinkbackDescriptionsEnabled:
      type: bool
      displayName: Git Linkback Descriptions Enabled
      description: Whether issue descriptions should be included in the Git
        integration linkback messages posted to pull requests.
    roadmapEnabled:
      type: bool
      displayName: Roadmap Enabled
      description: Whether the roadmap feature is enabled for the workspace.
    projectUpdateReminderFrequencyInWeeks:
      type: float
      displayName: Project Update Reminder Frequency In Weeks
      description: The frequency in weeks at which to prompt for project updates.
        When null, project update reminders are disabled. Valid values range
        from 0 to 8.
    projectUpdateRemindersDay:
      type: enum
      displayName: Project Update Reminders Day
      description: The day of the week on which project update reminders are
        sent.
      values:
        - value: "sunday"
          label: "Sunday"
        - value: "monday"
          label: "Monday"
        - value: "tuesday"
          label: "Tuesday"
        - value: "wednesday"
          label: "Wednesday"
        - value: "thursday"
          label: "Thursday"
        - value: "friday"
          label: "Friday"
        - value: "saturday"
          label: "Saturday"
    projectUpdateRemindersHour:
      type: float
      displayName: Project Update Reminders Hour
      description: The hour of the day (0-23) at which project update reminders
        are sent.
    initiativeUpdateReminderFrequencyInWeeks:
      type: float
      displayName: Initiative Update Reminder Frequency In Weeks
      description: The frequency in weeks at which to prompt for initiative
        updates. When null, initiative update reminders are disabled. Valid
        values range from 0 to 8.
    initiativeUpdateRemindersDay:
      type: enum
      displayName: Initiative Update Reminders Day
      description: The day of the week on which initiative update reminders
        are sent.
      values:
        - value: "sunday"
          label: "Sunday"
        - value: "monday"
          label: "Monday"
        - value: "tuesday"
          label: "Tuesday"
        - value: "wednesday"
          label: "Wednesday"
        - value: "thursday"
          label: "Thursday"
        - value: "friday"
          label: "Friday"
        - value: "saturday"
          label: "Saturday"
    initiativeUpdateRemindersHour:
      type: float
      displayName: Initiative Update Reminders Hour
      description: The hour of the day (0-23) at which initiative update reminders
        are sent.
    fiscalYearStartMonth:
      type: int
      displayName: Fiscal Year Start Month
      description: The zero-indexed month at which the fiscal year starts
        (0 = January, 11 = December). Defaults to 0 (January).
    workingDays:
      type: float
      repeated: true
      displayName: Working Days
      description: "[Internal] The list of working days. Sunday is 0, Monday
        is 1, etc."
    defaultHomeView:
      type: string
      displayName: Default Home View
      description: The default home view for members of the workspace who
        have not chosen their own default.
    defaultHomeViewTargetId:
      type: string
