    agentAutomationEnabled:
      type: bool
      displayName: Agent Automation Enabled
      description: "[INTERNAL] Whether the workspace has enabled agent automation."
    generatedUpdatesEnabled:
      type: bool
      displayName: Generated Updates Enabled
      description: "[INTERNAL] Whether the workspace has enabled generated
        updates."
    aiTelemetryEnabled:
      type: bool
      displayName: AI Telemetry Enabled
      description: "[INTERNAL] Whether the workspace has opted in to AI telemetry."
    aiThreadSummariesEnabled:
      type: bool
      displayName: AI Thread Summaries Enabled
