    # ------------------------------------------------------------- the plumbing


    def _now():
        return _dt.datetime.now(_dt.timezone.utc).strftime("%Y-%m-%dT%H:%M:%S.%fZ")


    def _parse(ts):
        try:
            return _dt.datetime.fromisoformat(str(ts).replace("Z", "+00:00"))
        except (TypeError, ValueError):
            return None


    def _minus_overlap(ts):
        t = _parse(ts)
        if t is None:
            return ""
        return (t - _dt.timedelta(seconds=OVERLAP_SECONDS)).strftime(
            "%Y-%m-%dT%H:%M:%SZ")


    def _wants(acct):
        props = acct.get("properties") or {}
        return any(props.get(t) for t in TOGGLES)


    def _held(props):
        """Linear told us when to come back; until then, nothing runs.

        Enforced on EVERY entry path — the cadence sweep, a record trigger, an
        explicit `args.account`, a forced run — because a rate limit is the
        server's instruction and not a scheduling preference (provider-practices
        §5).
        """
        retry = _parse(props.get("retryNotBefore"))
        return bool(retry and retry > _dt.datetime.now(_dt.timezone.utc))


    def _due(props):
        """Is this account due? An account with a PARKED WALK always is.

        provider-practices §4: a bounded drain leaves its queue behind, and the
        ordinary tick has to be its continuation or a cold walk never finishes.
        """
        if _held(props):
            return False
        # The owner's pause holds the SCHEDULE path (substrate decision 0085) —
        # and here the schedule is also the drain's continuation, so a pause
        # freezes an unfinished cold walk where it stands rather than abandoning
        # it: `syncPending` survives untouched and the walk resumes on resume.
        # The dispatcher settles a paused record's own deliveries as skips before
        # this body runs, and an operator naming the account explicitly
        # (`args.account`) still gets a run, because a pause is a cadence
        # instruction and not a lock.
        if props.get("syncPaused"):
            return False
        if props.get("syncPending"):
            return True
        freq = (props.get("syncFrequency") or "hourly").lower()
        if freq == "off":
            return False
        last = _parse(props.get("lastSyncedAt"))
        if last is None:
            return True
        hours = 1 if freq == "hourly" else 24
        return _dt.datetime.now(_dt.timezone.utc) - last >= _dt.timedelta(hours=hours)


    def _stages(props):
        """The account's enabled stages, in walk order, PINNED into the cursor at
        queue-head so a toggle flipped mid-drain cannot crash the walk."""
        return [s for s in STAGES
                if not STAGE_TOGGLE[s] or props.get(STAGE_TOGGLE[s])]


    def _fresh(queue, sched=False):
        # `sched` and `startedAt` ride the cursor because a bounded drain resumes
        # through `host.page.resume()` with no envelope: only the FIRST
        # invocation can tell a schedule fire from a record-sourced delivery, and
        # the duration the trait reports is measured from that first one.
        return {"queue": queue, "stages": [], "stage": "viewer", "after": "",
                "page": 1, "runStart": "", "floors": {}, "cursors": {},
                "notes": [], "ack": "", "saved": "", "viewer": "",
                "sched": bool(sched), "startedAt": _now()}


    def _pinned(base):
        """The origin pin: the key may travel to api.linear.app over https, or to
        loopback (the test seam / the mock server), and nowhere else.

        The engine's `network` capability is declared-but-unenforced, so this
        refusal is the defence until host-side egress enforcement exists.
        """
        try:
            from urllib.parse import urlsplit
            u = urlsplit(base)
        except ValueError:
            return False
        host = (u.hostname or "").lower()
        if host in LOOPBACK_HOSTS:
            return True
        return u.scheme == "https" and host == API_HOST and u.port in (None, 443)


    class _RateLimited(Exception):
        """Linear asked us to stop. Carries the instant it said to come back."""

        def __init__(self, retry_at, message):
            super().__init__(message)
            self.retry_at = retry_at


    def _retry_at(resp):
        """When Linear says to try again: `Retry-After` (seconds), or the
        `X-RateLimit-Requests-Reset` / `X-RateLimit-Complexity-Reset` epoch
        milliseconds its rate-limit headers carry."""
        after = (resp.headers.get("Retry-After") or "").strip()
        if after.isdigit():
            secs = min(max(int(after), 1), MAX_RETRY_AFTER)
            return (_dt.datetime.now(_dt.timezone.utc)
                    + _dt.timedelta(seconds=secs)).strftime("%Y-%m-%dT%H:%M:%SZ")
        for h in ("X-RateLimit-Requests-Reset", "X-RateLimit-Complexity-Reset"):
            reset = (resp.headers.get(h) or "").strip()
            if reset.isdigit():
                when = _dt.datetime.fromtimestamp(int(reset) / 1000.0,
                                                  _dt.timezone.utc)
                cap = _dt.datetime.now(_dt.timezone.utc) + _dt.timedelta(
                    seconds=MAX_RETRY_AFTER)
                return min(when, cap).strftime("%Y-%m-%dT%H:%M:%SZ")
        return (_dt.datetime.now(_dt.timezone.utc)
                + _dt.timedelta(seconds=DEFAULT_RETRY_AFTER)).strftime(
                    "%Y-%m-%dT%H:%M:%SZ")


    def _is_rate_limited(errors):
        """Linear's rate limit, in every shape it arrives in: EVERY entry of the
        errors array is read, because the limit is not always the first."""
        for e in errors or []:
            ext = (e or {}).get("extensions") or {}
            if str(ext.get("code") or "").upper() == "RATELIMITED":
                return True
            if str(ext.get("type") or "").lower() == "ratelimited":
                return True
            if "rate limit" in str((e or {}).get("message") or "").lower():
                return True
        return False


    def _post(key, api, query, op):
        """One GraphQL POST. The body carries `operationName` because that is what
        the mock server records under, and what Linear needs to pick the operation
        out of a document whose only operation is named."""
        if not _pinned(api):
            raise RuntimeError(
                "linear: apiBase %r is not a pinned origin (https on %s, or "
                "loopback); refusing to send the API key" % (api, API_HOST))
        payload = {"query": query, "operationName": op, "variables": {}}
        resp = requests.post(api + GRAPHQL_PATH, json=payload, headers={
            "Authorization": key,
            "Content-Type": "application/json",
        }, timeout=HTTP_TIMEOUT, allow_redirects=False)
        if resp.status_code in (301, 302, 303, 307, 308):
            # A redirect would carry the key to wherever the Location says; the
            # pin is on the request, so the only safe answer is to refuse.
            raise RuntimeError("linear: %s redirected (%s) — refusing to follow"
                               % (op, resp.headers.get("Location") or "?"))
        if resp.status_code == 429:
            raise _RateLimited(_retry_at(resp), "rate limited on " + op)
        if resp.status_code >= 400:
            # LINEAR DOCUMENTS ITS RATE LIMIT AS A GRAPHQL ERROR INSIDE AN HTTP
            # 400, not only as a 429, so the errors array is read BEFORE the
            # status is classified — a rate limit is work to resume, and treating
            # it as a generic failure throws the retry instant away.
            body = ""
            try:
                errors = resp.json().get("errors") or []
            except ValueError:
                errors = []
            if _is_rate_limited(errors):
                raise _RateLimited(_retry_at(resp), "rate limited on " + op)
            body = json.dumps(errors)[:200] if errors else resp.text[:200]
            raise RuntimeError("linear: %s returned HTTP %d %s"
                               % (op, resp.status_code, body))
        doc = resp.json()
        if doc.get("errors"):
            # A GraphQL error can also carry HTTP 200.
            if _is_rate_limited(doc["errors"]):
                raise _RateLimited(_retry_at(resp), "rate limited on " + op)
            raise RuntimeError("linear: %s: %s"
                               % (op, json.dumps(doc["errors"])[:REASON_MAX]))
        return doc.get("data") or {}


    def _err_msg(e):
        if isinstance(e, _RateLimited):
            return "rate limited; retry after %s" % (e.retry_at or "the window resets")
        return (str(e) or type(e).__name__)[:REASON_MAX]


    class _Budget:
        """The invocation's WALL-CLOCK budget, not its request count.

        The function's deadline is PT60S and one GraphQL page can take seconds, so
        a stage checks the budget between pages and checkpoints early rather than
        being killed mid-page and replaying the same work forever.
        """

        def __init__(self):
            self.start = _dt.datetime.now(_dt.timezone.utc)
            self.pages = 0

        def spent(self):
            # The RESERVE is the point: a request started at 34 seconds can spend
            # the whole 30-second HTTP timeout and blow the function's PT60S
            # before anything is checkpointed, so a round stops while there is
            # still a request's worth of time left.
            elapsed = (_dt.datetime.now(_dt.timezone.utc) - self.start).total_seconds()
            return (elapsed + HTTP_TIMEOUT >= DRAIN_SECONDS
                    or self.pages >= PAGES_PER_RUN)


    # ----------------------------------------------------------------- the ids
    # EVERY key is Linear's own UUID, which is what Linear itself joins on. No row
    # is ever keyed on a name, a `key` or an `identifier`: a team key changes, an
    # issue's identifier moves with it when the issue moves team, and Linear keeps
    # the old ones in `previousIdentifiers` precisely because they are not the
    # identity (`docs/kind-design.md` §3).


    def _rid(host, aid, kind, uuid):
        if not uuid:
            return None
        return host.ids.external("linear", aid, kind + "/" + str(uuid))


    def _enum_of(table):
        """A label the table does not hold leaves the property ABSENT.

        One new enum value must not cost an account its whole run: the loader
        refuses a value the declaration does not carry, which would roll back the
        page. A value Linear adds is a widening, and a package bump (§2).
        """
        def cast(value):
            if value is None:
                return None
            return table.get(str(value))
        return cast


    def _take(props, payload, api_key, name, cast=None, strict=False):
        """One field, with the guide's presence rule.

        A key the payload does not carry is ABSENT — which for GraphQL means a
        field this bundle did not select. A key it carries as `null` is None,
        which the PATCH writes as a delete. AN EMPTY STRING IS A VALUE where the
        API means one: Linear sends `""` for an empty project description and an
        empty branch name, and deleting those would lose a fact the API stated.

        IT IS NEVER A VALUE ON A REFINED TYPE. `""` is not a legal `url`, `email`,
        `datetime`, `date`, `timezone` or enum, so on those properties an empty
        string is a CLEAR (§1's write contract) — and writing one through would
        have the loader refuse the whole page.
        """
        if not isinstance(payload, dict) or api_key not in payload:
            return
        value = payload.get(api_key)
        if value is None or (strict and value == ""):
            props[name] = None
            return
        if cast is None:
            props[name] = value
            return
        out = cast(value)
        if out is None:
            return
        props[name] = out


    def _mint(props):
        return {k: v for k, v in props.items() if v is not None}


    def _node_id(v):
        """The UUID behind a relation, however Linear spelled it: an embedded
        object (`team { id }`) or a bare id scalar (`autoCloseStateId`)."""
        if isinstance(v, dict):
            return v.get("id")
        return v if isinstance(v, str) and v else None


    def _row_props(host, aid, kind, node, notes=None):
        """One row's whole property map, from one GraphQL node.

        The tables are GENERATED from Linear's own introspection beside the
        declarations they fill, so a field cannot be declared and silently never
        written, nor written into a property no kind declares.
        """
        props = {"account": aid}
        strict = STRICT.get(kind, ())
        for api, name, enum in SCALARS[kind]:
            if enum == "@id":
                # A relation whose target this bundle does not mirror: Linear
                # hands over the OBJECT, the property is the target's ID (§2's
                # scope boundary), and writing the node itself is what the first
                # e2e refused — `props.lastUpdateId: expected a string`.
                _take(props, node, api, name, _node_id, strict=True)
            else:
                _take(props, node, api, name,
                      _enum_of(ENUM_TABLES[enum]) if enum else None,
                      strict=bool(enum) or name in strict)
        for api, name, target, repeated in REFS[kind]:
            if api not in node:
                continue
            value = node.get(api)
            if value is None:
                props[name] = None
            elif repeated:
                # An explicit EMPTY is a clear (§1): Linear answering `[]` means
                # the relation is gone, and storing an empty list instead of
                # deleting the property leaves "no labels" and "labels I never
                # asked about" indistinguishable.
                props[name] = [r for r in
                               (_rid(host, aid, target, _node_id(v))
                                for v in (value or [])) if r] or None
            else:
                props[name] = _rid(host, aid, target, _node_id(value))
        for api, name, target in CONNS.get(kind, []):
            value = node.get(api)
            if not isinstance(value, dict):
                continue
            if ((value.get("pageInfo") or {}).get("hasNextPage")):
                # SHORT IS A LIE. The property is left alone and the run says so.
                if notes is not None:
                    _note(notes, "%s.%s past %d" % (kind, api, NESTED_PAGE_SIZE))
                continue
            props[name] = [r for r in (_rid(host, aid, target, _node_id(v))
                                       for v in (value.get("nodes") or [])) if r] or None
        for api, name, objtype, repeated in OBJECTS.get(kind, []):
            if api not in node:
                continue
            value = node.get(api)
            if value is None:
                props[name] = None
            elif repeated:
                props[name] = [_object(host, aid, objtype, v) for v in (value or [])]
            else:
                props[name] = _object(host, aid, objtype, value)
        return props


    def _object(host, aid, objtype, value):
        """An inline object, written WHOLE — a patch replaces an object entire, so
        a half-filled one would delete the fields it left out (§1)."""
        out = {}
        if not isinstance(value, dict):
            return out
        for name, shape, arg, repeated in OBJECT_FIELDS[objtype]:
            if name not in value:
                continue
            v = value.get(name)
            if v is None:
                continue
            if shape == "ref":
                out[name] = ([r for r in (_rid(host, aid, arg, _node_id(x))
                                          for x in (v or [])) if r] if repeated
                             else _rid(host, aid, arg, _node_id(v)))
            elif shape == "enum":
                table = ENUM_TABLES[arg]
                out[name] = ([table[x] for x in (v or []) if x in table] if repeated
                             else table.get(str(v)))
                if out[name] is None:
                    out.pop(name)
            else:
                out[name] = v
        return out


    def _note(notes, what):
        if what not in notes and len(notes) < NOTE_MAX:
            notes.append(what)


    class _Sink:
        """Stages the rows one page produces, COALESCED within the page.

        Every row is minted then patched: `put(if_absent=True)` with the payload's
        non-null half, then `patch` with the whole of it. The put is a no-op on a
        row that exists, so a thin observation can never clobber a fuller one; the
        patch carries the nulls, which is what makes a cleared field clear.
        """

        def __init__(self, host, aid, notes):
            self.host = host
            self.aid = aid
            self.notes = notes
            self.seen = {}

        def write(self, kind, node, rid=None):
            uuid = _node_id(node)
            if not uuid:
                return None
            rid = rid or _rid(self.host, self.aid, kind, uuid)
            props = _row_props(self.host, self.aid, kind, node, self.notes)
            known = self.seen.get(rid)
            if known is None:
                self.seen[rid] = dict(props)
                self.host.effects.put(KIND_TYPE[kind], rid,
                                      properties=_mint(props), if_absent=True)
                self.host.effects.patch(KIND_TYPE[kind], rid, properties=props)
                return rid
            delta = {k: v for k, v in props.items()
                     if k not in known or known[k] != v}
            delta.pop("account", None)
            if delta:
                known.update(props)
                self.host.effects.patch(KIND_TYPE[kind], rid, properties=delta)
            return rid


    # -------------------------------------------------------------- the stages


    def _ingest(sink, stage, nodes):
        """Mirror one page. Returns the newest `updatedAt` the page carried."""
        kind = STAGE_KIND[stage]
        newest = ""
        for node in nodes or []:
            sink.write(kind, node)
            # The rows a node carries WHOLE rather than by id: an issue's comments
            # and reactions, a comment's reactions, the workspace's project
            # statuses. Each is its own kind (§3) and is written from the payload
            # that embedded it — never inlined onto the row that named it.
            if kind == "organization":
                for st in node.get("projectStatuses") or []:
                    sink.write("projectstatus", st)
            if kind == "issue":
                for r in node.get("reactions") or []:
                    sink.write("reaction", r)
                comments = (node.get("comments") or {})
                if (comments.get("pageInfo") or {}).get("hasNextPage"):
                    _note(sink.notes, "issue.comments past %d" % NESTED_PAGE_SIZE)
                for c in comments.get("nodes") or []:
                    sink.write("comment", c)
                    for r in c.get("reactions") or []:
                        sink.write("reaction", r)
            updated = node.get("updatedAt") or ""
            if updated > newest:
                newest = updated
        return newest


    def _connection_args(stage, cur, first):
        args = ["first: %d" % first]
        if stage in ("users",):
            # A member who left is still the author of everything they wrote, and
            # `assignee` still points at them; a walk that skipped them would
            # leave every one of those references dangling.
            args.append("includeDisabled: true")
        if stage in ("teams", "users", "workflowstates", "labels", "projects",
                     "cycles", "issues"):
            args.append("includeArchived: true")
        if stage in INCREMENTAL:
            floor = (cur.get("floors") or {}).get(stage) or ""
            args.append("orderBy: updatedAt")
            if floor:
                # The floor is inlined as a JSON string literal — our own
                # timestamp, so there is no injection surface, and no GraphQL
                # variable type to keep in step with Linear's comparator input
                # across schema revisions.
                args.append("filter: {updatedAt: {gte: %s}}" % json.dumps(floor))
        after = cur.get("after") or ""
        if after:
            args.append("after: %s" % json.dumps(after))
        return ", ".join(args)


    def _query_for(stage, cur, op):
        first = ISSUE_PAGE_SIZE if stage == "issues" else PAGE_SIZE
        return QUERIES[stage] % {"op": op, "conn": _connection_args(stage, cur, first),
                                 "nested": NESTED_PAGE_SIZE}


    def _more(host, cur, **overrides):
        nxt = dict(cur)
        nxt.update(overrides)
        return {"more": host.page.more(nxt)}


    def _status(cur, parked):
        notes = []
        if parked:
            # `deferred: <stage> x1` is the grammar the runner's continuation
            # reads (tools/e2e.py, `_DEFERRED_RE`), and the stage NAMES what is
            # left rather than reporting a bare "pending".
            notes.append("deferred: %s x1" % parked)
        if cur.get("notes"):
            notes.append("short: " + ", ".join(cur["notes"][:4]))
        return ("ok" if not notes else "ok (" + "; ".join(notes) + ")")[:REASON_MAX]


    def _progress(cur, parked, phase=None, held=False):
        """`{phase, done, total, pending}` over the STAGE WALK.

        `held` is the error path's hand: a failing run leaves `syncPending`
        alone on purpose (the page it died on is where the next one resumes),
        so where it names no `parked` stage of its own the account may still be
        carrying a walk, and `pending` has to say so rather than report the
        zero this cursor happens to hold. GitHub's injected 401 is what taught
        this: a run that dies before it loads the backlog reports a backlog
        that drained, which is the opposite of what happened.

        The stages are phases of ONE stream, not streams, so they are reported
        here and not in the trait's `syncStreams`: `phase` is the stage being
        walked, `done`/`total` count the account's own enabled stages, and
        `pending` is 1 while a walk is parked in `syncPending` and 0 once one ran
        out of work. That is a bar a console can draw for a cold walk that takes
        twenty ticks, which a bare "syncing…" is not.
        """
        stages = list(cur.get("stages") or [])
        stage = phase if phase is not None else (cur.get("stage") or "")
        if parked:
            done = stages.index(parked) if parked in stages else 0
            stage = parked
        elif stage in stages:
            done = stages.index(stage)
        else:
            done = len(stages)
        return {"phase": stage or "idle", "done": done, "total": len(stages),
                "pending": 1 if (parked or held) else 0}


    def _elapsed_ms(started, now):
        a, b = _parse(started), _parse(now)
        if a is None or b is None:
            return None
        ms = int((b - a).total_seconds() * 1000)
        return ms if ms >= 0 else None


    def _trait(cur, state, message, now, parked="", error=None, phase=None,
               held=False):
        """The core `sync` trait's hands (substrate decision 0085), written beside
        the legacy `syncStatus` / `lastSyncedAt` strings on every path.

        Linear is ONE stream, so there is no `syncStreams` map to raise a state
        over: the account-level `syncState` and `syncMessage` ARE the stream's,
        and `syncRequestedAck` — already echoed by `_stamp` — is the whole answer
        to a request, which is what 0085 prescribes for a single-function
        provider. `lastSyncStartedAt` / `lastSyncDurationMs` are written only on
        the SCHEDULE path: a record-sourced delivery is stamped by the dispatcher
        around the body, and two hands writing the same pair would fight.
        """
        out = {"syncState": state, "syncMessage": message[:REASON_MAX],
               "syncProgress": _progress(cur, parked, phase, held)}
        if error is not None:
            out["syncError"] = message[:REASON_MAX]
            out["syncErrorAt"] = now
        if cur.get("sched") and cur.get("startedAt"):
            out["lastSyncStartedAt"] = cur["startedAt"]
            ms = _elapsed_ms(cur["startedAt"], now)
            if ms is not None:
                out["lastSyncDurationMs"] = ms
        return out


    def _park(host, acct, aid, cur, stage):
        """Checkpoint the unfinished walk ON THE ACCOUNT, every few pages.

        This is the difference between a bounded drain that makes progress and one
        that does not: the engine drops a paged checkpoint when it stops the
        drain, so the walk has to be somewhere the next run can read it.
        """
        parked = _parked(cur, stage)
        if parked == cur.get("saved"):
            return
        cur["saved"] = parked
        # `lastSyncedAt` rides along: the engine can kill a drain between two
        # pages, and an attempt with no stamp leaves the on-connect guard open
        # and the runner waiting for a stamp that will never come.
        now = _now()
        status = _status(cur, stage)
        patch = {"syncPending": parked, "syncStatus": status, "lastSyncedAt": now}
        # The trait moves with it. `running` is the honest state at a park — the
        # walk is not finished, the next tick is its continuation — and
        # `syncProgress` names the stage it stopped on, so a console watching a
        # cold walk sees the phase advance instead of a frozen spinner.
        patch.update(_trait(cur, "running", status, now, parked=stage))
        host.effects.patch(acct.get("kind") or ACCOUNT_TYPE, aid,
                           properties=patch)


    def _parked(cur, stage):
        """What a bounded drain leaves behind: the stage, its page NUMBER, its
        GraphQL cursor and the floor it was walking.

        The page number matters as much as the cursor: every request names its
        operation `<Stage>Page<N>` and that name IS the recording's name, so a
        walk that resumed at "page 1, cursor from page 4" would ask the mock for
        page 1 and replay the walk forever.
        """
        return {"stage": stage, "page": int(cur.get("page") or 1),
                "after": cur.get("after") or "",
                "floors": cur.get("floors") or {},
                "runStart": cur.get("runStart") or ""}


    def _stamp(host, acct, aid, cur, error=None, parked=""):
        """The connector stamp. EVERY path writes syncStatus, and lastSyncedAt
        marks the ATTEMPT finished either way: it anchors the cadence AND drops
        the on-connect trigger's guard, so an erroring stamp can never re-fire the
        first backfill in a loop. `lastCompletedAt` moves only when a walk ran out
        of work (provider-practices §4)."""
        now = _now()
        patch = {"lastSyncedAt": now}
        if error is not None:
            patch["syncStatus"] = ("erroring: " + error)[:REASON_MAX]
            # A rate limit is WORK TO RESUME, not a fault: 0085 spells it
            # `throttled` and the Connections page renders it as a wait rather
            # than a break. `_err_msg` has already turned a 429 — or the
            # RATELIMITED extension Linear sometimes serves with HTTP 400 — into
            # "rate limited; retry after <instant>", and `retryNotBefore` holds
            # every entry path until then.
            state = "throttled" if error.startswith("rate limited") else "erroring"
            patch.update(_trait(cur, state, error, now, parked=parked,
                                error=error,
                                held=bool((acct.get("properties") or {})
                                          .get("syncPending"))))
            # THE PARKED WALK SURVIVES A FAILURE. A run that dies on page 30 of
            # the issues walk knows exactly where it was, and dropping that on the
            # floor makes the next run re-walk from page one — which is the same
            # work, the same failure and no progress. Only a walk that FINISHED
            # clears it.
            if parked:
                patch["syncPending"] = _parked(cur, parked)
        else:
            status = _status(cur, parked)
            patch["syncStatus"] = status
            if parked:
                patch["syncPending"] = _parked(cur, parked)
            else:
                patch["syncPending"] = None
                patch["lastCompletedAt"] = now
                cursors = dict(cur.get("cursors") or {})
                if cursors:
                    patch["syncCursors"] = cursors
            # The trait's message is the SAME sentence, without the legacy
            # prefix grammar; the state is plain `ok` even with a parked walk,
            # and `syncProgress.pending` is what says there is more to do.
            patch.update(_trait(cur, "ok", status, now, parked=parked,
                                phase=None if parked else "idle"))
        if cur.get("ack"):
            # The request generation this run acted on, echoed back on EVERY path
            # including the erroring one: an unacknowledged request would re-fire
            # the trigger against the same failure forever.
            patch["syncRequestedAck"] = cur["ack"]
        host.effects.patch(acct.get("kind") or ACCOUNT_TYPE, aid, properties=patch)


    def _backfill_floor(props, run_start):
        depth = props.get("backfillDepth") or "last30d"
        if depth == "all":
            return ""
        if depth == "none":
            # "Don't backfill" is FROM CONNECT TIME, FORWARD-ONLY: the first run's
            # floor is its own start, and the stamp persists it even when the
            # window comes back empty, so the account ratchets forward instead of
            # recomputing since=now on every run.
            return run_start
        days = BACKFILL_DAYS.get(depth, 30)
        return (_dt.datetime.now(_dt.timezone.utc)
                - _dt.timedelta(days=days)).strftime("%Y-%m-%dT%H:%M:%SZ")


    def _stored_cursors(props):
        stored = props.get("syncCursors")
        if not isinstance(stored, dict):
            return {}
        return {k: v for k, v in stored.items() if isinstance(v, str) and v}


    def _sync_account(host, api, key, acct, aid, props, cur, queue):
        budget = _Budget()
        notes = cur.setdefault("notes", [])
        sink = _Sink(host, aid, notes)

        if not cur.get("stages"):
            cur["stages"] = _stages(props)
            cur["runStart"] = _now()
            stored = _stored_cursors(props)
            parked = props.get("syncPending") if isinstance(props.get("syncPending"), dict) else {}
            floors = {}
            for stage in INCREMENTAL:
                floors[stage] = _minus_overlap(stored.get(stage) or "") or \
                    _backfill_floor(props, cur["runStart"])
            if parked.get("stage") in cur["stages"]:
                # A parked walk resumes where it stopped, floor and all: its page
                # cursor is meaningless against any other floor.
                cur["stage"] = parked["stage"]
                cur["after"] = parked.get("after") or ""
                cur["page"] = int(parked.get("page") or 1)
                cur["runStart"] = parked.get("runStart") or cur["runStart"]
                floors.update({k: v for k, v in (parked.get("floors") or {}).items()
                               if isinstance(v, str)})
            else:
                cur["stage"] = cur["stages"][0]
            cur["floors"] = floors
            cur["cursors"] = stored

        order = cur["stages"]
        stage = cur.get("stage") or order[0]

        while True:
            if stage == "viewer":
                data = _post(key, api, VIEWER_QUERY % {"op": "ViewerPage1", "conn": "",
                                                       "nested": NESTED_PAGE_SIZE},
                             "ViewerPage1")
                budget.pages += 1
                me = data.get("viewer") or {}
                uid = sink.write("user", me)
                if uid:
                    host.effects.patch(acct.get("kind") or ACCOUNT_TYPE, aid,
                                       properties={"user": uid})
                    cur["viewer"] = uid
                stage = _next(order, stage)
                if stage is None:
                    break
                cur["stage"], cur["after"] = stage, ""
                continue

            page = int(cur.get("page") or 1)
            op = "%sPage%d" % (stage[:1].upper() + stage[1:], page)
            data = _post(key, api, _query_for(stage, cur, op), op)
            budget.pages += 1

            if stage == "organization":
                org = data.get("organization") or {}
                _ingest(sink, stage, [org] if org else [])
                rid = _rid(host, aid, "organization", _node_id(org))
                if rid:
                    host.effects.patch(acct.get("kind") or ACCOUNT_TYPE, aid,
                                       properties={"organization": rid})
                info = {}
            else:
                conn = data.get(GQL_FIELD[stage]) or {}
                _ingest(sink, stage, conn.get("nodes") or [])
                info = conn.get("pageInfo") or {}

            if info.get("hasNextPage") and info.get("endCursor"):
                cur["after"] = info["endCursor"]
                cur["page"] = page + 1
                if budget.spent():
                    _park(host, acct, aid, cur, stage)
                    return _more(host, cur, stage=stage)
                continue

            # The stage drained. Its watermark is the RUN-START instant, never the
            # local completion clock: an issue updated while the walk was running
            # must not fall behind the floor the next run reads.
            if stage in INCREMENTAL:
                cur.setdefault("cursors", {})[stage] = cur.get("runStart") or _now()
            stage = _next(order, stage)
            cur["after"], cur["page"] = "", 1
            if stage is None:
                break
            cur["stage"] = stage
            if budget.spent():
                _park(host, acct, aid, cur, stage)
                return _more(host, cur, stage=stage)

        _stamp(host, acct, aid, cur, error=None, parked="")
        rest = queue[1:]
        if rest:
            return {"more": host.page.more(_fresh(rest, cur.get("sched")))}
        return {"output": {"account": aid, "pages": budget.pages}}


    def _next(order, stage):
        i = order.index(stage) if stage in order else len(order) - 1
        return order[i + 1] if i + 1 < len(order) else None


    def main(input, host):
        cfg = input.get("config") or {}
        conf = (((cfg.get("inputs") or {}).get("connector") or {}).get("properties")) or {}
        key = (conf.get("apiKey") or "").strip()
        api = (conf.get("apiBase") or DEFAULT_API).strip().rstrip("/")
        accounts = {a.get("id"): a for a in (cfg.get("accounts") or [])}

        if not key:
            host.log("linear: the connector input carries no apiKey (or it did "
                     "not resolve); nothing to sync")
            return {"output": {"skipped": "unconfigured"}}
        if key.startswith(SEALED_PREFIX):
            host.log("linear: apiKey arrived sealed — paste it on the config "
                     "record, not on the account")
            return {"output": {"skipped": "sealed-key"}}
        if not _pinned(api):
            raise RuntimeError(
                "linear: apiBase %r is not a pinned origin (https on %s, or "
                "loopback); refusing to send the API key" % (api, API_HOST))

        args = input.get("args")
        if not isinstance(args, dict):
            args = {}
        cur = host.page.resume() or None
        if cur is None:
            record = (input.get("envelope") or {}).get("record") or {}
            # WHICH HAND STAMPS THE CLOCK. Around a RECORD-sourced delivery the
            # dispatcher writes `lastSyncStartedAt` before the body runs and the
            # duration when it settles (substrate decision 0085); a SCHEDULE fire
            # names no record, so nothing stamps it but this body. `sched` is
            # therefore "no envelope record", decided once and carried on the
            # cursor, because a bounded drain's later invocations resume with no
            # envelope at all and would otherwise all look scheduled.
            sched = not record
            named = args.get("accounts") or (
                [args["account"]] if args.get("account") else [])
            if (record.get("kind") or "") == ACCOUNT_TYPE:
                queue = [record.get("id")]
            elif named:
                queue = [str(a) for a in named]
            elif args.get("force"):
                queue = [aid for aid, a in accounts.items() if _wants(a)]
            else:
                queue = [aid for aid, a in accounts.items()
                         if _wants(a) and _due(a.get("properties") or {})]
            cur = _fresh(queue, sched)

        queue = [q for q in (cur.get("queue") or []) if accounts.get(q)
                 and _wants(accounts[q])]
        if not queue:
            # Say WHY nothing synced: a bare zero cannot tell "no account is due"
            # from "the envelope named an account this config does not carry".
            return {"output": {"synced": 0, "accounts": sorted(accounts),
                               "wanted": sorted(a for a in accounts
                                                if _wants(accounts[a])),
                               "asked": list(cur.get("queue") or [])}}

        aid = queue[0]
        acct = accounts[aid]
        props = acct.get("properties") or {}
        if _held(props) and not cur.get("stages"):
            return {"output": {"account": aid, "skipped": "rate limited until %s"
                               % props.get("retryNotBefore")}}
        cur["queue"] = queue
        if not cur.get("ack") and props.get("syncRequestedAt"):
            cur["ack"] = str(props["syncRequestedAt"])
        try:
            return _sync_account(host, api, key, acct, aid, props, cur, queue)
        except _RateLimited as e:
            host.log("linear: account %s rate limited until %s" % (aid, e.retry_at))
            _stamp(host, acct, aid, cur, error=_err_msg(e),
                   parked=cur.get("stage") or "")
            host.effects.patch(acct.get("kind") or ACCOUNT_TYPE, aid,
                               properties={"retryNotBefore": e.retry_at})
            return {"output": {"account": aid, "retryAfter": e.retry_at}}
        except Exception as e:  # noqa: BLE001 — per-account isolation
            msg = _err_msg(e)
            host.log("linear: account %s failed: %s" % (aid, msg))
            _stamp(host, acct, aid, cur, error=msg, parked=cur.get("stage") or "")
            rest = queue[1:]
            if rest:
                return {"more": host.page.more(_fresh(rest, cur.get("sched")))}
            return {"output": {"account": aid, "error": msg}}
