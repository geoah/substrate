# ---- mirror: one workspace member --------------------------------------------
# From the `users` connection (disabled and archived members included) and
# from the `viewer` query, whose row `account.user` names. Linear's own
# self-fact `isMe` stays: it is the API's, not ours (§1).
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/linear/user
data:
  authority: providers.substrate.reamde.dev
  package: linear
  description: >-
    Someone in your Linear workspace. One Linear workspace member, from the
    `users` connection and the `viewer` query (introspected 2026-09-16); `at`
    is `createdAt`. Omitted as classes: GraphQL's envelope (`data`, `errors`,
    `pageInfo`) and its hypermedia, the `*Connection` sub-queries. Every payload
    is authoritative: a selected field returned null is a clear.
  purpose: supporting
  names:
    singular: user
  traits:
    - substrate.reamde.dev/core/temporal(point)
  displayTemplate: "{name|displayName|email}"
  properties:
    # ---- identity ----------------------------------------------------
    account:
      type: reference
      kind: providers.substrate.reamde.dev/linear/account
      required: true
      onDelete: cascade
      displayName: Account
      description: the Linear account this row was synced through
    userId:
      type: string
      displayName: User ID
      description: Linear's `id` — the user's UUID, and the id every row derives
        from
    # ---- the object's own fields, in the schema's order ---------------
    name:
      type: string
      displayName: Name
      description: The user's full name.
    displayName:
      type: string
      displayName: Display Name
      description: The user's display (nick) name. Must be unique within the
        workspace.
    email:
      type: email
      displayName: Email
      description: The user's email address.
    avatarUrl:
      type: url
      displayName: Avatar URL
      description: An URL to the user's avatar image.
    disableReason:
      type: string
      displayName: Disable Reason
      description: The reason why the user account is disabled. Null if the
        user is active. Possible values include admin suspension, downgrade,
        voluntary departure, or pending invite.
    calendarHash:
      type: string
      displayName: Calendar Hash
      description: "[DEPRECATED] Hash for the user to be used in calendar
        URLs."
    description:
      type: text
      displayName: Description
      description: A short description of the user, such as their title or
        a brief bio.
    jobTitle:
      type: string
      displayName: Job Title
      description: "`title` — the user's job title."
    statusEmoji:
      type: string
      displayName: Status Emoji
      description: The emoji representing the user's current status. Null
        if no status is set.
    statusLabel:
      type: string
      displayName: Status Label
      description: The text label of the user's current status. Null if no
        status is set.
    timezone:
      type: timezone
      displayName: Timezone
      description: The local timezone of the user.
    initials:
      type: string
      displayName: Initials
      description: The initials of the user.
    avatarBackgroundColor:
      type: string
      displayName: Avatar Background Color
      description: The background color of the avatar for users without set
        avatar.
    guest:
      type: bool
      displayName: Guest
      description: Whether the user is a guest in the workspace and limited
        to accessing a subset of teams.
    app:
      type: bool
      displayName: App
      description: Whether the user is an app.
    active:
      type: bool
      displayName: Active
      description: Whether the user account is active or disabled (suspended).
    url:
      type: url
      displayName: URL
      description: User's profile URL.
    createdIssueCount:
      type: int
      displayName: Created Issue Count
      description: Number of issues created.
    canAccessAnyPublicTeam:
      type: bool
      displayName: Can Access Any Public Team
      description: Whether this user can access any public team in the workspace.
        True for non-guest members and app users with public team access.
    isMe:
      type: bool
      displayName: Is Me
      description: Whether the user is the currently authenticated user.
    admin:
      type: bool
      displayName: Admin
      description: Whether the user is a workspace administrator. On Free
        plans, all members are treated as admins.
    owner:
      type: bool
      displayName: Owner
      description: Whether the user is a workspace owner, which is the highest
        permission level.
    isAssignable:
      type: bool
      displayName: Is Assignable
      description: Whether the user can be assigned to issues. Active app
        users require the assignments capability. The Linear agent also requires
        coding sessions to be enabled.
    isMentionable:
      type: bool
      displayName: Is Mentionable
      description: Whether the user can be mentioned. Active app users require
        the mentions capability.
    supportsAgentSessions:
      type: bool
      displayName: Supports Agent Sessions
      description: Whether this agent user supports agent sessions.
    # DECLARED, NOT FETCHED: @deprecated in Linear's schema — selecting it makes every page fail the day it goes
    inviteHash:
      type: secret
      displayName: Invite Hash
      description: "[DEPRECATED] Unique hash for the user to be used in invite
        URLs."
    gitHubUserId:
      type: string
      displayName: Git Hub User ID
      description: The user's GitHub user ID.
    hasGitHubCodeAccess:
      type: bool
      displayName: Has Git Hub Code Access
      description: "[Internal] Whether this user can access GitHub source
        code through Linear. True when the workspace has connected GitHub
        code-access repositories and the user has an active personal GitHub
        code-access"
    # ---- relations ---------------------------------------------------
    organization:
      type: reference
      kind: providers.substrate.reamde.dev/linear/organization
      displayName: Organization
      description: The workspace that the user belongs to.
    # DECLARED, NOT FETCHED: [Internal] an unmirrored IdentityProvider
    identityProviderId:
      type: string
      displayName: IDentity Provider ID
      description: "`identityProvider` — [INTERNAL] Identity provider the
        user is managed by."
    # ---- instants ----------------------------------------------------
    updatedAt:
      type: datetime
      displayName: Updated At
      description: The last time at which the entity was meaningfully updated.
        This is the same as the creation time if the entity hasn't been updated
        after creation.
    archivedAt:
      type: datetime
      displayName: Archived At
      description: The time at which the entity was archived. Null if the
        entity has not been archived.
    statusUntilAt:
      type: datetime
      displayName: Status Until At
      description: The date and time at which the user's current status should
        be automatically cleared. Null if the status has no expiration.
    lastSeen:
      type: datetime
      displayName: Last Seen
      description: The last time the user was seen online. Updated based on
        user activity. Null if the user has never been seen.
---
# ---- mirror: one workflow state ----------------------------------------------
# From the `workflowStates` connection. `type` is a plain `string`: Linear's
# schema types it `String!` and only its PROSE lists the seven words, so an
# enum would refuse the page on the day an eighth appears (§2).
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/linear/workflowstate
data:
  authority: providers.substrate.reamde.dev
  package: linear
  description: >-
    A status a Linear issue can be in, such as Todo or Done. One Linear workflow
    state - an issue status - from `workflowStates` (introspected 2026-09-16);
    `at` is `createdAt`. Omitted as classes: GraphQL's envelope (`data`, `errors`,
    `pageInfo`) and its hypermedia, the `*Connection` sub-queries. Every payload
    is authoritative: a selected field returned null is a clear.
  purpose: supporting
  names:
    singular: workflowstate
  traits:
    - substrate.reamde.dev/core/temporal(point)
  displayTemplate: "{name}"
  properties:
    # ---- identity ----------------------------------------------------
    account:
      type: reference
      kind: providers.substrate.reamde.dev/linear/account
      required: true
      onDelete: cascade
      displayName: Account
      description: the Linear account this row was synced through
    workflowStateId:
      type: string
      displayName: Workflow State ID
      description: Linear's `id` — the workflowstate's UUID, and the id every
        row derives from
    # ---- the object's own fields, in the schema's order ---------------
    name:
      type: string
      displayName: Name
      description: The state's human-readable name (e.g., 'In Progress', 'Done',
        'Backlog').
    color:
      type: string
      displayName: Color
      description: The state's UI color as a HEX string.
    description:
      type: text
      displayName: Description
      description: Description of the state.
    position:
      type: float
      displayName: Position
      description: The position of the state in the team's workflow. States
        are displayed in ascending order of position within their type group.
    type:
      type: enum
      displayName: Type
      description: The type of the state. One of "triage", "backlog", "unstarted",
        "started", "completed", "canceled", "duplicate".
      values:
        - value: "triage"
          label: "triage"
        - value: "backlog"
          label: "backlog"
        - value: "unstarted"
          label: "unstarted"
        - value: "started"
          label: "started"
        - value: "completed"
          label: "completed"
        - value: "canceled"
          label: "canceled"
        - value: "duplicate"
          label: "duplicate"
    # ---- relations ---------------------------------------------------
    team:
      type: reference
      kind: providers.substrate.reamde.dev/linear/team
      displayName: Team
      description: The team that this workflow state belongs to. Each team
        has its own set of workflow states.
    inheritedFrom:
      type: reference
      kind: providers.substrate.reamde.dev/linear/workflowstate
      displayName: Inherited From
      description: The parent team's workflow state that this state was inherited
        from. Null if the state is not inherited from a parent team.
    # ---- instants ----------------------------------------------------
    updatedAt:
      type: datetime
      displayName: Updated At
      description: The last time at which the entity was meaningfully updated.
        This is the same as the creation time if the entity hasn't been updated
        after creation.
    archivedAt:
      type: datetime
      displayName: Archived At
      description: The time at which the entity was archived. Null if the
        entity has not been archived.
---
