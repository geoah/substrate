    hipaaComplianceEnabled:
      type: bool
      displayName: HIPAA Compliance Enabled
      description: Whether HIPAA compliance is enabled for the workspace.
        When enabled, certain data processing features are restricted to meet
        compliance requirements.
    # DECLARED, NOT FETCHED: [ALPHA]
    themeSettings:
      type: json
      displayName: Theme Settings
      description: "[ALPHA] Theme settings for the workspace. json: the schema
