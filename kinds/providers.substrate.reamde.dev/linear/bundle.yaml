# The rows come from `organization.projectStatuses`, which returns them whole.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/linear/projectstatus
data:
  authority: providers.substrate.reamde.dev
  package: linear
  description: >-
    A status a Linear project can be in, such as Planned or Completed. One
    Linear project status, from `organization.projectStatuses` (introspected
    2026-09-16); `at` is `createdAt`. Omitted as classes: GraphQL's envelope
    (`data`, `errors`, `pageInfo`) and its hypermedia, the `*Connection` sub-queries.
    Every payload is authoritative: a selected field returned null is a clear.
  purpose: supporting
  names:
    singular: projectstatus
  traits:
    - substrate.reamde.dev/core/temporal(point)
  displayTemplate: "{name}"
  properties:
    # ---- identity ----------------------------------------------------
    account:
      type: reference
      kind: providers.substrate.reamde.dev/linear/account
      required: true
      onDelete: cascade
      displayName: Account
      description: the Linear account this row was synced through
    projectStatusId:
      type: string
      displayName: Project Status ID
      description: Linear's `id` — the projectstatus's UUID, and the id every
        row derives from
    # ---- the object's own fields, in the schema's order ---------------
    name:
      type: string
      displayName: Name
      description: The name of the status.
    color:
      type: string
      displayName: Color
      description: The color of the status as a HEX string, used for display
        in the UI.
    description:
      type: text
      displayName: Description
      description: Description of the status.
    position:
      type: float
      displayName: Position
      description: The position of the status within its type group in the
        workspace's project flow. Used for ordering statuses of the same type.
    type:
      type: enum
      displayName: Type
      description: The category type of the project status (e.g., backlog,
        planned, started, paused, completed, canceled). Determines the status's
        behavior and position in the project lifecycle.
      values:
        - value: "backlog"
          label: "backlog"
        - value: "planned"
          label: "planned"
        - value: "started"
          label: "started"
        - value: "paused"
          label: "paused"
        - value: "completed"
          label: "completed"
        - value: "canceled"
          label: "canceled"
    indefinite:
      type: bool
      displayName: Indefinite
      description: Whether a project can remain in this status indefinitely.
        When false, projects in this status may trigger reminders or auto-archiving
        after a period of inactivity.
    # ---- relations ---------------------------------------------------
    team:
      type: reference
      kind: providers.substrate.reamde.dev/linear/team
      displayName: Team
      description: "[Internal] The team that the status is scoped to. If null,
        the status is a workspace-level status."
    inheritedFrom:
      type: reference
      kind: providers.substrate.reamde.dev/linear/projectstatus
      displayName: Inherited From
      description: "[Internal] The original workspace or parent-team status
        that this status was inherited from. Null if the status is not inherited."
    # ---- instants ----------------------------------------------------
    updatedAt:
      type: datetime
      displayName: Updated At
      description: The last time at which the entity was meaningfully updated.
        This is the same as the creation time if the entity hasn't been updated
        after creation.
    archivedAt:
      type: datetime
      displayName: Archived At
      description: The time at which the entity was archived. Null if the
        entity has not been archived.
