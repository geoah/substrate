      kind: providers.substrate.reamde.dev/linear/project
      displayName: Project
      description: The project that the issue is associated with. Null if
        the issue is not part of any project.
    projectMilestoneId:
      type: string
      displayName: Project Milestone ID
      description: "`projectMilestone` — the project milestone that the issue
        is associated with. Null if the issue is not assigned to a specific
        milestone within its project."
    lastAppliedTemplateId:
      type: string
      displayName: Last Applied Template ID
      description: "`lastAppliedTemplate` — the last template that was applied
        to this issue."
    recurringIssueTemplateId:
      type: string
      displayName: Recurring Issue Template ID
      description: "`recurringIssueTemplate` — the recurring issue template
        that created this issue."
    creator:
      type: reference
      kind: providers.substrate.reamde.dev/linear/user
      displayName: Creator
      description: The user who created the issue. Null if the creator's account
        has been deleted or if the issue was created by an integration or
        system process.
    externalUserCreatorId:
      type: string
      displayName: External User Creator ID
      description: "`externalUserCreator` — the external user who created
        the issue. Set when the issue was created via an integration (e.g.,
        Slack, Intercom) on behalf of a non-Linear user"
    assignee:
      type: reference
      kind: providers.substrate.reamde.dev/linear/user
      displayName: Assignee
      description: The user to whom the issue is assigned. Null if the issue
        is unassigned.
    delegate:
      type: reference
      kind: providers.substrate.reamde.dev/linear/user
      displayName: Delegate
      description: The agent user that is delegated to work on this issue.
        Set when an AI agent has been assigned to perform work on this issue.
        Null if no agent is working on the issue.
    snoozedBy:
      type: reference
      kind: providers.substrate.reamde.dev/linear/user
      displayName: Snoozed By
      description: The user who snoozed the issue.
    state:
      type: reference
      kind: providers.substrate.reamde.dev/linear/workflowstate
      displayName: State
      description: The workflow state (issue status) that the issue is currently
        in. Workflow states represent the issue's progress through the team's
        workflow, such as Triage, Todo, In Progress, Done, or Canceled.
    sourceComment:
      type: reference
      kind: providers.substrate.reamde.dev/linear/comment
      displayName: Source Comment
      description: The comment that this issue was created from, when an issue
        is created from an existing comment. Null if the issue was not created
        from a comment.
    botActor:
      type: object
      displayName: Bot Actor
      description: The bot that created the issue, if applicable.
      fields:
        id:
          type: string
          description: A unique identifier for the bot actor.
        type:
          type: string
          description: The source type of the bot, identifying the application
            or integration (e.g., 'github', 'slack', 'workflow', 'ai').
        subType:
          type: string
          description: A more specific classification within the bot type,
            providing additional context about the integration or application
            variant.
        name:
          type: string
          description: The display name of the bot.
        userDisplayName:
          type: string
          description: The display name of the external user on behalf of
            whom the bot acted. Shown when an integration action was triggered
            by a specific person in the external system.
        avatarUrl:
          type: url
          description: A URL pointing to the avatar image representing this
            bot, typically the integration's logo or icon.
    favoriteId:
      type: string
      displayName: Favorite ID
      description: "`favorite` — the users favorite associated with this issue."
    sharedAccess:
      type: object
      displayName: Shared Access
      description: Shared access metadata for this issue.
      fields:
        isShared:
          type: bool
          description: Whether this issue has been shared with users outside
            the team.
        viewerHasOnlySharedAccess:
          type: bool
          description: Whether the viewer can access this issue only through
            issue sharing.
        sharedWithCount:
          type: int
          description: The number of users this issue is shared with.
        sharedWithUsers:
          type: reference
          kind: providers.substrate.reamde.dev/linear/user
          repeated: true
          description: Users this issue is shared with.
        disallowedIssueFields:
          type: enum
          repeated: true
          description: Issue update fields the viewer cannot modify due to
            shared-only access.
          values:
            - value: "projectid"
              label: "projectId"
            - value: "teamid"
              label: "teamId"
            - value: "cycleid"
              label: "cycleId"
            - value: "projectmilestoneid"
              label: "projectMilestoneId"
    parent:
      type: reference
      kind: providers.substrate.reamde.dev/linear/issue
      displayName: Parent
      description: The parent of the issue.
    # DECLARED, NOT FETCHED: an unmirrored DocumentContent (the description rides on the row already)
    documentContentId:
      type: string
      displayName: Document Content ID
      description: "`documentContent` — [ALPHA] The document content representing
        this issue description."
    reactions:
      type: reference
      kind: providers.substrate.reamde.dev/linear/reaction
      repeated: true
      displayName: Reactions
      description: Reactions associated with the issue.
    asksRequester:
      type: reference
      kind: providers.substrate.reamde.dev/linear/user
      displayName: Asks Requester
      description: The internal user who requested creation of the Asks issue
        on behalf of the creator.
    asksExternalUserRequesterId:
      type: string
      displayName: Asks External User Requester ID
      description: "`asksExternalUserRequester` — the external user who requested
        creation of the Asks issue on behalf of the creator."
    labels:
      type: reference
      kind: providers.substrate.reamde.dev/linear/issuelabel
      repeated: true
      displayName: Labels
      description: Labels associated with this issue, read inline with the
        issue at a cap; a page that says hasNextPage leaves the property alone
    subscribers:
      type: reference
      kind: providers.substrate.reamde.dev/linear/user
      repeated: true
      displayName: Subscribers
      description: Users who are subscribed to the issue, read inline with
        the issue at a cap; a page that says hasNextPage leaves the property
        alone
    # ---- instants ----------------------------------------------------
    updatedAt:
      type: datetime
      displayName: Updated At
      description: The last time at which the entity was meaningfully updated.
        This is the same as the creation time if the entity hasn't been updated
        after creation.
    archivedAt:
      type: datetime
      displayName: Archived At
      description: The time at which the entity was archived. Null if the
        entity has not been archived.
    startedAt:
      type: datetime
      displayName: Started At
      description: The time at which the issue was moved into started state.
    completedAt:
      type: datetime
      displayName: Completed At
      description: The time at which the issue was moved into completed state.
    startedTriageAt:
      type: datetime
      displayName: Started Triage At
      description: The time at which the issue entered triage.
    triagedAt:
      type: datetime
      displayName: Triaged At
      description: The time at which the issue left triage.
    canceledAt:
      type: datetime
      displayName: Canceled At
      description: The time at which the issue was moved into canceled state.
    autoClosedAt:
      type: datetime
      displayName: Auto Closed At
      description: The time at which the issue was automatically closed by
        the auto pruning process.
    autoArchivedAt:
      type: datetime
      displayName: Auto Archived At
      description: The time at which the issue was automatically archived
        by the auto pruning process.
    dueDate:
      type: date
      displayName: Due Date
      description: The date at which the issue is due.
    slaStartedAt:
      type: datetime
      displayName: SLA Started At
      description: The time at which the issue's SLA began.
    slaMediumRiskAt:
      type: datetime
      displayName: SLA Medium Risk At
      description: The time at which the issue's SLA will enter medium risk
        state.
    slaHighRiskAt:
      type: datetime
      displayName: SLA High Risk At
      description: The time at which the issue's SLA will enter high risk
        state.
    slaBreachesAt:
      type: datetime
      displayName: SLA Breaches At
      description: The time at which the issue's SLA will breach.
    addedToProjectAt:
      type: datetime
      displayName: Added To Project At
      description: The time at which the issue was added to a project.
    addedToCycleAt:
      type: datetime
      displayName: Added To Cycle At
      description: The time at which the issue was added to a cycle.
    addedToTeamAt:
      type: datetime
      displayName: Added To Team At
      description: The time at which the issue was added to a team.
    snoozedUntilAt:
      type: datetime
      displayName: Snoozed Until At
      description: The time until an issue will be snoozed in Triage view.
    suggestionsGeneratedAt:
      type: datetime
      displayName: Suggestions Generated At
      description: "[Internal] The time at which the most recent suggestions
        for this issue were generated."
---
# ---- mirror: one comment -----------------------------------------------------
# From each issue's nested `comments` connection. Linear ships several of a
# comment's relations TWICE - `issue` and `issueId`, `parent` and `parentId` -
# and the mirror keeps each once: the reference where this bundle mirrors the
# other end, the id where it does not (§3).
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/linear/comment
data:
  authority: providers.substrate.reamde.dev
  package: linear
  description: >-
    A comment on a Linear issue. One Linear comment, from an issue's nested
    `comments` connection (introspected 2026-09-16); `at` is `createdAt`.
    Omitted as classes: GraphQL's envelope (`data`, `errors`, `pageInfo`)
    and its hypermedia, the `*Connection` sub-queries. Every payload is authoritative:
    a selected field returned null is a clear.
  purpose: supporting
  names:
    singular: comment
  traits:
    - substrate.reamde.dev/core/temporal(point)
  displayTemplate: "{user.name}"
  properties:
    # ---- identity ----------------------------------------------------
    account:
      type: reference
      kind: providers.substrate.reamde.dev/linear/account
      required: true
      onDelete: cascade
      displayName: Account
      description: the Linear account this row was synced through
    commentId:
      type: string
      displayName: Comment ID
      description: Linear's `id` — the comment's UUID, and the id every row
        derives from
    # ---- the object's own fields, in the schema's order ---------------
    body:
      type: markdown
      embed: true
      displayName: Body
      description: The comment content in markdown format. This is a derived
        representation of the canonical bodyData ProseMirror content.
    documentContentId:
      type: string
      displayName: Document Content ID
      description: The ID of the document content that the comment is associated
        with. Null if the comment belongs to a different parent entity type.
    projectUpdateId:
      type: string
      displayName: Project Update ID
      description: The ID of the project update that the comment is associated
        with. Null if the comment belongs to a different parent entity type.
    initiativeUpdateId:
      type: string
      displayName: Initiative Update ID
      description: The ID of the initiative update that the comment is associated
        with. Null if the comment belongs to a different parent entity type.
    initiativeId:
      type: string
      displayName: Initiative ID
      description: The ID of the initiative that the comment is associated
        with. Null if the comment belongs to a different parent entity type.
    # DECLARED, NOT FETCHED: the ProseMirror document of the same markdown the row already carries
    bodyData:
      type: string
      displayName: Body Data
      description: "[Internal] The comment content as a ProseMirror document.
        This is the canonical rich-text representation of the comment body."
    quotedText:
      type: string
      displayName: Quoted Text
      description: The text that this comment references, used for inline
        comments on documents or issue descriptions. Null for standard comments
        that do not quote specific text.
    reactionData:
      type: json
      displayName: Reaction Data
      description: "Emoji reaction summary for this comment, grouped by emoji
        type. Each entry contains the emoji name, count, and the IDs of users
        who reacted. json: the schema types it `JSONObject`, an opaque scalar."
    # DECLARED, NOT FETCHED: [Internal]
    threadSummary:
      type: json
      displayName: Thread Summary
      description: "[Internal] An AI-generated summary of the comment thread.
        Null if no summary has been generated or if this is not a top-level
        comment. json: the schema types it `JSONObject`, an opaque scalar."
    isArtificialAgentSessionRoot:
      type: bool
      displayName: Is Artificial Agent Session Root
      description: "[Internal] Whether the comment is an artificial placeholder
        for an agent session thread created without a comment mention."
    url:
      type: url
      displayName: URL
      description: Comment's URL.
    hideInLinear:
      type: bool
      displayName: Hide In Linear
      description: "[Internal] Whether the comment should be hidden from Linear
        clients. This is typically used for bot comments that provide redundant
        information (e.g., Slack Asks confirmation messages)."
    # DECLARED, NOT FETCHED: each entry's `metadata` is a GraphQL UNION
    syncedWith:
      type: json
      repeated: true
      displayName: Synced With
      description: "The external services the comment is synced with. each
        entry's `metadata` is a GraphQL UNION, so no shape is declarable json:
        the schema types it `JSONObject`, an opaque scalar."
    # ---- relations ---------------------------------------------------
    issue:
      type: reference
      kind: providers.substrate.reamde.dev/linear/issue
      displayName: Issue
      description: The issue that the comment is associated with. Null if
        the comment belongs to a different parent entity type.
    postId:
      type: string
      displayName: Post ID
      description: "`post` — the post that the comment is associated with.
        Null if the comment belongs to a different parent entity type."
    project:
      type: reference
      kind: providers.substrate.reamde.dev/linear/project
      displayName: Project
      description: The project that the comment is associated with. Used for
        project-level discussion threads. Null if the comment belongs to a
        different parent entity type.
    parent:
      type: reference
      kind: providers.substrate.reamde.dev/linear/comment
      displayName: Parent
      description: The parent comment under which the current comment is nested.
        Null for top-level comments that are not replies.
    resolvingUser:
      type: reference
      kind: providers.substrate.reamde.dev/linear/user
      displayName: Resolving User
      description: The user that resolved the comment thread. Null if the
        thread has not been resolved or if this is not a top-level comment.
    resolvingComment:
      type: reference
      kind: providers.substrate.reamde.dev/linear/comment
      displayName: Resolving Comment
      description: The child comment that resolved this thread. Only set on
        top-level (parent) comments. Null if the thread is unresolved.
    user:
      type: reference
      kind: providers.substrate.reamde.dev/linear/user
      displayName: User
      description: The user who wrote the comment. Null for comments created
        by integrations or bots without a user association.
    externalUserId:
      type: string
      displayName: External User ID
      description: "`externalUser` — the external user who wrote the comment,
        when the comment was created through an integration such as Slack
        or Intercom. Null for comments created by workspace users."
    # DECLARED, NOT FETCHED: an unmirrored AgentSession
    agentSessionId:
      type: string
      displayName: Agent Session ID
      description: "`agentSession` — agent session associated with this comment."
    botActor:
      type: object
      displayName: Bot Actor
      description: The bot that created the comment.
      fields:
        id:
          type: string
          description: A unique identifier for the bot actor.
        type:
          type: string
          description: The source type of the bot, identifying the application
            or integration (e.g., 'github', 'slack', 'workflow', 'ai').
        subType:
          type: string
          description: A more specific classification within the bot type,
            providing additional context about the integration or application
            variant.
        name:
          type: string
          description: The display name of the bot.
        userDisplayName:
          type: string
          description: The display name of the external user on behalf of
            whom the bot acted. Shown when an integration action was triggered
            by a specific person in the external system.
        avatarUrl:
          type: url
          description: A URL pointing to the avatar image representing this
            bot, typically the integration's logo or icon.
    onBehalfOf:
      type: reference
      kind: providers.substrate.reamde.dev/linear/user
      displayName: On Behalf Of
      description: "[Internal] The user on whose behalf the comment was created,
        e.g. when the Linear assistant creates a comment for a user."
    # DECLARED, NOT FETCHED: an unmirrored SyncedExternalThread
    externalThreadId:
      type: string
      displayName: External Thread ID
      description: "`externalThread` — the external thread that the comment
        is synced with."
    reactions:
      type: reference
      kind: providers.substrate.reamde.dev/linear/reaction
      repeated: true
      displayName: Reactions
      description: Reactions associated with the comment.
    # ---- instants ----------------------------------------------------
    updatedAt:
      type: datetime
      displayName: Updated At
      description: The last time at which the entity was meaningfully updated.
        This is the same as the creation time if the entity hasn't been updated
        after creation.
    archivedAt:
      type: datetime
      displayName: Archived At
      description: The time at which the entity was archived. Null if the
        entity has not been archived.
    resolvedAt:
      type: datetime
      displayName: Resolved At
      description: The time when the comment thread was resolved. Null if
        the thread is unresolved.
    editedAt:
      type: datetime
      displayName: Edited At
      description: The time the comment was last edited by its author. Null
        if the comment has not been edited since creation.
---
# ---- mirror: one reaction ----------------------------------------------------
# `Reaction` has its own identity and rides on BOTH an issue and a comment, so
# the §3 two-part test makes it a kind rather than an object. Linear's
# `reactionData` summary of the same facts rides on the row it belongs to.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/linear/reaction
data:
  authority: providers.substrate.reamde.dev
  package: linear
  description: >-
    An emoji reaction on a Linear issue or comment. One Linear emoji reaction
    on an issue or a comment (introspected 2026-09-16); `at` is `createdAt`.
    Omitted as classes: GraphQL's envelope (`data`, `errors`, `pageInfo`)
    and its hypermedia, the `*Connection` sub-queries. Every payload is authoritative:
    a selected field returned null is a clear.
  purpose: supporting
  names:
    singular: reaction
  traits:
    - substrate.reamde.dev/core/temporal(point)
  displayTemplate: "{emoji}"
  properties:
    # ---- identity ----------------------------------------------------
    account:
      type: reference
      kind: providers.substrate.reamde.dev/linear/account
      required: true
      onDelete: cascade
      displayName: Account
      description: the Linear account this row was synced through
    reactionId:
      type: string
      displayName: Reaction ID
      description: Linear's `id` — the reaction's UUID, and the id every row
        derives from
    # ---- the object's own fields, in the schema's order ---------------
    emoji:
      type: string
      displayName: Emoji
      description: The name of the emoji used for this reaction. For custom
        workspace emojis, this is the custom emoji name; for standard emojis,
        this is the normalized emoji name.
    # ---- relations ---------------------------------------------------
    issue:
      type: reference
      kind: providers.substrate.reamde.dev/linear/issue
      displayName: Issue
      description: The issue that the reaction is associated with. Null if
        the reaction belongs to a different parent entity type.
    comment:
      type: reference
      kind: providers.substrate.reamde.dev/linear/comment
      displayName: Comment
      description: The comment that the reaction is associated with. Null
        if the reaction belongs to a different parent entity type.
    projectUpdateId:
      type: string
      displayName: Project Update ID
      description: "`projectUpdate` — the project update that the reaction
        is associated with. Null if the reaction belongs to a different parent
        entity type."
    initiativeUpdateId:
      type: string
      displayName: Initiative Update ID
      description: "`initiativeUpdate` — the initiative update that the reaction
        is associated with. Null if the reaction belongs to a different parent
        entity type."
    postId:
      type: string
      displayName: Post ID
      description: "`post` — the post that the reaction is associated with.
        Null if the reaction belongs to a different parent entity type."
    user:
      type: reference
      kind: providers.substrate.reamde.dev/linear/user
      displayName: User
      description: The workspace user that created the reaction. Null if the
        reaction was created by an external user through an integration.
    externalUserId:
      type: string
      displayName: External User ID
      description: "`externalUser` — the external user that created the reaction
        through an integration. Null if the reaction was created by a workspace
        user."
    # ---- instants ----------------------------------------------------
    updatedAt:
      type: datetime
      displayName: Updated At
      description: The last time at which the entity was meaningfully updated.
        This is the same as the creation time if the entity hasn't been updated
        after creation.
    archivedAt:
      type: datetime
      displayName: Archived At
      description: The time at which the entity was archived. Null if the
        entity has not been archived.
