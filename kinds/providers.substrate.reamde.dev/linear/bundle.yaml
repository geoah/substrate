# ---- mirror: one project -----------------------------------------------------
# From the `projects` connection. `teams` and `members` are the two nested
# connections the sync reads inline, capped: a page that says `hasNextPage`
# leaves the property ALONE rather than writing a short list.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/linear/project
data:
  authority: providers.substrate.reamde.dev
  package: linear
  description: >-
    A project in Linear. One Linear project, from the `projects` connection
    (introspected 2026-09-16); `at` is `createdAt`. Omitted as classes: GraphQL's
    envelope (`data`, `errors`, `pageInfo`) and its hypermedia, the `*Connection`
    sub-queries. Every payload is authoritative: a selected field returned
    null is a clear.
  names:
    singular: project
  traits:
    - substrate.reamde.dev/core/temporal(point)
  displayTemplate: "{name}"
  properties:
    # ---- identity ----------------------------------------------------
    account:
      type: reference
      kind: providers.substrate.reamde.dev/linear/account
      required: true
      onDelete: cascade
      displayName: Account
      description: the Linear account this row was synced through
    projectId:
      type: string
      displayName: Project ID
      description: Linear's `id` — the project's UUID, and the id every row
        derives from
    # ---- the object's own fields, in the schema's order ---------------
    updateReminderFrequencyInWeeks:
      type: float
      displayName: Update Reminder Frequency In Weeks
      description: The n-weekly frequency at which to prompt for updates.
        When not set, reminders are inherited from workspace.
    updateReminderFrequency:
      type: float
      displayName: Update Reminder Frequency
      description: The frequency at which to prompt for updates. When not
        set, reminders are inherited from workspace.
    frequencyResolution:
      type: enum
      displayName: Frequency Resolution
      description: The resolution of the reminder frequency.
      values:
        - value: "daily"
          label: "daily"
        - value: "weekly"
          label: "weekly"
    updateRemindersDay:
      type: enum
      displayName: Update Reminders Day
      description: The day at which to prompt for updates.
      values:
        - value: "sunday"
          label: "Sunday"
        - value: "monday"
          label: "Monday"
        - value: "tuesday"
          label: "Tuesday"
        - value: "wednesday"
          label: "Wednesday"
        - value: "thursday"
          label: "Thursday"
        - value: "friday"
          label: "Friday"
        - value: "saturday"
          label: "Saturday"
    updateRemindersHour:
      type: float
      displayName: Update Reminders Hour
      description: The hour at which to prompt for updates.
    name:
      type: string
      displayName: Name
      description: The name of the project.
    description:
      type: text
      displayName: Description
      description: The short description of the project.
    slugId:
      type: string
      displayName: Slug ID
      description: The project's unique URL slug, used to construct human-readable
        URLs.
    icon:
      type: string
      displayName: Icon
      description: The icon of the project. Can be an emoji or a decorative
        icon type.
    color:
      type: string
      displayName: Color
      description: The project's color as a HEX string. Used in the UI to
        visually identify the project.
    startDateResolution:
      type: enum
      displayName: Start Date Resolution
      description: The resolution of the project's start date, indicating
        whether it refers to a specific month, quarter, half-year, or year.
      values:
        - value: "month"
          label: "month"
        - value: "quarter"
          label: "quarter"
        - value: "halfyear"
          label: "halfYear"
        - value: "year"
          label: "year"
    targetDateResolution:
      type: enum
      displayName: Target Date Resolution
      description: The resolution of the project's estimated completion date,
        indicating whether it refers to a specific month, quarter, half-year,
        or year.
      values:
        - value: "month"
          label: "month"
        - value: "quarter"
          label: "quarter"
        - value: "halfyear"
          label: "halfYear"
        - value: "year"
          label: "year"
    trashed:
      type: bool
      displayName: Trashed
      description: A flag that indicates whether the project is in the trash
        bin.
    sortOrder:
      type: float
      displayName: Sort Order
      description: The sort order for the project within the workspace. Used
        for manual ordering in list views.
    prioritySortOrder:
      type: float
      displayName: Priority Sort Order
      description: The sort order for the project within the workspace when
        ordered by priority.
    priority:
      type: int
      displayName: Priority
      description: The priority of the project. 0 = No priority, 1 = Urgent,
        2 = High, 3 = Medium, 4 = Low.
    health:
      type: enum
      displayName: Health
      description: The overall health of the project, derived from the most
        recent project update. Possible values are onTrack, atRisk, or offTrack.
        Null if no health has been reported.
      values:
        - value: "ontrack"
          label: "onTrack"
        - value: "atrisk"
          label: "atRisk"
        - value: "offtrack"
          label: "offTrack"
    issueCountHistory:
      type: int
      repeated: true
      displayName: Issue Count History
      description: The total number of issues in the project at the end of
        each week since project creation. Each entry represents one week.
    completedIssueCountHistory:
      type: int
      repeated: true
      displayName: Completed Issue Count History
      description: The number of completed issues in the project at the end
        of each week since project creation. Each entry represents one week.
    scopeHistory:
      type: float
      repeated: true
      displayName: Scope History
      description: The total scope (estimation points) of the project at the
        end of each week since project creation. Each entry represents one
        week.
    completedScopeHistory:
      type: float
      repeated: true
      displayName: Completed Scope History
      description: The number of completed estimation points at the end of
        each week since project creation. Each entry represents one week.
    inProgressScopeHistory:
      type: float
      repeated: true
      displayName: In Progress Scope History
      description: The number of in-progress estimation points at the end
        of each week since project creation. Each entry represents one week.
    # DECLARED, NOT FETCHED: [Internal]
    progressHistory:
      type: json
      displayName: Progress History
      description: "[INTERNAL] The progress history of the project, tracking
        issue completion over time. json: the schema types it `JSONObject`,
        an opaque scalar."
    # DECLARED, NOT FETCHED: [Internal]
    currentProgress:
      type: json
      displayName: Current Progress
      description: "[INTERNAL] The current progress of the project, broken
        down by issue status category. json: the schema types it `JSONObject`,
        an opaque scalar."
    # DECLARED, NOT FETCHED: @deprecated in Linear's schema — selecting it makes every page fail the day it goes
    slackNewIssue:
      type: bool
      displayName: SLAck New Issue
      description: Whether to send new issue notifications to Slack.
    # DECLARED, NOT FETCHED: @deprecated in Linear's schema — selecting it makes every page fail the day it goes
    slackIssueComments:
      type: bool
      displayName: SLAck Issue Comments
      description: Whether to send new issue comment notifications to Slack.
    # DECLARED, NOT FETCHED: @deprecated in Linear's schema — selecting it makes every page fail the day it goes
    slackIssueStatuses:
      type: bool
      displayName: SLAck Issue Statuses
      description: Whether to send new issue status updates to Slack.
    labelIds:
      type: string
      repeated: true
      displayName: Label IDs
      description: The IDs of the project labels associated with this project.
    url:
      type: url
      displayName: URL
      description: Project URL.
    identifier:
      type: string
      displayName: IDentifier
      description: "[Internal] The human-readable identifier of the project.
        Returns the custom identifier override when set, otherwise the default
        `P-<leadTeamKey>-<number>`"
    # DECLARED, NOT FETCHED: Linear answers 400 for the whole page while the workspace's `Project and initiative IDs` feature is off
    previousIdentifiers:
      type: string
      repeated: true
      displayName: Previous IDentifiers
      description: "[Internal] Identifiers (default and custom) that this
        project has previously held. Used to resolve URLs that referenced
        an older identifier."
    resourceCount:
      type: int
      displayName: Resource Count
      description: The number of resources associated with the project, including
        documents, external links, and attachments.
    progress:
      type: float
      displayName: Progress
      description: The overall progress of the project. This is the (completed
        estimate points + 0.25 * in progress estimate points) / total estimate
        points.
    scope:
      type: float
      displayName: Scope
      description: The overall scope (total estimate points) of the project.
    slackChannelId:
      type: string
      displayName: SLAck Channel ID
      description: The ID of the Slack channel connected to the project, if
        any.
    microsoftTeamsChannelId:
      type: string
      displayName: Microsoft Teams Channel ID
      description: The ID of the Microsoft Teams channel connected to the
        project, if any.
    content:
      type: markdown
      displayName: Content
      description: The project's content in markdown format.
    # DECLARED, NOT FETCHED: the YJS CRDT state of the same markdown the row already carries
    contentState:
      type: string
      displayName: Content State
      description: "[Internal] The project's content as YJS state."
    # DECLARED, NOT FETCHED: @deprecated in Linear's schema — selecting it makes every page fail the day it goes
    state:
      type: string
      displayName: State
      description: "[DEPRECATED] The type of the state."
    priorityLabel:
      type: string
      displayName: Priority Label
      description: The priority of the project as a label.
    # DECLARED, NOT FETCHED: each entry's `metadata` is a GraphQL UNION
    syncedWith:
      type: json
      repeated: true
      displayName: Synced With
      description: "The external services the project is synced with. each
        entry's `metadata` is a GraphQL UNION, so no shape is declarable json:
        the schema types it `JSONObject`, an opaque scalar."
    # ---- relations ---------------------------------------------------
    status:
      type: reference
      kind: providers.substrate.reamde.dev/linear/projectstatus
      displayName: Status
      description: The current project status. Defines the project's position
        in its lifecycle (e.g., backlog, planned, started, paused, completed,
        canceled).
    creator:
      type: reference
      kind: providers.substrate.reamde.dev/linear/user
      displayName: Creator
      description: The user who created the project.
    lead:
      type: reference
      kind: providers.substrate.reamde.dev/linear/user
      displayName: Lead
      description: The user who leads the project. The project lead is typically
        responsible for posting status updates and driving the project to
        completion. Null if no lead is assigned.
    leadTeam:
      type: reference
      kind: providers.substrate.reamde.dev/linear/team
      displayName: Lead Team
      description: "[Internal] The team that leads the project. Null if the
        viewer does not have access to the team."
    # DECLARED, NOT FETCHED: [Internal] a view-configuration list of an unmirrored type
    facetsIds:
      type: string
      repeated: true
      displayName: Facets IDs
      description: "`facets` — [Internal] Facets associated with the project,
        used for filtering and categorization."
    convertedFromIssue:
      type: reference
      kind: providers.substrate.reamde.dev/linear/issue
      displayName: Converted From Issue
      description: The issue that was converted into this project. Null if
        the project was not created from an issue.
    lastAppliedTemplateId:
      type: string
      displayName: Last Applied Template ID
      description: "`lastAppliedTemplate` — the last template that was applied
        to this project."
    lastUpdateId:
      type: string
      displayName: Last Update ID
      description: "`lastUpdate` — the most recent status update posted for
        this project. Null if no updates have been posted."
    favoriteId:
      type: string
      displayName: Favorite ID
      description: "`favorite` — the user's favorite associated with this
        project."
    # DECLARED, NOT FETCHED: an unmirrored IntegrationsSettings
    integrationsSettingsId:
      type: string
      displayName: Integrations Settings ID
      description: "`integrationsSettings` — settings for all integrations
        associated with that project."
    # DECLARED, NOT FETCHED: an unmirrored DocumentContent (the description rides on the row already)
    documentContentId:
      type: string
      displayName: Document Content ID
      description: "`documentContent` — the content of the project description."
    teams:
      type: reference
      kind: providers.substrate.reamde.dev/linear/team
      repeated: true
      displayName: Teams
      description: Teams associated with this project, read inline with the
        project at a cap; a page that says hasNextPage leaves the property
        alone
    members:
      type: reference
      kind: providers.substrate.reamde.dev/linear/user
      repeated: true
      displayName: Members
      description: Users that are members of the project, read inline at a
        cap; a page that says hasNextPage leaves the property alone
    # ---- instants ----------------------------------------------------
    updatedAt:
      type: datetime
      displayName: Updated At
      description: The last time at which the entity was meaningfully updated.
        This is the same as the creation time if the entity hasn't been updated
        after creation.
    archivedAt:
      type: datetime
      displayName: Archived At
      description: The time at which the entity was archived. Null if the
        entity has not been archived.
    projectUpdateRemindersPausedUntilAt:
      type: datetime
      displayName: Project Update Reminders Paused Until At
      description: The time until which project update reminders are paused.
        When set, no update reminders will be sent for this project until
        this date passes. Null means reminders are active.
    startDate:
      type: date
      displayName: Start Date
      description: The estimated start date of the project. Null if no start
        date is set.
    targetDate:
      type: date
      displayName: Target Date
      description: The estimated completion date of the project. Null if no
        target date is set.
    startedAt:
      type: datetime
      displayName: Started At
      description: The time at which the project was moved into a started
        status. Null if the project has not been started.
    completedAt:
      type: datetime
      displayName: Completed At
      description: The time at which the project was moved into a completed
        status. Null if the project has not been completed.
    canceledAt:
      type: datetime
      displayName: Canceled At
      description: The time at which the project was moved into a canceled
        status. Null if the project has not been canceled.
    autoArchivedAt:
      type: datetime
      displayName: Auto Archived At
      description: The time at which the project was automatically archived
        by the auto-pruning process. Null if the project has not been auto-archived.
    healthUpdatedAt:
      type: datetime
      displayName: Health Updated At
      description: The time at which the project health was last updated,
        typically when a new project update is posted. Null if health has
        never been set.
---
# ---- mirror: one cycle -------------------------------------------------------
# From the `cycles` connection. A cycle IS a span, so it binds
# `temporal(range)`: `at` is `startsAt`, `endsAt` is `endsAt`, and neither is
# redeclared (§4). `createdAt` rides beside them as its own instant.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/linear/cycle
data:
  authority: providers.substrate.reamde.dev
  package: linear
  description: >-
    A Linear cycle: a fixed stretch of time a team plans its work in. One
    Linear cycle, from the `cycles` connection (introspected 2026-09-16);
    `at`/`endsAt` are `startsAt`/`endsAt`. Omitted as classes: GraphQL's envelope
    (`data`, `errors`, `pageInfo`) and its hypermedia, the `*Connection` sub-queries.
    Every payload is authoritative: a selected field returned null is a clear.
  purpose: supporting
  names:
    singular: cycle
  traits:
    - substrate.reamde.dev/core/temporal(range)
  displayTemplate: "{name|number}"
  properties:
    # ---- identity ----------------------------------------------------
    account:
      type: reference
      kind: providers.substrate.reamde.dev/linear/account
      required: true
      onDelete: cascade
      displayName: Account
      description: the Linear account this row was synced through
    cycleId:
      type: string
      displayName: Cycle ID
      description: Linear's `id` — the cycle's UUID, and the id every row
        derives from
    # ---- the object's own fields, in the schema's order ---------------
    number:
      type: float
      displayName: Number
      description: The auto-incrementing number of the cycle, unique within
        its team. This value is assigned automatically by the database and
        cannot be set on creation.
    name:
      type: string
      displayName: Name
      description: The custom name of the cycle. If not set, the cycle is
        displayed using its number (e.g., "Cycle 5").
    description:
      type: text
      displayName: Description
      description: The description of the cycle.
    issueCountHistory:
      type: int
      repeated: true
      displayName: Issue Count History
      description: The total number of issues in the cycle after each day.
        Each entry represents a snapshot at the end of that day, forming the
        basis for burndown charts.
    completedIssueCountHistory:
      type: int
      repeated: true
      displayName: Completed Issue Count History
      description: The number of completed issues in the cycle after each
        day. Each entry corresponds to the same day index as issueCountHistory.
    scopeHistory:
      type: float
      repeated: true
      displayName: Scope History
      description: The total number of estimation points (scope) in the cycle
        after each day. Used for scope-based burndown charts.
    completedScopeHistory:
      type: float
      repeated: true
      displayName: Completed Scope History
      description: The number of completed estimation points after each day.
        Used together with scopeHistory for burndown charts.
    inProgressScopeHistory:
      type: float
      repeated: true
      displayName: In Progress Scope History
      description: The number of in-progress estimation points after each
        day. Tracks work that has been started but not yet completed.
    # DECLARED, NOT FETCHED: [Internal]
    progressHistory:
      type: json
      displayName: Progress History
      description: "[Internal] The detailed progress history of the cycle,
        including per-status breakdowns over time. json: the schema types
        it `JSONObject`, an opaque scalar."
    # DECLARED, NOT FETCHED: [Internal]
    currentProgress:
      type: json
      displayName: Current Progress
      description: "[Internal] The current progress snapshot of the cycle,
        broken down by issue status categories. json: the schema types it
        `JSONObject`, an opaque scalar."
    isActive:
      type: bool
      displayName: Is Active
      description: Whether the cycle is currently active. A cycle is active
        if the current time is between its start and end dates and it has
        not been completed.
    isFuture:
      type: bool
      displayName: Is Future
      description: Whether the cycle has not yet started. True if the cycle's
        start date is in the future.
    isPast:
      type: bool
      displayName: Is Past
      description: Whether the cycle's end date has passed.
    progress:
      type: float
      displayName: Progress
      description: The overall progress of the cycle as a number between 0
        and 1. Calculated as (completed estimate points + 0.25 * in-progress
        estimate points) / total estimate points
    isNext:
      type: bool
      displayName: Is Next
      description: Whether this cycle is the next upcoming (not yet started)
        cycle for the team.
    isPrevious:
      type: bool
      displayName: Is Previous
      description: Whether this cycle is the most recently completed cycle
        for the team.
    # ---- relations ---------------------------------------------------
    team:
      type: reference
      kind: providers.substrate.reamde.dev/linear/team
      displayName: Team
      description: The team that the cycle belongs to. Each cycle is scoped
        to exactly one team.
    inheritedFrom:
      type: reference
      kind: providers.substrate.reamde.dev/linear/cycle
      displayName: Inherited From
      description: The parent cycle this cycle was inherited from. When a
        parent team creates cycles, sub-teams automatically receive corresponding
        inherited cycles.
    # ---- instants ----------------------------------------------------
    createdAt:
      type: datetime
      displayName: Created At
      description: The time at which the entity was created.
    updatedAt:
      type: datetime
      displayName: Updated At
      description: The last time at which the entity was meaningfully updated.
        This is the same as the creation time if the entity hasn't been updated
        after creation.
    archivedAt:
      type: datetime
      displayName: Archived At
      description: The time at which the entity was archived. Null if the
        entity has not been archived.
    completedAt:
      type: datetime
      displayName: Completed At
      description: The completion time of the cycle. If null, the cycle has
        not been completed yet. A cycle is completed either when its end date
        passes or when it is manually completed early.
    autoArchivedAt:
      type: datetime
      displayName: Auto Archived At
      description: The time at which the cycle was automatically archived
        by the auto-pruning process. Null if the cycle has not been auto-archived.
---
# ---- mirror: one issue -------------------------------------------------------
# From the `issues` connection, walked in `updatedAt` order behind the
# account's watermark. `title` is RESERVED on every record, so the heading is
# `issueTitle` and the kind renders itself (§5). `labels`, `subscribers` and
# `reactions` are the nested connections the sync reads inline, capped.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/linear/issue
data:
  authority: providers.substrate.reamde.dev
  package: linear
  description: >-
    An issue in Linear. One Linear issue, from the `issues` connection (introspected
    2026-09-16); `at` is `createdAt`, the heading `issueTitle`. Omitted as
    classes: GraphQL's envelope (`data`, `errors`, `pageInfo`) and its hypermedia,
    the `*Connection` sub-queries. Every payload is authoritative: a selected
    field returned null is a clear.
  names:
    singular: issue
  traits:
    - substrate.reamde.dev/core/temporal(point)
  displayTemplate: "{identifier} {issueTitle}"
  properties:
    # ---- identity ----------------------------------------------------
    account:
      type: reference
      kind: providers.substrate.reamde.dev/linear/account
      required: true
      onDelete: cascade
      displayName: Account
      description: the Linear account this row was synced through
    issueId:
      type: string
      displayName: Issue ID
      description: Linear's `id` — the issue's UUID, and the id every row
        derives from
    # ---- the object's own fields, in the schema's order ---------------
    number:
      type: float
      displayName: Number
      description: The issue's unique number, scoped to the issue's team.
        Together with the team key, this forms the issue's human-readable
        identifier (e.g., ENG-123).
    issueTitle:
      type: string
      displayName: Issue Title
      description: "`title` — the issue's title. This is the primary human-readable
        summary of the work item."
    priority:
      type: float
      displayName: Priority
      description: The priority of the issue. 0 = No priority, 1 = Urgent,
        2 = High, 3 = Medium, 4 = Low.
    estimate:
      type: float
      displayName: Estimate
      description: The estimate of the complexity of the issue. The specific
        scale used depends on the team's estimation configuration (e.g., points,
        T-shirt sizes). Null if no estimate has been set.
    # DECLARED, NOT FETCHED: @deprecated in Linear's schema — selecting it makes every page fail the day it goes
    boardOrder:
      type: float
      displayName: Board Order
      description: The order of the item in its column on the board.
    sortOrder:
      type: float
      displayName: Sort Order
      description: The order of the item in relation to other items in the
        organization. Used for manual sorting in list views.
    prioritySortOrder:
      type: float
      displayName: Priority Sort Order
      description: The order of the item in relation to other items in the
        workspace, when ordered by priority.
    slaType:
      type: string
      displayName: SLA Type
      description: The type of SLA set on the issue. Calendar days or business
        days.
    trashed:
      type: bool
      displayName: Trashed
      description: A flag that indicates whether the issue is in the trash
        bin.
    # DECLARED, NOT FETCHED: [Internal]
    activitySummary:
      type: json
      displayName: Activity Summary
      description: "[Internal] The activity summary information for this issue.
        json: the schema types it `JSONObject`, an opaque scalar."
    previousIdentifiers:
      type: string
      repeated: true
      displayName: Previous IDentifiers
      description: Previous identifiers of the issue if it has been moved
        between teams.
    subIssueSortOrder:
      type: float
      displayName: Sub Issue Sort Order
      description: The order of the item in the sub-issue list. Only set if
        the issue has a parent.
    reactionData:
      type: json
      displayName: Reaction Data
      description: "Emoji reaction summary for the issue, grouped by emoji
        type. Contains the count and reacting user information for each emoji.
        json: the schema types it `JSONObject`, an opaque scalar."
    priorityLabel:
      type: string
