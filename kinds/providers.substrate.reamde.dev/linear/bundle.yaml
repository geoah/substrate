    # DECLARED, NOT FETCHED: @deprecated in Linear's schema — selecting it makes every page fail the day it goes
    hideNonPrimaryOrganizations:
      type: bool
      displayName: Hide Non Primary Organizations
      description: Whether to hide other organizations for new users signing
        up with email domains claimed by this organization.
    aiAddonEnabled:
      type: bool
      displayName: AI Addon Enabled
      description: "[INTERNAL] Whether the workspace has enabled the AI add-on
