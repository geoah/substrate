    def _permalink(domain, channel, ts, thread_ts):
        # Composed, never fetched: Slack documents the form, so a call per message
        # buys nothing. Nothing rather than something broken when the workspace
        # host is not known yet.
        if not (domain and channel and ts):
            return None
        link = "https://%s/archives/%s/p%s" % (domain, channel, ts.replace(".", "", 1))
        if thread_ts and thread_ts != ts:
            link += "?thread_ts=" + thread_ts
        return link


    def _message_props(host, aid, team, channel, domain, msg):
        """One message row: every documented field of the event, every relation a
        reference, nothing computed."""
        ts = msg.get("ts") or ""
        text = msg.get("text") or ""
        props = {"account": aid, "ts": ts, "type": "message",
                 "channel": _conv_ref(host, aid, team, channel)}
        props.update(_shape(msg, _MESSAGE_SCALARS, clear=True))
        at = _ts_iso(ts)
        if at:
            # The ts IS the trait's instant; `ts` itself is declared beside it
            # because it is the identity and the cursor Slack takes verbatim.
            props["at"] = at
        for prop, api in (("team", "team"), ("userTeam", "user_team"),
                          ("sourceTeam", "source_team")):
            if msg.get(api):
                props[prop] = _team_ref(host, aid, team, msg[api])
        for prop, api in (("user", "user"), ("parentUser", "parent_user_id"),
                          ("inviter", "inviter")):
            if msg.get(api):
                props[prop] = _user_ref(host, aid, team, msg[api])
        if msg.get("bot_id"):
            props["bot"] = _rid(host, aid, "%s/%s" % (team, msg["bot_id"]))
        # thread_ts names another message, so it is a reference and never a
        # string beside one. Slack sets thread_ts == ts on a thread's own PARENT,
        # and that supplied self-reference is a fact: it is what distinguishes a
        # thread root from a message that was never threaded. Absence of
        # thread_ts stays absence.
        thread_ts = msg.get("thread_ts") or ""
        if thread_ts:
            props["parent"] = _msg_ref(host, aid, team, channel, thread_ts)
        root = msg.get("root") or {}
        if isinstance(root, dict) and root.get("ts"):
            props["root"] = _msg_ref(host, aid, team, channel, root["ts"])
        if msg.get("latest_reply"):
            props["latestReply"] = _msg_ref(host, aid, team, channel,
                                            msg["latest_reply"])
            # The instant beside the reference: the reply row exists only
            # once its thread is walked, and the walk can be hours behind.
            at_reply = _ts_iso(msg["latest_reply"])
            if at_reply:
                props["latestReplyAt"] = at_reply
        # `reply_users` is ONE array of TWO namespaces: Slack documents that it
        # can hold bot ids, and a B… id is not a user. A reference pins one kind,
        # so the array is split by the namespace Slack itself encodes in the
        # prefix, and neither half ever mints the other's row.
        if "reply_users" in msg:
            ids = [u for u in (msg.get("reply_users") or []) if u]
            props["replyUsers"] = _refs(
                host, aid, team, [u for u in ids if u[:1] in ("U", "W")],
                _user_ref) or None
            props["replyBots"] = _refs(
                host, aid, team, [u for u in ids if u[:1] == "B"],
                _bot_ref) or None
        # The mrkdwn decode: lossless and mechanical, beside the verbatim text.
        # `text` is present on every persisted message, so an edit that removes
        # the last mention CLEARS the derived list rather than leaving it stale.
        if "text" in msg:
            props["mentions"] = _refs(
                host, aid, team, MENTION_RE.findall(text), _user_ref) or None
            props["channelMentions"] = _refs(
                host, aid, team, CHANNEL_RE.findall(text), _conv_ref) or None
        if "files" in msg:
            files = [f.get("id") for f in (msg.get("files") or [])
                     if isinstance(f, dict) and f.get("id")]
            props["files"] = _refs(host, aid, team, files, _file_ref) or None
        if "x_files" in msg:
            # `x_files` is the id-only companion of `files`: the same resources,
            # named rather than embedded. Distinct property, thin targets minted
            # by `_put_message` and hydrated by any later embed.
            props["xFiles"] = _refs(host, aid, team, msg.get("x_files"),
                                    _file_ref) or None
        if "pinned_to" in msg:
            props["pinnedTo"] = _refs(host, aid, team, msg.get("pinned_to"),
                                      _conv_ref) or None
        pin = msg.get("pinned_info") or {}
        if isinstance(pin, dict) and pin:
            one = {}
            if pin.get("pinned_by"):
                one["pinnedBy"] = _user_ref(host, aid, team, pin["pinned_by"])
            when = _epoch_iso(pin.get("pinned_ts"))
            if when:
                one["pinnedTs"] = when
            if one:
                props["pinnedInfo"] = one
        edited = msg.get("edited") or {}
        if isinstance(edited, dict) and edited:
            one = {}
            if edited.get("user"):
                one["user"] = _user_ref(host, aid, team, edited["user"])
            when = _ts_iso(edited.get("ts"))
            if when:
                one["ts"] = when
            if one:
                props["edited"] = one
        # Reactions CHURN. A reread that answers `reactions: []` — or that omits
        # the last reactor from a list whose count did not change — has to clear
        # what is there, so the presence of the key decides, never its length.
        if "reactions" in msg:
            props["reactions"] = _reaction_props(host, aid, team,
                                                 msg.get("reactions"))
        lang = msg.get("language") or {}
        if isinstance(lang, dict) and lang:
            one = _shape(lang, [("locale", "locale", None),
                                ("isReliable", "is_reliable", None)])
            if one:
                props["language"] = one
        icons = msg.get("icons") or {}
        if isinstance(icons, dict) and icons:
            one = _shape(icons, [("emoji", "emoji", None),
                                 ("image64", "image_64", None)])
            if one:
                props["icons"] = one
        # `metadata` is ONE API object: `{event_type, event_payload}`. It was
        # flattened into two invented helper properties, which is a lift the
        # guide does not allow and loses the object's own identity. The payload
        # is heterogeneous by its event type — a justified `json` — and it keeps
        # its own name and shape. An empty payload is a legal payload.
        if "metadata" in msg:
            meta = msg.get("metadata")
            props["metadata"] = meta if isinstance(meta, dict) and meta else None
        link = _permalink(domain, channel, ts, thread_ts)
        if link:
            props["permalink"] = link
        return props


    def _reaction_props(host, aid, team, reactions):
        """A message's `reactions` as the row holds them, or None for none:
        the whole set, never a delta, which is what both a history re-read and
        a `reactions.get` answer."""
        out = []
        for r in reactions or []:
            if not isinstance(r, dict):
                continue
            one = _shape(r, [("name", "name", None), ("count", "count", None),
                             ("url", "url", None)])
            if "users" in r:
                one["users"] = _refs(host, aid, team, r.get("users"),
                                     _user_ref) or None
            if one:
                out.append(one)
        return out or None


    def _keep(msg):
        if msg.get("type") not in (None, "message"):
            return False
        if not msg.get("ts"):
            return False
        return (msg.get("subtype") or "") not in MUTATION_SUBTYPES


    def _mutate(host, aid, team, channel, domain, msg):
        """One mutation envelope, applied to the message it speaks about.

        `message_changed` carries the WHOLE new message under `message`; the edit
        lands on that message's own identity, never on the envelope's ts.
        `message_deleted` names `deleted_ts`, and a deleted message is deleted —
        a mirror that keeps it is not a mirror. The delete does not cascade
        through thread membership: `parent`, `root` and `latestReply` are
        references without `mustExist` precisely so a hole is legal.
        `message_replied` is a reply-count notification about an existing parent
        and carries no new content; its nested message is applied like a change.
        """
        sub = msg.get("subtype") or ""
        if sub == "message_deleted":
            gone = msg.get("deleted_ts") or (msg.get("previous_message") or {}).get("ts")
            if gone:
                host.effects.delete(MESSAGE_TYPE,
                                    _msg_ref(host, aid, team, channel, gone))
            return None
        inner = msg.get("message")
        if isinstance(inner, dict) and inner.get("ts"):
            return _put_message(host, aid, team, channel, domain, inner)
        return None


    def _actors(msg):
        """Every USER id one message names, wherever it names it.

        `_unknown` collects the authors and reactors a later users.info fills in,
        but the ORDERING guarantee is different and stricter: a row that is
        referenced must exist before the reference lands. An editor, a pinner, a
        file's uploader and a bot's user are all referenced by a message and none
        of them was being minted — the reference resolved only when the same
        person happened to be an author somewhere else in the cut."""
        ids = set()
        for key in ("user", "parent_user_id", "inviter"):
            if msg.get(key):
                ids.add(msg[key])
        for holder in (msg.get("edited") or {}, msg.get("pinned_info") or {}):
            for key in ("user", "pinned_by"):
                if isinstance(holder, dict) and holder.get(key):
                    ids.add(holder[key])
        for f in msg.get("files") or []:
            if isinstance(f, dict) and f.get("user"):
                ids.add(f["user"])
        prof = msg.get("bot_profile") or {}
        if isinstance(prof, dict) and prof.get("user_id"):
            ids.add(prof["user_id"])
        for r in msg.get("reactions") or []:
            if isinstance(r, dict):
                ids |= {u for u in (r.get("users") or []) if u}
        ids |= {u for u in (msg.get("reply_users") or []) if u and u[:1] != "B"}
        ids |= set(MENTION_RE.findall(msg.get("text") or ""))
        return {i for i in ids if i and i[:1] in ("U", "W")}


    def _mint_actors(host, aid, team, msg):
        """A THIN row for every user this message names, before the message that
        names them. Identity and nothing else — a minted row carries what the
        payload carried, and the payload carried an id."""
        for uid in sorted(_actors(msg)):
            _put(host, USER_TYPE, _user_ref(host, aid, team, uid),
                 {"account": aid, "userId": uid})


    def _put_thin_profile(host, aid, team, msg):
        """`message.user_profile` — the author's profile as the message inlines it.

        T-021. This was dropped on the floor: nine real profile fields, on 1,466
        of the owner's messages, for authors a roster mint had left as an id. It
        lands through the presence-aware merge, because it is THIN — a patch
        replaces an object whole, and writing these nine as the profile would
        delete the forty-one `users.list` had filled in.
        """
        prof = msg.get("user_profile")
        uid = msg.get("user") or ""
        if not (uid and isinstance(prof, dict) and prof):
            return
        u = {"id": uid, "profile": prof}
        for key in THIN_PROFILE_USER_FIELDS:
            if key in prof:
                u[key] = prof[key]
        _put_user(host, aid, team, u, whole=False)


    def _put_message(host, aid, team, channel, domain, msg):
        """Every row a message REFERENCES is upserted before the message itself:
        its files, the bot identity behind a bot post, the users it names, and
        the embedded ROOT of a broadcast reply — which arrives whole inside the
        reply and used to be pointed at without ever being ingested."""
        if not msg.get("ts"):
            return None
        if (msg.get("subtype") or "") in MUTATION_SUBTYPES:
            return _mutate(host, aid, team, channel, domain, msg)
        if not _keep(msg):
            return None
        ts = msg["ts"]
        _mint_actors(host, aid, team, msg)
        _put_thin_profile(host, aid, team, msg)
        for f in msg.get("files") or []:
            if isinstance(f, dict) and f.get("id"):
                _put(host, FILE_TYPE, _file_ref(host, aid, team, f["id"]),
                     _file_props(host, aid, team, f))
        for fid in msg.get("x_files") or []:
            # Named, not embedded: a thin row so the reference resolves, and
            # nothing invented beyond the identity Slack supplied.
            if fid:
                _put(host, FILE_TYPE, _file_ref(host, aid, team, fid),
                     {"account": aid, "fileId": fid})
        if msg.get("bot_id"):
            _put(host, BOT_TYPE, _bot_ref(host, aid, team, msg["bot_id"]),
                 _bot_props(host, aid, team, msg["bot_id"], msg.get("bot_profile")))
        # A bot named only by `reply_users` still needs its row before the
        # reference at it lands.
        for bid in (msg.get("reply_users") or []):
            if bid and bid[:1] == "B":
                _put(host, BOT_TYPE, _bot_ref(host, aid, team, bid),
                     {"account": aid, "botId": bid})
        root = msg.get("root")
        if isinstance(root, dict) and root.get("ts") and root.get("ts") != ts:
            # ONE level, and only where the root is a different message: a
            # broadcast reply embeds its whole root, and `root` was a reference
            # at a row nothing ever wrote. Bounded by construction — a root has
            # no root of its own — and `root.root` is refused below.
            inner = dict(root)
            inner.pop("root", None)
            _put_message(host, aid, team, channel, domain, inner)
        eid = _msg_ref(host, aid, team, channel, ts)
        _put(host, MESSAGE_TYPE, eid,
             _message_props(host, aid, team, channel, domain, msg))
        return eid


    # ------------------------------------------------------------- the stamps

    def _mint_conv_actors(host, aid, team, c):
        """A conversation names a creator, a DM partner and the people who set
        its topic and purpose. All four are references and none was minted."""
        ids = {c.get("creator"), c.get("user")}
        for key in ("topic", "purpose"):
            block = c.get(key)
            if isinstance(block, dict):
                ids.add(block.get("creator"))
        for uid in sorted(i for i in ids if i and i[:1] in ("U", "W")):
            _put(host, USER_TYPE, _user_ref(host, aid, team, uid),
                 {"account": aid, "userId": uid})

    # PERMANENT failures. Slack has already answered the question and the answer
    # will not change by asking again: the channel is gone, the caller is not in
    # it, the token lacks the scope, the id does not resolve. Retrying one is not
    # resilience, it is three wasted calls — and worse, a retried unit of work
    # keeps `_pending` true forever, so the drain NEVER CONVERGES. The owner's
    # seed ran 120 rounds against 5,129 conversations whose info the raw pull did
    # not hold and ended `978 pending, [200 failed]` for exactly this reason.
    PERMANENT_ERRORS = {
        "channel_not_found", "not_in_channel", "is_archived", "user_not_found",
        "users_not_found", "missing_scope", "not_allowed_token_type",
        "no_permission", "thread_not_found", "message_not_found",
        "account_inactive", "invalid_arguments", "method_not_supported_for_channel_type",
        "team_access_not_granted", "restricted_action", "file_not_found",
        "file_deleted", "bot_not_found", "not_authed", "invalid_auth",
        # An EXPIRED OR MALFORMED CURSOR. Slack has already said the token is no
        # good; asking with the same token again gets the same answer, and the
        # walk that holds it restarts from the top on the next cold pass.
        "invalid_cursor",
    }


    def _put_file_info(host, aid, team, f):
        """One `files.info` answer, written whole.

        The GRANTS and the canvas creator name users, and a reference needs a
        row to land on (§1), so each is minted thin first.

        The SHARES do not: `channels`/`groups`/`ims` name conversations the
        walk may never touch — a file shared into a channel the token's user is
        not in — and minting one would invent a conversation row the mirror has
        no business holding. It is the same treatment `channelMentions` already
        gets: a reference without `mustExist`, pointing outside the cut by
        design."""
        for g in f.get("dm_mpdm_users_with_file_access") or []:
            if isinstance(g, dict) and g.get("user_id"):
                _put(host, USER_TYPE, _user_ref(host, aid, team, g["user_id"]),
                     {"account": aid, "userId": g["user_id"]})
        for uid in (f.get("editors") or []):
            if uid:
                _put(host, USER_TYPE, _user_ref(host, aid, team, uid),
                     {"account": aid, "userId": uid})
        if f.get("canvas_creator_id"):
            _put(host, USER_TYPE,
                 _user_ref(host, aid, team, f["canvas_creator_id"]),
                 {"account": aid, "userId": f["canvas_creator_id"]})
        _put(host, FILE_TYPE, _file_ref(host, aid, team, f["id"]),
             _file_props(host, aid, team, f))


    # ----------------------------------------------------------- live events
    #
    # Above, `slacksync`'s row makers and the two helpers only this body has
    # (`_reaction_props`, `_put_file_info`); below, this bundle's own events
    # code. The webhook trigger the operator writes delivers what the Socket
    # Mode bridge (cmd/slack-socket) forwards: one JSON body,
    # `{"version": 1, "events": [...]}`, each element the `payload` of an
    # `events_api` envelope (the outer event callback:
    # `team_id`, `event_id`, `event_time` and the `event` itself). Slack
    # redelivers an event nobody acknowledged and promises no order, so every
    # write below survives being repeated and reordered:
    #
    #   * a message is mint-then-patch at its (channel, ts) identity, and a
    #     payload whose edit is older than the row's is not written over it;
    #   * a reaction is never a delta: `reactions.get` answers the message's
    #     whole current set, and the row takes that set;
    #   * a pin, an archive or a roster change sets the one fact it names.
    #
    # Within one batch the events run in `event_ts` order, a repeated
    # `event_id` runs once, a message the batch deletes is not written by an
    # earlier or later event of the same batch, and one message's reactions
    # are read once.
    #
    # THE WALK STAYS THE COMPLETENESS PASS. The walk is the Slack bundle's
    # `slacksync`. This path writes mirror rows and
    # nothing else: no `conversationsync` row, no account property, no
    # cursor. A message posted while the socket was down is read by the next
    # history walk; a reaction, an edit or a delete on an older message is
    # seen only when a walk reads that message again.
    #
    # BOUNDED like the walk. One invocation starts no Slack call past
    # EVENT_PAGE_SECONDS or EVENT_PAGE_CALLS and no event past EVENT_PAGE_READS
    # record reads; it hands the rest of the batch to the next page. The whole
    # batch makes at most EVENT_BATCH_CALLS calls inside EVENT_BATCH_SECONDS,
    # inside the engine's two-minute drain. A 429 ends the batch's calls: the
    # events that need none are still applied, the ones that need one are
    # counted `limited` and left to the walk. A Slack refusal of one target is
    # that target's, and the batch goes on.

    EVENTS_VERSION = 1
    EVENT_PAGE_SECONDS = 10
    EVENT_PAGE_CALLS = 20
    EVENT_PAGE_READS = 450
    # Shorter than the walk's: one invocation may start a call at
    # EVENT_PAGE_SECONDS, and the function's timeout is thirty seconds.
    EVENT_HTTP_TIMEOUT = 10
    EVENT_BATCH_SECONDS = 75
    EVENT_BATCH_CALLS = 150
    EVENT_LOG_MAX = 20
    # A refusal of the TOKEN, not of one target: every later call of the batch
    # would get the same answer, so the first one ends the batch's calls the
    # way a 429 does, and the output says so. This bundle's token is a second
    # paste of the Slack bundle's, so it goes stale on its own when the first
    # is rotated.
    AUTH_ERRORS = {"invalid_auth", "not_authed", "account_inactive",
                   "token_revoked", "token_expired"}


    class _PageFull(Exception):
        """This invocation has spent its share of calls; the event that asked
        for one more runs again, from its start, on the next page."""


    class _Counted:
        """The host, with every record read counted against the page."""

        def __init__(self, host, ev):
            self._host = host
            self._ev = ev
            self.effects = host.effects
            self.ids = host.ids
            self.records = self

        def get(self, kind, eid):
            self._ev.reads += 1
            return self._host.records.get(kind, eid)

        def log(self, msg):
            self._ev.log(msg)


    def _ref_tail(value):
        """The record id a stored reference names. A read hands a reference
        back as `<kind>/<id>` or as `{"ref": "<kind>/<id>"}`, and a write takes
        the bare id."""
        if isinstance(value, dict):
            value = value.get("ref") or value.get("id")
        return str(value).rsplit("/", 1)[-1] if value else ""


    def _instant(value):
        """A stored or composed datetime as an aware datetime, or None. The
        engine may hand a datetime back in another spelling than the one
        written, so two are compared parsed, never as strings."""
        if not value:
            return None
        try:
            when = _dt.datetime.fromisoformat(str(value).replace("Z", "+00:00"))
        except ValueError:
            return None
        return when if when.tzinfo else when.replace(tzinfo=_dt.timezone.utc)


    def _throttled(props):
        """Is the account inside a Retry-After the walk was given?"""
        when = _instant(props.get("retryNotBefore"))
        return bool(when and _dt.datetime.now(_dt.timezone.utc) < when)


    class _Events:
        """One invocation of the events path: the account the batch lands
        on, what this invocation read and wrote, and the chain's own spend
        (`cur`, carried between pages)."""

        def __init__(self, host, base, token, aid, props, cur):
            self.raw = host
            self.host = _Counted(host, self)
            self.base, self.token, self.aid = base, token, aid
            self.cur = cur
            self.team_ref = _ref_tail(props.get("team"))
            self.owner_ref = _ref_tail(props.get("user"))
            self.filter = (props.get("conversationFilter") or "").strip().lower()
            self.members = bool(props.get("enabledMembers"))
            self.team = ""
            self.teams = {}
            self.reads = 0
            self.page_calls = 0
            self.page_started = time.time()
            self.logged = 0
            # Committed conversation rows by id, None for absent.
            self.convs = {}
            # Message rows this invocation read or wrote, by record id; reads
            # never see this invocation's own staged writes.
            self.msgs = {}
            self.deleted = set()
            row = self.host.records.get(TEAM_TYPE, self.team_ref) or {}
            url = (row.get("properties") or {}).get("url") or ""
            self.domain = urllib.parse.urlsplit(url).hostname or ""

        def log(self, msg):
            self.logged += 1
            if self.logged <= EVENT_LOG_MAX:
                self.raw.log(msg)

        def ours(self, tid):
            """Is this callback from the account's own workspace? The account
            holds the team as a reference, and a reference is a hash of the
            team id, so the candidate is hashed and compared."""
            if not isinstance(tid, str) or not tid:
                return False
            if tid not in self.teams:
                self.teams[tid] = _team_ref(self.raw, self.aid, tid, tid) == self.team_ref
            if self.teams[tid]:
                self.team = tid
            return self.teams[tid]

        def spent(self):
            return (self.reads >= EVENT_PAGE_READS
                    or self.page_calls >= EVENT_PAGE_CALLS
                    or time.time() - self.page_started >= EVENT_PAGE_SECONDS)

        def fetched(self, key):
            return key in (self.cur.get("fetched") or [])

        def fetch(self, key):
            self.cur["fetched"] = list(self.cur.get("fetched") or []) + [key]

        def call(self, method, params):
            """One Slack call, as (body, None), or (None, the outcome word the
            event is counted under)."""
            if self.cur.get("limited"):
                return None, "limited"
            if self.cur.get("authError"):
                return None, "unauthorized"
            if (self.cur.get("calls") or 0) >= EVENT_BATCH_CALLS or \
                    time.time() - (self.cur.get("startedAt") or 0) >= EVENT_BATCH_SECONDS:
                return None, "budget"
            if self.page_calls and (self.page_calls >= EVENT_PAGE_CALLS or
                                    time.time() - self.page_started >= EVENT_PAGE_SECONDS):
                raise _PageFull()
            self.page_calls += 1
            self.cur["calls"] = (self.cur.get("calls") or 0) + 1
            target = " ".join(str(v) for k, v in sorted(params.items()) if k != "full")
            try:
                return _call(self.base, self.token, method, params,
                             timeout=EVENT_HTTP_TIMEOUT), None
            except RateLimited as rl:
                self.cur["limited"] = True
                self.log("slack events: %s answered 429 (Retry-After %ss); the "
                         "batch makes no more Slack calls" % (method, rl.retry_after))
                return None, "limited"
            except Slack as e:
                if e.error in AUTH_ERRORS:
                    self.cur["authError"] = e.error
                    # Past the log cap on purpose: a stale token is the one
                    # failure the operator has to act on.
                    self.raw.log("slack events: Slack refused the userToken "
                                 "(%s) on %s; the batch makes no more Slack "
                                 "calls. Paste a current user token into the "
                                 "slacklive userToken secret" % (e.error, method))
                    return None, "unauthorized"
                self.log("slack events: %s %s refused: %s" % (method, target, e.error))
                return None, ("refused" if e.error in PERMANENT_ERRORS else "failed")
            except Exception as e:  # noqa: BLE001 - one target's failure is its own
                self.log("slack events: %s %s failed: %s"
                         % (method, target, str(e)[:REASON_MAX]))
                return None, "failed"

        def message(self, eid):
            """The message row's properties, None when there is none."""
            if eid not in self.msgs:
                row = self.host.records.get(MESSAGE_TYPE, eid)
                self.msgs[eid] = (row.get("properties") or {}) if row else None
            return self.msgs[eid]

        def conv_row(self, cid):
            """The conversation row's properties, None when there is none."""
            if cid not in self.convs:
                row = self.host.records.get(CONV_TYPE, _conv_ref(
                    self.host, self.aid, self.team, cid))
                self.convs[cid] = (row.get("properties") or {}) if row else None
            return self.convs[cid]

        def conversation(self, cid):
            """The conversation a message lands in, minted when the mirror has
            none yet (a DM opened since the last walk), or None when the
            account's `conversationFilter` keeps its messages out.

            `message.channel` is `mustExist`, so the row has to be there before
            the message. One conversations.info fills it in; without the call
            a thin row holds the id, and the walk fills it in later."""
            props = self.conv_row(cid)
            if props is None:
                h, aid, team = self.host, self.aid, self.team
                body, _word = self.call("conversations.info", {"channel": cid})
                c = (body or {}).get("channel") or {}
                if c.get("id") == cid:
                    _mint_conv_actors(h, aid, team, c)
                    props = _conv_props(h, aid, team, c)
                else:
                    props = {"account": aid, "conversationId": cid}
                _put(h, CONV_TYPE, _conv_ref(h, aid, team, cid), props)
                self.convs[cid] = props
            if self.filter and self.filter not in (props.get("name") or "").lower():
                return None
            return props


    def _event_batch(request):
        """The batch's callbacks, or None and why there are none."""
        body = request.get("body") or {}
        text = body.get("text")
        if text is None and body.get("base64"):
            try:
                text = base64.b64decode(body["base64"]).decode("utf-8")
            except (ValueError, UnicodeDecodeError):
                return None, "the request body is not UTF-8"
        if not text:
            return None, "the request carried no body"
        try:
            doc = json.loads(text)
        except ValueError:
            return None, "the request body is not JSON"
        if not isinstance(doc, dict) or doc.get("version") != EVENTS_VERSION:
            return None, ("the request body is not a version %d event batch"
                          % EVENTS_VERSION)
        events = doc.get("events")
        if not isinstance(events, list):
            return None, "the batch carries no `events` list"
        return [e for e in events if isinstance(e, dict)], None


    def _event_order(batch):
        """The batch in the order it runs: by `event_ts`, the sidecar's order
        breaking ties, each `event_id` once. Returns (callbacks, repeats)."""
        seen, out, repeats = set(), [], 0
        for i, cb in enumerate(batch):
            eid = cb.get("event_id")
            if isinstance(eid, str) and eid:
                if eid in seen:
                    repeats += 1
                    continue
                seen.add(eid)
            e = cb.get("event") if isinstance(cb.get("event"), dict) else {}
            when = 0.0
            for v in (e.get("event_ts"), cb.get("event_time")):
                try:
                    when = float(v)
                    break
                except (TypeError, ValueError):
                    continue
            out.append((when, i, cb))
        out.sort(key=lambda t: (t[0], t[1]))
        return [cb for _w, _i, cb in out], repeats


    def _event_of(ev, cb):
        """The inner event of one of the account's own callbacks, or None."""
        e = cb.get("event")
        if cb.get("type") != "event_callback" or not isinstance(e, dict):
            return None
        if not ev.ours(cb.get("team_id")):
            return None
        return e


    def _no_reactions(msg):
        """A message payload without its reactions. Only `reactions.get`
        writes them here: an event's copy is as old as the event, and a
        `reactions.get` this or an earlier batch wrote is newer."""
        out = {k: v for k, v in msg.items() if k != "reactions"}
        if isinstance(out.get("root"), dict):
            out["root"] = {k: v for k, v in out["root"].items() if k != "reactions"}
        return out


    def _not_older(row, payload):
        """May this payload be written over the row? Only an edit orders two
        versions of one message, so a payload is older when the row holds an
        edit and the payload holds none or an earlier one: a redelivered
        `message` event, or a `message_changed` that arrived late."""
        stored = _instant(((row or {}).get("edited") or {}).get("ts"))
        if stored is None:
            return True
        mine = _instant(_ts_iso(((payload.get("edited") or {}).get("ts"))))
        return mine is not None and mine >= stored


    def _overlay(row, props):
        """A row as it reads after a mint-then-patch of these properties: a
        value replaces, None removes, and what the write left out stays."""
        out = dict(row or {})
        for key, val in props.items():
            if val is None:
                out.pop(key, None)
            else:
                out[key] = val
        return out


    def _ev_put_message(ev, channel, payload):
        h, aid, team = ev.host, ev.aid, ev.team
        _put_message(h, aid, team, channel, ev.domain, payload)
        for msg in (payload.get("root"), payload):
            if isinstance(msg, dict) and msg.get("ts") and _keep(msg):
                eid = _msg_ref(h, aid, team, channel, msg["ts"])
                ev.msgs[eid] = _overlay(ev.message(eid), _message_props(
                    h, aid, team, channel, ev.domain, msg))


    def _ev_message(ev, e):
        h, aid, team = ev.host, ev.aid, ev.team
        channel = e.get("channel")
        sub = e.get("subtype") or ""
        if not isinstance(channel, str) or not channel:
            return "skipped"
        if sub == "message_deleted":
            gone = e.get("deleted_ts") or (e.get("previous_message") or {}).get("ts")
            if not gone:
                return "skipped"
            eid = _msg_ref(h, aid, team, channel, gone)
            # A delete of a row that does not exist fails the whole delivery,
            # and a message the mirror never held, or already deleted, has
            # nothing to delete.
            if ev.message(eid) is None:
                return "skipped"
            h.effects.delete(MESSAGE_TYPE, eid)
            ev.msgs[eid] = None
            return "applied"
        msg = e
        if sub in MUTATION_SUBTYPES:
            msg = e.get("message")
            if not isinstance(msg, dict):
                return "skipped"
        ts = msg.get("ts")
        if not ts or (channel, ts) in ev.deleted:
            return "skipped"
        if ev.conversation(channel) is None:
            return "skipped"
        payload = _no_reactions(msg)
        if not _not_older(ev.message(_msg_ref(h, aid, team, channel, ts)), payload):
            return "stale"
        _ev_put_message(ev, channel, payload)
        _ev_thread(ev, channel, payload)
        return "applied"


    def _ev_thread(ev, channel, msg):
        """A reply refreshes what its parent says about replies, where that is
        exact without a call: the newest reply and its instant, the reply's
        author among `replyUsers`, and the parent's own thread self-reference.
        `replyCount` and `replyUsersCount` are counts an event cannot keep
        exactly under redelivery, and wait for the walk."""
        thread_ts, ts = msg.get("thread_ts"), msg.get("ts")
        if not thread_ts or thread_ts == ts or (channel, thread_ts) in ev.deleted:
            return
        h, aid, team = ev.host, ev.aid, ev.team
        peid = _msg_ref(h, aid, team, channel, thread_ts)
        row = ev.message(peid)
        if row is None:
            return
        patch = {}
        at = _ts_iso(ts)
        known = _instant(row.get("latestReplyAt"))
        if at and (known is None or _instant(at) > known):
            patch["latestReply"] = _msg_ref(h, aid, team, channel, ts)
            patch["latestReplyAt"] = at
        uid = msg.get("user") or ""
        if uid[:1] in ("U", "W"):
            users = [_ref_tail(r) for r in (row.get("replyUsers") or [])]
            ref = _user_ref(h, aid, team, uid)
            if ref not in users:
                patch["replyUsers"] = users + [ref]
        if _ref_tail(row.get("parent")) != peid:
            patch["parent"] = peid
        if patch:
            h.effects.patch(MESSAGE_TYPE, peid, properties=patch)
            ev.msgs[peid] = _overlay(row, patch)


    def _ev_reaction(ev, e):
        """`reaction_added` and `reaction_removed`: the message's whole set,
        read now. A reaction on a file or a file comment has no message row to
        hold it and is skipped."""
        h, aid, team = ev.host, ev.aid, ev.team
        item = e.get("item") or {}
        if item.get("type") != "message":
            return "skipped"
        channel, ts = item.get("channel"), item.get("ts")
        if not (channel and ts) or (channel, ts) in ev.deleted:
            return "skipped"
        key = "reactions %s/%s" % (channel, ts)
        if ev.fetched(key):
            return "repeated"
        if ev.conversation(channel) is None:
            return "skipped"
        body, word = ev.call("reactions.get", {"channel": channel,
                                               "timestamp": ts, "full": "true"})
        if body is None:
            return word
        ev.fetch(key)
        msg = body.get("message") or {}
        if msg.get("ts") != ts:
            return "skipped"
        reactions = msg.get("reactions") or []
        eid = _msg_ref(h, aid, team, channel, ts)
        row = ev.message(eid)
        if row is None:
            # A message the mirror never held: the answer is the whole
            # message, so it lands whole, with its reactions present even when
            # there are none.
            _ev_put_message(ev, channel, dict(msg, reactions=reactions))
            _ev_thread(ev, channel, msg)
            return "applied"
        _mint_actors(h, aid, team, {"reactions": reactions})
        shaped = _reaction_props(h, aid, team, reactions)
        h.effects.patch(MESSAGE_TYPE, eid, properties={"reactions": shaped})
        ev.msgs[eid] = _overlay(row, {"reactions": shaped})
        return "applied"


    def _ev_pin(ev, e, added):
        """`pin_added` and `pin_removed` on a message: this conversation joins
        or leaves the row's `pinnedTo`. A pin on a message the mirror never
        held writes the message the event carries first."""
        h, aid, team = ev.host, ev.aid, ev.team
        item = e.get("item") or {}
        if item.get("type") != "message":
            return "skipped"
        channel = item.get("channel") or e.get("channel_id") or ""
        msg = item.get("message") or {}
        ts = msg.get("ts") or ""
        if not (channel and ts) or (channel, ts) in ev.deleted:
            return "skipped"
        eid = _msg_ref(h, aid, team, channel, ts)
        row = ev.message(eid)
        if row is None:
            if not added or ev.conversation(channel) is None:
                return "skipped"
            _ev_put_message(ev, channel, _no_reactions(msg))
            row = ev.message(eid) or {}
        cref = _conv_ref(h, aid, team, channel)
        pinned = [_ref_tail(r) for r in (row.get("pinnedTo") or [])]
        patch = {}
        if added:
            if cref not in pinned:
                pinned.append(cref)
            info = {}
            by = item.get("created_by") or e.get("user") or ""
            if by[:1] in ("U", "W"):
                _put(h, USER_TYPE, _user_ref(h, aid, team, by),
                     {"account": aid, "userId": by})
                info["pinnedBy"] = _user_ref(h, aid, team, by)
            when = _epoch_iso(item.get("created")) or _ts_iso(e.get("event_ts"))
            if when:
                info["pinnedTs"] = when
            if info:
                patch["pinnedInfo"] = info
        else:
            pinned = [r for r in pinned if r != cref]
            if not pinned:
                patch["pinnedInfo"] = None
        patch["pinnedTo"] = pinned or None
        h.effects.patch(MESSAGE_TYPE, eid, properties=patch)
        ev.msgs[eid] = _overlay(row, patch)
        return "applied"


    def _ev_conversation(ev, e):
        """`channel_created`, `channel_rename` and `group_rename` carry the
        conversation as an object; what it carries is written, and a field
        it leaves out is left as the walk wrote it."""
        h, aid, team = ev.host, ev.aid, ev.team
        c = e.get("channel")
        if not isinstance(c, dict) or not c.get("id"):
            return "skipped"
        row = ev.conv_row(c["id"])
        _mint_conv_actors(h, aid, team, c)
        props = _conv_props(h, aid, team, c)
        _put(h, CONV_TYPE, _conv_ref(h, aid, team, c["id"]), props)
        ev.convs[c["id"]] = _overlay(row, props)
        return "applied"


    def _ev_archive(ev, e, archived):
        h, aid, team = ev.host, ev.aid, ev.team
        cid = e.get("channel")
        if isinstance(cid, dict):
            cid = cid.get("id")
        if not isinstance(cid, str) or not cid:
            return "skipped"
        row = ev.conv_row(cid)
        props = {"account": aid, "conversationId": cid, "isArchived": archived}
        _put(h, CONV_TYPE, _conv_ref(h, aid, team, cid), props)
        ev.convs[cid] = _overlay(row, props)
        return "applied"


    def _ev_member(ev, e, joined):
        """`member_joined_channel` and `member_left_channel`. The owner's own
        join or leave sets the conversation's `isMember`; anyone's moves the
        `members` roster where the row holds one, which it does only when the
        account walks rosters. A conversation the mirror does not hold yet is
        left to the walk."""
        h, aid, team = ev.host, ev.aid, ev.team
        cid, uid = e.get("channel"), e.get("user")
        if not (isinstance(cid, str) and cid and isinstance(uid, str) and uid):
            return "skipped"
        row = ev.conv_row(cid)
        if row is None:
            return "skipped"
        uref = _user_ref(h, aid, team, uid)
        patch = {}
        if uref == ev.owner_ref and row.get("isMember") is not joined:
            patch["isMember"] = joined
        if ev.members and isinstance(row.get("members"), list):
            members = [_ref_tail(m) for m in row["members"]]
            if joined and uref not in members:
                patch["members"] = members + [uref]
            elif not joined and uref in members:
                patch["members"] = [m for m in members if m != uref] or None
        if not patch:
            return "skipped"
        if joined and uid[:1] in ("U", "W"):
            _put(h, USER_TYPE, uref, {"account": aid, "userId": uid})
        h.effects.patch(CONV_TYPE, _conv_ref(h, aid, team, cid), properties=patch)
        ev.convs[cid] = _overlay(row, patch)
        return "applied"


    def _ev_user(ev, e):
        """`user_change` and `team_join` carry the whole member object, as
        users.list does."""
        u = e.get("user")
        if not isinstance(u, dict) or not u.get("id"):
            return "skipped"
        _put_user(ev.host, ev.aid, ev.team, u, whole=True)
        return "applied"


    def _ev_file(ev, e):
        """`file_shared` and `file_change` name the file and little else, so
        the file is read from `files.info`, once per batch."""
        fid = e.get("file_id") or (e.get("file") or {}).get("id")
        if not isinstance(fid, str) or not fid:
            return "skipped"
        key = "file " + fid
        if ev.fetched(key):
            return "repeated"
        body, word = ev.call("files.info", {"file": fid})
        if body is None:
            return word
        ev.fetch(key)
        f = body.get("file") or {}
        if f.get("id") != fid:
            return "skipped"
        _put_file_info(ev.host, ev.aid, ev.team, f)
        return "applied"


    def _ev_file_deleted(ev, e):
        """`file_deleted` marks a mirrored file the way a deleted file's embed
        does when the walk reads it, `mode: tombstone`; the row stays, as the
        walk keeps it. A file the mirror never held is not minted."""
        h, aid, team = ev.host, ev.aid, ev.team
        fid = e.get("file_id") or (e.get("file") or {}).get("id")
        if not isinstance(fid, str) or not fid:
            return "skipped"
        eid = _file_ref(h, aid, team, fid)
        if not h.records.get(FILE_TYPE, eid):
            return "skipped"
        _put(h, FILE_TYPE, eid, {"account": aid, "fileId": fid, "mode": "tombstone"})
        return "applied"


    EVENT_HANDLERS = {
        "message": _ev_message,
        "reaction_added": _ev_reaction,
        "reaction_removed": _ev_reaction,
        "pin_added": lambda ev, e: _ev_pin(ev, e, True),
        "pin_removed": lambda ev, e: _ev_pin(ev, e, False),
        "channel_created": _ev_conversation,
        "channel_rename": _ev_conversation,
        "group_rename": _ev_conversation,
        "channel_archive": lambda ev, e: _ev_archive(ev, e, True),
        "group_archive": lambda ev, e: _ev_archive(ev, e, True),
        "channel_unarchive": lambda ev, e: _ev_archive(ev, e, False),
        "group_unarchive": lambda ev, e: _ev_archive(ev, e, False),
        # The walk keeps a deleted conversation's row and its messages: the
        # conversation leaves conversations.list and Slack refuses its
        # history. The event changes nothing the walk would not.
        "channel_deleted": lambda ev, e: "skipped",
        "group_deleted": lambda ev, e: "skipped",
        "member_joined_channel": lambda ev, e: _ev_member(ev, e, True),
        "member_left_channel": lambda ev, e: _ev_member(ev, e, False),
        "user_change": _ev_user,
        "team_join": _ev_user,
        "file_shared": _ev_file,
        "file_change": _ev_file,
        "file_deleted": _ev_file_deleted,
    }


    def _events(input, host, accounts, token, base):
        """One webhook delivery: a batch of Events API callbacks, applied to
        the one live account's mirror rows. See "live events" above."""
        request = (input.get("envelope") or {}).get("request")
        if not isinstance(request, dict):
            # An authenticated wake of the trigger fires with no request.
            return {"output": {"skipped": "no request"}}
        batch, why = _event_batch(request)
        if why:
            host.log("slack events: %s; nothing applied" % why)
            return {"output": {"skipped": why}}
        live = sorted(aid for aid, a in accounts.items() if _wants(a))
        if not live:
            host.log("slack events: no account has enabledMessages on; "
                     "nothing applied")
            return {"output": {"skipped": "no account"}}
        aid = live[0]
        props = accounts[aid].get("properties") or {}
        if props.get("syncPaused"):
            return {"output": {"skipped": "paused"}}
        if not _ref_tail(props.get("team")):
            # The account learns its workspace from the walk's auth.test.
            host.log("slack events: the account has not synced yet, so its "
                     "workspace is not known; nothing applied")
            return {"output": {"skipped": "not synced"}}
        resume = host.page.resume()
        cur = resume if isinstance(resume, dict) and resume.get("events") else {
            "events": EVENTS_VERSION, "at": 0, "calls": 0,
            "startedAt": time.time(), "limited": _throttled(props),
            "fetched": [], "counts": {}}
        ev = _Events(host, base, token, aid, props, cur)
        callbacks, repeats = _event_order(batch)
        for cb in callbacks:
            e = _event_of(ev, cb)
            if e and e.get("type") == "message" and e.get("subtype") == "message_deleted":
                gone = e.get("deleted_ts") or (e.get("previous_message") or {}).get("ts")
                if e.get("channel") and gone:
                    ev.deleted.add((e["channel"], gone))
        counts = cur["counts"]
        i = cur["at"]
        while i < len(callbacks):
            if i > cur["at"] and ev.spent():
                break
            cb = callbacks[i]
            e = cb.get("event") if isinstance(cb.get("event"), dict) else {}
            try:
                handler = EVENT_HANDLERS.get(e.get("type") or "")
                if cb.get("type") != "event_callback" or not e:
                    word = "ignored"
                elif not ev.ours(cb.get("team_id")):
                    word = "foreign"
                else:
                    word = handler(ev, e) if handler else "ignored"
            except _PageFull:
                break
            except Exception as err:  # noqa: BLE001 - one event's failure is its own
                ev.log("slack events: a %s event (%s) failed: %s: %s"
                       % (e.get("type") or "?", cb.get("event_id") or "no id",
                          type(err).__name__, str(err)[:REASON_MAX]))
                word = "failed"
            counts[word] = counts.get(word, 0) + 1
            i += 1
        if i < len(callbacks):
            return {"more": host.page.more(dict(cur, at=i))}
        out = dict(counts, events=len(callbacks), repeats=repeats,
                   calls=cur.get("calls") or 0, rateLimited=bool(cur.get("limited")))
        if cur.get("authError"):
            out["authError"] = cur["authError"]
        host.log("slack events: %d events, %d repeated: %s; %d Slack calls%s%s"
                 % (len(callbacks), repeats,
                    ", ".join("%s %d" % kv for kv in sorted(counts.items())) or "none",
                    out["calls"], ", rate limited" if out["rateLimited"] else "",
                    ", token refused (%s)" % out["authError"] if "authError" in out else ""))
        if ev.logged > EVENT_LOG_MAX:
            host.log("slack events: %d more lines not logged" % (ev.logged - EVENT_LOG_MAX))
        return {"output": out}


    # ------------------------------------------------------------- the account

    # The Slack bundle allows one live account per token, and so does this body:
    # the lexicographically-first account with `enabledMessages` on.
    ACCOUNT_PAGE = 50


    def _accounts(host):
        """The Slack bundle's account rows, by id. They are another package's
        kind, so they never arrive on config.accounts: the body reads them."""
        page = host.records.list([ACCOUNT_TYPE], first=ACCOUNT_PAGE) or {}
        return {a["id"]: a for a in (page.get("records") or []) if a.get("id")}


    def main(input, host):
        settings = (input.get("config") or {}).get("settings") or {}
        token = settings.get("userToken") or ""
        base = (settings.get("apiBase") or DEFAULT_API).rstrip("/")

        if not token:
            host.log("slack events: the userToken secret is empty; fill it in "
                     "with the Slack bundle's user token. Nothing applied")
            return {"output": {"skipped": "unconfigured"}}
        if not _pinned(base):
            raise RuntimeError(
                "slack events: apiBase %r is not a pinned origin (https on a "
                "slack.com host, or loopback); refusing to send the user token"
                % base)
        return _events(input, host, _accounts(host), token, base)
