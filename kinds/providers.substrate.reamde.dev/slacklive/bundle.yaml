# The Slack live events bundle: Slack's Events API, delivered over Socket Mode,
# applied to the Slack bundle's mirror rows.
#
# OPT-IN, AND NO WEBHOOK SHIPPED. The Slack bundle
# (providers.substrate.reamde.dev/slack) polls; it sees a reaction, an edit or
# a delete only while the message is within a day of its conversation's
# history cursor. This bundle closes that gap for a deployment that runs the
# Socket Mode bridge (cmd/slack-socket), which holds Slack's websocket and
# POSTs batches of callbacks to a webhook trigger that fires `slackevents`.
# The bundle ships NO trigger: the webhook door checks a key only when the
# trigger declares one, so a shipped keyless record is one click (the
# console's Resume) away from an open endpoint that writes Slack rows. The
# operator writes the trigger record, key included, in one write (README.md).
#
# NO KIND OF ITS OWN. The rows it writes are the Slack bundle's, which this
# bundle `requires:`. The one function, `slackevents`, writes them under its
# own actor and reads the Slack account it lands on, because another
# package's account never arrives on its config.
#
# ITS OWN TOKEN. An injected input must be the bundle's own kind, so the
# Slack bundle's `config` record (the user token) cannot reach this function.
# The token is this bundle's `userToken` secret (settings.yaml): the same
# xoxp- user token, pasted a second time.
#
# Install:   the Slack bundle first, then
#            substratectl apply -f bundle.yaml -f settings.yaml
# Configure: fill in the `userToken` secret.
# Enable:    write the keyed `slack-live-events` trigger record (README.md).
# ---- the owned package ----------------------------------------------------
kind: substrate.reamde.dev/core/package
metadata:
  id: providers.substrate.reamde.dev/slacklive
data:
  authority: providers.substrate.reamde.dev
  package: slacklive
  # 1: the live events path of Slack bundle version 21, moved out of
  # `slacksync` into this bundle's `slackevents` (Slack bundle version 22).
  version: 1
---
# ---- the bundle document: the install unit --------------------------------
kind: substrate.reamde.dev/core/bundle
metadata:
  id: providers.substrate.reamde.dev/slacklive
data:
  authority: providers.substrate.reamde.dev
  package: slacklive
  description: >-
    Applies Slack's live events (edits, deletes, reactions and new messages)
    to the Slack bundle's copy within seconds, through the Socket Mode bridge.
  # The Slack bundle declares every kind `slackevents` reads and writes. The
  # floor is the version that took the live events path out of `slacksync`.
  requires:
    - providers.substrate.reamde.dev/slack
  requiresAtLeast:
    providers.substrate.reamde.dev/slack: 22
  # NO declared input: the token and the API origin are the `secret` and
  # `setting` records this bundle ships (settings.yaml), injected under
  # config.settings by the id prefix they carry.
  installs:
    - providers.substrate.reamde.dev/slacklive/slackevents
---
# ---- function: slackevents ------------------------------------------------
# One webhook delivery is one batch, `{"version": 1, "events": [...]}`, each
# element the `payload` of a Socket Mode `events_api` envelope. The body pages
# itself inside the function timeout. Its row makers are a COPY of
# `slacksync`'s in ../slack/bundle.yaml (the body's docstring says which);
# keep the two in step.
kind: substrate.reamde.dev/core/function
metadata:
  id: providers.substrate.reamde.dev/slacklive/slackevents
data:
  authority: providers.substrate.reamde.dev
  package: slacklive
  description: >-
    Apply one batch of Slack Events API callbacks, as the Socket Mode bridge
    forwards them, to the Slack bundle's mirror rows: messages, edits, deletes,
    thread replies, reactions (read whole through reactions.get), pins, conversations,
    members, users and files. Moves no sync cursor.
  runtime: python
  timeout: PT30S
  permissions:
    writes:
      - providers.substrate.reamde.dev/slack/team
      - providers.substrate.reamde.dev/slack/user
      - providers.substrate.reamde.dev/slack/conversation
      - providers.substrate.reamde.dev/slack/message
      - providers.substrate.reamde.dev/slack/bot
      - providers.substrate.reamde.dev/slack/file
    reads:
      kinds:
        # The account the batch lands on: its workspace, its owner, its
        # toggles and its Retry-After deadline.
        - providers.substrate.reamde.dev/slack/account
        # The team row's `url` is the host a permalink is built from.
        - providers.substrate.reamde.dev/slack/team
        - providers.substrate.reamde.dev/slack/conversation
        - providers.substrate.reamde.dev/slack/message
        - providers.substrate.reamde.dev/slack/user
        - providers.substrate.reamde.dev/slack/file
      budgets:
        calls: 600
        rows: 4000
    network:
      - slack.com
      - api.slack.com
      - 127.0.0.1
      - localhost
  source: |
    # /// script
    # requires-python = ">=3.11"
    # dependencies = [
    #   "requests==2.34.2",
    # ]
    # ///
    """Slack live events: one batch of Events API callbacks applied to the Slack
    bundle's mirror rows.

    A webhook trigger the operator writes (README.md) delivers the batch the
    Socket Mode bridge forwards, `{"version": 1, "events": [...]}`, each element the
    `payload` of an `events_api` envelope. The rows are the Slack bundle's
    (providers.substrate.reamde.dev/slack): this bundle declares no kind of its
    own, reads the Slack account it lands on, and writes no cursor, no
    `conversationsync` row and no account property, so the Slack bundle's walk
    stays the pass that covers what the socket missed.

    The user token arrives as the bundle's own `userToken` secret
    (config.settings.userToken): an injected input must be the bundle's own kind,
    so the Slack bundle's connector record never reaches this body. It leaves
    this body ONLY toward a pinned origin, https on a slack.com host or loopback
    (the test seam).

    COPIED FROM `slacksync`. A bundle function is one self-contained module, so
    the row makers below (ids, `_put`, the message, conversation, user and file
    shapes, the Slack call) are copies of the ones in
    kinds/providers.substrate.reamde.dev/slack/bundle.yaml, function `slacksync`.
    The two must write the same rows under the same ids. Every top-level name
    the two bodies share is identical except `_get` and `_call` (they take a
    timeout here), `_message_props` (it builds reactions through
    `_reaction_props`, which only this body has) and `main`;
    TestSlackLiveCopyMatchesSlacksync in internal/providertest fails on any
    other difference, so a change to a row maker there is made here too.
    """
    import base64
    import datetime as _dt
    import http.cookiejar
    import json
    import re
    import time
    import urllib.parse

    import requests

    TEAM_TYPE = "providers.substrate.reamde.dev/slack/team"
    USER_TYPE = "providers.substrate.reamde.dev/slack/user"
    CONV_TYPE = "providers.substrate.reamde.dev/slack/conversation"
    MESSAGE_TYPE = "providers.substrate.reamde.dev/slack/message"
    FILE_TYPE = "providers.substrate.reamde.dev/slack/file"
    BOT_TYPE = "providers.substrate.reamde.dev/slack/bot"
    ACCOUNT_TYPE = "providers.substrate.reamde.dev/slack/account"

    DEFAULT_API = "https://slack.com"
    HTTP_TIMEOUT = 20
    REASON_MAX = 200
    # What "come back later" means when Slack does not say. Slack's own guidance
    # is one second per tier-3 call; a minute is the conservative read, and the
    # cap stops a hostile or mistyped header from parking the account for a week.
    DEFAULT_RETRY_AFTER = 60
    MAX_RETRY_AFTER = 3600

    # Slack's own mention encodings, decoded losslessly into references: a user
    # mention and a channel link. The text itself is kept verbatim.
    MENTION_RE = re.compile(r"<@([UWB][A-Z0-9]+)(?:\|[^>]*)?>")
    CHANNEL_RE = re.compile(r"<#([CDG][A-Z0-9]+)(?:\|[^>]*)?>")

    # MUTATION ENVELOPES, not messages. `message_changed` and `message_deleted`
    # carry no identity of their own: their `ts` is the event's, and the message
    # they speak about is nested (`message.ts`) or named (`deleted_ts`). They are
    # consumed by `_mutate`, never mirrored as rows — writing the envelope would
    # mint a message that never existed and leave the real one stale.
    #
    # EVERYTHING ELSE IS A MESSAGE. The denylist used to hold twenty subtypes —
    # joins, leaves, topic and purpose changes, archives, bot adds, pins,
    # posting-permission changes — and Slack persists every one of them in
    # `conversations.history`. A mirror that drops them is not a mirror of the
    # conversation; it is a mirror of its prose. `channel_topic` is how the
    # mirror knows who set the topic and when.
    MUTATION_SUBTYPES = {"message_changed", "message_deleted", "message_replied"}


    # ---------------------------------------------------------------- origin

    def _pinned(base):
        u = urllib.parse.urlsplit(base)
        host = (u.hostname or "").lower()
        if host in ("127.0.0.1", "localhost", "::1"):
            return True
        return u.scheme == "https" and (
            host == "slack.com" or host.endswith(".slack.com"))


    _TS_RE = re.compile(r"\s*(-?\d+)(?:\.(\d*))?\s*$")


    def _exact(whole, micros):
        """One instant, built from INTEGERS. `float(ts)` then
        `fromtimestamp(...)` is two lossy steps — a binary float cannot hold
        `1789491980.100249`, and rounding the microseconds away (or off by one)
        makes every Slack instant in the mirror wrong by up to a second while the
        `ts` beside it stays exact. Slack's `ts` is six fractional digits and
        nothing else, so the two halves are converted separately and never meet a
        float."""
        try:
            base = _dt.datetime.fromtimestamp(whole, _dt.timezone.utc)
        except (OverflowError, OSError, ValueError):
            return None
        return base.replace(microsecond=micros).isoformat()


    def _ts_iso(ts):
        """A Slack `ts` (`<seconds>.<6 digits>`) as an exact instant."""
        m = _TS_RE.match(str(ts)) if ts is not None else None
        if not m:
            return None
        frac = (m.group(2) or "")[:6].ljust(6, "0")
        return _exact(int(m.group(1)), int(frac or 0))


    def _epoch_iso(v):
        """Epoch SECONDS as Slack sends them; 0 means never and is not written.

        Slack writes a never-set epoch as `0`, which is a SENTINEL and not the
        first instant of 1970. A field that must be able to CLEAR says so by
        returning the sentinel marker, not by falling back to absence."""
        m = _TS_RE.match(str(v)) if v is not None else None
        if not m:
            return None
        whole = int(m.group(1))
        if whole <= 0 and not (m.group(2) or "").strip("0"):
            return None
        frac = (m.group(2) or "")[:6].ljust(6, "0")
        return _exact(whole, int(frac or 0))


    def _ms_iso(v):
        """Epoch MILLISECONDS — conversations.list `updated`, Slack's one
        departure from seconds. Split, never divided: `n / 1000.0` loses the
        millisecond on a large epoch."""
        try:
            n = int(v)
        except (TypeError, ValueError):
            return None
        if n <= 0:
            return None
        return _exact(n // 1000, (n % 1000) * 1000)


    def _wants(acct):
        return bool((acct.get("properties") or {}).get("enabledMessages"))


    # --------------------------------------------------------------- the API

    class Slack(Exception):
        """A Slack-reported failure, carrying the error word Slack used.

        `error` stays the bare word: the permanent and refused sets, the
        failure classes and the refusal keys all match on it. `detail` rides
        the message alone."""

        def __init__(self, method, error, detail=""):
            super().__init__("%s: %s%s" % (method, error, detail))
            self.method = method
            self.error = error


    class RateLimited(Exception):
        """Slack asked us to come back later, and SAID WHEN.

        Slack requires `Retry-After` to be honoured. Throwing the header away and
        relying on the next scheduled tick retries either far too soon (a minute
        cadence against a 30-second hold) or uselessly late (an hour against a
        two-second one). The seconds ride on the exception, are persisted as a
        not-before deadline on the account, and `_due` refuses to start before
        it — for every call, `auth.test` included."""

        def __init__(self, method, retry_after=0):
            super().__init__("%s: rate limited" % method)
            self.method = method
            self.retry_after = int(retry_after or 0)

        def not_before(self):
            secs = self.retry_after if self.retry_after > 0 else DEFAULT_RETRY_AFTER
            return (_dt.datetime.now(_dt.timezone.utc)
                    + _dt.timedelta(seconds=min(secs, MAX_RETRY_AFTER))).isoformat()


    # ONE SESSION PER PROCESS. The runner execs this module once and calls
    # main() for every invocation of a drain, so a module-level session keeps
    # its HTTPS connection to Slack alive across the hundreds of invocations a
    # drain spends, where a bare requests.get paid a TCP and TLS handshake per
    # call. The token rides each request's own header, never the session, and
    # the cookie jar accepts nothing, so no account's call carries state from
    # another account's.
    _SESSION = requests.Session()
    _SESSION.cookies.set_policy(http.cookiejar.DefaultCookiePolicy(allowed_domains=[]))


    def _get(url, params, headers, timeout=HTTP_TIMEOUT):
        try:
            return _SESSION.get(url, params=params, timeout=timeout, headers=headers)
        except requests.exceptions.ConnectionError as e:
            # A kept-alive connection Slack closed between invocations fails on
            # its first reuse; the call is a read, so one fresh try is safe. A
            # timeout is not a closed connection and is not retried.
            if isinstance(e, requests.exceptions.Timeout):
                raise
            return _SESSION.get(url, params=params, timeout=timeout, headers=headers)


    def _call(base, token, method, params=None, timeout=HTTP_TIMEOUT):
        # ONE Slack Web API call. GET with the token in the Authorization header —
        # never in the query, so no URL a proxy or a recording holds can carry the
        # credential.
        url = base + "/api/" + method
        resp = _get(url, params or {}, {"Authorization": "Bearer " + token,
                                         "Accept": "application/json"}, timeout)
        if resp.status_code == 429:
            raise RateLimited(method, _retry_after(resp))
        if resp.status_code >= 400:
            raise RuntimeError("slack %s: HTTP %d %s"
                               % (method, resp.status_code, resp.text[:200]))
        body = resp.json()
        if not body.get("ok"):
            err = body.get("error") or "unknown"
            if err == "ratelimited":
                raise RateLimited(method, _retry_after(resp))
            raise Slack(method, err, _scopes(body))
        return body


    def _scopes(body):
        """On `missing_scope`, the `needed` and `provided` scopes Slack sends
        beside the error, as ` (needed a, provided b)`: the word alone does not
        say which scope to grant. Either field may be absent."""
        if body.get("error") != "missing_scope":
            return ""
        scopes = ["%s %s" % (k, body[k]) for k in ("needed", "provided")
                  if body.get(k)]
        return " (%s)" % ", ".join(scopes) if scopes else ""


    def _retry_after(resp):
        """Slack's own answer to "when may I come back". A body-level
        `ratelimited` carries the header too."""
        try:
            return int((resp.headers or {}).get("Retry-After") or 0)
        except (TypeError, ValueError):
            return 0


    # ------------------------------------------------------- ids and effects

    def _rid(host, aid, key):
        return host.ids.external("slack", aid, key)


    def _user_ref(host, aid, team, uid):
        """A reference at a mirrored user, composed from its provider key."""
        return _rid(host, aid, "%s/%s" % (team, uid)) if uid else None


    def _team_ref(host, aid, team, tid):
        """A team reference takes the same four arguments as every other maker so
        one list helper serves them all; the workspace of the row is not part of a
        team's own key."""
        return _rid(host, aid, tid) if tid else None


    def _conv_ref(host, aid, team, cid):
        return _rid(host, aid, "%s/%s" % (team, cid)) if cid else None


    def _msg_ref(host, aid, team, cid, ts):
        return _rid(host, aid, "%s/%s/%s" % (team, cid, ts)) if (cid and ts) else None


    def _file_ref(host, aid, team, fid):
        return _rid(host, aid, "%s/%s" % (team, fid)) if fid else None


    def _bot_ref(host, aid, team, bid):
        return _rid(host, aid, "%s/%s" % (team, bid)) if bid else None


    def _refs(host, aid, team, ids, maker):
        """A list of references, de-duplicated, in the order the API gave them."""
        out = []
        for i in ids or []:
            r = maker(host, aid, team, i)
            if r and r not in out:
                out.append(r)
        return out


    def _live(props):
        """The same properties with the explicit deletes removed — what a MINT is
        allowed to carry, since a create cannot delete a property it never had."""
        return {k: v for k, v in props.items() if v is not None}


    def _self_free(eid, props):
        """The same properties with any reference at THIS row removed.

        Slack sets `thread_ts == ts` on a thread's own parent, and that supplied
        self-reference is a fact worth keeping — but the engine checks a
        reference's target at write time, and at the moment of the CREATE the row
        does not exist yet. So the mint goes without it and the patch, which runs
        once the row is there, puts it back."""
        return {k: v for k, v in props.items() if v != eid}


    def _put(host, typ, eid, props):
        """Mint-then-patch. The mint is if_absent because a provider key is
        immutable; the patch moves only what this payload carried, so a thinner
        read never erases what a fuller one filled in.

        ABSENT and NULL are different, and both are load-bearing. A field the
        payload did not carry is not in `props` at all. A field the payload
        carried as `null` — or as an empty string, list or map — IS in `props`,
        as `None` or as the empty value, because Slack saying "this status is
        now cleared" has to clear it. Only the patch carries the deletes."""
        host.effects.put(typ, eid, properties=_self_free(eid, _live(props)),
                         if_absent=True)
        host.effects.patch(typ, eid, properties=props)


    # --------------------------------------------------------------- the rows

    # profile: (property, API key, converter). `_C_*` are the converters that are
    # not a straight copy.
    _C_EPOCH = "epoch"
    _C_DATE = "date"

    _PROFILE_SCALARS = [
        ("firstName", "first_name", None),
        ("lastName", "last_name", None),
        ("realName", "real_name", None),
        ("realNameNormalized", "real_name_normalized", None),
        ("displayName", "display_name", None),
        ("displayNameNormalized", "display_name_normalized", None),
        ("email", "email", None),
        ("phone", "phone", None),
        ("skype", "skype", None),
        ("pronouns", "pronouns", None),
        ("jobTitle", "title", None),
        ("username", "username", None),
        ("startDate", "start_date", _C_DATE),
        ("avatarHash", "avatar_hash", None),
        ("lastAvatarImageHash", "last_avatar_image_hash", None),
        ("isCustomImage", "is_custom_image", None),
        ("image24", "image_24", None),
        ("image32", "image_32", None),
        ("image48", "image_48", None),
        ("image72", "image_72", None),
        ("image192", "image_192", None),
        ("image512", "image_512", None),
        ("image1024", "image_1024", None),
        ("imageOriginal", "image_original", None),
        ("statusText", "status_text", None),
        ("statusEmoji", "status_emoji", None),
        ("statusTextCanonical", "status_text_canonical", None),
        ("statusExpiration", "status_expiration", _C_EPOCH),
        ("statusClearOnFocusEnd", "status_clear_on_focus_end", None),
        ("alwaysActive", "always_active", None),
        ("huddleState", "huddle_state", None),
        ("huddleStateCallId", "huddle_state_call_id", None),
        ("huddleStateExpirationTs", "huddle_state_expiration_ts", _C_EPOCH),
        ("apiAppId", "api_app_id", None),
        ("guestExpirationTs", "guest_expiration_ts", _C_EPOCH),
        ("membershipsCount", "memberships_count", None),
        ("whoCanShareContactCard", "who_can_share_contact_card", None),
        ("updated", "updated", _C_EPOCH),
    ]

    _USER_SCALARS = [
        ("name", "name", None),
        ("deleted", "deleted", None),
        ("color", "color", None),
        ("realName", "real_name", None),
        ("tzLabel", "tz_label", None),
        ("tzOffset", "tz_offset", None),
        ("locale", "locale", None),
        ("isAdmin", "is_admin", None),
        ("isOwner", "is_owner", None),
        ("isPrimaryOwner", "is_primary_owner", None),
        ("isRestricted", "is_restricted", None),
        ("isUltraRestricted", "is_ultra_restricted", None),
        ("restrictedUserType", "restricted_user_type", None),
        ("isBot", "is_bot", None),
        ("isAppUser", "is_app_user", None),
        ("isStranger", "is_stranger", None),
        ("isInvitedUser", "is_invited_user", None),
        ("isEmailConfirmed", "is_email_confirmed", None),
        ("isScimProvisioned", "is_scim_provisioned", None),
        ("isWorkflowBot", "is_workflow_bot", None),
        ("isExternal", "is_external", None),
        ("isForgotten", "is_forgotten", None),
        ("isProfileOnlyUser", "is_profile_only_user", None),
        ("suspended", "suspended", None),
        ("presence", "presence", None),
        ("manualPresence", "manual_presence", None),
        ("has2fa", "has_2fa", None),
        ("twoFactorType", "two_factor_type", None),
        ("whoCanShareContactCard", "who_can_share_contact_card", None),
        ("updated", "updated", _C_EPOCH),
        ("firstLogin", "first_login", _C_EPOCH),
    ]


    def _shape(src, table, clear=False):
        """The API's fields under their camelCase names.

        Three states, all distinct and all preserved:

        * **absent** — the key is not in the payload. Nothing is written, so a
          thin read never erases what a fuller one filled in.
        * **null, or an empty string/list/map** — the key IS in the payload and
          says the value is GONE. At the TOP LEVEL `None` is written, which
          deletes the property; dropping it instead (which is what this did)
          leaves a cleared status or a removed topic standing in the mirror
          forever. An empty string becomes the delete rather than being written
          through, because half these properties are `url`, `email`, `datetime`
          or `timezone` and `""` is not a legal value of any of them. Inside an
          OBJECT nothing is written: a patch replaces the whole object, so a
          field left out of the new one is already gone.
        * **a value** — converted by the table's converter and written.

        A converter that cannot make sense of its input (a `0` epoch, Slack's
        `0000-00-00` no-date) yields `None`, which CLEARS: the sentinel means
        "not set", and "not set" is not the same as "do not touch".
        """
        out = {}
        for prop, api, conv in table:
            if api not in src:
                continue
            v = src[api]
            if v is None or v == "" or v == [] or v == {}:
                if clear:
                    out[prop] = None
                continue
            if conv == _C_EPOCH:
                v = _epoch_iso(v)
            elif conv == _C_DATE:
                # Slack's "unset" date is 0000-00-00, and there is no year zero —
                # Postgres refuses it and the refusal takes the whole page down.
                v = str(v)[:10]
                if not re.fullmatch(r"[1-9]\d{3}-\d{2}-\d{2}", v or ""):
                    v = None
            if v is None and not clear:
                continue
            out[prop] = v
        return out


    def _tz(value):
        """A zone Slack sends that is not an IANA name is not written: the dialect
        refuses it, and refusing a page over one is worse."""
        v = (value or "").strip()
        return v if ("/" in v or v in ("UTC", "GMT")) else None


    def _profile_props(host, aid, team, prof):
        out = _shape(prof, _PROFILE_SCALARS)
        if prof.get("guest_invited_by"):
            out["guestInvitedBy"] = _user_ref(host, aid, team, prof["guest_invited_by"])
        # T-021: `bot_id` on a profile is the BOT IDENTITY behind an app user, and
        # this bundle mirrors bots — so it is a reference, not a string beside a
        # kind we already hold (the owner's rule: never a user id when we mirror
        # users, and the same test applies to a bot). The thin bot row is minted
        # by `_put_user` before the user that points at it.
        if prof.get("bot_id"):
            out["bot"] = _bot_ref(host, aid, team, prof["bot_id"])
        if prof.get("team"):
            out["team"] = _team_ref(host, aid, team, prof["team"])
        display = prof.get("status_emoji_display_info") or []
        shaped = []
        for e in display:
            if not isinstance(e, dict):
                continue
            one = _shape(e, [("emojiName", "emoji_name", None),
                             ("displayUrl", "display_url", None),
                             ("displayAlias", "display_alias", None),
                             ("unicode", "unicode", None)])
            if one:
                shaped.append(one)
        if shaped:
            out["statusEmojiDisplayInfo"] = shaped
        # `fields` is a string->object map, and Slack sends an empty ARRAY when a
        # workspace has no custom fields — a keyed property cannot take that.
        fields = prof.get("fields")
        if isinstance(fields, dict) and fields:
            keyed = {}
            for key, val in fields.items():
                if isinstance(val, dict):
                    one = _shape(val, [("value", "value", None), ("alt", "alt", None)])
                    if one:
                        keyed[key] = one
            if keyed:
                out["fields"] = keyed
        return out


    def _user_props(host, aid, team, u):
        props = {"account": aid, "userId": u.get("id") or ""}
        props.update(_shape(u, _USER_SCALARS, clear=True))
        zone = _tz(u.get("tz"))
        if zone:
            props["tz"] = zone
        if u.get("team_id"):
            props["team"] = _team_ref(host, aid, team, u["team_id"])
        prof = u.get("profile") or {}
        shaped = _profile_props(host, aid, team, prof)
        if shaped:
            props["profile"] = shaped
        ent = u.get("enterprise_user") or {}
        if isinstance(ent, dict) and ent:
            one = _shape(ent, [("enterpriseUserId", "id", None),
                               ("enterpriseId", "enterprise_id", None),
                               ("enterpriseName", "enterprise_name", None),
                               ("isAdmin", "is_admin", None),
                               ("isOwner", "is_owner", None),
                               ("isPrimaryOwner", "is_primary_owner", None)])
            teams = _refs(host, aid, team, ent.get("teams"), _team_ref)
            if teams:
                one["teams"] = teams
            if one:
                props["enterpriseUser"] = one
        return props


    def _merge_object(old, new):
        """Presence-aware merge of one OBJECT property. T-021, guide amendment 6.

        A top-level patch REPLACES an object value whole
        (`../substrate/docs/api.md:833`), so "a thin read PATCHES what a fuller
        one filled in" is simply not true of a nested object: writing a shaped
        `profile` built from a payload that carried three of its fifty fields
        deletes the other forty-seven. The amendment's answer is a READ plus a
        merge, and the read is what `permissions.reads.kinds` now admits.

        Presence, not truthiness, decides: a field the new payload carried wins —
        including as `None`, which removes it — and a field it did not carry
        keeps whatever the row already holds.
        """
        if not isinstance(old, dict) or not old:
            return {k: v for k, v in (new or {}).items() if v is not None}
        out = dict(old)
        for key, val in (new or {}).items():
            if val is None:
                out.pop(key, None)
            else:
                out[key] = val
        return out


    # `user_profile` is Slack's THIN profile, inlined on a message beside its
    # author: nine of the ~50 fields (measured on 1,466 of the owner's messages).
    # It is the payload guide amendment 6 was written for — writing it whole
    # would delete the other forty-one — and the two USER-level flags Slack files
    # inside it belong on the user row, not in its profile object.
    THIN_PROFILE_USER_FIELDS = ("is_restricted", "is_ultra_restricted")


    def _put_user(host, aid, team, u, whole=True):
        """One user row, with its embedded objects handled per amendment 6.

        Also the one place a `profile.bot_id` becomes a `bot` reference: the thin
        bot row is minted FIRST, because the sync upserts every referenced row
        before the row that references it (§1).
        """
        eid = _user_ref(host, aid, team, u.get("id"))
        if not eid:
            return None
        prof = u.get("profile") or {}
        if isinstance(prof, dict) and prof.get("bot_id"):
            _put(host, BOT_TYPE, _bot_ref(host, aid, team, prof["bot_id"]),
                 {"account": aid, "botId": prof["bot_id"]})
        props = _user_props(host, aid, team, u)
        if not whole:
            row = (host.records.get(USER_TYPE, eid) or {}).get("properties") or {}
            for key in ("profile", "enterpriseUser"):
                if key in props:
                    merged = _merge_object(row.get(key), props[key])
                    props[key] = merged or None
        _put(host, USER_TYPE, eid, props)
        return eid


