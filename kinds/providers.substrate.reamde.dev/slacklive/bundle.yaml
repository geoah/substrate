    def _text_block(host, aid, team, block):
        """topic / purpose: a value object with a reference inside it."""
        if not isinstance(block, dict):
            return None
        out = {}
        if block.get("value"):
            out["value"] = block["value"]
        if block.get("creator"):
            out["creator"] = _user_ref(host, aid, team, block["creator"])
        last = _epoch_iso(block.get("last_set"))
        if last:
            out["lastSet"] = last
        return out or None


    def _conv_props(host, aid, team, c):
        cid = c.get("id") or ""
        props = {"account": aid, "conversationId": cid}
        props.update(_shape(c, _CONV_SCALARS, clear=True))
        # `updated` is the one Slack field in MILLISECONDS.
        upd = _ms_iso(c.get("updated"))
        if upd:
            props["updated"] = upd
        # `context_team_id` is the workspace this conversation is being read in
        # the context of, which is not the same fact as "the workspace it belongs
        # to" — calling it `team` renamed an API field onto a meaning it does not
        # have. It keeps its own name.
        if "context_team_id" in c:
            props["contextTeam"] = _team_ref(host, aid, team,
                                             c.get("context_team_id"))
        # A conversation HAS a creation instant, and the temporal trait is bound
        # to it. Refusing the binding to keep a consumer's timeline tidy is a
        # consumer's decision made in the mirror.
        at = _epoch_iso(c.get("created"))
        if at:
            props["at"] = at
        moved = _epoch_iso(c.get("is_moved"))
        if moved:
            props["isMoved"] = moved
        if c.get("creator"):
            props["creator"] = _user_ref(host, aid, team, c["creator"])
        # On a 1:1 DM Slack calls the other person `user`.
        if c.get("user"):
            props["user"] = _user_ref(host, aid, team, c["user"])
        parent = c.get("parent_conversation")
        if isinstance(parent, str) and parent:
            props["parentConversation"] = _conv_ref(host, aid, team, parent)
        latest = c.get("latest")
        if isinstance(latest, dict) and latest.get("ts"):
            # Pointed at, never inlined, and never minted here: a conversation's
            # newest message is mirrored by the history walk that reaches it.
            props["latest"] = _msg_ref(host, aid, team, cid, latest["ts"])
        for prop, api in _CONV_TEAM_LISTS:
            refs = _refs(host, aid, team, c.get(api), _team_ref)
            if refs:
                props[prop] = refs
        for prop, api in (("topic", "topic"), ("purpose", "purpose")):
            shaped = _text_block(host, aid, team, c.get(api))
            if shaped:
                props[prop] = shaped
        # T-021: the property is `properties`, the API's own name. It was renamed
        # to `conversationProperties` on a reserved-name claim that is not true —
        # the loader reserves `title`, `at`, `endsAt` and `dueAt` and nothing else
        # (../substrate/internal/vocabulary/load.go:1246) — and the declaration
        # carries `renamedFrom`, so the values move rather than the column being
        # dropped and re-added.
        if isinstance(c.get("properties"), dict) and c["properties"]:
            props["properties"] = c["properties"]
        return props


