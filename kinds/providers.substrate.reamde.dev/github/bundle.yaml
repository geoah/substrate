    def _object(payload, key, fields):
        """One embedded value object, or None when GitHub sent null. Returns
        False when the payload does not carry the key at all, so the caller can
        leave the property absent rather than clearing it."""
        if key not in payload:
            return False
        value = payload.get(key)
        if not isinstance(value, dict):
            return None
        out = {}
        for api_key, fname in fields:
            _take(out, value, api_key, fname)
        return _mint(out) or None


    def _issue_half(sink, aid, it, props, repo, own_ref):
        """Every field of GitHub's ISSUE schema — the half a pull request also
        has, because a `type:pr` search hit and `GET /repos/{o}/{r}/issues/{n}`
        both answer through it.

        Version 14 read this half only on the way to an `issue` row and dropped
        it on the way to a `pullrequest` row, which threw away `state_reason`,
        `reactions`, the summaries, the app and the issue type on every pull
        request the sync ever saw. Both kinds declare the fields now, so both get
        them. `own_ref` is the record id of the row being built, needed by the
        pinned comment, which points back at it.

        Returns the DEFERRED work: the pinned-comment link, which cannot be part
        of this properties map. An issue and its pinned comment name each other,
        so there is no order in which both can be created with the link already
        set; the caller writes the row, then the comment, then this patch.
        """
        deferred = {}
        reactions = _object(it, "reactions", REACTION_FIELDS)
        if reactions is not False:
            props["reactions"] = reactions
        subs = _object(it, "sub_issues_summary",
                       (("total", "total"), ("completed", "completed"),
                        ("percent_completed", "percentCompleted")))
        if subs is not False:
            props["subIssuesSummary"] = subs
        deps = _object(it, "issue_dependencies_summary",
                       (("blocked_by", "blockedBy"),
                        ("total_blocked_by", "totalBlockedBy"),
                        ("blocking", "blocking"),
                        ("total_blocking", "totalBlocking")))
        if deps is not False:
            props["issueDependenciesSummary"] = deps
        if "issue_field_values" in it:
            props["issueFieldValues"] = _field_values(it.get("issue_field_values"))
        if "type" in it:
            who = it.get("type")
            props["type"] = sink.issuetype_ref(who) if isinstance(who, dict) else None
        if "performed_via_github_app" in it:
            who = it.get("performed_via_github_app")
            props["performedViaGithubApp"] = sink.app_ref(who) \
                if isinstance(who, dict) else None
        if "pinned_comment" in it:
            deferred["pinned_comment"] = it.get("pinned_comment")
        if "parent_issue_url" in it:
            # A relationship ADDRESS, not navigation: it names another issue by
            # `/repos/{o}/{r}/issues/{n}`, which is not an identity. The pair goes
            # on the issue-hydration queue and the reference is attached when that
            # read gives the parent a numeric id — so it is resolved rather than
            # erased, and an explicit null still clears the link now.
            url = it.get("parent_issue_url")
            if not url:
                props["parentIssue"] = None
            else:
                full, number = _repo_full(url), _tail_number(url)
                key = sink.parent_key(full, number)
                if key is not None:
                    props["parentIssue"] = key
                elif full and number is not None:
                    _enqueue(sink.cur, "issues", [full, number, None], "issuesFetch")
                    _enqueue(sink.cur, "parents",
                             [full, number, own_ref], "issuesFetch")
        for key, name in (("user", "user"), ("assignee", "assignee"),
                          ("closed_by", "closedBy")):
            if key not in it:
                continue
            who = it.get(key)
            props[name] = sink.user_ref(who) if isinstance(who, dict) else None
        if "assignees" in it:
            props["assignees"] = sink.user_refs(it.get("assignees")) or None
        if "labels" in it:
            props["labels"] = sink.label_refs(it.get("labels"), repo) or None
        if "milestone" in it:
            props["milestone"] = sink.milestone_ref(it.get("milestone"), repo)
        if repo:
            props["repository"] = repo
        return deferred


    def _tail_number(url):
        tail = (url or "").rstrip("/").rsplit("/", 1)[-1]
        return int(tail) if tail.isdigit() else None


    def _field_values(values):
        """GitHub's `issue_field_values` as occurrence objects, one per field,
        each variant typed. The array is present-and-empty on every payload in
        this account's corpus, which is what establishes the field; the variant
        shapes come from the issue-fields schema and are not claimed as
        exercised."""
        if not isinstance(values, list):
            return None
        out = []
        for v in values:
            if not isinstance(v, dict):
                continue
            row = {}
            _take(row, v, "id", "issueFieldId")
            _take(row, v, "node_id", "nodeId")
            _take(row, v, "name", "name")
            _take(row, v, "data_type", "dataType")
            value = v.get("value")
            dt = str(v.get("data_type") or "")
            if isinstance(value, dict):
                row["singleSelectOption"] = _option(value)
            elif isinstance(value, list):
                opts = [_option(x) for x in value if isinstance(x, dict)]
                row["multiSelectOptions"] = [o for o in opts if o] or None
            elif isinstance(value, bool):
                row["value"] = str(value)
            elif isinstance(value, (int, float)):
                row["numberValue"] = value
            elif isinstance(value, str) and value:
                if dt in ("date", "datetime"):
                    row["dateValue"] = value
                else:
                    row["value"] = value
            out.append(_mint(row))
        return out or None


    def _option(o):
        row = {}
        _take(row, o, "id", "optionId")
        _take(row, o, "name", "name")
        _take(row, o, "color", "color")
        return _mint(row) or None


    def _graph_wants(props):
        """Which edge lists this issue's own SUMMARIES say exist.

        An edge is read only where the count is non-zero, for two reasons: a
        repository that has never used dependencies answers the endpoint with a
        404, which this sync counts as `unreachable` on the account — a status
        worry manufactured out of nothing — and a zero count is already the whole
        answer. A summary that is stale simply means the next run corrects it.
        """
        subs = (props.get("subIssuesSummary") or {}).get("total") or 0
        deps = props.get("issueDependenciesSummary") or {}
        want = []
        if subs:
            want.append("subIssues")
        if deps.get("blockedBy") or deps.get("totalBlockedBy"):
            want.append("blockedBy")
        if deps.get("blocking") or deps.get("totalBlocking"):
            want.append("blocking")
        return want


    def _issue_props(sink, aid, it, repo):
        props = _scalars(aid, it, ISSUE_SCALARS)
        own = _item_id(sink.host, aid, False, it["id"]) if it.get("id") else None
        deferred = _issue_half(sink, aid, it, props, repo, own)
        # The GRAPH queue: one entry per EDGE, so the dedupe is exact list
        # equality and the backlog count means "reads still owed". Only an issue
        # asks — GitHub's dependency and sub-issue endpoints hang off
        # `/issues/{n}`, and a pull request's Issue half carries these summaries
        # at zero.
        full = _repo_full(it.get("repository_url") or it.get("url") or "")
        if own and full and it.get("number") is not None and "pull_request" not in it:
            for name in _graph_wants(props):
                _enqueue(sink.cur, "graph", [full, it["number"], own, name],
                         "graphFetch")
        if "pull_request" in it:
            # An Issue payload that is really a pull request. `pull_request` is a
            # link object, not an id — the PULL identity is inside this payload's
            # own `PR_…` node id, which is the same lossless decode the pull row
            # is keyed on.
            pull_id, _ = _pull_identity(it)
            props["pullRequest"] = _item_id(sink.host, aid, True, pull_id) \
                if pull_id else None
        return props, deferred


    def _branch(sink, b):
        if not isinstance(b, dict):
            return None
        out = {}
        for api_key, fname in (("label", "label"), ("ref", "ref"), ("sha", "sha")):
            _take(out, b, api_key, fname)
        if "user" in b:
            who = b.get("user")
            ref = sink.user_ref(who) if isinstance(who, dict) else None
            if ref:
                out["user"] = ref
        if "repo" in b:
            # The head/base repository is a WHOLE repository payload. Version 14
            # threw it away when a stub for the same id had already been staged
            # this page — the sink coalesces now, so the full read wins.
            ref = sink.repo_ref(b.get("repo"))
            if ref:
                out["repo"] = ref
        return _mint(out) or None


    def _pull_props(sink, aid, it, repo):
        props = _scalars(aid, it, PULL_SCALARS)
        pull_id, issue_id = _pull_identity(it)
        if pull_id is not None:
            props["pullRequestId"] = pull_id
        if issue_id is not None:
            props["issueId"] = issue_id
        # On a SEARCH item the merge facts live under `pull_request`; on a
        # hydrated pull request they are top-level. Read both, and never let the
        # thin one clear the fat one: a search item carries no `merged` key at
        # all, so `merged` stays absent until the hydrate says so. It is NOT
        # synthesised from `merged_at` — `merged` is GitHub's own boolean and a
        # row computed from a sibling property is exactly what §1 forbids.
        pr = it.get("pull_request")
        if isinstance(pr, dict) and "merged_at" in pr and "merged_at" not in it:
            _take(props, pr, "merged_at", "mergedAt")
        if "requested_reviewers" in it:
            props["requestedReviewers"] = sink.user_refs(
                it.get("requested_reviewers")) or None
        if "requested_teams" in it:
            props["requestedTeams"] = sink.team_refs(it.get("requested_teams")) or None
        if "merged_by" in it:
            who = it.get("merged_by")
            props["mergedBy"] = sink.user_ref(who) if isinstance(who, dict) else None
        for key, name in (("head", "head"), ("base", "base")):
            if key in it:
                props[name] = _branch(sink, it.get(key))
        if "auto_merge" in it:
            auto = it.get("auto_merge")
            if isinstance(auto, dict):
                out = {}
                _take(out, auto, "merge_method", "mergeMethod", _enum)
                _take(out, auto, "commit_title", "commitTitle")
                _take(out, auto, "commit_message", "commitMessage")
                if "enabled_by" in auto:
                    who = auto.get("enabled_by")
                    ref = sink.user_ref(who) if isinstance(who, dict) else None
                    if ref:
                        out["enabledBy"] = ref
                props["autoMerge"] = _mint(out) or None
            else:
                props["autoMerge"] = None
        if "stack" in it:
            # `pull-request.stack` — the stacked-pull-request block. Version 15
            # left it out as an UNVERIFIED exclusion ("no payload in a
            # 902-recording pull carries it"); GitHub's OpenAPI description says
            # it IS in the selected schema (`pull-request-stack`, nullable), so
            # it is declared and extracted (T-022). Its `id` addresses no
            # endpoint, so — like `autoMerge` — it is an object with typed
            # fields and not a kind.
            stack = it.get("stack")
            if isinstance(stack, dict):
                out = {}
                _take(out, stack, "id", "stackId")
                _take(out, stack, "number", "number")
                _take(out, stack, "size", "size")
                _take(out, stack, "position", "position")
                base = stack.get("base")
                if isinstance(base, dict):
                    b = {}
                    _take(b, base, "ref", "ref")
                    _take(b, base, "sha", "sha")
                    out["base"] = _mint(b) or None
                props["stack"] = _mint(out) or None
            else:
                props["stack"] = None
        own = _item_id(sink.host, aid, True, pull_id) if pull_id else None
        deferred = _issue_half(sink, aid, it, props, repo, own)
        return props, deferred


    def _edge_rows(fetch, cur, full, number, suffix, name):
        """One edge list, WHOLE: every page of `/issues/{n}/<suffix>`.

        Returns (rows, complete). `(None, False)` is a read that 404'd — the
        property is then left alone, because "GitHub would not say" is not the
        same fact as "there are none", and the miss is counted on the status.
        `complete` is False when the list runs past the page cap, and the caller
        writes nothing rather than a truncated graph.
        """
        rows, page = [], 1
        while page <= GRAPH_PAGES:
            got = fetch("/repos/%s/%s/%s?per_page=%d%s"
                        % (full, "issues/%s" % number, suffix, PAGE_SIZE,
                           "" if page == 1 else "&page=%d" % page), True)
            if got is None:
                if page == 1:
                    _note_missing(cur, "%s %s#%s" % (name, full, number))
                    return None, False
                break
            rows.extend([r for r in got if isinstance(r, dict)])
            if len(got) < PAGE_SIZE:
                return rows, True
            page += 1
        return rows, False


    def _edge_refs(sink, aid, cur, rows):
        """Mint every issue on the far end of an edge and hand back the
        references, in GitHub's own order. An issue whose repository cannot be
        identified is DROPPED from the list rather than written as a dangling
        reference — `subIssues` is `mustExist`, and half an edge is not an edge.
        """
        out = []
        for o in rows:
            if o.get("id") is None or o.get("number") is None:
                continue
            full = _repo_full(o.get("repository_url") or o.get("url") or "")
            try:
                repo = sink.resolve_repo(full) if full else None
            except _Restricted as e:
                # An edge into a restricted org: dropped from the list, like an
                # edge whose repository cannot be identified, and counted.
                _skip_restricted(cur, e)
                continue
            if repo is None:
                _note_missing(cur, "edge repo " + (full or "?"))
                continue
            rid = _item_id(sink.host, aid, False, o["id"])
            # The row is recorded as an identity BEFORE its own properties are
            # built, so a sibling naming it as a parent resolves inside this same
            # batch.
            cur.setdefault("issueIds", {})["%s#%s" % (full, o["number"])] = rid
            props, deferred = _issue_props(sink, aid, o, repo)
            props["repository"] = repo
            _put_item(sink, ISSUE_TYPE, rid, props, deferred, o)
            _resolve_parents(sink, cur, full, o["number"], rid)
            if rid not in out:
                out.append(rid)
        return out


    def _review_props(sink, aid, r, pull_ref):
        props = _scalars(aid, r, REVIEW_SCALARS)
        if "user" in r:
            who = r.get("user")
            props["user"] = sink.user_ref(who) if isinstance(who, dict) else None
        props["pullRequest"] = pull_ref
        return props


    def _put_item(sink, kind, rid, props, deferred, it):
        """Mint the row, then its pinned comment, then the link between them.

        `pinned_comment` is the one CYCLE in this closure: the comment's `issue`
        reference is `mustExist` at the row, and the row's `pinnedComment` is
        `mustExist` at the comment. Effects apply in list order through the
        ordinary validator, so a single properties map carrying both ends can
        never validate on a first sight of either. Three effects, in order, do.
        """
        sink._write(kind, rid, props)
        if "pinned_comment" not in deferred:
            return
        c = deferred["pinned_comment"]
        if not isinstance(c, dict):
            sink.patch(kind, rid, {"pinnedComment": None})
            return
        ref = sink.comment_ref(c, rid if kind == ISSUE_TYPE else None)
        sink.patch(kind, rid, {"pinnedComment": ref})


    # ------------------------------------------------------------- the stages


    def _more(host, cur, **overrides):
        nxt = dict(cur)
        nxt.update(overrides)
        return {"more": host.page.more(nxt)}


    def _progress(cur, phase, left=None):
        """`{phase, done, total, pending}` — the trait's progress, in hydration
        entries, from the drain's OWN bookkeeping.

        `pending` is exactly what `syncPending` still holds (the live queues plus
        the backlog); `total` is the high-water mark this run has seen, kept on
        the cursor so it survives every checkpoint of a bounded drain; `done` is
        the difference. All four are in the same unit, so a console renders
        `done/total` as a bar and `pending` as the number that has to reach zero.

        `left` OVERRIDES the cursor's own count, and the error path passes it.
        The cursor is only a true picture of the backlog once the `user` stage
        has loaded it off the account: a run that dies BEFORE that — a 401 on
        `GET /user` is exactly this — has empty queues and five parked entries,
        and an error stamp does not rewrite `syncPending`, so reporting the
        cursor's zero would tell a console the backlog had drained when the
        failure is precisely what stopped it draining (caught by the e2e's
        injected 401).
        """
        if left is None:
            left = sum(len(v) for v in _pending(cur).values())
        total = max(int(cur.get("hydrateTotal") or 0), left)
        cur["hydrateTotal"] = total
        return {"phase": phase or "idle", "done": total - left,
                "total": total, "pending": left}


    def _elapsed_ms(started, now):
        try:
            a = _dt.datetime.fromisoformat(str(started).replace("Z", "+00:00"))
            b = _dt.datetime.fromisoformat(str(now).replace("Z", "+00:00"))
        except (TypeError, ValueError):
            return None
        ms = int((b - a).total_seconds() * 1000)
        return ms if ms >= 0 else None


    def _trait(cur, state, message, now, error=None, phase=None, left=None):
        """The core `sync` trait's hands (substrate decision 0085), written beside
        the legacy `syncStatus` / `lastSyncedAt` strings on every path.

        GitHub is ONE stream, so there is no `syncStreams` map to raise a state
        over: the account-level `syncState` and `syncMessage` ARE the stream's,
        and `syncRequestedAck` — already echoed by `_stamp` — is the whole answer
        to a request, which is what 0085 prescribes for a single-function
        provider. `lastSyncStartedAt` / `lastSyncDurationMs` are written only on
        the SCHEDULE path: a record-sourced delivery is stamped by the dispatcher
        around the body, and two hands writing the same pair would fight.
        """
        out = {"syncState": state, "syncMessage": message[:400],
               "syncProgress": _progress(
                   cur, phase if phase is not None else (cur.get("stage") or ""),
                   left)}
        if error is not None:
            out["syncError"] = message[:400]
            out["syncErrorAt"] = now
        if cur.get("sched") and cur.get("startedAt"):
            out["lastSyncStartedAt"] = cur["startedAt"]
            ms = _elapsed_ms(cur["startedAt"], now)
            if ms is not None:
                out["lastSyncDurationMs"] = ms
        return out


    def _stamp(host, acct, aid, cur, error):
        # The connector stamp — the writer: connector properties. EVERY path
        # writes syncStatus, and lastSyncedAt marks the attempt finished either
        # way: it anchors the cadence AND drops the on-connect trigger's guard, so
        # an erroring stamp can never re-fire the first backfill in a loop.
        now = _now()
        patch = {"lastSyncedAt": now}
        if error is not None:
            patch["syncStatus"] = ("erroring: " + error)[:400]
            # A rate limit is WORK TO RESUME, not a fault: 0085 spells it
            # `throttled` and the Connections page renders it as a wait rather
            # than a break. GitHub signals both its primary and its secondary
            # limit as 403 or 429 with headers, and `_err_msg` has already turned
            # either into "rate limited on <resource>; retry after <instant>".
            state = "throttled" if error.startswith("rate limited") else "erroring"
            # The backlog an erroring run reports is the one the ACCOUNT still
            # holds, not the one this cursor happens to carry: the error path
            # deliberately leaves `syncPending` alone so the work survives the
            # failure, and a run that died before the `user` stage loaded it has
            # an empty cursor and a full account.
            held = sum(len(v) for v in
                       _pending_of(acct.get("properties") or {}).values())
            patch.update(_trait(cur, state, error, now, error=error,
                                left=max(held,
                                         sum(len(v) for v in _pending(cur).values()))))
        else:
            pending = _pending(cur)
            notes = []
            if cur.get("partial"):
                notes.append("partial: " + ", ".join(cur["partial"]))
            if cur.get("stalled"):
                notes.append("capped: " + ", ".join(cur["stalled"]))
            if pending:
                # `deferred: <queue> xN` is the grammar the runner's
                # continuation reads (tools/e2e.py, `_DEFERRED_RE`), and the
                # counts SHRINK round on round now that the backlog is durable.
                notes.append("deferred: " + ", ".join(
                    "%s x%d" % (k, len(v)) for k, v in sorted(pending.items())))
            if cur.get("missing"):
                notes.append("unreachable: %d (%s)"
                             % (len(cur["missing"]), ", ".join(cur["missing"][:4])))
            # T-077: a restricted org is named with what to do about it, and the
            # run it happened in still ends `ok` — the rest of the mirror landed.
            props = acct.get("properties") or {}
            restricted = _restricted_note(props, cur)
            if restricted:
                notes.append(restricted)
            if cur.get("lifted"):
                notes.append("restriction lifted: %s — re-walked from the "
                             "backfill floor" % ", ".join(sorted(cur["lifted"])))
            status = ("ok" if not notes
                      else "ok (" + "; ".join(notes) + ")")[:400]
            patch["syncStatus"] = status
            patch["syncPending"] = pending or None
            if cur.get("restricted") or cur.get("lifted"):
                patch["syncSkipped"] = _skipped_after(props, cur, now)
            # The trait's message is the SAME sentence, without the legacy
            # prefix grammar; the state is plain `ok` even with a backlog, and
            # `syncProgress.pending` is what says there is more to do.
            patch.update(_trait(cur, "ok", status, now,
                                phase=None if pending else "idle"))
            # The watermark is NOT held back by a backlog any more: the backlog is
            # durable, so "seen in search" and "fully hydrated" are two separate
            # checkpoints and the search may advance past work the hydration still
            # owes. Only a partial or unprocessable PAGE holds a floor, which the
            # search stage does inline.
            cursors = dict(cur.get("cursors") or {})
            walked = [st for st in SEARCH_STAGES if st in (cur.get("stages") or [])]
            if cursors and walked:
                patch["syncCursors"] = cursors
        # The request generation this run acted on, echoed back on EVERY path
        # including the erroring one: an unacknowledged request would re-fire the
        # trigger against the same failure forever.
        if cur.get("ack"):
            patch["syncRequestedAck"] = cur["ack"]
        host.effects.patch((acct.get("kind") or ACCOUNT_TYPE), aid, properties=patch)


    def _advance(host, acct, aid, cur, queue):
        order = list(cur.get("stages") or ["user"])
        stage = cur.get("stage") or "user"
        i = order.index(stage) if stage in order else len(order) - 1
        if i + 1 < len(order):
            nxt = order[i + 1]
            pfloor = ""
            if nxt in SEARCH_STAGES:
                pfloor = _minus_overlap((cur.get("floors") or {}).get(nxt) or "")
            return _more(host, cur, stage=nxt, page=1, pfloor=pfloor, prepo="")
        walk = list(cur.get("walk") or [])
        if walk:
            # The backlog is drained; the ordinary walk follows IN THIS RUN
            # (version 21). The stage list is replaced, so every stage name is
            # still unique within the order `_advance` indexes.
            nxt = walk[0]
            pfloor = ""
            if nxt in SEARCH_STAGES:
                pfloor = _minus_overlap((cur.get("floors") or {}).get(nxt) or "")
            host.log("github: %s backlog drained; walking %s" % (aid, ", ".join(walk)))
            return _more(host, cur, stages=walk, walk=[], stage=nxt, page=1,
                         pfloor=pfloor, prepo="")
        _stamp(host, acct, aid, cur, error=None)
        rest = queue[1:]
        if rest:
            return {"more": host.page.more(_fresh(rest, cur.get("sched")))}
        return {"output": {"account": aid}}


    def _enqueue(cur, key, item, stalled_name=""):
        """Queue one unit of hydration work; the overflow WAITS, it is not lost.

        Version 14 discarded every entry past the cap. Version 15's first cut
        parked it in a `deferred` list nothing ever read, which is the same thing
        with a better name: the list lived only in the paged cursor, so it died
        with the drain and was re-derived identically from the searches on every
        round. The overflow now lands in the same backlog `account.syncPending`
        persists, and the hydration stage REFILLS the live queue from it, so the
        only thing the cap decides is how much work rides inside one checkpoint.

        `stalled_name` is unused and kept for call-site symmetry: an overflow is
        ordinary now and is reported as `deferred:`, never as `capped:`, which is
        reserved for a search this run could not enumerate.
        """
        bucket = cur.setdefault(key, [])
        held = cur.setdefault("deferred", {}).setdefault(key, [])
        if item in bucket or item in held:
            return
        if len(bucket) >= MAX_HYDRATE:
            held.append(item)
            return
        bucket.append(item)


    def _refill(cur, key):
        """Move the next chunk of the backlog into the live queue."""
        held = (cur.get("deferred") or {}).get(key) or []
        if not held:
            return False
        bucket = cur.setdefault(key, [])
        room = MAX_HYDRATE - len(bucket)
        if room <= 0:
            return False
        bucket.extend(held[:room])
        cur["deferred"][key] = held[room:]
        if not cur["deferred"][key]:
            cur["deferred"].pop(key, None)
        return True


    def _pending(cur):
        """Everything still to hydrate — the live queues AND the backlog — in the
        shape `account.syncPending` holds."""
        out = {}
        for key in QUEUES:
            rows = list(cur.get(key) or []) + list((cur.get("deferred") or {}).get(key) or [])
            if rows:
                out[key] = rows
        return out


    def _save_cursors(host, acct, aid, cur):
        """Checkpoint the search watermarks AS EACH STAGE DRAINS.

        The third of the three independent checkpoints (the other two are the
        hydration backlog and the run stamp). Writing them only at `_stamp` meant
        a drain that died after the searches but before the stamp threw the whole
        walk away, and the next round re-enumerated forty-odd pages to discover
        exactly the work it already had parked.
        """
        cursors = dict(cur.get("cursors") or {})
        if not cursors or cursors == cur.get("savedCursors"):
            return
        cur["savedCursors"] = cursors
        host.effects.patch((acct.get("kind") or ACCOUNT_TYPE), aid,
                           properties={"syncCursors": cursors})


    def _save_pending(host, acct, aid, cur):
        """Checkpoint the backlog ON THE ACCOUNT, every hydration batch.

        This is the difference between a bounded drain that makes progress and one
        that does not: the engine drops a paged checkpoint when it stops the
        drain, so whatever the run has left to do has to be somewhere the next run
        can read it. Written per batch rather than per run, so a drain killed
        mid-stage still leaves the remainder recorded.
        """
        pending = _pending(cur)
        # The guard is the COUNTS, not a copy of the backlog: keeping a second
        # copy in the cursor would double the size of every checkpoint, and the
        # counts only stand still when no work was done — which is exactly when
        # there is nothing to write.
        sig = {k: len(v) for k, v in pending.items()}
        if sig == cur.get("saved"):
            return
        cur["saved"] = sig
        # The COUNT rides along, so a drain that dies before `_stamp` still leaves
        # a status that moved. A frozen count round after round is exactly what a
        # backlog that is not shrinking looks like, and it should never again be
        # what a backlog that IS shrinking looks like.
        left = ", ".join("%s x%d" % (k, len(v)) for k, v in sorted(pending.items()))
        status = ("ok (deferred: " + left + ")")[:400] if left else "ok"
        patch = {"syncPending": pending or None, "syncStatus": status}
        # The trait moves with it. `running` is the honest state at a
        # mid-drain checkpoint — the dispatcher already wrote it on the
        # record-sourced path, and on the schedule path this is the only hand
        # that can — and `syncProgress.pending` is the backlog count falling
        # round on round, which is what a console needs to show progress rather
        # than a frozen spinner.
        patch.update(_trait(cur, "running", status, _now()))
        host.effects.patch((acct.get("kind") or ACCOUNT_TYPE), aid,
                           properties=patch)


    def _ingest(host, aid, cur, pull, items, fetch):
        """Mirror one search page. Returns (newest updated_at, skipped count)."""
        sink = _Sink(host, aid, cur, fetch)
        newest, skipped = "", 0
        seen_nodes = set()
        for it in items:
            node = it.get("node_id") or ""
            if node:
                if node in seen_nodes:
                    continue
                seen_nodes.add(node)
            if it.get("id") is None or it.get("number") is None:
                skipped += 1
                continue
            full = _repo_full(it.get("repository_url") or it.get("url") or "")
            if not full:
                skipped += 1
                continue
            try:
                repo = sink.resolve_repo(full)
            except _Restricted as e:
                # The org has not approved the app (T-077). The item is NOT
                # minted and nothing of it is queued; it is counted against the
                # org, the page's boundary still moves over it, and the stage's
                # watermark is NOT held — asking again next hour cannot change
                # the answer, and the probe at the `user` stage re-walks the
                # window once the owner approves the app.
                _skip_restricted(cur, e)
                updated = it.get("updated_at") or ""
                if updated > newest:
                    newest = updated
                continue
            if repo is None:
                # The repository could not be identified (deleted, or access
                # lost). `issue.repository` is required, so the item is HELD
                # rather than written half-formed, and the stage does not get to
                # call itself complete.
                skipped += 1
                continue
            if pull:
                pull_id, _ = _pull_identity(it)
                if pull_id is None:
                    skipped += 1
                    continue
                props, deferred = _pull_props(sink, aid, it, repo)
                _put_item(sink, PULL_TYPE, _item_id(host, aid, True, pull_id),
                          props, deferred, it)
                # The search item carries no requested_reviewers, no requested
                # teams, no merged_by, no head/base and no diff counts.
                _enqueue(cur, "pulls", [full, it["number"], pull_id], "pullsFetch")
                _enqueue(cur, "reviews", [full, it["number"], pull_id], "reviewsFetch")
            else:
                props, deferred = _issue_props(sink, aid, it, repo)
                _put_item(sink, ISSUE_TYPE, _item_id(host, aid, False, it["id"]),
                          props, deferred, it)
                # EVERY issue is hydrated, not only a closed one. `closed_by`,
                # `type`, `performed_via_github_app`, `pinned_comment` and
                # `parent_issue_url` live on the issue's own endpoint and nowhere
                # else, so an issue that is REOPENED between runs kept a stale
                # closing actor forever under the old "closed only" rule.
                _enqueue(cur, "issues", [full, it["number"], it["id"]],
                         "issuesFetch")
            updated = it.get("updated_at") or ""
            if updated > newest:
                newest = updated
        if skipped:
            note = "skipped %d unprocessable" % skipped
            if note not in (cur.get("stalled") or []):
                cur["stalled"] = list(cur.get("stalled") or []) + [note]
        return newest, skipped


    def _backfill_since(props, run_start):
        depth = props.get("backfillDepth") or "last30d"
        if depth == "all":
            return ""
        if depth == "none":
            # "Don't backfill" is FROM CONNECT TIME, FORWARD-ONLY: the first run's
            # floor is its own start, and the stamp persists it even when the
            # window comes back empty, so the account ratchets forward instead of
            # recomputing since=now on every run.
            return run_start
        days = BACKFILL_DAYS.get(depth, 30)
        now = _dt.datetime.now(_dt.timezone.utc)
        return (now - _dt.timedelta(days=days)).strftime("%Y-%m-%dT%H:%M:%SZ")


    def _stored_cursors(props):
        stored = props.get("syncCursors")
        if not isinstance(stored, dict):
            return {}
        return {k: v for k, v in stored.items() if isinstance(v, str) and v}


    def _api_base(cfg):
        client = ((cfg.get("inputs") or {}).get("client") or {})
        base = ((client.get("properties") or {}).get("apiBase") or "").strip()
        return (base or DEFAULT_API).rstrip("/")


    def _sync_account(host, api, acct, aid, props, token, cur, queue):
        stage = cur.get("stage") or "user"
        page = int(cur.get("page") or 1)
        budget = _Budget()

        def fetch(path, allow_404=False):
            # An org this run has already been refused by is not asked again per
            # item: the same refusal is raised here, without a request (T-077).
            owner = _owner_of(path)
            if owner and owner in (cur.get("restricted") or []):
                raise _Restricted(api + path, "%s the OAuth app"
                                  % _orgs_phrase([owner]))
            budget.spend()
            try:
                return _get(token, api + path, allow_404=allow_404)
            except _Restricted as e:
                _note_restricted(cur, e)
                host.log("github: %s: %s refused %s (%s)"
                         % (aid, e.owner or "an organization", path, str(e)[:120]))
                raise

        if stage == "user":
            me = fetch("/user")
            login = me.get("login") or ""
            if not login:
                raise RuntimeError("github: /user returned no login for " + aid)
            sink = _Sink(host, aid, cur, fetch)
            # The connected user's row is the fullest payload GitHub has: patched,
            # not minted, and the account POINTS at it — "me" is a reference, not
            # a login string.
            uid = sink.user_ref(me, thin=False)
            if uid:
                host.effects.patch((acct.get("kind") or ACCOUNT_TYPE), aid,
                                   properties={"user": uid})
            run_start = _now()
            walk = _stages(props)
            stored = _stored_cursors(props)
            # THE PROBE (T-077). An account that carries a refusal re-asks ONE
            # remembered repository per org. Still refused: the org is marked for
            # this run (no item of it costs a request) and the status keeps
            # saying so. Answered: the owner approved the app, so the search
            # watermarks are dropped — here AND on the account, in case this
            # round walks no search — and the window the refusal hid is
            # re-walked from the backfill floor. Nothing else can find the items
            # the earlier runs skipped: they are behind the watermark and only
            # a fresh update would surface them again.
            lifted = []
            for org, row in sorted(_restricted_held(props).items())[:MAX_RESTRICTED_PROBES]:
                full = str(row.get("repo") or "")
                if not full or "/" not in full:
                    continue
                try:
                    fetch("/repos/" + full, True)
                except _Restricted:
                    continue
                lifted.append(org)
            if lifted:
                cur["lifted"] = lifted
                stored = {}
                host.effects.patch((acct.get("kind") or ACCOUNT_TYPE), aid,
                                   properties={"syncCursors": None})
                host.log("github: %s: the %s organization(s) approved the app; "
                         "re-walking from the backfill floor"
                         % (aid, ", ".join(lifted)))
            # The floors are the WALK's, computed here whether or not this run
            # starts with a backlog: the walk follows the backlog in the same run.
            floors = {s: stored.get(s) or _backfill_since(props, run_start)
                      for s in walk if s in SEARCH_STAGES}
            cursors = {s: v for s, v in stored.items() if s in SEARCH_STAGES}
            # Pick the backlog up where the last drain put it down. The first
            # MAX_HYDRATE of each queue ride in the cursor; the rest stays in
            # `deferred` and the stage refills from it as it drains. A run with
            # a backlog is TWO phases: the hydration-only prefix now, and the
            # ordinary walk (`cur["walk"]`) that `_advance` switches to when the
            # prefix runs out (version 21).
            held = _pending_of(props)
            stages = _backlog_stages(props) if held else walk
            cur.update(login=login, runStart=run_start, stages=stages,
                       walk=[st for st in walk if st != "user"] if held else [],
                       floors=floors, cursors=cursors,
                       ack=props.get("syncRequestedAt") or "")
            if held:
                cur["deferred"] = {}
                for key, rows in held.items():
                    cur[key] = list(rows[:MAX_HYDRATE])
                    if rows[MAX_HYDRATE:]:
                        cur["deferred"][key] = list(rows[MAX_HYDRATE:])
                host.log("github: %s resuming %d parked hydration entries"
                         % (aid, sum(len(v) for v in held.values())))
            return _advance(host, acct, aid, cur, queue)

        if stage == "repos":
            sink = _Sink(host, aid, cur, fetch)
            rows = fetch("/user/repos?per_page=%d&page=%d&sort=full_name"
                         % (PAGE_SIZE, page))
            for r in rows or []:
                sink.repo_ref(r)
            if rows and len(rows) == PAGE_SIZE:
                return _more(host, cur, page=page + 1)
            return _advance(host, acct, aid, cur, queue)

        if stage == "reposFetch":
            # FULL repository reads. `/user/repos` only covers repositories the
            # account owns or collaborates on; an issue the owner is merely
            # mentioned in names a repository this account may never list, and
            # `subscribers_count`, `network_count`, `organization`, `parent`,
            # `source`, `template_repository`, `license`, `code_of_conduct`,
            # `topics` and `security_and_analysis` come from nowhere else. In
            # version 14 they had declarations, four recordings and no request.
            if not cur.get("repos"):
                _refill(cur, "repos")
            todo = list(cur.get("repos") or [])
            if not todo:
                return _advance(host, acct, aid, cur, queue)
            sink = _Sink(host, aid, cur, fetch)
            done = 0
            for full in todo[:HYDRATE_BATCH]:
                if done and budget.spent():
                    break
                try:
                    payload = fetch("/repos/" + full, True)
                except _Restricted as e:
                    _skip_restricted(cur, e)
                    done += 1
                    continue
                done += 1
                if isinstance(payload, dict) and payload.get("id") is not None:
                    sink.repo_ref(payload)
                else:
                    _note_missing(cur, "repo " + full)
            cur["repos"] = todo[done:]
            _save_pending(host, acct, aid, cur)
            if cur["repos"] or (cur.get("deferred") or {}).get("repos"):
                return _more(host, cur)
            return _advance(host, acct, aid, cur, queue)

        if stage == "licensesFetch":
            # THE CATALOGUE READS. A repository names its licence and its code of
            # conduct by KEY and carries five of the fourteen declared fields;
            # `/licenses/{key}` and `/codes_of_conduct/{key}` carry the rest
            # (`body`, `description`, `implementation`, `featured`, the three
            # permission lists). Version 15 declared both kinds off the endpoints
            # and then only ever wrote the embedded half — T-022's second item.
            if not cur.get("licenses"):
                _refill(cur, "licenses")
            todo = list(cur.get("licenses") or [])
            if not todo:
                return _advance(host, acct, aid, cur, queue)
            sink = _Sink(host, aid, cur, fetch)
            done = 0
            for entry in todo[:HYDRATE_BATCH]:
                if done and budget.spent():
                    break
                what, key = entry[0], entry[1]
                path = ("/licenses/" if what == "license" else "/codes_of_conduct/") \
                    + str(key)
                payload = fetch(path, True)
                done += 1
                if not isinstance(payload, dict) or not payload.get("key"):
                    # A key GitHub does not serve (a licence the repository
                    # reports as `other` reaches here only if it carried a url).
                    _note_missing(cur, what + " " + str(key))
                    continue
                if what == "license":
                    sink.license_ref(payload, hydrated=True)
                else:
                    sink.coc_ref(payload, hydrated=True)
            cur["licenses"] = todo[done:]
            _save_pending(host, acct, aid, cur)
            if cur["licenses"] or (cur.get("deferred") or {}).get("licenses"):
                return _more(host, cur)
            return _advance(host, acct, aid, cur, queue)

        if stage == "graphFetch":
            # THE ISSUE GRAPH. `subIssuesSummary` and `issueDependenciesSummary`
            # are counts: they say HOW MANY issues block this one and cannot say
            # WHICH, and version 15 named the edges explicitly out of scope. The
            # three endpoints under `/issues/{n}` answer with whole Issue
            # payloads, so every edge target is MINTED from a full read rather
            # than stubbed — which is why the mirror now also holds an issue the
            # owner is not involved in, when it is the sub-issue or the
            # dependency of one they are.
            if not cur.get("graph"):
                _refill(cur, "graph")
            todo = list(cur.get("graph") or [])
            if not todo:
                return _advance(host, acct, aid, cur, queue)
            sink = _Sink(host, aid, cur, fetch)
            edges = dict(GRAPH_EDGES)
            done = 0
            for entry in todo[:HYDRATE_BATCH]:
                if done and budget.spent():
                    break
                full, number, rid, name = entry
                done += 1
                # The edge's own subject is an identity this run may not have
                # recorded (a round that starts with a backlog runs no
                # `issuesFetch`), and every child names it in `parent_issue_url`.
                cur.setdefault("issueIds", {})["%s#%s" % (full, number)] = rid
                try:
                    rows, complete = _edge_rows(fetch, cur, full, number,
                                                edges[name], name)
                except _Restricted as e:
                    _skip_restricted(cur, e)
                    continue
                if rows is None:
                    continue
                if not complete:
                    # A list longer than the cap is not written SHORT: the
                    # property keeps the value it has and the run says why.
                    note = "graph %s %s#%s: more than %d" % (
                        name, full, number, GRAPH_PAGES * PAGE_SIZE)
                    if note not in (cur.get("stalled") or []):
                        cur["stalled"] = list(cur.get("stalled") or []) + [note]
                    continue
                sink.patch(ISSUE_TYPE, rid, {name: _edge_refs(sink, aid, cur, rows)
                                             or None})
            # An edge target is itself an issue, and minting it can enqueue MORE
            # graph work (a sub-issue with sub-issues of its own). Those entries
            # landed on the live queue while this batch was draining, so the
            # remainder is what is left of the batch PLUS whatever it discovered —
            # `todo[done:]` alone would drop them on the floor.
            found = [e for e in (cur.get("graph") or []) if e not in todo]
            cur["graph"] = todo[done:] + found
            _save_pending(host, acct, aid, cur)
            if cur["graph"] or (cur.get("deferred") or {}).get("graph"):
                return _more(host, cur)
            return _advance(host, acct, aid, cur, queue)

        if stage in ("pullsFetch", "reviewsFetch", "issuesFetch"):
            # Drain a hydration queue in small batches, bounded by WALL TIME as
            # well as batch size: eight sequential reads at a 20-second timeout
            # can outlive the function's PT60S limit, and a run killed before it
            # checkpoints replays the same work forever.
            key = {"pullsFetch": "pulls", "reviewsFetch": "reviews",
                   "issuesFetch": "issues"}[stage]
            if not cur.get(key):
                _refill(cur, key)
            todo = list(cur.get(key) or [])
            if not todo:
                return _advance(host, acct, aid, cur, queue)
            sink = _Sink(host, aid, cur, fetch)
            done = 0
            for entry in todo[:HYDRATE_BATCH]:
                if done and budget.spent():
                    break
                full, number, item_id = entry
                if stage == "reviewsFetch":
                    # PAGED. Version 14 asked for one page of 100 and then
                    # dropped the entry, so review 101 onward was never mirrored.
                    rpage = int((cur.get("reviewPage") or {}).get(
                        "%s#%s" % (full, number)) or 1)
                    # `page=1` is the default and GitHub omits it; sending it
                    # would make the first page a DIFFERENT request from the one
                    # a capture recorded.
                    try:
                        rows = fetch("/repos/%s/pulls/%s/reviews?per_page=%d%s"
                                     % (full, number, PAGE_SIZE,
                                        "" if rpage == 1 else "&page=%d" % rpage),
                                     True)
                    except _Restricted as e:
                        _skip_restricted(cur, e)
                        pages = dict(cur.get("reviewPage") or {})
                        pages.pop("%s#%s" % (full, number), None)
                        cur["reviewPage"] = pages
                        done += 1
                        continue
                    if rows is None:
                        _note_missing(cur, "reviews %s#%s" % (full, number))
                        rows = []
                    pull_ref = _item_id(host, aid, True, item_id)
                    for r in rows:
                        if not isinstance(r, dict) or r.get("id") is None:
                            continue
                        rid = _simple_id(host, aid, "review", r["id"])
                        sink._write(REVIEW_TYPE, rid,
                                    _review_props(sink, aid, r, pull_ref))
                    if len(rows) == PAGE_SIZE:
                        pages = dict(cur.get("reviewPage") or {})
                        pages["%s#%s" % (full, number)] = rpage + 1
                        cur["reviewPage"] = pages
                        # the entry STAYS on the queue until the list is drained
                        cur[key] = todo[done:]
                        _save_pending(host, acct, aid, cur)
                        return _more(host, cur)
                    pages = dict(cur.get("reviewPage") or {})
                    pages.pop("%s#%s" % (full, number), None)
                    cur["reviewPage"] = pages
                    done += 1
                    continue
                pull = stage == "pullsFetch"
                path = "/repos/%s/%s/%s" % (full, "pulls" if pull else "issues", number)
                try:
                    item = fetch(path, True)
                except _Restricted as e:
                    # The org refused (T-077): the entry leaves the queue, the
                    # row keeps whatever the search item gave it, and the skip
                    # is counted against the org.
                    _skip_restricted(cur, e)
                    done += 1
                    continue
                done += 1
                if not item:
                    # A 404 is not a success. It may be a deletion or a lost
                    # grant, and either way the row this mirror holds is now
                    # unverified; it is NAMED on the status rather than silently
                    # accepted, so a cursor advance is never mistaken for
                    # "reconciled".
                    _note_missing(cur, ("pull " if pull else "issue ")
                                  + "%s#%s" % (full, number))
                    continue
                repo = sink.resolve_repo(full)
                if pull:
                    props_item, deferred = _pull_props(sink, aid, item, repo)
                    pull_id, _ = _pull_identity(item)
                    rid = _item_id(host, aid, True, pull_id or item_id)
                else:
                    props_item, deferred = _issue_props(sink, aid, item, repo)
                    rid = _item_id(host, aid, False, item.get("id") or item_id)
                # The hydrated payload carries no `repository_url`; the repository
                # is the queue entry's, which the search stage knew.
                if repo:
                    props_item["repository"] = repo
                _put_item(sink, PULL_TYPE if pull else ISSUE_TYPE, rid,
                          props_item, deferred, item)
                if not pull:
                    _resolve_parents(sink, cur, full, number, rid)
            cur[key] = todo[done:]
            _save_pending(host, acct, aid, cur)
            if cur[key] or (cur.get("deferred") or {}).get(key):
                return _more(host, cur)
            return _advance(host, acct, aid, cur, queue)

        if stage == "usersFetch":
            # The profile hydration: /users/{login} is the ONLY place `name` and
            # the public `email` come from, and a person mapping has nothing to
            # match on without them. It is ALSO where a user first seen without a
            # numeric id (a repository path's owner segment) gets an identity, so
            # the queue is fed by `Sink.user_ref` itself — every discovery point,
            # not the six the old call sites happened to cover.
            if not cur.get("users"):
                _refill(cur, "users")
            todo = list(cur.get("users") or [])
            if not todo:
                return _advance(host, acct, aid, cur, queue)
            sink = _Sink(host, aid, cur, fetch)
            done = 0
            for login in todo[:HYDRATE_BATCH]:
                if done and budget.spent():
                    break
                try:
                    u = fetch("/users/" + login, True)
                except _Restricted as e:
                    _skip_restricted(cur, e)
                    done += 1
                    continue
                done += 1
                if not u:
                    _note_missing(cur, "user " + login)
                    continue
                sink.user_ref(u, thin=False)
            cur["users"] = todo[done:]
            _save_pending(host, acct, aid, cur)
            if cur["users"] or (cur.get("deferred") or {}).get("users"):
                return _more(host, cur)
            return _advance(host, acct, aid, cur, queue)

        # issues | pulls | pullsReview: the three searches. Ascending by update
        # time, so a partition boundary is the page's newest item.
        pull = stage != "issues"
        q = SEARCH_QUERY[stage] + (cur.get("login") or "")
        pfloor = cur.get("pfloor") or ""
        part = cur.get("prepo") or ""
        if part:
            # A partition the timestamp alone could not split (below): the same
            # window, narrowed to one repository.
            q += " repo:" + part
        if pfloor:
            q += " updated:>=" + pfloor
        budget.spend()
        resp = _get(token, api + "/search/issues",
                    {"q": q, "per_page": PAGE_SIZE, "page": page,
                     "sort": "updated", "order": "asc"})
        items = resp.get("items") or []
        # One line per search page, so an empty mirror can be read off the log:
        # the query as sent, the page, what GitHub counted and returned (T-077 —
        # a whole evening went by with "ok" and two issues).
        host.log("github: %s search %r page %d -> %d item(s) of %s%s" % (
            stage, q, page, len(items), resp.get("total_count"),
            " (incomplete)" if resp.get("incomplete_results") else ""))
        boundary, skipped = _ingest(host, aid, cur, pull, items, fetch)
        # Every page discovers hydration work, and a bounded drain can end on any
        # of them: park what this page found before deciding what to do next.
        _save_pending(host, acct, aid, cur)
        cursors = dict(cur.get("cursors") or {})
        if resp.get("incomplete_results"):
            # A PARTIAL response: what arrived still upserts, but the stage's
            # watermark must NOT advance — items the partial response omitted
            # would fall behind it forever. The failing WINDOW is remembered so a
            # later run narrows it instead of re-asking the same expensive query.
            if stage not in (cur.get("partial") or []):
                cur["partial"] = list(cur.get("partial") or []) + [stage]
            floor = (cur.get("floors") or {}).get(stage) or ""
            if floor:
                cursors[stage] = floor
            else:
                cursors.pop(stage, None)
            cur["cursors"] = cursors
            return _advance(host, acct, aid, cur, queue)
        if skipped:
            # Items this page could not process (no identity, no repository). The
            # stage must not call itself complete over them.
            floor = (cur.get("floors") or {}).get(stage) or ""
            if floor:
                cursors[stage] = floor
            else:
                cursors.pop(stage, None)
            cur["cursors"] = cursors
        if len(items) == PAGE_SIZE:
            if page < MAX_SEARCH_PAGES:
                return _more(host, cur, page=page + 1)
            # The 1,000-result ceiling. Partition by updated-range first.
            if boundary and boundary > pfloor:
                return _more(host, cur, page=1, pfloor=boundary)
            # The boundary did NOT move: more than 1,000 hits share one second,
            # and no `updated:` window can enumerate them. Partition by a second,
            # disjoint dimension — the repository — over the repositories this
            # run has already identified, and only call the stage complete when
            # every partition has drained. Version 14 stamped the boundary here
            # and moved on, which marked an unenumerated tie group done.
            repos = sorted((cur.get("repoIds") or {}))
            todo = [r for r in repos if r > part] if repos else []
            if todo:
                note = "%s: tie at %s, partitioning by repository" % (stage, pfloor)
                if note not in (cur.get("stalled") or []):
                    cur["stalled"] = list(cur.get("stalled") or []) + [note]
                return _more(host, cur, page=1, prepo=todo[0])
            note = "%s: %d+ results share %s and cannot be enumerated" % (
                stage, MAX_SEARCH_PAGES * PAGE_SIZE, pfloor or "the window")
            if note not in (cur.get("stalled") or []):
                cur["stalled"] = list(cur.get("stalled") or []) + [note]
            # NOT complete: the floor stands, so the next run re-enumerates.
            floor = (cur.get("floors") or {}).get(stage) or ""
            if floor:
                cursors[stage] = floor
            else:
                cursors.pop(stage, None)
            cur["cursors"] = cursors
            return _advance(host, acct, aid, cur, queue)
        if part:
            # One repository partition drained; take the next one.
            repos = sorted((cur.get("repoIds") or {}))
            todo = [r for r in repos if r > part]
            if todo:
                return _more(host, cur, page=1, prepo=todo[0])
            cur["prepo"] = ""
        # Drained: the stage's new watermark is the RUN-START time — never the
        # local completion clock, and never past work this run dropped (`_stamp`
        # holds the floor when anything overflowed).
        if stage not in (cur.get("partial") or []) and not skipped:
            cursors[stage] = cur.get("runStart") or _now()
            cur["cursors"] = cursors
            _save_cursors(host, acct, aid, cur)
        return _advance(host, acct, aid, cur, queue)


    def main(input, host):
        cfg = input.get("config") or {}
        api = _api_base(cfg)
        accounts = {a.get("id"): a for a in (cfg.get("accounts") or [])}
        # A DIRECT call carries no envelope — its input is {args, causalDepth,
        # config, idempotencyKey, mode}, and whatever the caller passed rides
        # under `args`. So the three ways in are: the record trigger's envelope,
        # an explicit `args.account` / `args.accounts` (an operator re-syncing one
        # now, and the e2e's forced second pass), and the schedule's due-by-
        # cadence sweep.
        args = input.get("args")
        if not isinstance(args, dict):
            args = {}
        cur = host.page.resume() or None
        if cur is None:
            record = (input.get("envelope") or {}).get("record") or {}
            etype = (record.get("kind") or "")
            # WHICH HAND STAMPS THE CLOCK. Around a RECORD-sourced delivery the
            # dispatcher writes `lastSyncStartedAt` before the body runs and the
            # duration when it settles (substrate decision 0085); a SCHEDULE fire
            # names no record, so nothing stamps it but this body. `sched` is
            # therefore "no envelope record", decided once and carried on the
            # cursor, because a bounded drain's later invocations resume with no
            # envelope at all and would otherwise all look scheduled.
            sched = not record
            named = args.get("accounts") or (
                [args["account"]] if args.get("account") else [])
            if etype == ACCOUNT_TYPE:
                queue = [record.get("id")]
            elif named:
                # Named explicitly: the cadence is the SCHEDULE's rule, not a
                # refusal to work when asked.
                queue = [str(a) for a in named]
            elif args.get("force"):
                queue = [aid for aid, a in accounts.items() if _wants(a)]
            else:
                queue = [aid for aid, a in accounts.items()
                         if _wants(a) and _due(a.get("properties") or {})]
            cur = _fresh(queue, sched)

        queue = list(cur.get("queue") or [])
        while queue:
            acct = accounts.get(queue[0])
            if acct is None or not _wants(acct):
                queue = queue[1:]
                cur = _fresh(queue, cur.get("sched"))
                continue
            props = acct.get("properties") or {}
            terr = acct.get("tokenError")
            if terr or not acct.get("token"):
                if terr:
                    host.log("github: skip %s: %s" % (queue[0], terr))
                    want = ("erroring: " + str(terr))[:400]
                    if (props.get("syncStatus") or "") != want:
                        # The trait moves with the legacy string: an account the
                        # host could not hand a token to is `erroring` on the
                        # Connections page, with the reason the host gave.
                        host.effects.patch(
                            (acct.get("kind") or ACCOUNT_TYPE), queue[0],
                            properties={"syncStatus": want,
                                        "syncState": "erroring",
                                        "syncMessage": str(terr)[:400],
                                        "syncError": str(terr)[:400],
                                        "syncErrorAt": _now()})
                queue = queue[1:]
                cur = _fresh(queue, cur.get("sched"))
                continue
            break
        if not queue:
            # Say WHY nothing synced. A bare zero is indistinguishable between "no
            # account is due", "the account has no token" and "the envelope named
            # an account this config does not carry", and the three want three
            # different fixes.
            return {"output": {"synced": 0, "accounts": sorted(accounts),
                               "wanted": sorted(
                                   a for a in accounts if _wants(accounts[a])),
                               "tokened": sorted(
                                   a for a in accounts if accounts[a].get("token")),
                               "asked": list(cur.get("queue") or [])}}

        aid = queue[0]
        acct = accounts[aid]
        props = acct.get("properties") or {}
        cur["queue"] = queue
        try:
            return _sync_account(host, api, acct, aid, props, acct["token"], cur, queue)
        except Exception as e:  # noqa: BLE001 — per-account isolation
            msg = _err_msg(e)
            host.log("github: account %s failed: %s" % (aid, msg))
            _stamp(host, acct, aid, cur, error=msg)
            rest = queue[1:]
            if rest:
                return {"more": host.page.more(_fresh(rest, cur.get("sched")))}
            return {"output": {"account": aid, "error": msg}}
---
# ---- mirror: one license ----------------------------------------------------
# GitHub's license has its own `/licenses/{key}` endpoint and rides on every
# repository payload, so by the §3 test it is a kind and `repository.license`
# is a reference. The embedded form carries five of its fields; the rest are
# declared and filled the day a sync reads the endpoint.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/github/license
data:
  authority: providers.substrate.reamde.dev
  package: github
  description: >-
    One open-source license as REST v3 describes it: five fields from the
    object a repository embeds (key, name, spdxId, nodeId, url) and the other
    nine from the catalogue read GET /licenses/{key}, which the sync makes
    for every key GitHub gives a url (`other` has none). No instant, so no
    temporal trait; `*_url` templates are the omitted class.
  names:
    singular: license
  displayTemplate: "{name}"
  properties:
    # ---- identity --------------------------------------------------------
    account:
      type: reference
      kind: account
      required: true
      onDelete: cascade
      displayName: Account
      description: the account this license was synced through
    key:
      type: string
      displayName: Key
      description: GitHub's `key` — the license's handle (`mit`, `apache-2.0`)
        and the id every row derives from
    nodeId:
      type: string
      displayName: Node ID
      description: GitHub's `node_id`, the GraphQL global node id
    # ---- the license's own fields ----------------------------------------
    name:
      type: string
      displayName: Name
      description: the license's full name
    spdxId:
      type: string
      displayName: SPDX ID
      description: GitHub's `spdx_id` — the SPDX identifier, `NOASSERTION`
        where SPDX has none
    description:
      type: text
      displayName: Description
      description: what the license does, from GET /licenses/{key}
    implementation:
      type: text
      displayName: Implementation
      description: how to apply the license, from GET /licenses/{key}
    body:
      type: text
      displayName: Body
      description: the license text itself, from GET /licenses/{key}
    permissions:
      type: string
      repeated: true
      displayName: Permissions
      description: what the license permits (`commercial-use`, …), from GET
        /licenses/{key}
    conditions:
      type: string
      repeated: true
      displayName: Conditions
      description: what the license requires (`include-copyright`, …), from
        GET /licenses/{key}
    limitations:
      type: string
      repeated: true
      displayName: Limitations
      description: what the license disclaims (`liability`, …), from GET /licenses/{key}
    featured:
      type: bool
      displayName: Featured
      description: whether GitHub features the license in its picker
    htmlUrl:
      type: url
      displayName: License URL
      description: the license page on choosealicense.com
    url:
      type: url
      displayName: API URL
      description: the license's own REST address
---
# ---- mirror: one code of conduct --------------------------------------------
# `/codes_of_conduct/{key}` is its own endpoint and a repository payload may
# carry the object, so the §3 test makes it a kind.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/github/codeofconduct
data:
  authority: providers.substrate.reamde.dev
  package: github
  description: >-
    One code of conduct as REST v3 describes it: key, name and the urls from
    the object a repository embeds, and `body` — the text itself — from the
    catalogue read GET /codes_of_conduct/{key}, which the sync makes for every
    key it sees. No instant, so no temporal trait; the omitted class is the
    hypermedia templates.
  names:
    singular: codeofconduct
  displayTemplate: "{name}"
  properties:
    account:
      type: reference
      kind: account
      required: true
      onDelete: cascade
      displayName: Account
      description: the account this code of conduct was synced through
    key:
      type: string
      displayName: Key
      description: GitHub's `key` — the handle (`contributor_covenant`) the
        row's id derives from
    nodeId:
      type: string
      displayName: Node ID
      description: GitHub's `node_id`, the GraphQL global node id
    name:
      type: string
      displayName: Name
      description: the code of conduct's name
    body:
      type: text
      displayName: Body
      description: the text itself, when the payload carries it
    htmlUrl:
      type: url
      displayName: Code of conduct URL
      description: the page on GitHub
    url:
      type: url
      displayName: API URL
      description: the code of conduct's own REST address
---
# ---- mirror: one issue type -------------------------------------------------
# GitHub's issue types are organization-level objects with ids and their own
# `/orgs/{org}/issue-types` endpoint, so `issue.type` is a reference and not
# the inline object v2 read as a growing string.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/github/issuetype
data:
  authority: providers.substrate.reamde.dev
  package: github
  description: >-
    One organization issue type (Bug, Feature, Task …) as REST v3 embeds it
    on an issue. `at` is `created_at`; the omitted class is the hypermedia
    templates.
  names:
    singular: issuetype
  traits:
    - temporal(point)
  displayTemplate: "{name}"
  properties:
    account:
      type: reference
      kind: account
      required: true
      onDelete: cascade
      displayName: Account
      description: the account this issue type was synced through
    issuetypeId:
      type: int
      displayName: Issue type ID
      description: GitHub's `id` — the numeric issue-type id
    nodeId:
      type: string
      displayName: Node ID
      description: GitHub's `node_id`, the GraphQL global node id
    name:
      type: string
      displayName: Name
      description: the issue type's name, as the organization spelled it
    description:
      type: text
      displayName: Description
      description: what the organization says the type is for
    color:
      type: enum
      values:
        - value: gray
          label: gray
        - value: blue
          label: blue
        - value: green
          label: green
        - value: yellow
          label: yellow
        - value: orange
          label: orange
        - value: red
          label: red
        - value: pink
          label: pink
        - value: purple
          label: purple
      displayName: Colour
      # The issue-types API closes the palette at these eight, so it is an
      # enum. GitHub sends `null` for "no colour", which is a DELETION of the
      # property and never a ninth value named `null`.
      description: "GitHub's `color` — the swatch the organization picked,
        one of eight"
    isEnabled:
      type: bool
      displayName: Enabled
      description: whether the organization still offers the type
    updatedAt:
      type: datetime
      displayName: Updated
      description: when the issue type last changed
---
# ---- mirror: one GitHub App -------------------------------------------------
# `performed_via_github_app` is a whole App object with an id and its own
# `/apps/{slug}` endpoint, so it is a kind and a reference — and its `owner` is
# a reference at the user mirror rather than another inline user.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/github/app
data:
  authority: providers.substrate.reamde.dev
  package: github
  description: >-
    One GitHub App as REST v3 describes it, embedded on an issue or a pull
    request that an app acted through. `at` is `created_at`; the omitted class
    is the hypermedia templates.
  names:
    singular: app
  traits:
    - temporal(point)
  displayTemplate: "{name}"
  properties:
    account:
      type: reference
      kind: account
      required: true
      onDelete: cascade
      displayName: Account
      description: the account this app was synced through
    appId:
      type: int
      displayName: App ID
      description: GitHub's `id` — the numeric app id
    nodeId:
      type: string
      displayName: Node ID
      description: GitHub's `node_id`, the GraphQL global node id
    slug:
      type: string
      displayName: Slug
      description: the app's URL-friendly handle
    clientId:
      type: string
      displayName: Client ID
      description: the app's OAuth client id, as GitHub sends it on the payload
    name:
      type: string
      displayName: Name
      description: the app's display name
    description:
      type: text
      displayName: Description
      description: what the app says it does
    externalUrl:
      type: url
      displayName: External URL
      description: the app's own website
    htmlUrl:
      type: url
      displayName: App URL
      description: the app's page on GitHub
    installationsCount:
      type: int
      displayName: Installations
      description: how many accounts have installed the app
    events:
      type: string
      repeated: true
      displayName: Events
      description: the webhook events the app subscribes to
    permissions:
      type: string
      keyed: true
      displayName: Permissions
      # NO `keyPattern`: the keys are GitHub's own scope names and they carry
      # underscores (`pull_requests`, `single_file`,
      # `organization_administration`), so `camel` — the grammar for a
      # DECLARED property name — refused every real app payload. The key is
      # data here, not a name this package chose.
      description: "GitHub's `permissions`: the app's scope map, each to read
        | write | admin"
    owner:
      type: reference
      kind: providers.substrate.reamde.dev/github/user
      mustExist: true
      displayName: Owner
      description: the user or organization that owns the app
    updatedAt:
      type: datetime
      displayName: Updated
      description: when the app's registration last changed
---
# ---- mirror: one issue comment ----------------------------------------------
# A comment has an id and its own `/repos/{o}/{r}/issues/comments/{id}`
# endpoint, so `issue.pinnedComment` is a reference at this kind. The sync
# writes a row only for a comment a payload embeds; a comments stream is a
# later stage, and this kind is what it will fill.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/github/comment
data:
  authority: providers.substrate.reamde.dev
  package: github
  description: >-
    One comment on an issue or a pull request, as REST v3 describes it. `at`
    is `created_at`; the omitted class is the hypermedia templates. Today
    only a pinned comment embedded on an issue mints one.
  names:
    singular: comment
  traits:
    - temporal(point)
  displayTemplate: "{user.login}"
  properties:
    account:
      type: reference
      kind: account
      required: true
      onDelete: cascade
      displayName: Account
      description: the account this comment was synced through
    commentId:
      type: int
      displayName: Comment ID
      description: GitHub's `id` — the numeric comment id
    nodeId:
      type: string
      displayName: Node ID
      description: GitHub's `node_id`, the GraphQL global node id
    body:
      type: markdown
      displayName: Body
      description: the comment text, GitHub-flavoured markdown
    authorAssociation:
      type: enum
      values:
        - value: collaborator
          label: COLLABORATOR
        - value: contributor
          label: CONTRIBUTOR
        - value: firsttimer
          label: FIRST_TIMER
        - value: firsttimecontributor
          label: FIRST_TIME_CONTRIBUTOR
        - value: mannequin
          label: MANNEQUIN
        - value: member
          label: MEMBER
        - value: none
          label: NONE
        - value: owner
          label: OWNER
      displayName: Author association
      description: how the commenter relates to the repository — all eight
        of GitHub's values, lowercased with the underscores dropped
    reactions:
      type: object
      fields:
        totalCount: int
        plusOne: int
        minusOne: int
        laugh: int
        hooray: int
        confused: int
        heart: int
        rocket: int
        eyes: int
      displayName: Reactions
      description: the reaction counts; `+1` and `-1` are `plusOne` and `minusOne`
        because a field name may not open with a sign
    htmlUrl:
      type: url
      displayName: Comment URL
      description: the comment's anchor on the issue page
    url:
      type: url
      displayName: API URL
      description: the comment's own REST address
    user:
      type: reference
      kind: providers.substrate.reamde.dev/github/user
      mustExist: true
      displayName: Author
      description: GitHub's `user` — who wrote the comment
    issue:
      type: reference
      kind: providers.substrate.reamde.dev/github/issue
      mustExist: true
      displayName: Issue
      # The issue row is staged BEFORE the comment, and the issue's own
      # `pinnedComment` reference is attached in a LATER effect: the two name
      # each other, so no single order creates both with the link already
      # set. Absent when the comment arrived on a pull request, whose
      # `pinnedComment` reference is the join instead.
      description: the issue the comment sits on, from the payload that embedded
        it
    performedViaGithubApp:
      type: reference
      kind: providers.substrate.reamde.dev/github/app
      mustExist: true
      displayName: Performed via app
      description: GitHub's `performed_via_github_app` — the App that wrote
        the comment on somebody's behalf
    updatedAt:
      type: datetime
      displayName: Updated
      description: when the comment was last edited
