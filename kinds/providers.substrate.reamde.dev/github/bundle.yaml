    def _scalars(aid, payload, table):
        props = {"account": aid}
        for api_key, name, cast in table:
            _take(props, payload, api_key, name, cast)
        return props


    def _plan(u):
        plan = u.get("plan")
        if not isinstance(plan, dict):
            return None if "plan" in u else False
        out = {}
        _take(out, plan, "name", "name")
        _take(out, plan, "space", "space")
        _take(out, plan, "collaborators", "collaborators")
        _take(out, plan, "private_repos", "privateRepos")
        return _mint(out) or None


    def _user_props(aid, u):
        """One user row from any payload that carries a user — the embedded
        simple-user, GET /users/{login}, or GET /user."""
        props = _scalars(aid, u, USER_SCALARS)
        plan = _plan(u)
        if plan is not False:
            props["plan"] = plan
        return props


    class _Sink:
        """Stages the rows one page produces, COALESCED within the page.

        Every row is minted then patched: `put(if_absent=True)` with the payload's
        non-null half, then `patch` with the whole of it. The put can never clobber
        a fuller row (an existing row makes it a no-op) and the patch never nulls a
        field the payload did not carry, which is the guide's "thin then whole" in
        two effects.

        What changed after the review: a second, FULLER observation of a row
        inside the same page is no longer discarded. Version 14 returned at a
        `seen` guard, so the embedded simple-user that arrived first won over
        `GET /users/{login}`, and a pull request's `base.repo` — a whole
        repository payload — was thrown away because a stub for the same id had
        been staged a few lines earlier. The sink now keeps the merged property
        map per row and re-patches when a payload adds anything, and `put` is
        emitted once.

        Every reference the mirrors carry is `mustExist`, so the referent is
        staged first — effects apply in list order inside one invocation.
        """

        def __init__(self, host, aid, cur=None, fetch=None):
            self.host = host
            self.aid = aid
            self.cur = cur if cur is not None else {}
            self.fetch = fetch          # (path, allow_404) -> payload, or None
            self.seen = {}              # rid -> the properties written so far

        def _write(self, kind, rid, props, thin=False):
            known = self.seen.get(rid)
            if known is None:
                self.seen[rid] = dict(props)
                self.host.effects.put(kind, rid, properties=_mint(props),
                                      if_absent=True)
                if not thin:
                    self.host.effects.patch(kind, rid, properties=props)
                return rid
            # A later payload for the same row: patch with what it ADDS or
            # CHANGES, and never with what it merely repeats.
            delta = {k: v for k, v in props.items()
                     if k not in known or known[k] != v}
            delta.pop("account", None)
            if delta:
                known.update(props)
                self.host.effects.patch(kind, rid, properties=delta)
            return rid

        def patch(self, kind, rid, props):
            """A deferred link, attached after both ends exist."""
            self.seen.setdefault(rid, {}).update(props)
            self.host.effects.patch(kind, rid, properties=props)

        # -- users ----------------------------------------------------------
        def user_ref(self, u, thin=True):
            """Stage a `user` row for an embedded user object and hand back its
            record id, which IS the reference value.

            The row is keyed on GitHub's NUMERIC user id, so a rename keeps one
            row and a reused handle never lands on somebody else's links. A
            payload with no `id` (the owner segment of a repository path is the
            only one this sync meets) mints NOTHING: the login goes on the
            profile queue instead and the reference is left absent until
            `GET /users/{login}` supplies an identity. Absent is the guide's
            answer for a fact not yet known; a login-keyed stub is not.

            `thin` is the default because an embedded simple-user carries about a
            third of a profile: it MINTS the row and lets a fuller payload patch
            it. `GET /users/{login}` and `GET /user` pass thin=False.
            """
            if not isinstance(u, dict):
                return None
            login = (u.get("login") or "").strip()
            if login:
                _enqueue(self.cur, "users", login, "usersFetch")
            uid = u.get("id")
            if uid is None:
                return None
            rid = _user_id(self.host, self.aid, uid)
            return self._write(USER_TYPE, rid, _user_props(self.aid, u), thin=thin)

        def parent_key(self, full, number):
            """The record id of an issue this run already identified, or None."""
            if not full or number is None:
                return None
            return (self.cur.get("issueIds") or {}).get("%s#%s" % (full, number))

        def user_id_ref(self, uid):
            """A user named by NUMERIC ID alone — `team.organization_id` is the
            only one. The row carries its identity and nothing else; any payload
            that names the same organization fills the rest in."""
            if uid is None:
                return None
            rid = _user_id(self.host, self.aid, uid)
            return self._write(USER_TYPE, rid,
                               {"account": self.aid, "userId": uid}, thin=True)

        def user_refs(self, objs):
            out = []
            for u in objs or []:
                rid = self.user_ref(u)
                if rid and rid not in out:
                    out.append(rid)
            return out

        # -- repositories ---------------------------------------------------
        def resolve_repo(self, full):
            """The repository row a `owner/name` path names, READ if this run has
            not seen it.

            A search item names its repository by URL alone, so version 14 minted
            a path-keyed stub and the four `GET /repos/{o}/{r}` recordings in the
            fixture set were never requested by anything. One read per distinct
            repository per run resolves the numeric identity AND lands every
            full-repository field (`subscribers_count`, `network_count`,
            `organization`, `parent`, `source`, `template_repository`, `license`,
            `code_of_conduct`, `topics`, `security_and_analysis`) that had a
            declaration and no writer.
            """
            if not full:
                return None
            ids = self.cur.setdefault("repoIds", {})
            rid_num = ids.get(full)
            if rid_num is not None:
                rid = _repo_id(self.host, self.aid, rid_num)
                if rid not in self.seen:
                    self._write(REPO_TYPE, rid,
                                {"account": self.aid, "repositoryId": rid_num,
                                 "fullName": full}, thin=True)
                return rid
            if self.fetch is None:
                return None
            payload = self.fetch("/repos/" + full, True)
            if not isinstance(payload, dict) or payload.get("id") is None:
                return None
            return self.repo_ref(payload)

        def repo_ref(self, payload, depth=0):
            """A repository row from a full or embedded repository payload. The
            key is the numeric id; a payload without one is not a repository this
            mirror can name, and the caller resolves it instead."""
            if not isinstance(payload, dict) or payload.get("id") is None:
                return None
            rid_num = payload["id"]
            full = payload.get("full_name") or ""
            if full:
                self.cur.setdefault("repoIds", {})[full] = rid_num
            rid = _repo_id(self.host, self.aid, rid_num)
            props = _scalars(self.aid, payload, REPO_SCALARS)
            owner = self.user_ref(payload.get("owner"))
            if owner:
                props["owner"] = owner
            elif "owner" in payload and payload.get("owner") is None:
                props["owner"] = None
            for key, name in (("organization", "organization"),):
                if key in payload:
                    who = payload.get(key)
                    props[name] = self.user_ref(who) if isinstance(who, dict) else None
            # A fork names its parent and its source, and a generated repository
            # names its template — each a whole repository payload, mirrored one
            # level deep (GitHub never nests a second). A present `null` DELETES
            # the reference; only an absent key is left alone.
            if depth < 1:
                for key, name in (("parent", "parent"), ("source", "source"),
                                  ("template_repository", "templateRepository")):
                    if key not in payload:
                        continue
                    nested = payload.get(key)
                    if not isinstance(nested, dict):
                        props[name] = None
                        continue
                    ref = self.repo_ref(nested, depth=depth + 1)
                    props[name] = ref
                    if nested.get("full_name"):
                        _enqueue(self.cur, "repos", nested["full_name"], "reposFetch")
            if "license" in payload:
                props["license"] = self.license_ref(payload.get("license"))
            if "code_of_conduct" in payload:
                props["codeOfConduct"] = self.coc_ref(payload.get("code_of_conduct"))
            if "custom_properties" in payload:
                custom = payload.get("custom_properties")
                if isinstance(custom, dict):
                    # A keyed OBJECT with a scalar and a list alternative. The
                    # comma join version 14 used made `"a, b"` and `["a", "b"]`
                    # the same fact; a null value is an empty object, which is
                    # "set to nothing" rather than "not set".
                    props["customProperties"] = {
                        k: ({"values": [str(x) for x in v]} if isinstance(v, list)
                            else {} if v is None else {"value": str(v)})
                        for k, v in custom.items()} or None
                else:
                    props["customProperties"] = None
            if "permissions" in payload:
                value = payload.get("permissions")
                if isinstance(value, dict):
                    out = {}
                    for api_key, fname in (("admin", "admin"), ("maintain", "maintain"),
                                           ("push", "push"), ("triage", "triage"),
                                           ("pull", "pull")):
                        _take(out, value, api_key, fname, bool)
                    props["permissions"] = _mint(out) or None
                else:
                    props["permissions"] = None
            if "security_and_analysis" in payload:
                sec = payload.get("security_and_analysis")
                if isinstance(sec, dict):
                    out = {}
                    for api_key, fname in SECURITY_FEATURES:
                        block = sec.get(api_key)
                        if not isinstance(block, dict):
                            continue
                        status = _enum_of(SECURITY_STATUS)(block.get("status"))
                        if status:
                            out[fname] = {"status": status}
                    props["securityAndAnalysis"] = out or None
                else:
                    props["securityAndAnalysis"] = None
            if "topics" in payload:
                value = payload.get("topics")
                props["topics"] = list(value) if isinstance(value, list) and value \
                    else None
            return self._write(REPO_TYPE, rid, props)

        # -- teams, milestones, labels --------------------------------------
        def team_refs(self, teams, _depth=0, _busy=None):
            out = []
            busy = _busy if _busy is not None else set()
            for t in teams or []:
                if not isinstance(t, dict) or t.get("id") is None:
                    continue
                if t["id"] in busy or _depth > 8:
                    continue                 # a self- or cyclic parent chain
                busy.add(t["id"])
                rid = _simple_id(self.host, self.aid, "team", t["id"])
                props = _scalars(self.aid, t, TEAM_SCALARS)
                if "organization_id" in t:
                    props["organization"] = self.user_id_ref(t.get("organization_id"))
                if "permissions" in t:
                    value = t.get("permissions")
                    if isinstance(value, dict):
                        out = {}
                        for api_key in ("pull", "triage", "push", "maintain",
                                        "admin"):
                            _take(out, value, api_key, api_key, bool)
                        props["permissions"] = _mint(out) or None
                    else:
                        props["permissions"] = None
                if "parent" in t:
                    parent = t.get("parent")
                    kids = self.team_refs([parent], _depth + 1, busy) \
                        if isinstance(parent, dict) else []
                    props["parent"] = kids[0] if kids else None
                self._write(TEAM_TYPE, rid, props)
                if rid not in out:
                    out.append(rid)
            return out

        def license_ref(self, lic, hydrated=False):
            """A `license` row from the object a REPOSITORY embeds, or from the
            catalogue read itself.

            The embedded object carries five of the fourteen declared fields:
            `description`, `implementation`, `body`, `featured`, `html_url` and
            the three permission lists come from `/licenses/{key}` and nowhere
            else, and version 15 declared them all and never asked (T-022). The
            key goes on the catalogue queue unless THIS payload is the answer to
            that read — and only when GitHub gives the licence its own `url`: the
            `other` licence has none and the endpoint 404s for it.
            """
            if not isinstance(lic, dict) or not lic.get("key"):
                return None
            if not hydrated and lic.get("url"):
                _enqueue(self.cur, "licenses", ["license", str(lic["key"])],
                         "licensesFetch")
            rid = self.host.ids.external("github", self.aid,
                                         "license/" + str(lic["key"]).lower())
            props = {"account": self.aid}
            for api_key, name in (("key", "key"), ("node_id", "nodeId"),
                                  ("name", "name"), ("spdx_id", "spdxId"),
                                  ("description", "description"),
                                  ("implementation", "implementation"),
                                  ("body", "body"), ("featured", "featured"),
                                  ("html_url", "htmlUrl"), ("url", "url")):
                _take(props, lic, api_key, name)
            for api_key, name in (("permissions", "permissions"),
                                  ("conditions", "conditions"),
                                  ("limitations", "limitations")):
                if api_key not in lic:
                    continue
                value = lic.get(api_key)
                props[name] = list(value) if isinstance(value, list) and value else None
            return self._write(LICENSE_TYPE, rid, props)

        def coc_ref(self, coc, hydrated=False):
            # Likewise `/codes_of_conduct/{key}`, which is where `body` lives.
            if not isinstance(coc, dict) or not coc.get("key"):
                return None
            if not hydrated and coc.get("url"):
                _enqueue(self.cur, "licenses", ["codeofconduct", str(coc["key"])],
                         "licensesFetch")
            rid = self.host.ids.external("github", self.aid,
                                         "codeofconduct/" + str(coc["key"]).lower())
            props = {"account": self.aid}
            for api_key, name in (("key", "key"), ("node_id", "nodeId"),
                                  ("name", "name"), ("body", "body"),
                                  ("html_url", "htmlUrl"), ("url", "url")):
                _take(props, coc, api_key, name)
            return self._write(COC_TYPE, rid, props)

        def issuetype_ref(self, it):
            if not isinstance(it, dict) or it.get("id") is None:
                return None
            rid = _simple_id(self.host, self.aid, "issuetype", it["id"])
            props = {"account": self.aid}
            for api_key, name in (("id", "issuetypeId"), ("node_id", "nodeId"),
                                  ("name", "name"), ("description", "description"),
                                  ("is_enabled", "isEnabled"),
                                  ("updated_at", "updatedAt"), ("created_at", "at")):
                _take(props, it, api_key, name)
            _take(props, it, "color", "color", _enum_of(ISSUETYPE_COLORS))
            return self._write(ISSUETYPE_TYPE, rid, props)

        def app_ref(self, app):
            if not isinstance(app, dict) or app.get("id") is None:
                return None
            rid = _simple_id(self.host, self.aid, "app", app["id"])
            props = {"account": self.aid}
            for api_key, name in (("id", "appId"), ("node_id", "nodeId"),
                                  ("slug", "slug"), ("client_id", "clientId"),
                                  ("name", "name"), ("description", "description"),
                                  ("external_url", "externalUrl"),
                                  ("html_url", "htmlUrl"),
                                  ("installations_count", "installationsCount"),
                                  ("updated_at", "updatedAt"), ("created_at", "at")):
                _take(props, app, api_key, name)
            if "events" in app:
                value = app.get("events")
                props["events"] = list(value) if isinstance(value, list) and value \
                    else None
            if "permissions" in app:
                value = app.get("permissions")
                # The keys are GitHub's scope names and carry underscores; the
                # declaration no longer pins `keyPattern: camel`, which used to
                # refuse `pull_requests` and roll the whole page back.
                props["permissions"] = ({k: str(v) for k, v in value.items()} or None) \
                    if isinstance(value, dict) else None
            if "owner" in app:
                who = app.get("owner")
                props["owner"] = self.user_ref(who) if isinstance(who, dict) else None
            return self._write(APP_TYPE, rid, props)

        def comment_ref(self, c, issue_ref):
            if not isinstance(c, dict) or c.get("id") is None:
                return None
            rid = _simple_id(self.host, self.aid, "comment", c["id"])
            props = {"account": self.aid}
            for api_key, name in (("id", "commentId"), ("node_id", "nodeId"),
                                  ("body", "body"), ("html_url", "htmlUrl"),
                                  ("url", "url"), ("updated_at", "updatedAt"),
                                  ("created_at", "at")):
                _take(props, c, api_key, name)
            _take(props, c, "author_association", "authorAssociation", _enum)
            reactions = _object(c, "reactions", REACTION_FIELDS)
            if reactions is not False:
                props["reactions"] = reactions
            if "user" in c:
                who = c.get("user")
                props["user"] = self.user_ref(who) if isinstance(who, dict) else None
            if "performed_via_github_app" in c:
                who = c.get("performed_via_github_app")
                props["performedViaGithubApp"] = self.app_ref(who) \
                    if isinstance(who, dict) else None
            if issue_ref:
                props["issue"] = issue_ref
            return self._write(COMMENT_TYPE, rid, props)

        def milestone_ref(self, m, repo):
            if not isinstance(m, dict) or m.get("id") is None:
                return None
            rid = _simple_id(self.host, self.aid, "milestone", m["id"])
            props = _scalars(self.aid, m, MILESTONE_SCALARS)
            if "creator" in m:
                who = m.get("creator")
                props["creator"] = self.user_ref(who) if isinstance(who, dict) else None
            if repo:
                props["repository"] = repo
            return self._write(MILESTONE_TYPE, rid, props)

        def label_refs(self, labels, repo):
            out = []
            for lab in labels or []:
                if not isinstance(lab, dict) or lab.get("id") is None:
                    continue
                rid = _simple_id(self.host, self.aid, "label", lab["id"])
                props = _scalars(self.aid, lab, LABEL_SCALARS)
                if "archived_by" in lab:
                    who = lab.get("archived_by")
                    props["archivedBy"] = self.user_ref(who) \
                        if isinstance(who, dict) else None
                if repo:
                    props["repository"] = repo
                self._write(LABEL_TYPE, rid, props)
                if rid not in out:
                    out.append(rid)
            return out


