# The GitHub bundle — a COMPLETE, FIRST-CLASS mirror of the code work the
# owner is involved in. SYNC-ONLY: nothing here writes back to GitHub.
#
# It connects a GitHub account over the host OAuth facility and mirrors what
# GitHub holds about the owner: the connected user, the repositories the
# account can reach, and every issue and pull request the user is involved in
# (author / assignee / mentioned / commenter) or review-requested on —
# `involves:` does NOT cover review requests, so those ride a third
# `review-requested:` search.
#
# THE RULE THIS BUNDLE OBEYS is `docs/kind-design.md` (v3), and every line of
# it is load-bearing here:
#
#   * a kind IS the API object, complete: every documented field is a
#     top-level property under the API's name camelCased, minus TWO named
#     classes (the response envelope and hypermedia `*_url` templates). A
#     constant discriminator is NOT omitted — it is a one-value enum — and a
#     discriminator is only constant where the SCHEMA says so and the corpus
#     agrees: `team.type` is a `string`, because every team in this account's
#     data spells it `organization`. There is no `raw`;
#   * a resource's IDENTITY is its own, and two resources are two rows: a
#     pull request has a PULL id and an ISSUE id and this mirror carries both
#     (`pullRequestId`, `issueId`), keyed on the pull id, which a search hit
#     supplies by a lossless decode of its `PR_…` node id;
#   * every relation is a REFERENCE at the kind that holds the other end —
#     `issue.user`, `issue.assignees`, `issue.milestone`, `issue.labels`,
#     `pullrequest.requestedReviewers`, `pullrequest.requestedTeams`,
#     `repository.owner`, `milestone.creator`, `review.pullRequest`. No login
#     scalar stands beside one, and no user id is mirrored where the user is;
#   * every set GitHub's schema closes is an `enum` whose values are spelled
#     `[a-z][a-z0-9]*` (the loader's rule) and whose LABELS carry GitHub's own
#     spelling — `state`, `stateReason`, `authorAssociation`, `visibility`,
#     the merge-commit pair, a review's `state`, a team's `privacy`;
#   * every instant is a `datetime`, and `created_at` lands on the temporal
#     trait's `at` rather than being redeclared;
#   * a provider knows nothing about its consumer: there is no `person` slot,
#     no `task` slot and no owner-relative flag anywhere. The engine
#     synthesises a mapping's subject slot (substrate #570); "assigned to me"
#     is a filter on `assignees`, and "is this a task" is Mneme's question;
#   * no sync bookkeeping on a mirror: the stream watermarks live on the
#     account row and nowhere else.
#
# WHAT THE SYNC UPSERTS BEFORE THE ROW THAT NEEDS IT. Every reference is
# `mustExist`, so the referent is always staged first inside the same
# invocation: a `user` row for every embedded user object (author, assignee,
# reviewer, merger, milestone creator, repository owner), a `repository` row
# for every repository named, a `milestone`, a `label` and a `team` row for
# every embedded one. A row minted from an embedded object carries what that
# payload carried; the fuller read PATCHES it and never nulls a field the
# thinner payload did not name.
#
# WHAT VERSION 16 ADDS (T-022) is the reads version 15 declared and never
# made. The issue GRAPH — `subIssues`, `blockedBy`, `blocking` — is REFERENCES
# now and not only the counts `subIssuesSummary` and
# `issueDependenciesSummary` carry, read from `/issues/{n}/sub_issues` and
# `/issues/{n}/dependencies/*`; a `license` and a `codeofconduct` row are
# completed from `/licenses/{key}` and `/codes_of_conduct/{key}` rather than
# left at the five fields a repository embeds; and `pullrequest.stack` is
# declared, because GitHub's OpenAPI description carries it on the selected
# schema even though no payload in the owner's corpus does.
#
# Install:  substratectl apply -f bundle.yaml -f triggers.yaml
# Configure: create a config record — the GitHub OAuth app's client id +
#   secret, and (tests only) an `apiBase`. The provider ENDPOINTS and the
#   feature->scope mapping are TRUSTED bundle-manifest metadata (the `oauth2:`
#   block below), never config-record properties.
# Connect:  create an account, then run the host OAuth flow against it.
#
# This file is the SCHEMA closure (the atomic install unit). The delivery
# wiring lives beside it in triggers.yaml as ordinary data records.
# ---- the owned package --------------------------------------------------------
kind: substrate.reamde.dev/core/package
metadata:
  id: providers.substrate.reamde.dev/github
data:
  authority: providers.substrate.reamde.dev
  package: github
  version: 21
---
# ---- the bundle document: the install unit --------------------------------
# `installs:` names EXACTLY the package's schema members. No mapping: this
# package owns no person and no task, and the owner of a mapping's target is
# the one who declares it (record 0049).
kind: substrate.reamde.dev/core/bundle
metadata:
  id: providers.substrate.reamde.dev/github
data:
  authority: providers.substrate.reamde.dev
  package: github
  description: >-
    Keeps a copy of the GitHub issues and pull requests you are involved in,
    with their repositories, milestones, labels and reviews. Read-only.
  # The one declared input: the OAuth client record. `inject: functions`
  # because the sync reads `apiBase` off it — the engine SKIPS the oauth2
  # trait's `clientSecret` when it builds an injected record view
  # (engine/invocationconfig.go, isOAuthFacilitySecret), so the body still
  # never sees a client secret or a credential ref.
  inputs:
    client:
      kind: providers.substrate.reamde.dev/github/config
      inject: functions
      description: the GitHub OAuth app the host exchanges codes through
  # TRUSTED provider metadata: the host reads endpoints and the
  # feature->scope mapping ONLY from here — the immutable install artifact —
  # never from the mutable config record, so a config edit can never redirect
  # a token exchange. GitHub's classic OAuth scopes are COARSE: there is no
  # read-only repository grant, so issues / pull requests / repos on private
  # repositories all ride the one `repo` scope.
  oauth2:
    clientInput: client
    authorizationEndpoint: https://github.com/login/oauth/authorize
    tokenEndpoint: https://github.com/login/oauth/access_token
    # No revocationEndpoint: GitHub revokes app grants over a Basic-auth
    # DELETE /applications/{client_id}/grant, not an RFC 7009 endpoint the
    # facility can POST a token at. Disconnect still deletes the stored
    # credential; the grant is revoked from GitHub's settings page.
    emailEndpoint: https://api.github.com/user
    emailProperty: email
    featureScopes:
      enabledUser:
        scopes:
          - read:user
      enabledRepos:
        scopes:
          - read:user
          - repo
      enabledIssues:
        scopes:
          - read:user
          - repo
      enabledPullRequests:
        scopes:
          - read:user
          - repo
  installs:
    - providers.substrate.reamde.dev/github/config
    - providers.substrate.reamde.dev/github/account
    - providers.substrate.reamde.dev/github/user
    - providers.substrate.reamde.dev/github/repository
    - providers.substrate.reamde.dev/github/license
    - providers.substrate.reamde.dev/github/codeofconduct
    - providers.substrate.reamde.dev/github/issuetype
    - providers.substrate.reamde.dev/github/app
    - providers.substrate.reamde.dev/github/comment
    - providers.substrate.reamde.dev/github/team
    - providers.substrate.reamde.dev/github/milestone
    - providers.substrate.reamde.dev/github/label
    - providers.substrate.reamde.dev/github/issue
    - providers.substrate.reamde.dev/github/pullrequest
    - providers.substrate.reamde.dev/github/review
    - providers.substrate.reamde.dev/github/githubsync
---
# ---- the config type: the `client` input's kind ----------------------------
# oauth2 (the OAuth CLIENT credentials the facility uses to exchange codes):
# the GitHub OAuth app the owner registers. Endpoints and scopes are manifest
# metadata above; `apiBase` is the one thing the FUNCTION reads here.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/github/config
data:
  authority: providers.substrate.reamde.dev
  package: github
  description: >-
    The GitHub OAuth app this bundle authenticates through — its client id,
    a sealed client secret, and a test-only API base. The record the bundle's
    client input resolves; endpoints and scopes are manifest metadata rather
    than editable rows.
  names:
    singular: config
  traits: [oauth2]
  displayTemplate: "GitHub app {clientId}"
  properties:
    clientId:
      type: string
      displayName: Client ID
      description: the GitHub OAuth app's client id (from github.com/settings/developers)
    clientSecret:
      type: secret
      displayName: Client secret
      description: the GitHub OAuth app's client secret — sealed at rest,
        never read back
    apiBase:
      type: url
      writer: owner
      # The body PINS the origin the access token may travel to: exactly
      # https://api.github.com, or a loopback host (127.0.0.1 / localhost /
      # ::1, any scheme) as the test seam. Anything else refuses BEFORE
      # sending — an owner-editable URL must never become an exfiltration
      # channel. This is what lets tools/mockserver.py stand in for GitHub in
      # the e2e run and in `mnemectl seed-provider github`.
      displayName: API base URL
      description: >-
        test-only override of https://api.github.com — loopback hosts only;
        any other origin refuses to sync. Leave empty in production.
---
# ---- the account type: one connected GitHub account ------------------------
# accountconfig (its records ARE the bundle's connected accounts; the host
# writes tokenRef + tokenStatus + grantedScopes over the OAuth facility).
# Every property carries a `writer:` role so only its rightful hand may set it.
#
# THIS IS WHERE THE SYNC'S BOOKKEEPING LIVES, and nowhere else: `syncCursors`
# is the per-stream watermark map, `lastSyncedAt` / `syncStatus` the run
# stamp, `syncRequestedAt` / `syncRequestedAck` the "sync now" generation. No
# mirror kind carries any of it (`docs/kind-design.md` §1).
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/github/account
data:
  authority: providers.substrate.reamde.dev
  package: github
  description: >-
    One connected GitHub account: these records ARE the bundle's connections.
    The OAuth facility writes the credential reference and the connection
    status, the owner flips the feature toggles, and the sync keeps its per-stream
    watermarks here rather than on any mirror.
  names:
    singular: account
  # `sync` is the core trait the Connections page, `GET /api/v1/sync/status`
  # and `substratectl sync status` read (substrate decision 0085). This bundle
  # is SINGLE-STREAM — one sync function over one account — so the trait's
  # account-level properties ARE the whole truth and `syncStreams` stays
  # unwritten; `syncRequestedAck` alone answers a request, exactly as 0085
  # says a single-function provider does it. The legacy `syncStatus` /
  # `lastSyncedAt` / `syncCursors` / `syncPending` stay beside the trait,
  # unchanged, because a narrowing is refused once rows hold the old shape.
  traits: [accountconfig, sync]
  displayTemplate: "{email}"
  properties:
    # ---- identity and the grant (the OAuth facility's) --------------------
    tokenRef:
      type: secret
      writer: oauth
      displayName: Token reference
      description: the credential-store reference the OAuth facility writes;
        never a raw token
    tokenStatus:
      type: string
      writer: oauth
      displayName: Connection status
      description: "the connection state the facility last reported — a growing
        list, not an enum (pending | connected | erroring)"
    grantedScopes:
      type: string
      repeated: true
      writer: oauth
      displayName: Granted scopes
      description: the OAuth scopes the last consent was granted for; drives
        reconnect-on-new-feature
    email:
      type: email
      writer: oauth
      displayName: Email
      description: the connected GitHub account's public email, set by the
        OAuth facility from the grant
    # ---- who this account is ---------------------------------------------
    # A REFERENCE, not a login string: `docs/kind-design.md` §1 forbids a copy
    # of a referent, and the owner of a Mneme repository is `account.user`.
    user:
      type: reference
      kind: providers.substrate.reamde.dev/github/user
      mustExist: true
      displayName: User
      description: the GitHub user this account authenticates as, from GET
        /user — "me", and what every owner-relative question filters on
    # ---- what the owner asked for ----------------------------------------
    enabledUser:
      type: bool
      writer: owner
      displayName: Profile
      description: >-
        mirror the connected user's own profile, and hydrate a full profile
        (name, public email) for every other login the sync meets
    enabledRepos:
      type: bool
      writer: owner
      displayName: Repositories
      description: mirror the repositories this account can reach
    enabledIssues:
      type: bool
      writer: owner
      displayName: Issues
      description: mirror every issue the connected user is involved in
    enabledPullRequests:
      type: bool
      writer: owner
      displayName: Pull requests
      description: mirror every pull request the connected user is involved
        in or review-requested on, with its reviews
    syncFrequency:
      type: enum
      values:
        - value: off
          label: Off
        - value: hourly
          label: "Every hour"
        - value: daily
          label: "Once a day"
      required: true
      default: daily
      writer: owner
      displayName: Sync frequency
      description: "the scheduled sync cadence for this account (default daily)"
    backfillDepth:
      type: enum
      values:
        - value: none
          label: "Don't backfill"
        - value: last30d
          label: "Last 30 days"
        - value: last90d
          label: "Last 90 days"
        - value: last1y
          label: "Last year"
        - value: all
          label: Everything
      required: true
      default: last30d
      writer: owner
      displayName: Backfill depth
      description: "how far back the first issues / pull-requests sync reaches
        (none = from connect time forward; default 30 days)"
    # "Sync now", as a GENERATION rather than a moment. The owner stamps
    # `syncRequestedAt`; the sync echoes the value it acted on into
    # `syncRequestedAck`; the `github-on-request` trigger fires exactly while
    # the two disagree. Comparing the request against `lastSyncedAt` instead
    # would look simpler and would LOOP forever on a request dated in the
    # future — the sync's own stamp would never overtake it. A generation
    # cannot outrun its acknowledgement whatever the clocks say.
    syncRequestedAt:
      type: datetime
      writer: owner
      displayName: Sync requested
      description: stamp this to ask for a sync now, whatever the cadence
        says
    # The owner's SECOND hand on a sync (the trait's other `writer: owner`
    # property): stop them. The dispatcher settles a paused record's
    # deliveries as skips, and the scheduled path passes over a paused
    # account in `_due` — so neither the console's Sync-now button nor the
    # hourly tick can drive it while this is true. An operator naming the
    # account explicitly (`args.account`) still runs: a pause is the owner's
    # cadence instruction, not a lock.
    syncPaused:
      type: bool
      writer: owner
      displayName: Paused
      description: "while true, the dispatcher skips this account's deliveries
        and the scheduled sync passes over it"
    # ---- the sync's own bookkeeping (writer: connector) -------------------
    syncRequestedAck:
      type: datetime
      writer: connector
      displayName: Sync request acknowledged
      description: the `syncRequestedAt` the last sync acted on — equal means
        the request is spent
    syncCursors:
      type: datetime
      keyed: true
      keyPattern: camel
      writer: connector
      displayName: Sync cursors
      description: >-
        the per-stream incremental floor, keyed by stage (issues, pulls, pullsReview)
        — one stage hitting a search cap never advances another's tail
    syncPending:
      type: json
      writer: connector
      displayName: Pending hydration
      # The hydration BACKLOG, durable across runs. A drain is bounded (512
      # invocations, two minutes) and a paged checkpoint dies with it, so work
      # that lives only in the cursor is work that is redone from scratch
      # every round and never finishes. Keyed by queue (`repos`, `licenses`,
      # `pulls`, `reviews`, `issues`, `graph`, `users`), each a list of the
      # entries still to fetch; a run with a backlog hydrates it BEFORE it
      # walks any search.
      description: the hydration work still to do, per queue — the backlog
        a bounded drain leaves behind
    syncSkipped:
      type: json
      writer: connector
      displayName: Skipped by GitHub
      # `{"restricted": {"<org>": {"items": n, "repo": "<org>/<name>", "at":
      # <when>}}}` — the organizations that answered a read with GitHub's
      # OAuth-app or SAML refusal (T-077), how many items each has cost since
      # the last clean walk, and one repository the next run re-asks to learn
      # whether the owner has approved the app. An org is dropped when its
      # probe answers, and the search window the refusal hid is re-walked
      # from the backfill floor. Version 20.
      description: the items GitHub refused per restricted organization, with
        one repository the next run probes for the approval
    lastSyncedAt:
      type: datetime
      writer: connector
      displayName: Last synced
      description: when the last sync attempt finished (ok or erroring) —
        the cadence anchor and completion marker
    syncStatus:
      type: string
      writer: connector
      displayName: Sync status
      description: "the last sync outcome (ok | ok (partial: …) | ok (capped:
        …) | erroring: <reason>) — the LEGACY rollup string, kept beside the
        trait's syncState/syncMessage until the next major"
    # ---- the core `sync` trait (substrate decision 0085) ------------------
    # The twelve properties the trait contracts, each redeclared here with its
    # writer. The OWNER asks for a run (`syncRequestedAt`) and stops them
    # (`syncPaused`), both declared above; the CONNECTOR — this bundle's one
    # sync body through its effects, and the dispatcher around a
    # record-sourced delivery under the body's own actor — writes the other
    # ten. `syncState` is a plain STRING, not a state machine: the substrate
    # and the body both write it and no move between its five words
    # (never | running | ok | erroring | throttled) is illegal, so a machine
    # would only ever refuse a sync.
    syncState:
      type: string
      writer: connector
      displayName: Sync state
      description: "never | running | ok | erroring | throttled — the account-level
        state the Connections page renders as a chip"
    syncMessage:
      type: string
      writer: connector
      displayName: Sync message
      description: "the one human line the last run left — the same sentence
        `syncStatus` carries, without its legacy `erroring:` prefix"
    lastSyncStartedAt:
      type: datetime
      writer: connector
      displayName: Last sync started
      description: when the last run began — stamped by the dispatcher around
        a record-sourced delivery, and by the body itself on the schedule
        path
    lastSyncDurationMs:
      type: int
      writer: connector
      displayName: Last sync duration (ms)
      description: how long the last run took, from the same two hands as
        lastSyncStartedAt
    syncProgress:
      type: json
      writer: connector
      displayName: Sync progress
      # `{phase, done, total, pending}`, all four in HYDRATION ENTRIES:
      # `pending` is what `syncPending` still holds, `total` the high-water
      # mark this run saw, `done` the difference. A bounded drain writes it
      # at every backlog checkpoint, so a console watching an account that
      # takes twenty rounds sees the number FALL rather than a frozen
      # "syncing…".
      description: "{phase, done, total, pending} — the hydration backlog
        this drain is working through, checkpointed as it shrinks"
    syncError:
      type: string
      writer: connector
      displayName: Sync error
      description: the LAST error text, from the body or a parked delivery;
        it is not cleared by a later good run — syncErrorAt says when
    syncErrorAt:
      type: datetime
      writer: connector
      displayName: Sync error at
      description: when syncError was written
    syncStreams:
      type: json
      writer: connector
      displayName: Sync streams
      # Declared because the trait contracts it and a reader must find the
      # key; written by NOBODY here. This bundle has one function and one
      # stream, so the account-level state IS the stream's and 0085 says a
      # single-function provider answers a request with `syncRequestedAck`
      # alone. A per-stream map would be the same four values twice.
      description: "stream → {state, message, lastAt, pending, requestedAck};
        empty here — GitHub is one stream, so the account-level properties
        are it"
---
# ---- mirror: what GitHub holds about one user ------------------------------
# One row per (account, login) — the hub of this closure. Every other mirror
# POINTS here for a human: the issue's author and assignees, the pull
# request's requested reviewers and merger, the milestone's creator, the
# repository's owner, the review's author. An Organization is one of these
# rows with `type: organization`, which is what GitHub means by the shape.
#
# Thin then whole: a login first seen inside an embedded user object mints a
# row carrying that object's eleven fields and nothing else; `GET
# /users/{login}` PATCHES the rest onto it (`name`, `email`, `bio`, the
# counts), and the connected account's own row adds the private half of
# `GET /user` (`plan`, `diskUsage`, `totalPrivateRepos`, …).
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/github/user
data:
  authority: providers.substrate.reamde.dev
  package: github
  description: >-
    One GitHub account — a person, an organization or a bot — as REST v3 describes
    it (simple-user embedded, public-user from GET /users/{login}, private-user
    from GET /user). `at` is `created_at`; hypermedia `*_url` templates are
    the one omitted class.
  names:
    singular: user
  traits:
    - temporal(point)
  displayTemplate: "{name|login}"
  properties:
    # ---- identity --------------------------------------------------------
    account:
      type: reference
      kind: account
      required: true
      onDelete: cascade
      displayName: Account
      description: the account this user was synced through
    userId:
      type: int
      displayName: User ID
      description: GitHub's `id` — the numeric account id, stable across a
        login rename
    nodeId:
      type: string
      displayName: Node ID
      description: GitHub's `node_id`, the GraphQL global node id
    login:
      type: string
      displayName: Login
      description: the GitHub login — the handle every REST path and every
        search qualifier uses
    # ---- the profile's own fields, in the API reference's order -----------
    name:
      type: string
      displayName: Name
      description: the profile's full name; only a hydrated profile carries
        one — an embedded user object never does
    company:
      type: string
      displayName: Company
      description: the profile's company line, free text (often `@org`)
    blog:
      type: string
      displayName: Blog
      description: the profile's URL line as the user typed it — a `string`,
        because GitHub does not guarantee it parses
    location:
      type: string
      displayName: Location
      description: the profile's location line, free text
    email:
      type: email
      displayName: Email
      description: the profile's PUBLIC email, from GET /users/{login} or
        GET /user; absent when the profile hides it
    notificationEmail:
      type: email
      displayName: Notification email
      description: "GitHub's `notification_email`: the address the private
        profile routes notifications to (GET /user only)"
    hireable:
      type: bool
      displayName: Hireable
      description: whether the profile is marked available for hire
    bio:
      type: text
      displayName: Bio
      description: the profile's bio, as GitHub returns it
    twitterUsername:
      type: string
      displayName: Twitter username
      description: the profile's Twitter/X handle, without the at-sign
    publicRepos:
      type: int
      displayName: Public repos
      description: how many public repositories the profile counts
    publicGists:
      type: int
      displayName: Public gists
      description: how many public gists the profile counts
    followers:
      type: int
      displayName: Followers
      description: how many accounts follow this one
    following:
      type: int
      displayName: Following
      description: how many accounts this one follows
    type:
      type: enum
      values:
        - value: user
          label: User
        - value: organization
          label: Organization
        - value: bot
          label: Bot
        - value: mannequin
          label: Mannequin
      displayName: Type
      description: "GitHub's `type`, lowercased: User | Organization | Bot
        | Mannequin — an Organization is a user row, not a kind of its own"
    siteAdmin:
      type: bool
      displayName: Site admin
      description: whether GitHub marks the account a site administrator
    gravatarId:
      type: string
      displayName: Gravatar ID
      description: GitHub's `gravatar_id`, empty on every modern account and
        kept because the API still sends it
    userViewType:
      type: string
      displayName: View type
      description: "GitHub's `user_view_type`: which view of the account this
        payload is (public | private) — a growing list, so a string"
    avatarUrl:
      type: url
      displayName: Avatar URL
      description: the avatar image, absolute
    htmlUrl:
      type: url
      displayName: Profile URL
      description: the profile page, https://github.com/{login}
    url:
      type: url
      displayName: API URL
      description: the account's own REST address; the `*_url` templates hanging
        off it are the omitted hypermedia class
    totalPrivateRepos:
      type: int
      displayName: Private repos
      description: how many private repositories the account holds (GET /user
        only)
    ownedPrivateRepos:
      type: int
      displayName: Owned private repos
      description: how many private repositories the account owns (GET /user
        only)
    privateGists:
      type: int
      displayName: Private gists
      description: how many private gists the account holds (GET /user only)
    diskUsage:
      type: int
      displayName: Disk usage
      description: the account's disk usage in kilobytes (GET /user only)
    collaborators:
      type: int
      displayName: Collaborators
      description: how many collaborators the account's plan counts (GET /user
        only)
    twoFactorAuthentication:
      type: bool
      displayName: Two-factor auth
      description: whether the account has two-factor authentication on (GET
        /user only)
    businessPlus:
      type: bool
      displayName: Business plus
      description: GitHub's `business_plus` flag on the private profile
    ldapDn:
      type: string
      displayName: LDAP DN
      description: the LDAP distinguished name, on GitHub Enterprise accounts
    plan:
      type: object
      fields:
        name: string
        space: int
        collaborators: int
        privateRepos: int
      displayName: Plan
      description: the account's GitHub plan (GET /user only) — a value object
        with no id and no endpoint of its own
    # ---- instants (created_at IS the trait's `at`) ------------------------
    updatedAt:
      type: datetime
      displayName: Updated
      description: when the profile last changed
    suspendedAt:
      type: datetime
      displayName: Suspended
      description: when the account was suspended, on a GitHub Enterprise
        deployment that suspends accounts
---
# ---- mirror: one repository -------------------------------------------------
# Written whole off GET /user/repos when enabledRepos; issues, pull requests
# and the head/base of a pull request also mint rows for repositories the
# listing never covered (a pull request in somebody else's fork), so the
# required parent reference always resolves.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/github/repository
data:
  authority: providers.substrate.reamde.dev
  package: github
  description: >-
    One GitHub repository as the REST API v3 full-repository schema describes
    it, with its owner, parent, source and template as references. `at` is
    GitHub's `created_at`. The omitted classes are the hypermedia `*_url`
    templates and the search envelope.
  names:
    singular: repository
  traits:
    - temporal(point)
  displayTemplate: "{fullName}"
  properties:
    # ---- identity --------------------------------------------------------
    account:
      type: reference
      kind: account
      required: true
      onDelete: cascade
      displayName: Account
      description: the account this repository was synced through
    repositoryId:
      type: int
      displayName: Repository ID
      description: GitHub's `id` — the numeric repository id
    nodeId:
      type: string
      displayName: Node ID
      description: GitHub's `node_id`, the GraphQL global node id
    fullName:
      type: string
      displayName: Full name
      description: "the `owner/name` pair GitHub keys every path on (e.g.
        octocat/hello-world)"
    name:
      type: string
      displayName: Name
      description: the repository's bare name, without the owner
    # ---- the repository's own fields, in the API reference's order --------
    private:
      type: bool
      displayName: Private
      description: whether the repository is private
    description:
      type: text
      displayName: Description
      description: the repository's one-line description
    fork:
      type: bool
      displayName: Fork
      description: whether the repository is a fork of another
    homepage:
      type: string
      displayName: Homepage
      description: the homepage line as the user typed it — a `string`, because
        GitHub does not guarantee it parses
    language:
      type: string
      displayName: Language
      description: the repository's primary language, as GitHub computes it
    forksCount:
      type: int
      displayName: Forks
      description: how many forks GitHub counts
    forks:
      type: int
      displayName: Forks (alias)
      description: GitHub's `forks` — the same number as `forks_count`, sent
        twice by the API and mirrored twice rather than judged
    stargazersCount:
      type: int
      displayName: Stars
      description: how many accounts have starred it
    watchersCount:
      type: int
      displayName: Watchers
      description: how many accounts watch it
    watchers:
      type: int
      displayName: Watchers (alias)
      description: GitHub's `watchers` — the same number as `watchers_count`,
        sent twice by the API
    size:
      type: int
      displayName: Size
      description: the repository's size in kilobytes
    defaultBranch:
      type: string
      displayName: Default branch
      description: the branch a clone checks out
    openIssuesCount:
      type: int
      displayName: Open issues
      description: how many open issues and pull requests GitHub counts
    openIssues:
      type: int
      displayName: Open issues (alias)
      description: GitHub's `open_issues` — the same number as `open_issues_count`,
        sent twice by the API
    isTemplate:
      type: bool
      displayName: Template
      description: whether the repository is a template
    topics:
      type: string
      repeated: true
      displayName: Topics
      description: the repository's topics, as GitHub orders them
    hasIssues:
      type: bool
      displayName: Issues enabled
      description: whether the issues tab is on
    hasProjects:
      type: bool
      displayName: Projects enabled
      description: whether the projects tab is on
    hasWiki:
      type: bool
      displayName: Wiki enabled
      description: whether the wiki is on
    hasPages:
      type: bool
      displayName: Pages enabled
      description: whether GitHub Pages is on
    hasDownloads:
      type: bool
      displayName: Downloads enabled
      description: whether the legacy downloads feature is on
    hasDiscussions:
      type: bool
      displayName: Discussions enabled
      description: whether the discussions tab is on
    hasPullRequests:
      type: bool
      displayName: Pull requests enabled
      description: GitHub's `has_pull_requests` — whether the pull requests
        tab is on
    archived:
      type: bool
      displayName: Archived
      description: whether the repository is archived, read-only
    disabled:
      type: bool
      displayName: Disabled
      description: whether GitHub has disabled the repository
    visibility:
      type: enum
      values:
        - value: public
          label: public
        - value: private
          label: private
        - value: internal
          label: internal
      displayName: Visibility
      description: "GitHub's `visibility`: public | private | internal — the
        three-way word that `private` cannot say"
    allowRebaseMerge:
      type: bool
      displayName: Allow rebase merge
      description: whether rebase merging is allowed
    allowSquashMerge:
      type: bool
      displayName: Allow squash merge
      description: whether squash merging is allowed
    allowMergeCommit:
      type: bool
      displayName: Allow merge commit
      description: whether a merge commit is allowed
    allowAutoMerge:
      type: bool
      displayName: Allow auto-merge
      description: whether auto-merge may be enabled on a pull request
    allowForking:
      type: bool
      displayName: Allow forking
      description: whether forking is allowed
    allowUpdateBranch:
      type: bool
      displayName: Allow update branch
      description: whether a pull request branch may be updated from base
    deleteBranchOnMerge:
      type: bool
      displayName: Delete branch on merge
      description: whether the head branch is deleted when a pull request
        merges
    useSquashPrTitleAsDefault:
      type: bool
      displayName: Squash uses PR title
      description: GitHub's deprecated `use_squash_pr_title_as_default`, superseded
        by `squashMergeCommitTitle`
    squashMergeCommitTitle:
      type: enum
      values:
        - value: prtitle
          label: PR_TITLE
        - value: commitorprtitle
          label: COMMIT_OR_PR_TITLE
      displayName: Squash commit title
      description: "what a squash merge titles its commit: PR_TITLE | COMMIT_OR_PR_TITLE"
    squashMergeCommitMessage:
      type: enum
      values:
        - value: prbody
          label: PR_BODY
        - value: commitmessages
          label: COMMIT_MESSAGES
        - value: blank
          label: BLANK
      displayName: Squash commit message
      description: "what a squash merge writes as its body: PR_BODY | COMMIT_MESSAGES
        | BLANK"
    mergeCommitTitle:
      type: enum
      values:
        - value: prtitle
          label: PR_TITLE
        - value: mergemessage
          label: MERGE_MESSAGE
      displayName: Merge commit title
      description: "what a merge commit is titled: PR_TITLE | MERGE_MESSAGE"
    mergeCommitMessage:
      type: enum
      values:
        - value: prbody
          label: PR_BODY
        - value: prtitle
          label: PR_TITLE
        - value: blank
          label: BLANK
      displayName: Merge commit message
      description: "what a merge commit writes as its body: PR_BODY | PR_TITLE
        | BLANK"
    webCommitSignoffRequired:
      type: bool
      displayName: Sign-off required
      description: whether a web commit must carry a sign-off line
    pullRequestCreationPolicy:
      type: enum
      values:
        - value: all
          label: all
        - value: collaboratorsonly
          label: collaborators_only
      displayName: PR creation policy
      description: "GitHub's `pull_request_creation_policy`, normalised through
        the shared label table (`collaborators_only` -> `collaboratorsonly`):
        all | collaborators_only — who may open a pull request here"
    subscribersCount:
      type: int
      displayName: Subscribers
      description: how many accounts subscribe to the repository
    networkCount:
      type: int
      displayName: Network
      description: how many repositories the fork network holds
    tempCloneToken:
      type: secret
      displayName: Temp clone token
      description: GitHub's `temp_clone_token`, a short-lived clone credential
        — sealed at rest and never read back
    htmlUrl:
      type: url
      displayName: Repository URL
      description: the repository page, https://github.com/{fullName}
    url:
      type: url
      displayName: API URL
      description: the repository's own REST address
    cloneUrl:
      type: url
      displayName: Clone URL
      description: the HTTPS clone address
    gitUrl:
      type: url
      displayName: Git URL
      description: the `git://` clone address. `url` — substrate validates
        an absolute URI, not an http(s) one (`internal/kinds/validate.go`,
        `url.Parse` + `IsAbs`), and GitHub guarantees this one absolute
    sshUrl:
      type: string
      displayName: SSH URL
      description: the `git@github.com:owner/name.git` clone address, which
        is not a URL at all
    svnUrl:
      type: url
      displayName: Subversion URL
      description: the Subversion bridge address
    mirrorUrl:
      type: string
      displayName: Mirror URL
      description: the upstream this repository mirrors, as configured — free
        text, absent on almost every repository
    permissions:
      type: object
      fields:
        admin: bool
        maintain: bool
        push: bool
        triage: bool
        pull: bool
      displayName: Permissions
      description: what the CONNECTED account may do here, as GitHub reports
        it on this payload — the API's own self-fact, not a computed one
    securityAndAnalysis:
      type: object
      fields:
        advancedSecurity:
          type: object
          fields:
            status:
              type: enum
              values:
                - value: enabled
                  label: enabled
                - value: disabled
                  label: disabled
              description: "`advanced_security.status` — whether GitHub Advanced
                Security is on. GitHub's repository schema closes this set
                at enabled | disabled."
          description: "`advanced_security` — GitHub Advanced Security"
        codeSecurity:
          type: object
          fields:
            status:
              type: enum
              values:
                - value: enabled
                  label: enabled
                - value: disabled
                  label: disabled
              description: "`code_security.status` — whether code security
                is on. GitHub's repository schema closes this set at enabled
                | disabled."
          description: "`code_security` — code security"
        dependabotSecurityUpdates:
          type: object
          fields:
            status:
              type: enum
              values:
                - value: enabled
                  label: enabled
                - value: disabled
                  label: disabled
              description: "`dependabot_security_updates.status` — whether
                Dependabot security updates is on. GitHub's repository schema
                closes this set at enabled | disabled."
          description: "`dependabot_security_updates` — Dependabot security
            updates"
        secretScanning:
          type: object
          fields:
            status:
              type: enum
              values:
                - value: enabled
                  label: enabled
                - value: disabled
                  label: disabled
              description: "`secret_scanning.status` — whether secret scanning
                is on. GitHub's repository schema closes this set at enabled
                | disabled."
          description: "`secret_scanning` — secret scanning"
        secretScanningPushProtection:
          type: object
          fields:
            status:
              type: enum
              values:
                - value: enabled
                  label: enabled
                - value: disabled
                  label: disabled
              description: "`secret_scanning_push_protection.status` — whether
                secret-scanning push protection is on. GitHub's repository
                schema closes this set at enabled | disabled."
          description: "`secret_scanning_push_protection` — secret-scanning
            push protection"
        secretScanningNonProviderPatterns:
          type: object
          fields:
            status:
              type: enum
              values:
                - value: enabled
                  label: enabled
                - value: disabled
                  label: disabled
              description: "`secret_scanning_non_provider_patterns.status`
                — whether secret scanning for non-provider patterns is on.
                GitHub's repository schema closes this set at enabled | disabled."
          description: "`secret_scanning_non_provider_patterns` — secret scanning
            for non-provider patterns"
        secretScanningValidityChecks:
          type: object
          fields:
            status:
              type: enum
              values:
                - value: enabled
                  label: enabled
                - value: disabled
                  label: disabled
              description: "`secret_scanning_validity_checks.status` — whether
                secret-scanning validity checks is on. GitHub's repository
                schema closes this set at enabled | disabled."
          description: "`secret_scanning_validity_checks` — secret-scanning
            validity checks"
        secretScanningAiDetection:
          type: object
          fields:
            status:
              type: enum
              values:
                - value: enabled
                  label: enabled
                - value: disabled
                  label: disabled
              description: "`secret_scanning_ai_detection.status` — whether
                secret-scanning AI detection is on. GitHub's repository schema
                closes this set at enabled | disabled."
          description: "`secret_scanning_ai_detection` — secret-scanning AI
            detection"
        secretScanningDelegatedBypass:
          type: object
          fields:
            status:
              type: enum
              values:
                - value: enabled
                  label: enabled
                - value: disabled
                  label: disabled
              description: "`secret_scanning_delegated_bypass.status` — whether
                secret-scanning delegated bypass is on. GitHub's repository
                schema closes this set at enabled | disabled."
          description: "`secret_scanning_delegated_bypass` — secret-scanning
            delegated bypass"
        secretScanningDelegatedAlertDismissal:
          type: object
          fields:
            status:
              type: enum
              values:
                - value: enabled
                  label: enabled
                - value: disabled
                  label: disabled
              description: "`secret_scanning_delegated_alert_dismissal.status`
                — whether delegated alert dismissal is on. GitHub's repository
                schema closes this set at enabled | disabled."
          description: "`secret_scanning_delegated_alert_dismissal` — delegated
            alert dismissal"
      displayName: Security and analysis
      # Every feature the repository schema documents, each with its own typed
      # `{status}` object. The status set is closed (enabled | disabled), so
      # it is an enum rather than the bare string version 14 wrote. The three
      # newest features — AI detection, delegated bypass, delegated alert
      # dismissal — are declared from the same schema even though this
      # account's corpus carries none of them.
      description: "GitHub's `security_and_analysis`: each feature's status,
        typed, enabled | disabled"
    customProperties:
      type: object
      keyed: true
      fields:
        value:
          type: string
          description: the value when the property is single-valued (GitHub's
            `string` and `single_select` property types)
        values:
          type: string
          repeated: true
          description: the values when the property is multi-valued (GitHub's
            `multi_select` type) — never joined into `value`, so `"a, b"`
            and `["a", "b"]` stay different facts
      displayName: Custom properties
      # Keyed by the property's NAME, which is API data — hence no
      # `keyPattern`, since GitHub admits `_` and `-` there. A keyed OBJECT
      # with a scalar and a list alternative: version 14 joined a list with
      # commas, which made `"a, b"` and `["a", "b"]` the same fact. A null
      # value is an empty object, so "set to nothing" and "not set" differ.
      description: "GitHub's `custom_properties`: the organization's property
        values here, keyed by name"
    roleName:
      type: string
      displayName: Role
      description: GitHub's `role_name` — the connected account's role here,
        on a payload that carries one
    anonymousAccessEnabled:
      type: bool
      displayName: Anonymous access
      description: whether anonymous Git access is enabled, on a GitHub Enterprise
        deployment
    masterBranch:
      type: string
      displayName: Master branch
      description: GitHub's legacy `master_branch`, still sent by some responses
        beside `default_branch`
    # ---- relations -------------------------------------------------------
    license:
      type: reference
      kind: providers.substrate.reamde.dev/github/license
      mustExist: true
      displayName: License
      description: the detected license — a kind, because GitHub gives it
        its own /licenses/{key} endpoint
    codeOfConduct:
      type: reference
      kind: providers.substrate.reamde.dev/github/codeofconduct
      mustExist: true
      displayName: Code of conduct
      description: the repository's code of conduct, when the payload carries
        the object
    owner:
      type: reference
      kind: providers.substrate.reamde.dev/github/user
      mustExist: true
      displayName: Owner
      description: "the user or organization the repository belongs to; an
        organization is a user row with `type: organization`"
    organization:
      type: reference
      kind: providers.substrate.reamde.dev/github/user
      mustExist: true
      displayName: Organization
      description: GitHub's `organization`, sent on some full-repository payloads
        when the owner is an organization
    parent:
      type: reference
      kind: providers.substrate.reamde.dev/github/repository
      mustExist: true
      displayName: Parent
      description: the repository this one was forked from, on a fork
    source:
      type: reference
      kind: providers.substrate.reamde.dev/github/repository
      mustExist: true
      displayName: Source
      description: the ultimate root of the fork network, on a fork
    templateRepository:
      type: reference
      kind: providers.substrate.reamde.dev/github/repository
      mustExist: true
      displayName: Template
      description: the template this repository was generated from
    # ---- instants (created_at IS the trait's `at`) ------------------------
    pushedAt:
      type: datetime
      displayName: Pushed
      description: when the repository last received a push
    updatedAt:
      type: datetime
      displayName: Updated
      description: when the repository record last changed
---
# ---- mirror: one team -------------------------------------------------------
# Teams arrive embedded in a pull request's `requested_teams`, each with an
# id, a slug and its own `/orgs/{org}/teams/{slug}` endpoint — the two-part
# test in `docs/kind-design.md` §3, so a kind and a reference rather than an
# inline object. `type: "team"` is the constant discriminator and is not
# declared.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/github/team
data:
  authority: providers.substrate.reamde.dev
  package: github
  description: >-
    One GitHub team, as the REST API v3 embeds it in a pull request's `requested_teams`.
    Hypermedia `*_url` templates are the one omitted class — the constant
    `type: team` is a one-value enum — and a team carries no instant, so it
    binds no temporal trait.
  names:
    singular: team
  displayTemplate: "{name}"
  properties:
    # ---- identity --------------------------------------------------------
    account:
      type: reference
      kind: account
      required: true
      onDelete: cascade
      displayName: Account
      description: the account this team was synced through
    teamId:
      type: int
      displayName: Team ID
      description: GitHub's `id` — the numeric team id
    nodeId:
      type: string
      displayName: Node ID
      description: GitHub's `node_id`, the GraphQL global node id
    slug:
      type: string
      displayName: Slug
      description: the team's slug, the handle `@org/slug` and every REST
        path use
    # ---- the team's own fields -------------------------------------------
    type:
      type: string
      displayName: Type
      # NOT the constant `team` version 14 declared: every team and every
      # parent team in this account's corpus carries `organization`, and
      # GitHub's team schema does not document the field at all, so there is
      # no closed set to cite. A one-value enum would refuse the real payload.
      description: "GitHub's `type` on an embedded team; no documented enum,
        known value: organization"
    name:
      type: string
      displayName: Name
      description: the team's display name
    description:
      type: text
      displayName: Description
      description: the team's description
    privacy:
      type: enum
      values:
        - value: closed
          label: closed
        - value: secret
          label: secret
      displayName: Privacy
      description: "GitHub's `privacy`: closed (visible to the org) | secret"
    notificationSetting:
      type: enum
      values:
        - value: notificationsenabled
          label: notifications_enabled
        - value: notificationsdisabled
          label: notifications_disabled
      displayName: Notifications
      description: "GitHub's `notification_setting`: whether the team is notified
        as a whole"
    permission:
      type: string
      displayName: Permission
      description: the team's default repository permission (`pull`, `push`,
        `admin`, or a custom role name) — not a closed set
    permissions:
      type: object
      fields:
        pull: bool
        triage: bool
        push: bool
        maintain: bool
        admin: bool
      displayName: Permissions
      description: GitHub's `permissions` — the five access levels the team
        holds on the repository it was returned in
    accessSource:
      type: enum
      values:
        - value: direct
          label: direct
        - value: organization
          label: organization
        - value: enterprise
          label: enterprise
      displayName: Access source
      description: GitHub's `access_source` — how the team got its access,
        sent only in a repository context
    enterpriseId:
      type: int
      displayName: Enterprise
      description: GitHub's `enterprise_id` — the enterprise the team belongs
        to. An int, not a reference; nothing mirrors an enterprise
    ldapDn:
      type: string
      displayName: LDAP DN
      description: GitHub's `ldap_dn`, on an LDAP-synced enterprise team
    htmlUrl:
      type: url
      displayName: Team URL
      description: the team page on GitHub
    url:
      type: url
      displayName: API URL
      description: the team's own REST address
    # ---- relations -------------------------------------------------------
    organization:
      type: reference
      kind: providers.substrate.reamde.dev/github/user
      mustExist: true
      displayName: Organization
      # Was `organizationId: int`. An organization is already a `user` row
      # here, and a mirror does not carry a second identity for a thing it
      # points at. The sync upserts that row — from the id alone where the
      # payload carries nothing else — before the team.
      description: GitHub's `organization_id`, as a reference at the organization's
        own user row
    parent:
      type: reference
      kind: providers.substrate.reamde.dev/github/team
      mustExist: true
      displayName: Parent team
      description: the team this one nests under, when GitHub sends `parent`
---
# ---- mirror: one milestone --------------------------------------------------
# A milestone arrives embedded in every issue and pull-request payload, with
# its own id and its own `/repos/{o}/{r}/milestones/{n}` endpoint — the §3
# test, so a kind and a reference rather than the inline object version 13
# carried. Its `title` is the reserved name, so it is `milestoneTitle` and the
# heading is the displayTemplate's job.
#
# The trait binds `temporal(point)` fed by `created_at`, like every other
# mirror here, and `due_on` stays a declared datetime of its own: a milestone
# nobody dated would otherwise sit on no timeline at all.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/github/milestone
data:
  authority: providers.substrate.reamde.dev
  package: github
  description: >-
    One GitHub milestone, as the REST API v3 embeds it in an issue or a pull
    request. `at` is GitHub's `created_at`; `labels_url` is the one omitted
    hypermedia field. The repository is taken from the item the milestone
    arrived on.
  names:
    singular: milestone
  traits:
    - temporal(point)
  displayTemplate: "{milestoneTitle}"
  properties:
    # ---- identity --------------------------------------------------------
    account:
      type: reference
      kind: account
      required: true
      onDelete: cascade
      displayName: Account
      description: the account this milestone was synced through
    milestoneId:
      type: int
      displayName: Milestone ID
      description: GitHub's `id` — the numeric milestone id
    nodeId:
      type: string
      displayName: Node ID
      description: GitHub's `node_id`, the GraphQL global node id
    number:
      type: int
      displayName: Number
      description: the milestone number within its repository
    # ---- the milestone's own fields --------------------------------------
    milestoneTitle:
      type: string
      displayName: Title
      description: GitHub's `title`, renamed because `title` is reserved on
        every record — the heading is this kind's displayTemplate
    description:
      type: text
      displayName: Description
      description: the milestone's description, as GitHub returns it
    state:
      type: enum
      values:
        - value: open
          label: open
        - value: closed
          label: closed
      displayName: State
      description: "GitHub's `state`: open | closed"
    openIssues:
      type: int
      displayName: Open issues
      description: how many open issues GitHub counts in the milestone
    closedIssues:
      type: int
      displayName: Closed issues
      description: how many closed issues GitHub counts in the milestone
    htmlUrl:
      type: url
      displayName: Milestone URL
      description: the milestone page on GitHub
    url:
      type: url
      displayName: API URL
      description: the milestone's own REST address
    # ---- relations -------------------------------------------------------
    creator:
      type: reference
      kind: providers.substrate.reamde.dev/github/user
      mustExist: true
      displayName: Creator
      description: the user who opened the milestone
    repository:
      type: reference
      kind: providers.substrate.reamde.dev/github/repository
      mustExist: true
      displayName: Repository
      description: the repository the milestone belongs to, read off the item
        it arrived on (a milestone payload names no repository)
    # ---- instants (created_at IS the trait's `at`) ------------------------
    dueOn:
      type: datetime
      displayName: Due
      description: GitHub's `due_on` — when the milestone is due, absent when
        nobody set a date
    updatedAt:
      type: datetime
      displayName: Updated
      description: when the milestone last changed
    closedAt:
      type: datetime
      displayName: Closed
      description: when the milestone was closed, absent while open
---
# ---- mirror: one label ------------------------------------------------------
# Labels arrive EMBEDDED in every issue and pull-request payload, with their
# own ids and their own `/repos/{o}/{r}/labels/{name}` endpoint, so a label row
# costs no extra call. They are repository-scoped: `type/bug` in two
# repositories is two rows, which is what GitHub means.
#
# `default` is the API's name and it loads: the loader reserves only `title`,
# `at`, `endsAt` and `dueAt`, and `default:` is a declaration KEY, never a
# forbidden property name. Version 13's `isDefault` was a rename nobody
# checked.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/github/label
data:
  authority: providers.substrate.reamde.dev
  package: github
  description: >-
    One GitHub label, in its repository, as the REST API v3 embeds it in an
    issue or a pull request. A label carries no creation instant, so it binds
    no temporal trait; the repository is taken from the item it arrived on.
  names:
    singular: label
  displayTemplate: "{name}"
  properties:
    # ---- identity --------------------------------------------------------
    account:
      type: reference
      kind: account
      required: true
      onDelete: cascade
      displayName: Account
      description: the account this label was synced through
    labelId:
      type: int
      displayName: Label ID
      description: GitHub's `id` — the numeric label id
    nodeId:
      type: string
      displayName: Node ID
      description: GitHub's `node_id`, the GraphQL global node id
    # ---- the label's own fields ------------------------------------------
    name:
      type: string
      displayName: Name
      description: the label's name, as it renders on GitHub
    description:
      type: text
      displayName: Description
      description: the label's description
    color:
      type: string
      displayName: Colour
      description: the label's six-digit hex colour, without the hash
    default:
      type: bool
      displayName: Default label
      description: GitHub's `default` — whether this is one of the labels
        every new repository starts with
    url:
      type: url
      displayName: API URL
      description: the label's own REST address
    # ---- relations -------------------------------------------------------
    archivedBy:
      type: reference
      kind: providers.substrate.reamde.dev/github/user
      mustExist: true
      displayName: Archived by
      description: the user who archived the label, on a repository that archives
        labels rather than deleting them
    repository:
      type: reference
      kind: providers.substrate.reamde.dev/github/repository
      mustExist: true
      displayName: Repository
      description: the repository the label belongs to, read off the item
        it arrived on (a label payload names no repository)
    # ---- instants --------------------------------------------------------
    archivedAt:
      type: datetime
      displayName: Archived
      description: when the label was archived, absent while it is live
---
# ---- mirror: one issue -------------------------------------------------------
# GitHub's issue, whole. Every documented field of the REST v3 `issue` schema
# is here under its own camelCased name, in five groups: identity, the issue's
# own scalars in the API reference's order, the relations, the instants.
#
# WHAT IS NOT HERE, and why:
#   * `*_url` templates and functions of `url` — `labels_url`, `comments_url`,
#     `events_url`, `timeline_url`, `repository_url` — the hypermedia class.
#     `url` and `html_url` stay;
#   * the search hit's `score` and the search response's `total_count` /
#     `incomplete_results` — the envelope class;
#   * no `raw`, no `authorLogin`, no `repositoryFullName`, no `task`: a copy of
#     a referent is forbidden, and the consumer's slot is the consumer's.
#
# `state` is an ENUM with GitHub's words as labels, never a state machine:
# GitHub owns the lifecycle and this is its record, not ours.
#
# The temporal binding is `temporal(point)` fed by `created_at`, NOT by
# `updated_at`: an issue's place in time is when it was OPENED. `updatedAt` is
# the sync watermark and moves on every comment, so binding it would drag
# three-year-old issues into today's window. `created_at` lands on the trait's
# `at` and is not redeclared (`docs/kind-design.md` §4).
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/github/issue
data:
  authority: providers.substrate.reamde.dev
  package: github
  description: >-
    One GitHub issue, complete, as the REST API v3 issue schema describes
    it — author, assignees, milestone and labels as references. `at` is GitHub's
    `created_at`. The omitted classes are the hypermedia `*_url` templates
    and the search envelope (`score`, `incomplete_results`).
  names:
    singular: issue
  traits:
    - temporal(point)
  displayTemplate: "#{number} {issueTitle}"
  properties:
    # ---- identity --------------------------------------------------------
    account:
      type: reference
      kind: account
      required: true
      onDelete: cascade
      displayName: Account
      description: the account this issue was synced through
    issueId:
      type: int
      displayName: Issue ID
      description: GitHub's `id` — the numeric issue id the record's own id
        derives from, so a re-sync upserts
    nodeId:
      type: string
      displayName: Node ID
      description: GitHub's `node_id`, the GraphQL global node id
    number:
      type: int
      displayName: Number
      description: the issue number within its repository
    # ---- the issue's own fields, in the API reference's order --------------
    issueTitle:
      type: string
      displayName: Title
      description: GitHub's `title`, renamed because `title` is reserved on
        every record — the heading is this kind's displayTemplate
    body:
      type: markdown
      embed: true
      displayName: Body
      description: the issue description, GitHub-flavoured markdown; FTS-indexed
        and embedded for semantic search
    state:
      type: enum
      values:
        - value: open
          label: open
        - value: closed
          label: closed
      displayName: State
      description: "GitHub's `state`: open | closed — GitHub owns the lifecycle,
        so this is an enum and never a state machine"
    stateReason:
      type: enum
      values:
        - value: completed
          label: completed
        - value: notplanned
          label: not_planned
        - value: reopened
          label: reopened
        - value: duplicate
          label: duplicate
      displayName: State reason
      description: "GitHub's `state_reason`, spelled lowercase-without- underscores:
        completed | not_planned | reopened | duplicate"
    locked:
      type: bool
      displayName: Locked
      description: whether the conversation is locked
    activeLockReason:
      type: enum
      values:
        - value: resolved
          label: resolved
        - value: offtopic
          label: off-topic
        - value: tooheated
          label: too heated
        - value: spam
          label: spam
      displayName: Lock reason
      description: "GitHub's `active_lock_reason`: off-topic | too heated
        | resolved | spam — spelled lowercase, spaces and hyphens dropped"
    comments:
      type: int
      displayName: Comments
      description: how many comments GitHub counts on the issue
    authorAssociation:
      type: enum
      values:
        - value: collaborator
          label: COLLABORATOR
        - value: contributor
          label: CONTRIBUTOR
        - value: firsttimer
          label: FIRST_TIMER
        - value: firsttimecontributor
          label: FIRST_TIME_CONTRIBUTOR
        - value: mannequin
          label: MANNEQUIN
        - value: member
          label: MEMBER
        - value: none
          label: NONE
        - value: owner
          label: OWNER
      displayName: Author association
      description: how the author relates to the repository — all eight of
        GitHub's values, lowercased with the underscores dropped
    draft:
      type: bool
      displayName: Draft
      description: GitHub's `draft`, sent on an issue that is really a pull
        request
    reactions:
      type: object
      fields:
        totalCount: int
        plusOne: int
        minusOne: int
        laugh: int
        hooray: int
        confused: int
        heart: int
        rocket: int
        eyes: int
      displayName: Reactions
      description: the reaction counts; `+1` and `-1` are `plusOne` and `minusOne`
        because a field name may not open with a sign
    subIssuesSummary:
      type: object
      fields:
        total: int
        completed: int
        percentCompleted: int
      displayName: Sub-issues
      description: GitHub's `sub_issues_summary` — how many sub-issues the
        issue has and how many are done. The COUNTS; `subIssues` holds the
        edges
    issueDependenciesSummary:
      type: object
      fields:
        blockedBy: int
        totalBlockedBy: int
        blocking: int
        totalBlocking: int
      displayName: Dependencies
      description: GitHub's `issue_dependencies_summary` — how many issues
        block this one and how many it blocks. The COUNTS; `blockedBy` and
        `blocking` hold the edges
    issueFieldValues:
      type: object
      repeated: true
      fields:
        issueFieldId:
          type: int
          description: >-
            `id` — the numeric id of the FIELD this value belongs to (renamed
            from `id` by the `<singular>Id` rule, because the row it sits
            on is the issue, not the field)
        nodeId:
          type: string
          description: >-
            `node_id` — the field's GraphQL global node id
        name:
          type: string
          description: >-
            `name` — the field's name, as the organization spelled it
        dataType:
          type: string
          # A string, not an enum: the issue-fields API is in public
          # preview and adds types, and a value the enum did not hold would
          # refuse the whole page.
          description: "`data_type` — which alternative holds the value: text
            | number | date | single_select | multi_select | iteration"
        value:
          type: string
          description: "the value when the field is textual (`data_type` is
            `text`)"
        numberValue:
          type: decimal
          description: the value when the field is numeric — `decimal`, so
            a fractional field is not silently rounded
        dateValue:
          type: datetime
          description: the value when the field is a date or a datetime
        singleSelectOption:
          type: object
          fields:
            optionId:
              type: string
              description: the selected option's id
            name:
              type: string
              description: the selected option's name
            color:
              type: string
              description: the selected option's colour
          description: the chosen option when `data_type` is `single_select`
        multiSelectOptions:
          type: object
          repeated: true
          fields:
            optionId:
              type: string
              description: the option's id
            name:
              type: string
              description: the option's name
            color:
              type: string
              description: the option's colour
          description: the chosen options when `data_type` is `multi_select`
      displayName: Field values
      # An OCCURRENCE list: each entry is one field's value, carries metadata
      # beyond a flat scalar, and its variants are typed rather than pushed
      # into a json blob. The array is present-and-empty on every payload in
      # this account's corpus, which is what establishes the field; no
      # non-empty recording exists, so the variant shapes come from the
      # issue-fields schema and are NOT claimed as exercised.
      description: GitHub's `issue_field_values` — the organization's custom
        issue-field values on this item
    htmlUrl:
      type: url
      displayName: Issue URL
      description: the issue page on GitHub
    url:
      type: url
      displayName: API URL
      description: the issue's own REST address; the `*_url` templates hanging
        off it are the omitted hypermedia class
    # ---- relations -------------------------------------------------------
    type:
      type: reference
      kind: providers.substrate.reamde.dev/github/issuetype
      mustExist: true
      displayName: Issue type
      description: GitHub's `type` — the organization issue type, an identity-bearing
        object and so a reference
    performedViaGithubApp:
      type: reference
      kind: providers.substrate.reamde.dev/github/app
      mustExist: true
      displayName: Performed via app
      description: the GitHub App that acted on somebody's behalf, from `performed_via_github_app`
    pinnedComment:
      type: reference
      kind: providers.substrate.reamde.dev/github/comment
      mustExist: true
      displayName: Pinned comment
      description: GitHub's `pinned_comment` — the comment pinned to the top
        of the thread
    parentIssue:
      type: reference
      kind: providers.substrate.reamde.dev/github/issue
      displayName: Parent issue
      description: the issue this one is a sub-issue of, from `parent_issue_url`
        — a relationship address, not navigation
    subIssues:
      type: reference
      kind: providers.substrate.reamde.dev/github/issue
      repeated: true
      mustExist: true
      displayName: Sub-issues
      description: the issues broken out of this one, in GitHub's order, from
        `GET .../issues/{n}/sub_issues` — the EDGES that `subIssuesSummary`
        can only count
    blockedBy:
      type: reference
      kind: providers.substrate.reamde.dev/github/issue
      repeated: true
      mustExist: true
      displayName: Blocked by
      description: the issues that block this one, from `GET .../issues/{n}/dependencies/blocked_by`
        — the edges `issueDependenciesSummary.blockedBy` can only count
    blocking:
      type: reference
      kind: providers.substrate.reamde.dev/github/issue
      repeated: true
      mustExist: true
      displayName: Blocking
      description: >-
        the issues this one blocks, from `GET .../issues/{n}/dependencies/blocking`.
        On the ISSUE alone: GitHub hangs both graphs off an issue
    user:
      type: reference
      kind: providers.substrate.reamde.dev/github/user
      mustExist: true
      displayName: Author
      description: GitHub's `user` — the account that opened the issue
    assignee:
      type: reference
      kind: providers.substrate.reamde.dev/github/user
      mustExist: true
      displayName: Assignee
      description: GitHub's single legacy `assignee`, the first of `assignees`;
        absent when nobody is assigned
    assignees:
      type: reference
      kind: providers.substrate.reamde.dev/github/user
      repeated: true
      mustExist: true
      displayName: Assignees
      description: everyone assigned — "assigned to me" is this list containing
        the account's own user row
    closedBy:
      type: reference
      kind: providers.substrate.reamde.dev/github/user
      mustExist: true
      displayName: Closed by
      description: who closed the issue; only GET /repos/{o}/{r}/issues/{n}
        carries it, so the sync hydrates closed issues for it
    milestone:
      type: reference
      kind: providers.substrate.reamde.dev/github/milestone
      mustExist: true
      displayName: Milestone
      description: "the milestone the issue sits in; a payload carrying `milestone:
        null` clears it"
    labels:
      type: reference
      kind: providers.substrate.reamde.dev/github/label
      repeated: true
      mustExist: true
      displayName: Labels
      description: the labels on the issue, in GitHub's order
    repository:
      type: reference
      kind: providers.substrate.reamde.dev/github/repository
      required: true
      mustExist: true
      displayName: Repository
      description: the repository the issue belongs to, from `repository_url`
        — the one relation every payload guarantees
    pullRequest:
      type: reference
      kind: providers.substrate.reamde.dev/github/pullrequest
      displayName: Pull request
      description: GitHub's `pull_request` — set when the item is really a
        pull request; the `type:issue` search never returns one
    # ---- instants (created_at IS the trait's `at`) ------------------------
    updatedAt:
      type: datetime
      displayName: Updated
      description: when the issue last changed — what the sync watermarks
        on, which is why it is not the timeline position
    closedAt:
      type: datetime
      displayName: Closed
      description: when the issue was closed, absent while open
---
# ---- mirror: one pull request ------------------------------------------------
# The same posture as `issue`, over the REST v3 `pull-request` schema: every
# documented field, five groups, references for every relation. `state` is
# GitHub's own word (open | closed) and `draft`, `merged`, `mergeable` and
# `rebaseable` are the separate booleans GitHub returns beside it — nothing is
# folded into one word here, because folding is the consumer's judgement.
#
# `head` and `base` are value objects with REFERENCES inside them: a branch
# names a repository and a user, and a fork's head repository is a row this
# sync mints like any other. `_links`, `diff_url`, `patch_url` and `issue_url`
# are the hypermedia class and are not declared.
#
# The SEARCH ITEM IS A SHADOW: `GET /search/issues` carries no
# `requested_reviewers`, no `requested_teams`, no `merged_by`, no `head` or
# `base` and no diff counts, so every pull request is hydrated off
# `GET /repos/{o}/{r}/pulls/{n}` and PATCHED — a patch, so the thin row is
# never the last word and an absent field is never written as null.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/github/pullrequest
data:
  authority: providers.substrate.reamde.dev
  package: github
  description: >-
    One GitHub pull request, complete, as the REST API v3 pull-request schema
    describes it — author, assignees, requested reviewers, requested teams
    and merger as references. `at` is `created_at`. The omitted classes are
    the hypermedia links and the search envelope.
  names:
    singular: pullrequest
  traits:
    - temporal(point)
  displayTemplate: "#{number} {pullRequestTitle}"
  properties:
    # ---- identity --------------------------------------------------------
    account:
      type: reference
      kind: account
      required: true
      onDelete: cascade
      displayName: Account
      description: the account this pull request was synced through
    pullRequestId:
      type: int
      displayName: Pull request ID
      # GitHub gives a pull request TWO numeric identities, and this is not
      # the other one: `/search/issues` and every Issue endpoint put the
      # ISSUE id in the same `id` field, and the two differ in 163 of 163
      # objects in this account's corpus. A search hit therefore does not
      # supply this value directly — it is decoded, losslessly and
      # mechanically, from the hit's own `PR_…` node id, whose msgpack
      # payload IS the pull id (282 of 282 search/detail pairs agree). That
      # is what keeps one pull request one row from its FIRST observation,
      # rather than a row re-keyed when the hydrate lands.
      description: GitHub's `id` on the pull-request endpoint — the pull identity
        the record's own id derives from
    issueId:
      type: int
      displayName: Issue ID
      # Declared rather than conflated with the pull id: the two address
      # different resources, and a mirror that cannot tell them apart cannot
      # join anything to either.
      description: GitHub's `id` as the Issue representation of this pull
        request reports it
    nodeId:
      type: string
      displayName: Node ID
      description: GitHub's `node_id`, the GraphQL global node id — the `PR_…`
        form on both representations
    number:
      type: int
      displayName: Number
      description: the pull request number within its repository, shared with
        the issue of the same number
    # ---- the pull request's own fields, in the API reference's order -------
    pullRequestTitle:
      type: string
      displayName: Title
      description: GitHub's `title`, renamed because `title` is reserved on
        every record — the heading is this kind's displayTemplate
    body:
      type: markdown
      embed: true
      displayName: Body
      description: the pull request description, GitHub-flavoured markdown;
        FTS-indexed and embedded for semantic search
    state:
      type: enum
      values:
        - value: open
          label: open
        - value: closed
          label: closed
      displayName: State
      description: "GitHub's `state`: open | closed — merged and draft are
        their own booleans, and nothing folds them into one word"
    locked:
      type: bool
      displayName: Locked
      description: whether the conversation is locked
    activeLockReason:
      type: enum
      values:
        - value: resolved
          label: resolved
        - value: offtopic
          label: off-topic
        - value: tooheated
          label: too heated
        - value: spam
          label: spam
      displayName: Lock reason
      description: "GitHub's `active_lock_reason`: off-topic | too heated
        | resolved | spam — spelled lowercase, spaces and hyphens dropped"
    draft:
      type: bool
      displayName: Draft
      description: whether the pull request is a draft
    merged:
      type: bool
      displayName: Merged
      description: whether the pull request was merged; only the hydrated
        payload carries it, `mergedAt` says when
    mergeable:
      type: bool
      displayName: Mergeable
      description: whether GitHub can merge it cleanly; null while GitHub
        is still computing the answer
    rebaseable:
      type: bool
      displayName: Rebaseable
      description: whether GitHub can rebase it cleanly; null while GitHub
        is still computing the answer
    mergeableState:
      type: string
      displayName: Mergeable state
      description: "GitHub's `mergeable_state` (clean | dirty | blocked |
        behind | unstable | draft | unknown) — documented but not closed"
    mergeCommitSha:
      type: string
      displayName: Merge commit
      description: the SHA of the merge commit, or of the test merge GitHub
        computed while the pull request is open
    maintainerCanModify:
      type: bool
      displayName: Maintainer can modify
      description: whether upstream maintainers may push to the head branch
    comments:
      type: int
      displayName: Comments
      description: how many conversation comments GitHub counts
    reviewComments:
      type: int
      displayName: Review comments
      description: how many inline review comments GitHub counts
    commits:
      type: int
      displayName: Commits
      description: how many commits the pull request carries
    additions:
      type: int
      displayName: Additions
      description: lines added, from the hydrated payload
    deletions:
      type: int
      displayName: Deletions
      description: lines removed, from the hydrated payload
    changedFiles:
      type: int
      displayName: Changed files
      description: how many files the diff touches, from the hydrated payload
    authorAssociation:
      type: enum
      values:
        - value: collaborator
          label: COLLABORATOR
        - value: contributor
          label: CONTRIBUTOR
        - value: firsttimer
          label: FIRST_TIMER
        - value: firsttimecontributor
          label: FIRST_TIME_CONTRIBUTOR
        - value: mannequin
          label: MANNEQUIN
        - value: member
          label: MEMBER
        - value: none
          label: NONE
        - value: owner
          label: OWNER
      displayName: Author association
      description: how the author relates to the repository — all eight of
        GitHub's values, lowercased with the underscores dropped
    autoMerge:
      type: object
      fields:
        mergeMethod:
          type: enum
          values:
            - value: merge
              label: merge
            - value: squash
              label: squash
            - value: rebase
              label: rebase
        commitTitle:
          type: string
          description: "`commit_title` — the queued merge commit's subject"
        commitMessage:
          type: text
          description: "`commit_message` — the queued merge commit's BODY,
            which is multi-line prose and keeps its newlines"
        enabledBy:
          type: reference
          kind: providers.substrate.reamde.dev/github/user
      displayName: Auto-merge
      description: GitHub's `auto_merge` — the merge queued to run when the
        checks pass, and who armed it
    stack:
      type: object
      fields:
        stackId:
          type: int
          description: >-
            `id` — the stack's own id, renamed by the `<singular>Id` rule
            because the row it sits on is the pull request. It addresses no
            endpoint, which is why a stack is an object here and not a kind
        number:
          type: int
          description: "`number` — the stack's number"
        size:
          type: int
          description: "`size` — how many pull requests the stack holds"
        position:
          type: int
          description: "`position` — this pull request's one-based place in
            the stack, 1 being the bottom"
        base:
          type: object
          fields:
            ref: string
            sha: string
          description: the stack's own base ref and the commit it names
      displayName: Stack
      # DECLARED FROM THE SCHEMA, NOT FROM A RECORDING. GitHub's OpenAPI
      # description carries `stack` (`pull-request-stack`, nullable) on the
      # pull-request schema; no payload in the owner's 902-recording pull
      # carries it, because the owner stacks nothing. Version 15 left it out
      # as an unverified exclusion and T-022 closed the question.
      description: GitHub's `stack` — the stacked pull requests this one belongs
        to, when the repository uses them
    head:
      type: object
      fields:
        label: string
        ref: string
        sha: string
        user:
          type: reference
          kind: providers.substrate.reamde.dev/github/user
        repo:
          type: reference
          kind: providers.substrate.reamde.dev/github/repository
      displayName: Head
      description: the branch the pull request merges FROM, with its owner
        and its repository as references (a fork is a repository row)
    base:
      type: object
      fields:
        label: string
        ref: string
        sha: string
        user:
          type: reference
          kind: providers.substrate.reamde.dev/github/user
        repo:
          type: reference
          kind: providers.substrate.reamde.dev/github/repository
      displayName: Base
      description: the branch the pull request merges INTO, with its owner
        and its repository as references
    # ---- fields of the ISSUE representation of this pull request ---------
    # GitHub returns a pull request through TWO schemas. These are the
    # fields the Issue schema carries and the pull-request schema does
    # not; the sync consumes BOTH representations of the same object, so
    # version 14's silent discard in `_pull_props` lost real data the
    # connector already held. Each is written only from a payload that
    # carries it, so the pull-request read never nulls them.
    stateReason:
      type: enum
      values:
        - value: completed
          label: completed
        - value: notplanned
          label: not_planned
        - value: reopened
          label: reopened
        - value: duplicate
          label: duplicate
      displayName: State reason
      description: "GitHub's `state_reason`, spelled lowercase-without- underscores:
        completed | not_planned | reopened | duplicate"
    reactions:
      type: object
      fields:
        totalCount: int
        plusOne: int
        minusOne: int
        laugh: int
        hooray: int
        confused: int
        heart: int
        rocket: int
        eyes: int
      displayName: Reactions
      description: the reaction counts; `+1` and `-1` are `plusOne` and `minusOne`
        because a field name may not open with a sign
    subIssuesSummary:
      type: object
      fields:
        total: int
        completed: int
        percentCompleted: int
      displayName: Sub-issues
      description: GitHub's `sub_issues_summary` — how many sub-issues the
        issue has and how many are done
    issueDependenciesSummary:
      type: object
      fields:
        blockedBy: int
        totalBlockedBy: int
        blocking: int
        totalBlocking: int
      displayName: Dependencies
      description: GitHub's `issue_dependencies_summary` — how many issues
        block this one and how many it blocks
    issueFieldValues:
      type: object
      repeated: true
      fields:
        issueFieldId:
          type: int
          description: >-
            `id` — the numeric id of the FIELD this value belongs to (renamed
            from `id` by the `<singular>Id` rule, because the row it sits
            on is the issue, not the field)
        nodeId:
          type: string
          description: >-
            `node_id` — the field's GraphQL global node id
        name:
          type: string
          description: >-
            `name` — the field's name, as the organization spelled it
        dataType:
          type: string
          # A string, not an enum: the issue-fields API is in public
          # preview and adds types, and a value the enum did not hold would
          # refuse the whole page.
          description: "`data_type` — which alternative holds the value: text
            | number | date | single_select | multi_select | iteration"
        value:
          type: string
          description: "the value when the field is textual (`data_type` is
            `text`)"
        numberValue:
          type: decimal
          description: the value when the field is numeric — `decimal`, so
            a fractional field is not silently rounded
        dateValue:
          type: datetime
          description: the value when the field is a date or a datetime
        singleSelectOption:
          type: object
          fields:
            optionId:
              type: string
              description: the selected option's id
            name:
              type: string
              description: the selected option's name
            color:
              type: string
              description: the selected option's colour
          description: the chosen option when `data_type` is `single_select`
        multiSelectOptions:
          type: object
          repeated: true
          fields:
            optionId:
              type: string
              description: the option's id
            name:
              type: string
              description: the option's name
            color:
              type: string
              description: the option's colour
          description: the chosen options when `data_type` is `multi_select`
      displayName: Field values
      # An OCCURRENCE list: each entry is one field's value, carries metadata
      # beyond a flat scalar, and its variants are typed rather than pushed
      # into a json blob. The array is present-and-empty on every payload in
      # this account's corpus, which is what establishes the field; no
      # non-empty recording exists, so the variant shapes come from the
      # issue-fields schema and are NOT claimed as exercised.
      description: GitHub's `issue_field_values` — the organization's custom
        issue-field values on this item
    htmlUrl:
      type: url
      displayName: Pull request URL
      description: the pull request page on GitHub
    url:
      type: url
      displayName: API URL
      description: the pull request's own REST address; `diff_url`, `patch_url`,
        `issue_url` and `_links` are the omitted hypermedia
    # ---- relations -------------------------------------------------------
    type:
      type: reference
      kind: providers.substrate.reamde.dev/github/issuetype
      mustExist: true
      displayName: Issue type
      description: GitHub's `type` — the organization issue type, an identity-bearing
        object and so a reference
    performedViaGithubApp:
      type: reference
      kind: providers.substrate.reamde.dev/github/app
      mustExist: true
      displayName: Performed via app
      description: the GitHub App that acted on somebody's behalf, from `performed_via_github_app`
    pinnedComment:
      type: reference
      kind: providers.substrate.reamde.dev/github/comment
      mustExist: true
      displayName: Pinned comment
      description: GitHub's `pinned_comment` — the comment pinned to the top
        of the thread
    parentIssue:
      type: reference
      kind: providers.substrate.reamde.dev/github/issue
      displayName: Parent issue
      description: the issue this one is a sub-issue of, from `parent_issue_url`
        — a relationship address, not navigation
    user:
      type: reference
      kind: providers.substrate.reamde.dev/github/user
      mustExist: true
      displayName: Author
      description: GitHub's `user` — the account that opened the pull request
    assignee:
      type: reference
      kind: providers.substrate.reamde.dev/github/user
      mustExist: true
      displayName: Assignee
      description: GitHub's single legacy `assignee`, the first of `assignees`;
        absent when nobody is assigned
    assignees:
      type: reference
      kind: providers.substrate.reamde.dev/github/user
      repeated: true
      mustExist: true
      displayName: Assignees
      description: everyone assigned to the pull request
    requestedReviewers:
      type: reference
      kind: providers.substrate.reamde.dev/github/user
      repeated: true
      mustExist: true
      displayName: Requested reviewers
      description: everyone GitHub is still waiting on for a review — this
        list holding the account's user row is "on my desk"
    requestedTeams:
      type: reference
      kind: providers.substrate.reamde.dev/github/team
      repeated: true
      mustExist: true
      displayName: Requested teams
      description: the teams asked to review, as team rows rather than inline
        objects
    mergedBy:
      type: reference
      kind: providers.substrate.reamde.dev/github/user
      mustExist: true
      displayName: Merged by
      description: who merged it, absent unless merged
    closedBy:
      type: reference
      kind: providers.substrate.reamde.dev/github/user
      mustExist: true
      displayName: Closed by
      description: who closed the issue; only GET /repos/{o}/{r}/issues/{n}
        carries it, so the sync hydrates closed issues for it
    labels:
      type: reference
      kind: providers.substrate.reamde.dev/github/label
      repeated: true
      mustExist: true
      displayName: Labels
      description: the labels on the pull request, in GitHub's order
    milestone:
      type: reference
      kind: providers.substrate.reamde.dev/github/milestone
      mustExist: true
      displayName: Milestone
      description: "the milestone the pull request sits in; a payload carrying
        `milestone: null` clears it"
    repository:
      type: reference
      kind: providers.substrate.reamde.dev/github/repository
      required: true
      mustExist: true
      displayName: Repository
      description: the repository the pull request belongs to — the base repository,
        which is the one every payload guarantees
    # ---- instants (created_at IS the trait's `at`) ------------------------
    updatedAt:
      type: datetime
      displayName: Updated
      description: when the pull request last changed — what the sync watermarks
        on
    closedAt:
      type: datetime
      displayName: Closed
      description: when the pull request was closed, absent while open
    mergedAt:
      type: datetime
      displayName: Merged
      description: when the pull request was merged, absent unless merged
---
# ---- mirror: one review ------------------------------------------------------
# `GET /repos/{o}/{r}/pulls/{n}/reviews` returns objects with their own ids,
# so by the §3 test a review is a KIND and not link data on
# `requestedReviewers` — which is also the honest shape: a requested reviewer
# carries no state, and the state ("approved", "changes requested") belongs to
# the review, with its own body and its own instant.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/github/review
data:
  authority: providers.substrate.reamde.dev
  package: github
  description: >-
    One review on a pull request, from GET /repos/{o}/{r}/pulls/{n}/reviews.
    `at` is GitHub's `submitted_at`, absent while a review is still pending.
    `_links` and `pull_request_url` are the omitted hypermedia — the pull
    request is a reference.
  names:
    singular: review
  traits:
    - temporal(point)
  displayTemplate: "{user.login}: {state}"
  properties:
    # ---- identity --------------------------------------------------------
    account:
      type: reference
      kind: account
      required: true
      onDelete: cascade
      displayName: Account
      description: the account this review was synced through
    reviewId:
      type: int
      displayName: Review ID
      description: GitHub's `id` — the numeric review id the record's own
        id derives from
    nodeId:
      type: string
      displayName: Node ID
      description: GitHub's `node_id`, the GraphQL global node id
    # ---- the review's own fields -----------------------------------------
    body:
      type: markdown
      displayName: Body
      description: the review's summary comment, GitHub-flavoured markdown;
        empty on a bare approval
    state:
      type: enum
      values:
        - value: approved
          label: APPROVED
        - value: changesrequested
          label: CHANGES_REQUESTED
        - value: commented
          label: COMMENTED
        - value: dismissed
          label: DISMISSED
        - value: pending
          label: PENDING
      displayName: State
      description: "GitHub's `state`, lowercased without underscores: APPROVED
        | CHANGES_REQUESTED | COMMENTED | DISMISSED | PENDING"
    commitId:
      type: string
      displayName: Commit
      description: the SHA of the head commit the review was written against
    authorAssociation:
      type: enum
      values:
        - value: collaborator
          label: COLLABORATOR
        - value: contributor
          label: CONTRIBUTOR
        - value: firsttimer
          label: FIRST_TIMER
        - value: firsttimecontributor
          label: FIRST_TIME_CONTRIBUTOR
        - value: mannequin
          label: MANNEQUIN
        - value: member
          label: MEMBER
        - value: none
          label: NONE
        - value: owner
          label: OWNER
      displayName: Author association
      description: how the reviewer relates to the repository — all eight
        of GitHub's values, lowercased with the underscores dropped
    htmlUrl:
      type: url
      displayName: Review URL
      description: the review's anchor on the pull request page
    # ---- relations -------------------------------------------------------
    user:
      type: reference
      kind: providers.substrate.reamde.dev/github/user
      mustExist: true
      displayName: Reviewer
      description: GitHub's `user` — who wrote the review
    pullRequest:
      type: reference
      kind: providers.substrate.reamde.dev/github/pullrequest
      required: true
      mustExist: true
      displayName: Pull request
      description: the pull request reviewed, from the call this row came
        from; GitHub's `pull_request_url` is the same fact as hypermedia
---
# ---- the sync function: mirrors, one page per invocation --------------------
# A PEP 723 Python body (requests through uv). It reads the account's
# host-resolved OAuth access token off the injected bundle config, walks the
# stages PINNED at queue-head and drains OFF THE CAUSAL CHAIN through the
# paged-checkpoint more/resume contract.
#
#   user         GET /user                          the connected user row,
#                                                   and account.user
#   repos        GET /user/repos                    one page per invocation
#   issues       GET /search/issues                 type:issue involves:<login>
#   pulls        GET /search/issues                 type:pr involves:<login>
#   pullsReview  GET /search/issues                 type:pr review-requested:<login>
#   pullsFetch   GET /repos/{o}/{r}/pulls/{n}       requested_reviewers,
#                                                   requested_teams, merged_by,
#                                                   head/base, the diff counts
#   reviewsFetch GET /repos/{o}/{r}/pulls/{n}/reviews   the review rows
#   issuesFetch  GET /repos/{o}/{r}/issues/{n}      closed_by, for a closed issue
#   usersFetch   GET /users/{login}                 name, email, the counts
#
# EVERY ROW IS MINTED THEN PATCHED: `put(if_absent=True)` with the payload's
# non-null half, then `patch` with the whole of it, nulls included. That is the
# guide's "thin then whole" in two effects — a thinner payload can never put
# over a hydrated row, an absent field is never written as null, and a field
# the payload carries AS null (`milestone: null`, `closed_at: null`) clears.
#
# Every referent is staged BEFORE the row that names it, inside one
# invocation: a user row for every embedded user object, a repository row for
# every repository named, a milestone, a label and a team row for every
# embedded one. Ids are host.ids.external("github", account, key).
kind: substrate.reamde.dev/core/function
metadata:
  id: providers.substrate.reamde.dev/github/githubsync
data:
  authority: providers.substrate.reamde.dev
  package: github
  description: >-
    Sync a GitHub account: mirror the connected user, the repositories, the
    milestones, labels, teams, issues, pull requests and reviews it can see,
    every relation a reference — one page per invocation, never writing back
    to GitHub.
  runtime: python
  timeout: PT60S
  permissions:
    writes:
      - providers.substrate.reamde.dev/github/user
      - providers.substrate.reamde.dev/github/repository
      - providers.substrate.reamde.dev/github/license
      - providers.substrate.reamde.dev/github/codeofconduct
      - providers.substrate.reamde.dev/github/issuetype
      - providers.substrate.reamde.dev/github/app
      - providers.substrate.reamde.dev/github/comment
      - providers.substrate.reamde.dev/github/team
      - providers.substrate.reamde.dev/github/milestone
      - providers.substrate.reamde.dev/github/label
      - providers.substrate.reamde.dev/github/issue
      - providers.substrate.reamde.dev/github/pullrequest
      - providers.substrate.reamde.dev/github/review
      - providers.substrate.reamde.dev/github/account
    network:
      - "api.github.com"
      - "github.com"
      - "127.0.0.1"
      - "localhost"
  source: |
    # /// script
    # requires-python = ">=3.11"
    # dependencies = [
    #   "requests==2.32.4",
    # ]
    # ///
    """GitHub sync — one page per invocation, mirrors only, references everywhere.

    The account's live access token arrives injected on the bundle config
    (`config.accounts[].token`, host-resolved); the API base arrives on the
    client input (`config.inputs.client.properties.apiBase`) and defaults to
    https://api.github.com. This body never sees a client secret or a
    credential ref, and it refuses to send the token anywhere but
    https://api.github.com or loopback.

    Large accounts drain off the causal chain via the paged-checkpoint
    `more`/`resume` contract: the cursor carries the account queue, the stage
    list PINNED at queue-head, the provider page number, one floor + one
    watermark PER SEARCH STAGE, and the four hydration queues. A completed
    stage stamps the RUN-START watermark (never the local completion clock),
    queried back with a 120s overlap; a partial response
    (`incomplete_results`) refuses to advance its stage's watermark at all.
    One erroring account stamps ITS `syncStatus` and the queue moves on.
    Deletes are NOT reconciled: GitHub's search feed carries no tombstones.

    An organization that has not approved the OAuth app answers every read of
    ITS resources with a 403 GitHub spells out ("…has enabled OAuth App access
    restrictions…"). The SEARCH still lists the org's items, so the run used to
    die on the first one it hydrated and one restricted org emptied the whole
    mirror (T-077). `_get` raises `_Restricted` for that class, every per-item
    read catches it: the item is not minted, it is counted per org on the
    cursor and cumulatively on `account.syncSkipped`, the owner is remembered
    for the rest of the run so the org is asked ONCE, and the run ends
    `ok (N items skipped: the <org> organization restricts the OAuth app — …)`.
    The next run probes one remembered repository per org; when the owner has
    approved the app the search watermarks are dropped and the window the
    restriction hid is re-walked from the backfill floor.

    A run that starts with a parked backlog drains it FIRST and then walks the
    searches in the same run (version 21). Versions 15 to 20 made a backlog run
    pure hydration and left the searches to "the first round that starts
    clean" — so an account whose failed run had parked its owner logins
    (production, 2026-09-20: `resuming 27 parked hydration entries`) drained
    them, stamped `ok`, and never searched at all; the mirror stayed at two
    issues while every re-drive returned in one line.

    Every stamp also writes the core `sync` trait (substrate decision 0085)
    beside the legacy strings: `syncState` / `syncMessage`, `syncProgress` over
    the hydration backlog, `syncError` / `syncErrorAt` on a failure, a rate
    limit as `throttled` rather than `erroring`, and — on the SCHEDULE path
    only, since the dispatcher owns the record-sourced one —
    `lastSyncStartedAt` / `lastSyncDurationMs`. `syncPaused` holds the schedule.
    """
    import datetime as _dt
    import re
    from urllib.parse import urlparse

    import requests

    AUTHORITY = "providers.substrate.reamde.dev/github"
    USER_TYPE = AUTHORITY + "/user"
    REPO_TYPE = AUTHORITY + "/repository"
    TEAM_TYPE = AUTHORITY + "/team"
    MILESTONE_TYPE = AUTHORITY + "/milestone"
    LABEL_TYPE = AUTHORITY + "/label"
    ISSUE_TYPE = AUTHORITY + "/issue"
    PULL_TYPE = AUTHORITY + "/pullrequest"
    REVIEW_TYPE = AUTHORITY + "/review"
    LICENSE_TYPE = AUTHORITY + "/license"
    COC_TYPE = AUTHORITY + "/codeofconduct"
    ISSUETYPE_TYPE = AUTHORITY + "/issuetype"
    APP_TYPE = AUTHORITY + "/app"
    COMMENT_TYPE = AUTHORITY + "/comment"
    ACCOUNT_TYPE = AUTHORITY + "/account"

    DEFAULT_API = "https://api.github.com"
    API_HOST = "api.github.com"  # the ONLY non-loopback origin the token may reach
    LOOPBACK_HOSTS = ("127.0.0.1", "localhost", "::1")
    PAGE_SIZE = 100
    MAX_SEARCH_PAGES = 10  # the search API serves at most 1000 results per query
    OVERLAP_SECONDS = 120  # re-query window behind a stored watermark
    # Hydration is N+1 by nature, so it is bounded — but by the CLOCK, not by a
    # small constant. `HYDRATE_BATCH` is a loop and memory ceiling; `_Budget` is
    # the real bound, so one invocation against a fast API does hundreds of reads
    # and one against a slow one stops in time to checkpoint. `MAX_HYDRATE` caps
    # only the queue carried INSIDE the paged cursor: everything past it waits in
    # `account.syncPending`, which survives a bounded drain, and the hydration
    # stage refills the queue from it. Version 15's first cut had both numbers
    # doing the opposite job — 8 reads per invocation and a 400-entry cap whose
    # overflow was DROPPED — so a 1,620-pull backlog re-derived itself from the
    # searches every round and never moved.
    HYDRATE_BATCH = 400
    MAX_HYDRATE = 400
    # The hydration QUEUES, in the order their stages drain them.
    QUEUES = ("repos", "licenses", "pulls", "reviews", "issues", "graph", "users")
    HYDRATION_STAGES = ("reposFetch", "licensesFetch", "pullsFetch", "reviewsFetch",
                        "issuesFetch", "graphFetch", "usersFetch")
    # The issue GRAPH: property name -> the path under the issue that answers it.
    # `issue_dependencies_summary` and `sub_issues_summary` are COUNTS and cannot
    # say WHICH issue blocks which, so version 15 declared the counts and named
    # the edges out of scope (T-022). These three reads are the edges.
    GRAPH_EDGES = (("subIssues", "sub_issues"),
                   ("blockedBy", "dependencies/blocked_by"),
                   ("blocking", "dependencies/blocking"))
    # One edge list is fetched whole or not at all — a list written short is a
    # LIE about the graph, not a partial read of it — so the page walk is capped
    # and a list past the cap leaves the property alone and says so on the status.
    GRAPH_PAGES = 10
    BACKFILL_DAYS = {"last30d": 30, "last90d": 90, "last1y": 365}
    TOGGLES = ("enabledUser", "enabledRepos", "enabledIssues", "enabledPullRequests")
    SEARCH_STAGES = ("issues", "pulls", "pullsReview")
    SEARCH_QUERY = {
        "issues": "type:issue involves:",
        "pulls": "type:pr involves:",
        "pullsReview": "type:pr review-requested:",
    }
    # GitHub's two ORGANIZATION-level refusals: an OAuth app the org has not
    # approved ("…the `acme` organization has enabled OAuth App access
    # restrictions…") and a SAML session the token has not authorised
    # ("Resource protected by organization SAML enforcement"). Both are 403s
    # WITHOUT rate-limit exhaustion, both name the org, and asking again cannot
    # change either until the owner acts at GitHub — so they are a SKIP that is
    # counted and named, never a failure that stops the run (T-077).
    RESTRICTION_MARKS = ("oauth app access restrictions", "saml enforcement")
    RESTRICTION_DOCS = ("oauth-app-access-restrictions",
                        "restricting-access-to-your-organization")
    RESTRICTION_ADVICE = "approve it in the org's third-party access settings"
    MAX_RESTRICTED_PROBES = 8   # remembered repositories re-asked per run


    # --------------------------------------------------------------- plumbing

    def _wants(acct):
        props = acct.get("properties") or {}
        return any(props.get(t) for t in TOGGLES)


    def _due(props):
        # The owner's pause holds the SCHEDULE path (substrate decision 0085);
        # the dispatcher settles a paused record's own deliveries as skips before
        # this body ever runs, and an operator naming the account explicitly
        # (`args.account`) still gets a run, because a pause is a cadence
        # instruction and not a lock.
        if props.get("syncPaused"):
            return False
        freq = (props.get("syncFrequency") or "daily").lower()
        if freq == "off":
            return False
        last = props.get("lastSyncedAt")
        if not last:
            return True
        try:
            seen = _dt.datetime.fromisoformat(str(last).replace("Z", "+00:00"))
        except ValueError:
            return True
        hours = 1 if freq == "hourly" else 24
        return _dt.datetime.now(_dt.timezone.utc) - seen >= _dt.timedelta(hours=hours)


    def _pending_of(props):
        """The backlog the account is carrying, per queue."""
        held = props.get("syncPending")
        if not isinstance(held, dict):
            return {}
        out = {}
        for key in QUEUES:
            rows = held.get(key)
            if isinstance(rows, list) and rows:
                out[key] = [r for r in rows if r not in (None, "")]
        return {k: v for k, v in out.items() if v}


    def _stages(props):
        # The account's enabled stages, in walk order, PINNED into the cursor
        # at queue-head so a toggle flipped mid-drain cannot crash the walk.
        # `user` always runs (the searches need the login).
        #
        # THE BACKLOG COMES FIRST, THE WALK STILL HAPPENS (version 21, T-077).
        # Versions 15-20 made a run with a backlog PURE hydration ("the searches
        # resume on the first round that starts clean"), for a real reason: a
        # bounded drain (512 invocations, two minutes) that re-walks forty-odd
        # search pages before it hydrates anything re-derives the same backlog
        # and never shrinks it. But the rule had no second half. A run whose
        # failure had parked its owner logins drained them, stamped `ok`, and
        # ended — and since a re-drive is one run, the searches never came:
        # production on 2026-09-20 answered every `syncRequestedAt` with one log
        # line (`resuming 27 parked hydration entries`), `syncCursors: None` and
        # a mirror of two issues. So the ORDER is what the old rule was right
        # about, and it is kept: `_backlog_stages` drains the parked queues
        # first, and `_advance` then continues into THIS list — the ordinary
        # walk, searches included — in the same run. Progress stays monotonic
        # (the backlog shrinks before a search can add to it) and a run never
        # ends without having walked.
        out = ["user"]
        if props.get("enabledRepos"):
            # `licensesFetch` reads the catalogue entry behind a repository's
            # `license` / `code_of_conduct` key, so it follows the repositories.
            out.extend(["repos", "reposFetch", "licensesFetch"])
        if props.get("enabledIssues"):
            out.append("issues")
        if props.get("enabledPullRequests"):
            out.extend(["pulls", "pullsReview", "pullsFetch", "reviewsFetch"])
        if props.get("enabledIssues"):
            # `graphFetch` follows `issuesFetch`: an issue's own read is what
            # states the summaries the graph reads are asked for, and the parent
            # rows the edges point at are minted by the stage before it.
            out.extend(["issuesFetch", "graphFetch"])
        if props.get("enabledUser"):
            out.append("usersFetch")
        return out


    def _backlog_stages(props):
        """The hydration-only prefix a run with a parked backlog drains first."""
        return ["user"] + [st for st in HYDRATION_STAGES if _stage_enabled(props, st)]


    def _stage_enabled(props, stage):
        if stage in ("reposFetch", "licensesFetch"):
            return bool(props.get("enabledRepos"))
        if stage in ("pullsFetch", "reviewsFetch"):
            return bool(props.get("enabledPullRequests"))
        if stage in ("issuesFetch", "graphFetch"):
            return bool(props.get("enabledIssues"))
        return bool(props.get("enabledUser"))


    def _fresh(queue, sched=False):
        # `sched` and `startedAt` ride the cursor because a bounded drain resumes
        # through `host.page.resume()` with no envelope: only the FIRST invocation
        # can tell a schedule fire from a record-sourced delivery, and the
        # duration the trait reports is measured from that first one.
        return {"queue": queue, "stages": [], "stage": "user", "page": 1,
                "login": "", "runStart": "", "floors": {}, "cursors": {},
                "pfloor": "", "prepo": "", "partial": [], "stalled": [],
                "missing": [], "deferred": {}, "saved": None, "savedCursors": None,
                "repoIds": {}, "issueIds": {},
                "reviewPage": {}, "parents": [],
                "pulls": [], "reviews": [], "issues": [], "repos": [],
                "licenses": [], "graph": [], "users": [], "ack": "",
                "sched": bool(sched), "startedAt": _now(), "hydrateTotal": 0,
                # T-077: the organizations that refused this run (asked once
                # each), one repository per org to probe next run, the items
                # skipped per org, and the orgs whose refusal LIFTED this run.
                "restricted": [], "restrictedRepos": {}, "restrictedSkipped": {},
                "lifted": [],
                # The ordinary walk a backlog run continues with once the backlog
                # is drained (version 21); empty on a run that started clean.
                "walk": []}


    def _now():
        return _dt.datetime.now(_dt.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")


    def _minus_overlap(ts):
        if not ts:
            return ""
        try:
            t = _dt.datetime.fromisoformat(str(ts).replace("Z", "+00:00"))
        except ValueError:
            return str(ts)
        return (t - _dt.timedelta(seconds=OVERLAP_SECONDS)).strftime("%Y-%m-%dT%H:%M:%SZ")


    class _Budget:
        """The invocation's WALL-CLOCK budget, not its request count.

        The function's deadline is `PT60S` and `requests`' 20-second timeout is
        per request, so eight sequential hydration reads can be killed mid-batch
        and replay the same work on every invocation forever. A stage checks the
        budget between objects and checkpoints early instead.
        """

        LIMIT = 40.0            # seconds of the PT60S the stages may use

        def __init__(self):
            self.start = _dt.datetime.now(_dt.timezone.utc)
            self.calls = 0

        def spend(self):
            self.calls += 1

        def elapsed(self):
            return (_dt.datetime.now(_dt.timezone.utc) - self.start).total_seconds()

        def spent(self):
            return self.elapsed() >= self.LIMIT


    def _note_missing(cur, what):
        """A hydration read that 404'd, or an object the page could not process.

        Dropping these silently let a cursor advance over data the mirror never
        actually reconciled. They are counted on `syncStatus`, so "ok" means what
        it says and an operator can tell a deletion from a lost grant.
        """
        notes = list(cur.get("missing") or [])
        if what not in notes:
            notes.append(what)
        cur["missing"] = notes[:40]


    def _resolve_parents(sink, cur, full, number, rid):
        """Attach `parentIssue` now that this issue has a numeric identity.

        `parent_issue_url` names an issue by PATH, and a path is not an identity.
        Version 14 declared the property and never wrote it. The pair is queued
        when it is first seen, the parent is read like any other issue, and the
        link is patched onto every child that was waiting for it.
        """
        waiting = list(cur.get("parents") or [])
        keep = []
        for entry in waiting:
            pfull, pnumber, child = entry
            if pfull == full and pnumber == number:
                sink.patch(ISSUE_TYPE, child, {"parentIssue": rid})
            else:
                keep.append(entry)
        cur["parents"] = keep
        cur.setdefault("issueIds", {})["%s#%s" % (full, number)] = rid


    def _check_origin(url):
        # The bundle-side origin pin: a request that would carry the injected
        # token may reach ONLY the pinned production host over HTTPS, or
        # loopback (the test seam / the mock server). The engine's `network`
        # capability is declared-but-unenforced, so this refusal is the
        # defense until host-side egress enforcement exists.
        u = urlparse(url)
        host = (u.hostname or "").lower()
        if host in LOOPBACK_HOSTS:
            return
        # The production origin is exact: host, scheme AND port. Any HTTPS port on
        # api.github.com was admitted before, which is not what "exact origin"
        # means.
        if u.scheme == "https" and host == API_HOST and u.port in (None, 443):
            return
        raise RuntimeError(
            "github: refusing to send credentials to %s://%s:%s — only "
            "https://api.github.com or loopback"
            % (u.scheme, host or "?", u.port or "-"))


    class _RateLimited(Exception):
        """GitHub asked us to stop. Carries the instant it said to come back."""

        def __init__(self, resource, retry_at, message):
            super().__init__(message)
            self.resource = resource
            self.retry_at = retry_at


    def _retry_at(resp):
        """When GitHub says to try again: `Retry-After` for a secondary limit,
        `x-ratelimit-reset` (epoch seconds) for a primary one."""
        after = resp.headers.get("Retry-After")
        if after and str(after).strip().isdigit():
            return (_dt.datetime.now(_dt.timezone.utc)
                    + _dt.timedelta(seconds=int(after))).strftime("%Y-%m-%dT%H:%M:%SZ")
        reset = resp.headers.get("x-ratelimit-reset") or resp.headers.get("X-RateLimit-Reset")
        if reset and str(reset).strip().isdigit():
            return _dt.datetime.fromtimestamp(
                int(reset), _dt.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
        return ""


    class _Restricted(Exception):
        """The organization that owns this resource has not approved the OAuth
        app (or demands a SAML session the token lacks). Not a rate limit, not a
        failure of the run: a skip, per item, until the owner acts at GitHub.
        Carries the owner segment of the URL and the `owner/name` it named."""

        def __init__(self, url, message):
            super().__init__(message)
            self.url = url
            # The owner segment of an org-scoped URL; a SEARCH URL has none, and
            # then the org is the one GitHub's own message names in backticks.
            self.owner = _owner_of(url) or _org_in_message(message)
            self.full = _repo_of(url)


    def _org_in_message(message):
        m = re.search(r"`([A-Za-z0-9][A-Za-z0-9-]*)` organization", str(message or ""))
        return m.group(1) if m else ""


    def _org_path(url):
        """The path segments of an org-scoped URL under `/repos/` or `/orgs/`."""
        path = urlparse(url).path if "://" in (url or "") else (url or "")
        for marker in ("/repos/", "/orgs/"):
            i = path.find(marker)
            if i >= 0:
                return [seg for seg in path[i + len(marker):].split("/") if seg]
        return []


    def _owner_of(url):
        segs = _org_path(url)
        return segs[0] if segs else ""


    def _repo_of(url):
        segs = _org_path(url)
        return segs[0] + "/" + segs[1] if len(segs) >= 2 else ""


    def _restriction(resp):
        """GitHub's own words when a 403 is an ORGANIZATION refusal, else ""."""
        try:
            body = resp.json()
        except Exception:
            return ""
        if not isinstance(body, dict):
            return ""
        message = str(body.get("message") or "")
        docs = str(body.get("documentation_url") or "").lower()
        if any(m in message.lower() for m in RESTRICTION_MARKS) \
                or any(d in docs for d in RESTRICTION_DOCS):
            return message[:300] or "organization access restriction"
        return ""


    def _note_restricted(cur, e):
        """Remember the org for the rest of the run, and one of its repositories
        to probe next run. Idempotent: the pre-check in `fetch` raises the same
        exception for an owner already known, without a request."""
        owner = e.owner or "?"
        orgs = list(cur.get("restricted") or [])
        if owner not in orgs:
            orgs.append(owner)
        cur["restricted"] = orgs
        probes = dict(cur.get("restrictedRepos") or {})
        if e.full and not probes.get(owner):
            probes[owner] = e.full
        cur["restrictedRepos"] = probes


    def _skip_restricted(cur, e):
        """One unit of work (a search item, a hydration entry) the org refused:
        not minted, not queued, counted against the org."""
        _note_restricted(cur, e)
        tally = dict(cur.get("restrictedSkipped") or {})
        tally[e.owner or "?"] = int(tally.get(e.owner or "?") or 0) + 1
        cur["restrictedSkipped"] = tally


    def _restricted_held(props):
        """`account.syncSkipped.restricted` — org -> {items, repo, at}."""
        held = props.get("syncSkipped")
        if not isinstance(held, dict):
            return {}
        rows = held.get("restricted")
        if not isinstance(rows, dict):
            return {}
        return {str(k): dict(v) for k, v in rows.items() if isinstance(v, dict)}


    def _orgs_phrase(orgs):
        names = sorted(orgs)
        if len(names) == 1:
            return "the %s organization restricts" % names[0]
        return "the %s and %s organizations restrict" % (
            ", ".join(names[:-1]), names[-1])


    def _restricted_note(props, cur):
        """The status clause for a run that met (or still carries) a refusal."""
        orgs = list(cur.get("restricted") or [])
        if not orgs:
            return ""
        run = sum(int(v) for v in (cur.get("restrictedSkipped") or {}).values())
        if run:
            return "%d items skipped: %s the OAuth app — %s" % (
                run, _orgs_phrase(orgs), RESTRICTION_ADVICE)
        # Probed and still refused, but nothing of the org's turned up in this
        # window: the mirror is still short of what earlier runs skipped.
        before = sum(int(r.get("items") or 0)
                     for o, r in _restricted_held(props).items() if o in orgs)
        return "%s the OAuth app (%d items skipped in earlier runs) — %s" % (
            _orgs_phrase(orgs), before, RESTRICTION_ADVICE)


    def _skipped_after(props, cur, now):
        """`syncSkipped` after this run: the account's tally, minus the orgs whose
        refusal lifted, plus what this run skipped per org."""
        held = _restricted_held(props)
        for org in cur.get("lifted") or []:
            held.pop(org, None)
        tally = cur.get("restrictedSkipped") or {}
        probes = cur.get("restrictedRepos") or {}
        for org in cur.get("restricted") or []:
            row = dict(held.get(org) or {})
            row["items"] = int(row.get("items") or 0) + int(tally.get(org) or 0)
            row["repo"] = probes.get(org) or row.get("repo") or ""
            row["at"] = now
            held[org] = row
        return {"restricted": held} if held else None


    def _get(token, url, params=None, allow_404=False):
        # Redirects are followed BY HAND, so the origin pin holds for every hop.
        # `allow_redirects=True` let the check apply to the first URL only, which
        # is not the "exact origin" the docstring claims.
        for _hop in range(5):
            _check_origin(url)
            resp = requests.get(url, params=params or {}, headers={
                "Authorization": "Bearer " + token,
                "Accept": "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28",
            }, timeout=20, allow_redirects=False)
            if resp.status_code in (301, 302, 303, 307, 308) and resp.headers.get("Location"):
                url = requests.compat.urljoin(url, resp.headers["Location"])
                params = None          # the redirect target carries its own query
                continue
            break
        else:
            raise RuntimeError("github: too many redirects")
        if allow_404 and resp.status_code == 404:
            return None
        # A rate limit is not a failure to report and forget: it is work to
        # resume. GitHub signals it as 403 or 429 WITH headers — a primary limit
        # sets `x-ratelimit-remaining: 0`, a secondary one sets `Retry-After` —
        # and version 14 threw both away, stamped the attempt finished and
        # acknowledged the forced request, so the run looked complete.
        if resp.status_code in (403, 429):
            remaining = resp.headers.get("x-ratelimit-remaining") \
                or resp.headers.get("X-RateLimit-Remaining")
            after = resp.headers.get("Retry-After")
            if after or str(remaining).strip() == "0":
                raise _RateLimited(
                    resp.headers.get("x-ratelimit-resource") or "core",
                    _retry_at(resp),
                    "rate limited on %s" % (
                        resp.headers.get("x-ratelimit-resource") or "core"))
        # The ORGANIZATION refusal (T-077): the same 403 status, no exhausted
        # limit, and a body that names the org and the policy. It is raised as
        # its own class so a per-item read can skip the item and carry on, where
        # a bare HTTPError stops the account.
        if resp.status_code == 403:
            why = _restriction(resp)
            if why:
                raise _Restricted(url, why)
        resp.raise_for_status()
        return resp.json()


    def _err_msg(e):
        if isinstance(e, _RateLimited):
            return "rate limited on %s; retry after %s" % (
                e.resource, e.retry_at or "the window resets")
        if isinstance(e, _Restricted):
            # Only a NON-item read reaches here (a listing, a search): the
            # per-item ones are skipped and counted where they happen.
            who = _orgs_phrase([e.owner]) if e.owner \
                else "an organization restricts"
            return "%s the OAuth app — %s (GitHub: %s)" % (
                who, RESTRICTION_ADVICE, str(e)[:160])
        if isinstance(e, requests.HTTPError) and e.response is not None:
            code = e.response.status_code
            if code == 401:
                # GitHub OAuth tokens do not expire, so a revoked-at-GitHub
                # grant keeps "refreshing" fine and only fails HERE.
                return "unauthorized (was the token revoked at GitHub?)"
            # GitHub's own `message` says WHICH 403 this is — "Resource protected
            # by organization SAML enforcement", "Must have admin rights", a
            # blocked search — and a bare status code sent the owner reading logs
            # (T-077). Bounded, and never the body of anything else.
            why = ""
            try:
                body = e.response.json()
                why = str((body or {}).get("message") or "")[:160]
            except Exception:
                why = ""
            return "github returned HTTP %d%s" % (code, (": " + why) if why else "")
        return str(e) or type(e).__name__


    # ---------------------------------------------------------------- ids
    # EVERY key is GitHub's own numeric id. A login and a `owner/name` path are
    # both MUTABLE: a rename mints a second row and a reused handle attaches a
    # stranger to the first one's links, which is the identity defect the review
    # found. So nothing is keyed on a name here — a user is `user/<id>`, a
    # repository is `repo/<id>` — and the two places GitHub hands over a name
    # without an id are RESOLVED before a row is minted:
    #
    #   * a repository named only by a search item's `repository_url` is read
    #     through `GET /repos/{o}/{r}` once per run (`Sink.resolve_repo`), which
    #     is also the full-repository hydration the mirror was missing;
    #   * a user named only by a repository path's owner segment is not minted at
    #     all — the reference is left absent and the login goes on the profile
    #     queue, so the row appears when `GET /users/{login}` gives it an id.
    #
    # A pull request is keyed on its PULL id even when the only payload in hand
    # is a search item, whose `id` is the ISSUE id: the item's `node_id` is a
    # `PR_…` global node id whose msgpack payload IS the pull id, and decoding it
    # is lossless and mechanical (`docs/kind-design.md` §1). Verified on 282 of
    # 282 search/detail pairs in the owner's corpus.

    def _user_id(host, aid, uid):
        return host.ids.external("github", aid, "user/" + str(uid))


    def _repo_id(host, aid, rid):
        return host.ids.external("github", aid, "repo/" + str(rid))


    def _simple_id(host, aid, prefix, ident):
        return host.ids.external("github", aid, prefix + "/" + str(ident))


    def _item_id(host, aid, pull, item_id):
        return host.ids.external(
            "github", aid, ("pull/" if pull else "issue/") + str(item_id))


    def _node_ints(node_id):
        """The integers inside a modern GitHub node id.

        `<PREFIX>_<base64url(msgpack)>`, the msgpack being `[0, id]` for a
        top-level resource and `[scope, parentId, id]` for a scoped one. Returns
        [] for the legacy base64 form or anything that does not parse, so the
        caller falls back rather than inventing an identity.
        """
        import base64
        if not isinstance(node_id, str) or "_" not in node_id:
            return []
        body = node_id.partition("_")[2]
        try:
            raw = base64.urlsafe_b64decode(body + "=" * (-len(body) % 4))
        except Exception:
            return []
        if not raw or raw[0] not in (0x92, 0x93):
            return []
        want, i, out = raw[0] & 0x0F, 1, []
        while i < len(raw) and len(out) < want:
            b = raw[i]
            if b <= 0x7F:
                out.append(b); i += 1
            elif b == 0xCC and i + 1 < len(raw):
                out.append(raw[i + 1]); i += 2
            elif b == 0xCD and i + 2 < len(raw):
                out.append(int.from_bytes(raw[i + 1:i + 3], "big")); i += 3
            elif b == 0xCE and i + 4 < len(raw):
                out.append(int.from_bytes(raw[i + 1:i + 5], "big")); i += 5
            elif b == 0xCF and i + 8 < len(raw):
                out.append(int.from_bytes(raw[i + 1:i + 9], "big")); i += 9
            else:
                return []
        return out if len(out) == want and i == len(raw) else []


    def _pull_identity(item):
        """(pullId, issueId) for one object that may be either representation.

        A payload from `/repos/{o}/{r}/pulls/{n}` states the pull id in `id`. A
        search hit or an Issue read states the ISSUE id there, and the pull id
        only inside its `PR_…` node id. Returns (None, …) when neither is
        available, and the caller skips the item rather than key it on a guess.
        """
        node = item.get("node_id") or ""
        url = item.get("url") or ""
        ints = _node_ints(node)
        from_node = ints[-1] if (ints and node.startswith("PR_")) else None
        own = item.get("id")
        if "/pulls/" in url:
            return own, from_node if from_node != own else None
        # an Issue representation: `id` is the issue id
        return from_node, own


    def _repo_full(url):
        # The FIRST TWO segments after "/repos/": a search item names the
        # repository as ".../repos/owner/name", but a hydrated pull request
        # only ever carries ".../repos/owner/name/pulls/337", and taking the
        # whole tail would yield nothing for it.
        marker = "/repos/"
        i = (url or "").find(marker)
        if i < 0:
            return ""
        parts = url[i + len(marker):].split("/")
        if len(parts) < 2 or not parts[0] or not parts[1]:
            return ""
        return parts[0] + "/" + parts[1]


    # ------------------------------------------------------ property shapes
    # One rule, everywhere: a key the payload does not carry is ABSENT from
    # the props; a key it carries as null (or as the empty string GitHub uses
    # for "unset") is None, which the PATCH writes as a delete. `_mint` is the
    # non-null half, which is what a create may carry.

    # Enum spelling is EXPLICIT and total. The mechanical rule (lowercase, drop
    # `_` and `-`) is right for `not_planned` and wrong for `too heated`, which
    # has a SPACE — and version 14 did not even apply the mechanical rule to the
    # lock reasons, so `off-topic` and `too heated` would have been written
    # verbatim and refused by the enum. Every label GitHub can send is in a table
    # here, the table is the one the declaration's `label:` fields carry, and
    # `_enum_of` refuses to invent a value for a label it does not know: an
    # unknown label leaves the property ABSENT (a new API value is a widening and
    # a package bump), which loses one property instead of rolling back the page.
    LOCK_REASONS = {"off-topic": "offtopic", "too heated": "tooheated",
                    "resolved": "resolved", "spam": "spam"}
    PR_CREATION_POLICY = {"all": "all", "collaborators_only": "collaboratorsonly"}
    SECURITY_STATUS = {"enabled": "enabled", "disabled": "disabled"}
    # THREE SETS GITHUB DOES NOT CLOSE, checked against the OpenAPI description
    # (T-022): `simple-user.type`, `team.privacy` and `team.notification_setting`
    # are plain `string` there — the four/two/two values are GitHub's PROSE, not
    # its schema. The declarations are enums (they are the right shape for a
    # reader and a fifth value is a package bump), so the tables are what keeps a
    # value nobody has seen from refusing a whole page: `_enum_of` leaves the
    # property ABSENT, where the mechanical `_enum` would have written
    # `enterpriseuseraccount` and had the loader roll the account's work back.
    USER_TYPES = {"User": "user", "Organization": "organization", "Bot": "bot",
                  "Mannequin": "mannequin"}
    TEAM_PRIVACY = {"closed": "closed", "secret": "secret"}
    TEAM_NOTIFICATION = {"notifications_enabled": "notificationsenabled",
                         "notifications_disabled": "notificationsdisabled"}
    TEAM_ACCESS_SOURCE = {"direct": "direct", "organization": "organization",
                          "enterprise": "enterprise"}
    ISSUETYPE_COLORS = {c: c for c in ("gray", "blue", "green", "yellow",
                                       "orange", "red", "pink", "purple")}
    # Every feature the repository schema documents, including the three this
    # account's corpus never carries — declared AND extracted, so a repository
    # that does carry them is mirrored rather than silently reduced.
    SECURITY_FEATURES = (
        ("advanced_security", "advancedSecurity"),
        ("code_security", "codeSecurity"),
        ("dependabot_security_updates", "dependabotSecurityUpdates"),
        ("secret_scanning", "secretScanning"),
        ("secret_scanning_push_protection", "secretScanningPushProtection"),
        ("secret_scanning_non_provider_patterns",
         "secretScanningNonProviderPatterns"),
        ("secret_scanning_validity_checks", "secretScanningValidityChecks"),
        ("secret_scanning_ai_detection", "secretScanningAiDetection"),
        ("secret_scanning_delegated_bypass", "secretScanningDelegatedBypass"),
        ("secret_scanning_delegated_alert_dismissal",
         "secretScanningDelegatedAlertDismissal"),
    )


    def _enum(value):
        # The mechanical rule, for the sets whose labels are `[A-Za-z_-]+`:
        # `not_planned` -> `notplanned`, `FIRST_TIME_CONTRIBUTOR` ->
        # `firsttimecontributor`. A label with any other character needs a table,
        # and a result the loader would refuse is dropped, not written.
        if value is None:
            return None
        out = str(value).lower().replace("_", "").replace("-", "")
        return out if out and out.isalnum() and out[0].isalpha() else None


    def _enum_of(table):
        def cast(value):
            if value is None:
                return None
            return table.get(str(value)) or table.get(str(value).lower())
        return cast


    def _email(value):
        # §2: "a value that does not parse is not written". A malformed address
        # would otherwise refuse the whole page, turning one bad profile into a
        # stalled account.
        v = str(value or "").strip()
        if v.count("@") != 1:
            return None
        local, _, domain = v.partition("@")
        if not local or not domain or "." not in domain or " " in v:
            return None
        return v


    def _take(props, payload, api_key, name, cast=None):
        """One scalar, with the guide's presence rule.

        A key the payload does not carry is ABSENT. A key it carries as `null` is
        None, which the PATCH writes as a delete. An EMPTY STRING IS A VALUE: it
        is what GitHub sends for an unset `gravatar_id`, an empty `description`
        and an approving review with no body, and version 14 deleted all three by
        treating `""` as null. A cast that returns None for a non-null input (an
        unknown enum label, a malformed address) leaves the property absent
        rather than deleting a good stored value with a bad new one.
        """
        if not isinstance(payload, dict) or api_key not in payload:
            return
        value = payload.get(api_key)
        if value is None:
            props[name] = None
            return
        if cast is None:
            props[name] = value
            return
        out = cast(value)
        if out is None:
            return
        props[name] = out


    def _mint(props):
        return {k: v for k, v in props.items() if v is not None}


