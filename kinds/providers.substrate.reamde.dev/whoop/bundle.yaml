# The WHOOP bundle — a COMPLETE, FIRST-CLASS mirror of what one WHOOP strap
# records about its member. SYNC-ONLY: nothing here writes back to WHOOP.
#
# It connects a WHOOP account over the host OAuth facility and mirrors WHOOP's
# own object model, whole: the MEMBER, their physiological CYCLES, the RECOVERY
# that scores each cycle, the SLEEPS and the WORKOUTS.
#
# WHICH API. **v2**, at `https://api.prod.whoop.com/developer/v2`. Everything
# below is written against WHOOP's own published description, fetched from
# `https://api.prod.whoop.com/developer/doc/openapi.json` (which needs no
# token, and is why these kinds could be written while the owner's grant was
# dead — see T-017). What v2 changed from the v1 shapes the parked pre-guide
# draft carried, and every one of them is load-bearing here:
#
#   * a SLEEP's and a WORKOUT's `id` is a UUID STRING, not an integer, and the
#     old number rides beside it as `v1_id` — two upstream identities, both
#     declared, keyed on the one the resource's own endpoint reports
#     (`docs/kind-design.md` §3);
#   * a SLEEP carries `cycle_id`, so `sleep.cycle` is a reference WHOOP itself
#     states rather than a join a reader would have to compute;
#   * a WORKOUT carries `sport_name` — a required field in v2 — beside the now
#     deprecated `sport_id`. The name is the API's, not a lookup this bundle
#     performs, so it is declared and NOT derived;
#   * the workout score's zone object is `zone_durations` (v1 spelled it
#     `zone_duration`);
#   * a RECOVERY's `sleep_id` is a UUID too, so `recovery.sleep` pins the v2
#     sleep row.
#
# THE RULE THIS BUNDLE OBEYS is `docs/kind-design.md` (v4):
#
#   * A KIND IS THE API OBJECT, COMPLETE. Every documented field of every v2
#     resource is a top-level property under the API's name camelCased. The ONE
#     omitted class is the paging envelope (`records`, `next_token`); WHOOP
#     publishes no hypermedia at all, so the second class is empty and each
#     kind's description says so.
#   * NO `raw`. Substrate's shipped whoop bundle (version 9) carried
#     `raw: json` on three of its four mirrors beside a five-field typed view,
#     which held every fact twice and let the view stay thin. There is no
#     `json` property anywhere in this closure: WHOOP's deepest shape is
#     `score.stageSummary.totalInBedTimeMilli`, three levels, inside the four
#     §1 admits.
#   * NO DERIVED PROPERTY. Version 9's `recovery.date` (a calendar day sliced
#     out of `created_at`), `workout.calories` (kilojoules × 0.239006) and
#     `sleep.durations.asleepMs` (light + REM + deep, a sum WHOOP does not
#     publish) are all gone. WHOOP's own numbers in WHOOP's own units: a
#     kilojoule is a kilojoule, and kcal is the reader's multiplication.
#   * EVERY RELATION IS A REFERENCE AT THE KIND THAT HOLDS THE OTHER END, and
#     only where WHOOP states it: `recovery.cycle`, `recovery.sleep`,
#     `sleep.cycle`, and `<every mirror>.user`. A WORKOUT names no cycle in v2
#     and so declares none — the overlap of a workout with a cycle is a join
#     the reader computes, never a link this mirror invents.
#   * NO SYNC BOOKKEEPING ON A MIRROR. Every cursor is on the account:
#     `syncCursors` keyed by stream, and the pagination `nextToken` rides in
#     the drain's own checkpoint, which is not a record at all. A re-score of
#     yesterday's cycle bumps the cycle row and nothing else.
#   * NO CONSUMER SLOT. No `person`, no `episode`, no owner-relative flag. The
#     owner is `account.user`; "my recoveries" is a filter on `user`, and the
#     subject slot a mapping needs is SYNTHESISED by the engine (#570).
#
# WHY `sportName` IS A `string` AND THERE IS NO `sport` KIND — §3's two-part
# test, applied. A WHOOP sport is not an embedded object: v2 sends a bare name
# and a deprecated bare integer. It has no endpoint of its own (there is no
# `/v2/sport` in the published description) and it appears in exactly one
# kind's payload, so it fails BOTH halves of the test and a `sport` kind would
# be a table this bundle invents and then maintains by hand. An `enum` is
# likewise wrong: v2 types `sport_name` as a plain `string` with no enumeration
# and WHOOP keeps appending sports (F45, Padel, Dedicated Parenting, Public
# Speaking all arrived after v1 shipped), so §2's "a documented but growing
# list" applies — a `string` with the known values in the description.
#
# WHY THE TEMPORAL TRAITS SIT WHERE THEY DO (§4). A cycle, a sleep and a
# workout each have an instant OF THEIR OWN with two ends, so all three bind
# `temporal(range)` fed by `start` and `end`, and neither is redeclared. A
# recovery has one instant of its own — `created_at`, the moment WHOOP recorded
# the verdict — so it binds `temporal(point)` and does not redeclare it.
# `updated_at` is a MUTATION MARK on all four and binds nothing anywhere; it is
# declared as the object's own field and is what the 48-hour re-read overlap
# exists for. The MEMBER has no instant at all and so binds no trait: a trait
# fed by the sync's own clock would be the sync's fact, not WHOOP's.
#
# Install:   substratectl apply -f bundle.yaml -f triggers.yaml
# Configure: a config record — the WHOOP OAuth app's client id + secret, and
#   (tests only) an `apiBase`. The provider ENDPOINTS and the feature->scope
#   mapping are TRUSTED bundle-manifest metadata (the `oauth2:` block below),
#   never config-record properties.
# Connect:   create an account, then run the host OAuth flow against it.
#
# This file is the SCHEMA closure (the atomic install unit). The delivery
# wiring lives beside it in triggers.yaml as ordinary data records.
# ---- the owned package --------------------------------------------------------
kind: substrate.reamde.dev/core/package
metadata:
  id: providers.substrate.reamde.dev/whoop
data:
  authority: providers.substrate.reamde.dev
  package: whoop
  # 10, because substrate's catalogue ships this package at 9 and a package
  # that reaches a repository has to outrank what is installed there. What it
  # is NOT is a compatible successor: version 9 declares `recovery.cycleId` as
  # a string, `sleep.start`/`end` as ordinary properties, `workout.sport` and
  # `raw: json`, and this version retypes and drops all of them. Over a
  # repository holding version 9 ROWS that is a narrowing the engine refuses;
  # over one holding none (mneme.rxtx.dev has never seeded WHOOP) it is a
  # clean upgrade, and over an e2e's throwaway repository it is a first
  # install. See README.md, "What changed in version 10".
  #
  # 11 — the account binds substrate's core `sync` trait (decision 0085) and
  # the sync body writes its twelve properties beside the ad hoc ones, so the
  # Connections page, `GET /api/v1/sync/status` and `substratectl sync status`
  # render this bundle without knowing it (T-084). ADDITIVE, unlike 10: every
  # property version 10 declared stays, at its own name and type.
  #
  # 15 — every kind's description opens with one plain sentence
  # saying what a record is to a person.
  #
  # 16: the account declares `tokenError` and `tokenErrorAt`, the reason
  # and time the OAuth facility last failed to refresh its token. ADDITIVE.
  #
  # 17: the `syncError` and `syncErrorAt` descriptions say a later
  # run that ends `ok`, or a reconnect, clears the pair. Text only.
  #
  # 19: `whoopsync` pins requests 2.34.2, past PYSEC-2026-2275
  # (CVE-2026-25645).
  #
  # 21: `whoopsync` deletes a row whose object WHOOP answers 404 for when
  # read back by id, moves a stream's cursor only once every read-back in
  # its window has answered with the object or a 404, and never writes a
  # payload older than the stored row's `updatedAt`; every mirror write and
  # delete is staged under the version of the row it was compared with.
  # `recovery` declares `cycleId`, the id a recovery is read back by when no
  # cycle row exists, and the sync re-walks the recoveries written before it
  # to fill it in. The sync imports its row mapping from the bundle's
  # `whoop_mirror` module and pins requests 2.34.2. The
  # `enabledCycles` description says a cycle runs from one sleep onset to
  # the next, as WHOOP defines it, not wake to wake. ADDITIVE. Version 20
  # was never released.
  #
  # 22: the `whoopwebhook` function and the `whoop-webhook` trigger. The
  # trigger declares WHOOP's signature and the door verifies it against the
  # config record's client secret (decision record 0164), so no function
  # sees the secret. `whoopwebhook` rewrites or deletes the one mirror row
  # an event names, and drops an event WHOOP answers 401 or 403 for. It
  # imports its row mapping from the `whoop_mirror` module, as `whoopsync`
  # does. `enabledRecovery` requests `read:sleep`, because a
  # `recovery.updated` event names a sleep, which is read to find the
  # recovery's cycle. ADDITIVE.
  #
  # 23: `recovery`, `sleep` and `workout` declare `refreshRequestedAt`. A
  # webhook that cannot read the object it names (a 429, a 5xx, no answer,
  # no live token, the retry hold, a 401 or 403) marks the row instead of
  # dropping the event, and `whoopsync` reads each marked row back by id and
  # clears the mark. `whoopwebhook` stages each write under the version of
  # the row it read before asking WHOOP, sets the account's `retryNotBefore`
  # from a 429, counts a recovery event as marked only when a recovery row
  # is, and acts for every account of the WHOOP member, each under its own
  # pause, committing the accounts that finished when another must keep the
  # request. A sync page naming a row the mirror holds deleted reads the
  # object back by id before writing it. The `whoop-webhook` trigger declares
  # `timestampUnit: milliseconds`, which the door requires beside a
  # `timestampHeader`. ADDITIVE.
  version: 23
---
# ---- the bundle document: the install unit --------------------------------
# `installs:` names EXACTLY the package's schema members. No mapping: this
# package owns no person and no episode, and the owner of a mapping's target is
# the one who declares it (record 0049).
kind: substrate.reamde.dev/core/bundle
metadata:
  id: providers.substrate.reamde.dev/whoop
data:
  authority: providers.substrate.reamde.dev
  package: whoop
  description: >-
    Keeps a copy of your WHOOP — your profile and body measurement, your physiological
    cycles, the recovery score for each one, your sleeps and your workouts.
    Read-only.
  # The one declared input: the OAuth client record. `inject: functions`
  # because the sync reads `apiBase` off it — the engine SKIPS the oauth2
  # trait's `clientSecret` when it builds an injected record view
  # (engine/invocationconfig.go, isOAuthFacilitySecret), so the body still
  # never sees a client secret or a credential ref.
  inputs:
    client:
      kind: providers.substrate.reamde.dev/whoop/config
      inject: functions
      description: the WHOOP OAuth app the host exchanges codes through
  # TRUSTED provider metadata: the host reads the endpoints and the
  # feature->scope mapping ONLY from here — the immutable install artifact —
  # never from the mutable config record, so a config edit can never redirect
  # a token exchange.
  #
  # WHOOP's scopes are FINE-GRAINED, one per collection, exactly as its
  # published security scheme lists them. `offline` is what mints the refresh
  # token and `read:profile` is what lets the facility derive the connected
  # address, so both ride on every feature's list; the facility recomputes the
  # union from the enabled toggles and dedupes.
  #
  # NO revocationEndpoint: WHOOP exposes no RFC 7009 form-POST revoke. Its
  # documented revocation is an OAuth-AUTHENTICATED `DELETE /v2/user/access`,
  # a method+auth shape the facility cannot speak. Declaring an invented
  # endpoint made every account deletion changelog a revoke failure while the
  # remote grant stayed live; the field is optional, so it is omitted and the
  # README documents manual revocation.
  oauth2:
    clientInput: client
    authorizationEndpoint: https://api.prod.whoop.com/oauth/oauth2/auth
    tokenEndpoint: https://api.prod.whoop.com/oauth/oauth2/token
    # After the exchange the facility reads the connected member's own address
    # off the basic profile (the read:profile grant authorizes it) and writes
    # it into the account's `email` as the substrate.oauth actor. The user
    # never types it; it comes from the grant.
    emailEndpoint: https://api.prod.whoop.com/developer/v2/user/profile/basic
    emailProperty: email
    featureScopes:
      enabledProfile:
        scopes:
          - read:profile
          - read:body_measurement
          - offline
      enabledCycles:
        scopes:
          - read:cycles
          - read:profile
          - offline
      # read:sleep because a `recovery.updated` webhook names the SLEEP,
      # and `whoopwebhook` reads it to find the cycle the recovery is keyed
      # on.
      enabledRecovery:
        scopes:
          - read:recovery
          - read:cycles
          - read:sleep
          - read:profile
          - offline
      enabledSleep:
        scopes:
          - read:sleep
          - read:profile
          - offline
      enabledWorkouts:
        scopes:
          - read:workout
          - read:profile
          - offline
  installs:
    - providers.substrate.reamde.dev/whoop/config
    - providers.substrate.reamde.dev/whoop/account
    - providers.substrate.reamde.dev/whoop/user
    - providers.substrate.reamde.dev/whoop/cycle
    - providers.substrate.reamde.dev/whoop/recovery
    - providers.substrate.reamde.dev/whoop/sleep
    - providers.substrate.reamde.dev/whoop/workout
    - providers.substrate.reamde.dev/whoop/whoopsync
    - providers.substrate.reamde.dev/whoop/whoopwebhook
  # The functions' shared library: one module on the import path of every
  # function the bundle installs. A body cannot import another body.
  modules:
    whoop_mirror.py: |
      """The WHOOP closure's shared library: what `whoopsync` and `whoopwebhook`
      must agree on, kept once.

      A function body cannot import another body, so the mapping from a WHOOP v2
      object to its mirror row, the origin the token may reach and the 429 hold
      live here, in the bundle's `modules:`, and both bodies import them. A WHOOP
      object either body reads is therefore written as one shape.
      """
      import datetime as _dt
      from urllib.parse import urlsplit as _urlsplit

      PKG = "providers.substrate.reamde.dev/whoop"
      ACCOUNT_KIND = PKG + "/account"
      USER_KIND = PKG + "/user"
      CYCLE_KIND = PKG + "/cycle"
      RECOVERY_KIND = PKG + "/recovery"
      SLEEP_KIND = PKG + "/sleep"
      WORKOUT_KIND = PKG + "/workout"

      # The property a webhook that could not read an object sets on its row, and
      # every write of the object from WHOOP clears: the sync reads a row holding
      # it back by id, whatever its age. A cycle has no webhook and no mark.
      REFRESH_MARK = "refreshRequestedAt"

      DEFAULT_API_BASE = "https://api.prod.whoop.com/developer"
      API_HOST = "api.prod.whoop.com"   # the ONLY non-loopback origin the token may reach
      LOOPBACK_HOSTS = ("127.0.0.1", "localhost", "::1")

      # The three values the v2 schema closes `score_state` at, and the spelling the
      # loader admits. THE SYNC CARRIES THE SAME TABLE THE DECLARATION DOES (§2): a
      # value outside it leaves the property ABSENT rather than refusing the page,
      # because one new WHOOP word must not cost an account its whole run.
      SCORE_STATES = {"SCORED": "scored", "PENDING_SCORE": "pendingscore",
                      "UNSCORABLE": "unscorable"}

      CYCLE_SCORE = (("strain", "strain"), ("kilojoule", "kilojoule"),
                     ("average_heart_rate", "averageHeartRate"),
                     ("max_heart_rate", "maxHeartRate"))
      RECOVERY_SCORE = (("user_calibrating", "userCalibrating"),
                        ("recovery_score", "recoveryScore"),
                        ("resting_heart_rate", "restingHeartRate"),
                        ("hrv_rmssd_milli", "hrvRmssdMilli"),
                        ("spo2_percentage", "spo2Percentage"),
                        ("skin_temp_celsius", "skinTempCelsius"))
      SLEEP_SCORE = (("respiratory_rate", "respiratoryRate"),
                     ("sleep_performance_percentage", "sleepPerformancePercentage"),
                     ("sleep_consistency_percentage", "sleepConsistencyPercentage"),
                     ("sleep_efficiency_percentage", "sleepEfficiencyPercentage"))
      STAGE_SUMMARY = (("total_in_bed_time_milli", "totalInBedTimeMilli"),
                       ("total_awake_time_milli", "totalAwakeTimeMilli"),
                       ("total_no_data_time_milli", "totalNoDataTimeMilli"),
                       ("total_light_sleep_time_milli", "totalLightSleepTimeMilli"),
                       ("total_slow_wave_sleep_time_milli", "totalSlowWaveSleepTimeMilli"),
                       ("total_rem_sleep_time_milli", "totalRemSleepTimeMilli"),
                       ("sleep_cycle_count", "sleepCycleCount"),
                       ("disturbance_count", "disturbanceCount"))
      SLEEP_NEEDED = (("baseline_milli", "baselineMilli"),
                      ("need_from_sleep_debt_milli", "needFromSleepDebtMilli"),
                      ("need_from_recent_strain_milli", "needFromRecentStrainMilli"),
                      ("need_from_recent_nap_milli", "needFromRecentNapMilli"))
      WORKOUT_SCORE = (("strain", "strain"),
                       ("average_heart_rate", "averageHeartRate"),
                       ("max_heart_rate", "maxHeartRate"), ("kilojoule", "kilojoule"),
                       ("percent_recorded", "percentRecorded"),
                       ("distance_meter", "distanceMeter"),
                       ("altitude_gain_meter", "altitudeGainMeter"),
                       ("altitude_change_meter", "altitudeChangeMeter"))
      ZONE_DURATIONS = (("zone_zero_milli", "zoneZeroMilli"),
                        ("zone_one_milli", "zoneOneMilli"),
                        ("zone_two_milli", "zoneTwoMilli"),
                        ("zone_three_milli", "zoneThreeMilli"),
                        ("zone_four_milli", "zoneFourMilli"),
                        ("zone_five_milli", "zoneFiveMilli"))


      # ------------------------------------------------------------------ plumbing

      def parse(value):
          """An RFC 3339 instant, or None. WHOOP spells them with a `Z` and with
          fractional seconds; fromisoformat takes both from 3.11."""
          if not value:
              return None
          try:
              return _dt.datetime.fromisoformat(str(value).replace("Z", "+00:00"))
          except ValueError:
              return None


      def check_origin(url):
          """The bundle-side origin pin.

          A request that would carry the injected token may reach ONLY the pinned
          production host over HTTPS, or loopback (the test seam and the mock
          server). `apiBase` is an owner-editable config property, so it is checked,
          never trusted.
          """
          u = _urlsplit(url)
          host = (u.hostname or "").lower()
          if host in LOOPBACK_HOSTS:
              return
          if u.scheme == "https" and host == API_HOST and u.port in (None, 443):
              return
          raise RuntimeError(
              "whoop: refusing to send credentials to %s://%s:%s; only "
              "https://api.prod.whoop.com or loopback"
              % (u.scheme, host or "?", u.port or "-"))


      def api_base(cfg):
          """The data API's origin: the client input's `apiBase`, else WHOOP's."""
          client = ((cfg.get("inputs") or {}).get("client") or {})
          base = ((client.get("properties") or {}).get("apiBase") or "").strip()
          return (base or DEFAULT_API_BASE).rstrip("/")


      def held(props):
          """Whether the account's 429 hold is still ahead. WHOOP named an instant to
          come back, and a read before it earns the next 429, so every entry path
          asks this, not only the schedule."""
          hold = parse(props.get("retryNotBefore"))
          return hold is not None and _dt.datetime.now(_dt.timezone.utc) < hold


      def retry_at(resp):
          """When a 429 said to come back, as the instant `retryNotBefore` holds.

          `Retry-After` is RFC 7231 and has TWO forms: delta-seconds and an HTTP
          date. Reading only the first and defaulting the second to "a minute"
          would hammer a limit that asked for an hour. The delta is rounded UP,
          because rounding a 0.4-second delay down lands before the window opens.
          """
          after = (resp.headers.get("Retry-After")
                   or resp.headers.get("retry-after") or "").strip()
          now = _dt.datetime.now(_dt.timezone.utc)
          if after:
              try:
                  secs = int(float(after) + 0.999)
                  return (now + _dt.timedelta(seconds=max(secs, 1))).strftime(
                      "%Y-%m-%dT%H:%M:%SZ")
              except ValueError:
                  pass
              try:
                  from email.utils import parsedate_to_datetime
                  when = parsedate_to_datetime(after)
                  if when is not None:
                      if when.tzinfo is None:
                          when = when.replace(tzinfo=_dt.timezone.utc)
                      return when.astimezone(_dt.timezone.utc).strftime(
                          "%Y-%m-%dT%H:%M:%SZ")
              except (TypeError, ValueError):
                  pass
          # WHOOP's published limit is 100 requests a minute, so a 429 with no
          # header we can read is a minute away, not an unknown.
          return (now + _dt.timedelta(seconds=60)).strftime("%Y-%m-%dT%H:%M:%SZ")


      def rid(host, aid, prefix, key):
          """A row id: host.ids.external("whoop", account, "<prefix>/<WHOOP id>"),
          so a re-read composes the same id and two accounts never collide."""
          return host.ids.external("whoop", aid, prefix + "/" + str(key))


      # ------------------------------------------------------------ guarded writes
      # A mirror row is written under the version it was read at. A body's reads
      # come before its effects commit, and two bodies (a sync and a webhook, two
      # syncs) can read one row and write it in either order: unguarded, the later
      # commit wins whatever its revision, and a write staged over a row since
      # deleted brings it back. Under the version, the engine refuses a write to a
      # row that moved, the delivery fails `conflict`, and its retry reads again.

      def older(incoming, stored):
          """Whether a payload's `updated_at` is before the stored row's. Equal is
          not older: the same revision is written again and the engine drops it."""
          a, b = parse(incoming), parse(stored)
          return a is not None and b is not None and a < b


      def stored_rows(host, kind, rids):
          """{row id: row} for each of `rids` the mirror holds, live or deleted,
          read in two list calls. A row id missing from the answer was never
          written."""
          rids = sorted({r for r in rids if r})
          out = {}
          if not rids:
              return out
          for deleted in (True, False):
              page = host.list(filter={"kinds": [kind], "ids": rids,
                                       "deleted": deleted}, first=len(rids))
              for ent in page.get("records") or []:
                  out[str(ent.get("id") or "")] = ent
          return out


      def write_row(host, kind, rid, props, row):
          """Stage one mirror row under the version `row` was read at, None for a
          row never written. A live row holding a later `updatedAt` is kept and
          nothing is staged (False). A live row is patched; a deleted or absent
          one is put whole, so a restored row keeps nothing the payload omits."""
          live = row is not None and not row.get("deletedAt")
          if live and older(props.get("updatedAt"),
                            (row.get("properties") or {}).get("updatedAt")):
              return False
          if live:
              host.effects.patch(kind, rid, properties=props,
                                 if_version=host.version(row))
          else:
              host.effects.put(kind, rid, properties=props,
                               if_version=host.version(row))
          return True


      # ----------------------------------------------------------- property shapes
      # One rule, everywhere: from an AUTHORITATIVE payload a declared property the
      # response omits is None, which the PATCH writes as a delete; a key carried as
      # null is None too. `mint` is the non-null half, which is what a create may
      # carry.

      def take(dst, src, pairs, authoritative=True):
          """One scalar each, with §1's presence rule.

          An EXPLICIT EMPTY IS A CLEAR, and `""` is never written through: nothing
          WHOOP sends has the empty string as a legal value, and half of these
          properties are `datetime`, which would refuse it and take the whole page
          down with it (§1, and the Slack v2 amendment behind it).
          """
          for api, prop in pairs:
              if api in src:
                  value = src[api]
                  dst[prop] = None if value == "" else value
              elif authoritative:
                  dst[prop] = None
          return dst


      def mint(props):
          return {k: v for k, v in props.items() if v is not None}


      def score_state(props, rec):
          """`score_state` onto the row, by the table the declaration carries (§2).

          A word the table holds is the spelled enum value. A word it does not hold
          leaves the property absent: the enum would refuse it, and losing one
          property beats refusing the page. The key missing from an authoritative
          payload is None, a delete.
          """
          if "score_state" not in rec:
              props["scoreState"] = None
              return
          value = SCORE_STATES.get(str(rec.get("score_state") or "").upper())
          if value is not None:
              props["scoreState"] = value


      def obj(src, pairs):
          """One nested object, written whole or not at all (§1: a patch replaces an
          object value entire). None when WHOOP sent no object: `score` is absent
          unless the record is SCORED, and an empty object is not the same thing."""
          if not isinstance(src, dict):
              return None
          out = take({}, src, pairs, authoritative=False)
          return out or None


      def span(props, rec):
          """`start` and `end` into the temporal trait's slots (§4).

          `end` is absent on the CURRENT cycle, and an authoritative payload's
          absence is a clear: a cycle that comes back open has to lose its `endsAt`.
          `at` is never nulled, because `start` is required on all three kinds that
          bind a range and a record without one is malformed.
          """
          if rec.get("start"):
              props["at"] = rec["start"]
          props["endsAt"] = rec.get("end") or None


      # --------------------------------------------------------- the row mappings
      # Each answers (kind, row id, properties) for one WHOOP v2 object, or raises
      # ValueError for a record that carries no id to key it on. `user_rid` is the
      # member row the record belongs to.

      def cycle_row(host, aid, user_rid, rec):
          cid = rec.get("id")
          if cid in (None, ""):
              raise ValueError("cycle record carries no id")
          props = {"account": aid, "cycleId": int(cid), "user": user_rid}
          span(props, rec)
          take(props, rec, (("timezone_offset", "timezoneOffset"),
                            ("created_at", "createdAt"),
                            ("updated_at", "updatedAt")))
          score_state(props, rec)
          props["score"] = obj(rec.get("score"), CYCLE_SCORE)
          return CYCLE_KIND, rid(host, aid, "cycle", cid), props


      def recovery_row(host, aid, user_rid, rec):
          """A v2 recovery has no id of its own: its row is keyed on the cycle it
          scores, which is how WHOOP addresses it, and keeps that `cycleId` to be
          read back by."""
          cid = rec.get("cycle_id")
          if cid in (None, ""):
              raise ValueError("recovery record carries no cycle_id, and a v2 "
                               "recovery has no id of its own to fall back on")
          sid = rec.get("sleep_id")
          if sid in (None, ""):
              raise ValueError("recovery record carries no sleep_id")
          props = {"account": aid, "user": user_rid, "cycleId": int(cid),
                   "cycle": rid(host, aid, "cycle", cid),
                   "sleep": rid(host, aid, "sleep", sid)}
          # `created_at` is the trait's `at` and is not redeclared.
          if rec.get("created_at"):
              props["at"] = rec["created_at"]
          take(props, rec, (("updated_at", "updatedAt"),))
          score_state(props, rec)
          props["score"] = obj(rec.get("score"), RECOVERY_SCORE)
          props[REFRESH_MARK] = None
          return RECOVERY_KIND, rid(host, aid, "recovery", cid), props


      def sleep_row(host, aid, user_rid, rec):
          sid = rec.get("id")
          if sid in (None, ""):
              raise ValueError("sleep record carries no id")
          cid = rec.get("cycle_id")
          if cid in (None, ""):
              raise ValueError("sleep record carries no cycle_id")
          props = {"account": aid, "sleepId": str(sid), "user": user_rid,
                   "cycle": rid(host, aid, "cycle", cid)}
          span(props, rec)
          take(props, rec, (("v1_id", "v1Id"),
                            ("timezone_offset", "timezoneOffset"),
                            ("nap", "nap"), ("created_at", "createdAt"),
                            ("updated_at", "updatedAt")))
          score_state(props, rec)
          score = obj(rec.get("score"), SLEEP_SCORE) or {}
          raw = rec.get("score") if isinstance(rec.get("score"), dict) else {}
          stages = obj(raw.get("stage_summary"), STAGE_SUMMARY)
          if stages:
              score["stageSummary"] = stages
          needed = obj(raw.get("sleep_needed"), SLEEP_NEEDED)
          if needed:
              score["sleepNeeded"] = needed
          props["score"] = score or None
          props[REFRESH_MARK] = None
          return SLEEP_KIND, rid(host, aid, "sleep", sid), props


      def workout_row(host, aid, user_rid, rec):
          wid = rec.get("id")
          if wid in (None, ""):
              raise ValueError("workout record carries no id")
          props = {"account": aid, "workoutId": str(wid), "user": user_rid}
          span(props, rec)
          take(props, rec, (("v1_id", "v1Id"),
                            ("timezone_offset", "timezoneOffset"),
                            ("sport_name", "sportName"), ("sport_id", "sportId"),
                            ("created_at", "createdAt"),
                            ("updated_at", "updatedAt")))
          score_state(props, rec)
          score = obj(rec.get("score"), WORKOUT_SCORE) or {}
          raw = rec.get("score") if isinstance(rec.get("score"), dict) else {}
          # v2 spells it `zone_durations`; v1 spelled it `zone_duration`. Both are
          # read so a v1-era recording is not silently dropped, and the property
          # takes the API's CURRENT name.
          zones = obj(raw.get("zone_durations") or raw.get("zone_duration"),
                      ZONE_DURATIONS)
          if zones:
              score["zoneDurations"] = zones
          props["score"] = score or None
          props[REFRESH_MARK] = None
          return WORKOUT_KIND, rid(host, aid, "workout", wid), props
---
# ---- the config type: the `client` input's kind ----------------------------
# oauth2 (the OAuth CLIENT credentials the facility uses to exchange codes):
# the WHOOP app the owner registers in the developer dashboard. Endpoints and
# scopes are manifest metadata above; `apiBase` is the one thing the FUNCTION
# reads here.
#
# `apiBase` is not a second copy of the endpoints: the OAuth endpoints live
# under `api.prod.whoop.com/oauth`, the DATA API under
# `api.prod.whoop.com/developer`, and the sync needs the second one nameable
# so a run against a recording server can move it without this body carrying a
# literal it would have to be patched to change.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/whoop/config
data:
  authority: providers.substrate.reamde.dev
  package: whoop
  description: >-
    The WHOOP app settings your account connects through. The WHOOP OAuth
    app this bundle authenticates through — its client id, a sealed client
    secret, and the data API's origin. The record the bundle's client input
    resolves; endpoints and scopes are manifest metadata rather than editable
    rows.
  purpose: internal
  names:
    singular: config
  traits: [substrate.reamde.dev/core/oauth2]
  displayTemplate: "WHOOP app {clientId}"
  properties:
    # ---- identity --------------------------------------------------------
    clientId:
      type: string
      displayName: Client ID
      description: the WHOOP OAuth client id, from developer-dashboard.whoop.com
    # ---- the client's own scalars ----------------------------------------
    clientSecret:
      type: secret
      displayName: Client secret
      description: the WHOOP OAuth client secret — sealed at rest, never read
        back
    apiBase:
      type: url
      default: https://api.prod.whoop.com/developer
      writer: owner
      # The body PINS the origin the access token may travel to: exactly
      # https://api.prod.whoop.com, or a loopback host (127.0.0.1 / localhost /
      # ::1, any scheme) as the test seam. Anything else refuses BEFORE
      # sending — an owner-editable URL must never become an exfiltration
      # channel. This is what lets tools/mockserver.py stand in for WHOOP in
      # the e2e run and in `mnemectl seed-provider whoop`.
      displayName: API base URL
      description: >-
        the origin and prefix the sync reads WHOOP's data API at — the production
        one, or a loopback host for a test. Any other origin refuses to sync.
---
# ---- the account type: one connected WHOOP member ---------------------------
# accountconfig (its records ARE the bundle's connected accounts; the host
# writes tokenRef + tokenStatus + grantedScopes + email over the OAuth
# facility). Every property carries a `writer:` role so only its rightful hand
# may set it.
#
# EVERY CURSOR IN THIS CLOSURE IS HERE (`docs/kind-design.md` §1). WHOOP has no
# sync token: the read window IS the incremental contract, so `syncCursors`
# holds the per-stream floor and the pagination `nextToken` rides in the
# drain's own checkpoint, which is not a record at all. No mirror row carries a
# byte of sync state.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/whoop/account
data:
  authority: providers.substrate.reamde.dev
  package: whoop
  description: >-
    Your WHOOP account, connected here. One connected WHOOP account: these
    records ARE the bundle's connections. The OAuth facility writes the credential
    reference, status, granted scopes and address; the owner chooses which
    collections sync and how often; the sync keeps its cursors and stamps
    here rather than on any mirror.
  purpose: internal
  names:
    singular: account
  # `sync` is the core trait the Connections page, `GET /api/v1/sync/status`
  # and `substratectl sync status` read (substrate decision 0085): the sync
  # body writes its twelve properties beside the ad hoc `syncStatus` /
  # `syncCursors` / `syncFloors` below, and the dispatcher stamps a
  # record-sourced delivery's start, finish and park onto the same record.
  # The two OWNER hands are `syncRequestedAt` ("sync now") and `syncPaused`
  # ("pause"); the other ten are the connector's.
  traits: [substrate.reamde.dev/core/accountconfig, substrate.reamde.dev/core/sync]
  displayTemplate: "{email}"
  properties:
    # ---- identity and the grant (the OAuth facility's) --------------------
    tokenRef:
      type: secret
      writer: oauth
      displayName: Token reference
      description: the credential-store reference the OAuth facility writes;
        never a raw token
    tokenStatus:
      type: string
      writer: oauth
      displayName: Connection status
      description: "the connection state the facility last reported — a growing
        list, not an enum (pending | connected | erroring)"
    grantedScopes:
      type: string
      repeated: true
      writer: oauth
      displayName: Granted scopes
      description: the OAuth scopes the last consent was granted for; drives
        reconnect-on-new-feature
    # Why the facility last failed to refresh the token, and when. The facility
    # writes both beside `tokenStatus: erroring` and clears them on the next good
    # refresh or reconnect.
    tokenError:
      type: string
      writer: oauth
      displayName: Sign-in error
      description: why the OAuth facility last failed to refresh this account's
        token, as the provider's status and error code; empty while it works
    tokenErrorAt:
      type: datetime
      writer: oauth
      displayName: Sign-in error at
      description: when the OAuth facility first recorded the current sign-in
        error
    email:
      type: email
      writer: oauth
      displayName: Email
      description: >-
        the connected member's address, set by the OAuth facility off GET
        /v2/user/profile/basic at the end of the consent
    # ---- who this account is ---------------------------------------------
    # A REFERENCE, not a numeric id: §1 puts the connection's identity on the
    # account as a reference, so "mine" is a reference filter.
    user:
      type: reference
      kind: providers.substrate.reamde.dev/whoop/user
      writer: connector
      displayName: Member
      # Minted from the `user_id` that rides on every record WHOOP returns, so
      # it lands even with the profile toggle off. NOT `mustExist`: the first
      # page of a stream mints the member row and this patch lands after it,
      # but a run that fails before any page should not refuse the stamp.
      description: >-
        the WHOOP member this account authenticates as — "me", and what every
        owner-relative question filters on
    # ---- what the owner asked for ----------------------------------------
    enabledProfile:
      type: bool
      writer: owner
      displayName: Profile
      description: >-
        mirror the member's profile and body measurement — the two sibling
        calls that fill the `user` row
    enabledCycles:
      type: bool
      writer: owner
      displayName: Cycles
      description: mirror the physiological cycles, the days WHOOP scores
        strain over, each from one sleep onset to the next, and the identity
        a recovery hangs off
    enabledRecovery:
      type: bool
      writer: owner
      displayName: Recovery
      description: mirror the recovery scores (recovery percentage, HRV, resting
        heart rate, SpO2, skin temperature)
    enabledSleep:
      type: bool
      writer: owner
      displayName: Sleep
      description: mirror the sleeps — performance, stage summary and how
        much sleep WHOOP said was needed
    enabledWorkouts:
      type: bool
      writer: owner
      displayName: Workouts
      description: mirror the workouts — sport, strain, heart-rate zones and
        distance
    syncFrequency:
      type: enum
      values:
        - value: off
          label: Off
        - value: hourly
          label: "Every hour"
        - value: daily
          label: "Once a day"
      required: true
      default: hourly
      writer: owner
      displayName: Sync frequency
      description: "the scheduled sync cadence for this account (default hourly
        — WHOOP re-scores through the day)"
    backfillDepth:
      type: enum
      values:
        - value: none
          label: "Don't backfill"
        - value: last2d
          label: "Last two days"
        - value: last30d
          label: "Last 30 days"
        - value: last90d
          label: "Last 90 days"
        - value: last1y
          label: "Last year"
        - value: all
          label: Everything
      required: true
      default: last30d
      writer: owner
      displayName: Backfill depth
      description: "how far back the first sync reaches (none = from connect
        time forward; steady-state re-syncs read a short overlap window)"
    # "Sync now", as a GENERATION rather than a moment. The owner stamps
    # `syncRequestedAt`; the sync echoes the value it acted on into
    # `syncRequestedAck`; the `whoop-on-request` trigger fires exactly while
    # the two disagree. Comparing the request against `lastSyncedAt` instead
    # would look simpler and would LOOP forever on a request dated in the
    # future — the sync's own stamp would never overtake it.
    syncRequestedAt:
      type: datetime
      writer: owner
      displayName: Sync requested
      description: stamp this to ask for a sync now, whatever the cadence
        says
    # ---- the sync's own bookkeeping (writer: connector) -------------------
    syncRequestedAck:
      type: datetime
      writer: connector
      displayName: Sync request acknowledged
      description: the `syncRequestedAt` the last sync acted on — equal means
        the request is spent
    syncCursors:
      type: datetime
      keyed: true
      keyPattern: camel
      writer: connector
      # WHOOP has no sync token, so this floor IS the incremental contract.
      # Keyed per stream so one stream stalling never advances another's tail.
      displayName: Sync cursors
      description: >-
        the per-stream incremental floor, keyed by stream (cycle, recovery,
        sleep, workout) — one stalling stream never advances another's tail
    syncFloors:
      type: datetime
      keyed: true
      keyPattern: camel
      writer: connector
      # A COLD WALK'S FLOOR IS PART OF THE CURSOR (`docs/provider-practices.md`
      # §4, which Slack paid for). `backfillDepth: last90d` is `now - 90 days`
      # and `now` moves: a cold walk cut off by a 429 and restarted an hour
      # later would compute a floor an hour later too, and the oldest hour of
      # the window it was walking would never be read by anything. So the
      # floor a stream is walking is banked here the first time it is
      # computed, and cleared the moment that stream drains and has a cursor.
      displayName: Unfinished floors
      description: >-
        the `start` each stream is still walking from, kept while it has no
        cursor yet — so a cold walk that was interrupted resumes the window
        it began, not a newer one
    retryNotBefore:
      type: datetime
      writer: connector
      displayName: Retry not before
      # A 429 says WHEN (`docs/provider-practices.md` §5): WHOOP's published
      # limit is 100 requests a minute and its 429 carries `Retry-After`. The
      # instant lands here and `_due` refuses to start before it, for every
      # call including the profile probe — which used to be treated as a
      # general failure and retried on the next tick.
      description: >-
        when WHOOP said to come back, from a 429's Retry-After — the sync
        refuses to start before it
    lastSyncedAt:
      type: datetime
      writer: connector
      displayName: Last synced
      description: when the last sync ATTEMPT finished (ok or erroring) —
        the cadence anchor and the on-connect trigger's guard
    lastCompletedAt:
      type: datetime
      writer: connector
      # `lastSyncedAt` is the last ATTEMPT; this is the last walk that ran out
      # of work, and only this one is evidence that anything finished
      # (`docs/provider-practices.md` §4).
      displayName: Last completed
      description: when a walk last ran out of work — the only evidence a
        sync finished, as opposed to being attempted
    syncStatus:
      type: string
      writer: connector
      description: "the last sync outcome (ok | ok (N skipped) | ok (M pending)
        | erroring: <reason>)"
      displayName: Sync status
    # ---- the core `sync` trait (substrate decision 0085) ------------------
    # The twelve properties the trait contracts, each redeclared with the
    # writer main's Google bundle uses. THREE OF THEM ARE ALREADY ABOVE and
    # are not repeated here: `syncRequestedAt` (owner), `syncRequestedAck`
    # and `lastSyncedAt` (connector) were this bundle's own bookkeeping
    # before the trait existed and carry exactly the names and datatypes the
    # trait contracts — which is why binding it is additive. `syncStatus`,
    # `syncCursors`, `syncFloors`, `lastCompletedAt` and `retryNotBefore`
    # stay as they are: a reader of the old shape keeps working, and dropping
    # a property a live row holds is a narrowing the upgrade refuses.
    syncPaused:
      type: bool
      writer: owner
      displayName: Paused
      description: >-
        while true the dispatcher skips this account's deliveries and the
        scheduled sweep passes over it — the owner's stop, honoured without
        the body having to know a delivery was refused
    syncState:
      type: string
      writer: connector
      displayName: Sync state
      description: >-
        never | running | ok | erroring | throttled. One function walks the
        four collections as ONE stream, so this is the run's own state; a
        429 is `throttled` and stands until WHOOP's own instant passes
    syncMessage:
      type: string
      writer: connector
      displayName: Sync message
      description: >-
        the one human line the last run left — the same sentence syncStatus
        carries, without its `erroring` prefix
    lastSyncStartedAt:
      type: datetime
      writer: connector
      displayName: Last sync started
      description: >-
        when the last run began. The dispatcher stamps it around a record-sourced
        delivery; on the SCHEDULE path, which names no record, the body stamps
        its own
    lastSyncDurationMs:
      type: int
      writer: connector
      displayName: Last sync duration (ms)
      description: how long that run took, from the same two hands — one invocation
        of a bounded drain, not the whole walk
    syncProgress:
      type: json
      writer: connector
      displayName: Sync progress
      description: >-
        {phase, done, total, pending} off the drain's own bookkeeping — the
        collection being walked, how many of this run's enabled collections
        have drained, and how many are still queued
    syncError:
      type: string
      writer: connector
      displayName: Sync error
      description: the last error text, from the body's own failure path or
        from a parked delivery the dispatcher stamped; a later run that ends
        ok, or a reconnect, clears it and syncErrorAt
    syncErrorAt:
      type: datetime
      writer: connector
      displayName: Sync error at
      description: when syncError was written; cleared with it
    syncStreams:
      type: json
      writer: connector
      displayName: Sync streams
      description: >-
        trait contract — unwritten here: the four collections are one function,
        one queue and one outcome, so the run's state IS the account's and
        syncProgress carries the drain
---
# ---- mirror: the WHOOP member -----------------------------------------------
# ONE kind out of TWO sibling calls. §1: "a field from a sibling call is the
# object's when the call is keyed by the object's identity and returns no
# identity of its own". `GET /v2/user/measurement/body` is exactly that — it is
# addressed by the grant, it carries three numbers and no `user_id` at all, and
# there is nothing in it to key a second kind on. `GET /v2/user/profile/basic`
# is the call that HAS the identity (`user_id`), so it is the one this row is
# keyed from, and the measurement's fields ride on it. Not two kinds, and not
# properties smeared over the account; each property's description names the
# call it came from.
#
# BOTH CALLS ARE AUTHORITATIVE (§1, the write contract): WHOOP documents each
# as returning the whole resource, every field required, so a field one of them
# omits is written NULL rather than left absent — with one exception the sync
# makes and names, an `email` that does not parse, which §2 says is not
# written at all.
#
# THIN THEN WHOLE, the other way round. Every cycle, recovery, sleep and
# workout WHOOP returns carries `user_id`, so the sync mints this row from that
# id alone the first time it meets it — `{account, userId}` and nothing else —
# and the two profile calls PATCH the rest onto it. A row with the profile
# toggle off is a row with a `userId` and no name, which is exactly what WHOOP
# told us.
#
# NO TEMPORAL TRAIT: neither call returns an instant (§4). There is nothing to
# put on a timeline, and a trait fed by the sync's clock would be the sync's
# fact, not WHOOP's.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/whoop/user
data:
  authority: providers.substrate.reamde.dev
  package: whoop
  description: >-
    Your WHOOP profile and body measurements. One WHOOP member, as API v2
    describes them across two sibling calls keyed by their identity: GET /v2/user/profile/basic
    and GET /v2/user/measurement/body. The sync runs BOTH, both are authoritative,
    neither is paged, and WHOOP negotiates no media type (the sync sends Accept:
    application/json). No instant of its own, so no temporal trait.
  purpose: supporting
  names:
    singular: user
  displayTemplate: "{firstName} {lastName}"
  properties:
    # ---- identity ---------------------------------------------------------
    account:
      type: reference
      kind: providers.substrate.reamde.dev/whoop/account
      required: true
      onDelete: cascade
      displayName: Account
      description: the account this member was synced through
    userId:
      type: int
      required: true
      displayName: Member ID
      description: >-
        the profile's `user_id` — WHOOP's numeric id for the member, and the
        id that rides on every cycle, recovery, sleep and workout it returns
    # ---- the profile's own scalars (GET /v2/user/profile/basic) -----------
    email:
      type: email
      displayName: Email
      description: "`email` — the address on the WHOOP account. A value that
        does not parse as a mailbox is not written"
    firstName:
      type: string
      displayName: First name
      description: "`first_name` from GET /v2/user/profile/basic"
    lastName:
      type: string
      displayName: Last name
      description: "`last_name` from GET /v2/user/profile/basic"
    # ---- the body measurement (GET /v2/user/measurement/body) -------------
    heightMeter:
      type: float
      displayName: Height
      description: "`height_meter` from GET /v2/user/measurement/body — metres,
        WHOOP's own unit, unconverted"
    weightKilogram:
      type: float
      displayName: Weight
      description: "`weight_kilogram` from GET /v2/user/measurement/body —
        kilograms, WHOOP's own unit, unconverted"
    maxHeartRate:
      type: int
      displayName: Max heart rate
      description: >-
        `max_heart_rate` from GET /v2/user/measurement/body — the maximum
        heart rate WHOOP computed, which the workout heart-rate zones are
        against
---
# ---- mirror: one physiological cycle ----------------------------------------
# WHOOP's day. A cycle is NOT a calendar day: it runs from one sleep onset to
# the next, so two cycles can start on one UTC date and a cycle can span two. The cycle is the
# identity everything day-shaped in WHOOP hangs off — a recovery scores a
# cycle, not a date, and a sleep names the cycle it belongs to — and it is the
# kind substrate's version 9 did not have, which is why its recovery rows
# carried a `cycleId` STRING that pointed at nothing.
#
# TEMPORAL(RANGE), fed by `start` and `end` (§4): the API's instants land in
# the trait's slots and are NOT redeclared, so there is no `start`/`end`
# property here. The CURRENT cycle has no `end` (WHOOP omits it until the
# next sleep starts a cycle), so `endsAt` is simply absent on it, and a records read
# bounding `at` still finds it.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/whoop/cycle
data:
  authority: providers.substrate.reamde.dev
  package: whoop
  description: >-
    One day on WHOOP, from waking up to waking up, and the strain it scored.
    A WHOOP physiological cycle. The SYNC reads GET /v2/cycle, paged and authoritative,
    and nothing else; GET /v2/cycle/{id} returns the same resource and is
    not called. `at` is the cycle's `start` and `endsAt` its `end`; the CURRENT
    cycle has no `end` and so no `endsAt`. The paging envelope is the one
    omitted class.
  purpose: supporting
  names:
    singular: cycle
  traits:
    - substrate.reamde.dev/core/temporal(range)
  displayTemplate: "Cycle {cycleId}"
  properties:
    # ---- identity ---------------------------------------------------------
    account:
      type: reference
      kind: providers.substrate.reamde.dev/whoop/account
      required: true
      onDelete: cascade
      displayName: Account
      description: the account this cycle was synced through
    cycleId:
      type: int
      required: true
      displayName: Cycle ID
      description: >-
        the cycle's `id` — WHOOP's numeric id for the cycle, the key a recovery
        and a sleep name it by, and the one v2 id that stayed numeric
    # ---- the object's own scalars, in the v2 Cycle schema's order ---------
    timezoneOffset:
      type: string
      # A `string` and NOT a `timezone`: a UTC OFFSET is not an IANA zone name
      # — it cannot say which zone — and §2 admits only IANA names as
      # `timezone`. The same holds on `sleep` and `workout`.
      displayName: Time zone offset
      description: >-
        `timezone_offset` — the member's UTC offset at the cycle's start,
        as a Time Zone Designator (`+01:00`, `-05:00`, `Z`)
    scoreState:
      type: enum
      values:
        - value: scored
          label: SCORED
        - value: pendingscore
          label: PENDING_SCORE
        - value: unscorable
          label: UNSCORABLE
      # The v2 schema CLOSES this set at three values, so it is an enum and not
      # a string. The loader admits only `[a-z][a-z0-9]*`, so each value is the
      # API's word lowercased with `_` dropped, and the API's exact spelling is
      # the value's `label` — the mapping is on the declaration, and the sync
      # carries the same table rather than a regex (§2).
      displayName: Score state
      description: >-
        `score_state` — whether WHOOP has scored this cycle; `score` is present
        only on `SCORED`
    # ---- the score object -------------------------------------------------
    score:
      type: object
      displayName: Score
      description: >-
        `score` — the cycle's strain and cardiovascular load. ABSENT unless
        `scoreState` is `scored`; WHOOP omits the whole object rather than
        sending it empty
      fields:
        strain:
          type: float
          description: "`strain` — WHOOP's 0–21 logarithmic day strain"
        kilojoule:
          type: float
          description: >-
            `kilojoule` — the energy expended over the cycle, in kilojoules.
            WHOOP's own unit; kcal is the reader's multiplication, not a second
            property here
        averageHeartRate:
          type: int
          description: "`average_heart_rate` — mean heart rate over the cycle,
            in beats per minute"
        maxHeartRate:
          type: int
          description: "`max_heart_rate` — peak heart rate over the cycle,
            in beats per minute"
    # ---- relations --------------------------------------------------------
    user:
      type: reference
      kind: providers.substrate.reamde.dev/whoop/user
      required: true
      displayName: Member
      description: "`user_id` — the member whose cycle this is, as a reference;
        WHOOP sends it on every record"
    # ---- instants (`start`/`end` are the trait's and are not redeclared) ---
    createdAt:
      type: datetime
      displayName: Created
      description: "`created_at` — when WHOOP first recorded the cycle"
    updatedAt:
      type: datetime
      displayName: Updated
      description: >-
        `updated_at` — when WHOOP last touched it. A MUTATION MARK: it moves
        when a cycle is re-scored as data settles, which is what the overlap
        window exists for, and it binds no trait
---
# ---- mirror: one recovery score ---------------------------------------------
# THE ONE KIND WITH NO ID OF ITS OWN. A v2 recovery carries no `id`: WHOOP
# identifies it by the cycle it scores — `GET /v2/cycle/{cycleId}/recovery` is
# literally how it is addressed — and re-scores that cycle as the data settles.
# So the identity of this row IS its `cycle` reference, the row id is composed
# from the cycle id, and a re-sync converges on the same row (§3: the key is
# the upstream's stable identity).
#
# TEMPORAL(POINT), fed by `created_at` — an instant of its own, the moment
# WHOOP recorded the verdict — so `createdAt` is NOT declared beside it. A
# recovery has no range: it is a verdict on a cycle, and the cycle carries the
# span.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/whoop/recovery
data:
  authority: providers.substrate.reamde.dev
  package: whoop
  description: >-
    How well you recovered on one WHOOP day. One WHOOP recovery — the verdict
    on a physiological cycle. The SYNC reads GET /v2/recovery, paged and authoritative;
    GET /v2/cycle/{id}/recovery returns the same resource and is not called.
    It has no id of its own, so this row's identity is its `cycle` reference
    and a re-score converges on the same row. `at` is `created_at`; the paging
    envelope is omitted.
  names:
    singular: recovery
  traits:
    - substrate.reamde.dev/core/temporal(point)
  displayTemplate: "Recovery {score.recoveryScore}"
  properties:
    # ---- identity ---------------------------------------------------------
    account:
      type: reference
      kind: providers.substrate.reamde.dev/whoop/account
      required: true
      onDelete: cascade
      displayName: Account
      description: the account this recovery was synced through
    cycle:
      type: reference
      kind: providers.substrate.reamde.dev/whoop/cycle
      required: true
      # A reference and not a bare id (§2). `required` because the v2 schema
      # makes `cycle_id` required on every Recovery. NO `mustExist`: the cycle
      # row may land in a later page, or — with the cycles toggle off — never.
      displayName: Cycle
      description: >-
        `cycle_id` — the physiological cycle this recovery scores, and THIS
        ROW'S IDENTITY, because a v2 recovery has no id of its own
    cycleId:
      type: int
      displayName: Cycle ID
      # The id the sync reads this recovery back by. The `cycle` reference
      # names a row id composed from it, which cannot be read backwards, and
      # with the cycles toggle off the cycle row never exists.
      description: >-
        `cycle_id` as WHOOP sends it, the number GET /v2/cycle/{cycleId}/recovery
        reads this recovery back by
    # ---- the object's own scalars, in the v2 Recovery schema's order ------
    scoreState:
      type: enum
      values:
        - value: scored
          label: SCORED
        - value: pendingscore
          label: PENDING_SCORE
        - value: unscorable
          label: UNSCORABLE
      displayName: Score state
      description: >-
        `score_state` — whether WHOOP scored this recovery. `UNSCORABLE` is
        the real case here: a night the strap was off scores nothing
    # ---- the score object -------------------------------------------------
    score:
      type: object
      displayName: Score
      description: >-
        `score` — the recovery's physiological readings. ABSENT unless `scoreState`
        is `scored`
      fields:
        userCalibrating:
          type: bool
          # WHOOP's own fact about the member, not a judgement this mirror
          # makes; while true the recovery score is WHOOP's provisional one.
          description: >-
            `user_calibrating` — whether WHOOP is still establishing this
            member's baseline
        recoveryScore:
          type: float
          description: "`recovery_score` — the 0–100 percentage that reflects
            how prepared the body is to take on strain"
        restingHeartRate:
          type: float
          description: "`resting_heart_rate` — the cycle's resting heart rate,
            in beats per minute"
        hrvRmssdMilli:
          type: float
          description: >-
            `hrv_rmssd_milli` — heart-rate variability as RMSSD, in milliseconds.
            WHOOP's name kept: `hrvMs` would hide WHICH HRV statistic this
            is, and RMSSD is not the only one
        spo2Percentage:
          type: float
          description: >-
            `spo2_percentage` — blood oxygen saturation. Absent on hardware
            that does not measure it (WHOOP 3.0 and earlier)
        skinTempCelsius:
          type: float
          description: >-
            `skin_temp_celsius` — skin temperature in Celsius. Absent on hardware
            that does not measure it
    # ---- relations --------------------------------------------------------
    sleep:
      type: reference
      kind: providers.substrate.reamde.dev/whoop/sleep
      required: true
      displayName: Sleep
      # `required` because v2 makes `sleep_id` required on every Recovery. No
      # `mustExist`: the sleep row may land in a later page of a different
      # stream, or never, with the sleep toggle off.
      description: >-
        `sleep_id` — the sleep this recovery was computed from, as a reference
        at the v2 sleep row (a UUID in v2, not the v1 number)
    user:
      type: reference
      kind: providers.substrate.reamde.dev/whoop/user
      required: true
      displayName: Member
      description: "`user_id` — the member this recovery belongs to"
    # ---- instants (`created_at` is the trait's `at`, not redeclared) -------
    updatedAt:
      type: datetime
      displayName: Updated
      description: >-
        `updated_at` — when WHOOP last re-scored this recovery. A MUTATION
        MARK: it moves hours after `created_at` as the night's data settles,
        which is why the window reaches behind the last sync
    # ---- sync bookkeeping ---------------------------------------------------
    # Not WHOOP's: set by `whoopwebhook` when it could not read the object
    # back, cleared by every write of the object from WHOOP.
    refreshRequestedAt:
      type: datetime
      displayName: Refresh requested
      description: >-
        when a WHOOP webhook named this recovery and could not read it back
        (WHOOP asked to wait, failed, or the account had no live token). The
        next sync reads it back by id and clears this
---
# ---- mirror: one sleep ------------------------------------------------------
# NAPS AND NIGHTS ARE ONE KIND, because WHOOP gives them one identity and one
# shape: `nap` is a flag on the record, not a different resource. Splitting
# them would invent a distinction the API does not make.
#
# TWO UPSTREAM IDENTITIES (§3). v2's `id` is a UUID and `v1_id` is the number
# the v1 API used; both are declared, and the key is the UUID, which is the id
# the resource's own endpoint (`GET /v2/activity/sleep/{sleepId}`) reports.
# `v1_id` is documented as disappearing after 09/01/2025, so it is absent on a
# newer record rather than null.
#
# TEMPORAL(RANGE), fed by `start` and `end`, so neither is redeclared. The
# score's two sub-objects are declared, not `json`: `stage_summary` and
# `sleep_needed` are flat objects of integers, and `score.stageSummary.<field>`
# is three levels, inside the four §1 admits.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/whoop/sleep
data:
  authority: providers.substrate.reamde.dev
  package: whoop
  description: >-
    A night's sleep or a nap, as WHOOP recorded it. One WHOOP sleep — a night
    or a nap; WHOOP gives both one identity and one shape and tells them apart
    with `nap`. The SYNC reads GET /v2/activity/sleep, paged and authoritative;
    the per-id and per-cycle calls return the same resource and are not called.
    `at` is the sleep's `start` and `endsAt` its `end`. The paging envelope
    is the one omitted class.
  names:
    singular: sleep
  traits:
    - substrate.reamde.dev/core/temporal(range)
  displayTemplate: "Sleep {at}"
  properties:
    # ---- identity ---------------------------------------------------------
    account:
      type: reference
      kind: providers.substrate.reamde.dev/whoop/account
      required: true
      onDelete: cascade
      displayName: Account
      description: the account this sleep was synced through
    sleepId:
      type: string
      required: true
      displayName: Sleep ID
      description: >-
        the sleep's `id` — a UUID in v2, and the identity this row is keyed
        on because it is what the sleep's own endpoint reports
    v1Id:
      type: int
      displayName: v1 ID
      description: >-
        `v1_id` — the number the retired v1 API used for this sleep. WHOOP
        documents it as not existing past 09/01/2025, so it is absent on a
        newer record rather than null
    # ---- the object's own scalars, in the v2 Sleep schema's order ---------
    timezoneOffset:
      type: string
      displayName: Time zone offset
      description: >-
        `timezone_offset` — the member's UTC offset at the sleep's start,
        as a Time Zone Designator (`+01:00`, `Z`). A string, not a `timezone`
    nap:
      type: bool
      displayName: Nap
      description: "`nap` — whether WHOOP classified this sleep as a nap rather
        than the main sleep of the cycle"
    scoreState:
      type: enum
      values:
        - value: scored
          label: SCORED
        - value: pendingscore
          label: PENDING_SCORE
        - value: unscorable
          label: UNSCORABLE
      displayName: Score state
      description: "`score_state` — whether WHOOP scored this sleep; `score`
        is present only on `SCORED`"
    # ---- the score object -------------------------------------------------
    score:
      type: object
      displayName: Score
      description: >-
        `score` — everything WHOOP computed about this sleep. ABSENT unless
        `scoreState` is `scored`
      fields:
        stageSummary:
          type: object
          description: >-
            `stage_summary` — how the sleep divided into stages, every duration
            in milliseconds. Declared, not summed: WHOOP publishes no "total
            asleep" and computing one here would be a derived property
          fields:
            totalInBedTimeMilli:
              type: int
              description: "`total_in_bed_time_milli` — time in bed, in milliseconds"
            totalAwakeTimeMilli:
              type: int
              description: "`total_awake_time_milli` — time awake in bed,
                in milliseconds"
            totalNoDataTimeMilli:
              type: int
              description: "`total_no_data_time_milli` — time WHOOP received
                no data from the strap, in milliseconds"
            totalLightSleepTimeMilli:
              type: int
              description: "`total_light_sleep_time_milli` — light sleep,
                in milliseconds"
            totalSlowWaveSleepTimeMilli:
              type: int
              description: "`total_slow_wave_sleep_time_milli` — slow-wave
                (deep) sleep; WHOOP's name kept over `deep`"
            totalRemSleepTimeMilli:
              type: int
              description: "`total_rem_sleep_time_milli` — REM sleep, in milliseconds"
            sleepCycleCount:
              type: int
              description: >-
                `sleep_cycle_count` — how many sleep cycles WHOOP counted.
                NOT physiological cycles: WHOOP uses the one word for both
            disturbanceCount:
              type: int
              description: "`disturbance_count` — how many times the sleep
                was disturbed"
        sleepNeeded:
          type: object
          description: >-
            `sleep_needed` — how much sleep WHOOP said was needed before this
            sleep, broken into the four terms that sum to it, every one in
            milliseconds
          fields:
            baselineMilli:
              type: int
              description: "`baseline_milli` — the need from the member's
                historical trend"
            needFromSleepDebtMilli:
              type: int
              description: "`need_from_sleep_debt_milli` — the extra owed
                to accumulated sleep debt"
            needFromRecentStrainMilli:
              type: int
              description: "`need_from_recent_strain_milli` — the extra owed
                to recent strain"
            needFromRecentNapMilli:
              type: int
              description: >-
                `need_from_recent_nap_milli` — the credit for a recent nap.
                WHOOP sends this NEGATIVE or zero; it is part of the sum,
                not an amount to subtract again
        respiratoryRate:
          type: float
          description: "`respiratory_rate` — breaths per minute over the sleep"
        sleepPerformancePercentage:
          type: float
          description: >-
            `sleep_performance_percentage` — time asleep over sleep needed,
            0–100. Absent when WHOOP has too little data to compute the need
        sleepConsistencyPercentage:
          type: float
          description: >-
            `sleep_consistency_percentage` — how closely this sleep's timing
            matched the previous day's, 0–100. Absent with too few nights
            to compare
        sleepEfficiencyPercentage:
          type: float
          description: "`sleep_efficiency_percentage` — time asleep over time
            in bed, 0–100"
    # ---- relations --------------------------------------------------------
    cycle:
      type: reference
      kind: providers.substrate.reamde.dev/whoop/cycle
      required: true
      # v2's addition, and the reason this is a reference rather than a join
      # the reader computes: WHOOP states it. `required` because the schema
      # makes `cycle_id` required; no `mustExist` for the same reason as
      # `recovery.cycle`.
      displayName: Cycle
      description: "`cycle_id` — the physiological cycle this sleep belongs
        to, which v2 states on the record"
    user:
      type: reference
      kind: providers.substrate.reamde.dev/whoop/user
      required: true
      displayName: Member
      description: "`user_id` — the member who slept"
    # ---- instants (`start`/`end` are the trait's and are not redeclared) ---
    createdAt:
      type: datetime
      displayName: Created
      description: "`created_at` — when WHOOP first recorded the sleep"
    updatedAt:
      type: datetime
      displayName: Updated
      description: "`updated_at` — when WHOOP last re-scored it. A MUTATION
        MARK, which is why it binds no trait"
    # ---- sync bookkeeping ---------------------------------------------------
    # Not WHOOP's: set by `whoopwebhook` when it could not read the object
    # back, cleared by every write of the object from WHOOP.
    refreshRequestedAt:
      type: datetime
      displayName: Refresh requested
      description: >-
        when a WHOOP webhook named this sleep and could not read it back (WHOOP
        asked to wait, failed, or the account had no live token). The next
        sync reads it back by id and clears this
---
# ---- mirror: one workout ----------------------------------------------------
# TWO UPSTREAM IDENTITIES again (§3): v2's UUID `id` and the v1 number as
# `v1_id`, keyed on the UUID.
#
# TEMPORAL(RANGE), fed by `start` and `end`, so neither is redeclared.
#
# `sportName` IS A `string`, `sportId` IS AN `int`, AND THERE IS NO `sport`
# KIND. See the ruling at the top of this file: a WHOOP sport is a bare name
# and a bare (deprecated) integer with no endpoint of its own, appearing in one
# kind's payload, so it fails both halves of §3's two-part test; and v2 types
# `sport_name` as a plain `string` with no enumeration while WHOOP keeps
# appending sports, so closing it as an enum would refuse the whole page the
# day one is added. Both are the API's own fields and both are declared — the
# NAME is not looked up from the id here, which would be a derived property.
#
# NO CYCLE REFERENCE. v2 states none on a workout, and the overlap of a workout
# with a cycle's span is a join the reader computes from the two `at`/`endsAt`
# ranges — never a link this mirror invents.
kind: substrate.reamde.dev/core/kind
metadata:
  id: providers.substrate.reamde.dev/whoop/workout
data:
  authority: providers.substrate.reamde.dev
  package: whoop
  description: >-
    A workout WHOOP recorded. One WHOOP workout — a recorded activity. The
    SYNC reads GET /v2/activity/workout, paged and authoritative; GET /v2/activity/workout/{id}
    returns the same resource and is not called. `at` is the workout's `start`
    and `endsAt` its `end`. The paging envelope is the one omitted class;
    v2 publishes no hypermedia.
  names:
    singular: workout
  traits:
    - substrate.reamde.dev/core/temporal(range)
  displayTemplate: "{sportName}"
  properties:
    # ---- identity ---------------------------------------------------------
    account:
      type: reference
      kind: providers.substrate.reamde.dev/whoop/account
      required: true
      onDelete: cascade
      displayName: Account
      description: the account this workout was synced through
    workoutId:
      type: string
      required: true
      displayName: Workout ID
      description: >-
        the workout's `id` — a UUID in v2, and the identity this row is keyed
        on because it is what the workout's own endpoint reports
    v1Id:
      type: int
      displayName: v1 ID
      description: >-
        `v1_id` — the number the retired v1 API used for this workout. WHOOP
        documents it as not existing past 09/01/2025, so it is absent on a
        newer record rather than null
    # ---- the object's own scalars, in the v2 Workout schema's order -------
    timezoneOffset:
      type: string
      displayName: Time zone offset
      description: >-
        `timezone_offset` — the member's UTC offset at the workout's start,
        as a Time Zone Designator (`+01:00`, `Z`). A string, not a `timezone`
    sportName:
      type: string
      # THE KNOWN VALUES, which do not fit in a 200-character description and
      # so live here, in the manifest, beside the declaration (§5). WHOOP's
      # published sports, lowercase as the API spells them:
      #
      #   activity, running, cycling, baseball, basketball, rowing, fencing,
      #   field hockey, football, golf, ice hockey, lacrosse, rugby, sailing,
      #   skiing, soccer, softball, squash, swimming, tennis, track & field,
      #   volleyball, water polo, wrestling, boxing, dance, pilates, yoga,
      #   weightlifting, cross country skiing, functional fitness, duathlon,
      #   gymnastics, hiking/rucking, horseback riding, kayaking, martial arts,
      #   mountain biking, powerlifting, rock climbing, paddleboarding,
      #   triathlon, walking, surfing, elliptical, stairmaster, meditation,
      #   other, diving, operations - tactical, operations - medical,
      #   operations - flying, operations - water, ultimate, climber,
      #   jumping rope, australian football, skateboarding, coaching,
      #   ice bath, commuting, gaming, snowboarding, motocross, caddying,
      #   obstacle course racing, motor racing, hiit, spin, jiu jitsu,
      #   manual labor, cricket, pickleball, inline skating, box fitness,
      #   spikeball, wheelchair pushing, paddle tennis, barre,
      #   stage performance, high stress work, parkour, gaelic football,
      #   hurling/camogie, circus arts, massage therapy, strength trainer,
      #   watching sports, assault bike, kickboxing, stretching, table tennis,
      #   badminton, netball, sauna, disc golf, yard work, air compression,
      #   percussive massage, paintball, ice skating, handball, f45 training,
      #   padel, barry's, dedicated parenting, stroller walking,
      #   stroller jogging, toddlerwearing, babywearing, barre3, hot yoga,
      #   stadium steps, polo, musical performance, kite boarding,
      #   dog walking, water skiing, wakeboarding, cooking, cleaning,
      #   public speaking
      #
      # A `string` and not an `enum`: v2's schema types it `string` with no
      # enumeration, and the list above has grown repeatedly — an enum would
      # refuse the whole page the day WHOOP adds one (§2).
      displayName: Sport
      description: >-
        `sport_name` — WHOOP's name for the activity. A growing list, not
        a closed set; the published names are in the manifest beside this
        declaration
    sportId:
      type: int
      displayName: Sport ID
      description: >-
        `sport_id` — WHOOP's numeric id for the same sport. Documented as
        not existing past 09/01/2025, so it is absent on a newer record rather
        than null
    scoreState:
      type: enum
      values:
        - value: scored
          label: SCORED
        - value: pendingscore
          label: PENDING_SCORE
        - value: unscorable
          label: UNSCORABLE
      displayName: Score state
      description: "`score_state` — whether WHOOP scored this workout; `score`
        is present only on `SCORED`"
    # ---- the score object -------------------------------------------------
    score:
      type: object
      displayName: Score
      description: >-
        `score` — everything WHOOP computed about this workout. ABSENT unless
        `scoreState` is `scored`
      fields:
        strain:
          type: float
          description: "`strain` — WHOOP's 0–21 logarithmic strain for the
            activity"
        averageHeartRate:
          type: int
          description: "`average_heart_rate` — mean heart rate, in beats per
            minute"
        maxHeartRate:
          type: int
          description: "`max_heart_rate` — peak heart rate, in beats per minute"
        kilojoule:
          type: float
          description: >-
            `kilojoule` — energy expended, in kilojoules. WHOOP's own unit;
            kcal is the reader's multiplication, not a second property
        percentRecorded:
          type: float
          description: >-
            `percent_recorded` — how much heart-rate data WHOOP received,
            0–100. A low value is why a strain can read lower than it felt
        distanceMeter:
          type: float
          description: "`distance_meter` — distance travelled, in metres.
            Present only if distance data reached WHOOP"
        altitudeGainMeter:
          type: float
          description: >-
            `altitude_gain_meter` — altitude CLIMBED, in metres; a climb and
            descent of 1,000 m reads 1,000. Present only with altitude data
        altitudeChangeMeter:
          type: float
          description: >-
            `altitude_change_meter` — the altitude difference between start
            and end, in metres; negative for a net descent
        zoneDurations:
          type: object
          # v2 renames v1's `zone_duration` to `zone_durations`; the property
          # takes the API's CURRENT name and the sync reads either spelling so
          # a v1-era recording is not silently dropped.
          description: >-
            `zone_durations` — how long was spent in each heart-rate zone,
            in milliseconds, against the member's `maxHeartRate`
          fields:
            zoneZeroMilli:
              type: int
              description: "`zone_zero_milli` — zone 0, very light activity,
                in milliseconds"
            zoneOneMilli:
              type: int
              description: "`zone_one_milli` — zone 1, light activity, in
                milliseconds"
            zoneTwoMilli:
              type: int
              description: "`zone_two_milli` — zone 2, moderate activity,
                in milliseconds"
            zoneThreeMilli:
              type: int
              description: "`zone_three_milli` — zone 3, hard activity, in
                milliseconds"
            zoneFourMilli:
              type: int
              description: "`zone_four_milli` — zone 4, very hard activity,
                in milliseconds"
            zoneFiveMilli:
              type: int
              description: "`zone_five_milli` — zone 5, maximum effort, in
                milliseconds"
    # ---- relations --------------------------------------------------------
    user:
      type: reference
      kind: providers.substrate.reamde.dev/whoop/user
      required: true
      displayName: Member
      description: "`user_id` — the member who did the workout"
    # ---- instants (`start`/`end` are the trait's and are not redeclared) ---
    createdAt:
      type: datetime
      displayName: Created
      description: "`created_at` — when WHOOP first recorded the workout"
    updatedAt:
      type: datetime
      displayName: Updated
      description: "`updated_at` — when WHOOP last re-scored it. A MUTATION
        MARK, which is why it binds no trait"
    # ---- sync bookkeeping ---------------------------------------------------
    # Not WHOOP's: set by `whoopwebhook` when it could not read the object
    # back, cleared by every write of the object from WHOOP.
    refreshRequestedAt:
      type: datetime
      displayName: Refresh requested
      description: >-
        when a WHOOP webhook named this workout and could not read it back
        (WHOOP asked to wait, failed, or the account had no live token). The
        next sync reads it back by id and clears this
---
# ---- the sync function: one WHOOP page per invocation -----------------------
# A PEP 723 Python body (requests through uv). It reads the account's
# host-resolved OAuth access token off the injected bundle config, pages each
# ENABLED v2 stream over WHOOP's `nextToken`, and upserts one mirror row per
# record by composed id — plain puts, so a re-sync converges. A deep backfill
# drains OFF THE CAUSAL CHAIN through the paged-checkpoint `more`/`resume`
# contract: one page per invocation, at constant causal depth.
#
#   profile   GET /v2/user/profile/basic        the member row, and account.user
#   body      GET /v2/user/measurement/body     height, weight, max heart rate
#   cycle     GET /v2/cycle                     paged on nextToken
#   recovery  GET /v2/recovery                  paged on nextToken
#   sleep     GET /v2/activity/sleep            paged on nextToken
#   workout   GET /v2/activity/workout          paged on nextToken
#
# THE REFERENCED ROW IS ALWAYS WRITTEN FIRST. Every record carries `user_id`,
# so a page's effects open with one thin `user` put per distinct id it saw, and
# every row that references that member follows in the same batch.
#
# Per-record failure tolerance: WHOOP records are independent, so a malformed
# one is SKIPPED and COUNTED and the page keeps draining. Per-ACCOUNT
# isolation: a page-level provider failure (a 401 on a revoked grant, a 5xx, a
# dead network) stamps THAT account's syncStatus and the queue moves on.
#
# Deletions: WHOOP's collections carry no tombstone, so a stream that walks its
# steady-state window reads back by id every row the mirror holds in that
# window and the walk did not meet, and a 404 deletes the row.
kind: substrate.reamde.dev/core/function
metadata:
  id: providers.substrate.reamde.dev/whoop/whoopsync
data:
  authority: providers.substrate.reamde.dev
  package: whoop
  description: >-
    Sync a WHOOP account: mirror the member, their physiological cycles, the
    recovery for each one, their sleeps and their workouts, every relation
    a reference — one page per invocation, never writing back to WHOOP.
  runtime: python
  timeout: PT60S
  permissions:
    # The stored `updatedAt` of the rows a page names, the rows a drained
    # stream's window holds, and a recovery's cycle row for the id it is read
    # back by.
    reads:
      kinds:
        - providers.substrate.reamde.dev/whoop/cycle
        - providers.substrate.reamde.dev/whoop/recovery
        - providers.substrate.reamde.dev/whoop/sleep
        - providers.substrate.reamde.dev/whoop/workout
      budgets:
        calls: 200
        rows: 2000
    writes:
      - providers.substrate.reamde.dev/whoop/user
      - providers.substrate.reamde.dev/whoop/cycle
      - providers.substrate.reamde.dev/whoop/recovery
      - providers.substrate.reamde.dev/whoop/sleep
      - providers.substrate.reamde.dev/whoop/workout
      - providers.substrate.reamde.dev/whoop/account
    network:
      - "api.prod.whoop.com"
      - "127.0.0.1"
      - "localhost"
  source: |
    # /// script
    # requires-python = ">=3.11"
    # dependencies = [
    #   "requests==2.34.2",
    # ]
    # ///
    """WHOOP sync — one page of one v2 stream per invocation, mirrors only.

    The account's live access token arrives injected on the bundle config
    (`config.accounts[].token`, host-resolved); the API base arrives on the client
    input (`config.inputs.client.properties.apiBase`) and defaults to
    https://api.prod.whoop.com/developer. This body never sees a client secret, a
    refresh token or a credential ref, and it refuses to send the bearer anywhere
    but https://api.prod.whoop.com or loopback.

    THE MIRROR IS THE API OBJECT, WHOLE (`docs/kind-design.md` v4). Every field of
    every v2 resource is written to its own typed property; nothing is computed
    here and nothing is converted. The three things substrate's version 9 of this
    body derived — a calendar `date` off `created_at`, `calories` from
    `kilojoule * 0.239006`, and an `asleepMs` sum WHOOP does not publish — are all
    gone, and so is the `raw` blob that sat beside them.

    AUTHORITATIVE PAYLOADS. WHOOP documents every collection response as the whole
    resource (its schema marks the fields required), so a declared property a
    record omits is written NULL rather than left absent — §1's write contract.
    That is what makes a cycle that loses its `end`, or a workout whose deprecated
    `sport_id` stops being sent, converge rather than keep a stale value. Each row
    is still MINTED then PATCHED (`put(if_absent=True)` with the non-null half,
    then `patch` with the whole of it), which is the one shape that is correct
    whatever a put does to properties it was not given.

    THE WINDOW IS THE INCREMENTAL CONTRACT. WHOOP has no sync token: a stream is
    re-read from a floor. The floor is the stream's OWN cursor less a 48-hour
    overlap — WHOOP re-scores a cycle, a recovery and a sleep for hours after the
    record first appears — and it is pinned in the drain's checkpoint so every page
    of one stream reads the same interval. `end` is NOT sent: WHOOP defaults it to
    now, which is what a sync reading up to the present wants, and omitting it
    keeps one more clock reading out of the request (and out of the recording name
    a replay has to match).

    REFERENCES ARE WRITTEN IN ORDER. Every WHOOP record carries `user_id`, so a
    page's effects open with one thin `user` put per distinct member id the page
    named, and every row referencing that member follows in the same batch.

    FAILURES, PERMANENT AND TRANSIENT (`docs/provider-practices.md` §5). A 401, a
    403 and any other 4xx that is not 408/429 is PERMANENT: it is recorded once and
    the stream is abandoned for this run, because asking again cannot change the
    answer. A 429 says WHEN — `Retry-After` lands on `account.retryNotBefore` and
    `_due` refuses to start before it. A 5xx or a transport error is transient and
    the schedule's next tick retries it. A malformed RECORD is skipped and counted;
    records are independent and one of them must never cost the page.

    REVISIONS AND DELETIONS. `updated_at` is the only revision WHOOP gives an
    object: a payload older than the stored row's `updatedAt` is not written over
    it (a page read before a webhook rewrote the row), and an equal one is
    written and dropped by the engine as unchanged, so re-reading a page changes
    nothing. Every mirror write is staged under the version of the row it was
    compared with (`whoop_mirror.write_row`): a row another run or a webhook
    delivery wrote or deleted after this invocation read it fails the delivery
    `conflict`, and the retry
    reads it again. A first page's conflict is retried at once; a later page's
    parks the drain with its checkpoint, and the next scheduled fire starts over
    from the cursors this run never advanced. A page record whose row the
    mirror holds DELETED is not written from the page, which may predate the
    deletion: the row is read first, then the object by id, and only an
    object WHOOP still has is written, under the tombstone's version.

    A deleted object simply stops appearing in its collection. A stream that had
    a cursor when the run began walks a window of two or three days, so once its
    pages run out, every row the mirror holds in that window and the walk did
    not meet is read back by id, SCAN_PAGE rows of the window at a time, each
    read under the row's version as it stands then: a 404 deletes the row, and
    an object WHOOP still has is written like any page record. Both are staged
    under that version, so a row another run wrote since fails the delivery
    `conflict` rather than being deleted or overwritten. THE STREAM'S CURSOR
    MOVES ONLY ONCE EVERY READ-BACK HAS ITS ANSWER. A 429 or a transport error
    part-way leaves the cursor where it was, so the next run walks the same
    window and reads the rest back. Any other refusal (a 401, a 403) says
    nothing about whether the object is gone: it is recorded, the stream's
    read-backs stop for this run, and its cursor stays where it was too. A
    cold walk reconciles nothing; the webhook function covers deletions older
    than the window.

    RECOVERIES FROM BEFORE VERSION 21 carry no `cycleId`, and with cycles off
    nothing else says how to read one back or what id its health records take.
    While one is left, the recovery stream's floor reaches back
    LEGACY_MARGIN_DAYS before the oldest of them, so the walk rewrites each with
    its `cycleId`, and one the walk does not meet is no longer in WHOOP's
    collection and is deleted, under the version the scan read it at.
    """
    import datetime as _dt
    from urllib.parse import quote as _quote

    import requests

    # The bundle's shared module (`modules:` on the bundle document): the row
    # mapping, the origin pin and the 429 hold `whoopwebhook` uses too.
    from whoop_mirror import (ACCOUNT_KIND, CYCLE_KIND, RECOVERY_KIND, SLEEP_KIND,
                              USER_KIND, WORKOUT_KIND, cycle_row, recovery_row,
                              sleep_row, workout_row)
    from whoop_mirror import REFRESH_MARK
    from whoop_mirror import api_base as _api_base
    from whoop_mirror import check_origin as _check_origin
    from whoop_mirror import held as _held
    from whoop_mirror import mint as _mint
    from whoop_mirror import parse as _parse
    from whoop_mirror import retry_at as _retry_at
    from whoop_mirror import rid as _rid
    from whoop_mirror import stored_rows as _stored_rows
    from whoop_mirror import take as _take
    from whoop_mirror import write_row as _write_row

    # WHOOP caps a page at 25 and defaults to 10. It is a request parameter, so it
    # is part of the recording name the mock's exact lookup builds — and it is one
    # of `mockserver.PAGINATION_PARAMS`, which is why a recording captured at this
    # limit still answers a replay whatever the floor is.
    PAGE_LIMIT = 25
    # The invocation's wall-clock budget. The function's deadline is PT60S and
    # `requests` times out per request, so a stream is checkpointed before the
    # runner can kill it mid-page.
    BUDGET_SECONDS = 40.0

    # (cursor key, account toggle, API path) — the per-account stream order.
    # `cycle` leads deliberately: a recovery and a sleep both reference a cycle, so
    # the referenced rows are on disk before the rows that name them whenever both
    # toggles are on.
    STREAMS = (
        ("cycle", "enabledCycles", "/v2/cycle"),
        ("recovery", "enabledRecovery", "/v2/recovery"),
        ("sleep", "enabledSleep", "/v2/activity/sleep"),
        ("workout", "enabledWorkouts", "/v2/activity/workout"),
    )
    # The two sibling calls that fill the `user` row. Neither is paged and neither
    # returns an identity of its own, so they are one row and one step that runs
    # before the streams.
    PROFILE_PATH = "/v2/user/profile/basic"
    BODY_PATH = "/v2/user/measurement/body"
    BODY_SCOPE = "read:body_measurement"

    # backfillDepth -> how far the FIRST sync of a stream reaches. "none" means
    # FROM CONNECT FORWARD: the floor is the run's own start. "all" is a fixed
    # pre-WHOOP epoch, so the request is a function of the account and not of the
    # clock.
    BACKFILL_DAYS = {"none": 0, "last2d": 2, "last30d": 30, "last90d": 90,
                     "last1y": 365}
    ALL_EPOCH = "2015-01-01T00:00:00Z"
    # A steady-state re-read reaches this far behind the stream's own cursor:
    # WHOOP re-scores for hours after a record appears, and the provider-keyed puts
    # make the overlap converge instead of duplicate.
    OVERLAP_HOURS = 48
    # A status line, never a body.
    REASON_MAX = 200


    # Per stream: the mirror kind it writes, the collection field its row id is
    # composed from (a recovery has no id and is keyed on the cycle it scores),
    # the stored property holding that WHOOP id, and the read that fetches one
    # object back by it.
    KINDS = {"cycle": CYCLE_KIND, "recovery": RECOVERY_KIND, "sleep": SLEEP_KIND,
             "workout": WORKOUT_KIND}
    UPSTREAM_KEY = {"cycle": "id", "recovery": "cycle_id", "sleep": "id",
                    "workout": "id"}
    UPSTREAM_PROPERTY = {"cycle": "cycleId", "sleep": "sleepId",
                         "workout": "workoutId"}
    READ_BACK = {"cycle": "/v2/cycle/%s", "recovery": "/v2/cycle/%s/recovery",
                 "sleep": "/v2/activity/sleep/%s",
                 "workout": "/v2/activity/workout/%s"}
    # The rows of a walked stream's window one reconciliation step lists. The
    # rows the walk did not meet among them are read back before the next step,
    # each spending one of WHOOP's 100 requests a minute.
    SCAN_PAGE = 100
    # How far before the oldest recovery without a `cycleId` its re-walk starts.
    # WHOOP's `start` filter is on the cycle and a recovery's `at` is when it was
    # created, a day at most after its cycle began, so a week of margin puts
    # every such recovery's cycle inside the walk.
    LEGACY_MARGIN_DAYS = 7
    # The host reads one invocation may make: `permissions.reads.budgets.calls`.
    # A reconciliation step that could cross it waits for the next invocation,
    # whose budget is fresh; the costliest step is a scan, one list and up to a
    # get per row it lists.
    HOST_CALLS = 200
    STEP_CALLS = SCAN_PAGE + 1
    # The rows per stream a webhook marked that one run reads back.
    MARKED_MAX = 25


    # --------------------------------------------------------------- plumbing

    def _now():
        # SUB-SECOND, and deliberately so (`docs/provider-practices.md` §4): a
        # `syncRequestedAt` landing in the same WHOLE SECOND as `lastSyncedAt` is
        # not greater than it, the request guard closes, and nothing can drive the
        # account again. Slack's seed stalled at 1,249 pending on exactly that.
        return _dt.datetime.now(_dt.timezone.utc).strftime("%Y-%m-%dT%H:%M:%S.%fZ")


    def _iso(ts):
        return ts.replace(microsecond=0).isoformat().replace("+00:00", "Z")


    class _Permanent(Exception):
        """An answer asking again cannot change: a revoked grant, a missing scope,
        a malformed request. Recorded once; the stream is not retried this run."""


    class _NotFound(_Permanent):
        """A 404. On a read by id it is the one sign a deletion leaves, because
        WHOOP's collections carry no tombstone."""


    class _RateLimited(Exception):
        """WHOOP asked us to stop. Carries the instant it said to come back."""

        def __init__(self, retry_at, message):
            super().__init__(message)
            self.retry_at = retry_at


    def _get(base, token, path, params=None):
        url = base + path
        _check_origin(url)
        resp = requests.get(url, params=params or None, headers={
            "Authorization": "Bearer " + token,
            "Accept": "application/json",
        }, timeout=20)
        if resp.status_code == 429:
            raise _RateLimited(_retry_at(resp), "rate limited by WHOOP")
        if resp.status_code == 401:
            raise _Permanent("unauthorized (was the grant revoked at WHOOP?)")
        if resp.status_code == 403:
            raise _Permanent("forbidden (a scope this grant does not carry)")
        if resp.status_code == 404:
            raise _NotFound("whoop returned HTTP 404")
        if 400 <= resp.status_code < 500 and resp.status_code != 408:
            raise _Permanent("whoop returned HTTP %d" % resp.status_code)
        resp.raise_for_status()
        return resp.json()


    def _err_msg(e):
        if isinstance(e, _RateLimited):
            return "rate limited; retry after %s" % (e.retry_at or "the window resets")
        if isinstance(e, _Permanent):
            return str(e)
        if isinstance(e, requests.HTTPError) and e.response is not None:
            return "whoop returned HTTP %d" % e.response.status_code
        return str(e) or type(e).__name__


    class _Budget:
        def __init__(self):
            self.start = _dt.datetime.now(_dt.timezone.utc)

        def spent(self):
            return (_dt.datetime.now(_dt.timezone.utc)
                    - self.start).total_seconds() >= BUDGET_SECONDS


    # ------------------------------------------------------- what is due, and when

    def _wants(acct):
        props = acct.get("properties") or {}
        # THE OWNER'S PAUSE IS A REASON NOT TO WANT. `syncPaused` is one of the
        # core `sync` trait's two owner hands (substrate decision 0085): the
        # dispatcher refuses a paused record's DELIVERIES before this body runs at
        # all, and this line is the other half — the scheduled sweep, an
        # `args.account` and `force` all choose their queue through `_wants`, so a
        # paused account does nothing on any path.
        if props.get("syncPaused"):
            return False
        if props.get("enabledProfile"):
            return True
        return any(props.get(toggle) for _, toggle, _ in STREAMS)


    def _requested(props):
        """The "sync now" generation: live exactly while the owner's stamp and the
        connector's acknowledgement disagree. Comparing the request against
        `lastSyncedAt` would loop forever on a request dated in the future."""
        want = props.get("syncRequestedAt")
        return bool(want) and str(want) != str(props.get("syncRequestedAck") or "")


    def _due(props):
        if _held(props):
            return False
        if _requested(props):
            return True
        freq = (props.get("syncFrequency") or "daily").lower()
        if freq == "off":
            return False
        seen = _parse(props.get("lastSyncedAt"))
        if seen is None:
            return True
        hours = 1 if freq == "hourly" else 24
        return _dt.datetime.now(_dt.timezone.utc) - seen >= _dt.timedelta(hours=hours)


    def _enabled(props):
        return [key for key, toggle, _ in STREAMS if props.get(toggle)]


    def _floor(props, key, now):
        """The `start` this run reads one stream from, pinned in the cursor so every
        page of that stream reads the same interval.

        Three sources, in order, and the middle one is the one that was paid for:

          1. the stream's OWN cursor less the overlap, so a stream that stalled
             does not get its tail advanced by a sibling that drained;
          2. THE FLOOR A PREVIOUS COLD WALK COMPUTED AND DID NOT FINISH.
             `backfillDepth: last90d` is `now - 90 days`, and `now` moves: a cold
             walk cut off by a 429 and restarted an hour later would compute a
             floor an hour later too, and the oldest hour of the window it was
             walking would never be read by anything. So the computed floor is
             BANKED on the account the first time it is used and only cleared when
             the stream drains — `docs/provider-practices.md` §4, "a cold walk's
             FLOOR is part of the cursor", which Slack paid for. (Codex review,
             finding 1.)
          3. `backfillDepth`, computed once.
        """
        cursors = props.get("syncCursors") or {}
        seen = _parse(cursors.get(key))
        if seen is not None:
            return _iso(seen - _dt.timedelta(hours=OVERLAP_HOURS))
        held = (props.get("syncFloors") or {}).get(key)
        if held:
            return _iso(_parse(held) or now)
        depth = props.get("backfillDepth") or "last30d"
        if depth == "all":
            return ALL_EPOCH
        return _iso(now - _dt.timedelta(days=BACKFILL_DAYS.get(depth, 30)))


    # ---------------------------------------------------------------- record ids
    # Every id is host.ids.external("whoop", account, key), so a re-sync composes
    # the same id and converges by plain put, and two accounts never collide.
    #
    # THE KEYS ARE WHOOP'S OWN STABLE IDENTITIES (§3): a member is `user/<user_id>`,
    # a cycle is `cycle/<id>`, a sleep is `sleep/<uuid>` and a workout is
    # `workout/<uuid>` — the v2 UUIDs, which are what the resources' own endpoints
    # report, never the deprecated `v1_id`. A RECOVERY has no id of its own, so it
    # is keyed on the cycle it scores, which is literally how WHOOP addresses it
    # (`GET /v2/cycle/{cycleId}/recovery`).

    def _row_id(host, aid, key, rec):
        """The row id one collection record lands at, or "" when it carries no
        id to compose it from (the ingest then skips and counts it)."""
        upstream = rec.get(UPSTREAM_KEY[key])
        if upstream in (None, ""):
            return ""
        return _rid(host, aid, key, upstream)


    def _ref_id(value):
        """The record id a stored reference names, in either spelling."""
        if isinstance(value, dict):
            value = value.get("ref")
        return str(value or "").rsplit("/", 1)[-1]


    # ------------------------------------------------------ property shapes
    # The rules every row shares are the shared module's (`take`, `mint`,
    # `span`); the member's mailbox is this body's alone.

    def _email(value):
        """§2: a value that does not parse as a mailbox is not written. One bad
        profile must not stall an account."""
        v = str(value or "").strip()
        if v.count("@") != 1:
            return None
        local, _, domain = v.partition("@")
        if not local or not domain or "." not in domain or " " in v:
            return None
        return v


    class _Sink:
        """Stages the rows one page produces.

        A mirror row is written whole, nulls included, which is what makes an
        AUTHORITATIVE omission a delete, and under the version of the row as
        this invocation read it (`whoop_mirror.write_row`). The member row is
        the exception: it carries no revision, so its thin mint is a create-only
        put and its profile a plain patch.
        """

        def __init__(self, host, aid):
            self.host = host
            self.aid = aid
            self.seen = set()
            # {row id: the stored row} for the rows the current page names.
            self.stored = {}
            # The mirror rows this invocation already staged. A second write to
            # one would carry the version the first one moves past, and fail the
            # whole delivery against its own write.
            self.written = set()

        def write(self, kind, rid, props):
            self.seen.add(rid)
            if (kind, rid) in self.written:
                self.host.log("whoop: %s %s is named twice in one invocation; "
                              "kept the first" % (kind.rsplit("/", 1)[-1], rid))
                return rid
            if not _write_row(self.host, kind, rid, props, self.stored.get(rid)):
                # A page read before a newer write landed (a webhook, a later
                # run) must not put the older revision back.
                self.host.log("whoop: %s %s is older than the stored row; kept it"
                              % (kind.rsplit("/", 1)[-1], rid))
                return rid
            self.written.add((kind, rid))
            return rid

        # -- the member -----------------------------------------------------
        def user_stub(self, user_id):
            """A member named only by the `user_id` on a record. A THIN MINT: an
            `if_absent` put carrying the identity alone, so a page that merely
            mentions the member never resets a profile the sibling calls
            hydrated."""
            rid = _rid(self.host, self.aid, "user", user_id)
            if rid not in self.seen:
                self.host.effects.put(USER_KIND, rid, if_absent=True, properties={
                    "account": self.aid, "userId": int(user_id)})
                self.seen.add(rid)
            return rid

        def user_row(self, user_id, profile, body):
            """The member row from the two sibling calls, both authoritative."""
            rid = _rid(self.host, self.aid, "user", user_id)
            props = {"account": self.aid, "userId": int(user_id)}
            if profile is not None:
                _take(props, profile, (("first_name", "firstName"),
                                       ("last_name", "lastName")))
                # §2: an address that does not parse is NOT WRITTEN — absent, which
                # is different from the null an authoritative omission earns.
                if "email" not in profile:
                    props["email"] = None
                else:
                    mail = _email(profile.get("email"))
                    if mail is not None or profile.get("email") in (None, ""):
                        props["email"] = mail
            if body is not None:
                _take(props, body, (("height_meter", "heightMeter"),
                                    ("weight_kilogram", "weightKilogram"),
                                    ("max_heart_rate", "maxHeartRate")))
            self.host.effects.put(USER_KIND, rid, properties=_mint(props),
                                  if_absent=True)
            self.host.effects.patch(USER_KIND, rid, properties=props)
            self.seen.add(rid)
            return rid

        # -- the four streams ------------------------------------------------
        # The mapping is the shared module's, so the webhook writes the same
        # shape for the same object.
        def cycle(self, rec, user_rid):
            return self.write(*cycle_row(self.host, self.aid, user_rid, rec))

        def recovery(self, rec, user_rid):
            return self.write(*recovery_row(self.host, self.aid, user_rid, rec))

        def sleep(self, rec, user_rid):
            return self.write(*sleep_row(self.host, self.aid, user_rid, rec))

        def workout(self, rec, user_rid):
            return self.write(*workout_row(self.host, self.aid, user_rid, rec))


    _INGEST = {"cycle": _Sink.cycle, "recovery": _Sink.recovery,
               "sleep": _Sink.sleep, "workout": _Sink.workout}


    # ------------------------------------------------------------- the checkpoint

    def _fresh(queue, dispatch="", started=""):
        """A fresh per-account cursor. The enabled streams and their pinned floors
        are computed when the account reaches the head of the queue.

        `dispatch` and `startedAt` are the core `sync` trait's bookkeeping
        (substrate decision 0085): the dispatcher stamps `lastSyncStartedAt` and
        `lastSyncDurationMs` around a RECORD-sourced delivery only, and a
        scheduled fire names no record — so on that path the body carries its own
        start instant through the drain and stamps the pair itself. They ride in
        the checkpoint because one run is many invocations.
        """
        return {"queue": queue, "streams": None, "floors": {}, "nextToken": "",
                "profileDone": False, "userRid": "", "skipped": 0, "records": 0,
                "requested": "", "drained": [], "failed": [], "retryAt": "",
                "dispatch": dispatch, "startedAt": started or _now()}


    def _elapsed_ms(started, ended):
        """How long a run took, in whole milliseconds, or None if either stamp is
        unreadable. A duration is never negative: a checkpoint that outlived a
        clock change reports 0 rather than a number that reads as time travel."""
        a, b = _parse(started), _parse(ended)
        if a is None or b is None:
            return None
        return max(int((b - a).total_seconds() * 1000), 0)


    def _progress(cur, props):
        """`{phase, done, total, pending}` — the core `sync` trait's progress, off
        THE DRAIN'S OWN BOOKKEEPING and nothing else.

        The unit is a COLLECTION, because that is what this drain queues: `total`
        is the collections this account has enabled, `pending` the ones still to
        walk, `done` the ones that ran out of pages and read back what they
        missed, and `phase` the one the budget was spent in — `profile` before
        any of them and `done` when the account drained. A stream abandoned on
        a permanent failure counts as neither done nor pending; it is named in
        `syncMessage`.
        """
        enabled = _enabled(props)
        left = [k for k in (cur.get("streams") or []) if k in enabled]
        drained = [k for k, _ in (cur.get("drained") or [])]
        if not cur.get("profileDone"):
            phase = "profile"
        elif left:
            phase = left[0]
        elif cur.get("scan"):
            # Walked, and reading back what the walk did not meet.
            phase = cur["scan"]["key"]
        else:
            phase = "done"
        return {"phase": phase, "done": len(drained), "total": len(enabled),
                "pending": len(left)}


    def _trait(cur, props, state, message):
        """The core `sync` trait's properties (substrate decision 0085), written
        beside the legacy `syncStatus` on every path this body takes.

        WHOOP is a SINGLE-STREAM provider in the trait's sense — one function, one
        queue, one outcome — so `syncStreams` stays unwritten and
        `syncRequestedAck` is answered directly rather than once every enabled
        stream has agreed, which is decision 0085's own rule for one. `syncError`
        is written only by the erroring state, exactly as main's Google bundle
        does it, so a throttled run does not file itself as a failure.
        """
        out = {"syncState": state,
               "syncMessage": str(message or "")[:400],
               "syncProgress": _progress(cur, props)}
        if state == "erroring":
            out["syncError"] = str(message or "")[:400]
            out["syncErrorAt"] = _now()
        return out


    def _stamp(host, acct, aid, cur, error=None, completed=False):
        """The connector stamp — every `writer: connector` property in one patch.

        `lastSyncedAt` marks the ATTEMPT finished either way: it anchors the
        cadence AND drops the on-connect trigger's guard, so an erroring stamp can
        never re-fire the first backfill in a loop. `lastCompletedAt` is only ever
        written by a walk that ran out of work, which is the one thing that is
        evidence anything finished.
        """
        patch = {"lastSyncedAt": _now()}
        if error is not None:
            patch["syncStatus"] = ("erroring: " + str(error))[:REASON_MAX + 20]
        else:
            notes = []
            if cur.get("skipped"):
                notes.append("%d skipped" % cur["skipped"])
            if cur.get("failed"):
                notes.append("failed: " + ", ".join(
                    "%s (%s)" % (k, why) for k, why in cur["failed"][:3]))
            patch["syncStatus"] = ("ok" if not notes
                                   else "ok (" + "; ".join(notes) + ")")[:400]
            # `lastCompletedAt` means ONE thing: a walk ran out of work with
            # nothing left behind. A run that abandoned a stream on a permanent
            # failure, or skipped a record it could not read, did not — and
            # stamping it anyway is how "finished" stops meaning anything (Codex
            # review, findings 5 and 9).
            if completed and not cur.get("failed") and not cur.get("skipped"):
                patch["lastCompletedAt"] = patch["lastSyncedAt"]
        # The cursors this run banked, per stream. A stream that never drained
        # keeps the floor it had, so the next run re-reads the window it lost.
        cursors = dict((acct.get("properties") or {}).get("syncCursors") or {})
        for key, end in (cur.get("drained") or []):
            cursors[key] = end
        if cursors:
            patch["syncCursors"] = cursors
        # THE UNFINISHED FLOORS. A stream this run pinned and did not drain keeps
        # the floor it was walking, so a cold walk interrupted by a 429 resumes the
        # window it started rather than a newer one; a stream that DID drain has a
        # cursor now and needs no floor.
        floors = dict((acct.get("properties") or {}).get("syncFloors") or {})
        done = {key for key, _ in (cur.get("drained") or [])}
        for key, value in (cur.get("floors") or {}).items():
            if key in done:
                floors.pop(key, None)
            elif value:
                floors.setdefault(key, value)
        patch["syncFloors"] = floors or None
        if cur.get("retryAt"):
            patch["retryNotBefore"] = cur["retryAt"]
        # The request generation this run acted on, echoed back on EVERY path
        # including the erroring one: an unacknowledged request would re-fire the
        # trigger against the same failure forever. It is also the trait's
        # `syncRequestedAck` — one property, one meaning, so the on-request
        # trigger's guard and the Connections page read the same stamp.
        if cur.get("requested"):
            patch["syncRequestedAck"] = cur["requested"]
        # ---- the core `sync` trait (substrate decision 0085) -----------------
        # `ok` ONLY WHERE THE WALK RAN OUT OF WORK, which is the same statement
        # `lastCompletedAt` makes above: an invocation that stopped on its own
        # budget hands its checkpoint back and stamps nothing, and the one path
        # that stamps without draining is a failure.
        if cur.get("retryAt"):
            # A 429 IS NOT A FAILURE. WHOOP named the instant to come back and
            # `retryNotBefore` holds every path until then, so the trait says
            # `throttled` where the legacy string still says `erroring: rate
            # limited` — the one place the two shapes deliberately disagree, and
            # the reason the trait exists is that `throttled` is a word a console
            # can render and a prefixed sentence is not.
            state, message = "throttled", str(error or "rate limited by WHOOP")
        elif error is not None:
            state, message = "erroring", str(error)
        elif not completed:
            state, message = "running", patch["syncStatus"]
        else:
            state, message = "ok", patch["syncStatus"]
        patch.update(_trait(cur, acct.get("properties") or {}, state, message))
        # THE SCHEDULE PATH STAMPS ITS OWN START AND DURATION. The dispatcher
        # stamps the pair around a RECORD-sourced delivery under this callable's
        # actor; a scheduled fire names no record and would otherwise leave the
        # pair standing at whatever the last "sync now" wrote.
        if cur.get("dispatch") == "schedule" and cur.get("startedAt"):
            took = _elapsed_ms(cur["startedAt"], patch["lastSyncedAt"])
            patch["lastSyncStartedAt"] = cur["startedAt"]
            if took is not None:
                patch["lastSyncDurationMs"] = took
        host.effects.patch((acct.get("kind") or ACCOUNT_KIND), aid, properties=patch)


    def _next_account(host, cur, queue):
        rest = queue[1:]
        if rest:
            # The next account is a fresh walk with a fresh start instant, but the
            # SAME dispatch: one scheduled fire sweeps every due account and each
            # one stamps its own `lastSyncStartedAt`.
            return {"more": host.page.more(_fresh(rest, cur.get("dispatch")))}
        return None


    def _marked(host, aid, streams):
        """The rows of these streams a webhook marked with `refreshRequestedAt`
        because it could not read their object, as read-back entries
        `[stream, row id, WHOOP id, stored updatedAt]`, at most MARKED_MAX per
        stream; the rest wait for the next run. A cycle has no webhook and no
        mark. Returns the entries and the host reads it made."""
        out = []
        reads = 0
        for key in streams:
            if key == "cycle":
                continue
            reads += 1
            page = host.records.list(KINDS[key],
                                     where={"account": {"eq": aid},
                                            REFRESH_MARK: {"exists": True}},
                                     first=MARKED_MAX)
            for ent in page.get("records") or []:
                rid = str(ent.get("id") or "")
                props = ent.get("properties") or {}
                if key == "recovery" and props.get("cycleId") in (None, ""):
                    reads += 1
                upstream = _upstream_of(host, key, props)
                if rid and upstream not in (None, ""):
                    out.append([key, rid, str(upstream),
                                str(props.get("updatedAt") or "")])
        return out, reads


    def _upstream_of(host, key, props):
        """The WHOOP id a stored row is read back by. A recovery is addressed by
        the cycle it scores: its own `cycleId`, or on a row written before it
        carried one, its cycle row's."""
        if key != "recovery":
            return props.get(UPSTREAM_PROPERTY[key])
        if props.get("cycleId") not in (None, ""):
            return props["cycleId"]
        cid = _ref_id(props.get("cycle"))
        if not cid:
            return None
        cycle = host.records.get(CYCLE_KIND, cid)
        return ((cycle or {}).get("properties") or {}).get("cycleId")


    def _revalidate(host, base, token, sink, key, rid, rec):
        """The record a page names over a DELETED row, read again by id, or None
        when WHOOP no longer has it.

        A page can be read before a deletion (a webhook's, a read-back's 404)
        commits, and a put staged under the version of the tombstone this
        body reads afterwards would restore the row. So the row is read FIRST
        and WHOOP second: a deletion that lands after the read moves the
        version and fails the write `conflict`, and one that landed before it
        is answered 404 here. An object WHOOP does have (a recovery, keyed on
        its cycle, scored again after its sleep was replaced) is written over
        the tombstone. A 429 or a transport error ends the run before the
        stream drains, so its cursor stays and the next run asks again."""
        row = host.records.get(KINDS[key], rid)
        try:
            fresh = _get(base, token, READ_BACK[key]
                         % _quote(str(rec.get(UPSTREAM_KEY[key])), safe=""))
        except _NotFound:
            host.log("whoop: %s row %s stays deleted; WHOOP answers 404 for it"
                     % (key, rid))
            return None
        sink.stored[rid] = row
        return fresh


    def _legacy_floor(host, aid):
        """The floor that re-reads every recovery row this account holds with no
        `cycleId` (written before version 21), or None when none is left."""
        page = host.records.list(RECOVERY_KIND,
                                 where={"account": {"eq": aid},
                                        "cycleId": {"exists": False}},
                                 first=1, order="at")
        rows = page.get("records") or []
        at = _parse(((rows[0].get("properties") or {}) if rows else {}).get("at"))
        if at is None:
            return None
        return _iso(at - _dt.timedelta(days=LEGACY_MARGIN_DAYS))


    def _scan(host, aid, cur):
        """One step of a walked stream's reconciliation.

        Lists the next SCAN_PAGE rows the mirror holds in the stream's window and
        queues for a read-back the ones the walk did not meet. Once the window is
        exhausted and every queued read-back has answered, the stream is drained
        and its cursor may move. A recovery left from before version 21, with no
        id to read it back by, is deleted when this walk was its re-walk: the
        walk reached back past it and WHOOP's collection no longer holds it.
        Returns the host reads it made."""
        scan = cur["scan"]
        key = scan["key"]
        if scan.get("done"):
            cur["drained"] = list(cur.get("drained") or []) + [[key, scan["end"]]]
            (cur.get("seen") or {}).pop(key, None)
            cur["scan"] = None
            return 0
        reads = 1
        seen = set((cur.get("seen") or {}).get(key) or [])
        page = host.records.list(KINDS[key],
                                 where={"account": {"eq": aid},
                                        "at": {"gte": cur["floors"][key]}},
                                 first=SCAN_PAGE, after=scan.get("after") or None)
        rows = page.get("records") or []
        queued = []
        for ent in rows:
            rid = str(ent.get("id") or "")
            if not rid or rid in seen:
                continue
            props = ent.get("properties") or {}
            if key == "recovery" and props.get("cycleId") in (None, ""):
                reads += 1
            upstream = _upstream_of(host, key, props)
            if upstream in (None, ""):
                if key in (cur.get("legacy") or []):
                    # Under the version listed: a run that rewrote the row since
                    # (and filled its `cycleId`) fails this delivery `conflict`.
                    host.effects.delete(KINDS[key], rid,
                                        if_version=host.version(ent))
                    cur["deleted"] = int(cur.get("deleted") or 0) + 1
                    host.log("whoop: %s row %s has no WHOOP id and its re-walk did "
                             "not meet it; deleted" % (key, rid))
                else:
                    host.log("whoop: %s row %s names no WHOOP id to read it back by"
                             % (key, rid))
                continue
            queued.append([key, rid, str(upstream)])
        cur["orphans"] = list(cur.get("orphans") or []) + queued
        after = page.get("cursor") or ""
        if rows and after:
            scan["after"] = after
        else:
            scan["done"] = True
        return reads


    def _follow_up(host, base, token, sink, user_rid, cur):
        """Read back the first row the reconciliation queued. A 404 deletes it;
        an object WHOOP still has is written as a page record would be. Both
        act under the row as it stands NOW, not as it stood when it was queued:
        a run resumed after another wrote the row must not put an older
        revision over it or delete what that run wrote. Any other refusal is
        recorded, the row kept and the stream's reconciliation abandoned, so
        its cursor does not move past a window whose deletions are unknown. A
        429 or a transport error ends the run before the stream drains."""
        orphans = list(cur.get("orphans") or [])
        key, rid, upstream = orphans[0][:3]
        cur["orphans"] = orphans[1:]
        row = host.records.get(KINDS[key], rid)
        if row is None or row.get("deletedAt"):
            # Deleted since it was queued: nothing is left to reconcile.
            return
        try:
            rec = _get(base, token, READ_BACK[key] % _quote(upstream, safe=""))
        except _NotFound:
            host.effects.delete(KINDS[key], rid, if_version=host.version(row))
            cur["deleted"] = int(cur.get("deleted") or 0) + 1
            host.log("whoop: %s %s is gone at WHOOP; deleted row %s"
                     % (key, upstream, rid))
            return
        except _Permanent as e:
            # Not a 404, so whether WHOOP still has the object is unknown. The
            # stream never drains this run and `_stamp` keeps its cursor; the
            # rest of its read-backs would get the same answer.
            cur["failed"] = list(cur.get("failed") or []) + \
                [[key + " read-back", str(e)[:60]]]
            cur["orphans"] = [o for o in cur["orphans"] if o[0] != key]
            if (cur.get("scan") or {}).get("key") == key:
                cur["scan"] = None
            (cur.get("seen") or {}).pop(key, None)
            return
        try:
            uid = rec.get("user_id")
            who = sink.user_stub(uid) if uid not in (None, "") else user_rid
            if not who:
                raise ValueError("record carries no user_id and no profile has "
                                 "been read")
            sink.stored = {rid: row}
            _INGEST[key](sink, rec, who)
        except Exception as e:                                      # noqa: BLE001
            cur["skipped"] = int(cur.get("skipped") or 0) + 1
            host.log("whoop: skip a %s read-back for %s: %s" % (key, sink.aid, e))


    def _sync_account(host, base, acct, aid, props, token, cur, queue):
        budget = _Budget()
        now = _dt.datetime.now(_dt.timezone.utc)
        # The rows a webhook marked, read once, when the account reaches the
        # head of the queue.
        marked, marked_reads = _marked(host, aid, _enabled(props)) \
            if cur.get("streams") is None else ([], 0)

        if cur.get("streams") is None:
            # The account just reached the head: pin its streams and one floor PER
            # STREAM, so every page of one stream reads the same interval and a
            # stalled stream's floor is its own.
            streams = _enabled(props)
            floors = {k: _floor(props, k, now) for k in streams}
            reconcile = [k for k in streams
                         if (props.get("syncCursors") or {}).get(k)]
            legacy = []
            if "recovery" in reconcile:
                deep = _legacy_floor(host, aid)
                if deep is not None and _parse(deep) < _parse(floors["recovery"]):
                    floors["recovery"] = deep
                    legacy = ["recovery"]
            cur.update({"queue": queue, "streams": streams, "floors": floors,
                        # The instant the walk BEGAN, pinned here and carried
                        # through every invocation of the drain. A cursor stamped
                        # with the clock of whichever invocation happened to drain
                        # the stream would sit AFTER records WHOOP wrote while the
                        # walk was running, and the next run's floor would start
                        # past them (Codex review, finding 13).
                        "runStart": _iso(now),
                        "requested": str(props.get("syncRequestedAt") or ""),
                        "drained": [], "failed": [],
                        # Only a stream that already had a cursor walks a
                        # window short enough to read back what it missed.
                        "reconcile": reconcile, "legacy": legacy,
                        "seen": {}, "scan": None, "orphans": [], "deleted": 0})

        sink = _Sink(host, aid)
        user_rid = cur.get("userRid") or ""
        if marked:
            # Read back before any page, so a 429 the walk then earns cannot
            # starve them; the read-back's write clears each mark.
            cur["orphans"] = list(cur.get("orphans") or []) + marked

        # -- the profile step, once per account, before any stream -------------
        # It runs only with the toggle on; every mirror row references a member and
        # the thin mint off each record's `user_id` covers the row when it is off.
        if not cur.get("profileDone"):
            if props.get("enabledProfile"):
                # Two reads at a 20-second timeout each, before a single page: the
                # profile step gets its OWN checkpoint so a slow pair cannot eat
                # the PT60S deadline that the first page needs (Codex, finding 8).
                profile = _get(base, token, PROFILE_PATH)
                user_id = profile.get("user_id")
                if user_id in (None, ""):
                    raise _Permanent("the basic profile carries no user_id")
                body = None
                if BODY_SCOPE in (props.get("grantedScopes") or []):
                    try:
                        body = _get(base, token, BODY_PATH)
                    except _Permanent as e:
                        # The body measurement is its own scope. A member who
                        # declined it gets a profile-only row, not a failed sync.
                        host.log("whoop: %s body measurement unavailable: %s"
                                 % (aid, e))
                        cur["failed"] = list(cur.get("failed") or []) + \
                            [["body", str(e)[:60]]]
                user_rid = sink.user_row(user_id, profile, body)
                # The account's own identity, as a reference (§1).
                host.effects.patch((acct.get("kind") or ACCOUNT_KIND), aid,
                                   properties={"user": user_rid})
            cur.update({"profileDone": True, "userRid": user_rid})
            if budget.spent():
                return {"more": host.page.more(cur)}

        streams = list(cur.get("streams") or [])
        # The host reads this invocation has made, against HOST_CALLS.
        reads = marked_reads
        while streams or cur.get("orphans") or cur.get("scan"):
            # BEFORE the request, not after the stream: one read may take the whole
            # of `requests`' 20-second timeout, and a run killed before it
            # checkpoints replays the same page forever.
            if budget.spent() or reads + STEP_CALLS > HOST_CALLS:
                return {"more": host.page.more(cur)}
            if cur.get("orphans"):
                # A walked stream's read-backs, one per turn, before the next
                # scan step and the next stream.
                _follow_up(host, base, token, sink, user_rid, cur)
                reads += 1
                continue
            if cur.get("scan"):
                reads += _scan(host, aid, cur)
                continue
            key = streams[0]
            path = next(p for k, _, p in STREAMS if k == key)
            params = {"limit": PAGE_LIMIT, "start": cur["floors"][key]}
            if cur.get("nextToken"):
                # The REQUEST parameter is `nextToken`; the RESPONSE field is
                # `next_token`. WHOOP spells the two differently and it is not a
                # typo.
                params["nextToken"] = cur["nextToken"]
            try:
                resp = _get(base, token, path, params)
            except _Permanent as e:
                # PERMANENT: recorded once, the stream abandoned for this run. A
                # retried unit of work would keep the drain reporting itself
                # pending forever.
                host.log("whoop: %s %s stream is permanently failing: %s"
                         % (aid, key, e))
                cur["failed"] = list(cur.get("failed") or []) + [[key, str(e)[:60]]]
                streams = streams[1:]
                cur.update({"streams": streams, "nextToken": ""})
                continue

            page = resp.get("records") or []
            # The stored revision of every row this page names (`_Sink.write`
            # keeps a newer row), and the rows the walk met, which the
            # reconciliation leaves alone.
            rids = [_row_id(host, aid, key, rec) for rec in page]
            sink.stored = _stored_rows(host, KINDS[key], rids)
            reads += 2
            if key in (cur.get("reconcile") or []):
                met = cur.setdefault("seen", {}).setdefault(key, [])
                held = set(met)
                met.extend(r for r in rids if r and r not in held)
            # THE REFERENCED ROW FIRST: one thin `user` mint per distinct member id
            # the page named, before any row that references it. GUARDED, because
            # this pass used to sit outside the per-record `try` and a `user_id`
            # that would not cast to an int took the whole ACCOUNT down with it
            # (Codex review, finding 9).
            minted = {}
            for rec in page:
                uid = rec.get("user_id")
                if uid in (None, "") or uid in minted:
                    continue
                try:
                    minted[uid] = sink.user_stub(uid)
                except Exception as e:                              # noqa: BLE001
                    host.log("whoop: %s unusable user_id on a %s record: %s"
                             % (aid, key, e))
            # THE ACCOUNT'S OWN IDENTITY, with the profile toggle OFF. Every record
            # carries `user_id`, the account kind promises the reference lands
            # either way, and until this it only ever landed from the profile step
            # (Codex review, finding 6).
            if not user_rid and minted:
                user_rid = sorted(minted.values())[0]
                cur["userRid"] = user_rid
                host.effects.patch((acct.get("kind") or ACCOUNT_KIND), aid,
                                   properties={"user": user_rid})
            refused = None
            for rec in page:
                rid = _row_id(host, aid, key, rec)
                if (sink.stored.get(rid) or {}).get("deletedAt"):
                    reads += 1
                    try:
                        rec = _revalidate(host, base, token, sink, key, rid, rec)
                    except _Permanent as e:
                        refused = e
                        break
                    if rec is None:
                        continue
                # Records are independent: a malformed one is skipped and counted,
                # never the page's failure.
                try:
                    who = minted.get(rec.get("user_id")) or user_rid
                    if not who:
                        raise ValueError("record carries no user_id and no profile "
                                         "has been read")
                    _INGEST[key](sink, rec, who)
                    cur["records"] = int(cur.get("records") or 0) + 1
                except Exception as e:                              # noqa: BLE001
                    cur["skipped"] = int(cur.get("skipped") or 0) + 1
                    host.log("whoop: skip a %s record for %s: %s" % (key, aid, e))

            if refused is not None:
                # A deleted row WHOOP would not say is gone or back: the stream
                # is abandoned for this run, as on a refused page, so its cursor
                # stays behind the record and the next run asks again.
                host.log("whoop: %s %s stream: a deleted row's read-back was "
                         "refused: %s" % (aid, key, refused))
                cur["failed"] = list(cur.get("failed") or []) + \
                    [[key + " deleted row", str(refused)[:60]]]
                streams = streams[1:]
                cur.update({"streams": streams, "nextToken": ""})
                continue

            token_next = resp.get("next_token") or ""
            if token_next:
                cur["nextToken"] = token_next
                return {"more": host.page.more(cur)}
            # This stream's pages ran out. Its new cursor is the RUN-START instant,
            # never the local completion clock: a record WHOOP wrote while this
            # walk was running is behind the floor of the next one only if the
            # floor is the moment the walk began. A reconciled stream banks it
            # only once its window's read-backs have all answered (`_scan`).
            end = cur.get("runStart") or _iso(now)
            streams = streams[1:]
            cur.update({"streams": streams, "nextToken": ""})
            if key in (cur.get("reconcile") or []):
                cur["scan"] = {"key": key, "after": "", "end": end}
            else:
                cur["drained"] = list(cur.get("drained") or []) + [[key, end]]

        # -- the account drained -------------------------------------------------
        _stamp(host, acct, aid, cur, error=None, completed=True)
        nxt = _next_account(host, cur, queue)
        if nxt:
            return nxt
        return {"output": {"account": aid, "records": cur.get("records") or 0,
                           "skipped": cur.get("skipped") or 0,
                           "deleted": cur.get("deleted") or 0}}


    def main(input, host):
        cfg = input.get("config") or {}
        base = _api_base(cfg)
        _check_origin(base)
        accounts = {a.get("id"): a for a in (cfg.get("accounts") or [])}
        # A DIRECT call carries no envelope — its input is {args, causalDepth,
        # config, idempotencyKey, mode}. So the three ways in are: the record
        # trigger's envelope, an explicit `args.account` / `args.accounts` (an
        # operator re-syncing one now), and the schedule's due-by-cadence sweep.
        args = input.get("args")
        if not isinstance(args, dict):
            args = {}
        cur = host.page.resume() or None
        if cur is None:
            record = (input.get("envelope") or {}).get("record") or {}
            named = args.get("accounts") or (
                [args["account"]] if args.get("account") else [])
            if (record.get("kind") or "") == ACCOUNT_KIND:
                queue = [record.get("id")]
            elif named:
                queue = [str(a) for a in named]
            elif args.get("force"):
                queue = [aid for aid, a in accounts.items() if _wants(a)]
            else:
                queue = [aid for aid, a in accounts.items()
                         if _wants(a) and _due(a.get("properties") or {})]
            # HOW THIS RUN WAS ASKED FOR, because the trait's start and duration
            # depend on it: the dispatcher stamps them around a RECORD-sourced
            # delivery (substrate decision 0085) and around nothing else, so on
            # every other way in — the hourly schedule, a direct call, an
            # operator's `args.account` — the body stamps that half itself.
            cur = _fresh(queue, "record" if record.get("kind") else "schedule")

        queue = list(cur.get("queue") or [])
        while queue:
            acct = accounts.get(queue[0])
            if acct is None or not _wants(acct):
                queue = queue[1:]
                cur = _fresh(queue, cur.get("dispatch"))
                continue
            props = acct.get("properties") or {}
            if _held(props):
                # THE RETRY HOLD IS CHECKED HERE, at the head of the queue, and not
                # only in `_due`: a record trigger, an `args.account` and
                # `args.force` all reach this loop without ever asking whether the
                # account is due, so a 429 used to be followed straight away by
                # the on-request trigger asking again (Codex review, finding 2).
                host.log("whoop: %s is held until %s (429)"
                         % (queue[0], props.get("retryNotBefore")))
                queue = queue[1:]
                cur = _fresh(queue, cur.get("dispatch"))
                continue
            terr = acct.get("tokenError")
            if terr or not acct.get("token"):
                if terr:
                    host.log("whoop: skip %s: %s" % (queue[0], terr))
                    want = ("erroring: " + str(terr))[:REASON_MAX]
                    if (props.get("syncStatus") or "") != want:
                        # The trait says it too: an account whose grant is gone
                        # renders as `erroring` with the reason, not as one that
                        # has simply not run (substrate decision 0085).
                        host.effects.patch(
                            (acct.get("kind") or ACCOUNT_KIND), queue[0],
                            properties={"syncStatus": want,
                                        "syncState": "erroring",
                                        "syncMessage": str(terr)[:400],
                                        "syncError": str(terr)[:400],
                                        "syncErrorAt": _now()})
                queue = queue[1:]
                cur = _fresh(queue, cur.get("dispatch"))
                continue
            break
        if not queue:
            # Say WHY nothing synced. A bare zero cannot tell "nothing is due" from
            # "the account has no token" from "the envelope named an account this
            # config does not carry", and the three want three different fixes.
            return {"output": {"synced": 0, "accounts": sorted(accounts),
                               "wanted": sorted(a for a in accounts
                                                if _wants(accounts[a])),
                               "tokened": sorted(a for a in accounts
                                                 if accounts[a].get("token")),
                               "asked": list(cur.get("queue") or [])}}

        aid = queue[0]
        acct = accounts[aid]
        props = acct.get("properties") or {}
        cur["queue"] = queue
        try:
            return _sync_account(host, base, acct, aid, props, acct["token"], cur,
                                 queue)
        except _RateLimited as e:
            # A 429 is not a failure to report and forget: it is work to resume.
            # The instant WHOOP named lands on the account and `_due` refuses to
            # start before it; the floors are recomputed from the cursors, which
            # this run did not advance for the stream that was cut off.
            cur["retryAt"] = e.retry_at
            _stamp(host, acct, aid, cur, error=_err_msg(e))
            nxt = _next_account(host, cur, queue)
            return nxt or {"output": {"account": aid, "error": _err_msg(e)}}
        except Exception as e:                                      # noqa: BLE001
            msg = _err_msg(e)
            host.log("whoop: account %s failed: %s" % (aid, msg))
            _stamp(host, acct, aid, cur, error=msg)
            nxt = _next_account(host, cur, queue)
            return nxt or {"output": {"account": aid, "error": msg}}
---
# ---- the webhook function: one WHOOP event per delivery ----------------------
# WHOOP POSTs a notification when a sleep, a recovery or a workout is written
# or deleted: `{user_id, id, type, trace_id}`, signed with the WHOOP app's
# client secret. The body finds the account by WHOOP's `user_id`, then reads
# the object back by id and rewrites its mirror row, or deletes the row.
# WHOOP sends no event for a cycle or the member; the sync's window covers
# both.
#
# The signature is the door's: the `whoop-webhook` trigger declares it, and
# the host checks it against the config record's client secret before the
# request is stored (decision 0164), so the secret never reaches this body
# and a request that reaches it is one WHOOP signed. The mapping from a WHOOP
# object to its row is the sync's, from the bundle's shared `whoop_mirror`
# module; a delivery for an object the sync already wrote leaves the row's
# version where it was, which the provider tests hold.
kind: substrate.reamde.dev/core/function
metadata:
  id: providers.substrate.reamde.dev/whoop/whoopwebhook
data:
  authority: providers.substrate.reamde.dev
  package: whoop
  description: >-
    Receive one WHOOP webhook the door has already verified: read the changed
    sleep, recovery or workout back from WHOOP and rewrite its mirror row,
    or delete the row of one WHOOP deleted.
  runtime: python
  timeout: PT30S
  permissions:
    # The stored `updatedAt` and version of the rows an event rewrites or
    # marks, whether a row an event deletes exists, and the recovery a
    # recovery event names by its sleep.
    reads:
      kinds:
        - providers.substrate.reamde.dev/whoop/recovery
        - providers.substrate.reamde.dev/whoop/sleep
        - providers.substrate.reamde.dev/whoop/workout
    # The account takes `retryNotBefore` from a 429, which the sync and every
    # later delivery wait out.
    writes:
      - providers.substrate.reamde.dev/whoop/account
      - providers.substrate.reamde.dev/whoop/recovery
      - providers.substrate.reamde.dev/whoop/sleep
      - providers.substrate.reamde.dev/whoop/workout
    network:
      - "api.prod.whoop.com"
      - "127.0.0.1"
      - "localhost"
  source: |
    # /// script
    # requires-python = ">=3.11"
    # dependencies = [
    #   "requests==2.34.2",
    # ]
    # ///
    """WHOOP webhook receiver: rewrite or delete the one row an event names.

    THE SIGNATURE (developer.whoop.com/docs/developing/webhooks) is checked by
    the door before the request is stored: the `whoop-webhook` trigger declares
    WHOOP's scheme and the host verifies it against the client secret, which
    this body never receives. A delivery that reaches the body is signed.

    THE ACCOUNTS are the ones whose `user` reference is the member row for the
    event's `user_id`, which the sync writes on its first page. Nothing stops
    two connections of one member, so each matching account acts on the event
    under its own pause, toggles and token. An event for a member no account
    holds, or one every matching account has paused, is acknowledged and
    dropped. One account's failure does not cost the others their rows: when
    some accounts must keep the request and the rest staged something, this
    invocation hands back a page cursor naming the ones that failed, so the
    rest commit and the next page tries only those. A page that tries them
    again and finishes none fails, and the delivery parks with that cursor
    for a retry by hand.

    THE EVENTS. A create arrives as `.updated`.
      * `sleep.updated`, `workout.updated`: read the object by id and rewrite its
        row, while the account's toggle for it is on.
      * `recovery.updated`: the id is the SLEEP's, not the cycle's. Read the
        sleep for its `cycle_id`, then `/v2/cycle/{cycle_id}/recovery`, and
        rewrite the recovery row (and the sleep row, with sleeps on).
      * `sleep.deleted`, `workout.deleted`: delete the row the id names.
      * `recovery.deleted`: the id is again the sleep's, so the recovery whose
        `sleep` reference is that row is deleted.
    A 404 on any read back means the object is gone, and its row is deleted too.
    A row that does not exist is never deleted (that would fail the delivery),
    so a duplicate delivery changes nothing: WHOOP says duplicates happen, and
    the same object written twice is a write the engine drops.

    REVISIONS. `updated_at` is the object's revision: an answer older than the
    stored row's `updatedAt` is not written over it, and each row is staged
    under the version this body read it at (`whoop_mirror.write_row`). The
    row is read BEFORE WHOOP is asked, so a sync or another delivery that
    writes or deletes it after that read fails this one `conflict`, and the
    retry reads the row and WHOOP again. Read the other way round, a deletion
    landing between WHOOP's answer and the row read would hand this body the
    tombstone's version, and its put would restore the row.

    AN UPDATE THAT CANNOT BE READ NOW IS NOT DROPPED. WHOOP's 429, a 5xx, no
    answer at all, a missing or failing token and the account's retry hold are
    answers a later read may not repeat; WHOOP's 401 and 403 are not, but a
    reconnect changes them. Either way the rows the event names are MARKED:
    `refreshRequestedAt` is set, and the sync, which waits out the hold, reads
    each marked row back by id whatever its age and clears the mark. A 429
    also sets the account's `retryNotBefore` from its `Retry-After`, so later
    deliveries and the sync make no request before it. An event whose object
    has no row yet cannot be marked: on a transient answer the delivery
    fails, so the request is kept and retried, then parked for a retry by
    hand; on a 401 or 403 it is dropped, because the sync's own window reads
    a new object. A recovery event counts as marked only when a RECOVERY row
    is: its sleep row is marked beside it, but the sync reads a marked sleep
    back as a sleep and never asks for the recovery.
    """
    import base64
    import datetime as _dt
    import json
    from urllib.parse import quote as _quote

    import requests

    # The bundle's shared module: the row mapping, the origin pin and the 429
    # hold are `whoopsync`'s, so an object either body reads lands as one shape.
    from whoop_mirror import (ACCOUNT_KIND, RECOVERY_KIND, REFRESH_MARK,
                              SLEEP_KIND, USER_KIND, WORKOUT_KIND,
                              recovery_row, sleep_row, workout_row)
    from whoop_mirror import api_base as _api_base
    from whoop_mirror import check_origin as _check_origin
    from whoop_mirror import held as _held
    from whoop_mirror import retry_at as _retry_at
    from whoop_mirror import rid as _rid
    from whoop_mirror import write_row as _write_row

    # The event's object -> the account toggle that must be on to write it, and
    # the mirror kind its row is.
    TOGGLES = {"sleep": "enabledSleep", "recovery": "enabledRecovery",
               "workout": "enabledWorkouts"}
    KINDS = {"sleep": SLEEP_KIND, "recovery": RECOVERY_KIND,
             "workout": WORKOUT_KIND}
    READ_BACK = {"sleep": "/v2/activity/sleep/%s",
                 "workout": "/v2/activity/workout/%s"}


    # --------------------------------------------------------------- plumbing

    class _NotFound(Exception):
        """WHOOP holds no such object."""


    class _Transient(Exception):
        """An answer a later read may not repeat: WHOOP asked us to wait, failed,
        or could not be reached."""


    class _RateLimited(_Transient):
        """WHOOP asked us to stop. Carries the instant it said to come back."""

        def __init__(self, retry_at, message):
            super().__init__(message)
            self.retry_at = retry_at


    class _Refused(Exception):
        """WHOOP refused the token: a revoked grant, or one connected before
        a toggle asked for the scope this read needs. A retry with the same
        token is refused the same way."""


    class _Keep(Exception):
        """This account cannot act on the event now and has no row to mark, so
        the request must be kept for a retry."""


    def _get(base, token, path):
        url = base + path
        _check_origin(url)
        try:
            resp = requests.get(url, headers={
                "Authorization": "Bearer " + token,
                "Accept": "application/json",
            }, timeout=10)
        except requests.RequestException as e:
            raise _Transient("WHOOP could not be reached (%s)"
                             % type(e).__name__) from None
        if resp.status_code == 404:
            raise _NotFound(path)
        if resp.status_code == 429:
            at = _retry_at(resp)
            raise _RateLimited(at, "rate limited by WHOOP until %s" % at)
        if resp.status_code == 401:
            raise _Refused("WHOOP answered 401 for %s (was the grant revoked "
                           "at WHOOP?)" % path)
        if resp.status_code == 403:
            raise _Refused("WHOOP answered 403 for %s (a scope this grant "
                           "does not carry; reconnect the account)" % path)
        if resp.status_code == 408 or resp.status_code >= 500:
            raise _Transient("WHOOP answered %d for %s" % (resp.status_code, path))
        if resp.status_code >= 400:
            raise RuntimeError("whoop webhook: whoop returned HTTP %d"
                               % resp.status_code)
        return resp.json()


    def _ref_path(value):
        if isinstance(value, dict):
            value = value.get("ref")
        return str(value or "")


    # ----------------------------------------------------------------- the body

    def _body_bytes(request):
        body = request.get("body")
        if isinstance(body, dict) and isinstance(body.get("text"), str):
            return body["text"].encode("utf-8")
        if isinstance(body, dict) and isinstance(body.get("base64"), str):
            return base64.b64decode(body["base64"])
        raise RuntimeError("whoop webhook: the request carries no body")


    def _accounts_for(host, cfg, user_id):
        """Every account whose `user` reference is this WHOOP member's row, with
        that row's id."""
        out = []
        for acct in cfg.get("accounts") or []:
            aid = acct.get("id")
            if not aid:
                continue
            rid = _rid(host, aid, "user", user_id)
            have = _ref_path((acct.get("properties") or {}).get("user"))
            if have in (USER_KIND + "/" + rid, rid):
                out.append((acct, rid))
        return out


    class _Rows:
        """Stages the rows one account produces for the event, and what it did,
        for the output."""

        def __init__(self, host, acct, user_rid):
            self.host = host
            self.acct = acct
            self.aid = acct["id"]
            self.user_rid = user_rid
            # {(kind, row id): the row as read before WHOOP was asked}
            self.before = {}
            self.wrote = []
            self.kept = []
            self.deleted = []
            self.marked = []
            self.held = ""

        def staged(self):
            """Whether anything was staged for this account."""
            return bool(self.wrote or self.deleted or self.marked or self.held)

        def read(self, kind, rid):
            """Read a row BEFORE the WHOOP read whose answer will be written
            over it: a write or deletion that commits after this read moves
            the version the write is staged under."""
            self.before[(kind, rid)] = self.host.records.get(kind, rid)

        def write(self, kind, rid, props):
            """Stage the row under the version `read` saw, live, deleted or
            absent (`whoop_mirror.write_row`)."""
            if (kind, rid) not in self.before:
                raise ValueError("WHOOP answered with %s %s, which this event "
                                 "did not name" % (kind.rsplit("/", 1)[-1], rid))
            if not _write_row(self.host, kind, rid, props,
                              self.before[(kind, rid)]):
                # An answer older than the row: a later write already landed.
                self.kept.append(kind + "/" + rid)
                return
            self.wrote.append(kind + "/" + rid)

        def mark(self, kind, rid):
            """Ask the next sync to read a row back: set `refreshRequestedAt`
            under the row's version. False when there is no live row to mark,
            or this delivery already wrote it."""
            if kind + "/" + rid in self.wrote:
                return False
            row = self.host.records.get(kind, rid)
            if row is None or row.get("deletedAt"):
                return False
            now = _dt.datetime.now(_dt.timezone.utc).strftime("%Y-%m-%dT%H:%M:%S.%fZ")
            self.host.effects.patch(kind, rid, properties={REFRESH_MARK: now},
                                    if_version=self.host.version(row))
            self.marked.append(kind + "/" + rid)
            return True

        def hold(self, until):
            """Set the account's `retryNotBefore` to the instant a 429 named."""
            self.host.effects.patch(self.acct.get("kind") or ACCOUNT_KIND,
                                    self.aid, properties={"retryNotBefore": until})
            self.held = until

        def delete(self, kind, rid):
            """Deleting a row that was never written fails the whole delivery,
            so the row is read first, and one already deleted is left alone."""
            row = self.host.records.get(kind, rid)
            if row is None or row.get("deletedAt"):
                return
            self.host.effects.delete(kind, rid)
            self.deleted.append(kind + "/" + rid)

        def recovery(self, rec):
            self.write(*recovery_row(self.host, self.aid, self.user_rid, rec))

        def sleep(self, rec):
            self.write(*sleep_row(self.host, self.aid, self.user_rid, rec))

        def workout(self, rec):
            self.write(*workout_row(self.host, self.aid, self.user_rid, rec))


    # --------------------------------------------------------------- the events

    def _recoveries_of(host, aid, sleep_rid):
        """The recovery rows whose `sleep` is this sleep row: a recovery event
        names the sleep, and the row is keyed on the cycle."""
        page = host.records.list(RECOVERY_KIND,
                                 where={"account": {"eq": aid},
                                        "sleep": {"eq": sleep_rid}},
                                 first=10)
        return [str(ent.get("id") or "") for ent in page.get("records") or []
                if ent.get("id")]


    def _deleted(host, rows, obj, oid):
        aid = rows.aid
        if obj == "recovery":
            for rid in _recoveries_of(host, aid, _rid(host, aid, "sleep", oid)):
                rows.delete(RECOVERY_KIND, rid)
            return
        rows.delete(KINDS[obj], _rid(host, aid, obj, oid))


    def _updated(host, base, token, rows, obj, oid, props):
        """Read the object back and rewrite its row. Each row is read before
        the WHOOP read its write carries (`_Rows.read`)."""
        aid = rows.aid
        quoted = _quote(oid, safe="")
        if obj != "recovery":
            rid = _rid(host, aid, obj, oid)
            rows.read(KINDS[obj], rid)
            try:
                rec = _get(base, token, READ_BACK[obj] % quoted)
            except _NotFound:
                rows.delete(KINDS[obj], rid)
                return
            getattr(rows, obj)(rec)
            return
        # A recovery event names its SLEEP: the sleep says which cycle, and the
        # cycle is how WHOOP addresses the recovery.
        sleep_rid = _rid(host, aid, "sleep", oid)
        rows.read(SLEEP_KIND, sleep_rid)
        try:
            srec = _get(base, token, READ_BACK["sleep"] % quoted)
        except _NotFound:
            # WHOOP deletes a recovery with its sleep.
            for rid in _recoveries_of(host, aid, sleep_rid):
                rows.delete(RECOVERY_KIND, rid)
            rows.delete(SLEEP_KIND, sleep_rid)
            return
        cid = srec.get("cycle_id")
        if cid in (None, ""):
            raise ValueError("sleep %s carries no cycle_id" % oid)
        if props.get(TOGGLES["sleep"]):
            rows.sleep(srec)
        recovery_rid = _rid(host, aid, "recovery", cid)
        rows.read(RECOVERY_KIND, recovery_rid)
        try:
            rrec = _get(base, token, "/v2/cycle/%s/recovery"
                        % _quote(str(cid), safe=""))
        except _NotFound:
            rows.delete(RECOVERY_KIND, recovery_rid)
            return
        rows.recovery(rrec)


    def _mark_named(host, rows, obj, oid, props):
        """Mark every live row the event names for the sync to read back: the
        sleep's or the workout's own row, or a recovery event's recovery rows
        and, with sleeps on, its sleep row. Whether the event's own object was
        marked: for a recovery event that is a recovery row, because the sync
        reads a marked sleep back as a sleep and never asks for its recovery."""
        aid = rows.aid
        if obj != "recovery":
            return rows.mark(KINDS[obj], _rid(host, aid, obj, oid))
        sleep_rid = _rid(host, aid, "sleep", oid)
        marked = False
        for rid in _recoveries_of(host, aid, sleep_rid):
            marked = rows.mark(RECOVERY_KIND, rid) or marked
        if props.get(TOGGLES["sleep"]):
            rows.mark(SLEEP_KIND, sleep_rid)
        return marked


    def _defer(host, rows, obj, oid, props, why):
        """An update this delivery cannot read now: mark the rows it names, or,
        with no row of the object to mark, keep the request."""
        if _mark_named(host, rows, obj, oid, props):
            return "marked for the sync to read back: " + why
        raise _Keep("%s, and the mirror holds no %s row to mark; keeping the "
                    "request for a retry" % (why, obj))


    def _receive(host, cfg, rows, obj, action, oid):
        """One account's handling of the event, staged on `rows`: why it did
        less than the event asked, or "". Raises when the request must be
        kept for this account."""
        acct = rows.acct
        props = acct.get("properties") or {}
        if props.get("syncPaused"):
            return "the account is paused"
        if action == "deleted":
            # A deletion needs no read, and the row mirrors an object that no
            # longer exists whichever toggles are on now.
            _deleted(host, rows, obj, oid)
            return ""
        if not props.get(TOGGLES[obj]):
            return "the %s toggle is off" % TOGGLES[obj]
        if acct.get("tokenError") or not acct.get("token"):
            return _defer(host, rows, obj, oid, props,
                          "the account has no live token")
        if _held(props):
            return _defer(host, rows, obj, oid, props,
                          "WHOOP asked to wait until %s" % props["retryNotBefore"])
        base = _api_base(cfg)
        _check_origin(base)
        try:
            _updated(host, base, acct["token"], rows, obj, oid, props)
        except _Refused as e:
            # A reconnect changes a 401 or a 403; a retry before it does not.
            if _mark_named(host, rows, obj, oid, props):
                return "marked for the sync to read back: " + str(e)
            return str(e)
        except _RateLimited as e:
            # Every path of this account waits for the instant WHOOP named:
            # the next delivery marks instead of asking, and the sync does not
            # start before it.
            rows.hold(e.retry_at)
            return _defer(host, rows, obj, oid, props, str(e))
        except _Transient as e:
            return _defer(host, rows, obj, oid, props, str(e))
        return ""


    def main(input, host):
        cfg = input.get("config") or {}
        envelope = input.get("envelope") or {}
        request = envelope.get("request")
        if not isinstance(request, dict):
            raise RuntimeError("whoop webhook: the delivery carries no request; "
                               "the whoop-webhook trigger is what fires this")
        body = _body_bytes(request)
        try:
            event = json.loads(body.decode("utf-8"))
        except (UnicodeDecodeError, ValueError):
            raise RuntimeError("whoop webhook: the body is not JSON") from None
        if not isinstance(event, dict):
            raise RuntimeError("whoop webhook: the body is not a JSON object")

        etype = str(event.get("type") or "")
        obj, _, action = etype.partition(".")
        oid = str(event.get("id") or "")
        uid = event.get("user_id")
        if obj not in TOGGLES or action not in ("updated", "deleted") or not oid \
                or uid in (None, ""):
            return {"output": {"skipped": "not an event this receiver acts on",
                               "type": etype[:60]}}
        matched = _accounts_for(host, cfg, uid)
        # A later page of this delivery: only the accounts an earlier page
        # could not finish.
        cur = host.page.resume()
        retry = None
        if isinstance(cur, dict) and isinstance(cur.get("retry"), list):
            retry = [str(a) for a in cur["retry"]]
            matched = [(acct, r) for acct, r in matched if acct["id"] in retry]
        if not matched:
            return {"output": {"skipped": "no connected account is this WHOOP "
                                          "member", "type": etype}}
        out = {"type": etype, "accounts": [acct["id"] for acct, _ in matched],
               "wrote": [], "kept": [], "deleted": [], "marked": []}
        reasons = []
        failed = []
        staged = False
        for acct, user_rid in matched:
            rows = _Rows(host, acct, user_rid)
            try:
                why = _receive(host, cfg, rows, obj, action, oid)
            except Exception as e:                                  # noqa: BLE001
                # Isolated: the other accounts still act on the event.
                failed.append((acct["id"], str(e) or type(e).__name__))
                why = ""
            staged = staged or rows.staged()
            for key in ("wrote", "kept", "deleted", "marked"):
                out[key].extend(getattr(rows, key))
            if why:
                reasons.append(why if len(matched) == 1
                               else "%s: %s" % (acct["id"], why))
        if failed:
            # A first page commits whatever it staged (the other accounts' rows,
            # a 429's hold); a later page only when it finished an account, so
            # the chain shrinks every page and ends.
            progress = staged if retry is None else len(failed) < len(matched)
            keep = [aid for aid, _ in failed]
            if progress:
                host.log("whoop webhook: committing what this page staged; "
                         "trying %s again" % ", ".join(keep))
                return {"more": host.page.more({"retry": keep})}
            raise RuntimeError("whoop webhook: " + "; ".join(
                why if len(matched) == 1 else "%s: %s" % (aid, why)
                for aid, why in failed))
        if reasons:
            out["skipped"] = "; ".join(reasons)
        return {"output": out}
