# one occurrence of a recurring workout, completed or skipped
kind: core.substrate.reamde.dev/kind
metadata:
  id: fitness.substrate.reamde.dev/workoutlog
data:
  authority: fitness.substrate.reamde.dev
  description: >-
    The done-or-skipped mark against one occurrence of a recurring
    workout. There is deliberately no missed state: absence in the logs is
    what missed means, so a reader computes it from the RRULE. What was
    actually lifted lives on the workout's sets, not here.
  names:
    singular: workoutlog
    plural: workoutlogs
  displayTemplate: "{status}"
  # `at` is when the occurrence was completed or the skip was recorded.
  traits:
    - temporal(point)
  properties:
    status:
      type: state
      description: "completed or skipped; correcting a mis-tap flips it back"
      states:
        - completed
        - skipped
      initial: completed
      transitions:
        - from: completed
          to: skipped
        - from: skipped
          to: completed
    scheduledAt:
      type: datetime
      description: the occurrence this log answers, from expanding the RRULE
    details:
      type: markdown
      description: anything worth saying about this occurrence, as prose
  edges:
    workout:
      to: workout
      required: true
      ownerRef: true
      description: the recurring workout this log marks an occurrence of
