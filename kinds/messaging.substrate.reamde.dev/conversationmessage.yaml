# one message in a conversation; outbound ones walk the delivery states
kind: core.substrate.reamde.dev/kind
metadata:
  id: messaging.substrate.reamde.dev/conversationmessage
data:
  authority: messaging.substrate.reamde.dev
  description: >-
    One message in a conversation, inbound or outbound. A synced message is
    created `received` and never moves; anything you mean to send starts as
    a `draft` and walks the send path, so composing and delivery are one record
    rather than two systems.
  # The declaration inherited the authority's version before this pin.
  # version 2: `sentAt` is a declared property (datetime). The sent
  # transition stamped it as an undeclared string before.
  version: 3
  names:
    singular: conversationmessage
  traits:
    - temporal(point)
  # `{snippet}` is the engine's computed excerpt, not a property.
  displayTemplate: "{author.name}: {snippet}"
  properties:
    text:
      type: markdown
      embed: true
      description: the message body, as markdown
    # mneme's owed-reply signals, stamped at ingestion: whether the owner
    # wrote it, is named in it, or is being asked something by it. They are
    # writer-computed facts, not engine derivations, and an agent deciding
    # "do I owe a reply" reads these instead of re-parsing every message.
    fromOwner:
      type: bool
      description: the owner sent it
    mentionsOwner:
      type: bool
      description: the message names the owner
    directedAtOwner:
      type: bool
      description: the message expects the owner to answer
    # inbound and outbound in one state: a synced message is created
    # `received` and never moves, while anything meant to be sent is created
    # as a `draft` and walks the send path. A creating write names the state
    # it wants; one that names none gets `received`.
    delivery:
      type: state
      description: "received for synced messages; a draft walks queued, sending,
        sent"
      states:
        - received
        - draft
        - queued
        - sending
        - sent
        - failed
      initial: received
      transitions:
        - from: draft
          to: queued
        - from: queued
          to: sending
        - from: sending
          to: sent
          stamps:
            sentAt: now
        - from: sending
          to: failed
        - from: failed
          to: queued
    # Stamped by the sent transition above. Not managed: a sync creating a
    # message already sent supplies its own time.
    sentAt:
      type: datetime
      description: when the send completed, stamped by the transition
  edges:
    conversation:
      to: conversation
      required: true
      ownerRef: true
      description: the conversation this message belongs to
    author:
      to: person
      required: true
      description: the person who sent it
    mentions:
      to: person
      many: true
      description: the people the message mentions
    replyTo:
      to: conversationmessage
      description: the message this one replies to
    threadRoot:
      to: conversationmessage
      description: the thread's first message, for cheap whole-thread queries
