# one mail thread
kind: core.substrate.reamde.dev/kind
metadata:
  id: messaging.substrate.reamde.dev/emailthread
data:
  authority: messaging.substrate.reamde.dev
  description: >-
    One mail thread: its subject and everyone on it, plus the account it synced
    through where a connector brought it in. Messages point here, so the thread
    is what a reader lists and the messages are what they open.
  # The declaration inherited the authority's version before this pin.
  # version 2: the `account` edge is no longer `required` (issue 124), so a
  # thread can be authored without a provider behind it.
  version: 2
  names:
    singular: emailthread
    plural: emailthreads
  displayTemplate: "{subject}"
  # `at` is the last message's time, so an inbox orders threads without
  # opening their messages.
  traits:
    - temporal(point)
  properties:
    subject:
      type: string
      description: the thread's subject
  edges:
    # An owner edge, never required (decision 0016): the edge is what a
    # disconnect cascades along, and requiring it would leave this kind
    # writable only by a connector.
    account:
      to: any
      ownerRef: true
      description: the accountconfig record this thread synced through, absent
        on a thread written by hand
    participants:
      to: person
      many: true
      description: everyone on the thread
