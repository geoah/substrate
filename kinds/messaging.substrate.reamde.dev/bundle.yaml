# The shipped vocabulary, subsystem 2: things people say to each other.
# Shipped, but not SEEDED — a VOCABULARY BUNDLE a repository imports (the
# bundle document is at the foot of this file), and it requires people.
# Chat and mail stay separate families because their shapes differ (a chat
# message is one line in a stream, a mail message carries a subject and a
# thread), and both prefix their family name so neither bare `message` nor
# bare `thread` can be mistaken for the other's.
#
# People and plumbing live elsewhere: authors and participants are `person`
# in people.substrate.reamde.dev, the account is a bundle-owned accountconfig record (ruling A12; the
# retired `connectoraccount` core kind is gone). Those edges
# name the person; a reference naming a source record instead — a `slackuser`,
# say — lands on the person that record points at, in one hop (§6.2). The
# structural edges stay in the family — a message to its conversation or
# thread, a reply to its parent.
#
# no new actors: the doors and the substrate ship with core; an installed
# authority's writes arrive under the actor of whatever runs — a bundle
# function writes as `function:<authority>:<name>` — so nothing here declares
# an actor.
kind: core.substrate.reamde.dev/authority
metadata:
  id: messaging.substrate.reamde.dev
data:
  version: 1
---
# ---- the bundle document: the import unit -------------------------------------
# A VOCABULARY bundle (see people.substrate.reamde.dev): kinds only, imported from the
# registry rather than seeded. It maps onto people, so it requires that
# authority to be present first.
kind: core.substrate.reamde.dev/bundle
metadata:
  id: messaging.substrate.reamde.dev/messaging
data:
  authority: messaging.substrate.reamde.dev
  description: >-
    Chat and mail — conversations, conversation messages, email threads and
    email messages, with every author and participant pointing at a person.
  requires:
    - people.substrate.reamde.dev
  installs:
    - messaging.substrate.reamde.dev/conversation
    - messaging.substrate.reamde.dev/conversationmessage
    - messaging.substrate.reamde.dev/emailmessage
    - messaging.substrate.reamde.dev/emailthread
