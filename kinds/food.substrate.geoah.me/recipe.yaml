# instructions for a dish
kind: core.substrate.reamde.dev/kind
metadata:
  id: food.substrate.geoah.me/recipe
data:
  authority: food.substrate.geoah.me
  description: >-
    Instructions for one dish: where it came from, how long it takes, how
    many it feeds, and the steps as prose. Cooking it is a meal pointing
    here, so the recipe never accumulates history.
  names:
    singular: recipe
    plural: recipes
  displayTemplate: "{name}"
  properties:
    name:
      type: string
      required: true
      description: the dish's name
    cuisine:
      type: string
      description: the cuisine it belongs to
    servings:
      type: int
      min: 1
      description: how many the stated quantities feed
    prepTime:
      type: duration
      description: hands-on time before cooking, 25m or 1h10m
    cookTime:
      type: duration
      description: time on the heat or in the oven
    url:
      type: url
      description: where the recipe came from
    instructions:
      type: markdown
      embed: true
      description: ingredients and steps, as prose
