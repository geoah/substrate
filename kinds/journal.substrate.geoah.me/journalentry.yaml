# one day's reflection
kind: core.substrate.reamde.dev/kind
metadata:
  id: journal.substrate.geoah.me/journalentry
data:
  authority: journal.substrate.geoah.me
  description: >-
    One day's reflection: a heading and the prose. One entry per day is the
    convention, not a constraint; the timeline anchor is the day written
    about, which is not always the day of writing.
  names:
    singular: journalentry
    plural: journalentries
  displayTemplate: "{name}"
  # `at` is the day the entry is about.
  traits:
    - temporal(point)
  properties:
    name:
      type: string
      required: true
      description: the entry's heading, one line
    reflection:
      type: markdown
      embed: true
      description: the entry itself, as prose
