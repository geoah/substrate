# Shipped vocabulary ported from mneme v4: places worth remembering.
# One kind on purpose: a place is a name, a category, coordinates and the
# practical strings, and everything that happens AT a place lives on the
# records that point at it.
#
# no new actors: writes arrive under the actor of whatever runs.
kind: core.substrate.reamde.dev/authority
metadata:
  id: places.substrate.reamde.dev
data:
  # v1alpha2: THE TYPED CORE SWEEP. This closure moved to the declared
  # spellings — a tool entry names its arm, a function's IO is a flat argument
  # list and its grants ride `data` itself, a mapping rule is `{path}`, an index
  # names its properties — so every declaration in it changed shape.
  version: v1alpha2
---
# ---- the bundle document: the import unit -----------------------------------
# A VOCABULARY bundle: kinds only, imported from the registry.
kind: core.substrate.reamde.dev/bundle
metadata:
  id: places.substrate.reamde.dev/places
data:
  authority: places.substrate.reamde.dev
  description: >-
    Places worth remembering: a name, a category, coordinates bounded to the
    globe, and the practical strings for actually going there.
  installs:
    - places.substrate.reamde.dev/place
