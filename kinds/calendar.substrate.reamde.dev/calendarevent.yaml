# always a CONCRETE occurrence; connectors explode series into these
kind: core.substrate.reamde.dev/kind
metadata:
  id: calendar.substrate.reamde.dev/calendarevent
data:
  authority: calendar.substrate.reamde.dev
  names:
    singular: calendarevent
    plural: calendarevents
  traits:
    - temporal(range)
  displayTemplate: "{summary}"
  properties:
    # iCalendar's SUMMARY/LOCATION/DESCRIPTION, kept under their own names.
    summary:
      type: string
      description: iCalendar's SUMMARY — the event's title line
    location:
      type: string
      description: iCalendar's LOCATION, as written
    description:
      type: markdown
      embed: true
      description: iCalendar's DESCRIPTION — the event's prose
    # the provider's lifecycle value, confirmed or tentative ONLY: a
    # cancelled event is a DELETE of this record — connectors retract, so a
    # reader never filters tombstones.
    status:
      type: string
      description: confirmed or tentative; a cancelled event is deleted instead
    meetingURL:
      type: url
      description: the video-conference join link, when the event carries
        one
    eventType:
      type: string
      description: the provider's event kind — default, outOfOffice, focusTime,
        workingLocation
  edges:
    calendar:
      to: calendar
      required: true
      ownerRef: true
      description: the calendar this occurrence lives in
    series:
      to: calendareventseries
      description: the recurring definition this occurrence was exploded from
    attendees:
      to: person
      many: true
      description: the people attending
    organizer:
      to: person
      description: the person who organized it
