# one provider calendar
kind: core.substrate.reamde.dev/kind
metadata:
  id: calendar.substrate.reamde.dev/calendar
data:
  authority: calendar.substrate.reamde.dev
  description: >-
    One provider calendar: the container its events and series live in. It
    hangs off the account record it synced through, so disconnecting that
    account takes the calendar and everything under it along.
  names:
    singular: calendar
  displayTemplate: "{name}"
  properties:
    name:
      type: string
      description: the calendar's name
    timezone:
      type: timezone
      description: the calendar's default timezone
    # The account this calendar synced through. `trait: accountconfig` pins any
    # bundle's account kind (google, notion, beeper, …) rather than one, because
    # a calendar is provider-agnostic; `onDelete: cascade` makes disconnecting
    # that account collect the calendar and everything under it (0034, 0032).
    # Optional: a person may hand-author a calendar that synced through nothing.
    account:
      type: reference
      trait: accountconfig
      onDelete: cascade
      displayName: Account
      description: the accountconfig record this calendar synced through
