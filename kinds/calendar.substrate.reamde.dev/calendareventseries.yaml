# the recurring DEFINITION — RRULE and exceptions, never on the timeline
kind: core.substrate.reamde.dev/kind
metadata:
  id: calendar.substrate.reamde.dev/calendareventseries
data:
  authority: calendar.substrate.reamde.dev
  description: >-
    The recurring DEFINITION behind repeating events: its RRULE and the dates
    that rule skips. It never sits on the timeline itself — the substrate
    stores the rule and never expands it, and the occurrences are calendarevents
    pointing back here.
  names:
    singular: calendareventseries
    plural: calendareventseries
  displayTemplate: "{summary}"
  # `recurring` contracts the recurrence/exdates/timezone triple. The series is
  # the DEFINITION and never sits on the timeline, so it binds no `temporal`.
  traits:
    - recurring
  properties:
    summary:
      type: string
      description: the series' title line
    # the substrate stores an RRULE and never expands it: occurrences arrive
    # as `calendarevent`s from the connector that exploded them.
    recurrence:
      type: recurrence
      description: the RRULE, stored and never expanded
    exdates:
      type: datetime
      repeated: true
      description: occurrence datetimes the rule skips
    timezone:
      type: timezone
      description: the IANA zone a time-of-day rule resolves in
  edges:
    calendar:
      to: calendar
      required: true
      ownerRef: true
      description: the calendar the series lives in
