# The `environment` catalogue: the well-known climate and energy metrics, for a
# home, a weather station or an energy meter to map its readings into (decision
# record 0192). Metrics only: the values are the seeded observations package's
# `observation` and `trace` rows, so this package declares no kinds.
kind: substrate.reamde.dev/core/package
metadata:
  id: substrate.reamde.dev/environment
data:
  authority: substrate.reamde.dev
  package: environment
  # 1: the six metrics the observations sample shipped unprefixed
  # (`air_temperature`, `relative_humidity`, `illuminance`,
  # `atmospheric_pressure`, `energy`, `power`), now `environment/*`.
  version: 1
---
kind: substrate.reamde.dev/core/bundle
metadata:
  id: substrate.reamde.dev/environment
data:
  authority: substrate.reamde.dev
  package: environment
  description: >-
    Climate and energy metrics: temperature, humidity, light, air pressure,
    energy and power, for any home, weather station or meter to report into.
  installs: []
