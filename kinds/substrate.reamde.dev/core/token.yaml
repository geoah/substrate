# one bearer credential — a RECORD, holding the hash and never the secret
kind: substrate.reamde.dev/core/kind
metadata:
  id: substrate.reamde.dev/core/token
data:
  authority: substrate.reamde.dev
  package: core
  description: >-
    One bearer credential: a label, the SHA-256 of a secret shown once at
    mint, an optional expiry and, on a token an app received, the scopes the
    owner approved and the app's client id. A token without scopes has full
    access to its repository; sessions are these records, login mints one,
    and revoking one is an ordinary record delete.
  version: 12
  purpose: internal
  names:
    singular: token
  # A token WITHOUT `scopes` has full access to its repository (decision
  # record 0143), which is every session, script and device token. A token an
  # app received through the authorization flow carries the scopes the owner
  # approved on the approval page, and the API and the engine hold it to them
  # (decision records 0194 and 0195). The secret itself is never stored:
  # the record holds its SHA-256.
  #
  # Minting is the auth endpoints' (attributed to the substrate) and the
  # generic surface refuses writes to this kind, but REVOKING is an ordinary
  # record delete, so the tokens page, substratectl and the DELETE endpoint
  # are all the same write.
  displayTemplate: "{label}"
  properties:
    label:
      type: string
      required: true
      description: what the token is for, chosen at mint
    hash:
      type: digest
      required: true
      description: the SHA-256 of the secret; the secret itself is shown once,
        at mint
    expiresAt:
      type: datetime
      description: when the token stops authenticating; absent = until deleted
    scopes:
      type: string
      repeated: true
      description: what an app's token reaches, as `read:` and `write:` entries
        over kinds and `agents:` and `decide:` entries over agents; absent
        = full access, never empty
    clientId:
      type: url
      description: the client id URL of the app the token was minted for
    clientName:
      type: string
      description: the name the app claimed for itself when the owner approved
        it
    # What the approval proved about the app (decision record 0209), which
    # its actor is derived from: `app:<appAuthority>` when its publisher was
    # verified, `app:local` when its access went to a program on the owner's
    # device, `app:<client id host>` otherwise.
    appAuthority:
      type: string
      managed: true
      description: the authority verified as the app's publisher when the
        owner approved it; absent when nothing verified one
    appAuthorityFromFile:
      type: bool
      managed: true
      description: true when a file the server was configured to read (SUBSTRATE_INSECURE_AUTHORITY_DOCS),
        not the authority's DNS, vouched for appAuthority
    appLocal:
      type: bool
      managed: true
      description: true when the approval sent the access to a program on
        the owner's device, through a loopback redirect
    # Deprecated and no longer read: retained so old token records remain
    # valid after the agent authorization detail was retired (decision 0214).
    agents:
      deprecated: true
      type: object
      repeated: true
      description: the agents the owner approved this app to declare, with
        what each may read and write and spend a day
      fields:
        agent:
          type: string
          required: true
          description: the agent's id, <authority>/<package>/<name>
        reads:
          type: string
          repeated: true
          description: the kinds it may read, each named in full
        writes:
          type: string
          repeated: true
          description: the kinds it may write, each named in full
        spendCentsPerDay:
          type: int
          required: true
          min: 1
          max: 200
          description: the most it may spend in 24 hours, in cents
    appPackages:
      type: int
      keyed: true
      min: 1
      managed: true
      description: the package version floors this app build asked for
    appSoftwareVersion:
      type: string
      max: 64
      managed: true
      description: the app build's own version, at most 64 printable characters
    appCheckedAt:
      type: datetime
      managed: true
      description: when this app build last checked its set up
    appAddons:
      type: object
      repeated: true
      managed: true
      description: the optional packages waiting for a provider
      fields:
        package:
          type: string
          required: true
        version:
          type: int
          required: true
          min: 1
        addonFor:
          type: string
          required: true
