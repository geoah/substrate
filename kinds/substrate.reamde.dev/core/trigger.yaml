# One delivery binding: a source → one callable. The engine admits every
# write of this type (engine/triggers.go): `source` carries exactly one arm —
#
#   record:   {kinds: [<kind reference> | <authority>/<package>/* |
#             <authority>/* | *], ops: [create|update|delete],
#             when: <CEL guard over change/record/repository>,
#             coalesce: bool, fromStart: bool}
#   schedule: {recurrence: <RRULE>, timezone: <IANA name>, startsAt?: RFC3339}
#   webhook:  {key?: <16..128 url-safe chars>,
#             headers?: [<header name>],
#             signature?: {algorithm, signatureHeader, timestampHeader?,
#                          timestampUnit?, maxSkew?, message?, encoding,
#                          secret},
#             maxBody?: <1..8388608 bytes>}
#                                               # a public endpoint
#
# A webhook arm is reached at POST /webhooks/{authority}/{trigger}, where the
# authority is the repository's own. With no key it is open to anyone who can
# reach the server; with one, the request carries it as a trailing path
# segment, as `?key=`, or as `Authorization: Bearer`. The
# callable receives the request (method, headers, query, body or parsed
# multipart parts) under the envelope's `request` (decision record 0045).
# THE RECORD DECLARES WHICH HEADERS ARRIVE: `headers` lists the names this
# trigger's callable reads, matched case-insensitively, and a fire carries
# those and the ones that describe the body (`content-type`,
# `content-length`, `content-encoding`, `user-agent`, `date`) and nothing
# else (decision record 0097). `signature` is a provider's HMAC the door
# checks before it stores anything, against a secret the host resolves and
# no callable is handed (decision record 0164).
#
# `arguments`, on a schedule trigger only, is the map of named arguments each
# fire hands the function as `input["args"]` (decision record 0110),
# and `callable` is a `reference` naming the registered function or agent a
# matched delivery invokes: ONE path, `<kind>/<id>` — the kind
# substrate.reamde.dev/core/function or substrate.reamde.dev/core/agent, the id the callable that
# dispatch resolves. The trigger owns its cursor:
# a new trigger starts at head, replay is a cursor reset, park-and-advance
# and manual run are per-trigger verbs.
kind: substrate.reamde.dev/core/kind
metadata:
  id: substrate.reamde.dev/core/trigger
data:
  authority: substrate.reamde.dev
  package: core
  description: >-
    One delivery binding: a source — matched records, a schedule, or a webhook
    — bound to the one function or agent it invokes. The trigger owns its
    cursor, so enabling, replay, parking and manual runs are all verbs on
    this row.
  # `source` is one object field per arm and carries no discriminator: the
  # arm present names the source.
  # version 23: `source.webhook.signature`, the provider signature the door
  # checks (decision record 0164).
  # version 24: `source.webhook.maxBody`, the inline bytes a delivery may
  # carry when the trigger needs more than the door's 1 MiB default, and
  # `source.record.fromStart`, a cursor that starts at the changelog's start.
  # version 25: `source.webhook.signature.timestampUnit`, the unit of the
  # signed timestamp, required beside a `timestampHeader`.
  version: 25
  purpose: internal
  names:
    singular: trigger
  # A row reads as its label, and a row without one as the callable it
  # delivers to: several triggers may share one callable, so the callable
  # alone cannot tell them apart.
  displayTemplate: "{label|callable}"
  properties:
    label:
      type: string
      description: a short name for this trigger; when set, the record's title
        reads it instead of the callable
    enabled:
      type: bool
      description: whether the dispatcher delivers for this trigger; false
        stops execution without losing the cursor
    # EXACTLY ONE ARM: the arm that is present names the source, and
    # engine/triggers.go refuses a source that carries more than one (it owns
    # that gate, as it owns the RRULE and the CEL guard). `required` is the
    # declared half of the same rule: the dispatcher never runs a trigger
    # without a source, so a write that leaves one out is refused.
    source:
      type: object
      required: true
      description: the one source this trigger delivers from
      fields:
        record:
          type: object
          description: matched records — the changelog is the source
          fields:
            kinds:
              type: string
              repeated: true
              description: the kinds watched, each a reference, `<authority>/<package>/*`,
                `<authority>/*` or `*`
            # A CHANGE CLASS, not a write verb: what happened to the record,
            # whatever op the writer called. runner.OpOf folds the changelog
            # onto these three. A put whose payload says `created` is a create,
            # delete and gc are deletes, and every other op (patch, merge,
            # split, a restoring put) is an update. So a policy
            # selector matching the same write spells it `put` or `patch`;
            # docs/changelog.md#change-verbs holds the mapping.
            ops:
              type: enum
              repeated: true
              values:
                - create
                - update
                - delete
              description: 'which changes deliver, as change classes rather
                than write verbs: create, update or delete; absent is all
                three'
            when:
              type: string
              description: the CEL guard over change/record/repository
            coalesce:
              type: bool
              description: collapse a burst on one record into one delivery
            # Read once, when the trigger is created (or restored): an edit
            # never moves the cursor, and a later replay is the verb. An
            # adapter sample sets it so an import after its provider synced
            # converts the rows already there.
            fromStart:
              type: bool
              description: start the cursor at the changelog's start when
                the trigger is created, so it delivers the matching changes
                already written as well as those that follow; absent, it starts
                at the head
        schedule:
          type: object
          description: a recurrence — the clock is the source
          fields:
            recurrence:
              type: recurrence
              description: the RFC 5545 RRULE the fires follow
            timezone:
              type: timezone
              description: the IANA zone the recurrence is read in
            startsAt:
              type: datetime
              description: the instant the recurrence counts from
        # A public endpoint. Every field is optional. `key`: absent, the
        # endpoint accepts every POST that reaches the server (a substrate
        # on a private network wants exactly that); present, a request must
        # carry it. The alphabet is URL-safe so the key can sit in a path
        # segment without escaping. `signature`: the provider's HMAC, which
        # the door verifies before the request is stored, against a secret
        # the host resolves and never hands the callable; a callable verifies
        # only what the door cannot (decision record 0164).
        # `headers`: the names the callable reads, since an undeclared header
        # never reaches it and never enters the changelog. The door refuses
        # `authorization`, `proxy-authorization`, `cookie` and `set-cookie` by
        # name (it never forwards a credential it was reached with), and
        # `host` and `transfer-encoding`, which the HTTP server consumes before
        # any handler sees a request.
        webhook:
          type: object
          description: a public endpoint the callable receives requests from
          fields:
            key:
              type: string
              pattern: "^[A-Za-z0-9_-]{16,128}$"
              description: the optional credential a request must carry, in
                the path, as `?key=` or as a bearer header
            headers:
              type: string
              repeated: true
              pattern: "^[A-Za-z0-9-]{1,64}$"
              description: the header names this trigger's callable reads,
                matched case-insensitively, at most 32; a fire also keeps
                `content-type`, `content-length`, `content-encoding`, `user-agent`
                and `date` if present
            # engine/webhooksignature.go holds the rest of the shape: the
            # message names `{body}` once and `{timestamp}` exactly when a
            # timestampHeader is declared, timestampUnit is required beside a
            # timestampHeader and refused without one, maxSkew needs a
            # timestampHeader and sits between PT1S and PT1H, and a multipart
            # request is refused because the door keeps no raw body to sign.
            signature:
              type: object
              description: the provider's signature over each request, which
                the door checks before it stores anything; a request that
                fails it is answered 404, or 401 if it carried the trigger's
                key
              fields:
                # A string and not an enum: an enum value is one lowercase
                # word, and the algorithm's name carries a hyphen.
                algorithm:
                  type: string
                  pattern: "^hmac-sha256$"
                  description: the MAC the provider computes; `hmac-sha256`
                    is the one the door knows
                signatureHeader:
                  type: string
                  pattern: "^[A-Za-z0-9-]{1,64}$"
                  description: the header the provider puts the signature
                    in
                timestampHeader:
                  type: string
                  pattern: "^[A-Za-z0-9-]{1,64}$"
                  description: the header carrying the signed Unix time; absent
                    when the provider signs none
                # Declared, never read off the value's size: with
                # `{timestamp}{body}`, 10 digits as seconds and 13 as
                # milliseconds sign the same bytes.
                timestampUnit:
                  type: enum
                  values:
                    - seconds
                    - milliseconds
                  description: the unit of the signed Unix time, required
                    beside a `timestampHeader`
                maxSkew:
                  type: duration
                  description: how far the signed time may sit from when the
                    door received the request; PT5M when absent
                message:
                  type: string
                  description: the signed bytes as a template over `{timestamp}`
                    and `{body}`, the request's raw content byte-exact (`{timestamp}.{body}`);
                    `{body}` when absent
                encoding:
                  type: enum
                  values:
                    - hex
                    - base64
                  description: how the signature header spells the MAC
                secret:
                  type: string
                  description: the signing key, `substrate.reamde.dev/core/secret/<id>`
                    for a secret record or `oauthClientSecret` for the client
                    secret of the callable's bundle's OAuth client
            # The door reads the trigger before the body, so a sender that
            # names no trigger, or a keyed one without its key, is held to
            # the default. A function reads the body whole in memory, which is
            # why the bound stops at 8 MiB; an agent callable reads at most
            # 1 MiB whatever this says.
            maxBody:
              type: int
              min: 1
              max: 8388608
              description: the bytes a request may carry inline, its content
                or a multipart request's text parts together; 1048576 (1 MiB)
                when absent, at most 8388608 (8 MiB)
    # A json property rather than a field of `source.schedule`: a field is
    # declared shape, and these values take the CALLABLE's shape, which
    # engine/triggers.go holds to the function's declared `arguments:` at
    # write time and at every fire. Admitted on a schedule source to a
    # function only (decision record 0110).
    arguments:
      type: json
      description: the named arguments every schedule fire hands the function
        as `input["args"]`, checked against its declared `arguments:`
    callable:
      type: reference
      kind: any
      required: true
      description: the function or agent a matched delivery invokes, as its
        `<kind>/<id>` path
