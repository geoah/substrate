# the user's login credential — a RECORD, holding no secret material
kind: substrate.reamde.dev/core/kind
metadata:
  id: substrate.reamde.dev/core/credential
data:
  authority: substrate.reamde.dev
  package: core
  description: >-
    The user's one login credential, id `self`: the repository it admits to
    and sealed-store refs to the password hash and the TOTP seed, never the
    material itself. Only the auth endpoints write it, so the changelog records
    that it changed without recording anything crackable.
  # version 22: the login name is the repository, so `username` is renamed
  # `repository` and admission moves every live credential's value to the new
  # name (decision records 0063 and 0074). It takes the package's version.
  names:
    singular: credential
  # A SINGLETON, id `self`: the repository has exactly one user and the user
  # has exactly one credential. It carries the repository it admits to and two
  # REFS into the sealed store (the argon2id password hash and the TOTP seed)
  # and never the material itself, so the changelog shows "the credential
  # changed at T" (an audit trail) while carrying nothing crackable and
  # accumulating no old password hashes in an immutable sequence.
  #
  # Writes come from the auth endpoints alone (registration, password change,
  # TOTP re-enrollment, operator reset), attributed to the substrate; the
  # generic record/GraphQL/REST surface REFUSES both writes and deletes to it
  # (engine/write.go guardSystemType). Reading and listing it is ordinary.
  displayTemplate: "{repository}"
  properties:
    repository:
      type: string
      required: true
      renamedFrom: username
      description: the repository this credential admits to, its authority;
        immutable in v1
    passwordRef:
      type: secret
      required: true
      description: the sealed-store ref holding the argon2id password hash
    totpRef:
      type: secret
      required: true
      description: the sealed-store ref holding the TOTP seed and its last
        consumed step
