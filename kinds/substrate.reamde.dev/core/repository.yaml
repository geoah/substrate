# the repository's own read-only description of itself
kind: substrate.reamde.dev/core/kind
metadata:
  id: substrate.reamde.dev/core/repository
data:
  authority: substrate.reamde.dev
  package: core
  description: >-
    The repository's own read-only description of itself — one record, the
    store you are reading. The control-plane row is the truth and this is
    its projection inside the repository, so a client that only speaks the
    record API can still say where it is.
  version: 19
  purpose: internal
  names:
    singular: repository
  # ONE record, id = the repository's authority (decision record 0046), which
  # is its id everywhere: the store you are reading, describing itself. The
  # control-plane row is the truth; this is its projection inside the
  # repository, so a client that only ever speaks the record API can still say
  # which repository it is in.
  displayTemplate: "{authority}"
  properties:
    # Deprecated rather than dropped: removing a property live records hold is
    # a narrowing the upgrade refuses.
    name:
      type: string
      deprecated: true
      description: the repository's authority, the same value `authority`
        holds; read `authority` instead
    # Not `required`: a repository created before the column existed holds a
    # self-description without it, and adding `required` is a narrowing the
    # boot upgrade refuses while that row stands.
    authority:
      type: string
      description: >-
        the DNS-style authority this repository owns, the home of every kind
        its user declares; chosen at registration, unique on the substrate
        and permanent
    # Domain verification (decision 0208): the engine writes both, on the
    # owner's Verify domain request and on a check that passes.
    domainProof:
      type: string
      managed: true
      description: the one-time code a Verify domain request showed the owner,
        pending until a check finds it in the name's _substrate record
    domainVerifiedAt:
      type: datetime
      managed: true
      description: when a check last proved this repository controls its name's
        DNS, or found the name one label under the server's configured public
        URL; absent while unverified
    # a repository is born `active`; suspend and resume are the operator's,
    # and `deleting` is terminal and reached by the teardown path, not by a
    # declared transition.
    lifecycle:
      type: state
      description: "active until the operator suspends it"
      states:
        - active
        - suspended
        - deleting
      initial: active
      transitions:
        - from: active
          to: suspended
        - from: suspended
          to: active
