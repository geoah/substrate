# THE HOST FUNCTIONS: the five callables whose body is the ENGINE.
#
# `runtime: host` names no source. What runs is engine code — the agent loop's
# query executor, its write executor, the propose writer, the ask writer, the
# job waiter — and
# this file is what makes each of them a RECORD like every other function:
# seeded into a new repository, delivered to an existing one by the boot
# upgrade, listed in the functions collection, and named by an agent under
# `tools: [{function: substrate.reamde.dev/core/…}]` exactly as a bundle's
# function is. They used to be engine constants and a `{builtin: x}` arm on
# `tools:` — the one thing an agent could name that no record declared.
#
# THE DECLARATION IS THE CARD. The `description` and the `arguments:` here are
# what the model is shown, rendered by the loader like any other function's, so
# tuning what an LLM reads about `query` is editing this file. Only `host` is
# admissible from a SHIPPED build: the engine can implement only what the engine
# ships, so the loader refuses the runtime from any installed package.
#
# THE GRANT IS THE CALLER'S. A host function declares no `reads:` and (except
# propose and ask) no `emit:`, because the grant that scopes it belongs to
# whoever called it: `query` is held to the calling agent's `reads:`, `write`
# to its effective writes. That is also why the writes are NOT callable through
# the direct call API and never a trigger's target — there is no calling agent
# whose grants would bound them.
#
# Two earlier host functions took a whole query document as a tool
# (2026-09-12, decision record 0079). They are pruned here rather than
# retired, because a function is a record, not a kind; a repository that
# predates the change loses the two rows at the boot upgrade and an agent
# naming them is quarantined until it names `query` and `write`.
# ---- query: the capability-scoped read -------------------------------------
# The records route's grammar as a tool: one record by (kind, id), a ranked
# read by `q`, the aggregate read by `aggregate`, otherwise a filtered,
# ordered, keyset-paged list with one hop of expansion. Every arm is held to
# the calling agent's `reads:`.
kind: substrate.reamde.dev/core/function
metadata:
  id: substrate.reamde.dev/core/query
data:
  authority: substrate.reamde.dev
  package: core
  description: >-
    Read records. Pass kind + id for one record; q + filter.kinds (required;
    + mode, first) to rank by relevance; aggregate to bucket values; otherwise
    filter (+ orderBy, first, after, expand, count) to list. A filter is {search,
    kinds, purposes, ids, implements, properties, labels, deleted, referencing}:
    properties maps a name to a condition (eq, in, prefix, match, gt, gte,
    lt, lte, contains, exists), timestamps RFC3339; a day is properties: {at:
    {gte: "2026-08-15T00:00:00Z", lt: "2026-08-16T00:00:00Z"}}; search is
    words against indexed text, match against one text property, both in q's
    grammar (words, "a phrase", -word, a OR b, prefix*); referencing: {ref:
    "<kind>/<id>" or refs: [up to 256], property?} lists what points AT them.
    A list is {records, cursor, head, generation, included?, matches?, count?}:
    resend cursor as after for more; expand names references whose targets
    ride in included, keyed by "<kind>/<id>". Records are addressed by their
    full reference, never a bare id. Read-only.
  runtime: host
  arguments:
    - name: id
      type: string
      description: read one record by id (requires kind — identity is the
        (kind, id) pair)
    - name: kind
      type: string
      description: "a kind reference: with id reads one record; alone, the
        one-kind shorthand for filter.kinds"
    - name: filter
      type: json
      description: >-
        the list filter: {search, kinds, purposes, ids, implements, properties,
        labels, deleted, referencing}; purposes lists primary, supporting
        or internal; properties maps a name to a condition
    - name: orderBy
      type: json
      description: 'a list of {property, desc?}; default createdAt descending'
    - name: first
      type: int
      description: max rows to return
    - name: after
      type: string
      description: the cursor a previous page returned, resent verbatim
    - name: expand
      type: string
      repeated: true
      description: reference properties whose targets to include beside the
        page, one hop
    - name: count
      type: bool
      description: with a list, also answer count, the size of the whole filtered
        set; with first 1, the count alongside at most one record
    - name: q
      type: string
      description: >-
        ranks within the kinds named in filter.kinds or kind, which q requires:
        one or two distinctive words (a name, code, number, place), never
        a list of common words
    - name: mode
      type: enum
      values:
        - hybrid
        - lexical
        - semantic
      description: how q ranks (default hybrid)
    - name: aggregate
      type: json
      description: >-
        {metric: {ref}, range: {gte, lt}, bucket: {calendar: day, timezone},
        reducers: [avg], groupBy: [source], unit}, or metrics: [{ref}], or
        property: {name} of filter.kinds; latest: true reads the newest
    - name: downsample
      type: json
      description: >-
        beside aggregate (a metric and a range, no bucket or reducers): {points:
        N} cuts the range into N columns, each answering first, last, min
        and max
---
# ---- write: the agent-scoped write ------------------------------------------
# No `emit:` of its own, and that is the point: the ceiling is the CALLING
# AGENT's effective emit, so an emit here would be a second, looser answer to
# the question of what this tool may write.
kind: substrate.reamde.dev/core/function
metadata:
  id: substrate.reamde.dev/core/write
data:
  authority: substrate.reamde.dev
  package: core
  description: >-
    Write one record: op put creates or updates (merges, never prunes) the
    record at kind + id (omit id to mint one); op patch changes an existing
    one; op delete tombstones one. Property values ride under input as {"properties":
    {...}}, labels and annotations beside them; ifVersion holds the write
    to the version you read. A link to another record is an ordinary property
    whose value is "<kind>/<id>". Every record written must be of a kind in
    the agent's writes allowlist; merge and split are the owner's. Ids must
    come from query results, never invented — except a put's new id.
  runtime: host
  arguments:
    - name: op
      type: enum
      values:
        - put
        - patch
        - delete
      required: true
      description: put creates or updates, patch changes an existing record,
        delete tombstones one
    - name: kind
      type: string
      required: true
      description: the kind reference of the record
    - name: id
      type: string
      description: the record id (required for patch and delete; omit on put
        to mint one)
    - name: input
      type: json
      description: '{properties, labels, annotations} for put and patch'
    - name: ifVersion
      type: int
      description: apply only if the record is still at this version
---
# ---- propose: the reviewed write -------------------------------------------
# The one host function with a write permission, because it writes one kind and
# always the same one. The calling agent's writes must name it too: the grant
# is checked at load on the agent and again at dispatch against the effective
# set.
kind: substrate.reamde.dev/core/function
metadata:
  id: substrate.reamde.dev/core/propose
data:
  authority: substrate.reamde.dev
  package: core
  description: >-
    Propose a reviewed change to the graph instead of writing it: lands a
    recordpatchrequest the owner decides on. op patch (default) changes an
    existing record (needs target + diff); op create mints a new record on
    accept (needs kind + id + diff); op delete tombstones an existing record
    (needs target). A diff wraps property changes under "properties".
  runtime: host
  arguments:
    # The three values are the dispatcher's own op vocabulary
    # (engine/write.go opPatch/opCreate/opDelete), pinned by a test: an enum the
    # model may answer with and the dispatcher would not recognize is a tool call
    # that fails after the model believed it.
    - name: op
      type: enum
      values:
        - patch
        - create
        - delete
      description: 'what accepting would do: patch (the default) an existing
        record, create the named one, or delete it. These are the request''s
        own words, not the put/patch/delete the write tool takes'
    - name: target
      type: string
      description: the existing record id to patch or delete (requires kind
        — identity is the (kind, id) pair)
    - name: kind
      type: string
      description: the kind reference of the target (patch/delete) or of the
        record to mint (create)
    - name: id
      type: string
      description: "for op create: leave it out and the substrate mints the
        new record's id; a given id must be a minted one unless the kind takes
        composed ids (create-if-absent on accept)"
    - name: diff
      type: json
      description: 'the proposed change: property values under "properties",
        a link to another record among them'
    - name: rationale
      type: string
      description: why you propose this
  permissions:
    writes:
      - substrate.reamde.dev/core/recordpatchrequest
---
# ---- ask: the soft interaction --------------------------------------------------
# Lands ONE llm/interaction — a batch of questions the user answers as a unit —
# with `thread` stamped by the loop. The answer arrives in a LATER turn as a
# system row (the answering transition notifies the thread and resumes it), so
# the card teaches the model the contract: ask, then continue other work or
# end the turn; never poll for the answer.
kind: substrate.reamde.dev/core/function
metadata:
  id: substrate.reamde.dev/core/ask
data:
  authority: substrate.reamde.dev
  package: core
  description: >-
    Ask the user a batch of questions (at most 8; each yes/no, pick-one, or
    pick-many with at most 32 options). The answer does NOT come back from
    this call: it arrives in a later turn once the user responds, so ask and
    then continue or finish — never poll. Question ids key the answers.
  runtime: host
  arguments:
    - name: questions
      type: json
      required: true
      description: 'a list of {id, prompt, options?: [{value, label?, description?}],
        multi?: bool}; omit options for a yes/no question'
  permissions:
    writes:
      - substrate.reamde.dev/llm/interaction
---
# ---- wait: block on background jobs ------------------------------------------
# A background tool answers with a handle and its result arrives later as a
# toolCompleted message (decision record 0200). `wait` is for the result the
# agent cannot answer without: it holds the loop on named jobs, never past the
# run's own remaining time. It declares no grant: it reads jobs of the calling
# thread alone.
kind: substrate.reamde.dev/core/function
metadata:
  id: substrate.reamde.dev/core/wait
data:
  authority: substrate.reamde.dev
  package: core
  description: >-
    Wait for background jobs. A background tool answers at once with {job,
    status: working}, and its result reaches you later as a toolCompleted
    message, so start the slow work, carry on, and answer without it when
    you can. Call wait only when you need a job's result to continue: pass
    the job ids, and it returns {completed: [{job, ok, output}], working:
    [ids]} once every job finished or timeoutSeconds passed, never past the
    run's own deadline. A job still working delivers its result later.
  runtime: host
  arguments:
    - name: jobs
      type: string
      repeated: true
      required: true
      description: the job ids background calls answered with
    - name: timeoutSeconds
      type: int
      description: how long to wait at most; the run's remaining time bounds
        it, and absent waits as long as that allows
---
# ---- vocabulary: declare or change kinds -------------------------------------
# The apply door as a tool (decision record 0239): a batch of declaration
# documents admitted whole or not at all, or previewed with `plan`. Every
# document's kind is held to the calling agent's effective emit and passes the
# policy door, and the batch then meets every guard the door's does: a
# shipped or published package refuses, a new package lands only under `~`,
# the repository's own namespace, and a lossy batch waits for the owner.
kind: substrate.reamde.dev/core/function
metadata:
  id: substrate.reamde.dev/core/vocabulary
data:
  authority: substrate.reamde.dev
  package: core
  description: >-
    Declare or change the owner's kinds: documents is a list of {kind, metadata:
    {id}, data} declarations (kind substrate.reamde.dev/core/package or substrate.reamde.dev/core/kind,
    among others), admitted together or not at all. plan true previews the
    batch, writing nothing: what it would refuse (blockers) and the record
    conversions it would run. Declare the owner's own packages under `~`.
    Prefer adding to narrowing: a narrowing is refused while records hold
    the old shape, and a lossy change waits for the owner. The engine versions
    what changes.
  runtime: host
  arguments:
    - name: documents
      type: json
      required: true
      description: 'the declaration documents, each {kind, metadata: {id},
        data}; a kind document''s data holds authority, package, names, displayTemplate,
        properties and the rest of its declaration'
    - name: plan
      type: bool
      description: preview only; nothing is written
---
# ---- edit: change long text by exact replacement -----------------------------
# A function's source, a bundle module, an agent's prompt, a long markdown
# body: read by line, changed by exact replacement against the version read,
# instead of rewritten whole. The result is a patch of the property through
# the same door `write` takes, so the calling agent's writes, the policy door
# and admission hold it; its read is held to the agent's reads.
kind: substrate.reamde.dev/core/function
metadata:
  id: substrate.reamde.dev/core/edit
data:
  authority: substrate.reamde.dev
  package: core
  description: >-
    Read or change one long text property of one record (a function's source,
    an agent's prompt, a document's text) without rewriting it. op view answers
    numbered lines (start and end, at most 400 at once) and the record's version.
    op replace applies edits, a list of {old, new}, to the text at ifVersion:
    each old is copied exactly from a view, without the line numbers, and
    must match exactly one place, so include enough surrounding lines to make
    it unique. Every edit applies or none does. key names one entry of a keyed
    property, such as one module of a bundle's modules.
  runtime: host
  arguments:
    - name: op
      type: enum
      values:
        - view
        - replace
      required: true
      description: view reads lines; replace applies edits
    - name: kind
      type: string
      required: true
      description: the kind reference of the record
    - name: id
      type: string
      required: true
      description: the record id
    - name: property
      type: string
      required: true
      description: the text property to read or change
    - name: key
      type: string
      description: one entry of a keyed property
    - name: start
      type: int
      description: 'view: the first line, from 1'
    - name: end
      type: int
      description: 'view: the last line'
    - name: edits
      type: json
      description: 'replace: a list of {old, new}, applied in order'
    - name: ifVersion
      type: int
      description: 'replace: the version a view answered; required'
