# one declared mapping: how a source record's properties reach the subject
# its `subject: true` reference names (§6.1, record 50)
kind: substrate.reamde.dev/core/kind
metadata:
  id: substrate.reamde.dev/core/recordmapping
data:
  authority: substrate.reamde.dev
  package: core
  description: >-
    One declared mapping: how a source record's properties reach the subject
    its reference names, so a Google contact keeps a person up to date. One
    mapping per source kind, declared by the package that owns that kind.
  # version 2: the display template dropped the authority. A declaration's
  # identity is `<authority>/<package>/<name>` and the dotted composite it used
  # to render names nothing — the bump is what carries the new template into
  # repositories that already stored the old one.
  # version 3: the declaration gained a `description` — the bump is what
  # carries it into repositories that already stored the version 2 one.
  # version 4: TYPED. `definition` and `name` are gone; the match probes and the
  # map rules are properties, and a rule is always `{path}` — the bare path
  # string went with the blob.
  # version 6: the declaration's own `version` became an incremental
  # integer, maintained by the engine.
  # version 8: the mapping names its subject with `property`. The subject is a
  # `subject: true` reference on the source kind, so what the mapping names is
  # a property.
  version: 8
  names:
    singular: recordmapping
  # id = "<authority>/<package>/<name>". A mapping is package-local like a
  # property type: its `from` type lives in the package that declares it,
  # exactly one mapping per source type; `to` is always a full type name.
  displayTemplate: "{localName}"
  properties:
    version:
      type: int
      managed: true
      description: this declaration's incremental version, maintained by the
        engine
    source:
      type: enum
      values:
        - builtin
        - installed
      managed: true
      description: builtin for seeded mappings, installed for bundle ones
    # NOT a reference, and the reason is identity: an authority is what this
    # declaration IS part of, not a record it points at. Pinning it made the
    # stored row spell it as a path while the manifest spelled the name, so one
    # declaration had two Definitions — the authored one and the one that came
    # back after a restart.
    authority:
      type: string
      required: true
      description: the authority of the package that declares it, the source
        kind's own
    package:
      type: string
      description: the package it is declared in, the middle segment of its
        id
    description:
      type: string
      description: what the mapping keeps up to date
    from:
      type: reference
      kind: substrate.reamde.dev/core/kind
      required: true
      description: the source kind whose records project
    to:
      type: reference
      kind: substrate.reamde.dev/core/kind
      required: true
      description: the subject kind, always a full kind reference
    # the `subject: true` reference on `from` that records the link. The
    # marker is on the property; this names which one, and the write path
    # reads the marker rather than this document.
    property:
      type: string
      required: true
      description: the subject reference on the source kind that records the
        link
    # An ORDERED list: which probe decides is the order it is written in.
    match:
      type: object
      repeated: true
      description: the probes that find an existing subject, in order
      fields:
        from:
          type: string
          required: true
          description: the source path the probe reads
        to:
          type: string
          required: true
          description: the subject property the probe matches on
    # A MAP: the key is the subject property written, the value the rule.
    map:
      type: object
      keyed: true
      keyPattern: camel
      description: which source path reaches which subject property
      fields:
        path:
          type: string
          required: true
          description: the source path the value is read from
        merge:
          type: enum
          values:
            - atomic
            - union
          description: whether a value replaces or joins what other sources
            offer
