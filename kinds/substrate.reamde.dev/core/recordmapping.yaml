# one declared mapping: how a source record's properties reach the subject
# its `subject: true` reference names (§6.1, record 50)
kind: substrate.reamde.dev/core/kind
metadata:
  id: substrate.reamde.dev/core/recordmapping
data:
  authority: substrate.reamde.dev
  package: core
  description: >-
    One declared mapping: how a source record's properties reach the subject
    its reference names, so a Google contact keeps a person up to date. It
    is declared by the package that owns the TARGET kind, one per source kind
    and subject property.
  version: 10
  names:
    singular: recordmapping
  # id = "<authority>/<package>/<name>". A mapping belongs to the package that
  # owns its `to` kind (record 0049): `from` may name a kind in any package,
  # one mapping per (source kind, subject property), and both ends are always
  # full kind references.
  displayTemplate: "{localName}"
  properties:
    version:
      type: int
      managed: true
      description: this declaration's incremental version, maintained by the
        engine
    source:
      type: enum
      values:
        - builtin
        - published
        - installed
      managed: true
      description: builtin for seeded mappings, published for a provider's,
        installed for bundle ones
    # NOT a reference, and the reason is identity: an authority is what this
    # declaration IS part of, not a record it points at. Pinning it made the
    # stored row spell it as a path while the manifest spelled the name, so one
    # declaration had two Definitions — the authored one and the one that came
    # back after a restart.
    authority:
      type: string
      required: true
      description: the authority of the package that declares it, the subject
        kind's own
    package:
      type: string
      description: the package it is declared in, the middle segment of its
        id
    description:
      type: string
      description: what the mapping keeps up to date
    from:
      type: reference
      kind: substrate.reamde.dev/core/kind
      required: true
      description: the source kind whose records project, in any package
    to:
      type: reference
      kind: substrate.reamde.dev/core/kind
      required: true
      description: the subject kind, declared by this mapping's own package
    # the `subject: true` reference on `from` that records the link. The
    # marker is on the property; this names which one, and the write path
    # reads the marker rather than this document.
    property:
      type: string
      required: true
      description: the subject reference on the source kind that records the
        link
    # An ORDERED list: which probe decides is the order it is written in.
    match:
      type: object
      repeated: true
      description: the probes that find an existing subject, in order
      fields:
        from:
          type: string
          required: true
          description: the source path the probe reads
        to:
          type: string
          required: true
          description: the subject property the probe matches on
    # A MAP: the key is the subject property written, the value the rule.
    map:
      type: object
      keyed: true
      keyPattern: camel
      description: which source path reaches which subject property
      fields:
        path:
          type: string
          required: true
          description: the source path the value is read from
        merge:
          type: enum
          values:
            - atomic
            - union
          description: whether a value replaces or joins what other sources
            offer
