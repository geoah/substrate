# one hand that writes: a person, an app, installed code, a package or the
# engine
kind: substrate.reamde.dev/core/kind
metadata:
  id: substrate.reamde.dev/core/actor
data:
  authority: substrate.reamde.dev
  package: core
  description: >-
    One hand that writes in this repository: its person, an app the person
    approved, an installed function or agent, a package's own installs, or
    the substrate itself. Every history line, change event and stored attribution
    links the actor record it names, never a spelling.
  purpose: internal
  names:
    singular: actor
  displayTemplate: "{name}"
  # The engine writes every actor record, when the hand comes to be: the
  # repository's creation writes its person and the system, an approval its
  # app, an install its package and the package's functions and agents. A
  # record whose code is gone is disabled and never deleted, so an old write
  # still links to something (decision 0270). The four declaration keys an
  # actor document carried are spent: no package declares an actor.
  retired:
    properties:
      - version
      - authority
      - source
      - tier
  properties:
    type:
      type: enum
      required: true
      values:
        - person
        - app
        - function
        - agent
        - package
        - system
      description: what kind of hand this is
    name:
      type: string
      description: the name the hand reads as, its repository's name for the
        person
    # A person names their identity, the sign-in the server holds and the one
    # link that leaves the repository: a person is in the repository while a
    # live person actor here names them (decision 0274).
    identity:
      type: string
      description: the sign-in this person signs in with, held by the server,
        for a person
    # What the hand is, one link for each type that has one: the code that
    # runs for a function and an agent, the package for a package. An app is
    # named by its publisher.
    function:
      type: reference
      kind: substrate.reamde.dev/core/function
      description: the function this actor runs, for a function
    agent:
      type: reference
      kind: substrate.reamde.dev/core/agent
      description: the agent this actor runs, for an agent
    package:
      type: reference
      kind: substrate.reamde.dev/core/package
      description: the package whose installs this actor writes, for a package
    publisher:
      type: string
      description: what the approval proved about an app, for an app — its
        verified authority, the hostname of its client id, or `local` for
        a program on the owner's device
    disabled:
      type: bool
      description: true once the code or approval behind the actor is gone;
        nothing writes as a disabled actor, and its old writes still link
        it
