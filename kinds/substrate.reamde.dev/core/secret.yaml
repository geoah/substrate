# a `setting` whose value is CREDENTIAL MATERIAL (decision record 0076): the
# same record, the same id grammar (`<bundle id>/<name>`), the same three
# engine readings — injection, setup, purge — with `value` typed `secret`, so
# it is sealed on write and never reads back over the API.
#
# It is a kind of its own rather than a flag on `setting`, because the seal is
# a property TYPE: the engine seals what a kind declares secret, and a
# per-record switch is not something a declaration can say.
kind: substrate.reamde.dev/core/kind
metadata:
  id: substrate.reamde.dev/core/secret
data:
  authority: substrate.reamde.dev
  package: core
  description: >-
    One credential a bundle needs, stored as a record under the bundle's id
    — `<authority>/<package>/<name>`. The bundle ships it empty, the user
    fills the value, and the bundle's functions read it as `config.settings.<name>`
    in plaintext inside the runner boundary, held there by the invocation
    scrubber. It never reads back over the API.
  names:
    singular: secret
  displayTemplate: "{displayName|localName}"
  properties:
    displayName:
      type: string
      displayName: Display name
      description: the heading this secret reads as; the bundle ships it
    description:
      type: string
      displayName: Description
      description: what the credential is and where the person filling it
        in gets one
    required:
      type: bool
      default: false
      displayName: Required
      description: set when the bundle cannot run without a value; an empty
        required secret is a setup item on the bundle's status
    value:
      type: secret
      displayName: Value
      description: the credential — sealed at rest, injected only into this
        bundle's functions, never read back
