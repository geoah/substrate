# One trigger delivery attempt, written by the engine under the system actor
# after the attempt settles — the generalization of the parked-failure
# ledger. Cleanup is first-class: parked runs are kept until their failure is
# retried away, everything else is pruned to the newest few per trigger
# (engine/triggers.go documents the number). A triggerrun is the one record
# kind a trigger's record source can NEVER match: every delivery writes one,
# so a `*` subscription over them would feed itself forever.
kind: substrate.reamde.dev/core/kind
metadata:
  id: substrate.reamde.dev/core/triggerrun
data:
  authority: substrate.reamde.dev
  package: core
  description: >-
    One trigger delivery attempt, written by the engine after the attempt
    settles: what fired, what ran, what it applied, and why it parked. Parked
    runs are kept until their failure is retried away; the rest are pruned
    to the newest few per trigger.
  version: 18
  purpose: internal
  names:
    singular: triggerrun
  # The title reads the STRING and not `callableRef`: a reference renders the
  # referent's title, and an agent's is its bare local name, so the reference
  # would drop the package a run has to be read by. `callable` is deprecated
  # for writers, not for this.
  displayTemplate: "{status}: {callable}"
  indices:
    - properties:
        - trigger
        - status
  properties:
    trigger:
      type: reference
      kind: substrate.reamde.dev/core/trigger
      required: true
      description: the trigger this delivery belongs to
    # `record` stays a string where `trigger` is a reference: it can name ANY
    # kind, and that kind may be uninstalled while a delivery is still pending
    # past the cursor, so validating it as a reference would fail the settle
    # transaction and wedge the trigger — a run is an audit row and its record
    # pointer must never block the write.
    #
    # `callable` and `callableRef` are the one pointer twice. The string came
    # first and every run still writes it; the reference is what a
    # `referencing` read follows to find every run of one callable, which a
    # string match cannot do. It declares no `mustExist` for the reason above:
    # a callable uninstalled between the fire and the settle must not fail the
    # run's own write. `callable` drops `required:` because a deprecated
    # property may not also be required, not because a run may omit it.
    callable:
      type: string
      deprecated: true
      description: the id of the function or agent record that ran; `callableRef`
        is the same pointer as a reference
    callableRef:
      type: reference
      kind: any
      description: the function or agent record that ran, so `referencing`
        finds every run of one callable
    mode:
      type: enum
      required: true
      values:
        - record
        - schedule
        - webhook
        - manual
      description: how the delivery fired
    seq:
      type: int
      min: 1
      description: the changelog seq delivered, for record-sourced runs
    fireId:
      type: string
      description: the stable fire id, for schedule and webhook runs
    record:
      type: string
      description: the delivered record id, for record-sourced runs
    status:
      type: enum
      required: true
      values:
        - ok
        - skipped
        - parked
      description: ok (effects applied or nothing to do), skipped (the when
        guard said no), or parked (retried out; a trigger_failures row holds
        the retry handle)
    attempt:
      type: int
      required: true
      min: 0
      description: how many attempts the delivery burned; 0 when it parked
        at the causal depth cap before any ran
    startedAt:
      type: datetime
      required: true
      description: when the attempt began
    finishedAt:
      type: datetime
      required: true
      description: when the attempt settled
    reason:
      type: string
      description: why a non-success run settled as it did; the last error
        on a parked run
    # The keys are the action words the effect applier names (put, patch,
    # delete, merge, split), held to that set by the engine.
    effects:
      type: int
      keyed: true
      min: 1
      description: "the applied-effects summary: action → count"
    pages:
      type: int
      min: 2
      description: committed pages for a paged (backfill) delivery; absent
        for a single-shot body, the durable per-chain progress lives in paged_cursors
