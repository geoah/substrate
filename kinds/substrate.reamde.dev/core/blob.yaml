# one content-addressed blob: its MANIFEST is the metadata, its bytes live in
# the content-addressed byte store behind /blobs (ticket 004). Everything in
# this system has a manifest, so a blob is an ordinary record — reads,
# changelog and console all work on it for free — while the bytes are never in
# the record. The digest IS the id ("blob-sha256-<hex>"), so the same bytes
# always mint the same blob (dedup by construction). Written by the byte store,
# not by hand; a blob-ref property elsewhere points at one by digest.
kind: substrate.reamde.dev/core/kind
metadata:
  id: substrate.reamde.dev/core/blob
data:
  authority: substrate.reamde.dev
  package: core
  description: >-
    One content-addressed blob's manifest — digest, size, name and media type
    — while the bytes themselves live in the store behind /blobs. The digest
    is the id, so identical bytes always mint the same blob, and a blobref
    property elsewhere points at one.
  version: 6
  names:
    singular: blob
  # The name if it has one, the digest if it doesn't: a blob reads as
  # "invoice.pdf", not as 76 characters of sha-256.
  displayTemplate: "{name|digest}"
  properties:
    digest:
      type: string
      required: true
      description: the content hash, equal to this record's id
    size:
      type: int
      min: 0
      description: the byte length of the stored content
    name:
      type: string
      description: an optional display name, typically the filename the bytes
        arrived as; never a path
    mediaType:
      type: string
      description: the optional media type declared when the bytes were stored
    createdBy:
      type: string
      required: true
      description: the actor that stored the bytes, for provenance
    # pending while a ref exists but no bytes have landed; stored once the byte
    # store has them and verified the digest; failed on a rejected store.
    status:
      type: state
      description: "pending until bytes land, then stored; failed on a rejected
        store"
      states:
        - pending
        - stored
        - failed
      initial: pending
      transitions:
        - from: pending
          to: stored
        - from: pending
          to: failed
        - from: failed
          to: stored
