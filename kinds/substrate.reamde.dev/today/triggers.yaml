# The today package's deliveries. An install or an upgrade writes each of
# these whole, so a trigger its owner turned off is on again after one: the
# switch that lasts is `assistantPrepares` on the owner's `preference`
# record, which `prepare` reads before it asks for anything.
#
# No trigger fires on a suggested task arriving: suggestions arrive all day,
# and a run of a model for each would cost more than its advice is worth.
# The half-hourly pass asks for advice, at most every two hours.
#
# The record trigger on a task names the tasks package's task, which this
# package cannot require (today.yaml): on a repository without it, it
# matches nothing.
kind: substrate.reamde.dev/core/trigger
metadata:
  id: today-fade-daily
data:
  properties:
    enabled: true
    label: Suggested tasks nobody answered fade after two weeks
    source:
      schedule:
        recurrence: "FREQ=DAILY"
        timezone: UTC
        startsAt: "2026-01-01T03:10:00Z"
    callable: substrate.reamde.dev/core/function/substrate.reamde.dev/today/fade
---
# Every half hour, because the morning is at the owner's own hour in their
# own zone, which is on a record and not in this file. The body does nothing
# until that hour passes, and nothing again once the day is asked for.
kind: substrate.reamde.dev/core/trigger
metadata:
  id: today-prepare-morning
data:
  properties:
    enabled: true
    label: The morning is prepared at your hour
    source:
      schedule:
        recurrence: "FREQ=MINUTELY;INTERVAL=30"
        timezone: UTC
        startsAt: "2026-01-01T00:00:00Z"
    callable: substrate.reamde.dev/core/function/substrate.reamde.dev/today/prepare
---
# An urgent mark an automation or the API set, which carries neither stamp.
# Once `stampurgent` writes one, the guard no longer passes; whoever sets
# the mark again clears both, and it is checked again.
kind: substrate.reamde.dev/core/trigger
metadata:
  id: today-prepare-on-urgent
data:
  properties:
    enabled: true
    label: An urgent mark nobody has checked is checked
    source:
      record:
        kinds:
          - substrate.reamde.dev/tasks/task
        ops:
          - create
          - update
        when: >-
          record != null && "priority" in record.properties && record.properties.priority
          == "urgent" && "prioritySetBy" in record.properties && (record.properties.prioritySetBy
          == "automation" || record.properties.prioritySetBy == "api") &&
          !("urgentCheckedAt" in record.properties) && !("urgentHeldAt" in
          record.properties)
    callable: substrate.reamde.dev/core/function/substrate.reamde.dev/today/prepare
---
# What `prepare` asks for, the preparer writes (preparer.yaml): a new
# preparation record is its message. A run acts for no one and counts
# against the preparer's own daily spend, which holds this trigger when it is
# spent, and nothing else: the owner's assistant is not run from here. The
# guard keeps a held delivery from buying a run for a record that has since
# been deleted, as `fade` deletes them.
kind: substrate.reamde.dev/core/trigger
metadata:
  id: today-preparer-on-preparation
data:
  properties:
    enabled: true
    label: Your day is prepared as asked
    source:
      record:
        kinds:
          - substrate.reamde.dev/today/preparation
        ops:
          - create
        when: record != null
    callable: substrate.reamde.dev/core/agent/substrate.reamde.dev/today/preparer
---
# The preparer's verdict on an urgent mark is stamped on the task by a
# function, because the preparer holds no write on a task (stampurgent.yaml).
kind: substrate.reamde.dev/core/trigger
metadata:
  id: today-stamp-on-urgentcheck
data:
  properties:
    enabled: true
    label: A checked urgent mark is stamped on its task
    source:
      record:
        kinds:
          - substrate.reamde.dev/today/urgentcheck
        ops:
          - create
          - update
        when: record != null
    callable: substrate.reamde.dev/core/function/substrate.reamde.dev/today/stampurgent
---
# A task that names what it was made from and not when that was said: the
# time is read off the origin (stamporigin.yaml). The guard stops passing
# once the stamp is there, and a task whose origin has no time is tried
# again only when the task next changes.
kind: substrate.reamde.dev/core/trigger
metadata:
  id: today-stamp-on-origin
data:
  properties:
    enabled: true
    label: A task made from something is stamped with when that was said
    source:
      record:
        kinds:
          - substrate.reamde.dev/tasks/task
        ops:
          - create
          - update
        when: >-
          record != null && "origin" in record.properties && !("originAt"
          in record.properties)
    callable: substrate.reamde.dev/core/function/substrate.reamde.dev/today/stamporigin
