# The `today` catalogue: what a day planner keeps beside the records it
# reads. An app that shows the order of a day (Substrate Today) reads tasks,
# task lists, routines and calendar events from the packages that own them,
# and keeps here only what is its own: the day's plan, how far each project's
# news was read, where the owner left something, their rules, and what the
# assistant prepared (its advice on a suggested task, a dossier for a
# meeting, a digest of a project's news).
#
# IT REQUIRES NOTHING. A task and a task list are the `tasks` package's,
# which Substrate Tasks publishes through the project's authority document,
# not the binary, so no shipped bundle owns it and this one cannot name it
# under `requires:`. So a reference to a task or a list here is pinned at
# core's `lifecycle` trait, which both bind, and the two functions name the
# tasks kinds by a package glob, which covers kinds the repository gains
# later. On a repository without `tasks` the package installs and those
# parts stay idle: the reads find nothing and write nothing.
#
# CODE, kept small:
#
#   fade         daily: a suggested task nobody answered in two weeks is
#                abandoned. The owner's rule carried out by an automation.
#                The two weeks run from when what it came from was said (the
#                task's `originAt`), not from when the suggestion was written.
#   prepare      works out what has not been prepared yet and asks for it,
#                as a `preparation` record. It calls no model itself.
#   preparer     an agent, run by a trigger on `preparation` with the record
#                as its message. It writes its advice, its dossiers, its
#                verdict on an urgent mark, and change requests, and nothing
#                else: it reads what other people wrote, so it holds no write
#                on a task or a list.
#   stampurgent  stamps a task with the preparer's verdict on its urgent mark.
#   stamporigin  stamps a task that names its origin with when that was said,
#                where its maker left `originAt` out.
#
# THE PREPARER IS NOT THE OWNER'S ASSISTANT. It runs on a mid-priced model
# under a daily cap of its own, on the provider bound to this bundle's
# `model` input, so preparing a day never spends what the owner's chats are
# bought with. A normal day is one run for the morning, one for advice at
# most every two hours while a suggested task has none, and one per urgent
# mark an automation sets (prepare.yaml).
#
# The assistant's standing instructions for a day planner are
# `llm/instruction` records this package ships (instructions.yaml), which the
# owner edits like their own (decision record 0191). They are for where the
# owner talks to their assistant; the preparer's rules are in its prompt.
kind: substrate.reamde.dev/core/package
metadata:
  id: substrate.reamde.dev/today
data:
  authority: substrate.reamde.dev
  package: today
  # 1: preference, plan, advice, digest, reviewmark, dossier, returnpoint,
  # rule, preparation and urgentcheck; fade, prepare and stampurgent with
  # their triggers; the preparer; the assistant's standing instructions.
  # 2: the morning ask names the two kinds a flag is suggested on.
  # 3: the instruction `today-add`: a to-do the owner gives the assistant is
  # an open task for today, since a day planner's field sends all it is given
  # to the assistant.
  # 4: `correction`, the owner's words on a suggestion that was wrong, with
  # the instruction `today-correct`; a suggestion's age is counted from the
  # task's `originAt` (tasks 5), when what it came from was said, in `fade`
  # and in the order `prepare` asks for advice, and `stamporigin` writes it
  # from the origin where a task's maker did not; the instruction
  # `today-dates` and the preparer write a day as its date.
  version: 4
---
# ---- the bundle document: the install unit ------------------------------------
# Eleven kinds, four functions and one agent. The triggers (triggers.yaml) and
# the assistant's instructions (instructions.yaml) are data: an upgrade
# replaces one only where its owner has not edited it.
kind: substrate.reamde.dev/core/bundle
metadata:
  id: substrate.reamde.dev/today
data:
  authority: substrate.reamde.dev
  package: today
  description: >-
    Planning your day: the day's plan, what your assistant prepared for it,
    how far you have read each project's news, and your rules for what reaches
    you. Substrate Today keeps them.
  inputs:
    model:
      kind: substrate.reamde.dev/llm/provider
      description: the AI provider your day is prepared on, picked when the
        package is added
  installs:
    - substrate.reamde.dev/today/preference
    - substrate.reamde.dev/today/plan
    - substrate.reamde.dev/today/advice
    - substrate.reamde.dev/today/digest
    - substrate.reamde.dev/today/reviewmark
    - substrate.reamde.dev/today/dossier
    - substrate.reamde.dev/today/returnpoint
    - substrate.reamde.dev/today/rule
    - substrate.reamde.dev/today/preparation
    - substrate.reamde.dev/today/urgentcheck
    - substrate.reamde.dev/today/correction
    - substrate.reamde.dev/today/fade
    - substrate.reamde.dev/today/prepare
    - substrate.reamde.dev/today/stampurgent
    - substrate.reamde.dev/today/stamporigin
    - substrate.reamde.dev/today/preparer
