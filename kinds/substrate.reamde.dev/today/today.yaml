# The `today` catalogue: what a day planner keeps beside the records it
# reads. An app that shows the order of a day (Substrate Today) reads tasks,
# task lists, routines and calendar events from the packages that own them,
# and keeps here only what is its own: the day's plan, how far each project's
# news was read, where the owner left something, their rules, and what the
# assistant prepared (its advice on a suggested task, a dossier for a
# meeting, a digest of a project's news).
#
# IT REQUIRES NOTHING. A task and a task list are the `tasks` package's,
# which Substrate Tasks publishes through the project's authority document,
# not the binary, so no shipped bundle owns it and this one cannot name it
# under `requires:`. So a reference to a task or a list here is pinned at
# core's `lifecycle` trait, which both bind, and the two functions name the
# tasks kinds by a package glob, which covers kinds the repository gains
# later. On a repository without `tasks` the package installs and those
# parts stay idle: the reads find nothing and write nothing.
#
# CODE, kept small:
#
#   fade     daily: a suggested task nobody answered in two weeks is
#            abandoned. The owner's rule carried out by an automation.
#   prepare  works out what the assistant has not written yet and asks for
#            it, as a `preparation` record. It calls no model itself.
#
# The assistant is run by a trigger on `preparation` (triggers.yaml), with
# the record as its message, and its standing instructions for all of this
# are `llm/instruction` records this package ships (instructions.yaml),
# which the owner edits like their own (decision record 0191).
kind: substrate.reamde.dev/core/package
metadata:
  id: substrate.reamde.dev/today
data:
  authority: substrate.reamde.dev
  package: today
  # 1: preference, plan, advice, digest, reviewmark, dossier, returnpoint,
  # rule and preparation; fade and prepare with their triggers; the
  # assistant's standing instructions.
  version: 1
---
# ---- the bundle document: the install unit ------------------------------------
# Nine kinds and two functions. The triggers (triggers.yaml) and the
# assistant's instructions (instructions.yaml) are data: an upgrade replaces
# one only where its owner has not edited it.
kind: substrate.reamde.dev/core/bundle
metadata:
  id: substrate.reamde.dev/today
data:
  authority: substrate.reamde.dev
  package: today
  description: >-
    Planning your day: the day's plan, what your assistant prepared for it,
    how far you have read each project's news, and your rules for what reaches
    you. Substrate Today keeps them.
  installs:
    - substrate.reamde.dev/today/preference
    - substrate.reamde.dev/today/plan
    - substrate.reamde.dev/today/advice
    - substrate.reamde.dev/today/digest
    - substrate.reamde.dev/today/reviewmark
    - substrate.reamde.dev/today/dossier
    - substrate.reamde.dev/today/returnpoint
    - substrate.reamde.dev/today/rule
    - substrate.reamde.dev/today/preparation
    - substrate.reamde.dev/today/fade
    - substrate.reamde.dev/today/prepare
