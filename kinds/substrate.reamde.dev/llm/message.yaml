# one turn of a thread: the transcript and the tool-call audit as ordinary
# rows, written by the loop as it runs. `role` follows the chat wire —
# system prompts are on the agent row and are not persisted per thread; a
# `user` row is the envelope (triggered runs) or the human's message (chat);
# an `assistant` row carries prose and/or its tool calls; a `tool` row is one
# dispatched call's result, keyed back by toolCallId; a `system` row is the
# substrate's own turn (a proposal decision), written by the engine and
# replayed to the model as context; a `summary` row is the engine's fold of
# older turns, written by the loop when the history nears the model's context
# window and replayed in place of the rows its `covers` names, which stay
# untouched as the audit.
kind: substrate.reamde.dev/core/kind
metadata:
  id: substrate.reamde.dev/llm/message
data:
  authority: substrate.reamde.dev
  package: llm
  description: >-
    One turn of an agent thread — the transcript and the tool-call audit,
    written by the loop as it runs. A user turn is the envelope or the human's
    message, an assistant turn its prose and tool calls, a tool turn one dispatched
    call's result.
  version: 16
  # Where this kind was before it moved out of core (decision record
  # 0078). Admitting it on a repository that still declares the old kind
  # carries every live row here, same id and same properties, and
  # repoints every live reference at it, in the transaction that lands
  # this declaration. The old kind stays declared and empty.
  movedFrom: substrate.reamde.dev/core/llmmessage
  purpose: internal
  names:
    singular: message
  displayTemplate: "{role} #{turn}"
  properties:
    role:
      type: enum
      required: true
      values:
        - user
        - assistant
        - tool
        - system
        - summary
      description: whose turn the row is, following the chat wire
    content:
      type: text
      description: the turn's text; a tool row's result payload
    turn:
      type: int
      required: true
      min: 0
      description: the loop iteration this row belongs to, for ordering
    # The arguments ride as the VERBATIM wire string: they are the model's own
    # JSON, echoed back on the tool result, and re-encoding them would change
    # the bytes the provider matched a call by.
    #
    # `name` is the agent's ALIAS, the tool name the model saw, and `callable`
    # is the identity behind it in the spelling the changelog's actor column
    # uses (decision record 0025): `function:<authority>:<package>:<name>` for
    # a function tool, `agent:<authority>:<package>:<name>` for a sub-agent.
    # A host function is a function record, so it is the function spelling of
    # that record (`function:substrate.reamde.dev:core:query`). Two agents may
    # alias one function differently, and an alias may be renamed, so only the
    # callable joins every call of one function. The engine stamps it on the
    # call and on the tool row that answers it, and leaves it off a name no
    # tool of the agent's carries.
    toolCalls:
      type: object
      repeated: true
      description: an assistant turn's dispatched calls
      fields:
        id:
          type: string
          description: the provider's call id, which a tool row answers by
        name:
          type: string
          description: the tool the model called, as the agent aliased it
        callable:
          type: string
          description: the function or agent the call named, in the actor
            spelling, stamped by the engine
        arguments:
          type: text
          fts: false
          description: the call's arguments, as the provider wrote them
    toolCallId:
      type: string
      description: the assistant tool call a tool row answers
    name:
      type: string
      description: the tool name a tool row answers for, as the agent aliased
        it
    callable:
      type: string
      description: the function or agent a tool row answers for, in the actor
        spelling, stamped by the engine
    ok:
      type: bool
      description: whether the dispatch a tool row answers for succeeded
    # Stamped by the ENGINE, never authored by the model: the changelog
    # entries a tool row's dispatch wrote (a write's writes, a propose's
    # request row, a function tool's applied effects), or the entries a
    # decision wrote on a system row. The seq addresses the delta in the
    # changelog; kind and id address the record it moved — so any reader of
    # the thread can show WHAT changed without parsing tool payloads.
    changes:
      type: object
      repeated: true
      description: the changelog entries this turn's dispatch wrote, stamped
        by the engine
      fields:
        seq:
          type: int
          description: the changelog seq of the entry, which addresses its
            delta
        # THE CHANGELOG'S OWN OP, verbatim (substrate.Op): what the entry
        # landed as, never a trigger's change class and never the request op a
        # propose wrote. docs/changelog.md#change-verbs holds the mapping.
        op:
          type: enum
          values:
            - put
            - patch
            - delete
            - merge
            - split
          description: the changelog op the entry landed as, verbatim
        kind:
          type: string
          description: the written record's kind
        id:
          type: string
          description: the written record's id
    # Stamped by the ENGINE on a sub-agent call's tool row when the child's
    # run returns, whatever status it ended in, whenever the child's thread
    # opened, `records: 0` included, so a reader tells "wrote nothing" from
    # "a row written before the stamp". A later continuation of the child
    # thread (a decision resume) is not counted. The count and the kinds cover the whole child chain,
    # grandchildren included, and are the same entries the chain's own rows
    # stamp as `changes`. Those entries are NOT copied here: the child rows
    # already carry them, and the parent's compaction reads `changes` as the
    # parent's own obligations.
    subagentWrites:
      type: object
      description: what a sub-agent call's child chain wrote, stamped by the
        engine; the entries themselves stay on the child thread's rows
      fields:
        thread:
          type: reference
          kind: substrate.reamde.dev/llm/thread
          required: true
          description: the child thread the call ran; its rows, and the threads
            of the agents it called, stamp each write's changes
        records:
          type: int
          required: true
          min: 0
          description: how many distinct records the child chain wrote
        kinds:
          type: string
          repeated: true
          description: the kinds the child chain wrote, in the order it first
            wrote each, at most 20
        moreKinds:
          type: int
          min: 1
          description: how many more kinds the chain wrote past the listed
            20; absent when every kind is listed
    # A summary row's range is two message ROW IDS, not turn ordinals: two
    # rows can share an ordinal, and replay orders by creation. The rows in
    # the range stay; replay emits the summary where `from` sat and resumes
    # after `through`.
    covers:
      type: object
      description: the first and last message rows a summary row replaces
        in replay, inclusive
      fields:
        from:
          type: string
          description: the id of the first message row the summary replaces
        through:
          type: string
          description: the id of the last message row the summary replaces
    tokensBefore:
      type: int
      min: 0
      description: the context size in tokens that triggered a summary row's
        compaction
    model:
      type: string
      description: the model that wrote a summary row
    promptTokens:
      type: int
      min: 0
      description: the input tokens the summarizer call spent on a summary
        row
    completionTokens:
      type: int
      min: 0
      description: the output tokens the summarizer call spent on a summary
        row
    thread:
      type: reference
      kind: substrate.reamde.dev/llm/thread
      required: true
      inverse: messages
      inverseDescription: the turns of this thread, in loop order
      description: the thread this turn belongs to
