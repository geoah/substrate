# how far one person has read one thread, and what they did with it (decision
# records 0313 and 0322). The thread is the engine's row and says what the
# run did; this is the person's, so reading a chat, pinning it or archiving
# it moves neither the thread's version nor its place in a list. One record
# per thread and person, under the id `<thread id>.<actor id>`, which the
# engine builds for a create that names none (engine/threadmarks.go).
#
# The engine holds every write of one: a person, or an app acting for them,
# writes only their own; `thread` and `readBy` are fixed at the create;
# `readThrough` names a message of that thread and never moves back to an
# earlier one; and `readAt` is stamped, never taken from the write. Unread is
# derived by whoever lists threads: a settled thread is unread when
# `markedUnread` is set, when its `lastMessage` is not `readThrough`, or when
# the person has no mark of it.
#
# `pinned` and `archived` are the person's too, and the engine writes
# neither: no run, reply or settle moves them, and neither moves the
# position or is moved by it. A person may pin or archive a thread they
# never opened, so a mark may hold no `readThrough`: such a thread is as
# unopened as one with no mark.
kind: substrate.reamde.dev/core/kind
metadata:
  id: substrate.reamde.dev/llm/threadmark
data:
  authority: substrate.reamde.dev
  package: llm
  description: >-
    What one person has done with one thread: the newest message they have
    seen and when, whether they marked the thread unread, and whether they
    pinned or archived it. Each person has their own for a thread, and it
    follows them to every device.
  purpose: internal
  # The id is `<thread id>.<actor id>`, a name the engine checks against the
  # two references, so a client reads a mark without a search.
  ids:
    type: named
  # A mark is its person's own record, so its history is kept whole like
  # every kind that is not bookkeeping (decision record 0333): it states no
  # retention.
  # version 10: `pinned` and `archived` (decision record 0322). The kind took
  # its package's version, 9, until then.
  version: 10
  names:
    singular: threadmark
  # Whose mark, then of what: two people's marks of one thread read apart.
  displayTemplate: "{readBy}: {thread}"
  properties:
    thread:
      type: reference
      kind: substrate.reamde.dev/llm/thread
      required: true
      inverse: marks
      inverseDescription: how far each person has read this thread
      description: the thread this is about; fixed when the record is created
    readBy:
      type: reference
      kind: substrate.reamde.dev/core/actor
      required: true
      description: the person whose reading this records; filled in with the
        person the write acts for, and fixed when the record is created
    readThrough:
      type: reference
      kind: substrate.reamde.dev/llm/message
      description: the newest message of the thread the person has seen; a
        write that names an earlier message leaves it where it is
    # Stamped when a write's position is taken; a value a write sends is
    # dropped, so a late write is never refused for it.
    readAt:
      type: datetime
      managed: true
      description: when the person last read through `readThrough`, stamped
        by the engine
    markedUnread:
      type: bool
      description: true while the person has marked the thread unread; the
        next write of `readThrough` at or after the stored one clears it
    pinned:
      type: bool
      description: true while the person keeps the thread pinned above the
        rest of their list; only their own write changes it
    archived:
      type: bool
      description: true while the person keeps the thread out of their list;
        the thread, its run and its cost are untouched, and only their own
        write changes it
