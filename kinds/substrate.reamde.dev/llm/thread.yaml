# one agent invocation's conversation state — there is no agent-run record,
# the thread is the run. The loop writes it as it goes: status settles to
# ok / overbudget / error, the token tally accumulates per assistant turn,
# and on the ROOT thread the tally includes every sub-agent's spend (cost
# rolls up — one number answers "what did this chain cost"). A sub-agent's
# thread names its caller in `parent`; chat threads (mode chat) are the same
# rows the console renders and continues.
kind: substrate.reamde.dev/core/kind
metadata:
  id: substrate.reamde.dev/llm/thread
data:
  authority: substrate.reamde.dev
  package: llm
  description: >-
    One agent invocation's conversation state; there is no agent-run record,
    the thread IS the run. Status, turns, tokens and cost accumulate as the
    loop goes, and a root thread's tally rolls up every sub-agent's spend,
    so one number answers what a chain cost.
  version: 14
  # Where this kind was before it moved out of core (decision record
  # 0078). Admitting it on a repository that still declares the old kind
  # carries every live row here, same id and same properties, and
  # repoints every live reference at it, in the transaction that lands
  # this declaration. The old kind stays declared and empty.
  movedFrom: substrate.reamde.dev/core/llmthread
  purpose: internal
  names:
    singular: thread
  # A chat thread is headed by its subject; every other thread (a triggered
  # run, a row older than the property) by its agent (decision record 0170).
  displayTemplate: "{subject|agent}"
  # No declared index on `agent`: the engine builds one for every single
  # reference property on the path it points at (engine/indices.go), and the
  # filter by agent compares that path.
  indices:
    - properties:
        - status
  properties:
    # Written by the loop when a chat thread opens (the first message), once
    # by the title model after the first turn, and by the owner's rename. The
    # title model writes only while the property's manager is still the
    # agent's actor, so a rename is never overwritten.
    subject:
      type: string
      description: the thread's heading; the first message, then a model's
        title, then whatever its owner renames it to
    agent:
      type: reference
      kind: substrate.reamde.dev/core/agent
      required: true
      inverse: threads
      inverseDescription: the runs this agent has had
      description: the agent this thread ran
    # NOT a reference, unlike the agent's own `provider:`. This one is what the
    # ENGINE resolved for this run — provenance on a finished thread, not a
    # pointer an author picks — and retyping a live string property to a
    # reference is a narrowing the boot upgrade refuses while rows hold the old
    # shape.
    provider:
      type: string
      required: true
      description: the provider row id the run resolved
    model:
      type: string
      required: true
      description: the model id the run sent
    mode:
      type: enum
      required: true
      values:
        - record
        - schedule
        - webhook
        - manual
        - call
        - subagent
        - chat
        - judge
      description: how the run was invoked
    status:
      type: enum
      required: true
      values:
        - running
        - ok
        - overbudget
        - error
      description: running, then settled to ok, overbudget or error
    # A preview for a thread list, so a list reads one kind. Not searchable:
    # the reply is already indexed on its llm/message row, and a second copy
    # would make the thread the hit for every word its agent said.
    lastReply:
      type: string
      fts: false
      description: the start of the last reply a turn settled with; a turn
        that ends with no reply leaves the previous one
    reason:
      type: string
      description: which budget ended an overbudget run, or the error
    agentDepth:
      type: int
      required: true
      min: 0
      max: 3
      description: how many sub-agent hops sit above this thread (0 = root)
    turns:
      type: int
      min: 0
      description: model calls this thread burned
    toolCalls:
      type: int
      min: 0
      description: tool dispatches this thread burned
    promptTokens:
      type: int
      min: 0
      description: prompt tokens; on the root thread, sub-agents included
    completionTokens:
      type: int
      min: 0
      description: completion tokens; on the root thread, sub-agents included
    totalTokens:
      type: int
      min: 0
      description: total tokens; on the root thread, sub-agents included
    costUSD:
      type: float
      min: 0
      description: the provider row's pricing for the model applied to the
        tally; 0 when unpriced
    startedAt:
      type: datetime
      required: true
      description: when the loop opened the thread
    finishedAt:
      type: datetime
      description: when the loop settled
    leaseUntil:
      type: datetime
      description: >-
        the running turn's lease horizon — one active continuation per thread;
        a second turn is refused while the lease is live, and a crashed turn's
        expired lease is taken over
    parent:
      type: reference
      kind: substrate.reamde.dev/llm/thread
      inverse: subagentThreads
      inverseDescription: the sub-agent runs this thread called
      description: the calling agent's thread, on sub-agent threads
