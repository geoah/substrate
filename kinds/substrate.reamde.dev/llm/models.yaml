# The models the three seeded provider rows offer, as llm/model records
# (decision record 0242). They are records, not declarations: the record seed
# (internal/engine/recordseed.go) writes them at registration, refreshes them
# at every open, and leaves alone one the owner edited or deleted, and one
# whose row and model another record already holds. A changed price here is
# a changed `llm` package version, or no repository receives it.
#
# A reference is spelled as the engine stores it, `{ref: …}`, and a price as
# a canonical decimal, so the seed reads a seeded row as already holding
# what ships. The prices are the ones the seeded rows carried before this
# file existed, so a repository's spend counts the same.
kind: substrate.reamde.dev/llm/model
metadata:
  id: openai:gpt-5
data:
  properties:
    provider:
      ref: substrate.reamde.dev/llm/provider/openai
    model: gpt-5
    label: GPT-5
    pricing:
      inputPer1M: "1.25"
      outputPer1M: "10"
    contextWindow: 400000
---
