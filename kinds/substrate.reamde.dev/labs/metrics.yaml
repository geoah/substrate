# The lab metrics, as DATA: ordinary records of the seeded observations
# package's `metric` kind, with ids starting with the package that ships them
# (`labs/`, decision record 0192). An analyte reported in two unit systems is
# two metrics (`labs/ldl_cholesterol` in mmol/L, `labs/ldl_cholesterol_mass`
# in mg/dL), because no linear conversion joins an amount and a mass
# concentration; the analytes (metrics_analytes.yaml) say how they convert.
kind: substrate.reamde.dev/observations/metric
metadata:
  id: labs/ldl_cholesterol
data:
  properties:
    name: LDL cholesterol
    description: >-
      Cholesterol carried in low-density lipoprotein, as an amount concentration
      in serum or plasma. A result in mg/dL is ldl_cholesterol_mass.
    codes:
      - system: "http://loinc.org"
        code: "22748-8"
        display: "Cholesterol in LDL [Moles/volume] in Serum or Plasma"
    unit:
      ref: substrate.reamde.dev/core/unit/mmol/L
    form: gauge
    hold: PT0S
    reducers:
      - last
      - avg
      - min
      - max
      - count
    displayPrecision: 2
    category: labs
---
kind: substrate.reamde.dev/observations/metric
metadata:
  id: labs/ldl_cholesterol_mass
data:
  properties:
    name: LDL cholesterol (mass)
    description: >-
      Cholesterol carried in low-density lipoprotein, as a mass concentration
      in serum or plasma. A result in mmol/L is ldl_cholesterol.
    codes:
      - system: "http://loinc.org"
        code: "2089-1"
        display: "Cholesterol in LDL [Mass/volume] in Serum or Plasma"
      - system: "http://loinc.org"
        code: "13457-7"
        display: "Cholesterol in LDL [Mass/volume] in Serum or Plasma by calculation"
    unit:
      ref: substrate.reamde.dev/core/unit/mg/dL
    form: gauge
    hold: PT0S
    reducers:
      - last
      - avg
      - min
      - max
      - count
    displayPrecision: 0
    category: labs
