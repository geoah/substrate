kind: substrate.reamde.dev/observations/metric
metadata:
  id: labs/hba1c
data:
  properties:
    name: HbA1c
    description: >-
      Glycated haemoglobin as a percentage of all haemoglobin, the NGSP and
      DCCT unit. Never pooled with the IFCC value in mmol/mol, hba1c_ifcc;
      the two relate by a formula, not a unit.
    codes:
      - system: "http://loinc.org"
        code: "4548-4"
        display: Hemoglobin A1c/Hemoglobin.total in Blood
    unit:
      ref: substrate.reamde.dev/core/unit/percent
    form: gauge
    hold: PT0S
    reducers:
      - last
      - avg
      - min
      - max
      - count
    compatibility: ngsp
    displayPrecision: 1
    category: labs
