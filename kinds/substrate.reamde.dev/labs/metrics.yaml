  id: labs/wbc
data:
  properties:
    name: White blood cells
    description: >-
      White blood cells per litre of blood, by automated count.
    codes:
      - system: "http://loinc.org"
        code: "6690-2"
        display: "Leukocytes [#/volume] in Blood by Automated count"
    unit:
      ref: substrate.reamde.dev/core/unit/1e9/L
    form: gauge
    hold: PT0S
    reducers:
      - last
      - avg
      - min
      - max
      - count
    displayPrecision: 2
    category: labs
