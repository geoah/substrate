kind: substrate.reamde.dev/observations/metric
metadata:
  id: labs/urine_albumin_creatinine_ratio
data:
  properties:
    name: Urine albumin to creatinine ratio
    description: >-
      Albumin over creatinine in a urine sample, in milligrams of albumin
      per millimole of creatinine (mg/mmol), an early sign of kidney damage.
      A result in mg/g is a mass ratio and does not convert to it: the factor
      is creatinine's molar mass, which no conversion here carries. A lab
      that finds no albumin writes the code not-detected.
    codes:
      - system: "http://loinc.org"
        code: "32294-1"
        display: "Albumin/Creatinine [Ratio] in Urine"
      - system: "http://loinc.org"
        code: "30000-4"
        display: "Microalbumin/Creatinine [Ratio] in Urine"
