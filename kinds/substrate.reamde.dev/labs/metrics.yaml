kind: substrate.reamde.dev/observations/metric
metadata:
  id: labs/egfr
data:
  properties:
    name: eGFR
    description: >-
      The glomerular filtration rate estimated from creatinine, per 1.73 square
      metres of body surface, so it converts to no plain flow in mL/min. The
      codes are the CKD-EPI equations' of 2009 and 2021, whose results pool
      here; an MDRD or a cystatin C estimate's code is not listed.
    codes:
      - system: "http://loinc.org"
        code: "98979-8"
        display: "Glomerular filtration rate [Volume Rate/Area] in Serum,
          Plasma or Blood by Creatinine-based formula (CKD-EPI 2021)/1.73
          sq M"
      - system: "http://loinc.org"
        code: "62238-1"
        display: "Glomerular filtration rate [Volume Rate/Area] in Serum,
          Plasma or Blood by Creatinine-based formula (CKD-EPI)/1.73 sq M"
    unit:
      ref: substrate.reamde.dev/core/unit/mL/min/1.73m2
    form: gauge
    hold: PT0S
    reducers:
      - last
      - avg
      - min
      - max
      - count
    displayPrecision: 0
    category: labs
