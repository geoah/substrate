# hba1c and hba1c_ifcc relate by the IFCC and NGSP master equation, not a
# molar mass: IFCC mmol/mol = (NGSP % - 2.15) x 10.929.
kind: substrate.reamde.dev/labs/analyte
metadata:
  id: labs/hba1c
data:
  properties:
    metric:
      ref: substrate.reamde.dev/observations/metric/labs/hba1c
    loincParts:
      component: "Hemoglobin A1c/Hemoglobin.total"
      property: MFr
      timing: Pt
      system: Bld
      scale: Qn
    conversions:
      - target:
          ref: substrate.reamde.dev/observations/metric/labs/hba1c_ifcc
        formula: ngsp-to-ifcc
        parameters:
          slope: "10.929"
          intercept: "2.15"
        version: "1"
---
kind: substrate.reamde.dev/labs/analyte
metadata:
  id: labs/hba1c_ifcc
data:
  properties:
    metric:
      ref: substrate.reamde.dev/observations/metric/labs/hba1c_ifcc
    loincParts:
      component: "Hemoglobin A1c/Hemoglobin.total^^standardized per IFCC-RMP
        for CDT"
      property: SFr
      timing: Pt
      system: Bld
      scale: Qn
    conversions:
      - target:
          ref: substrate.reamde.dev/observations/metric/labs/hba1c
        formula: ifcc-to-ngsp
        parameters:
          slope: "10.929"
          intercept: "2.15"
        version: "1"
---
