# The lab facts behind the catalogue's paired lab metrics, as DATA: one
# `analyte` record per metric of a pair, its id the metric's, naming the
# LOINC parts of the metric's code (as LOINC publishes them) and the
# conversion the `convertlab` function writes onto the other metric of the
# pair. A mass and an amount concentration of one analyte convert by its
# molar mass; HbA1c's two units by a formula. Blood glucose is one metric
# whose units convert on their own (analyte_units.yaml), so its record
# carries its LOINC parts and molar mass and no conversion.
#
# The file sorts after metrics.yaml on purpose: the install puts a
# package's data records in file order, and each analyte's `metric` must exist.

# ldl_cholesterol and ldl_cholesterol_mass: 386.65 g/mol, cholesterol,
# C27H46O.
kind: substrate.reamde.dev/labs/analyte
metadata:
  id: labs/ldl_cholesterol
data:
  properties:
    metric:
      ref: substrate.reamde.dev/observations/metric/labs/ldl_cholesterol
    loincParts:
      component: "Cholesterol.in LDL"
      property: SCnc
      timing: Pt
      system: Ser/Plas
      scale: Qn
    molarMass: "386.65"
    conversions:
      - target:
          ref: substrate.reamde.dev/observations/metric/labs/ldl_cholesterol_mass
        formula: molar-mass
        version: "1"
---
kind: substrate.reamde.dev/labs/analyte
metadata:
  id: labs/ldl_cholesterol_mass
data:
  properties:
    metric:
      ref: substrate.reamde.dev/observations/metric/labs/ldl_cholesterol_mass
    loincParts:
      component: "Cholesterol.in LDL"
