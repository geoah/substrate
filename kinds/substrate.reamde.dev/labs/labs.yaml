# The `labs` catalogue: blood tests and what a lab reports (decision record
# 0192). A lab report and its results are typed kinds, and a result binds
# core's `observed(single)` beside its own properties, so the observed index
# reads it like any observation. The 22 lab metrics (metrics.yaml, ids
# `labs/<name>`) and the analytes that say how each one converts between unit
# systems (metrics_analytes.yaml) are data, and `convertlab` writes a result
# in the paired unit system too.
#
# It requires `health` for one analyte: a meter's `health/blood_glucose`.
# Labs never edits a base kind: lab-only definition data is an `analyte`
# pointing at the metric.
kind: substrate.reamde.dev/core/package
metadata:
  id: substrate.reamde.dev/labs
data:
  authority: substrate.reamde.dev
  package: labs
  # 1: the lab half of the health sample at its version 8 (analyte,
  # labreport, labresult, convertlab and the lab metrics, renamed from
  # `health/<name>` to `labs/<name>`).
  version: 1
---
# ---- the bundle document: the install unit ------------------------------------
# Kinds, one function and the lab metrics and analytes as data. The record
# views (views.yaml: a lab report, a lab result, and a lab trend on the metric
# kind) are data too, and an upgrade replaces one only where its owner has not
# edited it.
kind: substrate.reamde.dev/core/bundle
metadata:
  id: substrate.reamde.dev/labs
data:
  authority: substrate.reamde.dev
  package: labs
  description: >-
    Your blood tests: lab reports and results, a catalogue of the common analytes,
    and each result converted between mmol/L and mg/dL.
  requires:
    - substrate.reamde.dev/health
  installs:
    - substrate.reamde.dev/labs/analyte
    - substrate.reamde.dev/labs/labreport
    - substrate.reamde.dev/labs/labresult
    - substrate.reamde.dev/labs/convertlab
---
# ---- lab results in the other unit system ------------------------------------
# Fired by `labs-on-labresult` (triggers.yaml) on every create, update and
# delete of a lab result. A mass and an amount concentration of one analyte
# are two metrics whose units no linear conversion joins (metrics.yaml), so a
# read of LDL in mmol/L cannot answer a result a lab reported in mg/dL. This function writes each
# result's value in the paired metric too, as a derived lab result, using the
# conversions the `analyte` records list (metrics_analytes.yaml).
kind: substrate.reamde.dev/core/function
metadata:
  id: substrate.reamde.dev/labs/convertlab
data:
  authority: substrate.reamde.dev
  package: labs
  description: >-
    Write a lab result's value in its paired unit system as a derived lab
    result, such as LDL cholesterol in mmol/L for a result in mg/dL, and delete
    the derived results a changed or deleted result no longer implies.
  runtime: python
  timeout: PT30S
  permissions:
    reads:
      kinds:
        - substrate.reamde.dev/labs/labresult
        - substrate.reamde.dev/labs/analyte
        - substrate.reamde.dev/observations/metric
      budgets:
        calls: 32
        rows: 200
    writes:
      - substrate.reamde.dev/labs/labresult
  source: |
    """Lab results in the paired unit system, as derived results.

    ONE INPUT AT A TIME. A delivery names one `labresult`. The body reads the
    `analyte` records that point at the result's metric and, for each conversion
    one lists, writes the value in the target metric as a `labresult` of its
    own: the input's report, source, time, specimen, status and flags, the
    target metric, `derivedFrom` naming the input and `conversion` saying how.
    It then deletes the input's derived results it no longer implies, so a
    corrected input rewrites them and a deleted one takes them with it.

    SKIPPED: an input that carries `derivedFrom` (a derivation is never converted
    again, which also keeps the body from feeding itself), an input with no
    `value` (a coded, ratio, text or absent result), a counter (a running
    total, which a lab never reports), a conversion onto the input's own
    metric, a value or a target whose unit the formula does not read, and
    an amount or a summed summary under an NGSP/IFCC formula, whose intercept
    does not carry over a sum. Each skip is counted in the output.

    FORMS. A gauge, an amount and a summary convert; a summary keeps its
    `statistic` and `period`, which its form requires.

    IDS are `<input id>/as/<target metric id>`. Past 128 characters the input id
    is hashed with host.ids.external.

    FORMULAS. `molar-mass` divides a mass concentration by the analyte's
    `molarMass` (grams per mole) into an amount concentration, or multiplies the
    other way. `ngsp-to-ifcc` is IFCC mmol/mol = (NGSP % - intercept) x slope and
    `ifcc-to-ngsp` its inverse, with the conversion's own `parameters`. Every
    formula is increasing, so a comparator (`<0.01`) carries over. The input's
    `revision` is copied, so a rewrite of the input rewrites its derivations,
    and raised to the derived result's stored one where that is higher: an
    input deleted and written again starts its revisions afresh, but a derived
    result the delete's delivery has not yet removed refuses a lower one.

    DIGITS. A derived value keeps one significant digit more than the value it
    came from, rounded half to even, so a conversion neither invents precision
    nor loses the input's.
    """
    from decimal import Context, Decimal, ROUND_HALF_EVEN

    LABRESULT = "substrate.reamde.dev/labs/labresult"
    ANALYTE = "substrate.reamde.dev/labs/analyte"
    METRIC = "substrate.reamde.dev/observations/metric"
    UNIT = "substrate.reamde.dev/core/unit"
    FORMULA_VERSION = "1"
    MAX_ID = 128

    # Every property a derived result gets from this body. Each write names all
    # of them, None where the input implies nothing, so a rewrite clears what the
    # previous one set.
    DERIVED = ("metric", "source", "about", "report", "form", "statistic",
               "period", "hold", "value", "at", "endsAt", "utcOffset",
               "specimen", "method", "status", "interpretation",
               "referenceRanges", "revision", "derivedFrom", "conversion")
    # The input's own properties a derived result repeats as they are.
    COPIED = ("source", "about", "report", "form", "statistic", "period",
              "hold", "at", "endsAt", "utcOffset", "specimen", "method",
              "status", "interpretation", "revision")
    # Each formula's input and output unit, by unit id; molar-mass reads
    # whether the input is a mass or an amount concentration by which of the
    # two bases its unit converts to.
    AFFINE = {"ngsp-to-ifcc": ("percent", "mmol/mol"), "ifcc-to-ngsp": ("mmol/mol", "percent")}
    MASS, AMOUNT = "mass-concentration", "amount-concentration"
    MOLAR_BASE = {MASS: "g/L", AMOUNT: "mol/L"}


    def _path(value):
        """A stored reference's record path, in either spelling."""
        if isinstance(value, dict):
            value = value.get("ref")
        return value if isinstance(value, str) else ""


    def _id_in(path, kind):
        prefix = kind + "/"
        return path[len(prefix):] if path.startswith(prefix) else ""


    def _text(d):
        """A Decimal as the plain digits the engine reads."""
        return format(d, "f")


    def _digits(converted):
        """host.units.convert's answer as digits, whether it is the bare digits
        or carries its exactness beside them."""
        if isinstance(converted, dict):
            return converted.get("value")
        if isinstance(converted, (tuple, list)):
            return converted[0]
        return converted


    def _rounded(value, digits):
        """value at one significant digit more than `digits` holds."""
        places = max(1, len(Decimal(digits).as_tuple().digits)) + 1
        return _text(Context(prec=places, rounding=ROUND_HALF_EVEN).plus(value))


    def _at_places_of(value, converted):
        """value at the decimal places of the converted result's text, so a
        reference bound compares with the result digit for digit: a bound
        rounded to its own significant digits moves 3 mmol/L of LDL to 120
        mg/dL beside a result of 120, where 116 keeps the result above it."""
        exponent = min(0, Decimal(converted).as_tuple().exponent)
        return _text(value.quantize(Decimal(1).scaleb(exponent), rounding=ROUND_HALF_EVEN))


    class _Run:
        def __init__(self, host):
            self.host = host
            self.concentrations = {}
            self.metric_units = {}
            self.wrote = 0
            self.deleted = 0
            self.skipped = {}

        def skip(self, why):
            self.skipped[why] = self.skipped.get(why, 0) + 1

        def concentration(self, unit):
            """MASS or AMOUNT for a unit that converts to that base through the
            repository's linear conversions, else None."""
            if unit not in self.concentrations:
                self.concentrations[unit] = next(
                    (kind for kind, base in MOLAR_BASE.items() if self.host.units.converts(unit, base)), None)
            return self.concentrations[unit]

        def convert(self, value, frm, to):
            """value in `frm` as a Decimal in `to`, two units joined by linear
            conversions. The value itself goes through the host, never a
            factor read off one unit: a conversion may carry an offset."""
            if frm == to:
                return value
            return Decimal(_digits(self.host.units.convert(value, frm, to)))

        def target_unit(self, path):
            """The unit id a metric's `unit` reference names, or None."""
            if path not in self.metric_units:
                row = self.host.records.get(METRIC, _id_in(path, METRIC))
                unit = ((row or {}).get("properties") or {}).get("unit")
                self.metric_units[path] = _id_in(_path(unit), UNIT) or None
            return self.metric_units[path]

        def apply(self, formula, analyte, conversion, quantity, unit):
            """One quantity in `unit` by one formula -> (Decimal, parameters), or
            None where the formula does not read the units."""
            digits, frm = quantity.get("value"), quantity.get("unit")
            if not isinstance(digits, str) or not frm:
                return None
            x = Decimal(digits)
            if formula == "molar-mass":
                raw = analyte.get("molarMass")
                if raw is None:
                    return None
                grams = Decimal(str(raw))
                source, target = self.concentration(frm), self.concentration(unit)
                if grams <= 0 or {source, target} != {MASS, AMOUNT}:
                    return None
                base = self.convert(x, frm, MOLAR_BASE[source])
                out = base / grams if source == MASS else base * grams
                return self.convert(out, MOLAR_BASE[target], unit), {"molarMass": _text(grams)}
            if formula in AFFINE:
                params = conversion.get("parameters") or {}
                if params.get("slope") is None or params.get("intercept") is None:
                    return None
                slope, intercept = Decimal(str(params["slope"])), Decimal(str(params["intercept"]))
                reads, writes = AFFINE[formula]
                if not self.host.units.converts(frm, reads) or not self.host.units.converts(unit, writes):
                    return None
                x = self.convert(x, frm, reads)
                out = (x - intercept) * slope if formula == "ngsp-to-ifcc" else x / slope + intercept
                return self.convert(out, writes, unit), {"slope": _text(slope), "intercept": _text(intercept)}
            return None

        def ranges(self, formula, analyte, conversion, ranges, unit, converted):
            """The reference ranges in `unit`, each bound at the places of
            `converted`, the result's converted digits."""
            out = []
            for rng in ranges or []:
                if not isinstance(rng, dict):
                    continue
                moved = {k: v for k, v in rng.items() if k not in ("low", "high")}
                for bound in ("low", "high"):
                    q = rng.get(bound)
                    if not isinstance(q, dict):
                        continue
                    got = self.apply(formula, analyte, conversion, q, unit)
                    if got is not None:
                        moved[bound] = {"value": _at_places_of(got[0], converted), "unit": unit}
                out.append(moved)
            return out or None

        def derived_id(self, rid, target_id):
            did = "%s/as/%s" % (rid, target_id)
            if len(did) > MAX_ID:
                did = "%s/as/%s" % (self.host.ids.external("labs", "labresult", rid), target_id)
            return did

        def derive(self, rid, p):
            """Every derived result one input implies, by id."""
            desired = {}
            if p is None:
                return desired
            if p.get("derivedFrom"):
                self.skip("derived")
                return desired
            value = p.get("value")
            if not isinstance(value, dict):
                self.skip("no value")
                return desired
            form = p.get("form")
            if form == "counter":
                self.skip("counter")
                return desired
            summed = form == "amount" or (form == "summary" and p.get("statistic") == "sum")
            metric = _path(p.get("metric"))
            page = self.host.records.list(ANALYTE, where={"metric": {"eq": metric}}, first=10)
            for row in page.get("records") or []:
                analyte = row.get("properties") or {}
                for conversion in analyte.get("conversions") or []:
                    formula = conversion.get("formula")
                    if summed and formula in AFFINE:
                        self.skip("%s of a sum" % formula)
                        continue
                    target = _path(conversion.get("target"))
                    unit = self.target_unit(target) if target and target != metric else None
                    got = self.apply(formula, analyte, conversion, value, unit) if unit else None
                    if got is None:
                        self.skip("%s onto %s" % (formula, _id_in(target, METRIC) or "nothing"))
                        continue
                    out, params = got
                    derived = {name: p.get(name) for name in COPIED}
                    quantity = {"value": _rounded(out, value["value"]), "unit": unit}
                    if value.get("comparator"):
                        quantity["comparator"] = value["comparator"]
                    derived.update({
                        "metric": {"ref": target},
                        "value": quantity,
                        "referenceRanges": self.ranges(formula, analyte, conversion,
                                                       p.get("referenceRanges"), unit,
                                                       quantity["value"]),
                        "derivedFrom": [{"ref": LABRESULT + "/" + rid}],
                        "conversion": {"formula": formula, "parameters": params,
                                       "version": FORMULA_VERSION},
                    })
                    desired[self.derived_id(rid, _id_in(target, METRIC))] = derived
            return desired

        def reconcile(self, rid, desired):
            """Write what one input implies and delete what it no longer does."""
            page = self.host.records.list(
                LABRESULT, where={"derivedFrom": {"eq": LABRESULT + "/" + rid}}, first=100)
            stored = {row.get("id"): (row.get("properties") or {}).get("revision")
                      for row in page.get("records") or []}
            for did in sorted(desired):
                whole = {name: desired[did].get(name) for name in DERIVED}
                was = stored.get(did)
                if isinstance(was, int) and not isinstance(was, bool) and (
                        not isinstance(whole["revision"], int) or whole["revision"] < was):
                    whole["revision"] = was
                self.host.effects.put(LABRESULT, did, properties=whole)
                self.wrote += 1
            for row in page.get("records") or []:
                if row.get("id") not in desired:
                    self.host.effects.delete(LABRESULT, row["id"])
                    self.deleted += 1


    def main(input, host):
        envelope = input.get("envelope") or {}
        change = envelope.get("change") or {}
        rid = change.get("id") or ""
        if change.get("kind") != LABRESULT or not rid:
            return {"output": {"skipped": "not a lab result"}}
        record = envelope.get("record")
        live = bool(record) and not record.get("deletedAt")
        run = _Run(host)
        run.reconcile(rid, run.derive(rid, (record.get("properties") or {}) if live else None))
        return {"output": {"input": rid, "wrote": run.wrote, "deleted": run.deleted,
                           "skipped": run.skipped}}
