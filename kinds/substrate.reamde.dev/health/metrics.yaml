    name: Blood oxygen saturation
    description: >-
      The share of haemoglobin carrying oxygen, measured by pulse oximetry.
      Garmin calls it Pulse Ox. A writer copies the hold, PT20M, onto each
      value: an overnight series of readings about ten minutes apart is covered,
      and the daytime after the last reading is not. The Garmin field name
      follows the Health API's documentation and is unverified against a live
      account.
    codes:
      - system: "http://loinc.org"
        code: "59408-5"
        display: Oxygen saturation in Arterial blood by Pulse oximetry
      - system: healthkit
        code: HKQuantityTypeIdentifierOxygenSaturation
      - system: healthconnect
        code: OxygenSaturationRecord
      - system: googlefit
        code: com.google.oxygen_saturation
      - system: whoop
        code: spo2_percentage
        display: Recovery score SpO2
      - system: garmin
        code: timeOffsetSpo2Values
        display: Pulse Ox summary values
    unit:
      ref: substrate.reamde.dev/core/unit/percent
    form: gauge
    hold: PT20M
    reducers:
      - avg
      - min
      - max
      - last
    displayPrecision: 0
    # A nightly summary lands on the day the night ends, as WHOOP scores it;
    # a raw reading is an instant, which places the same either way.
    bucketPlace: end
    category: oxygen
