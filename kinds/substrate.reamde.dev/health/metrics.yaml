    description: >-
      Weight over height squared. A writer copies the hold, PT0S, onto each
      value: a weighing is a point in time, so an average is the mean of the
      weighings it covers, and no weighing stands for the days after it.
    codes:
      - system: "http://loinc.org"
        code: "39156-5"
        display: "Body mass index (BMI) [Ratio]"
      - system: healthkit
        code: HKQuantityTypeIdentifierBodyMassIndex
      - system: garmin
        code: bodyMassIndex
        display: Body composition BMI
    unit:
      ref: substrate.reamde.dev/core/unit/kg/m2
    form: gauge
    hold: PT0S
    reducers:
      - avg
      - min
      - max
      - last
    displayPrecision: 1
    category: body
