kind: substrate.reamde.dev/observations/metric
metadata:
  id: health/blood_glucose
data:
  properties:
    name: Blood glucose
    description: >-
      Glucose in the blood, from a meter or a continuous monitor, in mmol/L{glucose}
      or mg/dL{glucose} as the device reports it. The two units carry the
      analyte, so they convert through glucose's molar mass and an aggregate
      reads both as one series, in mmol/L unless the read names mg/dL{glucose}.
      A writer sends the annotated code, never plain mg/dL or mmol/L, which
      convert to nothing here. A writer copies the hold, PT15M, onto each
      value: a continuous monitor reads every 5 to 15 minutes.
    codes:
      - system: "http://loinc.org"
        code: "15074-8"
        display: "Glucose [Moles/volume] in Blood"
      - system: "http://loinc.org"
        code: "2339-0"
        display: "Glucose [Mass/volume] in Blood"
      - system: healthkit
        code: HKQuantityTypeIdentifierBloodGlucose
      - system: healthconnect
        code: BloodGlucoseRecord
      - system: googlefit
        code: com.google.blood_glucose
    unit:
      ref: substrate.reamde.dev/core/unit/mmol/L_glucose
    form: gauge
    hold: PT15M
    reducers:
      - avg
      - min
      - max
      - percentile
      - durationIn
    compatibility: whole-blood
    displayPrecision: 1
    category: glucose
---
kind: substrate.reamde.dev/observations/metric
metadata:
  id: health/sleep_stage
data:
  properties:
    name: Sleep stage
    description: >-
      Which stage of sleep, as a code over a span: awake, light, deep or rem;
      asleep for sleep the source did not stage; in_bed for time in bed that
      is not asleep and is no other code, such as Health Connect's awake in
      bed. A source that reports when each stage happened writes one value
      per segment, and its segments never overlap. A source that reports only
      a total per stage, such as WHOOP, writes each total over the whole sleep,
      so its spans overlap and the values, not the spans, are the time in
      each stage; a window narrower than the night spreads such a total evenly
      across the night. Summed by code over the night, both are the time in
      each stage. A night's whole time in bed is the sleep's timeInBed and
      never an in_bed span: summed by code, the night would count twice.
    codes:
      - system: healthkit
        code: HKCategoryTypeIdentifierSleepAnalysis
      - system: healthconnect
        code: SleepSessionRecord
        display: stages
      - system: googlefit
        code: com.google.sleep.segment
    codeSet:
      - awake
      - light
      - deep
      - rem
      - asleep
      - in_bed
    form: amount
    reducers:
      - sum
      - count
    # A night lands on the day it ends, so each day holds one night.
    bucketPlace: end
    category: sleep
