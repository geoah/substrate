# Units annotated with the analyte they measure, as DATA: records of core's
# `unit` and `conversion` kinds (decision record 0186) that this package adds
# to the repository's unit graph. A mass and an amount concentration convert
# only through one analyte's molar mass, so the plain `mg/dL` and `mmol/L`
# the repository is seeded with never convert to each other. These units
# carry the analyte in their UCUM annotation (`mg/dL{glucose}`), so one
# conversion can join them without joining the plain ones.
#
# A writer sends the code (`mmol/L{glucose}`) or the id; the server stores
# the id and keeps the digits as written. `health/blood_glucose` anchors to
# `mmol/L_glucose`, so it admits a reading in either unit and an aggregate
# of it answers one series, in mmol/L unless the read names another unit.
#
# The file sorts before metrics.yaml on purpose: the install puts a
# package's data records in file order, and a metric's `unit` must exist.
kind: substrate.reamde.dev/core/unit
metadata:
  id: mmol/L_glucose
data:
  properties:
    name: millimole of glucose per liter
    symbol: mmol/L
    code: mmol/L{glucose}
---
kind: substrate.reamde.dev/core/unit
metadata:
  id: mg/dL_glucose
data:
  properties:
    name: milligram of glucose per deciliter
    symbol: mg/dL
    code: mg/dL{glucose}
---
# Glucose (C6H12O6) is 180.156 g/mol, so 1 mmol/L is 180.156 mg/L, which is
# 18.0156 mg/dL: the molar mass `health/blood_glucose`'s analyte record
# carries (metrics_analytes.yaml).
kind: substrate.reamde.dev/core/conversion
metadata:
  id: mmol/L_glucose-mg/dL_glucose
data:
  properties:
    from:
      ref: substrate.reamde.dev/core/unit/mmol/L_glucose
    to:
      ref: substrate.reamde.dev/core/unit/mg/dL_glucose
    factor: "18.0156"
