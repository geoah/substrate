<meta charset="utf-8">
<title>Substrate Console Prototype</title>
<meta name="description" content="The substrate console redesign in the Paper direction: data, providers, agents and tools, in everyday language with technical details on demand.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* ---------- prototype chrome (outside the app) ---------- */
:root{
  --pg:#EEEEEC; --pg-ink:#1d1d1b; --pg-ink2:#6b6a66; --pg-line:#dcdbd6; --pg-card:#ffffff; --pg-acc:#1d1d1b;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--pg:#0c0c0c;--pg-ink:#ededeb;--pg-ink2:#9a9994;--pg-line:#2a2a28;--pg-card:#161616;--pg-acc:#ededeb;color-scheme:dark}}
:root[data-theme="dark"]{--pg:#0c0c0c;--pg-ink:#ededeb;--pg-ink2:#9a9994;--pg-line:#2a2a28;--pg-card:#161616;--pg-acc:#ededeb;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--pg);color:var(--pg-ink);font-family:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;padding-inline:16px;padding-block:0 32px}
button{font:inherit;color:inherit}
.pg-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--pg);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding-block:12px;border-bottom:1px solid var(--pg-line);margin-bottom:14px}
.pg-title{font-weight:600;font-size:14px;letter-spacing:-.01em;margin-right:6px}
.pg-title small{display:block;font-weight:400;color:var(--pg-ink2);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--pg-line);border-radius:8px;padding:2px;background:var(--pg-card);flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 10px;border-radius:6px;font-size:12.5px;cursor:pointer;color:var(--pg-ink2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--pg-acc);color:var(--pg)}
.seg button:focus-visible,.app :focus-visible{outline:2px solid #4c8df6;outline-offset:1px}
.pg-lab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--pg-ink2);margin-right:6px}
.pg-grp{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.pg-note{font-size:12.5px;color:var(--pg-ink2);margin:0 0 12px;max-width:80ch;line-height:1.5}
.pg-note b{color:var(--pg-ink);font-weight:600}

/* ---------- app tokens: Direction A "Paper" ---------- */
.app{
  --bg:#FFFFFF; --side:#F8F7F5; --panel:#FBFAF8; --hover:rgba(55,53,47,.055); --sel:rgba(47,107,219,.09);
  --ink:#252420; --ink2:#5d5c56; --ink3:#9a9892; --line:#ECEBE7; --line2:#DEDCD6;
  --acc:#2F6BDB; --acc-ink:#fff; --acc-soft:#EAF1FD; --acc-text:#2358BF;
  --ok:#2F8F5B; --ok-soft:#E6F4EC; --warn:#B7791F; --warn-soft:#FBF1DE; --bad:#C94A3D; --bad-soft:#FBE9E6;
  --r:6px; --fs:14px; --row:38px; --pad:10px; --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.08);
  /* kind hues: tile background / glyph ink */
  --c-gray-b:#EFEEEB;--c-gray-f:#6f6d67; --c-brown-b:#F3EAE3;--c-brown-f:#8A5A3B; --c-orange-b:#FCEBDD;--c-orange-f:#C2621D;
  --c-yellow-b:#FBF1D2;--c-yellow-f:#A07A12; --c-green-b:#E3F2E8;--c-green-f:#2E7D4F; --c-teal-b:#DDF1F0;--c-teal-f:#1F7A77;
  --c-blue-b:#E3EDFB;--c-blue-f:#2F63C0; --c-purple-b:#EEE8FA;--c-purple-f:#6B4BB8; --c-pink-b:#FBE7F0;--c-pink-f:#B03A72; --c-red-b:#FBE6E3;--c-red-f:#BE3B2E;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  background:var(--bg);color:var(--ink);font-size:var(--fs);line-height:1.45;
  border:1px solid var(--pg-line);border-radius:12px;overflow:hidden;display:grid;grid-template-columns:248px minmax(0,1fr);height:min(860px,calc(100vh - 120px));min-height:560px;position:relative
}
/* Direction B "Workbench" */
.app.b{
  --bg:#FCFCFD; --side:#F2F3F5; --panel:#F7F8FA; --hover:rgba(20,24,33,.05); --sel:rgba(15,138,122,.10);
  --ink:#14171D; --ink2:#4B5261; --ink3:#8A909C; --line:#E6E8EC; --line2:#D6D9DF;
  --acc:#0F8A7A; --acc-ink:#fff; --acc-soft:#E2F4F1; --acc-text:#0B6F62;
  --r:5px; --fs:13px; --row:32px; --pad:8px;
  grid-template-columns:220px minmax(0,1fr)
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .app{--bg:#191919;--side:#202020;--panel:#1d1d1d;--hover:rgba(255,255,255,.055);--sel:rgba(91,146,240,.16);--ink:#E8E7E3;--ink2:#A9A8A3;--ink3:#74736E;--line:#2B2B29;--line2:#3a3a37;--acc:#5B92F0;--acc-ink:#0e1420;--acc-soft:rgba(91,146,240,.16);--acc-text:#8AB2F6;--ok:#5BC08A;--ok-soft:rgba(91,192,138,.14);--warn:#E0A84A;--warn-soft:rgba(224,168,74,.14);--bad:#EA7A6D;--bad-soft:rgba(234,122,109,.14);--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.5);
  --c-gray-b:#2c2c2a;--c-gray-f:#b3b1ab;--c-brown-b:#352a22;--c-brown-f:#D2A17E;--c-orange-b:#3a2717;--c-orange-f:#F09A5A;--c-yellow-b:#352e17;--c-yellow-f:#E3C15A;--c-green-b:#1b3024;--c-green-f:#6FCB93;--c-teal-b:#163130;--c-teal-f:#5ECFC9;--c-blue-b:#1b2a42;--c-blue-f:#86AEF3;--c-purple-b:#2a2340;--c-purple-f:#B7A0F0;--c-pink-b:#3a1f2c;--c-pink-f:#F08DBA;--c-red-b:#3c211d;--c-red-f:#F28B7E}
  :root:not([data-theme="light"]) .app.b{--bg:#0F1114;--side:#15181C;--panel:#13161A;--hover:rgba(255,255,255,.05);--sel:rgba(44,194,171,.14);--ink:#E6E8EC;--ink2:#A2A9B6;--ink3:#6C7380;--line:#23272E;--line2:#303540;--acc:#2CC2AB;--acc-ink:#04201b;--acc-soft:rgba(44,194,171,.14);--acc-text:#5FD6C3}
}
:root[data-theme="dark"] .app{--bg:#191919;--side:#202020;--panel:#1d1d1d;--hover:rgba(255,255,255,.055);--sel:rgba(91,146,240,.16);--ink:#E8E7E3;--ink2:#A9A8A3;--ink3:#74736E;--line:#2B2B29;--line2:#3a3a37;--acc:#5B92F0;--acc-ink:#0e1420;--acc-soft:rgba(91,146,240,.16);--acc-text:#8AB2F6;--ok:#5BC08A;--ok-soft:rgba(91,192,138,.14);--warn:#E0A84A;--warn-soft:rgba(224,168,74,.14);--bad:#EA7A6D;--bad-soft:rgba(234,122,109,.14);--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.5);
  --c-gray-b:#2c2c2a;--c-gray-f:#b3b1ab;--c-brown-b:#352a22;--c-brown-f:#D2A17E;--c-orange-b:#3a2717;--c-orange-f:#F09A5A;--c-yellow-b:#352e17;--c-yellow-f:#E3C15A;--c-green-b:#1b3024;--c-green-f:#6FCB93;--c-teal-b:#163130;--c-teal-f:#5ECFC9;--c-blue-b:#1b2a42;--c-blue-f:#86AEF3;--c-purple-b:#2a2340;--c-purple-f:#B7A0F0;--c-pink-b:#3a1f2c;--c-pink-f:#F08DBA;--c-red-b:#3c211d;--c-red-f:#F28B7E}
:root[data-theme="dark"] .app.b{--bg:#0F1114;--side:#15181C;--panel:#13161A;--hover:rgba(255,255,255,.05);--sel:rgba(44,194,171,.14);--ink:#E6E8EC;--ink2:#A2A9B6;--ink3:#6C7380;--line:#23272E;--line2:#303540;--acc:#2CC2AB;--acc-ink:#04201b;--acc-soft:rgba(44,194,171,.14);--acc-text:#5FD6C3}
.app.compact{--row:30px;--fs:13px}
.app.b:not(.compact){--row:36px}

/* ---------- shared app pieces ---------- */
.app svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app .mono{font-family:var(--mono);font-size:.9em;letter-spacing:-.01em}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-top{display:flex;align-items:center;gap:8px;padding:12px 12px 8px}
.ws{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:var(--r);flex:1;min-width:0;cursor:pointer}
.ws:hover{background:var(--hover)}
.ws-mark{width:22px;height:22px;border-radius:6px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:12px}
.ws-name{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-search{margin:4px 12px 8px;display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line2);border-radius:var(--r);color:var(--ink3);background:var(--bg);cursor:pointer;font-size:13px}
.side-search kbd{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink3)}
.side-scroll{overflow:auto;flex:1;padding:0 8px 12px}
.nav{display:flex;align-items:center;gap:8px;padding:0 8px;height:30px;border-radius:var(--r);color:var(--ink2);cursor:pointer;font-size:13.5px;white-space:nowrap;border:0;background:none;width:100%;text-align:left}
.app.b .nav{height:28px;font-size:13px}
.nav:hover{background:var(--hover);color:var(--ink)}
.nav[aria-current="page"]{background:var(--hover);color:var(--ink);font-weight:500}
.nav .cnt{margin-left:auto;font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.nav .badge{margin-left:auto;background:var(--acc);color:var(--acc-ink);font-size:11px;font-weight:600;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.nav.sub{padding-left:14px}
.nav .grow{overflow:hidden;text-overflow:ellipsis}
.sec{font-size:11.5px;font-weight:500;color:var(--ink3);padding:14px 8px 4px;display:flex;align-items:center;gap:6px}
.sec .src{font-family:var(--mono);font-size:10.5px;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pkg{display:flex;align-items:center;gap:6px;padding:0 8px;height:28px;color:var(--ink2);font-size:12.5px;cursor:pointer;border-radius:var(--r);border:0;background:none;width:100%}
.pkg:hover{background:var(--hover)}
.pkg svg.i{width:13px;height:13px}
.side-foot{border-top:1px solid var(--line);padding:8px}

.main{min-width:0;display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.topbar{height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid transparent}
.app.b .topbar{border-bottom-color:var(--line);height:42px}
.crumbs{display:flex;align-items:center;gap:4px;min-width:0;font-size:13px;color:var(--ink2);flex-wrap:nowrap;overflow:hidden}
.crumbs button{border:0;background:none;padding:3px 6px;border-radius:var(--r);cursor:pointer;color:inherit;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.crumbs button:hover{background:var(--hover);color:var(--ink)}
.crumbs .sep{color:var(--ink3)}
.crumbs .here{color:var(--ink)}
.tb-actions{margin-left:auto;display:flex;align-items:center;gap:4px}
.scroll{overflow:auto;flex:1;min-height:0}
.body-split{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0;flex:1}
.body-split > .scroll{border-right:1px solid var(--line)}

.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:var(--r);border:1px solid var(--line2);background:var(--bg);color:var(--ink);font-size:13px;cursor:pointer;white-space:nowrap}
.app.b .btn{height:28px;font-size:12.5px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:500}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink2)}
.btn.ghost:hover{background:var(--hover);color:var(--ink)}
.btn.icon{width:30px;padding:0;justify-content:center}
.app.b .btn.icon{width:28px}
.btn.sm{height:26px;font-size:12.5px;padding:0 8px}
.btn svg.i{width:15px;height:15px}
.kbd{font-family:var(--mono);font-size:11px;color:var(--ink3);border:1px solid var(--line2);border-radius:4px;padding:0 4px;line-height:16px}

/* glyph tiles: the kind's stable icon + hue */
.glyph{display:inline-grid;place-items:center;border-radius:4px;flex:none}
.glyph svg.i{stroke-width:2}
.glyph.s-xs{width:16px;height:16px;border-radius:4px}.glyph.s-xs svg.i{width:11px;height:11px}
.glyph.s-sm{width:20px;height:20px;border-radius:5px}.glyph.s-sm svg.i{width:13px;height:13px}
.glyph.s-md{width:28px;height:28px;border-radius:7px}.glyph.s-md svg.i{width:16px;height:16px}
.glyph.s-lg{width:40px;height:40px;border-radius:10px}.glyph.s-lg svg.i{width:22px;height:22px}
.glyph.bare{background:none!important;width:auto}
.c-gray{background:var(--c-gray-b);color:var(--c-gray-f)} .c-brown{background:var(--c-brown-b);color:var(--c-brown-f)} .c-orange{background:var(--c-orange-b);color:var(--c-orange-f)}
.c-yellow{background:var(--c-yellow-b);color:var(--c-yellow-f)} .c-green{background:var(--c-green-b);color:var(--c-green-f)} .c-teal{background:var(--c-teal-b);color:var(--c-teal-f)}
.c-blue{background:var(--c-blue-b);color:var(--c-blue-f)} .c-purple{background:var(--c-purple-b);color:var(--c-purple-f)} .c-pink{background:var(--c-pink-b);color:var(--c-pink-f)} .c-red{background:var(--c-red-b);color:var(--c-red-f)}
.t-gray{color:var(--c-gray-f)}.t-brown{color:var(--c-brown-f)}.t-orange{color:var(--c-orange-f)}.t-yellow{color:var(--c-yellow-f)}.t-green{color:var(--c-green-f)}.t-teal{color:var(--c-teal-f)}.t-blue{color:var(--c-blue-f)}.t-purple{color:var(--c-purple-f)}.t-pink{color:var(--c-pink-f)}.t-red{color:var(--c-red-f)}

/* record reference */
.rref{display:inline-flex;align-items:center;gap:5px;max-width:100%;cursor:pointer;color:var(--ink);vertical-align:middle;border:0;background:none;padding:0;font:inherit;text-align:left}
.rref .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rref.mention .t{border-bottom:1px solid var(--line2);line-height:1.25}
.rref.mention:hover .t{border-bottom-color:var(--ink2)}
.rref.chip{background:var(--hover);border-radius:999px;padding:1px 8px 1px 3px;font-size:.93em;line-height:1.55}
.rref.chip:hover{background:var(--line2)}
.rref.chip .glyph{border-radius:999px}
.rref.text .k{color:var(--ink3);font-size:.9em}
.rref.text:hover .t{text-decoration:underline;text-underline-offset:2px}
.rref.idonly{font-family:var(--mono);font-size:.88em;color:var(--acc-text)}
/* kind reference */
.kref{display:inline-flex;align-items:center;gap:6px;cursor:pointer;min-width:0;border:0;background:none;padding:0;font:inherit;color:var(--ink);text-align:left}
.kref .full{font-family:var(--mono);font-size:12px;color:var(--ink3);overflow-wrap:anywhere}
.kref.stack{align-items:flex-start}
.kref.stack .lines{display:flex;flex-direction:column;min-width:0}
.kpath{font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere;cursor:pointer;border:0;background:none;padding:0;text-align:left}
.kpath .a{color:var(--ink3)} .kpath .p{color:var(--ink2)} .kpath .n{color:var(--ink);font-weight:500} .kpath .s{color:var(--ink3);padding:0 1px}
/* actor */
.actor{display:inline-flex;align-items:center;gap:6px;cursor:pointer;min-width:0;border:0;background:none;padding:0;font:inherit;color:var(--ink);text-align:left}
.av{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:600;flex:none}
.av svg.i{width:12px;height:12px;stroke-width:2}
.av.you{background:var(--ink);color:var(--bg)}
.av.agent{background:var(--c-purple-b);color:var(--c-purple-f)}
.av.fn{background:var(--c-orange-b);color:var(--c-orange-f)}
.av.cli{background:var(--c-gray-b);color:var(--c-gray-f)}
.av.engine{background:var(--c-gray-b);color:var(--c-gray-f)}
.actor .via{color:var(--ink3)}
.actor.tag{border:1px solid var(--line2);border-radius:5px;padding:0 6px 0 4px;height:22px;font-size:12.5px}
.actor.tag svg.i{width:13px;height:13px;color:var(--ink2)}
.actor.id{font-family:var(--mono);font-size:12px;border:1px solid var(--line2);border-radius:999px;padding:1px 8px;background:var(--hover)}
/* state + enum */
.st{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:.95em}
.st .dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.st.dot-open{color:var(--acc-text)} .st.dot-done{color:var(--ok)} .st.dot-proposed{color:var(--warn)} .st.dot-abandoned{color:var(--ink3)} .st.dot-active{color:var(--acc-text)} .st.dot-known{color:var(--ok)} .st.dot-utility{color:var(--ink3)}
.st .lab{color:var(--ink)}
.st.tag{padding:1px 8px;border-radius:5px;font-weight:500}
.st.tag.dot-open,.st.tag.dot-active{background:var(--acc-soft)} .st.tag.dot-done,.st.tag.dot-known{background:var(--ok-soft)} .st.tag.dot-proposed{background:var(--warn-soft)} .st.tag.dot-abandoned,.st.tag.dot-utility{background:var(--hover)}
.st.tag .lab{color:inherit}
.st svg.si{width:14px;height:14px;flex:none}
.en{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.en.tagged{padding:0 7px;border-radius:4px;line-height:20px;font-size:.93em}
.prio{display:inline-flex;align-items:flex-end;gap:1.5px;height:12px}
.prio i{width:3px;background:var(--line2);border-radius:1px;display:block}
.prio i.on{background:var(--ink2)}
.prio.urgent{color:var(--bad)}
.urgent-ico{width:14px;height:14px;border-radius:3px;background:var(--bad);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:700}
.muted{color:var(--ink3)}
.empty-v{color:var(--ink3)}
.src-badge{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:4px;font-size:9.5px;font-weight:700;background:#fff;color:#4285F4;border:1px solid var(--line2);cursor:help;flex:none}
.idtxt{font-family:var(--mono);font-size:12px;color:var(--ink2);overflow-wrap:anywhere}
.copy{border:0;background:none;color:var(--ink3);cursor:pointer;padding:2px;border-radius:4px;display:inline-grid;place-items:center;vertical-align:middle}
.copy:hover{background:var(--hover);color:var(--ink)}
.copy svg.i{width:13px;height:13px}
.info{display:inline-grid;place-items:center;color:var(--ink3);cursor:help;vertical-align:middle}
.info svg.i{width:13px;height:13px}

/* page layouts */
.page{padding:28px 40px 60px;max-width:1080px}
.app.b .page{padding:20px 24px 40px;max-width:none}
.doc{max-width:760px;margin:0 auto;padding:40px 32px 80px}
.h1{font-size:26px;font-weight:650;letter-spacing:-.02em;line-height:1.2;margin:0;text-wrap:balance}
.app.b .h1{font-size:20px;font-weight:600}
.rec-title{font-size:32px;font-weight:700;letter-spacing:-.025em;line-height:1.15;margin:10px 0 6px;text-wrap:balance}
.app.b .rec-title{font-size:22px;font-weight:600;margin:4px 0}
.lede{color:var(--ink2);margin:6px 0 0;max-width:68ch}
.h2{font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em}
.app.b .h2{font-size:13px}
.h2 .n{color:var(--ink3);font-weight:400;margin-left:4px}
.sechead{display:flex;align-items:center;gap:8px;margin:32px 0 10px}
.app.b .sechead{margin:22px 0 8px}
.sechead .more{margin-left:auto}
.hdr{display:flex;align-items:flex-start;gap:14px}
.hdr .grow{flex:1;min-width:0}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;color:var(--ink3);font-size:12.5px;margin-top:6px}
.meta .idtxt{color:var(--ink3)}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line);margin-top:18px}
.app.b .toolbar{margin-top:10px;padding:8px 0}
.views{display:flex;gap:2px;margin-right:8px}
.view{border:0;background:none;padding:4px 8px;border-radius:var(--r);font-size:13px;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.view[aria-pressed="true"]{color:var(--ink);background:var(--hover);font-weight:500}
.search-in{display:flex;align-items:center;gap:6px;height:30px;padding:0 8px;border:1px solid var(--line2);border-radius:var(--r);color:var(--ink3);font-size:13px;min-width:150px}
.app.b .search-in{height:28px}
.fchip{display:inline-flex;align-items:center;height:28px;border:1px solid var(--line2);border-radius:var(--r);font-size:12.5px;overflow:hidden}
.fchip > span{padding:0 8px;display:inline-flex;align-items:center;gap:5px;height:100%}
.fchip .f{color:var(--ink2);border-right:1px solid var(--line)}
.fchip .x{border-left:1px solid var(--line);color:var(--ink3);cursor:pointer}
.fchip.pill{border-radius:999px;background:var(--acc-soft);border-color:transparent;color:var(--acc-text)}
.fchip.pill .f{border:0;color:var(--acc-text);padding-right:2px}
.fchip.pill .x{border:0;color:var(--acc-text)}

/* table */
.tbl-wrap{overflow-x:auto}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:var(--fs)}
table.t th{position:sticky;top:0;background:var(--bg);font-weight:500;color:var(--ink3);font-size:12.5px;text-align:left;height:34px;padding:0 var(--pad);border-bottom:1px solid var(--line);white-space:nowrap}
.app.b table.t th{height:30px;font-size:12px;background:var(--panel)}
table.t th .th{display:inline-flex;align-items:center;gap:5px}
table.t th svg.i{width:13px;height:13px}
table.t td{height:var(--row);padding:0 var(--pad);border-bottom:1px solid var(--line);white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
table.t tr.r{cursor:pointer}
table.t tr.r:hover td{background:var(--hover)}
table.t tr.r[aria-selected="true"] td{background:var(--sel)}
table.t td.title{font-weight:500}
table.t td.num{text-align:right;font-variant-numeric:tabular-nums}
table.t td:first-child,table.t th:first-child{padding-left:2px}
.app.b table.t td:first-child,.app.b table.t th:first-child{padding-left:12px}
table.t tr.grp td{height:34px;background:var(--panel);font-weight:500;color:var(--ink2);font-size:12.5px}
.tfoot{display:flex;align-items:center;gap:10px;padding:10px 2px;color:var(--ink3);font-size:12.5px}
.newrow{color:var(--ink3);display:flex;gap:6px;align-items:center;height:var(--row);padding-left:2px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line)}
.newrow:hover{background:var(--hover);color:var(--ink2)}
.due-soon{color:var(--warn)} .due-over{color:var(--bad)}

/* property sheet (read and edit are the same row) */
.props{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr);row-gap:2px;margin:18px 0 6px}
.app.b .props{grid-template-columns:110px minmax(0,1fr);margin:6px 0}
.pl{display:flex;align-items:center;gap:7px;color:var(--ink2);min-height:34px;padding:0 6px 0 2px;font-size:13.5px}
.app.b .pl{font-size:12.5px;min-height:30px}
.pl svg.i{width:14px;height:14px;color:var(--ink3)}
.pv{display:flex;align-items:center;gap:6px;min-height:34px;padding:3px 8px;border-radius:var(--r);cursor:text;flex-wrap:wrap;min-width:0}
.app.b .pv{min-height:30px;padding:2px 6px}
.pv:hover{background:var(--hover)}
.pv.editing{background:var(--bg);box-shadow:0 0 0 1px var(--acc),0 0 0 4px var(--acc-soft);cursor:default}
.pv .empty-v{font-size:13px}
.pv-more{grid-column:1/-1;border:0;background:none;color:var(--ink3);text-align:left;padding:6px 2px;cursor:pointer;font-size:13px;display:flex;gap:6px;align-items:center}
.pv-more:hover{color:var(--ink2)}
/* stacked variant */
.props.stacked{display:flex;flex-direction:column;gap:14px}
.props.stacked .row{display:flex;flex-direction:column;gap:2px}
.props.stacked .pl{min-height:0;font-size:12.5px;font-weight:500;color:var(--ink2)}
.props.stacked .pv{padding:0;min-height:0}
.props.stacked .pv:hover{background:none}
.props.stacked .desc{font-size:12.5px;color:var(--ink3)}
/* boxed variant = today's console */
.props.boxed{display:flex;flex-direction:column;gap:18px}
.props.boxed .row{display:flex;flex-direction:column;gap:6px}
.props.boxed .pl{font-weight:600;color:var(--ink);min-height:0;font-size:14px}
.props.boxed .pv{border:1px solid var(--line2);background:var(--panel);min-height:40px;padding:8px 12px;cursor:default}
.props.boxed .desc{font-size:13px;color:var(--ink2)}
.props.boxed .pmeta{font-size:12px;color:var(--ink3)}
.edit-pop{position:absolute;z-index:5;background:var(--bg);border:1px solid var(--line2);border-radius:8px;box-shadow:var(--shadow);width:260px;padding:6px}
.opt{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:5px;font-size:13px}
.opt:hover,.opt.hl{background:var(--hover)}
.opt .k{margin-left:auto;color:var(--ink3);font-size:12px}
.pop-in{display:flex;align-items:center;gap:6px;padding:4px 8px 8px;border-bottom:1px solid var(--line);margin-bottom:4px;color:var(--ink3);font-size:13px}
.pop-note{font-size:11.5px;color:var(--ink3);padding:6px 8px 2px;border-top:1px solid var(--line);margin-top:4px}

.prose{max-width:68ch;line-height:1.65;color:var(--ink)}
.prose p{margin:0 0 .8em}
.divider{height:1px;background:var(--line);margin:22px 0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:16px}
.tab{border:0;background:none;padding:8px 10px;font-size:13px;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}
.tab .n{color:var(--ink3);font-size:12px}

/* activity */
.feed{display:flex;flex-direction:column}
.fi{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid var(--line)}
.app.b .fi{padding:7px 0}
.fi .when{color:var(--ink3);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums;padding-top:1px}
.fi .what{line-height:1.5;min-width:0}
.fi .what .sub{color:var(--ink3);font-size:12.5px;margin-top:2px}
.fi .what .chg{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:4px}
.chg .old{text-decoration:line-through;color:var(--ink3)}
.day{font-size:12px;font-weight:600;color:var(--ink3);padding:18px 0 4px;text-transform:none}
.grouped{color:var(--acc-text);cursor:pointer;border:0;background:none;padding:0;font:inherit}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;background:var(--bg);text-align:left;font:inherit;color:inherit}
.app.b .card{border-radius:7px;padding:12px}
.card:hover{border-color:var(--line2);background:var(--panel)}
.card .ct{font-weight:600;display:flex;align-items:center;gap:8px}
.card .cs{color:var(--ink3);font-size:12.5px}
.card .cn{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.inbox{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.app.b .inbox{border-radius:7px}
.ib{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.ib:last-child{border-bottom:0}
.ib:hover{background:var(--hover)}
.ib .it{font-weight:500}
.ib .is{color:var(--ink3);font-size:12.5px;margin-top:1px}
.ib .ico{width:28px;height:28px;border-radius:7px;display:grid;place-items:center}
.ico.warn{background:var(--warn-soft);color:var(--warn)} .ico.acc{background:var(--acc-soft);color:var(--acc-text)} .ico.agent{background:var(--c-purple-b);color:var(--c-purple-f)}
.dash{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px}
.panel{border:1px solid var(--line);border-radius:7px;background:var(--bg)}
.panel .ph{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.panel .pb{padding:4px 12px 8px}

/* inspector (B) */
.insp{background:var(--panel);overflow:auto;min-height:0}
.insp-h{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.insp-s{padding:10px 16px;border-bottom:1px solid var(--line)}
.insp-s .lbl{font-size:11.5px;font-weight:500;color:var(--ink3);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.kv{display:grid;grid-template-columns:90px minmax(0,1fr);gap:6px 10px;font-size:12.5px}
.kv dt{color:var(--ink3)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* dialogs / drawers */
.scrim{position:absolute;inset:0;background:rgba(15,15,15,.28);z-index:20;display:grid;place-items:start center;padding-top:56px}
.dialog{width:min(640px,92%);background:var(--bg);border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--line);max-height:calc(100% - 90px);display:flex;flex-direction:column;overflow:hidden}
.dialog .dh{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink2)}
.dialog .db{padding:6px 28px 20px;overflow:auto}
.dialog .df{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.title-in{font-size:28px;font-weight:700;letter-spacing:-.02em;border:0;outline:0;width:100%;background:none;color:var(--ink);padding:14px 0 4px;font-family:inherit}
.title-in::placeholder{color:var(--ink3)}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--bg);border-left:1px solid var(--line2);box-shadow:var(--shadow);z-index:21;display:flex;flex-direction:column}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fld label{font-size:12.5px;font-weight:500;color:var(--ink)}
.fld .hint{font-size:12px;color:var(--ink3)}
.fld .err{font-size:12px;color:var(--bad)}
.inp{height:32px;border:1px solid var(--line2);border-radius:var(--r);padding:0 10px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px;width:100%;display:flex;align-items:center;gap:6px}
.inp.bad{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.inp.ph{color:var(--ink3)}
.ta{min-height:80px;align-items:flex-start;padding-top:8px}

/* callouts, steps, misc */
.callout{display:flex;gap:10px;padding:12px 14px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--ink2);align-items:flex-start}
.callout.warn{background:var(--warn-soft);border-color:transparent;color:var(--ink)}
.callout.warn svg.i{color:var(--warn)}
.callout .ct{font-weight:600;color:var(--ink)}
.steps{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:start}
.step:last-child{border-bottom:0}
.step .n{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:11.5px;color:var(--ink3);font-weight:600}
.step.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.step.now .n{border-color:var(--acc);color:var(--acc-text)}
.step .st1{font-weight:500}
.step.done .st1{color:var(--ink2)}
.step .ss{color:var(--ink3);font-size:12.5px;margin-top:2px;max-width:60ch}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:1px 8px;border-radius:999px;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.neutral{background:var(--hover);color:var(--ink2)} .pill.acc{background:var(--acc-soft);color:var(--acc-text)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.prov{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.provcard{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;background:var(--bg);font:inherit;color:inherit}
.app.b .provcard{border-radius:7px;padding:12px}
.provcard:hover{border-color:var(--line2)}
.plogo{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:14px;border:1px solid var(--line)}
.code{font-family:var(--mono);font-size:12.5px;line-height:1.7;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;overflow:auto;white-space:pre;color:var(--ink)}
.code .k{color:var(--acc-text)} .code .c{color:var(--ink3)} .code a{color:inherit;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px;cursor:pointer}

/* hovercard */
.hc{position:fixed;z-index:100;width:300px;background:var(--bg);color:var(--ink);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow);padding:12px;font-size:12.5px;pointer-events:none;display:none;font-family:"Geist",ui-sans-serif,system-ui,sans-serif;line-height:1.45}
.hc .hct{display:flex;gap:8px;align-items:center;font-weight:600;font-size:13.5px}
.hc .hck{color:var(--ink3);margin-top:8px;display:grid;grid-template-columns:70px minmax(0,1fr);gap:4px 8px}
.hc .hck span:nth-child(odd){color:var(--ink3)} .hc .hck span:nth-child(even){color:var(--ink);overflow-wrap:anywhere}
.hc .hcd{color:var(--ink2);margin-top:6px}

/* elements page */
.el-grid{display:flex;flex-direction:column;gap:26px}
.el{border-top:1px solid var(--line);padding-top:18px}
.el-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.el-h p{margin:4px 0 0;color:var(--ink2);font-size:13px;max-width:72ch;flex-basis:100%}
.el-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:12px}
.eo{border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--bg);font:inherit;color:inherit;min-width:0}
.eo[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.eo .eh{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.eo .eh .tagcur{font-weight:500;font-size:11px;color:var(--ink3);border:1px solid var(--line2);border-radius:4px;padding:0 5px}
.eo .ed{font-size:12px;color:var(--ink3);line-height:1.45}
.eo .ex{display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--panel);border-radius:7px;min-width:0}
.radio{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line2);flex:none}
.eo[aria-pressed="true"] .radio{border:4px solid var(--acc)}
.token-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sw{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--ink3);width:92px}
.sw i{height:36px;border-radius:7px;border:1px solid var(--line);display:block}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .app .side{display:none}
  .body-split{grid-template-columns:minmax(0,1fr)}
  .body-split .insp{border-top:1px solid var(--line)}
  .dash{grid-template-columns:minmax(0,1fr)}
  .page{padding:20px 16px 40px}
  .doc{padding:24px 16px 60px}
  .props{grid-template-columns:minmax(96px,120px) minmax(0,1fr)}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
/* ---------- v2: ownership, links, history, tree ---------- */
.pk{font-family:var(--mono);font-size:.86em;background:var(--hover);padding:0 5px;border-radius:4px;color:var(--ink);white-space:nowrap}
.pv .vv{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.own{margin-left:auto;display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:2px 4px;border-radius:5px;cursor:pointer;color:var(--ink3);font:inherit;font-size:12px;flex:none}
.own:hover{background:var(--line)}
.own .altn{background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:0 7px;font-size:11.5px;font-weight:500;white-space:nowrap}
.own .otxt{white-space:nowrap}
.own .mk{display:inline-flex}
.props .own.hov .mk,.props .own.hov .otxt{opacity:0}
.props .pv:hover .own.hov .mk,.props .pv:hover .own.hov .otxt,.props .own.hov.open .mk{opacity:1}
.pbadge{width:18px;height:18px;border-radius:5px;display:inline-grid;place-items:center;font-size:10px;font-weight:700;border:1px solid var(--line2);background:var(--bg);flex:none}
.av.sm{width:18px;height:18px;font-size:9.5px}
.pdet{grid-column:1/-1;margin:2px 0 12px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;font-size:13px;display:flex;flex-direction:column;gap:10px;min-width:0}
.app.b .insp .pdet{padding:10px;font-size:12.5px}
.pdet .l1{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;color:var(--ink2)}
.pdet .l1 b{color:var(--ink);font-weight:500}
.pdet .expl{color:var(--ink3);font-size:12.5px}
.pdet .foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.pdet .foot .pkey{margin-left:auto}
.pkey{font-family:var(--mono);font-size:11.5px;color:var(--ink3)}
.tier{font-size:11.5px;font-weight:500;padding:0 7px;border-radius:4px;line-height:19px;white-space:nowrap}
.tier.owner{background:var(--acc-soft);color:var(--acc-text)} .tier.machine{background:var(--ok-soft);color:var(--ok)} .tier.bundle{background:var(--warn-soft);color:var(--warn)}
.sub-h{font-size:11.5px;font-weight:500;color:var(--ink3);text-transform:none;margin-bottom:-4px}
.alts{display:flex;flex-direction:column}
.alt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:8px 0;border-top:1px solid var(--line);align-items:center}
.alt .v{font-weight:500}
.alt .from{grid-column:1;font-size:12px;color:var(--ink3);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.alt .from .idtxt{font-size:11px;color:var(--ink3)}
.alt .act{grid-column:2;grid-row:1/3}
.union{display:flex;flex-direction:column;gap:6px}
.union .u{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.propbar{display:flex;align-items:center;gap:8px;margin-top:22px}
.propbar .seg{background:var(--bg);border-color:var(--line2)}
.propbar .seg button{font-size:12px;padding:3px 9px}
.propbar .seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--ink3);align-items:center;margin-left:auto}
.legend span{display:inline-flex;gap:5px;align-items:center}
.lk{display:flex;flex-direction:column;gap:12px}
.lk-g{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.app.b .lk-g{border-radius:7px}
.lk-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:9px 12px;background:var(--panel);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink2)}
.lk-h .cnt{margin-left:auto;color:var(--ink3);font-variant-numeric:tabular-nums}
.lk-i{display:flex;gap:12px;align-items:center;padding:0 12px;min-height:36px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.lk-i:last-child{border-bottom:0}
.lk-i .r2{margin-left:auto;display:flex;gap:12px;align-items:center;color:var(--ink3);font-size:12.5px}
.lk-i .idtxt{font-size:11px;color:var(--ink3)}

.optc{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--bg);font:inherit;color:inherit;cursor:pointer}

const ENUM_C = {coworker:"blue",friend:"green",acquaintance:"gray",relative:"pink",unknown:"gray",italian:"green",greek:"blue",japanese:"red",mexican:"orange"};
const enumTag = v => `<span class="en tagged c-${ENUM_C[v]||"gray"}">${cap(v)}</span>`;
function fmtDate(iso,{time=true}={}){

  const rel = d.toDateString()===NOW.toDateString()?"Today":days===1?"Tomorrow":days===-1?"Yesterday":days>1&&days<7?wd:dm;

const app=document.getElementById("app"), hc=document.getElementById("hc");
function curPageKey(){ if(S.page==="record"){ const e=Object.entries(REC_PAGE).find(([,id])=>id===S.rec); return e?e[0]:""; } if(S.page==="collection") return S.kind==="gcontact"?"big":S.kind==="task"?"collection":""; if(S.page==="tools") return S.toolView==="page"?"tool-page":"tools"; return S.page; }
// The page's markup by name. A switch, so a restored or hashed S.page is only
// ever compared: a name that is not a page (an inherited "constructor") never
// selects a function, and falls back to Home.
function pageHtml(page){
  switch(page){
    case "data": return dataPage();
    case "collection": return collection();
    case "record": return record();
    case "new": return newRecord();
    case "agents": return agentsPage();
    case "tools": return S.toolView==="page"?toolPage():toolsList();
    case "providers": return providersPage();
    case "history": return historyPage();
    case "settings": return settingsPage();
    default: return home();
  }
}
function render(){
  app.className=`app a${S.density==="compact"?" compact":""}`;
  app.innerHTML=sidebar()+`<main class="main">${pageHtml(S.page)}</main>`;
  document.getElementById("dirNote").innerHTML=`<b>Paper.</b> Record, tool and provider pages start at the left edge; tables use the full width (both are settings, saved in your substrate). The sidebar lists only main collections; <b>Technical details</b> (${S.tech?"on":"off"}) shows the supporting and internal ones, references, ids and change numbers.`;
  seg("techSeg",[["off","Everyday"],["on","Technical"]],S.tech?"on":"off",v=>{S.tech=v==="on";});
  seg("pageSeg",PAGES,curPageKey(),v=>{S.editing=null;S.srcView=false;S.dialog=null;
    if(REC_PAGE[v]){S.page="record";S.rec=REC_PAGE[v];} else if(v==="big"){S.page="collection";S.kind="gcontact";} else if(v==="collection"){S.page="collection";S.kind="task";} else if(v==="tool-page"){S.page="tools";S.toolView="page";S.tool="synccontacts";} else if(v==="tools"){S.page="tools";S.toolView="list";} else {S.page=v; if(v==="providers")S.prov="list";}});
  seg("themeSeg",[["auto","System"],["light","Light"],["dark","Dark"]],S.theme,v=>{S.theme=v;});
  if(S.theme==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme",S.theme);
  save();
}
function seg(id,items,cur,on){
  const el=document.getElementById(id); if(!el) return;
  el.innerHTML=items.map(([k,l])=>`<button type="button" aria-pressed="${k===cur}" data-k="${k}">${l}</button>`).join("");
  el.onclick=e=>{const b=e.target.closest("button[data-k]"); if(!b) return; on(b.dataset.k); commit();};
}
function commit(){ render(); const k=curPageKey()||S.page; if(location.hash.slice(1)!==k) history.replaceState(null,"",`#${k}`); }
function go(target){
  const i=target.indexOf(":"), pg=i<0?target:target.slice(0,i), arg=i<0?"":target.slice(i+1);
  S.editing=null; S.dialog=null;
  if(pg==="record"){ const r=R[arg]; if(!r||KINDS[r.kind].system) return; S.page="record"; S.rec=r.mergedInto||arg; S.srcView=false; }
  else if(pg==="collection"){ S.page="collection"; S.kind=KINDS[arg]?arg:"task"; }
  else if(pg==="prov"){ S.page="providers"; S.prov=(arg==="google"||arg==="linear")?arg:"list"; }
  else if(pg==="providers"){ S.page="providers"; S.prov="list"; }
  else if(pg==="tool"){ S.page="tools"; S.toolView="page"; S.tool=arg; }
  else if(pg==="tools"){ S.page="tools"; S.toolView="list"; }
  else if(pg==="thread"){ S.page="agents"; S.thread=arg; }
  else if(pg) S.page=pg;
  commit(); const sc=app.querySelector(".scroll"); if(sc) sc.scrollTop=0;
}
app.addEventListener("click",e=>{
  hc.style.display="none";
  const cp=e.target.closest("[data-copy]"); if(cp){ e.stopPropagation(); try{navigator.clipboard.writeText(cp.dataset.copy).then(()=>{cp.title="Copied";},()=>{});}catch(err){} return; }
  const st=e.target.closest("[data-set]"); if(st){ const [k,v]=st.dataset.set.split(":"); S[k]=v; commit(); return; }
  const pgb=e.target.closest("[data-page]"); if(pgb){ const [k,n]=pgb.dataset.page.split(":"); S.pageN[k]=+n; commit(); const gw=app.querySelector(".gridwrap"); if(gw) gw.scrollTop=0; return; }
  const col=e.target.closest("[data-collapse]"); if(col){ const id=col.dataset.collapse; S.collapsed=S.collapsed.includes(id)?S.collapsed.filter(x=>x!==id):S.collapsed.concat(id); commit(); return; }
  const sa=e.target.closest("[data-showall]"); if(sa){ const id=sa.dataset.showall; S.showAll=S.showAll.includes(id)?S.showAll.filter(x=>x!==id):S.showAll.concat(id); commit(); return; }
  const tw=e.target.closest("[data-tw]"); if(tw){ e.stopPropagation(); const id=tw.dataset.tw; S.expanded=S.expanded.includes(id)?S.expanded.filter(x=>x!==id):S.expanded.concat(id); commit(); return; }
  const thr=e.target.closest("[data-thread]"); if(thr){ S.thread=thr.dataset.thread; commit(); return; }
  const to=e.target.closest("[data-toolopen]"); if(to){ const id=to.dataset.toolopen; S.toolOpen=S.toolOpen.includes(id)?S.toolOpen.filter(x=>x!==id):S.toolOpen.concat(id); commit(); return; }
  const own=e.target.closest("[data-own]");
  if(own&&!e.target.closest("[data-go]")){ e.stopPropagation(); const k=own.dataset.own; S.open=S.open.includes(k)?S.open.filter(x=>x!==k):S.open.concat(k); S.editing=null; commit(); return; }
  const act=e.target.closest("[data-act]");
  if(act){ const a=act.dataset.act;
    if(a==="close"&&(e.target===act||act.tagName==="BUTTON")){ if(S.page==="new") S.page="collection"; S.dialog=null; commit(); return; }
    if(a==="empty"){ S.showEmpty=!S.showEmpty; commit(); return; }
    if(a==="src"){ S.srcView=!S.srcView; commit(); return; }
    if(a==="nest"){ S.nest=!S.nest; commit(); return; }
    if(a==="group"){ S.group=!S.group; commit(); return; }
    if(a==="tech"){ S.tech=!S.tech; commit(); return; }
  }
  if(e.target.closest("[data-stop]")&&!e.target.closest("[data-go]")) return;
  if((e.target.closest(".pdet")||e.target.closest(".btn"))&&!e.target.closest("[data-go]")) return;
  const ed=e.target.closest("[data-edit]"); if(ed&&!e.target.closest("[data-go]")){ S.editing=S.editing===ed.dataset.edit?null:ed.dataset.edit; commit(); return; }
  const g=e.target.closest("[data-go]"); if(g&&g.dataset.go){ e.preventDefault(); go(g.dataset.go); return; }
  if(S.editing&&!e.target.closest(".edit-pop")){ S.editing=null; commit(); }
});
/* hover cards: one look for every kind of thing; slower to open, never on a whole row */
function hcBody(spec){
  const i=spec.indexOf(":"), t=spec.slice(0,i), a=spec.slice(i+1);
  if(t==="rec"){ const r=R[a]; if(!r) return ""; const K=KINDS[r.kind]; const ks=(KPROPS[r.kind]||[]).filter(p=>r.p[p]!=null&&PROPS[p].type!=="markdown").slice(0,3);
    return `<div class="hc-top"><div class="hct">${glyph(r.kind,"sm")}${esc(title(r))}</div><div class="hc-sub">${esc(K.plural||K.name)}${K.provider?` · from ${PROV[K.provider].n}`:""}</div></div>${ks.length?`<div class="hck">${ks.map(p=>`<span>${PROPS[p].label}</span><span>${PROPS[p].to?esc([].concat(r.p[p]).map(x=>title(R[x])).join(", ")):PROPS[p].type==="datetime"?fmtDate(r.p[p]):PROPS[p].type==="state"?STATE_WORDS[r.p[p]]:esc(cap(String([].concat(r.p[p])[0])))}</span>`).join("")}</div>`:""}<div class="hc-foot mono" style="font-family:var(--mono);font-size:11px;overflow-wrap:anywhere">${K.ref}/${esc(r.id)}</div>`; }
  if(t==="kind"){ const K=KINDS[a]; return `<div class="hc-top"><div class="hct">${glyph(a,"sm")}${esc(K.plural||K.name)}</div><div class="hcd">${esc(K.desc)}</div></div><div class="hck"><span>Records</span><span>${K.count?num(K.count):"none yet"}</span><span>Shown as</span><span>${PURPOSE[K.purpose||"primary"][0]}</span></div><div class="hc-foot" style="font-family:var(--mono);font-size:11px;overflow-wrap:anywhere">${K.ref}</div>`; }
  if(t==="actor"){ const A=ACTORS[a]; return `<div class="hc-top"><div class="hct">${avatar(a)}${A.name}${A.cls==="you"?` <span style="font-weight:400;color:var(--ink3)">via ${A.via}</span>`:""}</div><div class="hcd">${{you:"You, signed in.",agent:"One of your agents.",fn:"Runs for a provider you added.",engine:"The substrate itself: merges, schedules and housekeeping."}[A.cls]}</div></div><div class="hc-foot" style="font-family:var(--mono);font-size:11px;overflow-wrap:anywhere">${A.id}</div>`; }
  if(t==="own"){ const [id,p]=a.split(":"); return ownSummary(R[id],p); }
  if(t==="prop"){ const [,p]=a.split(":"); const pd=PROPS[p]; return `<div class="hc-top"><div class="hct">${ic(pd.icon)}${pd.label}</div><div class="hcd">${esc(cap(pd.desc))}.</div></div><div class="hc-foot" style="font-family:var(--mono);font-size:11px">${p} · ${pd.type}${pd.to?` → ${KINDS[pd.to].ref}`:""}</div>`; }
  if(t==="pk"){ const pd=PROPS[a]; if(!pd) return ""; return `<div class="hc-top"><div class="hct"><span class="mono" style="font-size:12.5px">${a}</span></div><div class="hcd">${esc(pd.label)}: ${esc(pd.desc)}.</div></div>`; }
  if(t==="text") return `<div class="hc-top"><div class="hcd" style="margin:0;color:var(--ink)">${esc(a)}</div></div>`;
  return "";
}
let hcT;
document.addEventListener("mouseover",e=>{
  const el=e.target.closest("[data-hc]"); clearTimeout(hcT);
  if(!el){ hc.style.display="none"; return; }
  hcT=setTimeout(()=>{ const body=hcBody(el.dataset.hc); if(!body) return;
    hc.innerHTML=body; const av=getComputedStyle(app);
    ["--bg","--ink","--ink2","--ink3","--line","--line2","--shadow","--mono","--acc-soft","--acc-text","--ok-soft","--ok","--warn-soft","--warn","--c-gray-b","--c-purple-b","--c-purple-f","--c-orange-b","--c-orange-f",...["gray","brown","orange","yellow","green","teal","blue","purple","pink","red"].flatMap(c=>[`--c-${c}-b`,`--c-${c}-f`])].forEach(v=>hc.style.setProperty(v,av.getPropertyValue(v)));
    hc.style.display="block"; const r=el.getBoundingClientRect(); const w=280, h=hc.offsetHeight;
    let x=Math.min(r.left,innerWidth-w-12), y=r.bottom+6; if(y+h>innerHeight-8) y=r.top-h-6; hc.style.left=Math.max(8,x)+"px"; hc.style.top=Math.max(8,y)+"px"; },550);
});
document.addEventListener("focusin",e=>{ if(e.target.matches&&e.target.matches("[data-hc]")) e.target.dispatchEvent(new MouseEvent("mouseover",{bubbles:true})); });
addEventListener("scroll",()=>{hc.style.display="none"},true);

// The hash, resolved against the names the prototype knows. The match is the
// list's own constant, never the hash itself, so a name such as constructor
// selects nothing.
const hashName=location.hash.slice(1);
const hm=[...Object.keys(REC_PAGE),"big","collection","tool-page","tools",...PAGES.map(p=>p[0])].find(k=>k===hashName)||"";
if(REC_PAGE[hm]){S.page="record";S.rec=REC_PAGE[hm];} else if(hm==="big"){S.page="collection";S.kind="gcontact";} else if(hm==="collection"){S.page="collection";S.kind="task";} else if(hm==="tool-page"){S.page="tools";S.toolView="page";S.tool="synccontacts";} else if(hm==="tools"){S.page="tools";S.toolView="list";} else if(PAGES.some(p=>p[0]===hm)) S.page=hm;
if(/tech/.test(location.search)) S.tech=true;
if(/tall/.test(location.search)) app.style.height='auto';
render();
})();

</script>
