# Substrate Template's targets, included by apps/xcode/project.yml (which
# `mise run apps:new` writes the include into). xcodegen reads the source and
# package paths here relative to this file, and the build settings' paths
# (INFOPLIST_FILE, CODE_SIGN_ENTITLEMENTS) relative to apps/xcode, where the
# project is written.
packages:
  # The app's core: its root under the kit's link, its manifest and its
  # presenter, with no UI framework.
  TemplateKit:
    path: ../TemplateKit
targets:
  SubstrateTemplate:
    # The app, native on iPhone, iPad and Mac from one target: its scenes
    # and the updater (Sparkle on the Mac alone, through the shared Updater
    # file). Its screens are SubstrateTemplateUI's.
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    scheme:
      testTargets:
        - SubstrateTemplateTests
        - package: TemplateKit/TemplateCoreTests
    sources:
      - Sources
      - Assets.xcassets
      - ../../xcode/Shared/Updater.swift
    dependencies:
      - package: Sparkle
        destinationFilters: [macOS]
      # The kit and TemplateKit come through the framework alone: the app
      # linking them too would hold a second copy of their types.
      - target: SubstrateTemplateUI
    settings:
      base:
        PRODUCT_NAME: SubstrateTemplate
        PRODUCT_BUNDLE_IDENTIFIER: dev.reamde.substrate.template
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: ../template/apple/Support/Info-Template-iOS.plist
        "INFOPLIST_FILE[sdk=macosx*]": ../template/apple/Support/Info-Template-macOS.plist
        CODE_SIGN_ENTITLEMENTS: $(SUBSTRATE_IOS_ENTITLEMENTS_$(SUBSTRATE_ASSOCIATED_DOMAINS))
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": $(SUBSTRATE_MACOS_ENTITLEMENTS_$(SUBSTRATE_ASSOCIATED_DOMAINS))
        SUBSTRATE_IOS_ENTITLEMENTS_NO: ""
        SUBSTRATE_IOS_ENTITLEMENTS_YES: ../template/apple/Support/SubstrateTemplate-iOS-site.entitlements
        SUBSTRATE_MACOS_ENTITLEMENTS_NO: ../template/apple/Support/SubstrateTemplate-macOS.entitlements
        SUBSTRATE_MACOS_ENTITLEMENTS_YES: ../template/apple/Support/SubstrateTemplate-macOS-site.entitlements
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": ["$(inherited)", "@executable_path/../Frameworks"]
        ENABLE_HARDENED_RUNTIME: "YES"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Empty is a local build: its loopback client id and redirect
        # (TemplateManifest.localClientID). A release stamps both.
        SUBSTRATE_TEMPLATE_CLIENT_ID: ""
        SUBSTRATE_TEMPLATE_REDIRECT: ""
  SubstrateTemplateUI:
    # The app's screens: the kit's AppShell over TemplateApp and the SwiftUI
    # views that draw TemplateKit's presentations and send its commands. A
    # framework of its own, so its tests run on the Mac outside the app's
    # sandbox and the gallery can write its files.
    type: framework
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - UI
      - ../../xcode/Shared/CheckingForUpdates.swift
    dependencies:
      - package: TemplateKit
        product: TemplateCore
      # The kit by library, not its umbrella: a framework that links the
      # umbrella's package product is left without the libraries under it.
      - package: SubstrateKit
        product: SubstrateCore
      - package: SubstrateKit
        product: SubstrateDevice
      - package: SubstrateKit
        product: SubstrateAPI
      - package: SubstrateKit
        product: SubstrateAuth
      - package: SubstrateKit
        product: SubstrateRuntime
      - package: SubstrateKit
        product: SubstrateLocal
      - package: SubstrateKit
        product: SubstrateScreens
      # SubstrateUI brings SubstrateDeviceApple with it; naming it too
      # links its classes twice.
      - package: SubstrateKit
        product: SubstrateUI
    settings:
      base:
        PRODUCT_NAME: SubstrateTemplateUI
        PRODUCT_BUNDLE_IDENTIFIER: dev.reamde.substrate.template.ui
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: "YES"
  SubstrateTemplateTests:
    # The views drawn from TemplateKit's fixtures, on the Mac, with no host
    # app: with SUBSTRATE_GALLERY naming a folder
    # (`mise run apps:gallery`), each one is written there as a PNG.
    type: bundle.unit-test
    platform: auto
    supportedDestinations: [macOS, iOS]
    sources:
      - Tests
    dependencies:
      - target: SubstrateTemplateUI
      - package: TemplateKit
        product: TemplateCore
      - package: SubstrateKit
        product: SubstrateScreens
      - package: SubstrateKit
        product: SubstrateUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.reamde.substrate.template.tests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
