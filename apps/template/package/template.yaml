# template: what Substrate Template keeps in the owner's substrate. An app's
# package, published under `substrate.reamde.dev` from this folder through
# the authority document (.mise/closures.py): the app's approval asks for it
# as a `package` detail at the version the build carries or later, and the
# server installs it from the document under this very name, the same in
# every repository. The app applies nothing itself.
#
# One kind, an example to replace:
#
#   item   one thing the owner keeps, with a name
kind: substrate.reamde.dev/core/package
metadata:
  id: substrate.reamde.dev/template
data:
  authority: substrate.reamde.dev
  package: template
  # 1: item. Each change ships as the next version, additive only; a
  # published version never changes.
  version: 1
---
# No `requires:`: nothing here points outside the package.
kind: substrate.reamde.dev/core/bundle
metadata:
  id: substrate.reamde.dev/template
data:
  authority: substrate.reamde.dev
  package: template
  description: >-
    The items Substrate Template keeps for you, each with a name.
  installs:
    - substrate.reamde.dev/template/item
