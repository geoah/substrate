# Carried into substrate on 2026-11-02 from rxtx.dev, where it was
# research/workouts/substrate/examples/exercises.yaml, the kinds were the draft
# mneme.rxtx.dev/training and the app was called Spotter. The kinds are now
# the app's own ~/training (decision record 0203) and the adapter is
# substrate-workouts; nothing else changed, so where the comments below
# mention Mneme they describe the plan of the time. README.md beside this
# file says how these records relate to the JSON the app bundles.
#
# Example records: the thirty exercises in the owner's Hevy screenshots, as
# records of ~/training/exercise (research draft of 2026-10-30).
#
# Apply this file first: routines and sets point at these ids. Nothing here is
# applied anywhere yet; README.md beside this file says how and where to.
#
# IDS ARE SLUGS OF THE NAME, as the package's exercise kind asks
# (`chest-press-machine`). The names are Hevy's, as the screenshots print
# them, so an import of the owner's Hevy history finds them by eye; an
# importer still resolves by `codes`, never by name.
#
# CODES ONLY WHERE THEY ARE CERTAIN.
#   - `free-exercise-db`: the id in yuhonas/free-exercise-db,
#     dist/exercises.json (876 exercises, fetched 2026-10-30), only where its
#     entry is the same movement on the same equipment, checked against its
#     instructions. `display` is its own name for it.
#   - `healthconnect`: the androidx ExerciseSegment constant, only where
#     Health Connect has a segment type for exactly this movement.
# The chest press, the seated row and the vertical traction are selectorized
# machines, which free-exercise-db does not have (its machine presses are the
# plate-loaded "Leverage" ones), so they carry no code. No Hevy template ids:
# they are read from the owner's account (GET /v1/exercise_templates), which
# this draft had no access to; the importer adds them, matched on the exact
# titles the screenshots print, when the owner confirms each mapping.
#
# THE UNIT IS `loadStep`'s. Every loaded exercise names its step, which pins it
# to kilograms. Steps are 03 §9.1's defaults by equipment, except the
# plate-loaded machines (2.5 kg, one plate on one arm), the chest press (5 kg,
# which the logged 25 and 35 kg fit) and the three cable exercises (2.5 kg).
# 03 §9.1's cable default of 5 kg made the Pallof press jump from 10 to 15 kg,
# a 50 % step on a light core lift; 2.5 kg is the step a stack's add-on
# weight gives, and the owner can change it per exercise. With every step
# named, the default-grid path (no `loadStep`, the owner's default unit) is
# covered by hand-made exercises in the app's tests.
#
# MUSCLES are Hevy's twenty lay groups. Rest classes are 02 §4.3's rows. The
# default rep ranges are set only on the high-rep exercises, where the
# engine's own default (8 to 12 at RPE 8) is wrong; routines name their own.
#
# IMPLEMENTS on the per-implement exercises: two dumbbells for the presses,
# the fly, the raise, the Romanian deadlift and the split squat, one for the
# single-leg Romanian deadlift (its slot note: one dumbbell, in the opposite
# hand). Volume multiplies the logged load by it; comparisons do not.
kind: ~/training/exercise
metadata:
  id: leg-press-machine
data:
  properties:
    name: Leg Press (Machine)
    measurement: weightreps
    equipment: machine
    laterality: bilateral
    loadBasis: total
    primaryMuscles: [quadriceps]
    secondaryMuscles: [glutes, hamstrings]
    restClass: compound
    loadStep:
      value: "5"
      unit: kg
    codes:
      - system: free-exercise-db
        code: Leg_Press
        display: Leg Press
      - system: healthconnect
        code: EXERCISE_SEGMENT_TYPE_LEG_PRESS
