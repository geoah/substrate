# Carried into substrate on 2026-11-02 from rxtx.dev, where it was
# research/workouts/substrate/examples/sessions.yaml, the kinds were the draft
# mneme.rxtx.dev/training and the app was called Spotter. The kinds are now
# the app's own substrate.reamde.dev/training (decision record 0203) and the adapter is
# substrate-workouts; nothing else changed, so where the comments below
# mention Mneme they describe the plan of the time. README.md beside this
# file says how these records relate to the JSON the app bundles.
#
# Example records: three finished training sessions and every set done in
# them, as records of substrate.reamde.dev/training/session and
# substrate.reamde.dev/training/set (research draft of 2026-10-30).
#
# Apply after exercises.yaml and routines.yaml. The sessions come first and
# the sets after them: a set's `session` must exist (`mustExist`), and
# `apply -f` sends a file's records one by one, in order.
#
# THE SESSIONS, Europe/London. The clocks went back at 02:00 on Sunday
# 25 October 2026, from BST (UTC+1) to GMT (UTC+0).
#   - Day 1 – Strength Foundation, Thu 22 Oct 12:34 BST: `at`
#     11:34:08Z, `utcOffsetStart` and `utcOffsetEnd` 60.
#   - Day 1 – Strength Foundation, Mon 26 Oct 12:31 GMT: `at` 12:31:15Z,
#     offsets 0. Four days later, the same lunchtime on the wall clock, an
#     hour later in UTC.
#   - Fully Body Collection #1, Tue 27 Oct 13:30 GMT: `at` 13:30:00Z,
#     offsets 0. The session the screenshots' PREVIOUS column reads from
#     (their own session is the next one, on 30 Oct).
# Every instant is UTC. `name` is on the local clock, as the app writes it,
# because a display template renders an instant in UTC.
#
# WHAT IS THE OWNER'S AND WHAT IS NOT. The Fully Body session's plank (1:02
# and 0:53), crunch (15 and 15), lumbar extension stretch (10), glute bridge
# (15 and 15) and chest press (W 25 kg x 15, 35 kg x 15, 35 kg x 13 at RPE
# 9.5, and the drop 35 kg x 8 at RPE 9.5) are the screenshots' PREVIOUS
# values. Everything else is illustrative: the dates, both Day 1 sessions,
# every time and rest, the other sets, the body mass and the Health ids.
#
# HEVY'S "D" ROW IS THE SECOND RECORD OF WORKING SET 2'S CHAIN. Hevy keeps a
# drop as a separate row of type dropset after the set it follows. Here the
# 35 kg x 13 set is the chain's head (`structure: drop`, `chainPosition: 1`,
# `ordinal: 2`) and the 35 kg x 8 drop is a record of its own that
# `continues` the head (`chainPosition: 2`, the same `ordinal`, the same
# planned set, `restBefore` 6 s, `restPlanned` PT0S because a drop runs no
# timer). It is one working set, labelled 2 and 2a, not a fourth set, so
# set counts, PREVIOUS and the suggestion treat it as set 2. Its load is the
# 35 kg the owner logged, which is the value Hevy pre-fills from the set
# before (Hevy has no drop rule); whether the pin moved is not known.
# The app would have offered 25 kg (20 % off, rounded down to the 5 kg
# grid; test vector V10a).
#
# IDS are lowercase UUIDv7s whose first 48 bits are the record's own instant:
# a session's `at` (when it started), a set's `at` (when it ended). The
# random bits are fixed by a seed, so a re-run writes the same ids. The Fully
# Body session's id, and the ids and times of its chest press set 2 and the
# drop, are the package README's excerpt, so that excerpt and this file are
# the same records.
#
# THE END STATE, AS AN IMPORTER WRITES IT. Each session is created
# `finished`, which a creating write may do, as a shortcut for the record
# the app's own path (a PUT with no `status` at Start, then PATCHes) ends
# at; coverage.yaml has a session written that way. Re-applying this file is
# safe: a put naming the current state moves nothing, and no revision goes
# down. `revision` is 3 on each session, counting only Start, Finish and the
# Health link; the app raises it on every patch it sends, so a session with
# a pause or a note would end higher (the package README's excerpt ends at
# 14). Each set is at 1, except one set corrected after its tick.
#
# APPLE HEALTH. Each session keeps the UUID HealthKit returned and points
# `workout` at `applehealth/<account>/<UUID>`, where `<account>` is
# Substrate Sync's account for the phone, `substrate-sync-` and the first
# eight characters of its install id. `5e2b9c41` is illustrative; the app
# reads the real one from the server (the package README, "Apple Health").
# `timezone` is the zone the Health workout was saved with. Each session's
# `sport` is `strength`, `health/workout`'s word. No session names
# `activityType`: no routine here does, so each was saved as traditional
# strength training.
#
# REST, as the examples assume the app measures it (the app's design
# decides the details):
#   - `restBefore`: from the tick of the set before, wherever it was, to the
#     moment the rest ended (Skip, or the first touch on the next set). A
#     rep set has no recorded start, so this is the only measure of it. It
#     includes a pause.
#   - `restPlanned`: what the timer counted down, by research 02 §3.3's rule
#     on the set before: warm-up rest, side switch or intra-set pause,
#     transition, round rest, the finished slot's rest, else set rest; a
#     planned set's `rest` wins. PT0S where no timer ran.
#   - `restSkipped`: Skip was pressed.
#   - `startedAt` only on timed sets, from the play tap. A session's first
#     set has no rest fields.
#
# THE PLAN AS IT STOOD. Each session slot keeps its routine slot's planned
# sets (`slots[].sets`), done or not, as Finish writes them, so a later edit
# of the routine loses nothing. Every planned set in these sessions was
# done; none shows one that was not. A routine slot with no set done is not
# kept, and its planned sets go with it.
#
# TARGETS are copied from the routine's planned set, with the termination
# its targets imply; `plannedSet` is the planned set's key (`s2`). The
# effort target is a range (`rpeMin`, `rpeMax`; one value here). What the
# engine ran with and the plan left out is written resolved: `timerMode:
# countdown` on the planks, `myoStopRule: repdrop` and a 15 s
# `intraSetPause` on the myo-rep sets, a 0 s pause on the drop set. A
# chain's later records carry only `plannedSet`: the planned sets here give
# a drop and a mini-set no reps of their own.
#
# HOW EACH VALUE GOT THERE. Every set is `completionMethod: individual` (each
# ticked on its own), `timeBasis: completion` and `rpeScale: rirbased`, and
# a `restMethod` beside every `restBefore`: `start` on the 27 October
# second plank, whose play ended the rest, and `interaction` on every other
# set. Every rating is `rpeMethod: entered`, except one: the 26 October leg
# press set 1, logged with the plan's RPE 8 shown pre-filled and left
# untouched (`rpeMethod: prefilled`). The suggestion reads it as no rating:
# the set met its range, so it assumes the target, RPE 8, and says
# "assuming RPE 8".
#
# WHAT THE NUMBERS MEANT. Each set copies its exercise's `laterality`, and
# with a load its `loadBasis` and `implements` (and `bodyShare` on the
# push-ups), with `repsBasis` beside the reps: `perside` on the split squat,
# the bird dog and the Pallof press, `total` elsewhere.
#
# LABELS in the comments follow requirement 37: W1 and W2 for warm-ups,
# 1, 2, 3 for working sets, 2a for a drop, M for a myo mini-set, "1 left"
# for a side. Each comment quotes what research 03 Part B suggests for that
# set from these records alone (no earlier Hevy history), where it suggests
# anything; README.md has the table and how it was computed.
#
# LEFT OUT ON PURPOSE.
#   - Slots with no sets: Finish dropped them with the unticked sets, so the
#     Fully Body session holds the nine exercises the owner did of 21, in the
#     routine's order (an assumption about Finish; open question 32).
#   - `source`: no app source record exists until the package moves
#     into Mneme (its README, "Moving it into Mneme", step 3).
#   - `setup`: V1 writes no setup, so machine history is shared, like
#     free weights' (`setup` absent; coverage.yaml has setups).
#   - `reachedFailure` and `failedRepAttempted`: no set here ended in
#     failure (coverage.yaml has both).
#   - `loadMode` on the plank, crunch, lumbar extension stretch, glute bridge
#     and bird dog: they move no load, so they add nothing to volume. The
#     owner's Hevy screenshot agrees: after ten such sets and the 25 kg x 15
#     warm-up, its Volume read 375 kg.
#   - Set `notes` and `sourceType`: nothing to note, and nothing imported.

# ---- the sessions ---------------------------------------------------------
#
# Day 1, the first time in these records: every first working set is a cold
# start from the routine's seed load. The Romanian deadlift's first set
# stopped at 7 reps, short of 8 with no RPE (the lower back), so the engine
# took the next set down to 12 kg. Its Health workout id is illustrative.
