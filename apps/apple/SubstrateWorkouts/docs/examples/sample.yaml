# A load and a distance: one dumbbell in each hand, logged per dumbbell.
kind: ~/training/exercise
metadata:
  id: farmers-carry-dumbbell
data:
  properties:
    name: Farmer's Carry (Dumbbell)
    aliases: [Farmer's walk]
    measurement: shortdistanceweight
    equipment: dumbbell
    laterality: bilateral
    loadBasis: perimplement
    implements: 2
    primaryMuscles: [forearms]
    secondaryMuscles: [traps, abdominals]
    restClass: carry
    loadStep:
      value: "2"
      unit: kg
    codes:
