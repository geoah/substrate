# The sample routine Substrate Workouts carries, and the nine exercises it
# names (decision S1 in ../decisions.md, the owner, 2026-11-02): "Only include
# one sample workout routine with examples for all features when the user
# installs the app, allow the user to delete it."
#
# This file is the source of the app's bundled catalogue.
# apps/apple/scripts/workouts-package.py writes it to
# WorkoutsKit/Sources/WorkoutsCore/Resources/Bundled/exercises.json and
# routines.json, and `mise run apple:test:workouts` fails while they differ.
# The app shows these records signed out, and writes them into a repository
# with no routines the first time it signs in there.
#
# ONE EXERCISE PER IDEA. Each slot's `notes` says what it shows, so the
# routine explains itself in the app. What each part shows:
#   leg-press      a warm-up at a percentage of body weight, a top set and a
#                  back-off set 10 % lighter; its own warm-up and set rests
#   chest-press    straight sets with a rep range and an RPE range at a
#                  tempo; one set's own rest; a drop set with two drops
#   pull-up, push  a superset: no rest inside it, 1 min 30 s after each
#                  round; an assisted exercise (in pounds) and a bodyweight
#                  one; a stop at two to three reps in reserve; an AMRAP
#   lateral-raise  myo-reps, then a myo-rep match
#   split-squat    one side at a time: the side order, a pause to switch,
#                  and the second side matching the first
#   pushdown       a cluster set, a rest-pause set and a set to failure
#   plank, carry   a circuit of two rounds: a timed hold on a countdown,
#                  then on a stopwatch; a load carried over a distance
#
# LEFT OUT, with the reason: a triset, giant set or paired sets (the superset
# and the circuit show grouping; a paired group differs only in its default
# rests); a percentage of a one-rep max, an e1RM or a training max (V1 keeps
# none of them, so only `bodymass` resolves to a load, Rows.resolvedLoad);
# a deload routine and an Apple Health activity type (they change how the
# sessions are counted and saved, not how one is trained). coverage.yaml has
# each of them.
#
# THE EXERCISES are the test vectors' records, value for value
# (exercises.yaml and coverage.yaml), so an id means one exercise everywhere
# in this repository. The loads are a light starting point; the suggestions
# take over from the first session.
kind: ~/training/exercise
metadata:
  id: leg-press-machine
data:
  properties:
    name: Leg Press (Machine)
    measurement: weightreps
    equipment: machine
    laterality: bilateral
    loadBasis: total
    primaryMuscles: [quadriceps]
    secondaryMuscles: [glutes, hamstrings]
    restClass: compound
    loadStep:
      value: "5"
      unit: kg
    codes:
      - system: free-exercise-db
        code: Leg_Press
        display: Leg Press
      - system: healthconnect
        code: EXERCISE_SEGMENT_TYPE_LEG_PRESS
---
kind: ~/training/exercise
metadata:
  id: chest-press-machine
data:
  properties:
    name: Chest Press (Machine)
    measurement: weightreps
    equipment: machine
    laterality: bilateral
    loadBasis: total
    primaryMuscles: [chest]
    secondaryMuscles: [shoulders, triceps]
    restClass: compound
    loadStep:
      value: "5"
      unit: kg
---
# A pin-loaded assistance stack in 10 lb steps: a pound exercise in a
# kilogram gym. The assistance counts down from the whole body.
kind: ~/training/exercise
metadata:
  id: assisted-pull-up-machine
data:
  properties:
    name: Assisted Pull Up (Machine)
    measurement: bodyweightassistedreps
    equipment: machine
    laterality: bilateral
    primaryMuscles: [lats]
    secondaryMuscles: [biceps, upperback]
    restClass: compound
    loadStep:
      value: "10"
      unit: lb
    loadMax:
      value: "150"
      unit: lb
---
# Bodyweight: the effective load is bodyShare times the session's body mass.
kind: ~/training/exercise
metadata:
  id: push-up
data:
  properties:
    name: Push Up
    aliases: [Push-up, Press-up]
    measurement: bodyweightreps
    equipment: none
    laterality: bilateral
    primaryMuscles: [chest]
    secondaryMuscles: [shoulders, triceps]
    restClass: compound
    bodyShare: "0.65"
    codes:
      - system: free-exercise-db
        code: Pushups
        display: Pushups
