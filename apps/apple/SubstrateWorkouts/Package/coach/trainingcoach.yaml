# trainingcoach: the workout coach Substrate Workouts installs and keeps
# (docs/plans/workouts-coach.md, decision record 0206). A package of its own,
# so the training package's versions never depend on whether the coach is
# set up, the owner turns the coach off alone (bundle disable), and the
# coach's memories stay training data when it is removed.
#
# The agent document is not here: the app builds it at set up from the owner's
# choices (provider, model, daily cap) and the reach the owner approved, with
# the prompt rendered from instructions.md, mechanics.md and the training
# manifests (apps/apple/scripts/workouts-package.py writes coach.json).
kind: substrate.reamde.dev/core/package
metadata:
  id: ~/trainingcoach
data:
  authority: "~"
  package: trainingcoach
  version: 1
---
# `requiresAtLeast` training 2: the coach pins and writes `~/training/memory`,
# which training declares from version 2, and an agent naming a kind the
# repository lacks is refused at load.
kind: substrate.reamde.dev/core/bundle
metadata:
  id: ~/trainingcoach
data:
  authority: "~"
  package: trainingcoach
  description: >-
    Your workout coach: an AI agent that reads your training and health data,
    remembers your answers and writes routines you agree to. Kept by Substrate
    Workouts.
  requires:
    - ~/training
  requiresAtLeast:
    ~/training: 2
  installs:
    - ~/trainingcoach/workoutCoach
