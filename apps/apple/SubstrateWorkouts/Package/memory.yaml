# memory: one fact about the owner's training that the workout coach keeps
# (docs/plans/workouts-coach.md §7). The kind is the
# "workout" tag and `topic` the sub-tag. The coach pins the active rows into
# its prompt, newest first, and queries older and retired ones. A memory is
# the owner's data like every record of the package: the owner reads, edits,
# retires and deletes it in the console and in Substrate Workouts.
#
# Not `substrate.reamde.dev/llm/memory`: no app's agent writes the llm
# package, and a coach that wrote it could rewrite every memory the owner's
# general assistant relies on.
#
# Prompt injection: the coach stores only what the owner told it in a chat
# or answered in one of its questions, never a line it read in a record, and
# reads a pinned memory as a note, never an instruction (the coach's
# mechanics, Package/coach/mechanics.md).
kind: substrate.reamde.dev/core/kind
metadata:
  id: substrate.reamde.dev/training/memory
data:
  authority: substrate.reamde.dev
  package: training
  description: >-
    One fact about your training that your workout coach keeps: a goal, an
    injury, your schedule, the equipment you have, how you respond to training,
    or why a routine changed. The coach reads the active ones at the start
    of every chat.
  purpose: primary
  names:
    singular: memory
  label:
    singular: Coach memory
    plural: Coach memories
  displayTemplate: "{text}"
  properties:
    text:
      type: text
      required: true
      description: the fact, in one or two sentences, in the owner's words
    # The research's topics (docs/research/07-coaching.md §6.5): `response`
    # is how the owner responds to training, `change` why a routine changed
    # and what it should do.
    topic:
      type: enum
      required: true
      description: what the fact is about
      values:
        - value: goal
          label: Goal
        - value: experience
          label: Experience
        - value: schedule
          label: Schedule
        - value: equipment
          label: Equipment
        - value: limitation
          label: Limitation
        - value: preference
          label: Preference
        - value: baseline
          label: Baseline
        - value: lifestyle
          label: Lifestyle
        - value: response
          label: Response to training
        - value: change
          label: Routine change
        - value: other
          label: Other
    exercise:
      type: reference
      kind: substrate.reamde.dev/training/exercise
      description: the exercise the fact is about, when it is about one
    until:
      type: date
      description: the last day the fact holds, for a passing one such as
        a cold or a trip; absent means it holds until it changes
    active:
      type: bool
      default: true
      description: whether the coach reads it; off retires the fact and keeps
        its history
    source:
      type: enum
      default: owner
      description: who wrote it
      values:
        - value: owner
          label: You
        - value: coach
          label: Your coach
        - value: app
          label: Substrate Workouts
