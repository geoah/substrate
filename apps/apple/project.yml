# The Apple apps: the console, bundled, in a native window on macOS, iPadOS
# and iOS; Substrate Chat, the agent chat as a native app on the same three;
# and Substrate Sync, an iPhone and iPad app that pushes Health,
# Contacts and Calendar into a repository. xcodegen writes Substrate.xcodeproj from this file and the project
# is never committed; `mise run apple:project` regenerates it.
name: Substrate
options:
  bundleIdPrefix: dev.reamde.substrate
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
packages:
  # The macOS updater. iOS has none: an iPhone installs a release from its
  # manifest, and the app only offers the link (Updater.swift).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
  # What the apps share: the server's address and discovery, the requests,
  # signing in, the session, the status check and their screens, and the
  # record views (SubstrateKit/README.md).
  SubstrateKit:
    path: SubstrateKit
settings:
  base:
    DEVELOPMENT_TEAM: KFA5J8GDWJ
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Stamped by `apple.sh release` and empty everywhere else: a build with
    # no SUBSTRATE_UPDATES_URL never looks for an update, so a local build
    # is not offered whatever was published last.
    SUBSTRATE_VERSION: ""
    SUBSTRATE_CHANNEL: ""
    SUBSTRATE_COMMIT: ""
    SUBSTRATE_UPDATES_URL: ""
    SUBSTRATE_SPARKLE_KEY: ""
    # The console app's OAuth client id, the same way: empty is a local
    # build's loopback id (ConsoleSignIn.localClientID).
    SUBSTRATE_CONSOLE_CLIENT_ID: ""
    # Substrate Chat's OAuth client id: the URL of the client ID metadata
    # document a release publishes beside itself. Empty is a local app's
    # loopback id (ChatManifest.localClientID).
    SUBSTRATE_CHAT_CLIENT_ID: ""
    # Substrate Sync's, the same way: empty is a local build's loopback id
    # (SyncManifest.localClientID).
    SUBSTRATE_SYNC_CLIENT_ID: ""
targets:
  Substrate:
    # One native target for iPhone, iPad and Mac: not Mac Catalyst and not
    # "Designed for iPad". UIKit and AppKit code sit behind `#if os(...)`.
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    # A shared scheme: once one target declares its own, xcodebuild stops
    # inventing the rest.
    scheme: {}
    sources:
      - Substrate
    dependencies:
      - package: Sparkle
        destinationFilters: [macOS]
      # The server picker's address and discovery, nothing more.
      - package: SubstrateKit
    settings:
      base:
        PRODUCT_NAME: Substrate
        PRODUCT_BUNDLE_IDENTIFIER: dev.reamde.substrate.console
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Support/Info-iOS.plist
        "INFOPLIST_FILE[sdk=macosx*]": Support/Info-macOS.plist
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Support/Substrate-macOS.entitlements
        # The shared target takes iOS's runpath, and a Mac bundle keeps its
        # frameworks beside MacOS/, not in it: without this Sparkle is not
        # found and the app dies at launch.
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": ["$(inherited)", "@executable_path/../Frameworks"]
        ENABLE_HARDENED_RUNTIME: "YES"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The console copy below reads ../../web/console/dist, outside the target.
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
      configs:
        # A debug build runs outside the sandbox, so DebugDriver's folder is
        # one a terminal can reach: a container is closed to other apps.
        Debug:
          "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": ""
    postBuildScripts:
      # The console is not compiled here: `mise run console:build` writes
      # web/console/dist, and every build copies that whole into the bundle,
      # so the app serves exactly the build the server image would.
      - name: Bundle the console
        basedOnDependencyAnalysis: false
        showEnvVars: false
        script: |
          set -euo pipefail
          src="${PROJECT_DIR}/../../web/console/dist"
          if [ ! -f "${src}/index.html" ]; then
            echo "error: ${src} has no build; run mise run console:build" >&2
            exit 1
          fi
          dst="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/console"
          mkdir -p "${dst}"
          rsync -a --delete "${src}/" "${dst}/"
  SubstrateChat:
    # The agent chat, native: iPhone, iPad and Mac from one target like the
    # console app's, speaking only the API like Substrate Sync. Markdown and
    # speech are its own code and the system's; Sparkle is the Mac's updater
    # alone, and the updater is the console app's file.
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    scheme:
      testTargets:
        - SubstrateChatTests
    sources:
      - path: SubstrateChat
        excludes:
          - "*.md"
      - Substrate/Sources/App/Updater.swift
    dependencies:
      - package: Sparkle
        destinationFilters: [macOS]
      - package: SubstrateKit
    settings:
      base:
        PRODUCT_NAME: SubstrateChat
        PRODUCT_BUNDLE_IDENTIFIER: dev.reamde.substrate.chat
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Support/Info-Chat-iOS.plist
        "INFOPLIST_FILE[sdk=macosx*]": Support/Info-Chat-macOS.plist
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Support/SubstrateChat-macOS.entitlements
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": ["$(inherited)", "@executable_path/../Frameworks"]
        ENABLE_HARDENED_RUNTIME: "YES"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  SubstrateChatTests:
    # The chat's rules, which are platform-free: run on the Mac, no
    # simulator needed (`mise run apple:test:chat`).
    type: bundle.unit-test
    platform: auto
    supportedDestinations: [macOS, iOS]
    sources:
      - SubstrateChatTests
    dependencies:
      - target: SubstrateChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.reamde.substrate.chat.tests
        GENERATE_INFOPLIST_FILE: "YES"
        # xcodegen writes an iOS bundle's host path; a Mac app's executable
        # is inside Contents/MacOS.
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/SubstrateChat.app/Contents/MacOS/SubstrateChat"
        TARGETED_DEVICE_FAMILY: "1,2"
  SubstrateSync:
    # iPhone and iPad only, and nothing of the console: no bundled dist/, no
    # Sparkle. The updater is the console app's file, whose iOS path reads
    # this app's own release feed.
    type: application
    platform: iOS
    sources:
      - SubstrateSync
      - Substrate/Sources/App/Updater.swift
    dependencies:
      - target: SubstrateShare
      - package: SubstrateKit
    scheme:
      testTargets:
        - SubstrateSyncTests
        - SubstrateSyncUITests
    settings:
      base:
        PRODUCT_NAME: SubstrateSync
        PRODUCT_BUNDLE_IDENTIFIER: dev.reamde.substrate.sync
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Support/Info-Sync.plist
        CODE_SIGN_ENTITLEMENTS: Support/SubstrateSync.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
  SubstrateShare:
    # "Send to Substrate" in every app's share sheet: a link, text or images
    # saved as one record, with the app's sign-in, either kind, read from the
    # Keychain group the app and the extension share. It compiles the app's
    # client, Keychain and ids over SubstrateKit rather than a framework of
    # its own.
    type: app-extension
    platform: iOS
    sources:
      - SubstrateShare
      - SubstrateSync/Sources/API/Client.swift
      - SubstrateSync/Sources/API/Keychain.swift
      - SubstrateSync/Sources/Sync/Identity.swift
      - SubstrateSync/Sources/Views/Components.swift
    dependencies:
      - package: SubstrateKit
    settings:
      base:
        PRODUCT_NAME: SubstrateShare
        PRODUCT_BUNDLE_IDENTIFIER: dev.reamde.substrate.sync.share
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Support/Info-Share.plist
        CODE_SIGN_ENTITLEMENTS: Support/SubstrateShare.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
  SubstrateSyncTests:
    # The goldens these tests compare against live in the Go suite's
    # testdata, read from the checkout, so one file holds the app and the
    # receiver to the same format.
    type: bundle.unit-test
    platform: iOS
    sources:
      - SubstrateSyncTests
    dependencies:
      - target: SubstrateSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.reamde.substrate.sync.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
  SubstrateSyncUITests:
    # The app against a real substrate; skipped unless SYNC_E2E_SERVER names
    # one (SubstrateSyncUITests/EndToEndTests.swift).
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SubstrateSyncUITests
    dependencies:
      - target: SubstrateSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.reamde.substrate.sync.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
