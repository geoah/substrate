# training: strength sessions in the gym, down to the set. Substrate
# Workouts' package, published under `substrate.reamde.dev` (decision record
# 0214): the authority document the site serves lists each version's closure,
# the app's approval asks for the package as a `package` detail at the version
# the build was written against or later, and the server installs it from
# the document under this very name, the same in every repository. The app
# applies nothing itself. The app's README says how it reads the version a
# repository holds.
#
# Nine kinds, a catalogue, a plan, a log, the coach's memory, what the app
# seeded, and body measurements:
#
#   movement   what you search for, such as Chest Press, and the muscles it
#              works; the app seeds its exercise library into it
#   exercise   one equipment version of a movement, with the settings the
#              next-set suggestion reads
#   setup      one station an exercise is done on, such as a gym's machine,
#              with its own load grid ("Exercise setup")
#   routine    the plan the console's agent writes ("Workout routine")
#   session    one visit to the gym, as the app ran it ("Training session")
#   set        one performed set, its own record
#   memory     one fact the workout coach keeps ("Coach memory")
#   library    what the app has seeded whole, such as the exercise library
#   bodymeasurement  one day's body measurements, such as Hevy's
#
# ONE RECORD PER SET. A list filter and the aggregate read reach only a
# kind's top-level properties, so a set's load, reps and effort are
# queryable only as properties of a set kind of their own. The session keeps
# the order of its exercises (`slots`) and its supersets (`groups`), which is
# what a reorder changes in one patch.
#
# NAMES ARE ALWAYS FULL. The package is `training`, not `workouts`, because
# `substrate.reamde.dev/health/workout` is a workout as a wearable records
# it, and a training session is a different record that may point at one.
# The labels say "Workout routine" and "Training session" so a person and an
# agent tell them apart.
#
# FIRST-PARTY SPELLING WHERE THEY OVERLAP. `about`, `source`, `origin`,
# `revision`, `adapter`, `utcOffsetStart`, `utcOffsetEnd`, `name`, `notes`
# (as `text`), `duration` and `distance` (a quantity in metres) are spelled
# and typed as `substrate.reamde.dev/health/workout` spells them, and the
# session and the set bind core's `revised` as the workout does.
kind: substrate.reamde.dev/core/package
metadata:
  id: substrate.reamde.dev/training
data:
  authority: substrate.reamde.dev
  package: training
  # 1: exercise, setup, routine, session and set. 2: memory, the facts the
  # workout coach keeps. 3: movement, and an exercise's muscles one by one
  # with their share of the work, and its movement. 4: the package moves
  # from each repository's own authority to substrate.reamde.dev, published
  # (decision record 0214). 5: library, what the app has seeded whole, and
  # bodymeasurement, a day's body measurements. 6: a set's stopReason, and a
  # routine slot's cue. Each change ships as the next version, additive only;
  # a changed closure under an unmoved version is refused by
  # `workouts-package.py --check` and never published.
  version: 6
---
# ---- the bundle document -----------------------------------------------------
#
# `requires: substrate.reamde.dev/health` for `session.workout`, which points
# at the Apple Health copy of a session (a `health/workout` row the Apple
# Health adapter builds). An install brings every package it requires first,
# and the app's approval asks for the catalogue by name too.
#
# NOT `substrate.reamde.dev/observations`, although `session.source` pins its
# `source` kind: that package is seeded into every repository. A unit (`kg`,
# `lb`, `m`) is a record of core's `unit` kind, also seeded.
kind: substrate.reamde.dev/core/bundle
metadata:
  id: substrate.reamde.dev/training
data:
  authority: substrate.reamde.dev
  package: training
  description: >-
    Strength training: the exercises you do and the machines you do them on,
    your workout routines, and the training sessions and sets Substrate Workouts
    logs. Needs the health catalogue.
  requires:
    - substrate.reamde.dev/health
  installs:
    - substrate.reamde.dev/training/movement
    - substrate.reamde.dev/training/exercise
    - substrate.reamde.dev/training/setup
    - substrate.reamde.dev/training/routine
    - substrate.reamde.dev/training/session
    - substrate.reamde.dev/training/set
    - substrate.reamde.dev/training/memory
    - substrate.reamde.dev/training/library
    - substrate.reamde.dev/training/bodymeasurement
