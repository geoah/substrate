# The exercise library's movements, curated: each movement, the muscles it
# works and their share of a set (1 a prime mover, 0.75 a major synergist, 0.5
# a synergist, 0.25 a stabiliser), and its exercises, one per equipment
# version, with their measurement and load conventions, the free-exercise-db
# entries that are the same exercise and the Hevy template ids that map onto
# it. An exercise keeps Hevy's name where one maps. The muscles are this
# library's own, not Hevy's tags. apps/apple/scripts/exercise-library.py turns
# this file and free-exercise-db.json into the records the app seeds.
- id: 21s-bicep-curl
  name: 21s Bicep Curl
  aliases: [21s, Twenty-ones]
  force: pull
  mechanic: isolation
  muscles:
    bicepsbrachii: 1
    brachialis: 0.5
    brachioradialis: 0.5
    forearmflexors: 0.25
  exercises:
    - name: 21s Bicep Curl
