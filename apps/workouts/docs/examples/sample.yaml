---
# ---- the routine -------------------------------------------------------------
# Thirteen exercises and 25 planned sets: about 55 minutes as a full-body
# day. The id is fixed, so the app knows its own sample from a routine the
# agent wrote, on every device.
kind: substrate.reamde.dev/training/routine
metadata:
  id: sample-every-feature
data:
  properties:
    name: "Sample: every feature"
    folder: Sample
    position: 1
    notes: >-
      A tour of what a routine can hold, one idea per exercise or a few; each
      exercise's note says what it shows. Train it as a full-body day, or
      do the parts you like. Your agent writes your own routines. Once you
      are signed in, you can delete this one: swipe it in Routines, or Delete
      on this screen. The exercises it added stay, since your sessions name
      them.
    groups:
      - key: a
        groupKind: superset
        roundRest: PT1M30S
      - key: b
        groupKind: circuit
        rounds: 2
        roundRest: PT1M
    slots:
      - key: row
        exercise: substrate.reamde.dev/training/exercise/rowing-machine
        notes: >-
          A warm-up over a distance: row 500 m at an easy pace. The app keeps
          your time with the distance.
        sets:
          - key: w1
            role: warmup
            termination: distance
            distance:
              value: "500"
              unit: m
      - key: bird-dog
        exercise: substrate.reamde.dev/training/exercise/bird-dog
        notes: >-
          A warm-up counted in reps only, one side then the other: 8 reps
          a side.
        sets:
          - key: w1
            role: warmup
            repsMin: 8
            repsMax: 8
      - key: leg-press
        exercise: substrate.reamde.dev/training/exercise/leg-press-machine
        setRest: PT2M30S
        warmupRest: PT1M
        notes: >-
          A warm-up (W) at 50 % of your body mass, from Apple Health or typed
          in Settings; with neither, the warm-up has no load and you enter
          one. Then a top set and a back-off set 10 % lighter. The warm-up
          rests 1 min and the working sets 2 min 30 s, this slot's own rests.
        sets:
          - key: w1
            role: warmup
            loadPercent: "50"
            loadReference: bodymass
            repsMin: 12
            repsMax: 12
          - key: s1
            roleLabel: top
            load:
              value: "80"
              unit: kg
            repsMin: 6
            repsMax: 6
            rpeMin: "8"
            rpeMax: "8"
          - key: s2
            roleLabel: backoff
            dropPercent: "10"
            repsMin: 8
            repsMax: 10
            rpeMin: "7"
            rpeMax: "8"
      - key: chest-press
        exercise: substrate.reamde.dev/training/exercise/iso-lateral-chest-press-machine
        setRest: PT2M
        notes: >-
          Each arm has its own plates, so the load is per side. Straight sets
          of 8 to 12 at RPE 7 to 8, lowered over three seconds (tempo 3-0-1-0).
          Set 2 rests 3 min, a rest of its own. Set 3 is a drop set: two drops,
          each 5 kg a side lighter, of 6 reps each.
        sets:
          - key: s1
            load:
              value: "20"
              unit: kg
            repsMin: 8
            repsMax: 12
            rpeMin: "7"
            rpeMax: "8"
            tempo: 3-0-1-0
          - key: s2
            load:
              value: "20"
              unit: kg
            repsMin: 8
            repsMax: 12
            rpeMin: "7"
            rpeMax: "8"
            tempo: 3-0-1-0
            rest: PT3M
          - key: s3
            structure: drop
            load:
              value: "20"
              unit: kg
            repsMin: 8
            repsMax: 12
            rpeMin: "9"
            rpeMax: "10"
            drops: 2
            dropStep:
              value: "5"
              unit: kg
            dropReps: 6
      - key: pull-up
        exercise: substrate.reamde.dev/training/exercise/assisted-pull-up-machine
        group: a
        transition: PT0S
        notes: >-
          A1 of a superset: go straight to A2 with no rest, and rest 1 min
          30 s after the round. Assisted: the machine takes 90 lb off, and
          more assistance is easier.
        sets:
          - key: s1
            assistance:
              value: "90"
              unit: lb
            repsMin: 6
            repsMax: 10
            rpeMin: "8"
            rpeMax: "8"
          - key: s2
            assistance:
              value: "90"
              unit: lb
            repsMin: 6
            repsMax: 10
            rpeMin: "8"
            rpeMax: "8"
      - key: push-up
        exercise: substrate.reamde.dev/training/exercise/push-up
        group: a
        notes: >-
          A2, your body weight: stop round 1 with two to three reps in reserve,
          and do round 2 for as many reps as possible (AMRAP).
        sets:
          - key: s1
            termination: rirstop
            rirMin: "2"
            rirMax: "3"
          - key: s2
            termination: amrap
      - key: lateral-raise
        exercise: substrate.reamde.dev/training/exercise/lateral-raise-dumbbell
        setRest: PT1M30S
        notes: >-
          Myo-reps: 12 to 15, then mini-sets of 4 with 15 s between them,
          until one comes in under 4 (this set's own rule; the exercise's
          is to stop when one loses a rep). Set 2 is a myo-rep match: set
          1's total reps, in as few mini-sets as it takes.
        sets:
          - key: s1
            structure: myo
            load:
              value: "6"
              unit: kg
            repsMin: 12
            repsMax: 15
            rpeMin: "9"
            rpeMax: "9"
            miniSetReps: 4
            myoStopRule: belowtarget
            intraSetPause: PT15S
          - key: s2
            structure: myomatch
            load:
              value: "6"
              unit: kg
            miniSetReps: 4
            intraSetPause: PT15S
      - key: split-squat
        exercise: substrate.reamde.dev/training/exercise/bulgarian-split-squat-dumbbell
        setRest: PT2M
        sideOrder: weakerfirst
        sideSwitch: PT15S
        sideMatch: true
        notes: >-
          One side at a time: the side that did fewer reps last time goes
          first (the left, the first time), 15 s to switch, and the second
          side aims for the reps the first side did. The load is per dumbbell.
        sets:
          - key: s1
            load:
              value: "10"
              unit: kg
            repsMin: 8
            repsMax: 10
            rpeMin: "8"
            rpeMax: "8"
          - key: s2
            load:
              value: "10"
              unit: kg
            repsMin: 8
            repsMax: 10
            rpeMin: "8"
            rpeMax: "8"
      - key: dip
        exercise: substrate.reamde.dev/training/exercise/dip-weighted
        setRest: PT2M
        notes: >-
          Your body weight plus 10 kg on a belt: the load is what you add.
          Set 2 is rest-pause to a total: 20 reps in as many as three bouts,
          20 s apart.
        sets:
          - key: s1
            load:
              value: "10"
              unit: kg
            repsMin: 6
            repsMax: 10
            rpeMin: "8"
            rpeMax: "8"
          - key: s2
            structure: restpause
            load:
              value: "10"
              unit: kg
            totalReps: 20
            miniSets: 3
            intraSetPause: PT20S
      - key: pushdown
        exercise: substrate.reamde.dev/training/exercise/triceps-pushdown
        setRest: PT1M30S
        notes: >-
          A cluster set (4 reps, 15 s, three more clusters, two reps in reserve),
          then a last set to failure.
        sets:
          - key: s1
            structure: cluster
            load:
              value: "20"
              unit: kg
            miniSetReps: 4
            miniSets: 3
            rirMin: "2"
            rirMax: "2"
            intraSetPause: PT15S
          - key: s2
            termination: failure
            load:
              value: "17.5"
              unit: kg
            repsMin: 8
      - key: plank
        exercise: substrate.reamde.dev/training/exercise/plank
        group: b
        transition: PT15S
        notes: >-
          B1 of a circuit of two rounds, a timed hold. Round 1 is a countdown:
          hold for 45 s to 1 min. Round 2 runs a stopwatch: hold as long as
          you can. 15 s to the carry, 1 min after each round.
        sets:
          - key: s1
            durationMin: PT45S
            durationMax: PT1M
          - key: s2
            durationMin: PT45S
            timerMode: stopwatch
      - key: carry
        exercise: substrate.reamde.dev/training/exercise/farmers-carry-dumbbell
        group: b
        notes: >-
          B2: a load and a distance, 40 m with a dumbbell in each hand. The
          load is per dumbbell.
        sets:
          - key: s1
            termination: distance
            load:
              value: "16"
              unit: kg
            distance:
              value: "40"
              unit: m
          - key: s2
            termination: distance
            load:
              value: "16"
              unit: kg
            distance:
              value: "40"
              unit: m
      - key: weighted-plank
        exercise: substrate.reamde.dev/training/exercise/plank-weighted
        notes: >-
          A load and a time: one hold of 30 to 45 s with a 10 kg plate on
          your back.
        sets:
          - key: s1
            load:
              value: "10"
              unit: kg
            durationMin: PT30S
            durationMax: PT45S
