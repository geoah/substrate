# The sample routine Substrate Workouts carries, and the thirteen exercises it
# names (decision S1 in ../decisions.md, the owner, 2026-11-02): "Only include
# one sample workout routine with examples for all features when the user
# installs the app, allow the user to delete it."
#
# This file is the source of the app's bundled catalogue.
# apps/apple/scripts/workouts-package.py writes it to
# WorkoutsKit/Sources/WorkoutsCore/Resources/Bundled/exercises.json and
# routines.json; `mise run lint:python` (CI's `lint` job) and
# `mise run apple:test:workouts` fail while they differ. The app shows these
# records signed out, and writes them into a repository with no routines the
# first time it signs in there.
#
# ONE EXERCISE PER IDEA, OR A FEW. Each slot's `notes` says what it shows, so
# the routine explains itself in the app. What each part shows:
#   row            a warm-up over a distance, timed (distance and time)
#   bird-dog       a reps-only warm-up, one side then the other (alternating)
#   leg-press      a warm-up at a percentage of body mass, a top set and a
#                  back-off set 10 % lighter; its own warm-up and set rests
#   chest-press    a per-side load; straight sets with rep and RPE ranges at
#                  a tempo; one set's own rest; a drop set whose drops are a
#                  fixed 5 kg a side and 6 reps each
#   pull-up, push  a superset: no rest inside it, a rest after each round;
#                  an assisted exercise (in pounds) and a bodyweight one; a
#                  stop at two to three reps in reserve; an AMRAP
#   lateral-raise  myo-reps under this set's own stop rule (below a floor),
#                  then a myo-rep match
#   split-squat    one side at a time: the weaker side first, a pause to
#                  switch, the second side matching the first
#   dip            bodyweight plus a load; a rest-pause set to a total of
#                  20 reps
#   pushdown       a cluster set and a set to failure
#   plank, carry   a circuit of two rounds: a timed hold on a countdown,
#                  then on a stopwatch; a load carried over a distance
#   weighted plank a load held for a time
#
# EVERY measurement, laterality, load basis, set structure, way a set ends,
# timer mode and myo-rep stop rule the app runs is here once at least;
# SampleRoutineTests fails if one goes missing or a new one is added. LEFT
# OUT, with the reason:
#   - a triset, giant set or paired sets: the superset and the circuit show
#     grouping, and the others differ only in their default rests;
#   - a percentage of a one-rep max, an e1RM or a training max: the app keeps
#     none of them, so only `bodymass` resolves to a load (Rows.resolvedLoad);
#   - a deload routine and an Apple Health activity type: they change how
#     the sessions are counted and saved, not how one is trained;
#   - a timed hold done one side at a time, and a side order fixed to the
#     left or the right: the split squat's sides and the plank's timer show
#     each half;
#   - setups (a gym's own station and plate steps): they belong to a gym,
#     not to a routine.
# coverage.yaml has each of them.
#
# THE EXERCISES are the test vectors' records, value for value
# (exercises.yaml and coverage.yaml), so an id means one exercise everywhere
# in this repository. The loads are a starting point; the suggestions adjust
# them from the first session.
# A distance and a time, no load.
kind: substrate.reamde.dev/training/exercise
metadata:
  id: rowing-machine
data:
  properties:
    name: Rowing (Machine)
    aliases: [Rower, Ergometer]
    measurement: distanceduration
    equipment: machine
    laterality: bilateral
    primaryMuscles: [cardio]
    secondaryMuscles: [upperback, quadriceps]
    restClass: highrep
    codes:
      - system: healthconnect
        code: EXERCISE_SEGMENT_TYPE_ROWING_MACHINE
---
