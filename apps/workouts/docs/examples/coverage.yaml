# Carried into substrate on 2026-11-02 from the owner's private repository, where it was
# research/workouts/substrate/examples/coverage.yaml, the kinds were the draft
# mneme.example.org/training and the app was called Spotter. The kinds are now
# the app's own substrate.reamde.dev/training (decision record 0203) and the adapter is
# substrate-workouts; nothing else changed, so where the comments below
# mention Mneme they describe the plan of the time. README.md beside this
# file says how these records relate to the JSON the app bundles.
#
# Example records: test vectors for what the owner's screenshots do not
# show, as records of substrate.reamde.dev/training (research draft of 2026-10-31).
#
# NOT THE OWNER'S. Every exercise, routine, session and set here is
# illustrative. Bundle this file for tests only, never as history: its
# sessions would put invented loads into PREVIOUS and the suggestions.
#
# Apply after exercises.yaml, routines.yaml and sessions.yaml. The file
# lists its exercises, its setups, the routine, the three sessions and then
# the sets, because a setup, a routine slot, a session slot and a set name
# an exercise that must exist, and a set names a session, a setup and a
# chain head that must exist.
#
# WHAT IT ADDS to the other files: the five measurements they do not use;
# top and back-off sets; myo-rep match, rest-pause and cluster chains;
# AMRAP, failure and an RIR target; paired sets and a circuit with rounds;
# assistance in pounds and bodyweight plus a load; distance; a side chain
# on a timed hold with a stopwatch and a matched side; a substituted
# exercise; a set the plan did not have; an empty session in progress with a
# superset made in the gym and rests set on its slots, a deload and setups
# of their own; and a Hevy import with Hevy's RPE scale, its source set
# types, imported provenance and setups. Five setup records, one per
# exercise and gym, which the sets name in `setup`.
#
# NONE OF IT MOVES THE OTHER FILES' VECTORS. The sessions are dated after the
# 27 October session or carry a setup, and they share no exercise with
# the 30 October table (the chest press sets here are at other gyms).
#
# IDS. the app's records use lowercase UUIDv7s whose first 48 bits are the
# record's `at`, with random bits from a fixed seed. The import's ids are
# composed from Hevy's keys: `hevy-<workout id>` for the session and
# `hevy-<workout id>-<exercise index>-<set index>` for a set, both indices
# from 0 as Hevy numbers them.
#
# REST is measured as in sessions.yaml: `restBefore` from the tick before to
# the end of the rest, `restMethod: start` where a timed set's play ended it
# and `interaction` elsewhere, `restPlanned` by research
# 02 §3.3's choice, PT0S where no timer ran, `startedAt` only on timed sets
# and carries.
#
# PROVENANCE. the app's sets are written as in sessions.yaml
# (`completionMethod: individual`, `timeBasis: completion`, `rpeScale:
# rirbased`, `rpeMethod: entered`), with the load's meaning copied from the
# exercise. The Hevy import's are `completionMethod: imported`, `timeBasis:
# session` (they sit at the session's start), `rpeMethod: imported` beside
# Hevy's `rpeScale: hevy`, and no rest fields.
# ---- exercises the screenshots do not have --------------------------------
# Six measurements the owner's exercises do not use, one exercise each. The
# settings are illustrative, not the owner's.
#
