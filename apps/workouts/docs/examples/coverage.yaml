# ---- the routine -------------------------------------------------------------
# Every method the owner's routines leave out, in one routine of a test
# folder. Not a routine to train with.
#   top set and back-off set     leg press (the back-off is 10 % lighter)
#   warm-up rest per slot        leg press (`warmupRest`)
#   myo-rep match                seated leg curl, set 2 (matches set 1's reps)
#   rest-pause                   leg extension (two mini-sets, 20 s apart)
#   cluster, an RIR target       hip thrust (4 clusters of 3, 2 in reserve)
#   AMRAP                        rope pushdown, set 2
#   a set to failure             weighted dip, set 3
#   paired sets with rounds      assisted pull-up and weighted dip (3 rounds,
#                                1 min between them, 1 min 30 s per round;
#                                the dip's warm-up before round 1)
#   a circuit with rounds        carry, side plank and weighted plank (2)
#   assistance in pounds         assisted pull-up
#   a distance                   rowing warm-up, carry
#   one side at a time, matched  side plank (stopwatch, the right side's
#                                target is the left side's time)
#   an activity type             functional strength training
