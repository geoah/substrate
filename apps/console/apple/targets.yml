targets:
  Substrate:
    # One native target for iPhone, iPad and Mac: not Mac Catalyst and not
    # "Designed for iPad". UIKit and AppKit code sit behind `#if os(...)`.
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    # A shared scheme: once one target declares its own, xcodebuild stops
    # inventing the rest.
    scheme: {}
    sources:
      - Sources
      - Assets.xcassets
      - ../../xcode/Shared/Updater.swift
    dependencies:
      - package: Sparkle
        destinationFilters: [macOS]
      # The sign-in on the kit's libraries: the manifest, the flow and the
      # session (SubstrateAuth), the connect screen (SubstrateUI), the
      # browser and the Keychain (SubstrateDeviceApple). The web view's
      # controller still takes the rest through SubstrateKit.
      - package: SubstrateKit
      - package: SubstrateKit
        product: SubstrateCore
      - package: SubstrateKit
        product: SubstrateAPI
      - package: SubstrateKit
        product: SubstrateAuth
      - package: SubstrateKit
        product: SubstrateDeviceApple
      - package: SubstrateKit
        product: SubstrateUI
    settings:
      base:
        PRODUCT_NAME: Substrate
        PRODUCT_BUNDLE_IDENTIFIER: dev.reamde.substrate.console
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: ../console/apple/Support/Info-iOS.plist
        "INFOPLIST_FILE[sdk=macosx*]": ../console/apple/Support/Info-macOS.plist
        CODE_SIGN_ENTITLEMENTS: $(SUBSTRATE_IOS_ENTITLEMENTS_$(SUBSTRATE_ASSOCIATED_DOMAINS))
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": $(SUBSTRATE_MACOS_ENTITLEMENTS_$(SUBSTRATE_ASSOCIATED_DOMAINS))
        SUBSTRATE_IOS_ENTITLEMENTS_NO: ""
        SUBSTRATE_IOS_ENTITLEMENTS_YES: ../console/apple/Support/Substrate-iOS-site.entitlements
        SUBSTRATE_MACOS_ENTITLEMENTS_NO: ../console/apple/Support/Substrate-macOS.entitlements
        SUBSTRATE_MACOS_ENTITLEMENTS_YES: ../console/apple/Support/Substrate-macOS-site.entitlements
        # The shared target takes iOS's runpath, and a Mac bundle keeps its
        # frameworks beside MacOS/, not in it: without this Sparkle is not
        # found and the app dies at launch.
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": ["$(inherited)", "@executable_path/../Frameworks"]
        ENABLE_HARDENED_RUNTIME: "YES"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The console copy below reads ../../web/console/dist, outside the target.
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
      configs:
        # A debug build runs outside the sandbox, so DebugDriver's folder is
        # one a terminal can reach: a container is closed to other apps.
        Debug:
          "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": ""
    postBuildScripts:
      # The console is not compiled here: `mise run console:build` writes
      # web/console/dist, and every build copies that whole into the bundle,
      # so the app serves exactly the build the server image would.
      - name: Bundle the console
        basedOnDependencyAnalysis: false
        showEnvVars: false
        script: |
          set -euo pipefail
          src="${PROJECT_DIR}/../../web/console/dist"
          if [ ! -f "${src}/index.html" ]; then
            echo "error: ${src} has no build; run mise run console:build" >&2
            exit 1
          fi
          dst="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/console"
          mkdir -p "${dst}"
          rsync -a --delete "${src}/" "${dst}/"
