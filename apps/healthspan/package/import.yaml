# import: one run of an importer, a file, a folder or a hand entry taken in
# (docs/plans/healthspan.md, The package, import). What it writes is its
# plan, a blob (`plan`): every record with its key, kind, properties,
# references by key and revision, and every document by its digest, so an
# import is never capped by the 1 MiB a record write may be. Every record an
# import creates carries `origin` pointing here, but a source and an
# organization, so a browser on any device can resume it or undo it from
# this record and its plan alone.
#
# Staging: the server keeps a blob only while a live record names it through
# a `blobref`, so the record is written first, in `staging`, and names every
# document in `documents` as it goes up, then the plan as `plan` in the patch
# that moves it to `planned`. Staging is the browser's that read the files;
# from `planned` on, any device resumes it.
#
# `runner` is a lease: a browser writes only while it holds it, taken and
# renewed by patches held to the version read. No record write carries a
# cross-record guard, so Undo is best-effort reconciliation, and `undone`
# goes back to `undoing` to delete what landed late.
kind: substrate.reamde.dev/core/kind
metadata:
  id: substrate.reamde.dev/healthspan/import
data:
  authority: substrate.reamde.dev
  package: healthspan
  description: >-
    Health records you took in from a file, a folder or a hand entry, with
    the plan of what it writes, so the import can be finished on any device
    or undone.
  purpose: primary
  names:
    singular: import
  label:
    singular: Import
    plural: Imports
  displayTemplate: "{name}"
  properties:
    name:
      type: string
      required: true
      description: the file's or the folder's name, or Entered by hand
    importer:
      type: enum
      description: which importer read it
      values:
        - csv
        - manual
        - numan
        - randox
        - dxa
        - nhs
        - mychart
    status:
      type: state
      description: staging while its documents and plan go up; planned until
        its writing starts; stopped by a refusal until resumed; undoing while
        what it created is deleted
      states:
        - staging
        - planned
        - importing
        - stopped
        - imported
        - undoing
        - undone
      initial: staging
      transitions:
        - from: staging
          to: planned
        - from: planned
          to: importing
        - from: importing
          to: imported
        - from: importing
          to: stopped
        - from: stopped
          to: importing
        - from: staging
          to: undoing
        - from: planned
          to: undoing
        - from: importing
          to: undoing
        - from: stopped
          to: undoing
        - from: imported
          to: undoing
        - from: undoing
          to: undone
        - from: undone
          to: undoing
    runner:
      type: object
      description: the lease of the browser running it; absent when none is
      fields:
        device:
          type: string
          required: true
          description: an id the browser minted for itself
        until:
          type: datetime
          required: true
          description: when the lease ends unless renewed
    lab:
      type: string
      description: for a file of lab results or a hand entry, the lab's name
        as the file or the owner gave it, which names its source where none
        exists yet
    source:
      type: reference
      kind: substrate.reamde.dev/observations/source
      description: the provider the results are from, where one source stands
        for the import
    plan:
      type: blobref
      mediaTypes:
        - application/json
      description: the plan, as JSON, every record the import writes and every
        document by its digest
    documents:
      type: blobref
      repeated: true
      description: every document the plan writes, named here so it is kept
        until the records that name it are written
    counts:
      type: object
      description: what the latest run did
      fields:
        created:
          type: int
          min: 0
          description: records created or restored
        updated:
          type: int
          min: 0
          description: records updated, a raised revision alone included
        unchanged:
          type: int
          min: 0
          description: records already as the plan writes them
        stale:
          type: int
          min: 0
          description: records a newer export already wrote, left alone
        left:
          type: int
          min: 0
          description: references left out, their record written by no import
    problem:
      type: string
      description: why the import stopped
    importedAt:
      type: datetime
      description: when the import finished
    skipped:
      type: markdown
      description: what the importer left out, and why
