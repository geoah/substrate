# task: something the owner has to do. The words are the `tasks` sample's
# wherever the meaning is the same (`name`, `description`, `url`, `status`,
# `completedAt`, `priority`, `dueAt`), so a reader who knows one knows the
# other; the full reference tells them apart on every surface.
#
# THE ID IS CHOSEN ON THE DEVICE, a lowercase UUIDv7: every retry of the
# create from the outbox is a PUT that lands the same row.
#
# DUE: A DAY, OR A MOMENT. Most tasks are due on a day ("Friday"), and a day
# has no instant: midnight in whose zone? So, as the Apple provider keeps an
# EKReminder, `dueDay` is the civil day and `dueAt` is the moment, written
# only when the task is due at a time. A timed task carries both, `dueDay`
# being the day of `dueAt` on the writer's clock, so "what is due by Friday"
# is one filter on `dueDay` whichever kind of due date a task has. The app
# writes the pair; nothing on the server ties them. `dueAt` is the trait's
# point, so a timed task sits on the timeline and a window read finds it.
#
# NO REPEAT YET. The sample binds core's `recurring` and `override` and
# marks each occurrence off with a `tasklog`. A first cut does without:
# binding them later adds `recurrence`, `rdates`, `exdates`, `timezone`,
# `recurrenceOf` and `originalAt`, all optional, which is additive.
#
# THE STATE MOVES ONLY BY PATCH ("patch does transitions"), so a create
# replayed from the outbox after the task was done never moves it back.
# `completedAt` is stamped by the move to `done`. Reopening does not clear
# it: the app's reopen patch names `completedAt: null` beside
# `status: open`.
kind: substrate.reamde.dev/core/kind
metadata:
  id: substrate.reamde.dev/tasks/task
data:
  authority: substrate.reamde.dev
  package: tasks
  description: >-
    Something you have to do, such as Buy milk or Renew passport, with when
    it is due and how urgent it is. It is in one of your task lists or in
    none, and stays open until you mark it done or abandon it.
  purpose: primary
  names:
    singular: task
  # `lifecycle` (decision record 0226) says which states close a task and
  # which one a suggestion waits in, so an app over every kind with a
  # status reads this one as it reads any other.
  traits:
    - "substrate.reamde.dev/core/temporal(point: dueAt)"
    - substrate.reamde.dev/core/lifecycle
  displayTemplate: "{name}"
  properties:
    # ---- what it is ------------------------------------------------------------
    # Required, where the sample's is optional only because its older tasks
    # have none. Requiring it later would be a narrowing.
    name:
      type: string
      required: true
      description: what to do, in one line, such as Buy milk
    description:
      type: markdown
      description: the details, as prose
    url:
      type: url
      description: a link that goes with the task, such as the page to read
        or the form to fill in
    # ---- where it is -----------------------------------------------------------
    # The list owns its tasks, as a Reminders list does: deleting a list
    # takes its tasks with it. Moving a task rewrites `list` and keeps the
    # row.
    list:
      type: reference
      kind: substrate.reamde.dev/tasks/list
      mustExist: true
      onDelete: cascade
      description: the task list it is in; absent when it is in none, which
        Substrate Tasks shows as its inbox
    # A decimal, not an int: moving a task writes that one task, a number
    # between its new neighbours ("1.5" between "1" and "2"), where an int
    # would renumber every task below it from every device at once. A
    # decimal is exact and sorts as a number, so halving never runs out.
    # Its own property and not a link property on `list`: a task in no list
    # has no link to carry it, and a read orders by a property only.
    position:
      type: decimal
      description: where the task sits among the tasks of its list, lowest
        first; a number written as a string, such as "2" or "1.5"
    # ---- when ------------------------------------------------------------------
    dueDay:
      type: date
      description: the day it is due; written on every task with a due date,
        timed or not
    # ---- how it stands ---------------------------------------------------------
    # The sample's ladder and default, so a filter on `priority` means the
    # same in both.
    priority:
      type: enum
      description: how urgent it is, from none to urgent
      default: none
      values:
        - none
        - low
        - medium
        - high
        - urgent
    # The sample's states. `proposed` (version 2) is a suggestion an agent
    # wrote, waiting for you to add it (to `open`) or dismiss it (to
    # `abandoned`), or closed as `done` when you already did it (version
    # 3); a create that names no state is still `open`.
    # `abandoned` is reachable from `open`, which the sample's is not:
    # dropping a task is a decision worth keeping, where deleting it leaves
    # nothing.
    status:
      type: state
      description: open until you mark it done or abandon it; either can be
        undone. A suggested task waits as proposed until you add or dismiss
        it
      states:
        - proposed
        - open
        - done
        - abandoned
      initial: open
      done:
        - done
      dropped:
        - abandoned
      proposed:
        - proposed
      transitions:
        - from: proposed
          to: open
        - from: proposed
          to: abandoned
        # Version 3: a suggestion the owner already did, such as a reply
        # an agent sees them send, closes without being accepted first.
        - from: proposed
          to: done
          stamps:
            completedAt: now
        - from: open
          to: done
          stamps:
            completedAt: now
        - from: done
          to: open
        - from: open
          to: abandoned
        - from: abandoned
          to: open
    # Stamped by the move to `done`. Not managed: an importer creating a
    # task already done supplies its own time.
    completedAt:
      type: datetime
      description: when it was marked done
    # ---- where it came from, and who it involves --------------------------------
    # `origin` (version 3), as an observed row names the record it was built
    # from (decision record 0162). Unpinned: a task comes from a message, a
    # mail, an issue or a meeting, and naming each kind would make this
    # package depend on every provider. No mustExist: the message may be
    # deleted upstream after the task is written, and an agent's suggestion
    # still stands.
    origin:
      type: reference
      kind: any
      description: the record this task was made from, such as the message,
        mail, issue or meeting it answers; absent for a task you typed
    # `originAt` (version 5): when that was said or happened, where the
    # task's maker knows it. A task is often written later than the words it
    # came from (an agent reads a day's messages at night, an importer
    # carries a year of them over), so the row's own creation time says when
    # it was written, not how old the matter is. A reader that says "heard
    # on Thursday", and a rule that lets an unanswered suggestion fade, count
    # from here. Nothing on the server fills it: whoever writes `origin`
    # writes it in the same write, from the time the origin itself carries.
    originAt:
      type: datetime
      description: when what this task was made from was said or happened,
        which is how old a suggestion is; absent where its maker did not know
    # `people` (version 3): who asked, who is waiting, who it is for. Every
    # task in a repository is its owner's, so there is no assignee.
    people:
      type: reference
      kind: substrate.reamde.dev/core/contact
      repeated: true
      mustExist: true
      description: the people this task involves, such as who asked for it
        or who is waiting on it
    # ---- put off, and who flagged it (version 4) --------------------------------
    # What an app that plans a day needs of a task, each optional and none
    # with a default, so the version is additive and a repository takes it
    # without review. The Tasks app reads none of them.
    #
    # `notBefore` hides a task until then; `deferrals` counts how often it was
    # moved later. Nothing on the server counts: whoever moves `notBefore` or
    # the due day later adds one in the same write.
    notBefore:
      type: datetime
      description: hidden until then, for a task you put off to tonight or
        next week
    deferrals:
      type: int
      description: how many times it was put off, counted by whoever moves
        it later, in the same write
    # WHO SET THE PRIORITY IT HAS NOW. `urgent` is the one step an assistant,
    # an automation or the API may put on a task without the owner asking, so
    # a reader has to know whose word it is, why, and what to put back.
    # Absent reads as the owner's.
    prioritySetBy:
      type: enum
      description: who set the priority it has now; absent means you did
      values:
        - owner
        - assistant
        - automation
        - api
    priorityReason:
      type: string
      description: why it has this priority, in one sentence from whoever
        set it
    priorityWas:
      type: enum
      description: the priority it had before it was marked urgent, written
        in that same write, so taking urgent off puts it back
      values:
        - none
        - low
        - medium
        - high
    # An urgent mark someone else set is checked by the assistant, which
    # writes one of two stamps and never takes the mark off: it agrees
    # (`urgentCheckedAt`), or it thinks the task can wait (`urgentHeldAt`,
    # with why). With neither, nobody has checked it.
    urgentCheckedAt:
      type: datetime
      description: when the assistant looked at an urgent mark and agreed
        it cannot wait
    urgentHeldAt:
      type: datetime
      description: when the assistant looked at an urgent mark and thought
        it can wait
    urgentHeldReason:
      type: string
      description: why the assistant thinks an urgent task can wait, in one
        sentence
