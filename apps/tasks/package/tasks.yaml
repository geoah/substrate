# tasks: the owner's to-do list. Substrate Tasks' package, published under
# `substrate.reamde.dev` (decision records 0214 and 0221): the authority
# document the site serves lists each version's closure, the app's approval
# asks for the package as a `package` detail at the version the build was
# written against or later, and the server installs it from the document
# under this very name, the same in every repository. The app applies
# nothing itself.
#
# Two kinds:
#
#   task   something to do, in a task list or in none (the app's inbox)
#   list   a named list of the owner's tasks, in their order ("Task list")
#
# NOT THE `tasks` SAMPLE. `samples.substrate.reamde.dev/tasks` is a template
# a repository copies under its own authority, with a Linear mapping and
# `people` and `scheduling` behind it, so an imported copy lands as
# `<authority>/tasks/task` and differs per repository. This package is the
# publisher's and lands as `substrate.reamde.dev/tasks/task` everywhere. A
# repository that imported the sample holds both, each under its full
# reference. Where a word means the same thing, it is the sample's word:
# `name`, `description`, `url`, `status` and its `completedAt` stamp,
# `priority` on the same ladder, and `dueAt`.
kind: substrate.reamde.dev/core/package
metadata:
  id: substrate.reamde.dev/tasks
data:
  authority: substrate.reamde.dev
  package: tasks
  # 1: task and list. Each change ships as the next version, additive only;
  # a published version never changes.
  version: 1
---
# ---- the bundle document -----------------------------------------------------
#
# No `requires:`. Nothing here points outside the package, and an app's
# package cannot require a sample: a sample is imported under the
# repository's own authority, so there is no published name to require.
kind: substrate.reamde.dev/core/bundle
metadata:
  id: substrate.reamde.dev/tasks
data:
  authority: substrate.reamde.dev
  package: tasks
  description: >-
    Your to-do list: tasks with a due day or time and a priority, sorted into
    task lists in your own order. Substrate Tasks keeps them.
  installs:
    - substrate.reamde.dev/tasks/task
    - substrate.reamde.dev/tasks/list
