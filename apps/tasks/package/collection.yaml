# collection: what the owner chose about one collection of tasks Substrate
# Tasks shows, one record per kind they changed anything about
# (docs/plans/tasks-sources.md). A kind with no record shows with the app's
# reading of its declaration; this record holds only the owner's choices.
#
# THE ID IS DERIVED FROM THE KIND: a UUIDv8 of the sha256 of `collection:`
# and the kind's full reference, so every device names the same record and a
# create is a PUT with `ifVersion: 0` that a second device loses and then
# patches. `supporting`, not `internal`: the app's `tasks/*` scope must reach
# it, and no glob reaches an internal kind.
kind: substrate.reamde.dev/core/kind
metadata:
  id: substrate.reamde.dev/tasks/collection
data:
  authority: substrate.reamde.dev
  package: tasks
  description: >-
    How Substrate Tasks shows one collection of your tasks: whether it is
    on, what it groups by, and which of its properties the app reads as the
    due date, the priority and the order.
  purpose: supporting
  names:
    singular: collection
  label:
    singular: Task collection
    plural: Task collections
  displayTemplate: "{kind}"
  properties:
    kind:
      type: string
      required: true
      description: the collection's kind, by its full reference, such as substrate.reamde.dev/tasks/task
    enabled:
      type: bool
      description: whether Substrate Tasks shows the collection
    # Each names one of the kind's own properties, where the owner changed
    # the app's guess; `-` says none.
    group:
      type: string
      description: the reference the collection's tasks are grouped by; absent
        for the app's guess, `-` for none
    due:
      type: string
      description: the property read as the due time; absent for the app's
        guess, `-` for none
    dueDay:
      type: string
      description: the property read as the due day; absent for the app's
        guess, `-` for none
    priority:
      type: string
      description: the property read as the priority; absent for the app's
        guess, `-` for none
    order:
      type: string
      description: the property read as the owner's order; absent for the
        app's guess, `-` for none
