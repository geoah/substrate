# list: a named list of the owner's tasks. "Task list" on every surface,
# because "List" alone reads as a page of the console rather than a record.
#
# A LIST CAN BE FINISHED (version 3). A list that holds a piece of work
# ("Budget 2027") ends one day, and deleting it would delete its tasks, so it
# is closed instead: `status` moves to `done` or `abandoned`, through core's
# `lifecycle`, and back to `active`. "Groceries" simply stays active. A list
# that existed before version 3 is entered at `active` when the version is
# admitted (decision record 0082). The Tasks app shows a group's status, and
# a closed list while it still holds open tasks.
#
# NOT THE SAMPLE'S `project`. The sample's project also waits `onhold` and
# carries a `summary`; a list has no on-hold state, and its prose is
# `description`, the word this package already uses for prose.
#
# THE ORDER IS `position`, a decimal, as on the task: moving a list writes
# that one list, a number between its new neighbours.
kind: substrate.reamde.dev/core/kind
metadata:
  id: substrate.reamde.dev/tasks/list
data:
  authority: substrate.reamde.dev
  package: tasks
  description: >-
    A task list: a named list of your tasks, such as Groceries or Home, kept
    in the order you arrange your lists. A task is in one list or in none.
    A list stays active until you mark it done or abandon it.
  purpose: primary
  names:
    singular: list
  label:
    singular: Task list
    plural: Task lists
  traits:
    - substrate.reamde.dev/core/lifecycle
  displayTemplate: "{name}"
  properties:
    name:
      type: string
      required: true
      description: the list's name, such as Groceries
    position:
      type: decimal
      description: where the list sits among your lists, lowest first; a number
        written as a string, such as "2" or "1.5"
    description:
      type: markdown
      description: what the list is for and where its work stands, as prose
    # A create may name any state, so an importer writes a finished list as
    # finished; every later move is a patch along these transitions.
    status:
      type: state
      description: active until you mark the list done or abandon it; either
        can be undone
      states:
        - active
        - done
        - abandoned
      initial: active
      done:
        - done
      dropped:
        - abandoned
      transitions:
        - from: active
          to: done
        - from: done
          to: active
        - from: active
          to: abandoned
        - from: abandoned
          to: active
    # ---- a list as a project (version 4) ----------------------------------------
    # A list that holds a piece of work is a project to an app that plans a
    # day: it has a priority of its own, apart from its tasks', and places
    # where its work happens. Both optional and neither with a default, so the
    # version is additive. No `urgent`: that step is a task's.
    priority:
      type: enum
      description: how much the list's work matters now, from none to high;
        absent means none
      values:
        - none
        - low
        - medium
        - high
    # Unpinned, as a task's `origin` is: a tracker's project, a channel and a
    # repository are three providers' kinds.
    sources:
      type: reference
      kind: any
      repeated: true
      description: where the list's work happens, such as an issue tracker's
        project, a channel or a code repository
