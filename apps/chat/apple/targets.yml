targets:
  SubstrateChat:
    # The agent chat, native: iPhone, iPad and Mac from one target like the
    # console app's, speaking only the API like Substrate Sync. It draws
    # ChatKit's presentations and sends its commands; the speech, the
    # notifications and the background work are the device's. Sparkle is
    # the Mac's updater alone, and the updater is the shared file in
    # apps/xcode/Shared.
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    scheme:
      testTargets:
        - SubstrateChatTests
    sources:
      - Sources
      - Assets.xcassets
      - ../../xcode/Shared/Updater.swift
    dependencies:
      - package: Sparkle
        destinationFilters: [macOS]
      - package: SubstrateKit
      - package: ChatKit
    settings:
      base:
        PRODUCT_NAME: SubstrateChat
        PRODUCT_BUNDLE_IDENTIFIER: dev.reamde.substrate.chat
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: ../chat/apple/Support/Info-Chat-iOS.plist
        "INFOPLIST_FILE[sdk=macosx*]": ../chat/apple/Support/Info-Chat-macOS.plist
        CODE_SIGN_ENTITLEMENTS: $(SUBSTRATE_IOS_ENTITLEMENTS_$(SUBSTRATE_ASSOCIATED_DOMAINS))
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": $(SUBSTRATE_MACOS_ENTITLEMENTS_$(SUBSTRATE_ASSOCIATED_DOMAINS))
        SUBSTRATE_IOS_ENTITLEMENTS_NO: ""
        SUBSTRATE_IOS_ENTITLEMENTS_YES: ../chat/apple/Support/SubstrateChat-iOS-site.entitlements
        SUBSTRATE_MACOS_ENTITLEMENTS_NO: ../chat/apple/Support/SubstrateChat-macOS.entitlements
        SUBSTRATE_MACOS_ENTITLEMENTS_YES: ../chat/apple/Support/SubstrateChat-macOS-site.entitlements
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": ["$(inherited)", "@executable_path/../Frameworks"]
        ENABLE_HARDENED_RUNTIME: "YES"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  SubstrateChatTests:
    # What only the Apple app holds: the loopback receiver, the Keychain item
    # every build kept the session in, inline Markdown, and what a screen
    # reader is told of a link out to the console. The chat's rules are
    # ChatKit's, tested by `swift test` there (`mise run apple:test:chat`
    # runs both).
    type: bundle.unit-test
    platform: auto
    supportedDestinations: [macOS, iOS]
    sources:
      - Tests
    dependencies:
      - target: SubstrateChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.reamde.substrate.chat.tests
        GENERATE_INFOPLIST_FILE: "YES"
        # xcodegen writes an iOS bundle's host path; a Mac app's executable
        # is inside Contents/MacOS.
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/SubstrateChat.app/Contents/MacOS/SubstrateChat"
        TARGETED_DEVICE_FAMILY: "1,2"
