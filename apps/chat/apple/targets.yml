targets:
  SubstrateChat:
    # The agent chat, native: iPhone, iPad and Mac from one target like the
    # console app's, speaking only the API like Substrate Sync. Its engine
    # and its screens are the kit's (SubstrateChatCore, SubstrateChatUI),
    # so another app can show a chat with them; what is here is the app's
    # own: its scenes and menus, its device services, its session's place
    # in the Keychain, App Intents. Sparkle is the Mac's updater alone, and
    # the updater is the shared file in apps/xcode/Shared.
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    scheme:
      testTargets:
        - SubstrateChatTests
    sources:
      - Sources
      # The session store, one definition the extension compiles too.
      - Shared
      - Assets.xcassets
      # The words a push's `loc-key` names, which iOS shows when no code
      # of the app runs.
      - Strings
      - ../../xcode/Shared/Updater.swift
    dependencies:
      - package: Sparkle
        destinationFilters: [macOS]
      - target: SubstrateChatNotifications
        destinationFilters: [iOS]
      - package: SubstrateKit
      - package: SubstrateKit
        product: SubstrateChatCore
      - package: SubstrateKit
        product: SubstrateChatUI
    settings:
      base:
        PRODUCT_NAME: SubstrateChat
        PRODUCT_BUNDLE_IDENTIFIER: dev.reamde.substrate.chat
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: ../chat/apple/Support/Info-Chat-iOS.plist
        "INFOPLIST_FILE[sdk=macosx*]": ../chat/apple/Support/Info-Chat-macOS.plist
        CODE_SIGN_ENTITLEMENTS: $(SUBSTRATE_IOS_ENTITLEMENTS_$(SUBSTRATE_ASSOCIATED_DOMAINS))
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": $(SUBSTRATE_MACOS_ENTITLEMENTS_$(SUBSTRATE_ASSOCIATED_DOMAINS))
        SUBSTRATE_IOS_ENTITLEMENTS_NO: ../chat/apple/Support/SubstrateChat-iOS.entitlements
        SUBSTRATE_IOS_ENTITLEMENTS_YES: ../chat/apple/Support/SubstrateChat-iOS-site.entitlements
        SUBSTRATE_MACOS_ENTITLEMENTS_NO: ../chat/apple/Support/SubstrateChat-macOS.entitlements
        SUBSTRATE_MACOS_ENTITLEMENTS_YES: ../chat/apple/Support/SubstrateChat-macOS-site.entitlements
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": ["$(inherited)", "@executable_path/../Frameworks"]
        ENABLE_HARDENED_RUNTIME: "YES"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  SubstrateChatNotifications:
    # The notification service extension: what a push from the publisher's
    # relay says, read from the person's own server with the app's token,
    # through the Keychain group the two share. iPhone and iPad alone, and
    # nothing that draws: it links the chat's core and the kit's API, never
    # SubstrateChatUI, since iOS holds an extension to a small memory limit.
    type: app-extension
    platform: iOS
    sources:
      - Notifications
      - Shared
    dependencies:
      - package: SubstrateKit
        product: SubstrateChatCore
      - package: SubstrateKit
        product: SubstrateCore
      - package: SubstrateKit
        product: SubstrateDevice
      - package: SubstrateKit
        product: SubstrateAPI
      - package: SubstrateKit
        product: SubstrateAuth
      - package: SubstrateKit
        product: SubstrateDeviceApple
    settings:
      base:
        PRODUCT_NAME: SubstrateChatNotifications
        PRODUCT_BUNDLE_IDENTIFIER: dev.reamde.substrate.chat.notifications
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: ../chat/apple/Support/Info-Notifications.plist
        CODE_SIGN_ENTITLEMENTS: ../chat/apple/Support/SubstrateChatNotifications.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        APPLICATION_EXTENSION_API_ONLY: "YES"
  SubstrateChatTests:
    # What only the Apple side holds, hosted in the app: the loopback
    # receiver, the Keychain item every build kept the session in, inline
    # Markdown, the views drawn frame by frame, and what a screen reader is
    # told of a link out to the console. The chat's rules are
    # SubstrateChatCore's, tested by `swift test` in the kit
    # (`mise run apple:test:chat` runs both).
    type: bundle.unit-test
    platform: auto
    supportedDestinations: [macOS, iOS]
    # The views' own source goes into the bundle as files to read, the
    # app's (Sources/App) and the kit's (SubstrateChatUI's Host, Views and
    # Markdown): the rules `SourceRules` holds them to (a size, a colour or
    # a motion is a token's, never a view's) are read from the text, and a
    # test hosted in the sandboxed app can read nothing outside its bundle.
    sources:
      - Tests
      # The extension has no test target: what it delivers is tested here.
      - Notifications/PushDelivery.swift
      - path: Sources/App
        type: folder
        buildPhase: resources
      - path: ../../kit/Sources/SubstrateChatUI/Host
        type: folder
        buildPhase: resources
      - path: ../../kit/Sources/SubstrateChatUI/Views
        type: folder
        buildPhase: resources
      - path: ../../kit/Sources/SubstrateChatUI/Markdown
        type: folder
        buildPhase: resources
    dependencies:
      - target: SubstrateChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.reamde.substrate.chat.tests
        GENERATE_INFOPLIST_FILE: "YES"
        # xcodegen writes an iOS bundle's host path; a Mac app's executable
        # is inside Contents/MacOS.
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/SubstrateChat.app/Contents/MacOS/SubstrateChat"
        TARGETED_DEVICE_FAMILY: "1,2"
