# Every version the Android build takes, once. The convention plugins in
# build-logic/ read the `android-*` and `swift` entries, so a module never
# spells a pin; `mise run lint:toolchain` holds `swift` and `android-ndk`
# equal to the Swift SDK for Android that `mise run android:sdk` installs,
# and `android-compileSdk`, `android-buildTools` to its package list.
[versions]
swift = "6.4.2"
android-compileSdk = "37"
android-targetSdk = "36"
android-minSdk = "28"
android-ndk = "30.0.16248370"
android-buildTools = "36.0.0"
jvm = "21"
agp = "9.5.0"
kotlin = "2.4.21"
coroutines = "1.11.0"
serialization = "1.12.0"
okhttp = "5.5.1"
tink = "1.24.0"
datastore = "1.2.1"
junit = "4.13.2"
androidx-test-runner = "1.7.0"
androidx-test-core = "1.7.0"
androidx-test-ext-junit = "1.3.0"

[libraries]
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
tink-android = { module = "com.google.crypto.tink:tink-android", version.ref = "tink" }
datastore-core = { module = "androidx.datastore:datastore-core", version.ref = "datastore" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
# build-logic's own classpath: the plugins the convention plugins apply.
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
