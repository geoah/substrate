# Releasing substrate: the CLI for every platform, and one multi-arch image.
#
# Versions come from the git tag, which release-please writes from conventional
# commits — so `feat:` bumps the minor, `fix:` the patch, and a `!` or a
# BREAKING CHANGE footer the major. Nothing here needs editing to cut a release.
#
# Run it locally exactly as CI does:
#
#     mise run release:check      # validate this file
#     mise run release:snapshot   # full dry run, builds everything, pushes nothing
version: 2

project_name: substrate

before:
  hooks:
    # The image serves the console from WEB_DIR, so dist/ must exist before the
    # image build copies it. Vite output is arch-independent: build it once.
    - mise run console:build

builds:
  # The CLI is the artifact people download; the server is the artifact the
  # image wraps. Both carry the version so `--version` and discovery agree.
  - id: substratectl
    binary: substratectl
    main: ./cmd/substratectl
    env: [CGO_ENABLED=0]
    # No windows: the operator hat opens the engine, which pulls in the function
    # runner, which reaps process groups through Setpgid and syscall.Kill.
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .FullCommit
        }}

  - id: substrated
    binary: substrated
    main: ./cmd/substrated
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .FullCommit
        }}

archives:
  # Only the CLI is worth downloading on its own — the server ships as an image.
  - id: substratectl
    ids: [substratectl]
    formats: [tar.gz]
    files: [README.md]

checksum:
  name_template: checksums.txt

dockers_v2:
  - id: substrate
    ids: [substrated]
    images:
      - ghcr.io/geoah/substrate
    platforms: [linux/amd64, linux/arm64]
    # Dockerfile.release copies the binary goreleaser just built rather than
    # compiling again; the source-building Dockerfile stays for compose and dev.
    dockerfile: Dockerfile.release
    extra_files:
      - web/console/dist
    # No SBOM or provenance attestations: one manifest per platform and nothing
    # else, matching `mise run image:push` so the two paths produce the same
    # shape. (They are NOT why the first release failed to push — that was a
    # pre-existing ghcr package linked to no repository, so the workflow token
    # could not see it. If a push is ever denied with `read_package` while the
    # job log shows `Packages: write`, look at the package's Actions access,
    # not at permissions and not here.)
    sbom: false
    flags:
      - --provenance=false
    tags:
      - "{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
      - "{{ .Major }}"
      - latest
    labels:
      org.opencontainers.image.title: substrate
      org.opencontainers.image.description: A personal data substrate
      org.opencontainers.image.source: https://github.com/geoah/substrate
      org.opencontainers.image.url: https://github.com/geoah/substrate
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"

changelog:
  # release-please writes the release notes from the same commits; a second
  # generated list underneath them would only disagree.
  disable: true

release:
  prerelease: auto
  mode: append
