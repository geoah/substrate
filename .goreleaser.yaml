# Releasing substrate: the CLI for every platform, and one multi-arch image.
#
# Versions come from the git tag, which .github/workflows/version.yml writes
# from the conventional commits on main: `feat:` bumps the minor, `fix:` the
# patch, and a `!` or a BREAKING CHANGE footer the major (the minor, below
# 1.0.0). Nothing here needs editing to cut a release.
#
# Run it locally exactly as CI does:
#
#     mise run release:check      # validate this file
#     mise run release:snapshot   # full dry run, builds everything, pushes nothing
version: 2

project_name: substrate

before:
  hooks:
    # The image serves the console from WEB_DIR, so dist/ must exist before the
    # image build copies it. Vite output is arch-independent: build it once.
    - mise run console:build

builds:
  # Both binaries learn their version the SAME way: the linker writes it into
  # internal/build, which `substratectl version` prints and which discovery
  # serves as `server.version`. The symbol path is a string to the linker, so
  # a typo (or a rename of that package) is a flag it silently drops and a
  # release that reports "dev". internal/build's own test holds these two
  # files to the symbols they stamp.
  #
  # {{ .Tag }} rather than {{ .Version }}: the tag is how the release is
  # spelled everywhere else a person will compare it against (git, the
  # releases page, and the fallback internal/build reads out of the build info
  # when nothing stamped it), and one spelling is worth more than a dropped v.
  - id: substratectl
    binary: substratectl
    main: ./cmd/substratectl
    env: [CGO_ENABLED=0]
    # No windows: the operator hat opens the engine, which pulls in the function
    # runner, which reaps process groups through Setpgid and syscall.Kill.
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/geoah/substrate/internal/build.version={{ .Tag
        }} -X github.com/geoah/substrate/internal/build.commit={{ .FullCommit
        }}

  - id: substrated
    binary: substrated
    main: ./cmd/substrated
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    # The same stamp as the CLI, and the server needs it MORE. The release
    # binary is built here, in a whole repository, where Go would record the
    # tag on its own; but this binary is then copied into an image by
    # Dockerfile.release, and an operator asking a running deployment which
    # version it is gets this string back.
    ldflags:
      - -s -w -X github.com/geoah/substrate/internal/build.version={{ .Tag
        }} -X github.com/geoah/substrate/internal/build.commit={{ .FullCommit
        }}

archives:
  # Only the CLI is worth downloading on its own — the server ships as an image.
  - id: substratectl
    ids: [substratectl]
    formats: [tar.gz]
    files: [README.md]

checksum:
  name_template: checksums.txt

dockers_v2:
  - id: substrate
    ids: [substrated]
    images:
      - ghcr.io/geoah/substrate
    platforms: [linux/amd64, linux/arm64]
    # Dockerfile.release copies the binary goreleaser just built rather than
    # compiling again; the source-building Dockerfile stays for compose and dev.
    dockerfile: Dockerfile.release
    extra_files:
      - web/console/dist
    # No SBOM or provenance attestations: one manifest per platform and nothing
    # else, matching `mise run image:push` so the two paths produce the same
    # shape. (They are NOT why the first release failed to push — that was a
    # pre-existing ghcr package linked to no repository, so the workflow token
    # could not see it. If a push is ever denied with `read_package` while the
    # job log shows `Packages: write`, look at the package's Actions access,
    # not at permissions and not here.)
    sbom: false
    flags:
      - --provenance=false
    # No `latest` here: the tip-of-main build (mise.toml's `image:latest`,
    # run by .github/workflows/latest.yml) already owns that tag, and a
    # release racing it for the same name is worse than a release with no
    # `latest` at all.
    tags:
      - "{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
      - "{{ .Major }}"
    labels:
      org.opencontainers.image.title: substrate
      org.opencontainers.image.description: A personal data substrate
      org.opencontainers.image.source: https://github.com/geoah/substrate
      org.opencontainers.image.url: https://github.com/geoah/substrate
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"

changelog:
  # The release notes ARE the changelog: there is no release pull request
  # accumulating one into a file any more, so this is where the commits since
  # the last tag are read back to a person. Grouped, because an ungrouped list
  # buries the two lines somebody is looking for under the housekeeping.
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]\.\-]+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\([[:word:]\.\-]+\))??!?:.+$'
      order: 1
    - title: Everything else
      order: 99
  filters:
    exclude:
      # Never a reason to read the release: they change nothing that ships.
      # No closing paren on the last one, because dependabot writes both
      # `chore(deps)` and `chore(deps-dev)` and both are the same non-news.
      - "^docs:"
      - "^test:"
      - "^chore\\(deps"

release:
  prerelease: auto
  # No `mode: append`. That was for a release somebody else had already
  # created and written the body of; goreleaser now creates it, so appending
  # would only mean a re-run stacking a second copy of the notes under the
  # first.
