# The Python here is four groups, held to one config because there is no
# reason for a second. internal/runner/host.py is the one that matters: the
# long-lived child every `runtime: python` function body is exec'd into, a
# protocol implementation, not application code, and it must run on whatever
# `python3` a deployment happens to have (mise deliberately does not pin one).
# The function bodies and bundle modules under `kinds/` and `samples/` ship
# too, as YAML literal scalars: .mise/pybodies.py writes each one out, padded
# so a finding names its bundle.yaml line, because admission runs only a
# body's top level and the short suite skips the provider cases that run the
# rest. internal/providere2e holds the provider suite's scenarios, runner and
# fixtures, and .mise/*.py the task helpers.
#
# So this config selects the rules that catch a BREAK and none that argue about
# style. A slip in the host takes out every Python function at once and no Go
# test compiles it, which is the whole reason it is linted; the same file's
# `%`-formatting and its deliberate blind `except` around the frame loop are
# not bugs, and a linter that reported them would only teach people to skip it.
#
# `ruff format` is deliberately NOT run over this tree. The host is hand-laid
# out to stay readable beside the protocol it implements, and the function
# bodies under `kinds/` are YAML literal scalars that yamlfmt already holds.

# The oldest interpreter the host is expected to run on. Bodies may ask for
# more through PEP 723; the host itself may not.
target-version = "py39"

[lint]
# F  — pyflakes: undefined names, unused imports, the errors that are errors.
# E9 — syntax and IO errors, the ones that stop the file loading at all.
# B  — bugbear's genuine traps: mutable default arguments, a `raise` inside an
#      `except` that loses the cause, a loop variable captured by a closure.
select = ["F", "E9", "B"]

# A BASELINE, not a policy: the one finding the bodies carried when they were
# first linted, in a package this change did not otherwise touch. The key is
# the path .mise/pybodies.py writes google's `syncdrive` body to
# (`<yaml path>.<function>.py`), which ruff resolves against the extracted
# tree. The google change that next bumps that package raises it `from` its
# cause and deletes this table.
[lint.per-file-ignores]
"kinds/providers.substrate.reamde.dev/google/bundle.yaml.syncdrive.py" = ["B904"]
