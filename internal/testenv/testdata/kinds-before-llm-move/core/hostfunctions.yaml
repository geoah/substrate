# THE HOST FUNCTIONS: the four callables whose body is the ENGINE.
#
# `runtime: host` names no source. What runs is engine code — the agent loop's
# query executor, the GraphQL executor the /graphql endpoint shares, the propose
# writer — and this file is what makes each of them a RECORD like every other
# function: seeded into a new repository, delivered to an existing one by the
# boot upgrade, listed in the functions collection, and named by an agent under
# `tools: [{function: substrate.reamde.dev/core/…}]` exactly as a bundle's
# function is. They used to be four engine constants and a `{builtin: x}` arm on
# `tools:` — the one thing an agent could name that no record declared.
#
# THE DECLARATION IS THE CARD. The `description` and the `arguments:` here are
# what the model is shown, rendered by the loader like any other function's, so
# tuning what an LLM reads about `graphql` is editing this file. Only `host` is
# admissible from a SHIPPED build: the engine can implement only what the engine
# ships, so the loader refuses the runtime from any installed package.
#
# THE GRANT IS THE CALLER'S. A host function declares no `reads:` and (except
# propose) no `emit:`, because the grant that scopes it belongs to whoever
# called it: `query` is held to the calling agent's `reads:`, `mutate` to its
# effective writes. That is also why two of the four are NOT callable through
# the direct call API and never a trigger's target — there is no calling agent
# whose grants would bound them.
# ---- query: the capability-scoped read -------------------------------------
kind: substrate.reamde.dev/core/function
metadata:
  id: substrate.reamde.dev/core/query
data:
  authority: substrate.reamde.dev
  package: core
  description: >-
    Read records: pass kind + id for one record, kind (+ optional filter,
    first) to list, or q (+ optional kinds, k) to search. Read-only. Records
    are always addressed by their full reference (kind + id), never a bare
    id.
  runtime: host
  arguments:
    - name: id
      type: string
      description: read one record by id (requires kind — identity is the
        (kind, id) pair)
    - name: kind
      type: string
      description: "a kind reference: with id reads one record, alone lists"
    - name: filter
      type: json
      description: >-
        the list filter: {ids, implements, properties, labels, deleted}; properties
        maps a name to a condition (eq, in, prefix, gt, gte, lt, lte, contains,
        exists), timestamps RFC3339
    - name: first
      type: int
      description: max rows to return
    - name: q
      type: string
      description: search query
    # The executor has always read a `kinds` list on the search arm; the Go card
    # literal never declared it, so no caller could legally pass one. The
    # declaration is the contract now, and it says what the code does.
    - name: kinds
      type: string
      repeated: true
      description: narrow the search to these kinds, each within the reads
        allowlist
    - name: k
      type: int
      description: max search hits
---
# ---- write: the agent-scoped write ------------------------------------------
# No `emit:` of its own, and that is the point: the ceiling is the CALLING
# AGENT's effective emit, so an emit here would be a second, looser answer to
# the question of what this tool may write.
kind: substrate.reamde.dev/core/function
metadata:
  id: substrate.reamde.dev/core/write
data:
  authority: substrate.reamde.dev
  package: core
  description: >-
    Write one record: op put creates or updates (merges, never prunes) the
    record at kind + id (omit id to mint one); op patch changes an existing
    one; op delete tombstones one. Property values ride under input as {"properties":
    {...}}, labels and annotations beside them; ifVersion holds the write
    to the version you read. A link to another record is an ordinary property
    whose value is "<kind>/<id>". Every record written must be of a kind in
    the agent's writes allowlist; merge and split are the owner's. Ids must
    come from query results, never invented — except a put's new id.
  runtime: host
  arguments:
    - name: op
      type: enum
      values:
        - put
        - patch
        - delete
      required: true
      description: put creates or updates, patch changes an existing record,
        delete tombstones one
    - name: kind
      type: string
      required: true
      description: the kind reference of the record
    - name: id
      type: string
      description: the record id (required for patch and delete; omit on put
        to mint one)
    - name: input
      type: json
      description: '{properties, labels, annotations} for put and patch'
    - name: ifVersion
      type: int
      description: apply only if the record is still at this version
---
# ---- propose: the reviewed write -------------------------------------------
# The one host function with a write permission, because it writes one kind and
# always the same one. The calling agent's writes must name it too: the grant
# is checked at load on the agent and again at dispatch against the effective
# set.
kind: substrate.reamde.dev/core/function
metadata:
  id: substrate.reamde.dev/core/propose
data:
  authority: substrate.reamde.dev
  package: core
  description: >-
    Propose a reviewed change to the graph instead of writing it: lands a
    recordpatchrequest the owner decides on. op patch (default) changes an
    existing record (needs target + diff); op create mints a new record on
    accept (needs kind + id + diff); op delete tombstones an existing record
    (needs target). A diff wraps property changes under "properties".
  runtime: host
  arguments:
    # The three values are the dispatcher's own op vocabulary
    # (engine/write.go opPatch/opCreate/opDelete), pinned by a test: an enum the
    # model may answer with and the dispatcher would not recognize is a tool call
    # that fails after the model believed it.
    - name: op
      type: enum
      values:
        - patch
        - create
        - delete
      description: 'what accepting would do: patch (the default) an existing
        record, create the named one, or delete it. These are the request''s
        own words, not the put/patch/delete the mutate tool takes'
    - name: target
      type: string
      description: the existing record id to patch or delete (requires kind
        — identity is the (kind, id) pair)
    - name: kind
      type: string
      description: the kind reference of the target (patch/delete) or of the
        record to mint (create)
    - name: id
      type: string
      description: "for op create: a stable id for the new record (create-if-absent
        on accept)"
    - name: diff
      type: json
      description: 'the proposed change: property values under "properties",
        a link to another record among them'
    - name: rationale
      type: string
      description: why you propose this
  permissions:
    writes:
      - substrate.reamde.dev/core/recordpatchrequest
---
# ---- ask: the soft interaction --------------------------------------------------
# Lands ONE llminteraction — a batch of questions the user answers as a unit —
# with `thread` stamped by the loop. The answer arrives in a LATER turn as a
# system row (the answering transition notifies the thread and resumes it), so
# the card teaches the model the contract: ask, then continue other work or
# end the turn; never poll for the answer.
kind: substrate.reamde.dev/core/function
metadata:
  id: substrate.reamde.dev/core/ask
data:
  authority: substrate.reamde.dev
  package: core
  description: >-
    Ask the user a batch of questions (at most 8; each yes/no, pick-one, or
    pick-many with at most 32 options). The answer does NOT come back from
    this call: it arrives in a later turn once the user responds, so ask and
    then continue or finish — never poll. Question ids key the answers.
  runtime: host
  arguments:
    - name: questions
      type: json
      required: true
      description: 'a list of {id, prompt, options?: [{value, label?, description?}],
        multi?: bool}; omit options for a yes/no question'
  permissions:
    writes:
      - substrate.reamde.dev/core/llminteraction
