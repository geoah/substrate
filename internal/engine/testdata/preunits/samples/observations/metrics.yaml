# The physical metrics several domains share, as DATA: ordinary metric records
# the import puts after the kinds land, editable and deletable like anything
# else. A domain sample ships its own under a package-prefixed id
# (`health/heart_rate`); these six carry no prefix because no one domain owns
# them (decision record 0159).
#
# Code systems: `homeassistant` is a Home Assistant sensor device class, `cf`
# a CF standard name.
kind: samples.substrate.reamde.dev/observations/metric
metadata:
  id: air_temperature
data:
  properties:
    name: Air temperature
    description: The temperature of the air where the sensor is, indoors or
      out.
    codes:
      - system: homeassistant
        code: temperature
      - system: cf
        code: air_temperature
    measures: temperature
    unit: Cel
    form: gauge
    reducers:
      - avg
      - min
      - max
      - last
    displayPrecision: 1
    category: climate
---
kind: samples.substrate.reamde.dev/observations/metric
metadata:
  id: relative_humidity
data:
  properties:
    name: Relative humidity
    description: How much water vapour the air holds, as a part of what it
      could hold at its temperature.
    codes:
      - system: homeassistant
        code: humidity
      - system: cf
        code: relative_humidity
    measures: fraction
    unit: "%"
    form: gauge
    reducers:
      - avg
      - min
      - max
      - last
    displayPrecision: 0
    category: climate
---
kind: samples.substrate.reamde.dev/observations/metric
metadata:
  id: energy
data:
  properties:
    name: Energy
    description: >-
      Electrical or thermal energy, most often a meter's running total. A
      meter reading is a counter; energy used over a span is an amount.
    codes:
      - system: homeassistant
        code: energy
    measures: energy
    unit: kW.h
    form: counter
    reducers:
      - increase
      - rate
      - last
    displayPrecision: 3
    category: energy
---
kind: samples.substrate.reamde.dev/observations/metric
metadata:
  id: power
data:
  properties:
    name: Power
    description: The rate at which energy is used or produced at an instant.
    codes:
      - system: homeassistant
        code: power
    measures: power
    unit: W
    form: gauge
    reducers:
      - avg
      - min
      - max
      - last
    displayPrecision: 0
    category: energy
---
kind: samples.substrate.reamde.dev/observations/metric
metadata:
  id: illuminance
data:
  properties:
    name: Illuminance
    description: How much light falls on the sensor.
    codes:
      - system: homeassistant
        code: illuminance
    measures: illuminance
    unit: lx
    form: gauge
    reducers:
      - avg
      - min
      - max
      - last
    displayPrecision: 0
    category: climate
---
kind: samples.substrate.reamde.dev/observations/metric
metadata:
  id: atmospheric_pressure
data:
  properties:
    name: Atmospheric pressure
    description: The pressure of the air, as a barometer reads it.
    codes:
      - system: homeassistant
        code: atmospheric_pressure
      - system: cf
        code: air_pressure
    measures: pressure
    unit: hPa
    form: gauge
    reducers:
      - avg
      - min
      - max
      - last
    displayPrecision: 1
    category: climate
