# The units every repository is seeded with (decision 0186), grouped
# by the measure of the engine's old unit table they came from. This file
# is the source: edit it by hand, then run
#
#   go test ./internal/engine/unitseed/
#   go test ./internal/engine/unitseed/ -run TestUnitsPage -update
#   go test ./internal/engine/ -run TestConsoleFixtureMatchesTheSeed -update-console-units
#
# to check it and rewrite docs/units.md and the console's test fixture.
