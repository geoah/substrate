# The REST surface as an OpenAPI 3.1 document. Hand-written; five Go tests
# in openapi_test.go hold it to the code: every route chi mounts is a path and
# method here and nothing else is; every component schema names exactly the
# fields the Go struct serializes, with their types, and a response's required
# set is the fields the server always writes (a request body is closed, since
# the server decodes it strictly, and its required set is the endpoint's own
# rule); every shape the console mirrors (wire.golden.json) is a component
# under the same name; every $ref resolves; and the served route answers this
# document. The server serves it, unauthenticated, at
# GET /.well-known/substrate/openapi.json. docs/api.md is the prose contract;
# this file is the one a client generator reads.
openapi: 3.1.0
info:
  title: Substrate REST API
  version: v1
  description: |-
    One repository per token, one set of routes for every kind. A kind
    reference is `{authority}/{package}/{kind}`, and a record's REST path is
    `/api/v1/` followed by that reference and its id: three segments address
    a collection, four a record. A new kind adds no route.

    Authentication is a bearer token on every route under `/api/v1` and on
    `/tokens`: `Authorization: Bearer substrate_tok_...`. A token has full
    access to its repository; there are no scopes. The token names the
    repository, so no path carries one. `X-Substrate-Actor` names the door a
    write came through (`console`, `substratectl`; absent is `api`) and is
    attribution only; the substrate's own hands (`substrate`, `bundle:`,
    `function:`, `agent:` names) are refused with `403 forbidden`.

    Every refused request answers one body, `ErrorEnvelope`, whose `code` is
    one of thirteen strings; the status code follows the code. A `compacted`
    refusal (`410`) names the changelog `head` and `generation` to re-list
    from.

    Lists page with an opaque `cursor` passed back as `after`; the response
    carries `head` and `generation`, the changelog position the list was read
    at, which a watch resumes from (`from={head}&generation={generation}`).
    The change feed pages with real sequence numbers, `from` forward and
    `before` backward, each bound to a history `generation`.

    `PUT` merges and never prunes: what the body omits is left alone. `PATCH`
    merges one level deep and a `null` deletes the key. `put` and `patch`
    take `ifVersion` in the body, `delete` takes `?ifVersion=`, `merge` takes
    `winnerVersion` and `loserVersion`, `split` takes `ifVersion` on the
    merge record; a stale precondition is `409 conflict` and changes
    nothing.

    Record properties are open (`additionalProperties: true`): what a kind
    declares is in its declaration, not here. A reference reads as
    `{"ref": "<kind>/<id>"}` and an attachment (`blobref`) as the manifest
    `{digest, name, mediaType, size, status}` (`BlobInfo`); a write accepts
    either object and uses only `ref` or `digest`.

    A record id that carries a `/` (a declaration's id is a kind reference)
    is percent-encoded once in the path, `%2F`, and decoded once by the
    server.

    A response of `application/x-ndjson` is a stream of JSON objects, one
    per line. On the change feed a line with `seq` is a `ChangeRow`; a line
    without one is a control frame: the opening `BookmarkFrame`, the idle
    heartbeat `{}` every 30 seconds, or a terminal `ErrorEnvelope`. On agent
    chat every line is an `AgentEvent`. This document describes each stream
    as an opaque string.

    `POST /api/v1/graphql` is a preview: every part of the GraphQL surface
    may change without a v1 wire break. REST is the supported interface.
servers:
  - url: /
    description: The substrate the document was fetched from.
security:
  - bearer: []
tags:
  - name: health
    description: Liveness and discovery. No authentication, no repository.
  - name: auth
    description: |-
      Registration, login, the credential changes and tokens. These sit
      beside `/api/v1`. A credential change carries both current factors in
      its body and refuses a bearer token (`403 forbidden`).
  - name: records
    description: The generic record surface. The path names the kind.
  - name: changes
    description: The changelog, paged and streamed.
  - name: vocabulary
    description: Declarations as records, applied in one batch.
  - name: catalog
    description: The bundles shipped in the binary, and the two doors that
      take one.
  - name: bundles
    description: An installed bundle's status, inputs and OAuth connect.
  - name: triggers
    description: Trigger delivery bookkeeping under the core package.
  - name: functions
    description: Function and agent invocation. Agents are alpha.
  - name: blobs
    description: The content-addressed byte store.
  - name: occurrences
    description: Recurring records expanded into instants at read.
  - name: embeddings
    description: The re-embed verb. Alpha.
  - name: export
    description: The owner's recovery export, a tar of the repository directory.
      Beta.
  - name: webhooks
    description: The public webhook door. No bearer; the trigger's key is
      the credential.
  - name: graphql
    description: The preview GraphQL door.
paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness
      operationId: getHealth
      security: []
      responses:
        "200":
          description: The process is up. Touches no database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /.well-known/substrate/server.json:
    get:
      tags: [health]
      summary: Discovery
      description: |-
        What this deployment serves: the API versions, the build, the
        dialect maxima, the changelog horizon, the feature list with each
        feature's stability and surfaces, the two surfaces' compatibility,
        the reference grammar, the auth endpoints and what registration asks
        for. Unauthenticated and repository-free, so a client reads it before
        it holds a token.
      operationId: getDiscovery
      security: []
      responses:
        "200":
          description: The discovery document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discovery"
  /.well-known/substrate/openapi.json:
    get:
      tags: [health]
      summary: This document
      description: |-
        This OpenAPI document as JSON, served read-only so a client generator
        can fetch the contract from the substrate it targets.
      operationId: getOpenAPI
      security: []
      responses:
        "200":
          description: The OpenAPI 3.1 document.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /register/enroll:
    post:
      tags: [auth]
      summary: Begin registration
      description: |-
        Issues a TOTP enrollment for a registration. Writes nothing: the
        caller hands the seed back with one code on `POST /register`. Rate
        limited per client address and repository; a refusal is `429` with
        `Retry-After`.
      operationId: registerEnroll
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBeginRequest"
      responses:
        "200":
          description: The candidate second factor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPEnrollment"
        "401":
          description: The invite code is wrong (`auth`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "501":
          description: Registration is closed on this deployment (`unsupported`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/Error"
  /register:
    post:
      tags: [auth]
      summary: Register
      description: |-
        Creates the repository and its user in one transaction and answers
        with the first token's secret, so registration ends logged in. The
        `repository` name BECOMES the repository's authority: a name carrying
        a dot is taken as it is, a bare label is completed under the host the
        request reached, and the response echoes what was created.
        `recoveryKey` is present only when the server minted the recovery
        pair, shown this once.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: The user, the repository and the first token exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResult"
        "401":
          description: The invite code is wrong (`auth`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "501":
          description: Registration is closed on this deployment (`unsupported`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/Error"
  /login:
    post:
      tags: [auth]
      summary: Log in
      description: |-
        Both factors in the body; mints a token record and answers with its
        secret once. Every failure (unknown user, wrong password, wrong code)
        is one identical `401 auth`.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "201":
          description: A token was minted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MintedToken"
        "401":
          description: The factors were refused (`auth`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /password:
    post:
      tags: [auth]
      summary: Change the password
      description: |-
        The current password and code in the body; a bearer token is refused
        (`403 forbidden`). Live tokens survive the change. No token is
        minted.
      operationId: changePassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRequest"
      responses:
        "200":
          description: The password changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCredential"
        "401":
          description: The factors were refused (`auth`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/FactorsRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /totp/enroll:
    post:
      tags: [auth]
      summary: Begin a TOTP re-enrollment
      description: |-
        Verifies the current factors and issues a candidate seed. Writes
        nothing; `POST /totp` commits it.
      operationId: totpEnroll
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPBeginRequest"
      responses:
        "200":
          description: The candidate second factor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPEnrollment"
        "401":
          description: The factors were refused (`auth`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/FactorsRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /totp:
    post:
      tags: [auth]
      summary: Replace the second factor
      description: |-
        Proves the current factors and one code from the new seed, then
        swaps the seed.
      operationId: totpReenroll
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPRequest"
      responses:
        "200":
          description: The second factor changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCredential"
        "401":
          description: The factors were refused (`auth`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/FactorsRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /recovery/enroll:
    post:
      tags: [auth]
      summary: Enroll a recovery key
      description: |-
        One-time enrollment for a repository that predates recovery keys;
        registration is the ordinary door. Both current factors in the body.
        `recoveryKey` is present only when the server minted the pair.
      operationId: recoveryEnroll
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryEnrollRequest"
      responses:
        "201":
          description: The recovery key is enrolled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryEnrollResponse"
        "401":
          description: The factors were refused (`auth`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/FactorsRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /tokens:
    post:
      tags: [auth]
      summary: Mint a token
      description: |-
        The authenticated twin of login: a token record in the caller's
        repository, its secret shown once. `label` defaults to `token`.
      operationId: mintToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MintRequest"
      responses:
        "201":
          description: A token was minted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MintedToken"
        default:
          $ref: "#/components/responses/Error"
    get:
      tags: [auth]
      summary: List tokens
      description: Metadata only; never a secret or a hash.
      operationId: listTokens
      responses:
        "200":
          description: Every token record of the repository.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenList"
        default:
          $ref: "#/components/responses/Error"
  /tokens/{id}:
    delete:
      tags: [auth]
      summary: Revoke a token
      description: |-
        Deletes the token record, the same write as `DELETE` on the
        `substrate.reamde.dev/core/token` collection. No row means no
        access.
      operationId: revokeToken
      parameters:
        - name: id
          in: path
          required: true
          description: The token record's id.
          schema:
            type: string
      responses:
        "200":
          description: The tombstoned token record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubstrateRecord"
        default:
          $ref: "#/components/responses/Error"
  /webhooks/{authority}/{trigger}:
    post:
      tags: [webhooks]
      summary: Deliver a webhook
      description: |-
        The public door: a body and no bearer, like the auth routes beside
        `/api/v1`, but open to whoever can reach the server unless the
        trigger declares a key. `authority` is the repository's authority and `trigger` the id of a
        `substrate.reamde.dev/core/trigger` record whose source is `webhook`.
        A trigger that declares a key takes it as the trailing path segment,
        as `?key=` or as `Authorization: Bearer <key>`. A non-multipart body
        is bounded at 1 MiB and carried whole; `multipart/form-data` is
        bounded at 32 MiB and its file parts are stored as blobs before the
        fire. Every refusal that must not distinguish a missing trigger from
        a wrong key is `404 not_found`.
      operationId: postWebhook
      security: []
      parameters:
        - $ref: "#/components/parameters/webhookAuthority"
        - $ref: "#/components/parameters/webhookTrigger"
        - name: key
          in: query
          required: false
          description: The trigger's key, when it declares one.
          schema:
            type: string
      requestBody:
        $ref: "#/components/requestBodies/WebhookBody"
      responses:
        "202":
          $ref: "#/components/responses/WebhookAccepted"
        "404":
          description: No such repository, trigger or key; a disabled trigger;
            another source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: The body is over its bound (`bad_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "431":
          description: The headers are over 16 KiB (`bad_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
  /webhooks/{authority}/{trigger}/{key}:
    post:
      tags: [webhooks]
      summary: Deliver a webhook, key in the path
      description: |-
        `POST /webhooks/{authority}/{trigger}` with the trigger's key as the
        trailing segment, for a sender that cannot set headers.
      operationId: postWebhookWithKey
      security: []
      parameters:
        - $ref: "#/components/parameters/webhookAuthority"
        - $ref: "#/components/parameters/webhookTrigger"
        - name: key
          in: path
          required: true
          description: The trigger's declared key.
          schema:
            type: string
      requestBody:
        $ref: "#/components/requestBodies/WebhookBody"
      responses:
        "202":
          $ref: "#/components/responses/WebhookAccepted"
        "404":
          description: No such repository, trigger or key; a disabled trigger;
            another source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: The body is over its bound (`bad_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "431":
          description: The headers are over 16 KiB (`bad_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/oauth/callback:
    get:
      tags: [bundles]
      summary: OAuth consent callback
      description: |-
        The provider redirects the browser here; the HMAC-signed `state` is
        the authentication, so no bearer. Answers a self-contained HTML page
        that reports the outcome to the console window that opened it. A
        failure reflects no provider detail, only a correlation id for the
        server log.
      operationId: oauthCallback
      security: []
      parameters:
        - name: state
          in: query
          required: true
          description: The signed one-time state `POST /api/v1/oauth/start`
            began.
          schema:
            type: string
        - name: code
          in: query
          required: false
          description: "The provider's authorization code. Absent on a refusal,
            which the page reports as a failure."
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: |-
            The provider's refusal (`access_denied`), sent with `state` and no
            `code`. The handler accepts the request and the page reports the
            failure with a correlation id; `error_description` may ride
            beside it and is ignored.
          schema:
            type: string
      responses:
        "200":
          description: The return page, success or failure alike.
          content:
            text/html:
              schema:
                type: string
        "501":
          description: This deployment completes no OAuth flow (`unsupported`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/graphql:
    post:
      tags: [graphql]
      summary: GraphQL (preview)
      description: |-
        The GraphQL door. PREVIEW: the schema is generated per repository
        from its kinds, and every part of it, the root operations and the
        scalars included, may change without a v1 wire break. The supported
        interface is the REST surface in the rest of this document. A
        resolver error carries the REST problem object under `extensions`.
      operationId: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GraphQLRequest"
      responses:
        "200":
          description: The GraphQL result. Field errors are inside the body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphQLResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/vocabulary/apply:
    post:
      tags: [vocabulary]
      summary: Apply declarations
      description: |-
        Applies a batch of declaration documents (kinds, traits, property
        types, mappings, functions, agents, bundles): every document
        admitted or none, one transaction, activation on commit. Each
        document is the four-key envelope `kind`/`metadata`/`data`/`status`.
        Bounded at 32 MiB. A batch whose conversion plan is lossy (see
        `/vocabulary/plan`) runs only with `confirm` carrying that plan's
        `planHash` and `changelogSeq`; without one it is refused with the
        `lossy` code, and after any intervening write with `conflict`.
      operationId: applyVocabulary
      parameters:
        - $ref: "#/components/parameters/actor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VocabularyApplyRequest"
      responses:
        "200":
          description: The declaration records as they landed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VocabularyApplyResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/vocabulary/plan:
    post:
      tags: [vocabulary]
      summary: Preview an apply
      description: |-
        What applying the batch would refuse (`blockers`) and what it would
        rewrite: the conversion steps with a live record count each, the
        estimated work, whether the plan is lossy, and the `planHash` and
        `changelogSeq` a confirmation names. Writes nothing. A batch the
        apply would refuse before counting anything (a malformed document, a
        package the caller may not write) is the same refusal here.
      operationId: planVocabulary
      parameters:
        - $ref: "#/components/parameters/actor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VocabularyPlanRequest"
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VocabularyPlan"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/vocabulary/upgrade:
    get:
      tags: [vocabulary]
      summary: Preview the shipped upgrade
      description: |-
        What this binary's boot upgrade would do to each package it ships
        and seeds, computed against this repository's declarations, with the
        guard lines it refused on. Writes nothing.
      operationId: getVocabularyUpgrade
      responses:
        "200":
          description: One entry per shipped package.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShippedUpgradeList"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/embeddings/reembed:
    post:
      tags: [embeddings]
      summary: Re-embed the repository
      description: |-
        ALPHA. Enqueues every embeddable property whose stored vectors did
        not come from the repository's current embeddings provider and
        model; `all: true` ignores the stored provenance. Buys nothing
        itself: the drain loop does. An empty body is the default scan.
      operationId: reembed
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReembedRequest"
      responses:
        "200":
          description: What was enqueued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReembedReport"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/export:
    get:
      tags: [export]
      summary: Download the repository's recovery export
      description: |-
        BETA. Streams the repository's directory as of one committed point
        as a tar laid out as a data root: `repositories/<authority>/` with
        `repository.json`, `changelog/` (every finished segment with its
        `.sha256` sidecar and the active segment cut at the point),
        `sealed/`, `blobs/` (the bytes of every stored blob, whatever store
        the server runs) and, as the last entry, `snapshot.json` recording
        the head seq and checksum the archive holds. The point is pinned
        under the repository's writer lock and the files are streamed
        afterwards, so writes go on during the download. The archive
        carries no host key: its sealed files are ciphertext under the
        repository's data key, which `repository.json` holds wrapped under
        the server's `SUBSTRATE_CREDENTIAL_KEY` and the `recoverykey`
        record holds wrapped to the owner's recovery key. A stream that
        ends before `snapshot.json` is incomplete; download it again.
        `Content-Disposition` names the file `<authority>-<head>.tar`.
      operationId: exportRepository
      responses:
        "200":
          description: The archive.
          headers:
            Content-Disposition:
              description: "`attachment; filename=<authority>-<head>.tar`."
              schema:
                type: string
          content:
            application/x-tar:
              schema:
                type: string
                format: binary
        "409":
          description: An export of this repository is already streaming (`conflict`);
            one streams at a time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "501":
          description: This deployment does not export a repository (`unsupported`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/merge:
    post:
      tags: [records]
      summary: Merge two records
      description: |-
        Joins two records of one kind; the loser's id resolves to the winner
        from then on. `winnerVersion` and `loserVersion` each hold one
        participant to the version the caller read, and a mismatch is
        `409 conflict` before anything moves. Answers the `recordmerge`
        record the merge created.
      operationId: merge
      parameters:
        - $ref: "#/components/parameters/actor"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeInput"
      responses:
        "201":
          description: The merge record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubstrateRecord"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/split:
    post:
      tags: [records]
      summary: Split a merge
      description: |-
        Reverses one merge, restoring the loser from the `recordmerge`
        record. `ifVersion` holds the merge record alone. Answers the
        `recordsplit` record the split created.
      operationId: split
      parameters:
        - $ref: "#/components/parameters/actor"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplitInput"
      responses:
        "201":
          description: The split record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubstrateRecord"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/changes:
    get:
      tags: [changes]
      summary: The change feed
      description: |-
        Three modes on one route. With `before` or `first`: one JSON
        `ChangePage`, newest first; `cursor` is the next `before`, absent
        when the walk is done. With `watch=1`: an `application/x-ndjson`
        stream opened by a `BookmarkFrame`, then every matching `ChangeRow`
        from the cursor on, heartbeats `{}` while idle, a terminal
        `ErrorEnvelope` on failure. Otherwise: the forward read from `from`,
        also ndjson, the bookmark then up to 500 rows.

        A cursor is a seq under a history generation. `from` or `before`
        above 0 needs `generation=`; a cursor under another generation,
        above the head, or without a generation is `410 compacted`, whose
        problem object names the `head` and `generation` to re-list from.
        `from=0` and `before=0` name no entry and need none.

        The filter keys are plural and take a repeated parameter or a
        comma-separated list. Scoping to one record takes both `recordId`
        and `recordKind`. Any other query parameter is `400 bad_request`
        naming it. Every row carries `triggers`, each enabled trigger's
        stance on it.
      operationId: getChanges
      parameters:
        - name: watch
          in: query
          description: "`1` opens the live ndjson stream."
          schema:
            type: string
            enum: ["1"]
        - name: from
          in: query
          description: Resume after this seq (forward read and watch).
          schema:
            type: integer
            format: int64
        - name: before
          in: query
          description: Page history below this seq, newest first. `0` is the
            head.
          schema:
            type: integer
            format: int64
        - name: generation
          in: query
          description: The history generation `from` or `before` was read
            under.
          schema:
            type: string
        - name: first
          in: query
          description: History page size, default 50, capped at 500.
          schema:
            type: integer
        - name: recordId
          in: query
          description: One record's feed, with `recordKind`.
          schema:
            type: string
        - name: recordKind
          in: query
          description: The kind of `recordId`.
          schema:
            type: string
        - name: q
          in: query
          description: Case-insensitive substring over kind, actor, record
            id and payload text.
          schema:
            type: string
        - $ref: "#/components/parameters/changeKinds"
        - $ref: "#/components/parameters/changeExcludeKinds"
        - $ref: "#/components/parameters/changeActors"
        - $ref: "#/components/parameters/changeExcludeActors"
        - $ref: "#/components/parameters/changeOps"
        - $ref: "#/components/parameters/changeExcludeOps"
      responses:
        "200":
          description: A history page, or an ndjson stream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePage"
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/ChangeStream"
        "410":
          $ref: "#/components/responses/Compacted"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/occurrences:
    get:
      tags: [occurrences]
      summary: Occurrences in a window
      description: |-
        Every recurring record's computed instants inside `[from, to)`,
        sorted by instant. A read: the rule stays stored and unexpanded, and
        a computed occurrence has no id. A repository without the scheduling
        vocabulary answers an empty list.
      operationId: getOccurrences
      parameters:
        - name: from
          in: query
          required: true
          description: RFC 3339 start, inclusive.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: RFC 3339 end, exclusive.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          description: Slot cap, 1 to 10000, default 1000. `truncated` says
            when it cut.
          schema:
            type: integer
      responses:
        "200":
          description: The occurrences, and the rules that could not expand.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OccurrenceList"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog:
    get:
      tags: [catalog]
      summary: List the catalog
      description: |-
        Every bundle shipped in the binary, each with whether this
        repository holds it and, for a held provider, the upgrade preview.
      operationId: listCatalog
      responses:
        "200":
          description: The catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogList"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/{id}:
    get:
      tags: [catalog]
      summary: One catalog entry
      operationId: getCatalogItem
      parameters:
        - $ref: "#/components/parameters/catalogID"
      responses:
        "200":
          description: The entry and its closure preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogItem"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/{id}/install:
    post:
      tags: [catalog]
      summary: Install a provider
      description: |-
        Applies the shipped closure under the authority that publishes it.
        Re-install is the upgrade. Answers the landed bundle's status with
        the state of each suggested mapping the closure carried. An upgrade
        whose preview (`upgrade` on the catalog read) is `lossy` runs only
        with a body confirming that preview's `planHash` and `changelogSeq`;
        a lossless one takes no body.
      operationId: installCatalogItem
      parameters:
        - $ref: "#/components/parameters/catalogID"
        - $ref: "#/components/parameters/actor"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogTakeRequest"
      responses:
        "200":
          description: The installed bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BundleTaken"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/{id}/import:
    post:
      tags: [catalog]
      summary: Import a sample
      description: |-
        Rehomes the shipped closure onto this repository's own authority and
        applies it, so what lands is `<authority>/<package>`. A provider id
        is refused here, naming install. The optional body is the install's:
        a re-import replaces the package, and one whose preview (`upgrade`
        on the catalog read) is `lossy` or `discardsEdits` (the copy was
        edited since it was imported) runs only with a confirmation naming
        that preview's `planHash` and `changelogSeq`.
      operationId: importCatalogItem
      parameters:
        - $ref: "#/components/parameters/catalogID"
        - $ref: "#/components/parameters/actor"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogTakeRequest"
      responses:
        "200":
          description: The imported bundle, under the repository's authority.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BundleTaken"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/oauth/start:
    post:
      tags: [bundles]
      summary: Start an OAuth connect
      description: Begins the host connect flow for an account record; the
        browser visits the URL.
      operationId: oauthStart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthStartRequest"
      responses:
        "200":
          description: The provider consent URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthStarted"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/blobs:
    put:
      tags: [blobs]
      summary: Store bytes
      description: |-
        Stores the body under its SHA-256 digest and mints or settles the
        blob manifest, an ordinary `substrate.reamde.dev/core/blob` record
        whose id is the digest. The same bytes dedup to the same blob. The
        display name comes from `?name=` or a `Content-Disposition` filename,
        the media type from `Content-Type`; both are optional and neither
        takes part in dedup. Bounded at 64 MiB; a larger body is `413`.
      operationId: putBlob
      parameters:
        - $ref: "#/components/parameters/blobName"
        - $ref: "#/components/parameters/actor"
      requestBody:
        $ref: "#/components/requestBodies/BlobBytes"
      responses:
        "201":
          $ref: "#/components/responses/BlobStored"
        "413":
          description: The body is over 64 MiB (`bad_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/blobs/{digest}:
    put:
      tags: [blobs]
      summary: Store bytes under a claimed digest
      description: |-
        `PUT /api/v1/blobs` with the digest the caller expects; bytes that
        hash to anything else are `400 bad_request`.
      operationId: putBlobAtDigest
      parameters:
        - $ref: "#/components/parameters/blobDigest"
        - $ref: "#/components/parameters/blobName"
        - $ref: "#/components/parameters/actor"
      requestBody:
        $ref: "#/components/requestBodies/BlobBytes"
      responses:
        "201":
          $ref: "#/components/responses/BlobStored"
        "413":
          description: The body is over 64 MiB (`bad_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
    get:
      tags: [blobs]
      summary: Read bytes
      description: |-
        Streams a blob's bytes. `Content-Type` is the manifest's media type,
        else `application/octet-stream`; a named blob carries a
        `Content-Disposition` filename; `ETag` is the digest. A digest
        another repository stored is `404 not_found`.
      operationId: getBlob
      parameters:
        - $ref: "#/components/parameters/blobDigest"
      responses:
        "200":
          description: The bytes.
          headers:
            ETag:
              description: The digest, quoted.
              schema:
                type: string
            Content-Disposition:
              description: "`inline; filename=...` when the blob has a name."
              schema:
                type: string
          content:
            "*/*":
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /api/v1/substrate.reamde.dev/core/trigger/status:
    get:
      tags: [triggers]
      summary: Every trigger's delivery status
      description: |-
        Computed on read: kind, cursor, head, lag, last fire and parked
        count per trigger. Nothing here is stored on the trigger record.
      operationId: listTriggerStatus
      responses:
        "200":
          description: One status per trigger.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerStatusList"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/substrate.reamde.dev/core/trigger/{id}/replay:
    post:
      tags: [triggers]
      summary: Replay a trigger
      description: Resets a record-sourced trigger's cursor to `from`; the
        dispatcher redelivers.
      operationId: replayTrigger
      parameters:
        - $ref: "#/components/parameters/triggerID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayRequest"
      responses:
        "200":
          description: The seq the cursor was reset to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerReplayed"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/substrate.reamde.dev/core/trigger/{id}/run:
    post:
      tags: [triggers]
      summary: Run a trigger on one record
      description: One synthesized delivery of the record's current state,
        without moving the cursor.
      operationId: runTrigger
      parameters:
        - $ref: "#/components/parameters/triggerID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "200":
          description: How many deliveries ran.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerRan"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/substrate.reamde.dev/core/trigger/{id}/wake:
    post:
      tags: [triggers]
      summary: Wake a trigger
      description: |-
        Runs the trigger's scan now: a webhook trigger delivers one fire, a
        record trigger drains its backlog, a schedule trigger checks its due
        occurrence. No body.
      operationId: wakeTrigger
      parameters:
        - $ref: "#/components/parameters/triggerID"
      responses:
        "200":
          description: How many deliveries ran. Zero is an answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerRan"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/substrate.reamde.dev/core/trigger/{id}/parked:
    get:
      tags: [triggers]
      summary: A trigger's parked deliveries
      operationId: listTriggerParked
      parameters:
        - $ref: "#/components/parameters/triggerID"
      responses:
        "200":
          description: The deliveries the trigger gave up on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerFailureList"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/substrate.reamde.dev/core/trigger/{id}/parked/{fid}/retry:
    post:
      tags: [triggers]
      summary: Retry a parked delivery
      description: Re-runs one parked delivery; success deletes the parked
        row.
      operationId: retryTriggerParked
      parameters:
        - $ref: "#/components/parameters/triggerID"
        - name: fid
          in: path
          required: true
          description: The parked failure's id.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: How many deliveries ran.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerRan"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/substrate.reamde.dev/core/bundle/status:
    get:
      tags: [bundles]
      summary: Every installed bundle's status
      operationId: listBundleStatus
      responses:
        "200":
          description: One status per installed bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BundleStatusList"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/substrate.reamde.dev/core/bundle/{id}/status:
    get:
      tags: [bundles]
      summary: One bundle's status
      description: |-
        Lifecycle, each input's resolution, the setup steps still open, and
        the account and record counts. Disable, enable, uninstall and purge
        are a `PATCH` of the bundle record's `disabled`, `uninstalled` or
        `purging` property on the generic record route.
      operationId: getBundleStatus
      parameters:
        - $ref: "#/components/parameters/bundleID"
      responses:
        "200":
          description: The computed status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BundleStatus"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/substrate.reamde.dev/core/bundle/{id}/bind:
    post:
      tags: [bundles]
      summary: Bind an input
      description: |-
        Points one declared input at a chosen record, or clears the choice
        when `record` is absent or empty. Answers the refreshed status.
      operationId: bindBundleInput
      parameters:
        - $ref: "#/components/parameters/bundleID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindRequest"
      responses:
        "200":
          description: The status after the bind.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BundleStatus"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/substrate.reamde.dev/core/trait/{id}/implementors:
    get:
      tags: [vocabulary]
      summary: The kinds implementing a trait
      operationId: listTraitImplementors
      parameters:
        - $ref: "#/components/parameters/traitID"
      responses:
        "200":
          description: The implementing kinds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KindInfoList"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/substrate.reamde.dev/core/trait/{id}/records:
    get:
      tags: [vocabulary]
      summary: The records of every kind implementing a trait
      operationId: listTraitRecords
      parameters:
        - $ref: "#/components/parameters/traitID"
        - $ref: "#/components/parameters/first"
        - $ref: "#/components/parameters/after"
      responses:
        "200":
          description: A page of records across the implementing kinds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/substrate.reamde.dev/core/function/{name}/call:
    post:
      tags: [functions]
      summary: Call a function
      description: |-
        Invokes a function with arbitrary input, validated against its
        declared input schema when it has one; effects apply under the
        function's own actor. A body fault is `500 function_failed`,
        distinct from `422 validation` for bad input. A retry re-runs the
        effects unless it carries the first call's `Idempotency-Key`, which
        answers the stored outcome instead.
      operationId: callFunction
      parameters:
        - $ref: "#/components/parameters/callableName"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallRequest"
      responses:
        "200":
          description: The function's output and how many effects it applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FunctionCalled"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/substrate.reamde.dev/core/agent/{name}/call:
    post:
      tags: [functions]
      summary: Call an agent
      description: |-
        ALPHA. The input becomes the first user message; the response is
        the settled run and the thread that recorded it.
      operationId: callAgent
      parameters:
        - $ref: "#/components/parameters/callableName"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallRequest"
      responses:
        "200":
          description: The settled run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/substrate.reamde.dev/core/agent/{name}/chat:
    post:
      tags: [functions]
      summary: Chat with an agent
      description: |-
        ALPHA. Opens or continues a thread with one user message and streams
        the run as `application/x-ndjson`, one `AgentEvent` per line: the
        `thread` event first, `delta`, `toolStarted` and `toolFinished` as
        they happen, one `done` event carrying the `AgentResult`, or an
        `error` event when the loop fails after the status line is gone.
      operationId: chatAgent
      parameters:
        - $ref: "#/components/parameters/callableName"
        - $ref: "#/components/parameters/actor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: The event stream.
          content:
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/AgentEventStream"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/{authority}/{package}/{kind}:
    parameters:
      - $ref: "#/components/parameters/authority"
      - $ref: "#/components/parameters/package"
      - $ref: "#/components/parameters/kind"
    get:
      tags: [records]
      summary: List or watch a collection
      description: |-
        A keyset-paged list of the kind's live records, or with `watch=1`
        the changelog tail scoped to the kind as `application/x-ndjson`
        (a `BookmarkFrame`, then plain `ChangeRow` lines without `triggers`).
        The path names the kind, so a `filter.kinds` is `400 bad_request`.
        `filter`, `orderBy`, `first`, `after` and `withAnnotations` are
        refused beside `watch=1`; `from` and `generation` are the watch's
        cursor. Any parameter outside the mode's grammar is `400` naming it.
      operationId: listRecords
      parameters:
        - name: filter
          in: query
          description: |-
            The filter document, one JSON object. `kinds` is implied by the
            path and refused here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordFilter"
        - name: orderBy
          in: query
          description: |-
            `property[:asc|desc]`, comma-separated (`at:desc,createdAt`), or
            a JSON array of `{property, desc}`. Only declared properties,
            the hot properties and `createdAt`/`updatedAt` order.
          schema:
            type: string
        - $ref: "#/components/parameters/first"
        - $ref: "#/components/parameters/after"
        - name: withAnnotations
          in: query
          description: "`1` adds each row's `annotations`."
          schema:
            type: string
            enum: ["1"]
        - name: watch
          in: query
          description: "`1` opens the collection's ndjson stream."
          schema:
            type: string
            enum: ["1"]
        - name: from
          in: query
          description: The watch cursor to resume after.
          schema:
            type: integer
            format: int64
        - name: generation
          in: query
          description: The history generation `from` was read under.
          schema:
            type: string
      responses:
        "200":
          description: A page, or the collection's stream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/ChangeStream"
        "404":
          $ref: "#/components/responses/UnknownCollection"
        "410":
          $ref: "#/components/responses/Compacted"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [records]
      summary: Create a record
      description: |-
        Creates a record of the kind; the server assigns the id unless the
        body names one, and a kind some mapping points at refuses a client
        id (`422`). The body's `kind` is ignored: the path names it. A retry
        without an id creates a second record unless it carries the first
        attempt's `Idempotency-Key`, which answers the record it created.
      operationId: createRecord
      parameters:
        - $ref: "#/components/parameters/actor"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/Put"
      responses:
        "201":
          $ref: "#/components/responses/RecordCreated"
        "200":
          $ref: "#/components/responses/RecordWritten"
        "404":
          $ref: "#/components/responses/UnknownCollection"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Validation"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [records]
      summary: Not a collection verb
      description: A `PUT` needs the id in the path. Always `405`.
      operationId: putCollection
      responses:
        "405":
          $ref: "#/components/responses/WrongShape"
    patch:
      tags: [records]
      summary: Not a collection verb
      description: A `PATCH` needs the id in the path. Always `405`.
      operationId: patchCollection
      responses:
        "405":
          $ref: "#/components/responses/WrongShape"
    delete:
      tags: [records]
      summary: Not a collection verb
      description: A `DELETE` needs the id in the path. Always `405`.
      operationId: deleteCollection
      responses:
        "405":
          $ref: "#/components/responses/WrongShape"
  /api/v1/{authority}/{package}/{kind}/{id}:
    parameters:
      - $ref: "#/components/parameters/authority"
      - $ref: "#/components/parameters/package"
      - $ref: "#/components/parameters/kind"
      - $ref: "#/components/parameters/recordID"
    get:
      tags: [records]
      summary: Read a record
      description: |-
        One record with its `propertyMeta`. An id a merge discarded still
        resolves, and `canonicalId` names the record it resolved to.
      operationId: getRecord
      responses:
        "200":
          description: The record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubstrateRecord"
        "404":
          $ref: "#/components/responses/UnknownCollection"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [records]
      summary: Put a record
      description: |-
        Creates or updates the record at this id. A put merges and never
        prunes: what the body omits is left alone. A put onto a tombstone
        restores it. `ifVersion` holds the write to the version the caller
        read (a missing record is version 0). `201` for a create, `200` for
        an update.
      operationId: putRecord
      parameters:
        - $ref: "#/components/parameters/actor"
      requestBody:
        $ref: "#/components/requestBodies/Put"
      responses:
        "201":
          $ref: "#/components/responses/RecordCreated"
        "200":
          $ref: "#/components/responses/RecordWritten"
        "404":
          $ref: "#/components/responses/UnknownCollection"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Validation"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [records]
      summary: Patch a record
      description: |-
        Edits in place. `properties`, `labels` and `annotations` merge key
        by key, one level deep: a value replaces whole, a `null` deletes the
        key. A state property among the properties is a transition. On a
        `substrate.reamde.dev/core/bundle` record the body sets exactly one
        of `disabled`, `uninstalled` or `purging` and runs that lifecycle
        transition, answering `BundleStatus`, `BundleUninstalled` or
        `BundlePurged` instead of the record.
      operationId: patchRecord
      parameters:
        - $ref: "#/components/parameters/actor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordPatch"
      responses:
        "200":
          description: The record after the patch, or a bundle lifecycle reply.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SubstrateRecord"
                  - $ref: "#/components/schemas/BundleStatus"
                  - $ref: "#/components/schemas/BundleUninstalled"
                  - $ref: "#/components/schemas/BundlePurged"
        "404":
          $ref: "#/components/responses/UnknownCollection"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Validation"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [records]
      summary: Delete a record
      description: |-
        Tombstones the record; hard deletion waits for finalizers.
        `?ifVersion=` holds the delete to the version the caller read, and
        a present but unreadable value is refused, never treated as absent.
        Any other query parameter is `400`.
      operationId: deleteRecord
      parameters:
        - $ref: "#/components/parameters/ifVersion"
        - $ref: "#/components/parameters/actor"
      responses:
        "200":
          description: The tombstoned record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubstrateRecord"
        "404":
          $ref: "#/components/responses/UnknownCollection"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [records]
      summary: Not a record verb
      description: |-
        A `POST` creates at the collection; a write to this id is a `PUT`.
        Always `405`.
      operationId: postRecord
      responses:
        "405":
          $ref: "#/components/responses/WrongShape"
  /api/v1/{authority}/{package}/{kind}/incoming:
    get:
      tags: [records]
      summary: Reserved segment
      description: |-
        `incoming` is the record sub-resource word, so it is refused as a
        record id in both directions and this path addresses nothing. Always
        `405`.
      operationId: getCollectionIncoming
      parameters:
        - $ref: "#/components/parameters/authority"
        - $ref: "#/components/parameters/package"
        - $ref: "#/components/parameters/kind"
      responses:
        "405":
          $ref: "#/components/responses/WrongShape"
  /api/v1/{authority}/{package}/{kind}/{id}/incoming:
    get:
      tags: [records]
      summary: Who points at a record
      description: |-
        The references naming this record, paged on their own. Narrowable
        by `property` (one reference property) and `fromKind` (one source
        kind). `filter`, `orderBy` and `withAnnotations` are refused. A
        cursor replayed with different narrowings is `400`.
      operationId: getIncoming
      parameters:
        - $ref: "#/components/parameters/authority"
        - $ref: "#/components/parameters/package"
        - $ref: "#/components/parameters/kind"
        - $ref: "#/components/parameters/recordID"
        - $ref: "#/components/parameters/first"
        - $ref: "#/components/parameters/after"
        - name: property
          in: query
          description: One reference property's name.
          schema:
            type: string
        - name: fromKind
          in: query
          description: One source kind, by reference.
          schema:
            type: string
      responses:
        "200":
          description: A page of incoming references.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomingPage"
        "404":
          $ref: "#/components/responses/UnknownCollection"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |-
        A token secret, `substrate_tok_` and 40 hex characters, minted by
        `POST /login`, `POST /register` or `POST /tokens`.
  parameters:
    authority:
      name: authority
      in: path
      required: true
      description: The kind's authority, a dot-separated DNS-style name.
      schema:
        type: string
      example: samples.substrate.reamde.dev
    package:
      name: package
      in: path
      required: true
      description: The kind's package, one lowercase word.
      schema:
        type: string
      example: tasks
    kind:
      name: kind
      in: path
      required: true
      description: The kind's name, one lowercase word.
      schema:
        type: string
      example: task
    recordID:
      name: id
      in: path
      required: true
      description: |-
        The record id, unique within its kind. An id carrying `/` (a
        declaration's id is a kind reference) is percent-encoded once:
        `samples.substrate.reamde.dev%2Ftasks%2Ftask`. `incoming` is
        reserved.
      schema:
        type: string
    ifVersion:
      name: ifVersion
      in: query
      required: false
      description: |-
        The version the caller read. The delete applies only if the record
        still holds it; otherwise `409 conflict` and the record stays live.
      schema:
        type: integer
        format: int64
    first:
      name: first
      in: query
      required: false
      description: Page size. Default 50, maximum 500.
      schema:
        type: integer
    after:
      name: after
      in: query
      required: false
      description: The opaque `cursor` a previous page returned. Never parse
        it.
      schema:
        type: string
    actor:
      name: X-Substrate-Actor
      in: header
      required: false
      description: |-
        Attribution for the write: `console`, `substratectl`, or any name
        that is not one of the substrate's own hands. Absent is `api`.
      schema:
        type: string
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |-
        The client's name for this attempt, up to 255 UTF-8 bytes (bytes,
        not characters, so no `maxLength` is declared here; a longer key is
        `422 validation`). A repeat under
        the same key and the same body answers the first attempt's outcome
        with its original status, and the effect runs once; the same key
        with a different body is `409 conflict`. The key binds to the
        repository and the operation, not the token, and answers for 24
        hours.
      schema:
        type: string
    webhookAuthority:
      name: authority
      in: path
      required: true
      description: The repository's authority.
      schema:
        type: string
    webhookTrigger:
      name: trigger
      in: path
      required: true
      description: The webhook trigger record's id.
      schema:
        type: string
    catalogID:
      name: id
      in: path
      required: true
      description: |-
        The catalog entry's id, the package it ships
        (`providers.substrate.reamde.dev/google`), percent-encoded once:
        `providers.substrate.reamde.dev%2Fgoogle`.
      schema:
        type: string
    triggerID:
      name: id
      in: path
      required: true
      description: The trigger record's id.
      schema:
        type: string
    bundleID:
      name: id
      in: path
      required: true
      description: The bundle record's id, its package, percent-encoded once.
      schema:
        type: string
    traitID:
      name: id
      in: path
      required: true
      description: The trait's reference, percent-encoded once, or its bare
        name when unique.
      schema:
        type: string
    callableName:
      name: name
      in: path
      required: true
      description: The function or agent record's id.
      schema:
        type: string
    blobDigest:
      name: digest
      in: path
      required: true
      description: "`blob-sha256-` and the lowercase hex SHA-256 of the bytes."
      schema:
        type: string
    blobName:
      name: name
      in: query
      required: false
      description: A display name for the bytes; a filename, never a path.
      schema:
        type: string
    changeKinds:
      name: kinds
      in: query
      description: Only these kinds. Repeated, or comma-separated.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    changeExcludeKinds:
      name: excludeKinds
      in: query
      description: Not these kinds.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    changeActors:
      name: actors
      in: query
      description: Only these actors.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    changeExcludeActors:
      name: excludeActors
      in: query
      description: Not these actors.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    changeOps:
      name: ops
      in: query
      description: Only these operations.
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: "#/components/schemas/Op"
    changeExcludeOps:
      name: excludeOps
      in: query
      description: Not these operations.
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: "#/components/schemas/Op"
  requestBodies:
    Put:
      required: true
      description: |-
        The flat record: `properties` and the authored key spaces at the top
        level, never an envelope. `title`, `body` and the temporal
        properties live inside `properties`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PutInput"
    BlobBytes:
      required: true
      description: The bytes, as the body. `Content-Type` becomes the manifest's
        media type.
      content:
        "*/*":
          schema:
            type: string
            format: binary
    WebhookBody:
      required: false
      description: |-
        Whatever the sender posts. A `multipart/form-data` body's file parts
        are stored as blobs; any other body rides the delivery whole.
      content:
        "*/*":
          schema:
            type: string
            format: binary
        multipart/form-data:
          schema:
            type: object
            additionalProperties: true
  responses:
    Error:
      description: |-
        A refused request. `code` says which of the thirteen refusals; the
        status follows it: `bad_request` 400, `auth` 401, `guard` and
        `forbidden` 403, `not_found` 404, `conflict` 409, `compacted` 410,
        `validation` 422, `rate_limited` 429, `internal` and
        `function_failed` 500, `unsupported` 501, `unavailable` 503 (always
        with `Retry-After`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: A version precondition failed (`conflict`). Re-read and
        retry.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Validation:
      description: |-
        The body was refused by the kind's declaration (`validation`):
        `problems` and `problemDetails` name each field.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnknownCollection:
      description: No such kind, or no such record (`not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    WrongShape:
      description: |-
        The method addresses the other path shape (`bad_request`); the
        message names the spelling that works.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Compacted:
      description: |-
        The cursor cannot resume (`compacted`): below the horizon, above the
        head, under another generation, or with no generation beside a seq
        above 0. `error.head` and `error.generation` are where to re-list
        from.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Too many attempts (`rate_limited`); `Retry-After` says
        how long.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unavailable:
      description: A transient condition (`unavailable`); retry after `Retry-After`.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    FactorsRequired:
      description: |-
        The body carried no password or code (`forbidden`): a bearer token
        is not evidence for a credential change.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RecordCreated:
      description: The record was created (version 1).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SubstrateRecord"
    RecordWritten:
      description: The record was updated.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SubstrateRecord"
    BlobStored:
      description: The manifest, `Location` naming the read route.
      headers:
        Location:
          description: "`/api/v1/blobs/{digest}`."
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BlobInfo"
    WebhookAccepted:
      description: The request is recorded in the repository's changelog and
        the fire is on its way; a restart resumes it under the same id, and
        `fire` names its run.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebhookAccepted"
  schemas:
    # --- errors ---------------------------------------------------------
    ErrorEnvelope:
      type: object
      description: The one body every refused request answers with.
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorPayload"
    ErrorPayload:
      type: object
      description: |-
        The refusal: a code from the closed set, a message, and for a
        validation refusal the problems as strings and split. `head` and
        `generation` ride a `compacted` refusal only.
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - bad_request
            - validation
            - conflict
            - guard
            - forbidden
            - auth
            - not_found
            - rate_limited
            - compacted
            - internal
            - function_failed
            - unsupported
            - unavailable
        message:
          type: string
        problems:
          type: array
          description: "`path: message` strings."
          items:
            type: string
        problemDetails:
          type: array
          items:
            $ref: "#/components/schemas/ProblemDetail"
        head:
          type: integer
          format: int64
          description: The changelog head to re-list from (`compacted` only).
        generation:
          type: string
          description: The history generation of `head` (`compacted` only).
    ProblemDetail:
      type: object
      description: One validation problem, field-addressable.
      required: [path, message]
      properties:
        path:
          type: string
          description: The input the problem concerns (`props.name`); empty
            when unaddressed.
        message:
          type: string
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    # --- records --------------------------------------------------------
    SubstrateRecord:
      type: object
      description: |-
        One stored record, flat. Everything authored is inside `properties`,
        `title` and `body` and the temporal properties included; the other
        top-level fields are server-set. `propertyMeta` rides single-record
        reads only.
      required: [id, kind, properties, labels, version, createdAt, updatedAt]
      properties:
        id:
          type: string
        kind:
          type: string
          description: The kind reference, `{authority}/{package}/{kind}`.
        canonicalId:
          type: string
          description: Set when the read was addressed by an id a merge discarded.
        formerIds:
          type: array
          items:
            type: string
        properties:
          type: object
          description: |-
            The declared properties, open. A reference is a
            `ReferenceValue`; an attachment (`blobref`) is a `BlobInfo`.
          additionalProperties: true
        labels:
          type: object
          additionalProperties: true
        annotations:
          type: object
          additionalProperties: true
        version:
          type: integer
          format: int64
          description: The edit counter `ifVersion` asserts.
        kindVersion:
          type: integer
          format: int64
          description: The kind declaration version that last wrote the record.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
        finalizers:
          type: array
          items:
            type: string
        propertyMeta:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PropertyMeta"
    ReferenceValue:
      type: object
      description: |-
        A reference property as a read serves it: `ref` is the referent's
        path, `<kind>/<id>`, and any declared link properties sit beside
        it. A write accepts this object or the bare path string.
      required: [ref]
      properties:
        ref:
          type: string
      additionalProperties: true
    PropertyMeta:
      type: object
      description: One property's provenance.
      properties:
        manager:
          type: string
        tier:
          type: string
          enum: [owner, bundle, machine]
        updatedAt:
          type: string
          format: date-time
        alternatives:
          type: array
          items:
            $ref: "#/components/schemas/PropertyAlternative"
    PropertyAlternative:
      type: object
      description: One live mapping source's offer that disagrees with the
        stored value.
      required: [actor, value, updatedAt]
      properties:
        actor:
          type: string
        value: {}
        updatedAt:
          type: string
          format: date-time
    PutInput:
      type: object
      additionalProperties: false
      description: |-
        The put body. `kind` is ignored on REST, the path names it. An `id`
        on a collection `POST` names the record to create or upsert.
      properties:
        kind:
          type: string
        id:
          type: string
        properties:
          type: object
          additionalProperties: true
        labels:
          type: object
          additionalProperties: true
        annotations:
          type: object
          additionalProperties: true
        ifVersion:
          type: integer
          format: int64
    RecordPatch:
      type: object
      additionalProperties: false
      description: The patch body. Maps merge key-wise; a `null` deletes the
        key.
      properties:
        properties:
          type: object
          additionalProperties: true
        labels:
          type: object
          additionalProperties: true
        annotations:
          type: object
          additionalProperties: true
        addFinalizers:
          type: array
          items:
            type: string
        removeFinalizers:
          type: array
          items:
            type: string
        ifVersion:
          type: integer
          format: int64
    RecordFilter:
      type: object
      additionalProperties: false
      description: |-
        The filter document. Every arm narrows. `deleted` absent or false
        lists live records, true lists tombstones.
      properties:
        kinds:
          type: array
          items:
            type: string
        implements:
          type: string
          description: A trait reference; intersects with the kinds in play.
        ids:
          type: array
          items:
            type: string
        properties:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Cond"
        labels:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Cond"
        deleted:
          type: boolean
    Cond:
      type: object
      additionalProperties: false
      description: |-
        One predicate. The operators a property's declared type allows;
        `secret` and `digest` properties refuse filtering, a `reference`
        takes `eq`, `in`, `contains` and `exists` over its path string.
      properties:
        eq: {}
        in:
          type: array
          items: {}
        prefix:
          type: string
        gt: {}
        gte: {}
        lt: {}
        lte: {}
        contains: {}
        exists:
          type: boolean
    Page:
      type: object
      description: |-
        A page of records. `cursor` is absent when the list is exhausted.
        `head` and `generation` are the changelog position the page was read
        at, for the list-to-watch handoff.
      required: [records, head, generation]
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/SubstrateRecord"
        cursor:
          type: string
        head:
          type: integer
          format: int64
        generation:
          type: string
    IncomingPage:
      type: object
      required: [incoming, total]
      properties:
        incoming:
          type: array
          items:
            $ref: "#/components/schemas/IncomingReference"
        cursor:
          type: string
        total:
          type: integer
    IncomingReference:
      type: object
      description: "One reverse pointer: a source record's property naming
        this record."
      required: [property, from]
      properties:
        property:
          type: string
        path:
          type: string
          description: The dotted site inside the property, empty at the top
            level.
        from:
          $ref: "#/components/schemas/IncomingSource"
    IncomingSource:
      type: object
      required: [id, kind]
      properties:
        id:
          type: string
        kind:
          type: string
        title:
          type: string
    KindInfo:
      type: object
      description: One declared kind as the read surfaces project it.
      required: [identity, name, authority, package, version, plural, source,
        description, definition]
      properties:
        identity:
          type: string
        name:
          type: string
        authority:
          type: string
        package:
          type: string
        version:
          type: integer
          format: int64
        plural:
          type: string
          description: Retired; always empty.
        source:
          type: string
          enum: [builtin, published, installed]
        description:
          type: string
        definition:
          type: object
          description: The declaration's authored data map.
          additionalProperties: true
    MergeInput:
      type: object
      additionalProperties: false
      required: [kind, winner, loser]
      properties:
        kind:
          type: string
        winner:
          type: string
        loser:
          type: string
        winnerVersion:
          type: integer
          format: int64
        loserVersion:
          type: integer
          format: int64
    SplitInput:
      type: object
      additionalProperties: false
      required: [merge]
      properties:
        merge:
          type: string
          description: The `recordmerge` record's id.
        ifVersion:
          type: integer
          format: int64
    # --- changes --------------------------------------------------------
    Op:
      type: string
      enum: [put, patch, delete, merge, split, gc]
    Change:
      type: object
      description: |-
        One changelog entry. `affected` is the public event: each record
        the entry moved with the version it reached; a client fetches each
        one to keep a current copy. `payload` is op-specific detail.
      required: [seq, ts, actor, op, recordId, kind]
      properties:
        seq:
          type: integer
          format: int64
        ts:
          type: string
          format: date-time
        actor:
          type: string
        op:
          $ref: "#/components/schemas/Op"
        recordId:
          type: string
        kind:
          type: string
        payload:
          type: object
          additionalProperties: true
        affected:
          type: array
          items:
            $ref: "#/components/schemas/AffectedRecord"
        hash:
          type: string
          description: The entry's checksum, hex; absent on an entry older
            than checksums.
    ChangeRow:
      type: object
      description: A `Change` plus each enabled trigger's stance on it.
      required: [seq, ts, actor, op, recordId, kind]
      properties:
        seq:
          type: integer
          format: int64
        ts:
          type: string
          format: date-time
        actor:
          type: string
        op:
          $ref: "#/components/schemas/Op"
        recordId:
          type: string
        kind:
          type: string
        payload:
          type: object
          additionalProperties: true
        affected:
          type: array
          items:
            $ref: "#/components/schemas/AffectedRecord"
        hash:
          type: string
        triggers:
          type: array
          items:
            $ref: "#/components/schemas/ChangeTrigger"
    ChangePage:
      type: object
      description: One history page, newest first. `cursor` is the next `before`,
        absent when done.
      required: [changes, head, generation]
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/ChangeRow"
        cursor:
          type: integer
          format: int64
        head:
          type: integer
          format: int64
        generation:
          type: string
    ChangeTrigger:
      type: object
      required: [trigger, callable, state]
      properties:
        trigger:
          type: string
        callable:
          type: string
        state:
          type: string
          enum: [pending, processed, parked]
        error:
          type: string
    AffectedRecord:
      type: object
      description: |-
        One record a change moved. `version` is absent on a purge and on an
        entry written before versions were recorded; `deleted` is true when
        the entry tombstoned or purged the record.
      required: [kind, id]
      properties:
        kind:
          type: string
        id:
          type: string
        version:
          type: integer
          format: int64
        deleted:
          type: boolean
    BookmarkFrame:
      type: object
      description: The first line of every change stream and forward read.
      required: [bookmark, generation]
      properties:
        bookmark:
          type: integer
          format: int64
        generation:
          type: string
    ChangeStream:
      type: string
      description: |-
        `application/x-ndjson`, opaque here: one JSON object per line. The
        first is a `BookmarkFrame`; a line with `seq` is a `ChangeRow`; `{}`
        is a heartbeat; an `ErrorEnvelope` ends the stream.
    AgentEventStream:
      type: string
      description: "`application/x-ndjson`, opaque here: one `AgentEvent`
        per line."
    # --- occurrences ----------------------------------------------------
    Occurrence:
      type: object
      required: [kind, id, at]
      properties:
        kind:
          type: string
        id:
          type: string
        title:
          type: string
        at:
          type: string
          format: date-time
        log:
          $ref: "#/components/schemas/OccurrenceLog"
    OccurrenceLog:
      type: object
      required: [kind, id]
      properties:
        kind:
          type: string
        id:
          type: string
        status:
          type: string
    OccurrenceProblem:
      type: object
      required: [kind, id, message]
      properties:
        kind:
          type: string
        id:
          type: string
        message:
          type: string
    OccurrenceList:
      type: object
      required: [occurrences, truncated]
      properties:
        occurrences:
          type: array
          items:
            $ref: "#/components/schemas/Occurrence"
        truncated:
          type: boolean
        problems:
          type: array
          items:
            $ref: "#/components/schemas/OccurrenceProblem"
    # --- operational lists ----------------------------------------------
    OperationalList:
      type: object
      description: |-
        The envelope every operational list answers with. `items` holds the
        whole set today; `cursor` is reserved for keyset pagination.
      required: [items]
      properties:
        items:
          type: array
          items: {}
        cursor:
          type: string
    TokenList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TokenInfo"
        cursor:
          type: string
    CatalogList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CatalogItem"
        cursor:
          type: string
    TriggerStatusList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TriggerStatus"
        cursor:
          type: string
    TriggerFailureList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TriggerFailure"
        cursor:
          type: string
    BundleStatusList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BundleStatus"
        cursor:
          type: string
    KindInfoList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/KindInfo"
        cursor:
          type: string
    ShippedUpgradeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ShippedUpgrade"
        cursor:
          type: string
    # --- auth -----------------------------------------------------------
    RegisterBeginRequest:
      type: object
      additionalProperties: false
      required: [inviteCode, repository]
      properties:
        inviteCode:
          type: string
        repository:
          type: string
          description: The repository to create, which becomes its authority.
    RegisterInput:
      type: object
      additionalProperties: false
      required: [inviteCode, repository, password]
      properties:
        inviteCode:
          type: string
        repository:
          type: string
          description: "The repository to create, which BECOMES its authority
            and is the login name: `ada.example.com`, or a bare label the
            door completes under its own host. Unique and permanent."
        password:
          type: string
        totpSecret:
          description: "The seed `POST /register/enroll` issued. Required
            when discovery reports `registration.totpRequired: true`."
          type: string
        totpCode:
          description: "Required when discovery reports `registration.totpRequired:
            true`; a deployment with the second factor switched off takes
            the password alone."
          type: string
        label:
          type: string
          description: The first token's label.
        recoveryPublicKey:
          type: string
          description: A client-generated age recipient; absent asks the server
            to mint the pair.
    RegisterResult:
      type: object
      required: [token, secret]
      properties:
        token:
          $ref: "#/components/schemas/TokenInfo"
        secret:
          type: string
          description: The token secret, shown this once.
        repository:
          type: string
          description: The repository that was created, its authority.
        recoveryKey:
          type: string
          description: The age identity, only when the server minted the pair.
            Shown once.
        recoveryPublicKey:
          type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required: [repository, password]
      properties:
        repository:
          type: string
          description: "The repository to log in to: its authority, or a bare
            label the door completes under its own host."
        password:
          type: string
        totpCode:
          description: "Required when discovery reports `registration.totpRequired:
            true`; a deployment with the second factor switched off takes
            the password alone."
          type: string
        label:
          type: string
    PasswordRequest:
      type: object
      additionalProperties: false
      required: [repository, password, newPassword]
      properties:
        repository:
          type: string
        password:
          type: string
        totpCode:
          description: "Required when discovery reports `registration.totpRequired:
            true`; a deployment with the second factor switched off takes
            the password alone."
          type: string
        newPassword:
          type: string
    TOTPBeginRequest:
      type: object
      additionalProperties: false
      required: [repository, password]
      properties:
        repository:
          type: string
        password:
          type: string
        totpCode:
          description: "Required when discovery reports `registration.totpRequired:
            true`; a deployment with the second factor switched off takes
            the password alone."
          type: string
    TOTPRequest:
      type: object
      additionalProperties: false
      required: [repository, password, newTotpSecret, newTotpCode]
      properties:
        repository:
          type: string
        password:
          type: string
        totpCode:
          description: "Required when discovery reports `registration.totpRequired:
            true`; a deployment with the second factor switched off takes
            the password alone."
          type: string
        newTotpSecret:
          type: string
        newTotpCode:
          type: string
    TOTPEnrollment:
      type: object
      required: [totpSecret, otpauthUri]
      properties:
        totpSecret:
          type: string
          description: The base32 seed.
        otpauthUri:
          type: string
          description: The `otpauth://` URI a password manager imports.
    SessionCredential:
      type: object
      required: [repository]
      properties:
        repository:
          type: string
    RecoveryEnrollRequest:
      type: object
      additionalProperties: false
      required: [repository, password]
      properties:
        repository:
          type: string
        password:
          type: string
        totpCode:
          description: "Required when discovery reports `registration.totpRequired:
            true`; a deployment with the second factor switched off takes
            the password alone."
          type: string
        recoveryPublicKey:
          type: string
    RecoveryEnrollResponse:
      type: object
      required: [recoveryPublicKey]
      properties:
        recoveryKey:
          type: string
        recoveryPublicKey:
          type: string
    MintRequest:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          description: Default `token`.
        expiresAt:
          type: string
          format: date-time
          description: Server-enforced; absent means the token lives until
            deleted.
    TokenInfo:
      type: object
      description: A token record's metadata; never the secret.
      required: [id, label, createdAt]
      properties:
        id:
          type: string
        label:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    MintedToken:
      type: object
      required: [token, secret]
      properties:
        token:
          $ref: "#/components/schemas/TokenInfo"
        secret:
          type: string
          description: Shown this once.
        repository:
          type: string
          description: "The repository the token opens, as the door resolved
            it. Login and registration echo it; a `POST /tokens` mint omits
            it."
    # --- discovery ------------------------------------------------------
    Discovery:
      type: object
      required: [versions, server, vocabulary, changelog, features, surfaces,
        grammar, endpoints, registration]
      properties:
        versions:
          type: array
          items:
            $ref: "#/components/schemas/APIVersionInfo"
        server:
          $ref: "#/components/schemas/ServerInfo"
        vocabulary:
          $ref: "#/components/schemas/VocabularyInfo"
        changelog:
          $ref: "#/components/schemas/ChangelogInfo"
        features:
          type: array
          items:
            $ref: "#/components/schemas/FeatureInfo"
        surfaces:
          $ref: "#/components/schemas/SurfacesInfo"
        grammar:
          $ref: "#/components/schemas/GrammarInfo"
        endpoints:
          $ref: "#/components/schemas/EndpointsInfo"
        registration:
          $ref: "#/components/schemas/RegistrationInfo"
    APIVersionInfo:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [served, deprecated]
        replacedBy:
          type: string
    ServerInfo:
      type: object
      required: [version]
      properties:
        version:
          type: string
        build:
          type: string
    VocabularyInfo:
      type: object
      required: [maxDialect, note]
      properties:
        maxDialect:
          type: integer
        note:
          type: string
    ChangelogInfo:
      type: object
      required: [horizon, maxDialect]
      properties:
        horizon:
          type: integer
          format: int64
          description: The oldest resumable seq.
        maxDialect:
          type: integer
    FeatureInfo:
      type: object
      required: [name, stability, surfaces]
      properties:
        name:
          type: string
        stability:
          type: string
          enum: [alpha, beta, stable]
        surfaces:
          type: array
          items:
            type: string
            enum: [rest, graphql]
    SurfacesInfo:
      type: object
      required: [rest, graphql]
      properties:
        rest:
          $ref: "#/components/schemas/SurfaceInfo"
        graphql:
          $ref: "#/components/schemas/SurfaceInfo"
    SurfaceInfo:
      type: object
      required: [endpoint, compatibility]
      properties:
        endpoint:
          type: string
        compatibility:
          type: string
          enum: [supported, preview]
    GrammarInfo:
      type: object
      required: [kind, record, collection, actors]
      properties:
        kind:
          type: string
        record:
          type: string
        collection:
          type: string
        actors:
          type: array
          items:
            type: string
    EndpointsInfo:
      type: object
      required: [register, login, tokens, password, totp]
      properties:
        register:
          type: string
        login:
          type: string
        tokens:
          type: string
        password:
          type: string
        totp:
          type: string
    RegistrationInfo:
      type: object
      required: [open, totpRequired]
      properties:
        open:
          type: boolean
        totpRequired:
          type: boolean
    # --- vocabulary -----------------------------------------------------
    VocabularyApplyRequest:
      type: object
      additionalProperties: false
      required: [documents]
      properties:
        documents:
          type: array
          description: Declaration documents, each the four-key envelope.
          items:
            type: object
            additionalProperties: true
        confirm:
          $ref: "#/components/schemas/ConversionConfirm"
        origin:
          type: string
          description: The shipped bundle id this batch is a hand-rehomed
            copy of (`substratectl apply --as`). The server stamps it on the
            landed package row as the import door stamps its own; the batch
            must carry that package's document. Over a copy edited since its
            stamp the apply replaces the edits and needs `confirm`.
    VocabularyApplyResponse:
      type: object
      required: [records]
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/SubstrateRecord"
    VocabularyPlanRequest:
      type: object
      additionalProperties: false
      required: [documents]
      properties:
        documents:
          type: array
          description: The declaration documents the apply would take.
          items:
            type: object
            additionalProperties: true
        origin:
          type: string
          description: The origin the apply would claim, so the preview says
            whether it replaces an edited copy and hashes as the apply will.
    VocabularyPlan:
      type: object
      description: "The preview of one apply: the guard lines it would refuse
        on and the conversion plan it would run (a `ConversionPlan`, flattened)."
      required: [work, lossy]
      properties:
        blockers:
          type: array
          items:
            type: string
        discardsEdits:
          type: boolean
          description: The change replaces a copy edited since its origin
            stamp, so the edits go with it. Like `lossy`, it runs only with
            a `ConversionConfirm` naming this preview.
        steps:
          type: array
          items:
            $ref: "#/components/schemas/ConversionStep"
        work:
          type: integer
          format: int64
        lossy:
          type: boolean
        planHash:
          type: string
        changelogSeq:
          type: integer
          format: int64
    ConversionPlan:
      type: object
      description: The record rewrites a declaration change performs, counted
        against the live records. Counts only, never record ids.
      required: [work, lossy]
      properties:
        steps:
          type: array
          description: Each rewrite touching at least one live record, in
            kind then step order.
          items:
            $ref: "#/components/schemas/ConversionStep"
        work:
          type: integer
          format: int64
          description: The sum of the steps' record counts, an upper bound
            on the changelog entries the transaction appends. Refused above
            the deployment's ceiling (`SUBSTRATE_CONVERSION_CEILING`, 10000
            records by default).
        lossy:
          type: boolean
          description: The plan removes values from the fold (a `null` step,
            or a remap onto a value some live record already holds) and runs
            only with a `ConversionConfirm` naming it. The old values stay
            in the changelog.
        planHash:
          type: string
          description: A hash over the steps and their counts. Absent when
            nothing was planned.
        changelogSeq:
          type: integer
          format: int64
          description: The changelog head the plan was counted at.
    ConversionStep:
      type: object
      required: [step, kind, property, records]
      properties:
        step:
          type: string
          enum: [rename, backfill, remap, "null"]
        kind:
          type: string
        property:
          type: string
          description: The property written, under its candidate name.
        from:
          type: string
          description: A rename's old property name, or a remap's old value.
        to:
          type: string
          description: A rename's new property name, or a remap's new value.
        records:
          type: integer
          format: int64
        lossy:
          type: boolean
    ConversionConfirm:
      type: object
      additionalProperties: false
      description: Consent to a lossy plan, bound to its preview. Refused
        when the changelog head is no longer `changelogSeq` (`conflict`) or
        the recounted plan's hash is not `planHash` (`lossy`).
      required: [planHash, changelogSeq]
      properties:
        planHash:
          type: string
        changelogSeq:
          type: integer
          format: int64
    ShippedUpgrade:
      type: object
      required: [package, upgrade]
      properties:
        package:
          type: string
        upgrade:
          $ref: "#/components/schemas/BundleUpgrade"
    # --- catalog and bundles --------------------------------------------
    CatalogBundle:
      type: object
      description: "One shipped bundle: the closure's identity and what taking
        it lands."
      required: [id, name, authority, package, description, version, tier,
        closure]
      properties:
        id:
          type: string
        name:
          type: string
        authority:
          type: string
        package:
          type: string
        description:
          type: string
        version:
          type: integer
          format: int64
        tier:
          type: string
          enum: [provider, sample]
        inputs:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CatalogInput"
        requires:
          type: array
          items:
            type: string
        requiresAtLeast:
          type: object
          description: The least version of a required package this closure
            declares against, by package identity. Admission refuses while
            the repository holds the package below it.
          additionalProperties:
            type: integer
            format: int64
        suggestedMappings:
          type: array
          items:
            $ref: "#/components/schemas/SuggestedMapping"
        origin:
          type: string
        originVersion:
          type: integer
          format: int64
        modified:
          type: boolean
        closure:
          $ref: "#/components/schemas/BundleClosure"
    CatalogItem:
      type: object
      description: A `CatalogBundle` plus whether this repository holds it
        and the upgrade preview.
      required: [id, name, authority, package, description, version, tier,
        closure, installed]
      properties:
        id:
          type: string
        name:
          type: string
        authority:
          type: string
        package:
          type: string
        description:
          type: string
        version:
          type: integer
          format: int64
        tier:
          type: string
          enum: [provider, sample]
        inputs:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CatalogInput"
        requires:
          type: array
          items:
            type: string
        requiresAtLeast:
          type: object
          description: The least version of a required package this closure
            declares against, by package identity. Admission refuses while
            the repository holds the package below it.
          additionalProperties:
            type: integer
            format: int64
        suggestedMappings:
          type: array
          items:
            $ref: "#/components/schemas/SuggestedMapping"
        origin:
          type: string
        originVersion:
          type: integer
          format: int64
        modified:
          type: boolean
        closure:
          $ref: "#/components/schemas/BundleClosure"
        installed:
          type: boolean
        upgrade:
          $ref: "#/components/schemas/BundleUpgrade"
    CatalogInput:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
        inject:
          type: string
        description:
          type: string
    BundleClosure:
      type: object
      required: [kinds, functions, agents, mappings, records]
      properties:
        kinds:
          type: array
          items:
            type: string
        kindDescriptions:
          type: object
          additionalProperties:
            type: string
        functions:
          type: array
          items:
            type: string
        agents:
          type: array
          items:
            type: string
        mappings:
          type: array
          items:
            type: string
        records:
          type: array
          items:
            $ref: "#/components/schemas/ShippedRecord"
    ShippedRecord:
      type: object
      required: [kind, id]
      properties:
        kind:
          type: string
        id:
          type: string
    SuggestedMapping:
      type: object
      required: [id, from, to, package, state]
      properties:
        id:
          type: string
        from:
          type: string
        to:
          type: string
        package:
          type: string
        state:
          type: string
          enum: [landed, ready, waiting, blocked]
        problems:
          type: array
          items:
            type: string
    BundleUpgrade:
      type: object
      description: "The upgrade preview: the version motion, the guard lines
        the install would refuse on, and the conversion plan it would run
        (a `ConversionPlan`, flattened)."
      required: [available, work, lossy]
      properties:
        available:
          type: boolean
        from:
          type: integer
          format: int64
        to:
          type: integer
          format: int64
        changes:
          type: array
          items:
            $ref: "#/components/schemas/BundleUpgradeChange"
        blockers:
          type: array
          items:
            type: string
        discardsEdits:
          type: boolean
          description: The change replaces a copy edited since its origin
            stamp, so the edits go with it. Like `lossy`, it runs only with
            a `ConversionConfirm` naming this preview.
        steps:
          type: array
          items:
            $ref: "#/components/schemas/ConversionStep"
        work:
          type: integer
          format: int64
        lossy:
          type: boolean
        planHash:
          type: string
        changelogSeq:
          type: integer
          format: int64
        renames:
          type: array
          deprecated: true
          description: The `rename` steps in the shape this field had before
            `steps` existed, derived from them. Read `steps`.
          items:
            $ref: "#/components/schemas/BundleUpgradeRename"
    BundleUpgradeRename:
      type: object
      deprecated: true
      description: "One property the upgrade moves live values for, and how
        many records carry the old name. A `ConversionStep` whose `step` is
        `rename` says the same."
      required: [kind, from, to, records]
      properties:
        kind:
          type: string
        from:
          type: string
        to:
          type: string
        records:
          type: integer
          format: int64
    CatalogTakeRequest:
      type: object
      additionalProperties: false
      description: The optional body of install and import.
      properties:
        confirm:
          $ref: "#/components/schemas/ConversionConfirm"
    BundleUpgradeChange:
      type: object
      required: [kind, id]
      properties:
        kind:
          type: string
        id:
          type: string
        from:
          type: integer
          format: int64
        to:
          type: integer
          format: int64
    BundleStatus:
      type: object
      description: One installed bundle's runtime state, computed on read.
      required: [id, name, authority, package, installed, enabled, accounts,
        functions, kinds, liveRecords]
      properties:
        id:
          type: string
        name:
          type: string
        authority:
          type: string
        package:
          type: string
        installed:
          type: boolean
        enabled:
          type: boolean
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/InputStatus"
        setup:
          type: array
          items:
            $ref: "#/components/schemas/SetupItem"
        accounts:
          type: integer
        functions:
          type: integer
        kinds:
          type: integer
        liveRecords:
          type: integer
          format: int64
        quarantined:
          type: boolean
        quarantineReason:
          type: string
        version:
          type: integer
          format: int64
          description: The owned package's stored version, what a closure's
            `requiresAtLeast` is compared against.
        origin:
          type: string
        originVersion:
          type: integer
          format: int64
        modified:
          type: boolean
    BundleTaken:
      type: object
      description: A `BundleStatus` plus the state of each suggested mapping
        the closure carried.
      required: [id, name, authority, package, installed, enabled, accounts,
        functions, kinds, liveRecords]
      properties:
        id:
          type: string
        name:
          type: string
        authority:
          type: string
        package:
          type: string
        installed:
          type: boolean
        enabled:
          type: boolean
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/InputStatus"
        setup:
          type: array
          items:
            $ref: "#/components/schemas/SetupItem"
        accounts:
          type: integer
        functions:
          type: integer
        kinds:
          type: integer
        liveRecords:
          type: integer
          format: int64
        quarantined:
          type: boolean
        quarantineReason:
          type: string
        version:
          type: integer
          format: int64
          description: The owned package's stored version, what a closure's
            `requiresAtLeast` is compared against.
        origin:
          type: string
        originVersion:
          type: integer
          format: int64
        modified:
          type: boolean
        suggestedMappings:
          type: array
          items:
            $ref: "#/components/schemas/SuggestedMapping"
    InputStatus:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
        kind:
          type: string
        description:
          type: string
        record:
          type: string
        via:
          type: string
          enum: [bound, default, sole]
    SetupItem:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [missing, ambiguous, dangling, oauth-client, provider]
        input:
          type: string
        kind:
          type: string
        record:
          type: string
        message:
          type: string
    BundleUninstalled:
      type: object
      required: [uninstalled]
      properties:
        uninstalled:
          type: boolean
    BundlePurged:
      type: object
      required: [purged]
      properties:
        purged:
          type: integer
    BindRequest:
      type: object
      additionalProperties: false
      required: [input]
      properties:
        input:
          type: string
          description: The declared input's name.
        record:
          type: string
          description: The record id to bind; absent or empty clears the choice.
    OAuthStartRequest:
      type: object
      additionalProperties: false
      required: [record]
      properties:
        record:
          type: string
          description: The account record's id.
    OAuthStarted:
      type: object
      required: [url]
      properties:
        url:
          type: string
    # --- triggers and callables -----------------------------------------
    TriggerStatus:
      type: object
      required: [id, kind, callable, enabled, head, parked, pending]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [record, schedule, webhook]
        callable:
          type: string
        enabled:
          type: boolean
        cursor:
          type: integer
          format: int64
        head:
          type: integer
          format: int64
        lag:
          type: integer
          format: int64
        lastFire:
          type: string
          format: date-time
        webhookPath:
          type: string
        parked:
          type: integer
          format: int64
        pending:
          type: integer
          format: int64
          description: Accepted webhook requests whose fire has not settled.
        error:
          type: string
    TriggerFailure:
      type: object
      required: [id, trigger, attempts, lastError, parkedAt]
      properties:
        id:
          type: integer
          format: int64
        trigger:
          type: string
        seq:
          type: integer
          format: int64
        fireId:
          type: string
        recordId:
          type: string
        attempts:
          type: integer
        lastError:
          type: string
        parkedAt:
          type: string
          format: date-time
    ReplayRequest:
      type: object
      additionalProperties: false
      properties:
        from:
          description: The seq to reset the cursor to; absent is 0, the start
            of the changelog.
          type: integer
          format: int64
    RunRequest:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind:
          type: string
        id:
          type: string
    TriggerReplayed:
      type: object
      required: [from]
      properties:
        from:
          type: integer
          format: int64
    TriggerRan:
      type: object
      required: [ran]
      properties:
        ran:
          type: integer
    CallRequest:
      type: object
      additionalProperties: false
      properties:
        input:
          description: The function's input; absent is null.
    FunctionCalled:
      type: object
      required: [output, effects]
      properties:
        output: {}
        effects:
          type: integer
    ChatRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        thread:
          type: string
          description: Continue this thread; absent opens one.
        message:
          type: string
    AgentResult:
      type: object
      required: [reply, thread, status, effects, turns, toolCalls, promptTokens,
        completionTokens, totalTokens, costUSD]
      properties:
        reply:
          type: string
        thread:
          type: string
        status:
          type: string
          enum: [ok, overbudget, error]
        reason:
          type: string
        effects:
          type: integer
        effectsByAction:
          type: object
          additionalProperties:
            type: integer
        turns:
          type: integer
        toolCalls:
          type: integer
        promptTokens:
          type: integer
        completionTokens:
          type: integer
        totalTokens:
          type: integer
        costUSD:
          type: number
    AgentEvent:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [thread, delta, toolStarted, toolFinished, done, error]
        thread:
          type: string
        text:
          type: string
        id:
          type: string
        tool:
          type: string
        args:
          type: string
        ok:
          type: boolean
        output:
          type: string
        result:
          $ref: "#/components/schemas/AgentResult"
        error:
          type: string
    WebhookAccepted:
      type: object
      required: [fire]
      properties:
        fire:
          type: string
    # --- blobs and embeddings -------------------------------------------
    BlobInfo:
      type: object
      description: |-
        A blob's manifest, and the shape a `blobref` property resolves to
        on a read. A write accepts this object and uses only `digest`.
      required: [digest, size, status]
      properties:
        digest:
          type: string
        size:
          type: integer
          format: int64
        name:
          type: string
        mediaType:
          type: string
        status:
          type: string
          enum: [pending, stored, failed]
    ReembedRequest:
      type: object
      additionalProperties: false
      properties:
        all:
          type: boolean
    ReembedReport:
      type: object
      required: [provider, model, enqueued, all]
      properties:
        provider:
          type: string
        model:
          type: string
        enqueued:
          type: integer
        all:
          type: boolean
    # --- graphql --------------------------------------------------------
    GraphQLRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query:
          type: string
        variables:
          type: object
          additionalProperties: true
        operationName:
          type: string
        extensions:
          type: object
          additionalProperties: true
    GraphQLResponse:
      type: object
      required: [data]
      properties:
        data: {}
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
        extensions:
          type: object
          additionalProperties: true
