# A SUGGESTED MAPPING: a Linear issue onto this package's task.
#
# A mapping onto a kind is declared by the package that owns that kind
# (docs/decisions/0049), so the issue → task projection lives here, in the
# package that owns `task`, and the linear provider ships `issue` with an empty
# `task` slot instead. The import DROPS this document (and its `installs:`
# entry) while providers.substrate.reamde.dev/linear is absent, and lands it on
# the next import once the provider is installed.
#
# match probes the issue's Linear URL against tasks' `url`: exactly one live
# match adopts the task the owner already has, zero-or-many mints one. map
# gives Linear the heading and the link and NOTHING else: `status` is the
# owner's, and the projection's tiers are what keep it: a mapped property
# recomputes at the machine tier and an owner write wins, so moving a task to
# `done` here is never clobbered by the next sync.
kind: substrate.reamde.dev/core/recordmapping
metadata:
  id: samples.substrate.reamde.dev/tasks/linearissuetask
data:
  authority: samples.substrate.reamde.dev
  package: tasks
  description: >-
    Projects an assigned Linear issue onto a task, matched on the issue's
    URL, carrying the heading and the link and leaving the status to the owner.
  from: providers.substrate.reamde.dev/linear/issue
  to: samples.substrate.reamde.dev/tasks/task
  property: task
  match:
    - from: url
      to: url
  map:
    name:
      path: title
    url:
      path: url
