# The shipped vocabulary, subsystem 4: what is owed. Shipped, but not SEEDED —
# a SAMPLE BUNDLE a repository imports (the bundle document is at the foot
# of this file). Small on purpose — a task, the thing it groups under, and
# the log that marks a recurring task's occurrences off.
#
# `source` is an unpinned reference for the usual reason: a task can come from
# a message, a mail, an event or a transcript, and naming each would make
# this package depend on every other one.
#
# no new actors: the doors and the substrate ship with core; an installed
# package's writes arrive under the actor of whatever runs — a bundle function
# writes as `function:<authority>:<package>:<name>` — so nothing here declares
# an actor.
kind: substrate.reamde.dev/core/package
metadata:
  id: samples.substrate.reamde.dev/tasks
data:
  authority: samples.substrate.reamde.dev
  package: tasks
  version: 8
---
# ---- the bundle document: the import unit -------------------------------------
# A SAMPLE bundle (see samples.substrate.reamde.dev/people): kinds and one
# suggested mapping, imported from the registry rather than seeded. The
# assignee reference lands on person, so it requires that package to be
# present first.
#
# The suggested mapping's `from` is a linear mirror, so the import keeps it
# only where this repository holds that provider and drops the document AND
# this entry otherwise: `installs:` is the package, both directions, so the
# two are pruned together (internal/catalog).
kind: substrate.reamde.dev/core/bundle
metadata:
  id: samples.substrate.reamde.dev/tasks
data:
  authority: samples.substrate.reamde.dev
  package: tasks
  description: >-
    Tasks and the projects they sit under — what is owed, with priority, an
    optional repeat rule marked off by tasklogs, and the unpinned `source`
    reference back to whatever asked for it.
  requires:
    - samples.substrate.reamde.dev/people
    - samples.substrate.reamde.dev/scheduling
  requiresAtLeast:
    samples.substrate.reamde.dev/people: 4
    samples.substrate.reamde.dev/scheduling: 2
  installs:
    - samples.substrate.reamde.dev/tasks/project
    - samples.substrate.reamde.dev/tasks/task
    - samples.substrate.reamde.dev/tasks/tasklog
    - samples.substrate.reamde.dev/tasks/linearissuetask
