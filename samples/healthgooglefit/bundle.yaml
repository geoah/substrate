# The Google Fit adapter: turns the googlefit provider's mirror rows into the
# health sample's observed values. A SAMPLE the repository imports and owns;
# it declares no kind of its own, only the function that writes and the
# trigger that runs it.
#
#   googlefit/dataset (one data source, one UTC day)  ->  hourly traces, or
#                                                         one observation per
#                                                         reading
#   googlefit/session (a workout or a night)          ->  health/workout, or
#                                                         health/sleep plus one
#                                                         coded amount per
#                                                         sleep segment
#
# Every output names the mirror row it came from (`origin` on an observation,
# a sleep and a workout, `origins` on a trace), and each delivery rebuilds
# that row's whole output set: what it no longer implies is deleted, so a
# re-read day, an emptied day and a deleted session all converge.
kind: substrate.reamde.dev/core/package
metadata:
  id: samples.substrate.reamde.dev/healthgooglefit
data:
  authority: samples.substrate.reamde.dev
  package: healthgooglefit
  version: 1
---
kind: substrate.reamde.dev/core/bundle
metadata:
  id: samples.substrate.reamde.dev/healthgooglefit
data:
  authority: samples.substrate.reamde.dev
  package: healthgooglefit
  description: >-
    Turns your Google Fit data into health observations: heart rate and step
    traces, weigh-ins, workouts and nights of sleep. Needs the health sample
    and the Google Fit provider.
  requires:
    - samples.substrate.reamde.dev/observations
    - samples.substrate.reamde.dev/health
    - providers.substrate.reamde.dev/googlefit
  requiresAtLeast:
    samples.substrate.reamde.dev/observations: 1
    samples.substrate.reamde.dev/health: 1
    providers.substrate.reamde.dev/googlefit: 1
  installs:
    - samples.substrate.reamde.dev/healthgooglefit/adaptgooglefit
---
kind: substrate.reamde.dev/core/function
metadata:
  id: samples.substrate.reamde.dev/healthgooglefit/adaptgooglefit
data:
  authority: samples.substrate.reamde.dev
  package: healthgooglefit
  description: >-
    Rebuild the health observations one Google Fit mirror row implies: a dataset
    day becomes hourly heart rate, step and energy traces or one observation
    per weigh-in, blood pressure, oxygen or glucose reading; a session becomes
    a workout, or a night of sleep with one coded amount per stage segment.
    Deletes what the row no longer implies. Runs on the healthgooglefit-on-mirror
    trigger.
  runtime: python
  timeout: PT60S
  returns:
    - name: written
      type: int
      description: how many observed records the delivery wrote or rewrote
    - name: unchanged
      type: int
      description: how many already held what the row implies
    - name: deleted
      type: int
      description: how many earlier outputs it deleted
    - name: skipped
      type: int
      description: how many points or segments it could not map
    - name: note
      type: string
      description: why a row was passed over, when it was
  permissions:
    reads:
      kinds:
        - providers.substrate.reamde.dev/googlefit/account
        - providers.substrate.reamde.dev/googlefit/datasource
        - providers.substrate.reamde.dev/googlefit/dataset
        - providers.substrate.reamde.dev/googlefit/session
        - samples.substrate.reamde.dev/observations/observation
        - samples.substrate.reamde.dev/observations/trace
        - samples.substrate.reamde.dev/health/sleep
        - samples.substrate.reamde.dev/health/workout
      budgets:
        calls: 200
        rows: 5000
    writes:
      - samples.substrate.reamde.dev/observations/observation
      - samples.substrate.reamde.dev/observations/trace
      - samples.substrate.reamde.dev/observations/source
      - samples.substrate.reamde.dev/health/sleep
      - samples.substrate.reamde.dev/health/workout
  source: |
    # /// script
    # requires-python = ">=3.11"
    # dependencies = [
    #   "tzdata==2025.2",
    # ]
    # ///
    """Google Fit mirror rows into observed values.

    Fit stores no UTC offset on any point or session. Each value's offset comes
    from the account's owner-set `timezone`, read when the value is written,
    and an observation names that zone in a qualifier (`utcOffsetRule`:
    `timezone:<name>`). An account that names no zone gives no offset, so
    nothing is written for one (the observed index marks such a value
    offsetless) rather than a guessed UTC. The zone is the account's current
    one: a value written after the owner moves takes the new zone, and a
    replay rewrites every past value with it.

    A data type is written from ONE derived stream (MAPPINGS): Google keeps
    several views of the same quantity (estimated_steps and merge_step_deltas
    count the same steps), and writing two would count everything twice. A
    stream or a data type with no catalogue metric is passed over and counted.
    """
    import datetime as _dt
    import hashlib
    import re as _re
    import zoneinfo
    from collections import Counter
    from decimal import Decimal

    # The zone database is the tzdata package's: the sandbox does not promise
    # the host's own files are readable.
    zoneinfo.reset_tzpath(to=[])

    # This code's own version, stamped on every output apart from Fit's
    # `revision` (decision record 0162). Raise it with any change to what a
    # mirror row becomes, then replay `healthgooglefit-on-mirror` from 0:
    # every output is rewritten at the revision it already holds.
    ADAPTER = "healthgooglefit@2"

    HOME = "samples.substrate.reamde.dev"
    OBSERVATION = HOME + "/observations/observation"
    TRACE = HOME + "/observations/trace"
    SOURCE = HOME + "/observations/source"
    METRIC = HOME + "/observations/metric"
    SLEEP = HOME + "/health/sleep"
    WORKOUT = HOME + "/health/workout"

    FIT = "providers.substrate.reamde.dev/googlefit"
    ACCOUNT = FIT + "/account"
    DATASOURCE = FIT + "/datasource"
    DATASET = FIT + "/dataset"
    SESSION = FIT + "/session"

    UTC = _dt.timezone.utc
    PERIOD = "PT1H"
    NS = 10**9
    HOUR_NS = 3600 * NS
    SLEEP_ACTIVITY = 72
    SLEEP_TYPE = "com.google.sleep.segment"
    OFFSET_RULE = "utcOffsetRule"

    # data type -> the derived streams read, the catalogue metric, its form,
    # unit and hold (samples/health/metrics.yaml: a gauge with no hold stands
    # until its stream's next point), Fit's own unit, and how the points are
    # stored.
    MAPPINGS = {
        "com.google.heart_rate.bpm": {
            "streams": ("merge_heart_rate_bpm",), "metric": "heart_rate",
            "form": "gauge", "unit": "/min", "fitUnit": "/min", "hold": "PT4M",
            "shape": "trace"},
        "com.google.step_count.delta": {
            "streams": ("estimated_steps",), "metric": "steps", "form": "amount",
            "unit": "{steps}", "fitUnit": "{steps}", "shape": "trace"},
        "com.google.calories.expended": {
            "streams": ("merge_calories_expended",), "metric": "energy_expended",
            "form": "amount", "unit": "kcal", "fitUnit": "kcal", "shape": "trace"},
        "com.google.weight": {
            "streams": ("merge_weight",), "metric": "body_mass", "form": "gauge",
            "unit": "kg", "fitUnit": "kg", "hold": "P1D", "shape": "single"},
        "com.google.height": {
            "streams": ("merge_height",), "metric": "height", "form": "gauge",
            "unit": "m", "fitUnit": "m", "shape": "single"},
        "com.google.body.fat.percentage": {
            "streams": ("merged",), "metric": "body_fat_fraction", "form": "gauge",
            "unit": "%", "fitUnit": "%", "hold": "P1D", "shape": "single"},
        "com.google.oxygen_saturation": {
            "streams": ("merged",), "metric": "spo2", "form": "gauge",
            "unit": "%", "fitUnit": "%", "hold": "PT20M", "shape": "single"},
        "com.google.blood_glucose": {
            "streams": ("merged",), "metric": "blood_glucose", "form": "gauge",
            "unit": "mmol/L", "fitUnit": "mmol/L", "hold": "PT15M", "shape": "single"},
        "com.google.blood_pressure": {
            "streams": ("merged",), "form": "gauge", "unit": "mm[Hg]",
            "fitUnit": "mm[Hg]", "hold": "PT0S", "shape": "pressure"},
        SLEEP_TYPE: {"streams": ("merged",), "shape": "sleep"},
    }
    PRESSURE = ("systolic_blood_pressure", "diastolic_blood_pressure")

    # Fit's sleep segment codes onto health/sleep_stage's code set. 2 is sleep
    # with no stage, the set's `asleep`. 3 (out of bed) and 0 (unspecified)
    # are no stage of the set and are skipped and counted.
    STAGES = {1: "awake", 2: "asleep", 4: "light", 5: "deep", 6: "rem"}
    OUT_OF_BED = 3
    ASLEEP = (2, 4, 5, 6)
    # Fit sends no nap flag: a sleep session shorter than this that begins
    # between NAP_HOURS on the account's clock is a nap.
    NAP_LONGEST = 3 * 3600 * NS
    NAP_HOURS = (9, 21)
    # Fit's activity codes onto the workout kind's code set. A code not here
    # is `other`; the code itself stays in `sportSource`.
    SPORTS = {1: "cycling", 14: "cycling", 15: "cycling", 16: "cycling", 17: "cycling",
              18: "cycling", 19: "cycling", 7: "walking", 93: "walking", 94: "walking",
              95: "walking", 116: "walking", 8: "running", 56: "running", 57: "running",
              58: "running", 35: "hiking", 82: "swimming", 83: "swimming", 84: "swimming",
              80: "strength", 97: "strength", 41: "strength", 100: "yoga", 49: "pilates",
              53: "rowing", 54: "rowing", 25: "elliptical", 77: "stairs", 78: "stairs",
              114: "hiit", 115: "hiit", 24: "dance", 101: "dance", 20: "boxing",
              42: "boxing", 52: "climbing", 87: "tennis", 32: "golf", 65: "skiing",
              66: "skiing", 67: "skiing"}
    # The datasource row's device type onto the source kind's class; a phone
    # and the rest have no class there.
    CLASSES = {"watch": "watch", "scale": "scale"}

    # A device uid a source slug keeps as written. Any other uid is digested,
    # so two uids that differ only in case or punctuation stay two devices.
    _UID = _re.compile(r"[a-z0-9]{1,32}")

    KEYS = {
        OBSERVATION: ("metric", "source", "form", "value", "code", "hold", "at",
                      "endsAt", "utcOffset", "origin", "derivedFrom", "revision", "adapter",
                      "qualifiers", "components", "recordingMethod"),
        TRACE: ("metric", "source", "form", "unit", "hold", "at", "endsAt",
                "utcOffsetStart", "utcOffsetEnd", "every", "offsets", "values",
                "codes", "origins", "revision", "adapter"),
        SLEEP: ("source", "origin", "revision", "adapter", "at", "endsAt", "utcOffsetStart",
                "utcOffsetEnd", "isNap", "timeInBed", "timeAsleep", "awake", "light", "deep",
                "rem", "efficiency"),
        WORKOUT: ("sport", "sportSource", "source", "origin", "revision", "adapter", "at",
                  "endsAt", "utcOffsetStart", "utcOffsetEnd", "duration"),
    }


    # --------------------------------------------------------------- plumbing

    def _path(value):
        """A reference value's record path, in either stored shape."""
        return str((value.get("ref") if isinstance(value, dict) else value) or "")


    def _ref_id(value, kind):
        """A reference value's record id, when it points at `kind`."""
        path, prefix = _path(value), kind + "/"
        return path[len(prefix):] if path.startswith(prefix) else ""


    def _ref(kind, rid):
        return {"ref": kind + "/" + rid}


    def _int(value):
        if value in (None, "") or isinstance(value, bool):
            return None
        try:
            return int(Decimal(str(value)))
        except (ArithmeticError, ValueError):
            return None


    def _ns_time(ns):
        sec, rest = divmod(int(ns), NS)
        return _dt.datetime.fromtimestamp(sec, UTC) + _dt.timedelta(microseconds=rest // 1000)


    def _parse(value):
        if not value:
            return None
        t = _dt.datetime.fromisoformat(str(value).replace("Z", "+00:00"))
        return t if t.tzinfo else t.replace(tzinfo=UTC)


    def _slug(text):
        return _re.sub(r"[^a-z0-9]+", "-", str(text or "").lower()).strip("-") or "unknown"


    def _device_token(dev, origin):
        """What tells one device from another of the same make and model: its
        `uid` where `_UID` keeps it as written, else the first 16 hex digits of
        the uid's SHA-256, else, for a device that names no uid, of the full
        originDataSourceId's."""
        uid = str(dev.get("uid") or "")
        if _UID.fullmatch(uid):
            return uid
        return hashlib.sha256((uid or origin).encode("utf-8")).hexdigest()[:16]


    def _list(host, flt):
        out, after = [], ""
        while True:
            q = {"filter": flt, "first": 500}
            if after:
                q["after"] = after
            page = host.list(**q)
            out.extend(page.get("records") or [])
            after = page.get("cursor") or ""
            if not after:
                return out


    class _Clock:
        """The account's zone, and no offset at all where it names none."""

        def __init__(self, name):
            self.zone = None
            if name:
                try:
                    self.zone = zoneinfo.ZoneInfo(str(name))
                except (zoneinfo.ZoneInfoNotFoundError, ValueError):
                    self.zone = None
            self.name = str(name) if self.zone else None

        def local(self, t):
            """t on the account's clock, or in UTC for want of one; the UTC
            reading carries no offset into what is written."""
            return t.astimezone(self.zone or UTC)

        def offset(self, t):
            if self.zone is None:
                return None
            return int(self.local(t).utcoffset().total_seconds() // 60)

        def qualifiers(self):
            if self.zone is None:
                return None
            return [{"system": OFFSET_RULE, "code": "timezone:" + self.name}]


    class _Ctx:
        """What one delivery reads once: the account, its zone, its data
        sources, the sources it writes and the units it converts."""

        def __init__(self, host, aid):
            self.host, self.aid = host, aid
            acct = host.records.get(ACCOUNT, aid) or {}
            self.clock = _Clock((acct.get("properties") or {}).get("timezone"))
            self.streams, self.devices = {}, {}
            for r in _list(host, {"kinds": [DATASOURCE],
                                  "referencing": {"ref": ACCOUNT + "/" + aid,
                                                  "property": "account"}}):
                p = r.get("properties") or {}
                self.streams[str(p.get("dataStreamId") or "")] = r
                dev = p.get("device") or {}
                if dev.get("uid"):
                    self.devices[str(dev["uid"])] = dev
            self.sources = {}
            self.minted = set()
            self.units = {}

        def source_for(self, origin):
            """The device behind a point's originDataSourceId: its listed data
            source, else a listed device whose uid the id names, else the
            Fit app's manual entry, else the writing app. A device's slug is
            its make and model plus `_device_token`, so two devices of one
            model are two sources and never share a reading id."""
            origin = str(origin or "")
            row = self.streams.get(origin)
            dev = ((row or {}).get("properties") or {}).get("device") or {}
            if not dev.get("uid") and not dev.get("model"):
                parts = origin.split(":")
                dev = next((self.devices[p] for p in parts if p in self.devices), {})
            if dev.get("model") or dev.get("manufacturer"):
                slug = "%s.%s" % (_slug("%s %s" % (dev.get("manufacturer") or "", dev.get("model") or "")),
                                  _device_token(dev, origin))
                return self._source(slug, {
                    "name": " ".join(x for x in (dev.get("manufacturer"), dev.get("model")) if x),
                    "class": CLASSES.get(dev.get("type") or ""),
                    "manufacturer": dev.get("manufacturer"),
                    "hardwareModel": dev.get("model")})
            parts = origin.split(":")
            if parts and parts[-1] == "user_input":
                return self._source("manual", {"name": "Entered by hand in Google Fit",
                                               "class": "manual"})
            package = parts[2] if len(parts) > 2 and "." in parts[2] else ""
            return self.app_source(package)

        def app_source(self, package):
            if not package:
                return self._source("unknown", {"name": "Unknown Google Fit source"})
            return self._source(_slug(package), {"name": package, "class": "app"})

        def _source(self, slug, props):
            sid = self.host.observed.record_id("googlefit", self.aid, self.aid, slug)
            if sid not in self.sources:
                props = {k: v for k, v in props.items() if v}
                props["account"] = _ref(ACCOUNT, self.aid)
                self.sources[sid] = props
            return slug, _ref(SOURCE, sid)

        def number(self, value):
            """A Fit value as exact digits, a float as its shortest repr
            written out; None for anything that is not a number."""
            if isinstance(value, bool) or not isinstance(value, (int, float)):
                return None
            return self.host.observed.decimal(value)

        def duration(self, ns):
            """Nanoseconds as the duration the engine stores, PT7H48M3S."""
            return self.host.observed.duration(Decimal(max(int(ns), 0)) / NS)

        def convert(self, digits, fit_unit, unit):
            if fit_unit == unit:
                return digits
            return self.host.units.convert(digits, fit_unit, unit)

        def canonical(self, unit):
            if unit not in self.units:
                self.units[unit] = self.host.units.canonical(unit)
            return self.units[unit]

        def flush(self):
            """Mint the sources once: an owner's edit to one (its name, its
            priorities) stands."""
            for sid, props in self.sources.items():
                if sid not in self.minted:
                    self.host.effects.put(SOURCE, sid, properties=props, if_absent=True)
                    self.minted.add(sid)


    def _apply(host, path, desired, kinds):
        """Write the set one row implies and delete what it no longer names."""
        return host.observed.reconcile(path, desired, owned={k: KEYS[k] for k in kinds},
                                       adapter=ADAPTER)


    # ------------------------------------------------------------ dataset days

    def _points(row):
        return [p for p in ((row.get("properties") or {}).get("point") or [])
                if isinstance(p, dict) and _int(p.get("startTimeNanos")) is not None]


    def _value(p, i):
        vals = p.get("value") or []
        if i >= len(vals) or not isinstance(vals[i], dict):
            return None
        v = vals[i]
        return v.get("fpVal") if v.get("fpVal") is not None else v.get("intVal")


    def _revision(points):
        mods = [_int(p.get("modifiedTimeMillis")) for p in points]
        mods = [m for m in mods if m is not None]
        return max(mods) // 1000 if mods else 0


    def _reading_id(ctx, rid, slug, metric, start):
        """A reading's id names its source and its start to the nanosecond:
        two sources reading one instant, or one source reading twice inside a
        millisecond, stay two observations, and a correction or a removal
        from one source never reaches the other's."""
        return ctx.host.observed.record_id("googlefit", ctx.aid, rid, slug, metric, start)


    def _single(ctx, m, rid, points, desired):
        skipped = 0
        unit = ctx.canonical(m["unit"])
        for p in points:
            start = _int(p["startTimeNanos"])
            at = _ns_time(start)
            slug, source = ctx.source_for(p.get("originDataSourceId"))
            # Fit names a reading entered by hand in the Fit app (user_input);
            # any other is a device's or an app's, which Fit does not tell apart.
            base = {"source": source, "form": m["form"], "hold": m.get("hold"),
                    "at": ctx.host.observed.instant(at), "utcOffset": ctx.clock.offset(at),
                    "origin": _ref(DATASET, rid), "revision": _revision([p]),
                    "qualifiers": ctx.clock.qualifiers(),
                    "recordingMethod": "manual" if slug == "manual" else None}
            if m["shape"] == "pressure":
                nums = [ctx.number(_value(p, i)) for i in (0, 1)]
                if None in nums:
                    skipped += 1
                    continue
                parts = [{"metric": _ref(METRIC, "health/" + name),
                          "value": {"value": ctx.convert(n, m["fitUnit"], unit), "unit": unit}}
                         for name, n in zip(PRESSURE, nums)]
                for name, part in zip(PRESSURE, parts):
                    oid = _reading_id(ctx, rid, slug, name, start)
                    desired[(OBSERVATION, oid)] = dict(base, metric=part["metric"],
                                                       value=part["value"], components=parts)
                continue
            n = ctx.number(_value(p, 0))
            if n is None:
                skipped += 1
                continue
            oid = _reading_id(ctx, rid, slug, m["metric"], start)
            desired[(OBSERVATION, oid)] = dict(
                base, metric=_ref(METRIC, "health/" + m["metric"]),
                value={"value": ctx.convert(n, m["fitUnit"], unit), "unit": unit})
        return skipped


    def _crossing(ctx, m, rid, start, end, value, unit, slug, source, mod, desired):
        """A delta whose span crosses a UTC hour, as one amount observation over
        exactly that span: the amount stays whole, and no hour claims time it
        does not cover. Its id is a reading's (`_reading_id`)."""
        at = _ns_time(start)
        oid = _reading_id(ctx, rid, slug, m["metric"], start)
        desired[(OBSERVATION, oid)] = {
            "metric": _ref(METRIC, "health/" + m["metric"]), "source": source,
            "form": m["form"], "value": {"value": value, "unit": unit},
            "at": ctx.host.observed.instant(at), "endsAt": ctx.host.observed.instant(_ns_time(end)),
            "utcOffset": ctx.clock.offset(at),
            "origin": _ref(DATASET, rid), "revision": mod // 1000,
            "qualifiers": ctx.clock.qualifiers()}


    def _traces(ctx, m, rid, points, desired):
        """Pack one data type's points into hourly traces per source. A delta
        (steps, energy) covers [startTimeNanos, endTimeNanos), and a trace
        point's amount spans to the next point, so the end is kept: a null
        follows the point at its end unless the next point starts there (a
        null in a trace is unavailable from that instant), and a delta that
        crosses a UTC hour is written as one amount observation over its own
        span rather than cut between two hourly traces."""
        skipped = 0
        unit = ctx.canonical(m["unit"])
        spans = m["form"] == "amount"
        by_source = {}
        for p in points:
            n = ctx.number(_value(p, 0))
            if n is None:
                skipped += 1
                continue
            start = _int(p["startTimeNanos"])
            end = _int(p.get("endTimeNanos")) if spans else None
            if end is not None and end <= start:
                end = None
            slug, source = ctx.source_for(p.get("originDataSourceId"))
            value = ctx.convert(n, m["fitUnit"], unit)
            mod = _int(p.get("modifiedTimeMillis")) or 0
            if end is not None and start // HOUR_NS != (end - 1) // HOUR_NS:
                _crossing(ctx, m, rid, start, end, value, unit, slug, source, mod, desired)
                continue
            by_source.setdefault((slug, source["ref"]), []).append((start, end, value, mod))
        metric = _ref(METRIC, "health/" + m["metric"])
        for (slug, source), raw in by_source.items():
            raw.sort(key=lambda r: r[0])
            pts = []
            for i, (start, end, value, mod) in enumerate(raw):
                pts.append((ctx.clock.local(_ns_time(start)), value, mod))
                nxt = raw[i + 1][0] if i + 1 < len(raw) else None
                # An end on the hour is the trace's own end: a null there
                # would open the next hour's trace with nothing in it.
                if end is not None and (nxt is None or nxt > end) and end % HOUR_NS:
                    pts.append((ctx.clock.local(_ns_time(end)), None, mod))
            docs = ctx.host.observed.trace([(at, v) for at, v, _ in pts], metric=metric,
                                           source={"ref": source}, unit=unit, form=m["form"],
                                           period=PERIOD, hold=m.get("hold"))
            for doc in docs:
                if ctx.clock.zone is None:
                    doc["utcOffsetStart"] = doc["utcOffsetEnd"] = None
                lo, hi = _parse(doc["at"]), _parse(doc["endsAt"])
                mods = [mod for at, _, mod in pts if lo <= at < hi]
                pid = ctx.host.observed.period_id(lo, PERIOD)
                tid = ctx.host.observed.record_id("googlefit", ctx.aid, ctx.aid, slug, m["metric"], pid)
                doc["origins"] = [_ref(DATASET, rid)]
                doc["revision"] = (max(mods) // 1000) if mods else 0
                desired[(TRACE, tid)] = doc
        return skipped


    def _dataset(host, rid, row):
        path = DATASET + "/" + rid
        desired, out = {}, {"skipped": 0}
        sessions = {}
        ctx = None
        if row is not None:
            props = row.get("properties") or {}
            aid = _ref_id(props.get("account"), ACCOUNT)
            src = host.records.get(DATASOURCE, _ref_id(props.get("dataSource"), DATASOURCE)) or {}
            sp = src.get("properties") or {}
            dtype = str((sp.get("dataType") or {}).get("name") or "")
            stream = str(sp.get("dataStreamName") or "")
            m = MAPPINGS.get(dtype)
            if m is None or stream not in m["streams"]:
                out["note"] = "no catalogue metric for %s from the %s stream" % (dtype or "?", stream or "?")
                out["skipped"] = len(_points(row))
            elif m["shape"] == "sleep":
                # Stage segments are written with the night they belong to, so
                # a sleep day refreshes the sleep sessions it overlaps.
                at, end = _parse(props.get("at")), _parse(props.get("endsAt"))
                for s in _list(host, {"kinds": [SESSION],
                                      "referencing": {"ref": ACCOUNT + "/" + aid,
                                                      "property": "account"},
                                      "properties": {"at": {
                                          "gte": host.observed.instant(at - _dt.timedelta(days=1)),
                                          "lt": host.observed.instant(end)}}}):
                    sp2 = s.get("properties") or {}
                    if _int(sp2.get("activityType")) == SLEEP_ACTIVITY and \
                            (_parse(sp2.get("endsAt")) or at) > at:
                        sessions[s["id"]] = s
            else:
                ctx = _Ctx(host, aid)
                pts = _points(row)
                if m["shape"] == "trace":
                    out["skipped"] = _traces(ctx, m, rid, pts, desired)
                else:
                    out["skipped"] = _single(ctx, m, rid, pts, desired)
                ctx.flush()
        if row is None:
            # A deleted day has no span to find its nights by. A stage
            # observation names the day rows it was cut from in `derivedFrom`,
            # which finds the nights the day touched.
            for r in _list(host, {"kinds": [OBSERVATION],
                                  "referencing": {"ref": path, "property": "derivedFrom"}}):
                sid = _ref_id((r.get("properties") or {}).get("origin"), SESSION)
                if sid and sid not in sessions:
                    s = host.records.get(SESSION, sid)
                    if s is not None and not s.get("deletedAt"):
                        sessions[sid] = s
        out.update(_apply(host, path, desired, (OBSERVATION, TRACE)))
        # The nights a day refreshes share one context: the account and its
        # data sources are read once per delivery, not once per night.
        for sid, s in sorted(sessions.items()):
            aid = _ref_id((s.get("properties") or {}).get("account"), ACCOUNT)
            if ctx is None or ctx.aid != aid:
                ctx = _Ctx(host, aid)
            sub = _session(host, sid, s, ctx)
            for k in ("written", "unchanged", "deleted", "skipped"):
                out[k] = out.get(k, 0) + sub.get(k, 0)
        return out


    # ---------------------------------------------------------------- sessions

    def _segments(ctx, at, end):
        """The sleep segments inside [at, end), clipped to it, from the day rows
        of the account's derived sleep stream."""
        streams = MAPPINGS[SLEEP_TYPE]["streams"]
        out = []
        for row in ctx.streams.values():
            p = row.get("properties") or {}
            if (p.get("dataType") or {}).get("name") != SLEEP_TYPE or p.get("type") != "derived" \
                    or p.get("dataStreamName") not in streams:
                continue
            day = _dt.datetime(at.year, at.month, at.day, tzinfo=UTC)
            for d in _list(ctx.host, {"kinds": [DATASET],
                                      "referencing": {"ref": DATASOURCE + "/" + row["id"],
                                                      "property": "dataSource"},
                                      "properties": {"at": {"gte": ctx.host.observed.instant(day),
                                                            "lt": ctx.host.observed.instant(end)}}}):
                for pt in _points(d):
                    s, e = _int(pt["startTimeNanos"]), _int(pt.get("endTimeNanos"))
                    lo, hi = max(s, _ns(at)), min(e or s, _ns(end))
                    if hi <= lo:
                        continue
                    out.append({"start": lo, "end": hi, "code": _int(_value(pt, 0)),
                                "origin": pt.get("originDataSourceId"),
                                "modified": _int(pt.get("modifiedTimeMillis")) or 0,
                                "day": DATASET + "/" + d["id"]})
        out.sort(key=lambda x: (x["start"], x["end"]))
        return out


    def _ns(t):
        delta = t.astimezone(UTC) - _dt.datetime(1970, 1, 1, tzinfo=UTC)
        return (delta.days * 86400 + delta.seconds) * NS + delta.microseconds * 1000


    def _session(host, rid, row, ctx=None):
        """A sleep or workout session. A dataset delivery that refreshes the
        nights it overlaps passes one account context to all of them."""
        path = SESSION + "/" + rid
        desired, out = {}, {"skipped": 0}
        if row is not None:
            props = row.get("properties") or {}
            aid = _ref_id(props.get("account"), ACCOUNT)
            at, end = _parse(props.get("at")), _parse(props.get("endsAt"))
            if ctx is None or ctx.aid != aid:
                ctx = _Ctx(host, aid)
            revision = (_int(props.get("modifiedTimeMillis")) or 0) // 1000
            app = str((props.get("application") or {}).get("packageName") or "")
            base = {"origin": _ref(SESSION, rid), "at": host.observed.instant(at),
                    "endsAt": host.observed.instant(end) if end else None,
                    "utcOffsetStart": ctx.clock.offset(at),
                    "utcOffsetEnd": ctx.clock.offset(end) if end else None}
            if _int(props.get("activityType")) == SLEEP_ACTIVITY and end is not None:
                out["skipped"] = _sleep(ctx, rid, at, end, revision, app, base, desired)
            else:
                activity = _int(props.get("activityType"))
                active = _int(props.get("activeTimeMillis"))
                _, source = ctx.app_source(app)
                desired[(WORKOUT, host.observed.record_id("googlefit", aid, rid))] = dict(
                    base, sport=SPORTS.get(activity, "other") if activity is not None else None,
                    sportSource=str(activity) if activity is not None else None,
                    source=source, revision=revision,
                    duration=ctx.duration(active * 10**6) if active is not None else None)
            ctx.flush()
        out.update(_apply(host, path, desired, (OBSERVATION, SLEEP, WORKOUT)))
        return out


    def _sleep(ctx, rid, at, end, revision, app, base, desired):
        segs = _segments(ctx, at, end)
        skipped = 0
        totals = Counter()
        origins = Counter()
        stage_metric = _ref(METRIC, "health/sleep_stage")
        for seg in segs:
            totals[seg["code"]] += seg["end"] - seg["start"]
            code = STAGES.get(seg["code"])
            if code is None:
                skipped += 1
                continue
            # A stage's id is its session and its start, never its place in
            # the night, so a corrected earlier segment renames no later one.
            start = _ns_time(seg["start"])
            slug, source = ctx.source_for(seg["origin"])
            origins[slug, source["ref"]] += 1
            seconds = Decimal(seg["end"] - seg["start"]) / NS
            oid = ctx.host.observed.record_id("googlefit", ctx.aid, rid, "stage", seg["start"])
            desired[(OBSERVATION, oid)] = {
                "metric": stage_metric, "source": source, "form": "amount", "code": code,
                "value": {"value": ctx.host.units.convert(seconds, "s", "min"), "unit": "min"},
                "at": ctx.host.observed.instant(start),
                "endsAt": ctx.host.observed.instant(_ns_time(seg["end"])),
                "utcOffset": ctx.clock.offset(start), "origin": _ref(SESSION, rid),
                "derivedFrom": [{"ref": seg["day"]}],
                "revision": max(revision, seg["modified"] // 1000),
                "qualifiers": ctx.clock.qualifiers()}
        if origins:
            (_, ref), _ = origins.most_common(1)[0]
            source = {"ref": ref}
        else:
            _, source = ctx.app_source(app)
        span = _ns(end) - _ns(at)
        in_bed = span - totals[OUT_OF_BED]
        start_hour = ctx.clock.local(at).hour
        sleep = dict(base, source=source,
                     revision=max([revision] + [s["modified"] // 1000 for s in segs]),
                     timeInBed=ctx.duration(in_bed),
                     isNap=span < NAP_LONGEST and NAP_HOURS[0] <= start_hour < NAP_HOURS[1])
        if segs:
            asleep = sum(totals[c] for c in ASLEEP)
            sleep.update({
                "timeAsleep": ctx.duration(asleep),
                "awake": ctx.duration(totals[1]), "light": ctx.duration(totals[4]),
                "deep": ctx.duration(totals[5]), "rem": ctx.duration(totals[6]),
                "efficiency": ctx.host.observed.percent(asleep, in_bed)})
        desired[(SLEEP, ctx.host.observed.record_id("googlefit", ctx.aid, rid))] = sleep
        return skipped


    def main(input, host):
        env = input.get("envelope") or {}
        change = env.get("change") or {}
        record = env.get("record")
        kind = str(change.get("kind") or (record or {}).get("kind") or "")
        rid = str(change.get("id") or (record or {}).get("id") or "")
        if not rid:
            return {"output": {"note": "no record named in the envelope"}}
        if record is not None and record.get("deletedAt"):
            record = None
        if kind == DATASET:
            out = _dataset(host, rid, record)
        elif kind == SESSION:
            out = _session(host, rid, record)
        else:
            out = {"note": "not a Google Fit dataset or session: %s" % kind}
        return {"output": out}
