# somewhere worth remembering
kind: substrate.reamde.dev/core/kind
metadata:
  id: samples.substrate.reamde.dev/places/place
data:
  authority: samples.substrate.reamde.dev
  package: places
  description: >-
    Somewhere worth remembering: home, the gym, a restaurant that earned a
    note. The record is the place itself; what happened there lives on whatever
    points at it.
  names:
    singular: place
  displayTemplate: "{name}"
  indices:
    - properties:
        - category
  properties:
    name:
      type: string
      required: true
      description: what the place is called
    category:
      type: enum
      description: what sort of place it is
      values:
        - home
        - work
        - gym
        - restaurant
        - cafe
        - shop
        - park
        - other
    cuisine:
      type: string
      description: the cuisine, where the category is food
    address:
      type: string
      description: the street address, as written
    city:
      type: string
      description: the city
    country:
      type: string
      description: the country
    latitude:
      type: float
      min: -90
      max: 90
      description: degrees north of the equator
    longitude:
      type: float
      min: -180
      max: 180
      description: degrees east of the prime meridian
    rating:
      type: float
      min: 0
      max: 5
      description: the owner's own rating out of 5, not a provider's
    url:
      type: url
      description: the place's own site
    mapURL:
      type: url
      description: a maps link that opens the place
    phone:
      type: phone
      description: the place's phone number
    details:
      type: markdown
      embed: true
      description: why it is worth remembering, as prose
