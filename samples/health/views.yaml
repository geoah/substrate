# The record pages of a sleep and a workout, as DATA: records of the seeded
# console package's `recordview` kind (decision record 0166), which the
# console renders above the generic property sheet. The console names no
# sample, so these records are the only place a sleep's hypnogram or a
# workout's heart rate zones are asked for.
#
# The import writes a view only where the repository holds none at its id, so
# an owner's edit survives a re-import or an upgrade of this sample. To take a
# newer shipped view, delete yours and import again.
#
# `appliesTo` names the kind's declaration, which the import rehomes with the
# kind, so a view lands pointing at the repository's own `health/sleep`.
kind: substrate.reamde.dev/console/recordview
metadata:
  id: health/sleep
data:
  properties:
    appliesTo: substrate.reamde.dev/core/kind/samples.substrate.reamde.dev/health/sleep
    name: During this sleep
    intro: What was measured between the sleep's start and its end.
    window:
      start: at
      end: endsAt
      about: about
      source: source
    sections:
      - chart:
          label: Heart rate, heart rate variability and breathing
          metrics:
            - health/heart_rate
            - health/hrv_rmssd
            - health/respiratory_rate
          reducers:
            - reducer: avg
              label: Average
            - reducer: min
              label: Lowest
            - reducer: max
              label: Highest
          bucket: auto
          sources: prefer
      - spans:
          label: Sleep stages
          metric: health/sleep_stage
          codes:
            - code: awake
              label: Awake
            - code: in_bed
              label: In bed
            - code: rem
              label: REM
            - code: asleep
              label: Asleep
            - code: light
              label: Light
            - code: deep
              label: Deep
          totals: true
          sources: only
---
# Five heart rate zones of 19 beats each, from half of a 190 maximum, the
# top one open to 220. An owner with a measured maximum edits the bounds here.
kind: substrate.reamde.dev/console/recordview
metadata:
  id: health/workout
data:
  properties:
    appliesTo: substrate.reamde.dev/core/kind/samples.substrate.reamde.dev/health/workout
    name: During this workout
    intro: What was measured between the workout's start and its end.
    window:
      start: at
      end: endsAt
      about: about
      source: source
    fold:
      - distance
      - duration
    sections:
      - properties:
          list:
            - property: distance
              label: Distance
            - property: duration
              label: Time moving
      - chart:
          label: Heart rate
          metrics:
            - health/heart_rate
          reducers:
            - reducer: avg
              label: Average
            - reducer: min
              label: Lowest
            - reducer: max
              label: Highest
          bucket: auto
          sources: prefer
      - chart:
          label: Time in heart rate zones
          metrics:
            - health/heart_rate
          reducers:
            - reducer: durationIn
              low: 95
              high: 114
              label: Zone 1
            - reducer: durationIn
              low: 114
              high: 133
              label: Zone 2
            - reducer: durationIn
              low: 133
              high: 152
              label: Zone 3
            - reducer: durationIn
              low: 152
              high: 171
              label: Zone 4
            - reducer: durationIn
              low: 171
              high: 220
              label: Zone 5
          bucket: whole
          unit: min
          sources: prefer
      - chart:
          label: Speed
          metrics:
            - health/speed
          reducers:
            - reducer: avg
              label: Average
            - reducer: max
              label: Highest
          bucket: auto
          sources: prefer
