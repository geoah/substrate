# one night or one nap as a session. The stage segments themselves are coded
# `amount` observations of `health/sleep_stage` beside it (`asleep` for sleep
# the device did not stage, never an `in_bed` span over the whole night,
# which is `timeInBed`); this record holds
# the session's totals and the vendor's scores, so a reader lists nights
# without aggregating anything. `at` and `endsAt` are the session's span.
kind: substrate.reamde.dev/core/kind
metadata:
  id: samples.substrate.reamde.dev/health/sleep
data:
  authority: samples.substrate.reamde.dev
  package: health
  description: >-
    One night's sleep or one nap. When it began and ended, the time spent
    in each stage, how efficient it was and the scores the device gave it.
  purpose: primary
  names:
    singular: sleep
  traits:
    - substrate.reamde.dev/core/temporal(range)
  displayTemplate: "{source} {at}"
  properties:
    source:
      type: reference
      kind: samples.substrate.reamde.dev/observations/source
      description: the device or app that recorded it
    about:
      type: reference
      kind: any
      description: who slept; absent means the repository's owner
    origin:
      type: reference
      kind: any
      description: the provider record this was built from
    revision:
      type: int
      min: 0
      description: rises with each rewrite from the upstream
    adapter:
      type: string
      description: the function and version that wrote this row from its origin,
        `<package>@<version>`
    isNap:
      type: bool
      description: true for a nap rather than the main sleep
    utcOffsetStart:
      type: int
      min: -1080
      max: 1080
      description: minutes east of UTC when it began
    utcOffsetEnd:
      type: int
      min: -1080
      max: 1080
      description: minutes east of UTC when it ended
    timeInBed:
      type: duration
      description: the whole time in bed
    timeAsleep:
      type: duration
      description: the time asleep, light, deep and rem sleep and sleep the
        device did not stage
    awake:
      type: duration
      description: time awake while in bed
    light:
      type: duration
      description: time in light sleep
    deep:
      type: duration
      description: time in deep sleep
    rem:
      type: duration
      description: time in REM sleep
    latency:
      type: duration
      description: how long it took to fall asleep
    efficiency:
      type: quantity
      measures: fraction
      description: time asleep as a part of time in bed
    respiratoryRate:
      type: quantity
      measures: rate
      description: the average breaths per minute while asleep
    disturbances:
      type: int
      min: 0
      description: how many times sleep was disturbed
    # the vendor's own scores by the vendor's own names (sleepPerformance,
    # sleepConsistency), never mapped onto another vendor's
    scores:
      type: decimal
      keyed: true
      description: the device's scores for this sleep by their own names,
        such as sleepPerformance
