# The health sample's one delivery: every create, update and delete of a lab
# result fires `convertlab` with that result's current state, which writes
# the value in the paired unit system and deletes what the result no longer
# implies.
#
# A new trigger starts at the changelog's head, so results written before
# this sample was imported are converted by replaying it from the start:
# POST /api/v1/substrate.reamde.dev/core/trigger/health-on-labresult/replay
# with {"from": 0}. Every derived id is composed, so a replay over results
# already converted writes nothing.
kind: substrate.reamde.dev/core/trigger
metadata:
  id: health-on-labresult
data:
  properties:
    enabled: true
    label: Lab results in both unit systems
    source:
      record:
        kinds:
          - samples.substrate.reamde.dev/health/labresult
        ops:
          - create
          - update
          - delete
    callable: substrate.reamde.dev/core/function/samples.substrate.reamde.dev/health/convertlab
