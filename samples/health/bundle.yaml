# Shipped vocabulary ported from mneme v4: the body. Observations
# (the generic tracked measure and its entries), medications with their dose
# schedules and dose logs, and blood tests.
#
# The recurrence stance is the substrate's, not mneme's: a schedule stores an
# RRULE and the substrate never expands it. An occurrence exists only when
# something logs it (a dose taken, an entry recorded), so adherence is
# "expected minus logged", computed by a reader, never stored.
#
# no new actors: writes arrive under the actor of whatever runs.
kind: substrate.reamde.dev/core/package
metadata:
  id: samples.substrate.reamde.dev/health
data:
  authority: samples.substrate.reamde.dev
  package: health
  # version 2: THE TYPED CORE SWEEP. Declarations in this closure moved to the
  # declared spellings — whichever of them they used: a tool entry naming its arm,
  # a function's flat IO and hoisted grants, a mapping rule as `{path}`, an index
  # naming its properties. THE PACKAGE IS VERSIONED AS A UNIT, so this bump
  # carries the closure whole rather than saying every declaration in it moved.
  # version 3: `medicationschedule` and `observation` bind `recurring`;
  # `medicationschedulelog` binds `occurrencelog`, moves its status states from
  # taken/skipped to done/skipped, and types `doseUnit` as the schedule's enum
  # (#122).
  # version 5: `observationlog`'s reference `subject` is `derivedFrom` (#125).
  # version 6: `rdates` lands with the `recurring` trait's move.
  # version 7: every link is a `type: reference` property carrying
  # `mustExist: true`, and an owning one carries `onDelete: cascade`.
  version: 7
---
# ---- the bundle document: the import unit -----------------------------------
# A SAMPLE bundle: kinds only, imported from the registry.
kind: substrate.reamde.dev/core/bundle
metadata:
  id: samples.substrate.reamde.dev/health
data:
  authority: samples.substrate.reamde.dev
  package: health
  description: >-
    The body: observations and their logged entries, medications with dose
    schedules and dose logs, and blood tests. Schedules carry RRULEs; the
    substrate stores the rule and never expands it.
  requires:
    - samples.substrate.reamde.dev/scheduling
  installs:
    - samples.substrate.reamde.dev/health/bloodtest
    - samples.substrate.reamde.dev/health/medication
    - samples.substrate.reamde.dev/health/medicationschedule
    - samples.substrate.reamde.dev/health/medicationschedulelog
    - samples.substrate.reamde.dev/health/observation
    - samples.substrate.reamde.dev/health/observationlog
