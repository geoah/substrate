# The health catalogue, as DATA: one metric record per thing a wearable, a
# scale or a lab measures, each with the codes other systems use for it, so
# an adapter maps by code and a reader finds a metric by the name it knows.
# They are records of the base package's `metric` kind, ids prefixed
# `health/`, and the import puts them after the kinds land: editable,
# deletable, and left in place if this sample is removed.
#
# The observed index reads nothing from them (decision record 0156): `form`,
# `hold` and the reducers are advice an adapter copies onto each value. Each
# `unit` is a reference to a unit record (decision record 0186): every value
# pointing at the metric is written in that unit or one that converts to it
# through linear conversions, and the aggregate read answers in it by
# default.
#
# Two rules the ids follow. A lab analyte reported in both unit systems is
# two metrics, the amount concentration unsuffixed (`ldl_cholesterol`, mmol/L)
# and the mass concentration suffixed `_mass` (mg/dL): no linear conversion
# joins the two units, and the sample's `convertlab` function writes a lab result of one
# in the other as a derived result, from the analyte's molar mass
# (metrics_analytes.yaml). A vendor's score is named for the vendor
# (`whoop_recovery`) and never mapped onto another vendor's.
#
# Code systems: `http://loinc.org` (LOINC), `healthkit` (an Apple HealthKit
# type identifier), `healthconnect` (an Android Health Connect record type),
# `googlefit` (a Google Fit data type), `whoop` (a WHOOP API v2 score field),
# `garmin` (a Garmin Health API summary field), `withings` (a Withings measure
# type). The codes were written from the vendors' published documentation,
# without a check against a live account; a metric's description marks the
# ones least certain, and says where no code is listed.
kind: samples.substrate.reamde.dev/observations/metric
metadata:
  id: health/heart_rate
data:
  properties:
    name: Heart rate
    description: >-
      Beats per minute, measured continuously or on demand, in /min: bpm and
      count/min are read as /min.
    codes:
      - system: "http://loinc.org"
        code: "8867-4"
        display: Heart rate
      - system: healthkit
        code: HKQuantityTypeIdentifierHeartRate
      - system: healthconnect
        code: HeartRateRecord
      - system: googlefit
        code: com.google.heart_rate.bpm
      - system: garmin
        code: timeOffsetHeartRateSamples
        display: Daily summary heart rate samples
    unit:
      ref: substrate.reamde.dev/core/unit/1/min
    form: gauge
    hold: PT4M
    reducers:
      - avg
      - min
      - max
      - percentile
      - durationIn
    displayPrecision: 0
    category: heart
---
kind: samples.substrate.reamde.dev/observations/metric
metadata:
  id: health/resting_heart_rate
data:
  properties:
    name: Resting heart rate
    description: >-
      The heart rate at rest, as the device computes it for a night or a day.
    codes:
      - system: "http://loinc.org"
        code: "40443-4"
        display: Heart rate --resting
      - system: healthkit
        code: HKQuantityTypeIdentifierRestingHeartRate
      - system: healthconnect
        code: RestingHeartRateRecord
      - system: whoop
        code: resting_heart_rate
        display: Recovery score resting heart rate
      - system: garmin
        code: restingHeartRateInBeatsPerMinute
        display: Daily summary resting heart rate
    unit:
      ref: substrate.reamde.dev/core/unit/1/min
    form: summary
    reducers:
      - last
      - avg
      - min
      - max
    displayPrecision: 0
    # A nightly summary lands on the day the night ends, as WHOOP scores it;
    # a raw reading is an instant, which places the same either way.
    bucketPlace: end
    category: heart
---
kind: samples.substrate.reamde.dev/observations/metric
metadata:
  id: health/hrv_rmssd
data:
  properties:
    name: Heart rate variability (RMSSD)
    description: >-
      The root mean square of successive differences between heartbeats, in
      milliseconds. A different statistic from SDNN, which Apple reports;
      the two never pool. Garmin writes a reading about every five minutes
      overnight as gauge traces, and WHOOP and Garmin write a nightly value
      as a summary. A writer copies the hold, PT10M, onto each gauge value.
      No LOINC code is listed: none was verified for RMSSD. The Garmin field
      names follow the Health API's documentation and are unverified against
      a live account.
    codes:
      - system: healthconnect
        code: HeartRateVariabilityRmssdRecord
      - system: whoop
        code: hrv_rmssd_milli
        display: Recovery score HRV
      - system: garmin
        code: lastNightAvg
        display: HRV summary last night average
      - system: garmin
        code: hrvValues
        display: HRV summary values
    unit:
      ref: substrate.reamde.dev/core/unit/ms
    form: gauge
    hold: PT10M
    reducers:
      - last
      - avg
      - min
      - max
    displayPrecision: 0
    # A nightly summary lands on the day the night ends, as WHOOP scores it;
    # a raw reading is an instant, which places the same either way.
    bucketPlace: end
    category: heart
---
kind: samples.substrate.reamde.dev/observations/metric
metadata:
  id: health/hrv_sdnn
data:
  properties:
    name: Heart rate variability (SDNN)
    description: >-
      The standard deviation of the intervals between heartbeats, in milliseconds,
      as Apple Watch reports it. A different statistic from RMSSD; the two
      never pool. Apple Watch takes a spot reading every few hours, and a
      writer copies the hold, PT0S, onto each value, so an average is the
      mean of the readings it covers.
    codes:
      - system: "http://loinc.org"
        code: "80404-7"
        display: R-R interval.standard deviation (Heart rate variability)
      - system: healthkit
        code: HKQuantityTypeIdentifierHeartRateVariabilitySDNN
    unit:
      ref: substrate.reamde.dev/core/unit/ms
    form: gauge
    hold: PT0S
    reducers:
      - avg
      - min
      - max
      - last
    displayPrecision: 0
    category: heart
---
