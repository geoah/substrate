    codes:
      - system: "http://loinc.org"
        code: "59408-5"
        display: Oxygen saturation in Arterial blood by Pulse oximetry
      - system: healthkit
        code: HKQuantityTypeIdentifierOxygenSaturation
      - system: healthconnect
        code: OxygenSaturationRecord
      - system: googlefit
        code: com.google.oxygen_saturation
      - system: whoop
        code: spo2_percentage
        display: Recovery score SpO2
      - system: garmin
        code: timeOffsetSpo2Values
        display: Pulse Ox summary values
    unit:
      ref: substrate.reamde.dev/core/unit/percent
    form: gauge
    hold: PT20M
    reducers:
      - avg
      - min
      - max
      - last
    displayPrecision: 0
    # A nightly summary lands on the day the night ends, as WHOOP scores it;
