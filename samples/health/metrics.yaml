kind: samples.substrate.reamde.dev/observations/metric
metadata:
  id: health/sleep_stage
data:
  properties:
    name: Sleep stage
    description: >-
      Which stage of sleep, as a code over a span: awake, light, deep or rem;
      asleep for sleep the source did not stage; in_bed for time in bed that
      is not asleep and is no other code, such as Health Connect's awake in
      bed. A source that reports when each stage happened writes one value
      per segment, and its segments never overlap. A source that reports only
      a total per stage, such as WHOOP, writes each total over the whole sleep,
      so its spans overlap and the values, not the spans, are the time in
      each stage; a window narrower than the night spreads such a total evenly
      across the night. Summed by code over the night, both are the time in
      each stage. A night's whole time in bed is the sleep's timeInBed and
      never an in_bed span: summed by code, the night would count twice.
    codes:
      - system: healthkit
        code: HKCategoryTypeIdentifierSleepAnalysis
      - system: healthconnect
        code: SleepSessionRecord
        display: stages
      - system: googlefit
        code: com.google.sleep.segment
    codeSet:
      - awake
      - light
      - deep
      - rem
      - asleep
      - in_bed
    form: amount
    reducers:
      - sum
      - count
    # A night lands on the day it ends, so each day holds one night.
    bucketPlace: end
    category: sleep
---
kind: samples.substrate.reamde.dev/observations/metric
metadata:
  id: health/whoop_recovery
data:
  properties:
    name: WHOOP recovery
    description: >-
      WHOOP's recovery score for one physiological cycle, from 0 to 100 percent.
      WHOOP's own method, never mapped onto another vendor's.
    codes:
      - system: whoop
        code: recovery_score
        display: Recovery score
    unit:
      ref: substrate.reamde.dev/core/unit/percent
    form: summary
    reducers:
      - last
      - avg
    displayPrecision: 0
    # A nightly summary lands on the day the night ends, as WHOOP scores it;
    # a raw reading is an instant, which places the same either way.
    bucketPlace: end
    category: scores
    algorithm:
      vendor: WHOOP
      name: recovery
---
