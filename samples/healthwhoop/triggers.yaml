# The adapter's one delivery: every create, update and delete of a WHOOP
# cycle, recovery, sleep or workout row fires `adaptwhoop` with that row's
# current state. The member row implies no health record and is not named.
#
# `fromStart` starts the cursor at the changelog's start when the import
# creates the trigger, so the rows the WHOOP mirror held before this sample
# was imported are converted without a hand. Every output id is composed, so
# delivering a row already converted writes nothing.
kind: substrate.reamde.dev/core/trigger
metadata:
  id: healthwhoop-on-mirror
data:
  properties:
    enabled: true
    label: WHOOP to health
    source:
      record:
        kinds:
          - providers.substrate.reamde.dev/whoop/cycle
          - providers.substrate.reamde.dev/whoop/recovery
          - providers.substrate.reamde.dev/whoop/sleep
          - providers.substrate.reamde.dev/whoop/workout
        ops: [create, update, delete]
        fromStart: true
    callable: substrate.reamde.dev/core/function/samples.substrate.reamde.dev/healthwhoop/adaptwhoop
