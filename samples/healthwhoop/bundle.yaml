# The WHOOP adapter for the health sample: one function that turns the WHOOP
# provider's mirror rows (providers.substrate.reamde.dev/whoop) into health
# records under the repository's own authority. A SAMPLE a repository imports
# and owns, after the `health` sample and the WHOOP provider.
#
# WHOOP sends scored objects, never raw samples, so every number lands as a
# `summary` observation that keeps WHOOP's own cycle identity in `periodId`,
# energy and stage totals as `amount` observations, and a sleep and a workout
# as the typed health records. A cycle's and a workout's average and maximum
# heart rate are `health/heart_rate` summaries over their spans, so WHOOP is
# a heart rate source beside the watches. docs/bundles-catalog.md has the
# mapping table.
#
# Every output names the mirror row it came from in `origin` and carries
# WHOOP's `updated_at` as `revision`, and its id is composed from WHOOP's own
# identifiers. The function rebuilds the whole set one mirror row implies and
# deletes what that row no longer implies, so a rescored cycle rewrites the
# same ids and a deleted mirror row takes its outputs with it.
kind: substrate.reamde.dev/core/package
metadata:
  id: samples.substrate.reamde.dev/healthwhoop
data:
  authority: samples.substrate.reamde.dev
  package: healthwhoop
  # 2: a cycle's and a workout's average and maximum heart rate are written
  # as `health/heart_rate` summaries.
  # 3: a workout's sport maps onto the workout code set and its kilojoules
  # are `totalEnergy`, strain is in `{score}`, and every output is written
  # through host.observed.reconcile; ADAPTER is healthwhoop@3.
  # 4: a recovery's five readings span the sleep it scores, not its cycle;
  # ADAPTER is healthwhoop@4.
  # 5: a sleep and a workout carry a `name` heading; ADAPTER is
  # healthwhoop@5.
  # 6: the function reads through the shared host.observed helpers (ref_id,
  # utc_offset, parse_instant, number, quantity and the headings), and the
  # trigger declares `fromStart`; ADAPTER is healthwhoop@6.
  # 7: every output id and the source id go through
  # host.observed.record_id, so a long account id hashes instead of
  # refusing the write; ADAPTER is healthwhoop@7.
  # 8: the cycle and sleep views (views.yaml); ADAPTER is healthwhoop@8.
  # No output changes but the stamp, so 8 needs no replay: an output takes
  # the new stamp when its origin's next delivery rewrites it.
  version: 8
---
# ---- the bundle document: the import unit -------------------------------------
# One function and its record trigger (triggers.yaml). No inputs and no
# settings: the WHOOP credentials are the provider's.
kind: substrate.reamde.dev/core/bundle
metadata:
  id: samples.substrate.reamde.dev/healthwhoop
data:
  authority: samples.substrate.reamde.dev
  package: healthwhoop
  description: >-
    Turns your WHOOP data into health records: each day's recovery, strain,
    energy and heart rate, each sleep with its stages, and each workout. Needs
    the health sample and the WHOOP provider.
  requires:
    - samples.substrate.reamde.dev/observations
    - samples.substrate.reamde.dev/health
    - providers.substrate.reamde.dev/whoop
  requiresAtLeast:
    samples.substrate.reamde.dev/observations: 1
    # 2 declares the sleep's and the workout's `name`, which this adapter
    # writes.
    samples.substrate.reamde.dev/health: 2
    # 21 is the version that deletes a mirror row WHOOP deleted, which is
    # what lets this adapter delete the outputs of one.
    providers.substrate.reamde.dev/whoop: 21
  installs:
    - samples.substrate.reamde.dev/healthwhoop/adaptwhoop
---
# ---- the adapter: one mirror row per delivery ---------------------------------
# Fired by `healthwhoop-on-mirror` on every create, update and delete of a
# WHOOP cycle, recovery, sleep or workout row. The envelope carries the row's
# CURRENT state (null once deleted), so a late or repeated delivery computes
# the same outputs as a prompt one.
kind: substrate.reamde.dev/core/function
metadata:
  id: samples.substrate.reamde.dev/healthwhoop/adaptwhoop
data:
  authority: samples.substrate.reamde.dev
  package: healthwhoop
  description: >-
    Rebuild the health records one WHOOP mirror row implies: the recovery,
    strain, energy and heart rate observations of a cycle, a sleep with its
    stage totals and scores, or a workout with its heart rate. Deletes the
    records a deleted or changed row no longer implies.
  runtime: python
  timeout: PT30S
  permissions:
    # The mirror rows a row depends on (a recovery's sleep and cycle, a
    # sleep's and a cycle's recoveries) and the outputs that name an origin,
    # for the deletions.
    reads:
      kinds:
        - providers.substrate.reamde.dev/whoop/cycle
        - providers.substrate.reamde.dev/whoop/recovery
        - providers.substrate.reamde.dev/whoop/sleep
        - samples.substrate.reamde.dev/observations/observation
        - samples.substrate.reamde.dev/health/sleep
        - samples.substrate.reamde.dev/health/workout
      budgets:
        calls: 64
        rows: 500
    writes:
      - samples.substrate.reamde.dev/observations/observation
      - samples.substrate.reamde.dev/observations/source
      - samples.substrate.reamde.dev/health/sleep
      - samples.substrate.reamde.dev/health/workout
  source: |
    """WHOOP mirror rows to health records.

    ONE ORIGIN AT A TIME. A delivery names one mirror row. The body computes
    every record that row implies and hands the set to
    host.observed.reconcile, which writes each whole in one put (None for a
    property the row no longer implies, which the put clears), leaves one
    that already holds it unwritten, and deletes the records that name the
    row in `origin` and are no longer implied. A deleted row implies nothing.
    A recovery takes its span from the sleep it scores, so a sleep delivery
    rebuilds the recoveries that name the sleep, and a cycle delivery
    rebuilds the cycle's recoveries whose sleep is absent.

    IDS are composed from WHOOP's own identifiers, read off the mirror row
    (the row ids are hashes): `whoop/<account record id>/<cycle id>/recovery`
    and the other cycle roles, `whoop/<account>/<sleep id>/sleep`,
    `whoop/<account>/<sleep id>/stage/<code>`, `whoop/<account>/<workout id>/
    workout`, and `heart_rate_avg` and `heart_rate_max` under a cycle id or a
    workout id. The source is `whoop/<account record id>`: the API names no
    hardware model, so the source is the WHOOP the account syncs. Every id
    goes through host.observed.record_id, which hashes one that would pass
    128 characters or leave the id alphabet (decision record 0162), so a long
    account id never makes an output unwritable.

    SPANS. A summary of a cycle spans the cycle, and a workout's heart rate
    spans the workout. The current cycle has no end yet, so its span ends at
    the cycle's `updatedAt`, the last moment WHOOP scored it, and moves
    forward as WHOOP rescores it. A cycle that has not moved past its start
    implies nothing until it does.

    A recovery's five readings measure the night: they span the sleep the
    recovery names, with `period: sleep` and the sleep's id as `periodId`,
    the same as the night's sleep performance and respiratory rate. A day
    read then places them on the wake day with `bucket.place: end`, the way
    it places the other sources' nightly summaries. A recovery whose sleep
    row is absent (the sleep toggle is off, or the sleep is in a later page)
    spans its cycle with `period: cycle`, and is counted as `recovery without
    its sleep` until the sleep arrives; one whose cycle is absent too
    implies nothing.

    REVISION is WHOOP's `updated_at` in whole seconds since the epoch (for a
    recovery, the later of its own and its sleep's, or its cycle's where it
    spans the cycle). A rewrite never lowers a stored revision: reconcile
    keeps the higher.

    UNITS are WHOOP's own and pass through the engine's table: kJ stay kJ, a
    stage total in milliseconds becomes minutes through host.units.convert. A
    WHOOP field the metric catalogue has no metric for, or that no health
    kind holds, is skipped and counted in the output, never mapped onto a
    metric that means something else.
    """
    from decimal import Decimal

    # This code's own version, `<package>@<package version>`, stamped on
    # every output apart from WHOOP's `revision` (decision record 0162).
    # Raise it and the package's `version` together with any change to
    # what a mirror row becomes: the new package version is what offers
    # a repository the upgrade. Then replay `healthwhoop-on-mirror` from 0:
    # every output is rewritten at the revision it already holds.
    ADAPTER = "healthwhoop@8"

    HOME = "samples.substrate.reamde.dev"
    OBSERVATION = HOME + "/observations/observation"
    SOURCE = HOME + "/observations/source"
    METRIC = HOME + "/observations/metric"
    SLEEP = HOME + "/health/sleep"
    WORKOUT = HOME + "/health/workout"

    WHOOP = "providers.substrate.reamde.dev/whoop"
    ACCOUNT_T = WHOOP + "/account"
    CYCLE_T = WHOOP + "/cycle"
    RECOVERY_T = WHOOP + "/recovery"
    SLEEP_T = WHOOP + "/sleep"
    WORKOUT_T = WHOOP + "/workout"

    # Every property an output kind's records get from this body. Each write
    # names all of them, None where the row implies nothing, so a rewrite
    # clears what the previous one set and the row no longer says.
    OBSERVATION_PROPS = ("metric", "source", "channel", "form", "value", "code",
                         "statistic", "period", "periodId", "at", "endsAt",
                         "utcOffset", "origin", "revision", "adapter", "quality")
    SLEEP_PROPS = ("name", "source", "origin", "revision", "adapter", "isNap", "utcOffsetStart",
                   "utcOffsetEnd", "at", "endsAt", "timeInBed", "timeAsleep",
                   "awake", "light", "deep", "rem", "efficiency",
                   "respiratoryRate", "disturbances", "scores")
    WORKOUT_PROPS = ("name", "sport", "sportSource", "source", "origin", "revision", "adapter",
                     "utcOffsetStart", "utcOffsetEnd", "at", "endsAt", "duration",
                     "distance", "totalEnergy", "averageHeartRate", "maxHeartRate",
                     "elevationGain", "strain", "zoneDurations")
    MANAGED = {OBSERVATION: OBSERVATION_PROPS, SLEEP: SLEEP_PROPS,
               WORKOUT: WORKOUT_PROPS}

    # A cycle's readings: (score field, metric id, unit, form, id role). A
    # summary is WHOOP's own computation over the cycle (`statistic: vendor`,
    # `period: cycle`); an amount is the cycle's total.
    CYCLE_READINGS = (
        ("strain", "health/whoop_strain", "{score}", "summary", "strain"),
        ("kilojoule", "health/energy_expended", "kJ", "amount", "energy"),
    )
    # A recovery's five readings: (score field, metric id, unit, id role).
    RECOVERY_READINGS = (
        ("recoveryScore", "health/whoop_recovery", "%", "recovery"),
        ("hrvRmssdMilli", "health/hrv_rmssd", "ms", "hrv"),
        ("restingHeartRate", "health/resting_heart_rate", "/min", "resting_heart_rate"),
        ("spo2Percentage", "health/spo2", "%", "spo2"),
        ("skinTempCelsius", "health/skin_temperature", "Cel", "skin_temperature"),
    )
    # A sleep's two scores over the night: (score field, metric id, unit, id
    # role).
    SLEEP_READINGS = (
        ("sleepPerformancePercentage", "health/whoop_sleep_performance", "%", "sleep_performance"),
        ("respiratoryRate", "health/respiratory_rate", "/min", "respiratory_rate"),
    )
    # WHOOP's stage totals and the `health/sleep_stage` code each one is.
    STAGE_METRIC = "health/sleep_stage"
    # `totalInBedTimeMilli` is every stage together, not unstaged time, so it
    # is the sleep's `timeInBed` and never an `in_bed` total: summed by code,
    # the night would count twice.
    STAGES = (("totalAwakeTimeMilli", "awake"),
              ("totalLightSleepTimeMilli", "light"),
              ("totalSlowWaveSleepTimeMilli", "deep"),
              ("totalRemSleepTimeMilli", "rem"))
    ZONES = (("zoneZeroMilli", "zone0"), ("zoneOneMilli", "zone1"),
             ("zoneTwoMilli", "zone2"), ("zoneThreeMilli", "zone3"),
             ("zoneFourMilli", "zone4"), ("zoneFiveMilli", "zone5"))
    # A cycle's and a workout's heart rate: (score field, statistic, id role),
    # one `health/heart_rate` summary each over the cycle's or the workout's
    # span. The statistic is the one WHOOP computed, an average and a maximum,
    # and not `vendor`, which is for a vendor's own method: so the aggregate
    # read's `avg` and `max` reducers take them beside the other sources'. A
    # workout's are on the `workout` channel, because they measure a stretch
    # its cycle's summary already covers: on one stream, a day's `avg` would
    # be the plain mean of the cycle's average and the run's.
    HEART_RATE_METRIC = "health/heart_rate"
    HEART_RATE = (("averageHeartRate", "avg", "heart_rate_avg"),
                  ("maxHeartRate", "max", "heart_rate_max"))
    # Score fields no metric and no health kind holds.
    UNMAPPED = {
        CYCLE_T: (),
        RECOVERY_T: (),
        SLEEP_T: ("sleepNeeded",),
        WORKOUT_T: ("percentRecorded", "altitudeChangeMeter"),
    }
    UNMAPPED_STAGES = ("totalNoDataTimeMilli", "sleepCycleCount")
    # WHOOP's sport names onto the workout kind's code set. A name not here is
    # `other`; the name itself stays in `sportSource`.
    SPORTS = {
        "running": "running", "track-and-field": "running", "stroller-jogging": "running",
        "walking": "walking", "dog-walking": "walking", "stroller-walking": "walking",
        "hiking-rucking": "hiking", "hiking": "hiking",
        "cycling": "cycling", "mountain-biking": "cycling", "spin": "cycling",
        "swimming": "swimming",
        "weightlifting": "strength", "powerlifting": "strength",
        "strength-trainer": "strength", "functional-fitness": "strength",
        "yoga": "yoga", "hot-yoga": "yoga", "pilates": "pilates",
        "rowing": "rowing", "elliptical": "elliptical",
        "stairmaster": "stairs", "stadium-steps": "stairs",
        "hiit": "hiit", "f45-training": "hiit", "barrys": "hiit",
        "dance": "dance", "boxing": "boxing", "kickboxing": "boxing",
        "box-fitness": "boxing", "rock-climbing": "climbing", "climber": "climbing",
        "tennis": "tennis", "golf": "golf",
        "skiing": "skiing", "cross-country-skiing": "skiing",
    }


    # --------------------------------------------------------------- reading

    def _props(row):
        return (row or {}).get("properties") or {}


    def _live(row):
        return bool(row) and not row.get("deletedAt")


    # ---------------------------------------------------------------- the run

    class _Run:
        def __init__(self, host):
            self.host = host
            self.obs = host.observed
            self.sources = set()
            self.counts = {"written": 0, "unchanged": 0, "deleted": 0}
            self.skipped = {}

        def skip(self, what):
            self.skipped[what] = self.skipped.get(what, 0) + 1

        def duration(self, ms):
            """WHOOP's milliseconds as the spelling the engine stores."""
            return self.obs.duration(Decimal(int(ms)) / 1000)

        def seconds(self, *values):
            """WHOOP's `updated_at` as whole seconds, the latest of those given."""
            out = [int(t.timestamp()) for t in map(self.obs.parse_instant, values) if t is not None]
            return max(out) if out else None

        def span(self, start, end):
            """[start, end] as written, or None while it has no length."""
            a, b = self.obs.parse_instant(start), self.obs.parse_instant(end)
            if a is None or b is None or b <= a:
                return None
            return start, end

        def oid(self, aid, *parts):
            """An output's id: `whoop/<account>/<parts>`, or its hash where
            that is no record id."""
            return self.obs.record_id("whoop", aid, aid, *parts)

        def source(self, aid):
            """The WHOOP the account syncs, minted once and then the owner's."""
            sid = self.oid(aid)
            if sid not in self.sources:
                self.host.effects.put(SOURCE, sid, if_absent=True, properties={
                    "name": "WHOOP", "class": "watch", "manufacturer": "WHOOP",
                    "account": ACCOUNT_T + "/" + aid})
                self.sources.add(sid)
            return SOURCE + "/" + sid

        def reconcile(self, origin, desired):
            """Write what one origin implies and delete what it no longer does."""
            counts = self.host.observed.reconcile(
                origin, {(kind, oid): props for kind, oid, props in desired},
                owned=MANAGED, adapter=ADAPTER)
            for key, n in counts.items():
                self.counts[key] += n

        def observation(self, oid, metric, form, origin, revision, **props):
            props.update({"metric": METRIC + "/" + metric, "form": form,
                          "origin": origin, "revision": revision})
            return (OBSERVATION, oid, props)

        def heart_rate(self, aid, key, origin, revision, score, period, common,
                       channel=None):
            """The average and maximum heart rate of a scored cycle or
            workout, one summary per statistic over its span."""
            out = []
            for field, statistic, role in HEART_RATE:
                value = self.obs.quantity(score.get(field), "/min")
                if value is not None:
                    out.append(self.observation(
                        self.oid(aid, key, role), HEART_RATE_METRIC, "summary", origin,
                        revision, value=value, statistic=statistic,
                        period=period, channel=channel, **common))
            return out

        # -- a cycle: strain, energy and heart rate, then its recoveries ------
        def cycle(self, rid, row):
            origin = CYCLE_T + "/" + rid
            desired = []
            if _live(row):
                p = _props(row)
                span = self.cycle_span(p)
                score = p.get("score") or {}
                for name in UNMAPPED[CYCLE_T]:
                    if score.get(name) is not None:
                        self.skip("cycle.score." + name)
                if span is not None and p.get("scoreState") == "scored":
                    aid, cid = self.obs.ref_id(p.get("account"), ACCOUNT_T), str(p.get("cycleId"))
                    common = {"source": self.source(aid), "periodId": cid,
                              "at": span[0], "endsAt": span[1],
                              "utcOffset": self.obs.utc_offset(p.get("timezoneOffset"))}
                    revision = self.seconds(p.get("updatedAt"))
                    for field, metric, unit, form, role in CYCLE_READINGS:
                        value = self.obs.quantity(score.get(field), unit)
                        if value is None:
                            continue
                        extra = {"statistic": "vendor", "period": "cycle"} if form == "summary" else {}
                        desired.append(self.observation(
                            self.oid(aid, cid, role), metric, form, origin, revision,
                            value=value, **extra, **common))
                    desired.extend(self.heart_rate(aid, cid, origin, revision, score,
                                                   "cycle", common))
            self.reconcile(origin, desired)
            # A recovery whose sleep is absent spans its cycle, so those of
            # the cycle's recoveries are rebuilt with it, a deleted cycle's
            # included. One whose sleep is live does not read the cycle.
            page = self.host.records.list(RECOVERY_T,
                                          where={"cycle": {"eq": rid}}, first=10)
            for rec in page.get("records") or []:
                self.recovery(str(rec.get("id") or ""), rec,
                              cycle=row if _live(row) else None, from_cycle=True)

        def cycle_span(self, p):
            """[at, endsAt] of a cycle, or None while it has no length yet."""
            return self.span(p.get("at"), p.get("endsAt") or p.get("updatedAt"))

        # -- a recovery: five summaries over the night it scores -------------
        def recovery(self, rid, row, cycle=None, from_cycle=False,
                     night=None, from_sleep=False):
            """The five readings of one recovery. `from_cycle` is a cycle
            delivery's rebuild, with `cycle` that cycle's current row, and
            leaves a recovery whose sleep is live to the sleep. `from_sleep`
            is a sleep delivery's, with `night` that sleep's current row."""
            origin = RECOVERY_T + "/" + rid
            desired = []
            if _live(row):
                p = _props(row)
                cp = None
                if not from_sleep:
                    sid = self.obs.ref_id(p.get("sleep"), SLEEP_T)
                    night = self.host.records.get(SLEEP_T, sid) if sid else None
                np = _props(night) if _live(night) else None
                span = self.sleep_span(np) if np is not None else None
                if span is not None and from_cycle:
                    return
                if span is not None:
                    common = {"period": "sleep", "periodId": str(np.get("sleepId")),
                              "utcOffset": self.obs.utc_offset(np.get("timezoneOffset"))}
                    revision = self.seconds(p.get("updatedAt"), np.get("updatedAt"))
                else:
                    if not from_cycle:
                        ref = self.obs.ref_id(p.get("cycle"), CYCLE_T)
                        cycle = self.host.records.get(CYCLE_T, ref) if ref else None
                    cp = _props(cycle) if _live(cycle) else None
                    span = self.cycle_span(cp) if cp is not None else None
                    if span is not None:
                        self.skip("recovery without its sleep")
                        common = {"period": "cycle", "periodId": str(cp.get("cycleId")),
                                  "utcOffset": self.obs.utc_offset(cp.get("timezoneOffset"))}
                        revision = self.seconds(p.get("updatedAt"), cp.get("updatedAt"))
                scored = span is not None and p.get("scoreState") == "scored"
                cid = self.cycle_id(p, cp) if scored else None
                if span is None:
                    self.skip("recovery without a sleep or cycle span")
                elif scored and cid is None:
                    # Every output id holds WHOOP's cycle id.
                    self.skip("recovery without a cycle id")
                elif scored:
                    score = p.get("score") or {}
                    aid = self.obs.ref_id(p.get("account"), ACCOUNT_T)
                    common.update({"source": self.source(aid), "statistic": "vendor",
                                   "at": span[0], "endsAt": span[1]})
                    for field, metric, unit, role in RECOVERY_READINGS:
                        value = self.obs.quantity(score.get(field), unit)
                        if value is None:
                            continue
                        extra = {}
                        if role == "recovery" and score.get("userCalibrating"):
                            # WHOOP's score is provisional while it learns the
                            # member's baseline.
                            extra["quality"] = "estimated"
                        desired.append(self.observation(
                            self.oid(aid, cid, role), metric, "summary",
                            origin, revision, value=value, **common, **extra))
            self.reconcile(origin, desired)

        def cycle_id(self, p, cp=None):
            """WHOOP's id of the cycle a recovery scores, as text: the
            recovery's own `cycleId`, or on a row written before the provider
            stored it, its cycle row's (`cp`, read here when not given). None
            when neither row holds it."""
            cid = p.get("cycleId")
            if cid in (None, ""):
                if cp is None:
                    ref = self.obs.ref_id(p.get("cycle"), CYCLE_T)
                    cycle = self.host.records.get(CYCLE_T, ref) if ref else None
                    cp = _props(cycle) if _live(cycle) else {}
                cid = cp.get("cycleId")
            return None if cid in (None, "") else str(cid)

        def sleep_span(self, p):
            """[at, endsAt] of a sleep, or None while it has no length."""
            return self.span(p.get("at"), p.get("endsAt"))

        # -- a sleep: the typed sleep, its stage totals and two scores -------
        def sleep(self, rid, row):
            origin = SLEEP_T + "/" + rid
            desired = []
            if _live(row):
                p = _props(row)
                aid, sid = self.obs.ref_id(p.get("account"), ACCOUNT_T), str(p.get("sleepId"))
                source = self.source(aid)
                revision = self.seconds(p.get("updatedAt"))
                offset = self.obs.utc_offset(p.get("timezoneOffset"))
                score = p.get("score") or {}
                stages = score.get("stageSummary") or {}
                scored = p.get("scoreState") == "scored"
                for name in UNMAPPED[SLEEP_T]:
                    if score.get(name) is not None:
                        self.skip("sleep.score." + name)
                for name in UNMAPPED_STAGES:
                    if stages.get(name) is not None:
                        self.skip("sleep.score.stageSummary." + name)
                typed = {"source": source, "origin": origin, "revision": revision,
                         "isNap": p.get("nap"), "utcOffsetStart": offset,
                         "utcOffsetEnd": offset, "at": p.get("at"),
                         "endsAt": p.get("endsAt"),
                         "name": self.obs.sleep_name(bool(p.get("nap")), self.obs.parse_instant(p.get("at")),
                                                     self.obs.parse_instant(p.get("endsAt")), offset, offset)}
                if scored:
                    asleep = 0
                    for field, code in STAGES:
                        ms = stages.get(field)
                        if ms is None:
                            continue
                        typed[code] = self.duration(ms)
                        if code != "awake":
                            asleep += int(ms)
                    if any(stages.get(f) is not None for f, c in STAGES if c != "awake"):
                        typed["timeAsleep"] = self.duration(asleep)
                    if stages.get("totalInBedTimeMilli") is not None:
                        typed["timeInBed"] = self.duration(stages["totalInBedTimeMilli"])
                    typed["efficiency"] = self.obs.quantity(
                        score.get("sleepEfficiencyPercentage"), "%")
                    typed["respiratoryRate"] = self.obs.quantity(
                        score.get("respiratoryRate"), "/min")
                    typed["disturbances"] = stages.get("disturbanceCount")
                    scores = {}
                    for field, key in (("sleepPerformancePercentage", "sleepPerformance"),
                                       ("sleepConsistencyPercentage", "sleepConsistency")):
                        if score.get(field) is not None:
                            scores[key] = self.obs.number(score[field])
                    typed["scores"] = scores or None
                desired.append((SLEEP, self.oid(aid, sid, "sleep"), typed))
                if scored and p.get("at") and p.get("endsAt"):
                    common = {"source": source, "periodId": sid, "at": p["at"],
                              "endsAt": p["endsAt"], "utcOffset": offset}
                    for field, code in STAGES:
                        ms = stages.get(field)
                        if ms is None:
                            continue
                        minutes = self.host.units.convert(int(ms), "ms", "min")
                        desired.append(self.observation(
                            self.oid(aid, sid, "stage", code), STAGE_METRIC, "amount",
                            origin, revision, code=code,
                            value={"value": minutes, "unit": self.host.units.canonical("min")},
                            **common))
                    for field, metric, unit, role in SLEEP_READINGS:
                        value = self.obs.quantity(score.get(field), unit)
                        if value is not None:
                            desired.append(self.observation(
                                self.oid(aid, sid, role), metric, "summary", origin, revision,
                                value=value, statistic="vendor", period="sleep",
                                **common))
            self.reconcile(origin, desired)
            # A recovery spans the sleep it scores, so the recoveries that
            # name this sleep are rebuilt with it, a deleted sleep's included.
            page = self.host.records.list(RECOVERY_T,
                                          where={"sleep": {"eq": rid}}, first=10)
            for rec in page.get("records") or []:
                self.recovery(str(rec.get("id") or ""), rec,
                              night=row if _live(row) else None, from_sleep=True)

        # -- a workout: the typed workout ------------------------------------
        def workout(self, rid, row):
            origin = WORKOUT_T + "/" + rid
            desired = []
            if _live(row):
                p = _props(row)
                aid, wid = self.obs.ref_id(p.get("account"), ACCOUNT_T), str(p.get("workoutId"))
                offset = self.obs.utc_offset(p.get("timezoneOffset"))
                score = p.get("score") or {}
                for name in UNMAPPED[WORKOUT_T]:
                    if score.get(name) is not None:
                        self.skip("workout.score." + name)
                name = p.get("sportName")
                typed = {"sport": SPORTS.get(str(name or "").strip().lower(), "other"),
                         "sportSource": name,
                         "source": self.source(aid), "origin": origin,
                         "revision": self.seconds(p.get("updatedAt")),
                         "utcOffsetStart": offset, "utcOffsetEnd": offset,
                         "at": p.get("at"), "endsAt": p.get("endsAt"),
                         "distance": self.obs.quantity(score.get("distanceMeter"), "m"),
                         "totalEnergy": self.obs.quantity(score.get("kilojoule"), "kJ"),
                         "averageHeartRate": self.obs.quantity(score.get("averageHeartRate"), "/min"),
                         "maxHeartRate": self.obs.quantity(score.get("maxHeartRate"), "/min"),
                         "elevationGain": self.obs.quantity(score.get("altitudeGainMeter"), "m"),
                         "strain": self.obs.number(score.get("strain"))}
                a, b = self.obs.parse_instant(p.get("at")), self.obs.parse_instant(p.get("endsAt"))
                typed["name"] = self.obs.workout_name(typed["sport"], a, offset)
                if a is not None and b is not None and b > a:
                    typed["duration"] = self.obs.duration(b - a)
                zones = {key: self.duration(score["zoneDurations"][field])
                         for field, key in ZONES
                         if (score.get("zoneDurations") or {}).get(field) is not None}
                typed["zoneDurations"] = zones or None
                desired.append((WORKOUT, self.oid(aid, wid, "workout"), typed))
                if p.get("scoreState") == "scored" and "duration" in typed:
                    common = {"source": typed["source"], "periodId": wid,
                              "at": p["at"], "endsAt": p["endsAt"], "utcOffset": offset}
                    desired.extend(self.heart_rate(
                        aid, wid, origin, typed["revision"], score,
                        "workout", common, channel="workout"))
            self.reconcile(origin, desired)


    def main(input, host):
        envelope = input.get("envelope") or {}
        change = envelope.get("change") or {}
        kind, rid = change.get("kind") or "", change.get("id") or ""
        row = envelope.get("record")
        run = _Run(host)
        if not rid or kind not in (CYCLE_T, RECOVERY_T, SLEEP_T, WORKOUT_T):
            return {"output": {"skipped": "not a WHOOP cycle, recovery, sleep or "
                                          "workout row"}}
        if _live(row) and not host.observed.ref_id(_props(row).get("account"), ACCOUNT_T):
            # Every id below starts with the account's: a row that names no
            # WHOOP account would compose `whoop//...`.
            return {"output": {"skipped": "the row names no WHOOP account"}}
        if kind == CYCLE_T:
            run.cycle(rid, row)
        elif kind == RECOVERY_T:
            run.recovery(rid, row)
        elif kind == SLEEP_T:
            run.sleep(rid, row)
        else:
            run.workout(rid, row)
        out = {"origin": kind + "/" + rid, "skipped": run.skipped}
        out.update(run.counts)
        return {"output": out}
