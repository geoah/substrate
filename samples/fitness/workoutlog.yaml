# one occurrence of a recurring workout, done or skipped
kind: substrate.reamde.dev/core/kind
metadata:
  id: samples.substrate.reamde.dev/fitness/workoutlog
data:
  authority: samples.substrate.reamde.dev
  package: fitness
  description: >-
    The done-or-skipped mark against one occurrence of a recurring workout.
    There is deliberately no missed state: absence in the logs is what missed
    means, so a reader computes it from the RRULE. What was actually lifted
    lives on the workout's sets, not here.
  names:
    singular: workoutlog
  displayTemplate: "{status}"
  # `at` is when the occurrence was done or the skip was recorded.
  # `occurrencelog` contracts status/scheduledAt/details and the
  # absence-means-missed semantics; the flip states stay here (a trait carries
  # no values).
  traits:
    - temporal(point)
    - occurrencelog
  properties:
    status:
      type: state
      description: "done or skipped; correcting a mis-tap flips it back"
      states:
        - done
        - skipped
      initial: done
      transitions:
        - from: done
          to: skipped
        - from: skipped
          to: done
    scheduledAt:
      type: datetime
      description: the occurrence this log answers, from expanding the RRULE
    details:
      type: markdown
      description: anything worth saying about this occurrence, as prose
    workout:
      type: reference
      kind: workout
      required: true
      mustExist: true
      onDelete: cascade
      description: the recurring workout this log marks an occurrence of
