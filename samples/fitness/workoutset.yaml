# one set inside a workout
kind: substrate.reamde.dev/core/kind
metadata:
  id: samples.substrate.reamde.dev/fitness/workoutset
data:
  authority: samples.substrate.reamde.dev
  package: fitness
  description: >-
    One set inside a workout: which exercise, how heavy, how many, how it
    felt. The set carries the numbers so the exercise catalog and the workout
    itself stay thin.
  names:
    singular: workoutset
  displayTemplate: "{number}"
  # `at` is when the set was performed, for pacing between sets.
  traits:
    - temporal(point)
  properties:
    number:
      type: int
      description: the set's position within its workout
    setType:
      type: enum
      description: what kind of set it was
      values:
        - normal
        - warmup
        - dropset
        - value: amrap
          label: AMRAP
        - failure
    weightKg:
      type: float
      description: the load moved, in kilograms
    reps:
      type: int
      description: how many repetitions
    duration:
      type: duration
      description: how long a timed set was held or performed
    distanceMeters:
      type: float
      description: distance covered by a distance set, in meters
    rpe:
      type: float
      description: rate of perceived exertion, out of 10
    workout:
      type: reference
      kind: workout
      required: true
      mustExist: true
      onDelete: cascade
      description: the workout this set belongs to
    exercise:
      type: reference
      kind: exercise
      mustExist: true
      description: the movement performed
