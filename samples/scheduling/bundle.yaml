# The shared scheduling vocabulary: `occurrencelog`, the done-or-skipped mark
# against one occurrence of a recurring thing. The trait carries no values,
# only property presence and datatype, so a binding kind keeps its own enum
# states and its own owner reference.
#
# `recurring` used to live here too (versions 1 to 3). It is core's now,
# beside `temporal`, so a provider's series can bind it and the window read
# keys on one identity: a kind that binds the bare name `recurring` resolves
# to core's, and a repository that still holds this package's copy from an
# earlier import keeps it declared, shadowed and inert until it takes this
# version, which drops it.
#
# It ships no kinds, only the trait, so the two packages that repeat things
# (tasks and calendar) `require` it and bind it cross-package, the way every
# package binds core's `temporal`.
#
# no new actors: writes arrive under the actor of whatever runs.
kind: substrate.reamde.dev/core/package
metadata:
  id: samples.substrate.reamde.dev/scheduling
data:
  authority: samples.substrate.reamde.dev
  package: scheduling
  version: 4
---
# ---- the bundle document: the import unit -----------------------------------
# A SAMPLE bundle: a trait only, imported from the registry. The `installs`
# closure is the package's members, which for a traits-only package is the
# trait.
kind: substrate.reamde.dev/core/bundle
metadata:
  id: samples.substrate.reamde.dev/scheduling
data:
  authority: samples.substrate.reamde.dev
  package: scheduling
  description: >-
    Done or skipped marks against the occurrences of anything that repeats,
    spelled one way for tasks and calendar events. It adds no kinds of its
    own: import it because tasks or calendar needs it.
  installs:
    - samples.substrate.reamde.dev/scheduling/occurrencelog
