# one observed value: a weighing, a door opening, a nightly HRV, a vendor's
# recovery score. Binds core's `observed(single)`, so every write is held to
# the trait's rules (docs/observations.md) and the observed index reads it;
# binds `temporal(range)` beside it so the window read and every timeline
# query cover it.
#
# The trait's properties are declared here with this package's descriptions.
# `form` and `resetRule` are strings with listed values rather than enums
# because the trait contracts a string. The trait's list includes the reading
# as received when it could not be normalized, why a value is absent, and the
# provider record an adapter built the value from. Everything below it is
# this kind's own: the period identity a vendor keeps, coded context and
# derivation.
kind: substrate.reamde.dev/core/kind
metadata:
  id: samples.substrate.reamde.dev/observations/observation
data:
  authority: samples.substrate.reamde.dev
  package: observations
  description: >-
    One measured value, such as a weighing, a door opening or a nightly heart
    rate variability. It belongs to one metric, one source and one thing observed;
    the value is a number with its unit or a code, and its form says how it
    may be added up or averaged.
  purpose: supporting
  names:
    singular: observation
  traits:
    - substrate.reamde.dev/core/temporal(range)
    - substrate.reamde.dev/core/observed(single)
  displayTemplate: "{metric} {value|code|sourceValue|absentReason}"
  indices:
    - properties:
        - metric
        - at
  # `measure` was the measure the engine's unit table read the unit as,
  # which the unit graph does not have (decision record 0186)
  retired:
    properties:
      - measure
  properties:
    # ---- the observed(single) contract ----
    metric:
      type: reference
      kind: samples.substrate.reamde.dev/observations/metric
      required: true
      mustExist: true
      description: what was measured
    source:
      type: reference
      kind: samples.substrate.reamde.dev/observations/source
      description: the device, app, service or lab that produced the value
    # any kind: a room, a car, a plant, a person. Never cascades: deleting the
    # thing leaves its readings (decision record 0155).
    about:
      type: reference
      kind: any
      description: the thing observed; absent means the repository's owner
    channel:
      type: string
      description: which of a source's channels this is, where one source
        measures one metric twice
    form:
      type: string
      required: true
      description: gauge, amount, counter or summary
      values:
        - gauge
        - amount
        - counter
        - summary
    value:
      type: quantity
      description: the number and its unit
    code:
      type: string
      description: the categorical value instead of a number, such as open
        or rem
    statistic:
      type: string
      description: for a summary, the statistic it is; vendor for a vendor's
        own method
      values:
        - sum
        - avg
        - min
        - max
        - first
        - last
        - count
        - median
        - stddev
        - vendor
    period:
      type: string
      description: for a summary, the period it covers, such as day, night,
        cycle or session
    hold:
      type: duration
      description: for a gauge, how long the value stands without a newer
        one
    resetRule:
      type: string
      description: for a counter, its contract, monotonic, signed or wrap
      values:
        - monotonic
        - signed
        - wrap
    resetAt:
      type: datetime
      description: for a counter, when the current accumulation began
    delta:
      type: bool
      description: true when the value is a temperature difference, such as
        a deviation
    circular:
      type: bool
      description: true when the value is an angle averaged on the circle,
        such as a wind direction
    wrapAt:
      type: decimal
      description: for a wrapping counter, the value it wraps to zero at
    utcOffset:
      type: int
      min: -1080
      max: 1080
      description: minutes east of UTC where the value was observed
    sourceValue:
      type: string
      description: the reading as received, kept when it could not be normalized
    sourceUnit:
      type: string
      description: the unit as received
    # FHIR's data-absent-reason list (unknown, not-performed, error, ...) is
    # the guide; a lab's own word such as cancelled is kept as sent.
    absentReason:
      type: string
      description: why there is no value, such as not-performed or error
    origin:
      type: reference
      kind: any
      description: the provider record that delivered this value
    revision:
      type: int
      min: 0
      description: rises with each rewrite from the upstream; a lower one
        is refused
    # ---- this kind's own ----
    # Apart from `revision` (decision record 0162): an adapter fix rewrites
    # output whose upstream did not change, and this says which code did.
    adapter:
      type: string
      description: the function and version that wrote this row from its origin,
        `<package>@<version>`
    # the source's own identity for a summary's period: the WHOOP cycle id, the
    # Oura day. Two cycles on one date stay two rows.
    periodId:
      type: string
      description: the source's own identity for the period a summary covers
    denominator:
      type: string
      description: what a duration statistic is per, such as per night or
        per day
    qualifiers:
      type: object
      repeated: true
      description: coded context, such as after a meal, lying down or with
        the window open
      fields:
        system:
          type: string
          description: the code system
        code:
          type: string
          description: the code
    components:
      type: object
      repeated: true
      description: the parts of a value measured together, such as a blood
        pressure's two numbers
      fields:
        metric:
          type: reference
          kind: samples.substrate.reamde.dev/observations/metric
          description: the part's metric
        value:
          type: quantity
          description: the part's number and unit
    normalizationFailure:
      type: string
      description: why the reading could not be normalized, such as unknown-unit
    quality:
      type: enum
      description: how far the value can be trusted; unavailable when the
        source had none to give
      values:
        - valid
        - estimated
        - questionable
        - stale
        - validated
        - unavailable
    issuedAt:
      type: datetime
      description: when the value became known, for a late result or a vendor
        recomputation
    recordingMethod:
      type: enum
      description: how the value was taken
      values:
        - automatic
        - active
        - manual
    derivedFrom:
      type: reference
      kind: any
      repeated: true
      description: the records this value was computed from
    conversion:
      type: object
      description: how a derived value was computed from the one it came from
      fields:
        formula:
          type: string
          description: the formula's id, such as molar-mass
        parameters:
          type: decimal
          keyed: true
          description: the formula's inputs by name
        version:
          type: string
          description: the formula's version
