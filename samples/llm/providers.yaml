# The provider rows, as DATA — ordinary records the install PUTs after the
# closure lands, editable and deletable like anything else.
#
# A new repository is already seeded with these three, keyless. Shipping them
# here keeps a later import of this bundle self-contained: the PUTs merge onto
# the seed (or write the rows on a repository born before the seed existed).
# Shipped sample agents name `openai`.
#
# None carries prices. The models each row offers, and what they cost, are
# the llm/model records the seeded llm package ships beside its declarations
# (decision record 0242), so a price fix reaches every repository with the
# binary instead of staying in whichever row an import wrote first.
#
# All three ship WITHOUT a key. `apiKey` is secret-typed: it reads back
# redacted from every API and never appears in a changelog payload, so the
# only way one arrives is you writing it. Until then an agent naming the row
# refuses at dispatch, saying which row it wanted.
kind: substrate.reamde.dev/llm/provider
metadata:
  id: openai
data:
  properties:
    label: OpenAI
    wire: openai
    baseURL: https://api.openai.com/v1
    # No reasoningEffort default: the accepted set is the MODEL's, not the
    # row's, and one row serves several. gpt-5 takes minimal..high and refuses
    # `none`; the gpt-5.6 family takes `none` and needs it to put function
    # tools on a chat completion. An agent names what its own model accepts.
    # OpenAI's own endpoint takes prompt_cache_key, so a thread's calls are
    # routed to the cache that holds its prompt. Another openai-wire endpoint
    # may refuse the field, which is why it is the row's to switch on.
    cache:
      key: true
---
# Anthropic, natively.
kind: substrate.reamde.dev/llm/provider
metadata:
  id: anthropic
data:
  properties:
    label: Anthropic
    wire: anthropic
    # The SDK resolves `v1/messages` against this, so the trailing slash is
    # load-bearing.
    baseURL: https://api.anthropic.com/
---
# Gemini on Google's OpenAI-compatible endpoint. Same wire as openai, different
# baseURL — the row is data, not a new adapter.
kind: substrate.reamde.dev/llm/provider
metadata:
  id: gemini
data:
  properties:
    label: Gemini
    wire: openai
    baseURL: https://generativelanguage.googleapis.com/v1beta/openai
