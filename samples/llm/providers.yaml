# The provider rows, as DATA — ordinary records the install PUTs after the
# closure lands, editable and deletable like anything else.
#
# A new repository is already seeded with these three, keyless. Shipping them
# here keeps a later import of this bundle self-contained: the PUTs merge onto
# the seed (or write the rows on a repository born before the seed existed).
# Shipped sample agents name `openai`.
#
# All three ship WITHOUT a key. `apiKey` is secret-typed: it reads back
# redacted from every API and never appears in a changelog payload, so the
# only way one arrives is you writing it. Until then an agent naming the row
# refuses at dispatch, saying which row it wanted.
kind: substrate.reamde.dev/llm/provider
metadata:
  id: openai
data:
  properties:
    label: openai
    wire: openai
    baseURL: https://api.openai.com/v1
    # No reasoningEffort default: the accepted set is the MODEL's, not the
    # row's, and one row serves several. gpt-5 takes minimal..high and refuses
    # `none`; the gpt-5.6 family takes `none` and needs it to put function
    # tools on a chat completion. An agent names what its own model accepts.
    # OpenAI's own endpoint takes prompt_cache_key, so a thread's calls are
    # routed to the cache that holds its prompt. Another openai-wire endpoint
    # may refuse the field, which is why it is the row's to switch on.
    cache:
      key: true
    # contextWindow is the model's window in tokens: what lets a thread on
    # that model compact (docs/agents.md). A model without one never compacts.
    pricing:
      - model: gpt-5
        inputPer1M: "1.25"
        outputPer1M: "10"
        contextWindow: 400000
      - model: gpt-5-mini
        inputPer1M: "0.25"
        outputPer1M: "2"
        contextWindow: 400000
---
# Anthropic, natively.
kind: substrate.reamde.dev/llm/provider
metadata:
  id: anthropic
data:
  properties:
    label: anthropic
    wire: anthropic
    # The SDK resolves `v1/messages` against this, so the trailing slash is
    # load-bearing.
    baseURL: https://api.anthropic.com/
    # Anthropic's list prices. A row without cacheReadPer1M or
    # cacheWritePer1M is charged a tenth and 1.25 times inputPer1M for them
    # (decision record 0181); Opus 5.5 reads at a twentieth, so its rate is
    # stated. Haiku 5.5's prices hold up to 100K prompt tokens and are five
    # times higher past it, so its contextWindow is 100000: compaction keeps a
    # thread under the tier, though one tool-heavy turn can still cross it.
    pricing:
      - model: claude-opus-5-5
        inputPer1M: "4"
        outputPer1M: "20"
        cacheReadPer1M: "0.20"
        contextWindow: 200000
      - model: claude-opus-5
        inputPer1M: "5"
        outputPer1M: "25"
        contextWindow: 200000
      - model: claude-sonnet-5-5
        inputPer1M: "2"
        outputPer1M: "10"
        cacheReadPer1M: "0.20"
        contextWindow: 200000
      - model: claude-sonnet-5
        inputPer1M: "2"
        outputPer1M: "10"
        cacheReadPer1M: "0.20"
        contextWindow: 200000
      - model: claude-haiku-5-5
        inputPer1M: "0.10"
        outputPer1M: "0.50"
        cacheReadPer1M: "0.01"
        contextWindow: 100000
      - model: claude-haiku-4-5
        inputPer1M: "1"
        outputPer1M: "5"
        cacheReadPer1M: "0.10"
        contextWindow: 200000
---
# Gemini on Google's OpenAI-compatible endpoint. Same wire as openai, different
# baseURL — the row is data, not a new adapter.
kind: substrate.reamde.dev/llm/provider
metadata:
  id: gemini
data:
  properties:
    label: gemini
    wire: openai
    baseURL: https://generativelanguage.googleapis.com/v1beta/openai
    pricing:
      - model: gemini-2.5-pro
        inputPer1M: "1.25"
        outputPer1M: "10"
        contextWindow: 1048576
      - model: gemini-2.5-flash
        inputPer1M: "0.15"
        outputPer1M: "0.60"
        contextWindow: 1048576
