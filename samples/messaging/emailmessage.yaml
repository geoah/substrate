# one mail message in a thread
kind: substrate.reamde.dev/core/kind
metadata:
  id: samples.substrate.reamde.dev/messaging/emailmessage
data:
  authority: samples.substrate.reamde.dev
  package: messaging
  description: >-
    One mail message in a thread: subject, preview, body, the provider's label
    ids, and the people it came from and went to. To, cc and bcc are not distinguished
    — `recipients` declares no link data, so every addressee is a recipient.
  names:
    singular: emailmessage
  traits:
    - temporal(point)
  # subject alone: the sender lands on an address-born person whose name may
  # never arrive, and a template's literal separator renders even when its
  # token is empty — "{sender.name}: …" showed ": hi" for every mail.
  displayTemplate: "{subject}"
  properties:
    subject:
      type: string
      description: the subject header
    # the provider's own preview line (JMAP `preview`), kept as written. Not
    # called `snippet`: that is the display-template engine's reserved token
    # for the computed excerpt, and a property may not shadow it.
    preview:
      type: string
      description: the provider's own preview line, kept as written
    text:
      type: markdown
      embed: true
      description: the message body, as markdown
    # the provider's label ids, verbatim (wave-2 GOOGLE.md §2.2): a reference to
    # the connector's own label type would point core vocabulary at a package
    # that only exists once a connector is installed, so the ids stay plain
    # strings and readers join on them.
    labelIds:
      type: string
      repeated: true
      description: the provider's label ids on this message, verbatim
    read:
      type: bool
      description: the owner has read it, as the provider reports
    thread:
      type: reference
      kind: emailthread
      required: true
      mustExist: true
      onDelete: cascade
      description: the thread this message belongs to
    sender:
      type: reference
      kind: person
      mustExist: true
      description: the person the from header resolves to
    # one reference for every addressee: to/cc/bcc is a distinction the
    # substrate does not carry, because `recipients` declares no link data.
    recipients:
      type: reference
      kind: person
      repeated: true
      mustExist: true
      description: every addressee; to/cc/bcc is not carried
