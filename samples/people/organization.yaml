# an org a person belongs to: employer, workspace, publisher
kind: substrate.reamde.dev/core/kind
metadata:
  id: samples.substrate.reamde.dev/people/organization
data:
  authority: samples.substrate.reamde.dev
  package: people
  description: >-
    A corporate body a person belongs to: employer, workspace, publisher,
    studio, network, label. Which of those it is depends on the reference
    pointing at it, not on a second kind, and nothing matches on the domain
    — grouping contacts under one is deliberate.
  names:
    singular: organization
  # one type for every corporate body — which of the many it is (employer,
  # workspace, publisher, studio, network, label) depends on the reference
  # pointing at it, exactly as with roles on `person`.
  displayTemplate: "{name}"
  properties:
    name:
      type: string
      description: the organization's name
    # the DNS domain, `acme.com`. An ordinary property: nothing matches on it,
    # so gathering every `@acme.com` contact under one organization is a
    # deliberate act, not something the engine does by itself.
    domain:
      type: string
      description: the DNS domain, acme.com; nothing matches on it
