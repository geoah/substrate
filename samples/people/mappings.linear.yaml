# A SUGGESTED MAPPING: Linear's user mirror onto this package's person. The
# import drops it while providers.substrate.reamde.dev/linear is absent, and
# lands it on the next import once the provider is installed
# (docs/decisions/0049). An issue's assignee is a reference at `linear/user`
# since linear 15, so the issue needs no mapping of its own: it reaches the
# person through the user mirror.
#
# user → person: match probes the login address against people's emails,
# exactly one live match links it and zero-or-many mints a person shell. map
# copies the names and unions the address onto the person (machine-managed,
# yielding to any owner edit).
kind: substrate.reamde.dev/core/recordmapping
metadata:
  id: samples.substrate.reamde.dev/people/linearuserperson
data:
  authority: samples.substrate.reamde.dev
  package: people
  description: >-
    Converges a Linear workspace member onto the person it belongs to, matched
    on the login address.
  from: providers.substrate.reamde.dev/linear/user
  to: samples.substrate.reamde.dev/people/person
  property: person
  match:
    - from: email
      to: emails
  map:
    name:
      path: name
    displayName:
      path: displayName
    emails:
      path: email
      merge: union
