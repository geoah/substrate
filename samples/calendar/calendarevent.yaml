# always a CONCRETE occurrence; connectors explode series into these
kind: substrate.reamde.dev/core/kind
metadata:
  id: samples.substrate.reamde.dev/calendar/calendarevent
data:
  authority: samples.substrate.reamde.dev
  package: calendar
  description: >-
    An event on your calendar. One concrete occurrence on the timeline — title,
    location, prose, the join link, and who is coming. Connectors explode
    recurring definitions into these, and a cancelled event is DELETED rather
    than flagged, so a reader never has to filter tombstones.
  names:
    singular: calendarevent
  # `override` (core's) is how one occurrence of a series is moved or edited:
  # this row points at the series through `recurrenceOf` and names the slot
  # it replaces in `originalAt`, and the window read subtracts that slot from
  # the series' expansion. A calendarevent with neither is a plain event.
  traits:
    - substrate.reamde.dev/core/temporal(range)
    - substrate.reamde.dev/core/override
  displayTemplate: "{summary}"
  properties:
    # iCalendar's SUMMARY/LOCATION/DESCRIPTION, kept under their own names.
    summary:
      type: string
      description: iCalendar's SUMMARY — the event's title line
    location:
      type: string
      description: iCalendar's LOCATION, as written
    description:
      type: markdown
      embed: true
      description: iCalendar's DESCRIPTION — the event's prose
    # the provider's lifecycle value, confirmed or tentative ONLY: a
    # cancelled event is a DELETE of this record — connectors retract, so a
    # reader never filters tombstones.
    status:
      type: string
      description: confirmed or tentative; a cancelled event is deleted instead
    meetingURL:
      type: url
      description: the video-conference join link, when the event carries
        one
    # DEPRECATED: the slot an override replaces is the trait's `originalAt`.
    # Declared still, because dropping a property a live row may hold is a
    # narrowing the upgrade refuses.
    originalStartAt:
      deprecated: true
      type: datetime
      description: "deprecated: the slot this occurrence replaces is `originalAt`"
    # The override pair, core's `override` trait: the series this row
    # replaces one slot of, and that slot. No cascade: shortening or replacing
    # a series must not take the hand-written override along.
    recurrenceOf:
      type: reference
      kind: samples.substrate.reamde.dev/calendar/calendareventseries
      mustExist: true
      description: the series this occurrence replaces one slot of
    originalAt:
      type: datetime
      description: the slot the rule produced, which this occurrence replaces
    eventType:
      type: string
      description: the provider's event kind — default, outOfOffice, focusTime,
        workingLocation
    calendar:
      type: reference
      kind: samples.substrate.reamde.dev/calendar/calendar
      required: true
      mustExist: true
      onDelete: cascade
      description: the calendar this occurrence lives in
    # DEPRECATED: an occurrence of a series is either computed by the window
    # read from the series' rule, or an override pointing at it through
    # `recurrenceOf`. Nothing explodes a series into rows any more.
    series:
      deprecated: true
      type: reference
      kind: samples.substrate.reamde.dev/calendar/calendareventseries
      mustExist: true
      description: "deprecated: an override names its series in `recurrenceOf`"
    attendees:
      type: reference
      kind: samples.substrate.reamde.dev/people/person
      repeated: true
      mustExist: true
      description: the people attending
    organizer:
      type: reference
      kind: samples.substrate.reamde.dev/people/person
      mustExist: true
      description: the person who organized it
