# The shipped vocabulary, subsystem 3: what happens when. Shipped, but not
# SEEDED — a SAMPLE BUNDLE a repository imports (the bundle document is at
# the foot of this file), and it requires people. The family prefix
# rule does the work here — `calendarevent` and `calendareventseries` both
# carry `calendar`, so neither can be read as some other subsystem's event,
# and the recurring DEFINITION is visibly the series of the event.
#
# Attendees, organizers and speakers are `person` in samples.substrate.reamde.dev/people, never
# a per-source record: an attendee reference names the person, and one that
# names a source record instead lands on the person that record points at, in
# one hop (§6.2). The account is a bundle-owned accountconfig record (ruling A12; the
# retired `connectoraccount` core kind is gone); `temporal` is
# core's trait.
#
# no new actors: the doors and the substrate ship with core; an installed
# package's writes arrive under the actor of whatever runs — a bundle function
# writes as `function:<authority>:<package>:<name>` — so nothing here declares
# an actor.
kind: substrate.reamde.dev/core/package
metadata:
  id: samples.substrate.reamde.dev/calendar
data:
  authority: samples.substrate.reamde.dev
  package: calendar
  # version 3: `calendareventseries` binds `recurring`, replacing the copied
  # recurrence/exdates/timezone triple (#122).
  # version 5: the series slice's storage. `calendareventseries` gains
  # `rdates` (the trait moved) and `startsAt` (the rule's DTSTART anchor);
  # `calendarevent` gains `originalStartAt`, the instant the rule produced
  # before a connector's override moved the occurrence.
  # version 6: `calendareventseries` gains `materializedFrom` /
  # `materializedUntil`, the span whose occurrences exist as rows, so the
  # occurrences read (decision 0043) expands the rule only outside it.
  # version 7: every declared link in this closure is a reference property,
  # carrying `mustExist: true` and `onDelete: cascade` where the referent
  # owns the record.
  version: 7
---
# ---- the bundle document: the import unit -------------------------------------
# A SAMPLE bundle (see samples.substrate.reamde.dev/people): kinds only, imported from the
# registry rather than seeded. Attendees, organizers and speakers are people,
# so it requires that package to be present first.
kind: substrate.reamde.dev/core/bundle
metadata:
  id: samples.substrate.reamde.dev/calendar
data:
  authority: samples.substrate.reamde.dev
  package: calendar
  description: >-
    Calendars, events, recurring event series and meeting transcripts — what
    happens when, with attendees pointing at people.
  requires:
    - samples.substrate.reamde.dev/people
    - samples.substrate.reamde.dev/scheduling
  installs:
    - samples.substrate.reamde.dev/calendar/calendar
    - samples.substrate.reamde.dev/calendar/calendarevent
    - samples.substrate.reamde.dev/calendar/calendareventseries
    - samples.substrate.reamde.dev/calendar/transcript
