# a meeting transcript, pointed at the instance that actually happened
kind: substrate.reamde.dev/core/kind
metadata:
  id: samples.substrate.reamde.dev/calendar/transcript
data:
  authority: samples.substrate.reamde.dev
  package: calendar
  description: >-
    A meeting's transcript, pointed at the occurrence that actually happened
    and the people who spoke. The text is embedded, so what was said in a
    meeting is searchable alongside everything else rather than only scrollable.
  # The declaration inherited the package's version before this pin.
  # version 2: `name` is the heading, declared. A transcript used to hold it
  # in the built-in title slot, which is not a kind's storage (#123).
  # version 4: `meeting` and `speakers` are reference properties, carrying
  # `mustExist: true`.
  version: 4
  names:
    singular: transcript
  traits:
    - temporal(range)
  # `title` is the LEGACY alternative, not a second spelling to write:
  # transcripts written before `name` existed hold their heading in the
  # built-in title column, and reading it keeps them titled instead of
  # blanking them on their next write. Decision record 0016 has what that
  # costs; it goes when the column does (#68).
  displayTemplate: "{name|title}"
  properties:
    # what the transcript is of, in one line: usually the meeting's own
    # title, copied by whatever produced the transcript.
    name:
      type: string
      description: the transcript's heading, one line
    # a plain string rather than an enum: transcript tools appear faster
    # than any fixed list would keep up with.
    source:
      type: string
      description: the tool that produced it, as it names itself
    language:
      type: string
      description: the transcript's language, as a BCP 47 tag
    text:
      type: text
      embed: true
      description: the transcript's full text
    meeting:
      type: reference
      kind: calendarevent
      mustExist: true
      description: the occurrence that actually happened
    speakers:
      type: reference
      kind: person
      repeated: true
      mustExist: true
      description: the people who spoke
