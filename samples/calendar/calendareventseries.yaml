# the recurring DEFINITION — RRULE and exceptions; on the timeline only
# through the occurrences the window read computes from it
kind: substrate.reamde.dev/core/kind
metadata:
  id: samples.substrate.reamde.dev/calendar/calendareventseries
data:
  authority: samples.substrate.reamde.dev
  package: calendar
  description: >-
    The recurring DEFINITION behind repeating events: its RRULE, the dates
    that rule skips and the first occurrence it counts from. The substrate
    stores the rule and never expands it into rows; a records read that bounds
    `at` computes its occurrences beside the calendarevents that override
    them.
  names:
    singular: calendareventseries
  displayTemplate: "{summary}"
  # `recurring` (core's) contracts the recurrence/rdates/exdates/timezone
  # quartet and requires `temporal`: the bound `at` is the rule's DTSTART, the
  # first occurrence, which is what anchors every other one.
  traits:
    - substrate.reamde.dev/core/temporal(point)
    - substrate.reamde.dev/core/recurring
  properties:
    summary:
      type: string
      description: the series' title line
    # the substrate stores an RRULE and never expands it: occurrences arrive
    # as `calendarevent`s from the connector that exploded them.
    recurrence:
      type: recurrence
      description: the RRULE, stored and never expanded
    exdates:
      type: datetime
      repeated: true
      description: occurrence datetimes the rule skips
    rdates:
      type: datetime
      repeated: true
      description: extra occurrence datetimes beside the rule (iCalendar's
        RDATE)
    timezone:
      type: timezone
      description: the IANA zone a time-of-day rule resolves in
    # DEPRECATED: the anchor is the bound `at` now (the temporal slot every
    # series carries). Declared still, because dropping a property a live row
    # may hold is a narrowing the upgrade refuses; nothing reads it.
    startsAt:
      deprecated: true
      type: datetime
      description: "deprecated: the instant the rule counts from is `at`"
    # DEPRECATED: the materialized span that decision 0043 introduced has no
    # reader since the window read computes occurrences beside the rows and
    # subtracts every slot an override claims; a twin can no longer appear.
    materializedFrom:
      deprecated: true
      type: datetime
      description: "deprecated: no read consults the materialized span"
    materializedUntil:
      deprecated: true
      type: datetime
      description: "deprecated: no read consults the materialized span"
    calendar:
      type: reference
      kind: samples.substrate.reamde.dev/calendar/calendar
      required: true
      mustExist: true
      onDelete: cascade
      description: the calendar the series lives in
