# The URL-harvester's delivery wiring — ordinary DATA records of core's
# `trigger` kind (console-editable, changelog-visible, substratectl get/apply/
# delete like anything else). Each trigger binds one source to one callable.
#
#   message  --findurls-->  page(pending)
#   page(create,pending)  --fetchpage-->  page(fetched)
#   page(update,fetched & unclassified)  --pageclassifier-->  class + proposal
#   weekly schedule  --weeklyrollup-->  digest proposal
# findurls fires on any conversationmessage create/update.
kind: substrate.reamde.dev/core/trigger
metadata:
  id: web-findurls-on-message
data:
  properties:
    enabled: true
    source:
      record:
        kinds: [samples.substrate.reamde.dev/messaging/conversationmessage]
        ops: [create, update]
    callable: substrate.reamde.dev/core/function/samples.substrate.reamde.dev/web/findurls
---
# fetchpage fires when a page is born pending.
kind: substrate.reamde.dev/core/trigger
metadata:
  id: web-fetch-on-page
data:
  properties:
    enabled: true
    source:
      record:
        kinds: [samples.substrate.reamde.dev/web/page]
        ops: [create]
        when: 'record != null && record.properties.fetch == "pending"'
    callable: substrate.reamde.dev/core/function/samples.substrate.reamde.dev/web/fetchpage
---
# the classifier fires when a fetched page is still unclassified.
kind: substrate.reamde.dev/core/trigger
metadata:
  id: web-classify-on-page
data:
  properties:
    enabled: true
    source:
      record:
        kinds: [samples.substrate.reamde.dev/web/page]
        ops: [update]
        when: 'record != null && record.properties.fetch == "fetched" && !("class"
          in record.properties)'
    callable: substrate.reamde.dev/core/agent/samples.substrate.reamde.dev/web/pageclassifier
---
# the weekly rollup fires on a schedule, no changelog row underneath.
kind: substrate.reamde.dev/core/trigger
metadata:
  id: web-rollup-weekly
data:
  properties:
    enabled: true
    source:
      schedule:
        recurrence: "FREQ=WEEKLY;BYDAY=MO"
        timezone: Europe/London
        # a fixed past anchor, so every Monday since is a well-defined
        # occurrence (occurrences are computed forward from startsAt).
        startsAt: "2025-01-06T09:00:00Z"
    callable: substrate.reamde.dev/core/agent/samples.substrate.reamde.dev/web/weeklyrollup
