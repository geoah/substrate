<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The guest's policy, the same in dev and in a build. A production
      deployment sends it as a header too (with `frame-ancestors 'self'` and
      `sandbox allow-scripts`, which a meta policy cannot carry); the meta is
      what holds under `vite dev` and what the document rewrite keeps, since
      `document.open()` replaces the tree and not the policy container.
      `script-src 'self'` admits vite's module URLs and the built SDK because
      CSP3 resolves 'self' from the document's URL, not its opaque origin.
      `blob:` in `script-src` is what lets a transformed module be imported as
      a module rather than inlined as text: the shell mints one blob URL per
      module and the bootstrap `import()`s the entry. It widens nothing,
      because a blob URL can be minted only by the guest's own script, which
      already runs under 'unsafe-inline', and the one thing a blob script
      could do that an inline one cannot, spawn a worker, is closed by
      `worker-src 'none'`. `connect-src 'none'` closes fetch, XHR, WebSocket
      and beacons; `img-src` without a host closes the image beacon;
      `font-src 'self'` admits the console's own font and nothing off-origin.
      The one dev-only effect is noise: vite's HMR client, injected into every
      page it serves, is refused its WebSocket by this same policy and says so
      in the frame's console.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline' blob:; style-src 'unsafe-inline'; img-src data: blob:; font-src 'self'; connect-src 'none'; worker-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Substrate app</title>
    <script type="module" src="/src/frame/main.ts"></script>
  </head>
  <body></body>
</html>
