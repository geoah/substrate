[tools]
go = "1.26.5"
node = "22.12.0"
pnpm = "9.14.2"
golangci-lint = "2.12.2"
# The YAML formatter. The vocabulary IS YAML — `kinds/` is the contract as
# files — so its shape is reviewed as often as Go is, and `fmt:check` fails on
# it the same way. Config is .yamlfmt.
yamlfmt = "0.21.0"
# The YAML linter, for the one rule a formatter cannot hold: no flow mappings.
# `metadata: {id: x}` and `metadata:\n  id: x` are the same document, so no
# formatter rewrites one into the other — but only one of them is what this
# tree writes. Config is .yamllint. It is a Python tool, installed through
# uv/pipx against the python3 the machine already has (see the note below).
yamllint = "1.37.1"
# The release tool: builds the CLI for every platform, builds and pushes the
# multi-arch image, and attaches everything to the GitHub release. The release
# workflow runs `mise run release`, so a release is reproducible from a laptop.
goreleaser = "2.17.1"
# uv is the connector runtime: a Python function body carrying a PEP 723
# `# /// script` block is executed through `uv run`, which provisions its
# declared dependencies. The runner shells out to it, so it must be on PATH.
uv = "0.7.12"
#
# python is deliberately NOT pinned here. The function runner shells out to
# whatever `python3` is on PATH, and every runner and dev box has one — while
# mise builds CPython from source, which is slow and flaky enough under
# parallel CI jobs to have taken every job down at once.

[settings]
experimental = true

[env]
IMAGE = "ghcr.io/geoah/substrate"

# =============================================================================
# Go
# =============================================================================

[tasks.build]
description = "Build the server -> bin/substrate"
run = "go build -trimpath -o bin/substrate ./cmd/substrated"

[tasks."build:cli"]
description = "Build the CLI -> bin/substratectl"
run = "go build -trimpath -o bin/substratectl ./cmd/substratectl"

[tasks.run]
description = "Run the server (wants DATABASE_URL)"
run = "go run ./cmd/substrated"

[tasks.test]
description = "The whole Go suite, the way ci:go runs it"
# SEQUENTIAL, not `depends`. mise runs dependencies in PARALLEL, and running
# the short suite alongside the container suite starves the pgvector container
# on a small machine — it dies mid-run and every remaining case fails with
# `connection refused`, which reads like a code failure and is not one.
run = ["mise run test:short", "mise run test:db"]

[tasks.cross]
description = "Compile for every platform the project ships or is developed on"
# internal/sandbox carries PER-ARCHITECTURE syscall tables and a build-tagged
# no-op for anything that is not Linux, so a break there is invisible to a
# host-arch build. The image ships linux/amd64 and linux/arm64; developers run
# macOS. A compile error on any of them would otherwise surface in a RELEASE
# (which builds multi-arch) rather than in the pull request that caused it.
run = """
    for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
      echo "building ${target}"
      GOOS=${target%/*} GOARCH=${target#*/} go build ./... || exit 1
      GOOS=${target%/*} GOARCH=${target#*/} go vet ./... || exit 1
    done
    """

[tasks."test:short"]
description = "go test -short ./... — skips every suite that needs a database"
run = "go test -short ./..."

[tasks."test:db"]
description = "The suites that want a database: a pgvector container, or SUBSTRATE_TEST_DATABASE_URL"
# NOT `go test ./...`. These starve when the whole tree runs at once and fail
# arbitrarily — a *_db_test.go failure that looks random usually is one.
#
# -p 1: one test BINARY at a time. Each binary provisions its database once
# (testdb.DSN), including `CREATE EXTENSION`, which Postgres cannot do
# concurrently — two binaries racing there fail on pg_extension_name_index.
# With a container per binary that never happened; against one shared server
# (SUBSTRATE_TEST_DATABASE_URL, which is how CI runs) it does.
#
# -skip '^TestLive': the live set BUYS COMPLETIONS. It skips itself without
# keys, but a dev box has keys in its environment — so the default suite
# excludes it by name and `test:llm` selects it by the same name.
run = "go test -p 1 -skip '^TestLive' ./internal/engine/... ./internal/catalog/... ./internal/testenv/..."

[tasks."test:llm"]
description = "The LIVE suite: real completions from real providers, when the keys are there"
# Every case skips itself unless its key is in the environment, so this exits 0
# on a machine (or a CI runner) that has none. The keys arrive from a
# gitignored .mise.local.toml — never a committed file; docs/testing.md has the
# shape. The engine half also wants a database, like every other *_db_test.go:
# a pgvector container, or SUBSTRATE_TEST_DATABASE_URL.
#
# It SPENDS MONEY. Cheap models and tiny prompts keep a pass well under a cent,
# but do not loop it.
run = "go test -count=1 -run '^TestLive' -v ./internal/llm/... ./internal/engine/..."

[tasks."lint:yaml"]
description = "yamllint over every YAML in the tree — block style, and nothing else"
# The rules are in .yamllint, and there is deliberately almost nothing in it:
# shape is yamlfmt's job, and a second opinion about indentation would only
# contradict it. What is here is what a formatter cannot say.
run = "yamllint ."

[tasks.lint]
description = "golangci-lint over the module"
# --max-same-issues 0 --max-issues-per-linter 0: the default caps the report at
# three of any one finding, which makes a cleanup pass look finished when it is
# not. Report everything.
run = "golangci-lint run --max-same-issues 0 --max-issues-per-linter 0"

[tasks."kinds:check"]
description = "Refuse a kinds/ change that does not bump a declaration version"
run = ".mise/kindscheck.sh"

[tasks.fmt]
description = "Format the tree in place: Go and YAML"
depends = ["fmt:go", "fmt:yaml"]

[tasks."fmt:go"]
description = "gofmt the module in place"
run = "gofmt -w ."

[tasks."fmt:yaml"]
description = "yamlfmt every YAML in the tree in place; config is .yamlfmt"
run = "yamlfmt ."

[tasks."fmt:check"]
description = "Fail if anything is unformatted"
depends = ["fmt:go:check", "fmt:yaml:check"]

[tasks."fmt:go:check"]
description = "Fail if any Go file is unformatted"
run = '''
    unformatted=$(gofmt -l . | grep -v '^web/' || true)
    if [ -n "$unformatted" ]; then
      echo "unformatted:"; echo "$unformatted"; exit 1
    fi
    '''

[tasks."fmt:yaml:check"]
description = "Fail if any YAML is unformatted, printing the diff"
# -lint prints what `fmt:yaml` would change and exits non-zero. The exclusions
# (lockfiles, node_modules, .dev) live in .yamlfmt, so this and `fmt:yaml` can
# never disagree about which files are ours.
run = "yamlfmt -lint ."

# =============================================================================
# Development
# =============================================================================
#
# A substrate on this machine you can restart in a second: one throwaway
# Postgres in a container, and the server as a BINARY FROM THIS TREE — not the
# image. `docker compose up` is the demo path and rebuilds an image on every
# change; this is the one you keep open while you work.
#
# Every task below is one subcommand of .mise/dev.sh, which holds the shape of
# it: the container and its volume, the pid and the log under .dev/, and the
# environment the server boots with (invite code `let-me-in`, the console at /
# when web/console/dist exists).
#
# `dev:wipe` is not a convenience — it is the only way back to a FRESH
# substrate. Registration is one-shot per user and there is no unregister, so
# testing the door means throwing the database away.

[tasks.dev]
description = "The dev substrate in the foreground on :8080 (ctrl-c stops it)"
depends = ["build"]
run = ".mise/dev.sh run"

[tasks."dev:totp"]
description = "The dev substrate in the foreground WITH the second factor enforced"
# `mise run dev` turns TOTP off (SUBSTRATE_INSECURE_DISABLE_TOTP): the database
# is thrown away daily and enrolling an authenticator for it is friction with
# nothing behind it. This is the same substrate with the factor put back, which
# is how a change to the door is tested against the shape a deployment runs.
depends = ["build"]
run = ".mise/dev.sh totp"

[tasks."dev:up"]
description = "The dev substrate in the background; waits for /healthz"
depends = ["build"]
run = ".mise/dev.sh up"

[tasks."dev:stop"]
description = "Stop the background substrate and its Postgres; keeps the data"
run = ".mise/dev.sh stop"

[tasks."dev:restart"]
description = "Rebuild and restart the background substrate; keeps the data"
depends = ["build"]
run = ".mise/dev.sh restart"

[tasks."dev:wipe"]
description = "Stop everything and DELETE the database: the next start is a fresh substrate"
run = ".mise/dev.sh wipe"

[tasks."dev:reset"]
description = "dev:wipe then dev:up — a fresh substrate, running"
depends = ["build"]
run = [".mise/dev.sh wipe", ".mise/dev.sh up"]

[tasks."dev:status"]
description = "What is running: the database, the substrate, the console, the URLs"
run = ".mise/dev.sh status"

[tasks."dev:logs"]
description = "Follow the background substrate's log"
run = ".mise/dev.sh logs"

[tasks."dev:psql"]
description = "A psql shell in the dev database"
run = ".mise/dev.sh psql"

[tasks."dev:dsn"]
description = "Print the dev DSN — what the operator hat takes as --dsn"
quiet = true
run = ".mise/dev.sh dsn"

# =============================================================================
# Console (web/console)
# =============================================================================

[tasks."console:install"]
description = "pnpm install --frozen-lockfile in web/console"
dir = "web/console"
run = "pnpm install --frozen-lockfile"

[tasks."console:dev"]
description = "Vite dev server; proxies /api to the substrate on :8080"
dir = "web/console"
depends = ["console:install"]
run = "pnpm dev"

[tasks."console:build"]
description = "Type-check and build the console -> web/console/dist"
dir = "web/console"
depends = ["console:install"]
run = "pnpm build"

[tasks."console:test"]
description = "vitest run"
dir = "web/console"
depends = ["console:install"]
run = "pnpm test"

[tasks."console:typecheck"]
description = "tsc --noEmit"
dir = "web/console"
depends = ["console:install"]
run = "pnpm typecheck"

[tasks."console:lint"]
description = "eslint over the console"
dir = "web/console"
depends = ["console:install"]
run = "pnpm lint"

# =============================================================================
# Image
# =============================================================================

[tasks.image]
description = "Build the image for THIS arch, loaded into the local docker"
run = "docker build -t $IMAGE:dev ."

[tasks."image:push"]
description = "Build multi-arch and push. TAG=<tag> (default: dev)"
# Two callers: a person pushing a one-off, and the `edge` workflow pushing the
# tip of main. Releases do NOT come through here — they go through goreleaser
# (`release` below), which versions from the git tag.
run = '''
    set -e
    docker buildx build --platform linux/amd64,linux/arm64 \
      --provenance=false --sbom=false -t "$IMAGE:${TAG:-dev}" --push .
    '''

[tasks."image:edge"]
description = "Build and push $IMAGE:edge — the tip of main, never a release"
run = "TAG=edge mise run image:push"

# =============================================================================
# Release
# =============================================================================
#
# release-please turns conventional commits on main into a version bump and a
# tag; the tag runs `release` below. Nothing here needs a hand-written version.

[tasks."release:check"]
description = "Validate .goreleaser.yaml"
run = "goreleaser check"

[tasks."release:snapshot"]
description = "Full release dry run: builds everything, publishes nothing"
run = "goreleaser release --snapshot --clean --skip=publish"

[tasks.release]
description = "Cut the release for the current tag (CI runs this)"
run = "goreleaser release --clean"

# =============================================================================
# The pipeline
# =============================================================================
#
# ONE definition of what "green" means. The workflow in .github/workflows/ci.yml
# does not repeat these commands — it invokes these tasks, one job per ci:*
# task, so a check cannot pass here and fail there. If you add a step, add it
# here; the workflow needs no edit.

[tasks."ci:lint"]
description = "CI job `lint` — formatting, the linters, the release config, and the kinds/ version-bump guard"
depends = ["fmt:check", "lint", "lint:yaml", "release:check", "kinds:check"]

[tasks."ci:go"]
description = "CI job `go test`: the cross-compile check, then the suite in its two halves"
# See `test` above: the two halves MUST NOT run concurrently.
run = ["mise run cross", "mise run test:short", "mise run test:db"]

[tasks."ci:console"]
description = "CI job `console` — typecheck, lint, test, build"
depends = ["console:typecheck", "console:lint", "console:test", "console:build"]

[tasks."ci:image"]
description = "CI job `image builds` — the image builds from a clean tree"
run = "docker build -t $IMAGE:ci ."

[tasks.ci]
description = "Every CI job, locally. This is the whole pipeline."
depends = ["ci:lint", "ci:go", "ci:console", "ci:image"]

[tasks.check]
description = "Alias for ci"
depends = ["ci"]
