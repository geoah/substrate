[tools]
go = "1.26.6"
# Held to the Dockerfile's web stage by `lint:toolchain`: this is the node the
# console is TESTED on, so it is the node the image builds it on.
node = "26.2.0"
pnpm = "9.14.2"
golangci-lint = "2.12.2"
# The YAML formatter. The vocabulary IS YAML — `kinds/` is the contract as
# files — so its shape is reviewed as often as Go is, and `fmt:check` fails on
# it the same way. Config is .yamlfmt.
yamlfmt = "0.21.0"
# The YAML linter, for the one rule a formatter cannot hold: no flow mappings.
# `metadata: {id: x}` and `metadata:\n  id: x` are the same document, so no
# formatter rewrites one into the other — but only one of them is what this
# tree writes. Config is .yamllint. It is a Python tool, installed through
# uv/pipx against the python3 the machine already has (see the note below).
yamllint = "1.37.1"
# The release tool: builds the CLI for every platform, builds and pushes the
# multi-arch image, and attaches everything to the GitHub release. The release
# workflow runs `mise run release`, so a release is reproducible from a laptop.
goreleaser = "2.17.1"
# The version calculator: it reads the conventional commits since the last tag
# and says what the next tag is. That is the whole of the version decision.
# The `version` workflow tags main with exactly this, so `mise run version:next`
# on a laptop answers what the next merge will release, before it releases it.
svu = "3.4.1"
# uv is the connector runtime: a Python function body carrying a PEP 723
# `# /// script` block is executed through `uv run`, which provisions its
# declared dependencies. The runner shells out to it, so it must be on PATH.
uv = "0.7.12"
# The vulnerability scanner. It is CALL-GRAPH based, so it reports only
# advisories this tree actually reaches — which is what makes it a gate rather
# than a list of things to triage. Not in mise's registry; the go backend
# builds it from its own module.
"go:golang.org/x/vuln/cmd/govulncheck" = "1.7.0"
# The shell linter. `.mise/*.sh` hold the dev loop and the kinds guard, and
# they are the only code in the tree that no compiler reads.
shellcheck = "0.11.0"
# The Python linter and formatter, for `internal/runner/host.py` — the function
# runner's Python host, and the one Python file the server ships.
ruff = "0.16.2"
# The link checker, run OFFLINE: it resolves relative links and anchors against
# the tree and never opens a socket, so a moved doc fails the lint job instead
# of a reader's click. An external URL is nobody's build failure.
lychee = "0.24.2"
#
# python is deliberately NOT pinned here. The function runner shells out to
# whatever `python3` is on PATH, and every runner and dev box has one — while
# mise builds CPython from source, which is slow and flaky enough under
# parallel CI jobs to have taken every job down at once.

[settings]
experimental = true

[env]
IMAGE = "ghcr.io/geoah/substrate"

# =============================================================================
# Go
# =============================================================================

[tasks.build]
description = "Build the server -> bin/substrate"
run = "go build -trimpath -o bin/substrate ./cmd/substrated"

[tasks."build:cli"]
description = "Build the CLI -> bin/substratectl"
run = "go build -trimpath -o bin/substratectl ./cmd/substratectl"

[tasks.run]
description = "Run the server (wants DATABASE_URL)"
run = "go run ./cmd/substrated"

[tasks.test]
description = "The whole Go suite, the way ci:go runs it"
# SEQUENTIAL, not `depends`. mise runs dependencies in PARALLEL, and running
# the short suite alongside the container suite starves the pgvector container
# on a small machine — it dies mid-run and every remaining case fails with
# `connection refused`, which reads like a code failure and is not one.
run = ["mise run test:short", "mise run test:db"]

[tasks.cross]
description = "Compile for every platform the project ships or is developed on"
# internal/sandbox carries PER-ARCHITECTURE syscall tables and a build-tagged
# no-op for anything that is not Linux, so a break there is invisible to a
# host-arch build. The image ships linux/amd64 and linux/arm64; developers run
# macOS. A compile error on any of them would otherwise surface in a RELEASE
# (which builds multi-arch) rather than in the pull request that caused it.
run = """
    for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
      echo "building ${target}"
      GOOS=${target%/*} GOARCH=${target#*/} go build ./... || exit 1
      GOOS=${target%/*} GOARCH=${target#*/} go vet ./... || exit 1
    done
    """

[tasks."test:short"]
description = "go test -short ./... — skips every suite that needs a database"
# -count=1, here and on every test task below: the test cache is for a
# developer's inner loop, not for a gate. Every flag these tasks use is in
# Go's cacheable set, so without it a run can answer "(cached)" and rerun
# nothing, which once kept a real failure invisible locally until CI,
# cacheless, caught it.
run = "go test -count=1 -short ./..."

[tasks."test:db"]
description = "The suites that want a database: a pgvector container, or SUBSTRATE_TEST_DATABASE_URL"
# NOT `go test ./...`. These starve when the whole tree runs at once and fail
# arbitrarily — a *_db_test.go failure that looks random usually is one.
#
# -p 1: one test BINARY at a time. Each binary provisions its database once
# (testdb.DSN), including `CREATE EXTENSION`, which Postgres cannot do
# concurrently — two binaries racing there fail on pg_extension_name_index.
# With a container per binary that never happened; against one shared server
# (SUBSTRATE_TEST_DATABASE_URL, which is how CI runs) it does.
#
# -skip '^TestLive': the live set BUYS COMPLETIONS. It skips itself without
# keys, but a dev box has keys in its environment — so the default suite
# excludes it by name and `test:llm` selects it by the same name.
run = "go test -count=1 -p 1 -skip '^TestLive' ./internal/engine/... ./internal/catalog/... ./internal/testenv/..."

[tasks."test:race"]
description = "The short suite under the race detector"
# -short, so this is the suite that does NOT want a database. The engine's
# database suites are where the interesting concurrency lives, but they are
# also four minutes of container time, and -race multiplies that; this is the
# cheap gate that catches the runner's process reaping, the API's handlers and
# the LLM wires. Run `go test -race ./internal/engine/...` by hand when you
# have touched the engine's goroutines.
run = "go test -count=1 -race -short ./..."

[tasks."test:coverage"]
description = "The whole suite with a coverage profile -> coverage.out"
# NOT a gate. There is no threshold here on purpose: a number that fails a
# build teaches people to write tests that move the number, and this repo
# already has more test code than source. What it is for is finding the paths
# nothing exercises — `go tool cover -html=coverage.out` is the useful view.
#
# The two halves run sequentially for the same reason `test` does, and their
# profiles are concatenated: a profile is a `mode:` line then one line per
# block, so keeping the first line and dropping the other's is the whole merge.
run = [
  "go test -count=1 -short -covermode=atomic -coverprofile=coverage.short.out ./...",
  "go test -count=1 -p 1 -skip '^TestLive' -covermode=atomic -coverprofile=coverage.db.out ./internal/engine/... ./internal/catalog/... ./internal/testenv/...",
  """
    { cat coverage.short.out; tail -n +2 coverage.db.out; } >coverage.out
    rm -f coverage.short.out coverage.db.out
    go tool cover -func=coverage.out | tail -1
    """,
]

[tasks."test:llm"]
description = "The LIVE suite: real completions from real providers, when the keys are there"
# Every case skips itself unless its key is in the environment, so this exits 0
# on a machine (or a CI runner) that has none. The keys arrive from a
# gitignored .mise.local.toml — never a committed file; docs/testing.md has the
# shape. The engine half also wants a database, like every other *_db_test.go:
# a pgvector container, or SUBSTRATE_TEST_DATABASE_URL.
#
# It SPENDS MONEY. Cheap models and tiny prompts keep a pass well under a cent,
# but do not loop it.
run = "go test -count=1 -run '^TestLive' -v ./internal/llm/... ./internal/engine/..."

# =============================================================================
# Lint and format
# =============================================================================
#
# ONE NAMING RULE, so the task you want is the one you guess: the bare name is
# every check of that kind (`lint`, `fmt`, `fmt:check`), and a suffix narrows
# it to one language (`lint:go`, `fmt:yaml`, `fmt:yaml:check`). The bare name
# is always an aggregate and never the Go one wearing a short name — `lint`
# meaning golangci-lint alone is what made `lint:yaml` look optional.
#
# The console is not one of those suffixes. It is a second toolchain with its
# own family (`console:lint`, `console:typecheck`) and its own CI job, exactly
# as `test` is the Go suite and `console:test` is the console's. Running
# eslint from `lint` would drag pnpm into the lint job and run it twice.

[tasks.lint]
description = "Every linter: Go, YAML, shell, Python, the docs and the toolchain pins"
depends = [
  "lint:go",
  "lint:yaml",
  "lint:shell",
  "lint:python",
  "lint:docs",
  "lint:toolchain",
]

[tasks."lint:go"]
description = "golangci-lint over the module"
# --max-same-issues 0 --max-issues-per-linter 0: the default caps the report at
# three of any one finding, which makes a cleanup pass look finished when it is
# not. Report everything.
run = "golangci-lint run --max-same-issues 0 --max-issues-per-linter 0"

[tasks."lint:yaml"]
description = "yamllint over every YAML in the tree — block style, and nothing else"
# The rules are in .yamllint, and there is deliberately almost nothing in it:
# shape is yamlfmt's job, and a second opinion about indentation would only
# contradict it. What is here is what a formatter cannot say.
run = "yamllint ."

[tasks."lint:shell"]
description = "shellcheck over every tracked shell script"
# These scripts are the only code here no compiler reads, and they run docker,
# psql and signals against a developer's machine. -x follows `source`.
#
# `git ls-files` rather than `.mise/*.sh`: a script is held because it is in
# the tree, not because of where it was put. The narrower glob meant a script
# added anywhere else was linted by nobody.
#
# The `$#` guard is not ceremony: with no matches GNU xargs still runs the
# command, and `shellcheck` with no operands is an error, so a tree with no
# scripts would fail the lint job rather than pass it.
run = "git ls-files -z '*.sh' | xargs -0 sh -c 'test \"$#\" -eq 0 || shellcheck -x \"$@\"' sh"

[tasks."lint:python"]
description = "ruff over the runner's Python host"
# internal/runner/host.py is the long-lived child every `runtime: python`
# function body is exec'd into: a syntax slip there takes out every Python
# function at once, and no Go test compiles it. Config is .ruff.toml.
run = "ruff check internal/runner/host.py"

[tasks."lint:toolchain"]
description = "The version pins written twice: .mise.toml against the Dockerfiles"
# IN `lint`, unlike `kinds:check`, because it reads the FILES and not the diff:
# the answer is the same on a laptop with no base branch as it is on a merge.
#
# Dependabot bumps a FROM line and cannot bump `.mise.toml`, so this is the
# check that turns a base-image major into a named failure rather than a silent
# split between what CI builds and what ships.
run = ".mise/toolchaincheck.sh"

[tasks."lint:docs"]
description = "The docs, held: links and anchors (lychee), then the prose rules"
# ONE task for "is the documentation still true", in two halves that answer
# different halves of it. Splitting them across two entry points is how one of
# them stops being run.
#
# lychee, for what the pages POINT AT. --offline: a relative link that names a
# file that is not there is a bug in this tree and fails. An external URL that
# is down today is not, so nothing here opens a socket and CI never flakes on
# somebody else's outage. Config is .lychee.toml. --hidden: without it lychee
# skips every dotted directory, so .github/ — the PR template and the issue
# forms, which link into docs/ — went unchecked.
#
# docscheck.sh, for what they SAY: the dead words docs/terms.md retired, the
# retired envelope keys, `mise run` names that no longer exist, and a page the
# index does not list. Only what a grep can decide; the rest is a reading pass.
#
# Both halves run even when the first fails, and the task exits nonzero if
# either did: a `run` array is fail-fast, which would hide every prose finding
# behind one broken link and cost a second round trip to see it.
run = """
status=0
lychee --config .lychee.toml --offline --hidden --no-progress . || status=1
.mise/docscheck.sh || status=1
exit $status
"""

# NOT `lint:kinds`, and so not part of `lint`: this reads the DIFF against the
# base, not the files, so it is only meaningful where there is a change to
# judge. `ci:lint` names it; a laptop runs it when it wants that answer.
[tasks."kinds:check"]
description = "Refuse a kinds/ change that does not bump a declaration version"
run = ".mise/kindscheck.sh"

# =============================================================================
# Audit
# =============================================================================
#
# A SEPARATE family from `lint`, because these are the two checks that need the
# network: they ask a vulnerability database what is known today. That makes
# them the one kind of check whose answer changes without the tree changing —
# green this morning, red this afternoon, same commit — so they are their own
# CI job, and `lint` stays something a laptop can run on a plane.

[tasks.audit]
description = "Every vulnerability scan: Go and the console"
depends = ["audit:go", "audit:console"]

[tasks."audit:go"]
description = "govulncheck over the module — advisories the code actually reaches"
# Call-graph based: an advisory against a dependency this tree never calls into
# is not reported. That is what makes it a gate rather than a spreadsheet.
run = "govulncheck ./..."

[tasks."audit:console"]
description = "pnpm audit over the console's dependencies"
dir = "web/console"
depends = ["console:install"]
# --audit-level high: a moderate advisory in a build-time devDependency is not
# worth blocking every pull request in the repository, and a gate that cries
# wolf gets an `|| true` bolted onto it within the month. High and critical
# stop the line; the rest are read in the job's output.
run = "pnpm audit --audit-level high"

# =============================================================================
# Codegen from the declarations
# =============================================================================
#
# The declarations under kinds/ are the single source of truth for what a record
# is, and every TYPE representation of them is generated from those files, so
# the code and the contract cannot drift. The output is CHECKED IN — a reviewer
# reads the types a declaration change produces, and no consumer needs a
# generator to build.
#
# The naming rule holds here too: the bare name is both halves, and a suffix
# narrows it to one language.

[tasks."kinds:gen"]
description = "Generate the core types from kinds/: Go and TypeScript"
run = "go run ./cmd/kindsgen"

[tasks."kinds:gen:go"]
description = "Generate internal/corekinds alone"
run = "go run ./cmd/kindsgen -lang go"

[tasks."kinds:gen:ts"]
description = "Generate the console's generated module alone"
run = "go run ./cmd/kindsgen -lang ts"

[tasks."kinds:gen:check"]
description = "Fail if the generated types are not what the declarations produce, printing the diff"
# Regenerates into a temporary tree and diffs, so the check never writes into
# the working tree it is judging. -x '*_test.go': the conformance tests live in
# internal/corekinds and are hand-written, so they exist only on the checked-in
# side.
run = '''
    set -e
    tmp="$(mktemp -d)"
    trap 'rm -rf "$tmp"' EXIT
    go run ./cmd/kindsgen -go "$tmp/corekinds" -ts "$tmp/corekinds.ts"
    if ! diff -ru -x '*_test.go' internal/corekinds "$tmp/corekinds"; then
      echo "internal/corekinds is not what kinds/ produces: run \`mise run kinds:gen\`" >&2
      exit 1
    fi
    if ! diff -u web/console/src/lib/generated/corekinds.ts "$tmp/corekinds.ts"; then
      echo "the console's generated module is not what kinds/ produces: run \`mise run kinds:gen\`" >&2
      exit 1
    fi
    '''

[tasks.fmt]
description = "Format the tree in place: Go and YAML"
depends = ["fmt:go", "fmt:yaml"]

[tasks."fmt:go"]
description = "Format the module in place: gofumpt and goimports, through golangci-lint"
# NOT `gofmt -w .`. The formatters are configured once, in .golangci.yml's
# `formatters:` block (gofumpt with extra-rules, goimports with a local
# prefix), and `golangci-lint fmt` is that same configuration applied in
# place. Running bare gofmt here meant `fmt` could not fix what `lint` would
# go on to report, which is the one thing a formatter must never do.
run = "golangci-lint fmt"

[tasks."fmt:yaml"]
description = "yamlfmt every YAML in the tree in place; config is .yamlfmt"
run = "yamlfmt ."

[tasks."fmt:check"]
description = "Fail if anything is unformatted: Go and YAML"
depends = ["fmt:go:check", "fmt:yaml:check"]

[tasks."fmt:go:check"]
description = "Fail if any Go file is unformatted, printing the diff"
# The same formatters `fmt:go` writes with, as a check — so what fails here is
# exactly what `mise run fmt` fixes.
run = "golangci-lint fmt --diff"

[tasks."fmt:yaml:check"]
description = "Fail if any YAML is unformatted, printing the diff"
# -lint prints what `fmt:yaml` would change and exits non-zero. The exclusions
# (lockfiles, node_modules, .dev) live in .yamlfmt, so this and `fmt:yaml` can
# never disagree about which files are ours.
run = "yamlfmt -lint ."

# =============================================================================
# Development
# =============================================================================
#
# A substrate on this machine you can restart in a second: one throwaway
# Postgres in a container, and the server as a BINARY FROM THIS TREE — not the
# image. `docker compose up` is the demo path and rebuilds an image on every
# change; this is the one you keep open while you work.
#
# Every task below is one subcommand of .mise/dev.sh, which holds the shape of
# it: the container and its volume, the pid and the log under .dev/, and the
# environment the server boots with (invite code `let-me-in`, the console at /
# when web/console/dist exists).
#
# `dev:wipe` is not a convenience — it is the only way back to a FRESH
# substrate. Registration is one-shot per user and there is no unregister, so
# testing the door means throwing the database away.

[tasks.dev]
description = "The dev substrate in the foreground on :8080 (ctrl-c stops it)"
depends = ["build"]
run = ".mise/dev.sh run"

[tasks."dev:totp"]
description = "The dev substrate in the foreground WITH the second factor enforced"
# `mise run dev` turns TOTP off (SUBSTRATE_INSECURE_DISABLE_TOTP): the database
# is thrown away daily and enrolling an authenticator for it is friction with
# nothing behind it. This is the same substrate with the factor put back, which
# is how a change to the door is tested against the shape a deployment runs.
depends = ["build"]
run = ".mise/dev.sh totp"

[tasks."dev:up"]
description = "The dev substrate in the background; waits for /healthz"
depends = ["build"]
run = ".mise/dev.sh up"

[tasks."dev:stop"]
description = "Stop the background substrate and its Postgres; keeps the data"
run = ".mise/dev.sh stop"

[tasks."dev:restart"]
description = "Rebuild and restart the background substrate; keeps the data"
depends = ["build"]
run = ".mise/dev.sh restart"

[tasks."dev:wipe"]
description = "Stop everything and DELETE the database: the next start is a fresh substrate"
run = ".mise/dev.sh wipe"

[tasks."dev:reset"]
description = "dev:wipe then dev:up — a fresh substrate, running"
depends = ["build"]
run = [".mise/dev.sh wipe", ".mise/dev.sh up"]

[tasks."dev:status"]
description = "What is running: the database, the substrate, the console, the URLs"
run = ".mise/dev.sh status"

[tasks."dev:logs"]
description = "Follow the background substrate's log"
run = ".mise/dev.sh logs"

[tasks."dev:psql"]
description = "A psql shell in the dev database"
run = ".mise/dev.sh psql"

[tasks."dev:dsn"]
description = "Print the dev DSN — what the operator hat takes as --dsn"
quiet = true
run = ".mise/dev.sh dsn"

# =============================================================================
# Console (web/console)
# =============================================================================

[tasks."console:install"]
description = "pnpm install --frozen-lockfile in web/console"
dir = "web/console"
run = "pnpm install --frozen-lockfile"

[tasks."console:dev"]
description = "Vite dev server; proxies /api to the substrate on :8080"
dir = "web/console"
depends = ["console:install"]
run = "pnpm dev"

[tasks."console:build"]
description = "Type-check and build the console -> web/console/dist"
dir = "web/console"
depends = ["console:install"]
run = "pnpm build"

[tasks."console:test"]
description = "vitest run"
dir = "web/console"
depends = ["console:install"]
run = "pnpm test"

[tasks."console:typecheck"]
description = "tsc --noEmit"
dir = "web/console"
depends = ["console:install"]
run = "pnpm typecheck"

[tasks."console:lint"]
description = "eslint over the console"
dir = "web/console"
depends = ["console:install"]
run = "pnpm lint"

[tasks."console:fmt"]
description = "prettier over the console, in place"
dir = "web/console"
depends = ["console:install"]
run = "pnpm fmt"

[tasks."console:fmt:check"]
description = "Fail if anything in the console is unformatted"
dir = "web/console"
depends = ["console:install"]
run = "pnpm fmt:check"

# =============================================================================
# Image
# =============================================================================

[tasks.image]
description = "Build the image for THIS arch, loaded into the local docker"
run = "docker build -t $IMAGE:dev ."

[tasks."image:push"]
description = "Build multi-arch and push. TAG=<tag> (default: dev)"
# Two callers: a person pushing a one-off, and the `latest` workflow pushing
# the tip of main. Releases do NOT come through here — they go through
# goreleaser (`release` below), which versions from the git tag.
#
# The build args are what makes the pushed image able to say which build it
# is: .dockerignore drops .git, so the toolchain inside the build records
# nothing and only what is handed in survives (internal/build). `git describe`
# is the honest name for something that is NOT a release, because
# `v0.2.0-4-g1a2b3c4` reads as four commits past v0.2.0; `--always` keeps it a
# bare sha in a checkout with no tags at all, so nothing here fails for want
# of a version.
run = '''
    set -e
    docker buildx build --platform linux/amd64,linux/arm64 \
      --provenance=false --sbom=false \
      --build-arg "VERSION=$(git describe --tags --always --dirty)" \
      --build-arg "COMMIT=$(git rev-parse HEAD)" \
      -t "$IMAGE:${TAG:-dev}" --push .
    '''

[tasks."image:latest"]
description = "Build and push $IMAGE:latest — the tip of main, never a release"
run = "TAG=latest mise run image:push"

# =============================================================================
# Release
# =============================================================================
#
# A release is a merge to main. The `version` workflow reads the conventional
# commits since the last tag, tags the commit with what they add up to, and
# runs `release` below against that tag. Nothing is versioned by hand and no
# release is a decision somebody makes separately from merging.

[tasks."version:current"]
description = "The version main last released"
run = "svu current"

[tasks."version:next"]
description = "The version the commits since that tag add up to"
# --v0 is the whole of the pre-1.0 policy: while the current version is 0.x a
# breaking change bumps the MINOR, because 0.x is where breaking changes are
# expected and burning majors on them says nothing. It stops applying by
# itself the moment this repository reaches 1.0.0, so there is no edit here to
# remember and no second place that holds the same rule.
#
# Prints the current version unchanged when nothing since the tag calls for a
# bump (docs:, chore:, ci:, refactor:), which is how the workflow knows there
# is nothing to release.
run = "svu next --v0"

[tasks."release:check"]
description = "Validate .goreleaser.yaml"
run = "goreleaser check"

[tasks."release:snapshot"]
description = "Full release dry run: builds everything, publishes nothing"
run = "goreleaser release --snapshot --clean --skip=publish"

[tasks.release]
description = "Cut the release for the current tag (CI runs this)"
run = "goreleaser release --clean"

# =============================================================================
# The pipeline
# =============================================================================
#
# ONE definition of what "green" means. The workflow in .github/workflows/ci.yml
# does not repeat these commands — it invokes these tasks, one job per ci:*
# task, so a check cannot pass here and fail there. If you add a step, add it
# here; the workflow needs no edit.

[tasks."ci:lint"]
description = "CI job `lint` — formatting, the linters, the release config, and the kinds/ guards"
# `kinds:gen:check` sits beside `kinds:check` because both hold kinds/ to
# something: one that a changed declaration bumped its version, the other that
# the generated types are the ones the declarations produce.
depends = ["fmt:check", "lint", "release:check", "kinds:check", "kinds:gen:check"]

[tasks."ci:cross"]
description = "CI job `cross` — the cross-compile check, on a runner of its own"
# Split out of `ci:go` because it was the critical path's cheapest 29 seconds:
# it shares nothing with the suite (no database, no container) and every job
# runs on its own machine, so a compile check queued in front of a five-minute
# test run only delayed the answer.
depends = ["cross"]

[tasks."ci:go"]
description = "CI job `go test` — the suite in its two halves, with a coverage profile"
# See `test` above: the two halves MUST NOT run concurrently. This runs them
# through `test:coverage` so the gate also produces the profile CI keeps as an
# artifact; `mise run test` is the same two halves without the instrumentation,
# and stays the inner loop.
depends = ["test:coverage"]

[tasks."ci:race"]
description = "CI job `race` — the short suite under the race detector"
# Its own job, not a step of `ci:go`: -race roughly triples the suite's runtime
# and the two want different build caches, so sharing a runner would put a slow
# check in front of the fast one for no gain.
depends = ["test:race"]

[tasks."ci:audit"]
description = "CI job `audit` — the vulnerability scans"
depends = ["audit"]

[tasks."ci:console"]
description = "CI job `console` — typecheck, lint, format, test, build"
depends = [
  "console:typecheck",
  "console:lint",
  "console:fmt:check",
  "console:test",
  "console:build",
]

[tasks."ci:image"]
description = "CI job `image builds` — the image builds from a clean tree"
run = "docker build -t $IMAGE:ci ."

[tasks.ci]
description = "Every CI job, locally. This is the whole pipeline."
depends = [
  "ci:lint",
  "ci:cross",
  "ci:go",
  "ci:race",
  "ci:audit",
  "ci:console",
  "ci:image",
]

[tasks.check]
description = "Alias for ci"
depends = ["ci"]
