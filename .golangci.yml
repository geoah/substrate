# A linter is on when the tree is at zero for it and each finding it reports
# is a bug or a one-line fix. One whose findings are mostly style or false
# positives stays off. Measured on this tree and turned down, so do not
# re-enable one without a new reason:
#   govet shadow    993 findings, 975 of them a shadowed `err`
#   sqlclosecheck    51, each "should use defer" on rows the code closes
#   contextcheck     73, false positives on idempotentContext and
#                    context.WithoutCancel
#   thelper          90, style
#   paralleltest   1348, style: a test without t.Parallel is not a defect
#   gocognit 170, gocyclo 67, funlen 532, nestif 41, cyclop 1042, maintidx 37:
#                    the complexity linters at their defaults cap size and
#                    catch no defect
version: "2"
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - depguard
    - dogsled
    - errcheck
    - errorlint
    - exptostd
    - fatcontext
    - gocheckcompilerdirectives
    - godox
    - goprintffuncname
    - gosec
    - govet
    - intrange
    - ineffassign
    - misspell
    - nakedret
    - nilnesserr
    - nolintlint
    - reassign
    - rowserrcheck
    - staticcheck
    - unconvert
    - unused
    - usestdlibvars
    - whitespace
  settings:
    depguard:
      # depguard matches absolute paths, so `${base-path}` anchors each glob
      # at the repository root: a bare `**/cmd/**` would also exempt a nested
      # cmd/ directory, or every file of a checkout that lives under one.
      rules:
        # AGENTS.md: internal/api builds against internal/substrate and is
        # tested against its hand-written fake alone, so its test files are
        # held too.
        api-never-imports-engine:
          list-mode: lax
          files:
            - "${base-path}/internal/api/**"
          deny:
            - pkg: github.com/geoah/substrate/internal/engine
              desc: internal/api builds against internal/substrate and is
                tested against fake_test.go, never the engine (AGENTS.md)
        # Only the binaries, internal/testenv (a whole substrate for one test)
        # and tests open the engine; every other package builds against the
        # contract.
        engine-consumers:
          list-mode: lax
          files:
            - "$all"
            - "!${base-path}/cmd/**"
            - "!${base-path}/internal/engine/**"
            - "!${base-path}/internal/testenv/**"
            - "!$test"
          deny:
            - pkg: github.com/geoah/substrate/internal/engine
              desc: only cmd/, internal/testenv and tests open the engine;
                build against internal/substrate
        # Test infrastructure imported by production code links the docker
        # client into the binaries. lint:go's `go list -deps` check holds the
        # same line over each binary's whole import closure.
        test-infra:
          list-mode: lax
          files:
            - "$all"
            - "!$test"
            - "!${base-path}/internal/testdb/**"
          deny:
            - pkg: github.com/testcontainers/testcontainers-go
              desc: test infrastructure; only internal/testdb and tests import
                it
            - pkg: github.com/moby/moby
              desc: test infrastructure; only internal/testdb and tests import
                it
            - pkg: github.com/stretchr/testify
              desc: the suite uses the standard testing package
    errorlint:
      asserts: true
    godox:
      keywords:
        - FIXME
    gosec:
      excludes:
        # Hardcoded credentials: every hit is a kind reference, an env var
        # name, a token prefix or a message, never a secret value.
        - G101
        # Integer overflow on conversion: 16 hits are the sandbox's kernel-ABI
        # fields, which truncate by design; the other 5 convert non-negative
        # values that fit (a hash length, a TOTP step, a pass count, a free
        # block count, a 0 or 1 byte).
        - G115
        # Secret field marshaled: the one hit marshals an OAuth token to seal it.
        - G117
        # SQL string concatenation: every hit joins constants or $n
        # placeholders, and CodeQL's security-and-quality suite tracks taint.
        - G202
    govet:
      # Every analyzer, not just the subset `go test` runs. fieldalignment is
      # a memory-layout preference and shadow is rejected in the header.
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    nolintlint:
      require-explanation: true
      require-specific: true
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF*
    misspell:
      locale: US
      ignore-rules:
        # British spelling — the catalogue is deliberately spelled this way.
        - "catalogue"
        - "Catalogue"
        - "catalogues"
        # The health sample's metric id, spelled as the sample declares it.
        - "haemoglobin"
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy
    rules:
      # Newer staticcheck flags require/assert-guarded pointers in tests.
      - path: (.+)_test\.go
        text: "SA5011"
        linters:
          - staticcheck
      # Test helpers are written per-suite and read by a person before they
      # are read by a compiler; an unused one is scaffolding, not a defect.
      # Blank identifiers in a test are the same story: a suite ignores the
      # returns it is not asserting on, and naming them would say less.
      - path: (.+)_test\.go
        linters:
          - unused
          - dogsled
      # A test runs the suite's own binaries over its own temp files; gosec's
      # subprocess and file-path rules would flag every harness.
      - path: (.+)_test\.go
        linters:
          - gosec
      # spaHandler stats and serves a path only after filepath.IsLocal and a
      # prefix check on the joined result, a guard G703 does not credit.
      - path: ^internal/api/api\.go$
        text: "G703"
        linters:
          - gosec
      # seekPredicate indexes the cursor keys, whose length its one caller
      # checks against the order terms first; G602 does not follow the call.
      - path: ^internal/engine/query\.go$
        text: "G602"
        linters:
          - gosec
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: github.com/geoah/substrate
      # Only the rule `extra-rules: true` meant before gofumpt 0.11. That key
      # now also turns on clothe-returns and balance-calls, which would
      # reformat files no change touched.
      extra:
        group-params: true
    goimports:
      local-prefixes:
        - github.com/geoah/substrate
issues:
  # Report every occurrence: a truncated list makes a cleanup pass look done
  # when it is not, and a bare `golangci-lint run` from an editor or an agent
  # must print what lint:go prints.
  max-issues-per-linter: 0
  max-same-issues: 0
