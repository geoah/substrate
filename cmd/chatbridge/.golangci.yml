# The chat bridge's own lint configuration: the repository's
# (../../.golangci.yml), with the depguard rules that hold the server's
# packages swapped for the one that holds this module apart from them, the
# contract's spellings allowed, and the formatters keyed to this module.
# Keep the rest in step with the root file.
# A linter is on when the tree is at zero for it and each finding it reports
# is a bug or a one-line fix. One whose findings are mostly style or false
# positives stays off. Measured on this tree and turned down, so do not
# re-enable one without a new reason:
#   govet shadow    993 findings, 975 of them a shadowed `err`
#   sqlclosecheck    51, each "should use defer" on rows the code closes
#   contextcheck     73, false positives on idempotentContext and
#                    context.WithoutCancel
#   thelper          90, style
#   paralleltest   1348, style: a test without t.Parallel is not a defect
#   gocognit 170, gocyclo 67, funlen 532, nestif 41, cyclop 1042, maintidx 37:
#                    the complexity linters at their defaults cap size and
#                    catch no defect
version: "2"
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - depguard
    - dogsled
    - errcheck
    - errorlint
    - exptostd
    - fatcontext
    - gocheckcompilerdirectives
    - godox
    - goprintffuncname
    - gosec
    - govet
    - intrange
    - ineffassign
    - misspell
    - nakedret
    - nilnesserr
    - nolintlint
    - reassign
    - rowserrcheck
    - sloglint
    - staticcheck
    - unconvert
    - unused
    - usestdlibvars
    - whitespace
  settings:
    depguard:
      rules:
        # The license boundary (decision 0249): the bridge is its own
        # AGPL program and talks to the server over its public HTTP API
        # alone. Go's internal rule would let a nested module import the
        # server's packages by path; this rule does not.
        server-module:
          list-mode: lax
          files:
            - "$all"
          deny:
            - pkg: github.com/geoah/substrate/internal
              desc: the chat bridge never links the server's packages; talk
                to it over HTTP
            - pkg: github.com/geoah/substrate/kinds
              desc: the chat bridge never links the server's packages
            - pkg: github.com/geoah/substrate/samples
              desc: the chat bridge never links the server's packages
        slog-only:
          list-mode: lax
          files:
            - "$all"
            - "!$test"
          deny:
            - pkg: log$
              desc: log through log/slog, whose handlers quote what a request
                wrote; the stdlib log package prints it raw
    errorlint:
      asserts: true
    godox:
      keywords:
        - FIXME
    gosec:
      excludes:
        # Hardcoded credentials: every hit is a kind reference, an env var
        # name, a token prefix or a message, never a secret value.
        - G101
        # Integer overflow on conversion: 16 hits are the sandbox's kernel-ABI
        # fields, which truncate by design; the other 5 convert non-negative
        # values that fit (a hash length, a TOTP step, a pass count, a free
        # block count, a 0 or 1 byte).
        - G115
        # Secret field marshaled: the one hit marshals an OAuth token to seal it.
        - G117
        # SQL string concatenation: every hit joins constants or $n
        # placeholders, and CodeQL's security-and-quality suite tracks taint.
        - G202
    govet:
      # Every analyzer, not just the subset `go test` runs. fieldalignment is
      # a memory-layout preference and shadow is rejected in the header.
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    nolintlint:
      require-explanation: true
      require-specific: true
    # CodeQL's go/log-injection exclusion rests on slog's handlers quoting a
    # value; a message built from one is the half a reader takes as the
    # substrate's own words, so it is a constant and the value an attribute.
    # Arguments are key-value pairs, as the whole tree writes them.
    sloglint:
      no-mixed-args: true
      kv-only: true
      static-msg: true
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF*
    misspell:
      locale: US
      ignore-rules:
        # British spelling — the catalogue is deliberately spelled this way.
        - "catalogue"
        - "Catalogue"
        - "catalogues"
        # The health sample's metric id, spelled as the sample declares it.
        - "haemoglobin"
        # The contract's outcome and error code, and Matrix's tag: wire
        # values, spelled as the wire spells them.
        - "cancelled"
        - "favourite"
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy
    rules:
      # Newer staticcheck flags require/assert-guarded pointers in tests.
      - path: (.+)_test\.go
        text: "SA5011"
        linters:
          - staticcheck
      # Test helpers are written per-suite and read by a person before they
      # are read by a compiler; an unused one is scaffolding, not a defect.
      # Blank identifiers in a test are the same story: a suite ignores the
      # returns it is not asserting on, and naming them would say less.
      - path: (.+)_test\.go
        linters:
          - unused
          - dogsled
      # A test runs the suite's own binaries over its own temp files; gosec's
      # subprocess and file-path rules would flag every harness.
      - path: (.+)_test\.go
        linters:
          - gosec
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: github.com/geoah/substrate/cmd/chatbridge
      # Only the rule `extra-rules: true` meant before gofumpt 0.11. That key
      # now also turns on clothe-returns and balance-calls, which would
      # reformat files no change touched.
      extra:
        group-params: true
    goimports:
      local-prefixes:
        - github.com/geoah/substrate/cmd/chatbridge
issues:
  # Report every occurrence: a truncated list makes a cleanup pass look done
  # when it is not, and a bare `golangci-lint run` from an editor or an agent
  # must print what lint:go prints.
  max-issues-per-linter: 0
  max-same-issues: 0
