name: Feature
description: Something that should exist, or should work differently
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >-
        What you were trying to do, where the substrate got in the way, and
        what you have in mind, if anything. Start at the problem rather than
        the solution: the shape of the answer usually follows from it.
    validations:
      required: true
