name: Bug
description: Something behaves differently from what the code or the docs
  say
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: >-
        What you did, what you expected, what you got instead, and how to
        reproduce it. Name the version if you know it. Issues are public:
        redact secrets, and report vulnerabilities privately instead.
    validations:
      required: true
