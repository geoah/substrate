# The vulnerability scans: govulncheck and pnpm audit (`mise run ci:audit`).
#
# Its own workflow, not a job in ci.yml. latest.yml, release-please.yml and
# release.yml all wait for a SUCCESSFUL ci run on main, and this is the one
# check whose answer changes without the tree changing: it asks a
# vulnerability database what is known today. As a ci job, an advisory with no
# patched version yet turned every ci run on main red, which stopped `latest`,
# the release pull request and every release until it was fixed upstream.
# Here it still runs on every pull request and every push to main, and it
# still fails red, but nothing waits on it.
#
# Weekly as well, like codeql.yml: a commit that was clean on Monday can have
# an advisory on Friday, and main may not move in between.
name: audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The one job allowed to fail for a reason that is not in the diff: it asks
    # a vulnerability database what is known TODAY, so the same commit can be
    # green this morning and red this afternoon. That is the point of it, and
    # it is why it is not part of `lint`.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
          version: 2026.9.2
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-audit-${{ hashFiles('go.sum') }}-${{ github.sha
            }}
          restore-keys: |
            ${{ runner.os }}-go-audit-${{ hashFiles('go.sum') }}-
            ${{ runner.os }}-go-audit-
      - if: github.event_name == 'push' && steps.cache.outputs.cache-hit !=
          'true'
        run: .mise/gocache.sh age ~/.cache/go-build
        continue-on-error: true
      - run: mise run ci:audit
      - if: github.event_name == 'push' && steps.cache.outputs.cache-hit !=
          'true'
        run: .mise/gocache.sh prune ~/.cache/go-build
        continue-on-error: true
      - if: github.event_name == 'push' && steps.cache.outputs.cache-hit !=
          'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.cache.outputs.cache-primary-key }}

