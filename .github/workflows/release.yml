# Cuts a release: the CLI for every platform and the multi-arch image, all
# tagged from the git tag, attached to the GitHub release release-please made.
#
# This file holds NO build definition — it runs `mise run release`, which runs
# goreleaser against .goreleaser.yaml. A person can run the same thing on a
# laptop with `mise run release:snapshot` (which builds everything and
# publishes nothing).
#
# release-please.yml CALLS this workflow after it tags a merged release pull
# request, and that call is the ONLY door: there is no dispatch and no
# `on: push: tags`, because either one publishes whatever commit a tag names
# without asking whether ci ever passed for it. The first step below asks:
# it looks the tagged commit's own green ci run up and refuses without one.
#
# Recovering a release that died halfway (the ghcr push, a flaky upload) is a
# re-run of the release-please.yml run that called this: release-please
# finds the tag already cut and the release already created, reports the
# release, and calls here again. Nothing has to be tagged, deleted or
# released by hand.
name: release

on:
  workflow_call:
    inputs:
      tag:
        description: The tag to build
        required: true
        type: string
      sha:
        description: The commit that tag was made at
        required: true
        type: string

concurrency:
  # Keyed on the TAG NAME, so a re-run of a release cannot overlap the run it
  # replays: `goreleaser release --clean` twice over one tag races itself.
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # contents: write attaches the archives to the GitHub release;
      # packages: write pushes the image to ghcr.
      contents: write
      packages: write
      # To read ci's runs, which is what the gate below asks for.
      actions: read
    steps:
      # release-please runs after SOME green ci run on main, which may be a
      # later commit's. The release is this commit, so this commit's own run
      # is what has to be green. `event == push` and `head_branch == main`
      # because a pull request run can carry a main commit's sha (a fork's
      # pull request from its own main), and that run tested the fork.
      - name: require a successful ci run for the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          green="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.event == "push" and .head_branch == "main")] | length')"
          if [ "$green" -eq 0 ]; then
            echo "no successful ci run for $SHA on main; refusing to build a release from it" >&2
            exit 1
          fi
          echo "$green successful ci run(s) for $SHA" >&2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser needs the full history to resolve the previous tag, and
          # every tag, which fetch-depth 0 brings whatever the ref is.
          fetch-depth: 0
          # The COMMIT, never the tag. A tag is a mutable pointer: ci passed
          # for this sha and release-please tagged this sha, and checking the
          # tag out would build whatever it names by the time this job starts.
          # HEAD lands in the same detached state a tag checkout produces, so
          # goreleaser sees what it always saw.
          ref: ${{ inputs.sha }}
      # The tag as fetched moments ago must still be the commit ci passed for.
      # Failing here means somebody moved the tag between release-please
      # pushing it and this checkout, and the release that would go out
      # carries a name that no longer means what it says.
      - name: verify the tag is the verified commit
        env:
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          at="$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" || true)"
          if [ "$head" != "$SHA" ] || [ "$at" != "$SHA" ]; then
            echo "expected $TAG and HEAD at $SHA; tag is at ${at:-nowhere} and HEAD is $head" >&2
            exit 1
          fi
          echo "$TAG is $SHA, which is HEAD" >&2
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
          version: 2026.9.2
      - run: mise run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
