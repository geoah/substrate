# Cuts a release: the CLI for every platform and the multi-arch image, all
# tagged from the git tag.
#
# This file holds NO build definition — it runs `mise run release`, which runs
# goreleaser against .goreleaser.yaml. A person can run the same thing on a
# laptop with `mise run release:snapshot` (which builds everything and
# publishes nothing).
#
# Normally release-please CALLS this workflow after it tags (release-please.yml)
# rather than the tag triggering it: a tag pushed by GITHUB_TOKEN does not start
# another workflow, so relying on the tag alone would release nothing. The tag
# trigger below is for tags pushed by a person.
name: release

on:
  workflow_call:
    inputs:
      tag:
        description: The tag to build
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build
        required: true
        type: string
  push:
    tags: ["v*"]

concurrency:
  # Keyed on the TAG NAME, never on the ref. The two doors into this workflow
  # spell the same release differently — release-please passes `v1.2.3` as an
  # input, a human tag push arrives as `refs/tags/v1.2.3` — so grouping on
  # whichever one happened would put the same release in two different groups
  # and let `goreleaser release --clean` run twice over one tag.
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # contents: write attaches the archives to the GitHub release;
      # packages: write pushes the image to ghcr.
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser needs the full history to resolve the previous tag, and
          # the tag itself when release-please called us.
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          experimental: true
      - run: mise run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
