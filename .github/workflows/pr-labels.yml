# A pull request wears the areas it touches.
#
# .github/labeler.yml maps paths to area/ labels and this applies them, so
# nobody labels a pull request by hand. type/ is already in the conventional
# commit title, and priority/ is a judgement, so neither is guessed here.
#
# pull_request_target, not pull_request: a fork's token is read-only, and a
# contributor's pull request should be labelled like anybody else's. It is
# the safe half of that trade only because nothing here checks out the pull
# request's code — the action reads the base branch's config and calls the
# labels API, and never runs a line of what it is labelling.
name: pr-labels

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  area:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # A label is cosmetic and the action reads its config over the API, so a
      # GitHub outage marks the pull request red for something no reviewer can
      # act on and no merge depends on. A missing area label costs less
      # attention than a red check that means nothing, so the step reports its
      # own failure and the job stays green. A real error in labeler.yml still
      # shows in the step log.
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        continue-on-error: true
        with:
          configuration-path: .github/labeler.yml
