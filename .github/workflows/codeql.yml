# CodeQL: GitHub's own static analysis, over both languages in the tree.
#
# This is the one check that is NOT a `mise run` task, and it is the exception
# that proves the rule in ci.yml. CodeQL is not a linter you can install and
# run — the analysis happens on GitHub's side, the queries are versioned there,
# and the findings land in the repository's security tab rather than in a job's
# log. There is nothing to define in .mise.toml that a laptop could reproduce,
# so it lives here, alone, instead of pretending to be a pipeline step.
#
# What it is for, next to `mise run audit`: govulncheck asks "does this tree
# call into a dependency with a known advisory"; CodeQL asks "does this tree
# have the bug itself" — taint from a request into a query, a path traversal, a
# nil deref. Neither one answers the other's question.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, because the query packs change even when the code does not: a
    # commit that was clean in March can be a finding in April.
    - cron: "17 3 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Writing the findings to the security tab is the whole point.
      security-events: write
      # The Go extractor reads the workflow run to attribute results.
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            # Go must be compiled for the extractor to see it, so autobuild
            # runs `go build ./...` against the toolchain mise installed.
            build-mode: autobuild
          - language: javascript-typescript
            # Nothing to build: the extractor reads the sources directly, and
            # analysing the Vite output would only be analysing esbuild.
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pinned toolchain, so the extractor compiles against the same Go
      # this project builds with rather than the runner's stock one. Go
      # alone, and installed afresh: mise-action hands the job's token, which
      # can write findings, to whatever its install starts, and any job on
      # main can write the cache entry a restore would read.
      - if: matrix.language == 'go'
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          experimental: true
          version: 2026.9.2
          install_args: go
          cache: false

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-and-quality over the default `security` pack: the extra
          # queries catch an ignored error or a resource that is never closed.
          queries: security-and-quality

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
