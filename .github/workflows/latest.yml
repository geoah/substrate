# The tip of main as one image: ghcr.io/geoah/substrate:latest.
#
# This `latest` is NOT a stable release tag in the usual sense — it moves
# with every commit to main, carries no version, and has no changelog entry
# behind it. Deploy it only if you meant to track main. Released versions
# come from a tag, through release.yml, and carry their own semver tags
# (goreleaser does not tag a release `latest`, so the two never race for the
# same name).
#
# No per-commit tags: one moving tag, so the registry does not fill up with
# images nobody will ever ask for by name.
name: latest

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Newer commits win — an in-flight latest build for an older commit is
  # wasted.
  group: latest
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  latest:
    name: push latest image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          experimental: true
      - run: mise run image:latest
