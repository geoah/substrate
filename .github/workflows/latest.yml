# The tip of main as one image: ghcr.io/geoah/substrate:latest.
#
# This `latest` is NOT a stable release tag in the usual sense — it moves
# with every commit to main, carries no version, and has no changelog entry
# behind it. Deploy it only if you meant to track main. Released versions
# come from a tag, through release.yml, and carry their own semver tags
# (goreleaser does not tag a release `latest`, so the two never race for the
# same name).
#
# No per-commit tags: one moving tag, so the registry does not fill up with
# images nobody will ever ask for by name.
name: latest

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Newer commits win — an in-flight latest build for an older commit is
  # wasted.
  group: latest
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  latest:
    name: push latest image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          experimental: true
      - run: mise run image:latest
