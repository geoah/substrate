# Sends a release's iPhone and iPad apps to TestFlight: every app with an
# iOS UI, built from the tagged commit as `stable`, exported for App Store
# Connect and uploaded (`.mise/apps.sh testflight`, apps/README.md
# §TestFlight). TestFlight gives each build to the groups set to take every
# build once App Store Connect has processed it.
#
# release-please.yml CALLS this beside release.yml, after it tags a merged
# release pull request, and that is the only door, for release.yml's reason:
# a dispatch or a tag trigger would build whatever commit it names without
# asking whether ci passed for it. A pre-release goes to TestFlight from a
# Mac, `mise run apps:testflight`.
#
# Two jobs, so the App Store Connect key never shares a runner with code
# from a package registry: `console` runs pnpm and vite with a read-only
# token and nothing else, and `upload` downloads its dist/ and runs this
# tree's scripts and Xcode. The key is the `testflight` environment's, which
# only main's workflows may read (.mise/reposettings.sh):
#
#   SUBSTRATE_APPLE_ASC_KEY      the AuthKey_….p8's contents (Admin role)
#   SUBSTRATE_APPLE_ASC_KEY_ID   its key id
#   SUBSTRATE_APPLE_ASC_ISSUER_ID
#   SUBSTRATE_APPLE_DISTRIBUTION_P12           the team's Apple Distribution
#   SUBSTRATE_APPLE_DISTRIBUTION_P12_PASSWORD  certificate (base64 .p12),
#                                which signs the exports: an API key may not
#                                use the cloud-managed one
#
# and its variables name the deployment, never this tree:
#
#   SUBSTRATE_APPLE_TEAM_ID      the team that signs the apps
#   SUBSTRATE_APPLE_SITE_URL     the site whose callbacks the builds claim
#   SUBSTRATE_APPLE_RUNNER       optional: the macOS runner's label, for a
#                                self-hosted Mac (default macos-26)
#   SUBSTRATE_APPLE_XCODE        optional: the Xcode the runner selects,
#                                /Applications/Xcode_<this>.app
#
# Recovering a run that died (an upload App Store Connect refused, a runner
# lost) is "Re-run failed jobs" on the release-please.yml run: the build
# number is the time, so the rerun builds again under a new one, and an app
# that went up before the failure goes up again beside its first build.
name: testflight

on:
  workflow_call:
    inputs:
      tag:
        description: The tag to build
        required: true
        type: string
      sha:
        description: The commit that tag was made at
        required: true
        type: string

concurrency:
  group: testflight-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  console:
    name: build the console
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.sha }}
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          experimental: true
          version: 2026.9.2
          install_args: node pnpm
          cache: false
      - run: mise run console:build
      # Its own name: release.yml, called by the same run, uploads `console`.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testflight-console
          path: web/console/dist
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true

  upload:
    name: upload to TestFlight
    needs: console
    runs-on: ${{ vars.SUBSTRATE_APPLE_RUNNER || 'macos-26' }}
    timeout-minutes: 90
    environment: testflight
    permissions:
      contents: read
      # To read ci's runs, which is what the gate below asks for.
      actions: read
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      # release.yml's gate: this commit's own push run of ci on main is
      # green, not merely the later one that started release-please.
      - name: require a successful ci run for the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          green="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.event == "push" and .head_branch == "main")] | length')"
          if [ "$green" -eq 0 ]; then
            echo "no successful ci run for $SHA on main; refusing to send it to TestFlight" >&2
            exit 1
          fi
      # The COMMIT, never the tag, which could be moved after ci passed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.sha }}
      # mise alone: the script installs the one tool it runs, xcodegen, at
      # the version it names.
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          experimental: true
          version: 2026.9.2
          install: false
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: testflight-console
          path: web/console/dist
      - name: select Xcode
        env:
          XCODE: ${{ vars.SUBSTRATE_APPLE_XCODE }}
        run: |
          set -euo pipefail
          if [ -n "$XCODE" ]; then sudo xcode-select -s "/Applications/Xcode_$XCODE.app"; fi
          xcodebuild -version
      # The key as a file only this job's user reads, in the runner's
      # temporary directory, which the runner empties after the job.
      - name: write the App Store Connect key
        env:
          KEY: ${{ secrets.SUBSTRATE_APPLE_ASC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$KEY" ]; then
            echo "the testflight environment has no SUBSTRATE_APPLE_ASC_KEY; see the comment at the top of this workflow" >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "$KEY" >"$RUNNER_TEMP/AuthKey.p8"
      # The distribution identity in a keychain of the job's own, searched
      # first and unlocked for codesign, with a random password nothing
      # else reads; deleted with the key below.
      - name: import the Apple Distribution certificate
        env:
          P12: ${{ secrets.SUBSTRATE_APPLE_DISTRIBUTION_P12 }}
          P12_PASSWORD: ${{ secrets.SUBSTRATE_APPLE_DISTRIBUTION_P12_PASSWORD
            }}
        run: |
          set -euo pipefail
          if [ -z "$P12" ] || [ -z "$P12_PASSWORD" ]; then
            echo "the testflight environment has no SUBSTRATE_APPLE_DISTRIBUTION_P12 or its password; see the comment at the top of this workflow" >&2
            exit 1
          fi
          umask 077
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          printf '%s' "$P12" | base64 -d >"$RUNNER_TEMP/distribution.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/distribution.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          existing=()
          while read -r line; do existing+=("$line"); done < <(security list-keychains -d user | sed -e 's/^ *"//' -e 's/"$//')
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          rm -f "$RUNNER_TEMP/distribution.p12"
      # The script, not `mise run apps:testflight`, whose console:build
      # would run pnpm beside the key.
      - run: .mise/apps.sh testflight stable
        env:
          SUBSTRATE_APPLE_ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          SUBSTRATE_APPLE_ASC_KEY_ID: ${{ secrets.SUBSTRATE_APPLE_ASC_KEY_ID
            }}
          SUBSTRATE_APPLE_ASC_ISSUER_ID: ${{ secrets.SUBSTRATE_APPLE_ASC_ISSUER_ID
            }}
          SUBSTRATE_APPLE_TEAM_ID: ${{ vars.SUBSTRATE_APPLE_TEAM_ID }}
          SUBSTRATE_APPLE_SITE_URL: ${{ vars.SUBSTRATE_APPLE_SITE_URL }}
      - name: remove the App Store Connect key and the signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/distribution.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
