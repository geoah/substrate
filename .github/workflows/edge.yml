# The tip of main as one image: ghcr.io/geoah/substrate:edge.
#
# `edge` is NOT a release. It moves with every commit to main, carries no
# version, and has no changelog entry behind it — deploy it only if you meant
# to track main. Released versions come from a tag, through release.yml, and
# are the only images with a semver tag or `latest`.
#
# No per-commit tags: one moving tag, so the registry does not fill up with
# images nobody will ever ask for by name.
name: edge

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Newer commits win — an in-flight edge build for an older commit is wasted.
  group: edge
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  edge:
    name: push edge image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: jdx/mise-action@v2
        with:
          experimental: true
      - run: mise run image:edge
