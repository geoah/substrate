# Semver, from the commits.
#
# Every push to main is read as conventional commits: `fix:` bumps the patch,
# `feat:` the minor, and a `!` or a BREAKING CHANGE footer the major. Anything
# else (docs:, refactor:, build:, test:) changes no version.
#
# release-please keeps ONE open pull request holding the pending version and the
# changelog it has accumulated. Merging that PR tags the commit, which is what
# release.yml waits for. So a release is: merge the release PR. Nothing is
# versioned by hand, and nothing releases until somebody merges.
name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  # Called directly rather than left to the tag: a tag pushed with GITHUB_TOKEN
  # does not start another workflow run, so a `on: push: tags` release would
  # never fire for an automated release.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
