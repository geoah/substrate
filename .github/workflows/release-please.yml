# The release pull request, kept current after every merge to main, and the
# tag when it merges.
#
# A merge to main releases nothing on its own. release-please reads the
# conventional commits since the last tag and keeps ONE pull request open,
# `chore(release): vX.Y.Z`, whose branch holds the next CHANGELOG.md section
# and whose title holds the next version (`fix:` the patch, `feat:` the minor,
# a `!` or a BREAKING CHANGE footer the minor while below 1.0.0, from
# release-please-config.json). Every merge regenerates it. Merging it is the
# release: once the merge commit's own ci run on main is green, the run here
# finds the merged release pull request by its `autorelease: pending` label,
# tags its merge commit, creates the GitHub release with that section as its
# body, and calls release.yml to build and attach the artifacts.
# docs/releasing.md is the checklist a person runs before merging it.
#
# It runs on the push to main, which refreshes the pull request and never
# tags, and again after every green ci run on main, which may tag. The gate
# step below holds every push run, and holds a ci completion until the merged
# release pull request's own commit has a green push run of ci; that run's
# completion is what starts the run that cuts the release. release.yml checks
# the tagged commit's own ci run again before it builds, because a green run
# for a later commit is what brought us here.
#
# The token is a fine-grained personal access token (contents and pull
# requests, read and write, on this repository alone), stored as
# RELEASE_PLEASE_TOKEN. Not GITHUB_TOKEN: a pull request opened or pushed with
# the workflow token starts no workflow run of its own, so the release pull
# request would never get the checks the ruleset requires and could never be
# merged. The token has no bypass on the ruleset: main still moves only
# through a pull request that passed the checks.
name: release-please

on:
  # Refreshes the pull request and never tags: the gate holds every push run.
  push:
    branches: [main]
  # Cuts the release, once the merged release pull request's commit is green.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  # The same run by hand, for a main whose green ci run this workflow never
  # saw (a workflow_run event GitHub dropped, a run that failed after ci
  # passed). release-please is idempotent: an open pull request is refreshed,
  # a merged one is tagged if it was not, and a tagged one is left alone.
  workflow_dispatch:

concurrency:
  # ONE, for the whole repository, and never cancelled: two runs racing would
  # both try to push the release branch or the tag. GitHub still drops a
  # pending run when a third arrives. A dropped refresh is redone by the next
  # run. A dropped cut waits for the next green ci run on main, or a dispatch:
  # every run reads the pull requests, the tags and ci's runs afresh.
  group: release-please
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: release pull request
    # A push to main always runs, to refresh the pull request. A ci
    # completion counts only for a green push run: a red one gives the gate
    # nothing to pass, and ci runs on pull requests too and those runs arrive
    # here as well.
    # A dispatch counts only from main: from a branch it would call that
    # branch's copy of release.yml, gate included.
    if: >-
      github.event_name == 'push' || (github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main') || (github.event.workflow_run.event
      == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The gate below: merged release pull requests, and ci's runs.
      pull-requests: read
      actions: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: require RELEASE_PLEASE_TOKEN
        env:
          TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "RELEASE_PLEASE_TOKEN is not set; see the comment at the top of this workflow" >&2
            exit 1
          fi
      # For the gate's script. Nothing in this job pushes with git, so the
      # checkout keeps no credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Until the merged release pull request's own commit has a green push
      # run of ci on main, release-please creates no tag and no release; a
      # push run and a run that finds no release waiting always hold. The
      # script says why, and lint:ci holds its answers.
      - id: gate
        name: hold the release until its commit passed ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: .mise/releasegate.sh
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          skip-github-release: ${{ steps.gate.outputs.hold }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  # Called rather than left to the tag, and this call is release.yml's only
  # door. A tag pushed by a token starts no workflow of its own here, and an
  # `on: push: tags` release would build whatever commit a hand-pushed tag
  # names.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # Every permission release.yml's job asks for, because a called workflow
    # may not request one its caller did not grant, and GitHub refuses the
    # whole run at startup when it does. `actions: read` is the ci-run gate.
    permissions:
      contents: write
      packages: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      sha: ${{ needs.release-please.outputs.sha }}
