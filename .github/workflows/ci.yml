# Every push and every PR, as a set of jobs so a failure names itself.
#
# This file holds NO commands. Each job runs one `mise run ci:*` task, and
# those tasks are defined once in .mise.toml — so `mise run ci` on a laptop is
# the same pipeline, not an approximation of it. A check that passes locally
# and fails here would have to be a difference in the machine, never in the
# definition. Add a step to .mise.toml; this file does not change.
#
# Every third-party action is pinned to a COMMIT SHA with its version in a
# trailing comment. A tag is mutable and these jobs are the trust boundary of
# the whole repository, so a compromised `v4` would otherwise be a compromised
# release. The comment is what dependabot reads to keep them current, and it is
# also what proposes the major upgrades none of these are on yet.
#
# The database suite is cut for the runner, and gated. `changes` runs first
# and answers one question through .mise/changescheck.sh: does the diff touch
# anything a Go test reads? On a docs-only, console-only or linter-config PR
# the answer is no, and `go test` and the engine shards are skipped by their
# `if:`. A job skipped by `if:` reports a `skipped` conclusion, which GitHub
# counts as passing for a required check, so the merge gate is satisfied
# without a gate job of its own; a workflow-level `paths:` filter would never
# create the check at all and would leave a required one pending forever. A
# push to main runs everything.
#
# The engine package is 380 to 500 seconds on the runner on its own and has
# passed Go's 10 minute default under contention, so it runs as a matrix of
# shards, each `mise run ci:engine` with SHARD and SHARDS from the matrix.
# .mise/engineshard.sh cuts the package by test name (`go test -list`, sorted,
# round robin), so every test lands in exactly one shard and a new test lands
# in one without anybody editing a list. The `shard:` list under `engine` is
# the ONE place the count is written: `strategy.job-total` feeds SHARDS and the
# job name. Every other database package runs in `go test` after the short
# suite. The unsharded suite with its coverage profile is the `coverage` job,
# which runs on push to main only: a PR never waits on it, and main still
# keeps the artifact.
#
# The actions/cache steps below are the one thing that IS about the machine and
# so belongs here rather than in .mise.toml: a laptop keeps ~/.cache and
# ~/go/pkg/mod between runs and a runner does not. They restore those
# directories, nothing more — no job's behaviour depends on a hit. (The
# toolchain itself — go, node, pnpm, golangci-lint — is cached by
# jdx/mise-action, which does that by default.)
#
# Only the Go jobs carry one, and only because it was measured: lint 69s -> 18s,
# go test 369s -> 292s. The console job's pnpm store is NOT cached — see the
# note there. A cache that does not pay for its restore is a slower CI with
# extra moving parts, so measure cold against warm before adding another.
#
# Keys are per-job on purpose. A cache entry is immutable once written, so two
# jobs sharing one key means whichever finishes first wins and the other
# uploads nothing; the lint job's golangci-lint build cache and the test job's
# `go test` build cache are different working sets anyway. The engine shards
# are the one deliberate exception: they build the same test binary, so any
# shard's upload serves every other.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
          version: 2026.9.2
      # golangci-lint typechecks the module, so it wants the same module and
      # build caches `go test` does, plus its own analysis cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ runner.os }}-go-lint-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-lint-
      - run: mise run ci:lint

  cross:
    name: cross compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
          version: 2026.9.2
      # Its own key: this job's working set is four foreign GOARCHes, which the
      # test job's cache never holds and would only evict.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-cross-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-cross-
      - run: mise run ci:cross

  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.changes.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
          version: 2026.9.2
      # The script diffs against the merge base with the PR's base branch,
      # fetching the history the shallow checkout lacks, and writes `go=` to
      # $GITHUB_OUTPUT. On a push it answers true without diffing.
      - id: changes
        run: mise run ci:changes

  go:
    name: go test
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The database suites start their own pgvector container through
    # testcontainers when they have to, which is right on a laptop. On a runner
    # it is fragile — the container has died mid-suite, and every remaining case
    # then fails with `connection refused`, which reads like a code failure and
    # is not one. A service container is the runner's own job to keep alive, and
    # testdb picks it up through SUBSTRATE_TEST_DATABASE_URL. Same task, same
    # assertions; only the machine differs.
    #
    # Its stock 100 connections are not raised the way testdb raises its own
    # container's, because a service container takes no command: the suite runs
    # GOMAXPROCS tests at once holding ~4 connections each, which is ~16 on this
    # runner's four vCPUs. A LARGER runner would need that ceiling lifted, and
    # the failure says "too many clients already".
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: substrate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d substrate" --health-interval
          5s --health-timeout 5s --health-retries 20
    env:
      SUBSTRATE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/substrate?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
          version: 2026.9.2
      # ~/go/pkg/mod is the download cache (`go mod download`); ~/.cache/go-build
      # is the compiled-package cache, which is what makes the second half of
      # the suite cheap. mise does not relocate either — GOPATH and GOCACHE keep
      # their defaults under HOME.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-test-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-test-
      - run: mise run ci:go

  engine:
    name: engine ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Every shard reports: one red shard must not cancel the seven that
      # would have said which other tests failed.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    # The same service container as `go test`, for the same reason; one per
    # shard, because a shard is a runner of its own.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: substrate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d substrate" --health-interval
          5s --health-timeout 5s --health-retries 20
    env:
      SUBSTRATE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/substrate?sslmode=disable
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
          version: 2026.9.2
      # One key for every shard: they all build the one engine test binary, so
      # the first to finish uploads what the rest would have.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-engine-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-engine-
      - run: mise run ci:engine

  coverage:
    name: coverage
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: substrate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d substrate" --health-interval
          5s --health-timeout 5s --health-retries 20
    env:
      SUBSTRATE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/substrate?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
          version: 2026.9.2
      # Its own key: -covermode=atomic instruments every package, so the
      # objects `go test` and the shards cache are of no use here.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-coverage-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-coverage-
      - run: mise run ci:coverage
      # The profile, kept as an artifact rather than sent to a coverage
      # service. There is no threshold and no badge on purpose (see
      # `test:coverage` in .mise.toml): this is here so a reviewer asking "is
      # that new branch tested" can download the answer, not so a number can
      # fail a build. `if: always()` because a failing suite still produces a
      # profile, and that is exactly when it is wanted.
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: warn
          retention-days: 14

  race:
    name: race
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
          version: 2026.9.2
      # Its own key: -race builds a differently-instrumented object for every
      # package, so sharing the `go test` job's cache would only evict it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-race-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-race-
      - run: mise run ci:race

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The one job allowed to fail for a reason that is not in the diff: it asks
    # a vulnerability database what is known TODAY, so the same commit can be
    # green this morning and red this afternoon. That is the point of it, and
    # it is why it is not part of `lint`.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
          version: 2026.9.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-audit-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-audit-
      - run: mise run ci:audit

  console:
    name: console
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
          version: 2026.9.2
      # NO pnpm store cache here, deliberately — it was measured and it does not
      # pay. `pnpm install --frozen-lockfile` on a cold store is 4.5s (593
      # packages, a runner's network is very fast); restoring the 84 MB store
      # costs 2.9s and cuts the install to 1.8s. That is 4.7s against 4.5s, so
      # the cache is a wash at best, and it would spend 84 MB of the repo's
      # shared 10 GB cache budget competing for eviction against the Go caches
      # above, which save 51s and 77s. Re-measure before adding one back.
      - run: mise run ci:console

  image:
    name: image builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
          version: 2026.9.2
      - run: mise run ci:image
