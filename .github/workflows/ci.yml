# Every push and every PR, as five jobs so a failure names itself.
#
# This file holds NO commands. Each job runs one `mise run ci:*` task, and
# those tasks are defined once in .mise.toml — so `mise run ci` on a laptop is
# the same pipeline, not an approximation of it. A check that passes locally
# and fails here would have to be a difference in the machine, never in the
# definition. Add a step to .mise.toml; this file does not change.
#
# The actions/cache steps below are the one thing that IS about the machine and
# so belongs here rather than in .mise.toml: a laptop keeps ~/.cache and
# ~/go/pkg/mod between runs and a runner does not. They restore those
# directories, nothing more — no job's behaviour depends on a hit. (The
# toolchain itself — go, node, pnpm, golangci-lint — is cached by
# jdx/mise-action, which does that by default.)
#
# Only the Go jobs carry one, and only because it was measured: lint 69s -> 18s,
# go test 369s -> 292s. The console job's pnpm store is NOT cached — see the
# note there. A cache that does not pay for its restore is a slower CI with
# extra moving parts, so measure cold against warm before adding another.
#
# Keys are per-job on purpose. A cache entry is immutable once written, so two
# jobs sharing one key means whichever finishes first wins and the other
# uploads nothing; the lint job's golangci-lint build cache and the test job's
# `go test` build cache are different working sets anyway.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          experimental: true
      # golangci-lint typechecks the module, so it wants the same module and
      # build caches `go test` does, plus its own analysis cache.
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ runner.os }}-go-lint-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-lint-
      - run: mise run ci:lint

  cross:
    name: cross compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          experimental: true
      # Its own key: this job's working set is four foreign GOARCHes, which the
      # test job's cache never holds and would only evict.
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-cross-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-cross-
      - run: mise run ci:cross

  go:
    name: go test
    runs-on: ubuntu-latest
    # The database suites start their own pgvector container through
    # testcontainers when they have to, which is right on a laptop. On a runner
    # it is fragile — the container has died mid-suite, and every remaining case
    # then fails with `connection refused`, which reads like a code failure and
    # is not one. A service container is the runner's own job to keep alive, and
    # testdb picks it up through SUBSTRATE_TEST_DATABASE_URL. Same task, same
    # assertions; only the machine differs.
    #
    # Its stock 100 connections are not raised the way testdb raises its own
    # container's, because a service container takes no command: the suite runs
    # GOMAXPROCS tests at once holding ~4 connections each, which is ~16 on this
    # runner's four vCPUs. A LARGER runner would need that ceiling lifted, and
    # the failure says "too many clients already".
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: substrate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d substrate" --health-interval
          5s --health-timeout 5s --health-retries 20
    env:
      SUBSTRATE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/substrate?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          experimental: true
      # ~/go/pkg/mod is the download cache (`go mod download`); ~/.cache/go-build
      # is the compiled-package cache, which is what makes the second half of
      # the suite cheap. mise does not relocate either — GOPATH and GOCACHE keep
      # their defaults under HOME.
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-test-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-test-
      - run: mise run ci:go

  console:
    name: console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          experimental: true
      # NO pnpm store cache here, deliberately — it was measured and it does not
      # pay. `pnpm install --frozen-lockfile` on a cold store is 4.5s (593
      # packages, a runner's network is very fast); restoring the 84 MB store
      # costs 2.9s and cuts the install to 1.8s. That is 4.7s against 4.5s, so
      # the cache is a wash at best, and it would spend 84 MB of the repo's
      # shared 10 GB cache budget competing for eviction against the Go caches
      # above, which save 51s and 77s. Re-measure before adding one back.
      - run: mise run ci:console

  image:
    name: image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          experimental: true
      - run: mise run ci:image
