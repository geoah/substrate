  # (the Dockerfile's ARTIFACTS switch), so this is the boot a published image
  # gets before anybody pulls it.
  console-test:
    name: console test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
          version: 2026.9.2
          install_args: node pnpm
      # NO pnpm store cache here, deliberately — it was measured and it does not
      # pay. `pnpm install --frozen-lockfile` on a cold store is 4.5s (593
      # packages, a runner's network is very fast); restoring the 84 MB store
      # costs 2.9s and cuts the install to 1.8s. That is 4.7s against 4.5s, so
      # the cache is a wash at best, and it would spend 84 MB of the repo's
      # shared 10 GB cache budget competing for eviction against the Go caches
      # above, which save 51s and 77s. Re-measure before adding one back.
      - run: mise run ci:console:test

  # Builds the image from source and BOOTS it under compose.yaml, with fresh
  # volumes and a throwaway Postgres. The release ships the same runtime stage
