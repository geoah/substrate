# The live LLM suite (`mise run test:llm`) against the real OpenAI and
# Anthropic APIs, weekly on main and on dispatch. Never on a pull request.
#
# It holds provider keys and buys completions, so it is not a check: a pull
# request, a fork's above all, must not reach the keys, and a provider outage
# must not block a merge its diff did not cause. A failed run comments on ONE
# tracking issue (.mise/llmliveissue.sh) and the next passing run closes it.
#
# The keys are secrets of the `llm-live` environment, whose deployment branch
# rule admits main alone, and they are CI-only keys with a spend cap set at
# each provider. The suite adds its own ceilings per test binary: 24 requests
# and 20,000 tokens for the adapter cases, 14 requests and 20,000 tokens for
# the agent chain (docs/testing.md).
#
# Every action is pinned to a commit SHA, for the reasons ci.yml gives.
name: llm live

on:
  schedule:
    # Mondays at 06:43 UTC.
    - cron: "43 6 * * 1"
  workflow_dispatch:

# One run at a time and never cancelled: two runs would spend twice and race
# on the one tracking issue.
concurrency:
  group: llm-live
  cancel-in-progress: false

permissions:
  contents: read

env:
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  live:
    name: llm live
    # This repository's main alone: a dispatch from another branch and a
    # fork's schedule are skipped before the environment is asked for its
    # secrets. The environment's branch rule holds the same line on its own.
    if: github.repository == 'geoah/substrate' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: llm-live
    permissions:
      contents: read
      # The tracking issue.
      issues: write
    # The agent chain is a *_db_test.go and wants a database, as the engine
    # shards in ci.yml do; testdb reads the service container from
    # SUBSTRATE_TEST_DATABASE_URL.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: substrate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d substrate" --health-interval
          5s --health-timeout 5s --health-retries 20 --tmpfs /var/lib/postgresql/data:rw,size=3g
    env:
      SUBSTRATE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/substrate?sslmode=disable
      SUBSTRATE_TEST_DATABASE_DISPOSABLE: "true"
    steps:
      # Nothing here pushes, so the token is not left in .git/config where the
      # suite could read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.2
          install_args: go
      # The keys reach this step alone. go test's default 10 minute timeout
      # fails a hung case inside this step's 20, and the job's 30 leave the
      # tracking issue steps their turn: a job that times out is cancelled,
      # and a cancelled job runs no failure() step.
      - timeout-minutes: 20
        run: mise run ci:llm
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - if: failure()
        run: .mise/llmliveissue.sh failure
        env:
          GH_TOKEN: ${{ github.token }}
      - if: success()
        run: .mise/llmliveissue.sh success
        env:
          GH_TOKEN: ${{ github.token }}
