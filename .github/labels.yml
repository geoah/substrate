# The labels, as a file. labels.yml (the workflow) syncs the repository to
# exactly this set: anything missing is created, anything drifted is updated,
# and anything not named here is deleted, so an edit in the UI is drift the
# next run reverts.
#
# Three prefixes and no more: type/ is what it is (the issue forms assign
# these, and dependabot assigns type/dependencies), area/ is where it lands
# (labeler.yml assigns these on a pull request, from the paths it touches),
# priority/ is when (p0/p1/p2). GitHub's built-in close reasons carry
# duplicate/invalid/wontfix.

# ---- type: assigned by the issue forms ------------------------------------
- name: type/bug
  color: fecaca
  description: something behaves differently from what the code or the docs
    say
- name: type/feature
  color: bfdbfe
  description: something that should exist, or should work differently
- name: type/question
  color: e9d5ff
  description: something the docs did not answer
- name: type/dependencies
  color: d9f99d
  description: a dependency bump, from dependabot

# ---- area: where it lands --------------------------------------------------
- name: area/server
  color: ddd6fe
  description: "the server: API, engine, changelog"
- name: area/console
  color: ddd6fe
  description: the web console
- name: area/cli
  color: ddd6fe
  description: substratectl, both hats
- name: area/vocabulary
  color: ddd6fe
  description: "the vocabulary system: datatypes, the declaration dialect,
    the loader"
- name: area/agent
  color: ddd6fe
  description: "the agent runtime: threads, tools, decisions"
- name: area/docs
  color: ddd6fe
  description: the pages under docs/, and the README
- name: area/ci
  color: ddd6fe
  description: the build, the toolchain, the workflows

# ---- priority: when --------------------------------------------------------
- name: priority/p0
  color: fca5a5
  description: drop other work; this blocks people now
- name: priority/p1
  color: fed7aa
  description: the next batch of work
- name: priority/p2
  color: fef08a
  description: real, and it can wait

# ---- contributor signals: GitHub keys on these exact names -----------------
- name: good first issue
  color: 7057ff
  description: Good for newcomers
- name: help wanted
  color: "008672"
  description: Extra attention is needed
